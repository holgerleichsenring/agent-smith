# 2026-11-28-2c06: a design-turn project with private NuGet and npm feeds — its work clones stage their credentials before
# the model's restore, as a code run's sandbox does. The tokens are harness literals; nothing reaches a real feed.

agents:
  openai-default:
    type: openai
    api_key: dummy
    models:
      primary:
        model: gpt-4
        max_tokens: 4096

trackers:
  github-fixture:
    type: github
    url: https://github.com/agent-smith-fixtures/repo
    auth: gh_token

repos:
  design-feed-fixture:
    type: local
    path: ./Fixtures/CsharpFixture
    url: https://stub.test/design-feed-fixture
    auth: ""

projects:
  fixture-design-feed:
    agent: openai-default
    tracker: github-fixture
    repos: [design-feed-fixture]
    registries:
      - host: pkgs.dev.azure.com
        username: any
        token: harness-feed-token

secrets:
  gh_token: ${AGENTSMITH_TEST_AZDO_TOKEN}

skills:
  source: default
  version: v3.5.0
  cache_dir: /tmp/agentsmith-harness/skills

sandbox:
  agent_version: "0.0.0-harness"
