# 2026-11-28-d1ffa: the filing fixture with a private package feed — the series check stages its credentials before its
# verify master builds, as a code run does. The token is a harness literal; nothing reaches a real feed.

agents:
  openai-default:
    type: openai
    api_key: dummy
    models:
      primary:
        model: gpt-4
        max_tokens: 4096

trackers:
  github-filing:
    type: github
    url: https://github.com/agent-smith-fixtures/repo
    auth: gh_token
    needs_clarification_status: "Question"
    trigger_statuses: ["open"]
    done_status: "closed"

repos:
  filing-fixture:
    type: local
    path: ./Fixtures/CsharpFixture
    url: https://stub.test/filing-fixture
    auth: ""

projects:
  fixture-file:
    agent: openai-default
    tracker: github-filing
    repos: [filing-fixture]
    resolution: { tag: fixture-file }
    registries:
      - host: pkgs.dev.azure.com
        username: any
        token: harness-feed-token

secrets:
  gh_token: ${AGENTSMITH_TEST_AZDO_TOKEN}

skills:
  source: default
  version: v3.5.0
  cache_dir: /tmp/agentsmith-harness/skills

sandbox:
  agent_version: "0.0.0-harness"
