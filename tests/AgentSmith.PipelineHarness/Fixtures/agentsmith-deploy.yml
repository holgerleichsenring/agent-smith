    type: openai
    api_key: dummy
    models:
      primary:
        model: gpt-4
        max_tokens: 4096

trackers:
  github-fixture:
    type: github
    url: https://github.com/agent-smith-fixtures/repo
    auth: gh_token

repos:
  app:
    type: local
    path: ./Fixtures/CsharpFixture
    url: https://stub.test/app
    auth: ""
  delivery:
    type: local
    path: ./Fixtures/CsharpFixture
    url: https://stub.test/delivery
    auth: ""
  gitops:
    type: local
    path: ./Fixtures/CsharpFixture
    url: https://stub.test/gitops
    auth: ""

projects:
  fixture-deploy:
    agent: openai-default
    tracker: github-fixture
    repos: [app]
