name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOCKER_NAMESPACE: holgerleichsenring

# Serialise builds per ref so two pushes to main in quick succession (e.g. a
# feature merge immediately followed by the release-please merge) don't run two
# Docker builds concurrently against the SAME shared gha cache. That race
# corrupted a layer ref and failed the release build with
# ".next/standalone: not found" / "Unable to reserve cache ... another job may be
# creating this cache". cancel-in-progress: false → queue (never drop a main
# publish); different refs (PRs) still run in parallel.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Fetch skill catalog for tests
        env:
          SKILLS_VERSION: ${{ vars.SKILLS_VERSION || 'v2.1.2' }}
        run: |
          chmod +x tools/fetch-skills.sh
          tools/fetch-skills.sh ./test-skills

      - name: Test
        env:
          AGENTSMITH_TEST_SKILLS_DIR: ${{ github.workspace }}/test-skills
        # p0239b tier model — three tiers, one metered step:
        #   1. FAST (this step, every PR/CI): unit tests + the in-process
        #      PipelineHarness (Category=PipelineHarness, scripted LLM, fake
        #      clock, StubSandbox). Deterministic, no docker, no paid API.
        #   2. DOCKER (opt-in): the Tier=Docker harness classes self-gate on
        #      AGENTSMITH_HARNESS_DOCKER=1 + a reachable daemon; without it they
        #      emit a LOUD skip (DockerAvailability.CoverageNotExercised) — not
        #      filtered out, so the coverage gap stays visible in the CI log.
        #   3. REAL-MODEL (Category=LiveLLM, the ONLY metered step): a single
        #      model-fitness probe hitting a paid API (needs AZURE_OPENAI_API_KEY
        #      / OPENAI_API_KEY). Excluded here; run manually / on a schedule.
        run: dotnet test --no-build --verbosity normal --filter "Category!=LiveLLM"

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: agent-smith-cli
            dockerfile: src/backend/AgentSmith.Cli/Dockerfile
            publish: always
            platforms: linux/amd64,linux/arm64
          - image: agent-smith-server
            dockerfile: src/backend/AgentSmith.Server/Dockerfile
            publish: always
            platforms: linux/amd64,linux/arm64
          # Sandbox carrier image consumed by the server's spawner as an init-
          # container. Was originally gated to v* tags only (p0115) under the
          # assumption that release-please's tag pushes would re-trigger this
          # workflow — they don't (release-please uses GITHUB_TOKEN, and tag
          # pushes by GITHUB_TOKEN actions don't fire downstream workflows by
          # design). publish: always brings it into the same per-main-push
          # rhythm as cli + server, so every release-please squash-merge pushes
          # the matching sandbox-agent build to Docker Hub.
          - image: agent-smith-sandbox-agent
            dockerfile: src/backend/AgentSmith.Sandbox.Agent/Dockerfile
            publish: always
            platforms: linux/amd64,linux/arm64
          # p0235: the dashboard (Next.js) image. It used to live in a separate
          # dashboard.yml whose publish-image was gated `if: refs/tags/v*` — and
          # since release-please tags never fire workflows (see the note above),
          # the dashboard image was NEVER pushed. Folding it into this matrix
          # with publish: always puts it on the same per-main-push rhythm as the
          # others — and in the same run, where operators look for it.
          #
          # amd64-only: the Next.js `next build` does not complete under
          # QEMU-emulated arm64 (never reaches "Compiled successfully"), so
          # `.next/standalone` is never produced and the runtime-stage COPY
          # fails with "not found". The deploy target (AKS) is amd64, so arm64
          # buys nothing here — unlike the .NET legs, which build multi-arch
          # cleanly. Build this leg for linux/amd64 only.
          - image: agentsmith-dashboard
            dockerfile: src/dashboard/Dockerfile
            publish: always
            platforms: linux/amd64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD~1 to detect whether this commit changed version.txt
          # (= release-please squash merge), which is how we choose when to
          # apply semver tags. Without fetch-depth: 2 the diff fails.
          fetch-depth: 2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release-please's GITHUB_TOKEN-driven tag push does NOT trigger downstream
      # workflows by GitHub design — so type=semver patterns never expand here
      # (the workflow always fires on refs/heads/main, never on refs/tags/v*).
      # Instead: read version.txt that release-please commits with every release,
      # and apply semver-style tags only on the commit where version.txt changed.
      # Regular feature-PR squash merges leave version.txt untouched and only
      # refresh :latest.
      - name: Resolve release tags
        id: release_tags
        run: |
          VERSION=$(tr -d ' \n' < version.txt)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          if git diff --name-only HEAD~1 HEAD | grep -q "^version.txt$"; then
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION major_minor=$MAJOR_MINOR is_release=$IS_RELEASE"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.release_tags.outputs.version }},enable=${{ steps.release_tags.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.release_tags.outputs.major_minor }},enable=${{ steps.release_tags.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' && (matrix.publish == 'always' || (matrix.publish == 'tags' && startsWith(github.ref, 'refs/tags/v'))) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 2026-08-25-8c97: stamp the build into the image. Both values already existed
          # here and neither reached a container, because this step passed no build args at
          # all. The revision is the identity — version.txt moves on release commits only,
          # so ~93% of published images carry their predecessor's version string and two
          # genuinely different builds compare equal. The version rides along to be read.
          build-args: |
            AGENTSMITH_BUILD_REVISION=${{ github.sha }}
            AGENTSMITH_RELEASE_VERSION=${{ steps.release_tags.outputs.version }}
          # Scope the cache per image so the matrix legs (server / dashboard /
          # cli) don't read+write one shared gha cache key within a run — that
          # cross-image contention is the same race the concurrency group guards
          # across runs. Per-image scope also raises the cache hit-rate.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # 2026-10-01-283de: the browser sandbox image (Playwright Chromium + render.mjs), published
  # beside the carrier under the same tags. Each architecture builds on a NATIVE runner — no QEMU
  # leg, because a browser render under emulation proves nothing about the real one — and runs the
  # render fixture on the image it just built before anything is pushed. The two digests are then
  # joined into one multi-arch tag by browser-image-manifest.
  browser-image:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve release version
        id: release_tags
        run: echo "version=$(tr -d ' \n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build for the fixture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/sandbox-images/browser/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: agentsmith-browser:fixture
          build-args: |
            AGENTSMITH_BUILD_REVISION=${{ github.sha }}
            AGENTSMITH_RELEASE_VERSION=${{ steps.release_tags.outputs.version }}
          cache-from: type=gha,scope=agent-smith-sandbox-browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-smith-sandbox-browser-${{ matrix.arch }}

      # A module script and a root-relative stylesheet render from the local origin; 127.0.0.1:6379,
      # a name resolving to 10.0.0.1, IPv6 / IPv4-mapped / 0.0.0.0 literals and a loopback websocket
      # are refused by the egress proxy; no service worker becomes active; a 6000 px page yields a
      # JPEG under 700 KB with a 1568 px long edge.
      - name: Render fixture
        run: |
          docker run --rm --add-host internal.test:10.0.0.1 \
            -v "${{ github.workspace }}/src/sandbox-images/browser/fixture:/fixture:ro" \
            agentsmith-browser:fixture node /fixture/check.mjs

      # 2026-10-01-283di: compare_reference — a 900 px and a 1400 px page compare in one invocation,
      # the shorter padded with magenta and the pad counted as mismatch; styles per selector pair.
      - name: Compare fixture
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/src/sandbox-images/browser/fixture:/fixture:ro" \
            agentsmith-browser:fixture node /fixture/compare-check.mjs

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/sandbox-images/browser/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.DOCKER_NAMESPACE }}/agent-smith-sandbox-browser,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            AGENTSMITH_BUILD_REVISION=${{ github.sha }}
            AGENTSMITH_RELEASE_VERSION=${{ steps.release_tags.outputs.version }}
          cache-from: type=gha,scope=agent-smith-sandbox-browser-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-browser-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  browser-image-manifest:
    needs: browser-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-browser-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same tag rule as the matrix above: latest on main, the release version and its
      # major.minor only on the commit that changed version.txt — so the browser image always
      # carries the carrier's tag, which is what BrowserImageResolver pulls.
      - name: Resolve release tags
        id: release_tags
        run: |
          VERSION=$(tr -d ' \n' < version.txt)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          if git diff --name-only HEAD~1 HEAD | grep -q "^version.txt$"; then
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/agent-smith-sandbox-browser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.release_tags.outputs.version }},enable=${{ steps.release_tags.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.release_tags.outputs.major_minor }},enable=${{ steps.release_tags.outputs.is_release == 'true' }}

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tags" ]; then echo "no tag applies to this ref; nothing to publish"; exit 0; fi
          docker buildx imagetools create $tags $(printf '${{ env.DOCKER_NAMESPACE }}/agent-smith-sandbox-browser@sha256:%s ' *)

  update-dockerhub-description:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Update agent-smith description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_NAMESPACE }}/agent-smith-cli
          readme-filepath: deploy/DOCKERHUB_DESCRIPTION.md

      - name: Update server description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_NAMESPACE }}/agent-smith-server
          readme-filepath: deploy/DOCKERHUB_DESCRIPTION.md
