name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            binary: agent-smith-linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            binary: agent-smith-linux-arm64
          - rid: osx-x64
            os: macos-latest
            binary: agent-smith-osx-x64
          - rid: osx-arm64
            os: macos-latest
            binary: agent-smith-osx-arm64
          - rid: win-x64
            os: windows-latest
            binary: agent-smith-win-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >-
          dotnet publish src/backend/AgentSmith.Cli -c Release
          -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv ./publish/AgentSmith.Cli ./publish/${{ matrix.binary }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv ./publish/AgentSmith.Cli.exe ./publish/${{ matrix.binary }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./publish/${{ matrix.binary }} --clobber
        shell: bash

  # 2026-11-02-2b26g: the binary a reader downloads runs `demo` from an empty directory with a real key.
  # It runs after the upload, so a red run is a fix-forward signal, not a held release.
  demo-smoke:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Key present
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not set as a repository secret — the demo smoke did not run"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Download the published binary
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ needs.release-please.outputs.tag_name }} -p agent-smith-linux-x64 -D "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/agent-smith-linux-x64"

      - name: Demo from an empty directory
        if: steps.key.outputs.present == 'true'
        run: .github/scripts/demo-smoke.sh "$RUNNER_TEMP/bin/agent-smith-linux-x64"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-log
          path: ${{ runner.temp }}/demo.log
