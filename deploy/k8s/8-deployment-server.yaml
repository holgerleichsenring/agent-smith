apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsmith-server
  namespace: agentsmith
  labels:
    app: agentsmith-server
    app.kubernetes.io/name: agentsmith-server
    app.kubernetes.io/component: server
spec:
  replicas: 1                      # prod: 2
  selector:
    matchLabels:
      app: agentsmith-server
  template:
    metadata:
      labels:
        app: agentsmith-server
    spec:
      serviceAccountName: agentsmith
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # p0246g: apply relational-persistence migrations BEFORE the server starts —
      # an init container runs to completion first (NOT a sidecar). It shares the
      # persistence volume, so it migrates the in-pod SQLite the server then reads
      # (you can't reach that file from outside the pod). For an external DB
      # (Postgres/SQLServer) this same container migrates over the connection
      # string, or run your own idempotent-SQL pipeline instead.
      initContainers:
        - name: migrate
          image: holgerleichsenring/agent-smith-cli:0.129.0
          imagePullPolicy: IfNotPresent
          # p0348: call the DLL directly. The image ENTRYPOINT is a gosu
          # privilege-drop shim (docker-entrypoint.sh); under this pod's hardened
          # securityContext (runAsNonRoot/runAsUser 1000) gosu cannot drop
          # privileges, and there is no `agentsmith` executable on PATH — the k8s
          # `command:` overrides the ENTRYPOINT, so the shim never runs anyway.
          command: ["dotnet", "AgentSmith.Cli.dll", "database", "migrate", "--config", "/app/config/agentsmith.yml"]
          # For an external DB whose connection string uses ${db_password},
          # uncomment so the placeholder resolves during migration:
          # env:
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: agentsmith-secrets
          #         key: db-password
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: persistence
              mountPath: /var/lib/agentsmith
      containers:
        - name: server
          image: holgerleichsenring/agent-smith-server:0.129.0
          imagePullPolicy: IfNotPresent  # prod: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8081"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: redis-url
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: slack-signing-secret
            # p0506: the webhook shared secrets. optional:true is load-bearing — a
            # secretKeyRef to a key the Secret does not carry gives
            # CreateContainerConfigError and the pod never starts, so an operator
            # upgrading with an older Secret must not be stopped by these.
            # An absent value simply leaves that platform unverified, as before.
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: github-webhook-secret
                  optional: true
            - name: GITLAB_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: gitlab-webhook-token
                  optional: true
            - name: AZDO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: azdo-webhook-secret
                  optional: true
            # Jira's secret is referenced from the configuration as
            # ${JIRA_WEBHOOK_SECRET} (3-configmap.yaml), so the value has to reach
            # the process the same way the other three do.
            - name: JIRA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: jira-webhook-secret
                  optional: true
            # p0503b: the token authority. optional:true for the same reason the
            # webhook secrets carry it — a secretKeyRef to a key the Secret does not
            # have gives CreateContainerConfigError and the pod never starts, so an
            # operator upgrading with an older Secret must not be stopped by these.
            # No authority means nothing authenticates, as before this phase.
            - name: AGENTSMITH_AUTH_AUTHORITY
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-authority
                  optional: true
            - name: AGENTSMITH_AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-audience
                  optional: true
            - name: AGENTSMITH_AUTH_ENFORCE
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-enforce
                  optional: true
            # p0503d: the claim names role resolution reads, and the admin grant
            # that keeps a wrong mapping from locking every human out. optional:true
            # for the same reason as above — an older Secret must not stop the pod.
            - name: AGENTSMITH_AUTH_ROLE_CLAIM
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-role-claim
                  optional: true
            - name: AGENTSMITH_AUTH_GROUP_CLAIM
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-group-claim
                  optional: true
            - name: AGENTSMITH_AUTH_NAME_CLAIM
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: auth-name-claim
                  optional: true
            - name: AGENTSMITH_ADMIN_GRANT
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: admin-grant
                  optional: true
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTSMITH_IMAGE
              value: "holgerleichsenring/agent-smith-cli:0.129.0"
            - name: IMAGE_PULL_POLICY
              value: "IfNotPresent"      # prod: Always
            - name: K8S_SECRET_NAME
              value: "agentsmith-secrets"
            - name: AGENTSMITH_SKILLS_DIR
              value: "/var/lib/agentsmith/skills"
            # p0332: honest orchestrator sizing. The spawned orchestrator pod runs
            # the LLM loop — it compiles nothing — so the build-sandbox default
            # (1Gi request / 4Gi limit) is absurd for it, and it is the
            # longest-lived pod of every run. Requests are what a requests-based
            # ResourceQuota counts and what the scheduler packs nodes by; the
            # limit stays as a pure OOM guard. See docs/host-it/kubernetes.md
            # ("Capacity quota") for the coordinated quota shape.
            - name: JobSpawner__Resources__CpuRequest
              value: "100m"
            - name: JobSpawner__Resources__CpuLimit
              value: "500m"
            - name: JobSpawner__Resources__MemoryRequest
              value: "512Mi"
            - name: JobSpawner__Resources__MemoryLimit
              value: "2Gi"
            # For an external DB whose connection string uses ${db_password},
            # uncomment (mirrors the migrate init container above):
            # - name: DB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: agentsmith-secrets
            #       key: db-password
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: skills-cache
              mountPath: /var/lib/agentsmith/skills
            - name: persistence
              mountPath: /var/lib/agentsmith
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"              # prod: 200m
              memory: "512Mi"          # the orchestrator floor — the startup preflight WARNs below this
            limits:
              cpu: "500m"              # prod: 1000m
              memory: "1Gi"            # prod: up to 1.5Gi — an under-provisioned limit OOMKills the server,
                                       # which reaps in-flight runs and orphans their sandbox pods
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap:
            name: agentsmith-config
        - name: skills-cache
          emptyDir:
            sizeLimit: 64Mi
        # p0246g/p0349: holds the SQLite system-of-record (the init container
        # migrates it, the server reads it). Since p0349 this DB is ALSO where
        # the operator's CONFIGURATION lives (everything entered in the Config
        # Studio or seeded via `agentsmith config import`) — an emptyDir here
        # would wipe that configuration and all run history on EVERY pod
        # restart. Do not downgrade this to emptyDir. Alternative: point
        # persistence.connection_string at an external Postgres/SQLServer.
        - name: persistence
          persistentVolumeClaim:
            claimName: agentsmith-persistence   # 12-pvc-persistence.yaml
      restartPolicy: Always
