# Agent Smith - Kubernetes Secret Template
#
# DO NOT commit this file with real values.
# Copy, fill in your values, and apply:
#
#   cp deploy/k8s/4-secret-template.yaml my-secrets.yaml
#   # Edit my-secrets.yaml with your real tokens
#   kubectl apply -f my-secrets.yaml
#
# For production, consider:
#   - Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
#   - External Secrets Operator (https://external-secrets.io)
#   - HashiCorp Vault

apiVersion: v1
kind: Secret
metadata:
  name: agentsmith-secrets
  namespace: agentsmith
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # --- AI Providers ---
  anthropic-api-key: ""          # sk-ant-api03-...
  openai-api-key: ""             # sk-...
  azure-openai-api-key: ""       # Azure OpenAI resource key
  gemini-api-key: ""             # AIza...
  groq-api-key: ""               # gsk_...

  # --- Source Control & Ticket Systems ---
  github-token: ""               # ghp_...  (scopes: repo, issues)
  azure-devops-token: ""         # PAT (scopes: Code R/W, Work Items R/W)
  gitlab-token: ""               # glpat-... (scopes: api, write_repository)
  jira-token: ""                 # Jira API token (Cloud) or PAT (Server)
  jira-email: ""                 # Email associated with the Jira API token
  jira-webhook-secret: ""        # HMAC secret for Jira webhook signature verification

  # --- Webhook shared secrets (p0506) ---
  # Set the same value on the platform's webhook. Once set, an UNSIGNED delivery
  # for that platform is refused; leave a key empty and that platform stays open.
  github-webhook-secret: ""      # GitHub webhook secret (X-Hub-Signature-256)
  gitlab-webhook-token: ""       # GitLab secret token (X-Gitlab-Token)
  azdo-webhook-secret: ""        # Azure DevOps service-hook basic-auth password

  # --- Token authority (p0503b) ---
  # The one OIDC issuer a bearer token is validated against, and the switch that
  # lets the permission each route declares refuse a caller. Leave the authority
  # empty and nothing authenticates. Set it with auth-enforce empty or "false" and
  # a presented token is validated while no route is refused — the state to prepare
  # an authority in before anyone can be locked out.
  auth-authority: ""             # e.g. https://login.example.com/realms/agentsmith
  auth-audience: ""              # the audience claim tokens for this server carry
  auth-enforce: ""               # "true" to let a missing permission refuse

  # --- Roles (p0503d) ---
  # The identity provider decides WHO holds a role; the auth block in the ConfigMap
  # decides what a role MEANS. These name the claims to read it out of. admin-grant
  # is the way back in while the mapping is still being worked out: a comma-separated
  # list of "group:<value>" / "sub:<value>", matched only against the claim it names.
  auth-role-claim: ""            # default "roles"
  auth-group-claim: ""           # default "groups"
  auth-name-claim: ""            # default "sub"; try preferred_username or upn
  admin-grant: ""                # e.g. sub:00000000-0000-0000-0000-000000000000

  # --- Chat Platforms ---
  slack-bot-token: ""            # xoxb-...  (Bot User OAuth Token)
  slack-signing-secret: ""       # Found in: Basic Information → App Credentials
  teams-bot-id: ""               # Microsoft App ID (from Bot Framework registration)
  teams-bot-password: ""         # Microsoft App Password

  # --- Infrastructure ---
  redis-url: "redis://redis:6379"  # Redis connection string inside the cluster
  # 2026-09-04-102b: the system-of-record database, taken TOGETHER or not at all —
  # the provider decides how the connection string is parsed, so one without the other
  # is refused with a startup finding and the ConfigMap's block keeps running. Both
  # empty = the sqlite default in 3-configmap.yaml, which is what an installation that
  # has not moved to an external DB wants.
  db-provider: ""                # sqlite | postgresql | mysql | sqlserver
  db-connection: ""              # the full connection string, credential included
