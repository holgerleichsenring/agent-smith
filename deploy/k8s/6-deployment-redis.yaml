apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agentsmith
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # 2026-10-25-c1bf: a password is used when the Secret has one, and Redis starts as
          # before when it does not, so applying this file never takes Redis down. Without a
          # password the per-job sandbox users protect nothing; the server says so at startup.
          command: ["sh", "-c"]
          args:
            - >-
              if [ -n "$REDIS_PASSWORD" ]; then set -- --requirepass "$REDIS_PASSWORD"; fi;
              exec redis-server "$@"
              --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: redis-password
                  optional: true
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            exec:
              # redis-cli authenticates only when a password is set.
              command: ["sh", "-c", 'if [ -n "$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi']
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            exec:
              # redis-cli authenticates only when a password is set.
              command: ["sh", "-c", 'if [ -n "$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
