apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agentsmith
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: message-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # 2026-10-25-c5a7e: a password is required. Each sandbox reaches Redis as its own
          # ACL user, which protects nothing while the default user needs no password. The
          # guard refuses an empty value, which would otherwise start Redis open.
          command: ["sh", "-c"]
          args:
            - >-
              test -n "$REDIS_PASSWORD" &&
              exec redis-server --requirepass "$REDIS_PASSWORD"
              --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: redis-password
                  optional: false
            # redis-cli reads its password from here, so the probes below authenticate.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: agentsmith-secrets
                  key: redis-password
                  optional: false
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
