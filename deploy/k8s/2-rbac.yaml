apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentsmith
  namespace: agentsmith
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentsmith-job-manager
  namespace: agentsmith
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: rbac
rules:
  # ISandbox Kubernetes backend (p0116) — Server creates ephemeral Sandbox-Pods
  # per pipeline run and communicates with the Agent over Redis. NO pods/exec
  # is required.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  # p0269a: capacity-aware admission reads the namespace ResourceQuota (hard vs
  # used) before claiming a run, so a full namespace queues the next run instead
  # of spawn -> Forbidden -> fail. Read-only.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentsmith-job-manager
  namespace: agentsmith
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: agentsmith
    namespace: agentsmith
roleRef:
  kind: Role
  name: agentsmith-job-manager
  apiGroup: rbac.authorization.k8s.io
---
# 2026-10-25-c5a7c: the same grants in the sandbox namespace, where the server creates its
# sandbox pods (K8S_SANDBOX_NAMESPACE). The Role above stays, so a deployment that has not
# set the variable yet keeps creating pods in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentsmith-sandbox-manager
  namespace: agentsmith-sandboxes
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: rbac
rules:
  # ISandbox Kubernetes backend (p0116) — Server creates ephemeral Sandbox-Pods
  # per pipeline run and communicates with the Agent over Redis. NO pods/exec
  # is required.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  # p0269a: capacity-aware admission reads the namespace ResourceQuota (hard vs
  # used) before claiming a run, so a full namespace queues the next run instead
  # of spawn -> Forbidden -> fail. Read-only.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentsmith-sandbox-manager
  namespace: agentsmith-sandboxes
  labels:
    app.kubernetes.io/name: agentsmith
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: agentsmith
    namespace: agentsmith
roleRef:
  kind: Role
  name: agentsmith-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
