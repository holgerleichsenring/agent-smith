# yaml-language-server: $schema=agentsmith.schema.json
#
# Agent Smith — Example Configuration (p0139 catalog-first schema)
#
# ── p0349: what the SERVER reads from this file ─────────────────────────
# At BOOT the server reads ONLY `persistence:`, `secrets:`, `auth:` and
# `tool_runner:` from this file (the bootstrap slice) — those four are never
# stored in the database. Everything else in this document is the IMPORT/EXPORT
# format for
#   agentsmith config import <yaml>    # seed an empty DB (guarded; --force)
#   agentsmith config export           # DB -> YAML, for backup/DR
# and is edited in the Config Studio (dashboard). The one-shot CLI pipelines
# still read the full file directly.
# ────────────────────────────────────────────────────────────────────────
#
# Top-level catalogs (`agents:`, `repos:`, `trackers:`, `pipeline_triggers:`)
# are defined once. Each project under `projects:` references catalog entries
# by name and adds its own trigger blocks.
#
# The loader ignores a key it does not know, so an old file keeps loading. That
# makes agentsmith.schema.json (line 1) the place a misspelt key is caught: an
# editor that validates against it reports the typo, and `agentsmith config import`
# names every key it did not store.
#
# Supported providers (canonical YAML values are snake_case):
#   - AI agents: claude | openai | azure_openai | gemini | ollama | copilot | external_worker
#                (anthropic and google are aliases of claude and gemini; openai with an
#                endpoint talks to any OpenAI-compatible server)
#   - Repos:     github | gitlab | azure_devops | local
#   - Trackers:  github | gitlab | azure_devops | jira

# --- Deployment image pin (required by the ORCHESTRATOR image) ---
# p0281c: ONE registry + version feeds BOTH the orchestrator container and the
# sandbox-agent image — they ship from the same agent-smith release, so there is
# one knob to bump per upgrade instead of two kept in sync. The legacy per-image
# blocks (`sandbox: { agent_version }` / `orchestrator: { registry, version }`)
# still load and win field-by-field when present.
#
# 2026-08-25-0d01: the SANDBOX-AGENT half no longer needs this. Left unset there,
# its tag is DERIVED from the release the running server is, so the two cannot
# drift apart by being forgotten. Setting it here (or in `sandbox.agent_version`)
# still pins it deliberately — the server then reports the difference as an
# advisory finding and refuses nothing. The orchestrator image has no derived
# default and still needs a version, from here or from `orchestrator.version`.
deployment:
  registry: holgerleichsenring
  version: 0.129.0

# --- Per-language toolchain images (p0245) ---
# Override the built-in language→image table per language, for one project, without
# touching code. The whole-project `toolchain_image` (if set) still wins outright;
# this is the polyglot-safe hook (pin `dotnet` to an internal mirror while `node`
# keeps the default). Operator-declared image — no runtime install, no version guess.
#
# projects:
#   my-polyglot-app:
#     sandbox:
#       images:
#         dotnet: my-mirror.azurecr.io/dotnet/sdk:9.0
#         node:   node:20-bookworm

# --- Per-project sandbox credentials (p0272, K8s only) ---
# Inject credentials into the sandbox pod from operator-created k8s Secrets. The
# VALUES live in the Secret (never in this file or context.yaml); only the
# references are sent to the pod. The consuming auth command lives in the repo's
# .agentsmith/contexts/<name>/context.yaml `prerequisites` as an `sh -c "…"` line, e.g. a
# Salesforce JWT login. Create the Secret first:
#   kubectl create secret generic sf-creds \
#     --from-literal=client-id=... --from-literal=username=... \
#     --from-file=jwt-key=server.key
#
# projects:
#   my-salesforce-app:
#     sandbox:
#       toolchain_image: my-corp.azurecr.io/sfdx:20-bookworm   # node + sf + git
#       secrets:
#         env:
#           SF_CLIENT_ID: "sf-creds:client-id"
#           SF_USERNAME:  "sf-creds:username"
#         files:
#           - mount: "/secrets/server.key"
#             secret: "sf-creds"
#             key: "jwt-key"
# .agentsmith/contexts/<name>/context.yaml prerequisites (in the repo, not here):
#   prerequisites: 'sh -c "sf org login jwt --client-id $SF_CLIENT_ID --jwt-key-file /secrets/server.key --username $SF_USERNAME --alias devhub"'

# --- What TYPE of work item a filing creates (2026-09-18-b4f0) ---
# agent-smith files tickets in four ROLES. Without this map every provider sends its own
# default — "Task" for Azure DevOps, "Task" for Jira — whatever your board calls things.
# That matters beyond naming: a lifecycle status you configure elsewhere must be a state
# the chosen TYPE actually has, or the run cannot move the ticket at its end and the
# ticket is refused on every later attempt until the configuration changes.
# The role is a property of the call site, never of the conversation — you cannot ask the
# assistant for a User Story; you set it here.
# trackers:
#   my-tracker:
#     work_item_kinds:
#       work: User Story     # an approved cut's one work ticket
#       phase: User Story    # a single phase filed from a design turn
#       bug: Bug             # a bug payload
#       chat: Task           # "create a ticket" from chat

# --- How long a design conversation keeps its sandbox (2026-09-22-2d11a) ---
# A "work it out" turn reads the repository through a source-scope sandbox. Holding it
# between turns is what stops the next turn cloning again. Default 180 seconds, so this
# block is normally unnecessary; 0 holds nothing. It governs the DESIGN DIALOG ONLY — a
# pipeline run's sandboxes are transient by design and go when the run ends.
# sandbox:
#   hold_seconds: 180
# Per project, which wins over the global value:
# projects:
#   my-project:
#     sandbox:
#       hold_seconds: 600

# --- Sandbox image pull credential (2026-08-31-46d7, K8s only) ---
# Names of operator-created Kubernetes image pull secrets the sandbox pod references,
# so a toolchain image that only exists in a credentialed registry (the only place a
# licensed third-party tool may live) is pullable. Rendered at POD level, so it covers
# the agent-loader init container as well as the toolchain container. GLOBAL, never
# per-project: a project that could name its own credential would be widening a
# boundary it does not own. Create the secret in the sandbox namespace first:
#   kubectl create secret docker-registry acr-pull \
#     --docker-server=my-corp.azurecr.io --docker-username=... --docker-password=...
# The names are declared, not verified: agent-smith holds no read access to the
# namespace's secrets, and a name matching no Secret is silently ignored by kubelet.
# The Docker backend has no equivalent and fails a pull with a message saying so.
#
# sandbox:
#   image_pull_secrets:
#     - acr-pull

# (Orchestrator + sandbox images both come from the `deployment:` pin above. To
# override just one — e.g. pin a pre-release orchestrator — add the legacy block:
#   orchestrator:
#     registry: my-mirror
#     version: 0.49.0-beta
# A per-project orchestrator.registry/version is ignored (p0281c); orchestrator
# resources stay per-project.)

# --- Relational system-of-record (SERVER only; the CLI one-shot runs ignore it) ---
# The server always uses a DB (run history + the single-run constraint) + Redis.
# Apply migrations with `agentsmith database migrate` (an init-container / one-shot
# job in your deployment) BEFORE starting the server — never on startup.
# These are the defaults; uncomment to override. SQLite needs no service; for a
# shared/HA deployment point it at Postgres/MySQL/SQL Server. The credential is part
# of the connection string — a ${name} placeholder inside it is expanded by NOTHING,
# because this block is read before the secrets map exists. To keep the credential out
# of this file, set AGENTSMITH_PERSISTENCE_PROVIDER + AGENTSMITH_PERSISTENCE_CONNECTION:
# set together they replace this whole block, and one without the other is refused.
persistence:
  provider: sqlite                                  # sqlite | postgresql | mysql | sqlserver
  connection_string: "Data Source=/var/lib/agentsmith/agentsmith.db"
  # provider: postgresql
  # connection_string: "Host=postgres;Database=agentsmith;Username=agentsmith;Password=…"
  # provider: sqlserver
  # connection_string: "Server=mssql,1433;Database=agentsmith;User Id=agentsmith;Password=…;Encrypt=True;TrustServerCertificate=True"

# --- Who may call this server (SERVER only; bootstrap, never stored in the DB) ---
# One OIDC authority validates every bearer token presented to the server. Every
# route declares the permission a caller needs; `enforce` decides whether a missing
# one refuses. Leave the block out entirely and nothing authenticates, which is what
# every installation did before this existed.
#
# The environment wins over this file, per field:
#   AGENTSMITH_AUTH_AUTHORITY / AGENTSMITH_AUTH_AUDIENCE / AGENTSMITH_AUTH_ENFORCE
#   AGENTSMITH_AUTH_ROLE_CLAIM / AGENTSMITH_AUTH_GROUP_CLAIM / AGENTSMITH_AUTH_NAME_CLAIM
#
# Set an authority with enforce false first: tokens are validated, nothing is refused,
# and you find out whether your issuer works before anyone can be locked out.
#
# WHO holds a role is decided at the identity provider — an app-role assignment or a
# group membership — and, in addition, on the dashboard's Access -> Permissions page
# (People), where an administrator can grant one person a role against their claim.
# WHAT a role means is decided in the role mapping.
#
# A directory that nests its roles (realm roles under realm_access.roles) cannot be read
# by a flat claim name at all; map its groups instead. AGENTSMITH_ADMIN_GRANT is the way
# back in while none of this is configured yet — see .env.example.
# auth:
#   authority: https://login.example.com/realms/agentsmith
#   audience: agent-smith
#   enforce: false
#   name_claim: sub                   # what names a caller on the identity page + audit trail
#
#   # 2026-08-25-1806: the four keys below are the migration SEED, not what runs. What a
#   # role MEANS is application configuration — it changes when a team does — so it lives
#   # in the config store and is edited on Access -> Permissions (/config/access), applying
#   # without a restart. An installation that still declares them here has them imported ONCE, on
#   # the first boot after the upgrade; after that the store is the only answer.
#   role_claim: roles                 # the claim carrying role NAMES, read verbatim
#   group_claim: groups               # the claim carrying group values, mapped below
#   group_roles:                      # group value -> the roles it grants (union across groups)
#     "00000000-0000-0000-0000-000000000000":
#       - operator
#     platform-admins:                # a group PATH's leading slash is normalised away
#       - admin
#   roles:                            # roles this installation adds to the built-in three
#     config-viewer:                  # additive: a built-in name is never replaced. A permission
#       - config.read                 # outside the catalog is refused on the Access page; from
#                                     # this seed it is dropped with a startup finding, never granted

# ────────────────────────────────────────────────────────────────────────
#  Agents catalog
# ────────────────────────────────────────────────────────────────────────
# Each named entry is the full AgentConfig that projects can reference by name.
# Same agent reused across projects → defined once, edited once.
#
# `models:` routes each role (primary, scout, planning, reasoning, summarization,
# context_generation, code_map_generation) to its own model. No role has a built-in
# model: an unset primary is the agent's own `model`, every other unset role is
# primary (code_map_generation is scout, then primary), with primary's max_tokens.
# Name a role only to send it somewhere else — a cheaper scout, say.
agents:
  claude-default:
    type: claude
    model: claude-sonnet-4-20250514
    retry:
      max_retries: 5
      initial_delay_ms: 2000
      backoff_multiplier: 2.0
      max_delay_ms: 60000
    cache:
      is_enabled: true
      strategy: automatic
    compaction:
      is_enabled: true
      max_context_tokens: 200000
      keep_recent_iterations: 3          # compaction summarizes with the summarization role
    models:
      scout:
        model: claude-haiku-4-5-20251001
        max_tokens: 4096
      primary:
        model: claude-sonnet-4-20250514
        max_tokens: 8192
      planning:
        model: claude-sonnet-4-20250514
        max_tokens: 4096
      summarization:
        model: claude-haiku-4-5-20251001
        max_tokens: 2048
    pricing:
      models:
        claude-sonnet-4-20250514:
          input_per_million: 3.0
          output_per_million: 15.0
          cache_read_per_million: 0.30
        claude-haiku-4-5-20251001:
          input_per_million: 1.0
          output_per_million: 5.0
          cache_read_per_million: 0.10

  # GitHub Copilot (2026-09-07-d5f2). Answers on an operator's Copilot seat instead of a
  # per-provider API key. Three things differ from the providers above and none of them are
  # defaults you can leave alone:
  #   * api_key_secret names the env var holding a PERSON's token — Copilot rejects org-owned
  #     PATs, so two seats mean two agents naming two variables.
  #   * the Copilot CLI runtime is NOT downloaded by the build; the image places it and
  #     COPILOT_CLI_PATH points at it.
  #   * pricing below is an OPERATOR-DECLARED PROXY. A seat is billed in premium requests, not
  #     per token, so a flat-rate seat is honestly entered as zero and the run's cost cap is
  #     approximate for this agent. The provider's own meter travels to the run trace beside it.
  #   * every role is served, tool-bearing ones included: the runtime is told the tools by
  #     declaration only and hands each call back, so the loop — approval policy, sandbox routing,
  #     event publishing — stays agent-smith's (2026-09-23-4722a, proven live in 2026-09-25-6b2e).
  # copilot-seat:
  #   type: copilot
  #   model: gpt-5                     # every role inherits it; no models: block needed
  #   api_key_secret: COPILOT_GITHUB_TOKEN
  #   pricing:
  #     models:
  #       gpt-5:
  #         input_per_million: 0.0
  #         output_per_million: 0.0

  # A second Claude agent — the api-security project below runs on it. It names only
  # primary and planning, so scout and summarization inherit primary (and its max_tokens).
  claude-scan:
    type: claude
    model: claude-sonnet-4-20250514
    cache:
      is_enabled: true
      strategy: automatic
    models:
      primary:
        model: claude-sonnet-4-20250514
        max_tokens: 8192
      planning:
        model: claude-sonnet-4-20250514
        max_tokens: 4096
    pricing:
      models:
        claude-sonnet-4-20250514:
          input_per_million: 3.0
          output_per_million: 15.0
          cache_read_per_million: 0.30

  # azure-openai-default:
  #   type: azure_openai
  #   endpoint: https://your-instance.openai.azure.com
  #   api_version: 2025-01-01-preview
  #   api_key_secret: AZURE_OPENAI_API_KEY   # the env var holding the key
  #   # scout and summarization are unset, so they run on primary's deployment.
  #   models:
  #     primary:
  #       model: gpt-4.1
  #       deployment: gpt4-1-deployment
  #       max_tokens: 8192
  #     planning:
  #       model: gpt-4.1-mini
  #       deployment: gpt-4o-mini-deployment
  #       max_tokens: 4096

  # gemini-default:
  #   type: gemini
  #   model: gemini-2.5-pro              # every role runs on it

  # An OpenAI-COMPATIBLE server (vLLM, LM Studio, an internal gateway): type openai plus
  # the server's endpoint. The key comes only from the variable api_key_secret names —
  # never from OPENAI_API_KEY, so an OpenAI key is not sent to someone else's host; with
  # no api_key_secret, no real key is sent. Declare rate_limit and context_window_tokens
  # when the server's differ from OpenAI's, and pricing for a model the built-in table
  # does not know.
  # local-llm:
  #   type: openai
  #   endpoint: http://vllm.internal:8000/v1
  #   model: qwen2.5-coder-32b
  #   api_key_secret: LOCAL_LLM_KEY
  #   rate_limit:
  #     requests_per_minute: 60
  #     input_tokens_per_minute: 200000
  #   models:
  #     primary:
  #       model: qwen2.5-coder-32b
  #       context_window_tokens: 32768

# ────────────────────────────────────────────────────────────────────────
#  Connections catalog (p0281a)
# ────────────────────────────────────────────────────────────────────────
# A connection holds the shared host/org/auth ONCE. Repos are DISCOVERED under it
# via the provider API, so a project selects them by glob instead of listing each
# repo block. azure_devops needs organization+project; github needs owner; gitlab
# needs group. A project then references repos as `connection/glob` (with `!` to
# exclude), e.g.:
#
#   projects:
#     acme-platform:
#       agent: claude-default
#       tracker: acme-ado
#       repos: ["acme/Sample.App.*", "!acme/Sample.App.Ui.Tests"]   # discovered + globbed
#       resolution: { area_path: AcmeMain/Platform }
#
# default_branch comes from each discovered repo; the connection value is only a
# fallback. Discovery is refreshed out-of-band (warm-on-start + interval) and the
# last-good set is cached, so a transient outage serves the previous result.
connections:
  acme:
    type: azure_devops
    organization: acme
    project: platform
    auth: azure_devops_token
  acme-github:
    type: github
    owner: acme
    auth: github_token

# ────────────────────────────────────────────────────────────────────────
#  Repos catalog (legacy / escape hatch for a single non-discoverable repo)
# ────────────────────────────────────────────────────────────────────────
repos:
  acme-app:
    type: github
    url: https://github.com/owner/acme-app
    auth: github_token
    # default_branch: main

  acme-platform:
    type: azure_devops
    url: https://dev.azure.com/acme/platform/_git/platform-core
    organization: acme
    project: platform
    auth: azure_devops_token

  acme-rules-shared:
    type: gitlab
    url: https://gitlab.com/acme/rules-shared
    auth: gitlab_token

  acme-rules-billing:
    type: gitlab
    url: https://gitlab.com/acme/rules-billing
    auth: gitlab_token

  # Local repo for dev / api-security passive mode.
  api-source-local:
    type: local
    path: ./repo
    auth: none

# ────────────────────────────────────────────────────────────────────────
#  Trackers catalog
# ────────────────────────────────────────────────────────────────────────
# Connection + lifecycle states shared across projects that point at the same
# tracker install. Project-specific routing (which labels → which pipelines)
# stays on the project's trigger block.
trackers:
  acme-github:
    type: github
    url: https://github.com/owner/acme-app
    auth: github_token
    # p0318/p0391: where a run parks when it needs an answer from you (a too-thin
    # ticket, or a question the master raises mid-run). It must sit OUTSIDE
    # trigger_statuses — you moving the ticket back into one IS the re-trigger.
    # REQUIRED for any project that runs a pipeline able to park (code,
    # spec-dialog): without it the server reports a blocking finding and leaves
    # that trigger disabled, because a park with nowhere to go leaves the ticket
    # claimable and the run repeats forever.
    needs_clarification_status: "Question"

  acme-ado:
    type: azure_devops
    url: https://dev.azure.com/acme
    organization: acme
    project: platform
    auth: azure_devops_token
    # p0281b: the tracker OWNS the run workflow shared by every project routed to it.
    # A project then declares only its `resolution:` and inherits these. open_states
    # doubles as the trigger gate (trigger_statuses falls back to it when unset), so
    # there is nothing to repeat here.
    open_states: ["New", "Active"]
    done_status: "Resolved"
    failed_status: "Resolved"
    needs_clarification_status: "Question"   # p0318/p0391 — see acme-github above
    pipeline_from_label:
      bug: code
      security: security-scan

  acme-jira:
    type: jira
    url: https://acme.atlassian.net/
    auth: jira_token
    open_states: ["To Do", "In Progress"]
    done_status: "In Review"
    needs_clarification_status: "Blocked"    # p0318/p0391 — see acme-github above
    close_transition_name: "Done"
    # Optional: override Jira REST paths when Atlassian changes an API (e.g.
    # CHANGE-2046 removed /rest/api/3/search → /rest/api/3/search/jql). Defaults
    # shown; set only what differs — a key left out keeps its default. '{id}' is
    # replaced with the issue key.
    # endpoints:
    #   search:      /rest/api/3/search/jql
    #   issue:       /rest/api/3/issue/{id}
    #   comment:     /rest/api/3/issue/{id}/comment
    #   transitions: /rest/api/3/issue/{id}/transitions
    #   create:      /rest/api/3/issue

# ────────────────────────────────────────────────────────────────────────
#  Global pipeline_triggers — label → pipeline default
# ────────────────────────────────────────────────────────────────────────
# Applied when a project's trigger block omits `pipeline_from_label`.
# A populated project-level map wins over this global default.
# p0393: ONE `code` pipeline ships all code changes. 2026-09-25-e5b1 deleted the
# four former names it had been aliased from — a configuration still carrying one
# names a pipeline that does not exist, and the server says so at startup.
pipeline_triggers:
  agent-smith:init: init-project
  bug: code
  feature: code
  security-review: security-scan
  api-security-review: api-security-scan

# ────────────────────────────────────────────────────────────────────────
#  Projects
# ────────────────────────────────────────────────────────────────────────
projects:

  # Single-repo GitHub project — uses the global pipeline_triggers map.
  acme-app:
    agent: claude-default
    tracker: acme-github
    repos: [acme-app]
    pipeline: code
    coding_principles_path: .agentsmith/contexts/default/principles.md
    # Per-pipeline overrides. Each entry: name + optional agent / skills_path /
    # coding_principles_path.
    # pipelines:
    #   - name: security-scan
    #     agent: claude-scan
    github_trigger:
      project_resolution:
        # p0140a: GitHub single-repo dispatch — match by the source-repo URL on the
        # webhook payload against the project's single repo. Requires
        # repos: [acme-app] (count == 1) — the validator enforces it.
        strategy: repo
        value: https://github.com/acme/app.git
      trigger_statuses: ["open"]
      done_status: "closed"
      comment_keyword: "@agent-smith"
      # 2026-09-25-d83b: the label someone puts on a PULL REQUEST to ask for a review.
      # Omitted → only "security-review" triggers, as it always has; a word set here is
      # recognised in ADDITION to it, so a board already labelled keeps working.
      # pr_trigger_label: "please-review"
      # pipeline_from_label omitted → inherits global pipeline_triggers map

  # Azure DevOps project, terse shape (p0281b): only `resolution:` is project-specific —
  # trigger_statuses / done_status / failed_status / pipeline_from_label all come from the
  # acme-ado tracker. The trigger TYPE is inferred from the tracker (azure_devops). The
  # `resolution` key IS the strategy: tag | area_path | repo | to_address. area_path is a
  # hierarchical prefix match — AcmeMain/Platform also matches AcmeMain/Platform/Provisioning;
  # the backslash form is equivalent (the loader normalises).
  # (An explicit `azuredevops_trigger:` block still works and overrides field-by-field; use it
  # when you need a per-project comment_keyword or a different label map.)
  acme-platform:
    agent: claude-default
    tracker: acme-ado
    repos: [acme-platform]
    pipeline: code
    polling:
      enabled: true
      interval_seconds: 60
      jitter_percent: 10
    resolution:
      area_path: AcmeMain/Platform
    # p0461: the one workflow field the tracker does not own — where a ticket goes when
    # its PARKED run RESUMES. It is the counterpart of needs_clarification_status and,
    # like it, must sit OUTSIDE trigger_statuses (open_states above), or the poller
    # claims the ticket again while the resumed run holds it. Unset, the ticket stays in
    # the status it parked in, so the board goes on reading "waiting for you" over a run
    # that is already working again — the resume says so in the log rather than guessing.
    # azuredevops_trigger:
    #   in_progress_status: "Active"     # with open_states: ["New"] on the tracker

  # Multi-repo Jira project — one ticket's run works across every repo in the list.
  acme-rules:
    agent: claude-default
    tracker: acme-jira
    repos: [acme-rules-shared, acme-rules-billing]
    pipeline: code
    jira_trigger:
      project_resolution:
        # p0140a: Jira tag dispatch — a ticket carrying the label "acme-rules"
        # routes to this project. Case-insensitive equality. Ambiguous tickets
        # (a ticket with two project tags) spawn one pipeline run per matched
        # project per p0140's documented "let the LLM skip irrelevant ones" rule.
        strategy: tag
        value: acme-rules
      assignee_name: "Agent Smith"
      secret: ${JIRA_WEBHOOK_SECRET}
      trigger_statuses: ["To Do"]
      done_status: "In Review"
      comment_keyword: "@agent-smith"

  # api-security project (p0102) — local source enables code-aware skills;
  # remote clone via repos: [acme-app] also works.
  # A webhook/poll-triggered api-security project. For a one-off CLI scan you do NOT
  # need a project at all (p0281d): `agentsmith api-scan --agent claude-scan
  # --source-path . --swagger ... --target ...` builds an ephemeral project from the
  # named agent + the source path. --project still works for back-compat.
  api-security:
    agent: claude-scan
    tracker: acme-github
    repos: [api-source-local]
    pipeline: api-security-scan

# How a run waits for a person, and where that person answers it.
# This deployment's dashboard address: a ticket comment that asks a question links
# to the run's page here, so the reader is not left with the tracker as their only
# guess. There is deliberately no default — only you know your own address, and a
# guessed one printed into a work item is a broken link, so unset means no link at all.
# dialogue:
#   dashboard_url: https://agentsmith.example.com

# Tool runner for security scanning tools (Nuclei, Spectral). Bootstrap, like auth:
# the server reads it from this file at start; it is never stored or imported.
tool_runner:
  type: auto
  images:
    nuclei: projectdiscovery/nuclei:latest
    spectral: stoplight/spectral:6

# Skill catalog source. The server ships with the catalog EMBEDDED in the
# image — the skills release it was built and tested with — so normally you need no
# skills block at all. Set source/version only to OVERRIDE the embedded catalog: an
# airgap mirror pin, or catalog development against a local checkout (source: path).
# A pin OLDER than the embedded release downgrades every skill. See
# docs/reference/configuration/skills.md.
# skills:
#   source: default
#   version: v5.7.3
#   # cache_dir defaults to $XDG_CACHE_HOME/agentsmith/skills, then ~/.cache/agentsmith/skills.
#   cache_dir: /var/lib/agentsmith/skills

# Hard limits for the per-skill agentic loop.
limits:
  max_tool_calls_per_skill: 30
  max_tool_calls_per_investigator: 10
  max_tool_calls_per_verifier: 20
  max_llm_calls_per_skill: 15
  max_input_tokens_per_skill_call: 200000
  max_output_tokens_per_skill_call: 16000
  max_seconds_per_skill_call: 300
  max_concurrent_skill_calls: 10
  # Sub-agent limits. Every run's master gets spawn_agents while
  # max_sub_agents_per_run is above 0; set it to 0 to take fan-out away.
  max_concurrent_sub_agents: 4
  max_sub_agents_per_run: 20
  # 2026-09-22-5891: a design turn is a run of its own, so it fans out under its own
  # count rather than the run-wide one above. 0 takes spawn_agents off the design surface.
  max_sub_agents_per_dialog_turn: 4
  # The ceiling a dialog child's own loop runs under — a child gets no governor hooks, so
  # this times the count above is what bounds one turn's fan-out.
  max_dialog_sub_agent_loop_iterations: 20

# Per-run cost cap. When cumulative USD or tokens cross the cap, the remaining
# model calls short-circuit with a `cost-cap-exhausted` observation and the run
# delivers what it has. Defaults shown. per_tier (defaults $1 / $2 / $8 / $25 for
# Trivial / Small / Medium / Large) is the ceiling a run's estimated size may RAISE
# its cap to — never lower it. See docs/reference/configuration/pipeline-cost-cap.md.
pipeline_cost_cap:
  default:
    usd: 5
    tokens: 500000
  # per_pipeline:
  #   api-security-scan:
  #     usd: 10
  #     tokens: 1000000
  #   code:
  #     usd: 2
  #     tokens: 200000
  # per_tier:
  #   Large:
  #     usd: 40
  #     tokens: 8000000

# In-flight pipeline-storage settings.
pipeline_storage:
  redis_ttl_hours: 4

# p0128c data-flow gating.
pipeline_data_flow:
  enforce: false

secrets:
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  github_token: ${GITHUB_TOKEN}
  gitlab_token: ${GITLAB_TOKEN}
  azure_devops_token: ${AZURE_DEVOPS_TOKEN}
  jira_token: ${JIRA_TOKEN}
  jira_webhook_secret: ${JIRA_WEBHOOK_SECRET}
