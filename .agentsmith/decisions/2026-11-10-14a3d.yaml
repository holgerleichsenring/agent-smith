# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-10-14a3d

decisions:
  - category: Architecture
    chose: "Visual means an upload holding an .html page, a design source, a design system, or a mock already in the conversation"
    over: "Offering render, compare and the mock tools to every design turn"
    reason: "A turn on a source upload carried four tools with nothing to point them at. An upload whose file list the turn does not know counts as visual, so the tools are never withheld for want of a listing."
  - category: Implementation
    chose: "write_mock and read_mock stay on every design turn, with the mock guidance in their descriptions; only render_reference and compare_reference (and design_read, as before) depend on visual material"
    over: "Gating the mock tools with render and compare (this spec's first commit)"
    reason: "Operator correction, 2026-11-10: a person can ask for a mock in any design conversation with nothing to compare against; gating it was a regression of 8762r. A mock already written still counts as visual for render and compare."
  - category: Implementation
    chose: "The grounding reads each repository's memory index, and recall and dispute_memory join a design turn only when one exists"
    over: "Offering them blind, or not at all"
    reason: "The design turn never loaded the index, so recall was offered with nothing to recall against. Reading MEMORY.md remotely is one more file beside the principles."
  - category: Implementation
    chose: "withdraw_filed_ticket is seeded only when the conversation's latest outcome holds a filing; a failed read offers it"
    over: "Seeding it on every turn"
    reason: "The tool can only refuse in a conversation that filed nothing; a read that fails keeps the old behaviour rather than hiding a way out."
