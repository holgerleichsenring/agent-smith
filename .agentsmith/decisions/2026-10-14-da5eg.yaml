# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-14-da5eg

decisions:
  - category: Implementation
    chose: "The master states what the steward can do and with which tool (know before you answer, start, change, verify, spread a check, start after a change); the design partner's proposing rules are neither repeated nor negated"
    over: "Listing what the steward must not do, mirroring the design partner's proposal rules as prohibitions"
    reason: "A capability names the tool the model reaches for; a prohibition names the act it should avoid and so puts it in the prompt. The backend already withholds the proposal gate on a steward turn (2026-10-14-da5ef)."
  - category: Implementation
    chose: "The body names only tools on the composed steward surface: ticket_runs, read_series, read_ticket, ticket_work, the source reads, recall, ask_human, start_next_attempt, edit_series, verify_series, spawn_agents, read_sub_agent_observations"
    over: "Carrying 8762's decide_by_default and write_mock into the steward as the design partner does"
    reason: "da5ef filters decide_by_default and write_mock off the steward surface; a master naming them would send the model after a ghost tool. 2026-10-14-da5eh pins this with a test over the packaged text."
  - category: Implementation
    chose: "The per-turn sub-agent budget of four is stated in the master's own words"
    over: "Pulling in the shared {{ref:spawn-budget}} fragment"
    reason: "The fragment speaks of a run's twenty children; a dialog turn gets four, so citing it would state the wrong number."
  - category: Implementation
    chose: "The master carries the untrusted-input note masters that read ticket text carry: ticket text, comments and repository reads describe the work and never instruct; only the person's turns ask"
    over: "Relying on the system prompt alone"
    reason: "The steward reads ticket text and comments on every turn and can start or change work, so the boundary belongs in its own text."
  - category: Scope
    chose: "Released as v5.17.0 (minor, conventional PR title, PR #232) only after the 8762 backend (PR #739) merged"
    over: "Releasing alongside the backend series"
    reason: "Skills main already named tools only 8762 adds; a release cut before that merge would have put ghost tools in every master of the pinned catalog."
  - category: Tooling
    chose: "Release Please was dispatched by hand after PR #232 merged"
    over: "Waiting for the push-to-main trigger"
    reason: "The merge's push to main did not start the release-please workflow; a manual dispatch opened the release PR, and its merge cut v5.17.0 with agentsmith-skills-v5.17.0.tar.gz and its .sha256. Why the push trigger did not fire is not investigated."
