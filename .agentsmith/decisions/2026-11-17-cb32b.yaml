# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-17-cb32b

decisions:
  - category: Implementation
    chose: "A Claude Code worker process gets CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1, set through ExternalWorkerCliOptions.Environment wherever the isolation arguments go"
    over: "DISABLE_NON_ESSENTIAL_MODEL_CALLS=1, or leaving the CLI's defaults"
    reason: "Every worker call in the replay of 2026-11-17 reported a second model, claude-haiku-4-5, fed the whole stdin uncached (inputTokens near the stdin size, 15 to 24 output tokens): 385 calls, $13.51 of $167.13. One sonnet call on a 3,000-word input: 11,897 haiku input tokens by default and with DISABLE_NON_ESSENTIAL_MODEL_CALLS=1, none with CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1. Five-call haiku probe of one growing conversation: $0.166 before, $0.092 after. Through the real runner (the 11-call folding loop of 2026-11-17-cb32a): one model in every call's modelUsage, $0.160 against $0.310. The switch also turns off telemetry, error reporting and the update check, which a server-run worker does not use. A plain binary gets nothing: only Claude Code reads it."
  - category: Scope
    chose: "Resumable CLI sessions (--resume <id> with only the new messages on stdin) are not built"
    over: "Building them with a fallback to the full history when the session is missing"
    reason: "They save no tokens. The API is stateless: a resumed call re-sends the session's transcript, so it reads the same prefix from cache and writes the same new part as the blocks d6f5 sends. Haiku probe, five calls of one conversation, side request off: full history as blocks $0.0922 (writes about 5.3k per call), resume $0.0915 by per-call difference (writes about 5.5k, the CLI's own assistant turn with its thinking). With the side request on, resume looked cheaper ($0.089 against $0.166) only because the side request then saw just the new message; this spec removes that request. What resume would cost: (1) the session file lives per machine and per working directory (~/.claude/projects/<cwd>/<id>.jsonl), so a run that moves to another replica or pod, or resumes after a restart, finds none ('No conversation found with session ID', reported in the result's errors) and needs a second call with the full history; (2) our compactor rewrites the history at each fold, so a session would have to restart per fold, and the CLI may auto-compact a long session on its own, out of step with our view and pin; (3) the session id is derived from the system part and the first two blocks, so concurrent sub-agents with one opening share it, harmless without persistence and a shared transcript with it; a per-conversation id needs state the chat client does not have, since one client serves many conversations; (4) a resumed call's total_cost_usd and modelUsage are the session's running totals (observed 0.0368, 0.0496, 0.0623 ...), so per-call cost (166ab) would need the previous call's figures, across processes. Equal cost, four new failure modes: not simple, so not built."
