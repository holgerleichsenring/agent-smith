# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-10-18cf

decisions:
  - category: Architecture
    chose: "A design turn's review has no wall-time rule and no budget share; only the run's cost cap and a cancel stop it, and rounds run up to spec_review.rounds per draft until each stops"
    over: "Keeping the share with a floor, measuring the share from the review's start, or a per-turn wall-time ceiling"
    reason: "Operator decision, 2026-11-10: time measures nothing about a review's quality, and a spec handed out unreviewed is worse than a slow turn. The share kept money and time for the build after a coding run's review, but a design turn builds nothing after it. Live, a 7-child epic's turn reached its review at about 1017 s of 1800 s, past the 40 % share, and six children were listed not reviewed. The run's cost cap is the operator's money, so it stays."
  - category: Implementation
    chose: "ProposalRoundGate is deleted; a cost-cap check on ProposalReviewSession admits drafts"
    over: "Hollowing the gate out to one check"
    reason: "Only the proposal loop and its revision used the gate. What remains is one check of the cost tracker the session already reaches. The session also loses its clock and its last-round duration, which only the ceiling read."
  - category: Scope
    chose: "The coding run's review keeps its share for now; dropping it there is a planned successor"
    over: "Dropping it in both places in this spec"
    reason: "A spec the coding run's review does not clear is not built. It moves to the next attempt, so it is never handed out unreviewed. The case is weaker there, and it is a separate change."
  - category: Scope
    chose: "The run watchdog is left to its own spec, 2026-11-10-e706"
    over: "Exempting design turns from max_run_wall_time_seconds here"
    reason: "Each design turn is its own pipeline run, and PipelineRunWatchdog cancels it at the ceiling. That cancel ends the whole turn, and the proposal then reads as not reviewed with the under-review reason. Whether design turns may be exempted depends on whether something else detects a hung turn, and that is e706's question."
  - category: Architecture
    chose: "A draft counts as reviewed only when a taken answer attacked its current text. Every other draft is listed not reviewed with a reason: the cost cap, no reviewer answered, a revision after the final round, or still under review when published"
    over: "Treating a stopped draft as reviewed whatever stopped it"
    reason: "An independent review of PR #805 found older paths that let a draft through unattacked. In one, both reviewers failed, so the result was neither taken nor blind and the draft stopped with no hold. In another, a draft was rewritten after a last-round refuse and stayed open, but the summary listed only flagged drafts. A cancelled turn left its drafts with no reason. The operator's rule is that a draft is either attacked or held with a visible reason."
  - category: Implementation
    chose: "A draft with no taken answer stays open, so the next round tries again. It counts as unanswered only when the turn holds a repository"
    over: "Holding it at once, or marking it in the panel"
    reason: "A timeout or a 429 is often transient, and rounds remain to retry. A turn with no repository has nothing to read. 9631b already decided that such a turn does not hold the proposal, and the attack reviewer returns null there too. The repository check tells the two apart without changing the reviewer's contract."
  - category: Implementation
    chose: "Round findings over a text that a later rewrite replaced are not shown on an open draft"
    over: "Showing the last round's findings regardless"
    reason: "Those findings judged the replaced text. The card would show them over the rewrite. Stopped drafts keep them as before."
  - category: Architecture
    chose: "Unreadable or invalid spec_review settings review with the defaults; with rounds off, a failed whole-set call holds every draft"
    over: "Holding every proposal while the settings are broken"
    reason: "A broken block must never give a proposal less than a full review. Holding instead would block every proposal until the block is fixed. Rounds set to 0 is the operator's own choice of one plain review, and when that call fails, nothing was checked."
  - category: Implementation
    chose: "The gate writes its stop reason on the draft, and the finding is worded from it"
    over: "One fixed sentence"
    reason: "The fixed sentence always blamed the share, even when the cost cap stopped the review. The gate is the only place that knows the reason."
  - category: Architecture
    chose: "A draft counts as having waited unread only when the revised proposal holds its unread finding"
    over: "Any listing in NotReviewed"
    reason: "Before this, a draft the budget or a cancel left waiting was never read. If that draft was then blind on the next turn, approval was released at once, with no further try at reading. The blind exit is for a repository that cannot be read. A draft that never got its first try must hold for one more turn, like any other blind draft. Matching the stored finding text fails safe: if that text ever changes, the result is one extra held turn, never an early approval."
  - category: Scope
    chose: "The series contract round drops the share and the ceiling too"
    over: "Leaving it as it was"
    reason: "It is part of the same design-turn review and had the same share gate, so a late epic lost its series check the same way."
  - category: Scope
    chose: "No new dashboard element and no new activity line"
    over: "A reason line in the turn's activity"
    reason: "The not-reviewed finding with its reason already renders on the proposal, in the dialog card and in the ticket view, with the amber mark. The reviewing activity kind carries no detail in the UI. A cancelled turn keeps 2026-11-09-9a98's view."
  - category: Process
    chose: "The spec was reviewed against the code by the implementer, not by a fresh subagent"
    over: "A fresh adversarial reviewer"
    reason: "The implementing agent was a worker fork that may not spawn subagents."
