# yaml-language-server: $schema=../decision.schema.json
phase: 2026-09-28-c59a

decisions:
  - category: Scope
    chose: "Minted anew as p0304's successor; p0304 itself is not edited"
    reason: "Operator ruling 2026-09-28: spec the named follow-ups now, each under its own id."

  - category: Architecture
    chose: "Only open and deny, each fixed for the sandbox's lifetime"
    over: "setup-only with a switch after EnsurePrerequisites"
    reason: |
      Review refuted the switch. Phase commits, CommitAndPR, PrCrossLink and PersistWorkBranch all
      push from the sandbox after setup (PipelinePresets.Parking.cs:54; GitBranchPusher.cs:47-51;
      PipelinePresets.Code.cs:67-68; CommandNames.Pipeline.cs:173-174). ProbeTarget follows
      EnsurePrerequisites, and dotnet restores during the agent phase. A mode fixed at creation also
      reaches sandboxes a switch would miss: those created mid-run, on resume or for a source scope.
      setup-only needs domain-level egress through p0304's proxy tier.
    alternatives:
      - "Keep the git host allowed across the switch: hosted git services publish no stable CIDR set"

  - category: Implementation
    chose: "Create the policy after the pod (its uid feeds the ownerReference), delete the pod if the policy fails, leave blockOwnerDeletion unset"
    reason: "Between the two creates, a pod labelled egress=deny matches only the narrower Redis+DNS rule. Setting blockOwnerDeletion would need pods/finalizers rights the RBAC does not grant."

  - category: TradeOff
    chose: "Resolve the mode per project; name the pipeline axis but do not build it"
    over: "p0304's per-pipeline modes"
    reason: "SandboxSpecBuilder already takes the pipeline name (SandboxSpecBuilder.cs:39-41), so the axis can be added later without a new seam. Nobody has asked for it yet."
