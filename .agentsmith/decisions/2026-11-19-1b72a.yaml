spec: 2026-11-19-1b72a
decisions:
  - chosen: "Paused is a SeriesRunStates value that counts as active (the sweep beats it, the conversation's messages reach the master); the record keeps PausedFrom so a resume returns to running or verifying."
    alternatives: "A Paused flag beside the state; pausing only a running series."
    why: "One place to read, as the spec decided; PausedFrom keeps a pause during the series check from restarting the check on resume."
  - chosen: "The hold lives in RequiresUnmetGate with its own typed reason (ClaimRejectionReason.SeriesPaused, sentence RequiresUnmetGate.SeriesPaused), read through UnmetTicketRequirements.PausedSeriesAsync (optional series store, like the green reader)."
    alternatives: "A new ClaimRejectionReason SeriesPaused; a separate gate in ClaimRefusal; checking the pause at each start door."
    why: "Every code claim — poller, webhook, wake, capacity pump, a person's start — already passes this gate, so one check holds them all; reusing the refusal kind adds no outcome kind (no second path). The wake (RequirementsMetStart) also stays silent while paused, so a woken ticket is not moved into a trigger status it then cannot be claimed from."
  - chosen: "Operator intent ('halt an' so they can be present): the pause holds every new ticket (the claim gate, for a ticket with no earlier attempt, the claim's own reserved run excluded as BoundaryStopGate reads it) and the automatic CI fix (CiReworkAct answers no act for a ticket of a paused series); a retry or rework a person asks for passes. Resume sends one Sweep nudge per red CI so the loop reads the act again. The pause line and the master prompt say so."
    alternatives: "Hold every new code run of a member ticket; hold only new tickets and let CI fixes run on."
    why: "Review: a held person's retry or rework had nowhere to come back from and was lost, while an automatic CI fix running behind the operator's back is exactly what the pause is for. The CI act is re-derived from the pull-request records, so withholding it while paused loses nothing once resume asks again."
  - chosen: "Button and words are one act: SeriesPause (Application) behind the master's pause_series / resume_series and behind POST /api/spec-dialog/{dialogId}/series/{pause|resume} (dialog.write + runs.control)."
    alternatives: "The button posts the words into the conversation for the master to read."
    why: "Posting words waits for the next sweep and an LLM call, costs master budget, and does nothing once dialogue.series_master_budget_usd is spent — a Pause button that may not pause. One service behind both callers is no second path; it writes only the series record and says one line in the conversation."
  - chosen: "Stop now cancels the runs under way through RunControlEndpoints.CancelAsync (SeriesRunCancel resolves its services when a cancel is asked)."
    alternatives: "Mark the run rows directly; a series-own cancel."
    why: "The existing cancel persists the flag, removes queued runs and finalizes the ticket; a second cancel would drift."
  - chosen: "One start for a ticket that waited: WaitingTicketStart, lifted out of RequirementsMetStart and used by both the wake and a resume (ISeriesTicketActs.StartIfReadyAsync) — hand-marked or closed (TicketStartHold), another paused series, unmet requirements via ForStartAsync (on_green_push counts), incomplete filing, start-by-name edges, the tracker's closed state; then the 'start' run and the claim through ReworkFallbackSpawn. The resume line names only what started."
    alternatives: "Judge readiness in SeriesPause from landings; a resume-only start beside the wake's."
    why: "Review: a resume that only tagged/moved left a ticket already in its trigger status unclaimed in webhook mode, and skipped the closed/hand-marked holds; two copies of 'may this waiting ticket start' would drift."
  - chosen: "A pause during the series check holds check_series; a check launched while a pause was pressed keeps the pause (PausedFrom = verifying); a verdict that arrives while paused ends the series from PausedFrom."
    alternatives: "Let check_series overwrite Paused with Verifying."
    why: "Review: the check would silently lift the pause, and a verdict during the pause never ended the series."
  - chosen: "A conversation with a pane is decided by the target (ISeriesConversation.HasPaneAsync = DialogTarget.IsDashboard). There the series posts the opening (pane wording), its own said lines, the master's line and SeriesNeedsYou lines (failed, question, PR waits for a manual merge; a failure is left to the master's line when it speaks that beat) — no table; Slack/Teams keep the table. The pane's policy line drops 'status every N min'."
    alternatives: "A config switch; dropping the table everywhere."
    why: "The spec scopes chat platforms out and says decided by the target, not a setting."
  - chosen: "Under a pane every beat counts as reported (LastStatusAt = now), so the cadence still beats every dialogue.series_status_minutes for the master's stall check without posting."
    alternatives: "Keep LastStatusAt for spoken beats only."
    why: "A quiet beat would otherwise leave the cadence due on every sweep and start a beat each scan."
  - chosen: "The Series pane lists every ticket as SeriesTableRow (key, title, state, kind, cost, time) in place of the Now list; SeriesNowRow is removed. The pane refetches with the filed work's run nudges as well as with messages."
    alternatives: "Keep Now beside the full list; poll on a timer."
    why: "Now duplicated a subset of the rows; with the table gone from the conversation, the message count is no longer a clock, and the filed-work watch already nudges on every run change of the series' tickets."
  - chosen: "SeriesRunRepository's Active set includes Paused on purpose: a paused series is still found for its conversation (the divert sends the operator's words to the master, so 'weiter' is read), and the sweep keeps beating it."
    alternatives: "Keep Active as running/verifying and read paused series separately."
    why: "A paused series that drops out of the active reads could never hear its resume in words."
  - chosen: "A queued start the capacity pump finds held by a pause is dropped as before but marked RunEndKinds.SeriesPaused (CapacityQueueDrop.RefusedAsync); DbPreviousAttemptReader passes over that run, so the ticket stays never-worked, the gate keeps holding it and the resume starts it again."
    alternatives: "Keep the head in the queue while paused; restart dropped tickets by reading the run summary."
    why: "Review: the unmarked drop cancelled the reserved run and resume then skipped the ticket as worked. Keeping the head would wedge the strict FIFO for every other project behind a paused series; the summary is text, the end kind is the recorded reason."
  - chosen: "WaitingTicketStart holds a ticket already under way — an attempt, a queued code run (HasQueuedAsync) or a live lease, as DependentsWake reads it — and the master's start_ticket asks the same (UnderWayAsync)."
    alternatives: "Rely on the claim lock and the lease alone."
    why: "Production 2026-11-19: two queued code runs per ticket a minute apart under on_green_push. The wake runs under the nudge's ticket lock, so the check there dedupes two wakes; start_ticket and the resume ask the same question."
  - chosen: "The pause's refusal is typed: ClaimRejectionReason.SeriesPaused, which CapacityQueueDrop switches on to mark the drop."
    alternatives: "Reuse TicketRequiresUnmet and compare the message text."
    why: "Review: matching a sentence is untyped; a reason of its own is read by code, and nothing else switches on rejection reasons."
  - chosen: "Any start the capacity pump let go on a refusal (cancelled, no cancel reason, no step) is no attempt for the previous-attempt reader (PreviousAttemptRows); a queued run a person cancelled carries its reason and stays one for the reader. This is narrower than TicketAttempts, which drops every cancelled run without a step — a person's queued cancel included. Consequence, pre-existing in kind: RunRetryGate compares the page's head (TicketAttempts) with the reader's latest, so after a person cancelled a queued run the two can name different runs and the Retry answers 'not the latest'. UnderWayAsync asks HasAttemptAsync, one EXISTS."
    alternatives: "Pass over only the series-paused drop."
    why: "Review: a refusal drop counted as worked, so the landing that lifted the refusal never started the ticket. The cancel reason keeps a person's queued cancel from being picked up by the poll again."
  - chosen: "A resume's start takes the ticket's nudge lock (ReworkNudgeWorker.LockKey); while a nudge holds it the resume starts nothing and the nudge's start is the one."
    alternatives: "Rely on the claim's lease to refuse the second start."
    why: "The under-way check is only sound under the lock the wake already holds; with it both paths answer the same question one at a time."
  - chosen: "A retry of a series-paused drop is refused with the pause's sentence (RetryRefusals.SeriesPaused); the ticket page reads the end kind quiet ('held while the series is paused', pill Paused, no act)."
    alternatives: "Let the retry refuse as 'not the latest attempt'."
    why: "Review: 'attempt none is the latest…' told the operator nothing; the resume is what starts it."
  - chosen: "A resume that finds the ticket's nudge lock busy queues a RequirementsMet nudge instead of returning; WaitingTicketStart lets that nudge start a ticket without requirements only while a running (not paused) series whose approver may start runs owns it, read when the nudge is served. A retry of a paused-series drop is refused as series-paused, worded by the series' state: the pause while paused, 'the resume starts it' while the series runs, 'start it by name' once it ended."
    alternatives: "Return 'busy' and rely on the wake recovery; keep refusing with the pause sentence after the resume."
    why: "Review: a ticket without requirements is never woken by a landing, so a busy lock would lose its start; a pause sentence after the resume would be false."
