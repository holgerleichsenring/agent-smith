# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-11-205fe

decisions:
  - category: Architecture
    chose: "SpecDialogDecisionOutcome wraps the decision path for the router and takes back the stored decision on every result but Decided (Refused, Replaced, No)"
    over: "Undeciding inside SpecDialogDecisionPath or in the router"
    reason: "The router was at its line cap; the path decides cards and should not edit transcripts. One class owns 'a decision that decided nothing leaves none', on the click and the typed path."
  - category: Architecture
    chose: "SpecDialogConfirmedSlot holds release and clear-by-id; the claim alone writes ConfirmedOutcomeJson with ConfirmedProposalId; SpecDialogOutcomeStore is deleted and the sink clears through the slot"
    over: "Keeping SpecDialogOutcomeStore as a wrapper, or a compare-and-set on the sink's second write"
    reason: "Two writers of one slot was the defect; with the claim the only writer, SetConfirmed had no caller and Clear became the slot's one statement. A wrapper kept only for its name is a shim."
  - category: Implementation
    chose: "IOutcomeSink.AcceptAsync gains an optional proposalId; the decision path passes the claimed id and the sink clears only that slot"
    over: "Reading the id from the row at filing time"
    reason: "By then a newer claim may own the row; reading it there is exactly the race the spec closes."
  - category: Implementation
    chose: "The admission writes DecisionProposalId: the clicked card's id, else the awaiting id read before the append (via an optional SpecDialogProposalState)"
    over: "Writing it only for clicks"
    reason: "A typed word can only decide the awaiting card, so naming it covers a crash on the typed path too; the dependency is optional so constructions without the proposal store keep working, and DI always supplies it."
  - category: Implementation
    chose: "Release keeps its ProposalId match and adds 'confirmed JSON present'; it does not require ConfirmedProposalId"
    over: "Requiring the confirmed id as well"
    reason: "ProposalId already names the claimed proposal; requiring the new column would strand slots an old build claimed during a rolling deploy."
  - category: Testing
    chose: "Sink tests that relied on the sink writing the slot now claim first; the SetConfirmed test went with the method; 825f's sink citations are re-grounded to the shifted lines"
    over: "Keeping the sink's write for tests"
    reason: "The product behaviour changed on purpose; the tests seed the slot the way production does."
  - category: Implementation
    chose: "The migration AddSpecDialogConfirmedProposalId is generated by dotnet ef in the SQLite, SQL Server and Postgres sets: one additive nullable column, 64 characters like the other proposal ids"
    over: "A JSON field inside ConfirmedOutcomeJson"
    reason: "The compare-and-set needs the id in a WHERE clause on all three providers."
  - category: Implementation
    chose: "Review fix: a decided turn carries DecisionApplied, set by the decision path only when DecideAsync returned Decided (filed or rejected); the view shows a decision that names a proposal only when it is marked applied. SessionManager.ClearDecisionAsync became SettleDecisionAsync(applied) for both outcomes"
    over: "Reading 'applied' from whether the named proposal still awaits"
    reason: "Once a later turn proposed B the crashed decision on A read as approved though nothing was filed. A mark written by the path that applied it says what happened. Residual: a crash between the claim and the mark shows a filed approval as not applied (errs toward not claiming); rows before 205fe name no proposal and render as stored."
  - category: Implementation
    chose: "An answer to a live question names no proposal"
    over: "Naming the awaiting proposal on every decision word"
    reason: "That answer goes to the running turn, never through the decision path, so it would never be marked applied and would vanish from the view."
  - category: Implementation
    chose: "Review fix: an acted continuation in a bound conversation clears its own confirmed slot through the CAS clear, as a filing does; a refused one keeps it for the release"
    over: "Leaving the slot set after a continuation"
    reason: "The class comment said a fully successful filing clears its own, which was untrue for bound conversations, and 825f's resume will read that slot."
