# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-06-03c7c

decisions:
  - category: Architecture
    chose: "TicketKey is its own record struct and SpecSetKey.For takes a TicketKey; the two-string SpecSetKey.For is gone"
    over: "Keeping SpecSetKey.For(provider, ticketId) beside a new TicketKey"
    reason: |
      With both factories alive an identity caller could keep minting a path type. Removing the
      overload forces every identity site (approval record, pointer, binding, lifecycle, retry,
      handbacks) onto TicketKey; only the reader and path texts still hold a SpecSetKey.
  - category: Implementation
    chose: "SeriesResolver reads the base from the working set, then the approval record, then the pointer row, and mints only when none knows it"
    over: "Branch-or-mint only, ignoring the record and the pointer"
    reason: |
      The branch wins, as the spec says. The approval record carries the base a filing minted, so a
      hand-off on an empty branch keeps the ticket's series; the pointer row is a cache that still
      answers when a branch write failed. Every set the handler publishes is stamped with the result,
      including a description-sourced set, so no set.yaml is written without one.
  - category: Implementation
    chose: "SeriesDraftIds re-ids a draft's fields with `with` and rewrites its YAML text with the same map, instead of re-reading the rewritten YAML"
    over: "Rewriting the text and re-reading it through PhaseDraftReader"
    reason: |
      Re-reading made the re-id depend on the YAML carrying every field the reader requires; the
      fields and the text are rewritten by one rule (PhaseDraftIdRewriter), so they cannot disagree.
      Assumption checked: an epic child's Yaml is YamlDotNet output of the parsed node, with spec: a
      top-level scalar and requires: a block sequence of `- id` items, which the line rewriter addresses.
  - category: Implementation
    chose: "An id matches by prefix with the label kept: p12a-label becomes {base}a-label; a longer token (p12ab) never matches"
    over: "Replacing the whole id-label entry with the bare new id"
    reason: |
      The spec says requires match by id prefix including the id-label form; keeping the label keeps
      the entry an author wrote readable, and the result is still a schema-valid id-label form.
  - category: Implementation
    chose: "FiledSeriesFactory (Server) makes the FiledSeries a filing or amendment stores: Mint, Under and KeptOrMinted"
    over: "Injecting SeriesIdFactory and SeriesDraftIds into OutcomeTicketFiler and TicketAmendment separately"
    reason: |
      Both callers do the same two steps, and both files sit at the 120-line ratchet; one collaborator
      keeps them under it and gives the amendment's 'keep the record's base' rule one home.
  - category: Implementation
    chose: "RenderEpicParent takes an optional series; the title is '{series}: {goal}' when given"
    over: "Re-id'ing the epic parent draft to the bare base id"
    reason: |
      The base is not itself a spec; making it the parent's spec id would put a non-spec id into a
      schema-valid draft. A lone phase keeps the '{id}: {goal}' title with its id {base}a.
  - category: Architecture
    chose: "One migration ReplaceTicketSpecSetsWithTicketSeries per assembly, generated by dotnet ef: drop TicketSpecSets, create TicketSeries"
    over: "Renaming the table and columns in place to keep rows"
    reason: |
      The spec drops old rows: every old row keyed a set whose ids came from a ticket number, which the
      reader now treats as absent anyway. Dropping also resets handback counters and the cause sha.
  - category: Implementation
    chose: "SeriesIdFactory formats the UTC date via UtcDateTime"
    over: "Formatting GetUtcNow() directly"
    reason: |
      A TimeProvider may return an offset-carrying instant; formatting it directly printed the local
      date. The test with a -02:00 clock at 23:30 caught it.
  - category: TradeOff
    chose: "Series_TwoTrackersSameTicketNumber_DifferentIds asserts two independent mints differ"
    over: "Injecting a deterministic random source into SeriesIdFactory"
    reason: |
      The suffix is random by the minting rule; a 1-in-65536 same-day collision is the documented
      keyspace and the factory stays a single-constructor service.
