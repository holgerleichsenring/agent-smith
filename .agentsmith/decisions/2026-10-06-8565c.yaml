# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-06-8565c

decisions:
  - category: Architecture
    chose: "The baseline is taken by the round after the skill call, from the principles.md on disk, and the round appends its outcome after it"
    over: "Taking it inside the transfer, or re-writing the baseline after the skill"
    reason: |
      The path guard lets the skill rewrite principles.md and nothing else under .agentsmith, so the exposure
      is the Limits changing after measurement, not the baseline being overwritten. Measuring last measures
      what the init commits. A test rewrites principles.md from the scripted skill and proves it.
  - category: Implementation
    chose: "IStructureEngine.Claims(path) so the init reads only files a language measures"
    over: "Reading every tracked file and letting Measure answer NotMeasured"
    reason: |
      Each read is a sandbox round trip; a repository's markdown, images and configs are most of its files.
  - category: Implementation
    chose: "An incomplete listing is detected by reaching the 1,000,000-char capture cap"
    over: "A missing trailing NUL"
    reason: |
      The agent captures stdout line by line and appends a newline; a -z listing is one line, never cut,
      so it always ends NUL-newline and only overruns. Reaching the cap is the only sign.
  - category: Implementation
    chose: "StructureWorkdir is the one normalisation for init and gate; siblings' files are left to them"
    over: "Each caller reading meta.workdir its own way"
    reason: |
      A file baselined under one context and judged under another would be tolerated by nothing.
