# yaml-language-server: $schema=../decision.schema.json
phase: 2026-08-28-b883

decisions:
  - category: Implementation
    chose: "decimal(18,10) for the call cost, the run total and the budget cap"
    over: "decimal(18,4) or decimal(18,6), which are 'more places than before' rather than enough places"
    reason: |
      The scale is picked against what a per-call cost can BE, not against what one
      happened to be. A live run's 72 calls ranged from 0.0003219 to 0.034305 — the
      smallest is already past four places — and the cost is computed as
      tokens / 1_000_000 * pricePerMillion, so the integer division contributes six
      decimal places and the configured price contributes its own. Every price in the
      shipped table has at most three (0.025, 0.125), which puts the worst case a
      current price list can produce at nine places; a single cache-read token at the
      cheapest price is 0.000000025. Ten places holds that exactly and leaves a spare
      digit for a price entered with a fourth decimal, which the config studio permits.
      Four places would still round the observed minimum to 0.0003, and six would round
      the cheap-model tail — both would need doing again.
      The integral side is chosen in the same breath: precision 18 minus scale 10 leaves
      eight integral digits, a ceiling near 100 million USD, which is four orders above
      the largest run total or cap this system has ever written. SQL Server stores
      precision 18 in nine bytes, the same as the 18,2 it replaces, so the widening costs
      nothing per row.
  - category: Architecture
    chose: "The precision is configured for SQL Server ONLY, asked by provider name in the model"
    over: "An unconditional HasPrecision(18, 10) on the three properties"
    reason: |
      SQL Server is the only provider that loses digits: it maps decimal to decimal(18,2)
      by default. SQLite stores decimal as text, PostgreSQL as an unconstrained numeric,
      MySQL at a scale of 30 — all three already return what they were handed, and
      pinning them to this scale would NARROW their range in exchange for nothing.
      There is a mechanical consequence too, and it is the decisive one: an unconditional
      annotation changes the shared model, so the SQLite-typed migration set in
      AgentSmith.Infrastructure.Persistence would need its own migration and snapshot
      regeneration for a column type SQLite ignores. Asking the provider by name keeps
      the shared snapshot byte-identical. This follows the shape already established by
      RunRecordIdentityConfiguration, which asks the provider by name for the same reason.
  - category: Tooling
    chose: "The migration is generated by `dotnet ef migrations add WidenMoneyPrecision` in the SQL Server assembly"
    over: "Hand-writing the AlterColumn calls and editing the model snapshot by hand"
    reason: |
      The snapshot is DERIVED from the model. A hand-written migration leaves the snapshot
      saying decimal(18,2), and the next generated migration in that assembly would then
      scaffold an AlterColumn back to two places — the fix would be silently reverted by
      whoever adds the next column. Generating it keeps migration, designer and snapshot
      in one consistent state; `dotnet ef migrations has-pending-model-changes` reports
      none for either assembly afterwards.
  - category: Scope
    chose: "Rows already written on SQL Server keep their rounded values"
    over: "A data-repair step in the migration's Up"
    reason: |
      Widening a column does not restore what was truncated on the way in. A row whose
      CostUsd reads 0.00 does not carry the digits that made it, and no expression over
      the surviving columns reconstructs them — recomputing from TokensIn/TokensOut and a
      price would INVENT a number and stamp it as recorded fact. An installation that has
      run on SQL Server carries zeros where per-call costs were, and they can only be
      recovered from a source that still holds them: the event trail, or a SQLite store
      the run was originally written to. The archive import this phase precedes writes
      correct values, so it must run AFTER this migration; a copy made before it is
      rounded on arrival and a row-count check will not notice.
  - category: Tooling
    chose: "The round-trip test takes SQL Server from AGENTSMITH_TEST_DB_CONNSTR and always runs the SQLite leg"
    over: "A [Fact] that skips itself when no SQL Server is configured"
    reason: |
      The provider list is the theory's data, so an unconfigured environment runs one real
      case rather than one skipped one — a skipped test reads as a pass in a summary line
      and would let the proof quietly disappear. The variable is the one
      ConfigStudioApiSmokeTests already uses for the same purpose, pointing at a database
      migrated out of band (the test project does not reference the SQL Server migrations
      assembly). Migration_TheSqlServerSchema_TypesMoneyWiderThanTwoPlaces is the leg that
      guards the regression everywhere: it reads the scale off the SQL Server model and
      asserts the shipped snapshot no longer names decimal(18,2), which fails if the
      configuration is dropped OR if a future change forgets to regenerate the migration.
      The SQL Server leg was run for real against a local 2022 server: on the schema one
      migration back all three round trips failed (0.0003219 stored as 0.00), and with
      WidenMoneyPrecision applied all seven cases passed.
