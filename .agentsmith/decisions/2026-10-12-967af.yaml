# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-12-967af

decisions:
  - category: Tooling
    chose: "spec-gate.sh is the gate; phase-gate.sh stays as a four-line exec forwarder, force-added because .claude/ is ignored"
    over: "A symlink, or the old path removed outright"
    reason: |
      A session snapshots its hook path at start and a missing hook exits 127, which does not block — a removed
      path would let every open session commit unchecked. exec keeps stdin and the exit code, and the gate
      resolves its hooks dir from BASH_SOURCE of spec-gate.sh, so the forwarder gates the same tree and writes
      the same ledger. A symlink is not portable through every checkout. Cost: git sees phase-gate.sh as
      modified and spec-gate.sh as added, so `git log --follow` on spec-gate.sh needs -C to reach its history.
      The forwarder goes in 967ah.

  - category: Implementation
    chose: "SPEC_GATE_* read first, PHASE_GATE_* honoured as the fallback; the gate hands its own hook tests BOTH names"
    over: "Rename the variables outright"
    reason: |
      The shared checkout's old gate runs this tree's hook tests with PHASE_GATE_SELFTEST/LOG set until the
      merge lands, and a later test file may read either name. Setting both keeps the self-test isolation
      whichever name a test reads; the test helper pops all six names so a spawned gate inherits none.

  - category: Implementation
    chose: "The default ledger moves to .claude/spec-gate.log; the old file is mv'd once, only when it exists and the new one does not"
    over: "Append to whichever exists, or merge the two"
    reason: |
      The ledger is the only proof a phase commit met the gate, so its history has to continue in one file. A
      move is atomic and idempotent; when both exist nothing is merged, because interleaving two ledgers would
      reorder lines that join to commits by parent sha. The move only applies to the default path — an explicit
      SPEC_GATE_LOG/PHASE_GATE_LOG is the caller's file. Tests drive a copy of the hooks in a scratch .claude/
      so the operator's ledger is never touched.

  - category: Scope
    chose: "Docs name pipeline steps by the command value the product writes today (VerifyPhase, PhaseSequence, ...), and control-flow.svg is left as generated"
    over: "Rename them to the new CommandNames identifiers (VerifySpec, SpecSequence, ...)"
    reason: |
      967ac renamed identifiers only; the values (VerifyPhaseCommand) and the display labels ("Validate phase
      spec") are what a run log, a stored RunSteps row and a custom preset show, and they change in 967ab and
      967ad. control-flow.svg is regenerated by ControlFlowDiagramTests from those labels, so a hand edit would
      fail the drift test; it follows the label change. Class names in docs (SpecSequenceHandler, the
      architecture test names) follow 967ac now.

  - category: Scope
    chose: "Tracker label and work_item_kinds docs say what an operator types is spec, phase still accepted; the written stamp stays phase-spec:approved"
    over: "Document only the new names"
    reason: |
      967aa reads spec, spec-epic, spec-parent: and spec:approved beside the phase forms, and accepts the
      work_item_kinds key spec; the product still WRITES phase-spec:approved until 967ab. Docs that named only
      the new stamp would describe a label no ticket carries yet.

  - category: Scope
    chose: ".claude/prompt.md deleted with its .gitignore exception; tools/audit-phases.py renamed audit-specs.py"
    over: "Rewrite prompt.md to match CLAUDE.md"
    reason: |
      Nothing reads prompt.md: it described p{NN}-*.md specs and decisions.md, both gone, and CLAUDE.md is the
      instruction file every session loads. A second copy would drift again. audit-specs.py is referenced
      nowhere outside history.

  - category: Scope
    chose: "Memory bodies and descriptions say spec; slugs, German quotes, old paths and dated class names stay"
    reason: |
      The feedback_*phase* slugs are cited from decisions and specs in history, so renaming them breaks those
      links. A quoted operator sentence and a path or class name as it was on the day of a finding are history.
      The one-decision-YAML memory's example key is now spec:, the key the schema requires.

  - category: Implementation
    chose: "Planned spec 2026-09-20-443a re-grounded from phase-gate.sh lines to spec-gate.sh lines"
    reason: |
      SpecEvidenceRuleTests holds every planned fact to a path and lines that resolve; the forwarder is four
      lines long, so the old citations would fail. The re-grounded lines say what the claim says, which the old
      ones (224, 229-233) had already drifted from.
