decisions:
  - category: Architecture
    chose: "The master records a default in one place: decide_by_default publishes event 88, projected insert-only into RunDefaultDecisions; the prompt line and the skill texts stop telling it to also log the choice with log_decision or in decisions.md. A pending default is never written to git"
    over: "Logging a default with log_decision as well, or writing it into decisions/<specId>.yaml at once"
    reason: "Main-thread decision 9, default, pending operator ratification. A pending default written to git disagrees the moment it is overruled; 2026-10-13-8762p copies the DECIDED default into git as '[default #<id>]'."
  - category: Architecture
    chose: "Unique<RunDefaultDecision> in RunRecordIdentityConfiguration with EventSeq long?, so SQL Server gets '[EventSeq] IS NOT NULL'; RunDefaultDecisionConfiguration (table, lengths, Conversation index, Verdict default 'pending') is applied from RunChildConfiguration beside the child-convention loop"
    over: "Declaring the unique index in the entity configuration"
    reason: "An entity configuration cannot see the provider; every (RunId, EventSeq) index lives in one place. AgentSmithDbContext stays untouched (120 lines)."
  - category: Implementation
    chose: "One pending pointer per memory file per run: the projection skips a memory-proposal whose run already holds a PENDING memory-proposal row with the same PointerPath"
    over: "A row per remember call"
    reason: "remember upserts by slug, so a second feedback write of one slug is the same proposal."
  - category: Implementation
    chose: "A coding child's feedback remember publishes the pointer row: the recorder rides on the one MemoryWriteToolHost MasterRecordToolHosts builds, which BaseSurface hands to children; decide_by_default joins the master after BaseSurface for the coding master and the design partner only (never a scan master, never a child)"
    over: "A separate recorder per child, or decide_by_default on the child surface"
    reason: "A child's memory proposal is a proposal like the master's; a child's choice belongs to its master and a scan reviews read-only."
  - category: Implementation
    chose: "decide_by_default never blocks: it answers 'Taken by default, recorded for ratification' in the same call; holds_series only flags the row for 2026-10-13-8762v"
    over: "Waiting on a person, as a question with a default answer does"
    reason: "Series contract section 5 default 50 (decision 14), pending operator ratification."
  - category: Implementation
    chose: "A memory-proposal row carries the slug as Chosen, PointerPath '{repository}/.agentsmith/memory/{slug}.md', the fixed question 'Ratify this proposed feedback memory?', empty Why and no alternatives — never the body or the description"
    over: "Copying the memory body into the row"
    reason: "Series contract section 5 default 52 (decision 16), pending operator ratification: the memory files are what a ratification is about."
  - category: Implementation
    chose: "The projection only inserts; the verdict columns (Verdict, VerdictBy, VerdictAt, VerdictNote) are declared here and written only by 2026-10-13-8762p"
    over: "Updating a row on a replayed event"
    reason: "A replayed event can never reset a verdict (pinned by RunDefaultDecisionProjection_ReplayAfterVerdict_KeepsTheVerdict)."
  - category: Implementation
    chose: "Bounds: question and chosen at most 500 characters, why at most 1000, one to eight alternatives of at most 300; each refusal names its field and nothing is recorded"
