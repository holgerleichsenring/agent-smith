spec: 2026-11-19-1b72d
decisions:
  - chosen: "The steps of the spec come from the run's progress ledger when the opened spec is the run's newest started one (ledgerSpec over the RunSpec rows); for an earlier spec, from the record it executed (its YAML steps) with each step's state the last recorded ledger transition of its id for that spec (GET /api/runs/{runId}/passes)."
    alternatives: "Always the run ledger; always the record; a new per-spec ledger endpoint."
    why: "The ledger is seeded 1:1 from the spec's steps (ProgressLedgerSeeder) and re-seeded for the next spec, so it is right only for the newest; the record is written at the spec's end, so it does not exist while the spec runs; the transitions are already projected per spec and served. No new endpoint. The ticket page hands in the passes its store already read (useAttemptPasses); the run page reads them when the step opens. A failed record read says the spec's steps could not be read; when only the passes fail, the steps show without a state under a note that their states could not be read — never all 'open'."
  - chosen: "The 'Steps of the spec' part shows on the step that runs the spec's master (AgenticMaster) only."
    alternatives: "On every step of the spec section."
    why: "The other steps of a spec (verify, commit) would repeat the same list; the mock draws it under 'Run master skill'."
  - chosen: "A sub-agent's tool-call count is the larger of the sum of its SubAgentCompleted toolCalls (one per pass) and its loaded calls; '+' while its older calls are not loaded and the record does not cover every pass — a child at work or ended with the run, a Failed or Stopped pass (they record 0), or a continued pass whose Completed is not loaded."
    alternatives: "Count only the loaded calls with '+' whenever older events exist (the old behaviour, '0+ tool calls' on a finished reviewer); drop the '+' for every finished child (first cut, flagged in review)."
    why: "The Completed event records the count; it is exact only when every pass recorded one."
  - chosen: "No role column (builds/reviews) on sub-agent rows."
    alternatives: "Derive the role from the name (…Reviewer, …Implementer)."
    why: "SubAgentSpawned carries no role; guessing from a name is a heuristic around missing data."
  - chosen: "repoSummary ('1/2 repositories ok, failed: client', two or more repositories) is replaced by repoGreenCount ('1 of 2 repositories green', any count) in the Build and tests heading; each repository is a hairline row with dot, name, command, outcome; output stays expandable while live."
    alternatives: "Keep repoSummary beside the new heading."
    why: "One count, in the heading the mock draws; the failed repository is already red in its own row."
  - chosen: "One StepPart component (rl-lbl heading over rl-part-row hairline rows) renders all four parts; styles reuse the run log's tokens (--line, --ok, --run, --bad, --ink-*), so dark and light follow the existing scopes."
    alternatives: "Per-part markup and new tokens."
    why: "Same look in all four parts, no new colours."
