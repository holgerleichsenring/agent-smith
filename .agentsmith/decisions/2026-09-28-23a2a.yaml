# yaml-language-server: $schema=../decision.schema.json
phase: 2026-09-28-23a2a

decisions:
  - category: Scope
    chose: "One series (23a2a-d) for four unrelated-looking topics"
    over: "Four independently minted ids"
    reason: |
      All four come from one piece of work, the 2026-09-28 code comparison with OpenHands, which is
      what CLAUDE.md's series rule covers. The letters claim a shared origin, not a shared topic.

  - category: Security
    chose: "A per-job Redis ACL user for every container sandbox"
    over: "Authenticating Redis alone, or relying on a NetworkPolicy"
    reason: |
      The server hands its own REDIS_URL to every sandbox (PodSpecBuilder.cs:86-88, 121-125;
      DockerContainerSpecBuilder.cs:57-59, 78-82), so a password added to it reaches the sandbox too.
      A NetworkPolicy cannot isolate Redis, which the sandbox must reach. Only a credential scoped to
      the job's keys stops forged steps, forged jobs (RedisJobQueue.cs:19-30) and edits of the
      active-run set (EventStreamKeys.cs:11).
    alternatives:
      - "One user per owner: does not separate jobs from each other"
      - "Server as a Redis proxy for the agent: a new hop on the hottest path"

  - category: Implementation
    chose: "Password = HMAC(server Redis credential, owner + job id)"
    over: "A random password held in the creating replica's memory"
    reason: |
      Review found that re-creating users after a restart had no password source. ACL users are not
      persisted without an aclfile, and the leader reaps pods that other replicas created
      (HeldConversationReader.cs:11-15). With a derived password, any leader can re-create every
      owned user from the pod list alone.
    alternatives:
      - "aclfile + ACL SAVE: needs a writable volume and ties the manifests to ACL persistence"

  - category: Implementation
    chose: "User names carry the owner; a sweep touches only its own prefix"
    over: "Sweeping every sbx-* user that has no live pod"
    reason: |
      ACL users are global to a Redis, but each server lists only its own namespace or daemon
      (KubernetesSandboxCorpseReaper.cs:55-60, SandboxOrphanReaper.cs:70-74). Accepted from review.

  - category: Security
    chose: "The ACL grants SETEX as well as SET, plus PING and CLIENT SETNAME/SETINFO; the agent sets its server version explicitly"
    over: "Exactly six data commands"
    reason: |
      Review: the heartbeat's StringSet with an expiry goes out as SETEX from the pinned 2.8.16 client
      (HeartbeatLoop.cs:59; Sandbox.Agent.csproj:15). Mapping out INFO removes version detection,
      so the agent states its server version. The real-Redis test decides the final set.

  - category: TradeOff
    chose: "per_job by default; missing ACL rights raise a blocking startup finding that names sandbox.redis_scoping"
    over: "shared by default with a warning"
    reason: |
      A dangerous default belongs in the API, not in a warning. The blocking finding reuses the
      mechanism RedisExtensions.cs:98-104 already has, so an operator on a managed Redis without ACL
      rights learns the setting at startup, not at the first run.

  - category: Scope
    chose: "The in-process path moves to a new phase, 2026-09-28-ef94"
    over: "Stripping in-process env inside this phase, or keeping the original scope-out"
    reason: |
      Review refuted the original scope-out reason ("no Redis hop"). InProcessSandbox inherits the
      host environment (InProcessSandbox.cs:155-187), and the CLI job pods receive the full REDIS_URL
      (KubernetesJobSpawner.cs:27-28, DockerJobSpawner.cs:136), so repository commands there see the
      server credential directly. The fix is an environment strip, not a Redis ACL, and it ships
      complete on its own. It gets a new id because a later addition to a series mints anew.

  - category: Scope
    chose: "The manifests move to host:port,password=…, and probes authenticate with REDISCLI_AUTH"
    over: "Keeping the URI in the secret template"
    reason: |
      The server parses host:port only and says so (RedisExtensions.cs:98-104,
      docker-k8s-troubleshooting.md:15); the template's redis://redis:6379 (4-secret-template.yaml:74)
      was already the wrong form. Adding requirepass without fixing the probes would take Redis
      readiness down (6-deployment-redis.yaml:41-52).

  - category: Scope
    chose: "Rejected nothing from the review; narrowed the GIT_TOKEN motive"
    reason: |
      GIT_TOKEN in Step.Env is one installation-wide token per platform (GitTokenResolver.cs:21-27),
      and the sandbox's own git steps already receive it. The motive rests on forged steps, forged
      jobs and liveness edits instead.
