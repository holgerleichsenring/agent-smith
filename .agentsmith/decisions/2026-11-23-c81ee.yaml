# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-23-c81ee

decisions:
  - category: Implementation
    chose: "Expiry and due reminders are computed (ExpiresAtTicks ?? CreatedAt + lifetime_days); only the seen time and the extension count are stored, written by a route and by the extend run"
    over: "The leader subsystem writing reminder and expiry columns"
    reason: "The subsystem starts runs and writes nothing (933dh review finding 4). Storing ExpiresAtTicks only on extend keeps a later lifetime_days change from moving extended PoCs."
  - category: Scope
    decider: operator
    chose: "Dashboard notice only; mail is a later spec once SMTP exists"
    over: "Mail or chat DMs now"
    reason: "Operator ruling H."
  - category: Implementation
    decider: operator
    chose: "An expired PoC whose owner saw no reminder before expiry is stopped, not deleted, and stays stopped until extended or deleted by a person"
    over: "Deleting it after a grace period"
    reason: "Ruling H says stopped, not deleted. A grace delete was not ruled and is not built; to be raised with the operator if wanted."
  - category: Implementation
    chose: "Expiry reuses c81ed's poc-stop and poc-delete with an expiry seed; no poc-expire preset"
    over: "A poc-expire preset planning stop or delete"
    reason: "One chain per act; the seed adds the audit act 'expired' and the run re-checks expiry, so an extension made meanwhile ends the run green."
  - category: Implementation
    chose: "Extend is the run poc-extend through PocRunGate and IActRun, its audit entry from PocActedEvent"
    over: "A row write with a direct audit entry"
    reason: "933da: PocAuditEntry is written only by a run event projection (933dh review finding 5)."
  - category: Implementation
    chose: "The upload purge is an installation run on '@agent-smith' started at most daily, and also deletes deleted PoCs' poc-scope secret rows through SecretWrite"
    over: "A run in a poc- project, or purging inside the subsystem"
    reason: "Uploads are global (no project); InstallationScope is the existing label for installation runs; 933dg left secret-row deletion here."
  - category: Implementation
    chose: "A failed expiry run is retried at most once a day, recognised as: the run LastRunId names is a poc-stop or poc-delete run, it failed, and it finished less than 24 h ago; a stopped expired PoC starts no run"
    over: "Retrying every pass; a Run-row query for 'expiry runs'"
    reason: "Avoids 24 runs a day per PoC (933dh review finding 6). The Run row keeps no seed and no actor (the stored request is cleared at promotion, Trigger is always manual), so an expiry run cannot be told from an owner's; the backoff therefore also covers an owner's failed stop or delete, which is harmless (round-2 review)."
  - category: Implementation
    chose: "c81ed's start is refused on an expired PoC, naming the expiry date and Extend; the banner offers Extend and Delete and enables Start after Extend"
    over: "Only hiding Start in the banner"
    reason: "Start without Extend left the PoC expired and unseen with Replicas 1, so the next pass stopped it again, in a loop; the spec already said it stays stopped until extended and started. A server refusal holds for every caller, not only the banner (round-2 review)."
  - category: Implementation
    chose: "The extend route seeds ContextKeys.PocMayExceed (caller holds pocs.admin), as ConfigApplyRun seeds mayWriteSecrets; no same-run-id retry guard"
    over: "PocExtend reading the caller's permissions; idempotence by finding its audit entry"
    reason: "IActRun runs on no token, so the handler cannot see the caller; IActRun runs are never re-queued and the audit entry comes from an asynchronous projection, so the guard protected nothing (round-2 review)."
  - category: Implementation
    chose: "ContextKeys.PocAct keeps stop or delete for an expiry run; the audit act 'expired' and its Reason travel separately in ContextKeys.PocAuditAct"
    over: "Setting the act itself to 'expired'"
    reason: "c81ed's plan, preconditions and follow state table key on the act; an act 'expired' would never clear LiveName on a settled expiry delete (round-2 review)."
  - category: Implementation
    chose: "Expiry, backoff and purge ages are computed in memory over loaded rows, as RunRetentionService does; no ticks column"
    over: "Query-side DateTimeOffset comparisons; a CreatedAtTicks column on Poc"
    reason: "SQLite cannot translate a DateTimeOffset comparison; the live PoCs and the uploads are few enough to load (coordinator note relaying 933da)."
  - category: Implementation
    decider: operator
    chose: "An expired PoC stopped for an unseen reminder is deleted pocs.lifetime.unseen_delete_after_days (30, config key with a settings field) after its recorded expiry stop, unless extended; the audit Reason names the value, the reason and the key"
    over: "Ruling H's 'stays stopped; nothing deletes it later'"
    reason: "Operator ruling, round 4, 2026-11-23. The limit is config because it trades an owner's time to react against keeping abandoned PoCs; Problems() refuses 0 because it would delete before the owner could see the banner."
  - category: Implementation
    chose: "The 30 days count from the PoC's latest 'expired' audit entry at or after ExpiresAt, and every unseen expiry gets one recorded poc-stop run, also at Replicas 0 (GitOpsCommit commits nothing and still publishes the event)"
    over: "Counting from ExpiresAt, or a new timestamp column"
    reason: "Counting from ExpiresAt would delete on the upgrade PoCs that expired more than 30 days before this ships, whose owners never had a reminder; the audit entry already exists with a long AtTicks (no DateTimeOffset in the query) and needs no migration. An owner-stopped PoC gets the same recorded stop, so its owner gets the same 30 days and the same banner date."
  - category: Architecture
    decider: operator
    chose: "A blocked PoC that never deployed is removed once its upload is purged: the lifetime pass launches c81ed's poc-delete for it, which commits nothing and settles deleted with LiveName null"
    over: "The purge run setting the PoC deleted itself, or a separate removal act"
    reason: "Operator ruling, round 4, 2026-11-23. No second path: poc-delete already admits a PoC with Revision null and is the one writer of deleted and LiveName; one run per PoC keeps 933da's unique (RunId, Act) audit index valid, which one purge run removing several PoCs would break."
  - category: Implementation
    chose: "A new upload to an expired stopped PoC is deployed but kept stopped (poc-deploy keeps the row's Replicas), the outcome naming the expiry date and Extend"
    over: "Starting it per ruling 5, or refusing the import"
    reason: "Round 4 ruled that an upload starts a stopped PoC, and ruling H plus this spec refuse Start on an expired PoC: starting it would be undone by the next pass's stop, so the upload does not do what Start may not. Refusing the import would lose the owner's upload; kept stopped, Extend and Start bring it up."
