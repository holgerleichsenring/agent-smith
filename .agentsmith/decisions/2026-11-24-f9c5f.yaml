# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-24-f9c5f

decisions:
  - category: Scope
    decider: operator
    chose: "The series page and the ticket page show each pull request's target, merges into the series branch, and the final pull request as its own step"
    over: "Leaving the target implicit"
    reason: "Operator 2026-11-24: the pages show the truth."
  - category: Implementation
    decider: claude
    chose: "The final step is drawn after the tickets in the action list, from the series' own account (link, number, last sentence) and merge.when"
    over: "A step in the merge order"
    reason: "The merge order is ticket-shaped (depth, requirements, the Merge act); the final pull request has no ticket and no act on the page — it merges on the host or by merge.when."
  - category: Implementation
    decider: claude
    chose: "A merge run's CI-start sentence (CI started / CI not started / no CI) is shown as it is rather than as 'the last merge was refused'"
    over: "A new pull-request status for a CI start"
    reason: "No second path: the start reuses the existing refusal record (f9c5d), and the page tells its sentences apart by their opening words, which the server writes."
  - category: Implementation
    decider: claude
    chose: "The verifying state word reads 'checking' instead of 'checking on main'"
    over: "Keeping 'on main'"
    reason: "A series with a branch is checked on that branch; the panel line names the branch."
  - category: Implementation
    decider: claude
    chose: "Post-build review fix: a ready series ticket whose CI waits says it merges into the series branch by itself instead of asking for respect_branch_protection"
    over: "The default-branch wording"
    reason: "Review finding 12: a merge into a series branch never arms, so the key could not help."
  - category: Implementation
    decider: claude
    chose: "After merging main (2026-11-24-6811a-d): the final pull request's step reads the host's conflict state (PrReviewState.HasConflicts) every beat and launches one refresh-base run per head on a conflict, under every merge.when and before the series check passed"
    over: "Seeing a conflict only at agent-smith's own merge attempt"
    reason: "6811a gave every host's state read the conflict; the final pull request has no PR record, so the step asks the host directly — a small change, and merge.when manual no longer hides a conflict."
  - category: Architecture
    decider: claude
    chose: "The final pull request's conflict goes through 2026-11-24-297b's ConflictBaseRefresh — the one conflict trigger — with RefreshedPullRequest.SeriesFinal naming the series branch: no ticket to be free, listed on no ticket, one run per conflict on a head, none while one is at work. The series record keeps when the conflict began on the head (ConflictHead, ConflictSince) for it; f9c5e's own launcher overload and RefreshedHead are gone"
    over: "Keeping the final pull request's own launch beside 297b's"
    reason: "Coordinator 2026-11-24: one trigger path. 297b's due rule (by the pull request's refresh runs and when the conflict began) serves a pull request without a ticket once the free check is skipped for one; the beat still decides when to ask, because the final pull request has no record the refresh's read would reach."
