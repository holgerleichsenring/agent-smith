# yaml-language-server: $schema=../decision.schema.json
spec: 2026-11-04-6768a

decisions:
  - category: Architecture
    chose: "Replay the cited look with git at the series base and at HEAD, and compare the outputs"
    over: "Ask the checker again at the base; strengthen the preceding-specs prompt text; match premise wording against the preceding specs' goals"
    reason: "The prompt guard (PremiseCheckPrompt.cs:94-104) is what failed in production. A second model call is still a judgement, and text matching is a heuristic. The finding already names one look that ran. Asking whether that look read the same before the series' own commits is a yes/no question with no model involved."
  - category: Architecture
    chose: "Read the series base off the branch: the first parent of the oldest checkpoint-marked, non-merge commit not reachable from the base ref"
    over: "Store a series_base map in the manifest; reuse SpecCitationHistory.BaseAsync (commit-date and approval-instant rule)"
    reason: "Every piece of series work already carries the checkpoint marker (RunCheckpointCommit.cs:14), and SandboxRunStartCommit reads a run's start the same way, so the base is recorded by construction, across runs, without a mid-run manifest publish. The date rule would put foreign merges made between approval and run start after the base, so a premise a foreign change broke would read as superseded."
  - category: Architecture
    chose: "Superseded only on a presence flip (absent at one ref, present at the other) in a path a series checkpoint commit touched, merged base commits excluded"
    over: "Superseded whenever the replays differ; any difference touched by a series commit"
    reason: "A content change shows only that a file moved, not that the premise held at the base. The code assumes later facts describe the state their predecessors leave, and a premise false at that very state must still go back. A flip is what absence claims ('contains no X') produce, which is the production shape. A difference only a merged base commit explains is someone else's change, as ForeignCommitProbe treats it."
  - category: Implementation
    chose: "Add the search pattern to EvidenceRecord/EvidenceLook, and the cited look's id to PremiseFinding"
    over: "Parse the pattern back out of the 'what' prose; resolve the citation a second time in the replay"
    reason: "Reading the pattern back out of the prose is a heuristic, and the missing field is the actual gap. Admission already chose one look (PremiseCheckAdmission.cs:73-75), and a second resolution rule could choose a different one. The id, not the look, because PremiseFinding lives in Domain."
  - category: Implementation
    chose: "Audit and verify-stage looks, an unreachable base and a failed git step all leave the finding false"
    over: "Treat them as superseded, leaning toward letting the work happen as admission does"
    reason: "Leaning lenient is right where the framework cannot tell. Here it can tell for a read or a search, and for the other kinds it has no replay. Calling those superseded would be a guess, and it would wave through the two genuinely false premises the production data shows."
  - category: Scope
    chose: "Leave requires-linked tickets out, naming 'premise base for amended tickets' as the successor"
    over: "Cover them with the same replay"
    reason: "A ticket-list ticket (TicketGraphFiler, TicketText) derives its specs after its required ticket landed, so its facts are fresh. Ticket amendment (TicketAmendment.cs:40-90) can record facts on a dependent ticket before that merge, and the required work then arrives as a base merge, which this rule treats as foreign. Counting merged base work as superseding would also wave through every foreign change, so that path needs its own anchor (the required ticket's landing), not this one."
  - category: Implementation
    chose: "Anchor the series base at the newest revision commit that is not a citation re-ground"
    over: "Every checkpoint on the branch; the newest revision of any cause"
    reason: "Re-cuts (rework, comment, ticket edit) rewrite facts against the state after earlier runs, so earlier checkpoints are not series work for that text. Without the anchor, a re-cut fact that was already false would read as superseded. The re-ground revision that SpecEntryGrounding publishes at entry only moves citations, and it lands after earlier specs' work, so anchoring on it would hide exactly the sibling changes this rule exists for."
  - category: Scope
    chose: "Accept the residual: a premise already false at the base whose path a sibling also flipped reads as superseded"
    over: "Line-level comparison of what proves the premise"
    reason: "Deciding which line proves the premise needs judgement, and a read records no range (EvidenceRecord.cs:22-29). The spec's own verification still judges the result."
