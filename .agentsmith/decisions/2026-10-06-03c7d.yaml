# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-06-03c7d

decisions:
  - category: Architecture
    chose: "SpecSetKey is deleted; ISpecSetReader takes the TicketKey and SeriesPaths (Contracts) owns every path: series/{base}.yaml, specs/{planned,done,active}/, the git pathspec of a series"
    over: "Keeping SpecSetKey with only its Value"
    reason: |
      With its path members gone SpecSetKey would be a second spelling of TicketKey. The reader is
      handed the identity it searches by; where files lie is one static path vocabulary.
  - category: Implementation
    chose: "Stale = every specs/planned/ file whose name starts with the series base and a member letter and that the render did not write; a mock of a spec still in the series stays"
    over: "Selecting by the ids of the previous and current manifest"
    reason: |
      An amendment's leftovers include a spec it dropped, whose id is in neither the manifest on the
      branch (already amended) nor the current render, so an id rule misses it. Every member of a
      series starts with its base, so the base rule covers dropped, relabelled and leftover files
      and never touches another series. Mocks are companions the renderer never writes.
  - category: Implementation
    chose: "A filed spec keeps its label through an amendment: ApprovedPhaseSetRecorder reuses the previous record's slug for an id it already carried"
    over: "Re-slugging from the amended goal"
    reason: |
      The checkout-free branch write cannot delete, so a relabel would leave two files for one id
      on the branch, and the reader refuses that series. An id is frozen and its label goes with it.
  - category: Implementation
    chose: "SeriesManifestFinder lists series/, parses each manifest and takes the one whose ticket equals the key; two matches are unreadable; an unparsable manifest whose text names the key is this ticket's broken manifest (unreadable), any other unparsable one is skipped"
    over: "Treating any unparsable manifest as blocking, or ignoring all of them"
    reason: |
      A broken manifest of another ticket must not park every run; a broken one of this ticket is an
      edit gone wrong and must not be replaced by a derivation. The key in its text is the only way
      to tell the two apart without parsing.
  - category: Implementation
    chose: "The ticket-description source is removed whole: PhaseSpecFromTicket, IPhaseSpecFromTicket, PhaseSpecExtraction, SpecSource.TicketDescription, Decision.Error and SpecCutGate.RefuseSpecAsync"
    over: "Leaving the extractor in place unused"
    reason: |
      Its only reader was the resolver; kept, it is dead code that tests would keep alive. Decision.Error
      was set only by a malformed fence, so the refusal path went with it.
  - category: Implementation
    chose: "Force-staging takes the written paths in one git add -f; the revision sha is git log -1 over the manifest and the pathspec .agentsmith/specs/*/{base}*"
    over: "Force-staging directories"
    reason: |
      specs/planned/ is shared, so staging it would sweep in other series' untracked files, and a
      missing path fails git add. Assumption checked with real git: a glob pathspec in git log -1
      matches across state directories (SeriesReader_ReviewerEditsSpecFile_ShaChanges).
  - category: TradeOff
    chose: "The PhaseExecutionTests preset seeds its spec at the ISpecSetReader port and adds the cut comment after the operator's answer"
    over: "Seeding manifest and spec files into the stub sandbox"
    reason: |
      The fast tier's sandboxes are created per run by the factory and answer every read with an
      empty file; the other branch-artifact presets stand in at the same port.
  - category: Implementation
    chose: "SpecSet gains an optional Goal the manifest round-trips; nothing sets it yet"
    over: "Leaving goal out of the manifest until 03c7f"
    reason: |
      The spec puts goal in the manifest; 03c7f fills it from the approval row.
  - category: Scope
    chose: "TicketSeries.ExecutedThrough ships in 03c7d, wired through SpecSetPointer, SpecSetPointerRecorder and TicketSeriesRepository, with migration AddTicketSeriesExecutedThrough generated by dotnet ef in AgentSmith.Infrastructure.Persistence and AgentSmith.Infrastructure.Persistence.SqlServer"
    over: "Adding the column in 03c7e as planned"
    reason: |
      The pointer was already being reworked here, and 03c7d and 03c7e go out in one pull request,
      so the column lands with the pointer change rather than reopening it in e. One migration of
      one name per assembly keeps the two providers' histories aligned; the column defaults to 0,
      which reads as "nothing executed" for every existing row.
  - category: Scope
    chose: "Stale removal selects by series base plus member letter, not by the previous and current manifest's ids as the spec's stale_by_id_prefix decision states"
    over: "Implementing the spec's id rule as written"
    reason: |
      See the stale-removal entry above: the id rule misses a spec an amendment already dropped
      from the manifest on the branch. The spec's intent (relabelled ids and leftovers removed,
      other series untouched) holds under the base rule.
