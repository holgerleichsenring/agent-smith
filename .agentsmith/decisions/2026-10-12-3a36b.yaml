# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-12-3a36b

decisions:
  - category: Architecture
    chose: "SpecHandback gains Cites (the resolved minted lines); the envelope reads cites as a string or a list, ContradictionCitations resolves them through DerivationEvidence.IndexById, and Parsed gains Uncited — the hand-back is still parsed, with the reason the re-ask carries"
    over: "Refusing an uncited contradiction in the parser as a parse error"
    reason: |
      CITES ARE ASKED FOR, NOT FORCED: a parse error would lose the hand-back, and on the last
      attempt the deriver must still be able to park it unchecked. Unknown ids are named in the
      re-ask; resolved ids keep their minted line, as a phase fact does.
  - category: Architecture
    chose: "ContradictionHandbackGate sits between parse and review in SpecSetDeriver; DerivationAttempts holds the loop state (bound = 3 + pinned + refuted, least-objected cut, last error, uncited hand-back)"
    over: "Growing SpecSetDeriver past the 120-line ratchet"
    reason: |
      The refutation is a second reason for an extra attempt beside the pin, so the bound became a
      sum and the loop state its own type. An uncited contradiction the attempts ran out behind
      (e.g. followed by unparseable replies) is returned rather than null, with no error, so the
      handler never builds the one-phase fallback over it.
  - category: Implementation
    chose: "No look, no check — and no cites demand either: a derivation with no sandbox parks its contradiction unchecked, logged"
    over: "Re-asking for cites when there is no look to cite"
    reason: "Without a look there is no id the model could cite, so a re-ask could only fail; the spec's 'no look → no check, logged' is applied before the cites rule. A run without sandboxes behaves as before."
  - category: Architecture
    chose: "ContradictionChecker (IContradictionChecker, role contradiction-checker) in the shape of PhasePremiseChecker; its own DerivationLookTerms.ContradictionCheck (prefix C, CutReviewAllowance) built per check through DerivationLookFactory.OnTerms; a verdict is admitted as refuted only when it cites a C-id of a look the check took that ran"
    over: "Reusing the cut reviewer, or the premise check's M terms"
    reason: |
      Its ids travel back into the deriver's conversation with the refutation, where L is already
      the deriver's. The cited derivation looks are handed over as records (line, kind, repository,
      path) to RE-TAKE, not to trust — a grep has no file to re-read. The harness stands it down
      (HarnessContradictionChecker) like the other framework calls.
  - category: Architecture
    chose: "HandbackHeads is a nullable JSON column on TicketSeries (repository name → sha), carried on SpecSetPointer; migration AddTicketSeriesHandbackHeads generated by the repo's pinned dotnet ef 9.0.17 (--no-build, project = startup = the migrations assembly) in both AgentSmith.Infrastructure.Persistence and AgentSmith.Infrastructure.Persistence.SqlServer"
    over: "A child table of heads"
    reason: "Nobody queries a single head; the row is read whole on every re-entry. The InMemory store carries the record unchanged, so only the Db repository serialises it."
  - category: Implementation
    chose: "Heads are read by HandbackHeadsReader in SpecHandbackHandler at the park, only for the contradiction case: git rev-parse refs/remotes/origin/<branch> per scoped repository (branch = the run's Repository.CurrentBranch, as SeriesWriter uses); SpecSetPointerRecorder keeps them for a hand-back revision and clears them for any other"
    over: "Storing heads for every hand-back case"
    reason: "Other hand-back cases are out of scope; without stored heads the probe skips them, so the expiry applies to contradictions only. The hand-back's own revision was pushed before the park, so our last commit is inside the stored head."
  - category: Implementation
    chose: "ForeignCommitProbe.ProbeAsync runs in DeriveSpecHandler before Decide, only when the branch set is handed back, and writes ContextKeys.ForeignCommitSinceHandback itself; per repository it runs git rev-list --no-merges --format=%ae <stored>..HEAD --not <base> with the base from SandboxBaseLadder.ResolveAsync (parent from RunParentTicket)"
    over: "Probing in SpecHandbackHandler, which runs after the derivation decided"
    reason: |
      The probe decides NeedsModel, so it must run before Decide. A sandbox whose git config user.email
      is not SandboxGitIdentity.Email, a missing stored head, a sha rev-list cannot resolve, or a clone
      naming no base is skipped and logged. The key is placed in ContextKeys.Ticket.cs because
      ContextKeys.Spec.cs is at the file-length limit.
  - category: Implementation
    chose: "SpecAmendmentRule.NeedsModel(cause, set, foreignCommitSinceHandback) returns true for a handed-back set first; SpecSourceResolver.Decision gains Expired and carries the set's approval onto it; DeriveSpecHandler keeps the stored hand-back (not the fallback) when an expired re-derive yields nothing"
    over: "Clearing the approval on expiry"
    reason: |
      EXPIRY NEVER APPROVES A GUESS: the approval rides onto what the model derived (Finalize stamps
      approval ?? set.Approval); a failed derivation republishes the stored hand-back, which carries
      its own approval, and the hand-back step parks again. The handler stays at its 143-line baseline.
  - category: Implementation
    chose: "SpecHandbackRepeat.IsRepeat takes foreignCommitSinceHandback (read by SpecHandbackHandler from the context key) and returns false when set — the repeat count resets"
    over: "Clearing the pointer's LastHandbackCase in the probe"
    reason: "THE RESET TRAVELS IN THE CONTEXT: the guard runs in a later command than the probe, and the pointer is the record of what parked, not of what changed since."
  - category: Scope
    chose: "Skills prompt change committed on agent-smith-skills branch feat/2026-10-12-3a36b-handback-cites (commit 4e6b0f7, stacked on feat/2026-10-12-3a36e-repos-field), spec-derivation-master 1.5.0 → 1.6.0; NOT pushed, released or pinned"
    over: "Bumping SkillsCatalogVersion and SkillsCatalogSha256 in this commit, as the spec's prompt step says"
    reason: |
      The release and the pin are the operator's step. The backend works with today's pinned catalog:
      a contradiction reply without cites is re-asked (the re-ask names the shape) and on the last
      attempt parks unchecked, so no run breaks before the pin. PENDING: release the skills branch,
      then bump SkillsCatalogVersion + SkillsCatalogSha256 in AgentSmith.Infrastructure.Core.csproj.
  - category: Scope
    chose: "The done criterion 'replaying run 10-10' is covered by ContradictionHandbackTests.Contradiction_RefutedBySecondReading_IsDerivedAgainNotParked (RealCompositionHarness, scripted grep + false contradiction, harness checker refutes) and the expiry criterion by HandbackExpiryTests; neither replays the live run's recorded inputs"
    over: "Replaying the live run's recorded LLM calls"
    reason: "The recorded inputs carry a customer repository; the harness reproduces the shape — one grep, a contradiction citing it, a refutation, a second derivation — with fixture names."
