# yaml-language-server: $schema=../decision.schema.json
spec: 2026-09-28-2ac3

decisions:
  - category: Security
    chose: "Redact the Redis password in startup findings and logs, as a small phase of its own"
    over: "Folding the redaction into ef94"
    reason: "ef94 is about the in-process step environment; the redaction is independent and cheap. It was carried over from the review of the withdrawn per-job Redis ACL phase."

  - category: Scope
    chose: "Document the interim Redis password step, including what it does not protect before the transport change"
    reason: "requirepass with REDIS_URL=host:port,password=… works today without code (RedisExtensions.cs:87), but every sandbox still receives the URL until 2026-09-28-2f8c ships."

  - category: Security
    chose: "Never echo the configured value: print endpoints or '(value hidden)', in both the URL finding and the probe finding"
    over: "Redacting a password= element"
    reason: "Review: the URI form the template ships puts the password in the host part (4-secret-template.yaml:74), and RedisProbe publishes raw client errors (RedisProbe.cs:25; InfraConnectivityProbe.cs:43)."

  - category: Security
    chose: "Both fail-open cases are named: optional false for a missing key, a guarded start for an empty one"
    reason: "Review corrected the earlier reasoning: a missing optional key leaves the literal, readable variable reference as the password; an empty value disables requirepass, and optional false does not catch it."

  - category: Implementation
    chose: "RedisEndpointText extracts endpoints itself (comma tokens matching host[:port], or the host and port of a URI token) and returns '(value hidden)' when none match"
    over: "Reparsing through ConfigurationOptions.Parse, or masking the password element"
    reason: "Parse throws on exactly the values the unusable finding is about, and masking a password key misses the URI form, where the password sits in the host part. A pure extraction cannot echo anything but an endpoint."
  - category: Implementation
    chose: "The unusable finding names the parser's exception type, not its message; RedisProbe names the endpoints of the multiplexer's configuration and drops the probe's error text"
    over: "Keeping ex.Message and result.Error in the findings"
    reason: "Both texts come from the client and can carry the configured string. RedisProbe now takes IConnectionMultiplexer, which InfraConnectivityProbe already depends on, so no new registration."
  - category: Scope
    chose: "InfraConnectivityProbe also returns 'no answer from <endpoints> (<exception type>)' instead of ex.Message"
    over: "Fixing only the startup finding"
    reason: "The same probe result reaches the diagnostics and preflight responses, which the done criterion covers ('no startup finding or API response')."
  - category: Scope
    chose: "The interim password step is documented in docs/reference/host-it/redis-password.md; the reference manifests stay unchanged"
    over: "Switching 6-deployment-redis.yaml and compose to requirepass here"
    reason: "The spec scopes the step as documentation needing no code change; 2026-10-25-c5a7e makes the reference files require the password."
  - category: Implementation
    chose: "Spec citation drift accepted as written: the finding sits at RedisExtensions.cs:96-102 and the probe error at InfraConnectivityProbe.cs:41"
    over: "Rewriting the spec"
    reason: "Two lines of drift; the cited code is unambiguous."
