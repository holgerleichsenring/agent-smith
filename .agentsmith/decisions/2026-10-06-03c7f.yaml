# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-06-03c7f

decisions:
  - category: Architecture
    chose: "ApprovedSeries keeps ONE content column (ContentJson, the SpecApprovalJson of the whole record, the series' goal included); SeriesId, TicketId, Repositories, CarryingRepo and the approval columns are projected from it at save and never read back"
    over: "Making the repositories, carrier and series columns authoritative and the JSON only the set"
    reason: |
      The row already followed the one-content-column rule for the approval projections, and the
      record still rides the run's context in exactly that JSON shape. Splitting the content across
      columns and a narrower JSON would make two readers assemble one record two ways. TicketId is
      still what discovery queries; it is written from the record like the rest.
  - category: Architecture
    chose: "One migration ReplaceApprovedSpecSetsWithApprovedSeries per assembly, generated by the repo's pinned dotnet ef 9.0.17 (--no-build, project = startup = the migrations assembly): drop ApprovedSpecSets, create ApprovedSeries"
    over: "Renaming the table and columns in place"
    reason: |
      The spec drops old rows: each keyed a set whose ids came from a ticket number, which 03c7c's
      reader treats as absent. Same name in AgentSmith.Infrastructure.Persistence (SQLite, Postgres,
      MySQL) and AgentSmith.Infrastructure.Persistence.SqlServer keeps the two histories aligned, as
      03c7c and 03c7d did.
  - category: Implementation
    chose: "The goal is an explicit parameter of ApprovedSetTicketFiler.FileAsync and ApprovedPhaseSetRecorder.RecordAsync, stored as SpecSet.Goal; AmendedSpecification gains a Goal field"
    over: "Adding Goal to FiledSeries"
    reason: |
      The spec names the two signatures. SpecSet.Goal (03c7d) already round-trips through the
      record JSON and the manifest, so FiledSpecBranch writes the manifest's goal and approval from
      the record's set unchanged — no second path.
  - category: Implementation
    chose: "Retry reopens through a new ISpecApprovalStore.ReopenAsync, called after the hand-back is cleared"
    over: "Re-saving the record, which clears SatisfiedAt as a side effect"
    reason: |
      A re-save would rewrite the approval projections and look like a re-approval. Reopen touches
      SatisfiedAt alone and is silent on a ticket nobody approved, like MarkSatisfiedAsync.
  - category: Scope
    chose: "ApprovedSetView and the dashboard are unchanged; the pane test proves a conversation bound after filing reads the row through the real DB store"
    over: "Adding the goal to the pane"
    reason: |
      The spec's done criterion is that the bound conversation shows its set; showing the goal is a
      surface change the spec does not ask for.
  - category: Scope
    chose: "The skill correction and pin bump are not in this change"
    over: "Editing design-partner-master here"
    reason: |
      The skill text is already corrected in skills PR #213, unreleased; the pin moves after its release.
  - category: Implementation
    chose: "The SpecSet.Approved, SpecSet Approval-parameter and SpecApproval comments now say the branch wins whenever it answered and the instant only decides carried vs stored"
    over: "Leaving 'yields to the branch unless newer' wording"
    reason: |
      Since 2026-09-22-6ad7 SpecSourceResolver never compares a record against a branch that
      answered; only ApprovedSpecSetResolver's carried-vs-stored newer-of reads the instant.
