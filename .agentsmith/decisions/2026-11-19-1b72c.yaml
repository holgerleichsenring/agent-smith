spec: 2026-11-19-1b72c
decisions:
  - chosen: "The ticket composer reuses Work it out's decision: an offered proposal's DialogDecisionBar (named action + Keep chatting) replaces the text field; Approve, Discard and Ask for changes are removed, and the composer sends only approve."
    alternatives: "Keep the ticket page's own Approve/Discard row; show the bar beside the text field."
    decider: operator
    why: "Operator rule from 7c42b: a decision or text, never both at once; discarding is said in words and the server withdraws when the agent deletes the draft."
  - chosen: "The approval card (DialogQuestionCard) loses its Approve/Reject pair and shape buttons; it answers choice and confirmation questions and says an expired approval filed nothing."
    alternatives: "Keep the approval branch for a later page."
    why: "Only the ticket page used the card and it no longer passes an open approval to it; the branch would be dead code. Shapes offered beside an approval are lost as buttons on both pages, as in 7c42b — the agent's reply names them and a reply picks one."
  - chosen: "Before the first act the decision is read from the page's conversation proposal and approval preview; once the question is watched, approvalDecision on the awaiting push decides. Both apply the same offer gate (offerOf, shared with approvalDecision): the ticket conversation view now carries OfferLed and FilingOffer (TicketConversationProposalView, set in TicketTranscriptReader.Of as OutcomeProposalJson stores them)."
    alternatives: "Show nothing until the session is opened; open the session on page view; no offer gate before the first act."
    why: "Viewing writes nothing (9a59r), so the question is not watched yet. Review finding: without the gate an unoffered draft could be approved on the ticket page before the first touch, which Work it out never allows."
  - chosen: "Before the first touch an approval whose wait has expired can still show the action, because the page only learns the deadline from the watched question; clicking it opens the session, finds no open approval and shows the 'no longer waiting' (missed) note with the composer."
    alternatives: "Read the question's deadline into the ticket conversation view."
    why: "The old Approve behaved the same; the click sends nothing and the note says what happened. Adding the deadline to the view is a separate change."
  - chosen: "A proposal that cannot be approved on the ticket (a list of tickets, a pending run question) puts no decision; its summary line stays above the composer."
    alternatives: "Show a disabled action."
    why: "There is nothing to decide, so text is the only move; the line says why there is no action."
  - chosen: "Keep chatting is keyed by the awaiting proposal's id on both paths (the conversation proposal's proposalId before the first act, the awaiting push's proposalId after — approvalProposal holds the push only while that id is the question's) and resets when the next turn finishes (dialog.working false). The Your move Reply and the divergence notice's Discuss reply through the composer (TicketReplyContext), which sets a standing decision aside before focusing the text field."
    alternatives: "Key by the approval question id; focus the text field directly from elsewhere on the page."
    why: "A key that changes at the first act would bring the decision back the moment Keep chatting focuses the field; a direct focus finds no field while a decision stands in its place."
  - chosen: "Runs with no recorded verdict show no check section, no criteria count and no 'no verdict recorded'; spec cards show no tally; unjudged criterion lines are unmarked."
    alternatives: "A 'no verdict' placeholder; synthesising a count from the report."
    why: "The per-criterion verdict was retired on 2026-11-18 (98fa); a line about a verdict nobody records is noise."
  - chosen: "Runs stored before 98fa that DO carry recorded verdicts keep their 'N of M done criteria met' count and the 'Checked against the spec' section."
    alternatives: "Hide every old count."
    decider: operator
    why: "98fa recorded the operator's choice: 'Runs stored before keep their rows, judgement control and counts'."
  - chosen: "A run whose masters reported titles the check section 'The master's report' (meta 'reported · N follow-ups'); an unmeasured account alone still shows a red 'not measured' section."
    alternatives: "Keep the title 'Checked against the spec' for reports."
    why: "A report is not a check against the spec. Each spec section's meta already carries the spec's standing and why (RunSpecRow.verdict, e.g. a failing command); the run snapshot carries no separate build/test result field, so none is shown in the check's place."
