phase: 2026-09-23-9bb2
decisions:
  - id: 1
    what: "The declaration becomes prior art in the prompt rather than the answer."
    alternatives: "Keep the short circuit and add a check that the declared workdir still holds."
    why: >
      A check needs a key to judge by, and the only field that could serve is the one being
      corrected. A run is repeated because something changed; the round that derives is the
      thing that can notice.
  - id: 2
    what: "The declared set is read from SandboxContexts, not SandboxDiscoveries."
    alternatives: "The map the short circuit already read."
    why: >
      That map carries only each toolchain group's representative. A two-context repository
      read from it states one, the model returns one, and a completeness check would certify
      it - which is 2026-09-04-0721's defect re-armed by a check meant to prevent it. The
      mutation proof for that test is exactly this substitution.
  - id: 3
    what: "No name reconciliation in this round."
    alternatives: "Refuse a derived name that is not declared."
    why: >
      There is no key that survives the phase's own purpose: by workdir is circular, since the
      workdir is what is being corrected; by name degenerates to set equality; by language does
      not discriminate. 2026-09-23-cd28 refuses an invented name on the write path, which is
      where a stray directory would be authored.
  - id: 4
    what: "The prior art says what it is before it lists anything."
    alternatives: "Stating the components as facts about the repository."
    why: >
      A list presented as truth is a list to repeat back. The section names it as what a
      previous run CONCLUDED and asks for a derivation first, so the model has something to
      disagree with rather than something to copy.
  - id: 5
    what: "The fixture catalog gained a discovery skill."
    alternatives: "Leaving it and letting the preset fail."
    why: >
      The round now exists on the re-init path, and the fixture catalog had no skill with that
      output schema at all - the harness preset would have died on a precondition rather than
      on anything this phase decides.
