spec: 2026-11-22-7103a
decisions:
  - chosen: "The status line is the run's row: on the ticket page the StoryRow head of AttemptReport (Now, Conversation) and the Runs line, outcome = the status head in its colour, text = the clauses then '→ next'; on the run page the first line under How it ended. No separate block under the row."
    alternatives: "A new block at the top of AttemptBody under the unchanged row; a banner above Now."
    why: "The row is already the top of the run block and wraps (tk-text has no nowrap); a block under it would repeat its head one line lower. One place per run per page, and the row's words stop being the summary's first line, which was the third way of saying the outcome."
  - chosen: "Cases, head · clauses · tone, from recorded fields only: superseded 'Superseded' and series-paused 'Held while the series is paused' grey; queued 'Queued[, place n]' and resuming 'Resuming' amber; running 'Working[ on spec k of m]' amber; waiting 'Waits for your answer' blue; handed back 'Handed back' blue; ended on infrastructure 'Stopped: the sandbox or host was lost' red; success 'Delivered' ('Delivered: k of k specs' when k>1) · 'pull request opened in <repo>' / 'n pull requests opened' / 'no pull request opened' green, and 'Done' green for a run with no spec rows (scans, deploys); shortfall 'k of m specs delivered' · one clause per undelivered spec '<id>: <verdict's first sentence>' (or '<id> not delivered' without a verdict) red; failed/error 'Failed: <cause>' red with done specs as '<ids> verified, not delivered'; cancelled 'Cancelled' grey."
    alternatives: "Parse the server's summary (RunShortfall.Summary); a verify-pass clause read from run events per row; let the backend send the sentence."
    why: "Every input is a field both pages already hold, so nothing matches text and both compute the same line. The clauses read the RunSpec rows only (review cut 5): reading each row's events for a verify clause cost a store subscription per row and the verdict already carries the reason. The head already says 'k of m delivered', so a clause does not repeat 'not delivered' (review cut 9)."
  - chosen: "A failed run's cause, first that exists: the first failed spec's verdict (first sentence) → detailSentence(endDetail) → failureAct's sentence only for a specific endKind (image-untrusted, bootstrap-missing, preflight, criteria-unmet, readiness-unknown) → the summary's first line → the failed step's first line; none → 'Failed' alone. Never failureAct's generic 'Attempt n failed.'"
    alternatives: "failureAct's sentence always; the summary first."
    why: "The generic sentence names no cause and would read as one; a spec verdict is the most specific recorded fact, the summary the run's own words."
  - chosen: "The reason is the RunSpec verdict as the server wrote it, cut at its first sentence; the whole verdict opens the spec section body ('Not delivered: …'). The server's NoFinish text still says '(finish_spec)' until the parallel backend spec rewrites it; the dashboard does not strip it."
    alternatives: "Map known server texts to dashboard words; drop the reason."
    why: "Rewording a server string by matching it is a heuristic around a field that belongs to the producer; the backend spec retires that text with the tool. The line's own words never name the tool (RunStatus_AnyCase_OwnWordsNeverSayFinishSpecOrReported)."
  - chosen: "The next step is the ticket's Your move, read through one function: yourMove carries the one-open-PR review act (moved out of YourMoveBox) and its words (actLabel, the same labels the box's buttons show: 'Retry unchanged', 'Review the pull request', 'Answer the question', 'Reply below', 'Initialize the project', a link's own label); several open PRs → 'Review the pull requests'; no act → 'Nothing for you to do'. An older attempt → 'Run n is the latest'. No move (a run page without a ticket) → no '→ …'. A retriable shortfall that is the newest attempt and whose act is not Retry adds '; Retry unchanged gives <ids> another attempt'. The run page derives the move from the ticket detail useRunTicket already reads. The words name the act; the buttons stay where they are."
    alternatives: "A next-step table of its own in runStatusLine; a second Retry button on the line."
    why: "No second path: ticketState/yourMove decide the one act, so the line and the box cannot disagree. Retry is named for a shortfall because the operator's example ends on it and the box shows only the review."
  - chosen: "Removed or toned down: AttemptBody's tk-said summary line (the run's verbatim end text stays behind Your move's Why and the run page's 'The run's own words'); How it ended's outcome, said/why, stopped-at and to-do lines (folded into the status line; review and verify lines and the acts stay); the spec section meta's verdict (moved whole into the section body); 'reported' on spec cards, the check meta and VerifySummary's badge (now '1 report', '2 reports · 3 follow-ups', '· 1 account not measured'); the spec card's master's report (the check section holds it once per run block); the ended state word in RunPageHead (now the status head)."
    alternatives: "Keep them all and add the line; hide the run log on Now."
    why: "Each removed item said the same outcome in other words or another colour, which is what the operator could not read. What is kept says something the line does not: steps, verify per repository, review findings, follow-ups."
  - chosen: "Colours mean one thing: green delivered or passed, amber working, blue waits for a person, red stopped or not delivered, grey nothing to judge. A shortfall is red on both pages, in ticketDot's ended fallback (an idle ticket) and in a new 'shortfall' attempt-mark kind (red class, title 'shortfall'). The Your move box follows: needs_you blue, working amber, a cancelled head grey. A spec card's criteria count is dim. Step finding marks keep amber (a finding still open) — they state a step, not an outcome."
    alternatives: "Shortfall amber (today, the working colour); shortfall green (today in ticketDot and the marks); reuse the failed mark kind for a shortfall; a per-clause colour inside the line."
    why: "A shortfall stopped before its contract, which ticketDot's own palette calls red; green on a run that left a spec undelivered is the contradiction the operator saw. A shortfall mark of its own keeps 'failed' meaning failed. The runs list, StatusIcon, home, overview and DeliveryTimeline keep their colour: they state no next step and sit on neither page — named in scope.out, not deferred."
  - chosen: "The master's report folds under 'Master's report' (closed) through ONE component, the log's existing Doc disclosure exported from LogText.tsx, used by MasterReportText (Acceptance tab), the ticket check body and VerifySummary; several reports are labelled 'Spec n · id'."
    alternatives: "A new collapsible card; keep it open on the run page."
    why: "Doc is already the log's one-line disclosure for long documents, and its body sets the sans face the report lacks inside the log."
  - chosen: "Fix the table in BlockText and its CSS, no second renderer: BlockText maps table to a scrolling wrapper; .rl-md and .rl-doc rules leave the :is(.mock-viewer, .tk-runlog) scope; .rl-md uses the sans face; th and td get borders, padding, top alignment and overflow-wrap:break-word."
    alternatives: "Render the report through ui/Markdown (has table styles); add a table plugin."
    why: "remark-gfm already emits a real table (probed 2026-11-22). The break comes from CSS: no table rule, th missing from the global break-word list so it inherits overflow-wrap:anywhere and collapses ('Res ult'), and the log's monospace inherited. ui/Markdown is a second renderer with light-theme classes and mono tables."
  - chosen: "Before and after the finish_spec removal the line reads RunSpec status/verdict, the run status/endKind/endDetail and the PRs — none of them the tool's — and shows the server's verdict as written, whether it is today's NoFinish text or the backend spec's NoReport successor. The report count reads acceptance.reports and spec.report, which the backend keeps filling from the last reply."
    alternatives: "Wait for the backend spec; map either server text to dashboard words."
    why: "The line must read right on runs stored before and after; neither depends on finish_spec having been called, and no server wording is matched."
  - chosen: "The mock is an HTML file in the scratchpad, checked by a fresh reviewer against the invariant and done; the build goes on on its BUILD, with no wait for the operator."
    alternatives: "Publish an artifact and wait for the operator's yes."
    why: "Review cut 1: the operator wants a reviewer, not themselves, to check the mock."
  - chosen: "attemptOutcome.ts (outcomePill, attemptWords, outcomeTone) and reportWords.reportText are removed with outcomePill.test.ts; OutcomePill_Shortfall_IsBad goes from the test list, RunStoryLine_Shortfall_OutcomeIsTheStatusHeadAndToneBad and AttemptListLine_Shortfall_SameHeadAndToneAsTheStatusLine pin the same colour."
    alternatives: "Keep them, flip shortfall to bad and test a function nothing calls."
    why: "Once the row and the Runs line read the status line, nothing calls them; a second outcome vocabulary kept alive only by its test is the second path the spec removes."
  - chosen: "A handed-back run's status line carries the summary's first sentence as its clause ('Handed back · Which header?')."
    alternatives: "'Handed back' alone."
    why: "The Runs line lost the hand-back's reason otherwise (TicketAttemptsCost pinned it); the summary is the run's own words, cut at its first sentence like every other clause."
  - chosen: "Code review round (presentation): a head never ends in a full stop (the sentence adds one; StoryRow and the Runs line put a space, not ' · ', after a head that ends in its own punctuation); How it ended colours only the head (rl-status-head), the rest in --ink-2 like the ticket row; RunPageHead's state word is the line's `short` (the head before its first ': ', e.g. 'Failed', '1 of 2 specs delivered'); a check section holding one report shows it whole (MasterReport folded={false}, class rl-report), several fold as 'Spec n · id · Master's report', the Acceptance tab keeps its fold; the sans face applies only under .rl-doc-body/.rl-report, table rules stay global."
    alternatives: "Keep the trailing stop and dedupe in the sentence; colour the whole run-page line; the full head as the state word; a fold inside the check fold."
    why: "Reviewers saw a double full stop, a fully red line, a cause in the meta line, the report folded twice, and decision reasons turned sans 13px by the unscoped .rl-md rule."
  - chosen: "Runs lines and folds carry the next step: runListLines and RepeatLine read the same StatusContext (move, latest attempt, canRetry) as AttemptReport; a fold is its LAST run's status line."
    alternatives: "Next step only on the Now row; the fold's first run."
    why: "Every place that states a run's outcome states the same sentence (the invariant); the last run of a fold is the one the next step is about."
  - chosen: "Failed wording from shared end-kind words: ticketState.endCauseHead gives 'Stopped before any work: <words or the detail sentence>' (image-untrusted, bootstrap-missing, preflight, readiness-unknown with its subject) and 'Failed: the verifier of that time did not accept a criterion' (criteria-unmet), with no attempt number; failureAct builds its three 'Attempt n stopped before any work: <words>.' sentences from the same STOP_WORDS. readiness-unknown and criteria-unmet keep their box sentences."
    alternatives: "Reuse failureAct's sentence in the line (showed 'Attempt 1' inside a fold of runs 1–3)."
    why: "One set of words for the box and the line, and a fold or an older run never names a different attempt; the box's own sentences stay out of scope."
  - chosen: "States: an answered question waiting for its place reads 'Resuming[, place n]' (status waiting_for_input without pendingQuestion; the place only for the newest attempt); Your move says 'Paused with its series' (grey) for a series-paused head and 'Cancelled' (grey) for a cancelled one; ticketDot draws a cancelled last attempt grey in the idle and failed buckets; the section bar's 'needs you' is the person colour; a report-only check section is grey (SectionState 'quiet') and VerifySummary's report badge neutral; a shortfall with no spec rows reads 'Not everything was delivered' with the summary's first sentence; a multi-spec success '2 of 2 specs delivered'; an older run '→ See run n, the latest'; a not-started spec of an ended attempt 'not started, not delivered' (red)."
    alternatives: "The first build's words: 'Delivered: 2 of 2 specs', 'Run n is the latest', a green report section, a red cancel."
    why: "Each colour means one thing: a report is no verdict, a cancel and a pause are no fault, needs-you is a person's move."
  - chosen: "Retry is named only to a reader who can press it: StatusContext.canRetry is !useLacksPermission(runs.control, project) on the ticket page (useStatusContext) and the run page (RunLogView); retryAlso uses RetryUnchanged's own retriable(attempt); a move whose act is Retry gives no next step to a reader without the permission."
    alternatives: "Name Retry to everyone, as the first build did."
    why: "RetryUnchanged hides its button from a caller without runs.control; the line must not point at an act the reader cannot see."
  - chosen: "Fix-check: one separator everywhere, ' · ' between head and rest (a space after a head ending in its own punctuation), on the ticket row, the Runs line and How it ended alike (statusJoin); 'Paused with its series' is the status line's and Your move's words; a cause whose first words already say what failed ('Preflight failed: …') follows a bare 'Failed' as its first clause; stateWords' waiting fallback is 'waits for your answer' in the person colour; ticketState's cancelled view is quiet; failureAct's default names the end detail ('Attempt n failed: <detail>') before it falls back to 'Attempt n failed.'."
    alternatives: "'. ' everywhere; keep 'Failed: Preflight failed: …'; 'Held while the series is paused'."
    why: "The ticket row already used ' · ', so one join changes the fewest places; a doubled 'failed' and two names for one pause read as two states."

