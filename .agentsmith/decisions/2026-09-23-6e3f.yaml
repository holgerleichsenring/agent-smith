phase: 2026-09-23-6e3f
decisions:
  - id: 1
    what: "The choice REPLACES the composer rather than sitting above it."
    alternatives: "Keep the disabled composer and make the hint louder."
    why: >
      A disabled box beside the control that enables it still reads as a fault - which is how
      the operator read it, as something being swallowed. A box that is not there yet reads as
      a sequence.
  - id: 2
    what: "The list's select is removed, not kept as a shortcut."
    alternatives: "Leave it, since it can start a conversation on another project while one is open."
    why: >
      Two places to pick one thing is how the present state came about: the refusal was
      mid-page and its cause was in the sidebar. The interaction it served is reordered rather
      than lost - the pick is now made in the choice after clicking New, not before.
  - id: 3
    what: "The picked project is cleared in the surface's own handler, not in the hook."
    alternatives: "Clear it inside startNew, beside the dialog id and the view."
    why: >
      The hook holds no reference to the pick, which lives in the surface. Lifting it into the
      hook to reach one line would move the send path with it.
  - id: 4
    what: "The empty column distinguishes three states the project list cannot."
    alternatives: "Render the choice whenever no project is picked."
    why: >
      The list is empty while the read is in flight, after it failed, and when nothing is
      configured. Rendering a select with no options in the first two would replace one
      confusing surface with another, and a failed read leaves that null forever.
