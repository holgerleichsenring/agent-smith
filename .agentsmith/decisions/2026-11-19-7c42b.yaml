spec: 2026-11-19-7c42b
decisions:
  - chosen: "An offered draft is a decision in the composer's place with two buttons: create what it holds, or keep chatting."
    alternatives: "A File button beside the composer while text is also possible; a banner for the unoffered state."
    decider: operator
    why: "The operator: either a dialog that must be answered, or text — never both at once; the banner stayed after they had answered."
  - chosen: "The approve button names its effect by kind and count ('Create 6 tickets')."
    alternatives: "'File'."
    decider: operator
    why: "'File' reads as a file; the button should say that it creates tickets."
  - chosen: "Keep chatting is page state per proposal id and is not sent to the server."
    alternatives: "A server decision 'deferred'."
    why: "Nothing is decided; the draft stays awaiting, and a later change makes the agent offer it anew."
  - chosen: "The pane starts at 40%, resizes by a handle between 320px and 70%, remembered per browser, double-click resets."
    alternatives: "A fixed wider column."
    decider: operator
    why: "The operator asked for a wider pane they can size themselves."
  - chosen: "The ticket page keeps Approve/Discard; only its unoffered 'Not offered' line is gone."
    alternatives: "Rework the ticket card in the same spec."
    why: "The complaint was Work it out; the ticket card is its own decision surface with a bound ticket."
  - chosen: "Review: Keep chatting resets when the next turn finishes (working goes false), never during a turn; the pane's track is measured from the handle to the shell's edge, a click that moves nothing stores nothing, the CSS clamps a stored width, the arrow keys resize."
    alternatives: "Reset on the agent-entry count; measure the pane element."
    why: "Two fresh code reviews: the entry count changes from entries the page adds itself mid-turn; the pane element leaves out its margins, so keys moved it the wrong way."
