  - category: Scope
    chose: "Left for 967ab: every type whose assembly-qualified name a checkpoint stores, and every serialized member"
    reason: |
      Types: PhaseDraft, PhaseStep, PhaseFact, SpecPhase, PhaseProgress, PhaseRunState, PhaseCommandLog,
      PhaseCommandEntry, RunPhaseReviews, PhaseReviewEntry, PhaseReviewReport, PhaseFinding, PhaseAccounts
      (stored as context values; CheckpointRenames maps the names 967aa fixed, and renaming the type alone
      would write SpecDraft.PhaseId), SpecDialogPhaseView (served), the three Phase*Event records and EventType
      members (hub mirror and RunEvents.Type). Members kept because JSON or a column carries their name:
      PhaseId/Phase/Phases on PhaseAccounts, RunAccounts, SpecSet, CarriedSegment, SpecSequenceProgress,
      CheckpointCommand, DeclinedCriterion (DeclinedCriteria is a context value), RunShortfall.PhaseCount
      (context value), SetDivergence (SeededTicket is a context value), TicketRun (tool output the model
      reads), CutFindingWire, ProposalFinding, OutcomeProposalJson.Dto, RunStep/RunDecision entities, every
      served view (RunStepView, PlannedStepView, RunStatisticsView, RunSpecStatistics, RunCommandPoint,
      RunCallPoint, DeclinedCriterionView, ApprovedSetView, SpecDialogProposalPush). Every [AcceptedName]
      member. ContextKeys and CommandNames values (identifiers renamed, values byte-identical).
      PhaseCommandLogTests keeps the name of the class it tests.

  - category: Scope
    chose: "G2 and 967ad left as they are"
    reason: |
      G2: SkillExecutionPhase and everything typed by it, PhaseCost, PhaseUsage/TokenUsageTracker,
      RunVerifyPhase/RunReviewPhase/RunFinalPhase (+ RunVerifyPhaseContext(Builder)), MaxSkillsPerPhase,
      GuardErrorKind.WriteForbiddenInPhase, CallScope/LLM/tool event Phase, WorkerRequest/WorkerCallIdentity
      Phase, RunEvent/RunLlmCall Phase columns, RunCostSummary/RepoCost Phases, KubernetesPodWatcher, and the
      tool-host/cost test classes (GetTools_PlanPhase_*, AssertWritable_*Phase_*, ...). 967ad: prompt text,
      tracker/PR prose, failure messages and test fixtures that quote them; the template tokens MaxPhases and
      the derivation key "phases". Dual-reader tests (tests/AgentSmith.Tests/SpecNaming, AcceptedNamesTests)
      and CheckpointRenames keep the phase names on purpose.

  - category: Implementation
    chose: "Comments say spec where they meant the spec; label words, persisted names and G2 lines keep phase"
    reason: |
      The lexer-scoped pass rewrote phase/phases in comments, skipping any line naming a G2 stage, a stored
      name (phase_review:, phaseId, "phases", phase-parent:, `phase:`) or a file whose symbols are G2.
      Reverted by hand where the word is the literal tracker label ("the phase word a person types"), the
      phase-gate hook, and verify-phase (the RunVerifyPhase stage). A comment naming a kept identifier keeps it.

  - category: TradeOff
    chose: "Tuple element names and record parameter docs fixed by hand"
    reason: |
      Tuple element fields have no stable symbol across tuple types, so the Roslyn pass skipped them; the five
      architecture-test tuples (string PhaseId) were renamed by hand, SeriesJoinOrder's (p.PhaseId, i) follows
      the kept SpecPhase.PhaseId. Planned specs 443a, 60ca, 967ad and 967af cited moved files; their evidence
      paths were re-grounded (lines unchanged) because SpecEvidenceRuleTests requires it.

  - category: Scope
    chose: "Docs, CLAUDE.md and the gate are 967af's"
    reason: |
      CLAUDE.md still names PhaseNameRuleTests, PhaseRecordLengthRatchetTests,
      PhaseRecord_EveryPointer_ResolvesToAFile, PhaseIdFactory.Slug and WritePhaseRecordHandler (now
      SpecNameRuleTests, SpecRecordLengthRatchetTests, SpecRecord_EveryPointer_ResolvesToAFile,
      SpecIdFactory.Slug, WriteSpecRecordHandler); docs/ name the step classes by their command names, which
      did not change. .claude/ references none of the renamed symbols.
