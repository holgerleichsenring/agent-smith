# yaml-language-server: $schema=../decision.schema.json
spec: 2026-10-12-967ac

decisions:
  - category: Tooling
    chose: "Symbols renamed by a Roslyn pass that binds every identifier token, not by text replacement"
    over: "Word-boundary sed over Phase"
    reason: |
      An MSBuildWorkspace pass resolved each identifier token containing "phase" (code, crefs, nameof, named
      arguments) to its symbol, decided per symbol, wrote all edits at once, then re-bound every renamed token
      and every token spelled like a new name in the edited solution: 0 binding changes, 0 compile errors
      before writing. A text pass cannot tell PhaseDraft.PhaseId (persisted) from CutFinding.PhaseId (not),
      nor a local that would shadow an existing spec. Comments and log templates went through a second,
      lexer-scoped pass; every changed string literal was diffed against HEAD by token (54, all intended).

