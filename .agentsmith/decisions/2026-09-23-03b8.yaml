phase: 2026-09-23-03b8
decisions:
  - id: 1
    what: "The task joins the tool-bearing set in the same commit as the binding."
    alternatives: "Bind first and add the task to the set afterwards."
    why: >
      A task outside that set returns before the function-invocation middleware, so the rounds
      would hand the model a tool list it could never execute: discovery would read nothing and
      the round would write nothing. The two changes are one change.
  - id: 2
    what: "Both rounds move together."
    alternatives: "Bind discovery first and the writing round later."
    why: >
      They are one operation from an operator's side - find the components, write their
      contexts - and splitting them would leave init half on one model and half on another,
      with no way to read which produced what.
  - id: 3
    what: "Only the test driving the REAL factory proves the tool loop."
    alternatives: "Assert the requested task on a recording fake."
    why: >
      A fake returns the same client for every task and never applies the function-invocation
      middleware, so removing the task from the set left the fake-based assertions green. The
      mutation proof showed it: model and ceiling still matched, and only the assertion against
      the production factory went red.
  - id: 4
    what: "The architecture document points at the list instead of restating it."
    alternatives: "Correcting its list of tool-bearing tasks."
    why: >
      It had already drifted twice - it omitted reasoning and named a task that does not exist
      in the enum - which is what a restated list does. A pointer cannot drift.
