# yaml-language-server: $schema=https://raw.githubusercontent.com/holger/ccs/main/context.schema.json
# ============================================================================
# .context.yaml — Compact Context Specification (CCS)
# ============================================================================
# Drop this file in your repo root. It tells any AI assistant everything
# it needs to know about your project in ~1,000 tokens instead of ~40,000.
#
# Fill in what applies. Delete what doesn't. Keep it short.
#
# ONE TEST decides whether a field belongs here (2026-08-26-04b6):
#   JUDGEMENT — somebody decided it (purpose, limits, behavior). Write it.
#   MECHANISM — the orchestrator acts on it (workdir, lang, image). Write it.
#   READING   — a copy of something this repository still states for itself: the
#               build file's frameworks and versions, the workflow's CI platform,
#               the folder names as layers. It is worthless the day it is written
#               and wrong soon after, and nothing can tell which copy is true.
#               Leave it out. The writer discards these; older files keep them.
# ============================================================================

meta:
  type: [crud, api, ui]            # pick 1-3 from the list below
  purpose: "One sentence. What it does, for whom."
  workdir: "."                     # REQUIRED — sub-tree this context covers; "." = repo root

  # Archetypes (pick what fits):
  #   crud      – Records, transactions, data management
  #   api       – Request/Response (REST, GraphQL, gRPC)
  #   pipeline  – Chainable steps, sequential processing
  #   worker    – Scheduled/periodic background jobs
  #   event     – Async, message/event-driven, reactive
  #   stream    – Continuous data flow processing
  #   agent     – Autonomous, goal-driven, decision-making
  #   ui        – User-facing frontend
  #   platform  – Infrastructure/services for other systems
  #   rules     – Rule engine, policy evaluation, decision automation

# --- What is it built with? ------------------------------------------------

stack:
  lang: C#
  # REQUIRED whenever a stack block is present: the exact toolchain image whose
  # runtime can BOTH build and run this stack's tests, from a registry the
  # operator trusts. It carries git — the repository is cloned inside it.
  image: mcr.microsoft.com/dotnet/sdk:8.0
  # Only for a build that DEMONSTRABLY needs more than the default:
  # resources: { cpu_request: 500m, cpu_limit: "2", memory_request: 1Gi, memory_limit: 4Gi }

  # The frameworks, packages, test tools and CI platform are NOT listed here.
  # Your build file and your workflow already state them, and a second copy can
  # only disagree with the first.

# --- What proves a change in this repository? -------------------------------

# The commands that turn an edit into a verdict, in the order they run. They are
# yours: take them from the pipeline this repository already has rather than
# inventing them here, because the one your CI runs is the one that means
# something. A run executes exactly these, ahead of anything the analyzer infers.
#
# A stage names itself, carries one shell command, and may name a path it needs
# present — where that path is absent the stage is skipped and says so, so one
# declaration serves repositories of different shapes.
#
# verify:
#   - label: build
#     command: dotnet build MySolution.sln
#   - label: test
#     command: dotnet test MySolution.sln
#   - label: lint
#     command: npm run lint
#     when_present: package.json

# Where those commands came from, and a hash of it. A run re-reads these files and says
# once — without changing what it runs — that the block above may be out of date when
# they no longer match. The hash is written by the framework, not by hand.
#
# What it cannot see: the pipeline FILE moving is visible here, the TARGET moving is not.
# A cluster id, a schema name or a service connection can change under a byte-identical
# file, and only the stage itself finds that out, by going red.
#
# verify_derived_from:
#   files:
#     - azure-pipelines.yml
#     - Makefile
# --- Does the target environment answer? ------------------------------------

# One command that asks whether the environment this repository's work depends on
# is reachable and willing — a warehouse workspace, a cluster, an integration API.
# It runs before the coding agent starts, so a wrong or absent credential surfaces
# as infrastructure instead of as an agent that cannot build. A refusal names the
# target, the command and the exit code and carries no captured output: the tail
# is in the run log alone, because output can hold a credential nothing here can
# mask. Reference credentials by NAME; never write a value into this file. Omit
# the block when nothing outside the repository has to answer.
#
# probe:
#   target: the warehouse dev workspace
#   command: sf org display --target-org devhub

# --- How is the code organized? --------------------------------------------

# The architecture block is a READING: a style, a pattern list and a layer list
# are what somebody read off this tree, not what anybody decided. If you DID
# decide a boundary, it belongs in a decision record, where the reason lives too.

# --- What does the system DO? ----------------------------------------------
# Include only the sections that apply to your project.
# The key under "behavior" is your archetype — use the same word from meta.type.
# Uncomment `behavior:` together with at least one section under it — an empty
# `behavior:` is not a block, it is null, and the schema rejects it.

# behavior:

  # --- API endpoints (for: api, crud) ---
  # api:
  #   style: REST
  #   auth: [JWT]
  #   groups:
  #     users:
  #       - "GET    /api/users"
  #       - "POST   /api/users"
  #     orders:
  #       - "GET    /api/orders/{id}"
  #       - "POST   /api/orders"

  # --- Pipelines (for: pipeline, agent) ---
  # pipeline:
  #   process-order:
  #     trigger: [cli, webhook]
  #     steps: [Validate, Enrich, Process, Notify]
  #     error: stop-on-first-failure

  # --- Background workers (for: worker) ---
  # worker:
  #   nightly-sync:
  #     schedule: "daily 02:00"
  #     does: "Sync data from external system"

  # --- Event listeners (for: event, stream) ---
  # listener:
  #   order-placed:
  #     on: "queue:orders/placed"
  #     does: "Triggers fulfillment workflow"
  #     protocol: RabbitMQ

  # --- Frontend (for: ui) ---
  # ui:
  #   type: SPA
  #   framework: React
  #   pages: [dashboard, detail-view, settings, admin]

# --- Coding standards (compact form) --------------------------------------

quality:
  lang: english-only
  limits: { method-lines: 20, class-lines: 120, types-per-file: 1 }
  naming:
    classes: PascalCase
    params: camelCase
    fields: _camelCase
    interfaces: I-prefix
    async: Async-suffix
  testing: { style: AAA, naming: "{Method}_{Scenario}_{Expected}" }
  # Add language-specific rules you decided on (not flags your build file sets):
  # csharp: [file-scoped-ns, records-for-VOs, sealed-default]
  # react: [functional-components, hooks-only]

# --- External systems and storage -----------------------------------------

# integrations:
#   SAP-HR:     { type: inbound, protocol: RFC, does: "Employee master data" }
#   Stripe:     { type: outbound, protocol: REST, does: "Payment processing" }
#   Azure-Blob: { type: storage, does: "Document archive" }

# data:
#   primary:
#     engine: SQL-Server
#     orm: EF-Core
#     migrations: code-first
#     key-entities: [User, Order, Product, Invoice]
#   cache:
#     engine: Redis
#     pattern: cache-aside

# --- Where are we? --------------------------------------------------------

state:
  done:
    v1.0: "Core functionality — one-line summary"
    # v2.0: "Next milestone summary"
  active:
    v1.1:
      goal: "What you're building right now"
      components: [ComponentA, ComponentB]
      # deps: [v1.0-something]
      # blocked-by: "Optional — what's in the way"
  planned:
    v2.0: "Next big thing — one line"

# --- Key design decisions (optional) --------------------------------------

# decisions:
#   - id: ADR-001
#     title: "Chose X over Y"
#     reason: "Because Z"
