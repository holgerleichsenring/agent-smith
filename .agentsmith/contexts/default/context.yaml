    2026-09-08-a049: "A SHORTFALL'S RECORD SAYS SO; AN ENTRY-SATISFIED PHASE NAMES ITS HEAD (backend). Sliced out of p0439: result.md is written before the delivery is decided, so it reads failed for a delivered shortfall; SelectPhase records an already-satisfied phase done with no sandbox in hand, so no verified head is named. -> .agentsmith/phases/planned/2026-09-08-a049-shortfall-record-entry-heads.yaml"
    2026-09-07-e9a2: "THE PRODUCT'S PHASE SLUG OBEYS THE REPOSITORY RULE (spec derivation + phase record writer). Sliced out of 2026-09-07-4e6a: PhaseIdFactory.Slug truncates a goal to 50 chars with no word bound, and WritePhaseRecordHandler.Slug mints a SECOND slug at 60 that ignores SpecPhase.Slug — so a customer repository still gets sentence names. Bound the generator by words, write the record under the derived slug, ask the derivation for a label. -> .agentsmith/phases/planned/2026-09-07-e9a2-phase-slug-product-bound.yaml"
    p0429b: "A SCAN REPORTS BACK TO THE TICKET IT CAME FROM (backend). Sliced out of p0429a: the coverage account the gate has judged since p0421 renders on three surfaces, but a scan preset reaches NEITHER the ticket comment nor the PR body — both end at DeliverFindings + WriteRunResult, and only the failure path ever comments on a scan's ticket. Giving a scan its own reporting surface is a delivery feature with its own questions. -> .agentsmith/phases/planned/p0429b-scan-reports-to-ticket.yaml"
    p0423c: "A PHASE ANSWERS FOR ITS OWN CRITERIA (backend + dashboard). Sliced out of p0423b, which wanted criteria PER PHASE: acceptance is a single column on the run row today, so there is no per-phase criteria set to read, and splitting it by text overlap or ordering would be a heuristic around a missing field. p0393a's accounting already decides the segment-to-phase mapping; nothing persists it. The field IS the fix. -> .agentsmith/phases/planned/p0423c-account-per-phase-criteria.yaml"
    p0392a: "SAVING NEVER OVERWRITES WHAT IT CANNOT SEE (server + dashboard). p0392 closed the field gap for trackers and connections and measured what is left: repos, project blocks, agent knobs, pipeline_triggers (no CRUD at all) and twelve settings singletons. The remainder is a DIFFERENT defect: a TS shape omitting a backend field sends that field's DEFAULT back on save, so opening a section and pressing save destroys whatever the CLI, an import or an older UI had configured — silently. That is data loss with a save button on it, not a missing input. So the fix is partial-write safety (absent means unchanged, or refuse an incomplete document) as well as the missing fields; declaring the fields alone would close today's instances and leave the mechanism that makes the next one. -> .agentsmith/phases/planned/p0392a-saving-never-overwrites-what-it-cannot-see.yaml"
    p0313a: "MASTER EVALS (skills + backend). Sliced out of p0313, whose eval step named the p0309 replay harness — which is still planned, evals/ does not exist, and scenario files with no runner are a done-criterion nobody can check. Operator ruling: the extra work goes after, not into, p0313. -> .agentsmith/phases/planned/p0313a-master-evals.yaml"
    p0382: "RESUME FAILED RUN FROM THE UI (server + dashboard). The failure paths that still hold the live PipelineContext (sandbox-vanished/timeout in ExecutePipelineUseCase, fatal step failure in PipelineExecutor) persist the p0327 checkpoint envelope (kind=failure, no question) BEFORE finalize; POST /api/runs/{runId}/resume + a Resume button on a failed run re-enqueue the SAME run row via RunResumer at its pipeline cursor (fresh cattle sandboxes on the existing run branch with p0360 checkpoint commits) and move the ticket failed->open. Failed runs only (cancels stay deliberate aborts), never auto-resumed, 72h expiry, fresh re-trigger supersedes. Operator decision: the ledger seed stays ADVISORY — a template, not a contract; no master-side locking. -> .agentsmith/phases/planned/p0382-resume-failed-run-from-ui.yaml"
    p0371: "DEPENDENCY-VERSION DIAGNOSIS (skills coding-agent-master + optional backend nudge). Root cause of the failed library migration (verified by rebuilding the output locally): the master wrote correct code but pinned a shared messaging package at the WRONG version (a needed interface type exists only from a later version) + invented a namespace, then spent ~65 min EDITING CODE around the missing type (CS0246 x24) instead of forming 'type-not-found => wrong/missing package VERSION => check the feed/ticket version'. The ticket's stated version was itself stale, so blind ticket-obedience also fails. Fix = a PROMPT behaviour: on type/namespace-not-found, dependency-first (is the owning package referenced? does its pinned version actually contain the type? verify against the feed, not memory); apply explicit ticket dependency values precisely AND verify; bound the flail (few edits on the same unresolved symbol -> diagnose dependency or emit honest blocked). NOT shipped as done — a prompt-behaviour change is only real once LIVE-validated by a re-run of the migration ticket (operator's acceptance test). Cost of the flail is already bounded by p0365 (empty-pass) + p0368 (ledger); this attacks the cause. -> .agentsmith/phases/planned/p0371-dependency-version-diagnosis.yaml"
    p0342: "MCP TOOL INTEGRATION (backend + dashboard + skills). Let a coding run call the tools of EXTERNAL MCP servers (Jira/GitHub/DB/filesystem MCP) allow-listed for its project — agent-smith has NO MCP today (grep-verified: no client, no server, p0166 unbuilt; the studio's mcp_servers entity is a catalog nothing consumes). Pinned to ModelContextProtocol.CORE 1.1.0 — forced, not preferred: it is the last version depending on M.E.AI.Abstractions 10.3.0, our exact p0185 pin. McpClientTool derives from M.E.AI AIFunction, so tools drop into ComposeMasterTools with no adapter. Remote SSE/streamable-HTTP first (stdio -> p0342b: spawned-orchestrator pod would need the server binary baked in). TRUST via allow-list in the type system: a run sees only its project's referenced servers, unlisted refs rejected at resolve; MCP tools are run_command-class capabilities. EVERY master surface (coding/scan/spec-dialog/sub-agents) — a feature only some skills reach is not a capability; the master-TYPE gate is REPLACED by a PIPELINE CATEGORY axis (mcp_servers.*.pipelines multi-select over PipelinePresets.Names, empty = all, compared via Canonical() so an alias cannot silently drop a server), so the effective set = project allow-list INTERSECT pipeline category INTERSECT per-server tool allow-list. Fail-open on an unreachable server (log + proceed, like the web surface); external tool names namespaced server/tool so they can't shadow a built-in. DISCOVERY IS TWO LAYERS: the tool array lets the model CALL, a rendered {McpToolsSection} block (p0356 toolchain-statement pattern, only servers that actually mounted) lets it PLAN — carried through as a skills release + embedded-pin bump, not deferred. Transport becomes a closed enum served on /api/config/capabilities and rendered as a select, replacing the studio's free-text field and its hardcoded 'http' default. -> .agentsmith/phases/planned/p0342-mcp-tool-integration.yaml"
