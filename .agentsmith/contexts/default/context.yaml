# yaml-language-server: $schema=../../context.schema.json
meta:
  project: agent-smith
  version: 1.0.0
  type: [agent, pipeline]
  purpose: "Self-hosted AI orchestration framework: code, legal, security, workflows."
  workdir: "."

methodology:
  version: "2.1.0"

stack:
  runtime: .NET 10
  lang: C#
  # 2026-08-25-c9c7 requires it; every csproj here targets net10.0 and every
  # Dockerfile builds on this exact tag, so it is the image that can build AND
  # test this stack. Without it the sandbox fell back to the language table's
  # .NET 9 SDK, which cannot build net10.0 at all.
  image: mcr.microsoft.com/dotnet/sdk:10.0
  infra: [Docker, K8s, Redis]
  testing: [xUnit, Moq, FluentAssertions]
  sdks: [Anthropic, OpenAI, Azure.AI.OpenAI, Google-Gemini, Octokit, LibGit2Sharp, YamlDotNet]

arch:
  style: [CleanArch]
  patterns: [Command/Handler, Pipeline, Factory, Strategy, Adapter]
  layers:
    - Domain        # entities, value objects — no deps
    - Contracts   # interfaces, DTOs, config models
    - Application   # handlers, pipeline executor, use cases
    - Infrastructure # AI providers, git, tickets, Redis bus
    - Cli           # CLI entry point, DI wiring
    - Server        # Slack gateway, job spawning, intent routing

behavior:
  pipelines:
    fix-bug:
      trigger: [cli, slack, webhook]
      steps: [FetchTicket, CheckoutSource, BootstrapProject, LoadCodeMap,
              LoadCodingPrinciples, LoadContext, AnalyzeCode, Triage, GeneratePlan,
              Approve, AgenticExecute, Test, WriteRunResult, CommitAndPR]
      error: stop-on-first-failure
    security-scan:
      trigger: [cli, slack, webhook]
      steps: [CheckoutSource, BootstrapProject, LoadCodingPrinciples, AnalyzeCode,
              Triage, ConvergenceCheck, CompileDiscussion, DeliverOutput]
    mad-discussion:
      trigger: [cli, slack]
      steps: [FetchTicket, CheckoutSource, BootstrapProject, LoadContext,
              Triage, ConvergenceCheck, CompileDiscussion, WriteRunResult, CommitAndPR]
    legal-analysis:
      trigger: [cli, slack, inbox-polling]
      steps: [AcquireSource, BootstrapDocument, LoadCodingPrinciples,
              Triage, ConvergenceCheck, CompileDiscussion, DeliverOutput]

quality:
  lang: english-only
  limits: { method-lines: 20, class-lines: 120, types-per-file: 1 }
  principles: [SOLID, DRY, GuardClauses, FailFast]
  csharp: [file-scoped-ns, sealed-default, primary-constructors, records-for-DTOs]
  naming:
    classes: PascalCase
    booleans: Is/Has/Can-prefix
    async: Async-suffix
    fields: _camelCase
    interfaces: I-prefix
  testing: { style: AAA, naming: "{Method}_{Scenario}_{Expected}" }

integrations:
  AI:     { type: outbound, providers: [Claude, OpenAI, Azure-OpenAI, Gemini, Ollama] }
  Git:    { type: bidirectional, protocol: SSH/HTTPS, does: "LibGit2Sharp clone/branch/commit/push" }
  GitHub: { type: bidirectional, does: "Issues + PRs via Octokit" }
  GitLab: { type: bidirectional, does: "Issues + MRs via REST" }
  Azure:  { type: bidirectional, does: "Work items + Repos via DevOps SDK" }
  Jira:   { type: bidirectional, does: "Tickets via REST v3, webhook trigger (assignee+label+status gate, comment re-trigger, done_status transition)" }
  Slack:  { type: bidirectional, does: "Chat commands + progress via Events API" }
  Redis:  { type: bidirectional, does: "Job queue + progress pub/sub" }

state:
  done:
    2026-09-23-8d4d: "The embedded skills pin moves to the release carrying the corrected discovery example, so the system half of that prompt stops contradicting the user half 7868a fixed. A server mounting no skills reads this bundle. -> .agentsmith/phases/done/2026-09-23-8d4d-skills-pin-carries-the-fix.yaml"
    2026-09-23-2c60: "A server whose configuration declares no auth block died at startup: the sign-in check takes that block as a constructor argument, and ActivatorUtilities cannot match a null to a parameter. The absent block is the state the check exists to report. -> .agentsmith/phases/done/2026-09-23-2c60-preflight-survives-no-auth.yaml"
    2026-09-23-03b8: "Both bootstrap rounds now call the context-generation role, which joins the tool-bearing set in the same commit because a task outside it would leave them reading and writing nothing. Unset still resolves to primary. Four documents stop calling the role cheap, small or tool-less. -> .agentsmith/phases/done/2026-09-23-03b8-bootstrap-rounds-bind-the-role.yaml"
    2026-09-23-6e3f: "A dialog with nothing open asks for its project in the middle of the page, and that is the only place it asks - the sidebar select is gone. The composer appears after the pick rather than refusing a message from a control elsewhere. A read in flight, a failed read and no configured project each say so. -> .agentsmith/phases/done/2026-09-23-6e3f-dialog-opens-on-the-choice.yaml"
    2026-09-23-6698: "A repo-name lookup against the sandbox dictionary hit in one run shape of four; the other three took an arbitrary sandbox - another repo tree, or another toolchain of its own. Both bootstrap rounds now ask the ownership test the repository already had, the round by repo AND context. -> .agentsmith/phases/done/2026-09-23-6698-sandbox-resolution-uses-the-index.yaml"
    2026-09-23-e848: "Four factories each decided which tasks get a tool loop and two were wrong: a reasoning call took tools in production and none under replay or in the harness, so a recorded run could pass while what it stood for would not. One readable list now, and a test that names a factory disagreeing with it. -> .agentsmith/phases/done/2026-09-23-e848-tool-loop-one-list.yaml"
    2026-09-23-7868b: "The context-generation role is optional and resolves to primary, and the Studio stops pre-filling it. Four readers took their reasoning neighbour conditional form and the capabilities descriptor agrees. Nothing requests the task, so no run changes. -> .agentsmith/phases/done/2026-09-23-7868b-context-role-becomes-optional.yaml"
    2026-09-23-7868a: "Ten texts told the model a workdir follows from the stack COUNT - four saying single-component, six saying single-stack, including the write tool description that governs what lands in a repository context.yaml. Each now says the field is the sub-tree the source occupies, read off the tree. -> .agentsmith/phases/done/2026-09-23-7868a-discovery-workdir-is-looked-up.yaml"
    2026-09-23-35b8: "The heading instruction stops naming English as the thing to avoid: the minted-subject prompt named one language, and it was the one to steer away from. A German conversation had been headed in Spanish. -> .agentsmith/phases/done/2026-09-23-35b8-subject-language-is-told.yaml"
    2026-09-23-2446: "THE SANDBOX HOLD WINDOW JOINS THE PROJECT FORM AS THE SIXTH SCALAR, READ LIVE (shared chain in contracts, loader read, environment provenance, round trip). The placeholder is the window the next reaper scan will use, because this effect is live where the other five are frozen; an unnamed provenance now fails a test. -> .agentsmith/phases/done/2026-09-23-2446-project-sandbox-hold-control.yaml"
    2026-09-23-493a: "The phase record is an index again: 273 entries over the 400-character cap brought under it (149 derived from their spec's goal the way the product composes the line, 124 compressed by hand keeping any fact the spec lacked), 81 spec goals shortened to one sentence, and the length baseline emptied. -> .agentsmith/phases/done/2026-09-23-493a-record-entries-fit-the-cap.yaml"
    2026-09-22-6968: "A PROJECT'S FIVE SCALAR SANDBOX OVERRIDES ARE EDITABLE, EACH SHOWING WHAT CLEARING IT RESTORES (studio projection + patch guard, counterfactual inherited projection, sixth form tab). The resolution pass run against an emptied block; an absent block is left alone, a sent one clears by null. -> .agentsmith/phases/done/2026-09-22-6968-project-sandbox-settings-tab.yaml"
    2026-09-22-6c46: "THE THREE STRUCTURED SANDBOX OVERRIDES JOIN THE PROJECT FORM, EACH ANSWERING INHERITANCE ITS OWN WAY: cpu/memory names the pipeline layer that would answer and is all-or-nothing, images inherit PER KEY from the code table, secrets inherit nothing and edit names only. -> .agentsmith/phases/done/2026-09-22-6c46-project-sandbox-structured-overrides.yaml"
    2026-09-22-3f7c: "A TEST SAYS WHAT IT WAITS FOR, NOT HOW LONG (TestWaits vocabulary, twenty-one test files, wall-clock ratchet). Deadlines of 1s to 120s are gone, each a latency claim nobody meant: a signal is awaited, a state polled, a negative window counted in drain passes. One hang ceiling; nine files keep the clock as subject. -> .agentsmith/phases/done/2026-09-22-3f7c-test-waits-without-deadlines.yaml"
    2026-09-22-7c41a: "A PARKED RUN RESUMES ON THE CAP IT WAS SIZED TO AND THE SPEND IT MADE (prologue recompute, checkpoint carrier, six cap readers). The tier crosses the park and the cap is recomputed as configuration-now raised to it; a spend snapshot seeds the tracker, and every reader that acts on the cap names it. -> .agentsmith/phases/done/2026-09-22-7c41a-budget-cap-survives-the-resume.yaml"
    2026-09-22-7c41c: "A PARKED RUN WHOSE RELAUNCH IS UNDER WAY SHOWS ITS PLACE, NOT A QUESTION (queue-place gate, resume sweeper, overview row, run page, story spine). The place the queue already holds, unioned with the launcher's lease so the two overlap; a park with neither is unchanged. -> .agentsmith/phases/done/2026-09-22-7c41c-surface-queue-place-when-waiting.yaml"
    2026-09-22-7c41b: "A PARK THE TRACKER REFUSED HOLDS ITS TICKET INSTEAD OF RE-RUNNING IT (both parks of the coding preset, the poster, the report). A refusal or a missing transition records the fact naming the parking status; a landed park clears it; an inexpressible status records nothing; no line claims a park that did not happen. -> .agentsmith/phases/done/2026-09-22-7c41b-park-records-a-refused-move.yaml"
    2026-09-22-9519: "A FILING CAN BE WITHDRAWN (ticket port + spec-dialog tool + filed pane). Filing was a one-way door: a ticket that routed nowhere sat on the board forever. The close member now ANSWERS in all four trackers, a lease AND any run row refuse, the record follows the tracker, and the pane learns by a ticket-keyed nudge. -> .agentsmith/phases/done/2026-09-22-9519-filing-closes-what-never-routed.yaml"
    2026-09-21-f237c: "THE PANEL IS ONE RECENTS LIST (dashboard). Four uneven day headings under a second heading, fifty rows, one truncated line in a 220px track. One Recents heading, twenty rows plus the open one, a relative last-active per row, a 300px track paid by the exchange, a two-line clamp. The array behind the slice stays whole. -> .agentsmith/phases/done/2026-09-21-f237c-dialog-column-is-recents.yaml"
    2026-09-21-f237b: "EVERY CONVERSATION HAS A PAGE AND AN ADDRESS (dashboard route + surface address + list limit). Opening one was a hook callback queueing a resume until the hub joined; the address now carries session AND dialog id. The list clamps a limit and answers a counted total; the page carries the delete the panel alone had. -> .agentsmith/phases/done/2026-09-21-f237b-dialog-conversations-page.yaml"
    2026-09-21-f237a: "A ROW SAYS WHAT IT IS ABOUT (list + row + list-read predicate). 4b0af's subject reached the session view only; the column truncates. Subject beside Title, row prefers subject, delete prefers the written line. The predicate gains a second way to be SATISFIED, ending the forever-poll on a fence-opened conversation. -> .agentsmith/phases/done/2026-09-21-f237a-dialog-row-says-the-subject.yaml"
    2026-09-22-6ff3: "PHASE COMMITS WORK AGAIN (phase gate's hook tests). The gate exports PHASE_GATE_SELFTEST so a gate the tests drive skips the hook-test step; the suite's environment helper passed it on, so every spawned gate skipped it and the four tests whose subject IS that step failed under the gate. Stripped beside CLAUDE_PROJECT_DIR. -> .agentsmith/phases/done/2026-09-22-6ff3-gate-selftest-not-inherited.yaml"
    2026-09-22-deda: "A DESIGN TURN IN A CONVERSATION THAT FILED IS TOLD IT CANNOT CHANGE WHAT WAS FILED (per-turn framework contract, design prompt). Read off the conversation's kept filing turn, not the outcome type a failed turn, a notice and a refusal all share, so it reaches every turn kind; it states a capability and names no ticket. -> .agentsmith/phases/done/2026-09-22-deda-turn-contract-names-filed-work.yaml"
    2026-09-22-4d17: "A FILED TICKET STOPS NAMING THE CONVERSATION AS WHERE ITS SPEC IS CHANGED (specification pointer, markdown comment, test reason). Nothing re-opens an approved record from a conversation and the loader has no caller, so the clause sent its reader nowhere; WHICH conversation approved the cut stays, as provenance. -> .agentsmith/phases/done/2026-09-22-4d17-ticket-stops-naming-the-conversation.yaml"
    2026-09-22-b41d: "A READ-ONLY SOURCE SCOPE CLONES ONE BRANCH AT ONE COMMIT (scope clone step, materialiser ladder). A design turn paid a whole history for four reads that cannot ask for one; the run's clone is unchanged. A fetch that lands nothing asks again with depth and takes FETCH_HEAD, so a branch is not a missing revision. -> .agentsmith/phases/done/2026-09-22-b41d-scope-clone-is-shallow.yaml"
    2026-09-22-5891: "A DESIGN TURN FANS OUT, READ-ONLY AND BOUNDED (master surface + child ceiling). Composed like any master up to the spawn block, excluded BY NAME from the escalation valve and the ledger; its own count builds its OWN budget (the injected one is frozen); children drop ask_human + remember and run under a dialog ceiling. -> .agentsmith/phases/done/2026-09-22-5891-dialog-sub-agents-bounded.yaml"
    2026-09-22-2a86: "THE PAGE STOPS TYPING COMMANDS AT ITS OWN SERVER (resume route, parser, ownership, dashboard list and button). The resume is a route checking the TARGET dialog's owner before the move closes it — that check lived in the parsed text; the list, resume and fork spellings are gone, the opening type stays for the resolver. -> .agentsmith/phases/done/2026-09-22-2a86-page-stops-typing-commands.yaml"
    2026-09-22-476a: "A BACKGROUND DISPATCH DISPOSES ITS SCOPE ASYNCHRONOUSLY (six endpoint dispatch sites + a rule over Task.Run). A pipeline's sandbox coordinator is transient and async-only, so a synchronous scope threw after every reply was written and abandoned the rest of the disposal. -> .agentsmith/phases/done/2026-09-22-476a-dispatch-scope-disposes-async.yaml"
    2026-09-22-46ef: "A SOURCE SCOPE REFUSES A SHELL, NOT A PROCESS (scope guard, program allowance, write policy, file search, HTTP tool, design surface). Served programs are an allowance of three; every operand is server-shaped, so a root cannot be read as find's expression; writes need a declared prefix, and none is declared. -> .agentsmith/phases/done/2026-09-22-46ef-scope-refuses-a-shell.yaml"
    2026-09-22-355b: "A CONFIRMATION OFFERS THE OTHER SHAPES THE PROPOSAL COULD TAKE (outcome confirmer, the card and both chat approval builders, edit reload). Derived from the kind, colon-free, beside approve and reject; a pick is the edit note, and the note now travels as a value so a button answer is not a byte-identical re-run. -> .agentsmith/phases/done/2026-09-22-355b-confirmation-offers-other-shapes.yaml"
    2026-09-21-9ae2: "THE GATE READS GIT'S GLOBAL OPTIONS (phase-gate command detection, tree resolution, hook self-test). `git -C <tree> commit`, the form a subagent writes, matched nothing: no checks, no ledger line, nothing telling a skip from a pass. Options accepted before the subcommand; the hook's own 44 tests run first. -> .agentsmith/phases/done/2026-09-21-9ae2-gate-reads-git-global-options.yaml"
    2026-09-21-291b: "AN ENFORCING INSTALLATION NOBODY IS SIGNED INTO STOPS MISREPORTING ITSELF (banner evidence, mission-control refusal, sign-in gate). One directory on its v1 and v2 endpoints is not two; a refused caller is not an absent server; enforced plus no token redirects once per tab, never over a sign-out or an expiry. -> .agentsmith/phases/done/2026-09-21-291b-auth-enforced-signed-out.yaml"
    2026-09-21-5c17: "A WAITING RUN NAMES THE GATE THAT REFUSED IT (spawn funnel reservation, capacity deferral, init admission, both probes). The probe's own words are carried, the ledger's one sentence is written once for both doors, bound and usage lead, and the Kubernetes quota object and namespace go to the log instead of the row. -> .agentsmith/phases/done/2026-09-21-5c17-admission-refusal-is-carried-once.yaml"
    2026-09-21-1fa0: "AN OPERATOR RETRY MOVES BEFORE IT CLEARS (retry service, run-control endpoint, the four ticket providers). The port answers whether the ticket MOVED; the retry transitions first and drops the hold only on a move that landed, so a refusal keeps the hold and says so. -> .agentsmith/phases/done/2026-09-21-1fa0-retry-moves-before-it-clears.yaml"
    2026-09-21-de50: "A COLD START RECONCILES AN UNFINISHED RUN'S UNREAD TERMINAL TAIL (broadcaster cold start, unfinished-run anchor). The anchor lands ON the tail, so the drain reads past the one event the row never saw; a non-waiting terminal there is reconciled, never delivered. -> .agentsmith/phases/done/2026-09-21-de50-cold-start-reconciles-the-tail.yaml"
    2026-09-21-77d6: "A TICKET THE CLAIM WOULD REFUSE IS REFUSED, NOT QUEUED (spawn funnel, claim refusals, deferral write side). One seam asks the config pre-check and the unmoved gate; the funnel asks it immediately before deferring, so no waiting run is minted for a ticket the pump would drop every poll. -> .agentsmith/phases/done/2026-09-21-77d6-queue-refuses-before-it-defers.yaml"
    2026-09-20-4b0ab: "DELETING A CONVERSATION IS CONFIRMED IN THE PAGE (Work it out surface, the deletion rule, the mock-parity dialog block). The element renders without open and showModal opens it — reversed, that throws in a browser and is never called in jsdom; Escape and the backdrop are the component's own. -> .agentsmith/phases/done/2026-09-20-4b0ab-dialog-delete-confirms-in-page.yaml"
    2026-09-20-4b0ae: "INSPECTING A PROPOSAL ACKNOWLEDGES THE CLICK (Work it out surface, pane, dialog CSS block, test setup). The pane falls back to the proposal tab whenever nothing is filed, so the commonest inspect renders an identical document: the ACT marks the pane, focuses its panel under a plain :focus rule, scrolls nearest. -> .agentsmith/phases/done/2026-09-20-4b0ae-dialog-inspect-reaches-the-pane.yaml"
    2026-09-20-4b0af: "A CONVERSATION IS HEADED BY WHAT IT IS ABOUT, MINTED ONCE (session subject column in both persistence projects, router mint, session view, heading). Minted between the first assistant turn and the reply the page re-reads on; an answer that is not one line of prose stores nothing and the heading keeps the first line. -> .agentsmith/phases/done/2026-09-20-4b0af-dialog-title-is-the-intention.yaml"
    2026-09-20-4981: "THE ANONYMOUS INSTALLATION REPORT NAMES THE CATALOG (report, binding contract, installation view). Two facts: the binding this server RESOLVED — source, version, overlay fingerprint, no root on a surface read without signing in — and the embedded version as the floor. Unresolved, it names what was configured. -> .agentsmith/phases/done/2026-09-20-4981-installation-report-names-the-catalog.yaml"
    2026-09-20-b5af: "THE C# DELTA SHIPS NO BUILD-BREAKING ARTEFACTS (catalog, delta format, pin v5.6.1). The editorconfig and props file an init run wrote into a target — warnings-as-errors, a compiler diagnostic at error — are gone; all three deltas state no artefacts alike and the format bans one that changes what the target compiles to. -> .agentsmith/phases/done/2026-09-20-b5af-csharp-delta-ships-no-artefacts.yaml"
    2026-09-21-c724c: "A DROPPED QUEUE ENTRY FINISHES ITS RUN WHERE THE ROW LIVES (capacity-queue pump drop path, pump test harness). Finalize through the cancel writer, then remove, then announce: a run that never started has no cursor, so the published event drained nowhere and thirteen rows stayed queued. -> .agentsmith/phases/done/2026-09-21-c724c-queue-drop-reaches-the-row.yaml"
    2026-09-20-9f00: "A QUEUED RUN ANNOUNCES ITSELF AND A DELETE DISARMS ITS TICKET (spawn deferral, run deleter, nudge port). Deferring nudges the surface directly, best-effort and after the write: a deferred run is outside the drained active set, so an event dies there. Delete terminalizes every run with no result — queued, running, parked. -> .agentsmith/phases/done/2026-09-20-9f00-queue-visible-and-clearable.yaml"
    2026-09-20-2789: "A SCHEMA REFUSAL NAMES WHAT DECIDED IT (the shared schema error report, five validators). A detail with a valid ancestor is dropped, so a matched oneOf's losing branch and an if that did not apply say nothing — ten clauses to one on an 8/8/8 draft; an unknown key reads as not allowed; a cut report says it was cut. -> .agentsmith/phases/done/2026-09-20-2789-schema-refusal-names-the-cause.yaml"
    2026-09-18-b4f0: "AN OPERATOR CHOOSES THE WORK-ITEM KIND EACH FILED ROLE CREATES (ticket port, the AzDO/Jira creates, tracker config, studio descriptor). A filing made a Task whose states lacked the project's failed_status, so every run on it was re-claimed. The kind crosses the port, the role never does; an unset map creates what it did. -> .agentsmith/phases/done/2026-09-18-b4f0-ticket-type-and-its-states.yaml"
    2026-09-15-6f8d: "A TEMPLATE'S PROOF IS READ IN THE CHECKOUT IT OWNS (scope name + selection + proof report + dialog catalog). One statement over the full declaration list: the FIRST declaration composing an address owns it, folding case as the filters do. A loser is not read and says so under its ordinal; the catalog lists one per address. -> .agentsmith/phases/done/2026-09-15-6f8d-template-proof-own-scope.yaml"
    2026-09-18-7b31: "THE GATE RUNS THE GENERATED-MIRROR CHECK IT WAS MISSING (phase-gate dashboard block). pnpm gen:hub-events joins the steps after install, so a C# contract that outgrew its TS mirror blocks the commit, not the PR. The list is an array because the member is conditional: read from package.json, so an older tree is skipped aloud. -> .agentsmith/phases/done/2026-09-18-7b31-gate-generated-mirrors.yaml"
    2026-09-18-7a05: "AN OPERATOR DELETES A CONVERSATION THEY OWN (delete route, own owner check, dashboard list). Keyed on the session id and platform-scoped, an absent row refuses; the check runs BEFORE the hold is acquired; success and all three refusals answer alike; answers swept, tickets and approved set kept. -> .agentsmith/phases/done/2026-09-18-7a05-dialog-conversation-delete.yaml"
    2026-09-18-d518: "A FILED TICKET SAYS WHAT ITS LABELS BIND, AND NO PROMPT CARRIES IT (phase ticket renderer, ticket fetch door, epic ground). One marker pair around a short note, composed from the labels the filer stamps; stripped once at the three sites that publish ticket-origin text, in markdown, Azure DevOps HTML and Jira's document format. -> .agentsmith/phases/done/2026-09-18-d518-ticket-label-note.yaml"
    2026-09-19-4c1f: "DESIGN TURN GROUNDED IN THE PROJECT'S OWN RULES (spec-dialog, non-sandbox step). Reads the scope via ISourceProvider — no container, no clone — publishing each scoped repo's context.yaml and principles.md under the keys the master binds; the sandbox loaders provision and would swap the turn's scopes for empty pods. -> .agentsmith/phases/done/2026-09-19-4c1f-dialog-grounding-without-sandbox.yaml"
    2026-09-20-3af8: "A DESIGN CONVERSATION TAKES A SCREENSHOT (image route, attachment rows, turn seeds, spec-dialog prompt, composer). Refused on the declared length before anything binds and typed from the bytes; keyed on the session, so a resume keeps it and the delete sweeps it; the column declares NO type, four ride each turn. -> .agentsmith/phases/done/2026-09-20-3af8-dialog-takes-a-screenshot.yaml"
    2026-09-20-c206: "A FILED RUN LEADS WITH ITS STATUS, NOT ITS TIMESTAMP (spec-dialog filed pane, run row). The row opened with its identifier and that identifier was the heaviest token on it, so the semibold goes with the move: second place does not stop a heavier token reading first. The ticket line above keeps its weight, being a state. -> .agentsmith/phases/done/2026-09-20-c206-dialog-filed-status-first.yaml"
    2026-09-20-4b0ac: "THE COMPOSER'S TWO CONTROLS ARE GLYPHS (spec-dialog composer, mock-parity dialog block). A plus at the lower left named Attach opens a menu — upward, because the exchange card clips its box and nothing here lifts that — and an arrow sends. Off .btn, so the icon class carries its own disabled look. -> .agentsmith/phases/done/2026-09-20-4b0ac-dialog-composer-attach-and-send.yaml"
    2026-09-18-0f27: "THE CONCURRENT-SANDBOX BOUND IS SET IN THE CATALOG (sandbox settings, Docker capacity probe, settings form, docs). Nullable, because zero already means unbounded — null is what keeps SANDBOX_MAX_CONCURRENT the empty-store fallback. Resolved via the loader per decision, reported once per change, named by a refused init. -> .agentsmith/phases/done/2026-09-18-0f27-sandbox-bound-in-the-catalog.yaml"
    2026-09-18-84be: "THE CATALOG PAGE NAMES THE ORIGIN IT IS SHOWING (catalog response + dashboard surface). The resolution mints its own phrase; origin, listing and body share ONE binding, so a re-resolve into the same root cannot serve new text under an old phrase. An overlaid install names its configured overlay, not the form that omits it. -> .agentsmith/phases/done/2026-09-18-84be-catalog-page-origin.yaml"
    2026-09-18-2f8b: "A PAGE ARRIVING MID-TURN SEES THE TURN (turn runner, turn gate, dialog view, dashboard working line). The gate keeps the turn's computed time — the waits on a person left out — and its steps under a per-turn sequence; the view adds them to the page's own flag and is false while a question stands; steps merge by (turn, sequence). -> .agentsmith/phases/done/2026-09-18-2f8b-dialog-turn-liveness.yaml"
    2026-09-19-c511a: "A DECISION IS WRITTEN THROUGH THE RUN'S SANDBOX, NOT THE SERVER'S FILESYSTEM (decision logger, its contract, the four tool-host builders). The repository root is the mount /work, so every write went where the server cannot create one and killed a coding run; a file it cannot read is never replaced. -> .agentsmith/phases/done/2026-09-19-c511a-decision-log-through-sandbox.yaml"
    2026-09-19-c511b: "A DECISION THAT CANNOT BE WRITTEN IS A WARNING, NOT A DEAD RUN (the sink's guard, the outcome, the tool's answer). Four failing log_decision calls reach the step after them, where the fourth used to end the master; a lost repository copy is not the model's business, a decision recorded nowhere is. -> .agentsmith/phases/done/2026-09-19-c511b-decision-log-failure-not-fatal.yaml"
    2026-09-20-9c74: "A PREMISE CHECK SETTLES A GATE CLAIM BY RUNNING ONE DECLARED STAGE (look terms, stage-run tool, evidence kind). Only the premise check may ask, and by LABEL: the list is the gate own resolver on a null project map, so no analyzer guess reaches a shell. A timeout or throw costs one unproven premise. -> .agentsmith/phases/done/2026-09-20-9c74-premise-check-stage-run.yaml"
    2026-09-09-b26f: "THE RESUME SEED IS FOUND BY PROJECT AND TICKET (prior-run ledger, master handler). A tracker id is unique only within its project, so a shared id let the newer run open on the OTHER project's checklist; no resolved project now seeds nothing. Seeding left the handler as PriorRunSeedSource. -> .agentsmith/phases/done/2026-09-09-b26f-ledger-prior-run-project-key.yaml"
    2026-09-14-2b7c: "FORGETTING A PERSON CLEARS THE NOTE THAT DECIDES THEIR RETURN (access + observation buffer). Removal cleared row and grant and left the in-memory suppression, so the person was dropped for ~5.5 min through any sign-in; ordering alone closed nothing, so drain-and-write and forget-and-delete now exclude each other. -> .agentsmith/phases/done/2026-09-14-2b7c-access-forget-clears-the-note.yaml"
    2026-09-14-d4e8: "A SCOPE NAMING ANOTHER RESOURCE IS SAID BEFORE SIGN-IN (dashboard identity). Recognises BOTH sides first — the draft would have accused this repo's own Keycloak example and the audience-parameter shape; silent once a token was accepted, and blind by design to the v1/v2 case, which is a token version, not a resource. -> .agentsmith/phases/done/2026-09-14-d4e8-auth-scope-addresses-this-server.yaml"
    2026-09-14-91ad: "A ROLE IS COMPOSED HERE, NOT REFUSED (access surface + Roles pane). The read-only guard's only remedy was the config import this product abolished; validation moved to the save, scoped to what a save ADDS OR CHANGES so a legacy bundle cannot refuse an unrelated one, and removal is refused while a holder can be seen. -> .agentsmith/phases/done/2026-09-14-91ad-access-custom-role-editor.yaml"
    2026-09-14-3f5b: "THE STARTUP REPORT SAYS WHETHER SIGN-IN CAN WORK (server preflight). Server-only: two of its four facts are absent from the CLI graph. It asks whether a token was accepted inside the observation window (retention sweeps 'ever') and whether an admin route can be SEEN — AdminRoute passes everywhere, a role claim sufficing. -> .agentsmith/phases/done/2026-09-14-3f5b-auth-signin-preflight-check.yaml"
    2026-09-14-c72e: "A REFUSED TOKEN NAMES BOTH SIDES (server auth route + dashboard identity/banner). The refusal named the CHECK, never the value, so a v1 token cost a session of hand-decoding; the presented aud/iss/ver ride beside the expected pair, uncacheable, and the banner asks whether a token survived, not whether two strings match. -> .agentsmith/phases/done/2026-09-14-c72e-auth-refusal-names-both-sides.yaml"
    2026-09-09-1113: "THE STALL GUARD'S BUDGET OUTLASTS A SATURATED RUNNER (RunEventRouterTests). p0432's 30s was tripped twice on 2026-09-09, at 36s and 48s on green trees, next to string assertions taking 42s; the hang detector goes back to p0423b's 120s — bounded by deadlock, not by impatience. -> .agentsmith/phases/done/2026-09-09-1113-test-stall-guard-budget.yaml"
    2026-09-09-6a77: "THE HARNESS STOPPED SHARING A PROJECTMAP CACHE (pipeline harness composition). The fast tier resolved the production disk store, so every preset over the one fixture addressed one entry under 'default' and whichever analyzer missed first decided the others' verify commands — run 34345964136's eight keystone failures. -> .agentsmith/phases/done/2026-09-09-6a77-test-map-cache-per-harness.yaml"
    2026-09-06-9f14: "THE ACCEPTANCE GATE PAIRS DISPOSITIONS BY CRITERION (open-loop gate). Each disposition is matched to the criterion whose normalised text it names, position is the per-disposition fallback, duplicates pair in order, a short answer still fails closed, and the re-engage log names which pairing decided each criterion. -> .agentsmith/phases/done/2026-09-06-9f14-acceptance-gate-pairs-by-criterion.yaml"
    2026-09-03-3c07: "A PARKED MASTER QUESTION RESUMES INTO THE RUN (checkpoint serialisation + resume path). The master's park marker was captured by its own checkpoint and re-parked the resumed run (live run a109); park markers are never checkpointed now, and the resumed asking step consumes the answer, renders it to the master and re-engages it. -> .agentsmith/phases/done/2026-09-03-3c07-master-question-resume.yaml"
    2026-09-06-3d81: "A DECLINED CRITERION REACHES THE TICKET AUTHOR (contract section + per-phase ledger + PR body, ticket comment, result.md, acceptance view). The contract names not_applicable with its evaluated meaning; the answer survives every phase and renders where the outcome is read. Live: replay 5556. -> .agentsmith/phases/done/2026-09-06-3d81-acceptance-declined-criterion-report.yaml"
    2026-09-08-4aa9: "A COMMENT AFTER AN EXECUTED PHASE RE-CUTS THE UNSTARTED TAIL (spec pointer + revision cause + prompt + comment). Run a109: the marker's commit never moved the pointer, so a re-trigger after phase 1 derived nothing; now the marker records it, a comment after ours is a cause, a set in flight continues. -> .agentsmith/phases/done/2026-09-08-4aa9-derivation-comment-recut-after-phase.yaml"
    2026-09-08-5cd2: "AN EDITED TICKET RE-CUTS THE UNSTARTED TAIL (set index + revision cause + prompt + comment). Run a109 continued a phase the operator had edited out of the ticket: after an executed phase no re-trigger called the model. set.yaml carries a fingerprint of the ticket text; a mismatch re-derives, executed head kept. -> .agentsmith/phases/done/2026-09-08-5cd2-derivation-ticket-edit-recut.yaml"
    2026-09-08-805f: "A COMPLETE LEDGER MAKES THE MASTER OWE ITS VERDICT (master loop governor). Runs 989e and a109 finished their checklist and kept calling tools until the cost cap; the governor now demands the verdict once after N tool turns and ends the pass after N more, and the ledger still decides nothing about the outcome. -> .agentsmith/phases/done/2026-09-08-805f-master-verdict-after-ledger-done.yaml"
    2026-09-04-cf3d: "A CODING RUN LOADS EVERY CONTEXT IN A SANDBOX (context + principles loaders). Both read the sandbox's representative, so a two-context repository's master saw one context.yaml and one principles.md. Now every context's files load, labelled by context and workdir when there are several; one context stays verbatim. -> .agentsmith/phases/done/2026-09-04-cf3d-coding-run-loads-every-context.yaml"
    p0439: "A RUN DELIVERS WHAT IT BUILT AND SAYS WHAT IT LEFT (backend + dashboard). A stop after a verified phase is a SHORTFALL: verified phases ship on a ready PR naming what is missing, the ticket finalizes done under its own label, the run ends `shortfall` and counts as a done; sandboxes revert to the verified head first. Live: run 989e. -> .agentsmith/phases/done/p0439-run-partial-delivery-done.yaml"
    2026-09-13-4072: "THE PIN CARRIES THE SHARED SOURCE ORDER (embedded catalog). v5.2.0 -> v5.3.0: one section stated once, cited by the derivation, coding and design masters. The three guards left behind are INVERTED, not deleted - a later pin dropping the citation now fails here. fcc1 cut from requires; it bumps again. -> .agentsmith/phases/done/2026-09-13-4072-catalog-pin-carries-templates.yaml"
    2026-09-15-9033: "THE SPEC DIALOG GAINS A DASHBOARD CHANNEL (adapter + ingest route + hub group). A third IPlatformAdapter over JobsHub, POST /api/spec-dialog/messages fire-and-forget, the session owned at EVERY door — post, subscribe, resume; the last reachable from any chat thread, past the endpoint. -> .agentsmith/phases/done/2026-09-15-9033-dialog-channel-in-the-dashboard.yaml"
    2026-09-15-cb3e: "THE SPEC DIALOG GETS ITS DASHBOARD SURFACE (place + transcript + composer + approval + scope column). Two columns: the conversation, and what it is grounded in. Framework lines are composed for the channel and the master's reply is sent byte for byte; the question's kind carries the approve/reject it lists none of. -> .agentsmith/phases/done/2026-09-15-cb3e-dialog-surface-in-the-dashboard.yaml"
    2026-09-15-6d9c: "THE DIALOG SHOWS ITS PROPOSAL (one column, three states: scope -> proposal -> what was filed). Published from the outcome flow and the filing sink as plain DTOs; an epic lists its children in the filer's own order; a partial failure names what WAS created. -> .agentsmith/phases/done/2026-09-15-6d9c-dialog-shows-its-proposal.yaml"
    2026-09-17-c7aea: "THE DASHBOARD SHOWS A DRAFT AS STRUCTURE (spec dialog reply, view, session). The transcript keeps the whole reply; the router sends it stripped on the dashboard only, the view strips assistant turns, and the session keeps its latest proposal and filing for a reload. -> .agentsmith/phases/done/2026-09-17-c7aea-dialog-reply-draft-split.yaml"
    2026-09-17-c7aeb: "YOUR PAST CONVERSATIONS STAY IN THE LIST (spec dialog listing, resume, dashboard). Its own owner-filtered read lists closed sessions titled and marked by their filing; a resume mid-turn is refused; opening one resumes it onto a fresh dialog id. -> .agentsmith/phases/done/2026-09-17-c7aeb-dialog-conversation-list.yaml"
    2026-09-17-c7aec: "A DESIGN TURN SAYS WHICH REPOSITORIES IT OPENS (source scopes, spec dialog, dashboard). A scope reports opening, ready or failed to an ambient observer, silent by default; a dashboard turn sets one that pushes to the dialog the turn runs on. -> .agentsmith/phases/done/2026-09-17-c7aec-dialog-turn-reading-progress.yaml"
    2026-09-17-c7aed: "THE DESIGN SURFACE BECOMES WORK IT OUT (dashboard spec dialog, place, rail). Conversations by day, the exchange with a card per proposing turn and a decision surface, and a pane of tabs offered only with content, in the dashboard's tokens. -> .agentsmith/phases/done/2026-09-17-c7aed-dialog-surface-mock-rebuild.yaml"
    2026-09-15-ffa7: "THE CUT REVIEW RESTS ON THE CODE (spec derivation: cut review, look, evidence). The reviewer gets its own template-free look per attempt (6 looks, R ids) and is told about it; a false premise is admitted only by an id it minted, and the rejection hands the deriver the evidence line. -> .agentsmith/phases/done/2026-09-15-ffa7-review-rests-on-the-code.yaml"
    2026-09-15-a5a5: "THE CUT REVIEW ANSWERS WITHOUT A TICKET (spec derivation: cut review prompt, admission, port). A ticket is whole, truncated or absent, and coverage is offered only whole; a quote must be a stated text or most of one, word by word, and a phase with no done-list is quoted by goal and steps; the port takes drafts and a key. -> .agentsmith/phases/done/2026-09-15-a5a5-review-without-a-ticket.yaml"
    2026-09-17-042ec: "A DESIGN TURN DISCUSSES BEFORE IT PROPOSES (spec dialog turn kinds, outcome gate, design prompt, skill). Kept turns record their kind; no proposal until the operator replied to an answer; an earlier one is refused once and answered with its prose. -> .agentsmith/phases/done/2026-09-17-042ec-dialog-discussion-first.yaml"
    2026-09-17-042ed: "A DESIGN TURN REVIEWS WHAT IT PROPOSES (spec dialog review, source-scope evidence, approval surface). A phase or epic is reviewed inside the turn over its repositories, with no audit and no Run step on a read-only scope; findings ride the proposal to the confirmation, the pane, a reload and the edit turn. -> .agentsmith/phases/done/2026-09-17-042ed-dialog-proposal-review.yaml"
    2026-09-17-042el: "AN APPROVAL ANSWER IS A DECISION (spec dialog answer admission, transcript turn, dashboard). The admission peeks, appends with the decision, takes and publishes; one approve/reject vocabulary; the dashboard shows a decision entry live and after a reload. -> .agentsmith/phases/done/2026-09-17-042el-dialog-answer-turns.yaml"
    2026-09-17-042ea: "A FILED EPIC CHILD IS LINKED TO ITS PARENT IN THE TRACKER (ticket providers, epic filer, dashboard). Hierarchy relation, sub-issue, Jira issue link, relates_to; a link that fails is a filing note, never its error. The Parent line leaves the child body; Jira's ticket read returns labels. -> .agentsmith/phases/done/2026-09-17-042ea-ticket-parent-link.yaml"
    2026-09-17-042eb: "AN EPIC CHILD SAYS WHEN IT IS DONE (requirement body, deriver, titles). The done list renders as an acceptance-criteria section both deriver paths read when the tracker has no field; sibling ids leave the body, free text stays as preconditions; every filed title fits 255. The pin move is 2026-09-17-6a29. -> .agentsmith/phases/done/2026-09-17-042eb-ticket-requirement-acceptance.yaml"
    2026-09-17-042ee: "A DESIGN TURN SAYS WHAT IT IS DOING (spec dialog tool surface, chat client, dashboard). An ambient turn-activity observer reports each tool call, each model call on return with its intent, reviewing and revising; a dashboard turn pushes them to its own dialog group and the page folds the older ones. -> .agentsmith/phases/done/2026-09-17-042ee-dialog-turn-activity.yaml"
    2026-09-17-042em: "A RUNNING CONVERSATION IS RECOGNISABLE WHILE IT RUNS (spec dialog conversation list, exchange header, filed ticket key, markup Link). The list is re-read on a reply whose listed row is missing, untitled or behind, sequence-guarded; the header names the session's project; filed tickets read as linked keys on page and chat. -> .agentsmith/phases/done/2026-09-17-042em-dialog-list-picker-keys.yaml"
    2026-09-17-6a29: "THE PINNED DESIGN PARTNER DISCUSSES FIRST, DRAFTS IN ENGLISH AND ASKS EACH EPIC CHILD FOR DONE (embedded skills pin, packaged-master tests). The catalog moves to v5.5.0, design-partner-master 1.6.3; three tests read the embedded tarball for those three rules, each proven to fail against v5.4.0. -> .agentsmith/phases/done/2026-09-17-6a29-skills-pin-dialog-drafts.yaml"
    2026-09-17-042ek: "A REPLY THE PAGE CAN REACH SPEAKS ITS LANGUAGE (spec dialog markup selector, composers, dispatcher, approval card). The dialect picks the wording, so no page-reachable line names a slash command or a thread; the approval question is empty text and the card carries it, saying so itself when no proposal came back. -> .agentsmith/phases/done/2026-09-17-042ek-dialog-dashboard-wording.yaml"
    2026-09-17-0e79e: "THE RUN'S STEP BUDGET FOLLOWS THE WORK IT WAS GIVEN (pipeline executor guard, phase sequence, checkpoint). The const 100 becomes 40 + 20 per spliced phase published by the sequence for its unexecuted tail, so one and two phases are guarded TIGHTER (60/80) and three tie; exhaustion runs the finalizer tail and names its step. -> .agentsmith/phases/done/2026-09-17-0e79e-run-step-budget.yaml"
    2026-09-17-042eg: "APPROVING IN THE DIALOG STARTS THE FILED WORK, AND SAYS SO (start-and-confirm collaborator, the runs.control bool from ingest to the filers, Jira target match, filed tab). Every filed ticket reports started, not started with the reason, or record; only a ticket the poller would resolve is moved, after its set is stored. -> .agentsmith/phases/done/2026-09-17-042eg-filing-trigger-start.yaml"
    2026-09-17-042eh: "A PHASE'S OWN DIFF IS REVIEWED BEFORE THE RUN MOVES ON (ReviewPhaseDiff after VerifyPhase, phase-start heads, phase-review look terms, structured evidence). Every finding rests on a numbered read the reviewer took and earns ONE fix pass, reverted and proven committed when not green; a review NOT taken records why. -> .agentsmith/phases/done/2026-09-17-042eh-phase-diff-review.yaml"
    2026-09-17-0e79d: "AN APPROVED EPIC IS ONE WORK TICKET, ONE RUN, ONE PULL REQUEST PER REPO (epic filer, slice-record filer, filing labels). One phase-labelled, approved-set-stamped ticket carries the parent draft and the whole ordered set under its key; each slice is a linked record, unstamped, that nothing routes and no run works. -> .agentsmith/phases/done/2026-09-17-0e79d-epic-one-work-ticket.yaml"
    2026-09-17-0e79a: "AN APPROVED SPEC SET IS THE SOURCE A RUN EXECUTES (approval store + migration, precedence, funnel, reconciler, filer, scoping). Approving a phase stores the set under its ticket's spec key; one resolver answers carried-or-stored, newer wins; a re-approval merges over the executed head; a filed ticket with none fails. -> .agentsmith/phases/done/2026-09-17-0e79a-approved-set-is-the-source.yaml"
    2026-09-17-0e79c: "A PHASE'S STATED PREMISES ARE CHECKED AGAINST THE CODE BEFORE ITS WORK STARTS (CheckPhasePremises, its look, prompt, admission, hand-back). False needs a premise the phase STATES plus an id this look minted for a look that ran; the deriver's decision is no premise, the phases that ran are named, and the row reads handed_back. -> .agentsmith/phases/done/2026-09-17-0e79c-phase-premise-check.yaml"
    2026-09-17-0e79b: "AN APPROVED SPEC SET IS NEVER RE-CUT BEHIND THE OPERATOR (the amendment rule, the revision, the cut comment, the notice, the amendment entry). A comment, an edit or a re-trigger is recorded and reported once; a change is made by approving the set again, which may not touch a position that already ran. -> .agentsmith/phases/done/2026-09-17-0e79b-approved-set-is-not-recut.yaml"
    2026-09-17-042ef: "WORK IT OUT IS DRAWN IN THE PROJECTS PAGE'S OWN CARDS, MARKS, LABELS AND BUTTONS (dashboard dialog, mock-parity). A shell of its own: the runs list's section margin dropped a column, the studio's .main caps below three-column width. Its rules gain the dialog's selector, never a copy; six more fixes came from rendering the page. -> .agentsmith/phases/done/2026-09-17-042ef-dialog-shell-styling.yaml"
    2026-09-18-c1a7: "A TICKET WHOSE STATUS COULD NOT BE MOVED IS CLAIMED ONCE (ticket providers + claim service). Finalize reports whether the status MOVED — three trackers from their own vocabulary, Azure DevOps from the rejection type — and the one door every claim passes refuses it until the tracker's or project's config doc changes. -> .agentsmith/phases/done/2026-09-18-c1a7-ticket-finalize-failure-stops.yaml"
    2026-09-17-042ej: "THE CONVERSATION FOLLOWS WHAT IT FILED (filed-work read, owner-checked hub watch, (Project,TicketId) index, filed tab). The work ticket's runs across its tracker's projects, a row per phase with its terminal-only verdict, pull requests and review — one NOT taken says so — and a data-free nudge that refetches. -> .agentsmith/phases/done/2026-09-17-042ej-dialog-filed-work.yaml"
    2026-09-18-e63d: "TEXT WORK IT OUT DID NOT CHOOSE WRAPS INSTEAD OF BEING CLIPPED (mock-parity, scope panel, conversation list, filed pane). One `given` modifier on mark, heading, sub-line and value - the shape 042ef's guard forces - carrying BOTH the nowrap lift AND overflow-wrap: anywhere, since break-word does not shrink a flex item. -> .agentsmith/phases/done/2026-09-18-e63d-dialog-mark-not-clipped.yaml"
    2026-09-16-5451: "A PROJECT CARD'S SURFACE STOPS OFFERING A POINTER IT IGNORES (project card). d7c3 moved that card s click onto the row and left the whole surface inviting one - the last thing on the card still claiming to do something. Scoped off by a modifier; the other six keep click and cursor. -> .agentsmith/phases/done/2026-09-16-5451-card-cursor-tells-the-truth.yaml"
    2026-09-16-4b41: "THE WIRING GRAPH IS FIVE COLUMNS (project graph). Contexts nested in their repository's rectangle hid two of the three relationships the drawing exists to show; it is agent/tracker, project, repositories, contexts, built after, each headed, one row per pair, height from the row count, labels truncated to a mono budget. -> .agentsmith/phases/done/2026-09-16-4b41-graph-five-columns.yaml"
    2026-09-17-ce66: "THE CONTEXT PICKER ALWAYS STORES THE REPOSITORY (template picker, project graph). Unambiguous names were stored bare and could not be placed on multi-repo projects; a stored bare name one repository declares is filled in on open, the caption counts declared repositories, and strays get one row per reason. -> .agentsmith/phases/done/2026-09-17-ce66-picker-always-names-the-repo.yaml"
    2026-09-16-d7c3: "THE CARD ROW IS THE DISCLOSURE (project card + studio stylesheet). The root was an ARIA button hosting buttons and its Enter handler had no target guard; the row is a real button carrying aria-expanded/-controls, the controls are its sibling, Edit is the only route in, the 'wiring' control is gone. Six kinds unchanged. -> .agentsmith/phases/done/2026-09-16-d7c3-card-row-is-the-disclosure.yaml"
    2026-09-16-b706: "A PROJECT CARD DROPS ITS TYPE BADGE (project card). It showed the declared pipeline list joined, and the literal 'project' when empty - so on a page of nothing but projects it said nothing, and otherwise it showed the list 74a2 stopped asking anyone to author. The other six kinds keep theirs. -> .agentsmith/phases/done/2026-09-16-b706-project-card-drops-its-badge.yaml"
    2026-09-16-8502: "THE CARD CONTROLS HOLD THEIR WIDTH (project card + stylesheet). bedc made the summary a wrapping row of marks, whose minimum is its widest mark - so the middle block took the space and every button on the right broke across three lines. Middle block yields, controls do not shrink, the disclosure looks like a control. -> .agentsmith/phases/done/2026-09-16-8502-card-controls-hold-their-width.yaml"
    2026-09-16-bedc: "THE CARD CARRIES ONE WIRING, NOT TWO (project card + shared predicate). 942a described an ADDITION where a replacement was meant, so the flat chip row kept rendering beside the graph. Row gone, summary is one mark per fact, unfinished told apart from unresolved, and 'unfinished' - written out four times - stated once. -> .agentsmith/phases/done/2026-09-16-bedc-card-graph-replaces-the-chips.yaml"
    2026-09-16-942a: "A PROJECT CARD EXPANDS INTO WHAT IT IS WIRED TO (entity card + inline SVG graph). Four columns — agent and tracker, the project, each repository with the contexts its own templates name INSIDE it, and the template each is built after. It reads nothing. The card names the default pipeline, not a count. -> .agentsmith/phases/done/2026-09-16-942a-project-card-wiring-graph.yaml"
    2026-09-16-74a2: "THE PROJECT DRAWER IS FIVE SECTIONS AND ONE PIPELINE FIELD (project form + entity drawer + project patch). Three pipeline controls became the default alone, with the tracker's map read-only beside it; a save sends the UNION so the blocking rule is unauthorable; an unfinished template blocks it. -> .agentsmith/phases/done/2026-09-16-74a2-project-drawer-sections.yaml"
    2026-09-16-a4d7: "A TRACKER DECLARES WHERE AN UNROUTED TICKET GOES (tracker field + trigger merge + capabilities + draft rule). A hardcoded 'fix-bug' initialiser made 'declares none' inexpressible; the field is nullable and the literal answers once, in the resolver. Neither map nor default is now an advisory finding, not a refusal. -> .agentsmith/phases/done/2026-09-16-a4d7-tracker-declares-its-fallback.yaml"
    2026-09-16-4df5: "A TEMPLATE BINDING MAY NAME ITS LOCAL REPO (template reference + scope name + 3 consumers + picker). Two repos declaring 'default' had no answer anywhere: one scope dropped the second, the dialog stamp THREW on it, the proof report proved the wrong one. Name stated once; qualified is repo/context. Rows start collapsed. -> .agentsmith/phases/done/2026-09-16-4df5-template-context-names-its-repo.yaml"
    2026-09-15-9b3e: "THE STUDIO LISTS SORT AND A CONTEXT SAYS WHERE IT CAME FROM (catalog hook + form fields + draft check). Sorted in the LOADER, reaching all ten render sites, plus an ORDER BY - a SELECT without one has no order, only the look of one. One option per name, labelled with every repo declaring it. Template rules run pre-Save. -> .agentsmith/phases/done/2026-09-15-9b3e-studio-list-and-template-truth.yaml"
    2026-09-15-c6e9: "THE INIT PULL REQUEST SAYS WHAT THE ROUND DID (bootstrap round + commit handler). The body was one literal, equally true of a transfer and of a preserve that wrote nothing. Composed per repo from accumulated outcomes; the cross-link marker moves inside, since the handler sits at its length baseline. -> .agentsmith/phases/done/2026-09-15-c6e9-init-body-from-the-round.yaml"
    2026-09-15-d66f: "A DELTA'S ARTEFACTS ARE WRITTEN PER PATH (composer + bootstrap transfer + pin v5.4.0). Preserve-existing moved from the round to the path - a ratified principles.md used to suppress every artefact beside it. The composer STRIPS the new section, proven by goldens minted from the pin before the bump. -> .agentsmith/phases/done/2026-09-15-d66f-artefact-transfer-per-path.yaml"
    2026-09-15-a2d0: "TEMPLATES ARE A LIST, NOT FIFTEEN FIELDS (project form). One row per declaration, all five values, declaration order; 620e's fields open one row at a time, a single stored one on load. A closed row makes no probe call and claims no reachability. Duplicate note cut: three consumers disagree, one throws -> 2026-09-15-6f8d. -> .agentsmith/phases/done/2026-09-15-a2d0-template-list-then-one-editor.yaml"
    2026-09-14-620e: "A TEMPLATE IS PICKED, NOT TYPED (config endpoint + project form). Project and repo from the catalog, both context names from an endpoint reading .agentsmith/contexts through the provider - no sandbox, no run. Probe permission, sanitised reason; an unreadable repo degrades the field, not the form. Capabilities step cut. -> .agentsmith/phases/done/2026-09-14-620e-template-picked-not-typed.yaml"
    2026-09-13-ab17: "ONE SECTION SAYS WHICH SOURCE WINS (skills catalog). Principles > template for NEW > existing code for an EXTENSION > design gives only the WHAT, plus the new-vs-extension test. Three masters cite it; the validator refuses one mentioning a template without it, and its exit code, dropped in 13de328, is restored. -> .agentsmith/phases/done/2026-09-13-ab17-source-precedence-stated-once.yaml"
    2026-09-13-7d9f: "THE EPIC REACHES EVERY CHILD (ticket fetch + derivation prompt). A template gives the FORM; nothing gave the WHAT one epic shares, so each slice invented its own. The parent, addressed by its child's label, read once and rendered as one capped untrusted section. Gone = reported, not fatal. -> .agentsmith/phases/done/2026-09-13-7d9f-epic-ground-reaches-every-child.yaml"
    2026-09-13-9f84: "WHAT A TEMPLATE DECLARES AS ITS OWN PROOF IS READ AND REPORTED (derivation). Nothing checked that an exemplar is exemplary. The verify block of an OPEN scope, at the sha it landed on, minted as a framework evidence line — not a refusal: no boilerplate declares one today, so a gate would refuse them all. -> .agentsmith/phases/done/2026-09-13-9f84-template-verify-block-read.yaml"
    2026-09-13-ed5a: "THE EPIC ANALYSIS READS THE TEMPLATE (spec-dialog turn + epic filer). The level above the per-ticket look: a cut blind to the house shape crosses layers the template keeps apart, and every filed run inherits it. Every declared template, lazy, in this preset's sandbox map; provenance rides the outcome JSON to the parent. -> .agentsmith/phases/done/2026-09-13-ed5a-template-in-dialog-scope.yaml"
    2026-09-13-6f35: "THE CODING MASTER CAN READ THE TEMPLATE (master handler + tool host). The derivation could open it; the thing that types the code could not. One read-only entry per declared template, addressable by name and out of the sandbox map CommitAndPR iterates; refused on write by the sandbox. -> .agentsmith/phases/done/2026-09-13-6f35-template-in-coding-look.yaml"
    2026-09-13-a284: "A PULL REQUEST OPENS AGAINST ITS OWN BASE (source providers + the three opening sites). Optional target on create plus a retarget for one already open — the draft at the spec commit predates the rung and nothing ever changed a base, so every slice showed its predecessors' diff. Per repository; no rung = today. -> .agentsmith/phases/done/2026-09-13-a284-pull-request-targets-its-base.yaml"
    2026-09-13-35a4: "A FEATURE'S BRANCH IS CREATED ONCE (sandbox git). Create-only push, no force and no lease — the work-branch pusher refreshes its lease with a fetch, so aimed at a rung it would delete every slice already merged. Rejection = somebody won the race: fetch and adopt. Published before the cut. -> .agentsmith/phases/done/2026-09-13-35a4-branch-rung-created-once.yaml"
    2026-09-13-5cdf: "ONE BASE PER REPOSITORY (sandbox git + delivery account). The cut, the base merge and the delivery diff each asked their own question; a slice cut from a feature rung would be accounted against origin/HEAD and report its predecessors' work as its own. Ladder reports its fall-through; nothing creates a rung yet. -> .agentsmith/phases/done/2026-09-13-5cdf-branch-base-resolved-once.yaml"
    2026-09-13-a72a: "AN EPIC CHILD WAITS FOR ITS PREDECESSOR (spawn funnel). The requires: edge existed and was never read. Children file in topological order with prefixed parent/predecessor LABELS — the envelope has no body — and the gate is the funnel's FIRST statement, so a held child reserves nothing and never heads the FIFO queue. -> .agentsmith/phases/done/2026-09-13-a72a-epic-child-waits-for-predecessor.yaml"
    2026-09-13-b7ba: "AN EPIC IS FILED AS A REQUIREMENT (ticket shape). An embedded spec made SpecSourceResolver skip the deriver entirely, so a child worked weeks later replayed a cut against a repo its siblings had moved. Fenced block and steps go; scope in/out arrives; map-shaped decisions render for the first time. -> .agentsmith/phases/done/2026-09-13-b7ba-epic-child-carries-no-spec.yaml"
    2026-09-13-a3f1: "AN EPIC PARENT STARTS NO RUN (routing). It was filed with the phase label and hard-bound to phase execution; filing it unlabelled would have been WORSE — with no pipeline_from_label the default fires and an epic summary becomes a coding run. Own framework label, refused before every other rule. -> .agentsmith/phases/done/2026-09-13-a3f1-epic-parent-is-not-work.yaml"
    2026-09-13-84c0: "THE CUT CAN LOOK INTO THE TEMPLATE (derivation). One named entry per template declared for a context this run discovered, in a COPY of the map — the run's own is iterated by CommitAndPR and the toolchain probe. Own allowance (the shared-pool lesson AccountSearchBudget records), resolve-before-charge, refusal fails the cut. -> .agentsmith/phases/done/2026-09-13-84c0-template-in-derivation-look.yaml"
    2026-09-13-5fa0: "A PROJECT DECLARES A TEMPLATE PER CONTEXT (config). Nullable field, written only when the client sends it — the unconditional shape beside it is why default_branch is already lost on every save. Four rules in the LOADER, the only path that can author one; project-to-project edge so the target cannot be deleted. -> .agentsmith/phases/done/2026-09-13-5fa0-template-project-reference.yaml"
    2026-09-13-9802: "A READ-ONLY SOURCE SCOPE CAN BE ASKED FOR A REVISION (sandbox). The stated blocker was measured on the wrong path: the scope clone is FULL, so a sha or tag is a checkout, not a provider capability. Ladder + five typed failures in SourceScopeMaterialiser; RevisionNotFetched separates a pull-request-only sha from a typo. -> .agentsmith/phases/done/2026-09-13-9802-template-scope-at-a-revision.yaml"
    2026-09-08-1830: "THE CUT CARRIES EVERY CONTEXT THE SCOPE CALL NAMED (scope claim + derivation coverage + skills PR #182). Run 8688 named frontend and backend, was cut for frontend only and went green; now phases declare contexts, the gap is computed in code, pinned back once, then parked as a question. Pin bump pending. -> .agentsmith/phases/done/2026-09-08-1830-derivation-covers-scoped-contexts.yaml"
    2026-09-07-f420: "A FAILED RUN IS NEVER REPORTED AS COMPLETED (finalizer tail + failure comment). CommitAndPR on a failed run keeps the commit and push, drafts the PR with a banner naming the failure, takes no account and never finalizes the ticket; the one failure comment names the draft PR and branch. Live: runs b7bc and 0c88. -> .agentsmith/phases/done/2026-09-07-f420-record-pr-failed-run-honest.yaml"
    2026-09-07-24ed: "A BRACE INSIDE A STRING NO LONGER HIDES THE OBJECT (worker envelope + verdict + draft + derivation + tolerant recovery). Run 0c88's edit envelope was read as narration by a brace count blind to string literals; five counters replaced by JsonObjectSpans.Balanced in Contracts, quotes tracked only inside objects. -> .agentsmith/phases/done/2026-09-07-24ed-worker-envelope-braces-in-strings.yaml"
    2026-09-07-bd7a: "THE REPEAT GUARD READS THE CONVERSATION (spec hand-back). The sha it compared moved on every derivation, so a contradiction parked again forever; now a repeat is the same case with no reply after our comment, and it ends the run as a failure — continuing closed the ticket as completed with nothing built. -> .agentsmith/phases/done/2026-09-07-bd7a-handback-repeat-guard.yaml"
    2026-09-07-4e6a: "A PHASE NAME IS A LABEL, NOT A SENTENCE (phase-name rule + names on disk). Area-first topic label of 2-5 words, 50 chars; the claim stays in goal:. p0521's word floor and uniqueness reversed; 224 files from p0400 up relabelled, pointers moved, every pointer now proven to resolve. Product slug -> 2026-09-07-e9a2. -> .agentsmith/phases/done/2026-09-07-4e6a-phase-name-label.yaml"
    2026-09-06-4a2c: "THE EXPECTATION SECTION RENDERS THE DONE-LIST (backend). Its token rendered EMPTY on every spec-derived run, so the master never saw the heading its skill requires the acceptance array for; the gate then found no dispositions and could never pass. Sourced from AcceptanceCriteria.For. -> .agentsmith/phases/done/2026-09-06-4a2c-acceptance-contract-expectation-section.yaml"
    2026-09-07-c9d4: "THE HANDBACK GAINS A QUESTION CASE (derivation hand-back + prompt pin). A ticket that reads two ways parks in the clarification status naming both readings and the one the run would take; an unanswered re-trigger pins that reading into the derivation, cuts real phases and says so on the ticket; skills PR #180. -> .agentsmith/phases/done/2026-09-07-c9d4-handback-question-case.yaml"
