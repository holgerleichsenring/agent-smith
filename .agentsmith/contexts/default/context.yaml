    2026-08-25-1806: "A ROLE MAPPING CHANGES WITHOUT A RESTART (role resolution, config store, studio, identity). The four mapping fields became a store singleton, edited in the studio and asked per request; a file mapping imports once at boot; a bundle is picked from the closed catalog; a refused token is named. -> .agentsmith/phases/done/2026-08-25-1806-a-role-mapping-changes-without-a-restart.yaml"
