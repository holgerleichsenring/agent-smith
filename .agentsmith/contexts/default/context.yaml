    2026-08-31-f634: "ONBOARDING NAMES THE REPOSITORIES IT CAN VERIFY (doctor check in the retired domain check's slot). Reports eligible / not yet declared / unreadable per context; the resolver now carries the listing failure it used to swallow, so a credential problem stops looking like an un-onboarded repo. -> .agentsmith/phases/done/2026-08-31-f634-onboarding-verifiable-repositories.yaml"
