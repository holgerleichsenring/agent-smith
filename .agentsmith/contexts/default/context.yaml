    2026-08-25-7035: "THE DELIVERY ACCOUNT HAS AN EVAL (pipeline harness, opt-in tier). Fourteen phases tuned this judge on single anecdotes, because a false negative is invisible. A fixture is a base tree + branch tree materialised as real git repos, so the real account with its real search tool is scored in BOTH directions. -> .agentsmith/phases/done/2026-08-25-7035-the-account-is-scored-against-labelled-runs.yaml"
    2026-08-25-4530: "A SIGNED-OUT DASHBOARD SAYS SO INSTEAD OF FAILING (dashboard refusals, identity, banner). 401/403 leave the one outgoing point as a refusal that renders: sign-in offers sign-in, a missing permission names itself. Plus the identity page, the rail name + sign-out, a banner naming the unconfigured half. -> .agentsmith/phases/done/2026-08-25-4530-a-signed-out-dashboard-says-so-instead-of-failing.yaml"
    2026-08-25-2de1: "A BROWSER SIGNS IN AND CARRIES THE TOKEN (dashboard). Generic OIDC code+PKCE (oidc-client-ts) against the configured authority, a memory-only token store renewed before expiry, emptied on failure, a bearer on apiFetch, a factory on the hub handshake, sign-out, /signin-callback. No authority = nothing happens. -> .agentsmith/phases/done/2026-08-25-2de1-a-browser-signs-in-and-carries-the-token.yaml"
    2026-08-25-21ae: "A SETTING CHANGES WITHOUT A REBUILD (dashboard entrypoint, settings provider, deploy). Next inlines NEXT_PUBLIC_* at build time, so a per-installation value cost a rebuild. The entrypoint writes a public settings document into the static root; one no-store read above the routes resolves it, absent means OFF. -> .agentsmith/phases/done/2026-08-25-21ae-a-setting-changes-without-a-rebuild.yaml"
    2026-08-25-2103: "THE IMAGE BUILD COPIES WHAT THE BINARY EMBEDS (server + CLI Dockerfiles). An embedded schema was not in the build context, so every image died at publish with CS1566 while the checkout built green. Root schemas copy as a set, and a rule holds the pair. -> .agentsmith/phases/done/2026-08-25-2103-the-image-build-copies-what-the-binary-embeds.yaml"
    p0521: "A PHASE NAME FITS A LINE (architecture rules, CLAUDE.md, authoring skill). Slug 50 chars and 4 words, goal 200 — judged for the date-minted namespace only, because date ids sort BELOW counter ids and an ordering cutoff would have governed nothing. The embedded schema keeps its limit: the deployed fallback throws on an invalid draft. -> .agentsmith/phases/done/p0521-a-phase-name-fits-a-line.yaml"
    2026-08-25-5d7a: "A STEP PAGE KNOWS WHICH STEP IT IS (dashboard run detail). A step longer than one page opens past its own StepStarted, so the composer bucketed nothing and the pane read \"no sub-events\" while load-older visibly did nothing. The pane now names the step it fetched. -> .agentsmith/phases/done/2026-08-25-5d7a-a-step-page-knows-which-step-it-is.yaml"
    2026-08-25-5266: "THE SHIPPED SAMPLES PASS THE RULES WE SHIP (three context files + a discovery test). All three named an image; this repo's fallback resolved to an SDK that cannot build it. The demo's dead ci block is gone. A discovery test holds every shipped context to the product's own rule objects. -> .agentsmith/phases/done/2026-08-25-5266-the-shipped-samples-pass-the-rules-we-ship.yaml"
