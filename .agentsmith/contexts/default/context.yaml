    p0503d: "A CLAIM BECOMES A ROLE BECOMES A PERMISSION (backend role resolution, identity endpoint, config attribution). Roles from a role claim or a group mapping (MapInboundClaims off), additive custom roles, an env admin grant, overage detection, GET /api/identity, and X-Actor deleted. -> .agentsmith/phases/done/p0503d-a-claim-becomes-a-role-becomes-a-permission.yaml"
    p0487: "THE PIN CARRIES THE ARTIFACT RULE (backend). Embedded skills catalog v4.5.0 -> v4.6.0, the release carrying p0486\"s artifact-capture rule; its four pin-gated guards flipped from stating the gap to asserting it, with no test edited. The example config names v4.6.0 too, so the tag records which catalog a release runs on. -> .agentsmith/phases/done/p0487-the-pin-carries-the-artifact-rule.yaml"
    p0509: "A PHASE ID A RULE CANNOT READ IS A PHASE ID NOBODY CHECKS (backend tests). PhaseIdFactory mints ticket-derived ids like p19106a, read as p1910 through an unanchored pattern. Extraction now reaches the value\"s end, the counter branch unchanged; duplicate-id p0131c left the baseline. -> .agentsmith/phases/done/p0509-a-phase-id-a-rule-cannot-read-is-a-phase-id-nobody-checks.yaml"
    p0508: "THE GATE READS THE MESSAGE IT IS GATING (repo tooling). The gate matched the phase marker against the raw command string, so --amend --no-edit, -F, -t and -C passed unchecked and indistinguishably from a pass. A resolver now yields the message the commit will carry; what cannot exist yet passes loudly. -> .agentsmith/phases/done/p0508-the-gate-reads-the-message-it-is-gating.yaml"
    p0510: "THE CONFIG STUDIO ROUTES FIT IN THE FILES THAT MAP THEM (backend). One 245-line file mapped all thirty-nine config-studio routes, with no room for the annotations p0503a needs. Split by route surface into six files plus a write guard, all under the limit; its baseline row left with the lines. -> .agentsmith/phases/done/p0510-the-config-studio-routes-fit-in-the-files-that-map-them.yaml"
    p0506: "AN UNSIGNED REQUEST IS NOT A TRIGGER (backend + deploy). An absent signature header was accepted whatever the secret said, so an unsigned POST could start a run or answer a blocked master. Now refused wherever a secret is set; ${...} is expanded so a placeholder is not one; run control sits behind the dashboard gate. -> .agentsmith/phases/done/p0506-an-unsigned-request-is-not-a-trigger.yaml"
    p0511: "THE GATE COVERS THE AGENTS THAT DO THE WORK (repo tooling). An instrumented worktree copy never logged, yet a phase commit still blocked: CLAUDE_PROJECT_DIR is the launching session's dir, so ONE shared script gates every worktree. Adds a ledger line per phase commit and a loud pass for a shell-built message. -> .agentsmith/phases/done/p0511-the-gate-covers-the-agents-that-do-the-work.yaml"
    p0505: "A DATA REPO IS VERIFIED BEFORE IT IS DEPLOYED (backend harness). 123 measured rows over dbt/bundle/combined fixtures: check-jsonschema, sqlfluff and deps-then-parse red on named defects; bare dbt parse and bundle validate red on CLEAN, so neither is declarable. Offline guard recomputes hashes and verdicts. -> .agentsmith/phases/done/p0505-a-data-repo-is-verified-before-it-is-deployed.yaml"
    p0513: "THE PROFILE SHIPS THE GATE THAT SURVIVED (backend + skills). A profile command declares when_present, a path it needs, so p0505's per-shape evidence stops reding clean repos of another shape and hiding real gates. Ships the dbt-databricks profile; a test refuses any command the table does not record as declarable. -> .agentsmith/phases/done/p0513-the-profile-ships-the-gate-that-survived.yaml"
    p0512: "THE RECORD IS AN INDEX, NOT AN ESSAY (tests + context + CLAUDE.md). A state.done entry is capped at 400 characters by PhaseRecordLengthRatchetTests, which parses the record rather than greps it. The 273 already over are baselined and may only shrink, none may pass 3000, and the eleven longest went from 33,913 chars to 4,221. -> .agentsmith/phases/done/p0512-the-record-is-an-index-not-an-essay.yaml"
    p0495: "A COMMAND RUNS AS LONG AS THE OPERATOR ALLOWS (backend + dashboard). The Sandbox settings offered a step timeout of 900 and a live run's solution-wide dotnet test was still killed at 600.5s, rendered as \"not run · 600.5s\" — a sentence that contradicts itself. THE UI ALREADY DOCUMENTED THE CONTRACT THE CODE DID NOT KEEP: the run-command field's own help text says \"bounded by the step cap\", while SandboxStepRunner held a private const MaxRunCommandTimeoutSeconds = 600 and never consulted the operator's cap at all. Math.Max(600, default) was the tell — the ceiling was derived from the wrong quantity, so a project configuring a higher DEFAULT silently got a higher ceiling while the cap that governs the sandbox had no influence. THE CONSTANT IS DELETED RATHER THAN EXPOSED: a fourth knob would only contradict one the operator already sets, so the clamp is now against the resolved cap, threaded the way p0230 threaded the run-command default (ConfigResolutionPass -> pipeline context -> AgenticMasterHandler -> FilesystemToolHost -> every SandboxStepRunner, including mid-run AddSandbox escalations; ISandbox untouched). SandboxStepCap still only LOWERS, which is what a cap must do — what changed is that the producer may now ask for up to it, so raising the setting finally makes something run longer. A CALL SITE WITH NO CAP LEAVES THE REQUEST STANDING: the toolchain probe and the bootstrap hosts resolve neither number, and clamping them to the 60s fallback would have CUT what those agents may ask for from 600 — a regression dressed as a fix; the backend's own SandboxStepCap is their ceiling. THE TIMEOUT NOW SURVIVES THE EVENT BOUNDARY: StepResult.TimedOut existed and ProcessRunner set it, but SandboxResultEvent had no such field, so the timeline fell back to exitCode === -1 and printed \"not run\" beside a ten-minute duration. The event carries TimedOut AND TimeoutSeconds — the limit is needed to say what killed it, and deriving it from the duration would be the heuristic this repository keeps removing; exit -1 still reads \"not run\" for a command that never started. RunCommandTimeout is its own type because five ratcheted files were at their ceiling and each is now at or below it while gaining the cap. KNOWN GAP, STATED: the refusal to save a default above the cap lives in the dashboard only — ConfigDraftRules warns against a second copy of what a valid configuration is, so the API would still accept it. 4131 + 99 + 105 backend green, 677 dashboard green. Renumbered from p0492, which a parallel session claimed and merged first. -> .agentsmith/phases/done/p0495-a-command-runs-as-long-as-the-operator-allows.yaml"
    p0497: "THE INIT ACTION BELONGS TO THE CARD (dashboard). The operator read the Initialize button and its auto-accept tick as foreign, by colour and by position, and both halves had their own cause. THE COLOUR WAS NOT OURS: auto-accept was a bare checkbox input, so it drew the OPERATING SYSTEM's accent — the only colour on the page no token controls. THE POSITION WAS A MIXING OF KINDS: .ec-right is the card's metadata row (type badge, the quiet \"edit\" hint) and p0489/p0490 put the loudest element on the card into the quietest row on it. Both controls now wear the repo picker's .pick chip shape expressed as inline references to --accent/--accent-wash/--line: the class itself is scoped to .mock-config and this component ALSO renders in the system project panel, so half its uses would have gone unstyled — the tokens are declared on .mock-shell, which wraps both. The pair became one action group ended by a rule, so the row reads [name] ... [actions] | [badge] [edit]; recolouring alone would have left the ordering wrong, which is half of what was reported. APPEARANCE ONLY, PROVEN BY OMISSION: every test id, state and refusal path from p0489 and p0490 is untouched and their tests pass WITHOUT being edited — a visual phase that has to edit behaviour tests changed behaviour. Longhand borderWidth/borderStyle/borderColor and fontWeight throughout, because the checked state overrides them and React warns that removing a longhand beside its shorthand is how styling bugs start. The tests assert the accent token and the group's boundary and the phase says out loud that they cannot judge appearance — the operator's eye is the acceptance test. 141 files / 678 dashboard tests green, lint clean. -> .agentsmith/phases/done/p0497-the-init-action-belongs-to-the-card.yaml"
    p0501: "A PULL REQUEST BEHIND A POLICY ARMS ITSELF (backend + dashboard). Azure DevOps refuses p0490's immediate merge when a branch policy requires a build, so an init pull request votes approve as its own creator and sets AutoCompleteSetBy. PullRequestCompletion carries an outcome enum (Merged/Armed/Refused). -> .agentsmith/phases/done/p0501-a-pull-request-behind-a-policy-arms-itself.yaml"
    p0500: "A REPOSITORY IS READ ON THE BRANCH IT HAS (backend). All three remote providers returned the CONFIGURED default_branch unconditionally, so a connection-level branch a repository lacks blinded every read and init-project opened no pull request. One DefaultBranchResolver owns the precedence; the repo default wins. -> .agentsmith/phases/done/p0500-a-repository-is-read-on-the-branch-it-has.yaml"
    p0502: "A LINK IN A LIST ENDS WHERE THE URL ENDS (dashboard). The run detail pane linkified step messages with URL_SPLIT_RE = /(https?:\\/\\/[^\\s]+)/g, which runs to the next whitespace — and CommitAndPRHandler and InitCommitHandler join a run's per-repo pull-request URLs with \", \". Every link but the LAST therefore carried the separating comma inside its href and 404ed, which on a multi-repo run is every pull request except one. THE REPOSITORY ALREADY HELD THE RIGHT ANSWER IN ANOTHER FILE: lib/prUrls.ts (p0372) matches [^\\s)\\]>\"']+ and then trims a trailing [.,;:!?]+, doing the same job correctly for the outcome-prose buttons. Two modules answering \"where does a URL end\" with two regexes IS the defect, so the split moved INTO prUrls as splitOnUrls beside extractUrls and stripUrls, and the detail pane stopped owning a pattern — fixing the character class in place would have cured the symptom and kept the cause. THE TRIMMED PUNCTUATION GOES BACK INTO THE PROSE, not into the void: dropping it would render \"...9018 ...9019\" and silently rewrite the handler's own sentence, so concatenating every returned segment reproduces the input EXACTLY, which is what the test asserts instead of a hand-checked example. The tagged-segment shape replaces the capture-group split because that form needed two regexes that had to agree and cannot express a boundary that differs from the raw match — the trimmed comma belongs to neither part. THE EXISTING TEST COUNTED ANCHORS INSTEAD OF READING THEM: DetailPane_MultipleUrls_RenderSeparateLinks used the exact comma-joined input and passed for the defect's whole life, because two anchors did render and one was a 404; it stays, and a new case pins all three hrefs. CHECKED AND LEFT ALONE: Markdown.tsx autolinks through react-markdown + remark-gfm, which already follows the GFM trailing-punctuation rule and never sees this pattern, and every other href in the dashboard comes from structured data rather than a text regex. Confirmed red against the pre-fix pattern, on the href content and not merely on a missing export. -> .agentsmith/phases/done/p0502-a-link-in-a-list-ends-where-the-url-ends.yaml"
    p0499: "A KEY WITH A COLON SURVIVES BEING EDITED (dashboard). The Config Studio rendered every Record<string,string> config map as a TEXTAREA of \"one key: value per line\" and parsed it back with a split at line.indexOf(\":\") — the FIRST colon. The operator's tracker keys ARE label names containing a colon, so their live five-entry \"Pipeline by label\" map (agent-smith:init, :bug, :feature, :security-scan, :api-security-scan) round-tripped to EXACTLY ONE entry, {\"agent-smith\": \"api-security-scan: api-security-scan\"} — reproduced against the real parseMap before anything was built, 5 entries in, 1 out. The render side wrote k + \": \" + v back out, so the field LOOKED right until it was touched, and onChange re-parsed on every keystroke: opening the Edit Tracker dialog, touching that field and saving wiped the tracker's entire label-to-pipeline routing, after which no ticket triggers any pipeline. THE SHAPE IS THE FIX, NOT A SMARTER SPLIT — lastIndexOf breaks on a colon in the VALUE and a \": \" rule breaks on the live keys; two inputs per row cannot be split wrongly at all. ROWS ARE STATE, NOT A VIEW OF THE RECORD: a row being typed has an empty key and CANNOT exist in a Record, which is why deriving rows from the value swallowed a half-typed line (the second, milder fault in the same control), and why rows carry a stable id so an entry keeps its place while its key is retyped. The reseed rule compares the incoming value against what the field last EMITTED, not against what its rows currently produce — the latter reads an empty or duplicate row as an external change and destroys it — so the drawer switching entity still resyncs while an in-progress edit survives. ONE CONTROL, SO ALL MAPS MOVED TOGETHER: capabilityFields renders EVERY descriptor field of kind map through this component, so \"Lifecycle status names\" and anything the backend declares next inherit the fix instead of the defect. SERVER-SIDE WAS CHECKED AND NEEDED NOTHING — the map is a Dictionary<string,string> on every surface it crosses (TrackerEntity, TrackerConnection, RawTrackerEntry, RawConfigPatch, ConfigCatalogMapper), carried as a JSON object and a YAML mapping, both of which parse a colon-bearing key natively; the shredder lived only between the textarea and the request body. The tests drive a controlled harness that feeds the emitted map back in, because an inert spy models a parent EntityDrawer is not and would have pushed the fix toward never resyncing. p0351 CLAIMED TO HAVE CLOSED \"the LAST free-text gap in the Config Studio\" and then narrowed itself to model roles in its own first decision; the map fields were free text the whole time behind that headline. All six round-trip tests confirmed red against the textarea implementation. -> .agentsmith/phases/done/p0499-a-key-with-a-colon-survives-being-edited.yaml"
    p0493: "A RATE LIMIT IS WAITED OUT ON ITS OWN CLOCK (backend). A run on image 0.134.0 died with \"ClientResultException: HTTP 429 (too_many_requests: rate_limit_exceeded) ... have exceeded rate limit\". 0.134.0 DOES carry p0477 (ClientResultException and IsRetryableStatus are present at that tag, absent at v0.133.0), so the 429 was retryable there — and with no cluster logs, whether that run exhausted its five attempts or never retried at all is UNKNOWN. This phase does not claim to know; the fix is correct under either. THE SDK ALREADY DID THE OBVIOUS FIX, ONE LAYER DOWN, AND THAT IS THE PROBLEM. Measured through the p0239c test-transport seam rather than assumed (System.ClientModel 1.8.1 under OpenAI 2.8.0 / Azure.AI.OpenAI 2.1.0): a 429 costs FOUR attempts inside the SDK; Retry-After is honoured EXACTLY and with NO ceiling (20s asked produced 20s, 20s, 20s); and with no header the three retries fire in 0.03 seconds with no backoff at all. Stacked under the five outer attempts that is up to 24 provider calls for ONE logical call, its waits emit nothing into the run trail and re-acquire no throttle capacity, an hour-long Retry-After parks the run for THREE HOURS where no bound of ours can reach it, and a headerless 429 sends three more requests INSTANTLY to an endpoint that just said too many. SO THE SDK POLICY IS SET TO ZERO RETRIES on the OpenAI and Azure paths and TransientRetryChatClient becomes the only retry layer — the one that logs, bounds and re-acquires capacity. A RATE LIMIT IS ITS OWN WAITING CLASS: a socket fault keeps the configured ladder (4s, 8s, 16s, 32s, 60s), while a 429 waits the interval the SERVER named, or a rate-limit ladder floored at 15s (15/30/60/120/120) when no header came — an Azure throughput window is sixty seconds wide, so the network ladder expires inside a limit that routinely outlasts it. CEILING 120s PER WAIT, argued not round: twice the sixty-second refill window, so an honest throughput Retry-After fits and an hour-long one is clamped and SAID SO in the log rather than swallowed; five waits at the ceiling is ten minutes, a third of the 1800s default run watchdog, so the retry can never be what a run dies of. The p0477 warning that called a 429 a \"Transient LLM network error\" now names the class and the reason for the wait it chose. NOT TOUCHED: the Anthropic handler already reads Retry-After and clamps at 60s; streaming stays unretried (nothing calls GetStreamingResponseAsync); RetryConfig gains no knobs, because a refill window is a property of the provider and not of taste. Both halves confirmed red against the pre-fix behaviour. -> .agentsmith/phases/done/p0493-a-rate-limit-is-waited-out-on-its-own-clock.yaml"
    p0492: "A COMMAND THAT ENDS IN A QUOTE CAN BE CITED (backend). Run 2026-08-21T06-29-48-6697 (ticket 19222) reached step 42 of 43, spent $8.19 and had the delivery account run 44 searches of its own — then was refused on one criterion, \"final restore, build and existing test commands exit successfully for both affected repositories\", over a command it had cited CORRECTLY AND IN FULL. TWO RULES FROM p0481 CANCELLED EACH OTHER OUT: EvidenceCommand.InCitation trims the evidence grammar own closing quote off the CITATION, and CitationMatch requires a SHORTENED command to be cited at exactly its own length, because a head is shared by every sibling that differs only in its paths. The command ends in --logger \"console;verbosity=minimal\", so the trim shortened the cited side and not the side it was compared against, and the equality failed by exactly ONE character — for that command and for every command ending in a quote, for its whole life. Reproduced offline before anything was built: citation 186 characters, 185 after the trim, command 186, StartsWith true, equality false. THE FIX IS SYMMETRY, NOT A LOOSER RULE: the comparable form (trailing grammar quote and elision marker removed) is named ONCE on EvidenceCommand and BOTH sides are read through it. Both p0481 intents survive — the grammar closing quote is still absorbed and a shortened command is still named in FULL, with Citation_TwoSearchesDifferingOnlyInTheirPath_AreNotBothNamedByTheirSharedHead green and untouched. Trimming only ever SHORTENS and now shortens both sides, so p0473 one-directional prefix rule and its 60 percent floor still decide and nothing invented becomes resolvable; what it buys is a few trailing quote characters of slack at the very END, never the head-for-tail substitution the full-length rule exists to refuse. The fixture is the live verification script fed through PhaseCommandLog.Record rather than a frozen literal, and a separate case asserts the fixture own premise — that it really is shortened and really does end in a quote — so the phase cannot pass by accident if the 200-character cap or the head/tail split ever moves. Confirmed red against the pre-fix behaviour. -> .agentsmith/phases/done/p0492-a-command-that-ends-in-a-quote-can-be-cited.yaml"
    p0488: "A PICKER WITH MANY REPOS STAYS LEGIBLE (dashboard). The connection repo picker rendered EVERY discovered repo as a wrapping chip, so a connection with hundreds of repos was a wall — and a filter alone would only have made the wall smaller, not orderly. The discovered repos are ROWS now (checkbox, name, default branch) in a capped scroll window, and chips are kept for the few refs actually selected. NO PAGING AND NO INFINITE SCROLL, on purpose: the discovery snapshot arrives in ONE response and already lives client-side, so paging would invent round-trips that buy nothing and infinite scroll inside a form field steals the scroll the form needs — instead a window of 25, a show-more control, and a count line that always states showing-N-of-M-matched against M-discovered, because silent truncation is the one thing forbidden. A WILDCARD IS A RULE AND AN EXACT NAME IS A PICK, and the form blurred them: both land in the same repos array, an exact ref names one repo forever while conn/Sample.* keeps matching repos discovered next week. So a rule chip carries its LIVE match count, and a row a rule already covers renders with NO checkbox at all and reads 'covered by conn/Sample.*' — otherwise a click adds a redundant exact ref that shadows the rule. THE FILTER BOX IS ALSO THE WILDCARD BOX: the separate 'name or wildcard' input below the chips was the visible untidiness, two inputs for one thought, and typing a pattern now filters the list AND offers to add it as a rule with the count it currently matches, so the wildcard is visible before it is saved. Select-all-filtered proposes the one rule ahead of N exact refs. refMatches moved to lib/repoRefs.ts with patternMatches + isRule so the inventory and the picker can never disagree about what a rule covers; no re-export shim. p0345c's four discovery states read unchanged and 'filter matches nothing' is a fifth, not a replacement. -> .agentsmith/phases/done/p0488-a-picker-with-many-repos-stays-legible.yaml"
    p0489: "A PROJECT INITIALIZES ITSELF FROM THE DASHBOARD (backend + dashboard). Adding a project meant hand-writing a ticket per project just to trigger init, and the operator's worry was whether the token may CREATE tickets. IT NEVER HAS TO: init-project's own preset carries FetchTicket with the note that it no-ops on ticketless runs, the CLI's init builds a PipelineRequest with no TicketId, and ExecutePipelineUseCase has always stamped such a run trigger='manual'. The ticketless run is not a new mode — it is the mode init was written for. THE LAUNCH IS ResumeRunLauncher'S SHAPE: admit, record, enqueue, with no claim and no tracker call, because TicketClaimService takes a lease keyed on a ticket and transitions that ticket through the tracker, both meaningless here; PipelineQueueConsumer then runs it exactly like a polled run, which is where the ledger, cancel, delete and cost accounting come from for free. NOT THE SPAWNER PATH — the CLI-in-a-container route forwards only secrets and Redis to its pod, no database binding and no config mount, and it bypasses capacity admission entirely. TicketId STAYS NULL, no synthetic id: a fabricated ticket would buy the ActiveRun lease (whose whole lifecycle is keyed on TicketId) at the price of fake identity leaking into the run row, the poller's lease check and the tracker finalize. SO THE RUN ROWS ARE THE DOUBLE-START GUARD, and that is why the launcher PRE-CREATES the queued row rather than letting the executor mint it on dequeue — a row that appears only when the consumer starts leaves the guard blind for as long as the request sits in the Redis queue and behind the consumer's parallelism semaphore, so two clicks would start two inits and the answered run id would be a 404 meanwhile. No projector logic is duplicated: RunEventApplier already treats a pre-existing queued row as the canonical pre-start state and promotes it. NO CAPACITY IS A REFUSAL, NOT A QUEUE ENTRY (the capacity queue re-validates a TICKET's native status every tick and a ticketless entry has nothing to re-validate), admission mirrors the spawn sequence — footprint, record, corpse reap, quota probe, atomic reserve — and a refusal RELEASES the recorded footprint so it is indistinguishable from a launch that never happened. The re-run is the same button, which is safe because InitCommit skips a repo with no staged changes. Two failures, two places, no third: a refused launch answers inline at the button (409 with the live run id, 503 with the budget's reason) and stays pressable; a started run that fails is its own run page, so the endpoint hands back the run id and the button links there. Init only — no pipeline parameter. AddProjectInit composes in AddDashboardApi, not beside ResumeRunLauncher: the file-length ratchet refused the obvious home, and one feature gate now decides both whether the endpoint exists and whether its services do. -> .agentsmith/phases/done/p0489-a-project-initializes-itself-from-the-dashboard.yaml"
    p0490: "AN INIT PULL REQUEST CAN ACCEPT ITSELF (backend + dashboard). An init pull request is generated .agentsmith/ context on a repo that had none, and the operator states plainly that nobody looks at it — so a checkbox defaulting to ON skips a review step that was not happening anyway. ISourceProvider could open, find, re-body and un-draft a pull request and could not FINISH one; completion is added there and implemented for all four providers at once (GitHub Merge, GitLab merge with the answer's state asserted, Azure Repos Completed with LastMergeSourceCommit so a moved head refuses, and Local by fast-forwarding the default branch through git fetch . work:default, which also works while that branch is not checked out). Direct push to the default branch was the OTHER option and is worse: it dies on a protected branch, which is exactly the environment this runs in, while open-then-complete survives the policy and stays auditable. THE SIGNATURE CARRIES THE SOURCE BRANCH because Local has no pull request — its 'URL' is the sentence CreatePullRequest returns, and parsing a branch out of English would have been a fiction. A REFUSED COMPLETION IS NOT A FAILED RUN: policy, required reviewers, required builds, a non-fast-forward, even a throwing provider all become Refused(reason), the pull request stays OPEN, the reason lands per repo on p0347's PullRequestsJson as completion_refused, and the step returns Ok — the pull request is init's output, not its success criterion (p0321). A LATENT BUG FOUND ON THE WAY, which would have made the whole feature a silent no-op in production while passing every in-process test: PipelineRequest.Context is Dictionary<string,object>, so a bool enqueued through the Redis job queue comes back as a JsonElement and a plain TryGet<bool> reads FALSE — the flag is read through PipelineContext.Flag, pinned by a test that drives a real serialize/deserialize. SCOPE ADDED DELIBERATELY: three surfaces asked 'is status opened' as a proxy for 'does a pull request exist', so the moment a run merges what it opened the side rail and the snapshot mapper would have LOST every link and a merged pull request would have filed itself under runs that produced none — split into HasPullRequest server-side and prStatus.ts client-side. The ENDPOINT defaults to false while the CHECKBOX defaults to on: a body-less POST must not turn silence into consent. Completion runs after PrCrossLink's second pass, never on a repo whose pull request was skipped or failed. The ratchet forced a real extraction — all three platform providers were over the length limit, so the shared URL-to-id parsing behind body-update, mark-ready and complete moved into per-platform PullRequestUpdater types and each provider got shorter while gaining the capability. -> .agentsmith/phases/done/p0490-an-init-pull-request-can-accept-itself.yaml"
    p0482: "THE LANDING PAGE SHOWS THE PRODUCT (website + docs). Three diagrams and no screenshot: lifecycle.svg in the hero, coding-loop.svg and control-flow.svg below it. Measured rather than asserted, 29 / 54 / 153 text elements against 1159 words of prose whose jargon density is fine, so the overload was in the pictures and not in the writing. control-flow.svg alone is a reference poster (26 numbered steps, a table of model calls, a tick chart per pipeline, a footnote on what it cannot show) and coding-loop.svg carries C# type names, which is contributor material on a page whose reader is deciding whether to try the thing at all. THE HERO SHOWED ARCHITECTURE AND PROMISED AN OUTCOME: four tracker boxes and one orchestrator box, while its own alt text claimed \"opens one PR per repo and resolves the ticket\", which was nowhere in the picture, and half the canvas stayed empty after the animation settled. NOW THE PRODUCT LEADS: the hero is the runs board cropped to the counters and the first waiting question, so COST TODAY sits directly under the tagline that claims every run shows its cost, and a run that PAUSES TO ASK is visible above the fold. Then the finished run (five-beat spine, PR button, $0.42, 7 LLM calls) and the config studio, shown instead of claimed. ONE DIAGRAM SURVIVES, at the bottom, for the reader who has already seen the product. THE HEAVY TWO MOVED RATHER THAN DIED: coding-loop.svg was a duplicate of the lifecycle page and its website copy is gone; control-flow.svg moved into reference/pipelines/ with a paragraph explaining that it is generated from the presets by a test that fails when code and picture disagree. NO NEW CAPTURE AND NO DEMO INSTANCE: the runs and run-detail shots already existed from p0462, cropping was the only edit, which also avoided a second parallel server after the p0465 incident. Eleventy build green; all four images verified loaded over CDP, since a blank frame in the first screenshot was a loading=lazy artefact of the capture and not a page fault. -> .agentsmith/phases/done/p0482-the-landing-page-shows-the-product.yaml"
    p0470: "NO EVIDENCE IS LOST WITHOUT SAYING SO (backend). p0469 made the agent's own commands reach the delivery account at all, and the cap then BOUND: MaxEntries = 40 with Entries.RemoveAt(0), against a live migration phase that issued 157 run_command calls — and the searches that prove an ABSENCE run early, which is exactly what oldest-first eviction discards. WORSE THAN THE LOSS IS THE SILENCE: a trimmed list and a complete one read identically, so a missing command reads as a command that never ran, and coverage is most of what the account is asked to judge. THE BUDGET IS CHARACTERS, NOT AN ENTRY COUNT (30k, in its own type PhaseCommandBudget — PhaseCommandLog was 112 against a hard 120 and is not in the length baseline, and 'how much of the record is kept' is its own reason to change). EXISTENCE OUTLIVES OUTPUT: an entry's output is shortened, OLDEST FIRST, and a whole entry is dropped only once no output is left to give; at 157 realistic commands every command line survives and the newest keep their output. Trimming runs in Record under the same lock, so Evidence stays a PURE read — a read that mutates makes two calls disagree — and what is STORED stays inside the budget, so the checkpoint carries a bounded list instead of 157 commands times a megabyte buffer; the 400-char record-time tail remains the ceiling the budget may only shrink below. A TRIMMED TAIL IS NOT SILENCE: 'no output' is what proves a search found nothing and p0452 pins that string, so a taken output reads 'output not shown (trimmed to fit)' and carries the distinction as a field through a park and resume. THE RAN-COUNTER IS MONOTONIC, never Entries.Count — a count taken from the list it describes degrades with it and would report 82 of 82 on a record that lost 318 — public and init so a resume restores the phase's count, and a blank command returns before it because it never ran. The notice LEADS the list, is absent when the record is whole, and carries no leading 'word:' because p0469's CitationResolver reads that as a citable step name. Command text capped at 200 chars: run_command takes arbitrary shell and MaxEntries was bounding a heredoc-sized command by accident. MaxEntries and APhaseThatRanHundredsOfCommands_HandsOverItsLatest are RETIRED here on purpose — that test asserts the first command is absent, which is the negation of this phase. 3987 green (+9 -1), 105 harness green, 99 Sandbox.Agent green. -> .agentsmith/phases/done/p0470-no-evidence-is-lost-without-saying-so.yaml"
    p0473: "A CITATION IS WRITTEN THE WAY IT IS READ (backend). p0469 required a cited command to be a substantial prefix of one that ran and left the prompt saying only 'cite the command' — a validator enforcing a contract its own instruction never states. A live run then SAW the evidence, ran an inventory over both repositories, got PASS from each, and was refused for describing the two commands in prose: the substance improved and the outcome got worse. THE PROMPT MOVES, NOT THE RESOLVER — loosening the match again restores the surface where a model closes a criterion by quoting a string it read in some command's output; the multi-command form was already built (the resolver splits on semicolons) and the account was simply never told. THREE DEFECTS, TWO FOUND BY TESTS: splitting a citation on NEWLINES turned a verbatim heredoc into four fragments none of which had run, so the whole citation is tried before it is taken apart; CommandOf took the FIRST to LAST apostrophe and a command carrying its own quotes made the slice begin inside the heredoc marker, so extraction now ends at the apostrophe introducing the exit clause; and the prefix test was SYMMETRIC, so a two-part citation's quoted span, which begins with a real command and continues into an invented one, resolved — caught by an existing test while the first two were being made to pass, and now one-directional. SPLIT AT THE CEILING RATHER THAN RAISING IT: the resolver hit 121 against a hard 120 and the cheap way back was deleting the comment recording that hole; CitationMatch and EvidenceCommand are their own types and the resolver is 57 lines. Tests are built from the citation the live run produced, because a synthetic one passes at every stage and proves none of it. 4015 + 105 + 99 green. -> .agentsmith/phases/done/p0473-a-citation-is-written-the-way-it-is-read.yaml"
    p0474: "A CITATION IS A LIST (backend). p0473 told the account to join several commands with a SEMICOLON, and a semicolon is a shell operator — twenty of one live run's commands carried one. The account obeyed, joined two compound commands, and the resolver split the pair into fragments that had never run. Reproduced offline against the live string in under 50 ms. NO SEPARATOR CAN WORK: pipe, ampersand and newline all occur inside commands too, so the citation stops being one string and becomes a JSON ARRAY on the row — one element is one whole thing, a diff path or a command copied verbatim. The answer was already a JSON array of rows, so the list costs nothing, and a bare citation string still reads as a one-element list. THE RESOLVER STOPS SPLITTING, which also retires p0473's whole-citation-first fallback: that branch existed only because splitting broke correctly quoted commands. ONE-SHOT IS WHY THIS COST TWENTY RUNS — SpecSetDeriver has had three attempts and a stated objection since p0422 while SpecAccountant had one call and no way back, so every decision about the citation FORM was a single bet settled by a forty minute pipeline, and three were lost in a row on the same criterion with the work finished and only the bookkeeping refused. An account whose citation resolves against nothing is now told which element failed and what form is accepted, and answers once more; a criterion it reported as NOT satisfied is never re-asked, because that is an answer rather than a formatting failure, and the re-ask carries the objection but never the verdict. Two committed tests pinning the separator, one of them p0473's own, are converted rather than left to be discovered. 4024 + 105 + 99 green. -> .agentsmith/phases/done/p0474-a-citation-is-a-list.yaml"
    p0491: "THE OUTPUT A COMMAND PRODUCED REACHES THE MODEL (backend). A run parked asking the operator to provision a checkout that was there all along — its sandbox 'returned no output for pwd, ls, project discovery and mediator inventory'. Those commands exited 0 with 27,355 / 2,591 / 28,888 characters IN THEIR RESULT BODIES and ZERO streamed: run_command built the model-facing text out of the live progress feed, so a stream that fell behind turned a full inventory into an empty stdout and the master truthfully reported what it was handed. TWO ENDS, ONE DEFECT — the text now comes from StepResult.OutputContent, which the agent has captured since p0258 and which arrives with the result or not at all (the stream stays the drawer feed and the fallback for a pre-p0258 agent image; stderr has no body to switch to and says so); and SandboxRedisChannel drains its event stream to EXHAUSTION instead of one 100-entry page per 250ms tick, because the cursor is per JOB — entries left unread when a step returned were read by the next step and discarded for carrying another step id, which is why the loss alternated between repositories and why looking again sometimes worked. The catch-up is bounded at the stream's own trim length, so a producer that never quiesces costs a page of reads, never a hang. p0423 already published both numbers; a run step that streamed less than its body now says so at warning level. THE FIRST DIAGNOSIS WAS WRONG AND WAS NOT BUILT: compaction was blamed, but no fold happened in that run — the fold log line never appears, the summarizer never ran, the context grew monotonically to ~82k with the prefix cache holding, and the two 'Summarization client resolved' lines are the master chain being BUILT. The companion skills rule ('if you cannot see a result, run it again') is REFUSED, not deferred: that master re-ran the command twice, was handed a truthful empty stdout each time, and parking to ask was the honest move — the rule would teach masters to distrust an accurate signal. Fixtures at the live size (~27,000 chars, 250-entry burst), confirmed red against the pre-fix behaviour. -> .agentsmith/phases/done/p0491-the-output-a-command-produced-reaches-the-model.yaml"
    p0486: "THE COMMAND WRITES THE ARTIFACT IT CAPTURES (skills). Run d8d1 migrated two repositories off MediatR and MassTransit, built both, passed 226 + 2,009 tests and opened its pull requests — and the operator started both hosts by hand and confirmed it works. The gate refused it because the inventory document \"claims 35 request handlers and its listed names do not total 35\". The criterion came from the TICKET, in the operator's own words: \"run these greps and capture the results\". The agent RAN every grep, the trail shows them, and then retyped them into prose. A MODEL THAT RETYPES A LIST SHORTENS IT — that is the mechanism, not carelessness, because summarising is what reading is for. So the coding master redirects the command into the artifact instead of copying it, and a number in such a document stands on the entries beneath it. THE REDIRECT TARGET IS STATED AS REPO-RELATIVE: run_command runs the shell inside the repository named in its own argument while write_file takes a repo-prefixed path, so a rule that only said \"redirect it\" would produce repo/repo/... THIRD OF THREE — p0481 stopped the model copying a command into a citation, p0483 stopped it relying on being told and let it LOOK, this stops it transcribing output into a document; each was a model asked to reproduce text it had already caused to exist. A review killed the spec's first test section: there are NO goldens for master skills (the skills repo has no test suite, only a frontmatter validator), so the guards are pin-gated PackagedMaster assertions in the pattern p0412 established — they state the gap out loud below the arming release and arm themselves when the pin moves, which is p0487 and is NAMED rather than deferred. The artifact-phase paragraph check is gated on the same release because that paragraph is itself newer than the pinned v4.5.0. Skills PR #163, coding-agent-master 1.23.0 -> 1.24.0. -> .agentsmith/phases/done/p0486-the-command-writes-the-artifact.yaml"
    p0484: "A SEARCH THE ACCOUNT RAN IS EVIDENCE (backend). p0483 gave the delivery account a new kind of evidence and forgot to let it SAY so. The first live run (2026-08-20T13-38-47-d8d1, ticket 19217) ran FIFTEEN searches across both repositories, settled an absence criterion by looking, and was refused with \"claimed satisfied but cited nothing\" — CitationResolver accepts a path from the diff or a command from the COMMANDS list, and a search the ACCOUNT ran is neither. It was allowed to look and not allowed to report that it had looked. Each search now leaves an evidence line in the grammar the reader already knows, \"repo: the account searched 'pattern' exited N\", so nothing learns a new form and exit 1 keeps meaning the absence is proven; the PATTERN is what is cited, because the account wrote it and can reproduce it exactly. THE ORDERING IS THE DEFECT: searches happen DURING the model call, so the resolver is built AFTER it — and again after the re-ask, which runs searches of its own. Only a search that REACHED the branch is remembered: an unknown repository or a blank pattern never ran against anything, and recording those would let a citation resolve against a search that never happened. AccountSecondPass and SearchOutcome extracted because SpecAccountant stood at 119 of a hard 120 and BranchSearch went to 131. Same live run, operator verdict: the migration itself was good — server starts and its API opens, worker starts, both solutions build, Server 226 and worker 2,009 tests green — and the gate still recorded FAILED. 4083 green. -> .agentsmith/phases/done/p0484-a-search-the-account-ran-is-evidence.yaml"
    p0483: "THE ACCOUNT CHECKS INSTEAD OF TRUSTING (backend). FIVE PHASES HAVE FIXED THE FORM OF A FACT COPIED INTO A BUDGETED LIST AND COPIED BACK OUT: p0469 got the agent's commands to the delivery account, p0470 stopped the list dropping them, p0473, p0474 and p0481 fixed how one is cited. Every one was a RETRIEVAL failure — the reader needed a fact that existed and had no way to reach it — so the copying is the defect. The account now SEARCHES THE BRANCH ITSELF (BranchSearch over the phase's sandboxes, which PhaseAccounting already holds), and an absence criterion stops needing a cited command, a reach argument or a citation format at all. PERSUASION AND RETRIEVAL ARE NOT THE SAME CHANNEL: the account stays a fresh instance told it did not do the work, because a model that believes it did confirms itself, so \"trust me, it is covered\" stays excluded while \"what is actually in the branch\" does not — and a search it runs is STRONGER than anything the agent could offer, because the agent's commands ran at some point during the work while the sandbox holds what the branch carries now, which is already the prompt's own tie-break. GREP WITH A FIXED ARGUMENT VECTOR AND NO SHELL — the pattern is one argv element, so nothing a model writes becomes a command, pinned by a test searching for \"x'; rm -rf / #\". EXIT 1 IS THE PROOF and exit above 1 proves nothing, the same inversion p0469 had to amend the prompt for. REASONING BECOMES A TOOL-BEARING TASK: the account runs on it and the factory did not wrap it with FunctionInvokingChatClient, so the tool would have been silently ignored — the wrapper is inert without tools, so the other four Reasoning callers are unaffected, and the change lands in the CONTRACT's doc because ChatClientFactory is ratcheted and may only shrink. Twelve searches per account, because every one is a sandbox round-trip inside a model call at the last step of a run. READING ONE COMMAND IN FULL WAS CUT, not deferred: once the account can look, it buys nothing, and it would have made PhaseCommandLog hold every command in full — the memory p0470 deliberately bounded. Asserted on ChatOptions rather than on the prompt, because a tool that never reaches the call is a phase that changed nothing. No sandbox means no tool and the previous wording. AccountTools extracted because SpecAccountant hit 123 of a hard 120. 4073 green. -> .agentsmith/phases/done/p0483-the-account-checks-instead-of-trusting.yaml"
    p0481: "A SHORTENED COMMAND STAYS QUOTABLE (backend). Run 0944 built both repositories, passed 2,235 tests, pushed and opened two pull requests, and was refused at the delivery gate over ONE apostrophe. PhaseCommandBudget cut an 820-character script at exactly 200, the cut landed inside the literal echo 'No MassTransit references found', so the rendered line carried an unbalanced quote and the account closed it — 202 characters cited against the 201 the line showed, one too long to be a prefix under p0473's one-directional match. THE SECOND REFUSAL IS THE SAME CUT FROM THE OTHER END and was never a citation failure at all: \"no listed successful absence search covers Wolverine local-queue usage across both repositories\" refused a search the agent HAD run, whose pattern sat inside the cap and whose PATHS sat past it — 21 of that phase's 106 commands were over the cap, and an end-cut removes exactly what an absence criterion is judged on. SO THE MIDDLE GIVES WAY: head 130, marker, tail 69, the same 200 characters, trim then collapse then measure then elide, and the TAIL BEGINS AT A WHOLE ARGUMENT because half a path printed as a path is evidence that is partly true. A SHORTENED COMMAND IS CITED ONLY IN FULL — the first draft accepted its visible head at 65% and a review broke that: sibling commands share their head BY CONSTRUCTION and differ in the paths they ran against, so a head-only citation names all of them and closes a two-repository criterion with a one-repository search, this phase's own refusal inverted into a false positive. NUMBERING THE EVIDENCE AND CITING BY INDEX WAS DRAFTED AND DROPPED for the same reason: an index resolves against SOME real command whatever the model writes, trading a loud failure for a silent mis-attribution, and it would have broken the step-name reading, the cost model behind the 30k budget and seven committed tests that neither refusal needed. Found while reviewing: THE BUDGET NOTICE WAS CITABLE — it carries no apostrophe, so the command reading fell back to the whole line and any 60% prefix of it resolved; p0470 kept it out of the STEP reading and left this one open, and a line with no quoted span now names no command. Elision extracted to CommandElision because PhaseCommandBudget stood at 110 of a hard 120. Fixtures are the run's real commands at their real lengths, anonymised — the first Wolverine fixture claimed both repositories survived when only the second did, so the surviving tail is asserted for what it actually holds and the two-repository fact is pinned on the evidence line's repository prefix instead. 4059 green. -> .agentsmith/phases/done/p0481-a-shortened-command-stays-quotable.yaml"
    p0478: "A CHECKPOINT RESTORES WHAT IT CAN (backend). A mid-run question killed the run that asked it: parked at phase c with thirty-seven of fifty-five steps done and two phases complete, the operator answered in the dashboard, and the resume threw NotSupportedException on '<>z__ReadOnlySingleElementList`1[SpecAccount]' out of PipelineContextSerializer.TryRestoreEntry, through ResumeRequestReader.TryRead, into ExecutePipelineUseCase. Answering again could not help — the same checkpoint is read again. THE TRIGGER IS A COMPILER TYPE IN THE BAG: a collection expression assigned to IReadOnlyList<T> compiles to an internal type (<>z__ReadOnlySingleElementList for one element, <>z__ReadOnlyArray for several — so ANY size is affected, found while testing), the serializer records value.GetType(), and the checkpoint names something System.Text.Json can write and cannot construct. THE DEFECT THAT MATTERS IS THE ASYMMETRY: TrySerializeEntry has always caught NotSupportedException/JsonException/InvalidOperationException and carried on, while TryRestoreEntry caught only JsonException — and said 'skipped' while doing it. With the read path as forgiving as the write path the run would have resumed even without the type fix; both ship, tolerance as the net and normalisation as the repair. NAMING List<T> IS NOT ENOUGH — Serialize validates that the value derives from the input type, so the value is MATERIALISED; the first implementation only renamed it and the tests caught that. The tolerance test declares a type with two parameterised constructors, because the compiler-generated one cannot serve: Type.GetType never resolves it, so that entry is skipped one branch earlier and the test would pass either way (three fixtures discarded before this one). Revert-probed RED on both halves independently, after a first probe replaced the WRONG catch clause — the string occurs twice — and read as covered while nothing tested it. -> .agentsmith/phases/done/p0478-a-checkpoint-restores-what-it-can.yaml"
    p0477: "A PROVIDER SAYING NO DOES NOT END THE RUN (backend). Measured 2026-08-20: sixty-two minutes in, twelve of fourteen ledger items done, both pull requests already open, and the master died on ClientResultException HTTP 429 from an Azure deployment — nothing retried it, and the seven criteria the keystone then refused were the consequence of a master killed mid-work rather than a judgement on the branch. THE RETRY EXISTED AND COULD NOT SEE THE EXCEPTION: TransientRetryChatClient walks the inner chain for HttpRequestException and IOException and already treats 408/429 as retryable when it finds one, but the Azure and OpenAI SDKs raise ClientResultException from System.ClientModel; its own comment names the assumption that made this a gap, that a status error 'is left to the SDK's own 429/5xx retry', which holds for Anthropic and not for these. p0376's rule carries over unchanged — 408, 429 and 5xx only, because every other 4xx can never succeed. SECOND DEFECT, SAME SENTENCE: the same run failed UpdatePullRequestAsync four times with VssServiceException 'Invalid argument value' across both repos, leaving the pull requests with NO description. The first draft of the spec blamed a missing length guard; the compiler disagreed, because MaxDescriptionChars and TruncateDescription already existed and are applied when a pull request is CREATED — only the UPDATE path lacked the call, and the run REUSED pull requests opened earlier so every write took that path, with cross-link lengthening the body by design. Pinned as a RULE over the source (every Description assignment truncates) rather than a case test, because the defect was a second path forgetting; revert-probed RED. The attempted length now travels in the warning, since the exception names no field. -> .agentsmith/phases/done/p0477-a-provider-saying-no-does-not-end-the-run.yaml"
    p0475: "THE DRAIN TEST WAITS BEFORE IT STOPS (tests). Broadcaster_DrainLagsThenQuiesces waited for the RUN row, stopped the only broadcaster, and then waited up to sixty seconds for the TRAIL row that only that broadcaster writes — passing on a fast machine and timing out on a loaded CI runner, where it surfaced on p0474's pull request and had nothing to do with it. THE PRODUCT IS CORRECT: StopAsync cancels the loop's token and awaits it, so an in-flight drain is abandoned BY DESIGN — the Redis stream is the source of truth, the cursor advances only over processed entries, and a restart re-reads what was dropped, which Broadcaster_HighVolumeRun_RunFinishedPersists proves by killing process A mid-drain and letting B catch up. A flush-on-stop promise would have been new behaviour invented to satisfy a mis-ordered test. Both waits now happen while the broadcaster is up; every assertion is unchanged, and CiSafeWait stays sixty seconds because a longer wait makes a race rarer rather than correct. Its own phase rather than a fix inside p0474, which was green locally and through the gate. -> .agentsmith/phases/done/p0475-the-drain-test-waits-before-it-stops.yaml"
    p0466a: "MAIN BUILDS AGAIN (dashboard + tests). p0466 landed two breaks. FilterRail holds an EXHAUSTIVE Record<EventType, string> and p0466 published PhaseStateChanged and PhaseRecorded without labels, so the dashboard stopped compiling the moment it merged; the branch was green because it never TYPE-CHECKED — 648 vitest tests and a clean linter both pass on that file and the exhaustiveness error appears only in pnpm build. Kept the map total rather than making it Partial with a fallback: the compiler is what tells the next person adding an event that the rail needs a name for it. THE SECOND BREAK WAS AN UNCOMMITTED FIX: rebasing p0466 onto main surfaced a real cross-phase break (a p0469 test constructs SelectPhaseHandler with two arguments where p0466 gives it three), it was corrected in the WORKING TREE, the full suite was run against that tree and reported green, and the branch was pushed without the correction ever being committed — every number in that report was true about a tree nobody merged. Verification has to name the artefact it verified. -> .agentsmith/phases/done/p0466a-the-filter-rail-names-every-event.yaml"
    p0469: "THE ACCOUNT SEES WHAT THE AGENT RAN (backend). p0452 published the agent's commands on every exit except completing, so a phase that finished normally showed only the verify step. The log is opened once per phase, owned by the phase not the tool host, and a search exiting non-zero can close an absence criterion. -> .agentsmith/phases/done/p0469-the-account-sees-what-the-agent-ran.yaml"
    p0434: "THE PR STEP SURVIVES A PROVIDER BLIP (backend). Discovered by p0433, not by a run: declaring CommitAndPR a MODEL step made visible that on the path where it reaches the account first, PhaseAccounting TAKES rather than reuses — so the step that opens the pull request makes a provider call at the last step of the run, after every unit of work is done. The p0350 shape, which cost two draft PRs the one time it happened for real. Fix: a failure taking the account becomes an account that COULD NOT BE TAKEN — the same shape TakeAsync already returns for a failed delivery diff — so the gate still refuses the run (p0420) but refuses it WITH a pull request to look at. Rejected: a retry (adds latency to the same failure) and moving the account earlier (only helps the path that was never exposed). Cancellation still propagates, filtered on the token, because swallowing it would turn an operator cancel into a silent unaccounted delivery. FOUND WHILE BUILDING: PhaseAccounting sat at 116 of its 120 ratchet lines so the try/catch did not fit; the first extraction, SpecAccountLog.Write(logger, account), was refused by NoStaticStateRuleTests — a static that needs a collaborator is a service without a constructor. Inverted: the static composes LINES, the caller writes them. -> .agentsmith/phases/done/p0434-the-pr-step-survives-a-provider-blip.yaml"
    p0432: "THE SUITE MIGRATES ONCE (tests). 41 sites called Database.Migrate(); the cost was O(classes) and it had already cost two CI cycles whose victims were NOT database tests — on a two-core runner the migration burst starves async continuations, and the casualty is whichever test asserts a wall-clock bound (#501 a 50ms send bound, #502 a monotonic-gap window). The stores are `Data Source=:memory:`, so the spec's file-copy did not apply — SQLite RESTORES a database from another connection far faster than it builds one, which is the same O(1) win by a different mechanism (MigratedStoreTemplate, lazy template + BackupDatabase behind a lock, since connections are not thread-safe and xUnit runs classes in parallel). A shared store was rejected outright: a copy is not a share, and isolation is what the 39 separate stores bought. Adopted by rewriting ONLY the exact two-line shape (open private in-memory store, then migrate) across 21 classes; the rest build stores differently and are worth converting when someone is already in the file. The rewrite hit the template's OWN migration method on the first pass — caught at once, and the reason to keep it narrow. Third step done in the same phase: both widened hang-detectors back from 120s to 30s, because leaving them would keep the stopgap's cost (a real deadlock taking two minutes to surface) after removing the pressure that justified it. 3866 green. -> .agentsmith/phases/done/p0432-the-suite-migrates-once.yaml"
    p0446: "THE NOT-IN-TICKET VERDICT NEEDS THE WHOLE TICKET (backend). The cut reviewer has three verdicts and they do not need the same evidence: a CONTRADICTION is visible in the phases alone, so is an UNCHECKABLE criterion, and only NOT-IN-TICKET needs the ticket — all of it. The prompt cut the ticket at 20,000 characters and asked anyway. LIVE RUN 2552: a 44,302-character ticket, 45% shown, five criteria of phase d rejected as not-in-ticket. All five ARE in the ticket, every one past the cut — the test command with 'all tests must be green' at char 39,840, the eight-point final-report list at 42,500, a named cleanup requirement at 30,373. The deriver spent its three attempts trying to satisfy an objection that could not be satisfied and gave up. IT KNEW IT HAD A FRAGMENT: the prompt appends '… ticket truncated' and then offers a verdict a fragment cannot support, with no instruction — a model cannot tell 'the ticket does not ask for this' from 'I was not shown the part that asks', so it answers the first, confidently, every time. Bound raised to 200,000 (a migration manual of forty-odd thousand chars is the NORMAL case) and past it the coverage verdict is WITHDRAWN rather than guessed. A test asserts the real 44,302 size reaches the reviewer whole, so a future bound below it fails a test instead of a run. 3879 green. -> .agentsmith/phases/done/p0446-the-not-in-ticket-verdict-needs-the-whole-ticket.yaml"
    p0449: "A QUESTION IN A REPAIR PASS IS STILL ASKED (backend). THE DOOR p0391 OPENED WAS BRICKED UP AGAIN, ONE POSITION LATER. p0391 proved the master's way out works — it asks, the question reaches the ticket, the run parks — with two harness tests, in the FIRST pass. p0438 then built the repair block from three of the phase block's six steps and left MasterOpenQuestions out, so the same behaviour one pass later had no way through. LIVE RUN 459d: the repair step reported 'awaiting_user_input: master asked for clarification mid-run' and the next step was Commit — the question stayed in the bag, OpenQuestionsAwaitingAnswer was never set, RunCheckpoints held ZERO rows, and the run failed on the very criteria it had asked about. Nobody ever saw the question, and it also destroyed the evidence for the operator's follow-up question about what the agent had wanted to know. It punishes the behaviour the whole clarification path exists to produce. The old RepairSteps test carried HaveCount(3) — a second copy of the list — and now tracks RepairBlock.Count. HONEST LIMIT: correct on inspection, NOT yet proven — the harness case that would prove it is p0450 and does not yet drive a repair. 3881 green. -> .agentsmith/phases/done/p0449-a-question-in-a-repair-pass-is-still-asked.yaml"
    p0453: "A MID-RUN QUESTION IS ANSWERABLE WHERE IT IS SHOWN (backend). TWO ASK PATHS EXISTED AND ONLY ONE WAS ANSWERABLE: p0327's gate writes a checkpoint, so the dashboard renders the question and the operator answers it in place and the SAME run resumes; p0315d's mid-run master question posted a ticket comment, parked the ticket and ended the run — no checkpoint, so pendingQuestion was null and the card read 'Question unavailable — open the run to answer', where there was equally nothing to answer. LIVE RUN 216b IS WHAT THAT COSTS: the answer sat on the ticket from 10:55 and nothing happened, because a parked ticket is deliberately OUTSIDE the trigger statuses so discovery does not re-claim it every poll — the only way back in was a manual status move. RunCheckpoints for that run: ZERO rows. The ticket comment STAYS: it is how someone not watching the dashboard learns of the question, and the ticket remains the record; the checkpoint is what makes answering it not require a status move. NO DEADLINE AND NO DEFAULT ANSWER — a parked run holds nothing but its branch, and a timeout would answer on the operator's behalf in the one case where nothing may. Several questions compose into ONE, because the comment already asks for one reply. p0431 IS RETIRED BY THIS PHASE: it planned to DELETE checkpoint-and-resume on the premise that the ticket park had replaced it — use falsified the premise, the park is what made the question unanswerable. Revert-probe: removing the checkpoint call turns the handler test RED. 3908 green. -> .agentsmith/phases/done/p0453-a-mid-run-question-is-answerable-where-it-is-shown.yaml"
    p0454: "A WAITING TICKET SAYS WHO IT WAITS FOR (backend). NOBODY WAS TOLD. A parked run posts its question to the work item and moves the ticket to the clarification status — addressed to no one. Azure DevOps sends no mail for a comment that mentions nobody, so live runs 9a30 (parked 13:30) and eec5 (14:54) sat untouched until the operator happened to open the dashboard: the question was written, delivered, and unread. AND THE BOARD SAID DONE — the park writes the native status but the run still ends through the ordinary terminal path, so a ticket waiting for a human and a ticket that finished were the same row. THE TICKET NEVER CARRIED A PERSON: every provider had an assignee in hand and dropped it at the mapper, so nothing downstream could have addressed anyone. Ticket now carries assignee + reporter as PROVIDER-NATIVE identity (display name + the provider's own id — AzDO identity GUID, Jira accountId, GitHub login, GitLab username); half an identity is refused, because a name without an id renders text that looks like a ping and is not one. MENTION ONLY WHAT WAITS — open questions, expectation-to-ratify and the hand-back name someone; a cancelled run, a failed run and 'this is how I understood the ticket' ask for nothing, the same line p0448 drew from the other side. Mentioning the VERDICT is not a contradiction of p0448: that asks what the next RUN may read back, this asks who must be told. With neither assignee nor reporter the comment SAYS so — an unnoticed non-ping is the same defect one level up. Waiting joins the lifecycle set (agent-smith:waiting), chosen by RunPark so a third way to park cannot miss the branch; a failure that also parked stays Failed. Every test proven able to fail: four reverts, 12 + 3 + 3 red, restored. 3921 green, 98 harness green. -> .agentsmith/phases/done/p0454-a-waiting-ticket-says-who-it-waits-for.yaml"
    p0455: "THE TRACKER DIALOG SHOWS THE LISTS IT HOLDS (dashboard). Edit Tracker rendered EMPTY boxes for trigger statuses and open states while the API returned ['New','Active'] for both — and the scalar statuses beside them rendered fine, so the dialog read as a configured tracker with no triggers at all. trigger_statuses decides which ticket states the poller picks up: the one field an operator must not be lied to about was the one telling them nothing is set. THE SHAPE, NOT THE FORM: p0392 moved the field SHAPE onto the wire, but the server spells it with its C# enum's member names ('List','Bool','Map' — verified against System.Text.Json) and the client switches on lowercase, so EVERY list, flag and map field in the tracker AND connection forms fell through to the text branch, where a non-string value renders as ''. Reconciled at fetchCapabilities, the descriptor's single ingress; an unknown shape is passed through untouched rather than renamed to 'text'. SECOND DEFECT, FOUND BY THE FIRST: the form dropped an emptied list to undefined and the upsert reads an absent list as 'leave the stored value alone', so once a list became readable, clearing it would have saved as no change — an emptied list now travels as []. Map fields keep the old behaviour DELIBERATELY: a half-typed key line parses to no entries and would read as 'wipe the map'; that is its own phase, named here, not a passenger. THE FIXTURES WERE THE BLIND SPOT — every existing studio test hand-writes kind: 'list', the casing the server never sends, so 133 green files sat over a blank screen; the new test drives the studio through a stubbed SERVER instead. Revert-probed twice (3 of 5 RED without the ingress mapping, 1 RED without clear-means-empty). 625 green, tsc 39 pre-existing errors unchanged, no new lint warnings. -> .agentsmith/phases/done/p0455-the-tracker-dialog-shows-the-lists-it-holds.yaml"
    p0458: "THE RAIL FILTERS AND AN ANSWER SAYS SO (dashboard). Two operator-reported defects. (1) The monitor items linked to /#needs-you and friends, so a click SCROLLED — and with a handful of runs every section already fits on one screen, so four different links left the right-hand side unchanged (the operator: the buttons go to different links, but nothing on the right changes). A label with a live count beside it is read as a filter, so it is one: the chosen bucket lives in the URL (?bucket=needs-you), one RunBucketFilter context feeds BOTH the rail highlight and which sections mission control renders, and All runs clears it. Read and written through the History API, NOT useSearchParams — the rail sits in the ROOT LAYOUT and a search-param hook there fails the build for every statically rendered route (verified by building with it in place: useSearchParams should be wrapped in a suspense boundary at page /). On the home screen a click pushes history WITHOUT navigating, so the list stays mounted, keeps updating and keeps its Load-more page; from any other route it pushes the home route. A chosen bucket renders even when empty and names what is empty — unfiltered, empty sections stay omitted. Pull requests stays a route. (2) NeedsYouCard inferred Question-unavailable from a null pendingQuestion, which is exactly what a SUCCESSFUL answer produces: the operator who answered was told it had failed. The card now holds a discriminated union loading|ready|answered|unavailable, fed by the accepted POST, and fetches only while it has never held a question; a question arriving on a later poll is adopted rather than called unavailable. Question-unavailable keeps its one real meaning — a run parked before p0453 checkpointed the mid-run question. 644 dashboard tests green, no new tsc errors, no new lint warnings, / still prerendered static. -> .agentsmith/phases/done/p0458-the-rail-filters-and-an-answer-says-so.yaml"
    p0459: "A LEASE IS RELEASED BY THE RUN THAT HOLDS IT (backend). Seen live, twice on one ticket: run A at step 14/21 held nothing while run B at 5/21 held the only ActiveRuns row, both working the same branch. Cause: IActiveRunLease.ReleaseAsync(project, ticketId) took no run id, so force-clearing a DELETED older run released the lease a NEWER run held and the poller, finding the ticket unclaimed, started a third run. The signature was the bug — no caller could have got it right, and CancelEnforcer already reasoned about ownership one layer up (p0355). The release now NAMES its holder: a conditional DELETE on ActiveRun.RunId (the column AttachRunAsync already writes — NO migration), returning LeaseReleaseOutcome Released/HeldByAnotherRun/NotFound, with the refusal logged once in the repository where both identities are known. runId null means the claim no run has taken up yet and matches an UNATTACHED row ONLY (a wildcard would rebuild the same defect with a narrower window, since a stale reclaim resets RunId to null): SingleClaimRegionExecutor rollback and PipelineQueueConsumer short-circuit pass null, RunDeleter/CancelEnforcer/ExecutePipelineUseCase/ActiveRunReaper pass their own run id. Ratchet obeyed by extraction: the two whole-table liveness scans moved to ActiveRunLivenessRepository (ActiveRunRepository 170 -> 160). Named but NOT fixed here: inProgressStatus is unconfigured for the live tracker, so a claimed ticket keeps a trigger status and the lease is the only thing preventing an immediate re-claim. Every test proven RED by reverting the guard and by mutating each caller identity. -> .agentsmith/phases/done/p0459-a-lease-is-released-by-the-run-that-holds-it.yaml"
    p0460: "A PHASE THAT IS ALREADY SATISFIED IS ALREADY DONE (backend). A run parks or dies mid-sequence with its work committed on the ticket branch, the operator re-triggers, and the new run opens phase a as if nothing had happened — a master pass, real money and often an operator question spent on work the branch already carries (live: the branch had zero legacy references in BOTH repositories and phase a still asked whether an inventory phase may change code). THE ANSWER IS ALWAYS THE SAME, SO IT MUST NOT BE A QUESTION: SelectPhase now takes the delivery account ON ENTERING a phase — the same SpecAccounting call VerifyPhase makes at the other end — and a phase whose every ratified criterion the branch satisfies is recorded done and retired. GUARDED BY A GIT DIFF, NOT A PHASE INDEX: DeliveryDiff.CarriesSource (extracted from VerifyPhase, one definition now) answers 'could anything here satisfy anything' before a model is asked, so a fresh branch costs nothing and behaves exactly as before; the same rule also catches a master that over-delivered the next phase's work. FAILS TOWARDS DOING THE WORK — an account with a Problem, a diff that could not be taken, no ratified criteria, one outstanding row: each runs the phase; only all-satisfied skips, and a partial entry account is deliberately NOT fed to the master as p0438's repair block (that block says 'the rest is accounted for', which an entry account has not earned — the p0444 contradiction). THE SKIP IS RECORDED IN FOUR PLACES: the step result names the criteria and their citations, the sequence table carries a note beside done (rendered in the PR), the run ledger holds the accounts, and WritePhaseRecord — deliberately NOT retired — ships the same account to the branch, so the next run does not even enter the phase. RETIRING IS AN EXECUTOR CAPABILITY, NOT FOUR HANDLER GUARDS: CommandResult.DropAhead names steps of the step's OWN phase, the walk stops at the first step of another phase and a phaseless step retires nothing. SelectPhase moved to CommandModelUse's model steps (diagram regenerated); p0450's LeaveOutstanding lever, built and never usable, now withholds from the first account ASKED about the criterion instead of by call order. PipelineCommandList extracted from PipelineStepRunner for the ratchet. Revert-probed RED on every claim: no entry account, no delivery guard, no phase-boundary guard, no phaseless guard, no note, no model-use declaration. 3941 green, 100 harness green. -> .agentsmith/phases/done/p0460-a-phase-that-is-already-satisfied-is-already-done.yaml"
    p0462: "THE UI IS WHERE YOU CONFIGURE IT (docs + README). Since p0349 the server resolves its configuration from DbConfigStore unconditionally and reads only the BootstrapConfig slice, persistence plus secret env-names, from agentsmith.yml. Every agents:/repos:/trackers:/projects: block the docs told an operator to write into a mounted ConfigMap was read by NOTHING, so the docs did not merely lag the product, they instructed a silent failure. TWO SURFACES NAMED ON EVERY PAGE: server configures in the studio and stores in the database, CLI reads the whole file and stays first-class; YAML is DEMOTED NOT DELETED, it remains the bootstrap slice, the CLI config, the import/export artifact for cutover and DR, and the schema reference. New docs/configure-it/ section (where configuration lives with a per-block ownership table, the studio tour, the twelve settings groups, agentsmith.yml), nav group between Get it running and Connect your stuff. install/docker-compose/kubernetes now mount the bootstrap slice and each carries a First configuration section, because migrate creates the schema and seeds NOTHING. Five connect pages start in the studio with the YAML kept as the CLI and import form; sixteen reference pages carry a surface note, since a page reached from search is entered cold. DOCUMENTED FROM A RUNNING INSTANCE, not from the source: throwaway sqlite + own ports + additive redis, seeded by importing config/agentsmith.example.yml, which incidentally proves the documented import path and makes the Changes screenshot a real attributed cli-import. Eleven fresh screenshots; the month-old config-studio.png is gone. THE HONEST GAPS ARE STATED WHERE THEY ARE: pipeline_triggers is in the database with no studio catalog, trace: is in neither. CLAIM AUDIT WITH A PEER SESSION, six defects in my own prose that my passes missed: invented event, invented motive, invented preference, two unsupported population claims, and a number that CONTRADICTED the setting it documented (two hours against a MaxRunWallTimeSeconds default of 1800). Every first-person claim now traces to a decision record; every figure to a command. Also found: the docs referenced deploy/docker-compose.yml twenty times across five pages and the repo ships docker-compose.example.yml, so every command failed on a fresh clone. mkdocs build --strict green. -> .agentsmith/phases/done/p0462-the-ui-is-where-you-configure-it.yaml"
    p0466: "A FINISHED PHASE IS A PLACE YOU CAN GO BACK TO (backend + dashboard). THE PHASE WAS NOT A THING ANYWHERE: twenty persistence entities and no RunPhase — a phase survived only as the string prefix \"p19213a: \" inside RunStep.StepName, recovered by a regex in RunStepsReader, and RunDecision hung off StepIndex. So a phase that had ENDED was addressable by nothing: no id to link to, no place to hang its decisions or the spec it executed, and the viewer could only ever show what was still live. THE OPERATOR SYMPTOM IS THE ASYMMETRY — the plan is a DOCUMENT the server holds, the implementation was an EVENT STREAM; a document can be reopened, a stream cannot. NOW: a RunPhase row (RunId, PhaseId, Ordinal, Title, Status, StartedAt, EndedAt, Verdict) with migrations on BOTH sets (shared + the dedicated SqlServer assembly), real PhaseId columns on RunStep and RunDecision, GET /api/runs/{id}/phases and /phases/{phaseId}, and the Building beat rendering an expandable phase list whose finished phase opens its decisions and the spec it ran. WRITTEN AT SOURCE, NEVER PROJECTED: PipelineStepRunner already knows the phase when it composes the label prefix, so the same cmd.PhaseId sets the step column and the ambient step frame the decision mirror reads — deriving it in a projection would have rebuilt the parser one layer down. OLD ROWS STAY NULL AND ARE NOT BACKFILLED: a parsed prefix is what this phase replaces, and writing it into the new column would launder a guess into a fact; the regex remains the read fallback for those rows alone, which render exactly as before. THE EVENT STREAM CARRIES IT because a spawned orchestrator has no other DB channel (p0327/p0328/p0344b shape). ONE WRITER of a phase's standing — IPhaseProgressRecorder replaces the private copy SelectPhase and VerifyPhase each kept, and is the only thing that knows where the ordinal and title come from. THE RATCHET NAMED TWO SPLITS RATHER THAN CAUSING THEM: RunFinalizationProjection (the run's terminal transition was the one thing the router still did inline) and ExecutedPhaseMarker (writing the record into the trees and telling the branch which phases are through are two things). Record stored as artifact kind phase_record:{phaseId} rather than reshaping IRunArtifactStore, whose every slot is per-run. Three revert probes RED then restored. 3990 green, 104 harness green, 99 sandbox-agent green, dashboard 648 green. -> .agentsmith/phases/done/p0466-a-finished-phase-is-a-place-you-can-go-back-to.yaml"

    p0461: "AN ANSWER LANDS WHEREVER IT IS GIVEN (backend). p0453 made a mid-run question answerable in the dashboard — the checkpoint is consumed and the SAME run continues. The operator reads that question in their MAIL, as a work-item comment, and answers there; that answer reached NOTHING. The checkpoint sat unconsumed until a hand-moved status started a FRESH run and threw the parked one away — two channels that look identical to the person typing in them, doing two different things, and no way for them to tell which. TRACED FIRST, AND THE GAP IS WIDER THAN IT LOOKED: the answer inbox is written by the dashboard endpoint, by Slack and Teams, and by the PR/MR comment webhooks, which resolve a conversation BY PULL REQUEST — a parked ticket run has none. NO ticket comment on ANY platform reaches a checkpoint; the GitHub, GitLab and Jira issue-comment handlers all dispatch a SPAWN, which is the same restart the status move gives. A POLL, because Azure DevOps has no work-item comment webhook to rely on here and the honest mechanism is the checkpoint doing the asking: the OLDEST comment strictly after AskedAt that is not ours (OwnTicketComment.IsOurs, p0448's line, reused rather than redefined) goes into the SAME first-answer-wins inbox, and DialogueResumeSweeper resumes as it always did. IDEMPOTENCE IS THE INBOX'S: the unique index drops a re-read comment and ResumedAt takes the checkpoint out of the pending list, so no cursor exists that could disagree with it. Only Azure DevOps is wired, behind one named predicate. THE COMMENT NOW SAYS WHERE ANSWERING WORKS — it invited a reply and named no other way, so open-questions and expectation-to-ratify carry a dialogue.dashboard_url deep link; there is deliberately NO default, because AGENTSMITH_DASHBOARD_ORIGIN is a CORS allow-list defaulted to localhost and printing that into someone else's work item is a broken link. AND THE BOARD COMES BACK: on resume the ticket moves to the trigger's new in_progress_status, and when none is configured NOTHING is invented but the no-op is LOGGED — a silent one is how the stale board went unnoticed. in_progress_status sits on the trigger, not the tracker catalog, because the tracker half is mirrored in three Config-Studio files frozen over the p0403 ratchet and a field the Studio cannot offer is the p0392 gap by construction. Twelve reverts run, twelve RED, all restored. 3940 green, 98 harness green. -> .agentsmith/phases/done/p0461-an-answer-lands-wherever-it-is-given.yaml"
    p0456: "THE SERVER SENDS THE SHAPE IT DECLARES (backend). The capabilities endpoint tells the studio how each field may be EDITED, and it said that one word in a language the client is not given: System.Text.Json wrote the .NET member name ('List','Bool','Map') while the client contract declares text/list/bool/map, so every list, flag and map field in the tracker AND connection forms rendered as an empty text box over a live value — the operator-visible defect p0455 fixed on the reading side. THE ENDPOINT SPOKE ITS OWN DIALECT AND ONLY HERE: every other vocabulary on that payload is a deliberate wire name (azure_devops and area_path from EnumMember attributes, camelCased TaskType role keys); the one value serialised straight from the enum was the one that broke. ESTABLISHED BEFORE CHANGING IT — the descriptor is computed per request, never stored, never deserialised, never POSTed back; the only HTTP caller in the repository is the dashboard, whose union is already lowercase; backend tests reference the enum by its C# value; the CLI does not call the endpoint. The single place hard-coding 'List' is p0455's own client test, which feeds an OLD server's payload ON PURPOSE. BOTH HALVES STAY: the server change is what this build promises, the client mapping is what a dashboard survives when it meets a server that is not this build — every installation running today until it is redeployed. Policy bound through a named converter on the type, NOT globally: a global enum policy would restyle the prompt parsers and the sandbox wire to fix one endpoint's word. ASSERT THE BYTES, NOT THE VALUE — the defect never existed at the type level, so the test reads the response body of the real route on a loopback host; revert-probed RED (the failure prints the broken body verbatim). 3897 green, 98 harness green, dashboard 620 green. -> .agentsmith/phases/done/p0456-the-server-sends-the-shape-it-declares.yaml"
    p0457: "THE REPOSITORY STATES HOW IT WAS BUILT (docs + README + website). 610 phase specs, 483 decision files, ten architecture rules and a blocking commit hook are this project's strongest claim about trusting agent-written code, and a reader had no way to see any of it without cloning and counting, the docs described what the product does to OTHER repositories and said nothing about the one it lives in. ONE CANONICAL PAGE, TWO POINTERS: the full account is docs/how-it-works/built-by-the-method.md (in the mkdocs nav under How it works, after Methodology); README and website/src/index.njk carry the headline figures and link to it, because three copies of forty figures drift within a month. EVERY FIGURE CARRIES ITS COUNTING METHOD, command, directory, exclusions, since a statistic about agent-written code that cannot be re-derived from a clone is the kind of claim this project exists to refuse. WORKING TIME IS AN ESTIMATE AND SAYS SO: commit timestamps give 344-586 h depending on the session threshold, 500 h is stated with the band beside it, thinking time without a commit is invisible to the method. THE FAILURES ARE PART OF THE ACCOUNT: the skills catalog 95 -> 12, the retired plan generator, the verb whitelist that failed a flawless migration, the cached-token metric that read zero for months, 69 phases still open, a page listing only what worked gets discounted whole, and the dead ends are what make the architecture rules legible as consequences rather than opinions. Website section inserted between #why and #more with the two following sections' background classes flipped to keep the canvas alternation; eleventy build green. -> .agentsmith/phases/done/p0457-built-by-the-method.yaml"
    p0463: "THE ACCOUNT SOUNDS LIKE A PERSON (docs + README + website). p0457's story of this repository, rewritten to the voice spec already committed at config/docs-writing-skill.md: first person grounded in a committed source, no bold inline headers, nothing defined by what it is not, no invented superlative or numeral. Figures kept. -> .agentsmith/phases/done/p0463-the-account-sounds-like-a-person.yaml"
    p0452: "THE ACCOUNT SEES WHAT THE AGENT RAN (backend). THREE RUNS REFUSED FOR A SEARCH THAT HAD HAPPENED: 459d 'no listed command ran the required MediatR search, and the plan is not search-result evidence'; 587c 'the recorded zero-result search covers the Server repository only'; 929f 'records a planned residual-reference scan but provides no completed scan' — while the agent had run NINETEEN searching commands across both repositories, two printing a labelled legacy-reference report with real output. THE READER WAS ASKED TO JUDGE EVIDENCE IT COULD NOT SEE: the account's command list came from the verify step's own build/test outcomes alone, so a search that ran and a search that never ran looked identical. IT STILL JUDGES — a wrongly scoped grep is still weak evidence, and 587c's objection was correct on its own terms; the change is that the command is visible, not that it counts automatically. NOT THE SAME MISTAKE AS p0451: there the FRAMEWORK's own command was worthless (an echo) and the account was right to reject it; here the AGENT's commands are real and simply never presented. Once the evidence was false, once invisible. PhaseCommandLog keeps the last 40 with a 400-char output TAIL (the end is where the verdict is); PhaseEvidence names the two-source concept and shrank the verify handler, whose baseline was lowered to lock it in. The length ratchet refused the +2 in FilesystemToolHost and was RIGHT — its repo-resolution concern is the extraction it wants; baseline raised DELIBERATELY on the operator's call rather than destabilising the path every tool call takes mid-run, and the extraction is owed and named here. 3903 green, 98 harness green. -> .agentsmith/phases/done/p0452-the-account-sees-what-the-agent-ran.yaml"
    p0451: "A COMMAND THAT CANNOT FAIL IS NOT A VERIFICATION (backend). THE GATE REPORTED GREEN OVER AN ECHO. Live run 587c: the analyzer wrote 'echo Build command placeholder' as one repository's declared BUILD stage; verification executed it, it exited 0, and the mechanical gate reported that repo '[build+test] green' while nothing had compiled there. THE DELIVERY ACCOUNT WAS THE ONLY THING THAT NOTICED — 'the BackgroundWorker build command was a placeholder and does not demonstrate a migrated solution build' — and it was RIGHT while the gate was WRONG, over work that was in fact correct (the branch carries zero legacy references there). AND THE FIRST FIX I PROPOSED WOULD HAVE MADE IT WORSE: letting the verification's own results count as evidence would have credited the echo as proof the build exits 0, turning the account's true no into a false yes — the defect was one layer below where it looked, and the trail was one query away. A dropped command is not a failure but an UNDECLARED one: the resolver falls through to entry-point discovery, and only if that also finds nothing does the existing resolution finding fire. Decided on the leading verb only — 'dotnet build -p:Message=echo' is a real build. 3899 green, 98 harness green. -> .agentsmith/phases/done/p0451-a-command-that-cannot-fail-is-not-a-verification.yaml"
    p0450: "THE HARNESS CAN REACH A REPAIR PASS (backend). THE HARNESS HAD CLOSED THE DOOR ITSELF: p0422 stood the accountant down so framework calls could not drain the master's script — right decision — and its stand-in answers 'satisfied' to EVERY criterion, which makes 'a criterion is outstanding, so a repair pass follows' unreachable from a preset. `grep -rln repair` over the whole harness returned NOTHING, and four defects lived in that branch (p0341g, p0444, p0449), every one found by a live run at half an hour and several dollars a time. Now a case may withhold one named criterion for one account; the default is unchanged. RecordingTicketProvider moved out of MasterAskHumanParkTests so the same door can be asserted from other positions. THE LESSON IS THE DECISION: the first repair case was GREEN with p0449 REVERTED — the master asked in the FIRST pass, so it re-tested p0391 and called it repair coverage. Every case must now assert it REACHED the position it claims (PhaseRepairAttempted) and must be shown RED with the fix removed before it counts; without that a green suite is an assertion, not a proof. The repair case itself is deliberately NOT in this commit — it does not yet drive a repair, so it proves nothing. 98 harness green. -> .agentsmith/phases/done/p0450-the-harness-can-reach-a-repair-pass.yaml"
    p0448: "A RUN NOTICE IS NOT THE TICKET CONVERSATION (backend). A CANCELLED RUN POISONED ITS OWN TICKET. p0424 drops our own announcements except the NEWEST, so an outstanding question survives into the next run. Live run a1e1: the run before it was cancelled by the operator, which posted 'Agent Smith — Cancelled / Cancelled by operator.' That was the ONLY comment on the ticket — ours, and newest — so it became the ENTIRE conversation the derivation was shown, and the derivation handed the ticket back: 'the operator cancelled the migration, so it cannot be implemented as an active ticket.' IT READ CORRECTLY; the comment says that. Our own operational chatter was fed back as the requirement. AND IT REPEATS: the handback it then wrote is also a verdict about the work and also becomes the newest comment, so a retry reads that and hands back again. 'Newest' was never the property wanted — the exception exists so an UNANSWERED question reaches the next run, so the test is whether it is still the operator's turn. A cancelled run, a failed run, the announced cut and a handback verdict all report what happened and ask for nothing. Marker sets moved into a named OwnTicketComment, which also moved the static-state allowlist entry off the prompt section. 3883 green. -> .agentsmith/phases/done/p0448-a-run-notice-is-not-the-ticket-conversation.yaml"
    p0447: "A CUT WITH A FINDING BEATS NO CUT (backend). What the fallback replaced the cut with is worse than the cut: three attempts, objections handed back each time, then EVERYTHING discarded and one phase carries the whole ticket — no boundary, no per-phase verdict, no repair pass. On live run 2552 that shape did nineteen minutes of work with no way to end. Four phases with an objection against the fourth are strictly better, so the deriver now returns the LEAST-OBJECTED cut it saw (fewest findings — the measure the reviewer already produced; last-attempt would be a guess about which attempt improved). THE FAIL-SAFE IS UNTOUCHED: a cut that never PARSED is not a cut, nothing to keep, single-phase fallback still fires — that is what p0393a built it for. KEPT IS NOT SWALLOWED: the standing findings publish as their own gate, because an objection nobody can see is the same as no review. Both cut verdicts (refused-and-carried-whole, kept-with-findings) moved into one SpecCutGate — two near-identical private emitters is how the second drifts, and it pushed the handler past the length ratchet, which is what the ratchet is for. 3879 green. -> .agentsmith/phases/done/p0447-a-cut-with-a-finding-beats-no-cut.yaml"
    p0445: "A PARKED RUN IS READABLE LIKE EVERY OTHER (dashboard). OPERATOR SPOTTED IT: the 'Needs you' card had no right-hand side — no story spine, no step position, no cost, no elapsed — while every finished row below it carried all four. So the single run that actually needs a decision was the only one that could not be judged without opening it: live run 9a30 stood at 36/48, $4.58 and 27 minutes in, and the card said none of it. The columns move out of RunRow into a shared RunStats rather than being re-implemented, because a second hand-built copy of the same four facts is the one that drifts; RunRow keeps its finished-pill fallback through a spineFallback slot, so its rendering is unchanged. The card keeps its own layout — it exists because a parked run is answerable in place, and that affordance is the point; what was missing was the facts, not the row shape. Grid gains four auto columns, collapsing to the row's own small-width behaviour. 620 dashboard green. -> .agentsmith/phases/done/p0445-a-parked-run-is-readable-like-every-other.yaml"
    p0444: "A PHASE STARTS WITHOUT THE LAST ONE'S REPAIR (backend). FOUND BY THE AGENT MID-RUN, AND IT REFUSED TO OBEY. Live run 9a30: phase c's FIRST master pass was handed p0438's repair block carrying phase B's outstanding criteria ('this is a REPAIR pass ... close exactly these ... the rest of the phase is already accounted for, adding more is scope you were not given') while the tree still held every MassTransit reference phase c existed to remove. It asked instead of complying. THE QUIETER HALF IS WORSE: PhaseRepairAttempted carried over too, so phase c had already spent the single repair p0438 grants it, on another phase's behalf — the symptom would read as 'the repair loop stopped working'. p0438 wrote both keys and nothing cleared them; SelectPhase swapped the spec and left them. Reset on ENTERING a phase (not at the end of VerifyPhase, which does not run when a phase fails outright); named PhaseRepairScope rather than two inline Remove calls. p0440 proved itself in the same run: the park was recorded waiting_for_input, so the question reached the operator instead of being filed as a finished run. 3873 green. -> .agentsmith/phases/done/p0444-a-phase-starts-without-the-last-ones-repair.yaml"
    p0443: "WAIT FOR WHAT IS ASSERTED (tests). CI red on main after the 0.131.1 release merge — and NOT a regression: the identical code passed 28 minutes earlier on the p0442 build, and the release commit touches CHANGELOG.md, version.txt and the release-please manifest, no code. The gap: WaitForTerminalRowAsync polls Runs for a FinishedAt, the assertion counts TRAIL rows — two writes, one wait, so under load the assertion runs between them. The failure named it exactly (persisted true, status success, trail rows 0). NOT the p0432 family though it looks like it: the budget was already 60s and widening it would have bought quiet rather than correctness — a test that waits for the wrong thing is wrong on a fast runner too, it just gets away with it. Establishing it was not a regression first turned 'what did we break' into 'what did this test always assume'. -> .agentsmith/phases/done/p0443-wait-for-what-is-asserted.yaml"
    p0442: "THE EMBEDDED PIN CATCHES UP (backend). Two pins exist and only one was stale: the deployment pins 4.5.0 in config, the EMBEDDED fallback sat at v4.0.0, five releases behind — nothing broke in production, which is why it went unnoticed. p0415 PREDICTED THE MOMENT: its comment said ownership of spec-derivation-master moves to the catalog 'when a parity release exists AND the pin moves — NoPromptName_HasTwoOwners fails at exactly that moment', and it fired on the first build after the bump. Both reasons p0415 gave had expired: v4.5.0 carries the cut-sizing rule (p0413) and ships_code left the model in p0421. CHECKED BEFORE DELETING: a line diff suggested the catalog had LOST the cut-sizing rule, which would have made the flip a regression — it had not, the rule is reordered, and the catalog's criterion rule is the EVOLVED form with frontmatter the embedded copy never had. The rules are now asserted against the PACKAGED catalog (that is what makes a pin bump a decision rather than a version string) with WHITESPACE COLLAPSED, because 'the branch diff' straddles a wrap in v4.5.0 and a rule that is present must not read as missing. The tar walk is shared rather than copied — same lesson as p0441 an hour earlier. Tarball checksum verified against the published sidecar; the build re-verifies on every compile. 3870 green. -> .agentsmith/phases/done/p0442-the-embedded-pin-catches-up.yaml"
    p0441: "A RUN ID IS SHORTENED WHERE IT DIFFERS (dashboard). OPERATOR SPOTTED IT: the header's RUN field read `#2026-08-`. A run id is `2026-08-17T21-30-46-a98c` — timestamp then the short hash that identifies it — and SIX places cut it with slice(0, 8), keeping the date: identical for every run of the day, the one part nobody needs. This session called that run 'a98c' in conversation, commits and phase records all evening while the screen showed the prefix; the shortening was cutting away the name. Fix: shortRunId takes the segment after the last separator, falling back to the LAST eight characters for ids that do not follow the convention (an unknown format varies late, not early). One helper for all six callers — the truncation had been copied five times and p0341h copied it a sixth into the new header before anyone noticed, which is the argument for a named function rather than six careful edits. A one-character tail is not a name: `run-1` stays `run-1`; my first test said otherwise and the suite refused it. 618 dashboard green. -> .agentsmith/phases/done/p0441-a-run-id-is-shortened-where-it-differs.yaml"
    p0440: "A PARKED RUN SAYS IT NEEDS YOU (backend). OPERATOR QUESTION at the screen: 'why is there no entry under Needs you, when I am the one who has to answer here?' Two things park a run and the terminal status knew ONE. p0315d's master question sets OpenQuestionsAwaitingAnswer; p0327's dialogue gate sets WaitingForInput. PipelineExecutorPolicy reads BOTH when naming the parked reason — which is why the log and the summary were right — but ExecutePipelineUseCase read only WaitingForInput when choosing the terminal status, so the master path fell through to success. Live run a98c: Status=success, Summary='Pipeline parked: awaiting_user_input'; header read Done, Needs-you counted zero, the question sat on the ticket with nothing pointing at it. The DASHBOARD was never wrong — bucketRuns maps waiting_for_input to needs-you correctly; it was told the run had succeeded. Fix: RunPark.IsWaitingForOperator, one predicate over every parking signal, so a third way to park cannot be added to one half of the system — the inline fix would have repaired this bug and left its cause. A present-but-FALSE flag is not a park (absence and denial must not converge). The already-persisted run is left alone: rewriting a historical row to make a screenshot look right is not a fix, and the operator is keeping that run as a test case. -> .agentsmith/phases/done/p0440-a-parked-run-says-it-needs-you.yaml"
    p0341g: "A REPEATED STEP BELONGS TO ITS PHASE, AND THE PANEL SAYS WHAT THE RUN SPENT ITS TIME ON (backend + dashboard). OPERATOR SPOTTED IT IN THE RAIL: a second p19106a header. Live run a98c's step projection: 23 phase=p19106a / 24 None / 25 None / 26 None / 27 phase=p19106a — PhaseSequence stamps every spliced step with a PhaseId and p0438's repair spliced three BARE commands, so the rail (which groups CONTIGUOUS ids) broke one phase in two and the pass's $0.63 + 20 calls rolled up under no phase. Fix: PhaseVerdict.RepairSteps(phaseId) + RepairBlock, asserted a SUBSET of CodePhaseBlock so the next edit to the block (p0437 edited it once) cannot leave the repair repeating a pipeline of its own. SECOND HALF — the statistics panel carried a number that could only ever read ZERO: it folded ToolResultEvent and the trail receives none (persisted types on a98c: SandboxCommand 444, SandboxResult 443, LlmCall* 120 each — the agent's reads and greps ARE sandbox commands), so it reported TOOL CALLS 0 for a run that issued 444. Counting an empty set correctly is still a false statement. RunWorkBreakdown folds what IS recorded at two levels — pipeline steps by operator label, sandbox commands by the bare executable the producer already recorded (no command-line parsing) — with count + total duration, ORDERED BY DURATION because which rows carry the wall clock is the finding (12 builds outweighed 187 greps). Rejected: persisting ToolCall/ToolResult so the old figure becomes true — a second representation of the same activity is the drift this family exists to remove. Three further honesty fixes: 'wall clock' -> 'time in steps' (39m sum-of-steps against 65m elapsed under parallel sandboxes), 'never delivered' rendered only when a cut happened, 'none ratified' -> 'not accounted for yet' while running. 3861 backend + 613 dashboard green. -> .agentsmith/phases/done/p0341g-a-repeated-step-belongs-to-its-phase.yaml"
    p0341f: "THE THREAD CROSSES THE PASS BOUNDARY (backend). OPERATOR QUESTION: 'der liest jedes mal wieder das inventory file. warum sollte er das tun?' Because AgenticLoopRunner opened EVERY request with exactly two messages (system + user) and AgenticLoopRequest had no field for anything else, while the nudge told the pass to 'resume from where you left off, do not restart from scratch' — an instruction only re-derivation can obey. Live cost: run 98b9 re-engaged 34 times, every one logging '0 actionable step(s) remain', repeating one identical five-tool cycle (read the inventory, 2x grep MediatR, 2x grep advanced patterns); 155 calls, $2.65, 29 min, one changed file, red build. Run 6632 on a stronger model repeated less and the same way. THE REAL FINDING IS ABOUT p0341d, NOT THE CODE: p0341d is filed as done, its goal says 'ONE continuous conversation' and its criterion says 're-engagement now fires only on genuine breaks — proven by an integration test that completes a long multi-step run in one continuous pass', and the test carrying it builds the conversation BY HAND and never instantiates the handler. The mechanism (in-pass compaction) shipped and works; the consequence was never measured. A phase verified against its own mechanism can be green while the thing it was for is false. Fix: MasterConversation owns the thread (opened / continued / handed over as a copy) and ALL THREE drives continue it — the first attempt wired only re-engagement and the new test caught the apply drive. Order is the cache order (system, thread, new turn) and the thread only appends, so a re-engaged pass reads its own history at cache-read price — carrying it is CHEAPER than the re-derivation it replaces. The impossible sentence is deleted. Proven by a test written against WHAT THE PASS CONVEYS rather than which field carries it, red before the fix and still honest when the carrier turned out to be a new field. MasterHandlerFixture extracted so the loop suite and the prompt suite build the same handler (-147 lines). 3855 green. -> .agentsmith/phases/done/p0341f-the-thread-crosses-the-pass-boundary.yaml"
    p0438: "THE ACCOUNT GOES BACK TO THE AGENT (backend). OPERATOR QUESTION that named the defect: 'a failed run where the accounting is right — what good is that to me?' None. Live on 19106/p19106a the accountant produced the most actionable artefact of the run — exactly what was missing from a 15.7 KB inventory, in the contract's own words, checked against the real branch — and PhaseVerdict rendered it into an error message FOR THE OPERATOR while the agent that wrote it, the only thing that could finish it, never saw it. A correct no is half a mechanism. Outstanding criteria now go back for ONE repair pass (recorded as a pipeline flag, so a second outstanding verdict is final and no timer is needed), the prompt QUOTES them and says to close exactly those, and the failure text when repair cannot help is identical to before — p0419/p0420 honesty untouched, just no longer the first answer. Mechanical failures and UNACCOUNTED phases are never handed back (p0420: an account over a tree that does not compile is an opinion about unshippable work). The repair splices [AgenticMaster, CommitPhaseWork, VerifyPhase] via OkAndContinueWith, inheriting p0437's ordering guarantee instead of restating it. Ratchet forced PhaseExecutionPromptBlocks out, and the p0422 test that asserted a FILE NAME was retargeted at what the block says. -> .agentsmith/phases/done/p0438-the-account-goes-back-to-the-agent.yaml"
    p0437: "THE GATE RUNS AFTER THE WORK (backend). Measured live on ticket 19106: the master wrote its inventory at 13:41:50, the delivery diff was taken at 13:42:42, the gate said 'this branch carries no source change', the accountant called 5 SATISFIED criteria outstanding at 13:42:48 — and the work reached the branch at 13:42:50. The file IS on the branch, the PR IS open: the verdict was a FALSE NEGATIVE. OPERATOR CORRECTION that reframes it: not 'seven seconds too early' (which reads as a race) but THE WRONG PLACE in the pipeline, deterministically, every run — and the consequence is that work already done can NEVER reach its goal. It was EVERY phase, not the first: CommitAndPR runs once after ALL phases while VerifyPhase runs inside each block. p0360's checkpoint would have carried it but fires on a ledger flip at most every 120s, so a gate's sight would depend on an unrelated timer. The phase block gains an explicit CommitPhaseWork before VerifyPhase, asking the SAME checkpointer (same secret scan) via PushNowAsync. The order is now a RULE: GateOrderRuleTests asserts the verification follows a committing step, with the pre-p0437 block as its teeth case. Ratchet forced RepoWorkPusher and CommandNames.PhaseBlock out as real responsibilities. -> .agentsmith/phases/done/p0437-the-gate-runs-after-the-work.yaml"
    p0436: "THE PREFLIGHT KNOWS BOTH SHAPES (backend). p0428's one remaining GATE stopped a healthy run 2 seconds in, on the operator's first real run after it shipped: 'config-loaded: the pipeline's agent is missing its model'. The agent was fully configured — type azure_openai with a per-role `models:` registry (gpt-5.1 primary/planning, gpt-4.1-mini scout/summarization), which is how EVERY agent in the deployed config is written. An agent carries its model in one of two shapes: a single `Model`, or a `Models` registry that ConfigBasedModelRegistry resolves per TaskType. The check knew only the first. Fixed by reading the model the way the registry does, not by adding a second hand-written condition — a second opinion about what a configured agent is would drift (p0433, one day old). The message also named the wrong lever (agents.<name>.type / .model) while the operator had configured models: correctly; it now names both places. The p0428 lesson in production: a gate that fails healthy work is worse than no gate, and the harness could not catch it because its fixtures use the single-model shape. -> .agentsmith/phases/done/p0436-the-preflight-knows-both-shapes.yaml"
    p0435: "A LOCKFILE THAT CAN BE IGNORED (dashboard). src/dashboard/Dockerfile AND .github/workflows/dashboard.yml both ran `pnpm install --frozen-lockfile || pnpm install`. The flag DECLARES that the build installs exactly what the lockfile says and stops on disagreement; the fallback guaranteed that stop could never happen, so a drifted lockfile silently installed whatever resolved that day. `pnpm-lock.yaml*` is the same hole from the other side — a globbed lockfile is an OPTIONAL one. Both sites carried the identical line, so a drift would have produced a GREEN CI on one dependency set and a SHIPPED IMAGE on another: the tested artefact is not the delivered one, which is what a lockfile exists to prevent. p0169-pre's spec said `pnpm install --frozen-lockfile`, full stop — the fallback arrived with the scaffold's FIRST commit (a91b034c) and survived eleven months because nothing could contradict the specification. Same shape as p0433, so the fix is a rule and not an edit: DependencyPinningRuleTests reads both files and fails on a frozen install with a fallback or an optional lockfile. Nothing was drifting when found; the Docker build is recorded as UNVERIFIED locally (no registry route from this sandbox) rather than dressed as a result. -> .agentsmith/phases/done/p0435-a-lockfile-that-can-be-ignored.yaml"
    p0433: "A STEP THAT REACHES A MODEL CANNOT BE DECLARED DETERMINISTIC (backend). The published control-flow diagram stated that the step deciding DELIVERY runs no model: CommandModelUse listed VerifyPhase as deterministic while VerifyPhaseHandler -> PhaseAccounting -> ISpecAccountant -> SpecAccountant has made one call per phase since p0420, which p0421 made the ONLY thing deciding whether a run delivered. p0408's declaration-over-inference choice was right and is NOT reversed — inference as the source would false-positive on a service holding a client it never uses. But a declaration nothing can contradict is a comment with a compiler: the old guard saw only handlers holding a client DIRECTLY, so a two-hop chain drew as machinery on the website for two phases. Reachability is now a cross-check that must be resolved, and it expands INTERFACES to implementations — the chain crosses ISpecAccountant at exactly the hop that matters, so a parameter-type walk would have reported it clean, a false negative wearing the evidence's clothes (caught by a peer session before the walk was written). The failure prints the path. Widening found TWO MORE, both real, not the predicted over-report: CommitAndPR accounts via TakeOrReuseAsync, and SetupRegistryAuth makes one read-only Scout call whose prompt carries hosts and paths only and whose answer uses __AS_TOKEN_<host>__ placeholders. -> .agentsmith/phases/done/p0433-the-diagram-cannot-lie.yaml"
    p0429a: "A LIVE-TARGET FINDING CITES AN ENDPOINT (backend). p0429 resolved a citation by READING the file it names; an api-scan cites an ApiPath, so file-based resolution would have passed every DAST finding through unchecked — the blind spot p0429 closed, reopened for the pipeline that most needs it. CitedEndpointIndex resolves against the OpenAPI document the run loaded, with CitedFileIndex's tolerance for how a human writes a citation (method prefix, host, query, a concrete id against a {param} template); an endpoint the document does not declare is invention. ZapReportParser now KEEPS the per-instance request/response it always discarded, so the refuter reads the real exchange. Found en route: ScanMasterPromptFactory read ContextKeys.SwaggerSpec as a string while LoadSwagger sets a SwaggerSpec record, so the scan master had NEVER seen the API surface it was triaging — hidden because the test seeded a string. Nuclei deliberately NOT given -irr (unpinned image; a rejected flag would fail the scanner and turn coverage red). Scan reporting surface sliced to p0429b: a scan preset reaches neither ticket comment nor PR body. -> .agentsmith/phases/done/p0429a-a-live-target-finding-cites-an-endpoint.yaml"
    p0423b: "THE TWO VIEWS (dashboard + backend). What is happening and why did this run do that are different questions and now have different screens: /jobs/{id} keeps progress and does not even FETCH the statistics (a test holds that line), /jobs/{id}/why is opened deliberately and carries cost, promises and their accounting, then per phase the commands with exit codes and the calls with sizes and durations, plus the recorded conversation when the run was traced. Centrepiece is the call-size plot — prompt against answer per call in call order — drawn as TWO STACKED PANELS on one shared x axis, never a dual axis, because on a single scale the answer collapsing to zero is a flat line on the floor (run 26: 151k->357k prompt while the answer fell 3,886B->0). Backend added RunStatisticsFold over the trail joined to the step rail, plus /statistics and /trace endpoints — no counter, no migration. Per-phase CRITERIA sliced to p0423c: acceptance is one column on the run row, and splitting it by text overlap would be a heuristic around a missing field. -> .agentsmith/phases/done/p0423b-the-two-views.yaml"
    p0430: "THE PHASE RECORD CANNOT DRIFT (backend). Nine shipped phases sat in active/ and none of them, nor p0422 or p0424, were in this done map; two phase ids resolved to two files each; p0422 and p0424 shipped with no spec while p0429 declares `requires: p0422`. Steps 8 and 9 of the workflow are the ones that get skipped, every time, because they come after the work is proven. A rule nobody can forget beats a rule everyone agrees with: a test now checks that a phase id resolves to one file, that every done/ phase is recorded here, and that no `requires:` dangles. The rule found 80 pre-existing violations the audit had not — 61 done phases never recorded, 2 ids shared across 7 files, 17 dangling references — so the historical set gets p0403's RATCHET rather than an invented backfill: named in phase-record-baseline.tsv, nothing new may join, an entry that is fixed must leave. Also removes the ships_code residue p0421 left in VerifyPhaseHandler — an UNREACHABLE baseline comparison whose condition is the negation of the loop guard above it, plus the stash helpers it was the only caller of. -> .agentsmith/phases/done/p0430-the-phase-record-cannot-drift.yaml"
    p0429: "A SCAN STATES WHAT IT LOOKED FOR, AND ITS FINDINGS ARE SUBSTANTIATED (backend). The whole accountability spine — ratified contract, delivery accounting, resolved citations, the delivery gate, the run record — was built for the CODING pipeline; the scans ran beside it with none of it, and it had already cost nine false-positive CRITICALs that MasterFindingsMerger promoted because it read the master's SILENCE about a finding as non-coverage. A scan now ratifies criteria derived from its preset BEFORE its first scanner runs, into the slot AcceptanceCriteria already reads, so the same RunDeliveryGate judges it having learned nothing new. An unvouched finding becomes a CANDIDATE: its citation is resolved by reading the file it names (unreadable = invention, dropped), then a fresh instance is asked adversarially to refute it against the real code — refuted means downgraded with the reason attached, never deleted. DiffFileIndex generalised to CitedFileIndex (two evidence sources, one matching rule) rather than cloned. Endpoint-cited DAST findings sliced to p0429a: an api-scan cites an ApiPath, not a file, so file-based resolution would pass them all silently. -> .agentsmith/phases/done/p0429-a-scan-states-what-it-looked-for.yaml"
    p0428: "THE RUN PROVES ITS PRECONDITIONS (backend). Of 45 measured runs, at least 7 died after 30-90 minutes on something knowable in ten seconds without a model: unwritable /root, the empty config, a branch already carrying prior state. A preflight step in the code preset FAILS on an unconfigured agent and an unwritable sandbox home, REPORTS branch state and unresolved registry tokens, and costs milliseconds with no network and no model. Built BESIDE doctor, not inside it — p0324's checks are singletons with no run in hand. A check that CRASHES is downgraded to a warning: a crash is a bug in the check, not a verdict on the run. The lesson of the phase came from the phase: the credentials check shipped as a GATE and the harness refused 14 healthy runs over a fixture token nothing referenced — demoted to a warning rather than adjusting the fixture, which would have hidden it. Rejected checks recorded with reasons, incl. a /work write probe (a preflight must not change what it inspects). -> .agentsmith/phases/done/p0428-the-run-proves-its-preconditions.yaml"
    p0427: "A RECORDED RUN REPLAYS WITHOUT A MODEL (backend). Every defect of the 45-run week was deterministic and local, yet each cost 30-90 minutes because the only probe was a full live run. A recorded trace now reads back as an ordered answer sequence and drives the REAL composition — parsing, bounding, tool hosts, sandbox, accounting, delivery gate all execute — with no provider call; the run 27 analyzer answer (file_count: null) ships as a committed scenario, so that defect is now a permanent test. Found two holes in p0423's own recorder: it wrapped only SkillCallRuntime (analyzer and derivation were never recorded) and sat ABOVE FunctionInvokingChatClient (a whole tool loop flattened to one entry) — moved into ChatClientFactory's chain below function invocation. And two harness fidelity gaps: PipelineRunner never opened the run scope production opens, so the ambient run id was null across the whole fast tier and everything keyed on it, run events included, was silently dropped. Exhaustion throws, never invents. -> .agentsmith/phases/done/p0427-a-recorded-run-replays-without-a-model.yaml"
    p0426: "AN IMPERFECT ANSWER IS DATA (backend). Run 27, both tickets, within eleven minutes of a clean start: 19106 died at step 12 on `file_count: null` ('requires an element of type Number, but the target element has type Null'), 19192 died at step 19 after eleven minutes of verified work because the worker returned nothing. Neither was a WRONG answer. JsonElement.TryGetInt32 reads like a safe accessor and THROWS on any non-number kind — twenty sites had that shape, so the one-line fix would have left nineteen; JsonValueReader checks the KIND and a rule test names the raw accessors inside the six model-output parsers. The parse boundary now catches EVERYTHING: a Try-method whose purpose is to turn odd model output into a false must not keep a list of the odd things it expects. Silence gets both halves it was missing — the retry runner only retried timeouts and non-zero exits, so an exit-0 call that wrote nothing was never re-asked; now it is, and if it stays silent it becomes an EMPTY TURN the loop nudges on rather than an exception. p0416's rule narrowed, not reversed: nothing is still not an answer. -> .agentsmith/phases/done/p0426-an-imperfect-answer-is-data.yaml"
    p0425: "A DECLARED COMMAND IS A COMMAND LINE (backend). Ticket 19192 declared `dotnet test A && dotnet test B` and was failed by its own separator — VerifyCommandRunner tokenised it into argv, so `&&` reached MSBuild (MSB1008), after both phases of real work had succeeded. The agent's own run_command tool has always passed its text to /bin/sh -c; the command whose exit code DECIDES the run was the only one that could not. No classifier for 'does this need a shell?' — that is wrong on the first quoted separator; same path as the agent, always. The verifier must not be the weaker executor. -> .agentsmith/phases/done/p0425-a-declared-command-is-a-command-line.yaml"
    p0424: "THE CONVERSATION CARRIES THE OPERATOR (backend). Spec RECONSTRUCTED by p0430 — shipped without one. A phase of ticket 19106 made 348 tool calls in four hours and wrote nothing; recording the worker conversation answered why in ten minutes: 236 KB of briefing against 11 KB of work, re-sent on all 115 rounds, and 147 KB of the 155 KB user message was '## Ticket conversation' — almost entirely agent-smith's OWN announcements across twenty-four runs (handbacks, 'this is how I understood the ticket', open questions, failure notices). An agent reading its own past output as instruction spends its rounds reconciling versions of the task. The section now renders what the OPERATOR said; our comments survive only where they carry meaning for the operator's words (an answered question keeps its question) and what was dropped is stated. Second half, worker-mode only: seven of twenty-seven answers carried no envelope and two asked the operator to 'grant Claude access' to sandbox paths — the prompt now states that the worker has no tools and no filesystem, and names the way forward (ask for the read as a tool call) in the same breath. -> .agentsmith/phases/done/p0424-the-conversation-carries-the-operator.yaml"
    p0423: "THE RUN RECORDS ITSELF — the five measures on every completed unit, a CLI run that persists like a server run, and the conversation on a switch. Found wider than specced: the CLI published to NoOpEventPublisher in BOTH modes, so a spawned production container recorded nothing either. Rule adopted — write where the record OUTLIVES the process: a spawned job publishes to the Redis stream the server drains, a local one-shot projects into its own store. The measure is a COMPOSED VIEW ([JsonIgnore] IMeasuredWork.Measure) over fields the event already has, so nothing is stored twice; only the genuinely missing numbers became fields (prompt size, response size, un-bounded result length, attempt). Run/phase/step stay AGGREGATES — derived, never stored, or they drift from their parts. Statistics are RunCallStatistics, a fold over the persisted trail, no new counters and no migration. The trace lands in the RunArtifact store (RunId+Kind+Content already existed) keyed trace/0007.prompt — never in the run stream, where p0373 showed high-volume content evicts every structural event — so it outlives the container; AGENTSMITH_TRACE overrides the config switch because k8s and compose set environment, not files; masking replaces KNOWN staged values, longest first, never a pattern. An unwritable store falls back to ~/.agentsmith/runs.db and SAYS so. p0349's rule narrowed honestly: the CLI's CONFIGURATION stays file-based, its RUN RECORD does not. The file-length ratchet refused all four files this touched and forced four genuine extractions. The two dashboard views split out as p0423b. -> .agentsmith/phases/done/p0423-the-run-records-itself.yaml"
    p0422: "THE JUDGEMENT READS THE EVIDENCE (backend). Spec RECONSTRUCTED by p0430 — shipped across five commits without one, while p0429 declares `requires: p0422`. One defect class, five sites, each a judgement taken from something other than the evidence: (1) the CUT was never reviewed — ticket 19106 cut into ONE phase carrying both 'Inventory, before touching any code' and its migration steps, every shape rule passed, and the master found the contradiction itself after two hours; a fresh instance now reviews the cut adversarially inside the deriver's retry loop and must QUOTE a criterion the phase states. (2) The build gate read the WORKING TREE and skipped both builds over a branch that carried the whole delivery — it reads the branch now. (3) A citation naming two commands resolved against neither; every part must resolve, one real and one invented still fails. (4) A citation written for a human ('inventory.md (both repositories)') was refused as an invention over the parenthesis. (5) Nothing bounded the tools as a SET — one tool returned megabytes and the NEXT call died on a 4.1M-char prompt; a decorator now keeps head and tail below the event publisher and the trace, so both record what the model received. Plus: the agent is told what registry credentials were staged, per ecosystem, because an agent that cannot see its provisioning invents a reason for the work it skips and the reason lands in decisions.md. -> .agentsmith/phases/done/p0422-the-judgement-reads-the-evidence.yaml"
    p0412: "REACH FOR THE TOOL BEFORE THE FILE (skills, shipped). The wirksame half went through the skills repo (#156, released in v4.4.0): the coding master reaches for the ecosystem's own tool instead of editing by hand, and answers a question in one round trip rather than forty. What lands HERE is the guard — CodingMasterToolFirstPromptTests pins both rules in the PACKAGED master, so a pin bump that drops them breaks the build instead of quietly costing rounds. The backend half the spec imagined was never built and is not missed: the effect came from the skill. -> .agentsmith/phases/done/p0412-reach-for-the-tool-before-the-file.yaml"
    p0421: "ONE GATE, NOT TWO (backend, shipped). Operator ruling: a gate that does not deliver the right thing is REPLACED, not joined — two verdicts on the same question mean a wrong verdict has two possible authors, the pattern that cost five live runs in one day. RunOutcomeKeystone is DELETED whole: expectsCodeChanges, shipsCode, perRepoCommittedChange, expectedChangeRepos, ledger, changedPaths, the CodeChangingPresets exemption list (which left mad/legal/security/init with NO delivery check at all), and MasterVerification as evidence. RunDeliveryGate takes (RunAccounts, ratifiedCriteria) and nothing else — enforced by OneDeliveryGateRuleTests, which discovers deciders BY TYPE so a second one fails the build the moment it exists. Accounts accumulate per phase (RunAccountLedger, keyed by phase id so a re-run replaces rather than doubles), and the run delivers when every phase's does. FOUND WHILE BUILDING: a run that ratified criteria and accounted for NONE came out green — silence about a contract is a gap, not a pass, so that now fails naming the count; a run that ratified nothing is still not judged, because inventing a requirement nobody stated is how the old gate came to fail runs that had delivered. ships_code is gone from the model, parser, renderer, reader, schema and prompt — p0400c's rejection now guards the CRITERIA instead ('a phase that states no done-criteria is rejected'), and the prompt says why in the accounting's own terms. The phase kind survives only where it is a FACT: MasterAcceptanceGate still asks whether a green build is owed, but reads it from the run's CodeChange list, not a declaration (reading BuildRan instead was rejected — an Unknown verdict over changed code would pass). Caught by the existing handler tests before shipping: skipping an untouched repo must consult the CHECKPOINT map too, because a phase that committed as it went leaves a clean tree that is not an empty one. The old gate's four suites are deleted and their protections re-expressed against the new one — in-scope repo nobody worked (p0384), edits that never reached the tree (p0244), truncated run reporting green (p0341c) — each now answered by reading the diff rather than by a second signal cross-checking the first. -> .agentsmith/phases/done/p0421-one-gate-not-two.yaml"
    p0420: "VERIFICATION ACCOUNTS FOR THE SPEC (backend, shipped). A resumed branch carrying a complete delivery — nine updated project files, an adapted call site, build and test green in both repositories — was recorded FAILED because THIS run had committed only a phase record. The gate measured the actor's activity; delivery is a property of the BRANCH. Rejected on the way: executable end-state assertions per phase (work for 'these packages reach these versions', collapse for 'fix the null reference' where the assertion IS a test and costs what the implementation costs — operator: the check takes as long as the work and both can be wrong), and labelling the PR 'delivered, unproven' (stamps OUR ignorance on THEIR artefact; after three of those nobody reads the label). What ships instead: a FRESH model instance accounts for the spec — it reads the DELIVERY DIFF (branch vs the base the repo's own origin/HEAD names, never the working history, so it has no reasoning of its own to defend), is asked what is MISSING (because 'all done' is the cheap answer to the positive question and the expensive one to the negative), and every 'satisfied' carries a CITATION that DiffFileIndex resolves against the diff's file list. Semantics stay unverified; INVENTION does not — a criterion claimed satisfied by a file the phase never touched becomes unsatisfied and says so; silence about a criterion is outstanding, not agreement; an unreadable account is not a pass. PhaseVerdict composes it: a red build wins first (an account over a tree that does not compile is an opinion about unshippable work), then an outstanding criterion FAILS THE PHASE NAMING ITSELF AND ITS REPO. Build+test stay as the mechanical gate — they answer HARM, not delivery, for free and without judgment, so this is one gate on delivery, not two. Cost: one call per phase against a few KB of diff, next to a phase spending 85 calls each carrying the full skill and history (measured, run 8) — 1-3%, attributed under its own role in the cost ledger and the run trail. The account renders into the phase record today; the run-level PR body follows with p0421, which rewrites that call site whole rather than render it twice. -> .agentsmith/phases/done/p0420-verification-accounts-for-the-spec.yaml"
    p0419: "A FAILURE NAMES ITSELF (backend, shipped). Five live runs were spent one defect at a time because each failure hid the next: a red build reporting no reason makes every run worth one bit. ONE class, seven sites. InProcessSandbox returned OutputContent:null for every Run step (the container agent fixed this in p0258; the CLI path never did) — so `git diff --cached --name-only` read as 'nothing staged' and a run reported 'no code changes — no PR' for work verified green one step earlier, with a diagnostics dump that was itself blank. Both sandboxes captured stderr ONLY while build tools write diagnostics to stdout; now both streams as a bounded TAIL (a build log opens with restore chatter and closes with the error). The verify gate ran with progress:null — the one command whose outcome decides the run streamed to nobody. A BOM'd nuget.config threw in XDocument.Parse and was swallowed by `catch { yield break; }`, so a private feed was never authenticated (PackageSourceParser now strips the mark and REPORTS an unreadable file). And structurally: `run` — the verb every pipeline goes through, including the container both spawners launch — built its DI container WITHOUT the config path, leaving eight handlers on AgentSmithConfig.Empty and registry auth finding no registries; configPath is now the FIRST, non-defaulted parameter (so a wrong call cannot compile) and a source rule pins that a verb offering --config passes it on — the rule immediately found two more verbs offering the option and ignoring it. A dead worker process is retried (RetryingWorkerProcessRunner, 3 attempts, decorator over the port); a worker that ANSWERED is never asked twice, whatever it answered. Worker failures now quote BOTH streams plus the prompt size — 'exited with 1: (no stderr)' was hiding 'Prompt is too long'. Canonical paths made canonical in every backend: SandboxPathMap rebases /work, /root and /pkgcache, HOME points at the staged credentials, and every ecosystem's cache comes from PackageCacheCatalog (naming NUGET_PACKAGES alone was a hole, not a fix — operator). GIT_CONFIG_NOSYSTEM + GIT_TERMINAL_PROMPT=0 in both the sandbox and the host cloner: a headless run must never wait on a keychain dialog. -> .agentsmith/phases/done/p0419-a-failure-names-itself.yaml"
    p0416: "THE WORKER CAN BE ANYONE (backend, shipped). Closes the blind spot the operator named: the only end-to-end feedback was a live run at ~$10 / ~90min that never finished, so phases were cut in reaction to aborted runs. A run can now be answered by an EXTERNAL agent CLI instead of a provider — everything else (sandboxes, repos, gates, keystone, PR) runs real. Seam = IChatClientFactory: an external_worker IChatClientBuilder sits where a provider client sits (below rate limiter, event publisher, FunctionInvokingChatClient). Transport = per-call `claude -p` subprocess, prompt on stdin, answer on stdout; nothing polls, runs stay unattended. The worker enters as the MODEL: it receives the system prompt, the full history incl. tool results, and the tool definitions WITH JSON schemas (envelope protocol agentsmith.worker/1 = the payload p0166e will carry over MCP), and answers with tool calls or text that the loop consumes unchanged. Strict: non-zero exit / timeout / empty / prose / invented tool each throw ExternalWorkerCallException naming request+run+step+role+duration — never a silent empty response. Selection is the agent's declared type only; binary/model/timeout from endpoint/model/network_timeout_seconds. Harness: ExternalWorkerTicketTests drives a whole mechanical ticket (one phase, change set at once, green verdict, PR) with the production ChatClientFactory and only the subprocess scripted — proves the wiring, not the behaviour. Operator note: WORKER-MODE.md. -> .agentsmith/phases/done/p0416-the-worker-can-be-anyone.yaml"
    p0415: "ONE PROMPT, ONE OWNER (backend, shipped). Two live runs served the CATALOG copy of spec-derivation-master — the one WITHOUT the ships_code obligation (p0400a) and the cut-sizing rule (p0413) the parser and the keystone enforce — because SkillCatalogPromptCatalog's direct-name match (`catalog.TryGetValue(promptName, ...)`) ran BEFORE p0205's loud-failure guard, and that guard only ever covered NameMap keys, so a name outside the map had no guard at all. Fix: ownership is DECLARED, not derived from resolution order. PromptOwnership is one table (name -> PromptOwner{PromptSource, MasterSkillName}) that Get reads first — catalog-owned resolves the master or throws the named p0205 error and NEVER falls back; embedded-owned resolves from the embedded catalog and NEVER consults the masters; an unlisted name is a handler-passed master name (security-master, pr-review-master, ...) and keeps the direct lookup. spec-derivation-master is declared EMBEDDED-owned: the pinned catalog v4.0.0 ships 13 masters and none of that name, and the release that does ship it carries neither rule — so handing ownership over today would drop two rules a run depends on; the entry flips when a parity release exists AND the pin moves. Two guards: NoPromptName_HasTwoOwners (no embedded resource name also names a master in the embedded tarball, failure names BOTH paths, breaks the build at exactly the pin bump that first ships a duplicate) and EveryEmbeddedPrompt_IsRequestedFromSource (p0409's guard, so the next dead prompt fails the build instead of accumulating). KNOWN GAP, deliberately not closed: build-time enforcement reaches the embedded pin only — an operator-pinned catalog directory is invisible at build time, and making its duplicate a startup failure would break deployments that work today; runtime determinism there comes from the table. Absorbed p0409: 12 of the 14 resources deleted with their loaders and DI registrations (triage-system, triage-structured-system/-user, plan-consolidator-system/-user, evaluate-skills-system had no loader at all; observation-schema with SkillPromptBuilder + ISkillPromptBuilder + PromptPrefixBuilder + the never-implemented IPromptComposer; structured-output-contributor/-gate-list/-gate-verdict with StructuredOutputInstructionBuilder; convergence-system with ConvergenceEvaluator + IConvergenceEvaluator + ConvergenceResultParser + ConvergenceResult; agent-plan-system with AgentPromptBuilder's plan half, MasterPromptTokens.MultiRepoRulesSection and the whole plan-call eval suite). p0409's inventory CORRECTED on one entry: expectation-drafting-system stays — NegotiateExpectationHandler is registered, the command is not retired, the p0329 goldens exercise the real drafter; unreachable from shipped presets is not dead. Ratchet paid by deletion: SkillCatalogPromptCatalog 161 -> 117 (left the baseline), AgentPromptBuilder 298 -> 188. -> .agentsmith/phases/done/p0415-one-prompt-one-owner.yaml"
    p0411: "THE FRAMEWORK DOES ITS OWN HOUSEKEEPING (backend, shipped). Run 1b4b (cancelled at $10.13, still phase 1 of 3) spent 52 `git config user.*` calls — measured as the master's habit, found in the code to be OURS: RunWorkCheckpointer runs ConfigureUser TWICE per checkpoint per repo (StageAllAsync, then CommitAndPushStagedAsync), re-writing an identity unchanged since checkout; the window's status/diff calls are the same checkpoint path's probes, not model tool calls. Fix: SandboxGitIdentity (sealed, DI) establishes the identity ONCE in SandboxRepoCloner — the one seam every sandbox gets its repo through (CheckoutSource + the ensure_repo_sandbox escalation), local bind-mount included; every later caller probes `git config --get user.email` and writes only when nothing resolves, so the commit path still covers sandboxes created outside that seam (p0394's spec-set writer) and an operator's own identity in a bind-mounted repo is never overwritten. Second half: SandboxWorkingTreeReader feeds the master's working-state block the changed paths (count + up to 30, repo-prefixed) once per re-engagement pass. The spec's 'say so in the master's working state' was DROPPED — the code shows the model never made those calls, so the prompt line would have been tokens against a habit that does not exist. Extractions for the ratchet: WorkingStateSection (MasterPromptSections left the baseline), MasterLoopHooksFactory (AgenticMasterHandler 960 -> 922). -> .agentsmith/phases/done/p0411-the-framework-does-its-own-housekeeping.yaml"
    p0413: "THE PROCESS IS SIZED TO THE TASK (backend + dashboard, shipped). Run 1b4b: a mechanical two-repo dependency bump was cut into 3 phases, each with a full command block + master loop + verification + keystone, and died cancelled at $10.13 / 165 model calls still inside phase 1 — the master step alone produced 670 events in the shape 'model x2-16 -> read x2 -> write x2', forty times, one file at a time. Root cause was NOT the loop but the CUT: ScopeRepos already classified the ticket (tier=medium) and that tier resolved exactly ONE thing, the cost cap — we classified the wallet, not the work. Fix: the SAME scope-classification reply now also states the work's SHAPE ('shape' + 'shape_reason' -> WorkShapeVerdict: deterministic transformation / judgement / mixed), no second LLM call; the prompt separates the axes in as many words ('complexity is HOW MUCH, shape is WHAT KIND') and forbids deciding shape from the technologies a repo happens to use. The derivation receives the verdict in its USER prompt (WorkShapePromptSection) while the RULE lives in spec-derivation-master.md: deterministic work is cut into the FEWEST phases its deliverable allows and its steps name the transformation as a whole, because 'a step per target turns one operation into one round of work per target'; mixed is cut along the seam; no shape stated = the cut it always got. The classification stopped being cost-only: RunWorkShapeResolvedEvent (78) -> Run.WorkShape/WorkShapeReason (migrations BOTH providers: 20260813191850 sqlite / 20260813191856 sqlserver) -> snapshot on list AND detail -> a Shape metric in the run side rail with the reason inline, following the p0404/p0405 read path rather than a parallel one. NOTHING in the mechanism names an ecosystem, tool or language. Ratchet obeyed by extraction: RepoScopeReplyFields + RepoScopeJson (RepoScopeParser 107, left the baseline), RepoScopeSystemPrompt (RepoScopeClassifier 100, left), RemoteContextInventoryBuilder + ScopeEstimateRecorder (ScopeReposHandler 93, left), RunClassificationProjection (RunEventApplier 285), RunSnapshotSeed (RunSnapshot 130). KNOWN GAP: single-repo runs still skip the classifier entirely, so they get neither shape nor tier-sized cap — successor p0413a. -> .agentsmith/phases/done/p0413-the-process-is-sized-to-the-task.yaml"
    p0405: "THE RUN SHOWS WHAT IS STILL COMING (backend + dashboard, shipped). The drawer listed only executed steps: '19/45' could be counted, not read. Operator ruling — the client CONSUMES, all sequence logic lives in the backend. The spec's 'derive the future from preset x phase count' was NOT implementable as written (no server-side source carried the derived phase ids mid-run, and head+block*phases+tail does not divide the observed total because BootstrapDispatch splices too), so the executor REPORTS instead: PipelineStepsPlannedEvent carries its live command list (absolute step index, command, display name, phase id) on establishment and on every splice — announced on CHANGE, ~2 per run — persisted to Run.PlannedStepsJson/PlannedFirstStepIndex (migrations both providers). GET /api/runs/{id}/steps returns ONE ordered sequence: executed rows then RunStepView.ForPlanned rows whose status/cost/duration/counters are ALL null by construction, summing to totalSteps; a terminal run has no future. The rail renders it as delivered — muted rows under the same phase header, 'not started' in the detail pane, planned internals condensing into the p0398 mechanics row. Ratchet extractions: StepLabelComposer, PipelineFinalizerTail, PipelineExecutorExtensions, RunPullRequestProjection, EventTypeResolver (EventEnvelopeSerializer left the baseline). -> .agentsmith/phases/done/p0405-the-run-shows-what-is-still-coming.yaml"
    p0404: "WHERE THE TIME GOES (backend read path + dashboard, shipped). Run fa8c: 41.4 min wall-clock, and a FINISHED run reported llmDurationMs 0 / throttleWaitMs 0 — the live fold lived only on the volatile broadcaster snapshot and RunSnapshotMapper never read the p0369 metrics that WERE persisted (the spec's 'never folded onto the run row' premise was half wrong; it was a read-path omission). Fix: the applier attributes each LLM call's DurationMs + ThrottleWaitMs and each sandbox command's DurationMs to the STEP that spent it (RunStep.LlmMs/ThrottleWaitMs/SandboxMs, migrations for both providers); the rail serves RunTimeSplitView per step (model / throttle-as-subset-of-model / sandbox / scaffolding = duration - model - sandbox, clamped, null while running) and the run detail the roll-up = the sum of its steps, which also fills the top-level llmDurationMs/throttleWaitMs. Serialisation reads off sandbox command count next to summed duration. Five ratchet extractions: RunSandboxProjection + RunStepTimeProjection out of RunEventApplier, RunSnapshotFold out of RunSnapshot, ReservedCapacityCalculator out of RunSnapshotMapper (which left the baseline), RunStepAggregatesReader out of RunStepsReader. -> .agentsmith/phases/done/p0404-where-the-time-goes.yaml"
    p0407: "WARM PACKAGE CACHE + THE KILLED COMMAND SAYS WHY (backend, shipped). Live run fa8c: one `dotnet build <sln>` ran 978s and was killed at the 900s step cap, a second took 403s — 23 of 41 run-minutes, while all 268 other sandbox commands took 1.5 min TOTAL. Not the network (3.46 MB/s, 178ms TTFB): the package root lived in the per-run work volume and died with it, so every run paid a COLD restore. Fix = residency, not timeout. PackageCacheCatalog (Contracts) is DATA — (ecosystem, mount path, env vars), nuget/npm/pip/go/cargo, a row qualifies when a plain env var points its tooling at a directory (Maven needs an arg/settings.xml, deliberately out); no sandbox code names a package manager, no `if (dotnet)`. Every row is mounted rather than selected by resolved language: language is single-valued while repos are polyglot, and an un-init repo resolves to lang=null — the very repo that would silently stay cold. Docker backs each row with a persistent named volume (agentsmith-pkgcache-*), ensured at spawn, never removed with the sandbox, not a per-job name the reaper deletes; SANDBOX_PACKAGE_CACHE=false restores today's exact binds+env. K8s UNTOUCHED (a cache there = operator-provisioned RWX PVC, not a code default), SandboxSpec unchanged. Measured on the operator host, 12-package project: 12-14s cold in every fresh container vs 1-2s warm. Second half: the host pushed the UNCLAMPED step and waited only cap+30s, so a command above the cap was killed by NOBODY — the host threw and the agent's timeout result with its captured output arrived too late (that is the exit -1 with empty output). SandboxStepCap clamps before the push in both container backends; run_command renders the error line it already carried. Extractions to keep the ratchet honest: DockerImagePresence, DockerSocketUriResolver, Directory/Grep renderers; DockerContainerSpecBuilder's duplicate quantity parsers deleted for the existing ResourceLimitsDockerExtensions (it and SandboxBackendRegistrations left the length baseline). -> .agentsmith/phases/done/p0407-warm-package-cache.yaml"
    p0408: "THE FLOW EXPLAINS ITSELF (contracts + website, shipped). The control flow is now a GENERATED picture: website/src/static/control-flow.svg is written from PipelinePresets.Effective (phase block already spliced) + CommandDisplayNames + CommandBeats + CommandStepClasses + the new CommandModelUse, so the 24-step code run, its per-phase repeat block, the 4 steps where a model runs (repo-scope classifier, project-analyzer-master, spec-derivation-master, coding-agent-master) and all 8 presets are drawn from the code that executes them; ControlFlowDiagramTests regenerates and fails on drift (AGENTSMITH_WRITE_DIAGRAM=1 to update). CommandModelUse declares model use per step (call / master loop / none, with actor + expected answer), covered by 'every effective preset step is classified' + 'a handler taking a chat client is declared'. Pipeline->master routing moved from AgenticMasterContextBuilder into PipelinePresets.MasterFor so picture and run resolve one table. Diagram states its own limits (loop internals, run-time phase count, master bodies in the pinned skills catalog, run-time skips + fan-out). Audit finding: 13 of 14 embedded prompt resources are dead (Triage/SkillRound, NegotiateExpectation, GeneratePlan leftovers) -> p0409; only spec-derivation-master is live, as catalog fallback. -> .agentsmith/phases/done/p0408-the-flow-explains-itself.yaml"
    p0406: "A KNOWLEDGE PHASE CAN FINISH (backend, shipped). Run fa8c (41 min, $5.88, phase never finished): a ships_code:false phase could NEVER satisfy MasterReengagementPolicy's acceptance gate — AcceptanceObjectivelySatisfied demanded a Green/NoTests BUILD status, which a phase producing no source change cannot honestly produce, so the master was re-driven until the budget died, twice running `dotnet build` (23 of the 41 minutes, the larger killed at the 900s step timeout) to reach a gate that did not exist for it. Fix: the gate left MasterReengagementPolicy as MasterAcceptanceGate and takes ships_code (REQUIRED, never defaulted — p0400c's lesson) — a knowledge phase is judged by its dispositions alone, its own RED still disqualifies it, a code phase is byte-for-byte p0341e. Second driver: fa8c's master emitted no verdict at ALL (zero Green, zero Failed, zero dispositions on the trail), and 'no verdict' never becomes 'satisfied' — a null is now re-driven ONCE (the p0374a pass index), then the loop ends on a named, logged unknown verdict; the bound is scoped to the acceptance branch, an unbacked done step still re-drives. Third consumer found blind to ships_code after p0400, so PhaseKindAwarenessRuleTests discovers deciders BY TYPE (MasterVerification/AcceptanceDisposition in, bool/KeystoneVerdict out) and requires the phase kind; exemptions are typeof-resolved and fail when stale. Ratchet obeyed by extraction (MasterUserPrompt out of the handler; MasterReengagementPolicy 113 lines, left the baseline). -> .agentsmith/phases/done/p0406-a-knowledge-phase-can-finish.yaml"
    p0403: "PRINCIPLES WITH TEETH (backend). The decidable coding principles stop being advice: no static class holds a collaborator, and no file grows past 120 lines. The 187 files already over the limit get a RATCHET rather than an exemption — file-length-baseline.tsv records each length at installation, a listed file may only shrink, no new file may join, and a file that reaches the limit must leave the list. Debt moves one direction only. Shipped in #499. -> .agentsmith/phases/done/p0403-principles-with-teeth.yaml"
    p0400c: "THE DELIVERABLE IS DECLARED, NEVER DEFAULTED (backend). With p0400b's explicit rendering in place, ALL FIVE derived phases of run aa2a carried ships_code: true — including a pure branch/classify/inventory phase and one whose only deliverable was a report. The model never emits false, and an absent field collapses into a declared true the moment a fallback runs, so the derivation JSON omitting ships_code became a REJECTION instead of a default. Superseded four phases later: p0421 removed ships_code entirely once the delivery question stopped being 'did this run commit code'. Shipped in #499. -> .agentsmith/phases/done/p0400c-the-deliverable-is-declared-never-defaulted.yaml"
    p0401: "STATIC STATE BECOMES INJECTED STATE (backend, shipped). Supersedes the sweep half of p0282a, whose 'judge which ~13 statics are services' criterion no agent could re-run. Mechanical rule instead: a static class holds NO non-constant static field — a static field IS the dependency a constructor would have taken; pure static functions over values stay static. NoStaticStateRuleTests reflects over Application + Infrastructure(.Core/.Persistence) with a synthetic-violator teeth test; immutable data tables (severity map, excluded dirs, regexes) sit in a classified allowlist. Converted: DerivedPhaseYaml -> DerivedPhaseYamlRenderer, SpecSetIndex, AgentSmithMeter -> AgentSmithMetrics (one meter per host, same meter NAME for exporters), ScannerObservationFactory (warn-once set was process-wide), DiscoveryOutputParser, ContextYamlBuilders, ThrottleWaitReporter (AsyncLocal ambient scope). Four codec statics named in PendingConversions -> p0401a. -> .agentsmith/phases/done/p0401-static-state-becomes-injected-state.yaml"
    p0400b: "THE DECLARATION SURVIVES AND IS VISIBLE (backend, shipped). p0400a made ships_code an obligation the reader then ate: SpecJsonReader.TryGet folded underscores on the MODEL's side only and compared against the lookup name verbatim, so a caller asking for the field as prompt and schema spell it ('ships_code') matched nothing and silently fell back to the default. Both sides are normalised now (underscores + hyphens), pinned by a theory over the spellings models emit. Second half: the renderer omitted ships_code when true, so a spec without the field could mean 'declared true' or 'never declared' — run 4599's diagnosis burned on that ambiguity. The declaration is rendered in BOTH directions; a default worth obeying is worth reading back. -> .agentsmith/phases/done/p0400b-declaration-survives-and-is-visible.yaml"
    p0400a: "DECLARED COMMANDS RUN AT REPO ROOT + SHIPS_CODE OBLIGATION (backend, shipped). Run b9b0 (first clean-foundation run) died twice at phase a's gate: (1) VerifyPhase ran the DECLARED 'dotnet build <sln>' at the CONTEXT WORKDIR — MSB1009 although the master's own baseline proved the same command green from /work; declared ci commands are authored against the repo root, discovered entry points keep their workdir — the stage tuple now carries its cwd so the two cannot be conflated. (2) The derivation omitted ships_code on the pure-knowledge inventory phase and the keystone failed a 7/7-done phase; the derivation prompt now states the MUST rule with example, pinned by a prompt-content test. -> .agentsmith/phases/done/p0400a-declared-commands-run-at-repo-root.yaml"
    p0400: "PHASE DELIVERY SEMANTICS + VERIFY RESOLUTION (backend, shipped). Run 5021: an inventory phase (deliverable = knowledge, BY DESIGN no diff) was failed by two code-phase mechanisms. Fix: ships_code (bool, default true, emitted only when false) on PhaseDraft + phase schema (repo AND plugin copy — plugin commit pending, separate repo); ships_code:false = judged by done criteria, keystone p0241/hollow-delivery rules stand down, build gate skips on no-diff / baseline-compares on diff (stash re-run; red-at-baseline-too = not worse); run-level p0384 expected_changes gate UNCHANGED (pinned). Verify command resolution: the guessed 'dotnet build <RepoName>.sln' was ANALYZER LLM OUTPUT executed verbatim — declared ci commands still win, else entry-point discovery from files that exist (single sln depth<=2, else single csproj at workdir), ambiguous/absent = named resolution finding, never a fake compile failure; non-.NET repos keep the p0393 skip. -> .agentsmith/phases/done/p0400-phase-delivery-semantics-and-verify-resolution.yaml"
    p0399: "SPEC-SET FIDELITY + HYGIENE (backend, shipped). Operator branch review: every command block in the phase companions was HTML-escaped (&quot;-greps) — the byte-for-byte promise delivered the bytes of the TRANSPORT ENCODING; and revision 3 left revision 2's monolith files beside the new cut. Fix: TicketHtmlConverter at segment INGESTION (pre-blocks parked and restored as markdown fences so code stays one segment; entities decoded after tag-strip preserving literal generics; plain text passes byte-for-byte; AcceptanceCriteria same treatment) — all downstream consumers see clean text. SpecSetWriter: a revision fully REPLACES the set (stale .yaml/.md removed via git rm in the same commit; index/accounting survive by construction). -> .agentsmith/phases/done/p0399-spec-set-fidelity-and-hygiene.yaml"
    p0394a: "THE SPEC IS THE PLAN (backend, shipped). Operator ruling: one artifact, one truth. PhaseSequence splices without GeneratePlan/PlanOpenQuestions (retired with helpful custom-preset errors); ProgressLedgerSeeder seeds from the ratified PhaseDraft (steps, repo-qualified targets); the master plan section renders the spec goal/steps/done; clarification lives at derivation (SpecHandback) and mid-run (MasterOpenQuestions). Eliminates the plan-truncation class structurally (p0397 eval had proven sonnet-5@8192 truncates EVERY multi-repo migration plan) and saves one LLM call per phase. Harness preset scripts now mark spec-seeded ledger entries done via update_progress — the keystone honestly failed them until they did. -> .agentsmith/phases/done/p0394a-the-spec-is-the-plan.yaml"
    p0398: "STEP CLASSIFICATION + CONDENSED DRAWER (backend read path + dashboard, shipped). Every command carries a display class (CommandStepClasses beside CommandDisplayNames): milestone = story, gate = visible only with a finding (failed/parked or summary not a known no-op sentence — sentences documented beside the map), internal = collapsed into a per-segment mechanics row (expandable, nothing hidden from data). RunStepView carries StepClass+HasFinding; old records classify by projected name incl. retired commands via literals; unknown commands default milestone (never silently hidden); failed/live internals always surface. -> .agentsmith/phases/done/p0398-step-classification-condensed-drawer.yaml"
    p0395b: "SINGLE-LINE ROWS (dashboard, shipped). Corrects p0395a: sidebar rows default to ONE line with inline meta; only a user-narrowed rail wraps the label (max two lines). -> .agentsmith/phases/done/p0395b-single-line-rows.yaml"
    p0397: "PLAN-CALL LIVE EVAL (tests, shipped). The LiveLLM golden the plan regression class was missing: builds the REAL plan prompts (AgentPromptBuilder + embedded template, two-repo code maps, {MultiRepoRulesSection}) from a ticket text (env AGENTSMITH_EVAL_TICKET_FILE for a local real ticket — never committed; committed = anonymized synthetic two-repo migration fixture with an anonymization test), calls Azure OpenAI (EvalChatClientEnv) and Anthropic (ClaudeChatClientBuilder, AGENTSMITH_EVAL_CLAUDE_MODEL) at output caps 8192 + 16384, parses with PlanParser incl. salvage, writes a per-model-x-cap report (Reports/plan-goldens/). EMPIRICAL RESULT (both real + synthetic ticket): sonnet-5@8192 = finish-reason length, 0 parsed AND 0 salvaged steps (thinking can consume the whole visible budget); sonnet-5@16384 and gpt-4.1@8192 = full two-repo plans. Evals/README.md documents both LiveLLM suites. -> .agentsmith/phases/done/p0397-plan-call-live-eval.yaml"
    p0396: "SANDBOX IDLE-WAIT RESILIENCE + HONEST VANISH DIAGNOSIS (backend, shipped). Live c9d2 (2026-08-04): one 6.5s Redis stall during the sandbox agent's idle RPOP wait escaped JobLoop unhandled -> exit 3 -> vanish -> run cancelled, ticket failed — transient treated as terminal, same family as the p0376 pump kill and the p0383 sleep reap. Fix: WaitForStepTolerantAsync catches RedisTimeout/RedisConnection exceptions, logs, counts against the UNCHANGED 30-cycle idle budget; everything else stays fatal. Vanish summary now tells the truth: the liveness watcher records an exit-facts detail sentence next to the cancel reason (TryCancel detail, first-cancel-wins; reason string 'sandbox-vanished' untouched so ResolveCancelStatus/p0381 keep working) — OOM guidance only when oomKilled, exit 3 named as agent crash, no-inspect-evidence = neutral no-guess sentence. -> .agentsmith/phases/done/p0396-sandbox-idle-wait-resilience.yaml"
    p0395a: "DRAWER FLUID WIDTHS (dashboard, shipped). Operator verdict on p0395: dragging worked but persisted ABSOLUTE pixels — widen the window and drawer/split stand still; sidebar labels still ellipsized. Fix the model: usePersistedPaneWidth stores FRACTIONS (drawer/viewport, rail/drawer; discriminator: stored <=1 fraction, >1 legacy px migrated once against the current basis — preference preserved), px clamped at render, re-derived on every resize via useViewportWidth. Sidebar rows: two-line label clamp, meta on its own line, flexing row height. Measure cap prose-only — command rows use full pane width. 575 vitest + build green. -> .agentsmith/phases/done/p0395a-drawer-fluid-widths.yaml"
    p0395: "RUN-VIEWER OPERATOR FEEDBACK (dashboard + server read path, shipped). Four live-run findings fixed: raw 'done:' key prefix removed at the SOURCE (SpecMarkdown renders a Definition-of-done list; reader strips legacy cached copies); full-pipeline drawer width + rail splitter draggable and persisted (PaneResizeHandle + usePersistedPaneWidth, CSS custom properties, no new packages), text measure capped/wrapped; phase documents: viewer reads the DB artifact-store copy — the per-phase markdown companions were NEVER rendered and a lost commit read back string.Empty silently; SpecMarkdown now renders a Phase-documents section from the server-held set with an explicit sourced empty-state; spliced step labels: RunStepsReader splits the p<id>-prefix at read (old records render clean), UI groups by phase header, defensive client-side split for pre-p0395 servers. Dashboard 570 vitest + build green, backend 3693 green. -> .agentsmith/phases/done/p0395-run-viewer-operator-feedback.yaml"
    p0394: "LIVE-RUN PLAN-JSON + SPEC-COMMIT IDENTITY (backend, shipped). The first live run after p0384/p0393a: (1) p0384 appended the multi-repo plan rules AFTER 'Respond ONLY with the JSON' on a false premise — agent-plan-system is EMBEDDED, not a pinned skill — so the model answered prose and SalvageProse honestly yielded a 0-step plan/empty ledger seed; fix = {MultiRepoRulesSection} token in the template BEFORE the JSON-format section, append deleted, token declared in MasterPromptTokens so a forgotten binding fails loud at Render; position pinned by test (JSON-only instruction stays terminal). (2) SpecSetWriter committed before any identity-configuring flow ('Author identity unknown' exit 128); fix at the primitive: CommitAndPushStagedAsync ensures user.name/email idempotently — every caller covered, no call-site ordering can reintroduce the class. 3691 green. -> .agentsmith/phases/done/p0394-live-run-plan-json-and-spec-commit-identity.yaml"
    p0391b: "NO STARTUP PATH THROWS (server + cli, shipped PR #487). Closes the paths p0391a left, and gives the CLI the server's own validation rather than a second validator. p0393 found ANOTHER instance of the class while p0391b was still unwritten — AddJobSpawnerAsync registered no IJobSpawner when no backend was reachable, so a hosted service could not be constructed and StartAsync threw; SpawnerProbe had been written for exactly that case and could never publish its finding because the process died first. ConfigCatalogResolver.ThrowIfErrors became ONE finding per error with its field, not a config-wide blob. -> .agentsmith/phases/done/p0391b-no-startup-path-throws.yaml"
    p0392: "CONFIG STUDIO SHOWS WHAT IS MISSING (server + dashboard, shipped PR #487). The 2026-07-31 outage: a trigger lacked needs_clarification_status, the server refused to start, and the field could not be set in the UI at all — so no care would have prevented it. The capabilities descriptor drives the forms, so a backend field that is not offered is a capabilities gap rather than a UI omission. Missing REQUIRED is shown before saving, by the server's rules. Preserves the p0393 distinction: IsAcceptedName (what a config may carry, including retired aliases) vs Names (what the Studio may OFFER). Field-gap remainder (repos, project blocks, agent knobs, pipeline_triggers, settings singletons + partial-write safety) -> p0392a. -> .agentsmith/phases/done/p0392-config-studio-shows-what-is-missing.yaml"
    p0393b: "DURABLE DIALOGUE ON SPEC-DIALOG (pipeline, shipped PR #488). p0393 deleted both interactive gates from the coding path, so DurableDialogueTests lost its subject, not just its assertions. The mechanism still matters and spec-dialog still checkpoints, so the checkpoint/restart/answer/resume coverage MOVED there — the resume sweeper and durable inbox have their end-to-end proof back. -> .agentsmith/phases/done/p0393b-durable-dialogue-on-spec-dialog.yaml"
    p0374a: "DONE STAYS DONE (pipeline, shipped PR #488). Restores the merge p0374 removed on a rationale p0368's explicit reopen token had already satisfied, plus the traceability p0374 promised in exchange and never shipped (every ledger transition on the trail; the trail row renders a ledger transition). Operator ruling after watching a run show everything green and then something else entirely: done is not replaced. NOT a re-argument about the ledger's authority — p0393 settled that (no vote on green, a qualifying vote on red). This is about the ledger not LYING, which is the one job p0393 left it. -> .agentsmith/phases/done/p0374a-done-stays-done.yaml"
    p0312d: "RETIRE THE BATCH PATH (pipeline, shipped). PeelBatch/IsBatchableCommand/PipelineBatchRunner/BatchSlot/BatchOutcome deleted — and RunBatchAsync with them, which the spec's delete list omitted: without a peeler it was unreachable, so keeping it would have preserved the same dead machinery one layer up. IPipelineStepRunner has one method now. Agent.Parallelism.MaxConcurrentSkillRounds REMOVED rather than kept with a warner: it was a one-field section, and keeping the type alive so a warner had something to read is a setting whose only reader talks about the setting. Two tests carry the p0393-style care instead — one pins the key's absence across the configuration namespace, one pins that an agentsmith.yml still declaring it loads (a guarantee that had rested on an incidental IgnoreUnmatchedProperties nobody had asserted). PR #483. -> .agentsmith/phases/done/p0312d-retire-the-batch-path.yaml"
    p0313b: "SHARED METHODOLOGY REFERENCES (skills + backend, shipped). spawn-budget, evidence-modes and phase-discipline extracted to references/; ~20 duplicate copies collapsed; the loader inlines one level deep and fails loud on a missing or nested citation. Spec correction: it named the CODING master as the third evidence_mode emitter — that master does not use the field and never did. The third is pr-review, which carried it with no statement of what the other values mean. Two guards added beyond the spec: the validator rejects a {Placeholder} inside a reference file (references inline AFTER the metadata.inputs comparison, so that path would have re-opened p0313's leak from the side), and a backend test resolves every master in the EMBEDDED tarball through the real reader — nothing otherwise connected the citation, the packaging list and the pin. Validator_DanglingReference_Fails is not automated: the skills repo has no test framework, validate-skills.sh IS the test, and each new check was verified by deliberate failure. PRs #483 + skills#150. -> .agentsmith/phases/done/p0313b-shared-methodology-references.yaml"
    p0388d: "LIVE DETAIL FOLLOWS THE RUN (server + dashboard, shipped). The operator's symptom — the counter climbs while the pane shows nothing new, even after a reload — was two defects. TrailReader read a step page ASCENDING from the oldest row, so opening a busy step returned its FIRST page; replaced by two directional reads over p0388a's (RunId, StepIndex, Seq) index, with OFFSET paging rejected because it skips or repeats rows exactly when the run is busiest. And nothing re-read: the detail hooks fetched once on mount. Now the open step polls forward ~1s while the RUN is live (the run's status, not the step's — a step reads running until its StepFinished lands) and drains a backlog rather than trailing a page per second. sinceSeq=0 deliberately reads as the NEWEST page: a caller with no cursor holds nothing, and reading forward from nothing is the defect itself. No caps — that was the ruling behind p0388a/b; what is bounded is the request, not the client's list. PR #485. -> .agentsmith/phases/done/p0388d-live-detail-follows-the-run.yaml"
    p0393a: "DERIVE THE SPEC (pipeline + skills, shipped). DeriveSpec after AnalyzeCode turns ANY ticket into an ORDERED SET of phase specs on the ticket branch — p{NN}-slug.yaml for what and done, p{NN}-slug.md for the ticket spans carried byte-exact, set.yaml as the index the next run reads back. Supersedes p0390/p0390a and DELETES their vocabulary: WorkSpec* (≈60 files, the revise_work_spec master tool, the TicketWorkSpecs table) is retargeted onto PhaseDraft, not wrapped. THE MODEL RETURNS ANCHORS, NEVER CONTENT: TicketSegmenter cuts the ticket into numbered blocks in code, the pinned spec-derivation-master answers with segment IDS, SegmentExtractor cuts them byte-exact — a retyped naming contract is a broken one. ACCOUNTING over the union of phases (carried by a named phase or discarded with a reason, readable in the PR); an incomplete one does NOT split at all — one phase, whole ticket, GateChecked run event, and the rejected cut's done-criteria carried forward so the contract never silently empties. PhaseSequence splices one SelectPhase->GeneratePlan->PlanOpenQuestions->AgenticMaster->MasterOpenQuestions->VerifyPhase->WritePhaseRecord block per phase; a red VerifyPhase stops the sequence there and the finalizer tail still runs. PipelinePresets.Effective() expands the block, because the park-capability checks and the run-rail beats are asked at CONFIG time and the literal list would report a pipeline that always builds as one that skips it. A partial sequence leaves the PR a DRAFT with a per-phase table (done/failed-with-command/not started); only a complete run calls the new MarkPullRequestReadyAsync (4 providers). Executed phases are APPEND-ONLY — recorded in set.yaml by WritePhaseRecord, and a re-cut re-partitions only the unexecuted tail. NegotiateExpectation leaves the code preset: the phase's done-list IS the acceptance contract (AcceptanceCriteria.For feeds keystone, PR body, result.md, master). Source precedence branch artifact > ticket DESCRIPTION > derivation; a ticket COMMENT is never a source. -> .agentsmith/phases/done/p0393a-derive-the-spec.yaml"
    p0393: "ONE CODING PIPELINE `code` (pipeline + skills, shipped). fix-bug, fix-no-test, add-feature and phase-execution collapse into one preset; the retired names stay as ALIASES and Canonical() makes the alias real — type, sandbox sizing and the keystone all follow it. The first cut resolved the command list through the alias but classified the RAW name: the run executed `code` while ExpectsCodeChanges said false, so it got the light sandbox profile and a keystone expecting no diff. Config validation accepts aliases (IsAcceptedName); the Studio still OFFERS only Names. NEW VerifyPhase: the repo's own build+test from ProjectMap.Ci after the master, red means no PR — the second opinion p0216 left missing when it gave verification to the master as a RESPONSIBILITY. PhaseSpecGate passes an ABSENT spec through (an ordinary ticket has none) and still fails a MALFORMED one. The ledger loses its vote on GREEN and keeps it on RED, where it separates 'gave up early' from 'genuinely stuck' (p0363); removing both silently reverted that. NegotiateExpectation/DeriveSpecification/WorkSpecHandback KEPT, each skipping when a spec is present — deleting them before p0393a guarantees a spec would leave every ordinary ticket with an empty acceptance contract. Approval deleted outright. Test fallback vocabulary now DERIVED from the presets — it was the fourth name copy and the stub that hid the pr-review defect. -> .agentsmith/phases/done/p0393-one-coding-pipeline.yaml"
    p0313: "AGENTSKILLS ALIGNMENT (skills + backend, shipped). THE LEAK: MasterPromptTokens.All is the hand-kept list that makes an unbound placeholder fail loud, and it rotted — {WorkSpecSection} (p0390) and {ProgressLedgerSection} (p0341) were added to the coding master and never to the list, so the check stayed silent while GenerateTests + GenerateDocs sent both strings VERBATIM to the model on every add-feature run. Fixed and, more importantly, made undriftable: every master now DECLARES metadata.inputs and validate-skills.sh checks both directions (used-but-undeclared, declared-but-unused), verified against a deliberately broken declaration. MasterPromptTokenDriftTests guards the backend list. CI gains a per-master version-bump job. The guard's first version aborted the script silently under set -euo pipefail — caught because the NEGATIVE test did not fail. Evals -> p0313a (p0309 harness missing), references/ -> p0313b (authoring + loader feature). -> .agentsmith/phases/done/p0313-skills-agentskills-alignment.yaml"
    p0312a: "MASTERS-ONLY CONSUMPTION (backend + skills, shipped). Every pipeline resolves skills from the catalog ROOT — the per-category map was fiction for the p0179-collapsed presets and mis-mapped skill-manager/autonomous to skills/coding so their own role skills never loaded. skill-manager + autonomous RETIRED per operator ruling (unused; reactivation = one master + an AgenticMaster preset, not the Triage/SkillRound choreography) with both names in PipelinePresets.RetiredPresets. Deleted: SkillRound/FilterRound families + strategies, the Triage stack, ConvergenceCheck, CompileDiscussion, AgenticExecute, LoadRuns, WriteTickets, PhaseAdvance, VerifyRound, PlanConsolidator, BaselineLoader, SkillIndexBuilder. principles/ RESCUED from the delete list — p0379 content the reader degrades to null on, i.e. it would have vanished from every run silently. Executed against the actual tree, not the 3-week-old list. -> .agentsmith/phases/done/p0312a-masters-only-consolidation.yaml"
    p0312b: "LEGACY CATALOG DELETION (skills, 4.0.0). 168 files, -5867 lines: api-security/ autonomous/ coding/ legal/ mad/ pr-review-reviewers/ security/ skill-manager/ _index/ baselines/ + observation-schema.md (dead — the backend renders its own embedded copy). project-discovery + project-bootstrap MOVED into _masters (role producer; _masters means framework-dispatched, not only loop bodies); principles/ moved to the catalog root. The move immediately caught project-discovery at 188 chars, over the 180 cap the validator enforces — the class that broke v3.16.0. package.sh + validate-skills.sh + README follow. PR #148. -> .agentsmith/phases/done/p0312b-legacy-catalog-deletion.yaml"
    p0312c: "PR-REVIEW MASTER, TRIAGE RETIRES (pipeline + skills). Operator ruling: Triage was a selector for models that could not choose their own reviewers; a master fans out via spawn_agents. pr-review was its last consumer AND the only pipeline without a master — one fact from two sides. THE FINDING: pr-review could never run. PipelineNameInitializer publishes through SetEnum, which throws on an undeclared value, and pr-review was absent from the shipped pipeline_name enum, so the run died at step two. Uncaught because PrReviewSkillRosterTests set the concept against a STUB vocabulary. The new composition guard found a SECOND instance immediately: fix-no-test, broken the same way. Four 46-51-line reviewers became one master; preset takes the p0179d shape (AgenticMaster + MergeMasterFindings), CompilePrReviewFindings untouched. NEW {PrDiffSection} — the diff reached a prompt only through the deleted PrReviewSkillPromptStrategy. -> .agentsmith/phases/done/p0312c-pr-review-master-triage-retires.yaml"
    p0391a: "STARTUP NEVER ABORTS (server + pipeline + dashboard). A boot-time throw over one project's missing field killed the whole process, and the tool needed to fix it was the thing that would not start. Every abort is now a StartupFinding that boot disables, /api/config/findings answers and a dashboard banner renders. -> .agentsmith/phases/done/p0391a-startup-never-aborts.yaml"
    p0390: "DERIVE SPECIFICATION — SUPERSEDED by p0393a; PR #476 was merged, so the code is on main and gets retargeted rather than re-written. Executed, and the branch survives for retargeting: it introduced a SECOND spec concept (WorkSpec + serializer + validator + revision guard + handback) beside the PhaseDraft / PhaseSpecGate / PhaseSpecPlanFactory p0315d already ships — two words for one thing, 142 files, 6341 lines. Two premises underneath also failed: the spec was ADDED beside the still-pinned ticket (growing the context that was the problem), and it was written for fix-bug/add-feature, the branch p0393 deletes. -> .agentsmith/phases/done/p0390-derive-specification.yaml"
    p0390a: "CONSTRAINTS ARE THE HEAD — SUPERSEDED by p0393a, never executed. It exists to squeeze a manual into the compaction head, which is only a problem while the master works from ticket prose; once the derivation writes p{NN}-slug.md beside the yaml, the code templates ARE the artifact the master reads and nothing has to be carried or quoted inside the head. The accounting survives and moves to p0393a, guarding the derivation instead of the head. -> .agentsmith/phases/done/p0390a-constraints-are-the-head.yaml"
    p0391: "MASTER EXIT PATHS (pipeline + skills, shipped). The master had no working way OUT: ask_human resolved to HumanToolHost on every ticket-triggered code preset, and ContextKeys.DialogueJobId is set in exactly one place (SpecDialogTurnRunner), so the tool answered the literal string \"Error: Dialogue transport not configured.\" while the deployed skill instructed the master TWICE to call it and stop rather than guess; p0365's blocked/blocker verdict was parsed and honoured terminally but never declared in the skill; and nothing bounded a ledger the model refills freely since p0374, so ShouldReengage re-drove on any appended \"verify X once more\" — the shape of the cancelled 124-minute run. Shipped: MasterOpenQuestions + a real ticket park for the code presets (park capability DERIVED from each preset's command list, never a name set), blocked/blocker declared and a stopping condition added opposite the definition of done (skills 1.17.0), the drained-ledger reminder no longer inviting new steps unconditionally, a per-pass ledger-turnover bound, and the unset park-status silent-degrade replaced by a load-time rule in ProjectConfigNormalizer. Trigger: the independent assessment of p0390, which put p0390 on hold. Live verification of the park on a real ticket run is still OPEN. -> .agentsmith/phases/done/p0391-master-exit-paths.yaml"
    p0388b: "RUN RAIL FROM PROJECTIONS (backend + dashboard, shipped). The run-detail 'Full pipeline' drawer rendered an EMPTY rail on a 103-minute live run: the rail was folded client-side from the replayed event log, and the browser buffer (RUN_CAP 2000, FIFO) evicts OLDEST-first — which is exactly the structural spine (RunStarted + every StepStarted); p0275's plannedSteps seed could not save it because its carrier, RunStarted, is event #1. Fix: serve the full pipeline as BOUNDED queries over the p0388a-attributed projections. New GET /api/runs/{id}/steps (RunStepsReader: RunStep rows in index order + per-step LLM count/cost, sandbox-command count, sub-agent count — three set-based queries, none per step), GET /api/runs/{id}/steps/{i}/events?sinceSeq&limit (TrailReader.ReadStepPageAsync, served straight off the (RunId,StepIndex,Seq) index, clamped default 100/max 200 with a Seq cursor; unknown index = empty page, not 500), GET /api/runs/{id}/decisions (RunDecisionsReader, latest-first); routes live in a new RunStepQueryEndpoints mapped from RunQueryEndpoints. Dashboard: useRunSteps drives the NavRail (rail complete with an EMPTY live buffer), useRunStepEvents loads the selected step's page on demand with a cursor-driven 'load more', useRunExecutionTree stops being the rail source and becomes the composer of ONE step's body from that step's page, BuildNotes reads the decisions query, and the 2s /trail poll (whole structural trail per client per page load, re-feeding the very tool-call events p0367 kept off the run channel) is DELETED — the eventStore cap is renamed RUN_LIVE_WINDOW and documented as a rendering bound no correctness argument may rest on. Sub-agents become a per-step count on the rail with their detail inside the step pane. p0388c follow-ups (same PR): RunDecision.Category column (migrations in both assemblies) restores the notes' \"decision · <category> · <time>\" line — the event always carried it, the projection never stored it; and a PipelineHarness FAST-TIER proof (no Docker/Redis/token) runs a real scripted fix-bug pipeline with the production StepAttributingEventPublisher reinstalled over a trail-writing ProjectingEventPublisher, asserting a handler-raised event (CatalogLoaded) and a CHILD-TASK event (SubAgentSpawned, from SubAgentRunner's Task.WhenAll) carry their own DIFFERENT step indices, and that no persisted row names a step that never ran — verified falsifiable (removing BeginStepScope turns both red). 3724 backend green, dashboard 542 green. -> .agentsmith/phases/done/p0388b-run-rail-from-projections.yaml"
    p0388a: "STEP ATTRIBUTION ON PERSISTED ROWS (backend, shipped). Every persisted run row now carries the step it belongs to, stamped by the producer: IRunContextAccessor gains a third AsyncLocal frame (BeginStepScope/CurrentStepIndex, same handle contract as the run + call frames, three near-identical handles collapsed into one generic FrameHandle<T>), opened by PipelineStepRunner around the WHOLE step (single + batch) so StepStarted, the handler's own LLM/sandbox/decision events and sub-agent work on child tasks all inherit the index with zero per-emit plumbing. The stamp rides the wire as RunEvent.OriginStepIndex (NOT StepIndex — StepStarted/StepFinished/L1StepDetail already declare a non-nullable positional int StepIndex and a same-named int? base property is CS8866) and is applied centrally by a StepAttributingEventPublisher decorator registered in front of RedisEventPublisher in AddRedis — server-side stamping is impossible in principle, the orchestrator's ambient scope does not survive Redis transport. Persisted as a nullable StepIndex column on RunEvents + RunLlmCalls + RunSandboxes + RunDecisions (migrations for the shared set and the SqlServer set) plus a composite (RunId, StepIndex, Seq) index so p0388b's per-step page is served from the index, O(page) not O(run). Pre-phase rows stay null and read as unattributed — no backfill, no inference. 3715 green. -> .agentsmith/phases/done/p0388a-step-attribution-on-persisted-rows.yaml"
    p0387: "RUN-SUMMARY HUMANIZE (backend + dashboard, shipped). Raw provider error bodies ({\"type\":\"error\",...} incl. the live 2026-07-27 usage-limit body) travelled ex.Message -> CommandResult.Fail -> RunFinishedEvent.Summary -> DB -> dashboard verbatim. Fix: ErrorFormatter moved Server->Application (caller migrated, no shim) + HumanizeRunSummary — JSON-only payload detection (error.message extracted via ProviderErrorPayloadParser, then rules incl. new usage/spend-limit rule that names the reset date lifted from the raw text; no matching rule returns the extracted message, never the blob); curated prose summaries pass through byte-for-byte (JSON-only detection chosen over first-line rule matching — prose contains trigger words like 'timed out'); applied in PublishRunFinishedWithStatusAsync for failed/cancelled only. Dashboard formatRunSummary fallback (extracts error.message, no ported rule table — pre-fix rows only, new rows arrive humanized) at all 4 summary render sites; OutcomePanel humanizes BEFORE the p0372 URL-extraction chain. -> .agentsmith/phases/done/p0387-run-summary-humanize.yaml"
    p0386: "PER-REPO SCOPE VERDICT (backend, shipped). The p0331 classifier ruled the run's legacy Angular repo 'unrelated' in its own rationale, yet the single GLOBAL confidence (0.55, dragged down by unrelated server-vs-worker doubt) fell below the 0.70 floor -> all-or-nothing fallback kept all 3 repos and provisioned a never-used node pod. Fix: repos becomes per-repo verdict objects {name, affected, confidence, reason} (bare string tolerated as affected=true at the parse boundary; global confidence DELETED from prompt/model/evaluator); RepoScopeEvaluator decides per repo — keep on affected / no entry / below-floor exclusion (noted on the record, kept doubt never silent), DROP only a confident exclusion (named with confidence + reason); unknown-named entries ignored + noted, never keep-all; all-repos-excluded degrades to keep-all (a run can't scope to zero); configured order + Repos[0]-primary + p0384 EvaluateExpectedChanges byte-for-byte preserved; ContextScopeEvaluator gates on the repo's own verdict (p0336b conservatism at finer grain). Bonus: record confidences now InvariantCulture (were locale-formatted). -> .agentsmith/phases/done/p0386-per-repo-scope-verdict.yaml"
    p0385: "ANALYZER FINALIZE TURN (backend, shipped). p0374 put ProjectAnalyzer on Scout=Haiku; on large repos it narrates the discovery checklist, burns MaximumIterationsPerRequest=25 without emitting the terminal JSON (observed exactly 2x25 calls, run 2026-07-27T13-27), and the blank-restart retry fails deterministically the same way. Fix: ExplorationBudget=25 const owned by ProjectAnalyzer — stated in the user prompt AND passed to Create() so prompt and enforcement share one source; on TryRead failure the SAME conversation continues (exploration response.Messages appended + emit-ONLY-the-JSON user turn) called once with ChatToolMode.None (M.E.AI 10.3.0) while Tools stay declared (provider requires tools param with tool blocks in history); 2 exploration attempts kept, each with one finalize turn (max 4 LLM calls); retry prompt carries the finalize turn's parse error (actionable) not the narration non-error. Model-agnostic; p0295 structured-output enforcement stays the complementary planned layer (a capped loop has no terminal message for a schema to constrain). -> .agentsmith/phases/done/p0385-analyzer-finalize-turn.yaml"
    p0384: "MULTI-REPO PLAN ENUMERATION (backend, shipped). 'Primary repo' was literally sandboxes.Keys.First() — config order, no semantics: AnalyzeProjectHandler built per-repo maps for ALL sandboxes then collapsed singular ProjectMap/CodeMap to the first entry; plan prompt, expectation contract, master code-map section and ledger seed consumed only the singular slots; keystone's gitCommittedChange was anyCode. Live consequence (#19106, all 9 runs): the worker repo was provisioned every run, never planned, never worked — runs went honestly green server-only. Fix (invert, no shim): RepoProjectMaps/RepoCodeMaps are the ONLY analysis surface, singular keys DELETED and every consumer migrated (plan/expectation/master prompts render one '## Repository: <name>' block per scoped repo; plan rules mandate repo-prefixed step targets + covered-or-declared-not-affected per repo; master's singular 'Working Repository' -> per-repo checkout list); ProgressLedgerSeeder passes repo-prefixed targets through verbatim (plan mandates repo/path, matching filesystem-tool routing — keystone never parses targets); scope classifier gains optional expected_changes (validated subset of kept repos, recorded in the rationale); CommitAndPR passes per-repo staged outcomes and the keystone FAILS a run whose expected-change repo has zero committed diff, naming the repo — absent classification degrades to anyCode exactly (fail-open, consistent with the scope fallback). Notable boundaries: multi-repo plan rules appended after Render (pinned skills template has a fixed token set); WriteRunResult's early verdict keeps no per-repo inputs (no git truth yet — no heuristic on missing data); Bootstrap single-entry fallback is sandbox-count-guarded so a multi-sandbox run can't borrow another repo's map. 54 files, 3675 green (+11 vs p0383 base). -> .agentsmith/phases/done/p0384-multi-repo-plan-enumeration.yaml"
    p0383: "REAPER SUSPEND/LIVENESS HARDENING (backend, shipped). Host sleep (~6 min macOS Idle Sleep, pmset-correlated with the server-log gap) made every DB heartbeat stale on wake; the re-elected ActiveRunReaper concluded 'owning replica gone', cancelled a LIVE run (master mid-tool-call 5s earlier), released the lease, and the 60s poller re-claimed the ticket in the 11s window before the ticket write — observed TWICE on 2026-07-27 (runs 2dc5 + 0a5d, #19106). Fix, two guards instead of a threshold bump (a bigger threshold only widens the killable nap): (1) IRunCancellationRegistry.IsLocallyActive — a stale candidate registered un-cancelled in THIS process is heartbeat-refreshed (RenewHeartbeatAsync) and never reaped; per-process registry keeps multi-replica semantics correct. (2) monotonic suspend-gap detection (TimeProvider.GetTimestamp/GetElapsedTime, never wall clock) suppresses stale verdicts for one LeaseFreshFor window after wake. NO lease-release re-ordering: release-then-reclaim for genuinely dead replicas stays intentional crash-resume behaviour; reap path for non-local candidates byte-for-byte unchanged (pinned by test). 3664 green (+6). -> .agentsmith/phases/done/p0383-reaper-suspend-liveness-hardening.yaml"
    p0381: "VANISH-CLASS FAILURES TERMINALIZE THE TICKET (backend, shipped). Root of the live 2026-07-27 re-trigger loop on #19106: a sandbox-vanished run (OOM class) aborts as an OperationCanceledException; PipelineExecutor excludes EVERY OCE from HandleFatalFailureAsync ('cancellations carry their own status semantics') while ExecutePipelineUseCase's vanish branch owned only the RUN status (ResolveCancelStatus -> failed), never the TICKET \u2014 so the ticket stayed in its trigger status and the poller re-claimed it 53s after the failed finalize (failed_status WAS configured and effective; config was never the cause). Counter-proof the same night: e643's step-timeout surfaced as a step RESULT, took the normal failure path, terminalized natively, was NOT re-claimed. Fix: new IPipelineErrorHandler.FinalizeFailedTicketAsync (thin public wrapper over the p0261 FinalizeFailureAsync \u2014 comment + native failed_status move, best-effort); ExecutePipelineUseCase calls it in the vanish catch when ResolveCancelStatus==failed AND in the internal-timeout catch, keyed on the classification already made. Operator/watchdog cancels keep their cancel-path semantics (CancelledTicketFinalizer) untouched. Fail-soft pinned at the handler where the never-throws guarantee lives. 3501 green (+5). Ships in PR #466 with the config-studio tracker-workflow-fields fix. -> .agentsmith/phases/done/p0381-vanish-class-failures-terminalize-ticket.yaml"
    p0380: "EXPERIENTIAL MEMORY SUBSTRATE (backend + skills + spec-first plugin, shipped across 3 repos). Git-native .agentsmith/memory/ store (typed Markdown facts feedback|project|reference, lenient parser: malformed = WARN+skip) + memory/MEMORY.md index (one line per memory, content NEVER in the index); LoadMemoryIndex after LoadCodingPrinciples in all 8 principle-loading presets (absent store = empty section, no error); recall(query) + remember(...) tool hosts on ALL THREE master surfaces incl. read-only Review (recall is a read; remember = proposal — feedback type gets status: proposed, never silently policy; memory paths pinned run-record-class, never keystone-relevant); run-narrative twin: a GREEN (keystone-passed) run upserts ONE curated ticket-{id} project memory (dedupe by ticket, not append-per-run; write failure = loud DEFECT warn, never a run failure) — the run-side state.done, always-read via the index at plan time. FileDecisionLogger REWRITTEN: schema-conformant decisions/<phase|runId>.yaml (same format the IDE writes), legacy decisions.md append RETIRED; decision.schema.json run pattern widened to real p0156 ids (superset keeps legacy r{NN}; synced byte-identical to the plugin). SEEDED: 32 derived feedback rules imported from the operator-local corpus (anonymized + fingerprint-scanned, 1 excluded as pure operator-infra; status=proposed — PR review ratifies; the [[slug]]s long cited in code comments + decision YAMLs finally RESOLVE). Skills branch feat/p0380-memory-substrate (stacked on p0379): memory-discipline.md shared reference + 5 masters consume memory (coding recalls before re-deriving + proposes remember; security/api-security recall ratified FP-dismissals BEFORE emitting — dismissed stays dismissed, changed-code exception; mad/design-partner ground answers), 3-layer graceful degradation so old backend pins render nothing stale. Plugin 2.1.0 branch: templates/memory/, bootstrap-project creates the store, update-project 2.x->2.1.0 migration RETROACTIVELY adds memory/ + patches the root CLAUDE.md read order (operator-approved — closes the wrong-place-lookup class for existing projects), templates/prompt.md rewritten from its stale v1 read order to v2 incl. memory/MEMORY.md. ~20 new backend tests. -> .agentsmith/phases/done/p0380-experiential-memory-substrate.yaml"
    p0379: "UNIVERSAL AGNOSTIC CODING PRINCIPLES (backend + skills PR, shipped). The INVERTED model is live: principles are AUTHORED gold, code moves toward them — never inferred from archaeology (which now feeds ONLY context/project-map facts). Skills (branch feat/p0379-universal-principles): skills/coding/principles/core.md (intent-only — SOLID/DRY/YAGNI/KISS/Tell-Don't-Ask/composition/one-responsibility/name-the-responsibility/never-swallow-errors/depend-on-abstractions/enforce-with-tests; mechanism words banned by backend test AND validate-skills.sh, enforced inside package.sh so a bad catalog cannot tarball) + DELTA-FORMAT.md (additions + OVERRIDES) + deltas/csharp.md (today's .NET mechanism extracted) + deltas/rust.md (one-type-per-file SUSPENDED, 120-line-class -> small-functions/cohesive-modules, tests in-file #[cfg(test)], snake_case, Result/? no .unwrap() in libs) + deltas/typescript.md; project-bootstrap 2.0.0 transfers+ratifies. CLEAN-SPLIT PROOF: 42 anchors must match BOTH today's coding-principles.md AND the real compose(core+csharp) output — nothing lost. Backend: CatalogPrinciplesTemplateSource + BootstrapPrinciplesTransfer; transfer mode activates ONLY when the resolved catalog carries core.md (capability probe, not version gate) so old pins/embedded/fixture catalogs behave byte-identically (pinned by legacy test); in transfer mode the framework writes the composition (status=proposed marker) BEFORE the skill call, ratification rides the existing init-PR review, ratified principles NEVER overwritten on re-run (p0202d merge stays context.yaml-only). Deterministic: same stack, two repos -> identical core+delta. 12 new tests. -> .agentsmith/phases/done/p0379-universal-agnostic-coding-principles.yaml"
    p0378: "RUNFINISHED DRAIN PERSISTENCE (server, shipped REPRO-FIRST). The fb2d loss pinned by a RED repro — and it exonerated the spec's suspect list: in-process the drain provably cannot skip (monotonic ids, pinned green pre-fix); the real mechanism is a RESTART boundary. The RunFinished publish moves the run active-SET -> recent-LIST, so a server restart while the drain cursor lags rehydrates the run via RehydrateRecent ('terminal, never drained') while RehydrateActive tail-anchors cursors (the p0258 anti-replay) — every un-persisted event incl. the terminal one is permanently skipped; high volume only widens the restart-vulnerable window (count:100/200ms lag). Fix: DrainAsync advances the cursor per processed entry and stops at RunFinished without re-adding it (the old post-loop entries[^1] re-add ALSO resurrected every finished run as a leaked forever-polling cursor and re-dispatched whole batches on mid-batch failure — fixed en route); new RunTerminalReconciler at cold-start rehydrate (active + recent, bounded, idempotent, skips queued/waiting_for_input) finalizes a stuck non-terminal row from the stream's own RunFinished via the existing applier + appends the missing trail row — already-stuck rows self-heal without a re-run. Second genuine gap found while stabilizing exactly-once: applier status-commit and trail-flush are separate transactions (terminal row with 0 RunFinished trail rows, seen live) — reconciler covers it; RunTrailRowMapper extracted so projector + reconciler write identical rows. New reusable FakeRedisState/FakeRedisStreams seam driven by the REAL RedisEventPublisher over real SQLite (restart = fresh provider over same state). 8 new tests. -> .agentsmith/phases/done/p0378-runfinished-drain-persistence-gap.yaml"
    p0375: "GENERIC REGISTRY-AUTH STAGING (backend, shipped to the operator-amended spec). Private-feed auth for ANY package manager, zero bespoke code per ecosystem: the deterministic NuGet/npm fast-paths stay LLM-free and BYTE-IDENTICAL (pinned — no cost/behaviour change for every currently-operated repo); uncovered = LLM-free HOST-GREP of the working tree for configured registry hosts (bounded: 80 files/256KB, no per-manager parsing anywhere — matched paths ride as LLM context only); ONE Scout-role read-only LLM call (existing IChatClientFactory + Scout surface, bounded by LoopLimitsConfig) emits global auth config with __AS_TOKEN_<host>__ placeholders — the token NEVER enters prompt/response/history (asserted). THE LOAD-BEARING GUARD IS THE PATH: RegistryAuthPathGuard allows only the sandbox-home config scope (traversal/repo-tree/system paths rejected BEFORE any write — the LLM controls paths, not tokens); SecretLeakGuard names leaked hosts without echoing secrets; unmatched placeholder = loud fail, never an empty write. Stager failures are LOUD fail-soft: WARN + run decision line 'registry auth NOT staged for host X: reason' (the p0374 false-package-unavailable class cannot recur silently). PERSIST-ONCE (p0202a class): success writes a placeholder-only registry_auth section into context.yaml via the typed write path — next run replays LLM-free, an operator-authored section is authoritative and skips the LLM entirely, applied unconditionally even for grep-invisible hosts. 21 new tests incl. all 11 spec-named. -> .agentsmith/phases/done/p0375-generic-registry-auth-staging.yaml"
    p0372: "DASHBOARD POLISH PUNCH-LIST (dashboard, shipped). The 2026-07-22 operator batch: CANCEL gets the SAME two-click arm/confirm as delete (a mis-click can no longer kill a paid in-flight run; CancelRunButton mirrors the DeleteRunButton pattern exactly, the old single-click-POST test replaced — it asserted the footgun); detail header shows the FULL title (CSS wrap + tooltip, no hard truncation) and ALL repositories (N + full list + tooltip, was count+first-name only); PR rendering unified on ONE PrButton component across run list + Outcome beat + output page + full-pipeline view — a PR URL embedded in a FAILED-outcome message is extracted from the prose (prUrls.ts) and rendered as a draft-toned button, one per PR deduped, and draft PRs are clickable everywhere (the draft-not-clickable bug came from a divergent renderer — now impossible by construction). Ticket-number item verified no-action per spec. 530 vitest green (+10, all 5 spec-named), build green, tsc baseline unchanged (38). -> .agentsmith/phases/done/p0372-dashboard-polish-punchlist.yaml"
    p0374: "PROVIDER-AWARE CONVERSATION-HISTORY CACHING (backend LLM adapter, shipped). Root cause (live, sonnet-5 master): ~80k input/call, only ~29k cached — the M.E.AI↔Anthropic adapter's AutomaticToolsAndSystem marks last-system+last-tool ONLY, never a message, so 50k+ of accumulated tool-results re-paid full price every turn (~$0.24/call). Spike-verified the adapter honours no per-message hook (RawRepresentation ignored; ChatClientHelper not public), so a native re-map (~250 lines hot-path) was rejected for a WIRE-level DelegatingHandler (ClaudeHistoryCacheHandler): edits the outgoing /v1/messages JSON to add an ephemeral cache_control to the last message's last block — adapter keeps all mapping+response parsing free. Anthropic caches up-to-and-including → the whole growing prefix caches next turn. Bounded: system+lastTool+lastMsg=3 of 4 breakpoints; idempotent; fail-open on any unknown body. Gated on Cache.IsEnabled. OpenAI/Azure untouched (auto-prefix, no-regression test); plain sk-ant-api03 path also lifted off the SDK 100s default to 10min. 20-block-lookback multi-anchor = follow-up. 3441 green. -> .agentsmith/phases/done/p0374-provider-aware-history-caching.yaml"
    p0368: "LEDGER STABILITY (backend, shipped). Verified live (run 78cd): update_progress did a full REPLACE (p0359 made the ledger fully model-owned), so the coding master wholesale-rewrote its ledger and DISCARDED completed items (10-item plan w/ 5 done -> fresh 4-item plan w/ 0 done), re-treading finished work and defeating ShouldReengage (keys off done-count). Fix: pure LedgerMergePolicy.Merge(retained, incoming, explicitReopens) — retained DONE entries survive, matched by id then fallback key (normalized activity + target); an omitted done item is RE-ATTACHED; a regression to pending is FORCED back to done unless the id carries an explicit 'reopen'/'revert' status token (the only exit from DONE); per-rescue LogWarning ('tried to DISCARD/REVERT N completed steps'). NOT append-only — pending freely restructured (the operator's precise rule). Two p0359 behaviours reversed OPENLY (done->pending needs reopen; resumed prior-done not silently droppable). Cost of a flail is bounded here; its cause is p0371. Follow-up: teach coding-agent-master the reopen token (skills). -> .agentsmith/phases/done/p0368-ledger-stability.yaml"
    p0369: "RUN METRICS PERSISTENCE (backend, shipped). Persists a per-run RunMetrics summary (folded incrementally by RunEventApplier so it exists mid-run) and serves it on GET /api/runs/{id} — the operator's basis for optimization, previously only reconstructable by hand. Fields: time split (LlmActiveMs, ThrottleWaitMs = the rate-limiter wait, SandboxCommandMs); tool usage (reads/writes/run-commands/greps + top-5 read/write files); CONTENT-AWARE redundancy (RedundantReads/Writes keyed on path+content-hash — a re-read of CHANGED content is legitimate, of UNCHANGED is waste); cache health (ColdLlmCalls input>1024&cached=0, CacheDiscards warm->cold, UncachedReprocessedTokens); build/test invocation + failure counts. Added SandboxResultEvent.Summary+ContentHash (SHA-256 of touched content; result event fires post-exec so content is known there — no cross-event correlation). Run.RunMetricsJson column + AddRunMetrics migration (SQLite + SqlServer). Detail-only so list/live path stays lean. Follow-ups: dashboard panel to render + prod DB migrate. -> .agentsmith/phases/done/p0369-run-metrics-persistence.yaml"
    p0370: "DASHBOARD LIVENESS BEAT + ABSOLUTE TIMESTAMPS (dashboard, shipped on the eventing branch). Closes two gaps: (a) p0367 moved the per-tool-call firehose off the Run group + added a coalesced SandboxActivity beat, but the dashboard had no handler → detail view lost its live signal; (b) list + detail showed only relative duration, no absolute wall-clock. Added SandboxActivityRollup type + JobsHubClient sandboxActivity subject + conn.on('SandboxActivity'); useSandboxActivity(runId) hook reads the client subject directly (transient liveness, NOT the EventStore backlog — latest-only, no replay value); RunSideRail renders 'Sandbox · N cmds · last <cmd>' while non-terminal. Absolute start time in RunCard (list, short + tooltip) and RunSideRail ('Started' metric, full localized). vitest 520 green, tsc baseline. -> .agentsmith/phases/done/p0370-dashboard-liveness-and-timestamps.yaml"
    p0366: "LIVE-STREAM NEVER DROPS (dashboard, shipped). The only window to a running job went silently deaf: SignalR reconnects forever but a reconnect = new ConnectionId → all server groups lost, and only Overview re-synced (useRunEvents had NO reconnect handling) → detail view stayed 'Connected' yet received nothing. Fix: JobsHubClient keeps a rejoiners map (join/leave around the ref-count registry) and calls rejoinAll() in onreconnected, emitting Connected only after the rejoin settles; the run ScopeBuffer is now keyed (JSON.stringify) so the SubscribeRun structural replay dedups the overlap (reverses the earlier 'run scope unkeyed' decision). Gap-fill rides the existing SubscribeRun replay (NOT GetTrail, which would pour sandbox stdout into the run rail). Reconnecting stays visible. vitest 518 green (+6). -> .agentsmith/phases/done/p0366-live-stream-never-drops.yaml"
    p0367: "EVENT VOLUME + LOAD RESILIENCE (server, shipped). One run emitted ~1350 events, ~95% SandboxCommand/Result, and JobsBroadcaster fanned EVERY event to the Run group → every viewer got the tool-call firehose + per-event hot-path persistence; concurrent runs saturated the server (the ECONNREFUSED). Fix: a pure SandboxDetailEventClassifier + RunEventRouter split meaning (Run group: steps/llm-calls/decisions/story/sandbox-lifecycle/verdict/budget) from detail (per-sandbox group, on ExpandSandbox) → ~1350→~50 Run-group sends/run (test: 603 events → 3 sends). Persistence split to IRunEventPersistence (RunDbEventPersistence), tool-call rows batched (RunTrailBuffer, per 25) off the send. SandboxResultEvent.OutputTail = compact truncated tail (≤40 lines) only on non-zero exit → build failures finally durable/inspectable. SandboxActivityCoalescer emits ≤1 rollup/run/s (distinct SandboxActivity msg) for liveness. BackpressureSafeFanout bounds every send (2s) + drops stalled clients off-loop; MaximumParallelInvocationsPerClient 1→4. CompositeRunEventFanout deleted (its persist+broadcast coupling blocked 'persist but don't broadcast'). Full suite green (+12 tests). NOTE: dashboard needs a handler for the new SandboxActivity message (harmless if ignored) — verify in the combined build. -> .agentsmith/phases/done/p0367-event-volume-and-load-resilience.yaml"
    p0365: "RE-ENGAGEMENT STOP = EMPTY PASS (backend, shipped). The open loop's stop signal, distilled over two live runs. Run 5d32 (before): MadeForwardProgress counted only a newly-done step / now-green verdict as progress -> a pass editing toward a large incomplete step read as zero progress -> stopped after ONE pass. First fix attempt (state-delta + patience K, run 4c32): counted distinct changed files, but FilesystemToolHost keys _changes by path and REPLACES on re-edit, so re-editing the same file (the whole build-fix loop) did not grow the count -> false stall killed 4c32 right as it moved from build-fix to `dotnet test`. The insight (what IS a pass?): a pass = one fresh nudged RunAsync mini-conversation whose boundary the MODEL picks; it alternates edit passes and verify passes, so NO per-pass state delta can tell 'stuck' from 'mid edit->verify rhythm'. Final design — as little control as possible: the only reliable stop is an EMPTY PASS (zero tool calls = agent-smith infrastructure not invoked at all = idle/giving up). ReengageProgressPolicy.Decide(toolCallsInPass, block, threw) -> Continue | StopIdle | StopBlocked; CountToolCalls reads FunctionCallContent across ChatResponse.Messages (as SubAgentRunner does, no new plumbing). Keep driving while ANY tool fires; budget/wall-time/hard-cap bound the active-but-unconverging case; ambiguous signals (repeated unchanged reads/edits) are OPERATOR DIAGNOSTICS, never auto-kill (an abort is always unfavourable — auto-killing on ambiguity broke 4c32). Mirrors Claude Code's loop (no-tool response ends the turn) — agent-smith adds re-engagement because it lacks the human at the turn boundary. Blocked-claim symmetry kept ('can't' honoured only with a concrete blocker); parse wired, skill emission = follow-up. Folds in the OpenAI cache-read fix (CachedInputTokenCount; live 86% hit, run 4c32 $3.58 vs $11.25 full-price). Full suite 3409 green. Content-aware repetition metric + skill blocked-emission + live golden = follow-ups. -> .agentsmith/phases/done/p0365-reengagement-forward-progress-archetypes.yaml"
    p0358: "SKILLS RELOAD VISIBILITY + PYTHON PAYLOAD E2E PROOF (backend + tools). (1) A skills.version change via config studio was SILENT: the epoch bump only rebuilt pollers; the catalog resolved lazily at next run/boot (correct but invisible). Now SkillsCatalogReloadHostedService (EVERY replica — skills cache is per-pod, unlike leader-only pollers; boot = baseline, preflight already resolved) watches the 3s epoch GET and hands changes to SkillsCatalogRefresher: marker-vs-pin compare, logged verdict either way ('unchanged — catalog kept' / 'changed X -> Y — pulling now'), eager EnsureResolvedAsync so a broken release (404/bad sha256) surfaces AT UPDATE TIME; fail-soft (warn + lazy retry at next run). Non-default sources skip. (2) tools/verify-python-payload: compose harness mirroring the k8s init-container shape (carrier --inject -> shared volume -> UNMODIFIED toolchain image, service_completed_successfully) asserting the p0357 payload end-to-end — /shared/agent + /shared/python present, python3->python3.12 symlink intact, exec bits, stdlib imports, and a real in-place codemod (the workload python ships for). Executed locally 2026-07-21: '[dotnet-sdk-8] OK: hello from 3.12.13' + '[node-20] OK' — payload complete, symlinks intact, codemod works. Backend 3393 green (+5). CI wiring of the harness deliberately out (docker-in-docker cost — operator's call). -> .agentsmith/phases/done/p0358-skills-reload-and-python-verify.yaml"
    p0363: "RED PERSISTENCE + TIME LEDGER (backend). Two findings from the gpt-5.1 runs. The master ran its self-verification, saw a red build, emitted an honest FAILED and stopped — with its own ledger showing 'build solutions and fix compile issues' as NOW, $43 budget and 80 minutes left; ShouldReengage treated any honest RED as terminal, which turns early honest reporting into a legal mid-job exit. An honest RED is now terminal only when the ledger has no actionable pending items, bounded by the forward-progress gate. Second: wall-time was not decomposed — the rate limiter measured its own waits and threw them away, so LlmCallFinishedEvent gained ThrottleWaitMs and the run rail renders the time split. Shipped in #450. -> .agentsmith/phases/done/p0363-red-persistence-and-time-ledger.yaml"
    p0362: "COMPACTION HYSTERESIS + CACHE-SIDE SUMMARY (backend). p0357 killed the per-iteration compaction regime below the token threshold; above it the regime survived, because the trigger measured the raw append-only history which never shrinks — so a run that crossed the threshold once compacted on EVERY subsequent call, re-slicing the tail, extending the summary per turn and breaking the provider prompt cache each iteration. The trigger now measures the compacted VIEW (refold only when the view itself re-crosses), and the view is reordered to [head | summary | pin | tail] so the large stable summary sits on the cache side instead of behind the small volatile pin. Post-threshold cached share is the success metric. Dead compactors from p0119a deleted. Shipped in #450. -> .agentsmith/phases/done/p0362-compaction-hysteresis-and-cache-side-summary.yaml"
    p0361: "COST TRUTH + DUPLICATE-WORK TELEMETRY (backend). Two runs displayed $25 and $30 while the provider metered ~$80. Unknown models priced silently at $0 and the per-phase breakdown priced every call at _lastModel; pricing now carries the current aliases, unpriced tokens accrue visibly instead of vanishing, and each call is attributed to its own model so the phase sum equals the headline. Second half: repeated identical tool invocations are counted per skill call, so context-loss regressions after compaction are measurable instead of an operator impression. Shipped in #448 / #455. -> .agentsmith/phases/done/p0361-cost-truth-and-duplicate-work-telemetry.yaml"
    p0360: "CHECKPOINT PUSHES (backend). A run died after ~1h with its sandboxes gone, no branch and no PR — durable output only materialised at CommitAndPR, step 21 of 22. The framework now commits and pushes each dirty repo sandbox to the run branch on every accepted update_progress replace (throttled, and through the same secret scan as the final commit — a checkpoint must never become the side door around it). CommitAndPR treats checkpointed repos as delivered instead of 'nothing to commit'. The ledger flip is the natural work-unit boundary, so p0359's staleness reminder keeps it firing without a separate timer. -> .agentsmith/phases/done/p0360-checkpoint-pushes.yaml"
    p0359: "MODEL-OWNED LEDGER + STALENESS REMINDER (backend + skills). The run-viewer ledger lagged the live trace by many steps — p0356 fixed visibility, the gap left was CADENCE. The reminder now fires on a STREAK of iterations since the last update_progress rather than a blunt every-N modulo the model learns to ignore, so a model that keeps its ledger current is never interrupted and the nag carries information. The no-drop protection is removed: the plan may legitimately deviate mid-run, and a master that cannot remove obsolete steps would make the honesty gate produce false FAILEDs. Anti-laundering stays with the diff cross-check, not with an id lock. Shipped in #444. -> .agentsmith/phases/done/p0359-model-owned-ledger-staleness-reminder.yaml"
    p0357: "CONTEXT INTEGRITY + RUN TRUST (backend + carrier + dashboard + skills). Seven fixes from the 2026-07-21 review: token-pressure-only compaction, the ticket pinned into the compaction head, a 200k window, cancel terminalizing the ticket at once, python3 in every sandbox, writes classified at the producer, the budget on the rail. -> .agentsmith/phases/done/p0357-context-integrity-and-run-trust.yaml"
    p0356: "MASTER CONTEXT WORKING-SET OVERLAY (backend + skills, shipped as PR #440 + skills PR #135). Shape: SUBSTRATE (growing transcript + p0341d compaction, untouched) + OVERLAY (skill-guided) + SELECTOR (coupling-keyed). Backend: SandboxToolchainProbe (one run_command at master start -> 'This sandbox has: git, dotnet ...' capability line in the system prompt, cache-anchor safe), ProgressLedgerFlusher (RunStoryRecordedEvent per accepted update_progress + seed flush -> live checklist in the viewer, Note persisted in ProgressLedgerItemView), PriorRunLedgerSeeder rehydration (same-ticket, progressed-past-bootstrap, 72h age cap -> resume-after-reap real for in-process runs; spawned-orchestrator forwarding = named follow-up in SpawnPipelineRunsUseCase), ContextCostTelemetry (tokens-per-done-item + cached share at master completion). Thin-path (skill text only, no choreography): compiler-as-scout (remove old package ref -> build errors ARE the site list), worklist.json convention + ledger holds batches (MaxItems=40 respected), decide-once-then-fan-out (done->pending flip pinned by test), batched verification. Skills: coding-agent-master 1.14.0 'mechanize instead of iterating'. Backend 3321 green (+13). Baseline #19106-class rerun on HEAD = operational validation, not a spec gate. -> .agentsmith/phases/done/p0356-master-context-working-set.yaml"
    p0355: "RUN RELIABILITY + TRUTHFUL VIEWER (backend + dashboard + deploy, shipped in two pushes on PR #438). Push 1: corpse-pod reaper (run-id label, periodic + at-claim), capacity reconcile with the REAL k8s ResourceQuota (queue, never admit-then-kill), belt-and-suspenders pod teardown, typed cancel reason (reap vs operator), finalizer ownership guard, cost-on-revisit fallback, actual live pod count, paged runs endpoint + load-more, row text clamp, pre-commit customer-fingerprint gate. Push 2: keystone read-only exemption (ReadOnlyStepClassifier at CrossCheckLedger — an audit/verify DONE step untouched in the diff is honesty, not unbacked done), skip-unchanged-repos (RepoDiffPartitioner: GenerateTests/GenerateDocs get ONLY the changed repos' sandboxes, 'no diff in <repo> — skipped' surfaced), live cost accumulation (RunEventApplier adds per LlmCallFinished onto non-terminal rows; finish stays authoritative), viewer live perf (ScopeBuffer coalesces notifications to one render per 100ms burst window; ActivityTab windows to last 200 + 'show earlier'; no new deps), rename-poison guard (PriorRunTrustGate quarantines bootstrap-aborted prior-run records at LoadRuns/CompileKnowledge; gate message names the rename hypothesis), ServerMemoryFloorCheck preflight WARN (512Mi floor, server-only) + deploy template 512Mi/1Gi + docs. Backend 3327 green, dashboard vitest 507 green, tsc at 38-error baseline. -> .agentsmith/phases/done/p0355-run-reliability-and-viewer.yaml"
    p0351: "CONFIG STUDIO STRINGENCY: MODEL ROLES + PRICING (server + dashboard, shipped). Closes the last free-text gap after p0345c (which already made types/providers/pipelines/resolution capabilities-driven + reject-on-unknown). Model roles are now the fixed set from code: ConfigCapabilities.Roles = reserved 'coding' + every TaskType member (reasoning optional), camelCased to match ConfigCatalogMapper's models map; a coverage test asserts every TaskType role is present. ConfigStudioCapabilities.ValidateAgent (wired into DbConfigStore.UpsertAgent like ValidateTracker) rejects unknown role keys AND role models with no pricing entry (ConfigurationException -> 400); the DbConfigStoreTests Agent helper now carries pricing (the rule's consequence). Frontend AgentForm: the free-text 'add role' box is gone; roles render as fixed rows from capabilities.roles (required rows always present, reasoning a seed until added) and flag 'no pricing entry' when a role model is unpriced. Backend ConfigStudio 38/38 (+4 new: Roles + ValidateAgent), dashboard config 45/45 (AgentForm test rewritten off add-role), full solution 0 errors. -> .agentsmith/phases/done/p0351-config-studio-stringency.yaml"
    p0352: "CONFIG IMPORT IN THE STUDIO UI (server + dashboard, shipped). The CLI already had config import (p0349); this adds the UI path. POST /api/config/import (text/yaml body, ?force=) reuses IConfigDocumentStore.Import via ConfigDocumentAssembler.Decompose, then IConfigStore.Load() to refresh the cached catalog: empty store -> 200 imported N, non-empty -> 409 (IsEmpty check), ?force=true -> overwrite (versions bumped, history kept). NOT on IConfigStore (multiple impls + test doubles; import is DB-only). persistence EXCLUDED from import in BOTH the endpoint and the CLI (bootstrap-only: read from BootstrapConfig file/env, never the DB it describes); ConfigDocTypes made public for the cross-assembly type-name reference. Frontend: Import-agentsmith.yml button + hidden file input in ConfigStudio.tsx ThesisNote, 409 -> confirm-overwrite -> retry force -> reload; importConfigYml/ConfigStoreNotEmptyError in configApi.ts. Verified via the p0349 self-host smoke harness (real endpoints over real DbConfigStore + HttpClient), made DB-provider env-switchable: new ConfigStudioApi_Import_EmptyThenGuardThenForce green on SQLite (CI) AND live against a real SQL Server (17 entities, persistence rows=0, 409 then force->200, version->2). ConfigStudio suite 34/34, full solution 0 errors. -> .agentsmith/phases/done/p0352-config-import.yaml"
    p0349: "CONFIG IN A DB ENTITY-DOCUMENT STORE (backend, shipped). Server config becomes the UI-editable, versioned DB source of truth so the hand-edited ConfigMap stops being the operating surface. STORE: config_entity {type,id,doc(json),version} + config_entity_version (the SINGLE attributed+revertible audit) + config_ref edge table (FK RESTRICT to the (type,id) alternate key). A complete ConfigEntityType<->RawAgentSmithConfig-property map (collections keyed by id: agent/tracker/connection/repo/project/mcp_server/secret/pipeline_trigger; singletons id='default': registries/queue/skills/primary_provider/limits/pipeline_storage/pipeline_data_flow/deployment/sandbox/orchestrator/dialogue/persistence/pipeline_cost_cap) drives Load (assemble) + Save (split) — a new setting is ZERO migration (opaque JSON), a new type is one map entry. ARCH: Core owns IConfigDocumentStore + ConfigDocumentAssembler + DbConfigStore:IConfigStore; Persistence owns EfConfigDocumentStore (singleton facade, scope-per-op) + scoped ConfigDocumentRepository/ConfigImportRepository. Studio-on-DB: server RemoveAll<IConfigStore> -> DbConfigStore, so edits PERSIST under a read-only ConfigMap. BOOTSTRAP-SPLIT: server now LOADS AgentSmithConfig from the DB (new DbConfigurationLoader replaces YamlConfigurationLoader server-side), so the DbContext connection reads persistence+secret-names from a file-only BootstrapConfig (chicken-and-egg broken); the shared raw->typed pipeline was extracted to RawConfigMaterializer (file + DB loaders run the identical pipeline). UNCONFIGURED BOOT: an empty store assembles an empty-but-valid config (validator passes, pollers/pumps idle) while the studio is reachable — no flag needed. FileConfigStore returns to READ-ONLY (writeback removed; mutations throw); shared studio->raw patch builders extracted to RawConfigPatch so the DB store applies identical semantics. GUARDED CLI `config export|import` (DB<->YAML, hand-built context like `database migrate`; import empty-store-or-force, all entities before edges) — NOT auto-seed. INVARIANTS: SecretValueGuard rejects a raw secret value in any doc (names only); optimistic concurrency -> StaleConfigVersionException -> HTTP 409; config_ref RESTRICT + app-layer referencing-set on delete. VERIFY-BEFORE-DROP: p0345's relational config schema (ConfigStudioSchema DDL) was NEVER migrated (dead string const + throwing skeleton + in-memory audit) — nothing to drop; removed the dead skeleton/schema/IConfigAuditStore, migration ADDS only. Migrations generated for SQLite + SqlServer. Backend unit tier green (33 new ConfigStudio tests). -> .agentsmith/phases/done/p0349-config-in-db.yaml"
    p0345c: "CONFIG SEMANTICS (backend + dashboard, shipped). The studio's forms KNOW the domain. GET /api/config/capabilities = backend truth (tracker/connection types + per-type fields from exhaustive enum switches that THROW on unmapped values; agentProviders from the REGISTERED IChatClientBuilder set; resolutionStrategies from the enum + proven parseable by EffectiveTriggerBuilder; pipelines = PipelinePresets.Names) with CommandBeats-style coverage tripwires — a new type/provider/preset without capabilities fails tests. GET /api/config/connections/{id}/repos serves the p0281a discovery snapshot (discoveredAt = file mtime; known-undiscovered = honest null+empty 200; unknown 404). Entity v2: ProjectEntity trigger RENAMED pipeline (was a mislabel of raw pipeline:) + resolution{strategy,value} validated against the known set; AgentEntity = FULL surface (endpoint/apiVersion/networkTimeout/models-per-role{model,deployment,maxTokens}/pricing/cache/compaction/retry) patching raw AgentConfig faithfully — unsurfaced sections (parallelism, rate_limit) survive, round-trip through the real loader proven; TrackerEntity v2 (url/org/project/states/pipelineFromLabel/polling) with per-type required from the SAME descriptor as the form. Drift facts on GET /api/config (configPath/fileModifiedAt/lastReadAt via new IConfigurationLoader.LastRead). UI: capabilities-driven type dropdowns + per-type fields, sectioned agent drawer, discovery-fed RepoPicker (+wildcard, honest not-discovered state), resolution strategy selector with per-strategy hints, Repositories = discovered inventory with referenced-by badges + standalone catalog, Config-reads retold as wiring/provenance/freshness + DRIFT banner (raw stream collapsed). Fixed en route: minimal-API interface-param binding 500 (explicit [FromServices]). Backend 3232 green (21 new incl. 2 extended live smokes); dashboard 470/108 + build green. Encrypted secret VALUES stay p0346. -> .agentsmith/phases/done/p0345c-config-semantics.yaml"
    p0350: "PR SURFACING + RATE-LIMIT CLAMP (backend + dashboard). A large multi-repo run hard-crashed on its OWN throttle and lost two live draft PRs. '311950 tokens exceeds the token limit of 250000' was NOT the model context window — it was .NET's TokenBucketRateLimiter, where a single acquire larger than the bucket can never be satisfied and THROWS instead of waiting; the per-minute throttle had silently doubled as an un-queueable per-call ceiling. The acquire is clamped to bucket capacity: an over-budget call waits for a full bucket and proceeds. Second: PR creation and PR recording were not atomic, so the crash left two PRs live and unrecorded — each outcome is published inside the loop now. Third: the snapshot carried a SINGLE PrUrl, so a 2-PR run was structurally collapsed to one link. Shipped in #430. -> .agentsmith/phases/done/p0350-pr-surfacing-and-rate-limit-clamp.yaml"
    p0348: "OPERATIONAL HARDENING (backend + dashboard + deploy). Five operator-reported production defects. A cancelled run never terminated because the deadline was written only on the synchronous endpoint path, so a watchdog cancel was excluded from enforcement forever (elapsed ran to 2148m in the wild); and a SPAWNED run — the k8s/Docker normal case — was never in the in-memory registry the wall-time watchdog scans, so the ceiling never applied at all. Both move to the DB-backed enforcer. Spawning a ticket cost up to 20s because the footprint calculator opened a fresh VssConnection per file read, the exact handshake the ticket side already cached. SQLite failed intermittently at boot: the migrate one-shot left the file in DELETE journal mode and the first server connection ran the WAL conversion with a 0ms busy_timeout. The COMPUTE panel showed the admission RESERVATION as if it were live pods. 'Today' was an unfiltered all-runs list. Shipped in #428. -> .agentsmith/phases/done/p0348-operational-hardening.yaml"
    p0347: "PULL REQUESTS — DEDICATED SURFACE + PROMINENT IN RUN SUMMARY (backend + dashboard, shipped). agent-smith's OUTPUT stops being buried in one Outcome beat. BACKEND: PullRequestOutcomeEvent now projects DURABLY per-repo onto Runs.PullRequestsJson via RunEventApplier (EF migration AddRunPullRequests, the p0344b stored-JSON-IS-wire-JSON pattern; upsert-by-repo so a multi-repo run keeps EVERY PR — the single Run.PrUrl was lossy). GET /api/pull-requests flattens active+recent runs newest-first, joining run/ticket facts: [{runId,ticketId,ticketTitle,pipeline,repo,status: opened|no_changes|failed,url,reason,openedAt}]; pre-migration runs contribute ONE fallback row from the lone opened RunRepo.PrUrl so history isn't blank. Run detail (GET /api/runs/{id}) gains detail-only pullRequests[{repo,status,url,reason,openedAt}]. DASHBOARD: Monitor rail item 'Pull requests' with live open-count; /pull-requests page (parity .mock-runs scope) = 3-cell metric strip (open today/week/total) + OPENED PRs as .rrow headline (repo mono · ticket+#id · pipeline · green pill · relative openedAt · external ↗ · run ›) with an honest MUTED section for no_changes/failed attempts + reason; prominent PR block high in the run-detail .sidebox (one external-link button per opened PR, multi-repo shows all, pre-migration prUrl fallback, muted 'No PR opened' once finished). LIVE merge/abandon state NAMED as follow-up p0347b — v1 shows what the agent recorded at open time, labelled as such (no faked merge state). DESIGN NOTE surfaced: RunRepo already held per-repo PrUrl/Status/Reason but NO timestamp — PullRequestsJson earns its place on openedAt + exact wire shape; a later single-source consolidation (add RunRepo.OpenedAt) is flagged, not decided. Backend 3226 unit + 36 PR/config/applier green; dashboard 464/106 green + build (/pull-requests route emitted). -> .agentsmith/phases/done/p0347-pull-requests-page.yaml"
    p0343d: "SYSTEM/ROLLUP PAGES PARITY (dashboard, shipped). All nine remaining surfaces (/system/{tracker,webhooks,chat,config,catalog,connections,cost,today,expectations}) re-dressed as first-class pages in the parity design system — .mock-shell/.mock-system scope, .m-head title rows, per-page .health KPI strips of their REAL numbers (tracker 24h scanned/triggered/skipped/cycles; cost today/7d/calls; today 6 counters; expectations negotiated/hit-rate/first-PR/edit-distance with exact-sum overall rates), bodies as .rrow/.lrow streams and .ecard inventory (catalog masters/skills expandable, connections probes with Test buttons). Data/hooks/behaviors untouched (re-dress only); honest '—' before first snapshot, chat has NO strip (no counters exist). Multi-project avg-edit-distance shows '—' (no backend denominator). 455/105 green + build. -> .agentsmith/phases/done/p0343d-system-pages-parity.yaml"
    p0343c: "PIXEL IDENTITY (dashboard, shipped). The three surfaces are pixel-identical to the ratified mockups (vendored at src/dashboard/design/mockups/) — the mock CSS/DOM ported VERBATIM as src/styles/mock-parity.css (prefix-scoped .mock-shell + per-surface .mock-runs/.mock-viewer/.mock-config; plain CSS so the text-[Npx] drift ban is untouched), components emit the mock's exact DOM bound to REAL data. Run viewer: ident field strip, storybar with BEAT-SWITCHED STAGE (Ticket=TicketFetched body+accept-box, Plan=plan.md, Building=persisted ledger .li rows + decisions/changes events, Verify=.crit acceptance rows, Outcome=result.md+PR+kv strip), .sidebox metrics + expandable pods, 'Dialogue' ONLY with a real pending question, 'Full pipeline' drawer HOSTS the existing NavRail/DetailPane (widened 1100px — the one documented geometry deviation). Runs home: .need cards with inline quick-replies, .rrow rows with .spine from real beats. Config: mock rail catalog + .ecard + .drawer forms. Mock-only chrome (6-state preview footer) did NOT ship; unmatchable-with-real-data spots named in the stylesheet head (capacity cell, PROJECTS rail group, queued capacity reason, re-drive states). 453/104 green + build; next start smoke confirmed SSR of mock classes. -> .agentsmith/phases/done/p0343c-pixel-identity.yaml"
    p0343b: "MOCK FIDELITY (backend + dashboard, shipped). The real pages now MATCH the ratified mockups — the operator had rejected the delta ('weder finde ich alles noch sieht das vergleichbar aus'). Shell: Runs|Configuration segmented toggle + contextual rail (runs: MONITOR counts via bucketRuns, hot needs-you, hash anchors + SYSTEM/ROLLUPS kept + tracker/webhooks footer from useSubsystemActivity; /config: CATALOG with live entity counts incl. Connections + HISTORY/Changes). Runs home: inflow pill (tracker-freshness dot + last pickup from the NEWEST real run), mock section headers. Config studio: rail-driven layout (tabs deleted), thesis note + WORKING Export agentsmith.yml (new GET /api/config/export.yml, smoke-covered), project cards with wires row (resolved neutral / dangling rose), agent cards list the ACTUAL model roles (models now Record<string,string> matching the backend dict; keySecret neutral-null, rose only for a missing ref). Run detail: numbered beat CARDS (real beats only), sticky side rail (state/progress/compute-from-footprint/cost/elapsed + full-pipeline jump). HONEST omissions (named): no capacity cell (no total-capacity API), no PROJECTS rail group (project not on RunSnapshot), no Dialogue button (no thread-read endpoint). BONUS pre-existing flake fixed: docker gate test toggled AGENTSMITH_HARNESS_REAL_SCANNERS process-wide → parallel fast presets raced into real scanners ('Spectral ruleset not found'); opt-in is now a Build PARAMETER (env stays operator-only), 78/78 harness green. Dashboard 447/103 green + build. -> .agentsmith/phases/done/p0343b-mock-fidelity.yaml"
    p0345b: "CONFIG STUDIO — CONNECTIONS + p0343 DEBTS (backend + dashboard, shipped). The studio now models the OPERATOR'S REAL config shape: ConnectionEntity (id/type/organization/project/authSecret/defaultBranch) end to end — IConfigStore/FileConfigStore (patch-on-raw, per-host org field), /api/config/connections CRUD + audit + revert, UI tab with catalog cards + form + secret picker. ConfigReferentialValidator: conn/RepoName project refs valid iff the connection exists (previously SILENTLY SKIPPED — now unknown connection = 400); plain refs unchanged. Live HTTP smoke against an operator-shaped fixture (connections + conn-scoped refs, NO legacy repos). p0343 debts closed visibly: AppRail monitor sub-sections (Needs-you/Running/Queued/Finished, live counts from the same bucketRuns derivation, hash-anchors, needs-you hot amber) + delete/cancel VISIBLE (RunRow hover-reveal removed; detail header has a labeled status+cancel+delete action row). -> .agentsmith/phases/done/p0345b-config-studio-connections.yaml"
    p0344b: "RUN STORY REAL DATA (backend + dashboard, shipped). The story renders REAL data end to end and the client keyword-heuristic beat mapping is DELETED. Beats computed SERVER-side: CommandBeats (typed command→beat table, reflection-coverage-tested over every CommandNames constant + every preset) + RunBeatsComputer at RunSnapshotMapper (list+detail), from the new RunSteps.CommandName (StepStartedEvent carries the typed cmd.Name); failed step → its beat failed, later pending; unmappable pre-phase rows → beats:null → client renders NO storybar (no guessing). Ledger + acceptance persisted at run end via RunStoryRecordedEvent (EventType 74, event-stream not direct DB — spawned orchestrators have no DB channel) → RunEventApplier projects onto Runs.ProgressLedgerJson/AcceptanceJson (EF migration 20260717120341_AddRunStory, also adds RunSteps.CommandName) → served on GET /api/runs/{id}: progressLedger[{id,activity,status,target}], acceptance{criteria[{text,status: met|unmet|not_applicable|unproven,reason}],outcome,ratifiedBy}. Dashboard: StoryBar from snapshot.beats, LedgerPanel (numbered rows, targets mono), VerifySummary per-criterion dispositions (green only when ratified+met; event-fallback only when acceptance absent), useRunDetailSnapshot joins the detail row over the list row (detail-only fields reach the story). OPERATOR STEP: docker compose up -d --build applies the migration (migrate now builds the CLI from source). -> .agentsmith/phases/done/p0344b-run-story-real-data.yaml"
    p0345: "CONFIG STUDIO — DB-BACKED EDITABLE CONFIG (backend + dashboard, shipped). IConfigStore port (Contracts) + FileConfigStore (real; source-of-truth = full-fidelity raw config holding env-NAMES only; YAML export round-trips through the real YamlConfigurationLoader — proven vs sample + the bundled operator example; the ~40 IConfigurationLoader callers untouched, no shim), ConfigReferentialValidator (unknown project agent/tracker/repo ref rejected before persist), attributed versioned audit (ConfigChange + revert), REST ConfigStudioEndpoints (/api/config/{agents|trackers|repos|projects|mcp-servers|secrets}, /changes, /changes/{id}/revert) gated by AGENTSMITH_UI_API_ENABLED. UI: /config catalog, FK-picker forms (no free-text refs), live project wiring preview + integrity gate, Changes/audit view, Configuration rail item — the route+shape seam verified aligned. FileConfigStore is the shipping store; DbConfigStore = real DDL schema + skeleton (relational RUNTIME wiring -> follow-up p0346). Backend ConfigStudio 12/12 + Configuration 122/122 + Integration/Server 108/108; dashboard 18 config tests. -> .agentsmith/phases/done/p0345-config-studio.yaml"
    p0344: "DASHBOARD RUN STORY VIEW (dashboard, shipped). The run detail gains a horizontal 5-beat StoryBar (ticket/plan/build/verify/outcome) + a Verify summary ABOVE the mature NavRail/DetailPane trace (augmented, not rewritten). Pure unit-tested beat-mapping folds the execution steps into the 5 beats (framework setup steps carry-forward into their beat; monotonic cursor; never 'done' on thin data). Verify reads the p0328 ExpectationRatified contract — green ONLY when actually ratified. DEFERRED (named follow-up): real ProgressLedger panel + per-criterion keystone-proof-vs-diff + dialogue/trace-drawer refactor — all need the ledger/dispositions exposed on the client RunSnapshot. -> .agentsmith/phases/done/p0344-dashboard-run-story-view.yaml"
    p0343: "DASHBOARD MISSION CONTROL (dashboard, shipped). Home (/) is now state-ranked mission control: a client-derived metric strip (needs-you/running/queued/finished-today ✓✕/cost) over four priority sections — Needs-you FIRST with real INLINE answering (fetches the parked run's PendingQuestion, posts to /api/runs/{id}/answer, resumes without leaving the page) + inline cancel/delete on the parked card, then Running/Queued/Finished reusing RunRow. Pure unit-tested bucketing+metrics; built on the SHIPPING agent-smith skin (repo-root DESIGN.md), light-only, no new tokens. DEFERRED (named): the 5-dot beat spine — beats not yet on the client RunSnapshot (surfaces with p0344 follow-up). -> .agentsmith/phases/done/p0343-dashboard-mission-control.yaml"
    p0341d: "CONTINUOUS MASTER CONTEXT — IN-LOOP COMPACTION (backend). Makes the coding master's loop ONE continuous conversation (the interactive-harness frame) instead of a pass that dies at the raw context window. Today the master has ZERO context management: p0114 built the OpenAi/Claude compactors and wired them into the hand-rolled OpenAiAgenticLoop; the p0119a M.E.AI migration deleted that loop and ORPHANED them. Re-attaches compaction as a provider-agnostic CompactingChatClient (DelegatingChatClient) in the shared ChatClientFactory chain, BELOW the p0341c governor, BELOW UseFunctionInvocation — FunctionInvokingChatClient re-sends its growing message list every iteration, so this per-call reducer compacts transparently mid-pass. Once the accumulated list crosses the threshold it forwards a REDUCED view: system prompt + RenderLedgerForPin() (the checklist) + RenderWorkingStateForPin() (decisions + last build/test — the continuity) + the recent tail VERBATIM + a cached INCREMENTAL summary of the evicted middle (only the new middle folds each compaction — no re-summarize per iteration). The pin renders CURRENT from PipelineContext at compaction time, never a pass-start snapshot. Reuses the proven p0114 OpenAiContextCompactor.ShouldCompact predicate + the same threshold/keep-recent/summarize-middle algorithm adapted to the M.E.AI message model, so OpenAI/Claude/Gemini/Ollama all get identical thread-preserving behaviour from ONE middleware (the p0341b per-provider split dissolves). Tail-start advances past leading orphan tool-results (valid call/result transcript for every provider); summarizer failure falls open to the full history; the summarizer is a cheap instrumented Summarization-task client via the same factory path. Once this lands, p0341c re-engagement DEMOTES to crash/timeout recovery (behavioural, no code removed). SUPERSEDES p0341b (its ledger-pin targeted the orphaned compactors, a path that never ran) — recorded here, p0341b spec left untouched per operator instruction. 3180 unit green (+7: under/over threshold pin, live-not-snapshot ledger, incremental summary, fail-open, long-pass thread-preserved). MasterLoopHooks extended with RenderLedgerForPin/RenderWorkingStateForPin/Compaction. -> .agentsmith/phases/done/p0341d-continuous-master-context.yaml"
    p0341c: "LOAD-BEARING LEDGER — OPEN, BUDGET-BOUNDED, VERIFIED MASTER LOOP (backend + coding-agent-master skill). Replaces the 25-iteration guillotine + fixed re-drive count with MONEY + VERIFICATION. The master loop's iteration cap is demoted to a large anti-runaway SAFETY ceiling (AgentConfig.MaxMasterLoopIterations=200, threaded via AgenticLoopRequest.MaxIterations → ChatClientFactory.Create); sub-agents get a real child budget (MaxSubAgentLoopIterations=100) instead of inheriting 25. The EXISTING per-pipeline cost budget (PipelineCostCapConfig, p0151d) becomes the binding fence at TWO granularities: BETWEEN passes (handler consults IsBudgetExhausted before re-engaging) and WITHIN a pass (MasterLoopGovernorChatClient DelegatingChatClient below UseFunctionInvocation throws MasterBudgetExhaustedException on the live estimate) — budget exhausted => partial CodeChanges + ledger published, honest cost-cap FAILED. A coarse complexity TIER (trivial|small|medium|large) rides the SAME RepoScopeClassifier call (one JSON field) and sizes the run's effective cap via ScopeRepos (PipelineCostTracker.ApplyCostCap + PipelineCostCap key); Unknown => static default (fail-safe). Open loop RE-ENGAGES (ShouldReengage: expects-code + actionable ledger steps + not honest-RED + budget OK) WHILE each pass makes MEANINGFUL forward progress (MadeForwardProgress: a newly-done step or a now-passing verdict — never a bare edit; an exception pass = recovery, not zero-progress), NO fixed re-drive count. Each re-engagement resumes WARM: nudge carries the current ledger (checklist) + a working-state block (decisions + last build/test tail = continuity). The governor also injects the ledger + a done-discipline line every N iterations / on drift (edit-less streak) — the system-reminder analogue. A parked operator question (p0315d) short-circuits before any re-engage. RunOutcomeKeystone gains ledger + changedPaths as OPTIONAL deterministic inputs: a self-reported Met over a still-pending step, a done step whose present target is absent from the diff, or a target-less done step with no diff => downgraded STRICTLY on Met (a justified-N/A is never downgraded; empty ledger = byte-for-byte p0340). WriteContextYamlToolHost constrains context_name to the discovered contexts (reject when many, redirect when one, no-op on bootstrap). SKILL (coding-agent-master 1.12.0→1.13.0, separate skills PR): Phase 1 shrunk to validate-and-execute the approved plan (full self-planning only for fix-no-test) with explicit re-decomposition licence + ask-first discipline. 3174 unit green (+~40 new: keystone ledger cross-check, ShouldReengage/MadeForwardProgress, governor budget+reminder+drift, tier parse+cap, ActionablePending, context-name guard). Embedded-pin bump DEFERRED to the skills release. -> .agentsmith/phases/done/p0341c-load-bearing-ledger.yaml"
    p0341: "DURABLE PROGRESS LEDGER — CORE (backend + coding-agent-master skill). A TodoWrite-style checklist that gives the coding master durable memory of which plan steps are done vs remaining, killing the amnesia that let p0340's completion-loop lose its place (duplicate greps, retreat to a cheap metadata write). ProgressLedgerToolHost exposes update_progress on the coding surface ONLY (scan/spec-dialog excluded) with FULL-STATE-REPLACE semantics + the invariants that make that safe as memory: at-most-one in_progress, reconcile-by-id via a protected-id set (seeded ids ∪ ever-done ids — a full replace may not silently DROP a seeded/done step), a size cap (MaxItems 40), and an EXPLICIT per-step target. Seeded 1:1 from the ratified plan (ProgressLedgerSeeder: id = plan step order = STABLE framework id, target = PlanStep.TargetFile) → PipelineContext (source of truth) + rendered into the master body via {ProgressLedgerSection}. The p0255 apply / p0263 verdict re-drives (fresh loops) carry the ledger forward via the nudge prompt. Done-status HONESTY DIAGNOSTIC (ProgressLedgerCoverage, pure): a done step whose EXPLICIT target is absent from the diff is surfaced as a result.md decision line — matched by a DEFINED equal-or-endswith rule (no fuzzy activity parsing), target-less items skipped (never a false warning); it NEVER feeds RunOutcomeKeystone (p0340 byte-for-byte unchanged, guarded by a test) — the ledger is memory, not a gate. Closes the 7 spec-review holes (seed-pin, fuzzy target, unstable ids, silent drop, keystone-leak, size cap, in_progress carryover). SLICED openly: the in-loop COMPACTION PIN (both provider compactors) → p0341b — it lives inside the provider chat-client loops (deep, isolated) and is hardening for the long-gap edge case, not the sole load-bearer (re-drives + KeepRounds tail already cover the common case). 3299 green (11 new). Skill: {ProgressLedgerSection} token + update_progress discipline; version bump + embedded pin (operator step). -> .agentsmith/phases/done/p0341-durable-progress-ledger.yaml"
    p0340: "ACCEPTANCE-DRIVEN COMPLETION (backend + coding-agent-master skill). Root cause of the 2026-07-14 DAP run that self-declared green after ONE csproj change: the master's Definition of done never referenced the ratified acceptance criteria, and the keystone only required '>=1 real file + green self-report' — so a near-noop cleared both. Fixed in TWO coordinated layers. SKILL (coding-agent-master, SHARED by fix-bug + add-feature): Definition-of-done item 1 is now 'every ratified Expected assertion is met (name the edit) or evaluated not_applicable (the MEANING of not doing it, e.g. no MassTransit -> nothing to migrate, no behaviour change); an actionable-but-unmet criterion means NOT done -> keep working, do not summarise'; the verdict block gains an ordered `acceptance` array. FRAMEWORK: MasterVerification carries AcceptanceDispositions (parsed tolerantly; unknown/missing status -> Unmet so a vague verdict gates RED), RunOutcomeKeystone.Evaluate gains ratifiedCriteria and refuses success unless EVERY criterion is met or justified-N/A (criteria present but NO dispositions = FAILED — the exact hole); empty criteria fall back to the change+green gate so fix-bug with no expectation is untouched. Plan-presence: GeneratePlan now enforces ResponseFormat.Json (gpt-5.1 had returned a PROSE numbered list -> PlanParser null -> silent empty Approval/open-questions gate) + tolerant legacy parse + PlanParser.SalvageProse (numbered/bulleted list -> steps). Completion is a LOOP (the master strives to deliver), the keystone the backstop (it cannot fake) — abort/honest-RED is the last resort, never the mechanism. 3288 green (12 new: keystone acceptance gate incl. no-dispositions + N/A-without-reason + graceful-degrade + all-met, verdict disposition parse + unknown-status default, prose salvage, tolerant parse; every PipelineHarness green verdict now carries dispositions). Skill ships via a version bump + embedded-pin update (operator release step). -> .agentsmith/phases/done/p0340-acceptance-driven-completion.yaml"
    p0336c: "COLLAPSE PER-REPO PER-TOOLCHAIN SANDBOXES + ALIGN FOOTPRINT (backend). One sandbox per (repo, RESOLVED toolchain image) at the per-field MAX resource envelope, was one per (repo, image, resources). Same-image contexts of a repo build SEQUENTIALLY under the single agentic loop, so the p0268 per-resource pod split bought no parallelism and only inflated the reserved footprint — collapse to one max-sized pod (a genuine image/SDK difference like net8/net9 still separates). PipelineSandboxCoordinator groups by ToolchainImage only + merges resources via new ResourceEnvelope.Max (Contracts.Sandbox); the dead GroupKey/ResourceSlug/Sanitize helpers removed. RunFootprintCalculator (p0336) aligned to the SAME per-(repo,image) grouping — it emitted one pod PER CONTEXT while the coordinator grouped by toolchain, so admission over-reserved (the DAP run computed 9 pods/33Gi but ~6 ran); now the reserved footprint equals what spawns. Trade-off: the merged pod takes the max envelope (slight over-provision) but net footprint far smaller, zero latency cost (sequential builds). The pre-existing p0268 SameImageDifferentResources_Splits test inverted to assert the collapse. Verified: after the operator's encrypter net9->net8 migration all 5 DAP-Server contexts are net8 -> ONE Server sandbox + BackgroundWorker + orchestrator instead of 5+. 3115 backend green (6 new: ResourceEnvelope max, footprint collapse + max-envelope + distinct-image split, coordinator collapse). -> .agentsmith/phases/done/p0336c-collapse-toolchain-sandboxes.yaml"
    p0336b: "CONTEXT-LEVEL SCOPING (backend, follow-up to p0336 — the optimisation the spec itself defers). The scope classifier now names affected CONTEXTS within each kept repo (reply extended {repos:[...]} -> +{contexts:{repo:[ctx,...]}}, optional; RepoScopeParser + prompt), a pure ContextScopeEvaluator narrows one level below RepoScopeEvaluator (same conservative keep-all fallback: no verdict / low confidence / unknown context / empty-or-full subset / single-context repo -> keep ALL), ScopeReposHandler publishes ContextKeys.ScopedContexts + records the drop as a PlanDecision, and PipelineSandboxCoordinator filters discoveries by the scoped set BEFORE the toolchain GroupBy — so a repo's shed context is a whole sandbox fewer. ABSENCE of a repo entry keeps ALL its contexts (critical: a mid-run ensure_repo_sandbox escalation to an unscoped repo still provisions); a filter that would empty a kept repo to zero sandboxes is ignored. Dropped contexts surface via the scope DECISION (DecisionLoggedEvent -> dashboard), NOT a footprint DB write — the spawned orchestrator has no DB channel (p0327/p0330); the p0336 CapacityFootprintPanel dropped-list stays a forward-compatible hook. ScopedContexts operates below ContextKeys.Repos so none of the ~19 Repos consumers change. 3104 backend green (11 new: evaluator fallbacks, parser contexts, coordinator drop + escalation-keep-all). -> .agentsmith/phases/done/p0336b-context-level-scoping.yaml"
    p0336: "PREDICTABLE CAPACITY — CORE + VISIBILITY (backend + dashboard). A run's COMPLETE pod footprint is computed ONCE at admission from the remote context inventory (RunFootprintCalculator: repos -> toolchain-group sandboxes at their RESOLVED LIMITs + orchestrator — real groups, so DAP's 3 repos = 4 sandboxes, not a project.Repos.Count estimate), persisted job-scoped on a RunCapacity ledger row (FootprintJson + summable cpu/mem totals + Reserved flag), and reserved ATOMICALLY against the app budget BEFORE the claim — a run starts only if its full footprint fits, else queues with a visible FIFO position + reason. Invariant sum(reserved) <= budget; released on terminal status (RunEventApplier.FinishRunAsync, the single choke point; a waiting state keeps its reservation) or on delete (p0337 satellite). CHALLENGED the spec: (1) the p0331 inventory is built mid-pipeline not pre-checkout, so the calculator does the remote reads at admission itself + the pump reads the PERSISTED footprint (no per-tick remote reads); (2) reserve LIMITs not requests, budget EXPLICIT + fail-open when unset (not 'default = k8s quota' which mixes requests/limits) — k8s ResourceQuota stays the atomic backstop at pod-create; the advisory ISandboxCapacityProbe is replaced by the ledger gate at both admission sites. Footprint visible on the run detail (CapacityFootprintPanel: pods + per-pod limit + total vs budget + FIFO position + dropped list) + inline queued-row reason. Reservation is CONSERVATIVE (full pre-scope footprint = safe upper bound); context-level scoping (accurate shrink + dropped-context population) sliced to p0336b. 3093 backend + 344 dashboard green (11 new: footprint calc, budget ledger reserve/sum/release/roundtrip, admission, panel). -> .agentsmith/phases/done/p0336-predictable-capacity.yaml"
    p0337: "DELETE A RUN (backend + dashboard). RunDeletionRepository removes the Run + its 7 non-cascading children + the satellites (ActiveRun lease, QueuedTicket, RunCheckpoint, RunExpectation, DialogueAnswers, RunCapacity) in ONE transaction (new IUnitOfWork.BeginTransactionAsync). Satellites keyed by RUN id (ActiveRun.RunId, QueuedTicket.ReservedRunId), NEVER by (Project,TicketId) — so a re-triggered ticket's newer run keeps its lease when an older run is deleted. RunDeleter force-clears a non-terminal run first via the p0330 path (IJobSpawner.TerminateAsync + lease release + queue removal); a FAILED kill KEEPS the record (PodTerminationFailed -> 502) so a delete never orphans a live pod. Bulk 'clear terminal runs' (terminal-only, never force-kills). DELETE endpoints behind the UI-API gate (separate RunDeletionEndpoints, not the always-on RunControlEndpoints); a RunsChanged nudge drops the run on every dashboard's next refetch. UI: hover-revealed per-row delete + detail-header delete (two-click confirm, no modal primitive) + 'clear finished' bulk. Tracker ticket untouched. Split into focused classes over growing RunRepository/RunControlEndpoints past the 120-line limit. 6 backend + 3 dashboard tests. -> .agentsmith/phases/done/p0337-delete-run.yaml"
    p0338: "HOMEPAGE 'Get started' 404 — EXTERNAL, tracking-only. Verified live 2026-07-14: agent-smith.org's 2 'Get started' hero links (nav + footer) point at docs.agent-smith.org/getting-started/ -> 404; the 3rd (hero) already correct at /get-it-running/install/; all other outbound docs links resolve. Target /get-it-running/first-run/ confirmed live. The fix belongs in the agent-smith.org marketing-site source (a SEPARATE repo, not in this checkout and not available locally) — no code change is possible here; closed as tracking so the exact fix is recorded for whoever owns that repo. -> .agentsmith/phases/done/p0338-homepage-get-started-404.yaml"
    p0335: "DOCS MIRROR p0162-p0333c AND THE p0324-p0329 BATCH (docs). 197 phases audited into a delta table at .agentsmith/notes/p0335-doc-delta.md; the golden path re-verified against the CLI and the sample config rather than remembered; 5 new pages, 13 duplicate reference pages merged into canonical ones. -> .agentsmith/phases/done/p0335-docs-mirror-and-structure.yaml"
    p0329: "EXPECTATION REPLAY GOLDENS — EVAL MECHANICS + RATIFICATION METRICS (backend + dashboard). Measures p0328 against reality in two channels. EVALS (tests/AgentSmith.PipelineHarness/Evals): versioned fixture format (snake_case JSON: ticket + context_hints.code_map + gold expectation in the p0328 ExpectationDraft shape, validated by the production ExpectationDraftValidator) under Fixtures/ExpectationGoldens/; ANONYMIZATION ENFORCED TWICE — ExpectationFixtureIngestion refuses to write and ExpectationFixtureLoader refuses to load any fixture failing the gate (mandatory fixture-local attestation {attested,by} + generic in-code fingerprint patterns: emails, non-placeholder URLs (example.*/localhost allowed), hosting-org paths + extensible per-directory deny-patterns.txt; NO customer strings in code per repo policy). ExpectationEvalHarness replays each golden through the REAL ExpectationDrafter (env chat client + EmbeddedPromptCatalog, composed directly — eval never ships in the product image); ExpectationEvalJudge compares draft vs gold PER ASSERTION: the LLM only maps gold→draft indices, matched/missed/hallucinated DERIVED deterministically (unparseable judge reply = all-missed, honest). Report artifact (md+json, header pins model id + skills pin, deterministic filename per version pair) → tests/AgentSmith.PipelineHarness/Reports/expectation-goldens/, committed so prompt/pin changes show as diffs. TIER: rides the existing LiveLLM convention (Category=LiveLLM ONLY + loud env-key skip) — excluded from CI (Category!=LiveLLM) and from the fast harness filter (verified). LLM-free tier: fixture load/anonymization + scripted draft+judge→report shape green. SCOPE (operator-approved ruling): seed fixtures are REAL historical tickets only the operator can provide — ONE clearly-synthetic example ships so the mechanics are executable; 'baseline numbers recorded' = documented operator step (ingest via ExpectationFixtureIngestion → dotnet test --filter Category=LiveLLM → commit report), no follow-up phase (data entry, not code). METRIC: ExpectationMetricsRepository (RunExpectations⋈Runs by RunId) + internal ExpectationMetricsAggregator → GET /api/runs/expectations/metrics (UI-API block): per project expectation-hit-rate = verbatim/human-ratified (NULL until a human ratified — rendered as dash, never 0%), first-PR-acceptance = (verbatim+edited)/all negotiated (unratified drags honestly), avg edit distance, monthly buckets (in-memory; SQLite can't translate). Dashboard: /system/expectations rail item + ExpectationMetricsView (REST-fed like Connections, honest empty-state before the first negotiated run). 3078 unit + 77 harness fast + 339 dashboard. -> .agentsmith/phases/done/p0329-expectation-replay-goldens.yaml"
    p0328: "EXPECTATION NEGOTIATION — RATIFIED SOLL BLOCK AS THE RUN'S ACCEPTANCE CONTRACT (backend; skills-repo {ExpectationSection} consumption = sibling PR). NegotiateExpectation joins fix-bug + add-feature AFTER AnalyzeCode, BEFORE EnsurePrerequisites/GeneratePlan: the master drafts a schema-capped Soll block from ticket + analysis (ExpectationDraft { Observed, Expected≤5 one-sentence assertions, Constraints≤3, OpenQuestion≤1 with concrete A/B } — caps as type constants, ExpectationDraftValidator rejects overflow BACK to the model with the validation message, 3 bounded retries then the step fails loudly; drafting prompt is a BACKEND prompt resource expectation-drafting-system.md, NOT a skills fetch — p0325 offline guarantee, logged deviation). RATIFICATION: ExpectationQuestionBuilder → QuestionType.Approval DialogQuestion through the p0327 DialogueAskGate (hot wait → checkpoint/park for free; draft published to context BEFORE the ask so the resume is LLM-free — restored draft, no re-draft, pinned) + SIMULTANEOUS tracker comment via keyed IExpectationCommentTemplate (markdown/Jira variants, ExpectationCommentMarkers anchor, fail-soft, posted once behind a context flag). Answers: approve verbatim | edited text parsed back into the schema DETERMINISTICALLY (ExpectationEditParser: canonical ExpectationMarkdown sections or JSON; caps validate human edits too) | reject fails the step; unparseable answers fail with guidance. Outcome (verbatim/edited/rejected/unratified + Levenshtein edit distance — the p0329 raw material) persists via ExpectationRatifiedEvent → RunExpectation row (unique RunId upsert; spawned-orchestrator event-stream constraint). HEADLESS auto-ratifies stamped 'unratified'; ratification TIMEOUT auto-ratifies 'unratified' too (visible degradation — the code gate stays ApprovalHandler whose silence rejects); timeout rides dialogue.approval_timeout_seconds. CONTRACT FLOW: {ExpectationSection} joins MasterPromptTokens (bound on every render path — absent placeholder = no-op, old skills pins unchanged), agent-plan-system.md renders it, PR body gains the assertions-as-checkboxes section (ExpectationPrBodySection), result.md the acceptance-contract section. SLICED OPENLY: tracker-reply-as-ratification needs a parked-ticket comment watcher feeding the p0327 inbox → p0328b (anchor already in the comment). p0164a requirement RULED SATISFIED by p0315c approval blocks + p0327 ask — not implemented. Harness proof: fix-bug drafts → parks → restart → EDITED answer → resume ratifies edited (no LLM) → second park at Approval → approve → ONE run row success; RunExpectations outcome=edited, distance>0. 3064 unit + 74 harness fast. -> .agentsmith/phases/done/p0328-expectation-negotiation.yaml"
    p0326: "AGENT-SMITH DEMO — THE WHOLE LOOP ON A BUNDLED SAMPLE PROJECT (backend + CLI). `agentsmith demo`: preflight subset → materialize → real fix-bug run → local commit + printed diff; the ONLY credential is an LLM key (no tracker, repo remote, Docker or Redis — verified: one-shot CLI composition wires Redis only in spawned-job mode, sandbox is in-process). SAMPLE: tiny C# solution (PriceCalculator strict-> boundary bug + pinned failing xunit test + .agentsmith contexts meta) checked in as PLAIN SOURCES under Infrastructure.Core/Resources/DemoSampleProject/, tar'd at build time (3-line Exec, no network) and embedded like the p0325 skills tarball (Infrastructure.Core so the harness tests the real resource; NB: $(IntermediateOutputPath) is empty at csproj-body evaluation — use $(BaseIntermediateOutputPath)). DemoWorkspaceMaterializer (extractor + LocalGitProcessInitializer, host git via Process — no sandbox exists yet) git-inits with one baseline commit. INLINE TICKET: PipelineRequest.InlineTicket + ContextKeys.InlineTicket; FetchTicketHandler materializes it BEFORE the p0322a null-TicketId skip (provider never touched, TicketFetchedEvent still fires); TicketId stays null so lease/tracker writes are structurally skipped; CommitAndPRHandler skips FinalizeTicket on inline runs. NO-REMOTE RECORD-ONLY: SandboxGitOperations.CommitAndPushStagedAsync now commits-without-push when RepoType.Local has no 'origin' (`git remote` probe) — the graceful path did NOT exist; LocalSourceProvider message reworded ('commit recorded on branch', was falsely 'branch pushed'). CLI: DemoCommand → DemoExecutor (p0324 preflight SUBSET config-schema/llm-reachable/sandbox-spawn/infra, explicitly composed PreflightRunner — no skipped-check wall; fail-with-hints before tokens) → DemoRunner (ephemeral project via the p0281d AgentName seam + SourcePath, headless) → DemoResultPresenter (git diff HEAD~1 + next-steps). first-run.md leads with the demo (step 1), real tracker is step 2. 3052 unit + 74 harness fast. -> .agentsmith/phases/done/p0326-golden-path-demo.yaml"
    p0327: "DURABLE DIALOGUE — CHECKPOINT AT THE ASK, RESUME ON THE ANSWER (backend + dashboard). A run waiting on a DialogQuestion now survives restarts and multi-day silences. HYBRID WAIT: DialogueAskGate keeps the hot in-memory wait below dialogue.hot_wait_seconds (default 600); past it an eligible ticket run checkpoints — RunCheckpointedEvent (event stream: a spawned orchestrator's only DB channel, p0330 lesson) carries the pending question + the executor's LIVE step cursor (full PipelineCommand records incl. spliced follow-ups, published per-batch as ContextKeys.RemainingCommands) + the serialized context (PipelineContextSerializer: {key,type,json} entries, live objects excluded — Sandboxes/SandboxCoordinator/pricing/catalog re-established on resume; narrowed Repos WINS over standard seeding). The run parks as waiting_for_input (modeled exactly on 'queued': FinishedAt null, RunStarted promotes the row back), the worker task ends, sandboxes release (cattle; CheckoutSource+SetupRegistryAuth prepended to the resume cursor). LEASE: released at checkpoint (the finally), re-claimed at resume via the reserved-run-id path — reapers need no exemption because a parked run holds NOTHING (pinned). DURABLE INBOX: DialogueAnswerEntry UNIQUE(jobId,questionId) = first-wins; the server transport (DurableDialogueTransport) writes inbox first, hot stream second; Slack/Teams button fallbacks now ALSO publish the dialogue envelope (found en route: the bus envelope read as an EMPTY answer on dialogue waits). RESUME: leader-elected DialogueResumeSweeper (15s) matches inbox answers + expired deadlines (persisted DefaultAnswer applies headless — approval default is 'reject') against pending checkpoints → RunResumer enqueues an IsResume capacity-queue entry reusing the run row; the pump launches it lease+direct-enqueue, skipping trigger-status re-validation (a mid-run ticket sits in its working status). ApprovalHandler's interactive path routes through the gate (dialogue-durable approvals; headless auto-approve unchanged; Console.ReadLine retired). Dialogue identity = jobId ?? runId (in-process server runs had NO working ask before). DASHBOARD: waiting_for_input first-class (violet 'input' NodeStatus, filter chip, RunRow 'waiting for input', cancellable), PendingQuestionCard renders the question + POSTs /api/runs/{id}/answer. Harness proof: fix-bug parks mid-approval, harness disposed + rebuilt over the same SQLite (restart by construction), answer→sweeper→pump→resumed request completes — ONE run row. 3004 unit + 73 harness fast. -> .agentsmith/phases/done/p0327-durable-dialogue-resume.yaml"
    p0324: "AGENT-SMITH DOCTOR — ACTIVE PREFLIGHT (backend). Every historically silent misconfiguration is a named, actively-probed check with a fix hint: config-schema (parse + validator + empty-resolved ${SECRET}s), llm-reachable (real per-agent completion probe; surfaces configured rate_limit vs the conservative subscription default 5req/20k, names the p0235 network-timeout class), tracker-auth (real tracker read + webhook shared-secret presence per platform; tracker-side registration/scope probing needs new ITicketProvider vocabulary -> p0324b planned), repo-access (ls-remote-equivalent per remote repo), skills-catalog (pin resolves, loader loads — an over-200-char master description fails HERE with the 'Prompt resource not found' explanation instead of mid-run; required NameMap masters present), sandbox-spawn, infra (Redis + DB; persistence probe now also fails on pending migrations — the server never migrates itself). Contract: IPreflightCheck/IPreflightRunner in Contracts, checks in Application behind the EXISTING p0292/p0293 probe seams (unit tests script pass/fail per check, no live infra); composition-specific probes: CLI = real spawn+exec round-trip via ISandboxFactory + REDIS_URL-scoped infra, server = IJobSpawner probe + shared multiplexer/DbContext. CLI: `agentsmith doctor` (--json for CI), exit 0 green / 1 any failure. Server: same runner at startup WARN-ONLY (BackgroundService), results logged with fix hints + surfaced on /health as preflight{status,failures[{name,message,fix_hint}]} ('pending' until run). A skipped check is honest (feature unconfigured + reason), never a fail. -> .agentsmith/phases/done/p0324-doctor-preflight.yaml"
    p0333c: "SKIP GENERATED CODE IN STATIC-PATTERN SCAN (backend). The live 'LLM Output in SQL Query' FP class fired on a generated TypeScript API client emitted into a .cs file. PatternFileMatcher now skips self-declared generated files (Roslyn <auto-generated> marker, first 5 lines) for non-'secrets' patterns — secret patterns still run so a credential baked into generated output still trips (no secret-detection trade-off). Detection trusts the file's own declaration, not path/name heuristics or an LLM. Closes the residual case p0333's read-set suppression misses (generated FP in an unread file). Pattern-tightening itself (also fired on a hand-written MediatR handler) is skills-repo work -> p0334. 3 tests. -> .agentsmith/phases/done/p0333c-skip-generated-code-static-scan.yaml"
    p0333b: "GIT-HISTORY SECRET SEVERITY (backend). History-only secrets were emitted as Medium and fell off MergeMasterFindings' High+ promotion cliff — the exact GitHub-comparable signal (secrets) was silently lost from delivery. Root: GitHistoryScanHandler severity ternary (High:Medium) contradicted SecurityFindingsFormatter's own counts (history-only=critical, still-in-tree=high). Fixed to history-only=Critical, still-in-tree=High; both stay High+ so neither is dropped. A committed secret requires rotation regardless of working-tree presence; history-only is the higher risk. 2 tests. Decision also records Tier-2 (CollectMasterFindings convergence) as SUPERSEDED by p0333, not deferred. -> .agentsmith/phases/done/p0333b-git-history-secret-severity.yaml"
    p0330: "CANCEL IS PERSISTENT STATE + ALWAYS ENFORCED (backend + dashboard). Root: RunCancellationRegistry is a per-process in-memory dictionary — a spawned orchestrator pod could structurally NEVER receive a cancel; the endpoint stale-cleared the card while the pod ran on. Now: CancelAsync persists CancelRequested+CancelReason+CancelDeadlineAt SYNCHRONOUSLY (ExecuteUpdate, first deadline wins); IJobSpawner.TerminateAsync (k8s DeleteNamespacedJob Foreground — the spawned pod runs in-process sandboxes so the whole footprint dies; Docker force-remove); CancelEnforcer (leader-elected, 15s) kills at the DURABLE deadline (survives restart), finalizes via the event path, releases the lease, terminalizes the ticket (CancelledTicketFinalizer, failed_status chain, fail-soft); pre-start gates in PipelineQueueConsumer.RunOneAsync + CapacityQueuePump.TickAsync (IRunCancelStateReader); queued-cancel also terminalizes the ticket (no re-poll); FinishRunAsync is set-once on FinishedAt (late RunFinished cannot overwrite cancelled, late queued cannot resurrect). runId->jobId link did not exist — RunStartedEvent gained optional JobId (event stream is the pod's only DB channel), Runs.JobId+CancelDeadlineAt migration. UI: CancelRequestedBadge independent of status (amber cancelling… while live, muted hint when ended success/failed), queued removed from TERMINAL_STATUSES, cancel button for queued+running. -> .agentsmith/phases/done/p0330-cancel-is-state-and-enforced.yaml"
    p0331: "TICKET-SCOPED PROVISIONING (backend). Understand first, then provision: ScopeReposHandler (after FetchTicket, code-changing presets only) builds a remote per-repo context inventory (ResolveAllAsync, cached at ContextKeys.RemoteContextInventory — EnsureSandboxesAsync consumes it instead of re-reading; meta.purpose surfaced), then ONE TaskType.Planning LLM call (GeneratePlan plumbing, strict-JSON tolerant parse, 0.7 confidence floor) narrows ContextKeys.Repos — the single verified seam that cascades to checkout/sandboxes/commit/PR. Fallback to ALL repos on LLM error/parse fail/unknown repo/empty/low confidence; scope+rationale recorded via the decisions channel (result.md + dashboard for free); CLI --repo wins structurally (single-repo skip). Escalation valve: ensure_repo_sandbox master tool (coding masters only) — live coordinator self-published at ContextKeys.SandboxCoordinator, own single-sandbox RunFootprint probe with HONEST deny string, FilesystemToolHost.AddSandbox with copy-on-write runner map (lock-free reads for p0280 sub-agents), late checkout via SandboxRepoCloner extracted from CheckoutSourceHandler (same branch resolution), Repos-widening reverted on failed spawn. Admission stays pessimistic on project.Repos.Count (p0331b named follow-up). DAP case: 1 sandbox instead of 4. -> .agentsmith/phases/done/p0331-ticket-scoped-provisioning.yaml"
    p0332: "COST-HONEST CAPACITY (backend + dashboard + operator docs). Principle: minimize reservation x duration — quota on limits reserved the worst case (5 default pods = 20Gi used at a fraction of real usage). Probe pin test locks the verified requests-only-quota behavior (Evaluate skips keys absent from Hard — zero code needed); docs/host-it/kubernetes.md documents the quota shape (requests.cpu/requests.memory/pods, worked 8cpu/20Gi example, honest-requests eviction warning, pods = deterministic backpressure) as a COORDINATED OPERATOR STEP; deploy/k8s/8-deployment-server.yaml ships JobSpawner__Resources (100m/500m, 512Mi/2Gi — the orchestrator compiles nothing and is the longest-lived pod). write_context_yaml resources paragraph rewritten to normally-omit/outlier-only (clamp stays). Reserved resource-time per run: SandboxCreatedEvent + MemoryRequest (trailing optional), RunSandbox lifetimes (+migration), RunSnapshot.ReservedGiMinutes, run-detail renders reserved N.N Gi-min next to LLM cost — LABELED as reservation, never as measured usage or money. Bonus fix: JobSpawnerOptions.Resources no longer aliases the ResourceLimits.Default singleton (config binding mutated the global default in place). -> .agentsmith/phases/done/p0332-cost-honest-capacity.yaml"
    p0333: "MERGE RESPECTS MASTER READ-SET (backend). MergeMasterFindings promoted every High+ raw scanner fact the master didn't address at (File,StartLine) — but couldn't tell 'master reviewed and dismissed' from 'master never covered', so low-precision static-pattern FPs got laundered into CRITICALs (verified live 2026-07-13: 9 description-less 'LLM Output in SQL Query' criticals on files the master had read via ReadFile+GrepInFile and left unflagged). Fix: extracted the merge into static MasterFindingsMerger; a Role==static-pattern-scanner fact whose file is in MasterReadPaths is now an implicit rejection and suppressed. git-history secrets + dependency CVEs NEVER suppressed by read-set (reading current source refutes neither a historical leak nor a vulnerable package). Read-path match is normalized segment-boundary suffix (absorbs the sandbox 'default/' workdir prefix vs repo-relative scanner File). Empty read-set suppresses nothing -> p0277 promote-all-uncovered safety net intact. Honest log reports suppressed-as-reviewed count; 6 new deterministic handler tests + full suite (2959) green. -> .agentsmith/phases/done/p0333-merge-respects-master-readset.yaml"
    p0323: "PROMPT-CACHING REVIVAL + CACHED-SHARE OBSERVABILITY (backend + skills-repo #118). The p0007 Anthropic strategy (PromptCaching=AutomaticToolsAndSystem) died SILENTLY in the p0119a M.E.AI migration — no live call set it, CacheConfig/CacheTypeResolver were orphaned, PromptPrefixBuilder's claimed breakpoint never applied. Revived via ChatOptions.RawRepresentationFactory returning native MessageParameters with PromptCaching (SDK's SetCacheControls stamps cache_control ephemeral on last system block + last tool — exact p0007 semantics), driven by CacheTypeResolver(agent.Cache) so cache.is_enabled=false sends nothing; ClaudeContextCompactor same. SECOND silent kill found en route: the tghamm adapter emits cache counts under PascalCase AdditionalCounts keys while all readers (EventPublishingChatClient, PipelineCostTracker, ClaudeCostTracker) read snake_case since p0176b — cached was 0 everywhere even where it worked; readers accept both, cost math corrected (Anthropic input_tokens EXCLUDES cache reads — no subtraction; only OpenAI cached_tokens is a subset). OBSERVABILITY: LlmCallFinishedEvent + RunLlmCall (+migration) carry CachedTokensIn/CacheCreationTokensIn, dashboard LLM rows render '· N% cached' — an always-0 share is now a visible alarm, not an invisible regression. Prefix order restored principles-first (agent-plan-system.md here; coding/api-security/security masters via skills #118, which also adds the mandatory stack.image to the bootstrap example — image-less stacks error since #383). -> .agentsmith/phases/done/p0323-prompt-caching-revival.yaml"
    p0322a: "REAL x/y RUN PROGRESS + INIT TICKET TITLE (backend). The REST /api/runs snapshot derived StepIndex AND TotalSteps from the same RunStep rows (one row per started step -> max(index) == count, forever x/x). Run.TotalSteps int? (+migration) now persists the producer's live StepStartedEvent.TotalSteps as a max (it GROWS mid-run with BootstrapDispatch's spliced rounds — RunStartedEvent.PlannedSteps would undercount); mapper falls back to Steps.Count for pre-migration rows. TITLE: TicketTitle is written only by TicketFetchedEvent and init-project was the one ticket-triggered preset without FetchTicket — added (after PipelineNameInitializer), with FetchTicketContext.TicketId made nullable so ticketless CLI init skips cleanly (builder threw KeyNotFoundException before the handler could guard). -> .agentsmith/phases/done/p0322a-run-progress-and-init-title.yaml"
    p0322b: "AUTHORITATIVE SANDBOX-REPO ATTRIBUTION + SPEAKING CONTEXT-NAME KEYS (backend). Live 3-repo re-init: a multi-context repo got ZERO bootstrap rounds — BootstrapDiscoverHandler.BelongsToRepo matched only 'repo' and 'repo/', not the p0268 multi-group form 'repo-lang-size' (same bug class SandboxTargets fixed in p0249). Shared SandboxTargets.KeyBelongsToRepo now consults ContextKeys.SandboxRepos (the coordinator's authoritative map) first; string decoding only as map-absent fallback. NAMING: the group key differs by toolchain image but the composed key omitted it and showed lang+size (identical across groups) -> collision -> '-2' backstop. ComposeForGroup now takes the representative discovery's ContextName: multi-group keys read '{repo}-{contextName}' / '{contextName}' (sanitized), single-group unchanged; EnsureUniqueKey stays as backstop. -> .agentsmith/phases/done/p0322b-sandbox-repo-attribution-and-names.yaml"
    p0322c: "NO PR FOR RUN-RECORD-ONLY INIT DIFFS + HONEST COMMIT FAILURES (backend). The 2026-07-10 ghost PR: WriteRunResult seeds EVERY repo's sandbox with the run-record, defeating the empty-commit guard, so a repo with zero bootstrap output still committed+pushed+PR'd (real sequential AzDO id, content = only .agentsmith/runs/). InitCommitHandler now stages, lists staged names (existing GetStagedFileNamesAsync), and returns SkippedNoChanges without commit/push/PR when every path is under .agentsmith/runs/ (RunRecordPaths.IsUnderRunsDir — the broader IsRunRecordPath matches all of .agentsmith/ and would block real init PRs). Change pipelines untouched (run-record force-staged into code PRs by design, keystone requires real changes). With p0321 this makes the no-change re-init outcome REACHABLE: done_status, zero commits, zero PRs. HONESTY: SandboxGitOperations.CommitAsync returned false on ANY non-zero exit and a hardcoded 'nothing to commit' rethrow masked every real commit failure as clean-tree; now the canonical phrase must appear in git's actual output (stdout OutputContent or stderr), anything else throws with the real git output — CommitAndPRHandler gets honest failures for free. -> .agentsmith/phases/done/p0322c-runrecord-pr-gate-and-honest-commit-errors.yaml"
    p0320a: "PIPELINE-AWARE SANDBOX SIZING + RESOURCE CLAMP (backend). Root of the 2026-07-09 init storm: #376 made init-project actually write context.yaml, so p0268 started applying the LLM build sizing (cpu_limit 2 / 4Gi) to sandboxes that only clone+write files. ISandboxResourceResolver.Resolve is now pipeline-aware: only ExpectsCodeChanges presets (fix-bug, fix-no-test, add-feature, phase-execution) consume stack.resources; everything else (init, scans, legal, mad — and null/unknown pipeline) gets ResourceLimits.LightProfile (100m/500m, 256Mi/1Gi); operator project override still wins layer-1 for all pipelines. LLM-authored quantities are CLAMPED (not rejected) to SandboxOptions.MaxCpuLimit '2' / MaxMemoryLimit '6Gi' with a WARN; write_context_yaml guidance rewritten balanced-vs-cost (request≈typical, limit≈modest headroom, ceiling named; heavy cpu_limit example dropped 2 -> 1). -> .agentsmith/phases/done/p0320a-pipeline-aware-sandbox-sizing.yaml"
    p0320b: "FULL-FOOTPRINT CAPACITY ADMISSION (backend). The p0269a pre-flight probed ONE sandbox; a 3-repo run needs orchestrator + 3 sandboxes (defaults alone: 4x4Gi = the whole 16Gi quota). New RunFootprint { Orchestrator?, Sandboxes[] } replaces the single-ResourceLimits probe argument: k8s probe sums per quota key across all pods (pods/count-pods = total), Docker requires running + Sandboxes.Count <= cap, SpawnPipelineRunsUseCase probes orchestrator (IOrchestratorResourceResolver, nullable for in-process) + repos.Count x pipeline-aware default. TOCTOU (context.yaml discovered mid-run exceeding the admission assumption) remains the backstop, made graceful in p0320c. -> .agentsmith/phases/done/p0320b-admission-footprint-math.yaml"
    p0320c: "PERSISTENT FIFO CAPACITY QUEUE, SINGLE-ROW QUEUED RUNS (backend). Replaces the invisible retry storm (claim -> quota 403 -> run row 'queued' -> lease released -> poller re-claims -> NEW row per attempt). QueuedTicket table (identity Id = FIFO order, UNIQUE(Project,TicketId), ReservedRunId, InitialContextJson) + EF migration; SpawnPipelineRunsUseCase is the single funnel: probe-denied OR not-head-behind-nonempty-queue -> upsert entry + ONE direct-inserted 'queued' Run row (no lease, no claim), strict FIFO no overtaking; head+admitted -> claim reusing the reserved run id (ClaimRequest.ExistingRunId -> PipelineRequest.RunId -> RunEventApplier upsert: the queued row BECOMES the running row). TOCTOU backstop: RunFinished status='queued' keeps FinishedAt null and upserts the queue entry (InitialContextJson null = poller-launched only). CapacityQueuePump (Server, 15s, leader-elected): re-validates native status via tracker (operator moved it -> drop + cancel row), probes RunFootprint, claims head. Cancel on a queued run deletes the entry + terminal RunFinished(cancelled). Holds NO lease and no lifecycle transition — zero interaction with EnqueuedReconciler/ActiveRunReaper. -> .agentsmith/phases/done/p0320c-capacity-queue-fifo.yaml"
    p0320d: "QUEUED RUNS FIRST-CLASS IN THE DASHBOARD (dashboard + server endpoints). RunSnapshot.QueuePosition (computed at query time from QueuedTicket rank via ReservedRunId — never persisted; the head moves). NodeStatus gained first-class 'queued' (amber Clock, static): RunRow renders 'queued · #N' + waiting reason instead of the misleading stepIndex/totalSteps '2/2', queued filter chip added, DetailPane/RailRow/ExecutionNode/TimingGutter extended. Queued rows live in the ACTIVE run set (FinishedAt null). -> .agentsmith/phases/done/p0320d-queued-run-visualization.yaml"
    p0321: "INIT-PROJECT TERMINALIZES ITS TICKET WITHOUT REQUIRING A PR (backend). The loop: InitCommitHandler gated the done_status writeback on an opened PR; a re-init on a bootstrapped repo commits nothing (SkippedNoChanges) -> no PR -> no writeback -> poller re-claims forever. Finalize now fires on ticketId + CommandResult.IsSuccess (all-failed init still takes the error path), summary distinguishes PR-opened vs 'no changes — already bootstrapped'. Intentional re-init (framework bump) = operator moves the ticket back to a trigger status; every outcome now moves the status. -> .agentsmith/phases/done/p0321-init-rerun-and-writeback.yaml"
    p0315: "CONVERSATIONAL DESIGN & DELIVERY PARTNER (parent) — series COMPLETE: all six slices shipped (a session, b design-partner-master, e outcome resolution, f real ticket creation, c /create-phase filing, d /execute-phase execution). Chat thread -> grounded answer / bug / phase / epic -> confirmed -> filed as tracker ticket(s) -> executed by the normal pipeline, spec-first, no IDE. -> .agentsmith/phases/done/p0315-conversational-spec-dialog.yaml"
    p0315d: "/EXECUTE-PHASE RUNS A PHASE TICKET SPEC-FIRST (backend, slice 5/5 of p0315). The `phase` label routes to a new phase-execution preset; PhaseSpecFromTicket inverts p0315c's renderer; the spec IS the plan, so its steps publish as the approved plan and there is no GeneratePlan; ask_human parks the ticket for a fresh run. -> .agentsmith/phases/done/p0315d-phase-execution-pipeline.yaml"
    p0315c: "/CREATE-PHASE FILES A CONFIRMED OUTCOME AS TRACKER TICKETS (backend + server + skills, slice 4/5 of p0315). Confirmation is a union: approve files, reject files nothing, anything else is an edit note that re-runs the design turn. PhaseTicketRenderer emits the shape p0315d inverts; the sink files bug, phase or epic, parent first. -> .agentsmith/phases/done/p0315c-create-phase-ticket.yaml"
    p0315f: "REAL TICKET CREATION IN ALL FOUR TRACKER PROVIDERS (backend). Sliced out of p0315c when its 'existing create path' premise proved false: ITicketProvider.CreateAsync had been a NotSupportedException interface default since p57c and NO provider ever implemented it — WriteTicketsHandler and CreateTicketIntentHandler were dead paths on every tracker. CreateAsync is now an ABSTRACT contract member (title, description, labels) returning CreatedTicket(TicketId, WebUrl?, Reference = url-or-#id honest degrade) — capability honesty in the type system, not a throwing default nobody reads; a create-less provider (future Email, p0141) must state its NotSupportedException in code. Implementations: GitHub Octokit Issue.Create (BuildNewIssue, html_url); GitLab POST /projects/{path}/issues (labels csv, iid + web_url); Jira POST endpoints.create (NEW operator-overridable JiraEndpoints template, default /rest/api/3/issue) with ProjectKey required (fail-loud ConfigurationException), issuetype 'Task', labels, and the description as LINE-PRESERVING ADF (new JiraAdfRenderer.FromMultilineText — one paragraph per line, the exact inverse of JiraAdfParser.ExtractText, so a fenced yaml block in a created body reads back intact for p0315d); AzDO CreateWorkItemAsync JSON-patch (BuildCreatePatch: Title, Description markdown→HTML like System.History, System.Tags '; '-joined) as type 'Task' (the only type in every process template), TICKET WRITE audit like every AzDO mutation, web URL {org}/{project}/_workitems/edit/{id}. Callers migrated to the single overload + real references (WrittenTickets now carries URLs, chat confirmation links the ticket). Tests: GitLab/Jira at the HTTP boundary (RecordingHandler), GitHub/AzDO pin the pure payload/URL builders (no SDK seam — no shim invented), Jira ADF round-trip pinned, WriteTickets_UsesCreatedTicketReference, both test fakes implement the new member. -> .agentsmith/phases/done/p0315f-provider-ticket-create.yaml"
    p0315e: "TYPED OUTCOME RESOLUTION + EPIC DECOMPOSITION (backend + server + skills, slice 3/5 of p0315). A spec-dialog turn ends in a typed OutcomeProposal (answer | bug | phase | epic), confirmed in-thread before anything routes; every draft validates against phase-spec.schema.json and its requires: edges are checked. -> .agentsmith/phases/done/p0315e-outcome-resolution-decomposition.yaml"
    p0315b: "DESIGN-PARTNER-MASTER + TIERED CODE GROUNDING (backend + server + skills, slice 2/5 of p0315). A follow-up in an open /spec thread runs the spec-dialog preset in-process. Grounding is tiered: the cached ProjectMap first, then a per-turn lazy read-only sandbox. A drafted spec is schema-gated, never surfaced raw. -> .agentsmith/phases/done/p0315b-design-partner-master.yaml"
    p0315a: "SPEC-DIALOG SESSION (server, slice 1/5 of p0315). A persistent, per-THREAD design conversation with an active scope: '/spec' in a Slack thread (thread_ts, extracted by SlackPayloadExtractor) or Teams conversation (conversation.id) opens a session scoped to a project + repo set from the config catalog (SpecDialogScopeResolver: explicit '/spec <project>' pick, single-project default, else choice prompt); follow-ups in an open thread append user turns to a running transcript; '/spec list' shows open sessions, '/spec resume <id>' re-binds a session into the current thread, '/spec new' forks (close + fresh session, same scope). DURABILITY IS THE LOAD-BEARING DECISION: the spec said reuse the Redis ConversationStateManager, but volatile Redis (45-min TTL + flush-on-restart incident class) must never be the only holder of a design transcript — sessions live as SpecDialogSession rows in the p0246 relational system-of-record (migration AddSpecDialogSessions, unique SessionId resume handle, (Platform,ThreadId) index, transcript/repos as JSON columns) via SpecDialogSessionRepository over the scoped IUnitOfWork; no Redis write-through. ConversationState gains the spec-mandated shape (Mode=RunJob|SpecDialog, ThreadId, Transcript of user/assistant turns, ActiveScope) shared by both flows. Routing: SpecDialogRouter is the FIRST branch in SlackMessageDispatcher.DispatchAsync (new optional threadId+platform params; Slack/Teams endpoints pass them) — /spec commands and open-thread follow-ups never reach the IntentEngine, everything else falls through byte-identical (run path keeps its historical 'slack' platform label, surfaced as a follow-up design question). IPlatformAdapter.SendInfoAsync gains a threadId param (Slack: thread_ts; Teams: conversation id already thread-scoped) so replies stream threaded. Turn replies are session-aware receipts — the grounded design answer is p0315b. ServerDiLifetimeTests/NonDiCtorRuleTests now mirror AddRelationalPersistence (production has wired it always since p0246g). Tests 2762/2762 (+4 routing over real migrated SQLite incl. two-thread isolation + resume, +3 durable-store, +12 parser). -> .agentsmith/phases/done/p0315a-spec-dialog-session.yaml"
    p0167a: "PR-REVIEW PRESET 1/3 (backend). New pr-review pipeline preset: agent-smith PERFORMS the review (distinct from p0025's react-to-review-comments loop). PRESET (spec-drift mapped: FetchPullRequest folded into AnalyzePrDiff, retired BootstrapProject -> BootstrapCheck+BootstrapGate, AnalyzeProject == AnalyzeCode, LoadSkills added before Triage): LoadCatalog, PipelineNameInitializer, CheckoutSource (PR head via CheckoutBranch), BootstrapCheck/Gate, LoadCodingPrinciples, LoadContext, AnalyzeCode, AnalyzePrDiff, LoadSkills, Triage, RunReviewPhase (deliberately multi-phase — NOT the p0179 master collapse; p0167b's review skills are phase-scoped SkillRound emitters), CompilePrReviewFindings, WriteRunResult, PostPrComments (last two are p0167c handlers; preset parked on the contract test's KnownBrokenPresets, meta-test forces removal in c). Registered Structured / non-code-changing / skills-path skills/pr-review. WEBHOOKS: GitHubPrEvent/GitLabMrEvent/AzureDevOpsPrEvent handlers route pr-opened + pr-synchronize (GitLab: update REQUIRES oldrev so label/title edits don't trigger; AzDO: created/updated filtered to status=active — operator scopes the service hook to source-branch updates) via shared PrReviewRouteResolver: repo URL must match a configured project repo (normalized host+path; unmatched -> NotHandled+reason), a pipeline_from_label PR-label match overrides the pr-review default (the operator opt-out), dispatch via the legacy TriggerInput path with project name embedded + PR coordinates in InitialContext (PrNumber/PrHead/PrBase/PrAuthor/CheckoutBranch/SourceOverrideRepo — the last scopes Repos to the PR's repo). ANALYZE: AnalyzePrDiffHandler (new IPrDiffProviderFactory activates the dormant GitHub/GitLab/AzDO IPrDiffProviders) + UnifiedDiffParser (pure format parser: hunks with old/new line numbers from @@ headers, binary files metadata-only) publish ContextKeys.PrDiff (Domain PrDiffAnalysis/PrDiffFile/PrHunk/PrDiffLine) + authoritative PrHead/PrBase. Tests 2772/2772 (+25: preset shape/registration, 3x webhook handlers incl. label-override + unconfigured-repo, diff parse added/removed/context + multi-hunk + binary + sha overwrite). Residual manual: live open-a-test-PR webhook smoke (needs deployed webhook; routing proven by unit tests). -> .agentsmith/phases/done/p0167a-pr-review-preset.yaml"
    p0167b: "PR-REVIEW SKILLS 2/3 (cross-repo + backend). The four review skills the pr-review preset dispatches in its Review phase, plus the plumbing the spec implied but never named. SKILLS (agent-smith-skills feat/p0167b-pr-review-skills e3d2960, releases as 3.19.0 via release-please — spec's '2.8.0 tagged' is stale, operator merges+tags): skills/pr-review/{style,correctness,test-coverage,security-overlap}-reviewer, all role=judge output_schema=observation activates_when pipeline_name=\"pr-review\" (judge IS the review-phase slot — DeterministicTriageSelector fills Review.Reviewers from judges; no orchestration block so DiscussionRoundExecutor parses observations — structured executor never would). style: coding-principles (Domain Rules) only, never blocking; correctness: highest tier, blocking needs confidence>=70 + concrete failure scenario; test-coverage: diff vs ProjectMap-derived Existing Tests block, public-API-untested=high/private-helper=low; security-overlap: prompt-level role-mapper over the skills/security catalog dimensions scoped to changed lines (wrap-not-duplicate; NO C# cross-catalog dispatch — ISkillCallRuntime is the generic runtime every round already uses). concept-vocabulary pipeline_name enum += pr-review (SetEnum fence would throw on every run otherwise; also harness fixture + FallbackMinimal). BACKEND: (1) ObservationLineRange (Start,End) on SkillObservation, parsed from line_range 'start..end' (object/number drift tolerated in RawObservation), StartLine/EndLine backfilled only when unset, p0151b SourceAnchorValidator clears LineRange with File; observation-schema.md (embedded + skills repo) documents it. (2) PrReviewSkillRound command + PrReviewSkillPromptStrategy/PrDiffPromptRenderer inject PR coordinates + ContextKeys.PrDiff hunks with NEW-file line numbers (spec-implied: p0167a assigned PrDiff consumption to 'the pr-review skill rounds (p0167b)' but no prompt path carried it); GetSkillRoundCommandName('pr-review'), handler/context/builder/DI mirror the Security idiom. (3) confidence_threshold per-pipeline (pipelines: entry, 0-100 validated at load, default const 70 on ResolvedPipelineConfig) -> SkillResponseParser.ParseAndDowngrade(threshold) read from ResolvedPipeline by DiscussionRoundExecutor + VerifyRoundCoordinator; example yml + schema. TESTS 2800/2800 (+28): line_range round-trips/drift/downgrade, threshold default/lower/raise + resolver carry, roster parse via real YamlSkillLoader against the skills checkout (TestSkillsRoot pattern, skips when catalog lacks pr-review — green in-session via AGENTSMITH_TEST_SKILLS_DIR), activation filter excludes foreign-pipeline skills + judges land as Review reviewers. pr-review stays on KnownBrokenPresets until p0167c. Residual: operator merges/tags skills PR; live build-smoke (deliberate violation -> style observation with line_range) needs p0167c's comment posting — proven at parse/activation level. -> .agentsmith/phases/done/p0167b-pr-review-skills.yaml"
    p0167c: "PR-REVIEW OUTPUT 3/3 (backend). pr-review now DELIVERS: skill observations -> idempotent PR comments; pr-review REMOVED from KnownBrokenPresets (meta-test enforced the removal). COMPILE (CompilePrReviewFindingsHandler + PrReviewFindingSelector/PrReviewCommentRenderer, real-composition tested): excludes runtime execution markers via ExecutionLimitCategories (NOT a hard-coded four-skill-name list — a fifth review skill needs no C# change), validates every anchor against ContextKeys.PrDiff new-side lines (GitHub review-create 422s the WHOLE batch on one off-diff line, so bad anchors fold instead of killing the batch), groups by file+line_range (same-anchor findings merge into one comment, most severe first), caps 25 inline; excess + unanchored fold into the summary as 'Remaining N finding(s)'. Summary links result.md as run id + .agentsmith/runs/{runId}/result.md (spec's agentsmith:// MCP URI doesn't exist and there is no outbound dashboard base-URL config; renderer is the single change site when p0166c/p0169 land). Zero observations still compile a clean-review summary. Output: Domain PrReviewSummary(TopLevelComment, InlineComments<PrReviewInlineComment>) behind new ContextKeys.PrReviewSummary. POST (PostPrCommentsHandler): stamps '<!-- agentsmith:pr-review:{file}:{line} -->' / ':summary' markers at dispatch (idempotency convention lives in ONE class), then delete-marked-then-post via extended IPrCommentProvider (PostReviewBatchAsync + DeleteCommentsByMarkerAsync; PostCommentAsync unchanged for the dialogue trail). PROVIDERS (drift note: spec's GitHubPrCommentProvider.cs files are the existing GitHub/GitLab/AzureRepos SOURCE providers): GitHub = ONE raw Connection.Post review-create with line/side anchors (Octokit 14 typed API only speaks diff positions) + summary as deletable issue comment (submitted review bodies can't be deleted); GitLab = positioned MR discussion per inline (diff_refs fetched once; API-rejected position degrades to a plain note with marker intact) + paginated notes delete; AzDO = right-file-anchored CommentThread per inline + context-free summary thread + thread-comment delete. Tests 2806/2806 AgentSmith.Tests (+14: grouping/severity sort, 40 obs -> 25 inline + 'Remaining 15', off-diff/unanchored fold, execution-marker filter, clean summary, marker stamp, delete-then-post order, zero-findings summary-only, unsupported-repo fail, GitHub one-call batch payload + no-inline path, GitLab positioned batch + marker delete, AzDO thread anchors) + harness 51/51. Residual: live end-to-end smoke (open test PR, watch comments land) needs deployed webhook + skills 3.19.0 tag — preset shape, handler behavior and provider payloads proven by tests; GitHub/AzDO delete loops covered via GitLab-shape + handler-order tests (Octokit response models have no public ctors). -> .agentsmith/phases/done/p0167c-pr-review-output.yaml"
    p0317: "TICKET CONVERSATION + ATTACHMENTS REACH THE MASTER (backend + skills, requires p0316). The whole ticket now feeds the run: (1) COMMENTS — ITicketProvider.GetCommentsAsync (default empty) + TicketComment(Author, CreatedAt, Body); Jira reads the same /comment endpoint it posts to (ADF flattened via JiraAdfParser), GitLab the notes endpoint (system notes filtered), GitHub Octokit Issue.Comment, AzDO the Comments REST resource (same store as the System.History PATCHes); FetchTicketHandler fetches FAIL-SOFT into ContextKeys.TicketComments; TicketConversationPromptSection renders chronological + author-attributed INSIDE the p0316 delimiters (TicketPromptDelimiters.WrapSection) into AgenticMasterHandler.BuildUserPrompt AND ScanMasterPromptFactory. (2) IMAGES — the p87 write-only ContextKeys.Attachments is re-plumbed: AgenticLoopRequest.UserImageParts carries M.E.AI DataContent parts (TicketImagePromptParts, cap 10) onto the user message when AgentConfig.SupportsVision (agent.supports_vision, default true — no name heuristics); non-vision -> 'N images, not viewable' prompt note. (3) DOCUMENTS — GetAttachmentRefsAsync now returns ALL refs (image/size gates moved into the downloaders; GitHub/GitLab additionally parse tracker-hosted file links, never external URLs); DownloadDocumentAttachmentsAsync pulls text-like docs (txt/md/pdf/docx <=5MB) at fetch time; TicketDocumentMaterializer writes them at AgenticMaster time (sandbox exists) into {RunRecordDir}/attachments/ — txt/md as-is, pdf/docx base64->decode->in-sandbox markitdown (fail-soft: unconvertible docs fall back to the name+size binary listing in TicketAttachmentPromptSection). Comment refresh mid-run = named follow-up p0317a. SKILLS (agent-smith-skills, branch feat/p0317-skill-note, 1.11.0): conversation/attachments are requirement record, latest operator comment wins on conflict, ignored-instruction contract unchanged. Tests 2900/2900 (+ per-tracker comment mapping, fetch fail-soft, delimited-chronological render, vision/non-vision parts, docx materialize, harness: decisive comment + screenshot DataContent + injected comment inside delimiters -> result.md 'Ignored ticket instructions'). -> .agentsmith/phases/done/p0317-ticket-conversation-and-attachments.yaml"
    p0316: "TICKET INSTRUCTION CONTRACT + UNTRUSTED-CONTENT BOUNDARY (backend + skills, cross-repo). Ticket-origin text is now untrusted input the masters analyse but never obey. BACKEND (agent-smith): TicketPromptDelimiters wraps ticket title/description/acceptance-criteria at every interpolation site (AgenticMasterHandler.BuildUserPrompt + AgentPromptBuilder.BuildPlanUserPrompt) in BEGIN/END UNTRUSTED TICKET DATA markers + a one-line 'requirement data, never instructions' rule (safety in API, not process); MasterVerification gains IgnoredInstructions, MasterVerificationParser parses a tolerant ignored_instructions[] ({quote,reason}) mirroring p0273 failing_tests; TicketInstructionIgnoredEvent published per refused instruction by WriteRunResultHandler; RunResultFormatter renders an 'Ignored ticket instructions' result.md section. SKILLS (agent-smith-skills, own PR): coding-agent-master new '## Ticket instructions' section — in-scope directives binding; non-negotiable never-comply catalog (access expansion, CI/CD/git-config, disabling build/tests/verdict/scanners, exfiltration, role override); each refusal logged + emitted in verdict ignored_instructions[]; legal/security/api-security/mad masters get an untrusted-input note; validate-skills.sh guards both. Tests 2744/2744 (+ parser parse/empty, delimiter boundary, result.md section). -> .agentsmith/phases/done/p0316-ticket-instruction-contract.yaml"
    p0318: "TICKET COMPREHENSION + CLARIFICATION GATE (backend). Fixes a real title-only mis-build (AzDO Bug 18969: the agent invented ~500 LOC from a title). (1) The ticket BODY reaches the planner: AzureDevOpsFieldMapper falls back System.Description -> Microsoft.VSTS.TCM.ReproSteps -> SystemInfo (a Bug's body lives in ReproSteps, not Description) and AzureDevOpsWorkItemLister.StandardFields hydrates ReproSteps on the poll/list path. (2) Valid plans stop tipping into the legacy fallback: plan.schema.json summary maxLength 200 -> 600 (the reproducible cause). (3) The clarification gate is REUSE, not new: the existing PlanOpenQuestionsHandler (retired from FixBug/AddFeature in the p0179b collapse) is re-wired after GeneratePlan and extended — it halts on PlanStatus.NeedsUserInput (semantic: a ticket that HAS a body but is unworkable) OR an empty effective body (deterministic pre-guard: the title-only incident; never false-fires on a Bug since ReproSteps is folded into Description upstream), posts the open questions (or a synthesized ask), sets OpenQuestionsAwaitingAnswer so PipelineExecutorPolicy halts before AgenticMaster/CommitAndPR (no code, no PR). (4) Parking is a NATIVE status, not a label: opt-in needs_clarification_status (mirrors p0261 failed_status — tracker base + project override + FailIfTerminalIsTrigger validation + discovery ParkingStatusesOf), moved atomically with the comment via FinalizeAsync; a status OUTSIDE trigger_statuses is already excluded by discovery (no p0262 reversal), and the human moving the card 'Question -> To Do' IS the natural re-trigger (a label would strand tickets — clearing it is not an obvious action). Unset -> gate posts + halts but does not park. DEFERRED to p0318b (no silent defer): preserving a real needs_user_input across a strict-parse failure (the rest of step-2b, which conflicts with p0276's best-effort GeneratePlan) + the RealCompositionHarness end-to-end proof. Tests 2739/2739 (+ mapper ReproSteps fallback, summary-cap 600, gate empty-body + park-status, discovery parking). -> .agentsmith/phases/done/p0318-ticket-comprehension-and-clarification-gate.yaml"
    p0300c: "POLLER/DISCOVERY + RUN-LIFECYCLE HARDENING (backend). Discovery now filters by the agent-smith TRIGGER label, not just the routing tag: p0283b pushed status + the PROJECT routing tag server-side, but that tag is a broad business tag so every ticket carrying it was fetched, hydrated and TicketScanned/TicketSkipped-spammed each poll then dropped in-process for lacking a pipeline_from_label trigger. Fix is provider-capability-tiered — AzureDevOpsDiscoveryWiqlBuilder AND-s [System.Tags] CONTAINS 'agent-smith:' (prefix substring covers every agent-smith:* trigger+lifecycle label, unconditional, no key resolution); JiraDiscoveryJqlBuilder AND-s labels IN (<tracker's pipeline_from_label keys>, carried on new DiscoveryQuery.TriggerLabels from TrackerDiscoveryQueryBuilder); GitLab/GitHub keep the documented in-process filter (label params AND-only, no prefix, repo-scoped = bounded). EnqueuedReconciler now routes each enqueued ticket through IEnvelopeProjectResolver (the poller's matcher) before EnqueueAsync — on a shared tracker (many projects, one org tracker) ListByLifecycleStatusAsync returns EVERY project's enqueued tickets, so the old per-project loop duplicated a ticket onto every project → a second sandbox set that 403s on the k8s memory quota; resolving also yields the correct pipeline (dropped the 'fix-bug' guess, swapped IPipelineConfigResolver→IEnvelopeProjectResolver). RelationalPersistenceExtensions ConfigureWarnings downgrades EF's built-in RelationalEventId.ConnectionError to Warning so a poll-timeout-cancelled agentsmith.db connection stops logging a misleading FAIL (the SqliteTuningInterceptor still Errors genuine failures). CommitAndPRHandler hoists the RunOutcomeKeystone above the PR loop and opens a red-verdict run's PR as a DRAFT with a 'Verification red' body banner (visible, non-mergeable, not a vanished run) — ISourceProvider.CreatePullRequestAsync gains an optional isDraft (GitHub NewPullRequest.Draft, AzDO GitPullRequest.IsDraft, GitLab 'Draft: ' title prefix). Tests 2739/2739 (+5 spec tests: AzDo prefix guard, Jira labels-IN, reconciler cross-project no-dup, EF ConnectionError→Warning wiring, red-build draft PR). -> .agentsmith/phases/done/p0300c-poller-discovery-and-run-lifecycle-hardening.yaml"
    p0269a: "CAPACITY-AWARE ADMISSION (server, slice of p0269). Two tickets that don't fit together are now processed SEQUENTIALLY via a PROACTIVE gate: SpawnPipelineRunsUseCase asks ISandboxCapacityProbe (k8s reads the namespace ResourceQuota hard-vs-used; Docker counts labelled sandbox containers vs a max_concurrent_sandboxes cap, default 2; InProcess/CLI Unbounded admits) with the p0268 project-level footprint BEFORE claiming — no fit => ClaimOutcome.Queued WITHOUT claiming, ticket stays in trigger status, next poll retries (the poller re-discovery loop IS the sequencer, no new scheduler). k8s TOCTOU fallback (looks-like-it-fits-but-doesn't): the quota-Forbidden pod-create is a STRUCTURED 403 mapped at the KubernetesSandboxFactory boundary to a typed CapacityExhaustedException; PipelineExecutor skips HandleFatalFailureAsync for that type (native status NOT terminalized) and ExecutePipelineUseCase publishes RunFinished status='queued' (not failed) + releases the lease so the EnqueuedReconciler re-enqueues. Docker without limits has NO create-time signal (OOM is later, indistinguishable from a crash → no reactive guess, a real OOM stays an honest fail; feedback_no_heuristic_for_missing_data). RBAC: server SA gains resourcequotas get/list. NO ticket comment (operator: not wanted). Tests: full backend suite 2733 green (+ probe hard-vs-used math, quota-message mapping vs RBAC-403, Docker cap, admission-defer-no-claim, executor requeue-not-terminalize). -> .agentsmith/phases/done/p0269a-capacity-admission.yaml"
    p0269b: "QUEUED RUN RENDERING (dashboard, slice of p0269). RunCard renders status='queued' as a calm 'queued — waiting for capacity' state (amber tone, terminal so no cancel button — the ticket re-runs automatically); runStatus.toNodeStatus maps 'queued' to the 'wait' glyph. System-view TicketTriggered 'Queued' outcome is visible via the existing generic triggered-event rendering (bespoke styling left as low-value polish, logged in decisions, not silently dropped). Tests: full dashboard suite 316 green (+ RunCard queued label/no-cancel, toNodeStatus queued->wait); pnpm build green. -> .agentsmith/phases/done/p0269b-queued-run-rendering.yaml"
    p0300b: "SILENT-DEGRADATION HARDENING (backend). Closed the swallowed-error paths flagged in the 2026-07-05 gap analysis. NucleiSpawner.BuildEndpointUrls: swagger-parse failure now logs WARN + sets NucleiResult.Degraded/DegradedReason (scan still runs base-URL-only, but the partial coverage is visible, not silently clean). SpectralSpawner.ParseJsonOutput: non-JSON output logs the raw head at WARN and THROWS (Spectral always emits JSON when healthy, so returning empty falsely reported zero findings) — fail-loud. DeliverFindingsHandler.ResolveOutputDir: WARN per unwritable candidate + WARN on temp-dir fallback (was bare catch). Verified the p0128 concern is ALREADY handled — MergeMasterFindingsHandler keeps raw scanner findings on an unparseable master answer, pinned by MergeMasterFindings_UnparseableAnswer_LeavesRawObservationsUntouched. Audited VerifyRoundHandler: still wired (SkillRunHandlersExtensions + IVerifyRoundCoordinator), not dead — kept. Tests 2717/2717, Harness 51/51. -> .agentsmith/phases/done/p0300b-silent-degradation-hardening.yaml"
    p0300a: "TRACKER PARITY — Jira native workflow transitions (backend). GitHub/GitLab/Jira/AzDO lifecycle search was ALREADY implemented (all four override ListByLifecycleStatusAsync via label/tag search; the gap analysis misread the empty interface default) — so p0300a reduced to Jira native transitions. New opt-in: a lifecycle_status_names map on the Jira tracker (config presence = native mode, not auto-probe — you cannot map internal claim states to arbitrary workflow status names without the operator naming them). Native path drives JiraTransitioner (GET /transitions -> match by mapped status name -> POST); JiraTransitioner now returns bool so an unmapped state or no-matching-transition falls back to the label transition — labels stay the always-available record carrier, so a lifecycle change is never silently lost. Removed the dead 'Native-mode lands in p95c' Failed stub. Config flows RawTrackerEntry -> TrackerConnection -> JiraTicketConnection -> factory-built JiraLifecycleStatusMap; unknown lifecycle keys warn. Tests 2717/2717 (+native mapped/unmapped/no-match + catalog native-mode + TryParseName). -> .agentsmith/phases/done/p0300a-tracker-parity.yaml"
    p0299: "MULTI-SANDBOX COMMIT CONSOLIDATION (backend). Completes the p0249 fix at the commit layer: SandboxesForRepo already returns ALL of a repo's sandboxes, but CommitAndPRHandler/InitCommitHandler committed only matches[0] — so a mixed-stack monorepo (e.g. backend dotnet + frontend angular = two toolchain pods, two independent clones of the same repo) silently dropped every edit that landed in a non-primary sandbox. Fix: new SandboxGitOperations.ConsolidateSecondarySandboxesAsync folds each secondary sandbox's staged diff into the primary before commit — StageAll on the secondary, GetStagedDiff, write it to an untracked .git/agentsmith-consolidate.patch in the primary (via ISandboxFileReaderFactory; RunStepAsync has no stdin), then git apply. Best-effort (a bad hunk is logged not thrown, so the primary's own edits survive); single-sandbox repos take an early return (matches.Count<=1) and behave exactly as before. Both handlers call it and info-log 'consolidated N secondary sandbox(es)'. SandboxGitOperations now takes ISandboxFileReaderFactory; 5 test construction sites + a StubSandboxFileReaderFactory helper updated. Component paths are disjoint (backend/ vs frontend/) so applies are conflict-free; one atomic commit+push → one clean PR (idempotent via p0298), no non-fast-forward push races. AgentSmith.Tests 2702/2702. -> .agentsmith/phases/done/p0299-multi-sandbox-commit-consolidation.yaml"
    p0298: "IDEMPOTENT CreatePullRequestAsync for GitLab + GitHub (backend). A ticket re-run whose branch already has an open PR/MR failed at the PR step: GitLab did a blind POST (409 'Another open merge request already exists') and GitHub's Octokit PullRequest.Create threw 422 ('A pull request already exists'), both propagating to CommitAndPRHandler/InitCommitHandler → OpenStatus.Failed. AzureRepos already handled this (catch TF401179 → FindExistingPrUrlAsync); mirrored it: GitLab branches on response 409 → GET /merge_requests?source_branch=<b>&state=opened → existing web_url; GitHub catches ApiValidationException 'already exists' → PullRequest.GetAllForRepository(head owner:branch, State=Open) → existing HtmlUrl. Reuse = OpenStatus.Opened, not Failed; body not refreshed (branch push already updates commits). Local stays a no-op. Tests: GitLab wire (create + 409→reuse), GitHub detection predicate (internal). AgentSmith.Tests 2700/2700. -> .agentsmith/phases/done/p0298-idempotent-create-pull-request.yaml"
    p0297: "GITLAB PROJECT-ID DOUBLE-ENCODE FIX (backend). Root cause of the workforce monorepo verify failure that survived the branch + GITLAB_URL fixes: GitLabSourceConnection.ProjectPath is factory-URL-escaped (namespace%2Fname), and the probe/default-branch calls used it raw (correct), but ListDirectory/TryReadFile/PostComment/UpdatePullRequestBody re-escaped it (Uri.EscapeDataString) → %252F → GitLab 404 → .agentsmith/contexts listing returned empty → SandboxLanguageResolver synth-defaulted to 'default' → verify failed 'contexts/default/context.yaml not present'. Flat user/repo escapes to a no-op so only deeply-nested subgroups (gms/s1/scheduling/workforce) hit it; the probe used the raw path so connection-diagnostics showed GitLab OK. Fix: use _projectPath raw at all 4 sites. The TryReadFile test built the connection with a RAW path (group/repo) — disagreeing with the factory and hiding the double-encode; aligned it to group%2Frepo + added a ListDirectory single-encode wire test. AgentSmith.Tests 2696/2696. -> .agentsmith/phases/done/p0297-gitlab-projectpath-double-encode.yaml"
    p0296: "SELF-CONTAINED GITLAB ADDRESSING + QUIET DB CANCELLATIONS (backend). Live-debug hardening from the workforce session. (1) SourceProviderFactory.CreateGitLab now derives the GitLab API base URL from the repo url's own scheme+authority (new internal ResolveGitLabTarget) instead of GITLAB_URL ?? gitlab.com — a self-managed intranet url (git.intranet.gms-online.de/...) no longer silently talks to gitlab.com and 401s on .agentsmith/contexts; GITLAB_URL demoted to an optional override for sub-path installs. GitHub already did this. Tracker GitLab factories left (operator uses Jira; different semantics). (2) SqliteTuningInterceptor.LogFailure downgrades OperationCanceledException to Debug — an aborted-request/shutdown DB-open cancel is expected, not a FAIL-with-stacktrace; real SqliteException/other stay Error. AgentSmith.Tests 2695/2695. -> .agentsmith/phases/done/p0296-selfcontained-gitlab-and-quiet-cancels.yaml"
    p0294: "ROBUST LLM-JSON RESPONSES (backend). init-project stopped failing at Discover/AnalyzeCode when Sonnet 4.6 wraps its JSON in a prose preamble ('N'/'T' is an invalid start of a value). Two guaranteed fixes: (1) ProjectMapJsonReader + DiscoveryOutputParser now try strict parse first, then the first balanced {...} the existing TolerantJsonObjectScanner yields (same pattern as MergeMasterFindings/Consolidation) — a prose-wrapped object parses; (2) ProjectAnalyzer + BootstrapDiscoverHandler log the truncated raw response on parse failure (the 'check logs for raw responses' message was never actually logging it; parsers stay pure per coding-principles, logging in the callers). Structured output: a wire test proved Anthropic.SDK 5.10.0 DOES forward ChatOptions.ResponseFormat as output_config.format json_schema (contradicting the p0185-pin doubt) — but wiring the nested ProjectMap/DiscoveryOutput schemas live is a 400-regression risk unverifiable offline, so sliced to p0295. AgentSmith.Tests 2690/2690, Harness 51/51. -> .agentsmith/phases/done/p0294-robust-llm-json-responses.yaml"
    p0293: "CONNECTIVITY PROBES — full coverage on /system/connections (backend + dashboard). Extends p0292 so every runtime connection is probeable, not just repos/trackers. Agents: IChatClientFactory.ProbeAsync (DEFAULT interface member; ChatClientFactory overrides) builds the BARE provider client + sends a 1-token request — catches bad key / wrong Azure deployment / dead endpoint; ChatClientFactory.cs is exempted in ChatClientCallScopeRuleTests since it emits no LlmCall event. Sandbox: IJobSpawner.ProbeAsync — Docker System.PingAsync / K8s ListNamespacedPod in the spawner's own namespace (permission-aligned). Infra: IInfraConnectivityProbe — Redis PING + AgentSmithDbContext.CanConnectAsync via IServiceScopeFactory (scoped DbContext, singleton probe). Chat: IChatConnectivityProbe — Slack auth.test / Teams Bot-Framework token, only when credentials are set. All join p0292's ProbeTarget→ConnectionStatus path with a new Category (service/agent/infra/chat); dashboard groups the list by category, agent group carries a 'tiny LLM call' cost note. Container registry EXCLUDED (deploy infra). Tests: backend 2685 green (+11: chat-factory probe ok/throw/no-builder, diagnostics enumerate+categories+slack+redis), dashboard 314 green (+1 grouping/cost-note). -> .agentsmith/phases/done/p0293-connectivity-probes.yaml"
    p0292: "CONNECTION DIAGNOSTICS (backend + dashboard). Active connectivity testing for every configured repo + tracker, plus an honest webhook panel — the ACTIVE complement to ConfigView's static 'how it's wired'. Backend: ProbeAsync added as a REQUIRED member on ISourceProvider + ITicketProvider (ConnectionProbeResult{Ok,LatencyMs,Error}); every provider implements its cheapest read-only authenticated round-trip (GitHub Repository.Get, GitLab GET project, AzDO GetRepository / WIQL id=0, Jira GET /rest/api/3/myself) and never throws — failures become Error. No ListOpenAsync-based default (would report false 'ok' for non-listing providers). ConnectionDiagnosticsService enumerates config.Repos (skips Local) + config.Trackers; GET /api/diagnostics/connections lists them WITHOUT probing (on-demand only, to spare rate limits), POST /api/diagnostics/connections/{name}/probe runs one probe; both gated by AGENTSMITH_UI_API_ENABLED. Webhooks are inbound → no active test: WebhookDeliveryTracker records last-seen per platform in a Redis hash (advisory; degrades to 'never seen'), and the panel shows secret-configured (env for github/gitlab/azuredevops, per-project JiraTrigger.Secret for jira) + last delivery. Dashboard: new /system/connections page (AppRail + SystemView slug), diagnosticsApi.ts, ConnectionsView with StatusPill + per-row Test + 'Test all' (client-side fan-out) + WebhookPanel. Renumbered from the stale p0284-connection-diagnostics draft (p0284 was already merged as jira-endpoints-overridable). Tests: backend 2674 green (+8: diagnostics enumerate/skip-Local/probe/webhook-secret, GitLab probe ok/401/transport), dashboard 313 green (+3: list/test-click/webhook-panel). -> .agentsmith/phases/done/p0292-connection-diagnostics.yaml"
    p0285: "STATIC CONNECTION REPO REFS (backend config loader). An exact (wildcard-free) connection/<name> repo ref now resolves DETERMINISTICALLY via a new IConnectionRepoUrlBuilder — URL built from the connection's type+org/project(+name), byte-identical to the discovery providers — so a project can list a clear, bounded repo set that loads even when the glob expander is absent (no discovery round-trip). Glob refs (pattern has '*') keep the discovery path. ResolveRepos partitions exact vs glob/exclude; RepoGlobRef gains IsGlob. Optional per-repo default_branch override via an object entry {repo, default_branch} — RawProjectEntry.Repos is now List<RawRepoRef> with a custom IYamlTypeConverter (scalar→Ref, mapping→Ref+branch; preserves all plain-string configs). DefaultBranch may stay null → source providers resolve the repo's real default at clone (matches discovery). Schema project.repos → oneOf string|{repo,default_branch}; docs updated. Build clean; AgentSmith.Tests 2665/2665, Sandbox.Agent 86/86, Harness 51/51, p0285 tests 7/7. Verified in an isolated worktree off main. -> .agentsmith/phases/done/p0285-static-connection-repo-refs.yaml"
    p0283b: "TICKET-DISCOVERY COMPOSED QUERY (backend). Replaced p0283a's status-only narrowing + the leaky `statusCategory != Done` (which re-read agent-smith's own done_status 'In Review' — NOT category Done) with a query composed PER routed project from its per-tracker trigger (TriggerSelectionHelper.ByTrackerType): a structured DiscoveryQuery (DiscoveryBranch{statuses, criterion} + config-derived parking statuses), one branch per project, OR'd, translated by per-provider builders. AzDO pushes the FULL branch `[System.State] IN (...) AND ([System.Tags] CONTAINS | [System.AreaPath] UNDER)` (Tags CONTAINS verified case-insensitive full-tag = parity with the p0140a in-process matcher); ALL providers push the resolution TAG too (Jira labels=, GitHub ListByLabels, GitLab labels=) — status-only does NOT solve the scaling case (1000 tag-less tickets in a trigger status are still fetched + discarded). JQL labels= is exact/case-sensitive but the operator sets both config tag and ticket label, so they align; the in-process matcher stays the net. Positive allowlist → done/failed parking statuses (union across the tracker's projects; verified only those two terminalize the native status — working=comment-only, cancel=lease-only) appear in no branch, so a finished ticket is never re-read; a broad branch (inexpressible criterion / empty statuses) excludes parking explicitly. Build logic EXTRACTED to an injectable TrackerDiscoveryQueryBuilder (SRP; keeps the poller from bloating; unit-tested directly). MaxBranches=25 collapse-to-broad backstop. ListClaimableAsync(DiscoveryQuery) REPLACES ListOpenByStatusesAsync (deleted, no shim); GitHub/GitLab narrow by open+tag via AllTagLabelsOrNull (p0283c folded in). Also fixed a JQL precedence bug — the project scope wraps the OR-body in parens. LOG cleanup alongside: CORS always allows loopback origins (dashboard is operator-local, so :3002 works without env), TicketProviderFactory.Create logs one line not three, ConfigFileRead deduped to real file changes (not every poll), and Microsoft.AspNetCore.Http.Result filtered to Warning. Tests: full suite green (2666). -> .agentsmith/phases/done/p0283b-composed-discovery-query.yaml"
    p0283a: "TICKET-DISCOVERY SCALING + 2 BUGFIXES (backend; landed this session, code-only — no spec). Discovery fetched ALL open tickets then filtered in-process; at 1000+ that floods streaming/UI and silently truncated (Jira first-page=100, AzDO top:50). Added: real paging + a hard cap with warn-log to all 4 providers (no silent truncation); before/after debug logging of the actual query (JQL/WIQL/URL) + result at every provider call site; status-only narrowing (SUPERSEDED by p0283b's composed query). Plus two operational bugfixes that survive: CORS multi-origin + any-loopback-in-dev (dashboard was single-origin :3000, so :3002 was rejected), and a SqliteTuningInterceptor (WAL + busy_timeout to stop concurrent-access lock failures + log the REAL exception on connection-failure instead of the opaque EF `Database.Connection` line). -> code-only (no spec file)"
    p0281a: "p0281 slice — CONNECTIONS + OUT-OF-BAND REPO DISCOVERY + GLOB (backend Contracts/Core/Infrastructure/Server + schema + sample). A `connections:` catalog holds host/org/auth ONCE (azure_devops=org+project, github=owner, gitlab=group, +host override); repos are DISCOVERED under a connection via the provider REST API (AzureDevOps/GitHub/GitLab providers, paginated, default-branch from the provider) and a project selects them with `connection/glob` (+ `!exclude`), coexisting with the legacy repos: catalog (escape hatch). KEY ARCHITECTURE (refined from the spec's 'API call in the load path' premise, operator-approved): discovery is OUT-OF-BAND — LoadConfig is sync + called per-webhook/poll (~30 sites), so a background RepoDiscoveryRefreshHostedService warms (on-start) + refreshes (5-min) a per-connection snapshot (InMemoryConnectionRepoSnapshot hot cache + DiskConnectionRepoSnapshotStore durable last-good); the sync RepoGlobExpander only READS the snapshot, blocking ONCE on a cold connection via the refresher (live discovery → snapshot+durable; failure → last-good stale-warn; cold → fail-loud). Resolved set logged per connection so glob drift is visible. ConfigCatalogResolver gained an OPTIONAL RepoGlobExpander (null in test `new()`s → legacy-only; DI injects the real one, ValidateOnBuild green). Disk-only durable store for server+CLI (Redis follow-up only for multi-replica). Auth via fixed env vars per host type (matches SourceProviderFactory). LIVE-VERIFIED with .env creds: ADO discovered 96 repos for the real org, GitHub 13 for the owner, correct default branches + clone URLs + pagination. Tests: full suite green (2651, +15: glob matcher/ref parse/expander include-exclude/cold-trigger/unknown-connection/repo-build + refresher success/last-good-fallback/cold-fail-loud). -> .agentsmith/phases/done/p0281a-connections-repo-discovery.yaml"
    p0281d: "p0281 slice — PROJECTLESS CLI SCANS (backend CLI + use case + sample). PipelineRequest gained optional AgentName; ExecutePipelineUseCase.ResolveProject branches on it — AgentName (from --agent) builds an EPHEMERAL ResolvedProject (named agent from the agents: catalog + ONE synthetic local repo at --source-path, no tracker/catalog-repo lookup), else the legacy ProjectName->projects: catalog path unchanged. Ephemeral build is a pure private static mapping (no new ctor dep, no test-construction churn); the synthetic repo reuses the existing source-checkout path and mirrors the retired cicd-noop placeholder (passive scan -> /var/empty empty path; active -> --source-path). api-scan + security-scan gained --agent; security-scan's --project lost IsRequired with a runtime one-of guard; --project stays working (deprecated) and --agent wins when both given. The noop-source repo + stub scan projects are no longer needed to run a scan (their removal is p0281e). Tests: full suite green (2636, +3: ephemeral-from-source-path / agent-wins-over-project / unknown-agent-throws). CLI dry-run smoke confirmed: security-scan --agent w/o --project works, api-scan --agent prints the pipeline, neither-flag errors cleanly. -> .agentsmith/phases/done/p0281d-projectless-cli-scans.yaml"
    p0281c: "p0281 slice — DEPLOYMENT VERSION PIN (backend + schema + sample). One top-level `deployment: {registry, version}` feeds BOTH the orchestrator container image and the sandbox-agent image (same release tag → one knob, not two kept in sync). New DeploymentDefaultsApplier runs on the raw config in the loader and FILLS the legacy SandboxGlobalConfig/OrchestratorGlobalConfig image fields from deployment ONLY where unset — so the two image resolvers stay byte-for-byte unchanged and a present legacy block (sandbox.agent_version / orchestrator.{registry,version}) still WINS (back-compat). Sandbox registry treated as unset when empty OR == built-in default so deployment.registry has authority over the unconfigured default. Per-project orchestrator image override DROPPED: OrchestratorImageResolver resolves from the global pin only + warns when a project declares orchestrator.registry/version (orchestrator.resources stays per-project); the 2 override tests flipped to assert override-ignored/global-wins. Example: top-level sandbox+orchestrator image blocks collapsed to one `deployment:` pin. Tests: full suite green (2633, +6 applier: deployment feeds both / legacy orchestrator+sandbox win / registry-default-superseded / no-deployment-untouched). -> .agentsmith/phases/done/p0281c-deployment-version-pin.yaml"
    p0281b: "p0281 slice — TRACKER OWNS THE WORKFLOW (backend + schema + sample). New EffectiveTriggerBuilder runs on the RAW config before ProjectConfigNormalizer and materializes each project's effective *Trigger from (tracker workflow + flat resolution shorthand + any explicit project override), so all ~10 webhook handlers/pollers/validators read the pre-merged trigger unchanged. TrackerConnection/RawTrackerEntry gain trigger_statuses/failed_status/pipeline_from_label (done_status/polling/open_states already there); a project now needs only `resolution: {strategy-key: value}` (key = tag|area_path|repo|to_address) and the trigger TYPE is inferred from tracker.type. Merge is field-by-field project->tracker->built-in; trigger_statuses falls back to the tracker's existing open_states (the DRY win — no field repeated). done_status inherits only in the no-wrapper case (YamlDotNet can't tell omitted from the non-null 'In Review' default); an explicit wrapper = explicit mode (still loads identically, back-compat). Unknown resolution key throws. NO per-wrapper deprecation warning (the wrapper is the supported override, not legacy). Example config: acme-platform converted to the terse shape (workflow moved onto acme-ado tracker). Tests: full suite green (2628, +18: EffectiveTriggerBuilder inherit/override/shorthand-per-strategy/type-inference/open_states-fallback/unknown-throws/legacy-wrapper-identical). -> .agentsmith/phases/done/p0281b-tracker-owns-workflow.yaml"
    p0280: "FUNCTIONAL spawn_agents — fan-out for scan AND coding masters (backend). The p0177 sub-agent path was a scaffold wired into NOTHING: children got hosts: Array.Empty (no tools), no IRunEventReader impl existed, no observation events were ever published, read_sub_agent_observations had nothing to read, and neither SpawnAgentToolHost nor the reader was ever constructed — yet both masters' SKILLs advertise spawn_agents (a lie to the model). Completed it. KEY DESIGN: children SHARE the master's FilesystemToolHost (made thread-safe), so every child read lands in the master's fs.ReadPaths and every child write in its GetChanges() — the p0279 source-anchoring + the CommitAndPR git keystone include children's work with ZERO plumbing (collapses the reviewer-#3 child-read-set aggregation into 'they share the instance'). Child detail flows via a new in-memory scoped IChildAnswerStore (subAgentId->final answer), NOT the never-built Redis IRunEventReader: SubAgentRunner stores each child's answer; read_sub_agent_observations (repointed at the store) returns it; the master pulls children's findings back and SYNTHESISES (central refute/dedup preserved). SubAgentContext now carries the granted ChildTools + the store; SubAgentRunner.BuildLoopRequest uses ChildTools (fixes hosts: Array.Empty); children never get spawn_agents (no recursion). AgenticMasterHandler appends spawn_agents + read_sub_agent_observations to BOTH the scan Review surface (read-only children) and the coding ReadWriteWithHuman surface (read/write children), gated on LoopLimitsConfig.MaxSubAgentsPerRun > 0 (default 20). Coding fan-out: children write disjoint pieces into the shared sandbox working tree, the master verifies. EstimateCostUsd left 0m (run-total cost is correct via the shared tracker; per-child USD is cosmetic). SKILLs already advertise spawn_agents — now TRUE, no skills change. Redis per-child event timeline for the dashboard is a separate optional follow-up. Tests: full suite green (2610 + 51 + 86), +9 (thread-safe concurrent fs / child gets granted tools / child answer stored / reader returns store answer / scan+coding+disabled surfaces). 110 preset dry-runs green; coding path (fix-bug harness) green."
    p0279: "SCAN DEPTH (A-lite) + SOURCE ANCHORING (backend + skills). Two fresh current-main runs proved p0278 deployed but THIN: the scan master read ~4 cross-cutting files, 921/8192 output tokens, 0 endpoint handlers, then stopped; findings claimed analyzed_from_source but carried no file:line ('2/2 missing a file'). FIX has two halves. (A-lite) COVERAGE re-drive: FilesystemToolHost now tracks distinct read paths; AgenticMasterHandler's scan branch, if the master read < agent.scan_min_source_reads (default 6) source files, re-prompts ONCE via IScanMasterPromptFactory.BuildCoverageNudge (inventory the FULL surface, review each area, read its code) and re-collects. Read-count signal (not 0-sub-agents) catches the real 'read 4 then stop' case; honest — prevents a near-empty pass, does NOT guarantee every class checked. (B) ANCHORING: api-security-master Output gains file+start_line (it had api_path but no source location, so code-anchored findings couldn't carry a location); AgenticMasterHandler publishes ContextKeys.MasterReadPaths; CollectMasterFindings + MergeMasterFindings thread it into ObservationParser.TryParseWithoutIds(readPaths) so an analyzed_from_source claim on a file the master never read downgrades to potential. The match is a LENIENT ReadPathNormalizer (normalized-equal / '/'-aligned segment-suffix / basename) because read paths are repo/sandbox-prefixed while the model writes free-form files — exact match would false-downgrade legit findings (reviewer #4). PARALLEL FAN-OUT was DEFERRED to p0280 after a premise-check: the p0177 child machinery is a skeleton (SubAgentRunner.BuildLoopRequest passes hosts: Array.Empty → children get no tools), so real fan-out is a subsystem completion, not an add. Skills (api 1.2.1→1.2.2, security 1.1.1→1.1.2, agent-smith-skills PR #105): file/start_line + both masters scrubbed of language/framework artifact terms (no controller/.cs/Startup) — methodology speaks only of responsibilities, holds for any stack; enforced by an explicit denylist (controller/startup/asp/angular/spring/django/rails/express/dotnet/program.cs/extensions) while handler/cli/job/endpoint/middleware stay allowed (reviewer #5). NOTE: skill-content guard is a manual grep (cross-repo gap, same class as the 200-char description cap); the 8 behavioural tests are automated. Tests: full suite green (2603 + 51 + 86), 110 PipelinePreset dry-run tests green (all presets), coding path untouched. Coordinated skills bump must be pinned to deliver."
    p0278: "SCAN MASTER INPUT + FRAMING (backend-only). A live api-security run after p0267/p0277 came back 0 findings AND green — hollow: the master made 3 tool calls (DirectoryTree x2, `dotnet test`), 131 output tokens, emitted no observation array. Two root causes, both in AgenticMasterHandler, which is hardwired for the CODING contract: (1) the master was BLIND to the scanner outputs — nothing reads NucleiResult/ZapResult/SpectralResult or the OpenAPI spec into the prompt (p0179d retired CompressApiScanFindings, the only feeder), so the 195 Nuclei + 4 ZAP findings were silently discarded; the p0267 premise 'raw results stay prompt-only INPUTS to the master' was never implemented. (2) the master got the coding USER PROMPT ('implement your change + verify build/tests') + the read-write tool surface (the 'read-only' Plan set still includes run_command!), so gpt-5.1 ran `dotnet test` and concluded 'nothing to change'. FIX (backend): gate scan-vs-coding in AgenticMasterHandler on output_schema == observation (reuse p0267 IMasterOutputSchemaResolver). For a scan master: user prompt = new IScanMasterPromptFactory (scanner findings inline via ApiScanFindingsCompressor for api / formatted SkillObservations for security, + the compressed swagger for api, + 'review the source, emit your observation array, do NOT modify code / run build or tests'); tools = new AgenticToolSurface.Review = the BootstrapDiscover filesystem set (the ONLY one without run_command/http_request/write) + log_decision; the verdict-nudge + verdict warning are skipped. Coding path is byte-for-byte unchanged when isScanMaster is false. Skills: VERIFIED already aligned — the 1.2.1/1.1.1 methodology rewrites already frame inputs as 'handed to you / in the pipeline context' with no findings.json/read-sandbox wording, so NO skills change + no bump needed. Tests: full suite green (2589 + 51 + 86), +7 named (scan master review-prompt+read-only-tools / coding master unchanged / scan no apply-or-verdict-nudge / factory api includes Nuclei+ZAP+spec / factory security formats raw observations / factory always forbids code-changes+build / Review surface read-only no write/run). NOTE: this proves the master is FED + FRAMED right; finding QUALITY needs a live run (operator). The cicd-noop-source repo-name cosmetic stays out of scope."
    p0277: "SECURITY-SCAN MASTER-TRIAGE DELIVERY (backend + security-master skill). Same orphaned-master-output class as p0267, masked: the security-scan preset had NO consumer of the master's answer, so the security-master's triage (dedup/prioritization/FP-suppression) was discarded and DeliverFindings shipped the RAW scanner dump (StaticPattern/GitHistory/DependencyAudit AppendObservations) as if final. The master even wrote a findings.json nothing reads — doubly dead. FIX is REFINE-WITH-SAFETY-NET, not pure replace (the code scanners carry HARD evidence — file:line, secrets, CVEs — that an LLM omission must never silently drop): a DISTINCT MergeMasterFindings step (security-scan only, reuses p0267's IMasterOutputSchemaResolver + MasterAnswer/MasterSkillName) sets SkillObservations = master-curated array + every uncovered High+ deterministic raw fact; low/medium scanner noise the master does not re-state is suppressed. Collision identity = (File,StartLine) only (Role/Description excluded — master rephrases), master wins on collision (recalibrate), uncovered High+ ships verbatim. EMPTY-BUT-VALID [] (merge+suppress) vs UNPARSEABLE (skip, full raw fallback, no regression) are separated via tolerant ParseArray array-ness detection because TryParseWithoutIds returns null for both. SecuritySnapshotWriter repointed at the pre-merge raw set (ContextKeys.RawScannerObservations, stashed by the merge; falls back to SkillObservations) so the git-based SecurityTrend stays raw-vs-raw consistent (no phantom delta); DeliverFindings + SpawnFix keep reading the merged set. Skill (security-master 1.0.0→1.1.0, separate agent-smith-skills PR #101): same five-phase methodology as api-security-master 1.2.0 (Inventory→Hypothesize→Verify→Refute→Synthesize), observation-array Output + output_schema: observation, findings.json removed; told the High+ deterministic facts ship on their own (don't re-list; override only by addressing the same file:line + log_decision). Stacked on p0267 (#319) since it requires that plumbing. Tests: full suite green (2582 + 51 + 86), +8 named (uncovered-High survives / low suppressed / same-location collision prefers master / empty-but-valid keeps High suppresses low / unparseable leaves raw / coding-schema skips / snapshot counts raw not merged / preset orders merge between master and deliver). NOTE: requires the coordinated security-master skills bump pinned to deliver the triaged report in production."
    p0267: "API-SECURITY FINDINGS DELIVERY (backend + api-security-master skill). An api-security scan always reported 0 findings: p0179d collapsed the pipeline to one AgenticMaster step, the master triaged into a findings.json nothing reads, and DeliverFindings reads ONLY ContextKeys.SkillObservations (empty) — structural, not model-fitness (gpt-4.1 + gpt-5.1 both 0). The Spawn handlers store RAW Nuclei/Spectral/ZAP results only (they never AppendObservations, unlike the code-scan StaticPattern/GitHistory/DependencyAudit handlers — that asymmetry was the bug). FIX: a DISCRETE CollectMasterFindings step between AgenticMaster and DeliverFindings scrapes the master's final answer (an observation-JSON array, the judge-skill shape) into SkillObservations via the existing ObservationParser.TryParseWithoutIds (TryParse, NOT Parse — no fallback finding invented, so a real 0-triage stays an honest 0). AgenticMasterHandler now publishes MasterAnswer + MasterSkillName (two unconditional Sets, no branch — coding path untouched). The scrape is gated on the master's declared output_schema == observation (new IMasterOutputSchemaResolver, by name) NOT on pipeline name, so a coding master (code+verdict, diff schema) is structurally never scraped. Raw tool results stay PROMPT-only — Spectral OpenAPI-lint never reaches delivery as a High. Skill (api-security-master 1.0.0→1.1.0, separate agent-smith-skills PR): Output contract is now a single observation-array (severity/category/api_path/evidence_mode/description, ≤500-char), output_schema: observation added, findings.json removed, evidence_mode fixed to the valid enum set. Tests: full suite green (2574 + 51 + 86), +4 named (handler appends from observation JSON / appends nothing on no-JSON / skips a coding-schema master / preset orders CollectMasterFindings between master and deliver). NOTE: requires the coordinated skills bump pinned for the api-security scan to deliver in production."
    p0276: "PLAN BEFORE EXECUTION (backend + coding-agent-master skill). The plan was produced INSIDE the master (p0179b collapse), so it appeared late and the Approval gate had nothing concrete to show ('approve a blank cheque'). Now GeneratePlan runs BEFORE Approval in fix-bug/add-feature (partly reversing p0179b, deliberately): the existing GeneratePlanHandler (it only ran in SkillManager) generates the plan, ApprovalHandler already renders it, and AgenticMasterHandler renders it into a {PlanSection} the master EXECUTES (validate + refine, don't re-plan) instead of planning from scratch. KEY robustness: GeneratePlan is now BEST-EFFORT in coding presets — an unparseable planner response logs a warning and the run continues without a Plan (master plans itself, {PlanSection} empty), instead of throwing (which the composition harness proved would fail every run). Skill (coding-agent-master 1.7.0→1.8.0, separate repo): {PlanSection} placeholder + Phase 1 'if an approved plan is provided, execute+validate+refine it, else plan from scratch'. Tests: flipped the 2 p0179b guard tests (FixBug/AddFeature now ASSERT GeneratePlan before Approval); added a planner FIFO slot to the 4 real-change harness tests (GeneratePlan legitimately drains one LLM response before the master, like the analyzer); +2 BuildPlanSection unit tests (renders summary+ordered steps / empty when absent). Follow-up p0276a: hand the master the structured ProjectMap so it skips its own re-exploration. Full suite green (2570 + 86 + 51)."
    p0275: "RUN-DETAIL STEP SKELETON (backend + dashboard). The run-detail step rail was rebuilt from an evictable event stream (scopeBuffer 2000-event FIFO), so on a master-heavy run the early StepStarted events got evicted and the first steps VANISHED mid-run (the operator's 'die werden kurz angezeigt und sind dann weg'). Root fix per the operator's framing 'steps are STRUCTURE, not events — known before and after': RunStartedEvent now carries PlannedSteps (the resolved preset's ordered CommandDisplayNames, from PipelinePresets.TryResolve), and the dashboard SEEDS its step map from that (seedPlannedSteps, index = preset position + 1 = executionCount) BEFORE ingesting live events. Live StepStarted overwrites the seed (live wins); StepFinished attaches to a seeded bucket whose Started was evicted instead of dropping the step. The skeleton is thus stable from t=0 and fully decoupled from the run buffer; detail events stay cappable. Back-compat: absent plannedSteps (pre-p0275 events) → event-only, unchanged. SCOPE: shipped the no-vanishing skeleton (the correctness bug, vitest-testable); the VISUAL rework — dissolve Overview into the one list, Architecture→Sandboxes step, Plan/Result as in-sequence nodes, sticky-bottom auto-follow — is carved to NAMED follow-up p0275a because it has design latitude and needs the dashboard running to verify (not shipped blind). Tests: backend 2568 green; dashboard 310 green (+2: early-steps-survive-eviction, no-planned-steps-fallback)."
    p0273: "REGRESSION-AWARE VERIFICATION + DURABLE-ON-RED (backend + coding-agent-master skill). Two fixes. (1) The keystone no longer fails a run on ANY red test — it gates on REGRESSIONS (green→red). The agent reports two RAW failing-test lists on its verdict — baseline (failing at HEAD before edits) + final (after) — and the FRAMEWORK computes new-failures = final \\ baseline; a test red in both lists is pre-existing and never blocks. 'Unrelated' is measured, never the agent's prose claim (the v3.14.0 escape hatch that let a pre-existing red sink every run). MasterVerification gained nullable FailingTests + BaselineFailingTests (defaulted, back-compat); MasterVerificationParser reads failing_tests/baseline_failing_tests arrays; RunOutcomeKeystone.EvaluateTests uses regression logic when the lists are present, else the ORIGINAL binary gate (so shipping the backend before the skill is safe — behaves as today until a list-emitting skill is pinned). Build-fail and unparseable-verdict still block unconditionally. (2) Durable-on-red: forensics showed CommitAndPRHandler opens the PR (pushes the branch) BEFORE the keystone — the work was never lost, it just sat behind a 'failed' step reading as 'nothing happened'; the keystone-fail result now SURFACES the opened PR url(s) so the operator can review/take over (ticket stays unfinalized). Skill (coding-agent-master, separate repo): Phase 3 captures the baseline (git stash → run suite → pop), Phase 4 verdict emits failing_tests + baseline_failing_tests, and the 'stop on pre-existing red' bullet now says PROVE it via the baseline, don't assert it. Follow-up p0273a: framework-owned baseline (run the discovered test command at HEAD) to close the residual 'agent could pad the baseline' trust + an opt-out for known-green repos. Tests: full suite green (2568 +8: keystone pre-existing-no-block / new-regression-blocks / build-fail-blocks / back-compat binary; parser reads + tolerates-absent lists)."
    p0274: "CONFIG-AWARE LIVE LLM PRICING (backend). Per-LLM-call cost rendered $0.0000 despite tracked tokens + config pricing, because the LIVE path (EventPublishingChatClient, built by ChatClientFactory) resolved through a BARE defaults-only ModelPricingResolver that ignored the agent's `pricing` config and lacked gpt-5.1 (and the longest-prefix fallback can't bridge gpt-5.1→gpt-4.1, different family) → null → 0. The run-SUMMARY path (PipelineCostTracker) already read config correctly — a divergence between two code paths with the same intent. FIX: a shared OverlayModelPricingResolver (Contracts) layers a PricingConfig over any base resolver (override exact + longest-prefix, then base defaults), used by BOTH paths — ChatClientFactory wraps it from agent.Pricing at the EventPublishingChatClient site, and PipelineCostTracker's private ResolvePricing was DELETED and replaced by the same overlay (cost arithmetic untouched). So a config-priced model can no longer be $0 live while the summary shows a real number. Also added gpt-5.1 to DefaultPricing (verified Azure 1.25/10.0/0.13) so the built-in fallback isn't a year behind; config still wins; no other unverified model prices invented. Layering kept clean (overlay in Contracts → Infra factory uses only the interface). Tests: full suite green (2560 +5: overlay prices config-only model, override beats default, null-config delegates, unknown→null, gpt-5.1 incl. date-suffixed resolves)."
    p0245: "PER-LANGUAGE TOOLCHAIN IMAGE CONFIG (backend). An operator can now pin a sandbox toolchain image PER LANGUAGE in agentsmith.yml (projects.<name>.sandbox.images: { <slug>: <image> }), merged over the SandboxSpecBuilder code-default table per key — the polyglot-safe hook that was missing (whole-project sandbox.toolchain_image is too coarse for a repo that is both node AND dotnet). NEW: SandboxConfig.Images (Dictionary<string,string>?). SandboxSpecBuilder.ResolveImage gained a per-language layer, placed ABOVE the LLM-named context.image (p0265) — operator authority beats the LLM guess, the same precedence p0268 set for resources (corrected the original spec's 'below context.image' wording, which predated p0265). Full order: project toolchain_image > images[lang] > context.image (validated) > code table > generic fallback. Matched case-insensitively (mirrors the OrdinalIgnoreCase code table); empty value falls through. No signature/call-site changes — the map rides on the ResolvedProject the builder already holds; resolution stays in the private ResolveImage via a pure helper. Declaration not magic: no runtime install, no version inference (images are pulled on spawn already). agentsmith.schema.json (project sandbox.images) + example.yml document it. Tests: full suite green (2554), +5 (configured-image beats code-default + beats context.image; toolchain_image still wins outright; case-insensitive key; unmatched language falls through to the table)."
    p0272: "SANDBOX SECRET INJECTION (backend, k8s). Operator-declared credentials now reach the k8s sandbox pod — env vars via secretKeyRef and secret keys mounted read-only as files — so a stack whose build/test must authenticate to an external system can. Driver: a Salesforce repo whose 'compile' is a server-side validate-deploy needing `sf org login jwt` (client-id+username as env, a private key as a FILE). Generalizes the existing GitTokenSecretRef path: credentials reach the pod ONLY as k8s Secret references, NEVER in a Step/Redis payload or context.yaml, never in the LLM's view. NEW config: projects.<name>.sandbox.secrets { env: {NAME: 'secretName:key'}, files: [{mount,secret,key}] } (SandboxSecrets/SandboxSecretFile). SandboxSecretsResolver (mirrors ISandboxResourceResolver, optional ctor arg) parses it onto typed spec carriers ResolvedSandboxSecrets{Env:SecretEnvBinding[],Files:SecretFileMount[]}; a malformed 'secretName:key' THROWS at spec-build (operator config = fail-fast, NOT the p0268 LLM validate-then-fallback). PodSpecBuilder injects each env as secretKeyRef (shared SecretEnvVar helper with GIT_TOKEN) and each file as a per-file Secret volume + VolumeMount with SubPath=basename (single file at the exact path, read-only). The auth COMMAND is NOT new code — it lives in context.yaml prerequisites as `sh -c \"sf org login jwt … $SF_CLIENT_ID …\"`, run by the existing EnsurePrerequisitesHandler before the agent in the same pod (~/.sfdx persists to the agent's deploy step). `sh -c` is mandatory + documented: the handler tokenizes (CommandLineStringSplitter) and ProcessRunner uses UseShellExecute=false, so $VAR only expands when sh is the process. ALSO fixed a latent schema gap: context.schema.json (root additionalProperties:false) never declared `prerequisites` — now added with the auth-command pattern. k8s only (Docker/InProcess ignore SandboxSpec.Secrets; follow-up p0272a). agentsmith.schema.json + example.yml document sandbox.secrets. Tests: full suite green (2549 AgentSmith.Tests + 86 + 51), +5 (PodSpecBuilder secretKeyRef/file-mount/no-secrets-baseline, SandboxSpecBuilder map-onto-spec + malformed-throws)."
    p0268: "PER-STACK SANDBOX SIZING (backend). Sandbox CPU/memory now sized from LLM-authored context.yaml `stack.resources` (concrete k8s quantities) as a layer BETWEEN the operator project override and the global default — so a dotnet+Roslyn build keeps its 4Gi while a passive/bookworm scan in the SAME project asks for a fraction, and a 6 CPU/10Gi namespace quota holds far more than ~2 concurrent runs. Resource-analogue of p0265, same flow (ContextYamlStack/Summary -> ContextYamlSerializer -> RemoteContextDiscovery -> SandboxLanguageResolver -> SandboxSpecBuilder.Build -> SandboxResourceResolver) and same 'LLM decides, agent-smith only validates' rule — no regex/magic-string lang-or-tool detection in code. The raw four-field block (ContextYamlStackResources, all-nullable) flows UNPARSED to the resolver, the single validate+map+WARN gate: precedence project ?? validated-context ?? global; a PARTIAL (not all four) or parse-invalid block is rejected WHOLE and falls to global with a WARN (never silent, never to project). Validation reuses the spawner's quantity parse, EXTRACTED to AgentSmith.Contracts/Sandbox/KubernetesQuantity (TryParse, bool) so Application validates with the same logic Server sizes with — ResourceLimitsDockerExtensions now delegates (no second parser/regex). Sandbox grouping key became (image, resources); SandboxKeyComposer.ComposeForGroup gained a size slug ('2-4gi' vs '500m-512mi') + a numeric backstop + a per-(repo,group-identity) cache so same-image/different-size contexts split into distinct pods without dropping the second and EnsureSandboxesAsync stays idempotent. WriteContextYaml prompt documents stack.resources with worked heavy/light example values. ALSO fixed the p0265 schema gap: context.schema.json stack block (additionalProperties:false) now declares stack.image AND stack.resources. Tests: 2501 unit green (+8: KubernetesQuantity, serializer round-trip, resolver context-layer incl. partial/invalid WARN, key composer, coordinator same-image-different-size split)."
    p0271: "CONFIG DETAIL SHEET (server + dashboard). Replaced the System → Config topology graph + global-defaults grid with a project combobox + ONE dense hierarchical detail sheet per project — answering the operator's 'just colourful pictures' critique (the graph rendered N identical columns because every project shares the same agent/tracker). Deleted ConfigGraph + ConfigDetail; new ProjectSelect (native combobox, default first project) drives ProjectDetailPanel, which looks up the selected project's agent/repos/tracker from the snapshot and renders labelled sections: Agent (model/type/tuning), Repositories (each with FULL url + org/project/branch), Tracker (type/url/project + how-it-tracks: trigger statuses / done / failed / polling cadence / comment keyword), Resolved settings (effective values, each with a now-QUIET muted provenance hint instead of a coloured badge). The config read-events stream stays below. Backend: ConfigRepo gains Url+Organization+Project (operator: full URL is not sensitive here, only secrets are — widens p0266 host-only), ConfigTracker gains Url, ConfigTrigger gains PollingIntervalSeconds+CommentKeyword; still an allow-list (Auth/ApiKeySecret/ConnectionString never mapped — redaction test asserts no secret in repo/tracker JSON). NOT a raw YAML dump (would re-expose secret refs + scans worse). Tests: 2514 backend (repo full-url/no-auth + tracker url/trigger-config) + 308 dashboard (ProjectSelect change + ProjectDetailPanel repo-urls/tracker-config/per-run) green; build + drift + lint green."
    p0270b: "CONFIG EXPLORER → EXPLAINER (dashboard). Reworked System → Config from a static catalog into a read-only explainer on p0270a's materialized payload, answering the operator critique of p0266 (pretty but says nothing / nothing clickable / defaults not where applied / tracker tags unclear). Selection-driven master/detail: clicking a project in ConfigGraph highlights its subgraph and opens ProjectDetailPanel with the fully resolved, UNTRUNCATED config; every effective sandbox/orchestrator/cost-cap/agent value shows a ProvenanceBadge (override=amber / default / per-run); run-resolved fields (toolchain image) render the literal 'resolved per run' with no fabricated value, resolutionError shown in a rose note; tracker states render BY ROLE (triggers/done/failed + polling) instead of raw pills; the global Defaults grid demoted to a collapsed disclosure. Pure render over the materialized object — no second resolution in the frontend. dsh-* tokens only (dsh-body font-semibold where strong weight wanted; dsh-body-strong is not a token); p0217 drift guard green. Tests: 312 dashboard green (ProjectDetailPanel provenance/per-run/role + ConfigGraph click-selects)."
    p0270a: "MATERIALIZE RESOLVED CONFIG (backend, ersetzend). Replaced the scattered on-demand override arithmetic with ONE IConfigResolver/ConfigResolutionPass: deleted SandboxGlobalConfig.ResolveStepTimeout/ResolveRunCommandTimeout + PipelineCostCapConfig.ResolveFor (moved in); the pass COMPOSES the per-aspect resolvers (resources/agent-image/orchestrator-image) so their arithmetic stays single-source. Run path reads through it (SandboxSpecBuilder step timeout, ExecutePipelineUseCase run_command timeout + cost cap); dashboard reads the same via Materialize() → ResolvedConfig, so no second resolution can drift. Each effective value carries provenance (ResolvedValue<T>{Value,Source: global-default|project-override|run-resolved}) in the SAME object the runtime consumes. Tier A (timeouts/resources/images/cost-cap, agentsmith.yml-derivable) compiled; Tier B (toolchain image from context.yaml/LLM) marked run-resolved, never fabricated. KEY behaviour-preservation: granular ResolveStepTimeout/ResolveRunCommandTimeout (cheap, never throw) for the run path vs full Resolve() (eager images) used only by the resilient Materialize() — the PipelineE2E real-composition harness caught that calling full Resolve() for a timeout forced an orchestrator-image throw on every run; the split restores lazy-at-spawn timing. Materialize() lazy + per-project try/catch (ResolutionError) so observing config never crashes the server; run path keeps fail-loud-at-spawn. /api/config now returns the materialized projection (provenance + trigger semantics: trigger_statuses/done/failed/polling), still a redacted allow-list, still AGENTSMITH_UI_API_ENABLED-gated. Tests: 2513 backend green incl. ConfigResolutionPass characterization + real-composition E2E (presets run end-to-end) + CliShapedDi (real CLI graph resolves) + ServerDi ValidateOnBuild."
    p0266: "DASHBOARD CONFIG EXPLORER (server + dashboard). A read-only System → Config view that visualises the resolved agent-smith config and everything reachable around it — the config-time complement to the per-run TopologyGraph. Backend: GET /api/config (mapped only inside Program.cs's AGENTSMITH_UI_API_ENABLED block, like the run/catalog endpoints) returns a redacted ConfigSnapshot built by ConfigSnapshotMapper — an explicit ALLOW-LIST DTO (Services/Config/ConfigSnapshot.cs + ConfigGlobals.cs) that never references Secrets / ApiKeySecret / RepoConnection.Auth / TrackerConnection.Auth / PersistenceConfig.ConnectionString, so the endpoint structurally cannot leak a secret it never maps (the redaction test serialises the snapshot to JSON and asserts no secret value appears). Repo URLs reduced to host only; persistence surfaced as KIND only. Reachability edges (project → agent/tracker/repo/pipeline) computed by ConfigEdgeBuilder; agent NAME recovered by reference-equality against config.Agents (resolver reuses the catalog instance). Frontend: configApi.ts (typed redacted DTO) + ConfigGraph.tsx (hand-rolled SVG in the TopologyGraph idiom, status-neutral, kind-coloured, shared entities duplicated per project column for a knot-free layout) + ConfigDetail.tsx (globals KvCards + redacted agent/repo/tracker cards via Card/Badge/SectionLabel) composed by ConfigView above the existing config read-events stream in SystemView. dsh-* tokens only (p0217 drift guard green). Dropped the planned UiApiDisabled_Returns404 test — gating is structural, no WebApplicationFactory harness exists (decisions/p0266.yaml). Tests: 2509 backend + 308 dashboard green."
    p0265: "LLM-NAMED TOOLCHAIN IMAGE (backend). The analyzer/context-generator LLM now names the exact sandbox image in context.yaml `stack.image`, and agent-smith consumes it OVER the hardcoded language→image table. Fixes the net8-repo bug: bare 'dotnet'/'csharp' resolved to sdk:9.0, which builds net8.0 but cannot RUN its tests (8.0 runtime/testhost absent) → verification sank. Also unblocks frameworks with no table row (Angular → node:20-bookworm) with no agent-smith glue. Flow: ContextYamlSummary/ContextYamlStack gain Image; ContextYamlSerializer reads stack.image; RemoteContextDiscovery gains ToolchainImage; SandboxLanguageResolver carries it; SandboxSpecBuilder.Build(contextImage) resolves override → validated context image → table → fallback. Validation = supply-chain gate (trusted registry: mcr.microsoft.com/ghcr.io/Docker-Hub-official-library) AND git-bearing tag (shared GitBearingImagePatterns, now single source with the p0194 test); on reject WARN + fall back (no silent defer). No naming/regex heuristic in agent-smith — the LLM decides, agent-smith only validates (feedback_no_language_specific_parsers + feedback_safety_in_api_not_process). PipelineSandboxCoordinator passes the image at all 3 Build sites. Tests: 19 SandboxSpecBuilder image tests + suite green (the 2 pre-existing PipelineHarness FixBug failures are unrelated — fail identically on clean HEAD). Paired skill: context-generator-master emits stack.image (separate agent-smith-skills PR)."
    p0264: "SYSTEM-STREAM UI POLISH (frontend). Three operator-reported bugs in the watch-loop event stream (shared EventDrawer → Tracker polling + Config reads + every subsystem): (1) the kind tag was jammed against the timestamp ('10:08:48DECISION') — 'HH:MM:SS' mono overflowed its w-14 box into the gap; widened timestamp + tag to w-20, gap-2.5→3. (2) the 'Xs ago' freshness didn't COUNT — useSubsystemActivity captured nowMs once per render (useMemo([events])); added a 1s useNowTick() fed into the memo so both the rail label and the detail pane tick live without a refresh. (3) the dense rows read too small — bumped one dsh rung (mono dsh-mono 12→dsh-body 14, body text-sm 14→dsh-h3 16), dsh-* tokens only so the p0217 typography-drift guard stays green. Tests: 303 dashboard green incl. a fake-timer test (freshness 2s→5s on a 3s advance, no new events)."
    p0263: "VERDICT-NUDGE — model-fitness salvage for a missing Phase 4 verdict. A real run (gpt-4.1, ticket 18838) changed + committed source but emitted no parseable ```verdict block, so the RunOutcomeKeystone refused success ('did not emit a verification verdict'). The skill is correct (v3.13.2 has Phase 4) — the gap is the model skipping the closing artifact. Sibling to the p0255 apply-drive: AgenticMasterHandler now, after parsing the verdict, calls ShouldNudgeForVerdict(pipelineName, verification) = (verification is null ∧ pipeline ExpectsGreenTests) and if true re-prompts the master ONCE via loopRunner with BuildVerdictNudge ('changed source but did NOT emit the required Phase 4 verdict; do NOT edit further; build, run tests, emit ONLY the verdict block'), then re-parses. Bounded; the git + verdict keystone still gates. The durable lever stays the model (gpt-4.1 → gpt-5-codex, the only codex model that speaks agent-smith's chat-completions API; 5.1+/5.2/5.3-codex are Responses-only). Tests 2491 green (pure predicate + a sequenced-loop handler test proving the nudge re-prompts and the nudge-pass verdict is honored)."
    p0262: "STATUS RECOGNIZER — derive, don't store. Finished the redesign opened by p0261: the ticket lifecycle status is now DERIVED from the two reliable sources (native ticket status ∈ trigger_statuses = wants work; the ActiveRun lease = running now; Runs = history), and the lifecycle TAGS drive NO decision — pure markers. Removed: the drift-prone TicketLifecycles table (+ entity/config/DbSet/repository + a DropTicketLifecycles EF migration), the DbAuthoritativeTicketStatusTransitioner + factory + the Decorate wrap, the whole StaleJobDetector (+ its p0260 DB-gate), and LifecyclePollFilter. Tag writes are now UNCONDITIONAL in all 4 platform transitioners (dropped the from/Matches precondition — a marker needs none; ETag/rev still guards atomicity), which is what let DbAuthoritative's re-anchor go. The poller (TrackerPoller) skips a candidate while ANY lease is present (in-flight); the claim (SingleClaimRegionExecutor) is lease-only (dropped the ReadCurrent gate — the lease INSERT is the sole single-run guard); recovery of a dead run is entirely the ActiveRunReaper's — it now CANCELS the run (registry + RunCancelRequestedEvent, moved from StaleJobDetector) then releases the lease. Run-end coordinator no longer reads current to anchor the terminal write. Native status is the re-run episode watermark (terminal → reopen = new episode); no separate watermark. The in-progress↔pending loop/thrash class is gone at the root, not gated. Net: less code. Tests 2486 green (incl. unconditional-write matrix across all platforms, poller held-lease skip, reaper cancels-then-releases, claim lease-only). Enqueued/InProgress are no longer read anywhere for claimability."
    p0261: "FAILED-STATUS TERMINALIZATION + tags no longer decisive for triggering. The foundational lifecycle bug (predates relational, masked by the agent-smith:failed tag): only SUCCESS terminalized the native ticket status (FinalizeAsync→done_status); FAILURE posted a comment only and left the ticket New/Active, indistinguishable from untouched. Now: a configurable failed_status (WebhookTriggerConfig.FailedStatus, inherited by all 4 providers; unset→falls back to done_status) is surfaced via ContextKeys.FailedStatus, and PipelineErrorHandler's failure path calls FinalizeAsync(failedStatus) (comment+native-status move in one step, mirroring success) — best-effort, so a deleted ticket can't fail the run/PR. The working-status stays comment-only. SECOND half (they only work together): LifecyclePollFilter no longer excludes Done/Failed — they are status MARKERS, not a trigger criterion; triggering rests on the native status (TrackerPoller.IsStatusAllowed gates trigger_statuses) + the run lease (sole guard since p0251/p0252). So reopen-to-a-trigger-status is the natural re-run. Config guard (ProjectConfigNormalizer): done/failed ∈ trigger_statuses → throw (guaranteed loop); empty trigger_statuses → warn (gate degrades to label-only). Enqueued/InProgress tag-gate kept as a belt; full removal + recognizer + drop TicketLifecycles → p0262. Tests 2505 green."
    p0259: "CANCEL-UX terminal status (backend+frontend). A cancel now reads as a cancel, not a failure: operator/watchdog cancels publish RunFinished(status=cancelled) (ResolveCancelStatus, unit-tested), while a vanished sandbox stays 'failed' so the OOM cause is not hidden behind a calm label. RunCancelRequestedEvent is no longer trail-only — RunEventApplier persists CancelRequested+CancelReason onto the run row, so a navigated/reloaded detail view (read from the DB projection via RunSnapshotMapper) shows 'cancelling…' instead of 'cancel' (the field is the fix, not a snapshot-timing band-aid). The stale-zombie clear also publishes 'cancelled'. Frontend: NodeStatus gains a fifth member 'cancel' (compiler enumerates every palette switch); toNodeStatus/mapResultStatus map 'cancelled'→'cancel'; RunCard makes it terminal (no cancel button) with a neutral badge; the detail view shows a calm slate cancel banner instead of the rose ✕. StatusIcon restyled lighter (soft-tint circle + outline lucide icons, running spins) to answer the 'pompous' note, with Ban as the dedicated cancel glyph — broad restyle flagged for operator review. Tests: backend 2494 (ResolveCancelStatus reason→status; projector persists CancelRequested + terminates cancelled), dashboard 302 (cancel glyph distinct from fail, toNodeStatus mapping, cancelled card has no cancel button)."
    p0253: "RUN-RESULT FIDELITY (steps 1-3,5; step 4 sliced to p0256): result.md no longer contradicts the RunOutcomeKeystone. RunCostSectionWriter's hardcoded 'result: success' now reflects the verdict; RunResultFormatter excludes `.agentsmith/` run-record artifacts from Changed Files + count via the shared RunRecordPaths.IsRunRecordPath (CommitAndPRHandler adopts the same — one 'real code change' definition); WriteRunResultHandler computes the keystone verdict EARLY (recordedChange proxy; the git-authoritative keystone in CommitAndPR stays the hard gate) since result.md is rendered before that step. Canonical-path (step 3): the skill already writes plan→{RunRecordDir} + the framework relocates a loose plan.md — no change needed; the agent's bare-path deviation is model-fitness (p0255). Step 4 (always open a record PR on spend) needs a live sandbox repro → p0256. Tests: meta-only+failure→result:failed+0 changes; real edit→success+listed. 2484 backend + 298 dashboard green."
    p0255: "MASTER PLANS BUT DOES NOT EXECUTE: forensics confirmed the coding-agent-master SKILL is already correct (instructs plan→{RunRecordDir}, forbids zero-edit finish) — gpt-4.1 ignored it (correct plan.md, 0 source writes). So it's MODEL-fitness, not a skill/framework defect. Framework apply-drive added: after the master returns, if the preset expects code (ExpectsCodeChanges) but only run-record artifacts were written, re-prompt the master ONCE with a focused 'apply your plan now' nudge (BuildApplyNudge) and re-read changes; the git-authoritative keystone stays the final gate. Trigger extracted as pure ShouldDriveApply (5 unit tests). Model choice (move off gpt-4.1) surfaced as the operator's lever, not silently changed."
    p0254: "SESSION LOOSE ENDS closed: (1) committed the /system/tracker SignalR fix (SystemBacklog batch + List<object> polymorphic serialization + client single-render pushMany + ScopeBuffer dedup) — code committed; live deploy-verify (rebuild server+dashboard) is the operator's step. (2) De-flaked the two parallel-load tests deterministically: PipelineRunWatchdogTests now drives ScanOnceAsync (made internal) directly instead of racing RunAsync against a 100ms token; NoLibGit2SharpInGraphTests.SafeGetTypes catches ALL load exceptions (a sibling test loading an assembly threw non-ReflectionTypeLoadException). These two were the recurring red across p0251/p0252. Full suite green."
    p0252: "RETIRE the Redis job heartbeat as a liveness source (closes 'ein Weg' — one authoritative liveness signal = the DB ActiveRun lease). Deleted IJobHeartbeatService + JobHeartbeatService + NullJobHeartbeatService entirely: EnqueuedReconciler and StaleJobDetector now read lease freshness (shared StaleJobDetector.LeaseFreshFor), the claim drops MarkClaimedAsync, the lifecycle coordinator drops heartbeat.Start. KEY design fix (validated, operator-approved): AttachRunAsync is now an UPSERT — the legacy/PR-comment spawn carries a TicketId and goes InProgress but never claims, so UPDATE-only left it leaseless and the now-removed heartbeat was its only stale-protection; insert-if-absent makes EVERY in-flight run lease-backed, so StaleJobDetector can never cancel a live leaseless run, and direct-spawns gain single-run + reaping (supersedes p0242's 'PR-comment exempt'). Kept the sandbox-agent HeartbeatLoop (different, in-sandbox signal). New SQLite tests: AttachRun-on-absent inserts a fresh lease, AttachRun-on-existing updates in place (no 2nd row); reconciler + stale-detector retargeted to lease freshness. 139/139 focused subset green; full suite 2476/2477 with the lone red a pre-existing parallel-load flake (NoLibGit2Sharp / PipelineRunWatchdog, both green in isolation, both unrelated)."
    p0251: "DB-AUTHORITATIVE CLAIM — closed the recurring 'AlreadyClaimed → ticket stuck pending' that needed manual clearing 3x in one session. SingleClaimRegionExecutor gated the claim on the VOLATILE Redis heartbeat (heartbeat.IsAliveAsync) BEFORE the DB lease; removed that pre-check so the DB ActiveRun UNIQUE lease (p0246b, released on finish via p0242, always-on server-side via p0246g) is the SOLE single-run guard — survives a label revert AND a Redis flush. CORRECTED the spec's premise: the Redis heartbeat DOES have a release-on-finish (JobHeartbeatService compare-and-delete on the lifecycle-scope dispose, PipelineExecutor await using); it lingers only in an edge case (a run that never starts leaves MarkClaimedAsync's 'claimed' bridge, which the run-id compare-and-delete cannot clear), and as a hard gate that linger blocked the next claim. Kept MarkClaimedAsync as a liveness HINT for StaleJobDetector (gated behind DB-lease freshness) + EnqueuedReconciler. Regression pinned: lingering heartbeat + free lease → Claimed; lease held → AlreadyClaimed regardless of heartbeat; concurrent single-run already proven on real SQLite (ActiveRunLeaseTests). 2478 backend green (+2 new claim-path tests; lone red is the pre-existing NoLibGit2Sharp parallel-load flake, green in isolation). Heartbeat full retirement carved to p0252."
    p0209c: "Rollup views: Cost + Today's-activity KPI grids as Rollups rail items (slugs cost/today on /system/[[...slug]]); RollupCards is the prop-driven .kcard grid wired by RollupCardsView; reuses existing rollup data via costKpis (useCostRollup: today/7d/calls-7d) and activityKpis (SystemActivitySnapshot: scanned/triggered/skipped/poll-cycles/webhooks-received/actioned) — restyle + relocate only, no new backend/aggregation"
