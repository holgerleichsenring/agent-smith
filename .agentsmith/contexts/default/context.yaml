    p0496: "A REUSED WORK BRANCH TAKES ITS BASE WITH IT (sandbox checkout, bootstrap refusal). A re-run reported on a stale branch. Now only a branch the run composed is merged with origin/HEAD, identity first, a conflict aborts and stops before anything is pushed, and the refusal names the paths it read. -> .agentsmith/phases/done/p0496-a-reused-work-branch-learns-what-its-base-learned.yaml"
