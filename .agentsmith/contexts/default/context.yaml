    2026-08-25-0d01: "THE SANDBOX SAYS WHICH PROTOCOL IT SPEAKS (agent version, wire, tolerance). The tag is derived from the server's release, a pin still wins and is reported advisory, the wire's dead version field got a reader and a stated window, and an unknown message kind is answered instead of dying as a vanished sandbox. -> .agentsmith/phases/done/2026-08-25-0d01-the-sandbox-says-which-protocol-it-speaks.yaml"
