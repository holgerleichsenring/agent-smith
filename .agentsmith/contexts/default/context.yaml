    p0392a: "SAVING NEVER OVERWRITES WHAT IT CANNOT SEE (server + dashboard). p0392 closed the field gap for trackers and connections and measured what is left: repos, project blocks, agent knobs, pipeline_triggers (no CRUD at all) and twelve settings singletons. The remainder is a DIFFERENT defect: a TS shape omitting a backend field sends that field's DEFAULT back on save, so opening a section and pressing save destroys whatever the CLI, an import or an older UI had configured — silently. That is data loss with a save button on it, not a missing input. So the fix is partial-write safety (absent means unchanged, or refuse an incomplete document) as well as the missing fields; declaring the fields alone would close today's instances and leave the mechanism that makes the next one. -> .agentsmith/specs/planned/p0392a-saving-never-overwrites-what-it-cannot-see.yaml"
