    p0371: "DEPENDENCY-VERSION DIAGNOSIS (skills coding-agent-master + optional backend nudge). Root cause of the failed library migration (verified by rebuilding the output locally): the master wrote correct code but pinned a shared messaging package at the WRONG version (a needed interface type exists only from a later version) + invented a namespace, then spent ~65 min EDITING CODE around the missing type (CS0246 x24) instead of forming 'type-not-found => wrong/missing package VERSION => check the feed/ticket version'. The ticket's stated version was itself stale, so blind ticket-obedience also fails. Fix = a PROMPT behaviour: on type/namespace-not-found, dependency-first (is the owning package referenced? does its pinned version actually contain the type? verify against the feed, not memory); apply explicit ticket dependency values precisely AND verify; bound the flail (few edits on the same unresolved symbol -> diagnose dependency or emit honest blocked). NOT shipped as done — a prompt-behaviour change is only real once LIVE-validated by a re-run of the migration ticket (operator's acceptance test). Cost of the flail is already bounded by p0365 (empty-pass) + p0368 (ledger); this attacks the cause. -> .agentsmith/specs/planned/p0371-dependency-version-diagnosis.yaml"
    p0342: "MCP TOOL INTEGRATION (backend + dashboard + skills). Let a coding run call the tools of EXTERNAL MCP servers (Jira/GitHub/DB/filesystem MCP) allow-listed for its project — agent-smith has NO MCP today (grep-verified: no client, no server, p0166 unbuilt; the studio's mcp_servers entity is a catalog nothing consumes). Pinned to ModelContextProtocol.CORE 1.1.0 — forced, not preferred: it is the last version depending on M.E.AI.Abstractions 10.3.0, our exact p0185 pin. McpClientTool derives from M.E.AI AIFunction, so tools drop into ComposeMasterTools with no adapter. Remote SSE/streamable-HTTP first (stdio -> p0342b: spawned-orchestrator pod would need the server binary baked in). TRUST via allow-list in the type system: a run sees only its project's referenced servers, unlisted refs rejected at resolve; MCP tools are run_command-class capabilities. EVERY master surface (coding/scan/spec-dialog/sub-agents) — a feature only some skills reach is not a capability; the master-TYPE gate is REPLACED by a PIPELINE CATEGORY axis (mcp_servers.*.pipelines multi-select over PipelinePresets.Names, empty = all, compared via Canonical() so an alias cannot silently drop a server), so the effective set = project allow-list INTERSECT pipeline category INTERSECT per-server tool allow-list. Fail-open on an unreachable server (log + proceed, like the web surface); external tool names namespaced server/tool so they can't shadow a built-in. DISCOVERY IS TWO LAYERS: the tool array lets the model CALL, a rendered {McpToolsSection} block (p0356 toolchain-statement pattern, only servers that actually mounted) lets it PLAN — carried through as a skills release + embedded-pin bump, not deferred. Transport becomes a closed enum served on /api/config/capabilities and rendered as a select, replacing the studio's free-text field and its hardcoded 'http' default. -> .agentsmith/specs/planned/p0342-mcp-tool-integration.yaml"
