    2026-08-28-0f46: "A SESSION RETURNS WITHOUT A TEN-SECOND WAIT (dashboard sign-in, hub). The silent frame loaded the reply route and completed a REDIRECT, notifying nobody, so every load paid the 10s timeout. The route now dispatches on request_type, the session survives a reload, and a refused first hub start is not latched. -> .agentsmith/phases/done/2026-08-28-0f46-auth-session-restore-no-wait.yaml"
    2026-08-28-3793: "THE SERVER HANDS OUT THE ARCHIVE IT HOLDS (/api/archive + the installation surface). Own permissions archive.export/import; the export streams, the import spools to a file under its own 8 GiB ceiling; refuses on a RECORDED RUN, clearing the server's own bookkeeping; reloads config + bumps the epoch. -> .agentsmith/phases/done/2026-08-28-3793-data-archive-dashboard-transfer.yaml"
    2026-08-28-b883: "A COST COLUMN KEEPS EVERY DIGIT IT IS GIVEN (SQL Server money columns: call cost, run total, budget cap). decimal(18,2) rounded every per-call cost to 0.00; WidenMoneyPrecision widens all three to decimal(18,10), on SQL Server alone so the shared snapshot stays as it is. Already-rounded rows stay rounded. -> .agentsmith/phases/done/2026-08-28-b883-persistence-cost-column-precision.yaml"
    2026-08-28-2af6: "AN INSTALLATION EXPORTS EVERY TABLE IT HOLDS (persistence archive + `agentsmith archive`). One zip: manifest + a JSONL per table. Import refuses a differing schema head NAME or a non-empty target, suspends audit stamping, does IDENTITY_INSERT per table, verifies counts. SQLite->SQL Server live. -> .agentsmith/phases/done/2026-08-28-2af6-data-archive-export-import.yaml"
    2026-08-28-c310: "THE EVAL GATHERS EVIDENCE THE WAY A RUN DOES (account eval harness). Its private diff loop dropped the base ref, so the account under test lost search_base while a fixture turns on the base. It gathers through DeliveryEvidence now, and a missing tool throws. First baseline, gpt-4.1: FN 1/4, FP 0/2. -> .agentsmith/phases/done/2026-08-28-c310-account-eval-evidence-parity.yaml"
    2026-08-27-559e: "THE OVERVIEW READS AS CARDS NOT STRIPS (dashboard: /overview layout, .mock-overview scope). Three cards — spend, runs, criteria met — over a two-column row of breakdown and criteria panels in a 1240px column; seven-cell outcome strip dropped, criteria read lifted to one hook, long repo sets truncate. -> .agentsmith/phases/done/2026-08-27-559e-overview-cards-layout.yaml"
    2026-08-27-7463: "THE OVERVIEW PAGE REPLACES THREE ROLLUPS (dashboard: /overview route, rail Insight entry, system view). Spend with a repo+pipeline breakdown summing to it, runs by outcome and criteria outcomes on one page, one hub read, sections fail alone. Today's rollup deleted, its numbers already on Tracker/Webhooks. -> .agentsmith/phases/done/2026-08-27-7463-overview-page-replaces-rollups.yaml"
    2026-08-27-1ed6: "THE HEADER CARRIES ACCOUNT AND CONFIGURATION (dashboard shell: header, places table, rail, config routes). Gear + account in a two-row grid; rail loses its toggle, identity, release and footer, keeps the observed tracker name; installation read-out and connection check move under /config with redirects. -> .agentsmith/phases/done/2026-08-27-1ed6-dashboard-header-account-config.yaml"
    2026-08-27-729e: "AN INSTALLATION STATES WHAT IT IS RUNNING (anonymous read-out route, persistence probe, rail + system segment). Server build, the sandbox-agent version per project and the database provider + pending-migration count on one surface; the dashboard adds its own stamped release locally. No new mismatch finding. -> .agentsmith/phases/done/2026-08-27-729e-installation-status-page.yaml"
    2026-08-27-7098: "STARTING A RUN ANSWERS AT ONCE (init admission, server exception handling, repo preflight, dashboard). The corpse sweep left the request path; an unhandled throw now answers with its reason instead of an empty 500; the preflight probes connection-discovered repos; the button shows the reason with the code alongside. -> .agentsmith/phases/done/2026-08-27-7098-run-start-answers-at-once.yaml"
    2026-08-27-3eb1: "A REPOSITORY SWEEP FITS THE MODEL WINDOW (scout chain, model role, preflight). A role states context_window_tokens; compaction reaches any tool loop that has one, the pass finalises before the window, directory_tree and one scout result are capped, preflight names a threshold that cannot fire. -> .agentsmith/phases/done/2026-08-27-3eb1-analyzer-sweep-model-window.yaml"
    2026-08-26-31e5: "A FINISHED PHASE IS RECORDED IN ITS CONTEXT (phase-record step, context write path, docs). The step wrote the done/ record since p0315d and never the state.done line naming it. Routed by sandbox, upserted by phase id, newest first, spliced so nothing else changes. -> .agentsmith/phases/done/2026-08-26-31e5-phase-record-in-target-context.yaml"
    2026-08-26-04b6: "A CONTEXT KEEPS JUDGEMENT AND DROPS READINGS (context schema, write path, template, docs). All 41 fields classified in the schema as judgement, mechanism or reading; the 15 readings are deprecated-but-accepted and no longer written or asked for; state, decisions and registry_auth untouched. -> .agentsmith/phases/done/2026-08-26-04b6-context-drops-derivable-readings.yaml"
    2026-08-26-364f: "A CONTEXT WRITE PRESERVES WHAT IT DOES NOT MODEL (context write path). The typed record models seven sections, the write emitted the whole file, so a re-init deleted state, methodology, integrations, data and decisions. It now reads first, replaces the stated keys, and refuses an unparseable file. -> .agentsmith/phases/done/2026-08-26-364f-context-write-preserves-unmodelled.yaml"
    2026-08-26-5c85: "A DISCOVERED REPO CARRIES ITS SUBGROUP PATH (backend: GitLab discovery, glob expansion, multi-repo path routing). A repo is named group-relative from path_with_namespace, and FilesystemToolHost routes by longest runner key so a slash-named repo stays addressable. -> .agentsmith/phases/done/2026-08-26-5c85-gitlab-discovery-subgroup-path.yaml"
    2026-08-26-7a51: "AN ADMIN GRANTS A ROLE TO A PERSON (backend + dashboard + migrations + docs). A grant stores {claim,value} and resolves only under the configured name_claim; callers are observed off the request path; the invariant sits on the document store, so save, import, revert and the migration all pass it. -> .agentsmith/phases/done/2026-08-26-7a51-auth-role-grant-dashboard.yaml"
    2026-08-25-1806: "A ROLE MAPPING CHANGES WITHOUT A RESTART (role resolution, config store, studio, identity). The four mapping fields became a store singleton, edited in the studio and asked per request; a file mapping imports once at boot; a bundle is picked from the closed catalog; a refused token is named. -> .agentsmith/phases/done/2026-08-25-1806-auth-role-mapping-store.yaml"
    2026-08-25-3277: "EVERY LOADER KEEPS THE REFUSAL IT WAS GIVEN (dashboard loaders). A loader storing err.message discarded the typed refusal, so a signed-out operator read a sentence where a sign-in button belonged. Loaders hold the thrown value; nine panes render the refusal surface. -> .agentsmith/phases/done/2026-08-25-3277-dashboard-loader-keeps-refusal.yaml"
    2026-08-25-e257: "THE OPERATOR OVERRULES A CRITERION VERDICT (backend + dashboard). A false negative was invisible: a wrong refusal looks like a right one. One judgement per run and criterion, in its own row so a re-snapshot cannot destroy it, keyed by text not position. A label, never a control. -> .agentsmith/phases/done/2026-08-25-e257-account-operator-overrule.yaml"
    2026-08-25-7f5a: "THE VERIFY CARD SHOWS THE DELIVERY ACCOUNT (backend + dashboard). The page was built from the master's own dispositions while the GATE decided on the phase spec's criteria: a live run failed naming three criteria while the card said 'no ratified contract'. The snapshot now names its judge. -> .agentsmith/phases/done/2026-08-25-7f5a-run-viewer-verify-card-account.yaml"
    2026-08-25-9749: "A NOT-APPLICABLE CRITERION CITES ITS BASE SEARCH (delivery account). Three dispositions replace the bool at ten readers; n/a needs a cited base search that found nothing and a named antecedent, else it degrades. A phase satisfying nothing fails, naming what it declined. Eval unmoved: FN 1/4, FP 0/2. -> .agentsmith/phases/done/2026-08-25-9749-account-not-applicable-criterion.yaml"
    2026-08-25-6f12: "A CRITERION NO WINDOW SATISFIED IS RE-ASKED (delivery account). One full-reach pass over what the windows left unsatisfied: no diff body, the whole file list, search over branch and base, on a per-pass allowance the windows cannot spend. Raises only, runs once. Eval noisy: FN 0-2/4, FP 0-1/2 over 7 runs. -> .agentsmith/phases/done/2026-08-25-6f12-account-whole-branch-re-ask.yaml"
    2026-08-25-0eae: "THE ACCOUNT SEARCHES THE BASE REF (delivery account). Two of three criteria a live migration failed on were quantified over the BASE — 'where X was previously configured' — and the account could only see the branch. It now reads the ref the delivery diff used, and every search names the ref it read. -> .agentsmith/phases/done/2026-08-25-0eae-account-base-ref-search.yaml"
    2026-08-25-1360: "EVERY WINDOW SEES THE WHOLE FILE LIST (delivery account). A split delivery showed each window a PARTIAL list under a heading calling it complete, then refused any criterion it could not tie to a file. The rule now says a listed file proves a change, not its content. -> .agentsmith/phases/done/2026-08-25-1360-account-window-whole-file-list.yaml"
    2026-08-25-7035: "THE DELIVERY ACCOUNT HAS AN EVAL (pipeline harness, opt-in tier). Fourteen phases tuned this judge on single anecdotes, because a false negative is invisible. A fixture is a base tree + branch tree materialised as real git repos, so the real account with its real search tool is scored in BOTH directions. -> .agentsmith/phases/done/2026-08-25-7035-account-eval-labelled-runs.yaml"
    2026-08-25-4530: "A SIGNED-OUT DASHBOARD SAYS SO INSTEAD OF FAILING (dashboard refusals, identity, banner). 401/403 leave the one outgoing point as a refusal that renders: sign-in offers sign-in, a missing permission names itself. Plus the identity page, the rail name + sign-out, a banner naming the unconfigured half. -> .agentsmith/phases/done/2026-08-25-4530-auth-signed-out-dashboard.yaml"
    2026-08-25-2de1: "A BROWSER SIGNS IN AND CARRIES THE TOKEN (dashboard). Generic OIDC code+PKCE (oidc-client-ts) against the configured authority, a memory-only token store renewed before expiry, emptied on failure, a bearer on apiFetch, a factory on the hub handshake, sign-out, /signin-callback. No authority = nothing happens. -> .agentsmith/phases/done/2026-08-25-2de1-auth-browser-sign-in.yaml"
    2026-08-25-21ae: "A SETTING CHANGES WITHOUT A REBUILD (dashboard entrypoint, settings provider, deploy). Next inlines NEXT_PUBLIC_* at build time, so a per-installation value cost a rebuild. The entrypoint writes a public settings document into the static root; one no-store read above the routes resolves it, absent means OFF. -> .agentsmith/phases/done/2026-08-25-21ae-dashboard-runtime-settings.yaml"
    2026-08-25-2103: "THE IMAGE BUILD COPIES WHAT THE BINARY EMBEDS (server + CLI Dockerfiles). An embedded schema was not in the build context, so every image died at publish with CS1566 while the checkout built green. Root schemas copy as a set, and a rule holds the pair. -> .agentsmith/phases/done/2026-08-25-2103-image-build-copies-embeds.yaml"
    p0521: "A PHASE NAME FITS A LINE (architecture rules, CLAUDE.md, authoring skill). Slug 50 chars and 4 words, goal 200 — judged for the date-minted namespace only, because date ids sort BELOW counter ids and an ordering cutoff would have governed nothing. The embedded schema keeps its limit: the deployed fallback throws on an invalid draft. -> .agentsmith/phases/done/p0521-phase-name-length-rule.yaml"
    2026-08-25-5d7a: "A STEP PAGE KNOWS WHICH STEP IT IS (dashboard run detail). A step longer than one page opens past its own StepStarted, so the composer bucketed nothing and the pane read \"no sub-events\" while load-older visibly did nothing. The pane now names the step it fetched. -> .agentsmith/phases/done/2026-08-25-5d7a-run-viewer-step-page-identity.yaml"
    2026-08-25-5266: "THE SHIPPED SAMPLES PASS THE RULES WE SHIP (three context files + a discovery test). All three named an image; this repo's fallback resolved to an SDK that cannot build it. The demo's dead ci block is gone. A discovery test holds every shipped context to the product's own rule objects. -> .agentsmith/phases/done/2026-08-25-5266-context-shipped-samples-pass-rules.yaml"
    2026-08-25-2c7c: "A NUMBER IN A DRAFT IS VALIDATED AS A NUMBER (the YAML-to-JSON bridge). Every scalar arrived as a string, so integer rules false-rejected correct input AND string rules laundered a bare number into acceptance. One conversion now serves production and the arch tests; quoting still means string. -> .agentsmith/phases/done/2026-08-25-2c7c-spec-draft-typed-scalars.yaml"
    2026-08-25-0d01: "THE SANDBOX SAYS WHICH PROTOCOL IT SPEAKS (agent version, wire, tolerance). The tag is derived from the server's release, a pin still wins and is reported advisory, the wire's dead version field got a reader and a stated window, and an unknown message kind is answered instead of dying as a vanished sandbox. -> .agentsmith/phases/done/2026-08-25-0d01-sandbox-protocol-version-negotiation.yaml"
    2026-08-25-014d: "AN IMAGE IS JUDGED BY WHAT IT CONTAINS (image trust + selection). Registry policy is now global operator config with the library-namespace shape as its own switch, and the git name-guess is gone — a missing git fails at the clone with a named cause. Closed a bypass: a registry port was read as a tag. -> .agentsmith/phases/done/2026-08-25-014d-image-registries-and-tool-discovery.yaml"
    2026-08-25-8c97: "BOTH HALVES SAY WHICH BUILD THEY ARE (images, findings, banner). The release string is identical on ~93% of builds, so the incident's two images would have matched. Identity is the commit sha, stamped into both images, compared on the findings poll, shown as advisory with a reload — never as a compatibility claim. -> .agentsmith/phases/done/2026-08-25-8c97-build-identity-stamping.yaml"
    2026-08-25-c9c7: "A CONTEXT THAT DESCRIBES A STACK NAMES ITS IMAGE (context write path). Omitting the stack block bypassed the rule. Now a domain exempts, anything else names an image, the document is judged against the schema with the offending node quoted, and refusals are budgeted so a rewrite cannot spin. -> .agentsmith/phases/done/2026-08-25-c9c7-context-image-declaration.yaml"
    2026-08-26-167c: "THE VOCABULARY SUGGESTS (context schema, gate, bootstrap round). Six descriptive enums opened to a bounded free value, four decided stay closed; a single value reads as a list of one; defects group by rule, quoted once, bounded by size; a refused write is no longer a green round. -> .agentsmith/phases/done/2026-08-26-167c-context-vocabulary-suggests.yaml"
    2026-08-25-39ab: "THE DASHBOARD SURVIVES AN UNKNOWN PAYLOAD (dashboard + gate). It had no error boundary at all, so one render throw blanked the document. Three boundary layers, snapshot fields typed optional so the compiler found all 30 unguarded reads, one response reader, and the gate now runs the dashboard tests. -> .agentsmith/phases/done/2026-08-25-39ab-dashboard-unknown-payload-error.yaml"
    2026-08-25-056d: "THE SCHEMA DESCRIBES THE FILE IT VALIDATES (context schema + typed document + template). It produced 632 errors against this repo's own context and rejected a block the methodology mandates. Reconciled both ways; meta.type became the array it always was in practice. Both shipped files now validate. -> .agentsmith/phases/done/2026-08-25-056d-context-schema-matches-writer.yaml"
    2026-08-25-61f1: "A RECORDED FACT IS WRITTEN ONCE (trail, per-call, step, decision rows). A replay stored every row 42 times and the cost was summed from them. Rows now carry their event position, the write is insert-if-absent so a duplicate is a no-op and not a lost batch, and the repair runs before the constraint it enables. -> .agentsmith/phases/done/2026-08-25-61f1-trail-row-uniqueness.yaml"
    2026-08-25-a508: "A QUESTION ASKED TWICE HAS TWO IDENTITIES (checkpoint, ask gate, sweeper). One constant id meant one answerable question per run; a second park found the first leg's spent answer and resumed on it. Identity is minted per ask, the ticket LABEL stays Q1, and a park with no checkpoint is a finding. -> .agentsmith/phases/done/2026-08-25-a508-question-identity-per-ask.yaml"
    p0515b: "THE STORE REFUSES A NAME THAT COLLIDES (config document store + import). A save whose stored match was a different spelling took the update branch and replaced the entity, with no expected version to catch it. Now refused at the write and before an import clears anything, naming both spellings. No index, no migration. -> .agentsmith/phases/done/p0515b-config-unique-names-in-store.yaml"
    p0496: "A REUSED WORK BRANCH TAKES ITS BASE WITH IT (sandbox checkout, bootstrap refusal). A re-run reported on a stale branch. Now only a branch the run composed is merged with origin/HEAD, identity first, a conflict aborts and stops before anything is pushed, and the refusal names the paths it read. -> .agentsmith/phases/done/p0496-work-branch-merges-base.yaml"
    p0465: "A REAPER ONLY REAPS ITS OWN (both spawners, both reapers, capacity probe). Daemon-wide and namespace-wide queries let a second server kill the first's sandboxes. Ownership is now the liveness store's fingerprint — restart-stable, shared by replicas — read in the query, and a reaper that cannot judge does not run. -> .agentsmith/phases/done/p0465-sandbox-reaper-own-deployment.yaml"
    p0515: "ONE NAME IS ONE ENTITY HOWEVER CAPITALISED (config resolution + launch). A lowercasing loader over ordinal catalogs made a capitalised name unresolvable and left a queued row nobody finished. Now one shared ignore-case rule, the raw pre-resolution lookup fixed, collisions named, names canonicalised before they key a row. -> .agentsmith/phases/done/p0515-case-insensitive-config-identity.yaml"
    p0413a: "EVERY RUN IS ESTIMATED (scope handler, cost cap, harness). A single-repo run returned before its tier was recorded and derived blind on the default cap. The estimate now rides the one classification call it owns, survives a reply with no repo list, and a tier RAISES the resolved cap instead of replacing it. -> .agentsmith/phases/done/p0413a-process-tier-repo-count-neutral.yaml"
    p0282c: "SUPERSEDED (2026-08-25) by p0402, which shipped the 120-line class bound as FileLengthRatchetTests over a baseline. Moved to done/ unimplemented under this id. -> .agentsmith/phases/done/p0282c-god-class-decomposition.yaml"
    p0282a: "SUPERSEDED (2026-08-25) by p0401/p0402, which shipped the static-to-service conversion and its NoStaticStateRuleTests guard. p0401a carries the named remainder (four codec statics). Moved to done/ unimplemented under this id. -> .agentsmith/phases/done/p0282a-eliminate-static-services.yaml"
    p0314: "WITHDRAWN (2026-08-25): the reference debt it was cut to triage shrank on its own — measured today, 78 never-created ids and 151 dangling mentions against the 274/1153 the spec names. Re-cut if the count grows again. -> .agentsmith/phases/done/p0314-phase-reference-triage.yaml"
    p0431: "RETIRED (2026-08-25, superseded before it was built): p0453 kept the checkpoint-and-resume half this phase proposed to remove, so its premise no longer holds — 2026-08-24-ca23 then repaired that very path. Moved to done/ as historical record, never implemented. -> .agentsmith/phases/done/p0431-retire-durable-dialogue.yaml"
    2026-08-24-ca23: "A WAITING RUN IS NOT A FINISHED RUN (drain, trail, cancel). A pause published the terminal event, so the drain dropped its position and replayed the run's history on relaunch — 42x rows and cost. The position survives a wait and a restart, the sequence seeds from the store, both cancels finalize via the projection. -> .agentsmith/phases/done/2026-08-24-ca23-run-relaunch-appends-not-replays.yaml"
    2026-08-24-1cdc: "A TEST SUBSTITUTES ITS INFRASTRUCTURE (tests + one server seam). Booted cases pointed at a dead Redis and paid ~26s each; the rig installs an in-memory transport, starts no product hosted service, shares one migrated schema. Only a case whose subject IS the wait stays dead. 607s -> 75s. -> .agentsmith/phases/done/2026-08-24-1cdc-test-boot-substitutes-infrastructure.yaml"
    p0507: "A PHASE ID CAN BE MINTED OFFLINE (backend + hooks + dashboard + plugin + catalog). A second id namespace, {yyyy-MM-dd}-{4 hex}, valid beside the closed counter namespace in both schemas, the record rules, the gate marker, DecisionFileLabel, RequiresEdgeChecker and both step-label readers. Nothing renamed. -> .agentsmith/phases/done/p0507-phase-id-minted-offline.yaml"
    p0517: "THE HUB REFUSES WHAT THE CALLER MAY NOT DO (backend). An IHubFilter resolves p0503c's table by HubMethodName and refuses an invocation the caller lacks the permission for, gated on p0503b's enforce switch; OnMessageReceived installs the handshake reader. A method absent from the table is refused. -> .agentsmith/phases/done/p0517-auth-hub-permission-enforced.yaml"
    p0503e: "AN AUTHORITY THAT CANNOT BE REACHED STILL ANSWERS (backend auth). A recurring probe records an unreachable authority as the server's own finding — blocking iff enforce is on, project-less — and clears it on the first passing pass; the 401 then says temporarily_unavailable, not invalid_token. No 503. -> .agentsmith/phases/done/p0503e-auth-unreachable-authority-answer.yaml"
    p0514: "A CUSTOMER CATALOG ADDS TO OURS INSTEAD OF REPLACING IT (catalog resolution + docs). skills.overlay layers a directory onto any resolved source, materialised into one fingerprint-cached root by file-level union, so every master the operator did not write still comes from the pin and the run names both. -> .agentsmith/phases/done/p0514-catalog-customer-overlay-adds.yaml"
    p0504: "A DOMAIN IS A PROFILE, NOT A PARAGRAPH (backend + skills catalog). meta.domain names a profiles/<name>/profile.yaml in the catalog, bringing an image (below every declared one) and ordered verify commands (in the skip branch). Unknown domain refuses pre-sandbox; doctor asks without a run. -> .agentsmith/phases/done/p0504-domain-profile-declaration.yaml"
    p0518: "THE DESCRIPTION CAP HAS ONE NUMBER (backend + skills catalog). The packaging gate and the parse-time gate each declared 200 while the catalog's shell gate declared 180; all three now apply one shared rule at 200 and refuse block scalars, and the catalog ships its cap in the tarball so a disagreement fails the build. -> .agentsmith/phases/done/p0518-catalog-description-cap-one-number.yaml"
    p0516: "A NAME GETS IN BY MORE PATHS THAN THE GATE WATCHES (repo tooling). The fingerprint guard saw only Write|Edit|MultiEdit; it now covers writing Bash calls scoped by cwd, core.hooksPath chains git-secrets, the list moved outside every repo, and CI scans the pushed range. -> .agentsmith/phases/done/p0516-customer-name-guard-paths.yaml"
    p0503c: "THE HUB NAMES ITS PERMISSIONS AND THE TOKEN LEAVES THE CONSOLE (backend). Eleven hub methods get a permission table (new runs.watch for the sandbox pair), a pure handshake reader lifts access_token off the hub query, both console formatters redact it. Enforcement is p0517. -> .agentsmith/phases/done/p0503c-auth-hub-token-handshake.yaml"
    p0503a: "EVERY ROUTE STATES THE PERMISSION IT NEEDS (backend). All 75 mapped routes plus the hub declare a permission or an anonymous reason, in metadata the framework does not inspect, so nothing changes at runtime. 14-permission catalog, roles as bundles, golden route-table guard. Supersedes p0301. -> .agentsmith/phases/done/p0503a-auth-route-permission-metadata.yaml"
    p0503b: "A TOKEN IS VALIDATED AGAINST ONE AUTHORITY (backend auth pipeline, bootstrap, deploy templates). JwtBearer against one OIDC authority from file or AGENTSMITH_AUTH_*; a fallback policy of one requirement per permission, gated on the enforce switch; a 403 naming what was missing; an unusable block is advisory. -> .agentsmith/phases/done/p0503b-auth-token-validation-authority.yaml"
    p0503d: "A CLAIM BECOMES A ROLE BECOMES A PERMISSION (backend role resolution, identity endpoint, config attribution). Roles from a role claim or a group mapping (MapInboundClaims off), additive custom roles, an env admin grant, overage detection, GET /api/identity, and X-Actor deleted. -> .agentsmith/phases/done/p0503d-auth-claim-role-permission.yaml"
    p0487: "THE PIN CARRIES THE ARTIFACT RULE (backend). Embedded skills catalog v4.5.0 -> v4.6.0, the release carrying p0486\"s artifact-capture rule; its four pin-gated guards flipped from stating the gap to asserting it, with no test edited. The example config names v4.6.0 too, so the tag records which catalog a release runs on. -> .agentsmith/phases/done/p0487-skills-pin-artifact-rule.yaml"
    p0509: "A PHASE ID A RULE CANNOT READ IS A PHASE ID NOBODY CHECKS (backend tests). PhaseIdFactory mints ticket-derived ids like p19106a, read as p1910 through an unanchored pattern. Extraction now reaches the value\"s end, the counter branch unchanged; duplicate-id p0131c left the baseline. -> .agentsmith/phases/done/p0509-phase-id-reader-widened.yaml"
    p0508: "THE GATE READS THE MESSAGE IT IS GATING (repo tooling). The gate matched the phase marker against the raw command string, so --amend --no-edit, -F, -t and -C passed unchecked and indistinguishably from a pass. A resolver now yields the message the commit will carry; what cannot exist yet passes loudly. -> .agentsmith/phases/done/p0508-phase-gate-reads-commit-message.yaml"
    p0510: "THE CONFIG STUDIO ROUTES FIT IN THE FILES THAT MAP THEM (backend). One 245-line file mapped all thirty-nine config-studio routes, with no room for the annotations p0503a needs. Split by route surface into six files plus a write guard, all under the limit; its baseline row left with the lines. -> .agentsmith/phases/done/p0510-config-studio-routes-split.yaml"
    p0506: "AN UNSIGNED REQUEST IS NOT A TRIGGER (backend + deploy). An absent signature header was accepted whatever the secret said, so an unsigned POST could start a run or answer a blocked master. Now refused wherever a secret is set; ${...} is expanded so a placeholder is not one; run control sits behind the dashboard gate. -> .agentsmith/phases/done/p0506-webhook-signature-required.yaml"
    p0511: "THE GATE COVERS THE AGENTS THAT DO THE WORK (repo tooling). An instrumented worktree copy never logged, yet a phase commit still blocked: CLAUDE_PROJECT_DIR is the launching session's dir, so ONE shared script gates every worktree. Adds a ledger line per phase commit and a loud pass for a shell-built message. -> .agentsmith/phases/done/p0511-phase-gate-covers-subagents.yaml"
    p0505: "A DATA REPO IS VERIFIED BEFORE IT IS DEPLOYED (backend harness). 123 measured rows over dbt/bundle/combined fixtures: check-jsonschema, sqlfluff and deps-then-parse red on named defects; bare dbt parse and bundle validate red on CLEAN, so neither is declarable. Offline guard recomputes hashes and verdicts. -> .agentsmith/phases/done/p0505-domain-data-repo-fixture-proof.yaml"
    p0513: "THE PROFILE SHIPS THE GATE THAT SURVIVED (backend + skills). A profile command declares when_present, a path it needs, so p0505's per-shape evidence stops reding clean repos of another shape and hiding real gates. Ships the dbt-databricks profile; a test refuses any command the table does not record as declarable. -> .agentsmith/phases/done/p0513-domain-profile-measured-gates.yaml"
    p0512: "THE RECORD IS AN INDEX, NOT AN ESSAY (tests + context + CLAUDE.md). A state.done entry is capped at 400 characters by PhaseRecordLengthRatchetTests, which parses the record rather than greps it. The 273 already over are baselined and may only shrink, none may pass 3000, and the eleven longest went from 33,913 chars to 4,221. -> .agentsmith/phases/done/p0512-phase-record-entry-cap.yaml"
    p0495: "The configured step cap is the ceiling a command may ask for, and a command killed by it says it timed out instead of reporting that it never ran. -> .agentsmith/phases/done/p0495-run-command-step-cap-ceiling.yaml"
    p0497: "The initialize action reads as part of the project card: the studio's own colours, and one action group instead of a control wedged between the name and the metadata. -> .agentsmith/phases/done/p0497-init-action-project-card.yaml"
    p0501: "A PULL REQUEST BEHIND A POLICY ARMS ITSELF (backend + dashboard). Azure DevOps refuses p0490's immediate merge when a branch policy requires a build, so an init pull request votes approve as its own creator and sets AutoCompleteSetBy. PullRequestCompletion carries an outcome enum (Merged/Armed/Refused). -> .agentsmith/phases/done/p0501-pr-azure-policy-auto-complete.yaml"
    p0500: "A REPOSITORY IS READ ON THE BRANCH IT HAS (backend). All three remote providers returned the CONFIGURED default_branch unconditionally, so a connection-level branch a repository lacks blinded every read and init-project opened no pull request. One DefaultBranchResolver owns the precedence; the repo default wins. -> .agentsmith/phases/done/p0500-repo-own-default-branch.yaml"
    p0502: "Every pull-request link in a step message is clickable, not just the last one. The linkifier's URL pattern swallows the comma that separates them. -> .agentsmith/phases/done/p0502-dashboard-linkifier-comma-lists.yaml"
    p0499: "A tracker's label-to-pipeline map survives being opened and saved. Editing it as text splits every key at its first colon, and the operator's keys contain colons. -> .agentsmith/phases/done/p0499-config-label-map-colon-keys.yaml"
    p0493: "A provider rate limit is waited out on the server's own clock, once, visibly and bounded. -> .agentsmith/phases/done/p0493-rate-limit-server-clock-wait.yaml"
    p0492: "A shortened command whose last character is a quote can be cited. -> .agentsmith/phases/done/p0492-citation-trailing-quote.yaml"
    p0488: "The connection repo picker filters, caps what it renders, and shows a wildcard as the rule it is rather than as one more chip. -> .agentsmith/phases/done/p0488-config-repo-picker-filter.yaml"
    p0489: "A configured project is initialized from a button in the dashboard, with no ticket written anywhere, and what came of it is one click away. -> .agentsmith/phases/done/p0489-init-from-dashboard-button.yaml"
    p0490: "An init run started from the dashboard can complete its own pull requests, and says per repo whether that worked. -> .agentsmith/phases/done/p0490-init-pull-request-self-complete.yaml"
    p0482: "A first-time visitor sees the product on the landing page, and the reference diagrams live where someone has already decided to read them. -> .agentsmith/phases/done/p0482-docs-landing-page-product.yaml"
    p0470: "A command the agent ran is never dropped from the account's evidence without the account being told, and its output is what gives way first. -> .agentsmith/phases/done/p0470-account-evidence-truncation-told.yaml"
    p0473: "The account is told the citation form its own resolver accepts, and the resolver reads a command that contains quotes. -> .agentsmith/phases/done/p0473-citation-form-and-quotes.yaml"
    p0474: "A citation is a list of whole things, and an account whose citation did not resolve is told so and asked once more. -> .agentsmith/phases/done/p0474-citation-list-re-ask.yaml"
    p0491: "The output a command produced reaches the model (backend). run_command's model-facing text comes from StepResult.OutputContent, with the stream kept as the fallback for a pre-p0258 agent image, and SandboxRedisChannel drains its event stream to exhaustion, bounded by its trim length, so no entry is left for the next step. -> .agentsmith/phases/done/p0491-run-command-output-reaches-model.yaml"
    p0486: "The command writes the artifact it captures (skills). The coding master redirects captured command output into the artifact instead of retyping it, says the redirect target is repo-relative, and admits a count only where its entries stand beneath it. Skills PR #163, coding-agent-master 1.23.0 to 1.24.0; the pin bump is p0487. -> .agentsmith/phases/done/p0486-artifact-written-by-command.yaml"
    p0484: "A criterion the delivery account settled with its own search can be cited by that search. -> .agentsmith/phases/done/p0484-account-search-as-citation.yaml"
    p0483: "The account checks instead of trusting (backend). The delivery account runs BranchSearch over the phase's sandboxes — grep with a fixed argument vector, no shell, twelve searches — so an absence criterion is settled by looking rather than by a cited command; Reasoning became a tool-bearing task. AccountTools extracted. 4073 green. -> .agentsmith/phases/done/p0483-account-own-searches.yaml"
    p0481: "A shortened command stays quotable and keeps the tail its reach is judged on. -> .agentsmith/phases/done/p0481-citation-shortened-command.yaml"
    p0478: "A parked run resumes: an entry the checkpoint cannot restore is skipped, and a compiler-generated collection never reaches the checkpoint. -> .agentsmith/phases/done/p0478-checkpoint-partial-restore.yaml"
    p0477: "A provider refusal that will pass does not end the run, and one that will not is reported with the number that explains it. -> .agentsmith/phases/done/p0477-provider-refusal-run-survives.yaml"
    p0475: "The drain test waits before it stops (tests). Broadcaster_DrainLagsThenQuiesces now waits for the trail row while the broadcaster is still running, then stops it; the assertions are unchanged and CiSafeWait stays sixty seconds. Its own phase rather than a fix inside p0474, whose own suite was green. -> .agentsmith/phases/done/p0475-test-drain-waits-while-running.yaml"
    p0466a: "Main builds again (dashboard + tests). FilterRail's exhaustive Record<EventType, string> gained labels for PhaseStateChanged and PhaseRecorded, and the p0469 test gets the third SelectPhaseHandler argument p0466 added. p0466's branch was green because vitest and the linter pass on that file; only pnpm build type-checks it. -> .agentsmith/phases/done/p0466a-dashboard-rail-labels-every-event.yaml"
    p0469: "THE ACCOUNT SEES WHAT THE AGENT RAN (backend). p0452 published the agent's commands on every exit except completing, so a phase that finished normally showed only the verify step. The log is opened once per phase, owned by the phase not the tool host, and a search exiting non-zero can close an absence criterion. -> .agentsmith/phases/done/p0469-account-sees-completed-phase-commands.yaml"
    p0434: "The step that opens the pull request survives a provider failure, because it stopped being deterministic and nobody noticed. -> .agentsmith/phases/done/p0434-pr-step-provider-retry.yaml"
    p0432: "The test suite applies its migrations ONCE and copies the result, so the cost of a relational test stops growing with the number of tests that need one. -> .agentsmith/phases/done/p0432-test-migrations-once.yaml"
    p0446: "The reviewer only says a criterion was never asked for when it has seen the whole ticket. -> .agentsmith/phases/done/p0446-account-not-in-ticket-verdict.yaml"
    p0449: "A question in a repair pass is still asked (backend). p0438 left MasterOpenQuestions out of the repair block; the step is repeated in the block's own order, and the old HaveCount(3) literal now tracks RepairBlock.Count. Correct on inspection, not yet proven — the harness case is p0450 and does not yet drive a repair. 3881 green. -> .agentsmith/phases/done/p0449-question-in-repair-pass.yaml"
    p0453: "A question the master asks mid-run is answerable where it is shown, without a status move on the board. -> .agentsmith/phases/done/p0453-question-answerable-in-dashboard.yaml"
    p0454: "A ticket that waits for a person names that person, and says on the board that it is waiting. -> .agentsmith/phases/done/p0454-ticket-waiting-names-person.yaml"
    p0455: "The tracker dialog shows the lists the tracker holds — trigger statuses and open states read back what is stored, instead of two empty boxes over live values. -> .agentsmith/phases/done/p0455-config-tracker-dialog-lists.yaml"
    p0458: "A rail item with a count filters the list it counts, and an answer the run accepted is reported as accepted. -> .agentsmith/phases/done/p0458-dashboard-rail-filter-answer-accepted.yaml"
    p0459: "A lease is released by the run that holds it (backend). ReleaseAsync names its holder: a conditional DELETE on ActiveRun.RunId with no migration, returning Released/HeldByAnotherRun/NotFound and logging the refusal in the repository; null matches an unattached claim only, and all six callers state their identity. -> .agentsmith/phases/done/p0459-run-lease-released-by-holder.yaml"
    p0460: "A phase that is already satisfied is already done (backend). SelectPhase takes the delivery account on entering a phase, guarded by DeliveryDiff.CarriesSource, and retires a fully satisfied phase through CommandResult.DropAhead; the skip is recorded in the step result, the sequence table, the ledger and the record. 3941 green. -> .agentsmith/phases/done/p0460-phase-already-satisfied-done.yaml"
    p0462: "The documentation configures the server the way the server is actually configured — in the Configuration studio — and says exactly what is left for YAML. -> .agentsmith/phases/done/p0462-docs-configure-in-studio.yaml"
    p0466: "A finished phase is a record you can open: its decisions, its steps and the spec it executed, readable after it ended. -> .agentsmith/phases/done/p0466-run-viewer-finished-phase-record.yaml"

    p0461: "An answer lands wherever it is given (backend). A poll reads an Azure DevOps work item's comments after the question, skips our own via OwnTicketComment.IsOurs and fills the same first-answer-wins inbox the dashboard fills; the comments carry a dashboard deep link, and on resume the ticket leaves the clarification status. -> .agentsmith/phases/done/p0461-question-answer-from-ticket.yaml"
    p0456: "The capabilities endpoint sends the field shape in the casing its own contract declares. -> .agentsmith/phases/done/p0456-capabilities-endpoint-casing.yaml"
    p0457: "The repository states how it was built, on the README and the website and in the docs, with numbers anyone can recount. -> .agentsmith/phases/done/p0457-built-by-the-method.yaml"
    p0463: "THE ACCOUNT SOUNDS LIKE A PERSON (docs + README + website). p0457's story of this repository, rewritten to the voice spec already committed at config/docs-writing-skill.md: first person grounded in a committed source, no bold inline headers, nothing defined by what it is not, no invented superlative or numeral. Figures kept. -> .agentsmith/phases/done/p0463-docs-account-voice.yaml"
    p0452: "The delivery account is shown the commands the agent ran, not only the stages verification ran. -> .agentsmith/phases/done/p0452-account-sees-agent-commands.yaml"
    p0451: "A declared build or test command that cannot fail is not accepted as a verification. -> .agentsmith/phases/done/p0451-verify-infallible-command-refused.yaml"
    p0450: "The harness can reach a repair pass (backend). The accountant stand-in may withhold one named criterion for one account, so a repair pass is reachable without an LLM. A first repair case was green with p0449 reverted, so every case must assert it reached PhaseRepairAttempted and be shown red; the repair case is not in this commit. -> .agentsmith/phases/done/p0450-harness-repair-pass-case.yaml"
    p0448: "A run notice is not the ticket conversation (backend). A comment of ours survives into the next run only while it is still the operator's turn; a cancelled or failed run and a handback verdict are dropped. Marker sets moved into a named OwnTicketComment, taking the allowlist entry off the prompt section. 3883 green. -> .agentsmith/phases/done/p0448-ticket-conversation-drops-run-notices.yaml"
    p0447: "When the attempts run out, the run gets the least-objected cut instead of no cut at all. -> .agentsmith/phases/done/p0447-derivation-least-objected-cut.yaml"
    p0445: "A run waiting on the operator states where it stands, what it cost and how long it has waited — the same facts every other row states. -> .agentsmith/phases/done/p0445-run-parked-row-facts.yaml"
    p0444: "A phase starts without the last one's repair (backend). PhaseRepairScope clears the previous phase's outstanding criteria and its spent-repair flag on entering a phase, so every phase keeps its own single repair. p0440 proved itself in the same run: the park was recorded waiting_for_input. 3873 green. -> .agentsmith/phases/done/p0444-phase-repair-scoped-to-phase.yaml"
    p0443: "A drain test waits for the row it asserts about, not for a different row written by the same run. -> .agentsmith/phases/done/p0443-test-drain-waits-for-row.yaml"
    p0442: "The embedded pin catches up (backend). The embedded skills fallback moved from v4.0.0 to the v4.5.0 release the deployment ran, and spec-derivation-master's ownership flipped to the catalog, whose cut-sizing and criteria rules are asserted with whitespace collapsed. Checksum verified against the published sidecar. 3870 green. -> .agentsmith/phases/done/p0442-skills-pin-catches-up.yaml"
    p0441: "A shortened run id keeps the part that tells two runs apart. -> .agentsmith/phases/done/p0441-run-id-short-form.yaml"
    p0440: "A run waiting on the operator says so, whichever way it came to be waiting. -> .agentsmith/phases/done/p0440-run-parked-needs-operator.yaml"
    p0341g: "A repair pass belongs to the phase it repairs, and the run's statistics say what the run spent its time ON rather than only how much. -> .agentsmith/phases/done/p0341g-a-repeated-step-belongs-to-its-phase.yaml"
    p0341f: "A master's passes are ONE conversation. Every drive — apply, verdict, re-engagement — continues the thread instead of meeting the model as a stranger. -> .agentsmith/phases/done/p0341f-the-thread-crosses-the-pass-boundary.yaml"
    p0438: "The account goes back to the agent (backend). Outstanding criteria are handed back to the master for one repair pass, spliced as [AgenticMaster, CommitPhaseWork, VerifyPhase] via OkAndContinueWith. Ratchet forced PhaseExecutionPromptBlocks out, and the p0422 test that asserted a file name was retargeted at what the block says. -> .agentsmith/phases/done/p0438-account-repair-pass.yaml"
    p0437: "The gate runs after the work (backend). The phase block gains an explicit CommitPhaseWork before VerifyPhase, using the same checkpointer via PushNowAsync, so each phase's verification reads a branch carrying its work; GateOrderRuleTests asserts the order. Ratchet forced RepoWorkPusher and CommandNames.PhaseBlock out. -> .agentsmith/phases/done/p0437-acceptance-gate-after-commit.yaml"
    p0436: "The preflight recognises a configured agent in BOTH shapes it can have, instead of failing a healthy run on the one it was not written for. -> .agentsmith/phases/done/p0436-run-preflight-agent-shapes.yaml"
    p0435: "The dashboard image installs what the lockfile says, or the build stops — a guard with an escape hatch is not a guard. -> .agentsmith/phases/done/p0435-dashboard-frozen-lockfile.yaml"
    p0433: "A step that reaches a model cannot be declared deterministic — the declaration stays authoritative, but evidence is allowed to contradict it. -> .agentsmith/phases/done/p0433-flow-diagram-evidence.yaml"
    p0429a: "An api-scan's live-target findings are substantiated the way repo findings are — against the endpoint they name rather than a file that does not exist — and the scan's account of what it looked for reaches the reader in the ticket comment and the pull request, not only the run record. -> .agentsmith/phases/done/p0429a-api-scan-endpoint-citation.yaml"
    p0423b: "The dashboard answers the two questions separately: what is happening now, and why did this run do that. -> .agentsmith/phases/done/p0423b-ui-two-views.yaml"
    p0430: "The phase record states what the repository actually did — enforced by a test rather than by discipline — and the ships_code rule p0421 removed leaves nothing behind that still describes it. -> .agentsmith/phases/done/p0430-phase-record-rule.yaml"
    p0429: "A scan states what it looked for BEFORE it looks, and every finding it delivers is substantiated against the source — the accountability spine p0419-p0422 built for the coding pipeline, pointed at the scan pipelines that run beside it with none of it. -> .agentsmith/phases/done/p0429-scan-accountability-spine.yaml"
    p0428: "A run proves its preconditions in seconds, at the step after checkout, so the failures that are knowable without a model call are named there instead of 30-90 minutes later. -> .agentsmith/phases/done/p0428-run-preconditions-preflight.yaml"
    p0427: "A recorded run replays against changed code without calling a model, so a defect found live becomes a permanent test instead of another live run. -> .agentsmith/phases/done/p0427-run-replay-without-model.yaml"
    p0426: "An imperfect model answer is DATA the run handles, never an exception that ends it — a null where a number was expected, or a call that came back empty. -> .agentsmith/phases/done/p0426-model-answer-is-data.yaml"
    p0425: "A declared verification command runs the way it reads — a command LINE, not an argument list, so a phase that verifies with two test projects is not failed by its own separator. -> .agentsmith/phases/done/p0425-verify-command-line-not-argv.yaml"
    p0424: "The briefing a worker receives carries what the OPERATOR said and states what the worker is — so a round is spent on the work instead of on reconciling the framework's own past announcements. -> .agentsmith/phases/done/p0424-worker-briefing-carries-operator.yaml"
    p0423: "A run records itself: five numbers for every unit of work, always — and, on a switch, the conversation that produced them, so a failure is read rather than reproduced. -> .agentsmith/phases/done/p0423-run-trace-record.yaml"
    p0422: "Every judgement in the run is taken from evidence the framework can see — the cut before it is built, the delivery from the branch, a citation from the file it names — and nothing the agent needs to know is left for it to guess. -> .agentsmith/phases/done/p0422-judgement-from-evidence.yaml"
    p0412: "For mechanical work the master asks what the ecosystem's standard tool is before editing files by hand, and verifies once at the end instead of after every edit. -> .agentsmith/phases/done/p0412-master-tool-first-edits.yaml"
    p0421: "The old delivery gate comes out whole — keystone signals, ships_code, the preset exemption list, the self-report as evidence — and the run's verdict is read from the per-phase accounts (p0420) alone, so a wrong verdict has exactly one possible author. -> .agentsmith/phases/done/p0421-gate-removed.yaml"
    p0420: "Verification accounts for the spec (backend). A fresh model instance reads the delivery diff against the ratified criteria and answers per criterion, each satisfied claim carrying a citation DiffFileIndex resolves against the diff, so invention fails. The account renders into the phase record; the PR body follows with p0421. -> .agentsmith/phases/done/p0420-account-per-criterion-verification.yaml"
    p0419: "Every failing step says why: output reaches the handler that reports it, the gate build streams, a worker names what it refused, and one dead process no longer costs a run that was already green. -> .agentsmith/phases/done/p0419-step-failure-cause.yaml"
    p0416: "A run can be driven by an EXTERNAL agent instead of a provider API: agent-smith hands out the request and the tools and waits for the answer, so a whole ticket can be exercised end to end at zero token cost and for as long as it takes. -> .agentsmith/phases/done/p0416-worker-external-agent.yaml"
    p0415: "One prompt, one owner (backend). A declared ownership table names each prompt's source: catalog-owned never falls back to embedded, embedded-owned never consults the catalog. Absorbed p0409: 12 of 14 embedded resources deleted with their orphaned services. Known gap: the guard is build-time, so an operator-pinned catalog is invisible. -> .agentsmith/phases/done/p0415-prompt-single-owner.yaml"
    p0411: "The master never spends model calls on work the framework owns — git identity, orientation and repeated self-inspection are done once, by us, before the master is asked anything. -> .agentsmith/phases/done/p0411-master-housekeeping-by-framework.yaml"
    p0413: "The shape of the work decides the shape of the process: a deterministic transformation is carried out as one, and only judgement work earns the full per-phase ceremony. -> .agentsmith/phases/done/p0413-process-tier-by-task-shape.yaml"
    p0405: "A running pipeline shows the steps it has NOT reached yet, so 'step 19 of 45' answers what the other 26 are instead of only how many. -> .agentsmith/phases/done/p0405-run-viewer-upcoming-steps.yaml"
    p0404: "Every step reports where its wall-clock went — model, sandbox, or scaffolding — so 'the agent needs 70 minutes for what I do in 30' becomes a number instead of an impression. -> .agentsmith/phases/done/p0404-step-time-breakdown.yaml"
    p0407: "A sandbox restores packages from caches that survive the run. The Docker backend mounts a persistent volume per ecosystem into every sandbox, so the second run's `dotnet restore` reads from disk instead of the network — and a command the step cap kills says so instead of returning exit -1 with nothing. -> .agentsmith/phases/done/p0407-warm-package-cache.yaml"
    p0408: "The control flow is a generated picture (contracts + website). control-flow.svg is written from PipelinePresets.Effective, CommandDisplayNames, CommandBeats and the new CommandModelUse, and is held true by a drift test. Master routing moved into PipelinePresets.MasterFor. Audit found 13 of 14 embedded prompts dead (p0409). -> .agentsmith/phases/done/p0408-flow-diagram-generated.yaml"
    p0406: "A knowledge phase can finish (backend). MasterAcceptanceGate, renamed from MasterReengagementPolicy, takes ships_code, so a phase shipping no code is judged by its dispositions alone; a null verdict is re-driven once then ends named, and PhaseKindAwarenessRuleTests requires the phase kind of every acceptance decider. -> .agentsmith/phases/done/p0406-knowledge-phase-acceptance.yaml"
    p0403: "The two coding principles that are mechanically decidable — no static holds a dependency, no file exceeds 120 lines — are enforced by tests instead of documented, and the code moves to meet them. -> .agentsmith/phases/done/p0403-principles-with-teeth.yaml"
    p0400c: "The deliverable is declared, never defaulted (backend). A derivation JSON omitting ships_code is rejected instead of collapsing into a declared true, after all five derived phases of one run carried true including pure inventory and report work. Superseded by p0421, which removed ships_code entirely. Shipped in #499. -> .agentsmith/phases/done/p0400c-ships-code-never-defaulted.yaml"
    p0401: "A static class in Application or Infrastructure holds no state: every collaborator a static was hiding in a static field becomes an injected dependency, and a rule test keeps it that way. -> .agentsmith/phases/done/p0401-static-state-injected.yaml"
    p0400b: "The model's ships_code declaration survives the JSON reader and is readable in the spec it produced — the field the p0400a obligation created was unreachable and unauditable. -> .agentsmith/phases/done/p0400b-ships-code-declaration-visible.yaml"
    p0400a: "Declared verify commands run at the repo root where they were authored, and the derivation must declare ships_code for phases whose done criteria require no source diff — the two kicks that failed the first clean-foundation run. -> .agentsmith/phases/done/p0400a-verify-repo-root-ships-code.yaml"
    p0400: "Phase delivery semantics and verify resolution (backend). ships_code lets a phase declare it ships knowledge: keystone and hollow-delivery rules stand down and the build gate baseline-compares. Verify commands resolve from declared ci commands or entry-point discovery, never a guessed sln name. Plugin schema copy still to commit. -> .agentsmith/phases/done/p0400-phase-delivery-semantics.yaml"
    p0399: "Spec-set fidelity and hygiene (backend). TicketHtmlConverter decodes ticket segments at ingestion — pre-blocks parked and restored as markdown fences, entities decoded after tag-strip, plain text byte-for-byte — and SpecSetWriter makes a revision fully replace the set, removing stale files via git rm in the same commit. -> .agentsmith/phases/done/p0399-spec-set-fidelity-and-hygiene.yaml"
    p0394a: "The ratified phase spec is the run's single planning artifact: the ledger seeds from the PhaseDraft, the master's plan section renders the spec, and the legacy JSON plan call leaves the phase path. -> .agentsmith/phases/done/p0394a-the-spec-is-the-plan.yaml"
    p0398: "Every pipeline step carries a display class — milestone, gate, or internal — and the drawer shows milestones, surfaces gates only when they have something to say, and collapses internals, so the visible list is the run's story. -> .agentsmith/phases/done/p0398-step-classification-condensed-drawer.yaml"
    p0395b: "SINGLE-LINE ROWS (dashboard, shipped). Corrects p0395a: sidebar rows default to ONE line with inline meta; only a user-narrowed rail wraps the label (max two lines). -> .agentsmith/phases/done/p0395b-single-line-rows.yaml"
    p0397: "A LiveLLM plan-call golden answers 'does the multi-repo plan call fit the output cap, parse, and cover both repos?' in minutes — the operator never again needs a live pipeline run to learn it. -> .agentsmith/phases/done/p0397-plan-call-live-eval.yaml"
    p0396: "A transient Redis hiccup during the sandbox agent's idle wait no longer kills the container — and the vanish diagnosis names the real exit cause instead of guessing OOM. -> .agentsmith/phases/done/p0396-sandbox-idle-wait-resilience.yaml"
    p0395a: "The pipeline drawer scales with the viewport instead of standing still at a stored pixel width, and sidebar step labels wrap to two lines instead of truncating. -> .agentsmith/phases/done/p0395a-drawer-fluid-widths.yaml"
    p0395: "Four operator findings from watching the first p0393a live run: done-criteria render without their raw 'done:' prefix, the pipeline drawer is resizable (size + splitter), phase documents render real content with an honest source, and spliced step labels show the step — not the phase id. -> .agentsmith/phases/done/p0395-run-viewer-operator-feedback.yaml"
    p0394: "The plan call answers in JSON again on multi-repo runs, and the spec-set commit carries a git identity — the two backend defects the first live run after p0384/p0393a surfaced. -> .agentsmith/phases/done/p0394-live-run-plan-json-and-spec-commit-identity.yaml"
    p0391b: "The remaining startup paths that still throw become probes that record a finding, and the CLI validates the same configuration the server does — so a bad config is reported by whichever surface the operator is holding -> .agentsmith/phases/done/p0391b-no-startup-path-throws.yaml"
    p0392: "Config Studio edits every field the backend reads and says which required ones are missing — so a configuration cannot be incomplete in a way only a failed run reveals -> .agentsmith/phases/done/p0392-config-studio-shows-what-is-missing.yaml"
    p0393b: "Durable-dialogue checkpoint/resume keeps its coverage on the pipeline that still has interactive gates: spec-dialog, not the coding path p0393 removed both gates from -> .agentsmith/phases/done/p0393b-durable-dialogue-on-spec-dialog.yaml"
    p0374a: "A ledger entry marked done stays done unless the model reopens it explicitly, and every transition is traceable — restoring the merge p0374 removed on a rationale p0368 had already satisfied -> .agentsmith/phases/done/p0374a-done-stays-done.yaml"
    p0312d: "Remove the batch-execution path: with the SkillRound family gone nothing is batchable, so PeelBatch, PipelineBatchRunner and their step-runner surface are machinery with no producer -> .agentsmith/phases/done/p0312d-retire-the-batch-path.yaml"
    p0313b: "Shared methodology references (skills + backend). Spawn-budget, evidence-modes and phase-discipline moved to references/, about 20 duplicate copies collapsed, and the loader inlines one level deep and fails loud on a missing or nested citation. PRs #483 and skills#150. -> .agentsmith/phases/done/p0313b-shared-methodology-references.yaml"
    p0388d: "The step-detail view follows a running step instead of freezing on its first page: newest-anchored reads, a forward delta poll while the run is live, and an explicit way back into history -> .agentsmith/phases/done/p0388d-live-detail-follows-the-run.yaml"
    p0393a: "DeriveSpec turns any ticket into an ordered set of phase specs on the ticket branch — yaml for what and done, md for the verbatim code templates — so the `code` pipeline runs on ordinary tickets and not only on ones an operator hand-wrote -> .agentsmith/phases/done/p0393a-derive-the-spec.yaml"
    p0393: "One code-changing pipeline named `code` replaces fix-bug/add-feature/fix-no-test/phase-execution: the validated phase spec is the contract, GeneratePlan derives plan.md from spec plus codebase, and VerifyPhase refuses the PR on a red build -> .agentsmith/phases/done/p0393-one-coding-pipeline.yaml"
    p0313: "Align _masters with the agentskills.io open spec and close the format debt: declared IO contracts, template-placeholder manifest, shared methodology, per-skill evals, CI validation -> .agentsmith/phases/done/p0313-skills-agentskills-alignment.yaml"
    p0312a: "Masters-only skill consumption: every pipeline resolves skills exclusively from _masters (+ patterns/vocabulary); skill-manager + autonomous collapse to master skills; SkillRound-era machinery retires -> .agentsmith/phases/done/p0312a-masters-only-consolidation.yaml"
    p0312b: "Delete the retired legacy catalogs from agent-smith-skills and ship the masters-only 4.0.0 tarball -> .agentsmith/phases/done/p0312b-legacy-catalog-deletion.yaml"
    p0312c: "pr-review gets its master and Triage retires completely: the last deterministic skill selector goes, and the one pipeline that still depended on it becomes runnable for the first time -> .agentsmith/phases/done/p0312c-pr-review-master-triage-retires.yaml"
    p0391a: "STARTUP NEVER ABORTS (server + pipeline + dashboard). A boot-time throw over one project's missing field killed the whole process, and the tool needed to fix it was the thing that would not start. Every abort is now a StartupFinding that boot disables, /api/config/findings answers and a dashboard banner renders. -> .agentsmith/phases/done/p0391a-startup-never-aborts.yaml"
    p0390: "Derive specification (pipeline + dashboard + skills), superseded by p0393a. Correcting the spec: PR #476 was merged, so the code is on main and gets retargeted rather than re-written — it had added a second spec concept beside the PhaseDraft path p0315d ships, and was written for the branch p0393 deletes. -> .agentsmith/phases/done/p0390-derive-specification.yaml"
    p0390a: "Constraints are the head (pipeline + skills) — superseded by p0393a and never executed; the segment accounting it defined moves to p0393a, guarding the derivation instead of the compaction head. -> .agentsmith/phases/done/p0390a-constraints-are-the-head.yaml"
    p0391: "Master exit paths (pipeline + skills). Shipped MasterOpenQuestions and a real ticket park for the code presets, the blocked verdict and a stopping condition in the skill (skills 1.17.0), a per-pass ledger-turnover bound, and a load-time rule for the unset park status. Live park verification is still open. -> .agentsmith/phases/done/p0391-master-exit-paths.yaml"
    p0388b: "The run detail's full pipeline is served from the DB projections as bounded queries — the rail from RunStep, a step's detail on demand — so the dashboard stops accumulating the event log and a 4-hour run costs the client the same as a 4-minute one -> .agentsmith/phases/done/p0388b-run-rail-from-projections.yaml"
    p0388a: "Every persisted run row carries the step it belongs to, stamped by the producer through an ambient step scope — so per-step queries become possible without replaying the whole event log -> .agentsmith/phases/done/p0388a-step-attribution-on-persisted-rows.yaml"
    p0387: "Run failure summaries are human-readable: raw provider error payloads are translated once at persist time, and the dashboard renders a readable fallback for the raw-JSON rows already in the DB. -> .agentsmith/phases/done/p0387-run-summary-humanize.yaml"
    p0386: "Repo scoping acts on per-repo verdicts: a repo the classifier confidently rules out is dropped even when its OVERALL confidence is low — the global-confidence keep-all fallback no longer discards the classifier's own exclusions. -> .agentsmith/phases/done/p0386-per-repo-scope-verdict.yaml"
    p0385: "ProjectAnalyzer survives the tool-iteration cap: the model knows its exploration budget and a capped/prose attempt is finalized by continuing the SAME conversation with an emit-JSON-now turn — no blank-restart retry that deterministically fails again. -> .agentsmith/phases/done/p0385-analyzer-finalize-turn.yaml"
    p0384: "Plan, acceptance contract, ledger seed, and keystone see EVERY scoped repo instead of the arbitrary first one — a multi-repo ticket can no longer go green while an in-scope repo was never worked. -> .agentsmith/phases/done/p0384-multi-repo-plan-enumeration.yaml"
    p0383: "Reaper suspend and liveness hardening (backend). ActiveRunReaper no longer reaps a run registered un-cancelled in its own process — it refreshes the heartbeat instead — and monotonic suspend-gap detection suppresses stale verdicts for one lease window after a host wake; the non-local reap path is unchanged. -> .agentsmith/phases/done/p0383-reaper-suspend-liveness-hardening.yaml"
    p0381: "A failure dressed as a cancellation (sandbox-vanished, internal step/LLM timeout) terminalizes the native ticket status like every other failure — closing the failed-run -> poller-re-claim loop observed live. -> .agentsmith/phases/done/p0381-vanish-class-failures-terminalize-ticket.yaml"
    p0380: "Experiential memory substrate (backend + skills + spec-first plugin, 3 repos). Shipped the git-native .agentsmith/memory/ store and index, recall and remember on all master surfaces, the green-run ticket memory and plugin 2.1.0. The seed imported 32 of 33 feedback rules with status proposed, awaiting ratification. -> .agentsmith/phases/done/p0380-experiential-memory-substrate.yaml"
    p0379: "Make the coding principles a language/framework-agnostic universal CORE (intent-level) plus thin per-language DELTAS, and reform init-project to TRANSFER + ratify them instead of inferring principles from code archaeology. -> .agentsmith/phases/done/p0379-universal-agnostic-coding-principles.yaml"
    p0378: "Fix the RunFinished drain gap where a high-volume SUCCESS run's terminal event is published to the Redis stream but never persisted, leaving Runs.Status stuck on 'running' — reproduce first, then fix. -> .agentsmith/phases/done/p0378-runfinished-drain-persistence-gap.yaml"
    p0375: "Stage private-registry auth for ANY package manager via an LLM fallback (secret host-substituted) so a new ecosystem needs zero bespoke code. -> .agentsmith/phases/done/p0375-generic-registry-auth-staging.yaml"
    p0372: "A running punch-list of operator-reported dashboard polish items from the 2026-07-22 review. Small, mostly independent UI fixes on the run list + detail. Kept as one phase so the batch ships together; the operator is still adding items, so treat the list as open until they say go. -> .agentsmith/phases/done/p0372-dashboard-polish-punchlist.yaml"
    p0374: "Provider-aware conversation-history caching (backend). A wire-level ClaudeHistoryCacheHandler adds ephemeral cache_control to the last message block on the outgoing request, so the growing tool-result prefix caches; the plain API-key path also moves off the SDK 100s timeout to 10 minutes. Follow-up: multi-anchor lookback. -> .agentsmith/phases/done/p0374-provider-aware-history-caching.yaml"
    p0368: "Ledger stability (backend). A pure LedgerMergePolicy makes update_progress merge: retained done entries survive by id or fallback key, an omitted one is re-attached, a revert needs an explicit reopen token and each rescue is logged, while pending work stays freely restructurable. Follow-up: teach the master the reopen token in skills. -> .agentsmith/phases/done/p0368-ledger-stability.yaml"
    p0369: "Run metrics persistence (backend). RunEventApplier folds a per-run RunMetrics summary served on the run detail — time split, tool usage, content-aware redundancy, cache health, build/test counts — with SandboxResultEvent.Summary + ContentHash and a Run.RunMetricsJson column. Follow-ups: dashboard panel, prod DB migrate. -> .agentsmith/phases/done/p0369-run-metrics-persistence.yaml"
    p0370: "Dashboard liveness beat and absolute timestamps (dashboard, shipped on the eventing branch). A SandboxActivityRollup type, a JobsHubClient subject and a useSandboxActivity hook render the coalesced beat in the run side rail while a run is non-terminal, and absolute start times appear in the run card and side rail. -> .agentsmith/phases/done/p0370-dashboard-liveness-and-timestamps.yaml"
    p0366: "Live stream never drops (dashboard). JobsHubClient keeps a rejoiners map and rejoins every group on reconnect, emitting Connected only once the rejoin settles, and the run ScopeBuffer is keyed so the SubscribeRun replay dedups the overlap — reversing the earlier unkeyed-run-scope decision. -> .agentsmith/phases/done/p0366-live-stream-never-drops.yaml"
    p0367: "Event volume and load resilience (server). A sandbox-detail classifier plus RunEventRouter keep the tool-call firehose off the Run group (~1350 to ~50 sends per run), persistence moved to IRunEventPersistence with batched rows, failing command output is kept as a truncated tail, and every fanout is bounded. -> .agentsmith/phases/done/p0367-event-volume-and-load-resilience.yaml"
    p0365: "Re-engagement stop is an empty pass (backend). ReengageProgressPolicy decides Continue, StopIdle or StopBlocked from the tool calls in a pass, so the loop keeps driving while any tool fires; folds in the OpenAI cache-read fix. Follow-ups: repetition metric, skill blocked-emission, live golden. -> .agentsmith/phases/done/p0365-reengagement-forward-progress-archetypes.yaml"
    p0358: "Skills-catalog reload visibility and a python-payload end-to-end proof (backend + tools). A skills.version change now logs its verdict on every replica and pulls eagerly, so a broken release surfaces at update time; tools/verify-python-payload is a compose harness mirroring the k8s init-container shape. -> .agentsmith/phases/done/p0358-skills-reload-and-python-verify.yaml"
    p0363: "Red persistence and time ledger (backend). An honest RED verdict is terminal only when the ledger has no actionable pending items, bounded by the forward-progress gate; LlmCallFinishedEvent gained ThrottleWaitMs and the run rail renders the wall-time split. Shipped in #450. -> .agentsmith/phases/done/p0363-red-persistence-and-time-ledger.yaml"
    p0362: "Compaction hysteresis and cache-side summary (backend). The trigger now measures the compacted view, so a run refolds only when the view re-crosses the threshold, and the view is reordered to head, summary, pin, tail so the stable summary sits on the cache side. Dead p0119a compactors deleted. Shipped in #450. -> .agentsmith/phases/done/p0362-compaction-hysteresis-and-cache-side-summary.yaml"
    p0361: "Cost truth and duplicate-work telemetry (backend). Pricing carries the current aliases, unpriced tokens accrue visibly instead of vanishing and each call is attributed to its own model so the phase sum equals the headline; repeated identical tool invocations are counted per skill call. Shipped in #448 / #455. -> .agentsmith/phases/done/p0361-cost-truth-and-duplicate-work-telemetry.yaml"
    p0360: "Checkpoint pushes (backend). Every dirty repo sandbox is committed and pushed to the run branch on each accepted update_progress replace, throttled and run through the same secret scan as the final commit, and CommitAndPR treats checkpointed repos as delivered. -> .agentsmith/phases/done/p0360-checkpoint-pushes.yaml"
    p0359: "Model-owned ledger with a staleness reminder (backend + coding-master skill). The reminder fires on a streak of iterations since the last update_progress instead of a blunt every-N, and the no-drop protection is removed so a deviating plan can shed obsolete steps. Shipped in #444. -> .agentsmith/phases/done/p0359-model-owned-ledger-staleness-reminder.yaml"
    p0357: "CONTEXT INTEGRITY + RUN TRUST (backend + carrier + dashboard + skills). Seven fixes from the 2026-07-21 review: token-pressure-only compaction, the ticket pinned into the compaction head, a 200k window, cancel terminalizing the ticket at once, python3 in every sandbox, writes classified at the producer, the budget on the rail. -> .agentsmith/phases/done/p0357-context-integrity-and-run-trust.yaml"
    p0356: "Master context working-set overlay (backend + skills, PR #440 and skills PR #135): sandbox toolchain probe, live ledger flushing, prior-run ledger rehydration and skill 1.14.0 thin-path guidance (compiler-as-scout, worklist file, decide-once fan-out, batched verify). The baseline rerun stays operational validation, not a spec gate -> .agentsmith/phases/done/p0356-master-context-working-set.yaml"
    p0355: "Run reliability and truthful viewer (backend + dashboard + deploy, two pushes on PR #438): corpse-pod reaper, quota-reconciled admission, typed cancel reason, keystone read-only exemption, skip-unchanged-repos, live cost accumulation, paged runs endpoint, viewer live perf, prior-run trust gate and a pre-commit fingerprint gate -> .agentsmith/phases/done/p0355-run-reliability-and-viewer.yaml"
    p0351: "Close the last free-text gap in the Config Studio: model roles become the fixed TaskType set (not a typed 'add role' box) and every role's model must be priced. -> .agentsmith/phases/done/p0351-config-studio-stringency.yaml"
    p0352: "Add config file import to the Config Studio UI — upload an agentsmith.yml and it lands in the DB store — reaching parity with the CLI import that already ships. -> .agentsmith/phases/done/p0352-config-import.yaml"
    p0349: "Server config becomes a DB entity-DOCUMENT store (config_entity docs + a config_ref edge table) as the UI-editable, versioned source of truth so the hand-edited ConfigMap stops being the operating surface; the CLI stays file-based; migration in/out is an EXPLICIT operator-invoked config import/export (never an auto-seed). -> .agentsmith/phases/done/p0349-config-in-db.yaml"
    p0345c: "Config semantics (backend + dashboard): a capabilities endpoint serves backend truth with tripwires, a discovery-fed repos endpoint, v2 entities (project pipeline plus validated resolution, full agent surface, tracker v2) round-tripping through the loader, and drift facts; UI forms are capabilities-driven. Encrypted secret values stay p0346 -> .agentsmith/phases/done/p0345c-config-semantics.yaml"
    p0350: "A large multi-repo run that opens PRs and then trips the rate limiter no longer (a) hard-crashes on its own throttle and (b) loses the PRs it already opened: the token bucket clamps instead of throwing, PRs are recorded per-repo the moment they open, and EVERY opened PR surfaces on the run detail -> .agentsmith/phases/done/p0350-pr-surfacing-and-rate-limit-clamp.yaml"
    p0348: "Five operator-reported production defects: a cancelled/hung run never terminates (elapsed + status run away), spawning a ticket costs up to the 20s poll ceiling, SQLite intermittently fails at boot, the COMPUTE panel shows the reserved plan as if it were live pods, and the 'Today' rail item is a mislabelled all-runs list -> .agentsmith/phases/done/p0348-operational-hardening.yaml"
    p0347: "Pull requests surface (backend + dashboard): PR outcomes project per-repo onto Runs.PullRequestsJson with a pre-migration fallback, a new endpoint flattens PRs across runs, the run detail serves its own, and the dashboard adds a /pull-requests page plus a PR block. Consolidating onto RunRepo.OpenedAt is flagged, not decided -> .agentsmith/phases/done/p0347-pull-requests-page.yaml"
    p0343d: "Every remaining surface — the SYSTEM pages (tracker, webhooks, chat dispatchers, config file reads, skill catalog, connections) and the ROLLUPS (cost, today's activity, expectations) — is its own first-class page in the SAME visual system as the three ported surfaces; no old-style page remains anywhere in the dashboard -> .agentsmith/phases/done/p0343d-system-pages-parity.yaml"
    p0343c: "Pixel identity (dashboard): the vendored mockup CSS and DOM ship verbatim as a prefix-scoped mock-parity stylesheet and the run viewer, runs home and config components emit that DOM bound to real data; the full-pipeline drawer widened to 1100px is the one documented geometry deviation -> .agentsmith/phases/done/p0343c-pixel-identity.yaml"
    p0343b: "Mock fidelity (backend + dashboard): shell toggle with contextual rail, runs home inflow pill and section headers, rail-driven config studio with a working yml export endpoint, run detail beat cards with a sticky rail; capacity cell, projects rail group and dialogue button omitted. Harness real-scanner opt-in became a build parameter en route -> .agentsmith/phases/done/p0343b-mock-fidelity.yaml"
    p0345b: "The config studio models the REAL config shape — connections (p0281a discovery) as a first-class entity with connection-scoped project repo refs validating against them — plus the p0343 leftovers: AppRail monitor sections and visible delete/cancel -> .agentsmith/phases/done/p0345b-config-studio-connections.yaml"
    p0344b: "Run story real data (backend + dashboard): beats are computed server-side from a command-to-beat table over the new RunSteps.CommandName, and ledger plus acceptance persist via RunStoryRecordedEvent onto the run row and serve on the detail; the client heuristic is deleted. Operator step: rebuild the compose stack to apply the migration -> .agentsmith/phases/done/p0344b-run-story-real-data.yaml"
    p0345: "Config studio (backend + dashboard): IConfigStore port with FileConfigStore as the shipping store, referential validation, versioned audit with revert and REST config endpoints behind the UI flag; UI adds the /config catalog, FK-picker forms, wiring preview and audit view. DbConfigStore ships as schema plus skeleton only, runtime wiring in p0346 -> .agentsmith/phases/done/p0345-config-studio.yaml"
    p0344: "Dashboard run story view (dashboard): the run detail gains a horizontal 5-beat story bar and a verify summary above the existing trace, with unit-tested beat mapping and verify green only when ratified. Deferred follow-up: ledger panel, per-criterion keystone proof and the trace-drawer refactor, all needing client-side ledger data -> .agentsmith/phases/done/p0344-dashboard-run-story-view.yaml"
    p0343: "Dashboard mission control (dashboard): home is state-ranked — a client-derived metric strip over needs-you, running, queued and finished sections, with inline answering, cancel and delete on parked cards, on the shipping skin. The 5-dot beat spine is deferred: beats are not yet on the client run snapshot (p0344 follow-up) -> .agentsmith/phases/done/p0343-dashboard-mission-control.yaml"
    p0341d: "Continuous master context (backend): compaction is re-attached as a provider-agnostic CompactingChatClient in the shared ChatClientFactory chain, pinning system prompt, live ledger, working state and verbatim tail over a cached incremental summary of the evicted middle, failing open. Supersedes p0341b, whose spec was left untouched -> .agentsmith/phases/done/p0341d-continuous-master-context.yaml"
    p0341c: "Load-bearing ledger (backend + coding master skill): the iteration cap becomes an anti-runaway ceiling and the per-pipeline cost budget, sized by a complexity tier, fences between and within passes; re-engagement continues while passes progress and the keystone cross-checks the ledger. Skill 1.13.0, embedded pin deferred to the release -> .agentsmith/phases/done/p0341c-load-bearing-ledger.yaml"
    p0341: "Durable progress ledger (backend + coding-agent-master skill): update_progress ships on the coding surface with full-state replace, protected ids, a size cap and targets, seeded from the plan into PipelineContext; the done-vs-diff coverage check is a diagnostic, never a gate. In-loop compaction pin sliced to p0341b -> .agentsmith/phases/done/p0341-durable-progress-ledger.yaml"
    p0340: "Acceptance-driven completion (backend + coding-agent-master skill): MasterVerification carries acceptance dispositions and RunOutcomeKeystone refuses success unless every ratified criterion is met or justified not-applicable (no dispositions fails); GeneratePlan enforces JSON; the skill gains an acceptance array -> .agentsmith/phases/done/p0340-acceptance-driven-completion.yaml"
    p0336c: "Collapse per-toolchain sandboxes (backend): one sandbox per (repo, resolved toolchain image) at the per-field max resource envelope (new ResourceEnvelope.Max), with RunFootprintCalculator aligned to the same grouping so the reserved footprint equals what spawns; the p0268 split test is inverted -> .agentsmith/phases/done/p0336c-collapse-toolchain-sandboxes.yaml"
    p0336b: "Context-level scoping (backend): the scope classifier reply carries contexts per repo, a pure ContextScopeEvaluator narrows one level below repo scoping with keep-all fallbacks, and the sandbox coordinator filters discoveries before the toolchain grouping; dropped contexts surface through the scope decision, not a footprint DB write -> .agentsmith/phases/done/p0336b-context-level-scoping.yaml"
    p0336: "Predictable capacity (backend + dashboard): a run's full pod footprint is computed at admission from the remote context inventory, persisted on a RunCapacity ledger row and reserved atomically against the app budget before the claim, else queued with a visible FIFO position and reason; footprint panel on the run detail -> .agentsmith/phases/done/p0336-predictable-capacity.yaml"
    p0337: "A run can be deleted: single-run delete in any state plus a bulk 'clear terminal runs', removing the run record and every satellite it left behind and force-killing anything still live — so failed/stuck test runs stop cluttering the dashboard and holding resources -> .agentsmith/phases/done/p0337-delete-run.yaml"
    p0338: "The 'Get started' hero link on the marketing homepage (agent-smith.org) 404s — it points at docs.agent-smith.org/getting-started/, a path that does not exist since the docs use get-it-running/. Repoint it to the real entry page so a new visitor's first click works -> .agentsmith/phases/done/p0338-homepage-get-started-404.yaml"
    p0335: "DOCS MIRROR p0162-p0333c AND THE p0324-p0329 BATCH (docs). 197 phases audited into a delta table at .agentsmith/notes/p0335-doc-delta.md; the golden path re-verified against the CLI and the sample config rather than remembered; 5 new pages, 13 duplicate reference pages merged into canonical ones. -> .agentsmith/phases/done/p0335-docs-mirror-and-structure.yaml"
    p0329: "Expectation replay goldens — eval mechanics and ratification metrics (backend + dashboard). Versioned fixtures with anonymization enforced at both ingest and load, a live-LLM-only eval harness with a per-assertion judge and committed reports, plus a metrics endpoint and a /system/expectations view. -> .agentsmith/phases/done/p0329-expectation-replay-goldens.yaml"
    p0328: "Expectation negotiation (backend). A negotiation step after analysis drafts a schema-capped expectation block, ratifies it through the p0327 dialogue gate plus a tracker comment, parses edits deterministically back into the schema, and persists the outcome; the contract reaches prompts, PR body and result. -> .agentsmith/phases/done/p0328-expectation-negotiation.yaml"
    p0326: "agent-smith demo: one command that proves the whole loop (ticket → pipeline → code change → result) on a bundled sample project before any real repo, tracker or infrastructure is connected. The operator's first success happens in minutes and requires exactly one credential: an LLM key -> .agentsmith/phases/done/p0326-golden-path-demo.yaml"
    p0327: "Durable dialogue — checkpoint at the ask, resume on the answer (backend + dashboard). Past a hot-wait threshold a run checkpoints its step cursor and serialized context, parks as waiting_for_input and releases its sandboxes; a durable answer inbox and a leader-elected sweeper resume it through the capacity queue. -> .agentsmith/phases/done/p0327-durable-dialogue-resume.yaml"
    p0324: "agent-smith doctor — active preflight (backend). A preflight check contract plus checks for config schema, LLM reachability, tracker auth, repo access, skills catalog, sandbox spawn and infra; the CLI verb exits non-zero on any failure, the server runs the same set warn-only and surfaces it on /health. -> .agentsmith/phases/done/p0324-doctor-preflight.yaml"
    p0333c: "Static-pattern precision on generated code: self-declared generated files (Roslyn <auto-generated> convention) are regenerated from templates, so hand-review vuln patterns only produce noise there — skip them for non-secret patterns while keeping secret detection -> .agentsmith/phases/done/p0333c-skip-generated-code-static-scan.yaml"
    p0333b: "Git-history secret severity (backend): history-only secrets are emitted as Critical and still-in-tree as High, so neither falls off the merge's High+ promotion cliff. The decision file also records tier-2 master-findings convergence as superseded by p0333, not deferred -> .agentsmith/phases/done/p0333b-git-history-secret-severity.yaml"
    p0330: "Cancel is persistent state and always enforced (backend + dashboard): CancelAsync persists flag, reason and a durable deadline synchronously; TerminateAsync plus a leader-elected CancelEnforcer kills at the deadline, terminalizes the ticket and releases the lease; pre-start gates, set-once finish and cancel state in the UI -> .agentsmith/phases/done/p0330-cancel-is-state-and-enforced.yaml"
    p0331: "Ticket-scoped provisioning (backend): a ScopeRepos step builds a remote per-repo context inventory and one planning LLM call narrows the run's repos before checkout, with all-repos fallback and the scope recorded as a decision; an ensure_repo_sandbox master tool escalates mid-run through the live sandbox coordinator -> .agentsmith/phases/done/p0331-ticket-scoped-provisioning.yaml"
    p0332: "Capacity accounting becomes cost-honest: the ResourceQuota counts requests (what the cluster actually provisions and bills) instead of limits (theoretical worst case), defaults shrink to honest sizes, stack.resources declarations become the exception, and resource-time per run (pod-minutes x request) is visible next to the LLM cost -> .agentsmith/phases/done/p0332-cost-honest-capacity.yaml"
    p0333: "Merge respects the master read-set (backend): the merge moved into a static MasterFindingsMerger where a static-pattern fact in a file the master read is suppressed as implicit rejection (normalized suffix match, empty read-set suppresses nothing), while history secrets and dependency CVEs always promote; suppressed count logged -> .agentsmith/phases/done/p0333-merge-respects-master-readset.yaml"
    p0323: "Prompt-caching revival and cached-share observability (backend + skills-repo PR #118). Anthropic caching re-attached through a raw-representation factory driven by the cache resolver, cache counts read under both key casings with corrected cost math, and cached tokens persisted per LLM call and rendered in the dashboard. -> .agentsmith/phases/done/p0323-prompt-caching-revival.yaml"
    p0322a: "Runs list shows real progress x/y while a run executes (today both numbers derive from the same RunStep rows and are always equal), and init-project runs carry the ticket title like every other ticket-triggered preset -> .agentsmith/phases/done/p0322a-run-progress-and-init-title.yaml"
    p0322b: "Authoritative sandbox-repo attribution and speaking key names (backend). Repo attribution consults the coordinator's SandboxRepos map first and decodes key strings only when the map is absent, and multi-group sandbox keys are composed from the context name instead of language plus size. -> .agentsmith/phases/done/p0322b-sandbox-repo-attribution-and-names.yaml"
    p0322c: "No pull request for run-record-only init diffs, and honest commit failures (backend). InitCommitHandler skips commit, push and PR when every staged path sits under the runs directory, and CommitAsync treats a non-zero exit as a clean tree only when git's own output says so, otherwise throwing with that output. -> .agentsmith/phases/done/p0322c-runrecord-pr-gate-and-honest-commit-errors.yaml"
    p0320a: "Pipeline-aware sandbox sizing and resource clamp (backend). Only code-changing presets consume the context-authored stack resources; every other pipeline gets a light fixed profile, LLM-authored quantities are clamped to a ceiling with a warning, and the write_context_yaml guidance is balanced-vs-cost. -> .agentsmith/phases/done/p0320a-pipeline-aware-sandbox-sizing.yaml"
    p0320b: "Capacity admission computes the run's REAL footprint — orchestrator pod + one sandbox per repo — instead of a single sandbox, so a run that cannot fit is queued before anything spawns rather than crashing into the quota mid-run -> .agentsmith/phases/done/p0320b-admission-footprint-math.yaml"
    p0320c: "A persistent FIFO capacity queue replaces the invisible retry storm: one queued entry per ticket (never N run rows), strict arrival order with no overtaking, a server-side pump that launches the head when capacity frees, and re-launch reuses the same run row -> .agentsmith/phases/done/p0320c-capacity-queue-fifo.yaml"
    p0320d: "Queued runs are first-class in the dashboard: amber 'queued · #position' state in the runs list with the waiting reason, a queued filter chip, position served by /api/runs — no more neutral 'N/N' rows indistinguishable from stalled runs -> .agentsmith/phases/done/p0320d-queued-run-visualization.yaml"
    p0321: "init-project always terminalizes its ticket: the done_status writeback no longer requires an opened PR, so a re-init that produces no changes (or only merges) ends the ticket instead of looping the poller forever. Re-running init stays possible by moving the ticket back to a trigger status -> .agentsmith/phases/done/p0321-init-rerun-and-writeback.yaml"
    p0315: "Chat-first design & delivery partner: discuss in Slack/Teams, and depending on what the work is, just answer, file a bug, author a phase, or decompose into an epic — then let the normal pipeline execute it -> .agentsmith/phases/done/p0315-conversational-spec-dialog.yaml"
    p0315d: "/EXECUTE-PHASE RUNS A PHASE TICKET SPEC-FIRST (backend, slice 5/5 of p0315). The `phase` label routes to a new phase-execution preset; PhaseSpecFromTicket inverts p0315c's renderer; the spec IS the plan, so its steps publish as the approved plan and there is no GeneratePlan; ask_human parks the ticket for a fresh run. -> .agentsmith/phases/done/p0315d-phase-execution-pipeline.yaml"
    p0315c: "/CREATE-PHASE FILES A CONFIRMED OUTCOME AS TRACKER TICKETS (backend + server + skills, slice 4/5 of p0315). Confirmation is a union: approve files, reject files nothing, anything else is an edit note that re-runs the design turn. PhaseTicketRenderer emits the shape p0315d inverts; the sink files bug, phase or epic, parent first. -> .agentsmith/phases/done/p0315c-create-phase-ticket.yaml"
    p0315f: "Real ticket creation in all four tracker providers: ITicketProvider.CreateAsync stops being a throwing default and returns the created id + web URL -> .agentsmith/phases/done/p0315f-provider-ticket-create.yaml"
    p0315e: "TYPED OUTCOME RESOLUTION + EPIC DECOMPOSITION (backend + server + skills, slice 3/5 of p0315). A spec-dialog turn ends in a typed OutcomeProposal (answer | bug | phase | epic), confirmed in-thread before anything routes; every draft validates against phase-spec.schema.json and its requires: edges are checked. -> .agentsmith/phases/done/p0315e-outcome-resolution-decomposition.yaml"
    p0315b: "DESIGN-PARTNER-MASTER + TIERED CODE GROUNDING (backend + server + skills, slice 2/5 of p0315). A follow-up in an open /spec thread runs the spec-dialog preset in-process. Grounding is tiered: the cached ProjectMap first, then a per-turn lazy read-only sandbox. A drafted spec is schema-gated, never surfaced raw. -> .agentsmith/phases/done/p0315b-design-partner-master.yaml"
    p0315a: "Spec-dialog session (server, slice 1 of 5 of p0315). A per-thread design conversation with an active project and repo scope: /spec opens one, list/resume/new manage them, sessions persist as rows in the relational system-of-record rather than volatile Redis, and the router branches ahead of the intent engine. -> .agentsmith/phases/done/p0315a-spec-dialog-session.yaml"
    p0167a: "New pr-review preset (backend): the preset sequence, PR-event webhook routing for GitHub/GitLab/AzDO (opened + synchronize, shared resolver, label override), and AnalyzePrDiffHandler plus a unified-diff parser publishing ContextKeys.PrDiff. Preset parked on KnownBrokenPresets until p0167c; live webhook smoke outstanding. -> .agentsmith/phases/done/p0167a-pr-review-preset.yaml"
    p0167b: "Four pr-review skills (style, correctness, test-coverage, security-overlap) plus the backend they need: SkillObservation line_range, a PrReviewSkillRound prompt path over the PR diff, per-pipeline confidence_threshold. Skills release as 3.19.0, not the spec's 2.8.0; operator still merges and tags. Live smoke waits for p0167c. -> .agentsmith/phases/done/p0167b-pr-review-skills.yaml"
    p0167c: "Render pr-review observations as actual PR comments via the existing IPrCommentProvider abstraction. Implements CompilePrReviewFindings + PostPrComments handlers, plus the comment-marker overwrite semantics for re-review on push. -> .agentsmith/phases/done/p0167c-pr-review-output.yaml"
    p0317: "Ticket conversation and attachments reach the master (backend + skills). Comments read per tracker and rendered chronologically inside the untrusted-input delimiters, images attached as content parts when the agent is vision-capable, text-like documents converted in-sandbox into the run-record attachments dir. Skills 1.11.0. -> .agentsmith/phases/done/p0317-ticket-conversation-and-attachments.yaml"
    p0316: "Tickets drive the run: in-scope instructions in ticket content are followed; destructive/suspicious ones are ignored AND logged as a typed, operator-visible artifact -> .agentsmith/phases/done/p0316-ticket-instruction-contract.yaml"
    p0318: "Ticket comprehension and clarification gate (backend). The Azure DevOps body falls back to repro steps so the planner receives it, the plan summary cap is relaxed, and the re-wired open-questions handler halts on needs-user-input or an empty body and parks the ticket in an opt-in native clarification status. -> .agentsmith/phases/done/p0318-ticket-comprehension-and-clarification-gate.yaml"
    p0300c: "Discovery fetches only agent-smith-tagged tickets, a shared tracker never duplicates a run, and failure/log noise is honest -> .agentsmith/phases/done/p0300c-poller-discovery-and-run-lifecycle-hardening.yaml"
    p0269a: "Capacity-aware admission (server): a full namespace/host queues the next run instead of spawn -> Forbidden -> fail. Two runs the resources fit only one of are processed sequentially; a k8s TOCTOU miss falls back to waiting. -> .agentsmith/phases/done/p0269a-capacity-admission.yaml"
    p0269b: "Render the capacity-waiting state: a 'queued — waiting for capacity' run status in the dashboard + the deferred-admission signal in the System view -> .agentsmith/phases/done/p0269b-queued-run-rendering.yaml"
    p0300b: "No silent degradation: every swallowed error in scan/output paths surfaces as WARN + degraded-flag, and unparseable master output provably cannot drop findings -> .agentsmith/phases/done/p0300b-silent-degradation-hardening.yaml"
    p0300a: "Tracker feature parity: Jira native workflow transitions + GitHub/GitLab lifecycle-status search, so lifecycle handling works identically on all four trackers -> .agentsmith/phases/done/p0300a-tracker-parity.yaml"
    p0299: "Consolidate changes from ALL of a repo's sandboxes into one commit/PR — a mixed-stack monorepo (e.g. dotnet + angular = two toolchain pods, two clones) no longer silently drops the non-primary sandbox's edits at commit time -> .agentsmith/phases/done/p0299-multi-sandbox-commit-consolidation.yaml"
    p0298: "Make CreatePullRequestAsync idempotent for GitLab + GitHub so a ticket re-run whose branch already has an open PR/MR reuses it instead of failing — matching AzureRepos, which already does this -> .agentsmith/phases/done/p0298-idempotent-create-pull-request.yaml"
    p0297: "Stop GitLab context discovery 404ing on nested-subgroup projects: the provider re-escaped the already-escaped project id (%252F), so .agentsmith/contexts listing returned empty → synthetic 'default' → the monorepo verify failed -> .agentsmith/phases/done/p0297-gitlab-projectpath-double-encode.yaml"
    p0296: "Two live-debug hardening fixes: GitLab API base URL comes from the repo url's own host (kill the silent gitlab.com default that 401'd a self-managed intranet repo), and a cancelled DB-open is logged as Debug, not a FAIL with a stack trace -> .agentsmith/phases/done/p0296-selfcontained-gitlab-and-quiet-cancels.yaml"
    p0294: "Stop init-project failing at AnalyzeCode/Discover when the model wraps its JSON in prose: enforce the response shape where the SDK allows it, tolerate a prose-wrapped object everywhere, and log the raw response on parse failure -> .agentsmith/phases/done/p0294-robust-llm-json-responses.yaml"
    p0293: "Connectivity probes — full coverage on /system/connections (backend + dashboard). Probes for agents (a bare one-token call), the sandbox spawner, Redis, the database and configured chat adapters join the p0292 probe path with a category, and the dashboard groups the rows by it. Container registry excluded. -> .agentsmith/phases/done/p0293-connectivity-probes.yaml"
    p0292: "Connection diagnostics (backend + dashboard). ProbeAsync became a required member on the source and ticket provider interfaces, each with its cheapest read-only round-trip; a diagnostics endpoint lists entries without probing and probes one on demand, and a /system/connections page adds an honest webhook panel. -> .agentsmith/phases/done/p0292-connection-diagnostics.yaml"
    p0285: "Resolve exact (non-glob) connection/<name> repo refs deterministically from the connection — no live discovery — so a project can declare a clear STATIC repo list that still inherits host/org/auth -> .agentsmith/phases/done/p0285-static-connection-repo-refs.yaml"
    p0283b: "Composed ticket-discovery query (backend). Discovery narrows per routed project from its per-tracker trigger: a structured query of OR'd branches, translated by per-provider builders and built by an injectable TrackerDiscoveryQueryBuilder, with a positive status allowlist so parking statuses are never re-read and a branch cap. -> .agentsmith/phases/done/p0283b-composed-discovery-query.yaml"
    p0283a: "Ticket-discovery scaling plus two bugfixes (backend, code-only, no spec). Real paging and a hard cap with warn-log in all four providers, the query and its result logged at every call site, status-only narrowing (superseded by p0283b). Also CORS multi-origin with any-loopback in dev, and a SQLite tuning interceptor (WAL, busy_timeout) logging the real connection error. -> code-only (no spec file)"
    p0281a: "p0281 slice — connections catalog with out-of-band repo discovery and glob selection (backend + schema + sample). A background refresher warms a per-connection snapshot (hot cache plus durable last-good) that the sync glob expander only reads; the legacy repos catalog stays as the escape hatch. -> .agentsmith/phases/done/p0281a-connections-repo-discovery.yaml"
    p0281d: "p0281 slice — projectless CLI scans (backend CLI + use case + sample). PipelineRequest gained an optional agent name; --agent builds an ephemeral project from the agents catalog plus one synthetic local repo at --source-path, --project stays working but deprecated, and --agent wins when both are given. -> .agentsmith/phases/done/p0281d-projectless-cli-scans.yaml"
    p0281c: "p0281 slice — deployment version pin (backend + schema + sample). One top-level deployment block feeds both the orchestrator and sandbox-agent images: DeploymentDefaultsApplier fills the legacy image fields only where unset, so the resolvers are unchanged and a present legacy block still wins; per-project orchestrator override dropped. -> .agentsmith/phases/done/p0281c-deployment-version-pin.yaml"
    p0281b: "p0281 slice — tracker owns the workflow (backend + schema + sample). EffectiveTriggerBuilder materializes each project's effective trigger from tracker workflow, flat resolution shorthand and any explicit override before normalization, so every webhook handler, poller and validator reads a pre-merged trigger unchanged. -> .agentsmith/phases/done/p0281b-tracker-owns-workflow.yaml"
    p0280: "Functional spawn_agents — fan-out for scan and coding masters (backend). Children share the master's thread-safe FilesystemToolHost, so their reads and writes land in the master's read-set and code changes; child detail returns via a scoped in-memory answer store, and both masters' surfaces gain the tools when sub-agents are enabled. -> .agentsmith/phases/done/p0280-functional-spawn-agents.yaml"
    p0279: "Scan depth and source anchoring: a coverage re-drive re-prompts the master once when it read fewer than scan_min_source_reads source files, and findings claiming analyzed_from_source on a file the master never read downgrade to potential via lenient path matching. Skills bumped (PR #105); the term denylist stayed a manual grep. -> .agentsmith/phases/done/p0279-scan-depth-and-source-anchoring.yaml"
    p0278: "Scan masters get scan input and scan framing: gated on output_schema == observation, AgenticMasterHandler builds a review prompt carrying the scanner findings and the compressed spec and hands the master a read-only Review tool surface without run_command, skipping the apply and verdict nudges; the coding path is unchanged. -> .agentsmith/phases/done/p0278-scan-master-input-and-framing.yaml"
    p0277: "A security scan delivers the master's triage: MergeMasterFindings ships the curated observation array plus every uncovered High+ scanner fact (empty-but-valid separated from unparseable), and the snapshot writer reads the pre-merge raw set. Needs security-master 1.1.0 (skills PR #101) pinned; stacked on p0267 (PR #319). -> .agentsmith/phases/done/p0277-security-scan-master-triage-delivery.yaml"
    p0267: "An api-security scan delivers findings again: a discrete CollectMasterFindings step scrapes the master's observation-array answer into SkillObservations tolerantly, so an honest zero stays zero, gated on output_schema == observation so a coding master is never scraped. Needs api-security-master 1.1.0 pinned to deliver. -> .agentsmith/phases/done/p0267-api-security-findings-delivery.yaml"
    p0276: "GeneratePlan now runs before Approval in fix-bug and add-feature, and the master executes the rendered plan section instead of planning from scratch. In coding presets the step is best-effort: an unparseable planner response warns and the run continues. Skill bumped to 1.8.0; follow-up p0276a hands the master the ProjectMap. -> .agentsmith/phases/done/p0276-plan-before-execution.yaml"
    p0275: "Run-detail steps are a stable skeleton: RunStartedEvent carries the resolved preset's PlannedSteps and the dashboard seeds its step map from them before ingesting events, so early steps no longer vanish when the buffer evicts them, and absent plannedSteps falls back to event-only. The visual rework is carved to p0275a. -> .agentsmith/phases/done/p0275-run-detail-ia.yaml"
    p0273: "Verification gates on regressions, not on any red: the verdict carries baseline and final failing-test lists and the framework computes the new failures, with absent lists keeping the original binary gate. A keystone failure now surfaces the already-opened PR urls, so committed work is reviewable instead of reading as nothing. -> .agentsmith/phases/done/p0273-regression-aware-verification.yaml"
    p0274: "Live per-call LLM cost is config-aware: a shared OverlayModelPricingResolver layers the agent's pricing config over the defaults and serves both the live EventPublishingChatClient path and PipelineCostTracker, whose private resolver was deleted, so a config-priced model can no longer render $0 live; gpt-5.1 added to the defaults. -> .agentsmith/phases/done/p0274-config-aware-live-pricing.yaml"
    p0245: "Per-language sandbox toolchain images: SandboxConfig.Images maps a language slug to an image, merged over the code-default table and resolved above the LLM-named context.image, below the project toolchain_image, matched case-insensitively; schema and example document it. Corrects the spec's pre-p0265 precedence wording. -> .agentsmith/phases/done/p0245-per-language-toolchain-image-config.yaml"
    p0272: "Operator-declared credentials reach the k8s sandbox pod: agentsmith.yml sandbox.secrets binds env vars via secretKeyRef and mounts secret keys read-only as files, a malformed mapping fails at config load, and the auth command itself lives in context.yaml prerequisites, which the context schema had never declared and now does. -> .agentsmith/phases/done/p0272-sandbox-secret-injection.yaml"
    p0268: "Sandbox CPU/memory sized per-stack from LLM-authored context.yaml `stack.resources`, not per-project — so a dotnet build gets its 4Gi and a passive/bookworm scan in the same project gets a fraction, instead of every run inheriting one project-wide block. -> .agentsmith/phases/done/p0268-per-stack-sandbox-sizing.yaml"
    p0271: "Replace the System → Config topology graph + global-defaults grid with a dense, scannable per-project detail sheet chosen from a project combobox — full repo URLs and full tracker/trigger config included. Less decoration, more information. -> .agentsmith/phases/done/p0271-config-detail-sheet.yaml"
    p0270b: "Turn the System → Config view from a static catalog into a read-only EXPLAINER: click-to-drill-in (no truncation), every effective value shown WHERE it applies with its provenance (default vs override), and tracker states labelled by ROLE (triggers / done / failed). Renders the materialized ResolvedConfig from p0270a. -> .agentsmith/phases/done/p0270b-config-explorer-explanatory.yaml"
    p0270a: "Materialize the resolved agent-smith config ONCE (a single resolution pass at load), with per-field provenance (global-default vs project-override), and make the run path READ that object instead of re-resolving on-demand — one source of truth for \"what will actually run\", the k8s-admission-style desired state. -> .agentsmith/phases/done/p0270a-materialize-resolved-config.yaml"
    p0266: "A read-only Config view in the dashboard that visualizes the resolved agent-smith config and everything reachable around it — projects wired to their repos, trackers, agent and pipelines, plus the sandbox / orchestrator / limits / cost-cap defaults — as a relationship graph + design-system detail cards, secrets redacted server-side. -> .agentsmith/phases/done/p0266-dashboard-config-explorer.yaml"
    p0265: "The context LLM names the sandbox toolchain image in context.yaml stack.image and agent-smith consumes it over the language table, fixing net8 repos resolving to sdk:9.0 and frameworks with no table row. Resolution is operator override, validated context image, table, fallback, behind a trusted-registry and git-bearing gate. -> .agentsmith/phases/done/p0265-llm-named-toolchain-image.yaml"
    p0264: "Watch-loop event stream polish: the timestamp and kind-tag columns were widened so the tag no longer jams against the time, a 1s tick makes the 'Xs ago' freshness count live, and the dense rows move one typography rung up using dsh-* tokens only, keeping the p0217 drift guard green. -> .agentsmith/phases/done/p0264-system-stream-ui-polish.yaml"
    p0263: "Verdict nudge: when a green-tests pipeline's master emits no parseable verdict, the handler re-prompts it once to build, test and emit only the verdict block, and re-parses; the keystone still gates. The durable lever stays the model - gpt-5-codex is the only codex model speaking the chat-completions API, 5.1+/5.2/5.3-codex are Responses-only. -> .agentsmith/phases/done/p0263-verdict-nudge.yaml"
    p0262: "Ticket status is derived, not stored: the TicketLifecycles table, its DbAuthoritative transitioner, LifecyclePollFilter and the whole StaleJobDetector are gone; tag writes are unconditional markers, the poller skips leased tickets, the claim is lease-only, and the ActiveRunReaper cancels then releases a dead run. -> .agentsmith/phases/done/p0262-status-recognizer-derive-not-store.yaml"
    p0261: "Failure terminalizes the native ticket status via a configurable failed_status in all four providers (unset falls back to done_status), and lifecycle tags no longer gate triggering: LifecyclePollFilter stops excluding Done/Failed, so reopening to a trigger status is the re-run. Config guard rejects done/failed in trigger_statuses. -> .agentsmith/phases/done/p0261-failed-status-terminalization.yaml"
    p0259: "Cancel reads as a cancel, backend and frontend: operator and watchdog cancels publish RunFinished(status=cancelled) while a vanished sandbox stays failed, CancelRequested and CancelReason persist on the run row so a reloaded view shows 'cancelling', and the dashboard gains a fifth NodeStatus with its own glyph plus a lighter icon set. -> .agentsmith/phases/done/p0259-cancel-ux-terminal-status.yaml"
    p0253: "Run-result fidelity: result.md carries the keystone verdict instead of a hardcoded success, and Changed Files excludes `.agentsmith/` run-record artifacts via a shared RunRecordPaths definition CommitAndPR also uses. The canonical plan path needed no change (bare-path deviation is model fitness, p0255); record-PR-on-spend sliced to p0256. -> .agentsmith/phases/done/p0253-run-result-fidelity.yaml"
    p0255: "Framework apply-drive added: when a code-expecting preset sees only run-record artifacts written, the master is re-prompted once to apply its plan and the changes are re-read, with the git keystone still the gate. Forensics showed the skill correct, so the residual is model fitness and model choice stays the operator's lever. -> .agentsmith/phases/done/p0255-master-plans-but-does-not-execute.yaml"
    p0254: "Close the loose ends that kept carrying over this session so nothing is left dangling: (1) the /system/tracker SignalR fix is implemented but uncommitted and unverified live; (2) the backend suite has two parallel-load-flaky tests that intermittently red the full run (green in isolation) and have masked the real signal across p0251/p0252. -> .agentsmith/phases/done/p0254-session-loose-ends.yaml"
    p0252: "Redis job heartbeat retired as a liveness source: IJobHeartbeatService and its implementations deleted, EnqueuedReconciler and StaleJobDetector read DB-lease freshness. AttachRunAsync became an upsert so a direct or PR-comment spawn is lease-backed and reapable too (supersedes p0242's exemption); the in-sandbox HeartbeatLoop stays. -> .agentsmith/phases/done/p0252-retire-redis-job-heartbeat.yaml"
    p0251: "The claim is DB-lease-only: the Redis-heartbeat pre-check in SingleClaimRegionExecutor is gone, so the ActiveRun unique lease is the sole single-run guard and a finished ticket is reclaimable at once. Corrects the spec: the heartbeat does release on finish; the linger is a run that never starts, whose bridge blocked the next claim. -> .agentsmith/phases/done/p0251-db-authoritative-claim.yaml"
    p0209c: "Add Cost and Today's-activity rollup views as KPI card grids reachable from the rail's Rollups section, per p0209-redesign-system.html. -> .agentsmith/phases/done/p0209c-rollup-views.yaml"
    p0210: "Catalog contents in Load-catalog: name arrays (skill/master/concept, sorted server-side) on CatalogLoadedEvent + collapsible lists with concept filter in CatalogLoadBody, counts-only fallback for pre-phase runs (extends p0205)"
