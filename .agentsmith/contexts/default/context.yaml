    p0429b: "A SCAN REPORTS BACK TO THE TICKET IT CAME FROM (backend). Sliced out of p0429a: the coverage account the gate has judged since p0421 renders on three surfaces, but a scan preset reaches NEITHER the ticket comment nor the PR body — both end at DeliverFindings + WriteRunResult, and only the failure path ever comments on a scan's ticket. Giving a scan its own reporting surface is a delivery feature with its own questions. -> .agentsmith/phases/planned/p0429b-a-scan-reports-back-to-the-ticket-it-came-from.yaml"
