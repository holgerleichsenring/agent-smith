    2026-08-28-489a: "THE LEGACY CATALOG LOCATIONS GO (principles reader + pre-v4.1 prompt-token alias). 4.7.0 is the floor: the pre-4.0.0 principles path is not probed, the alias binding one slot twice is gone, and a test asserts the old layout composes nothing. -> .agentsmith/phases/done/2026-08-28-489a-catalog-legacy-layouts-removed.yaml"
