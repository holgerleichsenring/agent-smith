    p0377: "SANDBOX SECURITYCONTEXT HARDENING (backend + deploy). The compute-side half of p0304: the sandbox — not a command blocklist — is the isolation boundary, but k8s sandbox pods set only fsGroup (run as ROOT, no seccomp, no dropped caps, writable rootfs) and the Docker driver leans on default seccomp alone. Since a host-attacking script can't be caught by string-matching (why the p0376 CommandGuard/CommandRunner blocklists were removed), harden the container: resolved SandboxSecurityProfile (hardened default, compat opt-out) → PodSpecBuilder + DockerContainerSpecBuilder emit runAsNonRoot/uid, drop:[ALL] caps, seccomp RuntimeDefault, allowPrivilegeEscalation=false, readOnlyRootFilesystem with writable /work+/tmp. Same hardening the server pod already carries, applied to the never-hardened sandbox. Compat opt-out surfaces a risk event so a root sandbox is never silent. -> .agentsmith/phases/planned/p0377-sandbox-securitycontext-hardening.yaml"
