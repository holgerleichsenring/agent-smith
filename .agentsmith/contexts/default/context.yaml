    p0219: "One shared primitive kit (Button/Card/Badge/Chip) per DESIGN.md, merge the three duplicate filter-chip implementations, use card-terminal-panel styling for log/CLI/event output, and headline runs by PIPELINE name (the trigger-tag taxonomy) rather than the ticket title. -> .agentsmith/phases/done/p0219-dashboard-component-kit-and-heading.yaml"
    p0220: "Uniform content width + gutters across every surface, with Azure DevOps-solid structure: one width/padding policy on every route, plus tokenised section labels (eyebrow-uppercase) and standardized breadcrumbs. -> .agentsmith/phases/done/p0220-dashboard-layout-structure.yaml"
    p0221: "Render the loaded catalog's actual CONTENT — skills/masters as cards with their rendered SKILL.md, concepts with type + definition — instead of flat name lists, so the catalog view carries real value. -> .agentsmith/phases/done/p0221-catalog-contents-browser.yaml"
    p0222: "Make ALL LLM communication transparent in the UI — every LLM-driven step + the agentic executor surface WHAT they are doing (intent + tool/target + the agent's narration), not just model/tokens/cost. Kill the 'unknown' activity labels. 'Did it run the tests?' must be answerable at a glance. -> .agentsmith/phases/done/p0222-llm-activity-transparency.yaml"
    p0223: "Per-repo commit/PR outcomes (backend + dashboard): new PullRequestOutcome event carrying opened/no_changes/failed with url and reason, emitted per repo from CommitAndPRHandler; PrOutcomeList renders no-changes neutral, opened as a PR link, failed with its reason. Supersedes the closed spec-only PR #276. -> .agentsmith/phases/done/p0223-meaningful-step-outcomes.yaml"
    p0224: "Three live-run fixes (backend + skills prompts): the configured model now rides on LlmCallStarted so in-flight rows stop showing 'unknown'; EnsurePrerequisites runs only the operator-declared context.yaml command at meta.workdir, else the master installs deps itself; analyzer reads context.yaml first and scopes to the declared type. -> .agentsmith/phases/done/p0224-trust-llm-and-context.yaml"
    p0225: "Two Runs-list correctness bugs. (1) The Runs list was empty until a hard refresh on any client-side navigation. (2) Every run except the live one rendered as \"unknown · no repos · 0s\" — even successful ones. -> .agentsmith/phases/done/p0225-runs-list-correctness.yaml"
    p0226: "PersistWorkBranch should reliably checkpoint the agent's work (so a run can resume on the same branch), instead of failing with \"Persist failed in 4/5 repo(s) (Unknown)\". In a multi-repo run the master edits only some repos; the untouched ones were hard-failing on the first `git config` (exit -1). -> .agentsmith/phases/done/p0226-persist-only-changed-repos.yaml"
    p0227: "Run-detail live-watching (dashboard): LLM rows pair on a model prefix so the configured/provider id mismatch stops orphaning calls; sticky header and failure banner; rail selection follows the running step until a click pins it; exit -1 renders neutral 'not run'; unfinished LLM rows flip to 'ended' on a terminal run. -> .agentsmith/phases/done/p0227-run-detail-live-watching.yaml"
    p0228: "Run-detail transparency: per-step chronological command timeline (verb·target·outcome + write-count, so a read-only run is obvious); 14px fonts; light output panel; clickable PR links; commit skips truly-empty repos."
    p0229: "Command-timeline polish: rendered under the repo boxes (live runs stop shifting) + per-repo common-prefix stripped & colour-coded so the acting repo is clear."
    p0230: "Per-project sandbox timeouts in agentsmith.yml: step_timeout_seconds cap + new run_command_timeout_seconds (default 300, replaces hard-coded 60); global with per-project override."
    p0231: "Unified execution timeline (LLM turns merged with the commands they issued, time-ordered) + k8s dashboard Deployment/Service + path-based ingress."
    p0232: "Cancellations now report WHY (registry reason for operator/watchdog; an inner timeout names the active step + the timeout levers) instead of 'A task was canceled'; timeline newest-first; '● working' pulse; k8s dashboard no longer forces nonroot."
    p0233: "Runs list updates live on a new job: fold JobUpserted into the overview inside the singleton hub client + re-emit the behavior subject, so a remounting list shows the current list (was stale until reload)."
    p0234: "Per-repo run-record: each repo writes its own .agentsmith/runs/{runId}/ scoped to itself, force-staged so it always commits; PR per changed repo, one record-PR if nothing changed; clear factual outcome message."
    p0235: "LLM NetworkTimeout fix (SDK default 100s → config 300s) — the real cause of a 139s 'A task was cancelled'; dashboard image folded into the docker-publish matrix; result view renders styled markdown + frontmatter header; plan.md cached + shown next to result.md."
    p0236: "Pinned the cancel mechanism: SDK NetworkTimeout TaskCanceledException caught inside the skill call (one layer below p0232) → surfaced raw. BuildResult now maps it to a network_timeout_seconds message; MaxInputTokensPerSkillCall 200k→500k headroom (still observational — RecordLlmCall unwired)."
    p0237: "A failed, cancelled or timed-out run now always runs the finalizer tail (WriteRunResult + CommitAndPR), recording result.md with an Outcome reason and a record/partial PR; operator-cancel propagates while an internal timeout becomes a failed step; plan.md moved into the run dir; coding-agent-master v1.5.0. Folds in p0236. -> .agentsmith/phases/done/p0237-robust-finalization-and-plan-runrdir.yaml"
    p0246e: "Durable run artifacts: DbRunArtifactStore decorates the inner store, mirroring result.md/plan.md/analyze.md into the DB and reading DB-first so they survive a restart or a Redis flush; transient in-flight slots stay transport-only; child rows are keyed by indexed RunId with the enforced FK dropped. Transport and UI carved to p0246f. -> .agentsmith/phases/done/p0246e-redis-thin-notify.yaml"
    p0246d: "TicketLifecycle: the DB is the system-of-record; the platform label (AzDO/GitHub/…) is a BEST-EFFORT PROJECTION written AFTER the DB transition for operator visibility. On drift the DB WINS; a label that fails to update is logged, not authoritative. Avoids two competing truths. -> .agentsmith/phases/done/p0246d-lifecycle-projection.yaml"
    p0246c: "Server-side run event projector: CompositeRunEventFanout wraps the hub fanout with an optional RunDbProjector at the IRunEventFanout seam, RunEventApplier maps every structured event to an ER entity with the raw trail batched, DbRunStore reads list and detail back, RunRetentionService prunes aged trail (default 90d). -> .agentsmith/phases/done/p0246c-event-projector-and-stores.yaml"
    p0246b: "The DB ActiveRun lease becomes the authoritative single-run claim guard (unique project+ticket insert maps to AlreadyClaimed) beside the kept Redis heartbeat, with a positive-evidence ActiveRunReaper. Opt-in via AGENTSMITH_PERSISTENCE_PROVIDER; JobId-attach-at-spawn and StaleJobDetector removal land in p0246c/d. -> .agentsmith/phases/done/p0246b-claim-lease-cutover.yaml"
    p0239c: "Chat-adapter wire tests: the OpenAI/Azure/Anthropic builders take an optional HttpMessageHandler test transport (null in production); six tests fake it below IChatClientFactory for request shaping, response and tool-call parsing, and ResolveNetworkTimeout (300s default). NonDiCtorRuleTests allows optional defaulted params. -> .agentsmith/phases/done/p0239c-chat-adapter-wire-tests.yaml"
    p0246g: "Persistence reshaped to the reference pattern: a scoped DbContext as the unit of work with per-entity repositories, no IDbContextFactory, background singletons opening a scope per operation, the server always wiring DB and Redis from config while the CLI stays DB-free, and `agentsmith database migrate` from an init-container. -> .agentsmith/phases/done/p0246g-persistence-shape-and-migration.yaml"
    p0246: "Relational system-of-record (EF Core, server-mode): every run fact lives in the DB; Redis is demoted to thin change-notifications and the UI/listeners read from the DB. -> .agentsmith/phases/done/p0246-relational-system-of-record.yaml"
    p0242: "Orchestrator-authoritative liveness, rescoped to the DB world: ExecutePipelineUseCase attaches the ActiveRun lease, pumps a 45s heartbeat and releases on every terminal path; StaleJobDetector reads liveness from the DB lease and cancels a stale run before reverting; SandboxOrphanReaper unions lease run ids with runs:active. -> .agentsmith/phases/done/p0242-orchestrator-authoritative-liveness.yaml"
    p0250: "Sandbox addressing unified on the repo name (the write half of p0249): the master prompt exposes distinct repo names and FilesystemToolHost aliases each name to its sandbox via the key->repo map (additive, composite keys still resolve), so write and commit resolve the same sandbox by construction. -> .agentsmith/phases/done/p0250-unify-sandbox-addressing.yaml"
    p0249: "Multi-repo runs recorded source edits but committed nothing: SandboxesForRepo decoded only the `<repo>`/`<repo>/<ctx>` key forms and missed the multi-group `<repo>-<langSlug>` form. The coordinator now publishes an authoritative sandbox-key->repo map, and CommitAndPR logs the resolved key plus the staged set per repo. -> .agentsmith/phases/done/p0249-sandbox-repo-resolution.yaml"
    p0247: "Surface analyze.md (\"what the agent understood\", p0243) inline in the Analyze-codebase STEP's detail pane, not only on the Architecture overview node. Same artifact, found where the operator looks for it. -> .agentsmith/phases/done/p0247-analyze-md-at-step.yaml"
    p0246f: "Thin-notify transport and UI read path: GET /api/runs and /api/runs/{id} serve list and detail from the run repository, JobsHubFanout emits a thin RunsChanged nudge instead of a full snapshot, the dashboard fetches on mount, nudge and reconnect with client-side caching removed, and p0239b's fixtures are regenerated as DB-frame replays. -> .agentsmith/phases/done/p0246f-thin-notify-ui.yaml"
    p0246a: "Persistence foundation, unwired: new AgentSmith.Infrastructure.Persistence (EF Core 8.0.13) with 10 ER entities, AgentSmithDbContext as IUnitOfWork, sqlite/postgresql/mysql selection, a per-provider unique-violation translator and the InitialCreate migration; proven on a real SQLite engine, not EF-InMemory. b-e wire the hosts. -> .agentsmith/phases/done/p0246a-persistence-foundation.yaml"
    p0239b: "Harness breadth: one parametrized cross-provider ticket-lifecycle matrix over GitHub/GitLab/AzDO/Jira, a recorded JobUpserted-stream dashboard e2e slice, and the three-tier gate model in CI. Chat-adapter wire tests carved to p0239c; full live-SignalR UI fixtures arrive with p0246 thin-notify, which regenerates them. -> .agentsmith/phases/done/p0239b-cross-provider-ui-and-adapter-coverage.yaml"
    p0239: "Deterministic verification harness: fast-tier write fidelity closed with a stub analyzer, every keystone outcome named, exception paths covered. Found two real bugs - the harness seeded PipelineName with the concept value (false-green keystone) and CommandExecutor swallowed operator-cancels. -> .agentsmith/phases/done/p0239-deterministic-verification-harness.yaml"
