    2026-09-03-7bac: "THE CONTEXT WORKDIR STOPS PLACING COMMANDS (backend + skills). Run 5a18: at a sub-tree workdir the bare build passed while the test command naming a sibling project could not find it. meta.workdir says where SOURCE lives; every command runs at the repo root and carries its own cd. -> .agentsmith/phases/done/2026-09-03-7bac-context-workdir-places-nothing.yaml"
    2026-09-03-b028: "A PUBLISHED EVENT REACHES ITS READER (backend). Two EventType values had no EventTypeResolver row, so the envelope dropped them to null silently: PR outcomes never reached the run snapshot, TicketInstructionIgnored never arrived. Rows added; an enum-driven test guards both hierarchies; a dropped code is logged. -> .agentsmith/phases/done/2026-09-03-b028-event-type-resolver-rows.yaml"
    2026-09-01-6686: "THE API SCAN IS SCORED AGAINST A SERVED TARGET (harness). The stub target grew seven endpoints and the behaviour they describe; the preset runs on an agent CLI against loopback through the PRODUCTION swagger provider, scored by method and path template, silent steps named. First run 0/4 and 0/3. -> .agentsmith/phases/done/2026-09-01-6686-api-scan-eval-served-target.yaml"
    2026-08-28-cc40: "THE SECURITY SCAN IS MEASURED AGAINST KNOWN FLAWS (eval tier). The preset runs on an agent CLI over a corpus of five declared weaknesses and five sound files; misses and false alarms over their own denominators, silent steps named, report keyed by model + master digest. First run 0/5 and 1/5. -> .agentsmith/phases/done/2026-08-28-cc40-security-scan-eval-corpus.yaml"
    2026-09-01-72c5: "A RATIFIED FILE SURVIVES ITS OWN RENAME (bootstrap round). A repository carrying only the retired coding-principles.md has it moved to principles.md before the round reads it, so the preserve branch keeps the ratified section instead of composing over it. git mv, falling back to mv when untracked. -> .agentsmith/phases/done/2026-09-01-72c5-bootstrap-principles-rename-survives.yaml"
