    2026-09-03-ee12: "A VERIFY COMMAND RUNS WHERE THE PROJECT SAYS (verify stage resolution). The inferred rung pinned every command to /work, so a repo whose manifests live a directory down built nothing (a06c). It reads meta.workdir now, p0224's one location source; IsDotnet and the .NET search go. -> .agentsmith/phases/done/2026-09-03-ee12-verify-command-workdir.yaml"
    2026-09-04-102b: "THE DATABASE CONNECTION ARRIVES BY ENVIRONMENT (config bootstrap + file loader + k8s manifests). AGENTSMITH_PERSISTENCE_PROVIDER + _CONNECTION replace the file's block at BOTH readers, together or not at all — half a pair is a blocking finding. The ${db_password} promise nothing expanded is withdrawn. -> .agentsmith/phases/done/2026-09-04-102b-persistence-connection-by-environment.yaml"
    2026-09-04-0721: "RE-INIT BOOTSTRAPS EVERY CONTEXT IT PROBES (init discovery + per-context analysis). The short-circuit projected one context per SANDBOX while the gate probed every one, so a two-context repo was half-migrated and the next coding run refused. Each round now carries its own subtree's map. -> .agentsmith/phases/done/2026-09-04-0721-bootstrap-re-init-every-context.yaml"
    2026-09-04-ae3a: "A BOOTSTRAP REFUSAL NAMES THE CONTEXT IT MEANS (probe + gate). The probe answers per context instead of folding three booleans over a sandbox, so the refusal says which context lacks which file — and the retired-name sentence goes with the context it is true of, not the repository. -> .agentsmith/phases/done/2026-09-04-ae3a-bootstrap-refusal-names-context.yaml"
    2026-09-03-2f81: "A PHASE ID MAY CARRY A SERIES LETTER (both schemas, six readers, the dashboard mirror, the commit gate, CLAUDE.md). Phases cut from one piece of work share one number and differ by a trailing letter. An unwidened reader does not refuse such an id — it stops seeing a phase id, and the rules keyed on that go quiet. -> .agentsmith/phases/done/2026-09-03-2f81-phase-id-batch-letter.yaml"
    2026-09-20-4b0aa: "A FIRST MESSAGE OPENS ITS CONVERSATION IN ONE ACT (spec-dialog message route, dashboard dispatcher, send path). Two accepted posts were two unordered tasks: the message lost and got the tutorial, or won and the armed reseed wiped the echoed turn. The project rides on the one post; the image route's open is reused. -> .agentsmith/phases/done/2026-09-20-4b0aa-dialog-opening-is-one-act.yaml"
    2026-09-20-2ba8: "A FILED TICKET CARRIES ITS PROJECT'S ROUTING TAG BEFORE IT RESOLVES (ticket port, four providers, spec-dialog starter). It is tagged just before resolving, never at creation, where it would be claimable before its approved set exists. An empty value, or one the tracker's label grammar refuses, is skipped and reported. -> .agentsmith/phases/done/2026-09-20-2ba8-filing-tags-before-it-resolves.yaml"
    2026-09-22-b3d7: "AN APPROVED CUT FILES ONE TICKET (spec-dialog filing, renderer, role, notice, card). The slice records duplicated the work ticket's own slice list, so their filer, label writer, links and comment are gone; one path files a phase and a cut alike. The phase-epic reader stays, so both generations already filed stay unroutable. -> .agentsmith/phases/done/2026-09-22-b3d7-epic-slice-records-removed.yaml"
    2026-09-22-766b: "A FILING ROUTES ON ITS APPROVAL, NOT ON A WORD IT WROTE (resolver, filing, discovery guard, note). One stamp says approved AND picks phase execution, so no board gains a framework word; the phase word a PERSON types still binds. Predecessor gate retired whole: two legacy children may now run at once. -> .agentsmith/phases/done/2026-09-22-766b-routing-binds-to-the-approval.yaml"
    2026-09-22-b6ad: "AN APPROVED SET REACHES ITS TICKET BRANCH AT FILING (source-provider contract + four providers, spec-dialog filing, set renderer). One checkout-free write puts all four file kinds there, mints revision 1, fingerprints the ticket read back and records the pointer — phase and cut alike. A failed write is a note, not an error. -> .agentsmith/phases/done/2026-09-22-b6ad-spec-branch-at-filing.yaml"
    2026-09-22-8b25: "A RESERVED PHRASE RE-CUTS AN APPROVED SPEC (revision cause, demand reader, re-approval, notices). A comment OPENING with the phrase on its own line cuts the approved set again and records a new approval attributed to its author; every other comment and edit still leaves it standing. -> .agentsmith/phases/done/2026-09-22-8b25-spec-recut-on-demand.yaml"
    2026-09-22-6ad7: "A RUN TAKES ITS SPEC FROM THE TICKET BRANCH ONLY (source precedence, branch reader, filed gate, hand-back). The reader says WHY it found nothing: answered is the set, nothing-at-the-path takes the record once, unreadable parks. The approved arm, the merge and the run-side cap are gone; the record keeps the repos. -> .agentsmith/phases/done/2026-09-22-6ad7-spec-source-is-the-branch.yaml"
    2026-09-22-2d11a: "A LABELLED SANDBOX IS NOT A CORPSE, AND A HOLD NEVER DENIES A RUN (one shared reap judgement, a conversation label, the held rail, three capacity doors, the window setting). Nothing holds anything yet — 2026-09-22-2d11b does — so with no label and an empty register every verdict and admission is today's. -> .agentsmith/phases/done/2026-09-22-2d11a-sandbox-hold-is-evictable.yaml"
    2026-09-22-2d11b: "A DESIGN CONVERSATION HOLDS ITS SANDBOXES BETWEEN TURNS (opener split into spawn and prepare, the scope takes and keeps the INNER sandbox, a take verified by the agent heartbeat, a held tree refreshed to the remote HEAD instead of cloned, released on close/fork/delete). -> .agentsmith/phases/done/2026-09-22-2d11b-dialog-scope-outlives-the-turn.yaml"
