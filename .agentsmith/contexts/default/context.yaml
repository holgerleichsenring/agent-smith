    2026-09-01-b0d7: "A WORKER CALL REPORTS WHAT IT COST (envelope unwrapped in the process result; --output-format json opt-in per agent). Silence, retry, guard and parser decide on the answer text; CLI tokens and USD get their own ledger, outside accrued spend and the unpriced alarm; the fence's token arm binds, money arm does not. -> .agentsmith/phases/done/2026-09-01-b0d7-worker-call-cost-report.yaml"
    2026-09-01-85b2: "EVERY DELIVERED FINDING FACES THE REFUTER (finding substantiation). The checked set is every finding, not only the ones a master's silence promoted — and only an unauthored one is dropped for an unresolvable citation. Evidence read across all sandboxes, an absent line shows nothing, verdicts route by id. -> .agentsmith/phases/done/2026-09-01-85b2-scan-finding-refuter-covers-all.yaml"
    2026-09-02-de87: "A SCAN PERSISTS NOTHING AND A CODING RUN DOES (failure path). The persist guard named three commands no preset has and one the SCAN presets carry, so a failing scan staged the tree it read while the coding preset never persisted at all. Decided now by DeliverFindings and CommitAndPR. -> .agentsmith/phases/done/2026-09-02-de87-run-failure-path-preset-marks.yaml"
    2026-09-01-e14d: "THE BOOTSTRAP PROPOSES THE GATES THE ESTATE HAS (bootstrap master + verify_derived_from + drift note). The master derives verify stages from the repository's own CI and names the files; the framework stamps their hash and a later run reports a moved source without changing what runs. -> .agentsmith/phases/done/2026-09-01-e14d-bootstrap-verify-block-derivation.yaml"
