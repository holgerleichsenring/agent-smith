done:
  - "A ticket closed from the list or its page leaves Waiting on review, Failed or PR closed and appears under Closed with who closed it, when and why, while its pull request may still be open."
  - "A person's comment or review on its pull request after the close, a merge with no later attempt, or a new attempt brings it back to Waiting on review, Done or the attempt's own bucket without anyone touching the mark; a failed record read never does."
  - "A ticket whose pull requests all closed unmerged is under PR closed, one whose last attempt failed is under Failed, Ended keeps only what is neither (a cancelled attempt, a success without a pull request), and the counts say how many of each."
  - "A ticket that waits for a closed ticket stays waiting, and its waits-for chip, the graph and the requires list say the required ticket is closed; a ticket closed by hand costs no background tracker read."
  - "Build green, full suite green, dashboard gen/test/build green."
