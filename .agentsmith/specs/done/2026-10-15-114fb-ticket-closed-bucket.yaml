assumptions:
  - "2026-10-15-114fa lands ITicketClosedMarkStore.OfAsync, TicketClosedMark (ClosedAt, By, Note, ClosedPullRequests, TrackerClosed), the ClosedTickets table, the resolution carrying agent-smith's marker, and the act's refusal of a close the Done arm would answer."

scope:
  in: >
    BUCKETS: TicketBucket gains Closed "closed", Failed "failed", PrClosed "pr_closed", all in All; TicketClosedKinds
    (Server/Models) ByHand "by-hand" and Tracker "tracker" (the tracker kind is set by 2026-10-15-114fc);
    TicketSummaryView's Kind doc names both kinds on a closed row and LastOutcome's names the failed, PR-closed, closed
    and idle rows. RECORDS: PrReviewRecordView gains init LastPersonEntryAt — the newest entry that is not ours, not a
    bot's, and not a system note unless it carries a decision — from a second grouped read beside the existing newest
    one (70 -> at most 78); TicketPullRequestView gains PersonActivityAt as a defaulted parameter, filled by
    TicketReviewState (44 -> at most 46). RULE: TicketClosedRule (Server/Services/Tickets, at most 50 lines)
    InForce(mark, newest, pullRequests, doneAt) where doneAt is the Done arm's own (DoneAt(records) ?? landedAt): the
    Done arm would not answer (doneAt null, or newest.StartedAt > doneAt); newest.StartedAt <= mark.ClosedAt; no pull
    request with PersonActivityAt later than ClosedAt + PreviousAttempt.SkewMargin. TicketBucketRule.Of gains
    `TicketClosedMark? closed = null`; after working it answers Closed (kind by-hand, since = ClosedAt, last outcome the
    newest status) when the mark is in force; the arms after done move into a helper (stuck, pr_closed for landing
    unmerged, failed for a failed newest, idle) so no method passes 20 lines (52 -> at most 66). STANDINGS:
    TicketStanding gains an init Closed dictionary (project, ticket id) -> mark and ClosedOf(Run); TicketStandings
    reads it per tracker connection from the same configuration load and (tracker, key) projection LandedAsync builds,
    the projection shared by both reads (92 -> at most 104); TicketSummaryComposer passes standing?.ClosedOf(head) and
    sets the summary's Closed view whenever a mark is stored (52 -> at most 56). TicketSummaryView gains
    `TicketClosedView? Closed = null` (At, By, Note, ClosedPullRequests, TrackerClosed). NEVER RUN: FiledTicketRows
    reads the marks of its filings' keys (one call per tracker connection, beside TicketNodeStates.LandedAsync) and
    answers Closed (kind by-hand) for a filing with a mark and no landing (91 -> at most 100). WAITS-FOR:
    TicketWaitsForView gains `bool Closed = false`; a static helper ClosedRequirements (at most 30 lines) keys every
    never-run row's entries by (the entry's project's tracker connection, TicketKey.For(that tracker type, entry
    TicketId)) against TicketNodeStates.Summaries and sets Closed when that summary's bucket is closed;
    TicketListReader.AllAsync applies it with TicketProjects.Of (95 -> at most 99); graph and requires entries show
    the closed bucket through TicketNodeStates unchanged. CHECK OFFER: TicketListReader offers a failed page row to the
    between-attempts check only when it is not closed by hand (a tracker-closed row stays offered, so a reopen on the
    tracker is seen). COUNTS: TicketCountsView gains Closed, Failed, PrClosed (default 0) (30 -> at most 34);
    TicketCounts counts them (48 -> at most 54); Idle keeps counting the remainder. MOVED ASSERTIONS:
    TicketReviewReadTests.cs:75 Idle -> Failed; TicketLandingTests.cs:28-35 renamed
    TicketBuckets_AllPrsClosedUnmerged_IsPrClosedWithLandingUnmerged, Idle -> PrClosed; TicketStuckTests.cs:88, :94,
    :106, :254 Idle -> Failed.
  out: >
    A commit pushed after the mark, a reopened pull request and a person's tracker close — 2026-10-15-114fc (the
    reopen is a stored time set by a successful read, because a check time cannot show it). Sections, dot, dialog and
    Reopen — 2026-10-15-114fd. The requires gate's refusal sentence naming a closed ticket — nobody (contract default
    15): the dependents say so on the graph, the requires list and the waits-for chips. Where cancelled attempts and a
    success without a pull request go — they stay idle until the operator answers contract question Q2.

decisions:
  - key: "CLOSED RANKS BELOW LIVE WORK AND ABOVE REVIEW. A running or parked attempt is the newest truth and started after the mark (114fa refuses a close while live), so it shows as it is; above waiting-on-review because a hide-only close leaves the pull request open, and hiding it is the point."
  - key: "THE MARK YIELDS TO DONE EXACTLY WHERE DONE ANSWERS. Done counts deliveries; a merge after the mark is the operator's 'a merge brings it back to Done'. A ticket that merged and then failed a re-work is not Done today, so a close of it is in force; the act refuses exactly the Done arm's cases."
  - key: "ACTIVITY IS A PERSON'S, AFTER A MARGIN (contract defaults 10, 11). Our own notes, bots and the host's system note for the close itself would bring every closed ticket straight back; a decision written as a system note is a person's review. Five seconds past ClosedAt keeps a comment typed just before the close from undoing it, the inverse of the stuck rule's margin; replica clock skew between a run's StartedAt and the mark's ClosedAt has no margin and errs toward the attempt."
  - key: "NO REOPEN BY CHECK TIME. A record's check time also advances on a failed read and on a refresh that read before the close, so 'open and checked after the mark' would flip a just-closed ticket back to Waiting on review; the reopen is 114fc's stored time, written only by a successful read that sees ended -> open."
  - key: "THE MARK STAYS STORED WHEN ACTIVITY BRINGS THE TICKET BACK. Closed is a timestamped mark, not an end state; the rule decides from it every read, the summary still carries it so the page can say when it was closed, and only Reopen or a new Close changes it."
  - key: "SPLIT BY THE EXISTING LANDING. pr_closed is TicketLanding unmerged, the same fact the dot already paints; failed is the newest status. pr_closed outranks failed, as the dot does, because a closed pull request is the decision that remains."
  - key: "THE WAITS-FOR FLAG IS KEYED BY TRACKER AND KEY. The entry carries the dependent's project, so a (project, id) match misses a required ticket of another project on the same connection; the required key is rebuilt from the connection, the way the requirement edge stores it."
  - key: "A TICKET CLOSED BY HAND COSTS NO TRACKER READ. The list offered every failed page row to the background check; a hidden one would keep being read every five minutes while the page is open. A tracker-closed row is still offered, since the check is how its reopen is seen."
  - key: "A CLOSE NOTE STARTS NOTHING. Traced: a comment webhook routes a keyword comment unless OwnTicketComment marks it ours; 114fa's resolution opens with that marker, so the note never reaches the keyword test."

steps:
  - id: buckets
    action: "TicketBucket Closed, Failed, PrClosed in All; TicketClosedKinds; TicketClosedView, TicketSummaryView.Closed and the Kind / LastOutcome docs (56 -> at most 60)."
  - id: records
    action: "PrReviewRecordView.LastPersonEntryAt from a second grouped read (70 -> at most 78); TicketPullRequestView PersonActivityAt from TicketReviewState (44 -> at most 46); run the Rework.Records and Tickets classes."
  - id: rule
    action: "TicketClosedRule.InForce over the Done arm's doneAt (at most 50 lines); TicketBucketRule closed arm after working and a tail helper for stuck / pr_closed / failed / idle, every method at most 20 lines (52 -> at most 66)."
  - id: moved-assertions
    action: "TicketReviewReadTests.cs:75, TicketLandingTests.cs:28-35 (renamed), TicketStuckTests.cs:88, :94, :106, :254 move to Failed / PrClosed; run those three classes."
  - id: standings
    action: "TicketStanding.Closed and ClosedOf; TicketStandings shares LandedAsync's (tracker, key) projection with the marks read (92 -> at most 104); TicketSummaryComposer passes the mark and fills Closed (52 -> at most 56)."
  - id: never-run
    action: "FiledTicketRows answers Closed for a marked, unlanded filing (91 -> at most 100); ClosedRequirements keys waits-for entries by (tracker, key) and TicketListReader.AllAsync applies it; the check offer skips a by-hand closed row (95 -> at most 99)."
  - id: counts
    action: "TicketCountsView Closed, Failed, PrClosed (30 -> at most 34); TicketCounts (48 -> at most 54)."
  - id: tests
    action: "Red first, then green, for every test below; run the Tickets, Rework.Records and Persistence classes touched with --filter."

