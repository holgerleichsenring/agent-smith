assumptions:
  - "2026-10-13-9a59d replaces WithDescription with the ONE copy method Ticket.With(description, webUrl) and appends .With(webUrl: ...) to the Jira and Azure DevOps mapped lines; this spec adds an isClosed argument to that method and that call, never a second copy method."
  - "Jira Cloud and Data Center return status.statusCategory.key ('new', 'indeterminate', 'done') inside every status object they return; a status without it reads not closed."
  - "An Azure DevOps work item type's states change rarely enough that a 30-minute per-type cache (the connection cache's TTL) is current."
  - "A tracker token used by agent-smith is not also a person's own account; where it is, that person's closes read as ours."

scope:
  in: >
    FLAG: Ticket gains IsClosed (bool, constructor parameter defaulting false); 2026-10-13-9a59d's Ticket.With gains
    `bool? isClosed = null` (null keeps). The tracker counts the ticket done or closed by its OWN category, never by a
    configured status name (operator decision 1). GitHubFieldMapper: issue.State.StringValue is "closed" (StringValue,
    as Status already reads it, so an unknown state string never throws). GitLabFieldMapper: state "closed".
    JiraFieldMapper: fields.status.statusCategory.key is "done". InlineTicket stays false by construction (an inline
    requirement has no tracker). Azure DevOps: a new AzureDevOpsStateCategories (provider path, not the mapper) reads
    GetWorkItemTypeStatesAsync(project, type) through a delegate, caches it statically per (organization, project,
    type) for 30 minutes, and answers whether a state's category is Completed or Removed; GetTicketAsync passes
    isClosed in d's .With on the mapped line, and the WIQL runner reads the categories once per distinct type of a
    batch and maps each item with it. A states read that fails throws, like the work-item read beside it.
    HISTORY: ITicketStatusHistory gains NewestMoveIntoAsync(ticketId, status) — the newest move into ONE status by
    ANY actor, IsApp carried — on all four: GitHub issue events 'closed' (or 'reopened' for open), GitLab
    resource_state_events 'closed' (or 'reopened'), Jira changelog status items, Azure DevOps updates' System.State.
    Each provider forwards in one line (GitHub collapses its three-line NewestPersonMoveIntoAsync forwarder to one:
    189 -> 188; GitLab 190/191, Jira 198/206, Azure DevOps 215/218). PARK STATUSES: TicketParkStatuses
    (Application/Services/Tickets) is the ONE resolver of the statuses agent-smith itself sets, from the project's
    effective trigger then tracker: Done (trigger done_status), Failed (failed_status, else Done, as the spawn seeds
    it), Clarification (trigger then tracker), NotImplementable (trigger then tracker, else Clarification); Own(status)
    and IsHandbackPark(status). ReworkParkCheck's done/failed test and IsHandbackPark read it and its private Either
    goes, with no change in which statuses park (the effective trigger already inherits the tracker's). CLOSURE:
    TicketClosure (Application/Services/Tickets, transient, registered on PipelineHandlersExtensions.cs:43 beside
    TrackerIdentity, no line added) — ClosedForWorkAsync(project, provider, ticket): false unless IsClosed; false when
    the status is one of TicketParkStatuses; when no done_status is set (Done blank or no trigger), the run's own close
    lands in the tracker's default close and the status cannot tell it from a person's, so the history decides — the
    newest move into the current status by an actor that is neither the token's identity nor an app reads closed for
    work; ours, an app, no move found, an unknown token identity or a failed history read reads not closed for work;
    otherwise true.
  out: >
    Using the answer — what an approval does on a ticket closed for work — 2026-10-13-9a59l; Retry refused on a
    ticket closed for work — 2026-10-13-9a59n; a keyword comment or pull-request act on a ticket closed for work
    filing the follow-up — 2026-10-13-9a59t. Showing the tracker state on the ticket view — 2026-10-13-9a59d records
    it, 2026-10-13-9a59q renders it in the detail header. Not built by any member of this series: replacing
    AzureDevOpsOpenScope's configured open states or Jira's statusCategory JQL with the flag (those are discovery
    queries run inside the tracker, which the flag cannot serve); SpecParkStatusResolver stays the run-side resolver
    over the run's seeded context.

decisions:
  - key: "CLOSED IS THE TRACKER'S CATEGORY (operator decision 1, 2026-10-13). Jira statusCategory Done, Azure DevOps state category Completed or Removed, GitHub/GitLab issue closed. IsClosed consults no configured status, so it means the same on every tracker; what agent-smith set is TicketClosure's question, not the flag's."
  - key: "CLOSED FOR WORK = A PERSON CLOSED IT (main-thread decision 1, 2026-10-13; pending operator ratification (2026-10-13)). A ticket is closed for work only when its status is in the closed category AND is not a status agent-smith itself sets: done_status, failed_status, needs_clarification_status, not_implementable_status, nor the close a run performs when no done_status is configured. A Request changes or /agent-smith on a run's own PR therefore still reworks a ticket the run moved to Done (2026-10-12-3a36 unchanged); only a person's close gets a follow-up. If the operator rejects it, TicketClosure shrinks to IsClosed and 2026-10-13-9a59l/n/t keep calling it."
  - key: "WHICH RULE PER TRACKER. With a done_status configured, the configured-status rule decides on all four trackers (a status name agent-smith writes is ours, whoever moved it there last). With none, the run's close lands in the tracker's default: GitHub and GitLab 'closed' (issue events / resource_state_events tell who closed it), Jira tracker done_status or 'Done' (changelog author, accountType app), Azure DevOps tracker done_status or 'Closed' (update RevisedBy; the host flags no apps, so only the token identity filters). The history decides there because the provider defaults live in Infrastructure and copying them into Application would be a second copy of the fallback."
  - key: "AN UNKNOWN CLOSE IS OURS. When the history cannot answer (no move found, Jira Cloud's last page lacks it, the token identity is unreadable, the read fails), the ticket reads not closed for work: the ticket then reworks as today, while a wrong 'closed' would file a follow-up nobody asked for."
  - key: "ONE PARK-STATUS RESOLVER (review3 F1). TicketParkStatuses lives in Application because both callers sit above it (ReworkParkCheck in Server; TicketClosure for 2026-10-13-9a59l, n and t); Domain references nothing that knows a trigger. SpecParkStatusResolver reads the run's seeded context, not the project, and stays."
  - key: "AZURE DEVOPS IN THE PROVIDER PATH, NOT THE MAPPER (review2-g G6). The mapper is synchronous and has no client; the category needs a call per work item type. A per-type static cache in a sealed non-static class (the AzureDevOpsConnectionCache pattern) makes a 200-item hydration cost one call per type, not per item."
  - key: "A FAILED CATEGORY READ FAILS THE READ. Answering 'not closed' on a failure would let an approval continue a ticket its tracker closed. This fails every Azure DevOps GetTicketAsync caller (run start, label writes, park check) and empties a poll cycle while the states endpoint fails; accepted because the per-type cache makes a read rare (review3 F3)."
  - key: "A BOOL, NOT A NULLABLE. Every mapper and both Azure DevOps read paths set it; an inline ticket is false by construction because no tracker holds it."
  - key: "ONE COPY METHOD (coordinator, 2026-10-13). IsClosed travels through the constructor and 2026-10-13-9a59d's Ticket.With; no WithClosed."

steps:
  - id: domain
    action: "Ticket.IsClosed (constructor parameter, default false); 2026-10-13-9a59d's Ticket.With gains isClosed (null keeps). Ticket.cs about 75 of 120."
  - id: mappers
    action: "GitHub (State.StringValue 'closed'), GitLab (state 'closed') and Jira (statusCategory.key 'done') field mappers pass IsClosed."
  - id: azure
    action: "AzureDevOpsStateCategories (delegate over GetWorkItemTypeStatesAsync, static per-type cache); GetTicketAsync passes isClosed in d's .With on line 86; WiqlRunner reads categories per distinct type of a batch (106 -> about 115)."
  - id: history
    action: "ITicketStatusHistory.NewestMoveIntoAsync on the four histories; one-line provider forwarders (GitHub 189 -> 188 by collapsing its existing forwarder, GitLab 190/191, Jira 198/206, Azure DevOps 215/218)."
  - id: park-statuses
    action: "TicketParkStatuses (Application/Services/Tickets); ReworkParkCheck reads it for done/failed and IsHandbackPark, Either goes (52 -> about 47)."
  - id: closure
    action: "TicketClosure.ClosedForWorkAsync (configured rule, history for the no-done close); registered on PipelineHandlersExtensions.cs:43 (218/218, no line added)."
  - id: tests
    action: "Red first for every test below; mapper tests extend the existing *FieldMapperTests fixtures, history tests extend StatusHistoryTests; each state-categories test uses its own (organization, project, type) key."

tests:
  - "GitHubFieldMapper_ClosedIssue_IsClosed_OpenIssue_IsNot"
  - "GitLabFieldMapper_StateClosed_IsClosed"
  - "JiraFieldMapper_StatusCategoryDone_IsClosed_InProgress_IsNot"
  - "JiraFieldMapper_StatusWithoutCategory_IsNotClosed"
  - "AzureDevOpsStateCategories_CompletedOrRemoved_IsClosed_ResolvedIsNot"
  - "AzureDevOpsStateCategories_SecondTicketOfSameType_ReadsStatesOnce"
  - "AzureDevOpsStateCategories_ReadFails_Throws"
  - "Ticket_With_KeepsIsClosed"
  - "StatusHistory_NewestMoveInto_ReturnsOwnAndAppActors"
  - "GitHubHistory_NewestMoveIntoClosed_ReadsClosedEvent"
  - "TicketParkStatuses_TriggerOverridesTrackerStatus"
  - "TicketParkStatuses_NotImplementableUnset_FallsBackToClarification"
  - "ReworkParkCheck_HandbackPark_UnchangedThroughSharedResolver"
  - "TicketClosure_OwnDoneStatusInClosedCategory_IsNotClosedForWork"
  - "TicketClosure_OwnFailedClarificationOrNotImplementable_IsNotClosedForWork"
  - "TicketClosure_PersonMovedToOtherClosedStatus_IsClosedForWork"
  - "TicketClosure_NoDoneStatus_OurClose_IsNotClosedForWork"
  - "TicketClosure_NoDoneStatus_PersonClose_IsClosedForWork"
  - "TicketClosure_NoDoneStatus_HistoryUnreadable_IsNotClosedForWork"

done:
  - "A Jira ticket in any status of the Done category reads closed; one in a Done-named status of another category does not."
  - "An Azure DevOps work item in a Completed or Removed state reads closed, fetched alone or listed; a Resolved one does not."
  - "A closed GitHub or GitLab issue reads closed; a reopened one does not."
  - "A ticket in done_status, failed_status, needs_clarification_status or not_implementable_status is not closed for work, whatever that status's category; neither is a GitHub issue the run closed with no done_status configured."
  - "A ticket a person moved into another closed-category status, or a GitHub/GitLab issue a person closed, is closed for work."
