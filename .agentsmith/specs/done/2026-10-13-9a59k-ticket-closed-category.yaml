# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-9a59k
goal: "A fetched ticket says whether its tracker counts it closed, and TicketClosure says whether a person closed it for work: closed category and not a status agent-smith itself set."

applies_to: "backend (domain ticket, the four tracker field mappers and status histories, Azure DevOps provider and WIQL runner, application ticket closure and park statuses, rework park check)"

requires: [2026-10-13-9a59d]

facts:
  - claim: "A Ticket carries a status string and no closed state; its copy method rebuilds every field by hand and says a field left out is dropped on every fetched ticket."
