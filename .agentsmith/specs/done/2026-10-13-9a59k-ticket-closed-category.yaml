  - claim: "GitHub maps the issue state through StringValue into Status, and the provider closes an issue by setting ItemState.Closed."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubFieldMapper.cs:23, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubTicketProvider.cs:158-159"
  - claim: "GitLab maps the issue's state field into Status and closes through the 'close' state event."
