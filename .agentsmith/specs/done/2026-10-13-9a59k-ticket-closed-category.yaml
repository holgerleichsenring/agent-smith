  - claim: "Line room: AzureDevOpsTicketProvider 214/218, JiraTicketProvider 197/206, GitLabTicketProvider 189/191, GitHubTicketProvider 189/189 (its history forwarder spans three lines, GitLab's one), PipelineHandlersExtensions 218/218 with TrackerIdentity and StatusBackActReader registered on one line; AzureDevOpsWiqlRunner 106 and ReworkParkCheck 52 are unlisted (120)."
