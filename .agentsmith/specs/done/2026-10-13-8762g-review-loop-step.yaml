spec: 2026-10-13-8762g
goal: "Before the master builds, each unbuilt spec whose text is not the one a person approved is attacked by parallel fresh reviewers for up to four rounds, cuts applied each round, within a budget share."

applies_to: "backend (a new ReviewSpecs pipeline command between SpecHandback and SpecGate, the per-spec rounds loop, the reviewer panel and merge, the one re-derivation of a refused spec, the round revision, the review budget share, the sequence stop, the spec_review: config section, its live readers and its schema, the PR table reason, the boundary claim gate and its shared end rule, and the attempt record's first-publish rule)"

