done:
  - "On a ticket nobody approved, the run reviews each unbuilt spec before the master starts, and every round's verdict from every reviewer is stored on the run."
  - "A round that changed a spec appears on the ticket branch as a new spec revision whose cause names the round, the spec and the verdict."
  - "A spec stops being reviewed at BUILD, or once its cuts are applied with nothing left standing and its checked citations resolve; it is never reviewed more than four rounds; a REFUSE without cuts is rewritten once and reviewed afresh."
  - "When review has used its share of the run's cost cap or wall clock, the specs it did not clear are not built in this run, and the pull request names each one and why."
  - "A spec whose text is still the one a person approved, a handed-back set and a set with nothing left to build run no review, and the step says which; an approved set re-cut by the run's model is reviewed."
  - "Every attempt clears at least its first reviewed spec, however much of the share the steps before review spent, unless the run's cost cap or wall-time ceiling ends the review first."
  - "A revision made during a run does not change which revision and cause the ticket page records for that attempt."
  - "A ticket whose last attempt stopped at a boundary is not picked up again by the poller, a webhook or the queue; a start by name in chat or a comment on the ticket still starts it; a run that ended as a shortfall is not such a stop."
  - "Setting spec_review.rounds to 0 in agentsmith.yml or the config store turns the step off for the next run without a restart; a store without a spec_review document reads the defaults; an invalid spec_review value, or a config store that never loaded, fails the step with the problem named."
  - "2026-09-05-c4e1 is in specs/done marked retired by this spec."
  - "Build green, full suite green, dashboard gen/test/build green."
