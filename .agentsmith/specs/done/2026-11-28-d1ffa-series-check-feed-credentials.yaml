# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-28-d1ffa
goal: "The series check stages private-feed credentials as a code run does, and a criterion the environment keeps from being checked is reported as not checkable, never failed or followed up."

applies_to: "default (series-verify preset, VerifySeriesHandler, SeriesVerdictTool, SeriesVerdict, SeriesFollowUp, series-verify-master prompt, sandbox sizing)"

requires: [2026-11-17-0207d, 2026-11-24-6811c, 2026-11-25-9992d]

facts:
  - claim: "The series-verify preset runs LoadCatalog, CheckoutSource, VerifySeries and the filing steps, with no SetupRegistryAuth; the code and refresh-base presets stage credentials after CheckoutSource."
    evidence: "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.SeriesRun.cs:35-43; src/backend/AgentSmith.Contracts/Commands/PipelinePresets.Code.cs:52; src/backend/AgentSmith.Contracts/Commands/PipelinePresets.RefreshBase.cs:14"
  - claim: "Seen live on series sr-8ce5ebb2e598: the series check's restore got NU1301/401 on the project's private feed, 8 criteria were recorded as failing, a follow-up 'Series check: 8 done criteria fail' was filed, and a later check ended 'Waiting on you: the failures above were followed up before and still fail'; every ticket's own run had built and tested green with staged credentials."
    evidence: "observed: 2026-11-28, operator brief"
  - claim: "record_criterion knows only holds or not; every not-holding result is in SeriesVerdict.Failed, which SeriesFollowUp files and SeriesSummaryText lists as failing."
    evidence: "src/backend/AgentSmith.Application/Services/Series/SeriesVerdictTool.cs:14-23; src/backend/AgentSmith.Contracts/Series/SeriesVerdict.cs:18; src/backend/AgentSmith.Application/Services/Series/SeriesFollowUp.cs:11-12; src/backend/AgentSmith.Application/Services/Series/SeriesSummaryText.cs:16,28"
  - claim: "A pipeline outside BuildingPresets (code, refresh-base) gets the light sandbox profile; the series check runs the repositories' build and tests."
    evidence: "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.Sizing.cs:8-14; src/backend/AgentSmith.Application/Services/Sandbox/SandboxResourceResolver.cs:53-54; src/backend/AgentSmith.Application/Prompts/Resources/series-verify-master.md:10-13"

upgrade_impact: "A series check now takes a build-sized sandbox and writes credential files into it, as a code run does. A check whose criteria hold or are not checkable files nothing: the series ends, or moves to Delivering on its series branch, with the not-checkable ones said apart. A stored verdict keeps its results and reads as before."

scope:
  in: |
    The series-verify preset runs SetupRegistryAuth after CheckoutSource (the same command and handler; its label, beat and model
    use are already mapped). series-verify joins BuildingPresets, so its sandbox is sized for a build as refresh-base's is.
    SeriesCriterionResult gains NotCheckable (the reason and what would make it checkable); record_criterion keeps holds and takes an
    optional notCheckable reason. SeriesVerdict.Failed leaves such a result out and SeriesVerdict.NotCheckable lists them, so nothing is filed for them
    and no "followed up before" waits on the operator. The summary lists them apart, one line each. The verify master's prompt
    says when a criterion is not checkable here (a secret the environment lacks, a feed still unreachable after staging) and that
    a red build or test is a failure. The verify master's prompt names the
    feeds staged for it (SpecExecutionPromptBlocks.StagedRegistries, as a code run's does), so "unreachable after staging" is a
    fact it reads, not a guess. A not-checkable criterion is its own outcome of the series check, not the acceptance account's
    unproven (decision with the operator as decider). Lands before d1ffc, which reshapes the same summary.
  out: "Re-staging feeds before each package command in the verify master (49d3b's restage); the summary's shape beyond its not-checkable lines (2026-11-28-d1ffc); telling an environment gap without the master's record."

steps:
  - id: pin
    action: "Pin today: a failing criterion files one follow-up; an unrecorded criterion counts as not shown (existing tests stay)."
  - id: preset
    action: "PipelinePresets.SeriesVerify gains SetupRegistryAuth after CheckoutSource; BuildingPresets gains SeriesVerifyName."
  - id: verdict
    action: "SeriesCriterionResult.NotCheckable; SeriesVerdict.Failed excludes it, SeriesVerdict.NotCheckable lists it; record_criterion's notCheckable parameter."
  - id: text
    action: "SeriesSummaryText lists the not-checkable ones apart; series-verify-master.md says when to use it."
  - id: tests
    action: "Harness series check over a repo whose nuget.config names a private feed: credentials staged before the master's restore, which answers green only once they were written (StubSandboxFactory gains an opt-in listing of path and content pairs answering ListFiles and ReadFile; a fixture agentsmith-series-feed.yml with a registries block, so fixture-file stays unchanged). Unit: a not-checkable criterion files nothing and is said apart."

tests:
  - "SeriesVerifyFeedCompositionTests.SeriesCheck_PrivateFeed_RestoresWithStagedCredentials"
  - "SeriesVerifyTests.VerdictTool_NotCheckable_IsNeitherHeldNorFailed"
  - "SeriesVerifyTests.FollowUp_NotCheckableCriterion_FilesNothing"
  - "SeriesVerifyTests.Summary_NotCheckable_ListedApart_FilesNothing"
  - "PipelinePresetsSystemTests / SandboxResourceResolverTests: series-verify stages credentials after CheckoutSource and is sized for a build"

done:
  - "A series check over a repo with a private feed stages its credentials before the verify master runs a restore (harness test)."
  - "A criterion recorded as not checkable (an absent secret) is not failed, files no follow-up and is listed apart (test)."
  - "dotnet build, the full suite and the dashboard tests and build are green; the spec gate passes."
