decisions:
  - key: "THE HUB TABLE CARRIES ITS OWN PROJECT SOURCE. A hub method's project comes from an argument position, a route's from a route value; one enum for both would let a route claim an argument and a method claim a route value. The hub enum is small and its guard test lives beside the table's."
  - key: "UNBOUND CALLERS NEVER LOOK UP. Alternative: resolve the run for every caller short of the global set. Why: a caller with no project binding (the admin grant, token claims, today's role mappings) can gain nothing from a lookup, and resolving would turn today's 'needs runs.watch' refusal into the unknown-run sentence; so enforce off, a full global hold, an empty ProjectPermissions or a permission held in no project all run today's path with no database or configuration read."
  - key: "THE HUB ROUTE GETS ITS OWN KIND. Alternative: admit every AcrossProjects route on any-project holds. Why: 4a4db keeps AcrossProjects global until 4a4dd filters the lists, and hands the hub to this spec; a Hub kind admits the negotiate for a project reader exactly because the filter scopes every invocation behind it, without opening an unfiltered list route."
  - key: "A DIALOG WITHOUT A PROJECT IS NOT REFUSED. Alternative: treat an empty session project like an unconfigured one. Why: a dashboard dialog has no project until one is chosen, so a project-only reader would be locked out of their own new conversation; 4a4db's dialog routes pass it for the same reason, and the owner check still guards it."
  - key: "REUSE 4a4db's READERS AND ACCESS. Alternative: a second Run.Project query and a hub-local union. Why: ResourceProjectReader and ProjectAccess.HoldsIn already answer 'which project' and 'may this caller, unconfigured projects global-only'; two copies would disagree the day one changes."
  - key: "ONE SENTENCE FOR UNKNOWN AND FOREIGN. A run in another project answers what an unknown run answers, so a project-only reader cannot probe run ids; a foreign dialog answers today's owner sentence, so it reads as another person's dialog."
  - key: "AN UNCONFIGURED PROJECT IS GLOBAL-ONLY. A run or session whose project the configuration no longer names is refused to project-only callers (ProjectAccess.HoldsIn) and its group gains no member, per the brief; the cost is one configuration read per project-scoped invocation, never for an unbound caller."
  - key: "MEMBERSHIP SPLITS THE GROUPS, SO NO CONNECTION HEARS TWICE. Global holders join only the overview group, project readers only their project groups; a run belongs to one project, so a send to [overview, overview:project:P] reaches each connection at most once."
  - key: "SYSTEM ACTIVITY STAYS GLOBAL. The rollup counts tracker polls and webhooks across the installation and names tracker connections, which are shared config; only the System page reads it and that page needs diagnostics.read. It stays on the overview group, which project-only readers never join, and their subscribe pushes no seed."
  - key: "THE LIVE PATH LEARNS THE PROJECT TWICE. The fold copies it from RunStarted for free; a run picked up mid-stream has no RunStarted, so the index reads the row once (the router persisted it before the send) and remembers it until the run finishes."
  - key: "THE INDEX IS BOUNDED BY THE PROJECTOR, NOT BY A SIZE CAP. Alternatives: an LRU or TTL cap; read through on every send. Why: only the fanout's live, unfinished, project-less snapshots add an entry and the fanout forgets it on the FinishedAt the broadcaster drops the run at, so the cache holds at most the mid-stream runs in flight; every other caller reads through. A size cap would evict live runs and re-read them; reading through on every send would cost a row read per lifecycle event of every mid-stream run, since the router sends RunsChanged per persisted event. A run whose stream is lost without a RunFinished keeps one string until the process restarts — accepted."
  - key: "ENFORCE OFF SENDS WHAT IT SENDS TODAY AND READS NOTHING NEW. The audience is the overview group alone while the switch is off, so no index read, no configuration read and no extra group send happen on an installation that never turned enforcement on."
  - key: "THE DELETION READS BEFORE IT DELETES. After the delete the row is gone and the nudge could reach only the global group, leaving project readers' lists stale; the bulk 'bulk' nudge is data-free and goes to every configured project group."

steps:
  - id: hub-route
    action: "ProjectFrom.Hub (wire 'hub'); ServerEndpointExtensions.cs:41 declares it on its line; PermissionRequirementHandler admits HoldsAnywhere on a Hub route; ProjectScopeMiddleware passes it; guard allows it on /hub/jobs only; regenerate route-permission-baseline.tsv and read the diff: rows 1-2 alone change. Within 4a4db's budgets."
  - id: table
    action: "HubProjectSource (at most 25 lines); HubMethodPermissions entries carry it and SourceOf(name) answers it (61 -> at most 80)."
  - id: run-project
    action: "RunSnapshotFold copies RunStartedEvent.Project (119 -> 120); RunProjectIndex (at most 60 lines) over a scope's ResourceProjectReader; RunSnapshot.Project's comment corrected."
  - id: scope-and-filter
    action: "HubProjectScope (at most 100 lines) with the AnyProject, RunArgument and DialogArgument rules and the two refusal sentences; HubPermissionFilter async, global first, unbound callers today's sentence, then the scope (61 -> at most 80)."
  - id: overview-subscription
    action: "HubGroups.OverviewOf (27 -> at most 32); OverviewSubscription (at most 70 lines); JobsHub swaps the broadcaster for it and SubscribeOverview delegates (143 -> at most 140)."
  - id: fan-out
    action: "OverviewAudience (at most 60 lines); JobsHubFanout (39 -> at most 50), JobsHubRunListNudge (17 -> at most 22) and RunDeletionEndpoints (53 -> at most 62) send through it; DI in DashboardApiExtensions (90 -> at most 96); lower JobsHub's baseline row."
  - id: tests
    action: "Red first, then green, for every test below; the booted-hub tests carry a TestProcess env trait with EnvVarCollection and 4a4db's ProjectScopeAuthorityFixture (one group bound as operator in alpha and team/alpha, beta configured too); run the Server/Auth, Server hub, Services/Events and SpecDialog hub classes with --filter."

