scope:
  in: >
    HUB ROUTE: ProjectFrom gains a Hub kind (wire spelling "hub") meaning "the hub filter scopes every invocation";
    ServerEndpointExtensions.cs:41 declares it on its existing line in place of AcrossProjects (no line added);
    PermissionRequirementHandler admits a project-scopable permission held anywhere (ProjectAccess.HoldsAnywhere) on a
    Hub route as it does on a per-resource route; ProjectScopeMiddleware passes a Hub route untouched as it passes Body;
    the route guard allows Hub on /hub/jobs alone; route-permission-baseline.tsv rows 1-2 change their scope column
    from across to hub. All within 4a4db's budgets (ProjectFrom at most 50, handler at most 55, middleware at most 60).
    TABLE: HubMethodPermissions gains a HubProjectSource per method (Security/HubProjectSource.cs, at most 25 lines:
    Global, AnyProject, RunArgument, DialogArgument — the run or dialog id is the invocation's FIRST argument).
    SubscribeSystem Global (diagnostics.read is global-only); SubscribeOverview AnyProject; SubscribeRun, ExpandSandbox,
    CollapseSandbox, GetTrail, GetTrailPage, GetResultMarkdown, GetPlanMarkdown, GetSpecMarkdown, GetAnalyzeMarkdown
    RunArgument; SubscribeSpecDialog and WatchFiledWork DialogArgument. For(name) keeps returning the RequiresPermission,
    SourceOf(name) answers the source (61 -> at most 80).
    FILTER: HubPermissionFilter keeps its order — enforce off: proceed with no resolution and no lookup; the caller's
    GLOBAL set holds every required permission: proceed as today with no lookup; source Global, OR the caller's
    CallerIdentity.ProjectPermissions is empty, OR a missing permission fails ProjectAccess.HoldsAnywhere: today's refusal text naming what
    is missing, with no lookup (so every caller without a project binding — the admin grant, token claims, today's role
    mappings — meets exactly today's filter, and the booted ExpandSandbox test on a row-less run still reads runs.watch).
    Otherwise it asks HubProjectScope (Security/HubProjectScope.cs, singleton, at most 100 lines), which answers a refusal
    or null through ProjectAccess (4a4db) rather than a union of its own: AnyProject — ProjectAccess.HoldsAnywhere(user, permission) for
    every required permission; RunArgument — P = RunProjectIndex.OfAsync(runId, null, ct) (read-through, stores nothing); P null or empty, or the
    caller unable to READ runs in P (ProjectAccess.HoldsIn runs.read, which refuses a project no longer configured) answers
    the ONE sentence "No run '<runId>' is visible to this caller." (an unknown run and another project's run are
    indistinguishable); a caller who may read runs in P but lacks another required permission there gets today's sentence
    naming what is missing (they can already see the run, so naming it leaks nothing); DialogArgument — the open dashboard
    session's project through ResourceProjectReader.OpenDialogAsync (4a4db), resolved from the invocation's own scoped
    ServiceProvider; no open session, or a session with an EMPTY project (not grounded yet — 4a4db's dialog routes pass
    it too): the AnyProject rule, and the method's own owner check still runs; a session with a project: ProjectAccess.HoldsIn
    every required permission there, refused with today's owner sentence "Spec dialog '<id>' belongs to another
    principal." so out-of-project and another person's dialog read alike. The filter takes HubProjectScope as a third
    constructor argument and becomes async (61 -> at most 80).
    OVERVIEW GROUPS: HubGroups.OverviewOf(project) = "overview:project:<project lowercased>" (27 -> at most 32). OverviewSubscription
    (Hubs/OverviewSubscription.cs, at most 70 lines) does what SubscribeOverview did: enforce off, or runs.read in the
    caller's GLOBAL set — join HubGroups.Overview and push SystemActivityUpdated exactly as today; otherwise join
    OverviewOf(P) for every P whose ProjectPermissions include runs.read and that TicketProjects.All() names, and push NO
    rollup. Membership is decided at subscribe time; a revoked binding takes effect on reconnect, the HTTP reads re-check
    every time. JobsHub takes OverviewSubscription in the broadcaster's place (still ten parameters) and SubscribeOverview
    becomes one line (143 -> at most 140).
    RUN PROJECT: RunSnapshotFold copies RunStartedEvent.Project onto the live snapshot (119 -> 120). RunProjectIndex
    (Services/Events/RunProjectIndex.cs, singleton, at most 60 lines), a cache bounded by the projector's live runs:
    OfAsync(runId, known, ct) answers a non-empty known project, else the remembered one, else one
    ResourceProjectReader.RunAsync (4a4db) through a new scope (a scope that resolves no IUnitOfWork, no row, or an empty
    project: null) — and STORES NOTHING; LiveAsync(runId, known, ct) answers the same but remembers a non-empty project
    read from the row, and is called only by JobsHubFanout for a snapshot without FinishedAt (a run the fold carries a
    project for is never stored); Forget(runId), called by the fanout when the snapshot has a FinishedAt (RunFinished,
    pause included, which is also when the broadcaster drops the run from its active set) and by the single delete.
    The hub filter, the run-list nudge and the deletion read through and never add an entry, so a finished run read
    over the hub, a queued run nudged by capacity deferral or a deleted run is never remembered. The
    comment on RunSnapshot.Project ("REST only, not the live fold") is corrected on its line.
    FAN-OUT: OverviewAudience (Services/Events/OverviewAudience.cs, singleton, at most 60 lines): with enforce off every
    method answers [Overview] and reads nothing (no index, no configuration). Enforcing: OfProject(project) =
    [Overview] plus OverviewOf(project) when non-empty; OfRunAsync(runId, known, ct) = OfProject(RunProjectIndex.OfAsync); OfLiveRunAsync(runId, known, ct) =
    OfProject(RunProjectIndex.LiveAsync);
    Everyone() = [Overview] plus OverviewOf of every project TicketProjects.All() names. JobsHubFanout (39 -> at most 50):
    RunsChanged to Clients.Groups(OfLiveRunAsync(snapshot.RunId, snapshot.Project)) for an unfinished snapshot and
    OfRunAsync for a finished one, then Forget when the snapshot has a
