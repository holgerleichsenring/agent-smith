scope:
  in: >
    WHERE: SelectSpecHandler re-grounds the ENTERED spec after the set lookup and before CurrentSpec is set and the
    start heads are recorded (SelectSpecHandler.cs:43-56): `(spec, var grounding) = await entryGrounding.GroundAsync(
    context.Pipeline, set, spec, cancellationToken)`; CurrentSpec and everything after read the grounded draft. There is
    no 'describes today' gate (SpecToday is not consulted): a citation is compared with the tree it was WRITTEN against,
    so a file a predecessor will create fails git show and is not checked, and code a predecessor moved is exactly the
    move this finds. Every spec that runs is re-grounded when it runs, after every predecessor of its attempt landed.
    WHAT IT TOUCHES: unqualified path:lines tokens in facts' evidence; minted look lines, observations, path-only,
    ':'-continuation and qualified tokens are skipped. A run-derived spec cites minted [Ln] look lines
    (FactResolver.cs:32-33), so it is out of reach by design; this applies to design-partner sets and hand-written specs.
    CONTINUATIONS: a ':'-continuation binds to the previous path token, across ';' (EvidenceReferences.cs:22, :34,
    :48-49), so a token followed by a continuation before the next path token is re-grounded only within its own file,
    its path unchanged; a move of such a token to another file is listed as a stale citation with the found location.
    HISTORY: SpecCitationHistory (git as Run steps in the run's full clone, on the run's token; a failure is 'not
    checked'). Writing commit: `git log -1 --format=%H%x20%cI --pickaxe-regex -S'<regex-escaped token>([^0-9,-]|$)' --
    '.agentsmith/specs/*/<specId>-*' '.agentsmith/specs/*/<specId>.*'`, asked of each repository sandbox in turn until
    one answers — scoped to this spec's own file, so another spec's re-ground or record never re-dates it, and bounded on
    the right, so `Foo.cs:12` is not counted inside `Foo.cs:120-125`. Base: that commit in the carrying repository; in
    another cited repository `git rev-list -1 --first-parent --before=<its date> HEAD`. APPROVED: when the set carries
    an Approval and the writing commit is the one that added the spec's file (`git log -1 --diff-filter=A --format=%H`
    over the same pathspec), the base in every cited repository is `git rev-list -1 --first-parent
    --before=<Approval.At> origin/HEAD`, the default branch the partner read — --first-parent so a side-branch commit
    dated before the approval and merged after it is never the base. ROUTING: a path that starts with a repository name,
    or any path in a one-repository set, is routed as SandboxEvidenceProbe routes it (SandboxEvidenceProbe.cs:31-47); a
    bare path in a multi-repository set is routed by existence AT ITS BASE — the one repository where `git cat-file -e
    <base>:<path>` succeeds — because a file a predecessor moved away is held by no working tree; none or more than one
    is 'not checked'. Unchanged: `git diff --quiet <base> -- <path>` exits 0, no read. Old text: `git show
    <base>:<path>`. LOCATE: SpecCitationLocator (pure): a range still holds when its current lines equal the old ones
    (trailing whitespace trimmed); else the old block is searched in the current file (whole read, 1 MB), found when it
    occurs exactly once; else the candidate files are tried: first the new side of each `moved` entry of a preceding
    spec's build note (PrecedingSpecs.NotesOf, 2026-10-13-8762m) whose old side equals the cited path, then the
    SearchLine — the longest trimmed line of the block, at least 20 characters, else no search — through `git grep -l
    -F -e <line>` over the repository's tracked files; more than 10 candidate files is not found; the block found
    exactly once in exactly one candidate gives the new path. A range keeps its length; a token is re-grounded only when
    every range in it lands in one file. TOKEN FORM: a re-grounded token keeps the old token's repository-name prefix,
    or its absence — the prefix is put back in front of git grep's repository-relative path — so the next entry routes
    it as it routed the old one. REGROUND: SpecCitationRegrounder over the entered spec: at most 24 distinct
    (repository, path) pairs, each candidate file read counted as one more pair; past the bound counted unchecked and
    logged. A token that moved is spliced in EVERY fact that carries it, or in none. A citation whose lines changed and
    whose text is found nowhere is a STALE citation. SPLICE: SpecFactRegrounding.Apply(yaml, factIndex, oldToken,
    newToken) replaces the token inside that fact's evidence scalar only, by the scalar's source span from YamlDotNet's
    representation model, whole-token match; null when the token is not verbatim in the span (an escaped scalar).
    ENTRY: SpecEntryGrounding.GroundAsync returns SpecEntryGround(DerivedSpec Spec, string StepNote); when any token
    moved it publishes ONE revision through 2026-10-13-8762g's SpecReviewRevision.PublishAsync with cause
    SpecRevisionCause.CitationsRegrounded ("citations re-grounded in {specId}: {old} -> {new}", '; '-joined, at most
    five named then "and {n} more", formatted in SpecEntryGrounding), the Approval kept, and returns the revised spec;
    nothing moved publishes nothing. A FAILED PUBLISH does not fail SelectSpec (contract default, pending operator
    ratification): the set it was handed is put back into ContextKeys.SpecSet, the spec continues with its original
    text, each moved citation is listed as stale with the location its text was found at, and the step note names the
    failed publish. It sets ContextKeys.StaleCitations (IReadOnlyList<string>, in ContextKeys.SpecExecution.cs,
    replaced on every entry) to one line per stale citation; StepNote is empty, or the stale count with the first three
    and the failed publish when there was one. READERS OF A STALE CITATION: SpecExecutionPromptBlocks.StaleCitations
    renders them into the master's spec-execution prompt ("these citations' lines changed since they were written and
    their text was found nowhere: verify the claim before relying on it"), and SelectSpec's Ok line ends with StepNote.
    CONTRACT CHECK: BuildNoteContractCheck.Deviations(note, specId, set), static and pure, reading set.Contract and the
    members' Draft.Repos, matching case-insensitively by whole-word containment of a contract name or datum in an
    entry: a persisted entry naming a datum whose Owner is another spec and whose Writers do not name this spec; a
    renamed entry whose old side (left of ` -> `) names a contract name; a moved entry whose destination (right of
    ` -> `) equals or lies under a path of another spec's area — counted only when that spec's Repos intersect this
    spec's, empty intersecting all, as 2026-10-13-8762j counts a shared file — and under none of this spec's areas.
    Each is marked declared when the note's deviations name it. HandForwardToolHost lists them in its answer;
    SpecBuildNoteSection gains an optional `SpecSet? set = null` and, given one, marks each preceding note's undeclared
    deviations (by the note's SpecId); SpecExecutionPromptFactory's call passes the pipeline's ContextKeys.SpecSet;
    PremiseCheckPrompt.AlreadyRan's call is left as it is, so the premise check shows the notes unmarked. Nothing new
    is persisted. REGISTRATION: SpecCitationHistory, SpecCitationRegrounder and ISpecEntryGrounding/SpecEntryGrounding
    in Services/Specs/Review/SpecReviewRegistrations.cs; the locator, the splice and the contract check are static.
  out: >
    The evidence check and event 87 — 2026-10-13-8762e. The review loop, the panel and the revision publisher —
    2026-10-13-8762g. Keeping the attempt row's opening revision when a mid-run revision is published, and its test
    RunAttempt_MidRunRevision_KeepsTheOpeningRevisionCause — 2026-10-13-8762g (main-thread decision). The build note and
    its entry format — 2026-10-13-8762m. Parsing and checking the contract — 2026-10-13-8762j. Re-grounding before the
    reviewers in ReviewSpecs — nobody: ReviewSpecs runs before SpecSequence, so inside an attempt no predecessor has
    moved anything yet; a grounded draft there would have to become the review loop's draft or the reviser republishes
    the stale text; and every spec is re-grounded at its entry anyway. Re-grounding in a design turn — nobody: its
    source scope is a depth-1 clone that refuses git (CheckoutStepFactory.cs:26-33). Re-grounding a run-derived spec's
    facts — nobody: they cite minted look lines, not path:line. Path-only, ':'-continuation and qualified tokens —
    nobody: they name no line text or no repository this check can address. Re-grounding a claim, an assumption, a
    decision, a goal, a step or a done criterion — nobody: only the citation moves (contract decision 13). A ticket
    notice or an event — nobody: the revision on the branch, its cause on event 83, the step line and the master prompt
    are the record. Marking deviations in the premise-check prompt — nobody: PremiseCheckPrompt is not touched here
    (contract section 5). Blocking on a contract deviation — nobody: shown, not enforced (contract decision 12).

decisions:
  - key: "THE ENTERED SPEC IS RE-GROUNDED IN SELECTSPEC, BEFORE ITS START HEADS (main-thread decision 6, round-2 review F1; contract decision 13 and sections 2 and 4 amended). ReviewSpecs runs before SpecSequence, so a re-ground there could only ever reach the first spec of an attempt — 3 of a 24-spec series at eight per attempt. At entry every predecessor of the attempt has landed, which is the session's 'planned specs re-ground their citations after the previous member lands'. The revision is published before SpecStartHeads.RecordAsync, so it precedes this spec's start heads and no spec's own diff contains it. REJECTED: keeping a second call before review round 1 (round-2 F9) — the grounded draft would have to become SpecReviewLoop's draft inside g's 120-line budget, and it could only catch moves from earlier attempts, which entry grounding catches too."
  - key: "NO TODAY GATE. The history check compares a citation with the tree it was written against, not with today: a cited file a predecessor will create fails git show and is not checked; existing code a predecessor moved is the move to find (round-2 F1). SpecToday — Describes(draft, SpecSet set) in e, g and i — is not consulted here."
  - key: "THE PICKAXE IS SCOPED TO THE SPEC'S OWN FILE AND BOUNDED ON THE RIGHT (round-2 F3, round-3 F7). Over the whole specs directory, another spec's re-ground of the same token, a predecessor's record or an older series could post-date the move, and the citation would read as 'unchanged since written' — a stale citation certified current. A plain -S counts substrings, so `Foo.cs:12` inside `Foo.cs:120-125` would re-date it; --pickaxe-regex with ([^0-9,-]|$) after the escaped token does not. KNOWN LIMITS: an occurrence of the same token outside facts' evidence (scope or decision prose) that a later revision changes still re-dates it."
  - key: "FIRST-PARENT HISTORY (round-3 F2). Without --first-parent, rev-list --before walks every merged parent and can return a feature-branch commit dated before the instant but merged after it, whose tree the default branch never held. Both date-based base lookups take --first-parent."
  - key: "A TOKEN WITH A CONTINUATION STAYS IN ITS FILE (round-3 F1). The parser binds ':40-45' to the previous path across ';' segments; re-pointing 'Foo.cs:12-20' to Bar.cs would silently make the untouched continuation read as Bar.cs:40-45 — a wrong citation written by the framework. Such a token is re-grounded only within its own file; a cross-file move is a stale citation with its found location."
  - key: "BARE PATHS IN A MULTI-REPOSITORY SERIES ROUTE BY THE BASE (round-3 F3). The probe routes a bare path to the one working tree that holds it (SandboxEvidenceProbe.cs:53-58); a file a predecessor moved away is held by none, so the case this spec exists for would be 'not checked'. git cat-file -e at each repository's base finds where the citation was written. Prefixed paths and one-repository sets keep the probe's routing."
  - key: "THE TOKEN KEEPS ITS FORM (round-3 F4). Routing strips a repository-name prefix (SandboxEvidenceProbe.cs:35-38, :70-71) and git grep -l answers repository-relative; the new token carries the old token's prefix or none, so the next entry routes it to the same repository."
  - key: "THE BUILD NOTE'S MOVES ARE CANDIDATES FIRST (main-thread decision, round-3 'deliver' note). A preceding spec's `moved` entry `<old> -> <new>` is the hint the session used; its new side is tried before git grep, read and counted against the 24-pair budget like any candidate. It only adds a candidate: the exact-text, unique-match rule still decides."
  - key: "A FAILED RE-GROUND PUBLISH DOES NOT FAIL THE SPEC (main-thread decision, round-3 F5; contract default, pending operator ratification). Re-grounding is optional; failing a whole series run on a push failure of an optional step inverts the usual risk. The set is put back, the spec runs on its original text — the text the branch states — and the moved citations are listed as stale with where their text was found, so the master still sees them. ALTERNATIVE REJECTED: failing SelectSpec as g's own rounds fail their step. GroundAsync therefore returns the spec and a step note rather than a failure, and SelectSpecHandler stays at 119 lines."
  - key: "AN APPROVED SET'S FILED TEXT IS DATED BY ITS APPROVAL (round-2 F4). The partner read a depth-1 clone of the default branch at turn time; the filing or hand-off commit can be later and on a later branch. When the writing commit is the one that added the spec's file and the set carries an Approval, the base is the default branch as of Approval.At. KNOWN LIMITS: commits landing on the default branch between the partner's read and the approval; and an approved file amended in place after filing, which is dated by that amending commit."
  - key: "WHERE IT APPLIES (round-2 F2). Run-derived sets cite minted [Ln] look lines (FactResolver.cs:32-33), which the reference parser skips whole (EvidenceReferences.cs:27); they are out of reach by design, and their reviewers are told to open those looks (2026-10-13-8762e). Path:line citations come from design-partner sets and hand-written specs — the approved path a long series takes."
  - key: "A STALE CITATION HAS READERS (round-2 F5). No reviewer runs after entry, so 'changed and found nowhere' goes into the master's spec-execution prompt, where the spec is acted on, and into SelectSpec's step line in the run trail. It is never rewritten: a wrong citation written by the framework would be worse than a stale one the master is told about."
  - key: "BOUNDED CANDIDATE SEARCH (round-2 F8). The search line is the block's longest trimmed line of at least 20 characters, never a '}' or 'return;'; more than 10 candidate files is not found; each candidate read counts against the 24-pair budget; the line is passed after -e so a leading '-' is not an option."
  - key: "MECHANICAL, NO MODEL. The old text comes from git, the new place from an exact match. A model asked where a line went would be one more claim to check."
  - key: "EXACT TEXT, UNIQUE MATCH. Trailing whitespace aside, the block must occur exactly once; a re-indented or edited line, or a block found twice, is not re-grounded and becomes a stale citation."
  - key: "BUDGET PER DISTINCT CITED FILE. 24 (repository, path) pairs per entered spec, candidate reads included; the reads are the framework's own whole-file reads (1 MB), not a model's numbered reads. Default, pending operator ratification (contract section 5, default 48)."
  - key: "ONE PUBLISH PATH. The revision goes through SpecReviewRevision.PublishAsync (2026-10-13-8762g): placed, committed, pointed at and announced as SpecSetPublished (83), the approval kept. Each such publish also writes one RunSeriesCut row with the whole cut (RunSeriesCutProjection.cs:27-31) — at most one per entered spec, accepted. Until g keeps the attempt row's opening revision (assumption above), each would rewrite RunAttempt's revision fields (RunAttemptProjection.cs:34-45); this spec depends on g's amendment and does not touch the projection."
  - key: "AN APPROVED SPEC THAT WAS RE-GROUNDED IS REVIEWED IF IT RUNS AGAIN. Its yaml no longer equals the approved record's, so a later attempt's ReviewSpecs (2026-10-13-8762g, main-thread decision 2) reviews it; that is the price of a visible revision and is accepted."
  - key: "THE CONTRACT CHECK MATCHES j'S SHAPE (round-2 F6, F7; round-3 F8). Areas carry no Writers and may overlap, so a move deviates only when its destination lies in another spec's area and in none of this spec's; areas are repository-relative, so another spec's area counts only when its Repos intersect this spec's, as j counts shared files. A persisted datum deviates only when its Owner is another spec and its Writers leave this spec out. Entries are split on m's ` -> `; a name matches by whole-word, case-insensitive containment, because equality never matches a sentence and bare containment matches a short name everywhere."
  - key: "THE CONTRACT CHECK IS A MECHANICAL HINT (round-3 F8). Data datums are often phrases that whole-word containment in a 300-character entry rarely hits; the session's cross-member consistency pass is 2026-10-13-8762k's series reviewer, not this check."
  - key: "DEVIATIONS ARE COMPUTED, NOT STORED, AND STATIC. The note lives in the record and the contract on the branch; a stored list would be a third copy. Its callers are a host built with new and two static renderers; SpecBuildNoteSection takes the set as an optional argument so PremiseCheckPrompt's call (contract section 5: n does not touch it) needs no edit (round-3 F9)."
  - key: "NO EVENT. The re-grounding rides on SpecSetPublished (83) as the revision cause (series contract 2.1)."
  - key: "BACKEND CONTEXT. Recorded in the default context (contract decision 23)."

steps:
  - id: history
    action: "SpecCitationHistory: writing commit (--pickaxe-regex on the escaped token with a right boundary, on the spec's own file), added-commit probe, base (writing commit, other repository by date, or the default branch at Approval.At; both date lookups --first-parent), cat-file existence at a base, unchanged probe, old text, git grep -l -F -e candidates; each a Run step whose failure is 'not checked'; at most 110 lines."
  - id: locate
    action: "SpecCitationLocator (static): still holds / moved in file / moved to one other file / not found, candidates in order (build-note moved destinations, then git grep), SearchLine (longest trimmed line, at least 20 characters), ranges keep their length; at most 90 lines."
  - id: splice
    action: "SpecFactRegrounding.Apply (static): whole-token replace inside the fact's evidence scalar span; null when not verbatim; a token's occurrences across facts all applied or none."
  - id: reground
    action: "SpecCitationRegrounder: token selection; routing as SandboxEvidenceProbe routes for prefixed paths and one-repository sets, by cat-file at the base for a bare path in a multi-repository set; a token with a ':'-continuation kept in its file; the new token keeps the old prefix form; the 24-pair budget with candidate reads counted, the 10-candidate cap, stale citations; at most 120 lines."
  - id: entry
    action: "ISpecEntryGrounding + SpecEntryGrounding.GroundAsync returning SpecEntryGround(Spec, StepNote): one revision through SpecReviewRevision.PublishAsync; on a failing result the handed-in set put back into ContextKeys.SpecSet, the original spec returned and the moved citations listed stale with their found location; ContextKeys.StaleCitations set per entry; the cause text formatted here. SpecRevisionCause.CitationsRegrounded (111 after 2026-10-13-8762k -> at most 113); at most 90 lines."
  - id: select-spec
    action: "SelectSpecHandler: 116 + one constructor line (ISpecEntryGrounding) + one line `(spec, var grounding) = await entryGrounding.GroundAsync(context.Pipeline, set, spec, cancellationToken);` after the null check at :44-45 + one line continuing the Ok line at :67 with grounding.StepNote = 119. The three direct constructions in SpecSequenceTests.cs and SpecEntryAccountTests.cs pass a pass-through grounding, one argument on an existing line."
  - id: prompt
    action: "ContextKeys.StaleCitations in ContextKeys.SpecExecution.cs (19 -> about 24); SpecExecutionPromptBlocks.StaleCitations, at most 11 lines over what 2026-10-13-8762c leaves (about 101 -> at most 112, limit 120); one line in SpecExecutionPromptFactory (at most one line over what 2026-10-13-8762m leaves)."
  - id: contract-check
    action: "BuildNoteContractCheck.Deviations(note, specId, set) (static) over set.Contract and the members' Repos with the three rules and whole-word matching; HandForwardToolHost lists the deviations in its answer; SpecBuildNoteSection gains `SpecSet? set = null` and marks the undeclared ones; SpecExecutionPromptFactory passes the pipeline's set on m's existing call (counted in the prompt step's line); PremiseCheckPrompt's call unchanged."
  - id: register
    action: "SpecCitationHistory, SpecCitationRegrounder and ISpecEntryGrounding in Services/Specs/Review/SpecReviewRegistrations.cs, transient like SelectSpecHandler."
  - id: tests
    action: "Red first for every test below, then green; run the Specs, Review, Handlers and Architecture classes touched, and the harness class."

