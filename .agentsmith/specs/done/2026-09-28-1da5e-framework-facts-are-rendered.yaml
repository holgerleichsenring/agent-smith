# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-1da5e
goal: "A design turn is told the concrete strings this framework would use for its ticket, derived from the code that enforces them, instead of being taught the conventions behind them."

applies_to: "backend (a prompt section over the conventions the framework enforces, for a bound design conversation)"

requires: ["2026-09-28-1da5c"]

scope:
  in: "Rendering, for the bound ticket, the values this framework's own rules produce — the work branch it would use, the labels this installation writes, the stamp it looks for — each taken from the code that enforces it."
  out: "Teaching the rules themselves. Anything the model can work out from what it already has. Facts about a case the conversation is not bound to."

decisions:
  - key: |
      THE MODEL DOES NOT KNOW THINGS THE FRAMEWORK DOES, AND THE BRANCH NAME IS THE MEASURED CASE.
      The work-branch convention is used in five places in this source tree and appears in NO skill
      text anywhere. That is correct for acting: the model never names a branch, the framework does.
      It is wrong for READING THE WORLD BACK — asked whether a ticket's branches were finished, a
      conversation had no way to know what to look for. The knowledge is needed at the moment the
      model interprets, not at the moment it acts.
  - key: |
      RENDER THE INSTANCE, DO NOT REPEAT THE RULE. Writing the convention into a skill would create
      a second statement of something the code already decides, and the two would drift — the
      failure this repository designs against everywhere else. A section that CALLS the namer and
      prints the branch for THIS ticket cannot drift, because it is the code. And it is smaller:
      one string beats a paragraph explaining how the string is built, and it answers the question
      the model actually has.
  - key: |
      ONLY WHAT IS ABOUT THIS CASE, AND ONLY WHAT CANNOT BE WORKED OUT. The prompt is re-sent every
      turn, so every sentence is paid for by the length of the conversation. What earns its place is
      a value the model could not derive from what it already holds: the branch this ticket's work
      would be on, the labels this installation writes rather than the defaults, the stamp that
      marks a ticket as filed from an approved set. Not a tour of the framework.
  - key: |
      IT IS BOUND-ONLY, LIKE EVERYTHING ELSE ON THIS PATH. A conversation belonging to no ticket has
      no branch name to be told and no stamp to look for, so it renders nothing and its prompt is
      byte for byte what it was — the rule the seeded ticket, the ticket reader and the tracker
      read all already follow.
  - key: |
      THE LABELS ARE THE SECOND INSTANCE AND PROVE THE PATTERN GENERALISES. They became configurable
      per tracker, with today's words as defaults — so an installation that renamed them has a model
      reasoning about words nobody uses. Rendering the vocabulary this connection actually carries
      costs one line and is exactly the same move as the branch name. What else belongs here is a
      question for the phase after this one, decided by what a conversation is observed to get wrong.

steps:
  - id: the-framework-says-what-it-would-do
    path: "src/backend/AgentSmith.Application/Services/SpecDialog"
    action:
      - "Render, for a bound conversation, the work branch this framework's namer produces for its ticket and the label vocabulary its tracker carries — each by calling the code that decides it."
      - "Render nothing at all for an unbound conversation."

  - id: it-reaches-the-turn
    path: "src/backend/AgentSmith.Application/Services"
    action: "Place the section in the design turn's prompt beside the seeded ticket, whose renderer already decides between a bound conversation and one without."

  - id: it-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Assert that the branch rendered is the one the namer produces, that a renamed label vocabulary reaches the turn rather than the default, and that an unbound conversation's prompt is unchanged."

tests:
  - "FrameworkFacts_ABoundTicket_RendersTheBranchTheNamerWouldProduce"
  - "FrameworkFacts_ARenamedLabelVocabulary_ReachesTheTurn"
  - "FrameworkFacts_AnUnboundConversation_RendersNothing"
  - "FrameworkFacts_TheBranch_IsNotRestatedAsARule"

done:
  - "a bound design turn is told the branch its ticket's work would be on, taken from the namer"
  - "an installation that renamed the framework's labels has a conversation reasoning about its own words"
  - "no convention is restated in prose anywhere, so nothing can drift from the code that enforces it"
  - "an unbound conversation's prompt is byte for byte what it was"
  - "build green, full suite green"
