  - claim: "A multi-repository path is routed by the longest registered key it starts with, and the master reads the sandbox-key to repository-name map from ContextKeys.SandboxRepos."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/RepoPathRouter.cs:5-23, src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:74-80"
  - claim: "SelectSpec publishes each spec's draft as ContextKeys.CurrentSpec; the draft carries its facts (claim + evidence), its steps with an optional target path, and the repositories it names."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/SelectSpecHandler.cs:47-49, src/backend/AgentSmith.Contracts/Commands/ContextKeys.SpecExecution.cs:5-8, src/backend/AgentSmith.Contracts/Models/SpecDraft.cs:44, src/backend/AgentSmith.Contracts/Models/SpecDraft.cs:66, src/backend/AgentSmith.Contracts/Models/SpecDraft.cs:74"
  - claim: "EvidenceReferences reads one evidence line into the paths it cites, pure and tolerant of punctuation."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/EvidenceReferences.cs:3-38"
  - claim: "The function-invoking client sets only MaximumIterationsPerRequest, in the live and the replay factory; the consecutive-error limit is the framework's default."
