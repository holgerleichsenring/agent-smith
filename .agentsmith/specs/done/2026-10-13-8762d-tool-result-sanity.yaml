done:
  - "A sub-agent that answers nothing shows as Empty on the run's trail, in spawn_agents' result and in the decision line, never as Succeeded, and the execution tree shows it finished short, not waiting."
  - "A master whose search of a path its spec cites, with or without the repository prefix, finds nothing reads, in that same result, a framework line naming the cited path and telling it to verify before concluding absence."
  - "A master that writes into a repository its spec does not name, or runs a command whose cd climbs above /work, reads a framework line saying so, and the call's effect is unchanged."
  - "No run is stopped, slowed or retried by a sanity observation; a result nothing flags is byte-identical to today's."
  - "Build green, full suite green, dashboard gen/test/build green."
