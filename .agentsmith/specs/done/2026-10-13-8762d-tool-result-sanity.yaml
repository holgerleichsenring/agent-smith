    evidence: "src/backend/AgentSmith.Domain/Entities/Repository.cs:5-16, src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:148-161, src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:374-379"
  - claim: "The filesystem tools accept a repo-prefixed path even on a single repository and strip the prefix, a bare path falls through to the default repository when one runner exists, and repository names are aliased onto sandbox keys from the key-to-name map."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:99-102, src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:118-134"
