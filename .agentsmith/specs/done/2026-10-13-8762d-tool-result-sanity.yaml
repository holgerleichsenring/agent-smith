spec: 2026-10-13-8762d
goal: "A master reading an empty sub-agent answer, a zero-hit search of a path its spec cites, a write to a repository its spec does not name or a cd above /work is told so in that result."

applies_to: "backend (the master's tool surface: one wrapping tool type, four rules, the sub-agent status; no event, no table, no prompt) and src/dashboard (one status mapping)"

requires: [2026-09-19-c511c]

facts:
