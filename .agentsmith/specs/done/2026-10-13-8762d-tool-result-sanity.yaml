    evidence: "src/backend/AgentSmith.Application/Services/Loop/SubAgentRunner.cs:83, src/backend/AgentSmith.Application/Services/Loop/SubAgentRunner.cs:95-101, src/backend/AgentSmith.Application/Services/Loop/SubAgentStatus.cs:10-14"
  - claim: "spawn_agents returns per child its status string, ids, counts and cost and never the child's text; read_sub_agent_observations returns the stored answer as JSON, an empty one included."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/SpawnAgentToolHost.cs:12-19, src/backend/AgentSmith.Application/Services/Tools/SpawnAgentToolHost.cs:80-91, src/backend/AgentSmith.Application/Services/Tools/ReadSubAgentObservationsToolHost.cs:37-40"
  - claim: "SubAgentCompletedEvent carries the status as a string, and the trail row marks every status other than Succeeded with a cross at warn severity, so a new status value renders without a dashboard edit."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/SubAgentRunner.cs:194-202, src/dashboard/src/components/jobs/ActivityRow.tsx:381-389"
  - claim: "The master's tool list is composed in MasterToolComposition.Compose, which returns at two points, and children get BaseSurface() as their tools; the list reaches the loop unwrapped."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:42-49, src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:94, src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:102-110, src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:381-394, src/backend/AgentSmith.Application/Services/Loop/AgenticLoopRunner.cs:52-56"
  - claim: "SkillCallRuntime.WrapTools wraps only the tools of a skill call; the master loop never passes through it."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/SkillCallRuntime.cs:122-124, src/backend/AgentSmith.Application/Services/Loop/SkillCallRuntime.cs:150-156"
  - claim: "A tool wrapper is a DelegatingAIFunction that reads the result through ToolResultBound.TextOf, because AIFunctionFactory hands a string back as a JSON string."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/BoundedResultTool.cs:15-28, src/backend/AgentSmith.Contracts/Services/ToolResultBound.cs:81-82"
  - claim: "Every tool loop bounds each result keeping its head and its tail, so a line appended at the end survives the bound."
    evidence: "src/backend/AgentSmith.Contracts/Services/ToolResultBound.cs:7-13, src/backend/AgentSmith.Infrastructure/Services/ToolImages/ToolImageFunctionInvokingChatClient.cs:35-45"
  - claim: "A zero-hit grep renders as an empty string and a zero-hit find_files as an empty join; a find that did not run says so instead."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/GrepResultRenderer.cs:13-33, src/backend/AgentSmith.Application/Services/Tools/FileSearchStep.cs:38-48"
  - claim: "The search tools are grep_in_file (path), grep_in_tree and find_files (root); the writing tools are write_file, edit and multi_edit; run_command takes a command and a repo and no working directory."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:450-451, src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:470-474, src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:300-302, src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:503-508, src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:545-558"
