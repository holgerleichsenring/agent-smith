    action: "TurnQuestions calls onAnswersHeld with the count of held own answers."
  - id: step-aside
    action: "TurnResult renders a line in place of the approve bar while the count is above zero."

tests:
  - "TurnResult_HeldAnswer_KeepsApproveFromFilingPastIt"

done:
  - "A held answer can no longer be lost to an Approve click."
