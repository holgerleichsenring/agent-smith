# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-25-9992d
goal: "In a shared workspace a command gets the project's secrets and only its own repository's, and private feeds are configured per project instead of for the whole installation."

applies_to: "default (Contracts config, Sandbox.Wire/Agent env, Server pod env, Application registry auth and config); dashboard (project form)"

requires: [2026-11-25-9992b]

facts:
  - claim: "Declared secrets are projected into every toolchain container's env, so every command in the container inherits them."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/PodToolchainContainer.cs:61-70"
  - claim: "A command's process drops only REDIS_URL, JOB_ID and the launcher's library path from the agent's env."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/AgentProcessEnvironment.cs:16-25"
  - claim: "Feed tokens are one installation-wide registries list, a stored Config Studio singleton, staged as user-level files in every container."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/AgentSmithConfig.cs:23; src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/Studio/ConfigDocumentTaxonomy.cs:28; src/backend/AgentSmith.Application/Services/Handlers/SetupRegistryAuthHandler.cs:36-37"
  - claim: "The wire protocol is at 2 and the agent reads 1-2."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/WireProtocol.cs:27,30"

scope:
  in: "Secrets: sandbox.secrets.env stays project-wide; sandbox.secrets.repo_env scopes a variable to one repository (dashboard field). The pod carries them under scoped names; a step names its repository and the agent hands a command the project's and that repository's under their own names, never another's, and makes itself non-dumpable; wire protocol 3, and a workspace whose project scopes secrets refuses an agent below it, naming image and protocol. Feeds: registries move to projects.<name>.registries (dashboard field); the installation-wide key is retired with its advisory; staging reads the run's project."
  out: "Secret files and the repositories' trees: a file in the container is readable by every command of it (same uid), so they stay shared and are documented as such; a command running at the same time for another repository is a process of the same uid. Per-toolchain limits (the per-context declaration and the project's sandbox.resources stay the sources) and a git worktree per sub-agent (the ticket run stays the unit, so parallel tickets already get separate workspaces) — cut with the reasons in the decisions."

done:
  - "A command for repository A sees the project's and A's secret variables under their own names and none of B's; the agent drops every scoped variable it was not asked for (agent tests)."
  - "A workspace whose project scopes secrets fails to start against an agent below protocol 3, naming the image and the protocol."
  - "projects.<name>.registries stages its feeds for that project's runs only; the installation-wide registries key gives the retired-key advisory; the dashboard edits both new fields."
  - "dotnet build, affected tests, dashboard tests and the spec gate pass."
