# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-01-283dh
goal: "An HTML mock in a spec directory whose name starts with a phase id belongs to that phase: the run names it, render_reference renders it from the repo, and no revision deletes it."

applies_to: "backend (spec-set reader, the phase prompt section, the stale-file rule, render_reference)"

requires: ["2026-10-01-283df"]

facts:
  - claim: "This repository already keeps a mock next to its phase spec."
    evidence: ".agentsmith/phases/done/2026-09-17-c7aed-dialog-surface-mock-rebuild.html"
  - claim: "A set's phase files are <dir>/<stem>.yaml and <stem>.md under .agentsmith/specs/<key>/, the stem being phase id plus slug."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSetKey.cs:13,18-29; src/backend/AgentSmith.Contracts/Specs/SpecPhase.cs:11-18"
  - claim: "The slug is minted from the goal at approval, so a goal edit changes the stem while the phase id stays."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedPhaseSetRecorder.cs:74"
  - claim: "Reading a phase back reads its yaml and markdown off the branch and nothing else."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetPhaseFileReader.cs:22-36"
  - claim: "The phase section the coding master gets names the phase and its verbatim ticket blocks."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecPromptSection.cs:30-58"
  - claim: "A revision removes every .yaml and .md not in the current cut; other extensions are not spec files."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetStaleFiles.cs:5-10,44-46"
  - claim: "Writers render only index, yaml, md and accounting, so a mock on the branch is a reviewer's file."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetFiles.cs:23-39"

scope:
  in: >
    A mock is any .html in the spec directory whose file name starts with a phase id followed by '.' or
    '-' (matched against the PHASE ID, never the id-slug stem). The reader lists the directory once and
    gives each SpecPhase its MockPaths (appended last, empty when none). SpecPromptSection names them:
    this phase's mock, render it with render_reference, read its CSS with read_file. render_reference
    accepts a repo path: the HTML file and the files it links that resolve inside the same directory tree
    are copied from the repo sandbox into the browser sandbox under the 283db per-file and per-set limits
    and served from the 283de local origin, so one tool renders a mock, a static build output or an
    uploaded set. SpecSetStaleFiles keeps its .yaml/.md rule, and a test pins that an .html is never
    selected — a mock outlives the revision that dropped its phase, and the prompt simply stops naming it.
  out: >
    The design partner writing a mock. Rendering a running app — p0308 on p0165a/b.

decisions:
  - key: "THE PHASE ID IS THE LINK. A goal edit re-slugs the stem; the id is frozen."
  - key: "A MOCK IS NEVER STALE. It is a reviewer's file; the full-replace rule exists for files the writer produced."
  - key: "ONE RENDERER FOR THREE SOURCES. An uploaded set, a mock and a built page differ only in where the bytes come from."

steps:
  - id: reader
    action: "SpecSetPhaseFileReader lists .html once per set; SpecPhase.MockPaths (last)."
  - id: prompt
    action: "SpecPromptSection names the mocks."
  - id: render
    action: "RenderReferenceToolHost accepts a repo-relative path; RepoRenderSource copies the linked tree under the limits."
  - id: stale
    action: "SpecSetStaleFiles test pinning .html as never stale."

tests:
  - "SpecSetPhaseFileReader_MockNamedByPhaseIdWithOldSlug_IsStillMatched"
  - "SpecPromptSection_PhaseWithMock_NamesIt"
  - "SpecSetStaleFiles_HtmlBesideSpecs_IsNeverSelected"
  - "RenderReference_RepoPath_CopiesLinkedCssInsideTheTreeOnly"
  - "RenderReference_RepoPathOverTheSetLimit_IsRefusedNamingIt"

done:
  - "a run whose spec directory holds <phaseId>-mock.html renders that mock and quotes a computed style from it"
  - "build green, full suite green"
