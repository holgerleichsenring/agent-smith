# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-31dca
goal: "A stacked run's base is chosen per repo from the chain of unlanded prerequisites; only two independent ones with work in one repo hold the ticket until merged; no silent cut from main."

applies_to: "default (UnmetTicketRequirements, GreenReads, StackedBaseStamp, RunParentTicket, RunBranch, SandboxBaseLadder, SandboxWorkBranchCheckout, SandboxRungPublisher and the single-parent readers listed below)"

requires: [2026-11-23-97c2a, 2026-11-23-97c2b, 2026-11-17-9a39a, 2026-11-17-9a39b, 2026-11-22-6d85d]

invariant: "Every repo of a stacked run is cut from (or read at) the branch of the nearest unlanded green prerequisite with work in that repo, or from its own base when none has; never from main while such a branch is missing."

facts:
  - claim: "The stack tip is chosen per ticket: the one unlanded prerequisite whose chain reaches all others."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/GreenReads.cs:49-57"
  - claim: "The claim re-stamps the request under its lock with that one ticket id."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/StackedBaseStamp.cs:29-31"
  - claim: "The stamp is read as a string or a JSON string (a parked run's round-trip)."
    evidence: "src/backend/AgentSmith.Application/Services/RunParentTicket.cs:43-51"
  - claim: "Each repo looks only for that one ticket's branch and falls through to the clone's base when it is missing; the ladder is documented as two rungs."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SandboxBaseLadder.cs:26-29,44-58"
  - claim: "A dependent that started once is never held again; an unlanded prerequisite holds unless green."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/UnmetTicketRequirements.cs:74-77"
  - claim: "A Worker-repo dependent stacked on a Server-only prerequisite was cut from Worker main, missing a deeper prerequisite's Worker change."
    evidence: "observed: 2026-11-23, run events of a three-repo series (rev-parse of the tip's branch exit 1 in Worker and Client, 0 in Server)"

scope:
  in: >-
    Start hold: every unlanded prerequisite that is not green still holds (requireGreen as today); a started dependent
    is never held again (as today). For green ones the per-repo tip of 97c2b decides: a prerequisite with work only in
    other repos does not hold, the dependent reads those repos at that repo's tip; a repo whose unlanded green
    prerequisites have no per-repo tip holds the ticket, and the uncovered ones join MergesToStart (bases first, 6d85d).
    Stamp: StackedOnTicket carries a map repo -> ticket id computed in GreenReads at the claim; a parked run's old
    single-id string still reads as 'that id for every repo'. The ladder takes the repo's entry, no walk; a repo whose
    entry names a ticket whose branch is not readable stops the run with a sentence naming the branch; a repo with no
    entry cuts from its own base. The pull request target per repo follows the same entry (97c2b keeps it there).
    Every reader of the single parent id reads the repo's entry instead: RunBranch.ParentTicketId,
    SandboxRungPublisher.EnsureAsync, ContextReadBranches, DeliveryDiff, DeliveryBasis, BranchChangedFiles,
    StructureMergeBase, ForeignCommitProbe, BranchStateCheck, BootstrapPresenceCheck, RepoReadinessPass. An epic
    parent label (EpicParentRead) stays one id for every repo.
  out: "UI (31dcb onward); merging (97c2a guards it); retarget (97c2b)."

steps:
  - id: hold
    action: "UnmetTicketRequirements.ForStartManyAsync holds by the per-repo tips of 97c2b; non-green and started rules unchanged."
  - id: stamp
    action: "StackedBaseStamp writes the repo map; RunParentTicket answers ForRepo(pipeline, repo) and reads the old string form."
  - id: ladder
    action: "SandboxBaseLadder takes one candidate per repo from the map; SandboxWorkBranchCheckout stops instead of falling through; ladder doc updated."
  - id: readers
    action: "RunBranch carries the per-repo parent; the eleven readers listed ask for their repo's entry."

tests:
  - "Chain S1<-S2(S,W)<-S3(S), dependent in W: S read at S3's branch, W cut from S2's branch; not held."
  - "Dependent in C requiring an S-only green prerequisite: not held, S read at its branch, C from its own base."
  - "Two independent green prerequisites with work in one repo: held, both named, bases first."
  - "A prerequisite that is not green yet: held as today, even when its repos are unknown."
  - "A dependent that started once: not held again under the new rule."
  - "Resume of a parked run whose context holds the old single-id JSON string: every repo resolves to that id."
  - "A repo whose entry's branch is not readable: the run stops with the sentence; no entry: own base."
  - "DeliveryDiff and BranchStateCheck compare against the repo's own parent, one test each."

done:
  - "Build, the full suite and the dashboard tests green; the tests above pass in UnmetTicketRequirements, StackedBaseStamp, RunParentTicket, SandboxBaseLadder and SandboxWorkBranchCheckout test classes."
