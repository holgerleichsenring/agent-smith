# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-933dg
goal: "PoC variables are stored per PoC (secrets in the one store under a poc scope, plain ones on the Poc row) and sealed on use by a provider seam, Sealed Secrets first, the pull secret too."

applies_to: "default (secret store scope, poc-variables preset, variable rules, sealing provider seam, SealPocVariables step, seal fingerprint, variable endpoints, import entry, target certificate fields, docs) + dashboard (variables table on the import page, target certificate field)"

requires: [2026-11-23-933db, 2026-11-23-933dd, 2026-11-23-933de, 2026-11-17-f3a8d]

upgrade_impact: "StoredSecret gains Scope ('installation' | 'poc:<id>'); its primary key moves from Name to (Scope, Name) — on SQLite a table rebuild, on SQL Server and PostgreSQL a key change; every existing row reads as installation and keeps its lower-cased name and associated data, so nothing changes for it. ISecretVault's set, delete and states take a scope; the admin area passes installation. The config load skips poc-scope rows; a run in a poc- project masks its PoCs' secret values through a run-scoped mask frame, and no other project's run, model call, write tool or step environment sees them. Poc gains PlainVariablesJson and SealFingerprint (migrations on three providers). Targets need the Sealed Secrets controller's public certificate pasted (or fetched from an ingress URL) before a PoC with secret variables or with pull_mode pull_secret deploys. A target with pull_mode pull_secret on an installation without a master key is a blocking finding naming AGENTSMITH_SECRET_MASTER_KEY. poc-deploy now ends after sealing; nothing is committed until the GitOps commit step of 2026-11-23-c81eb."

