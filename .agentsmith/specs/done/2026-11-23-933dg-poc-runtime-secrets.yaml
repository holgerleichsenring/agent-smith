assumptions:
  - claim: "A run's trace entries and model calls are written on the run's own async flow, so the AsyncLocal mask frame reaches them."
    check: "The ExecutePipelineUseCase test reads the masked value back from the run's trace rows and the faked provider's request."
  - claim: "Sealing matches kubeseal's HybridEncrypt: a random 32-byte AES-256-GCM session key; RSA-OAEP-SHA256 of it with label '<namespace>/<name>' (strict scope); AES-GCM with an ALL-ZERO 12-byte nonce (the session key is used once) and no associated data, the 16-byte tag appended; payload = 2-byte big-endian RSA ciphertext length + RSA ciphertext + GCM ciphertext and tag; each value sealed separately under encryptedData, base64."
    check: "Golden test: a value sealed by KubeSealer is opened by a test-only decryptor written from the controller's HybridDecrypt (zero nonce, label) against a generated key pair, and a fixture sealed by kubeseal is opened by the same decryptor; manually once, the controller in a kind cluster opens a KubeSealer output."

scope:
  in: >
    STORE: SecretScope (Contracts: Installation | Poc(pocId), text 'installation' / 'poc:<id>'). StoredSecret.Scope
    (default 'installation', at most 32 characters: 'poc:' + a long id fits), primary key (Scope, Name) — 232 characters,
    464 bytes as nvarchar, under SQL Server's 900-byte index key. Installation rows keep today's rule: name lower-cased, envelope
    name = name. Poc rows keep the name verbatim (it must match ^[A-Z_][A-Z0-9_]*$, so no case is lost and envFrom reads
    it as written) and use envelope name 'poc:<id>\0<NAME>' in both associated data, so a poc ciphertext opens under no
    other row. ISecretVault: SetAsync(scope, name, value, setBy), DeleteAsync(scope, name), StatesAsync(scope);
    RewrapAsync re-wraps every row under its own envelope name; every existing caller passes SecretScope.Installation.
    StoredSecretValues.Load opens installation rows only (Values and the unreadable map as today) and skips poc rows,
    so a poc row never resolves as a catalog secret, even under the same lower-cased name, never enters the name-keyed
    unreadable map or its webhook/Slack finding, and never reaches ISecretValues.All(). MASK SCOPE (coordinator
    ruling): a PoC secret value is masked ONLY in the runs of its PoC's own project (poc-<person>) and in their trace and
    record output. SecretMasker is one process-wide singleton over All() (LoopRuntimeExtensions.cs:41), so the seam is a
    run-scoped frame, not state on it: RunMaskFrame (Contracts/Runs) holds an AsyncLocal list exactly as
    MaterializingSecrets does — Begin(values) returns a scope that restores the enclosing frame, Current answers the
    values of this async flow only. ExecutePipelineUseCase opens it beside runContext.BeginScope(runId): when pocs is
    enabled, IPocMaskValues (Contracts; Persistence opens the poc rows of every Poc whose Project is
    request.ProjectName) answers that project's secret values, empty for any other project; a value that does not open
    is left out (it cannot be in the run either). SecretMasker.Apply replaces the frame's values beside All()'s, the
    frame's list ordered longest first once at Begin, so nothing shared is mutated and a run of another project, on any
    thread, sees an empty frame. In a poc- run the frame therefore also reaches that run's model calls
    (SecretValueMaskingChatClient) and its trace (RunTraceWriter), which both call the same masker on the run's flow;
    InProcessStepEnvironmentReader keeps reading All() only, so no step environment is scrubbed by a PoC value. A value
    written mid-run is masked from the next run of the project on; poc-variables itself logs names only.
    WRITE: SecretWrite takes the scope from the request: installation is
    unchanged; poc scope applies the same 6-character minimum, never upserts a catalog SecretEntity, and has exactly two
    callers: the owner's writes go only through the gated poc-variables run below (set and delete), and 2026-11-23-c81ee's
    poc-upload-purge installation run deletes the poc:<id> rows of a PoC in state deleted; nothing else writes a
    poc scope. WritePocVariablesHandler does not repeat WriteSecretHandler's reload and signal: the config load no
    longer holds poc values, and every run reads its project's values afresh when it starts, on whichever replica. PocVariableRules (Application): name ^[A-Z_][A-Z0-9_]*$ of at most 200 characters (the StoredSecrets.Name
    column width, named in the message); a secret value at least 6 characters; plain values
    no minimum; at most pocs.variables.max_names (64) names and pocs.variables.max_value_kb (4) per value — reason 'a
    Kubernetes Secret or ConfigMap holds at most 1 MiB', with Problems() and messages naming value, reason and key; a name
    is either plain or secret, writing it as one kind deletes the other. PRESET poc-variables [WritePocVariables]: a
    project preset this spec adds to 933db's PocPresets.Names, NotRoutable, started only through IActRun on the PoC's Project, so
    its run, events and log belong to the poc- project the owner sees. Seed PocVariableWrite(PocId, Entries (name, kind
    secret|plain, SecretInput for a secret, text for a plain value, or delete), Person), excluded from checkpoints like
    SecretWriteRequest. WritePocVariablesHandler removes the seed at once, refuses a PocId whose Poc.Project is not the
    run's project, re-checks PocVariableRules, writes secrets through SecretWrite with scope poc:<id> and plain values
    into Poc.PlainVariablesJson — a JSON array of {name, value, set_by, set_at} ordered by name — and names names and
    kinds only. Who may write is decided by the endpoint before the run
    (CallerIdentity is Server-side; the run is never queued, so nothing else starts it). ENDPOINTS: GET
    /api/pocs/{pocId}/variables (pocs.read + runs.read InProject(ProjectFrom.Poc)) answers name, kind, set by and set at (a secret's from
    the vault's StatesAsync(poc:<id>), a plain one's from PlainVariablesJson), and the value of plain variables only (they are committed in plain text as a ConfigMap). PUT
    /api/pocs/{pocId}/variables {set: [{name, secret, value}], delete: [names]} (pocs.write + runs.read
    InProject(ProjectFrom.Poc), then PocActAccess.MayAct; another person's PoC answers the empty 404) checks
    PocVariableRules and the vault's availability before anything is written, then starts poc-variables through
    933db's PocRunGate (minted run id, claim and queued row in one transaction, then IActRun with that run id) and
    answers its line; while another run of that PoC is live (deploy, act, extend) it answers 409 naming the live run and
    writes nothing. The route never writes a variable itself; no answer echoes a value. A change applies at the PoC's next deploy. IMPORT ENTRY: 933db's Start (POST
    /api/pocs/uploads/{uploadId}/import) accepts the same variables list and, in this order: checks PocVariableRules and
    the vault, creates project and binding (933db, server-side), writes the Poc row, runs poc-variables through 933db's
    PocRunGate and IActRun and awaits it when variables were given, then queues poc-deploy with the poc id. A failed poc-variables run answers
    the import with its line and queues nothing; the Poc row stays importing and the same upload can be started again.
    933db MUST PROVIDE: the Poc row written by the server at Start, before poc-deploy is queued (today PocIntake writes it
    inside the run); a retried Start of the same upload id reusing that row; the poc id among poc-deploy's seeds;
    PocIntake reading the row rather than creating it; PocPresets.Names, the one list this spec adds poc-variables to. NAMES (Contracts, the only
    source the c81e series renders from): PocNamespace.For(poc) = 'poc-' + Poc.Name (Name is a DNS label of at most 40, so
    the namespace fits 63); PocSecretNames.Secrets 'poc-secrets', .Pull 'poc-pull', .Config 'poc-config'. PROVIDER SEAM:
    IPocSecretProvider (Contracts) Render(PocSecretOrder{namespace, name, type opaque|dockerconfigjson, entries name ->
    SecretInput, certificate}) -> PocSecretFile(file name, content); SealedSecretsProvider first (KubeSealer — .NET's
    RSAEncryptionPadding takes no OAEP label and no BouncyCastle is referenced, so KubeSealer encodes EME-OAEP itself
    (RFC 8017 7.1.1: SHA-256, MGF1-SHA256, label '<namespace>/<name>') and applies the RSA public operation with
    BigInteger.ModPow over the certificate's RSAParameters; the test-only decryptor uses the raw private operation and
    the matching EME-OAEP decode, and the kubeseal fixture test is the guard —, KubeSealedSecretManifest: bitnami.com/v1alpha1 SealedSecret, strict scope, spec.template.type
    kubernetes.io/dockerconfigjson for the pull secret); chosen by pocs.targets[].secrets.provider (only sealed_secrets
    accepted; another value refused naming the key); a vault provider is a later provider on this seam. STEP
    SealPocVariables in poc-deploy after PocPipelineBuild: IPocVariableValues (Contracts; Persistence opens the rows)
    hands the PoC's secret values to the step as SecretInput, or the names that do not open with their reason; the step
    refuses an unreadable variable by name ('PoC variable <NAME> cannot be read: <reason>; set it again'), never seals
    without it; with pull_mode pull_secret the pull token comes from
    ICredentialResolver.Lookup(pull_auth) (none or unreadable refused naming pocs.targets[].registry.pull_auth) and
    becomes a DockerConfigJson for login_server and pull_user, sealed under the entry key '.dockerconfigjson'. Anything to seal and no certificate is refused naming
    pocs.targets[].secrets.sealed_secrets_cert. FINGERPRINT: PocSealFingerprint (Persistence) = HMAC-SHA256 under a key
    HKDF-derived from the current master key ('as-poc-seal/v1') over provider, certificate SHA-256, namespace, every
    secret name and value, login_server, pull_user, the pull token value and pull_mode — keyed, so the stored digest
    reveals nothing of a short value; it changes when any input does, an environment-held token included; SetAt and key
    ids are not inputs, so a re-wrap changes nothing, while a master-key ROTATION changes every fingerprint once and each
    PoC re-seals at its next deploy. Without a master key no secret variable can exist and pull_mode pull_secret is
    refused (PocSealKeyFindings below), so nothing is sealed, no fingerprint exists and the checksum covers the plain
    variables only. PocSealKeyFindings (Server, the PocPrefixFindings pattern of 933db, republished with it): while
    pocs.enabled is on and ISecretVault.Unavailable is set, each target with pull_mode pull_secret is a BLOCKING
    finding (Subsystem 'pocs', Field 'pocs.targets[<id>].registry.pull_mode', so one per target) 'pull_mode
    pull_secret needs a master key: the seal fingerprint is an HMAC under a key derived from it, and without one every
    run would re-seal poc-pull and restart the pod; set AGENTSMITH_SECRET_MASTER_KEY or use cluster_pulls', and
    SealPocVariables refuses such a target with the same text before sealing anything. RESULT: ContextKeys.PocSeal holds PocSealResult(Unchanged, Files, SealFingerprint,
    VariablesChecksum). SealFingerprint equal to Poc.SealFingerprint -> Unchanged true, no files; otherwise poc-secrets
    (when the PoC has a secret variable) and poc-pull (when pull_mode is pull_secret) are rendered. VariablesChecksum =
    SHA-256 hex over SealFingerprint (or, without one, the rendered files) and the canonical plain variables — the value
    the pod template annotation carries. PocSealResult holds ciphertext and digests only, the same bytes git will hold,
    so it IS checkpointed: a run resumed between sealing and the commit keeps its files. This step never writes
    Poc.SealFingerprint (see the contract below) and logs names only. Until 2026-11-23-c81eb ships, poc-deploy ends here
    saying 'sealed N names; nothing is committed before the GitOps commit step', and every run seals afresh, which
    commits nothing. CONTRACT FOR 2026-11-23-c81eb (its GitOpsCommit is the only writer of Poc.SealFingerprint): every chain that
    renders runs SealPocVariables before GitOpsCommit — poc-deploy, and 2026-11-23-c81ed's poc-stop, poc-start,
    poc-rollback and poc-apply (poc-delete renders nothing) — and GitOpsCommit reads both PocSealResult.VariablesChecksum
    and PocSealResult.SealFingerprint; write
    PocSealResult.SealFingerprint to the Poc row only after the commit carrying the files has landed, or the branch was
    found already equal; on Unchanged keep the sealed files the branch holds, and when a sealed file the PoC needs is
    missing there, clear Poc.SealFingerprint and fail naming the file, so the retry seals; render with PocNamespace and
    PocSecretNames only; ConfigMap poc-config from Poc.PlainVariablesJson; envFrom poc-secrets (optional) and poc-config;
    imagePullSecrets poc-pull when pull_mode is pull_secret; the pod template annotation
    agent-smith.io/variables-checksum = PocSealResult.VariablesChecksum. TARGET: pocs.targets[].secrets {provider
    (sealed_secrets), sealed_secrets_cert (PEM, plain field), sealed_secrets_cert_url (optional)}; Problems(): provider
    one of the accepted values, a set certificate parses as X.509 PEM with an RSA key. route-permission-baseline.tsv
    gains rows for GET and PUT /api/pocs/{pocId}/variables and POST /api/config/pocs/sealed-secrets-cert/fetch. Fetch: POST
    /api/config/pocs/sealed-secrets-cert/fetch {url} (config.write, outside PocsGate so it works while PoCs are off; https
    only, answer bounded at 64 KB, a run-free read: nothing saved until the form saves) answers PEM, fingerprint and
    notAfter. PocsSettingsForm shows fingerprint, notAfter and age. DASHBOARD: PocVariablesTable (name, kind, value as a
    password field for secrets, cleared after posting; plain values shown with the note that they are committed in plain
    text; set and delete) on 933db's import page, sent with Start. DOCS: PoC variables (secret vs plain), getting the
    controller certificate (kubeseal --fetch-cert), the pull secret.
  out: "The vault/External Secrets provider (seam only). Applying a variable change at once (seal, commit, roll out) and the variables panel on the PoC detail page: 2026-11-23-c81ed, which mounts PocVariablesTable; until then a change applies at the PoC's next deploy. Deleting a deleted PoC's poc-scope rows: 2026-11-23-c81ee's poc-upload-purge run, through SecretWrite with the PoC's scope. Rendering the ConfigMap, envFrom, imagePullSecrets and the annotation: 2026-11-23-c81eb. Rotating the controller's key. Reading secret values back (never)."

pipeline-presets:
  poc-deploy: [LoadCatalog, PocIntake, PocCodeScan, PocSourceCommit, PocPipelineBuild, SealPocVariables]
  poc-variables: [WritePocVariables]

steps:
  - id: store
    action: "SecretScope; StoredSecret.Scope + key (Scope, Name), configuration, migrations x3; per-scope envelope name; ISecretVault scope parameters and callers; StoredSecretValues.Load skips poc rows; RunMaskFrame (AsyncLocal, as MaterializingSecrets) + IPocMaskValues, opened in ExecutePipelineUseCase beside the run scope; SecretMasker.Apply adds the frame's values; SecretWrite per scope; IPocVariableValues (values or unreadable names); Scope 32 and the name bound 200."
  - id: variables
    action: "PocVariableRules + pocs.variables (max_names, max_value_kb) with Problems(); PocVariableWrite seed (checkpoint-excluded); CommandNames.WritePocVariables, WritePocVariablesHandler (store.Load + ConfigChangedSignal after a secret write); PipelinePresets.Poc.cs gains PocVariablesName; Poc.PlainVariablesJson + SealFingerprint (migration x3)."
  - id: sealer
    action: "PocNamespace, PocSecretNames; IPocSecretProvider, PocSecretOrder, PocSecretFile, SealedSecretsProvider, KubeSealer (hand-written EME-OAEP SHA-256/MGF1 with the label + BigInteger.ModPow public operation, AES-GCM zero nonce), KubeSealedSecretManifest, SealingCertificate (PEM parse, fingerprint, notAfter), DockerConfigJson."
  - id: step
    action: "CommandNames.SealPocVariables, SealPocVariablesHandler, PocSealFingerprint (HKDF + HMAC), PocSealKeyFindings + the same refusal in the step, PocSealResult under ContextKeys.PocSeal; poc-deploy gains the step; control-flow.svg."
  - id: endpoints
    action: "PocVariableEndpoints (GET, PUT) + PocVariableLauncher over IActRun; Start of 933db calls it before queuing; sealed-secrets-cert fetch endpoint; route-permission-baseline.tsv rows."
  - id: dashboard
    action: "PocVariablesTable on the import page; certificate field with Fetch, fingerprint, notAfter and age in PocsSettingsForm; i18n with German."
  - id: docs
    action: "docs: PoC variables, the controller certificate, the pull secret."

tests:
  - "KubeSealer_Seal_OpensWithMatchingPrivateKeyAndLabel; _WrongNamespace_DoesNotOpen; _TwoSeals_Differ; _KubesealFixture_OpensWithPortedDecryptor; _EmptyLabelCiphertext_DoesNotOpen (guards against RSAEncryptionPadding.OaepSHA256)"
