assumptions: []

scope:
  in: >
    MIRROR: lib/identityApi.ts CallerIdentity gains projectPermissions?: Record<string, string[]> (optional like
    nameIsReadable, so the existing fixtures in IdentityView, AppHeader and ClearTerminalRunsButton tests compile
    unchanged; 34 -> at most 40). HELPER: lib/projectPermissions.ts (at most 30 lines, pure) holds(identity, permission,
    project?) = permissions includes it OR (project given AND projectPermissions[project] includes it), project matched
    case-insensitively (as ConfigNames.Comparer does on the server); holdsInAnyProject(identity, permission) = permissions includes it OR any projectPermissions entry does.
    HOOK: useLacksPermission(permission, project?) answers identity !== null && !holds(identity, permission, project)
    (13 -> at most 16); with no project it is the global rule of today. CALL SITES (all six, plus one): TicketCloseAct
    and TicketReopenAct pass ticket.project; DoneByHandAct passes its project prop (one change serves TicketHeader,
    TicketWaitsFor and TicketRequiresPanel); TicketDefaultsTab passes the project it already reads; the conversation's
    PendingQuestion takes project and TicketConversationTab passes detail.project; RetryUnchanged gains a project prop,
    passed by TicketConversationTab:56 and TicketComposer:95. ClearTerminalRunsButton reads holdsInAnyProject(identity,
    'runs.delete') instead of identity.permissions.includes (65 kept). IDENTITY PAGE: ClaimFacts gains a 'Per project'
    block under 'What it resolved to' (data-testid identity-project-permissions), one row per project with its
    permissions, omitted when projectPermissions is absent or empty; NoRolesYet shows only when roles is empty AND no
    project carries a permission (106 -> at most 140). NO PROJECT REACHED: lib/readableProjectsApi.ts fetchReadableProjects
    (GET /api/projects, reads the string[] body directly, at most 15 lines); hooks/useProjectReach.ts (at most 45 lines) answers 'none'
    only for an authenticated identity that lacks runs.read globally, on a server whose /api/auth/requirements says
    enforced, AND whose GET /api/projects answered an empty list, else 'unknown' (no identity or global runs.read held —
    no request is made; not enforced — /api/projects is not read; any read pending, refused or failed);
    components/shell/NoProjectReach.tsx (at most 30 lines) renders its children unless the reach is 'none', then
    'Your sign-in reaches no project on this installation. An administrator grants projects under Access → Projects.'
    (data-testid no-project-reach). It wraps the five empty states — TicketList tickets-empty, MissionControl
    mission-empty, pull-requests pr-empty, ExpectationMetricsView expectations-empty, TicketGraph ticket-graph-empty —
    and is rendered only inside the empty branch, so a non-empty list never issues the request. TEST MOCKS: the
    TicketGraph and TicketConversationTab test files' useLacksPermission mocks become project-aware
    ((permission, project) answered from a per-project lacks table), so their new cases fail when a call site omits the
    project.
  out: >
    The model, ProjectPermissions on CallerIdentity and the catalog's scopable set — 2026-10-15-4a4da; every binding finding, on the access view only — 2026-10-15-4a4df.
    Route project sources, the handler check and 404-not-403 on single resources — 2026-10-15-4a4db. Hub method project
    resolution and per-project overview groups — 2026-10-15-4a4dc (the dashboard's SubscribeOverview call is
    unchanged; membership is decided on the server). Filtering /api/runs, /api/tickets, /api/tickets/graph,
    /api/pull-requests, /api/runs/expectations/metrics, the spec dialog's project choice (SpecDialogProjectCatalog.All)
    and GET /api/projects itself — 2026-10-15-4a4dd. The Projects pane and PUT /api/access carrying bindings —
    2026-10-15-4a4df. A new 'not yours' state on the run and ticket pages — nobody: an out-of-project resource is a
    404 and the pages already render a missing one; any other wording would confirm it exists. Client gates on run
    Cancel, Delete, the run page's answer card and criterion judgements — nobody: they are ungated today for global
    permissions too and the server's refusal answers; adding them is a separate change, not a project one. A
    non-config surface for the project Initialize action (projects.init is project-scopable but its only UI sits under
    config.read) — not built in this series; raised to the operator as an open question. Caching /api/identity across
    components — nobody in this series. A backend wire test for projectPermissions — 2026-10-15-4a4da already carries
    Identity_CallerInAProjectBinding_SeesProjectPermissions; the client matches keys case-insensitively, so a key
    policy cannot break a lookup. Handling a refused run subscription (4a4dc hands it here) — nobody: the client already
    swallows the refusal and shows the server's one sentence (facts). The spec dialog view's project list
    (SpecDialogViewReader.cs:50 calls SpecDialogProjectCatalog.All()) — 2026-10-15-4a4dd narrows it on the server; the
    dashboard renders what it is sent.

decisions:
  - key: "GATE ON THE PROJECT THE ROUTE NAMES. Each act passes the project its own request path carries (ticket.project, the DoneByHandAct prop), so the client asks the same question the server's route check asks."
  - key: "NO PROJECT MEANS GLOBAL, NOT ANY. useLacksPermission without a project keeps today's rule; 'held in any project' is a separate named helper used only where the route has no project (the bulk clear), so no call site widens by accident."
  - key: "OPTIONAL FIELD IN THE MIRROR. projectPermissions is optional on the wire mirror like nameIsReadable: a server before 4a4da and every existing fixture read as 'no project grants', which is the true answer for both."
  - key: "EMPTY STATES ASK ONLY WHEN EMPTY AND ONLY A NON-GLOBAL READER. The reach request is made inside the empty branch and skipped for a global runs.read holder and for an unknown caller, so an anonymous viewer, a global reader and every non-empty page issue no new request; an enforce-off installation reads only the anonymous /api/auth/requirements on an empty page and renders exactly as today."
  - key: "REACH FROM /api/projects, NOT FROM THE IDENTITY. A binding may name a project that is no longer configured (4a4da applies it, 4a4df reports it on the access view); counting identity keys would tell such a caller they reach a project whose lists are empty. The server's configured list is the truth."
  - key: "NO 'NOT YOURS' PAGE. A run or ticket outside the caller's projects answers 404 like a missing one, and the dashboard renders it like a missing one; a distinct state would leak existence the server took care to hide."
  - key: "PROJECT NAMES FOLD CASE ON THE CLIENT TOO. Alternative: ordinal match. Why: the server resolves projects under OrdinalIgnoreCase and keys ProjectPermissions in the binding's spelling; an ordinal client lookup of the configured spelling would hide an act the server allows."
  - key: "A CALLER HOLDING runs.read NOWHERE IS REFUSED, NOT EMPTY. As shipped, GET /api/projects and every runs.read list answer 403 to a caller with no runs.read in any project, so their pages show today's refusal surface; 'none' is reached by a caller whose runs.read sits only on bindings to projects no longer configured. useProjectReach treats the 403 as 'unknown'."
  - key: "ENFORCED FIRST, THEN THE PROJECT LIST. Alternative: read /api/projects for every non-global caller. Why: with enforcement off an installation with no project configured answers an empty list, and the page would tell an unenforced caller their sign-in reaches nothing."

