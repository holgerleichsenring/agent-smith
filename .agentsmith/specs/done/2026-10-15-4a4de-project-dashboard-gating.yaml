spec: 2026-10-15-4a4de
goal: "The dashboard offers a project act only to a caller holding its permission globally or in that project, lists per-project permissions on the identity page, and names a caller reaching no project."

applies_to: "dashboard (useLacksPermission and a pure project-permission helper, the CallerIdentity mirror, every runs.control / runs.delete gate that exists today, the identity page, the five list empty states, a client for GET /api/projects)"

requires: [2026-10-15-4a4da, 2026-10-15-4a4dd]

facts:
  - claim: "The dashboard's one permission gate answers 'known to lack' from the flat global list only: identity present and permissions not containing the name. It takes no project."
    evidence: "src/dashboard/src/hooks/useLacksPermission.ts:9-13; observed: 2026-10-15, wc -l useLacksPermission.ts 13"
  - claim: "The CallerIdentity mirror is hand-written and carries roles, permissions and findings; nothing generates or checks it, and its one optional field is nameIsReadable."
    evidence: "src/dashboard/src/lib/identityApi.ts:12-30, src/dashboard/src/lib/identityApi.ts:32-34; observed: 2026-10-15, wc -l identityApi.ts 34"
  - claim: "The server answers /api/identity with the CallerIdentity record itself, so its ProjectPermissions member (project -> permissions) reaches the wire as projectPermissions with no endpoint change; the server configures no DictionaryKeyPolicy, so dictionary keys (project names) are written verbatim, not camel-cased. Identity_CallerInAProjectBinding_SeesProjectPermissions proves the field on the wire."
    evidence: "src/backend/AgentSmith.Server/Extensions/IdentityEndpoints.cs:27-29, src/backend/AgentSmith.Server/Models/CallerIdentity.cs:18-33, tests/AgentSmith.Tests/Server/Auth/IdentityEndpointTests.cs:86-102; observed: 2026-10-15, grep -rn 'DictionaryKeyPolicy\\|ConfigureHttpJsonOptions\\|AddJsonOptions' src/backend/AgentSmith.Server -> no hit"
  - claim: "An anonymous caller resolves to empty roles and permissions; an authenticated one always holds identity.read. Project names compare case-insensitively: the resolved projects map is built under ConfigNames.Comparer (OrdinalIgnoreCase), and ProjectBindingReader keys the held permissions under the same comparer in the binding's spelling, so a key may differ in case from the configured name a ticket or run carries."
    evidence: "src/backend/AgentSmith.Server/Security/CallerIdentityResolver.cs:34-51, src/backend/AgentSmith.Server/Security/CallerIdentityResolver.cs:94-108, src/backend/AgentSmith.Contracts/Models/Configuration/ConfigNames.cs:24, src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigCatalogResolver.cs:75, src/backend/AgentSmith.Server/Security/ProjectBindingReader.cs:41"
  - claim: "Every useLacksPermission call site is a runs.control gate on a ticket act, and each already has the project the act's route names in reach: TicketCloseAct and TicketReopenAct from ticket.project, DoneByHandAct from its project prop (rendered by TicketHeader, TicketWaitsFor and TicketRequiresPanel), TicketDefaultsTab from useTicketDetail, the conversation's PendingQuestion from detail.project, and RetryUnchanged from nothing — its two callers (TicketConversationTab, TicketComposer) hold the project."
    evidence: "src/dashboard/src/components/tickets/closing/TicketCloseAct.tsx:16-19, src/dashboard/src/components/tickets/closing/TicketReopenAct.tsx:13-17, src/dashboard/src/components/tickets/landing/DoneByHandAct.tsx:20-23, src/dashboard/src/components/tickets/detail/TicketHeader.tsx:63-66, src/dashboard/src/components/tickets/detail/TicketWaitsFor.tsx:26-27, src/dashboard/src/components/tickets/graph/TicketRequiresPanel.tsx:23, src/dashboard/src/components/tickets/detail/TicketDefaultsTab.tsx:17-20, src/dashboard/src/components/tickets/detail/TicketConversationTab.tsx:19-20, src/dashboard/src/components/tickets/detail/TicketConversationTab.tsx:37, src/dashboard/src/components/tickets/detail/TicketConversationTab.tsx:56, src/dashboard/src/components/tickets/detail/TicketConversationTab.tsx:68-79, src/dashboard/src/components/tickets/detail/RetryUnchanged.tsx:12-19, src/dashboard/src/components/tickets/detail/TicketComposer.tsx:19-25, src/dashboard/src/components/tickets/detail/TicketComposer.tsx:95; observed: 2026-10-15, grep -rn 'useLacksPermission(' src/dashboard/src -> 6 components + the hook"
  - claim: "The one other permission gate reads identity.permissions directly: ClearTerminalRunsButton hides itself from a caller without runs.delete; it sends DELETE /api/runs?state=terminal, a route with no project in it."
