done:
  - "A person whose role grants runs.control only in project A sees Close, Reopen, Done by hand, Retry unchanged, the verdict selection and the answer card on A's tickets, and none of them on the tickets of a project B they may read but not control."
  - "A person holding runs.control globally sees exactly what they see today on every ticket."
  - "The identity page lists, per project, the permissions a project binding gave the caller, and no longer tells a project-bound caller that no role is mapped."
  - "A signed-in person bound to no configured project opens Runs, Tickets, the graph, Pull requests or Expectations and reads that their sign-in reaches no project, with where an administrator grants one; a global reader and an enforce-off installation see today's empty text."
  - "Clear finished is offered to a person holding runs.delete in any project and hidden from one holding it nowhere."
  - "Build green, full suite green, dashboard gen/test/build green."
