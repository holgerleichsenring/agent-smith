spec: 2026-10-15-4a4df
goal: "An administrator binds directory groups and people to roles per project in a Projects pane of the Access Studio, saved with the access document; forget and role removal respect bindings."

applies_to: "dashboard (the Access Studio's Projects pane, accessApi types, derive helpers) and backend (AccessView with the configured projects and the project-scopable set, ProjectBindingFindings as the one producer of binding findings, the access save's binding check, PersonRemover and RoleRemovalGuard over ProjectBindings) and docs (access-control.md project bindings)"

requires: [2026-10-15-4a4da, 2026-10-15-4a4dd]

