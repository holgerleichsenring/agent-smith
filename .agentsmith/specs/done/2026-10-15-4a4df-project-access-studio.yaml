scope:
  in: >
    VIEW: AccessView gains Projects (the configured project names, sorted under ConfigNames.Comparer) and ProjectScopable (the catalog's
    project-scopable permission names); AccessSurfaceReader takes TicketProjects and passes
    All().Keys to the composer (no catch: the loader already degrades to an empty
    configuration instead of throwing, and then every bound project honestly reads "not configured", which is what
    the runtime applies too); AccessViewComposer appends ProjectBindingFindings.Of(current, projects) to Findings.
    FINDINGS: ProjectBindingFindings (Server/Services/Access, an injected singleton, at most 60 lines) is the ONE producer of binding
    findings, read only by AccessViewComposer (access.read) and never by /api/identity: (1) a binding whose Project is
    blank or matches no configured name under ConfigNames.Comparer — "The project binding for '<project>' names no
    configured project; it is kept and applies if the project is configured again."; (2) a binding whose roles'
    current.Catalog.Permissions holds no name in Permissions.ProjectScopable — "The project binding for '<project>'
    grants nothing: none of its roles carries a run, init or dialog permission."; (3) a PersonRef whose Claim is not
    current.NameClaim — "A person in the project binding for '<project>' is written against the claim '<claim>', but
    callers are named by '<name claim>'; it grants nothing until it is written again." A role's global-only
    permissions are no finding (4a4da drops them silently; the pane shows them as ignored). With no bindings stored, Findings and every existing pane are unchanged, enforce on or off. SAVE: AccessGrantWriter.SaveAsync refuses, before storing, a binding whose Project is blank
    ("A project binding names no project.") — the only refusal; an unknown project and a binding that grants nothing
    (both this spec's findings) stay findings, because a project may be
    recreated and a role may be edited. FORGET: PersonRemover, whose fresh copy carries ProjectBindings since 4a4da,
    withdraws every PersonRef whose Value is one of the forgotten names from every binding; a binding THIS withdrawal
    left with no groups and no people is dropped, while a binding that was already memberless is kept untouched (an
    administrator may have saved one before naming its members); the mapping is saved when a grant OR a binding
    entry went. ROLE REMOVAL: RoleRemovalGuard.Holders also names
    "<group or claim:value> in <project> (project binding)" for every binding holding the role, so removing a custom
    role held only through a binding is refused with the binding named. DASHBOARD: accessApi.ts gains PersonRef,
    ProjectBinding, AccessDocument.projectBindings, AccessView.projects and AccessView.projectScopable.
    projectBindings.ts (components/access) holds the pure draft operations: projectsOf(view, draft) = configured
    projects ∪ projects named by draft bindings, matched case-insensitively as the server matches them (a binding
    for 'Alpha' sits under the configured 'alpha' row, not in a second "not configured" row), each with its bindings
    and configured: boolean; addBinding,
    removeBinding, and set-groups/people/roles of one binding addressed by (project, index). ProjectsPane.tsx: a
    PagedRows table, one row per project (search by name; filters All / Bound / Unbound / Not configured), the row
    shows its bindings as cards, each with group chips (a select of view.groups values plus a typed value, as the
    Groups pane adds one), people chips (a select of peopleOf names plus a typed value, written against
    view.nameClaim as the People pane writes a grant), RoleChips over roles offered only when they carry at least
    one project-scopable permission, and the effective project permissions of its roles listed under the card
    (scopable only, and "ignored here: <global-only>" when a held role carries others); "Add binding" per project
    and "Remove" per card; a project named only by bindings shows "not configured" beside its name. AccessStudio
    gains the fifth tab "Projects" with the count of projects that have at least one binding; the draft, dirty check,
    save and findings stay as they are. CSS: the card, member-chip and not-configured classes under .mock-access.
    DOCS: docs/reference/security/access-control.md gains a "Project bindings" section (348 -> at most 400): bindings
    beside the global grants, the six project-scopable permissions and that config.* / secrets.* stay global, names
    compared case-insensitively, the three findings and where they show, a resource of another project answering like
    a missing one, lists and live updates holding only the caller's projects, and that a tracker shared by two
    projects is a shared trust boundary (2026-10-15-4a4db's decision). The series merges as one, so the section
    describes the merged behaviour of 4a4db..4a4dd.
  out: >
    The ProjectBinding/PersonRef contracts, Permissions.ProjectScopable, the resolver's ProjectPermissions (4a4da
    computes no finding), the store / Config Studio settings route / import / export round-trip and RoleMappingConfig.IsEmpty —
    2026-10-15-4a4da. Route project sources, 404-not-403 and the guard column — 4a4db (the access routes carry only
    global access.* permissions and need no project source). Hub methods and per-project fan-out — 4a4dc. List
    filtering and GET /api/projects — 4a4dd (the studio reads configured projects from its own view, so it does not
    wait on 4a4dd). /api/identity projectPermissions, useLacksPermission(p, project), project pickers elsewhere and
    refusal states — 4a4de. Showing a person's project roles in the People pane, and counting binding holders in the
    Roles pane's people/groups tallies — nobody: the Projects pane is where a binding is read. An enforce-off note in
    the pane — nobody: no other pane carries one.

decisions:
  - key: "THE PICKER READS CONFIGURED PROJECTS FROM THE ACCESS VIEW. One GET answers everything the studio renders (the surface's own rule), and a binding naming a removed project must still render — so the pane unions configured names with bound ones instead of asking GET /api/projects, which 4a4dd adds for non-admin callers."
  - key: "SEVERAL BINDINGS PER PROJECT. One binding is one member set times one role set; 'team A operates, team B reads' in one project needs two. The pane groups cards under the project row instead of forcing one binding per project, and the save refuses only a blank project."
  - key: "OFFER ONLY ROLES THAT MEAN SOMETHING IN A PROJECT. A role with no project-scopable permission would grant nothing and be reported as a binding that grants nothing; the select hides it, and the card shows what is ignored for a role that carries both kinds, so the finding is rarely the first place an administrator learns it."
  - key: "FORGET TAKES THE BINDINGS WITH IT. A forget is 'this person is gone'; keeping their PersonRef in a project binding would let a returning namesake inherit project rights the administrator thought were removed. The fresh-copy shape of PersonRemover is kept and gains the field, which is also what stops a forget erasing every binding."
  - key: "A BINDING IS A HOLDER. Removing a custom role a binding still uses would silently strip that project's members; the existing guard's refusal names the binding like it names a grant or a group."
  - key: "ONE PRODUCER OF BINDING FINDINGS, ON THE ACCESS VIEW. Alternative: the reader in 4a4da reports some and the composer the rest. Why: the not-configured finding needs the configured names, which only the access view reads; putting all three sentences in one class read by AccessViewComposer gives each one home, and the access view is access.read business while /api/identity reaches every caller and must name no project (operator ruling 1)."
  - key: "NO SERVER-SIDE REFUSAL FOR AN UNKNOWN PROJECT. A project may be deleted and recreated under the same name; the binding is kept, applied, and reported as a finding composed by the access view (the only place that reads both the mapping and the configured names), and the pane marks the row 'not configured'."

steps:
  - id: view
    action: "AccessView (33 -> at most 45) gains Projects and ProjectScopable; AccessSurfaceReader (36 -> at most 45) takes TicketProjects and reads the project names (no catch, see scope); AccessViewComposer (63 -> at most 72) takes the names, passes the scopable set and appends ProjectBindingFindings.Of; ProjectBindingFindings (new, at most 60 lines, every method at most 20 lines) composes the three findings; AccessTestHarness passes a TicketProjects over a stub IConfigurationLoader whose project names a test sets (121 -> at most 128)."
  - id: save-check
    action: "AccessGrantWriter (59 -> at most 70) refuses a blank-project binding with ConfigurationException before customRoles.Against."
  - id: forget
    action: "PersonRemover (78 -> at most 100) withdraws the forgotten names' PersonRefs, dropping emptied bindings; Withdraw answers true when a grant or a binding entry went; the binding withdrawal is its own private method and drops only bindings it emptied. Every method at most 20 lines."
  - id: role-guard
    action: "RoleRemovalGuard (89 -> at most 100) adds the binding holders to Holders through a private BindingHolders method, so Holders stays under 20 lines."
  - id: api-types
    action: "accessApi.ts (100 -> at most 120): PersonRef, ProjectBinding, AccessDocument.projectBindings, AccessView.projects, AccessView.projectScopable. AccessStudio.test.tsx's document() and viewWith() gain projectBindings: [], projects and projectScopable in the same step, or pnpm build fails type-checking the test."
  - id: derive
    action: "projectBindings.ts (new, at most 90 lines): projectsOf, addBinding, removeBinding, setBindingGroups, setBindingPeople, setBindingRoles, effectivePermissions(view, roles) answering {scoped, ignored}; every function pure over (view, draft)."
  - id: pane
    action: "ProjectsPane.tsx (new, at most 150 lines) over PagedRows with testId access-projects; BindingCard.tsx (new, at most 120 lines) with the member chips (MemberChips.tsx, new, at most 90 lines) and role chips and the effective-permission line; AccessStudio.tsx (151 -> at most 165) gains the Projects tab and pane; mock-parity.css (1932 -> at most 1950) under .mock-access."
  - id: docs
    action: "access-control.md gains the Project bindings section (348 -> at most 400)."
  - id: tests
    action: "Red first, then green, for every test below. The backend tests go in a NEW class ProjectBindingSurfaceTests (the pure findings ones in ProjectBindingFindingsTests, PersonRemover/RoleRemovalGuard ones in ProjectBindingHolderTests), each at most 120 lines — AccessSurfaceTests is already at 166; the vitest tests in a new __tests__/ProjectsPane.test.tsx plus projectBindings.test.ts. Run the Server.Access classes with --filter and pnpm test src/components/access."

