done:
  - "An administrator opens Access → Projects, sees every configured project, adds a binding with a directory group, a person and the operator role to one project, saves, and the binding is still there after a reload."
  - "A role that grants nothing inside a project is not offered there; a role that also carries global permissions shows which of them are ignored in the project."
  - "A binding for a project that no longer exists stays listed as 'not configured' with a finding; a binding that grants nothing and a person written against a stale claim are reported on the Access page and nowhere else; a blank project is refused with a sentence."
  - "The access-control reference explains project bindings, what they admit, and that a tracker shared by two projects is one trust boundary."
  - "Forgetting a person removes them from every project binding and leaves every other binding intact; removing a custom role a binding still uses is refused with the binding named."
  - "Build green, full suite green, dashboard gen/test/build green."
