done:
  - "Calling the landed-by-hand route with a note, as a person holding runs.control, records who marked the ticket, when and why; the System page shows the landing."
  - "Every ticket that required it is no longer held, and one whose approver could start runs starts by itself."
  - "The marked ticket appears as done in the ticket list and on its page once none of its pull requests is open and its last attempt is not waiting for an answer; an open pull request keeps it waiting on review."
  - "Marking an already landed ticket, or losing a race to another mark or a merge, answers 409 with a sentence naming the landing that stands; every refusal is a sentence the dialog can show; a blank note answers 400; an unknown project or a ticket the tracker does not have answers 404 and records nothing; an unreachable tracker answers 503 and records nothing; a person without runs.control is refused."
  - "Asking the ticket steward for the next attempt of a ticket that waits for an unlanded ticket answers which tickets it waits for and that nothing was requested; a refused rework posted on a ticket says whether a comment, the conversation, a retry, a status move or an overrule asked for it."
  - "Build green, full suite green, dashboard gen/test/build green."
