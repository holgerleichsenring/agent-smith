spec: 2026-10-14-dbcei
goal: "A ticket marked done by hand with a note counts as landed, wakes its dependents and lists as done; a conversation's start of a waiting ticket names what it waits for and queues nothing."

applies_to: "backend (POST /api/tickets/{project}/{ticketId}/landed-by-hand, TicketLandingRecorder.RecordByHandAsync, the ticket list and header reading a landing of either kind as done; the conversation's attempt start asking the requires gate first, and a rework refusal naming the act's source)"

requires: [2026-10-14-dbceg, 2026-10-14-dbceh]

