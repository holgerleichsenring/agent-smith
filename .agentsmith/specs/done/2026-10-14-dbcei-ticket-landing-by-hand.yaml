assumptions:
  - "2026-10-14-dbceg lands ITicketLandingStore (TryRecordAsync, LandedAsync), TicketLandingFact, TicketLandingKinds.ByHand and TicketLandingRecorder with a private RecordAsync that, on a won insert, publishes TicketLanded and the page nudge; 2026-10-14-dbceh adds the DependentsWake call there."
  - "2026-10-14-dbceh's gate counts a landing of either kind through UnmetTicketRequirements."

scope:
  in: >
    RECORDER: TicketLandingRecorder.RecordByHandAsync(ResolvedProject project, string ticketId, string by, string note,
    ct) -> the stored TicketLandingFact, or null when the ticket had already landed; it builds the fact (Tracker =
    project.Tracker.Name, TicketKey = TicketKey.For(tracker type lowercased, ticketId), TicketId, Project, Kind by-hand,
    LandedAt now, By, Note trimmed, PrUrl null) and hands it to the recorder's one RecordAsync, so the TicketLanded event,
    the page nudge and 2026-10-14-dbceh's wake follow exactly as for a merge (the recorder grows by at most 15 lines,
    staying at most 100). ENDPOINT: TicketLandedByHandEndpoints (Server/Extensions, at most 70 lines) maps `POST
    /api/tickets/{project}/{ticketId}/landed-by-hand` with Needs(Permissions.RunsControl); body LandedByHandRequest(string?
    Note) (Server/Models). The handler decodes both segments, resolves the project from the live configuration
    (TicketProjects.Of, one load per request). EVERY non-200 answer is a plain sentence in the body, as
    TicketDefaultsEndpoints.cs:39 answers its refusal (Results.BadRequest(string) / Results.Text with the status), so
    2026-10-14-dbcen's dialog shows it as written: 404 "No project <name> is configured." for an unknown project; 400
    "A note is required: say why this ticket counts as landed." for a JSON body with a missing or blank note (a missing
    body or a non-JSON content type is answered 400/415 by minimal-API binding before the handler); 409 when the ticket
    had already landed, read through LandedAsync: "<id> already counts as landed: merged on <LandedAt>." or "<id> is
    already marked done by <By> at <LandedAt>: <Note>."; then, BEFORE the irreversible write, it reads the ticket from
    the project's tracker (ITicketProviderFactory.Create(project.Tracker).GetTicketAsync): a read classed not-found by
    TicketReadFailureReason.Of answers 404 "No ticket <id> on <tracker>." and writes nothing, any other failure answers
    503 "The tracker <tracker> could not be read (<class>); nothing was recorded." (unauthorized / unreachable, never
    the SDK text). Once the existence read passed, RecordByHandAsync is called with CancellationToken.None: a dropped
    request must not cut the wake between the insert and the publishes (contract decision 10's post-write rule). A
    null from RecordByHandAsync (another writer, a second mark or a merge, won the insert) is answered 409 with the
    same sentence after re-reading the winner with LandedAsync (also on CancellationToken.None). Only the 200 carries
    JSON: the new landing. By is the person's display name at write time, DisplayName.Of(ctx.User) (name, else
    preferred_username, else upn, never sub, as 2026-10-14-da5eb records a turn's author), else
    SpecDialogOwnership.PrincipalOf(ctx.User) for a token with none of the three; the 409 sentence, TicketLanded.By and
    2026-10-14-dbcen's page show it as stored, with no lookup. The ticket need not have a run, a pull-request record or a filing record (an ApprovedSeries row): a
    required ticket whose runs were deleted, whose provider has no review reader, or a person's ticket that a list
    names by ticket:<id> is exactly what the act is for; the handler reads neither runs nor filings before the write.
    TicketDefaultsEndpoints returns `app.MapTicketLandedByHandEndpoints()` instead of `app` (41 -> 41).
    route-permission-baseline.tsv gains the row `POST /api/tickets/{project}/{ticketId}/landed-by-hand runs.control`
    (tab-separated, sorted among the POST rows beside :119), and RoutePermissionGuardTests pins it. LIST AND HEADER: TicketStanding gains `Landed`, an init
    property (project, ticket id) -> LandedAt defaulting to empty, and `LandedAt(Run last)`; TicketStandings takes
    ITicketLandingStore, IConfigurationLoader and ServerContext and loads the live configuration ONCE per ReadAsync (as
    ReworkNudgeWorker.cs:80-81 does), resolving every head's project from that one load (so a project added in Config
    Studio after boot reads its landings), and reads, per tracker connection, one LandedAsync over their keys (a
    project not configured now reads none) (70 -> at most 92);
    TicketStoreHarness registers ITicketLandingStore -> LandedTicketRepository over the harness database as a singleton,
    as AddTicketFactStores does (the loader and ServerContext are already there, TicketStoreHarness.cs:59-61), so every harness consumer still builds under ValidateOnBuild; TicketBucketRule.Of gains
    `DateTimeOffset? landedAt = null` and its done time is the pull requests' DoneAt, else landedAt, under the same
    "newest attempt started no later" rule (51 -> at most 55); TicketSummaryComposer passes standing?.LandedAt(head) (52
    kept). A by-hand landing therefore lists the ticket as done in the list and on its header, with the proven dot, once
    none of its pull requests is open and its last attempt is not parked on a question: the rule's earlier arms
    (needs-you, waiting-on-review, TicketBucketRule.cs:29-34) still come first, while the gate is lifted at once. The
    summary's landing field is unchanged. CONVERSATION START (follow-up of 2026-10-14-dbceh after PR #740):
    ConversationAttemptStart.StartNextAsync asks UnmetTicketRequirements.OfAsync for the ticket (key
    TicketKey.For(tracker type lowercased, ticketId), tracker = project.Tracker.Name, the gate's own reading) BEFORE the
    pending-edit read and the retry, and with any unmet edge answers RequiresUnmetGate.Sentence(unmet) followed by
    ConversationAttemptStart.NothingQueued = " Nothing was requested; ask again once they have landed." — no approval
    is recorded, no nudge or retry is queued (47 -> at most 52); PendingEditStart is reached only from there and is not
    touched. REFUSAL SOURCE: ReworkTexts.TicketRefusal(reason, ReworkChannel channel = ReworkChannel.Ticket) names the act
    by its channel — Ticket "this comment", Status "this status change", Operator "the request in this ticket's
    conversation", Retry "this retry", Overrule "this overrule", PullRequest "this review" — in "Agent Smith — <source>
    did not start a rework: <reason>." (51 -> at most 62); ReworkNudgeHandler's two refusal posts and
    ClosedTicketActFollowUp's pass act.Act.Channel in place (119 and 101 kept).
  out: >
    The "Mark done by hand" button, its note dialog and showing who, when and why on the ticket page — 2026-10-14-dbcen.
    The blocked and filed buckets and the graph's done-by-hand node state — 2026-10-14-dbcen. Undoing a by-hand landing —
    nobody: contract decision 15; a dependent already started cannot be un-started, and a mistaken mark is answered by
    closing the dependents. Moving the tracker ticket to Done or commenting there — nobody: the mark is agent-smith's fact
    for its gate, and the tracker status stays the person's. A note length limit — nobody: the note is stored unbounded
    (2026-10-14-dbceg) and is one person's sentence. Overwriting a merged landing with a by-hand one — nobody: a landing
    is written once (contract §2.3), and the 409 shows which one stands.

decisions:
  - key: "AN EXPLICIT ACT WITH A REQUIRED NOTE. A by-hand landing lifts a gate the operator made strict (2026-10-14-dbceh), so it says who, when and why; a mark without a reason would be indistinguishable from a slip. The note is the only body field."
  - key: "runs.control, NOT runs.read. The mark wakes and may start every ticket that requires this one, the effect of a Retry or a start, which runs.control already guards."
  - key: "409 WHEN ALREADY LANDED, NEVER OVERWRITTEN (contract §2.6, §5 default 8, pending operator ratification). The landing row is written once; the first fact stands, and the answer carries it so the person sees why nothing changed."
  - key: "ANY EXISTING TICKET OF A CONFIGURED PROJECT, RUNS OR FILING OR NOT (contract decision 24, section 5 default 34, pending operator ratification). Contract decision 5: a required ticket whose pull-request records are gone, or whose host has no review reader, can only land by hand; requiring a run or a record would make that case impossible. Requiring the ticket to EXIST on the tracker is what keeps the permanent write safe: a typo (12 for 21) would otherwise land a ticket for ever and admit its dependents before anything merged, and an id of punctuation only lands '<provider>-unknown' (TicketKey.cs:13-25). An unreadable tracker refuses rather than writes (503), as Retry does."
  - key: "THROUGH THE SAME RECORDER AS A MERGE. One RecordAsync publishes TicketLanded, nudges the pages and wakes the dependents, so a by-hand landing and a merge cannot differ in what follows (contract §2.2)."
  - key: "DONE, UNDER THE SAME TIME RULE (contract §5 default 21, pending operator ratification). A landing of either kind lists the ticket as done only when the newest attempt started no later than the landing, as a merge does today; a later attempt is that attempt's ticket."
  - key: "THE LIST READS LANDINGS IN TicketStandings, NOT IN EACH READER. Both the list and the detail already read the standings for their heads and hand them to the one composer, so one read there serves both without touching TicketListReader, whose budget belongs to 2026-10-14-dbcen. Tracker connections come from the LIVE configuration through TicketProjects: the composed AgentSmithConfig is a boot snapshot (ServerCompositionBuilder.cs:79-80), and each replica's snapshot dates from its own boot."
  - key: "DONE ONLY WHERE THE RULE ALREADY SAYS DONE. A by-hand landing lifts the gate at once, but the list keeps the rule's earlier arms: a ticket with an open pull request is still waiting on review and a parked head still needs the person. Bypassing them would hide live work behind a 'done' row."
  - key: "EVERY REFUSAL IS A SENTENCE, THE WRITE OUTLIVES THE REQUEST. The dashboard's dialog (2026-10-14-dbcen) shows the server's words, so 404, 409 and 503 carry a sentence as TicketDefaultsEndpoints.cs:39 does, never a serialized object or an empty body. After the tracker said the ticket exists, the insert and its wake run on CancellationToken.None, so a closed dialog cannot leave a landing without its wake and a person with an error for a write that happened. The insert's loser (two marks, or a mark racing a merge, both past the pre-check during the seconds-long tracker read) is answered 409 naming the winner."
  - key: "TWO EDGES, STATED. A GitHub pull request's number passes the existence read (Issue.Get answers for it, GitHubTicketProvider.cs:68); its landing is harmless because no requirement names it. A ticket that is itself held may be marked done by hand and then admits its dependents; that is the deliberate way on past the strict gate (contract decision 7), and the dialog may say so (2026-10-14-dbcen)."
  - key: "ONE CONFIGURATION LOAD PER STANDINGS READ. The loader assembles the configuration from the document store on every call (DbConfigurationLoader.cs:39-46) and the list is re-read on every TicketActivityChanged, so TicketStandings loads it once per ReadAsync, not once per head's project."
  - key: "BY IS THE DISPLAY NAME AT WRITE TIME, IN THE ONE COLUMN (re-grounded after PR #740). 2026-10-14-da5eb reads a person's display name off the token (DisplayName: name, preferred_username, upn, never sub) and records it on their turn. The landing does the same in By, falling back to the principal only for a token with no display claim. Rejected: a separate ByName column beside the sub (a migration on 2026-10-14-dbceg's built table for one field no reader needs apart), and 2026-10-14-dbcen's read-time lookup of the observed caller's name claim (the name claim defaults to sub and production configures none, 2026-10-14-da5eb's own finding, so that lookup finds no name where da5eb's display claims do). A display name can be re-issued; the landing records who it was at the time, as a turn does."
  - key: "THE CONVERSATION START ASKS THE GATE FIRST, AND SAYS NOTHING WAS QUEUED (follow-up placed here: this member already serves the landing side of 2026-10-14-dbceh's gate and touches Server/Services/Rework; 2026-10-14-dbcek and 2026-10-14-dbcel are at their size). The steward's start_next_attempt answered 'requested' before the claim, and the claim's refusal then reached the ticket as a refused comment. Asking UnmetTicketRequirements before queueing answers in the conversation instead. It says 'ask again', not 'it starts by itself': a RequirementsMet nudge starts only a ticket no attempt worked (ReworkNudgeHandler.cs:40-41), and start_next_attempt is offered only on a worked ticket, so nothing queued would start later."
  - key: "A REFUSAL NAMES WHERE THE ACT CAME FROM. ReworkTexts.TicketRefusal said 'this comment' for a conversation's approval, a retry and a status move alike; the act already carries its channel, so the sentence names it, the comment wording unchanged for a comment."
  - key: "NAMES ADDED: TicketLandedByHandEndpoints and LandedByHandRequest are this member's endpoint class and body; contract §2.6 fixes the route and its answers but names neither. Reported for the contract."

steps:
  - id: recorder
    action: "TicketLandingRecorder.RecordByHandAsync builds the by-hand fact and returns RecordAsync's stored fact or null (the recorder stays at most 100 lines)."
  - id: endpoint
    action: "LandedByHandRequest (Server/Models) and TicketLandedByHandEndpoints with the POST route, runs.control, live project resolution, the tracker existence read before the write, the write and the loser's re-read on CancellationToken.None, a plain sentence for every 404 / 400 / 409 / 503 and the landing JSON only for 200 (at most 70 lines); TicketDefaultsEndpoints chains it (41 kept)."
  - id: route-guard
    action: "route-permission-baseline.tsv gains `POST<TAB>/api/tickets/{project}/{ticketId}/landed-by-hand<TAB>runs.control` sorted among the POST rows beside :119, and RoutePermissionGuardTests pins the route to runs.control."
  - id: standings
    action: "TicketStanding.Landed and LandedAt(Run); TicketStandings takes ITicketLandingStore, IConfigurationLoader and ServerContext, loads the configuration once per ReadAsync and reads landings per tracker connection of the heads' live projects (70 -> at most 92); TicketStoreHarness.cs registers the landing store; run the Tickets test classes."
  - id: bucket
    action: "TicketBucketRule.Of(…, landedAt) done time DoneAt ?? landedAt under the existing start rule (51 -> at most 55); TicketSummaryComposer passes standing?.LandedAt(head) (52 kept)."
  - id: conversation-start
    action: "ConversationAttemptStart asks UnmetTicketRequirements first and answers RequiresUnmetGate.Sentence + NothingQueued without queueing (47 -> at most 52); ReworkTexts.TicketRefusal(reason, channel) (51 -> at most 62); ReworkNudgeHandler.cs:105,114 and ClosedTicketActFollowUp.cs:43 pass act.Act.Channel in place (119, 101 kept); run the Rework and SpecDialog classes."
  - id: tests
    action: "Red first, then green, for every test below; the composition test's class carries a TestProcess env trait with EnvVarCollection; run the Tickets, Rework, Claim and Server route classes touched with --filter."

