# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-6d9ea
goal: "The run page opens with a crumb, a title, one meta line and a Now block that follows the agent live and says how a finished run ended, with every act the operator needs."

applies_to: "dashboard (components/jobs/runlog: RunPageHead, RunNow, runNowLines, runMetaWords, useRunTicket; app/jobs/[id] page)"

requires: [2026-11-17-d6fbb]

facts:
  - claim: "The default view is RunLogView; the story with banner and side rail renders only with ?view=graph."
    evidence: "src/dashboard/src/app/jobs/[id]/page.tsx:171-216"
  - claim: "Live, the run group carries steps, LLM calls, decisions, tool calls and sub-agent events but not SandboxCommand/SandboxResult (detail group, persisted, replayed on join); SandboxOutput is never stored; the live sandbox beat is a coalesced rollup."
    evidence: "src/backend/AgentSmith.Server/Services/Events/SandboxDetailEventClassifier.cs:15-20, src/backend/AgentSmith.Server/Services/Events/RunEventRouter.cs:25-33, src/dashboard/src/hooks/useSandboxActivity.ts:17-31"
  - claim: "Retry unchanged exists on the ticket page only, gated on runs.control and retriable(attempt)."
    evidence: "src/dashboard/src/components/tickets/detail/RetryUnchanged.tsx:17-51"
  - claim: "useRunTicket reads the ticket's attempts to name 'Run n of m'."
    evidence: "src/dashboard/src/components/jobs/runlog/useRunTicket.ts:19-38"

