scope:
  in: "Crumb 'Runs / run id · ticket key · Run n of m'; title with connection, cancel and delete as text acts; one meta line (state coloured · steps · elapsed · cost of cap · pods · mem · shape) and a 'details' disclosure with every other recorded fact; the Now block: live lines from the hub's run events (current step, newest decision, tool call, file written, finding) and the sandbox beat from useSandboxActivity only (SandboxCommand reaches a page only on replay, so it is not read); queued and resuming say their place in line; the question with PendingQuestionCard reused unchanged (shared with the ticket page) while waiting, and on a finished run 'How it ended' (outcome; review from the review step's resultMessage and hasFinding; verify per repository from the last VerifyPassRecorded; why it stopped) with its acts (pull requests, retry unchanged, the ticket, why)."
  out: "Sections and step detail (6d9eb, 6d9ec); deleting the graph view (6d9ed); backend changes."

steps:
  - id: words
    action: "runMetaWords.ts: metaLine (state, steps, elapsed, cost of cap with its tone, pods and mem, shape) and detailLines (started, model and LLM calls, repositories, pipeline, run id, time split, budget share and tier, reserved Gi·min, shape reason, sandbox commands)."
  - id: head
    action: "RunPageHead draws the mock's crumb, title row with the acts as text, the meta line and the details disclosure with the pods."
  - id: now
    action: "runNowLines.ts derives the live lines from the run's events and step rows and the ended lines from the snapshot, steps and the last verify pass; RunNow draws them under 'Now — follows the agent', 'Waiting for your answer' or 'How it ended'."
  - id: acts
    action: "How it ended carries the pull request links, Retry unchanged (useRunTicket also returns the attempt and whether it is the newest), the ticket page and the Why page."
  - id: wire
    action: "RunLogView renders RunPageHead and RunNow in place of RunPageHead, RunFacts and RunStatusBox."

tests:
  - "runMetaWords: live and finished meta line, cost tone near/over cap, details lines."
  - "runNowLines: live lines follow a new StepStarted, DecisionLogged and SubAgentFileWritten; ended lines for success with PRs, shortfall, failed with summary, cancelled; verify per repository."
  - "RunNow: the label switches from 'Now — follows the agent' to 'How it ended' when the snapshot finishes; the question shows its answer form; PR links, retry, ticket and why acts render."
  - "RunPageHead: crumb with run id, ticket and Run n of m; cancel while live, delete always."

done:
  - "The inventory above is in this spec and the PR body."
  - "A live run's Now block updates when new hub events arrive; a finished run says how it ended and offers its acts."
  - "pnpm test and build are green."
