assumptions:
  - "Run.Project and the other Project columns hold the configured key's spelling; the scope emits configured spellings, so the SQL comparison needs no case folding."

scope:
  in: >
    SCOPE: ProjectScope (Infrastructure.Persistence/Contracts, namespace AgentSmith.Infrastructure.Persistence.Contracts,
    at most 45 lines) — Only: IReadOnlyList<string>? (null = every project); Everything; Single(name); Of(names);
    Admits(name) under ConfigNames; Narrowed(requested): blank keeps the scope, Everything narrows to Single(requested)
    with the requested spelling verbatim, a scoped one to Single(its own configured spelling of the name) when Admits(requested) else Of([]).
    ProjectScopeQueries (same folder and namespace, at most 45 lines) — Within over IQueryable of Run, PrReviewRecord,
    ApprovedSeries and SpecDialogSession: Everything returns the query UNCHANGED; a one-name scope emits
    Where(Project == name), today's predicate; otherwise Where Only.Contains(Project); the SpecDialogSession overload
    also keeps a session whose Project is empty. Placed there because every touched repository already imports that
    namespace, so no using line is added (the only way RunRepository and SpecDialogSessionRepository hold their counts).
    CallerProjectScope (Server/Security, singleton, at most 50 lines), For(ClaimsPrincipal, permission, configured keys?): built on
    4a4db's ProjectAccess — not Enforcing -> Everything; else ProjectAccess.ProjectsHolding(user, permission, configured?)
    (new; null when held globally -> Everything) -> Of(those names), in configured spelling. ProjectsHolding resolves
    the caller once and reads the configured keys ONCE (or takes the keys a caller already loaded), never per project
    (operator ruling: one configuration load per list request); HoldsIn keeps its semantics — a
    bound project no longer configured is never a key, so its runs and records stay with global holders. Registered in
    4a4db's ProjectScopeExtensions.AddProjectScope (at most 25 -> at most 26), not in CallerIdentityExtensions.
    COARSE GATE: PermissionRequirementHandler.Holds also admits an AcrossProjects endpoint on HoldsAnywhere (4a4db's
    at most 55 kept) — every AcrossProjects route is filtered by this spec (the hub is no longer one: 4a4dc's Hub kind);
    undeclared routes keep the global check. 4a4db's ProjectScope_AcrossProjectsRoute_ProjectOnlyCaller_Is403AsToday becomes
    ..._IsAdmittedAndFiltered, and a caller holding the permission in no project still gets 403.
    RUNS: GET /api/runs (overview and cursor page) under For(runs.read); RunListComposer.BuildOverviewAsync and
    BuildPageBeforeAsync take the scope (96 -> at most 98); RunRepository GetActiveRunsAsync, GetRecentRunsAsync and
    GetRunsBeforeAsync take it in their existing signature line and apply Within on their existing Where line, no line
    added (143 -> at most 143); RunQueryEndpoints
    112 -> at most 116. GET /api/pull-requests under For(runs.read) through BuildListAsync (74 -> at most 77).
    GET /api/runs/expectations/metrics under For(runs.read): CriteriaMetRepository.FinishedCodeRuns(scope) feeds both
    the runs and the judgement join (51 -> at most 53). DELETE /api/runs?state=terminal under For(runs.delete):
    RunDeleter.DeleteTerminalAsync and RunDeletionRepository.DeleteTerminalAsync take the scope (100 -> at most 101),
    so a project-only holder deletes only the terminal runs of projects where they hold runs.delete; a global holder
    and enforce off delete every terminal run as today; 4a4dc's data-free "bulk" nudge is unchanged. TICKETS: TicketListRequest's Project string
    becomes ProjectScope Projects (first positional); GET /api/tickets builds For(runs.read).Narrowed(project);
    TicketListReader.AllAsync(ProjectScope) and ReadAsync pass it to TicketListQuery.ReadAsync (filter before the
    ceiling), TicketPullRequestReader.AllAsync -> PrReviewRecordRepository.ForListAsync, FiledTicketRows.ListAsync and
    TicketMonthCost.OfAsync, each replacing its string filter with Within in place (TicketListReader 98 -> at most 100,
    TicketListQuery 39 kept, TicketPullRequestReader 70 -> at most 71, PrReviewRecordRepository 76 kept, FiledTicketRows
    98 kept, TicketMonthCost 26 kept). GET /api/tickets/graph builds For(runs.read).Narrowed(project);
    TicketGraphReader.ReadAsync(ProjectScope) reads edges of Only ?? every configured key, replacing line 23 in place so
    the 21-line method does not grow, and hands the same scope to AllAsync (50 -> at most 51); TicketRequiresReader
    passes Single(project), the same equality SQL as today (41 -> at most 42).
    DIALOG: GET /api/spec-dialog/conversations under For(dialog.write): ListByOwnerAsync and CountByOwnerAsync take the
    scope on their existing lines (120 -> at most 120), SpecDialogConversationList.ListAsync passes it (90 -> at most 92). GET .../{dialogId}/filed-work:
    FiledWorkReader.ReadAsync(dialogId, scope For(runs.read), ct) keeps only admitted projects in each reach (95 -> at
    most 99); a filed row itself (the conversation's own content) stays, with no runs from an unreadable project.
    GET /api/spec-dialog/{dialogId}: SpecDialogViewEndpoints.ReadAsync takes CallerProjectScope and narrows the
    view's Projects (the new-conversation choice from SpecDialogProjectCatalog.All) to the names For(user, dialog.write)
    admits — Everything returns the reader's view untouched; the reader and the catalog are unchanged, and the open
    session's own project view is 4a4db's dialog-route check. GET /api/spec-dialog/tickets/search, /resolve and /{ticketId} under For(dialog.write): ProjectScopedCatalog.Narrow
    (Server/Services/SpecDialog, at most 40 lines) hands them a configuration of the admitted projects and only the
    trackers those projects name (Everything returns the loaded config itself). A tracker shared with an unreadable project is still asked,
    because the admitted project routes to it; its hits are tracker tickets, not another project's records (decision
    below). TicketSearchEndpoints 101 -> at most
    105, TicketConversationEndpoints 92 -> at most 95. PROJECTS: ProjectListEndpoints (Server/Extensions, at most 40
    lines) maps GET /api/projects under runs.read with InProject(ProjectFrom.AcrossProjects), answering a bare JSON
    array of names (the shape 4a4de's client reads directly) — the configured keys For(runs.read) admits, ordered under
    ConfigNames.Comparer; ProjectBootstrapEndpoints returns app.MapProjectListEndpoints() (25 -> at most 26).
    route-permission-baseline.tsv gains "GET /api/projects runs.read across" just before the :49 row (regenerated, read
    the diff) and RoutePermissionGuardTests pins it. FINDINGS: GET /api/config/findings stays anonymous;
    StartupFindingsEndpoints (33 -> at most 45) takes ProjectAccess and the ClaimsPrincipal, and when Enforcing and the
    caller fails HoldsEverywhere(user, [config.read]) (an anonymous caller included) drops every finding whose Project
    is non-blank before StartupFindingsResponse.From, so the counts and Degraded describe what is shown; enforce off or
    a config.read holder reads exactly today's answer.
  out: >
    The ProjectBinding model, ProjectPermissions on CallerIdentity, scopability and findings — 2026-10-15-4a4da. The
    AcrossProjects declaration on the existing list routes, ProjectAccess, the route-scope guard, single-resource routes
    (route value, run id, dialog, session, set, image, including the dialog-keyed reference lists) answering 404, and
    project-carrying POST bodies (dialog messages, reference and image uploads) — 2026-10-15-4a4db. The hub's per-project groups, RunsChanged / TicketActivityChanged /
    SystemActivityUpdated placement, the RunsChanged nudge of the bulk delete and the filed-work push (data-free, its
    refetch is the filed-work route filtered here) — 2026-10-15-4a4dc. projectPermissions on
    /api/identity, useLacksPermission(p, project), project pickers reading GET /api/projects, empty states —
    2026-10-15-4a4de. The Access Studio Projects pane — 2026-10-15-4a4df. GET /api/config/projects and every other config.*,
    secrets.*, access.*, archive.*, diagnostics.*, catalog.read route: global-only, unchanged. Webhooks, Slack, Teams and
    tracker polling: anonymous server-side triggers, unchanged.

decisions:
  - key: "FILTER IN THE QUERY, NOT AFTER IT. The run list takes 50, the pull requests 200, the tickets 5000 rows; filtering the result would hand a scoped caller a short or empty page whenever other projects are busy. Every read takes the scope before its Take."
  - key: "EVERYTHING IS THE QUERY UNCHANGED, ONE NAME IS TODAY'S EQUALITY. Within returns the same IQueryable for Everything and emits Project == name for one name, so enforcement off and every global holder run exactly today's SQL, ?project= included — the operator's byte-identical constraint holds by construction, and two tests pin it."
  - key: "ONE ACCESS RULE. Alternative: CallerProjectScope unions ProjectPermissions itself. Why: 4a4db's ProjectAccess (over 4a4da's PermissionsIn) already answers enforcing, everywhere and in-project, unconfigured projects included; a second derivation could disagree with the 404 the single-resource routes answer."
  - key: "THE SCOPE TYPES LIVE IN PERSISTENCE CONTRACTS. Alternative: Contracts/Models/Access plus Persistence/Extensions. Why: every touched repository already imports AgentSmith.Infrastructure.Persistence.Contracts; the other placement adds two using lines to RunRepository (ratcheted at 143) and SpecDialogSessionRepository (at 120)."
  - key: "THE COARSE GATE FLIPS HERE, WITH THE FILTERS. 4a4db kept AcrossProjects global so no list was ever open unfiltered; this spec filters every one and opens them in the same commit. The hub left the marker in 4a4dc (its own Hub kind), so this flip opens lists only."
  - key: "THE DIALOG'S PROJECT CHOICE IS A LIST. Alternative: leave SpecDialogProjectCatalog.All() unfiltered. Why: it hands every dialog.write holder every project's name, repositories and templates — operator ruling 1. The endpoint narrows the answer rather than the reader taking a scope, so the reader's dozen test callers stay as they are."
  - key: "PROJECT-NAMING STARTUP FINDINGS NEED config.read. Alternative: put the route behind a permission. Why: the route must stay anonymous (it reports a broken authority); a finding with a Project names it, and diagnosing configuration is config.read business. Counts follow the shown list, so a hidden finding is not even counted; a project-only person loses a Degraded banner they could not act on — accepted."
  - key: "ONE SCOPE TYPE REPLACES THE PROJECT STRING. The ticket reads already thread string? project; a ProjectScope in its place carries both the request's filter and the caller's reach, migrated at every caller rather than an overload beside it (no wrapper shims)."
  - key: "AN UNREADABLE PROJECT READS AS EMPTY, NOT REFUSED. ?project=X that the caller may not read answers the empty list an unknown project already answers; a 403 or 404 there would confirm X exists."
  - key: "SCOPE PER PERMISSION. A list reads the projects where the caller holds the route's own permission: runs.read for runs and tickets, runs.delete for the bulk delete, dialog.write for the dialog lists; filed-work's run reach uses runs.read."
  - key: "UNCONFIGURED IS GLOBAL-ONLY. The scope is built from the configured keys a binding names, so a binding left behind by a removed project shows nothing, and runs of a removed project stay with global holders."
  - key: "TRACKER READS ARE SCOPED BY NARROWING THE CATALOGUE (a shared tracker is a shared trust boundary, 4a4db's decision). Search, resolve and pick read trackers, not rows; handing them a configuration of the admitted projects and their trackers is how TicketProjectForTracker already scopes the choice, so no tracker a caller cannot reach is even asked. A tracker shared with an unreadable project is asked: the hits are the tracker's tickets, which the admitted project may file onto, not that project's runs or records."
  - key: "A CONVERSATION WITHOUT A PROJECT STAYS ITS OWNER'S. The list is already owner-filtered; only a conversation bound to a project the owner can no longer read is hidden."
  - key: "AS BUILT: the coarse gate admits any declared source on a hold anywhere, so ProjectFrom.IsPerResource lost its only reader and was removed; NoStaticStateRuleTests counts System.Linq interfaces as data contracts so the Within extensions over IQueryable pass; the one-name branch goes through a helper whose parameter is named project, because a list-pattern variable is captured under a generated name and changed the SQL parameter."
  - key: "THE BULK DELETE IS A LIST TOO. It acts on every project's finished runs; a project-bound holder of runs.delete clears only theirs."

steps:
  - id: scope
    action: "ProjectScope (at most 45 lines) and ProjectScopeQueries (at most 45 lines, four Within overloads) in Infrastructure.Persistence/Contracts; CallerProjectScope (at most 50 lines) over ProjectAccess, registered in ProjectScopeExtensions (at most 26)."
  - id: coarse-gate
    action: "PermissionRequirementHandler admits AcrossProjects on HoldsAnywhere (at most 55 kept); flip 4a4db's ..._Is403AsToday test to ..._IsAdmittedAndFiltered and add the no-hold 403 case."
  - id: runs
    action: "RunRepository list reads take the scope (143 -> at most 143, Within on the existing Where lines); RunListComposer (96 -> at most 98); RunQueryEndpoints (112 -> at most 116); PullRequestQueryEndpoints (74 -> at most 77); CriteriaMetRepository (51 -> at most 53) and CriteriaMetEndpoints (27 -> at most 30); RunDeletionRepository (100 -> at most 101), RunDeleter (65 -> at most 66), RunDeletionEndpoints (4a4dc's at most 62 -> at most 65)."
  - id: tickets
    action: "TicketListRequest.Projects (11 -> at most 12); TicketQueryEndpoints (46 -> at most 49); TicketListReader (98 -> at most 100), TicketListQuery (39 kept), TicketPullRequestReader (70 -> at most 71), PrReviewRecordRepository.ForListAsync (76 kept), FiledTicketRows.ListAsync (98 kept), TicketMonthCost (26 kept); TicketGraphEndpoints (30 -> at most 33), TicketGraphReader (50 -> at most 51), TicketRequiresReader (41 -> at most 42); migrate every test caller of TicketListRequest, AllAsync, TicketQueryEndpoints.ListAsync and TicketGraphEndpoints.GraphAsync (TicketNeverRunListTests:144, TicketGraphReadTests:112) to ProjectScope.Everything / Single."
  - id: dialog
    action: "SpecDialogSessionRepository ListByOwnerAsync / CountByOwnerAsync (120 -> at most 120); SpecDialogConversationList (90 -> at most 92); FiledWorkReader reach (95 -> at most 99); SpecDialogViewEndpoints (77 -> at most 86: filed-work scope and the dialog view's project narrowing; DashboardDialogSurfaceTests:178 passes the scope service); ProjectScopedCatalog.Narrow (at most 40 lines); TicketSearchEndpoints (101 -> at most 105), TicketConversationEndpoints (92 -> at most 95)."
  - id: projects-route
