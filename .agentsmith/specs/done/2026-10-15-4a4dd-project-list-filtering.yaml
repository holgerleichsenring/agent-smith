# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-15-4a4dd
goal: "Every list and aggregate a person reads holds only the projects they may read, filtered in the query, and GET /api/projects names those projects; with enforcement off nothing changes."

applies_to: "backend (ProjectScope and its query filters, CallerProjectScope, the coarse gate for AcrossProjects routes, the run list and its cursor page, pull requests, Criteria met, the bulk terminal delete, the ticket list and graph, the conversation list, the filed-work reach, the dialog view's project choice, ticket search / resolve / pick, the project-naming startup findings, and the new GET /api/projects)"

