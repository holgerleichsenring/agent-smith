    evidence: "src/dashboard/src/lib/tickets/TicketPageReads.ts:88-89, .agentsmith/contexts/default/principles.md:26"
  - claim: "TicketSpecsTab.tsx is 94 lines; seven test files build a fake of the ticket page's reads (TicketSpecsTab, TicketConversationTab, TicketPage, TicketAttemptsCost, costCompute, mock-parity, TicketPageStore)."
    evidence: "observed: 2026-10-14, wc -l and grep -rln 'compute: ' over src/dashboard/src test files in the 8762 worktree"
  - claim: "A lone spec is filed through seriesFiling.Mint([spec.Draft]) and amended through Series.Under(series, [spec.Draft]); a closed ticket's follow-up with one draft left files new SpecOutcome(decision.Drafts[0]), built from the draft alone."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/OutcomeTicketFiler.cs:46, src/backend/AgentSmith.Server/Services/SpecDialog/AmendedSpecification.cs:34, src/backend/AgentSmith.Server/Services/SpecDialog/Continuation/ClosedTicketFollowUp.cs:21-23"
  - claim: "A continuation's record names a disposition per spec — kept, recut, appended or dropped; a filing carries no Continuation."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecDispositionKinds.cs:7-13, src/backend/AgentSmith.Contracts/Specs/SpecApprovalRecord.cs:63-77"
