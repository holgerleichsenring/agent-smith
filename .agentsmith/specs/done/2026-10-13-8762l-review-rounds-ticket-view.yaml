  - claim: "TicketPageStore counts SpecCutReviewed events in the live attempt's stream and calls reads.cutReviewed() on each new one."
    evidence: "src/dashboard/src/lib/tickets/TicketPageStore.tsx:87-107"
  - claim: "Ticket reads go through ticketsApi helpers on /api plus ticketPath(project, ticketId)."
    evidence: "src/dashboard/src/lib/ticketsApi.ts:40-56"
  - claim: "An attempt's revision carries approvalAt, the approval the published set came from."
    evidence: "src/dashboard/src/types/tickets.ts:160-180"
  - claim: "The parity test asserts the Specs tab's mock classes (.sp-grid ... .blk, .crit, .ci, .revs, .rv); the vendored ticket-view mock and mock-parity.css name their source and every deviation."
    evidence: "src/dashboard/src/__tests__/mock-parity.test.tsx:309, src/dashboard/src/styles/mock-parity.css:1-10"
  - claim: "The ratified ticket-view mock has no review-round surface: the cut reviewer appears only as conversation entries and a revision cause."
    evidence: "src/dashboard/design/mockups/ticket-view.html:846-849, src/dashboard/design/mockups/ticket-view.html:941"
  - claim: "The C# line ratchet lists no dashboard file."
    evidence: "observed: 2026-10-14, grep -c 'dashboard' tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv = 0"
  - claim: "SpecCutReviewed is the last run event the dashboard mirrors (86)."
    evidence: "src/dashboard/src/types/hub-events.ts:50"
  - claim: "A new filing stores the approved proposal as ConfirmedOutcomeJson and CLEARS it once filing succeeded; that column means 'approved and not fully filed'."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/TicketFilingOutcomeSink.cs:41-47, src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeStore.cs:29-38"
