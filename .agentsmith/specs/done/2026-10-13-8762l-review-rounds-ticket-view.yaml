# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762l
goal: "A ticket's Specs tab shows every pre-build review round of each spec and of the set — verdicts, cuts, what still stands, contract findings — from one server read."

applies_to: "dashboard (ticket Specs tab, the page's read store) + backend (Server ticket reviews endpoint and reader; the approval record carries the approved proposal's review rounds)"

requires: [2026-10-13-8762k]

facts:
  - claim: "A published cut carries its hand-back case as SpecCutContent.CaseOf's string, the enum case name only; the ticket page's gate reads 'skipped' for any cut with a case and the step's status otherwise, and the dashboard words a case through CASE_WORDS."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCutContent.cs:19-21, src/backend/AgentSmith.Application/Services/Specs/SpecSetAnnouncer.cs:36, src/backend/AgentSmith.Application/Services/Specs/SpecSetAnnouncer.cs:60, src/backend/AgentSmith.Server/Services/Tickets/TicketSeriesReader.cs:55-61, src/dashboard/src/components/tickets/detail/flowWords.ts:35-47"
  - claim: "Ticket routes are runs.read and chain from MapTicketSeriesEndpoints into MapTicketConversationReadEndpoints, which returns the app; segments are decoded with TicketQueryEndpoints.Decoded."
    evidence: "src/backend/AgentSmith.Server/Extensions/TicketSeriesEndpoints.cs:12-25, src/backend/AgentSmith.Server/Extensions/TicketConversationReadEndpoints.cs:14-18"
  - claim: "TicketSeriesReader numbers a ticket's attempts from TicketRunsQuery rows of the code pipeline through TicketAttempts, and answers null (404) for a pair that is no ticket or a run that is not one of its attempts."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/TicketSeriesReader.cs:22-29"
  - claim: "Ticket readers open their own scope and read projected rows through uow.Set<T>() in one set query per table."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/TicketSeriesRecordsReader.cs:13-24"
  - claim: "The ticket readers are registered transient in AddTicketReaders (56 lines)."
    evidence: "src/backend/AgentSmith.Server/Extensions/TicketReadExtensions.cs:16-55"
  - claim: "Every ticket route is listed with its permission in the route-permission baseline."
    evidence: "tests/AgentSmith.Tests/Server/route-permission-baseline.tsv:80-84"
  - claim: "The Specs tab lists the series' specs with a cell per attempt beside the selected spec's document, then the revisions; it fetches no spec file."
    evidence: "src/dashboard/src/components/tickets/detail/TicketSpecsTab.tsx:15-56"
  - claim: "SpecDocument renders a spec as blocks (.blk with an h4) of steps and done criteria (.crit/.ci rows with a mark, text and who), then the read-only note."
    evidence: "src/dashboard/src/components/tickets/detail/SpecDocument.tsx:33-73"
  - claim: "TicketPageReads holds detail, series and conversation as ticket-level reads; a TicketActivityChanged re-reads all of them and a SpecCutReviewed in the live stream re-reads the conversation."
