# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-25-0873
goal: "Tracker writes, PoC repo acts and preflight repo probes run under the machine identity, as repository acts do since 2026-11-25-9992h."

applies_to: "default (TrackerConnection, CredentialResolver, TrackerIdentity, GitHubStatusHistory, PocMachine, PoC handlers, PreflightRepos, machine findings) + dashboard (PoC settings)"

requires: [2026-11-25-9992h, 2026-11-25-d0e2]

facts:
  - claim: "Every tracker client takes its token from credentials.For(tracker), the tracker's own auth secret; a tracker is a shared catalog entry the project resolves by name."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/TrackerConnections.cs:21-49; src/backend/AgentSmith.Contracts/Services/CredentialResolver.cs:49; src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ResolvedProjectBuilder.cs:29"
  - claim: "Claims, comments and status moves use the project's tracker; only the zero-match comment uses a catalog tracker, because no project matched."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/TicketClaimService.cs:53; src/backend/AgentSmith.Application/Services/Lifecycle/TicketAwarePipelineLifecycleCoordinator.cs:31; src/backend/AgentSmith.Server/Services/Webhooks/WebhookSpawnDispatcher.cs:72-75"
  - claim: "GitHub tracker self is GET /user, which an App installation token cannot call; TrackerIdentity caches self per tracker name."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubStatusHistory.cs:14-18; src/backend/AgentSmith.Application/Services/Rework/TrackerIdentity.cs:15-27; observed: 2026-11-25, https://docs.github.com/en/rest/authentication/endpoints-available-for-github-app-installation-access-tokens"
  - claim: "A PoC target's source repo is read from the repos catalog or a connection, and the GitOps commit and build take the poc- project's first repo; neither carries a machine unless the poc- project names one."
    evidence: "src/backend/AgentSmith.Application/Services/Pocs/Pipeline/PocSourceRepos.cs:10-21; src/backend/AgentSmith.Application/Services/Handlers/GitOpsCommitHandler.cs:36; src/backend/AgentSmith.Application/Services/Handlers/PocPipelineBuildHandler.cs:44"
  - claim: "RepoAccessCheck lists catalog repos before project repos and dedups by url and auth, so it probes the unstamped copy; VerificationOnboardingCheck reads catalog repos."
    evidence: "src/backend/AgentSmith.Application/Services/Preflight/Checks/RepoAccessCheck.cs:61-69; src/backend/AgentSmith.Application/Services/Preflight/Checks/VerificationOnboardingCheck.cs:48"
  - claim: "A GitHub App acts as its bot account <name>[bot]; an installation token reads PR review comments, reviews and issue comments (pull_requests/issues read) and writes issue comments, labels and state (issues write)."
    evidence: "observed: 2026-11-25, https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/differences-between-github-apps-and-oauth-apps, https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps"

scope:
  in: |
    TrackerConnection.Machine, stamped as the project resolves from its block's entry for the tracker's hoster (GitHub,
    GitLab, Azure Boards); CredentialResolver.For(tracker) answers the machine's token (App installation token against the
    tracker's host, Entra token through d0e2) and MachineLogin(tracker) the App's {slug}[bot], which GitHubStatusHistory
    answers as self instead of GET /user. TrackerIdentity keys its cache by tracker and machine. Advisory findings: a
    tracker whose hoster the project's block leaves out; a tracker projects write to under different identities (each
    project). pocs.machine (the same block, validated by the one MachineIdentityProblems rule a project's block uses):
    PocMachine stamps the target install's source repo (PocSourceRepos) and the source commit, GitOps commit and build's
    repo unless the poc- project stamped it; a target whose hoster it leaves out is advisory. PreflightRepos: RepoAccessCheck
    and VerificationOnboardingCheck reach each project's repo as it acts and each catalog repo with its own auth, one probe
    per remote and identity; TrackerAuthCheck probes each project's machine-stamped tracker beside the catalog trackers.
    Dashboard: the machine fields are MachineIdentityFields, shared by the project form and the PoC settings. Docs, schema.
  out: "Jira trackers (their identity is the tracker's own account). Reads under the catalog tracker or repo: polling, the change and PR sweeps, discovery. The zero-match comment (no project owns it; said in the docs). The 9992h advisory on a poc- project without its own block, which pocs.machine already covers (no marker tells a poc- project apart)."

done:
  - "A project with a machine block stamps its tracker for the tracker's hoster; a tracker write uses the machine's token, an App's minted against the tracker host; pinned with fakes."
  - "A GitHub App tracker's self is {slug}[bot] without GET /user; TrackerIdentity keeps one self per tracker and machine."
  - "A PoC target install, source commit, GitOps commit and build use pocs.machine unless the poc- project names its own; an unusable pocs.machine is a pocs problem; a missing hoster is advisory; the PoC settings edit and round-trip it."
  - "RepoAccessCheck and VerificationOnboardingCheck reach a project's repo as its machine and a catalog repo with its own auth, once per remote and identity; TrackerAuthCheck probes the stamped trackers too."
  - "A tracker on a hoster the project's block leaves out, or written to under several identities, carries an advisory finding."
