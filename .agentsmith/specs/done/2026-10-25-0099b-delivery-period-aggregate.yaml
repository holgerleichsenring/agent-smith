# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-25-0099b
goal: "GET /api/delivery answers, for the last day, week or month, the tickets worked with their attempts, outcomes and key figures, filtered to the caller's projects before anything is counted."

applies_to: "default (Server/Services/Delivery, Server/Models/Delivery*, DeliveryEndpoints, two Persistence repositories, ProjectScope.NarrowedTo, RunIdGenerator.TimestampOf)"

requires: [2026-10-15-4a4dd, 2026-10-25-0099a]

facts:
  - claim: "A run row carries project, pipeline, ticket id and title, status, start, finish, duration, EndKind and total cost."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/Run.cs:10-33"
  - claim: "A run id starts with a UTC instant as yyyy-MM-ddTHH-mm-ss, and the period reads already use that: the month cost filters on an id prefix, the parked-run reads compare ids with string.Compare inside the query, because SQLite can neither compare nor order a DateTimeOffset. For a queued ticket head the id is minted at reservation, so the id time can precede StartedAt."
    evidence: "src/backend/AgentSmith.Application/Services/RunIdGenerator.cs:14, src/backend/AgentSmith.Application/Services/RunIdGenerator.cs:21-26, src/backend/AgentSmith.Server/Services/Tickets/TicketMonthCost.cs:9-21, src/backend/AgentSmith.Infrastructure.Persistence/Repositories/ParkedRunRepository.cs:48, src/backend/AgentSmith.Server/Services/Tickets/TicketListQuery.cs:10-28, src/backend/AgentSmith.Application/Services/Spawning/SpawnPipelineRunsUseCase.cs:77"
  - claim: "The merge time is ALREADY recorded per pull request: each host's state reader returns the merge instant as StateAt for a merged one, and the refresh stores it as PrReviewRecord.StateAtTicks. The ticket's landing is not a merge time: LandedAt is the newest StateAt over every record, closed ones included, and a by-hand landing has one too."
    evidence: "src/backend/AgentSmith.Contracts/Reviews/PrReviewState.cs:6, src/backend/AgentSmith.Infrastructure/Services/Providers/Source/GitHubPrReviewStateReader.cs:34, src/backend/AgentSmith.Infrastructure/Services/Providers/Source/GitLabMrStateReader.cs:54, src/backend/AgentSmith.Infrastructure/Services/Providers/Source/AzureReposVoteDecisions.cs:28, src/backend/AgentSmith.Server/Services/Rework/PrReviewRecordRefresh.cs:84-90, src/backend/AgentSmith.Infrastructure.Persistence/Entities/PrReviewRecord.cs:31-37, src/backend/AgentSmith.Server/Services/Rework/TicketLandingRecorder.cs:37-42"
  - claim: "Which act started an attempt is ALREADY linked to the run: one RunAttempt row per run (unique RunId) carries CauseChannel, set once when FetchTicket reads the acts; a rework act arrives as ticket_comment, pull_request or status_move. A run that dies before FetchTicket has no row."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/RunAttempt.cs:10-17, src/backend/AgentSmith.Infrastructure.Persistence/Configurations/RunAttemptConfiguration.cs:20, src/backend/AgentSmith.Contracts/Runs/AttemptChannels.cs:6-8, src/backend/AgentSmith.Application/Services/Rework/AttemptCauseReader.cs:83-91, src/backend/AgentSmith.Infrastructure.Persistence/Services/RunAttemptProjection.cs:17-21"
  - claim: "Why a run ended is EndKind (image-untrusted, preflight, bootstrap-missing, criteria-unmet, superseded), null where no producer classified it. RunStatuses names queued, waiting_for_input, success, failed and shortfall; running and cancelled are literals."
    evidence: "src/backend/AgentSmith.Contracts/Runs/RunEndKinds.cs:7-23, src/backend/AgentSmith.Contracts/Runs/RunStatuses.cs:11-21, src/backend/AgentSmith.Server/Services/Rework/WaitingRunCloser.cs:18-26, src/backend/AgentSmith.Server/Services/Tickets/TicketBucketRule.cs:27"
  - claim: "The ticket list composes every ticket's bucket (needs_you, working, closed, waiting_on_review, done, stuck, pr_closed, failed, idle) from its newest attempt, live state, PR records, standings and close marks in TicketListReader.AllAsync(scope), and hands back the PR records it read, keyed by (project, ticket id)."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/TicketListReader.cs:42-56, src/backend/AgentSmith.Server/Services/Tickets/TicketListAll.cs:10-16, src/backend/AgentSmith.Server/Services/Tickets/TicketBucketRule.cs:29-48, src/backend/AgentSmith.Server/Services/Tickets/TicketPullRequestReader.cs:25-30, src/backend/AgentSmith.Contracts/Reviews/PrReviewRecordView.cs:10-22"
  - claim: "A run's specs are RunSpec rows (goal as Title, status not_started/in_progress/done/failed, ordinal); its repositories are RunRepo rows with a change count."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/RunSpec.cs:21-28, src/backend/AgentSmith.Infrastructure.Persistence/Entities/RunRepo.cs:4-12"
  - claim: "The scoped aggregate pattern: the endpoint declares runs.read AcrossProjects and builds CallerProjectScope.For(user, runs.read); the repository applies Within(scope) to the runs and joins every child read to that scoped run query, so no list of ids reaches SQL."
    evidence: "src/backend/AgentSmith.Server/Extensions/CriteriaMetEndpoints.cs:18-27, src/backend/AgentSmith.Infrastructure.Persistence/Repositories/CriteriaMetRepository.cs:31-50, src/backend/AgentSmith.Server/Security/CallerProjectScope.cs:13-19"
  - claim: "ProjectScope narrows to ONE requested project; GET /api/projects answers the scope's names, or every configured key for a global holder."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Contracts/ProjectScope.cs:24-36, src/backend/AgentSmith.Server/Extensions/ProjectListEndpoints.cs:22-26"
  - claim: "RelationalPersistenceExtensions is ratcheted at 223 lines and registers the Criteria met repository on line 167; DashboardApiExtensions (96 lines) adds the ticket readers on line 52; ServerEndpointExtensions (75 lines) maps Criteria met on line 59, inside the dashboard API."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:36, src/backend/AgentSmith.Server/Extensions/RelationalPersistenceExtensions.cs:167, src/backend/AgentSmith.Server/Extensions/DashboardApiExtensions.cs:52, src/backend/AgentSmith.Server/Extensions/ServerEndpointExtensions.cs:59, observed: 2026-10-25, wc -l DashboardApiExtensions.cs 96, ServerEndpointExtensions.cs 75"
  - claim: "The route golden lists the run-read lists as runs.read across; a booted fixture with an alpha-only caller and admins exists, on the system clock, and its existing seeds use non-canonical run ids."
    evidence: "tests/AgentSmith.Tests/Server/route-permission-baseline.tsv:49-54, tests/AgentSmith.Tests/Server/Auth/ProjectScopeListTests.cs:17-41, tests/AgentSmith.Tests/TestSupport/ProjectScopeRows.cs:13-14"
  - claim: "A query shape is proven on SQL Server without a server by ToQueryString over a UseSqlServer context."
    evidence: "tests/AgentSmith.Tests/Persistence/MoneyPrecisionPersistenceTests.cs:133-140, tests/AgentSmith.Tests/Persistence/Scope/ProjectScopeTests.cs:51-58"

assumptions:
  - "Every run row written since p0156 has a canonical id; older ids do not sort by time and fall outside every window."

scope:
  in: >
    ENDPOINT: DeliveryEndpoints maps GET /api/delivery?period=day|week|month(&project=…)* under runs.read with
    InProject(ProjectFrom.AcrossProjects); an unknown period is 400; no period is week. The handler takes
    CallerProjectScope, TicketProjects, DeliveryWindowFactory and DeliveryReader. Scope =
    For(user, runs.read).NarrowedTo(projects); ProjectScope.NarrowedTo(names) is the union of Narrowed(name) over the
    names (empty keeps the scope, one name stays Single). Chips = the unnarrowed scope's Only, else every configured
    key, in ConfigNames order. ServerEndpointExtensions maps it beside Criteria met (75 -> at most 76); the route
    golden gains GET /api/delivery runs.read across.
    WINDOW: rolling and UTC — day = the last 24 h in 24 one-hour slots, week = the last 7 days in 7 one-day slots,
    month = the last 30 days in 30 one-day slots; the previous period is the same span before it.
    RunIdGenerator.TimestampOf(DateTimeOffset) (used by Generate) gives the id key of an instant.
    READS (Infrastructure.Persistence, IUnitOfWork, scoped, both registered on RelationalPersistenceExtensions line
    167 in place): DeliveryRunWindow.InWindow(this IQueryable<Run>, scope, fromId, toId) — code pipeline, ticket set,
    string.Compare on Id, Within(scope). DeliveryAttemptRepository reads the previous-plus-current window, newest
    first, Take(ceiling + 1) with ceiling 5000, light columns plus RunAttempt.CauseChannel through a left join;
    truncated when the ceiling bit. DeliveryWorkRepository reads RunSpec (title, status, ordinal) and the names of
    RunRepo rows with ChangeCount > 0, each joined to the window from the OLDEST KEPT attempt's id, so the children
    match the capped attempts.
    OUTCOMES: TicketListReader.AllAsync(scope) gives each ticket's bucket and its PR records — the ticket outcome IS
    that bucket, so a row never disagrees with the Tickets page it opens. An attempt's outcome: running (running),
    queued (queued), waiting (waiting_for_input), delivered (success), shortfall (shortfall, or EndKind
    criteria-unmet), cancelled (cancelled, or EndKind superseded), failed (the rest); its cause: EndKind, else the
    status word, null while running, queued or waiting. A rework attempt has CauseChannel ticket_comment,
    pull_request or status_move. DeliveryAttemptOutcome is an injected instance.
    COMPOSE (Server/Services/Delivery, transient, AddDeliveryReads called from DashboardApiExtensions, 96 -> at
    most 97): a ticket in a span (period or slot) = the attempts of one (project, ticket) that started in it; its
    merge = the earliest merged PR record's StateAt at or after its first attempt's start and at or before the span's
    end. Figures per span: tickets worked, attempts, merged, merge rate, median time to merge (merge minus first
    start), rework rounds per ticket, spend, cost per merged ticket, agent seconds (DurationSeconds, else finish minus
    start for a finished attempt, else now minus start while running; a queued or waiting attempt adds none); a
    ratio, median or cost over a zero denominator is null. The answer: period, from, to, projects (chips), current,
    previous, slots (figures per slot), end causes (finished attempts of the period, most first), by project
    (tickets, merged, rate, cost per merged, median attempt seconds), tickets (newest activity first: title, bucket,
    merged at, attempts with run id, start, finish, seconds, outcome, cause, rework, cost and specs done/total, the
    newest attempt's spec titles and changed repos, agent and wall seconds, cost, last activity) and truncated.
    Every new file at most 120 lines, methods at most 20.
  out: >
    The dashboard page — 2026-10-25-0099c. A PR merge time column, a RunId on the rework nudge and a stored ticket
    outcome: each already exists (facts 3, 4 and 6). LandedTicket as a merge source (fact 3). Calendar periods and
    time zones other than UTC. Non-code pipelines and ticketless runs. A cache: the read runs per request, as the
    ticket list does.

decisions:
  - key: "NO NEW COLUMN. The suggested MergedAt and nudge RunId exist as PrReviewRecord.StateAtTicks and RunAttempt.CauseChannel; adding them would be two copies that can disagree, and a migration for nothing."
  - key: "THE OUTCOME IS THE TICKET LIST'S BUCKET. A second outcome rule disagreed with TicketBucketRule in four cases the reviewer named (failed head with an open PR, one PR merged and one open, by-hand landing, close mark); reading AllAsync costs one ticket-list read per request and removes the disagreement."
  - key: "AN ATTEMPT BELONGS TO THE PERIOD OF ITS ID TIME. The id is comparable in SQL on every provider; a finish time is a DateTimeOffset SQLite cannot compare. A run whose id falls before the window shows in the earlier period, and a queued head's id time is its reservation."
  - key: "ROLLING WINDOWS ENDING NOW. The mock's axis ends at now and compares with the span before; calendar periods would show an almost empty day each morning."
  - key: "MERGED MEANS A MERGE INSIDE THE SPAN AFTER THE FIRST ATTEMPT. Of the tickets worked in a span, how many got merged by its end — so a closed week's figures do not move later, and merge rate and cost per merged share one denominator."
  - key: "MERGE TIMES FROM PR RECORDS ONLY. LandedAt can be a close time or a by-hand mark; the merged record's StateAt is the host's merge instant. A record lives as long as its newest run, longer than any window."
  - key: "REWORK IS THE THREE PERSON ACTS. ticket_comment, pull_request and status_move are the rework acts of 2026-10-08; retry repeats unchanged work, operator and overrule approve a cut, so they are not rounds of rework."
  - key: "SCOPE ON THE RUNS, JOIN THE REST. Specs and repos are read by joining the scoped run window, so no row of another project can be read; PR records come through AllAsync's own scoped read."
  - key: "A TRUNCATED ANSWER SAYS SO. The ceiling drops the oldest attempts first, which are the previous period's; the answer carries truncated and the page hides the deltas then."

steps:
  - id: tests
    action: "Red first for every test below: repositories over MigratedStoreTemplate copies; the endpoint in a new booted class over ProjectScopeAuthorityFixture with [Trait(TestProcess, env-1)] and [Collection(EnvVarCollection.Name)], seeding code runs with RunIdGenerator.Generate(now - 1 h) ids and a ticket id."
  - id: reads
    action: "RunIdGenerator.TimestampOf; ProjectScope.NarrowedTo (37 -> at most 47); DeliveryRunWindow and the two repositories with their row records."
  - id: compose
    action: "Models, DeliveryWindowFactory, DeliveryAttemptOutcome, DeliveryTicketComposer, DeliveryFiguresCalculator, DeliveryProjectRows, DeliveryReader; AddDeliveryReads."
  - id: endpoint
    action: "DeliveryEndpoints; map it; regenerate route-permission-baseline.tsv and read the diff; RoutePermissionGuardTests pins it."
  - id: verify
    action: "dotnet build; run the Delivery, ProjectScope, RunIdGenerator, RoutePermissionGuard, FileLengthRatchet and architecture rule classes."

tests:
  - "RunIdGenerator_TimestampOf_IsTheIdPrefix"
  - "ProjectScope_NarrowedTo_UnionOfAdmittedNames_UnknownReadsAsNone"
  - "DeliveryWindowFactory_EachPeriod_HasItsSpanSlotsAndPrevious"
  - "DeliveryWindowFactory_UnknownPeriod_IsNull"
  - "DeliveryAttempts_Window_ReadsOnlyCodeTicketRunsWhoseIdFallsInIt"
  - "DeliveryAttempts_ScopedCaller_SeesOnlyTheirProjectsBeforeTheCeiling"
  - "DeliveryAttempts_CarryTheirCauseChannel_AndNoneWithoutAnAttemptRow"
  - "DeliveryAttempts_SqlServer_TranslatesTheWindowAndTheLeftJoin (ToQueryString)"
  - "DeliveryWork_SpecsAndChangedRepos_OfWindowRunsOnly"
  - "DeliveryAttemptOutcome_StatusAndEndKind_MapToOutcomeAndCause"
  - "DeliveryTicketComposer_MergeIsTheEarliestInsideTheSpanAfterTheFirstAttempt"
  - "DeliveryTicketComposer_Bucket_IsTheTicketListsBucket"
  - "DeliveryFigures_RatesMedianReworkAndCost_NullOnEmptyDenominator"
  - "DeliveryFigures_AgentSeconds_SkipQueuedAndWaiting"
  - "DeliveryReader_PreviousPeriodAndSlots_AreComputedApart"
  - "Delivery_BootedScopedCaller_SeesNoTicketCountOrProjectOfAnotherProject"
  - "Delivery_BootedScopedCallerAskingForAnotherProject_AnswersAsAnUnknownProject"
  - "Delivery_BootedGlobalHolder_SeesEveryProject"
  - "Delivery_UnknownPeriod_Is400"
  - "RoutePermissionGuard_Delivery_NeedsRunsRead"

done:
  - "A person bound to one project opens GET /api/delivery and sees only that project's tickets, figures, end causes and project row, and only that project as a chip."
  - "Asking for a project they cannot read answers what an unknown project answers."
  - "Day, week and month each answer current and previous figures and one figure set per slot."
  - "Each ticket's outcome is the bucket the Tickets page shows for it."
  - "Median time to merge and rework rounds per ticket come from data already stored; no migration ships."
  - "Build green, full suite green, dashboard gen/test/build green."
