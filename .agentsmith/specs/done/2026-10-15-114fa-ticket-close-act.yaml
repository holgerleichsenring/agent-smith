scope:
  in: >
    STORE: ClosedTicket entity and ClosedTicketConfiguration (table ClosedTickets; Tracker, TicketKey, TicketId, Project
    and By at IndexedString; Note unbounded and nullable; ClosedPullRequestsJson default "[]"; TrackerClosed; ClosedAt;
    UNIQUE(Tracker, TicketKey); index Project), applied from TicketRecordConfigurations.Apply (26 -> 27).
    TicketClosedMark (Contracts/Tickets) and ITicketClosedMarkStore (Contracts/Services): SetAsync upserts (insert; on a
    unique violation re-read and overwrite — last writer wins; when that re-read finds no row, a Reopen deleted it
    between the two writes, and the insert is retried ONCE), ClearAsync deletes and answers whether a row went, OfAsync
    reads the named keys of one tracker connection. ClosedTicketRepository is the singleton port, registered in
    AddTicketFactStores (29 -> at most 31) and in TicketStoreHarness. Migrations AddClosedTickets in both sets; archive
    counts 51 -> 52 tables, 41 -> 42 generated keys, 104 -> 106 seeded rows. PR CLOSE: IPullRequestCloser
    (Contracts/Providers) CloseAsync(prUrl, ct), throwing on a host failure; GitHubPullRequestClose (Octokit
    PullRequest.Update with State closed), GitLabMergeRequestClose (PUT merge_requests/{iid} state_event=close,
    EnsureSuccessStatusCode), AzureReposPullRequestClose (UpdatePullRequestAsync Status Abandoned), each at most 50 lines
    and parsing the URL with its updater's existing parser; the three providers declare the interface and delegate in
    one line each (333 -> at most 336, 370 -> at most 373, 367 -> at most 370); the local provider does not.
    REASONS: TicketCloseReasons (Server/Models) Unsupported "unsupported", Refused "refused", AlreadyClosed
    "already-closed"; TicketCloseFailureReason.Of(ex) (Services/Tickets/Closing, at most 30 lines) answers
    TicketReadFailureReason.Of(ex) unless the exception carries an HTTP status other than 404, 401 and 403
    (Octokit.ApiException, HttpRequestException with a status, VssServiceResponseException), which answers refused;
    TicketReadFailureReason itself is unchanged (its two callers keep their classes).
    ACT: TicketCloseAct (Server/Services/Tickets/Closing, at most 110 lines) CloseAsync(project, ticketId, request, by)
    and ReopenAsync(project, ticketId). Close, in order: project from the live configuration (TicketProjects.Of) else
    404 "No project <name> is configured."; the ticket's code runs (head = TicketAttempts.Head over the code rows),
    else its never-run filed row, else 404 "No ticket <id> is listed in <project>."; DONE: doneAt = (TicketLanding.OfStates
    of its records' states is merged ? the newest record state time : null) ?? the stored landing's LandedAt — when
    doneAt is set and the ticket is never-run or head.StartedAt <= doneAt, 409 "<id> already counts as landed (<merged
    on|marked done by hand on> <date>); a landed ticket is done, not closed." (exactly the rule's Done arm; a ticket
    re-worked after a merge is closable); LIVE: a head running, queued or waiting_for_input answers 409 "<id> has an
    attempt running or waiting for an answer; stop it from the run controls first."; MERGED REST: with ClosePullRequests
    and any record of the ticket merged, 409 "one of <id>'s pull requests merged; closing the rest would make it land —
    mark it done by hand, or close without closing its pull requests." and nothing is closed. Then, on
    CancellationToken.None, TicketCloseHostActs (Services/Tickets/Closing, at most 100 lines): with ClosePullRequests,
    every URL NamedPullRequestReader.ByTicketAsync names for the ticket is answered once — a record in closed answers
    closed with already-closed and is not tried; every other (open, unread, unsupported, or no record yet) is closed
    through its repository's IPullRequestCloser (repository not configured or no closer: unsupported; a throw:
    TicketCloseFailureReason.Of); with CloseOnTracker, ITicketProvider.CloseTicketAsync with the resolution
    "Agent Smith — closed by <by>" plus ": <note>" when a note was given (it carries agent-smith's own marker, so no
    webhook or sweep reads it as a person's comment or a rework keyword; false: refused; a throw: its class). Until
    2026-10-15-114fe lands, the tracker close moves Jira and Azure DevOps into the connection's done status. Then
    SetAsync(mark) with ClosedAt now, By, the trimmed note (blank -> null), the URLs this act closed and whether the
    tracker closed; one Refresh nudge when any pull request closed; the activity nudge. 200 answers TicketCloseAnswer
    (the mark, one outcome per named pull request, the tracker outcome or null). A second Close overwrites the mark.
    Reopen: 404 unknown project; ClearAsync false answers 404 "<id> is not closed."; else the activity nudge and 200
    with the cleared key; pull requests and the tracker ticket are not reopened. NO AUTOMATIC START: RequirementsMetStart.HeldAsync
    holds a ticket with a close mark (logs "closed by <by>; not started", answers Finish; 83 -> at most 90) and
    DependentsWake.ReadyAsync answers false for one (81 -> at most 86) — both serve never-run tickets only, where a
    stored mark is always in force. ENDPOINTS: TicketCloseEndpoints (Server/Extensions, at most 80 lines) maps both
    POST routes with Needs(Permissions.RunsControl); By is DisplayName.Of(ctx.User) else
    SpecDialogOwnership.PrincipalOf(ctx.User); every non-200 is Results.Text with the status;
    TicketLandedByHandEndpoints returns app.MapTicketCloseEndpoints() (67 kept). route-permission-baseline.tsv gains
    both rows beside :122 and RoutePermissionGuardTests pins them.
  out: >
    The Closed bucket, the activity rule and the Failed / PR closed split — 2026-10-15-114fb. A pushed commit, a reopened
    pull request and a person's tracker close as facts — 2026-10-15-114fc. The Close dialog, Reopen button and sections
    — 2026-10-15-114fd. A per-tracker closed status for "also close on the tracker" — 2026-10-15-114fe. Reopening pull
    requests or the tracker ticket on Reopen — nobody: Reopen undoes agent-smith's mark only, the host side is the
    person's (contract default 9). Cancelling a rework nudge already queued, or a series continuation a run end
    already asked for — nobody: an attempt it starts brings the ticket back by the rule (contract default 18). A system
    event for a close — nobody (contract default 16).

decisions:
  - key: "CLOSED IS ITS OWN FACT, NOT A LANDING. The operator's rule: 'I won't continue' is not delivered. The mark lives in its own table so UnmetTicketRequirements, which reads only LandedTickets, keeps every dependent waiting without a line changed."
  - key: "THE MARK IS UPSERTED, THE LANDING IS NOT. A landing is permanent (written once); a close is a timestamped decision a person may take again after the ticket came back, so the newest decision overwrites, and Reopen deletes. A Reopen landing between the insert and the re-read retries the insert once, so the person's latest Close is never lost to a throw."
  - key: "REFUSE EXACTLY WHEN THE RULE SAYS DONE (contract default 3, amended). Refusing on any stored landing would refuse a ticket the list shows as Failed after a re-work, and checking only the stored landing would accept one whose records read merged before the landing row exists; the act therefore asks the Done arm's own question."
  - key: "A CLOSE NEVER TURNS INTO A LANDING. With one pull request merged, closing the others makes every record ended with one merged, which the refresh writes as a Merged landing and which wakes the dependents; that request is refused with 409 instead (contract default 19)."
  - key: "EVERY NAMED PULL REQUEST IS ANSWERED. The records alone miss an unread one still open on the host and one the refresh has not recorded yet; the act reads the URLs the runs named, as the refresh does, and the answer names each, so the person never believes a pull request closed that was skipped."
  - key: "A REFUSING HOST IS NOT UNREACHABLE. A host status other than 404/401/403 is the host declining the close (completed, locked, already merged); it answers refused. The ticket-read classifier keeps its classes for its own callers."
  - key: "HOST ACTS FIRST, THE MARK ALWAYS (contract default 6, pending ratification). The mark records what actually closed, so it is written after the host calls; a refused host call does not undo the person's decision to stop, and the answer names every failure by class."
  - key: "A CLOSED TICKET IS NEVER STARTED AUTOMATICALLY. A Blocked filing a person closed would otherwise be tagged, moved and spawned the moment its requirement landed; the requirements-met start and its 24-hour recovery both hold it. A queued nudge or a run end's series continuation is not cancelled: what it starts is a new attempt, which by the operator's rule brings the ticket back."
  - key: "THE RESOLUTION CARRIES OUR MARKER. 'Agent Smith — closed by …' is recognised as agent-smith's own comment by every comment webhook and the between-attempts observer, so a note that happens to contain the comment keyword never starts a rework and never counts as a person's act on the ticket."
  - key: "A PORT CAST FROM THE PROVIDER, NOT A CONTRACT MEMBER. Closing is reached like the review readers (IPrReviewStateReader), so the local provider simply lacks it and ISourceProvider, already split into partials for length, is not widened."
  - key: "ITS OWN CLASS PER HOST, AND THE HOST ACTS OUT OF THE ACT. GitHubPullRequestUpdater is at 120 lines; three small close classes keep every updater untouched, and TicketCloseHostActs keeps TicketCloseAct's refusals and mark within 110 lines."

steps:
  - id: store
    action: "ClosedTicket entity, ClosedTicketConfiguration (each at most 50 lines) applied from TicketRecordConfigurations (26 -> 27); TicketClosedMark, ITicketClosedMarkStore and ClosedTicketRepository (at most 90 lines, the once-retried insert) registered in AddTicketFactStores (29 -> at most 31) and TicketStoreHarness."
  - id: migrations
    action: "`dotnet ef migrations add AddClosedTickets` in both migrations projects; read both Up/Down and confirm only the table and its two indexes."
  - id: archive-counts
    action: "DataArchiveSchemaTests.cs:63 51 -> 52 and :163 41 -> 42 (suffix `114fa: + ClosedTickets`); DataArchiveRoundTripTests.cs:33, :54 ('fifty-two'), :81 51 -> 52 and :34 104 -> 106; DataArchiveRefusalTests.cs:103 104 -> 106."
  - id: pr-closers
    action: "IPullRequestCloser; GitHubPullRequestClose, GitLabMergeRequestClose, AzureReposPullRequestClose (each at most 50 lines); the three providers declare and delegate (within the budgets above)."
  - id: reasons
    action: "TicketCloseReasons (unsupported, refused, already-closed) in Server/Models; TicketCloseFailureReason.Of (at most 30 lines) over TicketReadFailureReason.Of."
  - id: act
    action: "TicketCloseAct (at most 110 lines) with the refusal order (unknown, done-arm, live, merged rest), the mark write on CancellationToken.None, the Refresh and activity nudges, and Reopen; TicketCloseHostActs (at most 100 lines) closing every named pull request and the tracker ticket with the marked resolution; both registered beside the ticket readers."
  - id: no-auto-start
    action: "RequirementsMetStart.HeldAsync holds a ticket with a close mark (83 -> at most 90); DependentsWake.ReadyAsync answers false for one (81 -> at most 86); both take ITicketClosedMarkStore."
  - id: endpoints
    action: "TicketCloseRequest, TicketCloseAnswer and the two outcome records (Server/Models); TicketCloseEndpoints with both routes under runs.control (at most 80 lines); TicketLandedByHandEndpoints chains it (67 kept); route-permission-baseline.tsv and RoutePermissionGuardTests gain both rows."
  - id: tests
    action: "Red first, then green, for every test below; the composition test carries a TestProcess env trait with EnvVarCollection; run the Tickets, Rework, Persistence, Providers and Server route classes touched with --filter."

