done:
  - "A person holding runs.control closes a ticket with or without a note; the mark records who, when and why, and nothing on the host changes unless they chose it."
  - "Choosing 'also close its pull requests' closes every pull request the ticket's runs named that is still open on GitHub, GitLab or Azure Repos and names each one in the answer; choosing 'also close the ticket' closes it on the tracker; a host that refuses is named by a reason class, and the mark is stored anyway."
  - "Closing a ticket the list shows as Done, one with a live attempt, or (with 'also close its pull requests') one whose pull request merged answers 409 with a sentence saying what to do instead; an unknown project or ticket answers 404; a person without runs.control is refused."
  - "A closed ticket whose requirements land is not started; Reopen clears the mark; a ticket that is not closed answers 404 with a sentence."
  - "`agentsmith database migrate` creates ClosedTickets on every provider, and a data archive export then import carries it."
  - "Build green, full suite green, dashboard gen/test/build green."
