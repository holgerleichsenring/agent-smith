done:
  - given: "the shortfall run of the operator's report (spec A done, spec B failed with a verdict, one PR open, ticket in review)"
    when: "Now renders it"
    then: "its row reads '1 of 2 specs delivered' in red, then 'B: <verdict's first sentence> → Review the pull request; Retry unchanged gives B another attempt.', and no element that states the run's or a spec's outcome is amber or says 'reported'"
  - given: "the same run"
    when: "the run page renders it"
    then: "the head's state word and How it ended's first line carry the same head and colour, and the spec section meta carries no verdict"
  - given: "a run whose master's report holds a GFM table"
    when: "the check section, the Acceptance tab or VerifySummary renders it"
    then: "the report is closed under 'Master's report'; opened, the table's cells carry a border, padding, the sans face and break-word, inside a wrapper that scrolls sideways"
  - "No string the dashboard itself writes says finish_spec or 'reported' as a state; server-written verdicts are shown as written."
  - "cd src/dashboard && pnpm test and pnpm build green."
