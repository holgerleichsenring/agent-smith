# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-31dcb
goal: "The server lists every series run a person may see and answers one with its tickets' order, repos, pull requests with CI per repo, and merge order."

applies_to: "default (ISeriesRunStore, new SeriesRun overview/detail readers, GET /api/series-runs endpoints, dashboard types and client)"

requires: [2026-11-17-0207a, 2026-11-17-0207e, 2026-11-23-31dca]

invariant: "The series page reads one model; nothing the page shows is derived in the browser from separate reads."

facts:
  - claim: "A series run is stored per conversation; the store offers only active series and per-conversation or per-ticket lookups, no list of all."
    evidence: "src/backend/AgentSmith.Contracts/Series/ISeriesRunStore.cs:7-27"
  - claim: "Today a series run is read only through its conversation's thread."
    evidence: "src/backend/AgentSmith.Server/Services/Series/SeriesRunViewReader.cs:15-19"
  - claim: "The ticket facts hold one CI state per ticket and a flat pull request list without repo."
    evidence: "src/backend/AgentSmith.Contracts/Series/SeriesTicketFact.cs:36-41"
  - claim: "Per-pull-request CI lives on the PR review records, readable per ticket and per project."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/PrReviewRecordRepository.cs:15-20"
  - claim: "'Series' already names a ticket's spec series in the API."
    evidence: "src/backend/AgentSmith.Server/Extensions/TicketSeriesEndpoints.cs:14"
  - claim: "The model-wait clock uses the scoped unit of work, so reads on one scope must not run side by side."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/ModelRunWaitClock.cs:11"

scope:
  in: >-
    Types and routes are named SeriesRun to stay apart from a ticket's spec series. ISeriesRunStore.ListAsync(projects)
    returns every series run of the given projects, active and ended, newest activity first. GET /api/series-runs
    (project filter; per row: id, name from the conversation, project, state, counts landed / pull requests waiting /
    not started, the next merge) reads set-based: one store read, one requirement read, one landing read, one PR record
    read per project (no per-ticket loop, no Task.WhenAll on one scope). GET /api/series-runs/count answers the active
    count for the sidebar from ActiveAsync. GET /api/series-runs/{id} resolves the project from the record
    (ProjectFrom.SeriesRun, refusing a caller without that project with 404) and answers tickets with depth (longest
    requires path), repos, per-repo pull requests with CI state, failing check and log link from the PR review
    records, landed, newest status; and the merge order: open pull requests in depth order, 'ready' only where every
    requirement landed and the pull request targets the default branch, otherwise what it waits for.
  out: "Holds (31dcg adds them to the same detail); any page; acts."

steps:
  - id: store
    action: "ISeriesRunStore.ListAsync and its EF implementation with a test on both providers."
  - id: order
    action: "SeriesRunOrder in Application: depth and merge order, unit-tested."
  - id: read
    action: "SeriesRunOverviewReader and SeriesRunDetailReader, set-based."
  - id: api
    action: "The three endpoints with Needs(...) like the ticket list; ProjectFrom.SeriesRun; TypeScript mirror and client."

tests:
  - "Depth: a chain, a diamond, a ticket without requires (0)."
  - "Merge order: only the lowest open pull request whose requirements landed and that targets the default branch is ready; others say 'after #x' or 'retarget pending'."
  - "Two repos of one ticket carry their own CI state."
  - "A caller without the project: absent from the list, 404 on the detail."
  - "The list over 25 tickets issues a fixed number of queries (counted on the test context)."

done:
  - "Build, the full suite and the dashboard tests green; the tests above in SeriesRunOrder, reader and endpoint test classes."
