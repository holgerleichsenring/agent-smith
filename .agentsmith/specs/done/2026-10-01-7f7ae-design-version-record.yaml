# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-01-7f7ae
goal: "Each design_read in a run is recorded as an event with file key, node and version, and a read given the version a ticket cites says whether the design moved since."

applies_to: "backend (an event contract, the tool host), dashboard (the event mirror and filters)"

requires: ["2026-10-01-7f7ab"]

facts:
  - claim: "Tool tracing records arguments and timing, never results, so a version read from a response is recorded nowhere today."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/TracingAIFunction.cs:21-44"
  - claim: "A run event is a record over RunEvent with an EventType value and a resolver entry, each covered by tests."
    evidence: "src/backend/AgentSmith.Contracts/Events/TicketInstructionIgnoredEvent.cs:9-14; src/backend/AgentSmith.Contracts/Events/EventType.cs:39; src/backend/AgentSmith.Infrastructure/Services/Events/EventTypeResolver.cs:37; tests/AgentSmith.Tests/Events/EventTypeResolverCoverageTests.cs; tests/AgentSmith.Tests/Events/EventEnvelopeRoundTripTests.cs"
  - claim: "The dashboard mirrors each event in hub-events.ts — an enum value, an interface and a RunEvent union member, checked by gen:hub-events — and names every EventType in two total maps."
    evidence: "src/dashboard/src/types/hub-events.ts:27,310-311,526; src/dashboard/src/components/jobs/FilterRail.tsx:8,30; src/dashboard/src/lib/eventFilterQuery.ts:40,69-71"
  - claim: "The master handler already holds the event publisher; the run id is read from the pipeline, and a design turn has none of its own — composition falls back to the literal 'run'."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:54; src/backend/AgentSmith.Contracts/Events/IEventPublisher.cs:12; src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:88"
  - claim: "PROVEN ONLY AGAINST THE DOCUMENTED CONTRACT: every file and nodes response carries version and lastModified; a nodes read accepts ?version= to read a past version."
    evidence: "Figma REST API documentation (developers.figma.com); no live token exists in this repository"

scope:
  in: >
    DesignReadEvent(RunId, Source, FileKey, NodeId, Version, LastModified, Timestamp). The factory that
    builds DesignReadToolHost hands it the handler's IEventPublisher and the run id read from
    ContextKeys.RunId; with no run id (a design turn) it hands none and nothing is published — the
    version travels in the ticket text the master writes (2026-10-01-7f7af). design_read gains
    expected_version: when it differs, the summary opens 'design moved: <expected> -> <current>
    (lastModified)' and reads the current version; read_version reads the cited one when asked. Dashboard:
    hub-events mirror, FilterRail label, eventFilterQuery key.
  out: >
    A typed design-version field on the approved set or the filed ticket — the ticket text carries link and
    version (operator ruling). A timeline row renderer for the event.

decisions:
  - key: "THE TICKET CARRIES THE VERSION, THE RUN RECORDS WHAT IT READ. Dialog and run share no storage; the ticket is the one thing both see."
  - key: "MOVED IS REPORTED, NOT RESOLVED. Whether to build the cited or the current design is the reader's call; the tool states both."

steps:
  - id: event
    action: "DesignReadEvent, EventType value, resolver entry; hub-events mirror via gen:hub-events; FilterRail and eventFilterQuery entries."
  - id: host
    action: "Factory passes publisher and run id; host publishes on success; expected_version and read_version."

tests:
  - "DesignRead_InARun_PublishesDesignReadEventWithVersion"
  - "DesignRead_InADesignTurn_PublishesNothing"
  - "DesignRead_ExpectedVersionDiffers_OpensWithDesignMoved"
  - "DesignRead_ReadVersion_PassesVersionQuery (fake handler)"
  - "EventTypeResolverCoverageTests and EventEnvelopeRoundTripTests cover DesignReadEvent"
  - "dashboard: gen:hub-events passes; the filter rail lists DesignRead"

done:
  - "a run's events show which design version it read"
  - "build green, full suite green, dashboard tests and build green"
