# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-28-ebb0
goal: "PostgreSQL gets its own migration set, a live-database test and a server plus dashboard proven to run on it, so provider: postgresql actually works."

applies_to: "default (Persistence, Persistence.Postgresql migrations, Server, CLI)"

requires:
  - p0346

scope:
  in: "Dedicated Postgres migrations assembly, UseNpgsql wiring to it, archive identity advance for Postgres, opt-in live tests, CLI/Server/Dockerfile references, config docs."
  out: "MySQL, which still runs on the SQLite-typed shared set; a follow-up spec of its own if anyone runs it."

decisions:
  - key: |
      THE SHARED SET CANNOT SERVE POSTGRES. It was generated under SQLite: bool is INTEGER,
      DateTimeOffset is TEXT, keys carry Sqlite:Autoincrement, which Npgsql ignores, so no key
      is generated. Same root cause as p0346, same answer: a set generated under the provider.
  - key: |
      ONE BASELINE, NAMED AFTER THE HEAD IT REPRODUCES. No Postgres database was ever migrated
      by a working set, so there is no history to replay. The baseline carries the current head's
      name (AddMemoryEvidence) because ArchiveSchemaCheck compares head NAMES across providers;
      an "Initial" would refuse every SQLite-to-Postgres archive until the next migration.
  - key: |
      IDENTITY BY DEFAULT TAKES COPIED KEYS. Npgsql's default identity strategy accepts explicit
      values, so the archive needs no insert switch; it only has to move the sequence past the
      copied keys (setval over pg_get_serial_sequence).
  - key: |
      POSTGRES HOLDS AN INSTANT, NOT AN OFFSET, AND NO NUL. Npgsql refuses a non-zero offset for
      timestamptz and text refuses \0. Both are fixed once, for this provider only: a UTC converter
      over every DateTimeOffset column, a NUL scrub over string parameters. The archive is lossy
      exactly there: UTC, microseconds, U+FFFD.

steps:
  - id: migrations-assembly
    action: "AgentSmith.Infrastructure.Persistence.Postgresql (Npgsql + Design 9.x), provider-fixed design-time factory, baseline migration generated by the pinned dotnet-ef 9.0.17; added to the solution and both Dockerfiles."
  - id: wiring
    action: "UseProvider: UseNpgsql(conn, o => o.MigrationsAssembly(...)); CLI and Server reference the assembly; the ReferenceFiles identity seed applies to Postgres too."
  - id: provider-semantics
    action: "UtcTimestampConfiguration (Npgsql only, applied last) and PostgresNulTextInterceptor (registered by UseProvider); the CLI keeps the pending-model-changes guard on for Postgres."
  - id: archive
    action: "IdentitySequenceAdvancer advances the Postgres identity sequence; IdentityInsertSwitch stays SQL Server only."
  - id: live-tests
    action: "RequiresPostgresFact (AGENTSMITH_TEST_PG_CONNSTR, skipped with a reason otherwise) + ScratchPostgres; migrate + SQLite-to-Postgres archive round trip over FullStoreSeed (every table) + next-row-gets-a-key."
  - id: offline-tests
    action: "The Postgres set has no pending model changes; UseProvider targets the dedicated assembly; three-way head-name alignment."
  - id: live-system
    action: "Throwaway Postgres container, `agentsmith database migrate`, host server on it, dashboard renders the runs list and a run read from Postgres."

tests:
  - "ProviderWiringTests: Postgresql targets AgentSmith.Infrastructure.Persistence.Postgresql"
  - "PostgresqlMigrationSet_HasNoPendingModelChanges"
  - "DataArchiveSchemaTests: SQLite, SQL Server and Postgres heads compare equal"
  - "DataArchivePostgresTests.RoundTrip_SqliteToPostgres_RestoresEveryRow (live, opt-in)"
  - "PostgresStoreTests: local offset, NUL, money fraction (live, opt-in)"
  - "PostgresProviderModelTests: converter on Postgres only, NUL scrub registered and correct"

done:
  - "A fresh Postgres 17 database is migrated by `agentsmith database migrate` with provider postgresql, and the live tests pass against it."
  - "The server boots on that database (persistence probe green) and the dashboard lists and opens a run stored there."
  - "Full suite and dashboard tests green; SQLite and SQL Server sets untouched."
