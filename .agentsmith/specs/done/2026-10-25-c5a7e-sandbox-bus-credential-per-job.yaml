# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-25-c5a7e
goal: "Each sandbox reaches Redis as its own ACL user limited to its job's keys, so a command that reads the agent's credential cannot read, forge or wait on another job's steps."

applies_to: "default (sandbox factories, KubernetesSandbox, DockerSandbox, reapers, Redis startup findings) and deploy"

requires: ["2026-09-28-2ac3", "2026-10-25-c5a7a", "2026-10-25-c5a7b", "2026-10-25-c5a7c"]

facts:
  - claim: "Every sandbox is handed the server's own Redis URL."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/KubernetesSandboxFactory.cs:26, src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxFactory.cs:134-135, src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs:119-126, src/backend/AgentSmith.Server/Services/Sandbox/DockerContainerSpecBuilder.cs:79-83"
  - claim: "35b2 hid REDIS_URL from a step's env, not from /proc of the agent, which runs as the same user."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/AgentProcessEnvironment.cs:5-16"
  - claim: "A job's steps carry its repository token in Step.Env and travel through sandbox:{job}:in, so the shared credential reaches other projects' tokens and can push steps into their sandboxes."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CheckoutStepFactory.cs:40, src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:19-22, src/backend/AgentSmith.Server/Services/Sandbox/SandboxRedisChannel.cs:63"
  - claim: "The agent touches only sandbox:{job}:in (RPOP), :results (LPUSH, EXPIRE), :events (XADD, EXPIRE), :heartbeat (SET, DEL) and reads agentsmith:runs:active (SISMEMBER)."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/RedisKeys.cs:7-34, src/backend/AgentSmith.Sandbox.Agent/Services/RedisJobBus.cs:44-72, src/backend/AgentSmith.Sandbox.Agent/Services/RedisEventChannel.cs:85-95, src/backend/AgentSmith.Sandbox.Agent/Services/HeartbeatLoop.cs:59-76"
  - claim: "The agent parses its URL with ConfigurationOptions.Parse, so user= and password= work with every pinned agent."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/RedisJobBus.cs:29-34"
  - claim: "The reference Redis is redis:7-alpine without requirepass; ACL users protect nothing while the default user needs no password."
    evidence: "deploy/k8s/6-deployment-redis.yaml:22-29, deploy/docker-compose.example.yml:98"
  - claim: "Both sandboxes tear down through ForceRemoveAsync; the reapers remove sandboxes knowing the job id (Docker label, pod label pipeline-id)."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/KubernetesSandbox.cs:49-67, src/backend/AgentSmith.Server/Services/Sandbox/DockerSandbox.cs:66-73, src/backend/AgentSmith.Server/Services/Sandbox/SandboxOrphanReaper.cs:62, src/backend/AgentSmith.Server/Services/Sandbox/SandboxPodLabels.cs:34-39"
  - claim: "SandboxRedisChannel is 117 of the 120 limit; the server already observes reconnects."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/SandboxRedisChannel.cs:117, src/backend/AgentSmith.Server/Services/RedisConnectionHealth.cs:26"
  - claim: "DockerSandboxRegistrations is 119 of 120 and reads its env in BuildOptions."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxRegistrations.cs:109-119"
  - claim: "The Kubernetes reference Redis keeps no data across a restart; compose's uses AOF. The agent retries its connection."
    evidence: "deploy/k8s/6-deployment-redis.yaml:28-29, deploy/docker-compose.example.yml:98, src/backend/AgentSmith.Sandbox.Agent/Services/RedisJobBus.cs:31-33"

scope:
  in: >
    Follows 2026-10-02-f35f, deciding its option (a). Option (b), a second uid for steps, needs CAP_SETUID in the
    sandbox, which 2026-10-25-c5a7a drops. At spawn the factory creates ACL user sbx-{jobId} with a random
    32-byte password: reset, on, ~sandbox:{jobId}:*, %R~agentsmith:runs:active, resetchannels, -@all, then the
    measured command set (the agent's commands above plus what StackExchange.Redis needs to connect: hello or
    auth, client setname/setinfo, ping, echo). The sandbox URL (Kubernetes: SANDBOX_REDIS_URL from 2026-10-25-c5a7c, else
    REDIS_URL; Docker: REDIS_URL) gets user, password, tiebreaker= and configChannel= so the client asks for nothing the ACL
    denies. The credential is an IAsyncDisposable the sandbox holds and disposes after its channel (ACL
    DELUSER); both reapers delete the user of a job they reap. On ConnectionRestored the owner re-issues
    SETUSER for its live sandboxes (ACL users are not in the AOF); the agent keeps retrying its connection, so
    it authenticates on the first retry after the re-issue. That keeps compose's AOF Redis surviving a restart as
    today; the Kubernetes reference Redis loses every key on restart already, which this spec does not change. SANDBOX_BUS_CREDENTIAL=per-job (default) or
    shared (today's), read once in SandboxBusCredentialRegistrations for both backends
    (DockerSandboxRegistrations is 119 of 120). Per-job against a Redis refusing ACL SETUSER falls back to the shared
    credential with an advisory finding naming the variable (operator decision, 2026-10-25); a default
    user flagged nopass is a startup warning finding that per-job users protect nothing. Reference deploy:
    6-deployment-redis.yaml and compose require a password through 2ac3's guarded start, probes use
    REDISCLI_AUTH.
  out: >
    The HTTP transport (2026-09-28-2f8c), which removes Redis from the sandbox and makes this spec obsolete when it
    ships. Leaked users of a crashed server: they reach only a dead job's keys, which expire within a day
    (RedisKeys.JobKeyTtl); no sweep. Managed Redis that only manages ACLs through its own API: runs with shared,
    named in the docs.

decisions:
  - key: "MEASURED, NOT GUESSED. The command list is pinned by a docker-tier test that runs the real agent against redis:7 under the ACL; a command the client needs and the list lacks fails that test."
  - key: "FALL BACK VISIBLY (operator decision, 2026-10-25). A Redis without ACL rights hands sandboxes the shared URL with an advisory finding naming SANDBOX_BUS_CREDENTIAL, so a managed Redis keeps running; a silent fallback is what is ruled out."
  - key: "BUILT NOW (operator decision, 2026-10-25). The shared credential lets a sandbox forge steps into other projects' sandboxes and read their git tokens, so the interim ACL ships before 2f8c."
  - key: "DOCKER-TIER PROOFS ARE NOT GATED. The measured ACL test runs by hand before the spec commit and its output is recorded in the decisions file."

steps:
  - id: credential
    action: "SandboxBusCredentials: create, URL composition, delete, re-issue on reconnect; SANDBOX_BUS_CREDENTIAL read in both registrations."
  - id: wire
    action: "Both factories hand the per-job URL; KubernetesSandbox and DockerSandbox dispose the credential; DockerSandboxRemover and KubernetesSandboxCorpseReaper delete the user."
  - id: findings
    action: "Startup: nopass default user warning; ACL refusal message."
  - id: deploy
    action: "Redis password required in k8s and compose reference files; docs."

tests:
  - "SandboxBusCredentials_Url_CarriesUserPasswordAndBlankTiebreakerAndConfigChannel"
  - "SandboxBusCredentials_SetUser_ScopesToTheJobPatternAndActiveRunsReadOnly"
  - "SandboxBusCredentials_AclRefused_FallsBackToSharedWithAFindingNamingTheVariable"
  - "SandboxBusCredentials_Shared_HandsTheServerUrl"
  - "KubernetesSandbox_ForceRemove_DeletesTheUser"
  - "DockerSandboxRemover_Reap_DeletesTheUser"
  - "SandboxBusCredentials_ConnectionRestored_ReissuesLiveUsers"
  - "KubernetesSandboxCorpseReaper_Reap_DeletesTheUserFromThePipelineIdLabel"
  - "SandboxBusCredentialModeReader_ReadsBusCredential"
  - "Docker tier: the agent runs a step under its ACL user; RPOP on another job's key returns NOPERM"

done:
  - "inside a sandbox, redis-cli with the agent's URL cannot read or write another job's keys"
  - "runs complete on Kubernetes and compose with per-job users; on compose a Redis restart mid-run is survived as today"
  - "build green, full suite green"
