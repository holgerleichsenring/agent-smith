# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-06-03c7d
goal: "A series lies as specs/planned/{id}-{label}.* plus one manifest at series/{base}.yaml, found by its ticket key — in place of specs/<ticket>/ with set.yaml and accounting.md."

applies_to: "server (spec set files, reader, writer, filing branch, source scan)"

requires:
  - 2026-10-06-03c7c

facts:
  - claim: "A set's files are set.yaml, stem yaml, stem md and accounting.md under specs/<key>/, rendered by one class for runs and filing"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetFiles.cs:23-40; src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:91-92"
  - claim: "set.yaml carries stems, executed ids, revisions, accounting, discarded contexts, handback, fingerprint, pinned-whole and approval; its source is never read"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetIndex.cs:28-56; src/backend/AgentSmith.Application/Services/Specs/SpecSetReader.cs:75"
  - claim: "The writer sweeps the set's directory for stale files and force-stages it; the reader takes the last commit on that directory"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetWriter.cs:54-65,86-96; src/backend/AgentSmith.Application/Services/Specs/SpecSetReader.cs:46-69"
  - claim: "ForceStage fails on an unmatched pathspec; removal is git rm with --ignore-unmatch"
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:52-66,286-287"
  - claim: "Mocks are matched to a spec by id prefix in the set's directory"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecPhaseMocks.cs:16-24"
  - claim: "A fenced YAML block in the ticket description is a spec source"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/PhaseSpecFromTicket.cs:32-49; src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:62-95"
  - claim: "Security scans skip .agentsmith/specs/"
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/SourceFileEnumerator.cs:29-32"
  - claim: "Message texts name the set's directory"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/ApprovedSetKept.cs:63; src/backend/AgentSmith.Application/Services/Specs/MissingSpecReason.cs:46-47; src/backend/AgentSmith.Application/Services/Specs/SpecPrBody.cs:24; src/backend/AgentSmith.Application/Services/Specs/SpecMarkdown.cs:39,83"

assumptions:
  - claim: "git log -1 accepts several pathspecs including a glob"
    check: "extend GetLastCommitForPathAsync to a path list and test it in a sandbox"

scope:
  in: "SeriesManifest at series/{base}.yaml replacing set.yaml and accounting.md (ticket key, goal, ordered spec ids, revisions, accounting, discarded contexts, fingerprint, pinned-whole, approval, handback, executed ids until 03c7e); SeriesPaths; the reader finds the manifest whose ticket key matches; spec files and companions in specs/planned/; stale removal by the previous manifest's ids; revision sha over the manifest and specs/*/{base}*; FiledSpecBranch through the same renderer; the ticket-description source and set.yaml's source field removed; series/ excluded from scans beside specs/; message texts."
  out: "Moving executed specs to done/ (03c7e)."

decisions:
  - manifest_ids_only: "The manifest lists ids, never stems; a spec's label is read off its file name."
  - find_by_ticket: "The reader lists series/ and takes the manifest naming the run's ticket key; the DB row only caches the base."
  - stale_by_id_prefix: "specs/planned/ is shared; stale = every planned file whose name starts with an id of the previous or current manifest and that is not in the current render — a relabelled id and an amendment's leftovers included. The reader refuses a series with two files for one id."
  - stage_what_exists: "Force-stage only paths written in this commit; removals via git rm."
  - ships_with_e: "03c7d and 03c7e go out in one pull request — executed state moves from the manifest to the directory between them."

steps:
  - id: manifest
    action: "SeriesManifest and its document replace SpecSetIndex and accounting.md"
  - id: paths
    action: "SeriesPaths replaces SpecSetKey's path members; renderer, reader, phase-file reader, mocks and messages follow"
  - id: git
    action: "Multi-path last-commit; stale removal by previous manifest; stage only what exists"
  - id: sources
    action: "Remove the ticket-description source and set.yaml's source; move the PhaseExecutionTests harness preset onto a spec seeded on the branch; exclude series/ from scans"

tests:
  - "SeriesManifest_RoundTrip_KeepsFingerprintPinnedAndDiscarded"
  - "SeriesReader_FindsManifestByTicketKey"
  - "SeriesWriter_DroppedSpec_RemovesOnlyItsFiles"
  - "SeriesWriter_RelabelledSpec_RemovesOldFile"
  - "SeriesWriter_AfterAmendment_RemovesLeftovers"
  - "SeriesReader_ReviewerEditsSpecFile_ShaChanges"
  - "Filing_WritesManifestAndPlannedSpecs"
  - "SourceFileEnumerator_SeriesDir_Excluded"

done:
  - "A derived run on a fresh repository leaves series/{base}.yaml and specs/planned/{base}a-*.yaml, and nothing under specs/<ticket>/"
  - "No code path reads a ticket description as a spec"
  - "Full suite and harness green"
