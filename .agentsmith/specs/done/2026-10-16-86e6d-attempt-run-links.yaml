# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-16-86e6d
goal: "Earlier attempts collapse to one line in the state block, each opening its run, and the Specs tab's 'executed in A{n}' and attempt cells link to the run viewer."

applies_to: "dashboard (TicketStateBlock's earlier-attempts line, SpecDocument, TicketSpecsTab, one shared run-path helper)"

requires: [2026-10-16-86e6a, 2026-10-16-86e6b, 2026-10-16-86e6c]

facts:
  - claim: "SpecDocument writes 'executed in A{n}' as plain text."
    evidence: "src/dashboard/src/components/tickets/detail/SpecDocument.tsx:25, src/dashboard/src/components/tickets/detail/SpecDocument.tsx:35"
  - claim: "Each spec list item is a button holding one span cell per attempt; a link cannot sit inside the button."
    evidence: "src/dashboard/src/components/tickets/detail/TicketSpecsTab.tsx:40-52"
  - claim: "A cell's kind and title come from attemptCell over that attempt's own cut."
    evidence: "src/dashboard/src/components/tickets/detail/specWords.ts:52-79"
  - claim: "The run viewer route is /jobs/{runId}, built inline with encodeURIComponent in the attempt card."
    evidence: "src/dashboard/src/components/tickets/detail/AttemptCard.tsx:87-88, src/dashboard/src/app/jobs/[id]/page.tsx:1-3"
  - claim: "An attempt that executed no spec has executedSpecs empty or every row not_started."
    evidence: "src/dashboard/src/components/tickets/detail/attemptStory.ts:88-91, src/dashboard/src/types/tickets.ts:206-212"

scope:
  in: >
    RUN PATH: one runPath(runId) helper in lib (the encodeURIComponent form AttemptCard uses), used by every link
    below and by AttemptCard. EARLIER LINE (in the state block, below the act, only when the head has earlier
    attempts): one line "<n> earlier attempt(s)", with ", all stopped before any work" when none of them executed a
    spec, and ", A{k} superseded" for each attempt whose endKind is superseded; a "Show" disclosure lists each
    earlier attempt newest first as "A{n} · <outcome pill words>", followed by " · <end-kind words>" only when an
    end kind exists and its words differ from the pill's, with Open run.
    End-kind words: image-untrusted "image not trusted", preflight "preflight failed", bootstrap-missing "bootstrap
    missing", criteria-unmet "criterion not accepted", superseded "superseded".
    SPEC DOCUMENT: "executed in A{n}" is a link to that attempt's run (the executedBy run id). SPEC LIST: the cell
    row moves out of the item button into a sibling row under it, and each cell of an attempt that ran the spec (kind
    done, carried, fail or live) is a link to that attempt's run with the cell's title; none and recut (not started)
    cells stay spans. A wrapper (.sp-entry) holds the item button and the cell row and takes the card's border,
    background and the aria-current ring (read from the button with :has); the cell rules now under .sp-item
    .si-cells are rescoped to the moved row, giving an anchor cell the span's box; the classes .sp-item, .si-cells
    and .cell still render (mock-parity.test.tsx).
  out: >
    The state block itself — 2026-10-16-86e6c. The Attempts tab's cards are unchanged apart from runPath.

decisions:
  - key: "THE CELLS LEAVE THE BUTTON. An anchor inside a button is invalid and would also select the spec; the item keeps its button, the cells become a sibling row."
  - key: "ONE LINE FOR EARLIER ATTEMPTS. The head attempt is what the operator acts on; earlier ones are history, one disclosure away."

steps:
  - id: path
    action: "runPath helper; AttemptCard uses it."
  - id: earlier
    action: "earlier-attempts words in ticketState.ts and the line + disclosure in TicketStateBlock."
  - id: specs
    action: "SpecDocument link; TicketSpecsTab cell row as links; CSS for the moved row."
  - id: tests
    action: "Red then green; pnpm test the tickets folder; pnpm build."

tests:
  - "earlierAttempts_AllStoppedBeforeWork_SaysSo"
  - "earlierAttempts_SupersededAttempt_IsNamed"
  - "TicketStateBlock_ShowEarlier_ListsEachAttemptWithItsRunLink"
  - "SpecDocument_ExecutedIn_LinksTheRun"
  - "TicketSpecsTab_AttemptCell_LinksTheRunAndNoneOrRecutCellDoesNot"

done:
  - "Ticket 19478 reads '7 earlier attempts …, A7 superseded' in one line with each run one click away, and the Specs tab's 'executed in A8' and every attempt cell open the run viewer."
  - "Build green, full suite green, dashboard gen/test/build green."
