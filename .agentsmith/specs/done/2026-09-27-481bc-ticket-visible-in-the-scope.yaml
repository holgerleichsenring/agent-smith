# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-27-481bc
goal: "The text a conversation was grounded on is readable where its repositories already are, so what the model reads is what a person can read."

applies_to: "dashboard (the scope pane) and backend (a ticket's web address and the text a bound conversation holds)"

requires: ["2026-09-27-481ba"]

scope:
  in: "The composed text a conversation was seeded with, shown in the pane that already says what the conversation may read."
  out: "A link to the ticket on its tracker, whose seam is shut in four places — 2026-09-27-481bg. Showing the ticket read while it happens — 2026-09-27-481be. Editing the ticket, which is the amendment 2026-09-25-8e51e. A kind, which is 2026-09-27-481bf. The filed pane's reference, whose identity is a react key, a test id and a row match, so changing it is its own phase."

decisions:
  - key: |
      IT GOES IN THE SCOPE PANE, NOT A TAB OF ITS OWN. The pane is already "what the agent is
      grounded in — the project, the repositories and the templates a turn may read", and a bound
      ticket is exactly that; it is also the pane 2026-09-27-481bd is already changing. A new tab
      would be the FIFTH — proposal, scope, filed and approved exist, and the tablist was extracted
      to make room for the fourth, not for an open-ended row of them. A fifth that is empty for
      every unbound conversation teaches a person to stop looking at the row.
  - key: |
      THE MODEL READS SOMETHING THE PERSON CANNOT. The composed text is seeded into EVERY turn of a
      bound conversation — capped, stripped of our own comments, inside the untrusted-data
      delimiters — and no dashboard surface shows it. The filed pane shows a ticket's title and id,
      so it is the TEXT that is invisible, not the ticket. When an answer looks wrong the first
      question is what it read, and that question has no answer today.
  - key: |
      THE PANE SHOWS THE SEEDED TEXT AND DOES NOT RE-READ THE TRACKER. Showing a fresh read would
      answer a different question: the conversation reasons from what it was seeded with, and a
      ticket that has since changed is precisely the case where the two differ. The stored row
      already holds the composed text, whether it was capped, and when it was read, so the pane is
      a database read — opening it must not cost a tracker round trip, which is what the seeding
      path does because it also computes whether the ticket moved.

  - key: |
      A LINK TO THE TRACKER IS NOT IN THIS PHASE, AND THE REASON IS THAT EVERY SEAM FOR IT IS SHUT.
      The ticket entity carries no web address; the four field mappers are stateless by contract and
      could not reach a base url; three of the four providers are at their file-length baseline
      exactly; the composer Azure DevOps already has is internal to another assembly and takes an
      integer id; and the configured tracker does not hold what a link needs — a GitLab url and a
      Jira url may both come from secrets, so a link composed from configuration alone would send a
      self-managed GitLab to gitlab.com. A wrong link that opens is worse than no link. It is
      2026-09-27-481bg, which decides the seam rather than assuming one.

steps:
  - id: a-tracker-composes-its-own-address
    path: "src/backend/AgentSmith.Server/Services/SpecDialog"
    action:
      - "Compose a ticket's browser address from the configured tracker and the ticket id, in a stateless helper of its own, answering nothing where a tracker's shape is unknown."
      - "Reuse the Azure DevOps composer that already exists for created tickets rather than writing a second one."

  - id: the-binding-carries-it-on
    path: "src/backend/AgentSmith.Server/Services/SpecDialog"
    action: "Carry the address with the binding and with what a bound conversation answers."

  - id: the-seeded-text-is-answerable
    path: "src/backend/AgentSmith.Server"
    action:
      - "Carry the composed text a bound conversation holds — with when it was read and whether it was capped — on the view the page ALREADY reads per dialog. No new route: that view is guarded by the watch check every per-dialog read applies, and this answers content rather than an identifier."
      - "Answer it from the stored row with no tracker call; the moved-check is the only round trip on that path and must not be on this one."
      - "Take the room from the extraction 2026-09-27-481ba already makes in that file, which has four lines under the limit."

  - id: the-scope-pane-shows-the-ticket
    path: "src/dashboard/src"
    action:
      - "Draw the bound ticket at the head of the scope pane's OPEN-CONVERSATION branch: its id, its title, and the text the turn was seeded with."
      - "Leave the no-session branch alone — 2026-09-27-481bd owns it, and the two land independently."
      - "Say when it was read, and say when the cap held part of it back."
      - "Mirror the new fields by hand — the mirror has no drift check."

  - id: it-is-pinned
    path: "tests/AgentSmith.Tests, src/dashboard/src/components/dialog/__tests__"
    action: "Assert the address each tracker yields, that GitLab's is a browser route and not the escaped API path, that the pane answers from the row without a tracker call, and that an unbound conversation's pane is unchanged."

tests:
  - "BoundTicketText_ABoundConversation_AnswersTheStoredTextWithoutCallingTheTracker"
  - "SpecDialogScopePanel_ABoundConversation_ShowsTheTextItWasSeededWith"
  - "SpecDialogScopePanel_ACappedTicket_SaysPartOfItIsNotCarried"
  - "SpecDialogScopePanel_AnUnboundConversation_IsUntouchedByThisPhase"

done:
  - "no new route, no column, no migration, no mapper made stateful and no provider grown"
  - "the text the turn was seeded with is readable in the scope pane, with when it was read"
  - "a capped ticket says so where its text is shown"
  - "opening the pane costs no tracker call"
  - "the pane's no-session branch is untouched by this phase, so 2026-09-27-481bd may change it in either order"
  - "route-permission baseline regenerated, build green, full suite green, dashboard tests green"
