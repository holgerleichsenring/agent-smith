# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-057dc
goal: "The website leads with the gap Agent Smith fills: an Azure Boards work item becomes a pull request in Azure Repos, on its own page linked from the hero, and the landing page shows today's product."

applies_to: "website"

requires: ["2026-09-28-057da"]

scope:
  in: "A shared layout so the site can hold a second page, a /azure-devops page on agent-smith.org, a link to it from the hero, and the landing page's product sections brought up to what shipped."
  out: "A second domain. New screenshots that need a running demo instance. Ordering separately filed, linked work items, which the product does not do."

decisions:
  - key: |
      THE GAP IS VERIFIED, NOT REMEMBERED. Microsoft's page "Use GitHub Copilot with Azure Boards"
      (https://learn.microsoft.com/en-us/azure/devops/boards/github/work-item-integration-github-copilot,
      updated 2026-07-23) says the integration requires GitHub repositories and that Azure Repos are not
      supported, and that Copilot does not handle dependencies between work items. Copilot code review
      did reach Azure Repos in public preview
      (https://learn.microsoft.com/en-us/azure/devops/release-notes/2026/sprint-279-update), so the claim
      is about ticket-to-PR, never about review.
  - key: |
      ONE DOMAIN. A second domain splits search weight and doubles upkeep for the same product. A page
      of its own ranks for the Azure DevOps search just as well, and the rest of the site stays the
      proof that the other trackers work too. A domain earns itself when the offer differs in price or
      hosting, which it does not.
  - key: |
      THE CLAIM NAMES THE SOURCE AND ITS DATE, so a reader can check it and the day it stops being true
      is visible.
  - key: |
      WHAT ANSWERS "NO DEPENDENCIES" IS THE APPROVED SPEC SET, NOT LINKED TICKETS. An approved cut from
      the conversation files ONE work item, and one run works its ordered phases, a successor never
      starting before its predecessor verified. Parent linking exists in the Azure DevOps provider but
      has no caller since 2026-09-22-b3d7, so the page must not suggest Agent Smith orders separately
      filed work items.
  - key: |
      index.njk IS ONE MONOLITHIC PAGE WITH RELATIVE ASSETS AND PAGE-LOCAL ANCHORS. A second page at
      /azure-devops/ would break every asset and nav link, so the head, nav and footer move into a
      layout with root-absolute paths first.

steps:
  - id: layout
    action: "Move head, nav and footer from index.njk into _includes/layouts/base.njk; asset paths root-absolute; nav anchors /#how style."
  - id: azure-devops-page
    action: "Add website/src/azure-devops.njk (permalink /azure-devops/): work item in Azure Boards, sandbox, code, verification, pull request in Azure Repos, work item resolved; the conversation that turns a request into one approved, ordered work item; self-hosted per the host-it docs; links to the Azure DevOps tracker docs and to Microsoft's page with its date."
  - id: hero-link
    action: "The hero carries one line naming Azure Boards and Azure Repos and linking the new page."
  - id: landing-current
    action: "Bring the landing page's sections to what shipped, each claim resting on a 057da page: Work it out, the approved spec a run executes, the delivery account."
  - id: link-check
    action: "A small script crawls website/_site for href/src targets that do not exist and fails on any."

tests:
  - "the link-check script over website/_site finds no missing target"

done:
  - "the eleventy build is green and the link check finds nothing"
  - "/azure-devops/ exists, is linked from the hero, and cites Microsoft's page with its date"
  - "every product claim on the site names a capability a docs page describes"
