spec: 2026-10-13-9a59r
goal: "The ticket detail gains Conversation (every exchange in order, with the ticket's own Work it out composer), Specs (the series as read-only documents) and Acceptance (criteria per spec)."

applies_to: "dashboard (ticket detail: Conversation, Specs and Acceptance tabs; useSpecDialog's dialog-id source; the approval card on a ticket-bound conversation)"

