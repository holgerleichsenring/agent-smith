# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-18-78efa
goal: "Applying an admin draft that deletes orphaned stored secret values needs secrets.write besides admin.assistant; Apply refuses without it, and the config run checks it again."

applies_to: "default (ConfigChangeRequest, ConfigChangeApplier, ConfigOutcomeSink, ConfigApplyRun, dialog dispatch, admin prompt)"

requires: [2026-11-18-00eaa]

facts:
  - claim: "Approving the admin assistant's draft runs a config run through ConfigOutcomeSink and ConfigApplyRun; the request carries the changes and the person only, and ConfigChangeApplier deletes secret-values items after the catalog items."
    evidence: "src/backend/AgentSmith.Server/Services/Admin/Config/ConfigOutcomeSink.cs, src/backend/AgentSmith.Server/Services/Admin/Config/ConfigApplyRun.cs, src/backend/AgentSmith.Contracts/Models/ConfigChangeRequest.cs, src/backend/AgentSmith.Application/Services/Admin/ConfigChangeApplier.cs"
  - claim: "A dashboard dialog message is admitted with the caller's principal in SpecDialogEndpoints.IngestAsync and dispatched on a fresh async scope; ProjectAccess answers global permissions."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogEndpoints.cs, src/backend/AgentSmith.Server/Security/DialogMessageScope.cs, src/backend/AgentSmith.Server/Security/ProjectAccess.cs"
  - claim: "2026-11-18-00eaa decided that approving needs admin.assistant only, and raised secrets.write as a separate permission question."
    evidence: ".agentsmith/decisions/2026-11-18-00eaa.yaml"
  - claim: "Operator decision 2026-11-18: approving a secret-values deletion needs secrets.write in addition to admin.assistant; the config run re-checks it at apply time."
    evidence: "observed: 2026-11-18, operator ratified the recommendation in the session that followed PR #865"

scope:
  in: "DialogDeciderGrants (scoped, Server): whether the person whose dialog message this scope dispatches holds secrets.write, set by the dashboard dispatch from DialogMessageScope.MayWriteSecrets (globally held, or nothing enforced); unset is not held, so a chat channel or any other path holds none. ConfigOutcomeSink refuses a draft with a secret-values item from a decider without it before any run starts, the card goes back to awaiting, and the line names secrets.write and the item. ConfigChangeRequest carries MayWriteSecrets; ConfigChangeApplier refuses the whole request up front with the same line when it is false, so nothing is applied. One line for both, SecretValuesApproval.Refusal. The prompt says approving needs secrets.write. A deliberate exception to 'the assistant's drafts need only admin.assistant': secret rights stay with secrets."
  out: "Re-resolving the person's permissions inside the run: a run holds no token, so the run checks the grant resolved when Apply was pressed, in the same flow. Refusing the draft itself: the drafter may not be the one who applies, and a draft writes nothing."

steps:
  - id: request
    action: "ConfigChangeRequest(Changes, Person, MayWriteSecrets); SecretValuesApproval.Refusal(changes, mayWriteSecrets) in Application; ConfigChangeApplier checks it first."
  - id: decider
    action: "DialogDeciderGrants scoped; DialogMessageScope.MayWriteSecrets; SpecDialogEndpoints.Dispatch sets it in the dispatch scope; ConfigOutcomeSink refuses with the line and passes the grant to IConfigApplyRun."
  - id: prompt
    action: "admin-assistant-master: deleting a stored value is applied by someone holding secrets.write."

tests:
  - "ConfigChangeApplier: a secret-values delete without the grant is refused naming secrets.write and the item; nothing is applied or deleted; with it the orphan is deleted."
  - "ConfigOutcomeSink: a decider without secrets.write is refused before any run starts, the line names secrets.write."
  - "DialogMessageScope.MayWriteSecrets: held globally true, missing false, nothing enforced true."
  - "Harness: the assistant's drafted orphan delete applied by a decider without secrets.write is refused and the stored value stays; with it the value is gone."

done:
  - "A person with admin.assistant but without secrets.write cannot apply the deletion of a stored secret value; the refusal names secrets.write, and the config run refuses it too."
