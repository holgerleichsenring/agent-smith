assumptions:
  - "2026-10-15-4a4da is built: CallerIdentity carries ProjectPermissions (project name -> permissions under ConfigNames.Comparer, from bindings, global-only permissions already dropped) and PermissionsIn(string project) (global unioned with that project's), and the catalog's Permissions.ProjectScopable set answers whether a permission is project-scopable (asked as Permissions.ProjectScopable.Contains(name))."
  - "A run's Runs row exists by the time a caller can name its id on the dashboard; a run without a row answers a project-only caller 404 and is unchanged for a global holder."

scope:
  in: >
    DECLARATION: ProjectFrom (Server/Security, a record of kind and parameter, at most 50 lines) with Route(name),
    Run (route value runId), Dialog (thread id from route value or query dialogId, plus the optional query project),
    Session (route value sessionId, dashboard platform), Image (route value imageId), Body (the handler checks; only
    POST /api/spec-dialog/messages) and AcrossProjects (a list or aggregate); Wire gives the golden spelling
    (route:project, route:name, run, dialog, session, image, body, across). RoutePermissionExtensions.InProject<TBuilder>
    adds it as metadata (28 -> at most 36). Every one of the 66 project-scopable rows chains InProject onto its EXISTING
    map line, no line added: route:project — the 12 /api/tickets/{project}/{ticketId}[...] rows (detail, approval-preview,
    conversation, defaults, requires, reviews, series, text, close, defaults/verdicts, landed-by-hand, reopen) and
    GET /api/spec-dialog/tickets/{project}/{ticketId}; route:name — GET /api/projects/{name}/bootstrap, GET and POST
    /api/projects/{name}/init; run — DELETE /api/runs/{runId}, DELETE and POST /api/runs/{runId}/judgements, POST answer,
    cancel and retry, and GET /api/runs/{runId} plus its 12 read sub-routes (acceptance, compute, decisions, passes, specs,
    specs/{specId}, statistics, steps, steps/{stepIndex}/events, trace, trace/{sequence}/{label}, trail); dialog — GET
    /api/spec-dialog/{dialogId} and /filed-work, GET /references, /references/hashes, /references/{setId}/files, /content,
    /preview, POST /images and /references, DELETE /images/{imageId}, /references/{setId}, /references/{setId}/files;
    session — DELETE /conversations/{sessionId}, POST /conversations/{sessionId}/resume, the mock shot, html and ratify;
    image — GET /api/spec-dialog/images/{imageId}; body — POST /api/spec-dialog/messages; across — GET /api/runs,
    DELETE /api/runs, GET /api/pull-requests, GET /api/runs/expectations/metrics, GET /api/tickets, GET /api/tickets/graph,
    GET /api/spec-dialog/conversations, /tickets/search, /tickets/resolve, /tickets/{ticketId}, and the hub /hub/jobs (its
    negotiate row follows from the same map call). ACCESS: ProjectAccess (Server/Security, singleton, at most 80 lines):
    bool Enforcing (TokenAuthorityConfig.Enforce); bool HoldsEverywhere(ClaimsPrincipal user, IReadOnlyList<string>
    permissions) = every permission in the resolver's CallerIdentity.Permissions; bool HoldsAnywhere(ClaimsPrincipal user,
    string permission) = in Permissions or in any ProjectPermissions entry; bool HoldsIn(ClaimsPrincipal user,
    IReadOnlyList<string> permissions, string project) = every permission in CallerIdentity.PermissionsIn(project) when
    the live configuration (TicketProjects.All(), ConfigNames.Comparer) names the project, else in Permissions — a
    project no longer configured is reachable through global holds only. These four are the whole API; 4a4dc and 4a4dd
    call them by these names and never re-derive the union. RESOLUTION: ResourceProjectReader
    (Infrastructure.Persistence/Repositories, scoped, at most 70 lines, its own class so the two repositories at and near
    their limit are untouched): RunAsync(runId), SessionAsync(platform, sessionId), OpenDialogAsync(platform, threadId),
    ImageAsync(platform, imageId) (reference file else legacy attachment -> SessionId -> session), each projecting the
    Project column only and answering null for no row and "" for a session without a project. ProjectSourceResolver
    (Server/Security, scoped, at most 80 lines) turns a ProjectFrom and the HttpContext into Missing, Unscoped or the
    project names to check (Route: the value read through TicketQueryEndpoints.Decoded, as the handlers read it;
    Dialog: the open session's project when set, and the query project when given; no session and no query project is
    Unscoped). ProjectScopeMiddleware (Server/Security, at most 60 lines; the scoped resolver arrives as an InvokeAsync
    parameter, never through the constructor of a middleware built once): for an endpoint with a
    ProjectFrom other than Body and AcrossProjects, and only when the caller does not hold all its RequiresPermission
    names everywhere, resolves the project; Unscoped passes; Missing, an unconfigured project or a project the caller
    lacks any of the route's permissions in answers an EMPTY 404 before the handler runs. Registered by
    UseServerAuthentication straight after UseAuthorization only when auth.Enforce (86 -> at most 89). COARSE GATE:
    PermissionRequirementHandler.Holds also succeeds when the permission is project-scopable, the endpoint's ProjectFrom
    is a per-resource kind (route, run, dialog, session, image, body) and HoldsAnywhere (40 -> at most 55); an
    AcrossProjects route — every list and /hub/jobs with its negotiate — keeps the global check, so a project-only
    caller is refused 403 there exactly as today (4a4dc gives the hub its own kind and opens it; 4a4dd opens the
    lists with their filters). BODY ROUTE: DialogMessageScope (Server/Security, scoped, at most 60
    lines) decides POST /api/spec-dialog/messages for a caller who does not hold dialog.write everywhere: the dialog's
    projects are the open session's, body.Project, and the project a text SpecCommandParser reads as '/spec <project>'
    names; a '/spec' naming none (it would list every configured project) and any project not held for dialog.write
    answer an empty 404 before anything is emitted or dispatched. MayStartRuns moves into it and asks ProjectAccess for
    runs.control in those projects (global when unscoped); SpecDialogEndpoints.IngestAsync calls both (119 -> at most
    120, the moved MayStartRuns pays for the call). RESUME TARGET: SpecDialogResumeEndpoints.ResumeAsync answers an empty
    404 when the open session on the body's target dialog is in a project the caller lacks dialog.write in, before the
    resumer closes it (74 -> at most 80); its source is the route's Session kind. REGISTRATION:
    ProjectScopeExtensions.AddProjectScope (at most 25 lines) called from AddCallerIdentity (52 -> at most 54). GUARD:
    RouteFact gains Scope and its Row a fourth column ('-' when none); ServerRouteTable reads ProjectFrom (57 -> at most
    60); route-permission-baseline.tsv regenerated with the column; RouteProjectScopeGuardTests (new file, pinned like
    RoutePermissionGuardTests: AGENTSMITH_UI_API_ENABLED set, EnvVarCollection, TestProcess env-3 — otherwise it passes
    vacuously over the unconditional routes) pins the rules below.
  out: >
    CallerIdentity.ProjectPermissions, the scopability mark, bindings, findings and the store round-trip —
    2026-10-15-4a4da. Hub methods (runs.watch, run-keyed subscriptions), the per-project overview groups and letting a
    project-only holder connect to /hub/jobs — 2026-10-15-4a4dc. Filtering every AcrossProjects route by caller
    (runs, pull requests, metrics, tickets, graph, conversations, ticket search/resolve/{ticketId}, and DELETE /api/runs
    deleting, for a project-only holder, only the terminal runs of projects where they hold runs.delete), letting AcrossProjects pass the coarse gate on HoldsAnywhere once filtered,
    and the new GET /api/projects — 2026-10-15-4a4dd. /api/identity's projectPermissions and the dashboard's gating —
    2026-10-15-4a4de. The Access Studio's Projects pane — 2026-10-15-4a4df. Turning the dialog surface's existing OWNER
    refusals (403 on the view, message, reference-list and resume routes) into 404 — nobody: they refuse a person in a
    project they hold, which confirms nothing about another project. Webhooks, Slack, Teams and tracker polling — nobody
    (anonymous server-side triggers, unchanged).

decisions:
  - key: "ONE MIDDLEWARE, NOT AN AUTHORIZATION FAILURE. Alternative: resolve in PermissionRequirementHandler. Why: a pending requirement becomes the 403 body naming the permission, which confirms the resource exists; a middleware after UseAuthorization sees the selected endpoint and its route values and can answer 404 before the handler."
  - key: "EMPTY 404 FOR EVERY NON-GLOBAL MISS. Alternative: copy each route's own missing body. Why: the bodies differ per route (empty, 'No project <name> is configured.'); for a caller who is not a global holder the middleware answers missing and out-of-reach identically before any handler speaks, and a global holder still reads every text it read before."
  - key: "GLOBAL HOLDERS NEVER PAY. The middleware returns before any lookup when the caller holds the route's permissions everywhere, so admins, operators and every installation without bindings run byte-identical paths; with enforce off the middleware is not in the pipeline at all."
  - key: "LISTS STAY GLOBAL IN THIS SLICE. Alternative: admit project-only holders to AcrossProjects routes now. Why: until 4a4dd filters them, a project-only holder would read every project's runs; the across marker is declared here so the guard is complete, and 4a4dd flips its coarse rule with the filtering."
  - key: "AN UNCONFIGURED PROJECT IS GLOBAL-ONLY. A binding to a project not configured is kept (4a4da), but reaching a run or ticket of that project needs a global hold — the brief's rule for orphaned runs, read at the one place that checks."
  - key: "DIALOG ROUTES CHECK THE SESSION'S PROJECT. The ticket-bound widening in SpecDialogOwnership.MayReach stays, now bounded by the session's project at the route; a conversation with no project yet carries nothing project-specific and passes."
  - key: "A BODY KIND, PINNED TO ONE ROUTE. POST messages carries the dialog id in its body, which a middleware cannot read without buffering it; the handler checks through the same resolver, and the guard allows Body on that route alone."
  - key: "THE TYPED '/spec' IS A PROJECT SOURCE. Alternative: check only the session and body.Project. Why: a fresh dialog posting '/spec beta' opens a session on beta with neither set, and a bare '/spec' lists every project's name; the parser that routes the text is the one that names the project, so the check reads it the same way."
  - key: "MISSING IS 404 FOR A PROJECT-ONLY CALLER, ALSO ON THE DELETE. Alternative: let a missing session through so the delete keeps its 204. Why: a foreign session would then answer 404 and a missing one 204 — exactly the existence signal the 404 rule removes; a global holder keeps the 204."
  - key: "A TRACKER SHARED BY TWO PROJECTS IS A SHARED TRUST BOUNDARY. Alternative: partition a shared tracker's tickets by project. Why: two projects routed to one tracker connection see one ticket space; agent-smith scopes by the project the caller ADDRESSES (the {project} route value, the run's or session's stored project) and does not partition a shared tracker's tickets. Documented and accepted: an operator who needs the split gives each project its own tracker connection."
  - key: "THE DECLARATION CHAINS ONTO THE EXISTING LINE. RunControlEndpoints sits at its 151-line ratchet; InProject goes on the Needs line, as Needs went on the map line."

steps:
  - id: declaration
    action: "ProjectFrom (at most 50 lines) and InProject in RoutePermissionExtensions (28 -> at most 36)."
  - id: access
    action: "ProjectAccess (at most 80 lines), ResourceProjectReader (at most 70 lines, Project-column projections only), ProjectSourceResolver (at most 80 lines); ProjectScopeExtensions.AddProjectScope (at most 25 lines, registering these three and DialogMessageScope) from AddCallerIdentity (52 -> at most 54)."
  - id: middleware
    action: "ProjectScopeMiddleware (at most 60 lines); UseServerAuthentication adds it after UseAuthorization when auth.Enforce (86 -> at most 89)."
  - id: coarse-gate
    action: "PermissionRequirementHandler admits a project-scopable permission held in any project on a per-resource route (40 -> at most 55); AcrossProjects and undeclared routes keep the global check."
  - id: declare-routes
    action: "Chain InProject onto the 66 rows listed in scope, on their existing lines, in the map files TicketQueryEndpoints, TicketApprovalPreviewEndpoints, TicketConversationReadEndpoints, TicketDefaultsEndpoints, TicketGraphEndpoints, TicketReviewEndpoints, TicketSeriesEndpoints, TicketTextEndpoints, TicketCloseEndpoints, TicketLandedByHandEndpoints, TicketConversationEndpoints, TicketSearchEndpoints, ProjectBootstrapEndpoints, ProjectInitEndpoints, RunQueryEndpoints, RunStepQueryEndpoints, RunSpecQueryEndpoints, RunStoryEndpoints, RunPassEndpoints, RunComputeEndpoints, CriterionJudgementEndpoints, RunControlEndpoints, RetryEndpoints, RunDeletionEndpoints, PullRequestQueryEndpoints, CriteriaMetEndpoints, ServerEndpointExtensions (hub), and the nine SpecDialog*Endpoints files; no file grows."
  - id: body-route
    action: "DialogMessageScope (at most 60 lines: session, body.Project and '/spec <project>' text; MayStartRuns moved in, through ProjectAccess); SpecDialogEndpoints.IngestAsync calls it (119 -> at most 120); SpecDialogResumeEndpoints checks the target dialog's project (74 -> at most 80)."
  - id: guard
    action: "RouteFact.Scope and the fourth Row column; ServerRouteTable reads ProjectFrom (57 -> at most 60); regenerate route-permission-baseline.tsv with AGENTSMITH_WRITE_ROUTE_BASELINE=1 and read the diff: 66 rows gain a scope, the rest '-'."
  - id: tests
    action: "Red first, then green; the booted tests use a ProjectBindingAuthorityFixture (one group bound to operator in project alpha, beta configured too) with the env-var collection and a TestProcess env trait; run Server.Auth, Server route guard and SpecDialog classes with --filter."

