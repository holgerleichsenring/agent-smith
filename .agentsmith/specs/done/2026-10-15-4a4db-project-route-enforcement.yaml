done:
  - "A person bound to project alpha only opens alpha's tickets, runs and conversations by their address and acts on them as their role allows; asking for a ticket, run, conversation, upload or mock of project beta, or for a project, run or conversation that does not exist, answers the same empty 404; the lists, the graph and the live hub still refuse them until 2026-10-15-4a4dd and 2026-10-15-4a4dc."
  - "In a design conversation that person cannot open, continue or resume onto a conversation of project beta, and a typed '/spec' never shows them beta's name."
