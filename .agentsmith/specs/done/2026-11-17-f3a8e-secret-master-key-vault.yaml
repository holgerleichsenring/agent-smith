# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-f3a8e
goal: "The secret store's master key can reach the server wrapped by an Azure Key Vault key and be unwrapped by the vault at startup, so the deployment holds no raw master key."

applies_to: "default (MasterKeyRing, secret state), dashboard (secret drawer key source line)"

requires: [2026-11-17-f3a8d]

facts:
  - claim: "The secret store wraps each data key with AES-GCM under a 32-byte master key read from AGENTSMITH_SECRET_MASTER_KEY(_FILE), with _PREVIOUS for reading, and records the wrapping key's id per row (KeyId nvarchar(256))."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/Secrets/MasterKeyRing.cs, src/backend/AgentSmith.Infrastructure.Persistence/Services/Secrets/SecretEnvelope.cs, src/backend/AgentSmith.Infrastructure.Persistence/Configurations/StoredSecretConfiguration.cs"
  - claim: "Stored values are opened synchronously once per configuration load."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/Secrets/StoredSecretValues.cs"
  - claim: "Azure.Identity 1.11.4 and Azure.Core 1.44.1 are already in the server's dependency graph; Azure.Security.KeyVault.Keys 4.7.0 needs Azure.Core 1.44.1; CryptographyClient's WrapKey/UnwrapKey are virtual, so a test can stand in for the vault."
    evidence: "src/backend/AgentSmith.Server/obj/project.assets.json (main checkout), Azure.Security.KeyVault.Keys 4.7.0 nuspec"
  - claim: "Operator decision 2026-11-17: the master key comes from env or a k8s secret, optionally Azure Key Vault; deployment-only bootstrap values are the documented exception to every-config-in-the-UI."
    evidence: "observed: 2026-11-17, operator brief for the admin assistant series; .agentsmith/decisions/2026-11-17-f3a8d.yaml"

scope:
  in: "Each master key slot (current, _PREVIOUS) takes the raw key (AGENTSMITH_SECRET_MASTER_KEY, _FILE) OR a wrapped one: AGENTSMITH_SECRET_MASTER_KEY_WRAPPED (_FILE), the base64 of the 32-byte key encrypted RSA-OAEP-256 with the public half of a Key Vault RSA key, unwrapped once by the vault (unwrapKey) with the key named by AGENTSMITH_SECRET_KEY_VAULT_KEY (a versioned key identifier URL; _PREVIOUS falls back to the current one); both forms in one slot is a problem, not a guess. The key id stays 'env:'+HMAC of the key bytes, so rows are unchanged and the same key moves from raw to wrapped without a re-wrap. Auth: DefaultAzureCredential without developer or interactive sources (workload identity, managed identity, AZURE_CLIENT_ID as the managed identity's client id); retries 2, network timeout 10 s; a vault failure is the ring's Problem, so stored values resolve empty with the existing findings; the state names the source; docs with the openssl recipe that wraps a fresh key with the public key."
  out: "Wrapping every row's data key in the vault (rejected in review: anyone with the public key could forge a row, the synchronous load would make one vault call per row). The key source as a UI setting: deployment-only, because a database writer could otherwise point new writes at a key they hold; the drawer shows the source read-only. A live-vault test in CI: no vault is reachable here; the SDK boundary is covered by a CryptographyClient stand-in and the unwrap by a local RSA key."

steps:
  - id: unwrap
    action: "IKeyVaultUnwrap (Unwrap(keyId URL, wrapped) -> bytes); AzureKeyVaultUnwrap over CryptographyClient (RsaOaep256) with the credential and retry options; MasterKeyRing reads the wrapped variables and unwraps through it, zeroing the buffers it does not keep, and says the source (Source)."
  - id: state
    action: "SecretValuesView.MasterKeySource; the drawer's state line and read_secrets show it; Unavailable names the wrapped variables too."
  - id: package
    action: "Azure.Security.KeyVault.Keys 4.7.0 and Azure.Identity 1.11.4 on Infrastructure.Persistence."
  - id: docs
    action: "config-studio.md: the vault variables, the role (Key Vault Crypto Service Encryption User), the openssl wrap recipe, moving a raw key to its wrapped form."

tests:
  - "MasterKeyRing over a local RSA stand-in: a key wrapped with the public half unwraps to the same id as the raw key; raw and wrapped in one slot is a problem; a vault failure is a problem naming the variable; _PREVIOUS unwraps with the current vault key when no previous one is named."
  - "A row sealed under the raw key opens under the wrapped form of the same key."
  - "AzureKeyVaultUnwrap over a CryptographyClient stand-in: unwraps with RSA-OAEP-256 against the configured key id."
  - "Booted server with the stand-in vault and only the wrapped key in the environment: a secret run stores a value and the configuration resolves it."

done:
  - "With AGENTSMITH_SECRET_KEY_VAULT_KEY and the wrapped master key configured, secrets are written and read, and no raw master key exists in the environment or the database."
