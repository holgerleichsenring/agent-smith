# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-31dci
goal: "A ticket nobody needs to act on says so and since when; past a configured duration it becomes an admin hold, and admins see every admin hold on one page."

applies_to: "default + dashboard (TicketHoldReader nobody cases, ModelRunWaitClock, new holds config key, Config Studio field, System Needs attention page, admin sidebar count)"

requires: [2026-11-23-31dcg, 2026-11-22-d434b, 2026-11-20-9936a, 2026-11-22-6d85c, 2026-11-22-747dc]

invariant: "No ticket waits silently: either it says nothing is needed and since when, or it is someone's hold; every admin hold is on the admin's page."

facts:
  - claim: "Model waits answer only whether a run waits, not since when; capacity queueing has its own queue."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/ModelRunWaitClock.cs:11, src/backend/AgentSmith.Contracts/Services/ICapacityQueue.cs:13"
  - claim: "A setting with a dashboard field follows the restart-window shape: config property, validation naming the key, a Config Studio field."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/PreconditionsConfig.cs:21,31-32"
  - claim: "A failed ticket untouched for a day is Stuck by a separate check."
    evidence: "src/backend/AgentSmith.Server/Models/TicketBucket.cs:19-23"
  - claim: "A run waited 20 minutes for its model place and read as stuck; another sat in the capacity queue until a person cancelled it."
    evidence: "observed: 2026-11-22/23 run events of a three-repo series"

scope:
  in: >-
    Nobody holds carry a sentence and since: 'Waiting for the model since 00:12' (ModelRunWaitClock gains
    WaitingSinceAsync), 'Waiting for sandbox capacity since …', 'Restarts after the server stopped', 'Starts when #x
    finishes'; each ends 'Nothing for you to do'. A nobody hold older than holds.escalate_after_minutes (default 60,
    0 = never; reason: a wait that long means something outside the run is wrong) becomes an admin hold at read time
    whose sentence names the wait, the value and the key; no background job. An escalated hold is Stuck like every
    admin hold (31dcg), so the day-old Stuck check and an admin hold never both apply. Config Studio field for the key.
    System gains 'Needs attention' (admin permission): every admin hold across the projects the admin sees, with since,
    ticket link, sentence, and for an escalation the value and the config key; the sidebar's System entry shows its count
    to admins only.
  out: "Fixing the cause of a long wait."

steps:
  - id: since
    action: "ModelRunWaitClock.WaitingSinceAsync and the capacity queue's enqueued time on the nobody cases."
  - id: config
    action: "HoldsConfig.EscalateAfterMinutes with validation naming the key and the Config Studio field."
  - id: escalate
    action: "TicketHoldReader turns an over-age nobody hold into admin."
  - id: page
    action: "GET /api/holds/admin (admin permission) and the System → Needs attention page with the sidebar count."

tests:
  - "Each nobody case renders its sentence with since."
  - "At 59 minutes nobody, at 61 admin with value and key; 0 never escalates."
  - "The field saves; a negative value is refused with the key named."
  - "Needs attention lists escalated and precondition admin holds; a non-admin gets 403 and sees no count."
  - "An escalated ticket is Stuck once, not twice."

done:
  - "Build, the full suite and the dashboard tests green; the tests above in TicketHoldReader, config validation, endpoint and Needs attention page test classes."
