  out: "The pane (d762c); the step lines' and question cards' content; backend."

steps:
  - id: exchange
    action: "SpecDialogSurface: the exchange is a plain section (dl-exchange) with dl-head and dl-body."
  - id: transcript
    action: "DialogTranscript: speaker words, upload line with a text link."
  - id: css
    action: "spec-dialog.css: 720px column, document and question blocks flattened, composer hairline and sticky."
  - id: tests
    action: "Adapt the surface and reference tests; assert the upload is one line with a text link and no card."

decisions:
  - "Speakers become the words 'you' and 'agent', small and muted, in place of the OP/AS badges — alternatives: the badges without fill."

tests:
  - "DialogTranscriptReference: one line, no ecard, show files a text link that opens the upload."
  - "SpecDialogSurface: the exchange has no ecard; the speaker is a word."

done:
  - "The conversation has no card, reads at most 720px wide, and its composer sits under one hairline with File/Discard working."
  - "pnpm test and pnpm build are green; the spec gate passes."
