# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-d762b
goal: "The Work it out conversation reads as plain text in a 720px column with no card, plain speaker words, a one-line upload and the composer under one hairline."

applies_to: "dashboard (SpecDialogSurface exchange, DialogTranscript, DialogComposer, DialogDocumentCard, spec-dialog.css)"

requires: [2026-11-17-d762a]

assumptions:
  - "The reading width and the composer's hairline follow the ticket page's What happened (2026-11-17-8d1cb)."

facts:
  - claim: "The exchange is an ecard with a head bar; the speakers are OP and AS badges; an upload is a card with a Show files button."
    evidence: "src/dashboard/src/components/dialog/SpecDialogSurface.tsx:359, src/dashboard/src/components/dialog/DialogTranscript.tsx:199-204, src/dashboard/src/components/dialog/DialogTranscript.tsx:134-149"
  - claim: "The ticket composer drops its box for one top hairline."
    evidence: "src/dashboard/src/styles/ticket-thread.css:153-155"

scope:
