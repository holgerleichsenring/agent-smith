# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-02-5ab2b
goal: "A ticketless or resumed run's request is stored on its run row, so a lost Redis queue entry is re-enqueued from the database and a duplicate is started at most once."

applies_to: "backend (ticketless launchers, resume launcher, queue consumer claim, housekeeping sweeper, run projection, persistence migration)"

requires: ["2026-10-02-5ab2a", "2026-10-02-5f89d", "2026-10-02-5f89e"]

facts:
  - claim: "Init and chat launches write a queued row, then push the request to the Redis list; the request (autoCompletePullRequests, chat context) exists only in Redis."
    evidence: "src/backend/AgentSmith.Server/Services/Init/InitRunLauncher.cs:79-83,91-97; src/backend/AgentSmith.Server/Services/ChatLaunch/ChatTicketlessRunLauncher.cs:36-38"
  - claim: "The queue serializes the request with JsonSerializer defaults and pops it destructively; nothing durable records a popped or lost entry."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Queue/RedisJobQueue.cs:19,25-26,40,64"
  - claim: "PipelineRequest's fields carry no credential: project, pipeline, ticket id, flags, context, plan answers, agent name, run id, inline ticket."
    evidence: "src/backend/AgentSmith.Contracts/Models/PipelineRequest.cs:9-29"
  - claim: "Ticket runs recover through the taken-ticket record; ticketless rows have no such record."
    evidence: "src/backend/AgentSmith.Application/Services/Lifecycle/EnqueuedReconciler.cs:53-59,88-93"
  - claim: "A queued row is unfinished, so FindLiveRunAsync answers AlreadyRunning to every later init of that project."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/InitRunRepository.cs:27-31; InitRunLauncher.cs:63-64"
  - claim: "Only running rows are liveness candidates; a queued row is never reaped."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/RunLivenessRepository.cs:29-36"
  - claim: "The resume launcher enqueues to Redis, then removes the durable capacity-queue entry; its context exists only in the pushed request afterwards."
    evidence: "src/backend/AgentSmith.Server/Services/ResumeRunLauncher.cs:46-47,69-75; src/backend/AgentSmith.Infrastructure.Persistence/Services/DbCapacityQueue.cs:22-23"
  - claim: "The consumer pops, then waits on its semaphore; its only pre-start check, after the wait, refuses a flagged or finished row, so two copies of one request would both start."
    evidence: "src/backend/AgentSmith.Application/Services/PipelineQueueConsumer.cs:34-36,78-83; src/backend/AgentSmith.Infrastructure.Persistence/Repositories/RunRepository.cs:112-114"
  - claim: "The row heartbeat starts only after BuildPrologueAsync and RunStarted; the pump beats every 45 s and renews any unfinished row."
    evidence: "src/backend/AgentSmith.Application/Services/ExecutePipelineUseCase.cs:66-86; src/backend/AgentSmith.Application/Services/Lifecycle/RunHeartbeatPump.cs:29,45; RunLivenessRepository.cs:15-18"
  - claim: "RunStarted promotes a queued or waiting_for_input row to running in one place; a running row is a duplicate replay."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunEventApplier.cs:106-113; src/backend/AgentSmith.Infrastructure.Persistence/Services/QueuedRunProjection.cs:18-30"
  - claim: "RunLivenessReaper suppresses verdicts across a suspend gap; housekeeping runs under one leader lease."
    evidence: "src/backend/AgentSmith.Server/Services/Lifecycle/RunLivenessReaper.cs:59-64; src/backend/AgentSmith.Server/Services/Hosting/HousekeepingLeaderHostedService.cs:25,70-72"
  - claim: "PipelineQueueConsumer (137) and RunRepository (143) are ratchet rows; Run.cs has 93 lines; QueuedRunProjection has 72."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:108,115"
  - claim: "The fast-tier harness replaces the Redis multiplexer with a mock, so it cannot flush Redis."
    evidence: "tests/AgentSmith.PipelineHarness/Composition/RealCompositionHarness.cs:262-277"

scope:
  in: >
    Run gains QueuedRequestJson, RequestEnqueuedAt and ClaimedAt (nullable; migrations in both assemblies).
    QueuedRunDispatch serializes the PipelineRequest exactly as RedisJobQueue does, stores it with RequestEnqueuedAt on
    the row, then pushes it; init and chat launch through it, and ResumeRunLauncher records it on the waiting_for_input
    row before its push. RunStartClaim, called by the consumer right after the pop and before the semaphore wait: a
    request with a RunId whose row holds a request is claimed by one conditional update (ClaimedAt and HeartbeatAt =
    now where ClaimedAt is null); a lost update drops the copy; a RunId whose row is already running drops it too;
    a row with no stored request starts as today. From the claim the consumer beats the row every 45 s (IRunHeartbeat)
    until the run ends, so the wait and the prologue are covered. QueuedRunProjection clears QueuedRequestJson,
    RequestEnqueuedAt and ClaimedAt when it promotes the row. QueuedRunSweeper (housekeeping leader, every 30 s,
    SuspendGapDetector as RunLivenessReaper): an unfinished, unflagged, unclaimed row with a request, enqueued over
    60 s ago, is pushed again and RequestEnqueuedAt renewed; a claimed row whose later of HeartbeatAt and ClaimedAt is
    over 3 minutes old is flagged cancel reason interrupted. Time filters run client-side (SQLite).
  out: >
    Ticket runs from SingleClaimRegionExecutor and EnqueuedReconciler: the taken-ticket record already recovers them.
    Replacing the Redis list with a database queue.

decisions:
  - key: "THE ROW IS THE REQUEST. Redis carries a copy to wake a consumer; the row is what a flush cannot take, and the sweeper rebuilds the copy from it. The request holds no credential, so the row holds none."
  - key: "CLAIM AT POP. A popped request waiting on the semaphore is already claimed, so the sweeper never re-pushes it; a copy that races the original loses the conditional update."
  - key: "BEAT FROM THE CLAIM. Claimed with no fresh beat is then a real death: the wait and BuildPrologueAsync are covered, so no prologue race."
  - key: "CLEARED AT START. Promotion clears the request and the claim, so a row parked again and resumed later is judged by its new request, under the same claim rule."
  - key: "BOUND: lost entry re-pushed within 90 s (60 s + one 30 s pass), inside the resume lease's 3-minute freshness. A claimed run that dies before RunStarted ends interrupted within ~5 minutes, freeing the init guard."
  - key: "RATCHETS. The claim and the pre-start gate leave PipelineQueueConsumer, whose row drops; RunRepository is untouched — the claim lives in a new QueuedRunRepository."

steps:
  - id: schema
    action: "Run columns, configuration, migrations in both assemblies."
  - id: dispatch
    action: "QueuedRunRepository and QueuedRunDispatch; InitRunLauncher, ChatTicketlessRunLauncher and ResumeRunLauncher use them."
  - id: claim
    action: "IRunStartClaim (Contracts) with DB and no-op implementations; RunStartGate extracted from PipelineQueueConsumer, claiming at pop and beating from the claim; baseline row lowered."
  - id: projection
    action: "QueuedRunProjection clears the request and claim on promotion."
  - id: sweeper
    action: "QueuedRunSweeper started by HousekeepingLeaderHostedService."

tests:
  - "InitRunLauncher_Launch_StoresTheRequestOnTheRow"
  - "RunStartClaim_TwoCopiesOfOneRequest_StartOnce"
  - "RunStartClaim_RowAlreadyRunning_DropsTheCopy"
  - "RunStartClaim_RowWithoutStoredRequest_StartsAsToday"
  - "PipelineQueueConsumer_ClaimedRequestWaitingOnSemaphore_BeatsItsRow"
  - "QueuedRunProjection_Promotion_ClearsRequestAndClaim"
  - "QueuedRunSweeper_UnclaimedRowOlderThan60s_IsPushedAgainWithItsContext"
  - "QueuedRunSweeper_ClaimedRowWithoutBeatFor3Minutes_IsFlaggedInterrupted"
  - "QueuedRunSweeper_SuspendGap_SuppressesVerdicts"
  - "LostQueueEntry_InMemoryQueueDropsTheRequest_SweeperRestartsItWithAutoCompleteKept (fast tier, in-memory IRedisJobQueue fake)"
  - "Flush_QueuedInitAfterRealRedisFlush_StartsOnce (PipelineHarness, Tier=Docker, real Redis container)"

done:
  - "an init launched, then Redis flushed before the pop, runs within 90 s with its auto-complete choice"
  - "build green, full suite green"
