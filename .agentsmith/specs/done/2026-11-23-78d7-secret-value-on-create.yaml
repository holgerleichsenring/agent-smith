# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-78d7
goal: "A new secret takes its value in the create form, and each secret card says where its value comes from: stored, the environment, both, or none yet."

applies_to: "dashboard (Config studio secrets: EntityDrawer, EntityForm, EntityCard, ConfigStudio, i18n)"

requires: [2026-11-17-f3a8d, 2026-11-18-dafc]

facts:
  - claim: "The value field renders only for a saved secret, so a new secret has no place for its value."
    evidence: "src/dashboard/src/components/config/EntityForm.tsx:212"
  - claim: "The secret card prints one fixed source sentence for every secret."
    evidence: "src/dashboard/src/components/config/EntityCard.tsx:200-208"
  - claim: "Setting a value for a name the catalog lacks adds the catalog secret first, and the length and master-key refusals come before that, so a refused value creates nothing."
    evidence: "src/backend/AgentSmith.Application/Services/Admin/SecretWrite.cs:16-39"
  - claim: "GET /api/config/secret-values lists per secret its variable, whether the environment sets it and the stored row (set by, set at, key current, readable)."
    evidence: "src/dashboard/src/lib/secretValuesApi.ts:6-30, src/backend/AgentSmith.Server/Extensions/SecretValueEndpoints.cs:19-20"

scope:
  in: "The new-secret drawer shows a password input for the value (disabled, with the reason, when no master key is present). Create with a value runs only the secret run (PUT secret-values/{name}), which adds the catalog secret; Create without a value posts the catalog secret as before. The value lives in drawer state, never in the entity draft, and the input is cleared once the request is sent, whatever the answer; a refusal keeps the drawer open with the server's line. The secrets list reads the secret-values state once (again when the catalog reloads or the drawer closes) and each card states its source: stored with who and when, from the environment naming the variable, the environment winning over a stored value, or no value yet. A failed read leaves the source out. New texts are messages.ts keys (en + de)."
  out: "Backend changes. Showing or echoing a value anywhere."

steps:
  - id: card
    action: "useSecretValues in ConfigStudio's EntityCatalog; EntityCard takes the per-secret state and prints the source line from i18n keys."
  - id: create
    action: "EntityForm takes newSecretValue/onNewSecretValue for a new secret; EntityDrawer holds the value and routes Create to setSecretValue when one is given."
  - id: tests
    action: "Vitest: the drawer sends the value through setSecretValue and clears it, Create without a value uses the catalog client, a refusal keeps the drawer open; the card text for each state."

tests:
  - "SecretCreateValue.test.tsx: new-secret drawer shows the value input; Create with a value calls setSecretValue(name, value) and not the catalog create; the input is empty after sending; a refusal shows the line and does not call onSaved; without a value the catalog create runs."
  - "SecretCardUsers.test.tsx: stored, environment, environment over stored, none yet, and no state."

done:
  - "An operator creates a secret and its value in one step, and the secrets list shows where each value comes from."
