    evidence: "src/backend/AgentSmith.Contracts/Providers/ITicketProvider.cs:59-69, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/JiraTicketProvider.cs:51, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/JiraTicketProvider.cs:171-175, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/JiraTicketProvider.cs:180, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/AzureDevOpsTicketProvider.cs:48, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/AzureDevOpsTicketProvider.cs:167-174, src/backend/AgentSmith.Infrastructure/Services/Factories/TicketProviderFactory.cs:61, src/backend/AgentSmith.Infrastructure/Services/Factories/TicketProviderFactory.cs:80, src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs:88-91"
