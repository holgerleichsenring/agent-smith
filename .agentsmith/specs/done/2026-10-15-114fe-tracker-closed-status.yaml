spec: 2026-10-15-114fe
goal: "A Jira or Azure DevOps tracker may name a closed_status that 'also close on the tracker' moves a ticket into, and agent-smith counts it as its own status, never a person's close."

applies_to: "backend and dashboard (closed_status on the raw tracker entry, TrackerConnection, the Config Studio tracker entity, mapper, patch and capability descriptor, the config schema and reference docs, TicketParkStatuses, the close act's tracker close, the studio tracker type)"

requires: [2026-10-15-114fa]

