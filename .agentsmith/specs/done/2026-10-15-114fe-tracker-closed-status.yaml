  - claim: "The Config Studio form is drawn from the capability descriptor, which a coverage test keeps level with every raw tracker property; a field declared on two tracker types counts as declared, and the transition group renders on the outcomes tab outside the compared run-outcome block."
    evidence: "src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs:21-58, src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs:66-86, src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs:88-93, src/backend/AgentSmith.Contracts/Services/ConfigStudioCapabilities.cs:149-163, tests/AgentSmith.Tests/ConfigStudio/CapabilityCoverageTests.cs:39-48, src/dashboard/src/components/config/trackerTabs.ts:8-18, src/dashboard/src/components/config/TrackerOutcomes.tsx:6-8, src/dashboard/src/components/config/__tests__/TrackerForm.test.tsx:36, src/dashboard/src/lib/configApi.ts:535-553"
  - claim: "The config schema lists every tracker property and a test keeps it level with the raw model; the example config and the reference docs name close_transition_name."
