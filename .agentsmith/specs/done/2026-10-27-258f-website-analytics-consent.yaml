# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-27-258f
goal: "agent-smith.org counts visits with Google Analytics 4 only after a visitor accepts a consent banner; the imprint stays off until a postal address is set."

applies_to: "website (layout, footer, consent script, privacy and imprint pages, sitemap, build config)"

requires: [2026-10-16-d5da]

facts:
  - claim: "Every page shares one layout whose footer holds the footer links and which loads main.js at the end of the body."
    evidence: "website/src/_includes/layouts/base.njk:109-120"
  - claim: "site.json holds the site's names and URLs; no analytics id and no legal details exist."
    evidence: "website/src/_data/site.json:1-15"
  - claim: "The build copies src/static whole and the sitemap lists collections.all."
    evidence: "website/eleventy.config.js:2, website/src/sitemap.xml.njk:7-11"
  - claim: "main.js returns early under prefers-reduced-motion, so consent code placed there would not run for those visitors."
    evidence: "website/src/static/main.js:20-23"
  - claim: "npm run build runs check-links.mjs as postbuild against a fixed _site root."
    evidence: "website/package.json:9-10, website/check-links.mjs:8"

assumptions:
  - "The operator gave name and email (2026-10-27) and no postal address, which would be a private one; a c/o or service address may follow."

scope:
  in: >
    site.json analyticsId G-E95PF80BP4 and legal { name, email } as the operator gave them. eleventy.config.js decides
    once: with legal.name and legal.email the layout renders a bottom-left non-modal consent dialog (Decline and Accept
    of equal weight, the approved mock's copy, link to /privacy/), loads consent.js (rendered from a template, deferred)
    and the footer Privacy and Privacy settings links, and /privacy/ renders; without them none of it renders and the
    build prints 'analytics off: legal details missing in site.json'. /imprint/ and its footer link render only with
    legal.address as well; otherwise the build prints 'imprint off: no postal address in site.json'. gtag.js loads only
    on Accept with Google signals and ad personalisation off; the choice lives in localStorage (a failing store asks
    again); declining after accepting stops loading and deletes _ga cookies. check-consent.mjs proves the committed
    state and fixture builds without legal, without an address and with one; check-links.mjs takes a root.
  out: "A postal address (the operator will supply a c/o or service address later). Any other tracking."

decisions:
  - key: "IMPRINT WITHHELD, NOT PUBLISHED INCOMPLETE. § 5 DDG requires a postal address and the operator gave none."
  - key: "THE SCRIPT IS A TEMPLATE. consent.js renders from src/consent.js.njk, so a build without legal details has no googletagmanager string in _site."
  - key: "THE FIXTURE BUILDS A COPY. check-consent.mjs builds copies of website/ in .consent-check-* with fixture site.json, so no test seam lands in config."

upgrade_impact: "nothing: a static site; the banner appears for visitors on the next deploy."
proven_live: "After deploy a real browser shows the banner, no request to googletagmanager.com before Accept, and the visit in GA4 Realtime after it; /imprint/ needs the address first."

steps:
  - id: config
    action: "site.json analyticsId and legal; eleventy.config.js computes the analytics and imprint flags, ignores the templates that are off, prints the off lines."
  - id: banner
    action: "base.njk banner, script tag and footer links behind the flags; consent.js.njk; banner styles in styles.css with reduced motion and 400px."
  - id: pages
    action: "privacy.njk and imprint.njk, each opening with a one-line draft comment."
  - id: check
    action: "check-links.mjs takes an optional root; check-consent.mjs proves both states; postbuild runs both."

tests:
  - "npm run build in website: link check and check-consent pass for the committed state and the three fixtures."

done:
  - "Without site.legal: the build prints the analytics off line, _site has no googletagmanager reference, no privacy page, imprint or footer links."
  - "With name and email: every page carries the consent dialog, gtag appears only in consent.js, /privacy/ renders and is in the sitemap, no imprint."
  - "With an address as well: /imprint/ renders, is linked from the footer and listed in the sitemap."
  - "Website build green; build green, full suite green, dashboard gen/test/build green."
