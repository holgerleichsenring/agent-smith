# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-25-c5a7h
goal: "A command run by the in-process sandbox no longer inherits the server's or CLI's secrets — by declared name, by every secret the server manifest injects, and by known secret value."

applies_to: "default (InProcessSandbox, InProcessSandboxFactory, CLI SecurityTrend and CompileWiki commands)"

requires: []

facts:
  - claim: "An in-process step's ProcessStartInfo inherits the whole host environment and only adds HOME, git settings, cache paths and the step's Env."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:148-189"
  - claim: "In-process is the server's backend when SANDBOX_TYPE says so or no cluster and no Docker socket is found, and the CLI's."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/ServerSandboxExtensions.cs:83-97"
  - claim: "Three production sites construct it."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandboxFactory.cs:24-25, src/backend/AgentSmith.Cli/Commands/SecurityTrendCommand.cs:52-53, src/backend/AgentSmith.Cli/Commands/CompileWikiCommand.cs:73"
  - claim: "The canonical agent secret names (model, git host, tracker keys, REDIS_URL) are one list; AgentSecretNames.For adds every api_key_secret but throws on a name that cannot be a Kubernetes key, and has no production caller today."
    evidence: "src/backend/AgentSmith.Contracts/Constants/AgentSecretBinding.cs:11-25, src/backend/AgentSmith.Contracts/Constants/AgentSecretNames.cs:29-46"
  - claim: "SecretMasker refuses to treat values under six characters as secrets."
    evidence: "src/backend/AgentSmith.Contracts/Runs/SecretMasker.cs:23, src/backend/AgentSmith.Contracts/Runs/SecretMasker.cs:44-46"
  - claim: "Thirty-four test sites construct InProcessSandbox directly."
    evidence: "observed: grep -rn 'new InProcessSandbox(' tests on 9237b8921 counts 34 in 28 files, 2026-10-25"
  - claim: "The server deployment injects further credentials no binding names: database connection, webhook secrets incl. JIRA_WEBHOOK_SECRET, Slack tokens."
    evidence: "deploy/k8s/8-deployment-server.yaml:55, deploy/k8s/8-deployment-server.yaml:85-93, deploy/k8s/8-deployment-server.yaml:100, deploy/k8s/8-deployment-server.yaml:121"
  - claim: "Some are read straight from the environment by the server."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Webhooks/WebhookSecretResolver.cs:17-19, src/backend/AgentSmith.Server/Services/Adapters/ChatAdaptersExtensions.cs:35, src/backend/AgentSmith.Server/Services/Adapters/ChatAdaptersExtensions.cs:58-59"
  - claim: "The configuration's secret values and registry tokens are known at run time through ISecretValues."
    evidence: "src/backend/AgentSmith.Contracts/Services/LoadedSecretValues.cs:17-23"
  - claim: "Git steps bring their token in Step.Env, applied after the inherited environment."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:19-22, src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:186-187"
  - claim: "InProcessSandbox is 409 lines under a 417 baseline."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:13"

scope:
  in: >
    Follows 2026-09-28-ef94; its list had drifted (AZDO_TOKEN no longer read, JIRA_WEBHOOK_SECRET added, the job
    spawners it cited are gone). InProcessStepEnvironment builds a step's environment: host env, minus (1) the
    declared names — AgentSecretBinding.All, each agent's api_key_secret read directly (not through
    AgentSecretNames.For, whose Kubernetes-key check would turn into a failure of every step), plus ServerSecretEnvNames (REDIS_URL, SANDBOX_REDIS_URL,
    AGENTSMITH_PERSISTENCE_CONNECTION, GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_TOKEN, AZDO_WEBHOOK_SECRET,
    JIRA_WEBHOOK_SECRET, SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, TEAMS_APP_PASSWORD, GH_TOKEN, GOOGLE_API_KEY) —
    and (2) any variable whose value equals a known secret value (ISecretValues.All) of six characters or more,
    SecretMasker's floor, so CI=1 or DOTNET_NOLOGO=true is never stripped; then the existing HOME, git
    and cache settings and the step's Env. InProcessSandbox takes it as a required constructor argument; the
    factory (now also taking ISecretValues and the config) passes the configured one, the 34 test sites pass
    InProcessStepEnvironment.Inherit explicitly, both CLI commands build one from the configuration they load (or names
    only when they load none). A test reads 8-deployment-server.yaml and fails when a secretKeyRef-fed variable
    is neither in ServerSecretEnvNames nor on a short named not-a-credential list (AGENTSMITH_AUTH_*,
    AGENTSMITH_PERSISTENCE_PROVIDER, AGENTSMITH_ADMIN_GRANT).
  out: >
    A host-env variable an operator's own nuget.config or .npmrc reads, whose value is a configured secret: it is
    stripped; the staged-auth path (SetupRegistryAuth) is the supported way and is unaffected (docs say so).
    Isolation: an in-process step runs as the server's user and can read /proc/$PPID/environ; this removes the
    values from what env, a build or a test prints, nothing more. The docs keep saying in-process has no isolation
    and is not for untrusted repositories. 2026-09-28-c657 (source names of ${NAME} secrets): the value-based
    strip covers the same values.

decisions:
  - key: "NAMES AND VALUES. Names catch what the server reads straight from env; values catch an operator secret whose source name nobody recorded."
  - key: "THE MANIFEST PINS THE LIST. The next secret added to the server deployment fails a test until it is declared, which is how the old list drifted unnoticed."

steps:
  - id: environment
    action: "ServerSecretEnvNames and InProcessStepEnvironment in Infrastructure/Services/Sandbox."
  - id: sites
    action: "InProcessSandbox required argument; factory and both CLI commands pass it."
  - id: pinned
    action: "Run `env` through a real InProcessSandbox with REDIS_URL, a model key and a known secret value set."

tests:
  - "InProcessStepEnvironment_DeclaredName_IsRemoved"
  - "InProcessStepEnvironment_VariableHoldingAKnownSecretValue_IsRemoved"
  - "InProcessStepEnvironment_StepEnvGitToken_IsStillApplied"
  - "InProcessStepEnvironment_OrdinaryVariable_IsKept"
  - "ServerSecretEnvNames_EverySecretFedManifestVariable_IsDeclaredOrNamedNotACredential"
  - "InProcessSandbox_RunEnv_PrintsNoSecret"

done:
  - "an in-process `env` step prints no declared or known secret, on the server and the CLI"
  - "in-process clone and push still authenticate"
  - "build green, full suite green"
