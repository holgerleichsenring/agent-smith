# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-14-dbcem
goal: "Each requires of a filed list of tickets also shows on the tracker — Dependency, Blocks, a related issue, GitHub's blocked-by or a comment — and a link the tracker refuses is a filing note."

applies_to: "backend (the ITicketRequiresLink port with its refusing default, its four tracker classes, its construction beside the other ticket capabilities, and the TicketGraphLinks pass the graph filing runs over its created tickets)"

requires: [2026-10-14-dbcel]

