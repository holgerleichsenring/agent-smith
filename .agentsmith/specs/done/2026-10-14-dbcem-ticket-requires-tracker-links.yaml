done:
  - "After a list of tickets is filed, each ticket that requires another shows it on the tracker: a Dependency (predecessor) link on Azure DevOps, a Blocks link on Jira, a related issue on GitLab, GitHub's own 'blocked by' on github.com and GHES 3.20 or later, and an 'Agent Smith — requires #A (must merge first)' comment on an older GitHub."
  - "When filing fails part-way, the tickets that were created show their requires on the tracker all the same."
  - "A link the tracker refuses leaves the filing successful, and the filing notice names both tickets by the key the tracker shows (DPG-12 on Jira, #412 elsewhere), says why in a short class (not authorized, refused with its HTTP code) with no host or organisation in it, and says the requirement still holds the ticket."
  - "When the tracker stops answering during linking, the filing notice still arrives within about a minute and names, in one note, every requirement that was not linked, saying they hold the tickets anyway."
  - "On a live Jira site, a filed requirement reads '<required> blocks <dependent>' in the issue's links (checked by hand on Jira Cloud, and on Data Center when one is reachable; the result is recorded in decisions/2026-10-14-dbcem.yaml)."
  - "Removing or adding a link on the tracker by hand changes nothing about when a ticket may start."
  - "Build green, full suite green, dashboard gen/test/build green."
