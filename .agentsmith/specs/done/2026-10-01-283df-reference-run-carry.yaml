# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-01-283df
goal: "An approval cites the conversation's uploaded sets; the run writes each into its own directory outside the commit just before the master, names them, and may render them."

applies_to: "backend (approval record, conversation delete, a code-preset step, sandbox agent search scope, project config, run footprint, coding tool surface), dashboard (one config field)"

requires: ["2026-10-01-283de"]

facts:
  - claim: "The approval record is positional; new fields are appended LAST so an insertion cannot compile in silence."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecApprovalRecord.cs:27-57"
  - claim: "The recorder builds the record from the conversation state; the approval carries the conversation id, the same id the images are keyed on."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedPhaseSetRecorder.cs:71,82-84; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnRunner.cs:55"
  - claim: "The record travels as a JSON string on the initial context; the store is the fallback for a process that has one."
    evidence: "src/backend/AgentSmith.Contracts/Commands/ContextKeys.Spec.cs:96-104; src/backend/AgentSmith.Application/Services/Specs/ApprovedSpecSetResolver.cs:13-18; src/backend/AgentSmith.Application/Services/Specs/ApprovedSpecSetCarrier.cs:13-16"
  - claim: "A conversation delete keeps the approved set, because a filed ticket whose set is gone is refused forever."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogConversationDeleter.cs:14-18"
  - claim: "The commit stages with `git add -A` and force-stages the run record."
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:41-54"
  - claim: "Grep (both engines) and directory_tree skip a fixed list of directory names wherever they appear in a path, even under the step's own root."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/GrepScope.cs:17-38; src/backend/AgentSmith.Sandbox.Agent/Services/RipgrepArguments.cs:40; src/backend/AgentSmith.Sandbox.Agent/Services/DirectoryTreeStepHandler.cs:17-21,93"
  - claim: "PhaseSequence runs the master per derived phase, after ProbeTarget."
    evidence: "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.Code.cs:61-66"
  - claim: "Admission reserves a run's footprint, one pod per repo and toolchain image; nothing else is counted."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/RunFootprintCalculator.cs:7-30; src/backend/AgentSmith.Contracts/Sandbox/ICapacityBudget.cs:15-25"
  - claim: "The project's sandbox block is operator config, edited in the studio's sandbox section."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/SandboxConfig.cs:12-92; src/dashboard/src/components/config/ProjectSandboxSection.tsx"

scope:
  in: >
    SpecApprovalRecord.References (set ids), appended last; the recorder fills it with the conversation's
    site sets at approval time. The conversation delete keeps every set an approval cites. MaterializeReferenceSets,
    a code-preset step inserted directly before PhaseSequence: each cited set goes from the store into the
    carrying repo's sandbox at .agentsmith/reference/<setId>/<relative path> (its own directory, so two
    sets named alike never collide; the prompt shows name and id), text as-is, binaries through one python3
    decode step; .agentsmith/reference/ is appended to .git/info/exclude, so neither `git add -A` nor the
    run-record force-stage picks it up. Search scope: GrepScope gains a ROOTED exclusion,
    .agentsmith/reference, skipped when the step's root lies outside it and searched when the root is
    inside, in ripgrep, the managed fallback and directory_tree; the Summary text names it. The paths are
    published on ContextKeys.ReferenceSets and rendered by ReferencePromptSection. A run whose record
    cites sets and whose process has no reference store FAILS this step naming the sets and the reason.
    TOOL SURFACE from config: SandboxConfig.Browser.Enabled (project, default false, a toggle in the
    studio's sandbox section); when on, render_reference joins the coding surface and the run's footprint
    adds a browser pod at the browser profile, so admission reserves it.
  out: >
    Carrying sets through the tracker: GitHub issues have no attachment API. Retention after the ticket is
    satisfied — the approved set has no delete path either. Comparing — 2026-10-01-283di.

decisions:
  - key: "THE APPROVAL FREEZES THE LIST. What the person approved is what the run builds against; a later upload needs a new approval."
  - key: "OUTSIDE THE COMMIT, INSIDE THE TREE. Reachable by the master's path tools, excluded from git so a 25 MB website never lands in the pull request, and out of whole-repo searches unless asked for."
  - key: "A CITED SET THAT CANNOT BE READ FAILS THE STEP. Building silently without the approved reference is the failure this series removes."
  - key: "CONFIG DECIDES THE BROWSER. A run's capacity is reserved before it starts, so whether it may spawn a browser cannot depend on what the model asks for later."

steps:
  - id: record
    action: "SpecApprovalRecord.References (last); SpecApprovalJson round-trips it; ApprovedPhaseSetRecorder fills it."
  - id: delete
    action: "SpecDialogConversationDeleter sweeps only uncited sets."
  - id: step
    action: "CommandNames.MaterializeReferenceSets + handler before PhaseSequence; ReferenceSetMaterialiser shared with 283dc."
  - id: scope
    action: "GrepScope rooted exclusion; RipgrepArguments, the managed walk and DirectoryTreeStepHandler apply it."
  - id: config
    action: "BrowserSandboxConfig.Enabled on the project sandbox block; studio toggle; RunFootprintCalculator adds the browser pod; RenderReferenceToolFactory reads the flag."

tests:
  - "SpecApprovalJson_References_RoundTrip"
  - "ConversationDelete_CitedSet_Survives_UncitedSetIsSwept"
  - "MaterializeReferenceSets_TwoSetsNamedAlike_LandInTwoDirectories"
  - "MaterializeReferenceSets_NoStoreButCitedSets_FailsNamingThem"
  - "CommitAndPR_AfterMaterialize_StagesNoReferenceFile"
  - "Grep_FromRepoRoot_SkipsReferenceDirectory_FromInsideIt_SearchesIt (both engines)"
  - "RunFootprint_BrowserEnabled_AddsABrowserPod"
  - "ProjectSandboxSection: the browser toggle round-trips"

done:
  - "a run filed from a conversation with an uploaded site greps its stylesheet under .agentsmith/reference/<id>/ and its PR carries none of those files"
  - "build green, full suite green, dashboard tests green"
