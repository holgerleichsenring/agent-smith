# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-fbbdb
goal: "A context may declare the formatter its repository already runs; the spec commit runs it over the files the spec changed, so layout is the repository's formatter's job, never a criterion or a gate."

applies_to: "backend (context.yaml contract, spec commit) and skills catalog (project-bootstrap)"

requires: [2026-10-06-8565d]

facts:
  - claim: "A context declares verify stages, each a command run through /bin/sh -c at the repository root, with an optional when_present path."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlVerifyStage.cs:19-27, src/backend/AgentSmith.Application/Services/Handlers/VerifyCommandRunner.cs:52-55"
  - claim: "The spec commit pushes through the checkpointer, then judges structure and returns that outcome."
    evidence: "src/backend/AgentSmith.Application/Services/SpecExecution/CommitSpecWorkHandler.cs:41-44"
  - claim: "A context field reaches a sandbox through the read shape, the serializer and RemoteContextDiscovery; the writer tool builds a typed ContextYamlDocument; an undeclared key is dropped."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/ContextYamlReadShape.cs:3-8, src/backend/AgentSmith.Infrastructure/Services/ContextYamlSerializer.cs:53-69, src/backend/AgentSmith.Contracts/Sandbox/RemoteContextDiscovery.cs:29-51, src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlDocument.cs:16-39"
  - claim: "The context schema refuses unknown root keys, and the writer tool lists the fields a model may write."
    evidence: ".agentsmith/context.schema.json:11, src/backend/AgentSmith.Application/Services/Tools/WriteContextYamlToolDescription.cs:14-16"
  - claim: "A spec's start head is known per sandbox, and the gate already lists changed paths without deletions plus untracked files."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecStartHeads.cs:48, src/backend/AgentSmith.Application/Services/Structure/StructureGitReads.cs:17-23"
  - claim: "observed: 'dotnet format whitespace --folder --include <files>' formats only the listed files but does not wrap a long line under max_line_length."
    evidence: "observed: 2026-10-13, scratch run with SDK 10.0.100"
  - claim: "The bootstrap master adopts the gate a repository already has and declares nothing it would have to guess."
    evidence: "observed: 2026-10-13, agent-smith-skills origin/main 6c04986, skills/_masters/project-bootstrap/SKILL.md:161-195"

scope:
  in: >
    context.yaml gains optional 'format': { command, when_present }; the command must hold '{files}', replaced by the
    shell-quoted repository-root-relative paths the spec changed (StructureGitReads against SpecStartHeads; no head
    or no file, no run) under the declaring context's workdir, run records excluded. ContextYamlDocument, read
    shape, serializer, summary, RemoteContextDiscovery (by name), schema and writer description carry it; the
    workdir-command check covers it. CommitSpecWork runs each distinct (command, files) once per sandbox before
    PushNowAsync through the verify command runner; a non-zero exit (127 included) is logged and prepended to the
    step note, never failing. SKILLS: project-bootstrap declares the REWRITING form of a formatter the repository
    already runs (CI or scripts), naming the file, with binaries addressed from the root; none, nothing. Release, pin.
  out: "Choosing a formatter for a repository that runs none; files the spec did not change; check-mode commands."

decisions:
  - key: "ONLY THE SPEC'S FILES, ONLY THE REPOSITORY'S OWN FORMATTER. A repository-wide or invented reformat drags untouched code into the diff, the secret scan and the structure baseline."
  - key: "BEFORE THE PUSH, NEVER FAILING. The branch carries formatted code and the gate measures it; a missing tool says so and leaves the work."

steps:
  - id: contract
    action: "ContextYamlFormat on ContextYamlDocument; read shape, serializer, summary, RemoteContextDiscovery, schema, writer description, workdir check."
  - id: commit
    action: "SpecFormatRun used by CommitSpecWorkHandler before the push; its note prepended to the step result."
  - id: skills
    action: "project-bootstrap declares format; release; pin."

tests:
  - "RemoteContextDiscovery_FormatDeclared_CarriesIt"
  - "WriteContextYaml_FormatWithoutFilesPlaceholder_IsRefused"
  - "SpecFormatRun_FilesPlaceholder_GetsChangedPathsOfItsWorkdir"
  - "CommitSpecWork_FormatDeclared_RunsBeforePush"
  - "CommitSpecWork_FormatFails_CommitsAndSaysSo"
  - "CommitSpecWork_NoChangedFile_RunsNothing"

done:
  - "A harness run over a context declaring format sees it run with the changed paths before the checkpoint push."
  - "Full suite green."
