done:
  - "A spec whose review ends on REFUSE parks the ticket once, after the specs before it are built, with a comment headed as a reviewer's objection to that spec, quoting the finding and its file:line and naming the reading the run takes."
  - "A run that ends before its question was posted does not count as having asked: the next run tells no reviewer and no ticket that a question went unanswered, and asks it afresh."
