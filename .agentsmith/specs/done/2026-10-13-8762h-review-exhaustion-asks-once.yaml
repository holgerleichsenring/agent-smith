assumptions:
  - "2026-10-13-8762g's loop returns per spec its standing verdict, its admitted findings with their file:line evidence and its residues; its handler walks the tail in order and ends in one place this spec adds one call to; its outcome says whether a spec's loop was cut short by the budget (a budget stop) rather than ending on its rounds or a second REFUSE; it ships SpecReviewRevision.PublishAsync(pipeline, replacements, cause, ct, handback = null) and ContextKeys.SpecSequenceStop = SpecSequenceStop(BeforeSpecId, Reason, Park), where Park true seeds the stop spec HandedBack and appends SpecHandback after the last block."
  - "A reviewer told in its prompt that the author was asked and stayed silent mostly does not raise the objection again; the mechanical rule below does not depend on it."
  - "2026-10-13-8762k builds the series' StandingObjection with SpecId null and SeriesPrefixHead = the first member of the cleared prefix it reviewed (review 8762k r3 cut 4)."

scope:
  in: >
    RULE: ReviewExhaustion.Decide(objections, pipeline) -> the objections to ASK (empty = proceed), called ONCE by
    ReviewSpecsHandler after the tail's review, over the UNION of the per-spec standing objections and
    2026-10-13-8762k's series objections (SpecId null; k never calls Decide itself). A StandingObjection is (SpecId?,
    Findings with evidence), the admitted REFUSE findings a loop ended on BY SPENDING ITS ROUNDS OR BY A SECOND REFUSE —
    never a loop 8762g's budget cut short (its outcome's budget stop) — and only for specs BEFORE an existing
    SpecSequenceStop (g's spent share); series objections are always considered. Decided per objection from the ticket thread
    only: ASKED = a comment of ours carries ReviewObjectionComment.MarkerFor(objection.MarkerKey), where
    StandingObjection(SpecId?, Findings, SeriesPrefixHead?) has MarkerKey = SpecId ?? "series:" + SeriesPrefixHead, so a
    series objection on a later prefix asks again. An objection already asked PROCEEDS, answered or not (named in the
    step's line, the spec built); the answer, if any, is read by the next derivation through its Comment or TicketEdit
    cause (RE-TRIGGER below); every objection not yet asked is asked.
    ContextKeys.SpecQuestionPin is NOT the basis (it is set for any unanswered Question and lives one run). ASK: ONE
    question for the objections to ask: ReviewObjectionQuestion.For builds SpecHandback(Question, reason = each
    objection's spec id (or 'the series'), finding and evidence line, readings ['build the spec as reviewed; the
    objection stays on record', 'change the spec as the objection asks'], Taken 0) with QuestionKind = ReviewObjection;
    ReviewSpecsHandler publishes the set with its reviewed specs and that hand-back through 8762g's
    SpecReviewRevision.PublishAsync(…, handback) (cause 'spec review: a standing objection asked once'). PARK AT THE
    EARLIEST ASKED SPEC: when it is the first spec of the tail, or the objection is the series' own, the handler returns
    OkAndContinueWith(SpecHandback) as ScopeRefusalRecorder does; otherwise it sets SpecSequenceStop(specId, reason,
    Park true), so the specs before it are built and the run parks there. A park never moves an existing stop later:
    the asked spec is always before g's stop (the rule above), and at equal position Park true wins. The ask-and-park
    branches live in ReviewObjectionPark.ApplyAsync(pipeline, ask, ct) (Services/Specs/Review, registered in
    SpecReviewRegistrations), so ReviewSpecsHandler gains one line. SpecGate gates
    a set whose hand-back is a ReviewObjection question like an unhanded one (CurrentSpec = the first spec). Standing
    cuts the reviser could not apply never ask. KIND: enum SpecQuestionKind { Reading = 0, ReviewObjection = 1 } in its
    own file; SpecHandback.QuestionKind (init, default Reading). PERSISTED: SeriesManifestDocument.HandbackQuestionKind
    (string, null reads Reading); SeriesManifest writes and reads it. COMMENT: ReviewObjectionComment (Marker 'a
    reviewer's objection to the spec stands', MarkerFor(id) 'a reviewer's objection to spec {id} stands', Build) in
    its own file; the comment carries the heading Marker and one MarkerFor line per objected spec;
    SpecHandbackComment's Question arm dispatches on the kind. MARKER registered in OwnTicketComment.AwaitingAnswer, ConversationAssembly.HandbackHeadings and
    SpecHandbackHandler's park line. PIN: for a ReviewObjection hand-back UnansweredQuestionPin sets the pin and returns the
    question ONLY when ReviewObjectionComment.AskedAndUnanswered(pipeline) holds, else null (no pin, no proceed
    notice); the Reading kind is unchanged. UnansweredQuestionPromptSection renders the review kind as 'the author was
    asked about this objection and did not answer; keep the spec as it stands, do not change it for this objection and
    do not raise it again'; ReviewSpecsHandler hands ContextKeys.SpecQuestionPin to every 8762e reviewer call as
    SpecAttackInput.QuestionPin, appended LAST (after NotChecked, CitationsTotal and PriorResidues), and the attack
    prompt renders it. ASKED AND UNANSWERED = our comment carrying ReviewObjectionComment.Marker EXISTS on the ticket and
    OwnTicketComment.IsAnswered(comments, Marker, PrNotes(pipeline)) is false. RE-TRIGGER: after continuation.Decide,
    SpecSourceResolver makes ONE call, ReviewObjectionSource.Decide(set, cause, pipeline, foreign) (static, beside
    ReviewObjectionComment): a branch set whose hand-back is a ReviewObjection question ALWAYS continues with Handback
    null; NeedsModel is forced false only when cause == SpecRevisionCause.Retrigger and AskedAndUnanswered holds; in
    every other case SpecAmendmentRule.NeedsModel(cause, strippedSet, foreign) decides, so a derivation sees the
    previous cut and its executed head; any other set goes to the amendment rule as today. SpecAmendmentRule is not
    changed.
    RETIRE: 2026-09-15-7d3c moves to specs/done with a RETIRED state.done line.
  out: >
    The rounds loop, the publisher's hand-back parameter and the sequence stop it parks through —
    2026-10-13-8762g. The derivation's own cut-review loop and its least-objected cut — nobody: contract §0 leaves
    SpecSetDeriver.cs:92-94 as it is. A set-scope standing refusal reaching this rule — 2026-10-13-8762k calls
    ReviewExhaustion with SpecId null. The design-turn refusal — nobody: shown on the card, not asked
    (2026-10-13-8762i). Showing the question on the ticket page — nobody: the page already renders a question hand-back
    by its case (flowWords.ts:39). A fifth or eighth hand-back case — nobody: refused below. Persisting Cites — nobody:
    the evidence line is quoted in the reason, which is persisted. Holding the automatic next attempt while the question
    stands — 2026-10-13-8762v (a hand-back is one of its holds). The ticket page reading the gate 'skipped' while the prefix of a review-objection set builds — 2026-10-13-8762l, which publishes that cut's case as ReviewObjection (SpecCutContent.CaseOf) and reads the gate from the gate step for that case; until it lands the page shows the gate skipped and the hand-back from the revision on.

decisions:
  - key: "ABSORBS 2026-09-15-7d3c. Kept: a standing code-grounded objection asks once and proceeds on silence; the taken reading is 'build it'; a question, never a new case, because TakenReading and the pin need Case == Question; the hand-back names which question it is and the comment tells the truth instead of 'the ticket reads two ways'; the pin reaches the reviewer as an explicit argument; the marker is registered everywhere a marker is read; the field is additive. Changed: it applies to the new loop's exhaustion, not to LeastObjectedCut (contract §0); the marker sits in FOUR places; the persistence site is the series manifest."
  - key: "ASKED ONCE IS READ FROM THE THREAD, PER SPEC. Our own objection comment naming that spec is the fact 'asked' — already on the ticket, so nothing is stored twice. The run-scoped pin is not the basis: it is set for any unanswered Question (a Reading question too) and lives one run (review 8762h finding 1). A NEW objection on another spec, or a series objection on a later prefix (marker key 'series:' + the prefix's first member, review 8762k r3 cut 4), still asks once. Main-thread decision 7, default, pending operator ratification."
  - key: "AN ASKED OBJECTION PROCEEDS, ANSWERED OR NOT (review 8762h r3 cut 3). Asking again after an answer had no loop bound: an author answering 'build it' would be parked every run, so only silence ended the asks. The answer is read by the next derivation on its Comment or TicketEdit cause instead. Trade-off: a new objection on a spec rewritten from the answer proceeds without a second ask. Re-asking would need a stated bound (once per answer, never on unchanged text). Main-thread decision for h, default, pending operator ratification."
  - key: "THE PASSING PREFIX IS BUILT FIRST. A REFUSE on spec n of an attempt builds specs 1..n-1 and parks at spec n, as the supervised session took a refused spec back without stopping the specs that passed (review 8762h finding 4). The park inside the sequence is the existing mechanism MasterOpenQuestions uses. The whole tail is still reviewed first (within 8762g's review share) so ONE Decide over the union of spec and series objections (2026-10-13-8762k) asks every standing objection in one question; a series objection parks before any spec is built. Main-thread decision 7, default, pending operator ratification."
  - key: "RE-TRIGGER BUILDS THE REVIEWED SET UNCHANGED. The taken reading is 'build the spec as reviewed', so a bare re-trigger over an asked, unanswered objection re-derives nothing (review 8762h cut 2): the branch set is used with its hand-back cleared, ReviewSpecs re-reviews the tail, and the objection, if raised again, proceeds by the thread rule. REJECTED: 'AN UNANSWERED REVIEW QUESTION IS RE-DERIVED ON THE PIN' — it paid a full derivation and could replace the reviewed text the pin tells the deriver to keep. Main-thread decision 7."
  - key: "ONLY EXHAUSTED LOOPS ASK, NEVER PAST g's STOP. A loop the budget cut short has not had its rounds or its re-derivation, so asking about it is premature (contract decision 4 asks 'when the rounds run out'); an objection after g's stop would move the stop later and build unreviewed specs between. Decide therefore takes only loops that spent their rounds or ended on a second REFUSE, only for specs before an existing stop, and a park never moves a stop later; at equal position Park true wins. Main-thread decision 3, review 8762h r2 cut 1."
  - key: "RE-TRIGGER REQUIRES THAT WE ASKED, AND THE HAND-BACK IS ALWAYS STRIPPED. The hand-back reaches the branch at ReviewSpecs time but the comment only at SpecHandback (SpecHandbackHandler.cs:79), after the prefix; a run that dies before it leaves a question nobody was asked. The review hand-back is a question about a set we keep, so it never reaches the amendment rule or the deriver as 'handed back': kept, it would hide the previous cut from the deriver (PreviousCutPromptSection.cs:24) and, on a set used unchanged, be republished and park again over an answer (SpecSetPublisher.cs:77-78). Only a bare re-trigger over an asked, unanswered objection is forced unchanged; a ticket edit or a comment follows the amendment rule (SpecAmendmentRule.cs:52-56), so an author who answers by editing the ticket is heard. The arm sits after continuation.Decide, whose approval already clears the hand-back (ApprovedContinuation.cs:42). Main-thread decision for h, review 8762h r3 cut 2."
  - key: "THE PIN ONLY FOR WHAT WAS ASKED. UnansweredQuestionPin reads the branch's previous set whatever the resolver decided (DeriveSpecHandler.cs:77) and counts an unanchored thread as unanswered; for a never-posted objection it would tell every reviewer not to raise it and post that a question nobody saw went unanswered. The review kind therefore pins only on AskedAndUnanswered, which also counts an answer on the pull request (UnansweredQuestionPin.cs:34 passes none today). Review 8762h r3 cut 1."
  - key: "NOTE FOR 2026-10-13-8762g (review 8762h r3 finding 4, not h's claim): a parked attempt never reaches WriteRunResult and CommitAndPR (PipelinePresets.Code.cs:70-71, PipelineExecutor.cs:166), so a FailingCommand row for a Park stop is never rendered; h's done lines do not depend on the code PR — the prefix reaches the branch through CommitSpecWork."
  - key: "REJECTED CUT (review 8762h r2 cut 3, gate view in place): 'TicketSeriesReader.Gate returns skipped only when the run has no GateSteps status' — SpecGate answers Ok for every handed-back set it passes through (TicketSeriesReader.cs:55), so that change would show a classic hand-back's gate as 'passed'; the published cut carries only the case string (SpecCutContent.cs:20-21), not the question kind, so telling the two apart is a ticket-page change, named as an out-item for 2026-10-13-8762l, the reviewer's own alternative."
  - key: "ONE HELPER FOR THE PARK. The publish-with-hand-back, the SpecHandback splice and the Park-true stop are three branches; they live in ReviewObjectionPark so ReviewSpecsHandler stays within g's budget with one line for h (contract §2.4). Main-thread decision 3, review 8762h r2 cut 4."
  - key: "ONE DECIDE, THE UNION. Spec and series objections go through one call, so a ticket parks once per run with every objection the author must see; k's series round runs before it, inside the review share."
  - key: "THE HAND-BACK RIDES 8762g's PUBLISHER. SpecReviewRevision.PublishAsync gains handback = null (2026-10-13-8762g), so the set on the branch carries the question the next run reads, through the one mid-run publisher (review 8762h cut 3)."
  - key: "THE SPECS STAY BESIDE THE QUESTION. ScopedContextQuestion clears the specs because its question is about the cut; this one is about a spec the author must be able to read, and the comment links the spec pull request. Clearing would also drop an executed head."
  - key: "SPECGATE GATES A REVIEW-OBJECTION SET. With the hand-back on the set before the sequence, SpecGate's pass-through (SpecGateHandler.cs:33-36) would leave no CurrentSpec for the specs before the park; a review objection is the one hand-back that still builds a prefix."
  - key: "UNAPPLIED CUTS NEVER ASK. Only a REFUSE says the spec should not be built as written. Contract decision 4, default, pending operator ratification."
  - key: "ROOM AT THE LIMIT. SpecHandbackComment stays at 120 by compressing its class summary by the lines the dispatch adds; SpecHandbackHandler stays at 120 because the Question arm's two lines become one naming the heading of the kind; SeriesManifest grows 118 -> at most 120, and 2026-10-13-8762j's contract key then joins an existing initializer line, net zero; SpecSourceResolver 117 -> at most 120 (the helper call replaces the amend line and the later uses read the stripped set in place); UnansweredQuestionPin 47 -> about 50."

steps:
  - id: kind-persist
    action: "SpecQuestionKind (own file); SpecHandback.QuestionKind (109 -> about 112); SeriesManifestDocument.HandbackQuestionKind (49 -> 50); SeriesManifest writes and reads it (118 -> at most 120); an old manifest reads Reading."
  - id: question
    action: "StandingObjection (SpecId?, Findings, SeriesPrefixHead?, MarkerKey), ReviewObjectionQuestion.For and ReviewObjectionComment (Marker, MarkerFor, Build, AskedAndUnanswered), each its own file under Services/Specs/Review."
  - id: markers
    action: "SpecHandbackComment's Question arm dispatches on the kind (stays at 120); UnansweredQuestionPin pins a ReviewObjection hand-back only on AskedAndUnanswered (47 -> about 50); OwnTicketComment.AwaitingAnswer (93 -> 94); ConversationAssembly.HandbackHeadings (72 -> at most 73); SpecHandbackHandler's park line (stays at 120)."
  - id: pin
    action: "UnansweredQuestionPromptSection renders the ReviewObjection kind (28 -> about 40); SpecAttackInput (8762e) gains QuestionPin, appended last; SpecAttackPrompt renders it; ReviewSpecsHandler passes ContextKeys.SpecQuestionPin to every reviewer call."
  - id: rule
    action: "ReviewExhaustion.Decide over the union of spec and series objections: an objection whose MarkerFor(MarkerKey) comment exists proceeds, every other is asked (at most 60 lines)."
  - id: park
    action: "ReviewObjectionPark.ApplyAsync (at most 70 lines): on a non-empty ask, publish with the hand-back through SpecReviewRevision, then splice SpecHandback (first spec of the tail or a series objection) or set SpecSequenceStop with Park true at the earliest asked spec, never later than an existing stop; ReviewSpecsHandler gains one line after the tail (and k's series round) calling Decide and the park; SpecGate gates a ReviewObjection set (56 -> at most 60)."
  - id: retrigger
    action: "ReviewObjectionSource.Decide (static, Services/Specs/Review): a ReviewObjection hand-back is always stripped; NeedsModel false only for Retrigger + AskedAndUnanswered, else SpecAmendmentRule on the stripped set; SpecSourceResolver calls it once after continuation.Decide (117 -> at most 120); SpecAmendmentRule untouched."
  - id: registration
    action: "ReviewExhaustion and ReviewObjectionPark in Services/Specs/Review/SpecReviewRegistrations.cs."
  - id: retire
    action: "Move 2026-09-15-7d3c-review-objection-asks-once.yaml to specs/done; its state.done line starts 'RETIRED (2026-10-…, superseded before it was built by 2026-10-13-8762h)'."
  - id: tests
    action: "Red first, then green, for every test below; run the Specs, Prompts, Handlers and Server Tickets classes touched."

