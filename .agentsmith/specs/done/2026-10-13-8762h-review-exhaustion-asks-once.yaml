spec: 2026-10-13-8762h
goal: "A REFUSE standing after the review rounds asks the author once, after the specs before it are built; once asked it proceeds, and any answer is read by the next derivation."

applies_to: "backend (ReviewSpecs' exhaustion rule decided from the ticket thread, a question hand-back of its own kind, its comment, per-spec marker, pin and persisted field, the park at the objected spec, the re-trigger that builds the reviewed set unchanged) + the attack reviewer's input"

requires: [2026-10-13-8762g]

