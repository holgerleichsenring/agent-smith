  - "PrReviewThreads_EveryHost_CarryHostIds"
  - "PrReviewActs_EveryHost_CarryHostIds"
  - "PrReviewRecordRefresh_UpsertsEntriesOncePerHostId"
  - "PrReviewEntry_DecisionAndReviewBody_OneRowPerHostId"
  - "PrReviewState_WithdrawnDecision_ReadsNone (GitHub dismissed, Azure DevOps reset, GitLab unapproved)"
  - "PrReviewEntry_SystemNote_StoredWithIsSystem"
  - "PrReviewRecordRefresh_RecordNoRunNames_IsDeleted"
  - "PrReviewRecordRefresh_SupersededPr_StillReachesClosed"
  - "PrReviewRecordRefresh_LeaseExpiredMidRefresh_OlderReadNeverOverwritesNewer"
  - "PrReviewRecordRefresh_HostFailure_WritesUnread_HandlerDispositionStands"
  - "RefreshNudge_HostFailure_FinishesWithoutRetryLoop"
