# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-18-dafc
goal: "A secret card in the Config studio names the registries whose token references it, so a feed token in use no longer reads 'not referenced yet'."

applies_to: "dashboard (EntityCard secretUsers, ConfigStudio secrets list)"

facts:
  - claim: "secretUsers counts agents, trackers, connections, mcp-servers and design-sources only; registries are a settings singleton, not part of the catalog."
    evidence: "src/dashboard/src/components/config/EntityCard.tsx, src/dashboard/src/lib/configApi.ts (RegistryEntry, fetchSetting)"
  - claim: "A registry token holds the operator's reference syntax, e.g. ${feed_token}, resolved through the secrets dict."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/RawRegistryEntry.cs"

scope:
  in: "The secrets list reads the registries setting once; a card names each registry (by host) whose token is ${id} or the bare id."
  out: "Other settings that may name a secret; changing how tokens are stored or resolved."

steps:
  - id: users
    action: "EntityCard takes optional registries; secretUsers adds 'registry <host>' for a token referencing the secret; ConfigStudio fetches the registries setting when the secrets list is shown."

tests:
  - "EntityCard test: a secret referenced by a registry token reads 'used by registry <host>'; an unreferenced one still reads 'not referenced yet'."

done:
  - "A registry token secret shows its registry on the Secrets page."
