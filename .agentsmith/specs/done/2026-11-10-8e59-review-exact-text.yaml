  - "OutcomeConfirmer_ApproveWithNotReviewed_Confirms"
  - "ReviewSpecs_ApprovedButNeverReviewed_IsReviewedBeforeBuilding"
  - "ReviewSpecs_ExactTextReviewedClean_IsSkipped"
  - "ReviewSpecs_TextChangedAfterItsCleanReview_IsReviewedAgain"
  - "SpecReviewConfigValidator_InvalidBlock_IsABlockingFinding"
  - "ConfigImportPlanner_InvalidSpecReviewBlock_IsRefused"
  - "ProposalReview_BuildOnTheCurrentText_IsRecordedAsReviewedClean"
  - "ProposalReview_CutsAppliedAfterTheLastRound_AreNotReviewedClean"
  - "ProposalReview_CarriedDraftUnchanged_KeepsItsCleanReview"
  - "FiledSeriesFactory_CleanReview_FollowsTheRenamedDraft"
  - "ProposalReview_InvalidSettings_ReviewsNothingAndMarksTheDrafts"
  - "ReviewLoop_NoReviewerAnswersInAnyRound_IsStoppedLikeTheBudget"
  - "ReviewLoop_NoAnswerThenBuild_IsClearedInTheNextRound"
  - "ReviewLoop_LastRoundRefuseRewritten_IsNotClearedAndAsksTheAuthor"
  - "ReviewLoop_CutsAppliedAndRevisedTextEvidenceClean_IsAttackedOnceMore"
  - "ReviewLoop_RoundsSpentOnAnUnattackedText_IsNotClearedAndAsksTheAuthor"
  - "ReviewSpecs_EveryMemberCleanButNotTheContract_AttacksTheContract"
  - "ReviewSpecs_EveryMemberAndTheContractClean_SkipsTheReview"
  - "ReviewedText_Contract_SurvivesTheManifestRoundTrip"
  - "ReviewedText_CleanReview_SurvivesFilingTheBranchWriteAndTheRunsRead"
  - "SpecFactRegrounding_TokenAlsoInTheClaim_RewritesOnlyTheEvidence"
  - "SpecDialogProposalReview_RoundsOff_SaysTheReviewIsTurnedOffAndPromisesNoReview"
  - "Exhaustion_UnansweredObjectionCommentForThisSpec_IsAskedAgain"
  - "Exhaustion_AuthorAnsweredBuildAsReviewed_Proceeds"
  - "Exhaustion_ObjectionAnsweredWithoutTheBuildReading_IsAskedAgain"
  - "Exhaustion_LaterAttemptUnansweredObjection_ReviewsAgainAndAsksAgain"
  - "Exhaustion_LaterAttemptAnsweredBuild_IsBuilt"
  - "Exhaustion_BuildAnswerOnAnotherSpec_AsksOnlyTheOther"
  - "Pin_ReviewObjectionUnanswered_PinsNothing"
  - "Question_ReviewObjection_SaysWhatSilenceDoes"
  - "ReviewSpecs_SeriesCutChangesAMember_AttacksItsNewTextBeforeBuilding"
  - "ReviewSpecs_SeriesCutChangesAMemberAndTheShareIsSpent_ItIsNotBuiltThisAttempt"
  - "ReviewSpecs_TwoMembersChangedAndTheShareSpent_StopsAtTheFirst"
  - "ReviewSpecs_ContractRoundNotTaken_StopsBeforeThePrefixWithTheReason"
  - "ReviewSpecs_SeriesCutThatCannotLand_RaisesAnObjection"
  - "Exhaustion_BuildAnswerOnAnEarlierText_DoesNotCoverTheReCut"
  - "ChoosesBuild_OnlyTheFirstLineKeywordCounts"
  - "ReviewObjection_TimedOutWithNobodyThere_BuildsNothing"
  - "ReviewObjection_EnterOnTheShownDefault_Builds"
  - "Demo_ReviewObjection_EnterOnTheShownDefault_CommitsTheFix"
  - "For_ReviewStoppedTheAttempt_NamesTheSpecAndTheReason"
  - "Exhaustion_LaterAttemptAnsweredBuild_BuildsThatTextWithoutFreshRounds"
  - "SeriesContractRound_SingleUnexecutedMemberAndNoCleanContract_IsStillTaken"
  - "ProposalReview_SeriesRoundSaysBuild_RecordsTheContractReviewedClean"

done:
  - when: "a person approves a proposal whose drafts are not all reviewed"
    then: "the approval is filed, and each draft shows not yet reviewed with its reason"
  - when: "a run starts on an approved spec no review ended clean on"
    then: "the spec is attacked before the master builds"
  - when: "a run starts on an approved spec whose exact yaml was reviewed clean"
    then: "the spec is not reviewed again"
  - when: "the spec's text changed after its clean review"
    then: "it is reviewed again before building"
  - when: "the spec_review block is invalid in the file, the store or an import"
    then: "it is refused at validation"
  - "Build green, full suite green, dashboard tests green."
