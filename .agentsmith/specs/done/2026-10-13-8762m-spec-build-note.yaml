spec: 2026-10-13-8762m
goal: "Each spec ends with a build note of what it renamed, moved, persisted and deviated from; the next spec's master, premise check and ticket page show it, and its prompt carries the fresh memory index."

applies_to: "backend (master record tools, spec record outcome block, spec-execution prompt, premise-check prompt, memory index, ticket series read) + the dashboard spec document + the coding-agent-master skill on the series' skills branch"

