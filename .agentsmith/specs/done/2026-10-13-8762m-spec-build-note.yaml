  - "MasterRecordToolHosts_Create_BuildsLogRecallRememberPerRepository"
  - "MasterToolComposition_CodingMasterWithSpec_CarriesHandForward"
  - "MasterToolComposition_ScanDesignAndChildSurfaces_CarryNoHandForward"
  - "HandForward_SecondCall_ReplacesTheNote"
  - "HandForward_OverBound_IsRefusedByName"
  - "HandForward_RenamedEntryWithoutArrow_IsRefusedByName"
  - "SpecOutcomeBlock_WithNote_RendersFourLists"
  - "SpecRecordBody_MasterRanWithoutNote_RecordsMissing"
  - "SpecRecordBody_AlreadySatisfiedRow_RecordsNoHandForwardKey"
  - "SpecBuildNoteReader_ExecutedSpecYaml_ReadsTheNote"
  - "PrecedingSpecs_NotesOf_ContextFirstThenRecordThenNoNote"
  - "SpecBuildNoteSection_OverBound_DropsOldestAndNamesTheirFiles"
  - "SpecExecutionPrompt_SecondSpec_ShowsFirstSpecsNote"
  - "PremiseCheckPrompt_AlreadyRan_RendersNotes"
  - "MemoryIndexReader_ResolvesThroughTheRealServiceProvider (integration)"
  - "Harness_TwoSpecSeries_SpecTwoMasterPromptCarriesMemoryRememberedInSpecOne (RealCompositionHarness + ScriptedChatClient.PromptsSeen; spec 1's script writes a file before it calls remember, because remember refuses a repository with no code change, MemoryWriteToolHost.cs:56-57, and the test asserts remember's answer says recorded)"
  - "AgenticMaster_DesignTurnAndScan_DoNotRereadTheMemoryIndex"
  - "TicketSeriesSpecComposer_ExecutedSpec_CarriesTheRecordsBuildNote"
  - "SpecDocument_RendersBuildNoteOrNoNote (dashboard)"
  - "LoadMemoryIndexHandler_DelegatesToTheReader_KeepsItsMessages"

done:
  - "A spec's specs/done/ file carries an outcome.hand_forward block listing what its master said it renamed, moved, persisted and deviated from."
  - "The next spec's master prompt and premise-check prompt show that note, including after the run parked and a new attempt resumed the series."
  - "A spec whose master made no hand_forward call is recorded as `missing`, the next spec is told 'no note', and the run goes on."
  - "A memory remembered while spec 1 ran appears in the user prompt spec 2's master is actually sent (harness), and no design turn or scan reads the index again."
  - "An executed spec's document on the ticket page shows its build note, or says it has none."
  - "AgenticMasterHandler is shorter than 747 lines and its baseline row says so."
  - "Build green, full suite green, dashboard gen:hub-events/test/build green."
