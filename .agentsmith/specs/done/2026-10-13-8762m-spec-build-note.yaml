assumptions:
  - "Four short string lists cover what a later spec must know: renamed, moved, persisted and deviations; a free-text field would be read as prose and checked against nothing."
  - "Rereading MEMORY.md once per spec-execution master start is cheap: one small file read per repository."

scope:
  in: >
    RECORD TOOLS: MasterRecordToolHosts (Application/Services/Tools) creates, per master start, a MasterRecordTools
    record {Log, Recall, Remember, HandForward?} from the decision logger and RunRepositoriesFactory — the inline
    construction at AgenticMasterHandler.cs:243-248 moves there. AgenticMasterHandler takes it instead of IDecisionLogger
    and RunRepositoriesFactory and reads records.Log where it read log. MasterToolComposition.Compose takes the record
    instead of log, recall and remember. AgenticToolSurface is untouched. NOTE: SpecBuildNote(SpecId, Renamed, Moved,
    Persisted, Deviations), every list of strings, in Contracts/Specs. ContextKeys.SpecBuildNotes =
    IReadOnlyDictionary<string, SpecBuildNote> in the new partial ContextKeys.HandForward.cs, kept in the run (stored nowhere but the run's resume checkpoint, like every context key). TOOL:
    hand_forward(renamed[], moved[], persisted[], deviations[]) on HandForwardToolHost; offered only to a coding master
    with a CurrentSpec, after BaseSurface (never to a child, a scan master or a design turn). A call replaces the
    current spec's note (the last call wins); at most 20 entries per list and 300 characters per entry, an excess
    refused by name. A renamed or moved entry has the form `<old> -> <new>` (an old name or path, the
    two-character arrow with a space each side, the new one); an entry without ` -> ` is refused by name, so
    2026-10-13-8762n can split it. Its description carries the whole contract, the entry format included, so it works
    without the skill text. RECORD: the outcome
    block gains hand_forward. SpecRecordBody decides from what it already receives: when the current spec's row in
    ContextKeys.SpecSequenceProgress carries SelectSpecHandler.AlreadySatisfiedNote it writes no key; else, when
    ContextKeys.SpecBuildNotes has no entry for the spec, the scalar `missing`; else the mapping of the four lists. READ: SpecBuildNoteReader reads outcome.hand_forward
    out of an executed spec's draft yaml; PrecedingSpecs.NotesOf(pipeline, specId) gives, per preceding spec that ran,
    this run's note from the context key, else the note in its record, else "no note". RENDER: SpecBuildNoteSection
    renders those notes, at most 8000 characters; the oldest are dropped first, and a line names each dropped spec and
    its done/ file. The section goes into the spec-execution user prompt (with one line asking for hand_forward before
    the verdict) and into the premise-check prompt's "already run" block. MEMORY: MemoryIndexReader (extracted from
    LoadMemoryIndexHandler, which delegates to it) refreshes ContextKeys.MemoryIndex in AgenticMasterHandler only when
    isSpecExecution (AgenticMasterHandler.cs:101), before the user prompt is built — never for a design turn or a scan.
    SpecExecutionPromptFactory renders MasterPromptSections.BuildMemoryIndexSection(pipeline) into the spec-execution
    user prompt in code, so the index reaches the master without any skill placeholder; a memory spec N wrote is in
    spec N+1's prompt. TICKET PAGE: TicketSeriesRecordsReader's full read also loads the attempts' 'spec_record:'
    RunArtifacts (one set query); TicketSeriesSpecComposer reads the executing run's record through SpecBuildNoteReader
    and appends BuildNote (the four lists, `missing`, or null when no record) LAST to TicketSeriesSpecView; the
    dashboard's TicketSeriesSpec gains buildNote and SpecDocument renders a "Build note" block (four lists, or "no
    note") above the read-only note. SKILL: coding-agent-master's verdict section asks
    for hand_forward once before the verdict, on the skills branch spec/2026-10-13-8762; the build note quotes the exact
    sentence added.
  out: >
    Re-grounding a spec's moved citations when it is entered, and checking a note against the series contract — 2026-10-13-8762n. decide_by_default and its host beside these — 2026-10-13-8762o. Releasing the skill edit and
    bumping the pin — 2026-10-13-8762x. Rendering the memory index through a {MemoryIndexSection} skill placeholder — nobody: it is rendered in code
    (contract 2.8: tools and prompts work without the skill text). Persisting a note anywhere but the record — nobody: section 2.2 of the
    series contract names the record as its only home. Compaction of a long master pass — 2026-09-28-23a2c.

decisions:
  - key: "THE RECORD IS THE NOTE'S ONLY HOME. It is part of specs/done/{stem}.yaml, which SpecRecorded (80) already mirrors; this run's notes wait in a context key that is stored nowhere but the run's resume checkpoint, as every context key is (PipelineContextSerializer); that copy only lets a run resumed between master and record keep its note, and is never read as the note. A later attempt reads them back from the executed spec's yaml, so a resumed series loses nothing and nothing is stored twice (series contract 2.2)."
  - key: "STRUCTURED LISTS, NOT PROSE. renamed, moved, persisted and deviations are what a later premise or contract check can match a citation or a datum against; a paragraph would be read and trusted, never checked."
  - key: "A MISSING NOTE IS REPORTED, NOT BLOCKING. The record says `missing` and the next spec is told 'no note'; the run is not stopped. Contract section 5 default 45 (decision 12), pending operator ratification."
  - key: "ALREADY-SATISFIED SPECS CARRY NO KEY. They ran no master, so 'missing' would be false; their standing note already says why."
  - key: "MEMORY REFRESHED WHERE IT IS READ, FOR SPEC EXECUTION ONLY. The index is reloaded at a spec-execution master start rather than by splicing LoadMemoryIndex into CodeSpecBlock: a second LoadMemoryIndex in the block would change Effective(), the run-rail beats and the gate-order and control-flow goldens for a file read. Design turns and scans never loaded the index, so they pay no read."
  - key: "THE INDEX IS RENDERED IN CODE, IN THE USER PROMPT. No master in the catalog carries {MemoryIndexSection}, so the body binding at AgenticMasterHandler.cs:214 reaches no model; refreshing it alone would change nothing the master sees. The spec-execution user prompt is code, so the index is proven where the master reads it (harness PromptsSeen). The body binding stays; a master that later adds the placeholder would show the index twice, which the skill edit for that master has to weigh."
  - key: "THE TICKET PAGE READS THE NOTE OUT OF THE RECORD ARTIFACT. The record is the note's only home (contract 2.2); the series read already joins per-attempt rows in one set query each, so one more query over RunArtifact by kind prefix shows the note without a second copy. This spec owns that small server + dashboard change."
  - key: "EXTRACT FIRST, FOR A NET REMOVAL. AgenticMasterHandler is at its 747-line baseline. Moving the record hosts out, and replacing two constructor parameters with one, makes room for the memory refresh line and leaves the handler shorter; the baseline row is lowered to the measured count. Contract section 2.5."
  - key: "MASTERRECORDTOOLS IS THE PRODUCT TYPE. The contract names the factory, MasterRecordToolHosts; the record it returns is named MasterRecordTools so 2026-10-13-8762o appends its host as one more member (series contract 2.5, amended)."
  - key: "NO REGISTRATION LINE ADDED. MasterRecordToolHosts and MemoryIndexReader join the existing chain at PipelineHandlersExtensions.cs:106-107, so the file stays at 218."
  - key: "PROMPT BOUND 8000 CHARACTERS, OLDEST DROPPED FIRST. A 24-spec series would otherwise grow every master prompt without limit; the nearest predecessors matter most, and a dropped note stays one read_file away. Default, pending operator ratification."
  - key: "RENAMED AND MOVED ENTRIES ARE `<old> -> <new>`. 2026-10-13-8762n checks a renamed entry's old name and a moved entry's destination against the series contract; a free sentence gives it nothing to split. The format is stated in the tool description and the skill sentence, and an entry without the arrow is refused by name (main-thread decision 6, round-2 review of 8762n F7)."
  - key: "TOOL TEXT CARRIES THE CONTRACT. The skill edit lands with 2026-10-13-8762x; the description and the spec contract line in the user prompt make the tool usable before that release (contract 2.8)."
  - key: "BACKEND CONTEXT. Recorded in the default context (contract section 5 default 72, decision 23, pending operator ratification)."

steps:
  - id: record-hosts
    action: "MasterRecordToolHosts + MasterRecordTools; AgenticMasterHandler and MasterToolComposition switch to it; registered on PipelineHandlersExtensions.cs:106-107 (file stays 218). Constructor arithmetic: MasterRecordToolHosts and MemoryIndexReader replace IDecisionLogger and RunRepositoriesFactory (net 0); lines 243-248, comment lines 243-244 included, become one line; the spec-execution refresh adds one, so AgenticMasterHandler ends at or below 744 and its baseline row is set to the measured count; MasterToolComposition (116 after 2026-10-13-8762c and 2026-10-13-8762d) stays at or under 118."
  - id: note-contract
    action: "SpecBuildNote (Contracts/Specs) and ContextKeys.HandForward.cs with SpecBuildNotes; ContextKeys.cs untouched (152)."
  - id: tool
    action: "HandForwardToolHost: hand_forward with the bounds above and the `<old> -> <new>` entry format for renamed and moved (an entry without ` -> ` refused by name), writes the current spec's note into ContextKeys.SpecBuildNotes; added in MasterToolComposition's coding-only block when CurrentSpec is present."
  - id: record
    action: "SpecOutcomeBlock.Render gains the hand_forward key; SpecRecordBody decides no key (progress row note == AlreadySatisfiedNote), `missing` (no context-key entry) or the mapping. Both stay under 70 lines."
  - id: read-back
    action: "SpecBuildNoteReader (outcome.hand_forward of an executed spec's yaml) and PrecedingSpecs.NotesOf (context key, else record, else no note); PrecedingSpecs stays under 80 lines."
  - id: render
    action: "SpecBuildNoteSection (static, pure) with the 8000-character bound; SpecExecutionPromptFactory renders it, the hand_forward line and BuildMemoryIndexSection (stays under 90 lines)."
  - id: premise
    action: "ISpecPremiseChecker.CheckAsync gains the preceding notes; SpecPremiseChecker, HarnessSpecPremiseChecker and CheckSpecPremisesHandler (stays at or under 120) pass them; PremiseCheckPrompt.AlreadyRan renders them (stays at or under 108)."
  - id: memory
    action: "MemoryIndexReader extracted from LoadMemoryIndexHandler; AgenticMasterHandler refreshes ContextKeys.MemoryIndex when isSpecExecution, before building the user prompt."
  - id: ticket-view
    action: "TicketSeriesRecords appends Records (run id + spec id -> record body) filled by TicketSeriesRecordsReader's full read; TicketSeriesSpecView appends BuildNote; TicketSeriesSpecComposer fills it (stays under 70 lines); dashboard types/tickets.ts buildNote, SpecDocument 'Build note' block (stays under 110 lines); pnpm test and build green."
  - id: skill
    action: "coding-agent-master '## Your verdict': call hand_forward once before the verdict, renamed and moved entries as `<old> -> <new>` — on skills branch spec/2026-10-13-8762, frontmatter version NOT bumped (2026-10-13-8762x bumps each master once), the build note quoting the exact sentence; released by 2026-10-13-8762x."
  - id: tests
    action: "Red first for every test below, then green; run the Tools, Specs, Memory, Handlers and Architecture classes touched."

