# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-02-140d
goal: "A tracker or connection form shows its auth secret once, as a required pick from the secrets catalog, because the type descriptor declares the field a secret."

applies_to: "backend (studio capabilities descriptor), dashboard (config studio forms)"

requires: []

facts:
  - claim: "The connection descriptor declares authSecret as a required text field for every connection type."
    evidence: "src/backend/AgentSmith.Contracts/Services/ConfigStudioCapabilities.cs:108,115"
  - claim: "The tracker descriptor declares authSecret as a required text field for every tracker type."
    evidence: "src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs:27,34,41,48"
  - claim: "CapabilityFieldKind has Text, List, Bool and Map; text renders as a free text box."
    evidence: "src/backend/AgentSmith.Contracts/Models/ConfigStudio/ConfigCapabilities.cs:45-60; src/dashboard/src/components/config/capabilityFields.tsx:15-131"
  - claim: "The tracker and connection forms render the descriptor's fields AND a fixed RefSelect bound to the same authSecret key, so the field appears twice — once as free text that invites the token value itself."
    evidence: "src/dashboard/src/components/config/EntityForm.tsx:93-106,127-142"
  - claim: "The client accepts only the four known kinds; an unknown one falls back to text."
    evidence: "src/dashboard/src/lib/configApi.ts:235,290-311"

scope:
  in: >
    A fifth field kind, secret: its value is the NAME of an entry in the secrets catalog. The descriptor declares
    authSecret with it on every tracker and connection type. The form renders a secret field as a pick from the
    secrets catalog, required-marked like any required field, at the descriptor's position; the fixed RefSelect on
    the tracker and connection forms goes. Design sources and MCP servers keep their single picker.
  out: "The secrets tab itself, and how a secret's value is stored."

decisions:
  - key: "THE DESCRIPTOR SAYS WHAT A FIELD IS. A by-name exception in the form ('skip authSecret') would fix this pair and leave the next secret field to repeat it; a kind lets a declared field render right without a UI change, which is what the descriptor exists for."

steps:
  - id: kind
    action: "CapabilityFieldKind gains Secret (wire word secret); authSecret is declared with it in ConfigStudioCapabilities and TrackerCapabilityFields."
  - id: form
    action: "configApi accepts secret; CapabilityFieldInputs takes the secrets catalog and renders a secret field as a required-aware pick; EntityForm drops the fixed tracker and connection RefSelect."

tests:
  - "Capabilities_AuthSecret_IsDeclaredASecretOnEveryTrackerAndConnectionType"
  - "a tracker and a connection form render authSecret once, as a pick from the secrets catalog"
  - "a required secret field shows the required marker and blocks save while empty"

done:
  - "the GitLab connection form shows one auth secret, a required pick"
  - "build green, full suite green, dashboard tests and build green"
