# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-f3a8d
goal: "Admins set, rotate and delete the installation's own secret values in the admin area, stored envelope-encrypted under a master key outside the database; values are write-only."

applies_to: "default (persistence entity + migrations on three providers, secret pipeline, config secret resolution, secure endpoints), dashboard (Config studio secrets)"

requires: [2026-11-17-f3a8c]

facts:
  - claim: "A catalog secret is a name whose stored document is an env reference '${NAME}'; ConfigSecretResolver replaces it with the environment variable's value, empty when unset; SecretValueGuard refuses a raw value in the document."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigSecretResolver.cs, src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigSecretReferences.cs, src/backend/AgentSmith.Contracts/Services/SecretValueGuard.cs"
  - claim: "CurrentSecretValues and the masker follow CurrentConfigSnapshot, which reloads when the store's catalog instance changes."
    evidence: "src/backend/AgentSmith.Server/Services/Config/CurrentSecretValues.cs, src/backend/AgentSmith.Server/Services/Config/CurrentConfigSnapshot.cs"
  - claim: "Migrations exist per provider (sqlite shared set, SqlServer and Postgresql assemblies); parity tests assert no pending model changes."
    evidence: "tests/AgentSmith.Tests/Persistence/SqlServerMigrationSetTests.cs, tests/AgentSmith.Tests/Persistence/PostgresqlMigrationSetTests.cs"
  - claim: "Operator decision 2026-11-17: envelope encryption, per-secret data key, AES-GCM with a random nonce, the master key outside the database (env or k8s secret, Key Vault optional), write-only, input never through the conversation or the LLM; env still read and wins when present; application secrets and sealed secrets out."
    evidence: "observed: 2026-11-17, operator brief for the admin assistant series"

scope:
  in: "StoredSecret table (Name lowercased as key, Version, Ciphertext, Nonce, WrappedKey, WrapNonce, KeyId nvarchar(256), SetBy, SetAt) with migrations for sqlite, SQL Server and Postgres; SecretEnvelope v1: random 32-byte data key and 12-byte nonce per write, AES-GCM with associated data 'as-secret/v1\\0'+name, data key wrapped by AES-GCM under the master key with 'as-dek/v1\\0'+name+'\\0'+KeyId, key buffers zeroed; master key from AGENTSMITH_SECRET_MASTER_KEY (base64, 32 bytes) or AGENTSMITH_SECRET_MASTER_KEY_FILE, plus _PREVIOUS for reading after rotation (identical keys refused); KeyId = 'env:'+hex(HMAC-SHA256(key,'agentsmith/keyid'))[..16]; 'secret' preset [WriteSecret] (set, delete, rewrap) run on the installation through IActRun with the value held in a redacting holder; secure endpoints PUT/DELETE /api/config/secrets/{name}/value, POST /api/config/secrets/rewrap, GET /api/config/secrets/state (secrets.read/write), none echoing a value; resolution: environment value when set and non-empty, else the stored value; the stored values are read once per configuration load, so runs and the masker see one generation, and the handler reloads the store, bumps the epoch and publishes ConfigChanged; a row that cannot be opened resolves empty with a finding naming the secret and KeyId, and a missing master key with stored rows is a finding on every load; the seed is excluded from checkpoints and removed after sealing; values shorter than 6 characters are refused (the masker skips them); a stored value whose catalog secret was deleted is listed as an orphan with a Delete button; agent API keys keep reading the environment (2026-11-18-9ae8); admin tool read_secrets shows source; dashboard secrets view: state, a password field posting straight to the server, Delete value, Re-wrap."
  out: "Application secrets and sealed secrets (operator). Azure Key Vault as the master key source: 2026-11-17-f3a8e. Data Protection's key ring (decision). Rollback of a row by someone with database write access (accepted). Zeroing the plaintext string (.NET strings cannot be)."

steps:
  - id: crypto
    action: "MasterKeyRing (current + previous from env/file, KeyId), SecretEnvelope.Seal/Open (Persistence/Services/Secrets)."
  - id: store
    action: "StoredSecret entity + configuration; migrations AddStoredSecrets on all three providers; StoredSecretRepository (Seal on write, Open on read, Rewrap); IStoredSecretValues (Contracts) Find(name), implemented over the repository with a cache refreshed on write and reload."
  - id: resolve
    action: "ConfigSecretResolver takes IStoredSecretValues: environment wins when non-empty, else stored; RawConfigMaterializer passes it; the finding when rows exist and no key."
  - id: pipeline
    action: "PipelinePresets.Secret ('secret') [WriteSecret]; SecretWriteRequest(Name, Operation, SecretInput, Actor) with a value holder whose ToString and JSON are redacted; handler creates the catalog secret if absent, seals and stores, reloads; ISecretWriteRun (Server) through IActRun."
  - id: endpoints
    action: "SecretValueEndpoints: PUT value (body {value}), DELETE value, POST rewrap, GET state (name, environment variable, environment set, stored by/at, key current); refusals name the env var or the name."
  - id: dashboard
    action: "Config studio secrets: per-secret state line, password input + Set (posts and clears the field), Delete value, Re-wrap when a row is wrapped by a previous key; a line naming AGENTSMITH_SECRET_MASTER_KEY when absent."

tests:
  - "SecretEnvelope: two seals of the same value differ in ciphertext, nonce and wrapped key; open with the wrong name or key fails; previous key opens, rewrap moves KeyId."
  - "ConfigSecretResolver: env set wins; env empty takes stored; neither is empty."
  - "Server HTTP (enforcing authority): an admin sets a value; the response, GET state, the run's events and the captured logs never contain it; two secrets with equal values store different ciphertext; a reader/operator is refused 403."
  - "Booted server: the secret run stores, and the configuration resolves the stored value through ISecretValues, which the masker reads."
  - "Migration parity tests on SQL Server and Postgres; archive table counts updated."
  - "A value set, then a run started: the value is masked in what the run records."

done:
  - "An admin can set, rotate (set again), delete and re-wrap installation secret values in the Config studio; they are AES-GCM envelope-encrypted under a master key outside the database, never returned, logged or shown to the LLM; an environment variable still wins."
