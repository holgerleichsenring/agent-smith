  out: >
    The by-hand landing, RecordByHandAsync on this recorder and its endpoint — 2026-10-14-dbcei; the ticket list reading
    a landing as done — 2026-10-14-dbcei. Waking the tickets that require a landed ticket (one call after a won insert,
    added to this recorder's RecordAsync) and the claim gate reading LandedAsync — 2026-10-14-dbceh. Showing landings on
    the ticket page and the graph — 2026-10-14-dbcen. A ticket that merged before this spec shipped is
    recorded by the re-read's recovery within a cycle when its records still exist and its project is configured;
    making that immediate for a `ticket:` requirement read at filing — nobody: the
    dependent is held by the gate until then, and the recovery bounds the wait at about one cycle. A required ticket whose records are gone lands only by hand — 2026-10-14-dbcei.
    A target-branch column on the records — nobody: contract decision 6; a graph ticket never carries spec-parent:, so it
    PRs into the default branch. Undoing a landing — nobody: contract decision 15. Re-reading unsupported records
    periodically — nobody: no reader exists to read them, and such a ticket is marked done by hand (2026-10-14-dbcei).
    Waking a dependent whose wake was lost — 2026-10-14-dbceh, which adds its recovery call to this re-read service. A run event for a landing —
    nobody: a landing is a ticket fact, and EventType.cs is at its 120-line cap (contract §2.2).

decisions:
  - key: "THE ROW IS THE DURABLE OUTPUT, THE RECORDS STAY THE INPUT. PrReviewRecords die with their newest run and with a refresh that finds no run naming them (RunDeletionRepository.cs:92-95, PrReviewRecordRefresh.cs:41-42); a requirement must hold after either, so the landing is written once into its own table and never deleted (contract §5 default 8, pending operator ratification)."
  - key: "THE UNIQUE INSERT IS THE TRANSITION. UNIQUE (Tracker, TicketKey) means exactly one replica's insert succeeds; only that replica publishes the event and, from 2026-10-14-dbceh on, wakes the dependents. No compare of old and new record state is needed, and none is attempted: the writer's bool says only that something changed."
  - key: "THE RECORDER RUNS AT THE END OF EVERY REFRESH, NOT INSIDE THE WRITER. The refresh already runs on every nudge under the ticket's lock (ReworkNudgeWorker.cs:80-84) and sees all of the ticket's records; the writer sees one record at a time and cannot apply a rule over all of them. Calling it on every refresh rather than only on a change costs one indexed read and one indexed existence check. It runs BEFORE the pages' Redis nudge, so a Redis failure cannot skip the database write."
  - key: "THE PUBLISHES ARE FIRE-AND-WARN, THE INSERT IS NOT. RedisSystemEventPublisher throws on a Redis failure (RedisSystemEventPublisher.cs:21-37), and the operator's estate treats Redis as volatile; the landing and (from 2026-10-14-dbceh) the wake are database facts and must not depend on it. A lost announcement costs a page refresh; the next TicketActivityChanged or a reload shows the row."
  - key: "MISSED LANDINGS ARE RECOVERED, NOT ASSUMED. Once every record has ended, no open-record re-read reaches the ticket again, and the worker swallows refresh failures of non-Refresh nudges (ReworkNudgeWorker.cs:93-104), so 'the next refresh' may never come. The re-read therefore also selects merged tickets with no landing row and nudges a Refresh naming the record; that refresh re-reads it, advances its check time and records the landing. The same read backfills tickets merged before this spec shipped."
  - key: "NO RECORD HOGS THE RE-READ. Records of unconfigured projects are filtered in the query (the worker would finish their nudge before any refresh, ReworkNudgeWorker.cs:80-81), and a failed host read of an existing record now advances its check time (it left it unchanged, PrReviewRecordWriter.cs:31-34), so the oldest-first cap rotates through every record instead of nudging the same dead fifty each cycle. Unread records are re-read too: one blocks TicketLanding as long as it stands. The existing test pinning the old behaviour is renamed and inverted."
  - key: "ONE LANDING RULE. TicketLanding.OfStates is what Of already computes; the recorder and the ticket list therefore cannot disagree on what merged means (contract decision 6: at least one merged, every one ended)."
  - key: "LANDED AT IS THE HOST'S TIME. The newest StateAt of the records, the time TicketBucketRule.DoneAt already shows (TicketBucketRule.cs:44-45); the clock only when the host gave none."
  - key: "WHOEVER MERGED IT. The host's merged state is the fact; a person who pushed commits onto the branch and merged it lands the ticket exactly as an approved agent pull request does."
  - key: "A SYSTEM EVENT, NOT A RUN EVENT. A landing has no run (the run may be deleted), so it is SystemEventType 57 in the System page's ring, plus the existing TicketActivityChanged that refreshes the ticket list and page (contract §2.2)."
  - key: "THE PERIODIC RE-READ HAS ITS OWN LEASE; ITS OPEN LIST COVERS WEBHOOK MODE ONLY (contract decision 16, §5 default 9, pending operator ratification). Webhook mode has no other periodic read of an open record, so a lost merge delivery would hold every dependent until someone opened the ticket; polling mode's PR sweep idles without a polling tracker and is not the place. Each re-read costs at least two host calls (state, threads) plus the author-trust reads and re-reads the ticket's other open records (PrReviewRecordRefresh.cs:45,62-71); 150 open pull requests cost at least 1,200 calls an hour, so a polling tracker's projects, whose open records the PR sweep already re-reads from one list per repository (PrSweepRecordNudge.cs:9-31), are left out of the open list. Unread records of every mode and the unlanded-merged recovery stay in, since the sweep reaches neither. A polling repository with more than 1,000 open pull requests never yields a complete sweep list (100 per page, 10 pages), so a merge there is seen only by a page read or a later delivery; accepted and named here rather than re-read."
  - key: "DEPLOY-TIME BACKFILL. The first cycles after this spec ships select every historically merged ticket whose records still exist and that has no landing: at most 50 host re-reads and 50 TicketLanded events per five-minute cycle until the backlog is gone; each lands once, so the burst ends by itself."
  - key: "THE RECOVERY ANTI-JOINS ON THE TRACKER CONNECTION, AS THE LANDING IS KEYED. A landing is unique on (Tracker, TicketKey); keyed on Project, the second project of one connection would find no row for ever and be re-read every cycle. A merge seen under one project still lands the ticket while the other project's pull request is open, since the recorder reads that project's records only; accepted, as one approval record already treats the two as the same work."
  - key: "THE RE-READ RESOLVES ITS COLLABORATORS AT RUN TIME. It is registered in AddLongRunningServices, which two composition tests build without the scoped record repository or the rework worker's registrations (ServerDiLifetimeTests.cs:330-352, NonDiCtorRuleTests.cs:204-223); ChangeSweepHostedService takes IServiceProvider for the same reason (ChangeSweepHostedService.cs:16-20,43-45)."
  - key: "THE REPOSITORY IS THE SINGLETON PORT, as 2026-10-14-dbcef's: the recorder, the gate and the wake are singletons; a scope per operation avoids a facade class."
  - key: "DEVIATION: TicketLandingFact IS MINTED HERE. Contract §2.5 names ITicketLandingStore's two members but no type for a landing to travel in; nine positional arguments on TryRecordAsync would be the alternative. 2026-10-14-dbceh, 2026-10-14-dbcei and 2026-10-14-dbcen read and write landings as TicketLandingFact (Contracts/Tickets/TicketLandingFact.cs). Reported for the contract's §2.5."

