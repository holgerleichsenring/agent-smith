done:
  - "When the last open pull request of a ticket ends and one of them merged, the ticket is recorded as landed exactly once, even with several servers running; a Redis failure after the insert neither loses it nor skips what follows it; while Redis is down no refresh runs (the worker's lock is Redis), and the landing is written once it answers; the System page's tracker entry shows 'landed' for it."
  - "Deleting every run of a landed ticket leaves it landed."
  - "In webhook mode, a merge whose delivery was lost, or whose landing write failed, is recorded within about twenty minutes without anyone opening the ticket, while fewer than about 150 pull requests are open; beyond that later, at 50 per five minutes; in polling mode an open pull request is re-read by the PR sweep alone, and a merged ticket without a landing is recovered by the re-read as in webhook mode."
  - "A pull request the host can no longer read, or a project removed from the configuration, never keeps other pull requests from being re-read."
  - "`agentsmith database migrate` creates LandedTickets on every provider, and a data archive export then import carries it."
  - "Build green, full suite green, dashboard gen/test/build green."
