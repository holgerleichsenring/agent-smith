scope:
  in: >
    CONTRACT: TicketLandingKinds (Contracts/Tickets) with Merged = "merged" and ByHand = "by-hand"; TicketLandingFact
    (Contracts/Tickets, record: Tracker, TicketKey, TicketId, Project, Kind, LandedAt, By?, Note?, PrUrl?); ITicketLandingStore
    (Contracts/Services): TryRecordAsync(TicketLandingFact, ct) -> bool inserted, and LandedAsync(tracker,
    IReadOnlyCollection<string> ticketKeys, ct) -> the stored facts of those keys on that tracker connection. TABLE:
    LandedTicket : EntityBase (Id long, Tracker, TicketKey, TicketId, Project, Kind, LandedAt, By?, Note?, PrUrl?) with
    LandedTicketConfiguration (ToTable("LandedTickets"), IndexedString caps on the keyed strings, Kind at 16, Note
    unbounded, UNIQUE (Tracker, TicketKey), index (Project)) applied from TicketRecordConfigurations.Apply (25 -> 26). No
    DbSet; RunDeletionRepository untouched, so a landing outlives every run. REPOSITORY: LandedTicketRepository
    (IServiceScopeFactory) : ITicketLandingStore, a singleton opening a scope per operation: TryRecordAsync returns false
    when the key is stored, else inserts, and returns false on a unique violation (entry detached); insert only, no
    update and no delete. Registered in AddTicketFactStores (27 -> 29). RULE: TicketLanding gains OfStates(IReadOnlyList<string>
    states), and Of delegates to it (21 -> at most 27), so the read-time projection and the recorder share one rule.
    RECORDER: TicketLandingRecorder (Server/Services/Rework, singleton, at most 80 lines): RecordMergedAsync(ResolvedProject,
    ticketId, ct) reads the ticket's records through IPrReviewRecordReader in its own scope; when OfStates says merged it
    builds the fact (Tracker = project.Tracker.Name, TicketKey = TicketKey.For(tracker type lowercased, ticketId), Kind
    merged, LandedAt = the newest StateAt of the records else now, By and Note null, PrUrl = the url of the newest merged
    record) and hands it to one private RecordAsync: TryRecordAsync, and ONLY when it inserted, log the landing at
    Information, then publish TicketLandedEvent and call ITicketActivityNudge.ChangedAsync, EACH in its own try/catch
    that logs a Warning and goes on: the row is the fact, Redis only announces it, so a Redis failure never fails the
    call and never skips what follows the insert. The slot between the insert and the publishes is where
    2026-10-14-dbceh's wake goes (the wake writes to the database, the publishes to Redis). It returns whether it
    inserted. PrReviewRecordRefresh takes the recorder and calls RecordMergedAsync BEFORE its own pages' nudge (the
    existing `if (changed) ... ChangedAsync` at :47), whether or not this refresh changed a record (87 -> at most 90).
    A landing the refresh still misses (the database fails mid-call, or the worker swallows a non-Refresh refresh
    failure) is found by the re-read's recovery below. Registered in AddReworkNudgeWorker (27 -> 28). EVENT: SystemEventType.TicketLanded = 57
    with a dated comment (37 -> at most 41); TicketLandedEvent(Source, Project, TicketKey, TicketId, Kind, By, Timestamp) :
    SystemEvent in Contracts/Events/TicketLandedEvent.cs, Source "ticket-landing"; EventTypeResolver maps 57 (85 -> 86); it
    joins the System page's ring like every event but TicketActivityChanged. No EventType is minted (EventType.cs stays
    120). DASHBOARD MIRROR: system-events.ts gains TicketLanded = 57, TicketLandedEvent (project, ticketKey, ticketId,
    kind, by: string | null) and its union member; useSystemExecutionTree.tsx and useSubsystemActivity.ts each gain one
    describe arm "landed · {project}/{name} · {kind}" plus " by {by}" when present, {name} being "#" plus the id for an
    all-digit id and the id as written otherwise (a Jira key never gains a "#"), and SystemEventType.TicketLanded
    joins the tracker subsystem's kinds in BOTH registries (SUBSYSTEMS, useSubsystemActivity.ts:23-35; REGISTRY,
    useSystemExecutionTree.tsx:22-33), without which neither hook keeps the event; the kind switches' default reads it
