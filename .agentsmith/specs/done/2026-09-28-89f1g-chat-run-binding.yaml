# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-89f1g
goal: "A chat thread that started a run hears its questions, its outcome and its pull request for as long as the run lives, across restarts and replicas, and is freed when the run ends."

applies_to: "backend (a run-to-thread binding, a terminal notifier, the chat question path, the conversation unblocker)"

requires: ["2026-09-28-89f1f"]

scope:
  in: "A durable binding from run id to platform, channel and thread; re-subscription on startup; questions and answers through it; a notifier on the run's terminal event with the PR url or the failure reason; the thread unblocked from the run's status."
  out: "Progress chatter beyond questions and the outcome: the dashboard is where a run is watched."

decisions:
  - key: |
      NOTHING CARRIED A SERVER RUN BACK TO CHAT. Server runs report to the console, the channel is freed
      only on a Done or Error message that never comes, the conversation state expires after 45 minutes,
      and the bus subscription lives in one replica's memory. Questions happen to arrive because the
      dialogue identity is the run id; nothing else does.
  - key: |
      THE BINDING IS A DATABASE ROW, read back on startup by every replica, because a run may wait days
      for an answer and outlive the replica and the Redis state that started it.
  - key: |
      THE THREAD IS FREED FROM THE RUN'S STATUS, not from a job's liveness: once the run is terminal, or
      gone, the conversation ends. This replaces what OrphanJobDetector did for spawned jobs.

steps:
  - id: binding
    action: "RunChatBinding persisted at launch (run id, platform, channel, thread, started by); a hosted service re-subscribes open bindings on startup."
  - id: questions
    action: "Questions of a bound run post to its thread and answers route back through the durable dialogue for as long as the run waits; an answer after the conversation state expired still reaches the run."
  - id: outcome
    action: "A notifier on the run's terminal event posts the outcome with PR urls or the failure reason, then frees the thread and closes the binding."
  - id: docs
    action: "chat-gateway, slack and teams pages describe a chat run's lifecycle."

tests:
  - "ChatBoundRun_Terminal_PostsOutcomeWithPrUrl_AndFreesThread"
  - "ChatBoundRun_Failed_PostsReason"
  - "ChatBoundRun_Question_PostsToThread_AnswerResumesRun"
  - "ChatBinding_SurvivesRestart_Resubscribes"
  - "ChatAnswer_AfterConversationStateExpired_StillReachesRun"

done:
  - "a chat-started run posts its outcome to the thread that started it"
  - "a question asked after a restart still reaches the thread and its answer the run"
  - "build and all tests green"
