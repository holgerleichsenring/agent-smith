  - claim: "The ticket page renders TicketHeader, then the tab bar, then the selected pane, under .mock-shell.mock-tickets."
    evidence: "src/dashboard/src/components/tickets/detail/TicketPage.tsx:14-37"
  - claim: "TicketHeader shows the key, title and a subline of recorded facts (tracker link, tracker status, the live or newest attempt, the branch)."
    evidence: "src/dashboard/src/components/tickets/detail/TicketHeader.tsx:23-39"
  - claim: "The page store reads the default series once and re-reads everything on this ticket's TicketActivityChanged; a RunsChanged of one of its attempts re-reads the default series."
    evidence: "src/dashboard/src/lib/tickets/TicketPageStore.tsx:18-23, src/dashboard/src/lib/tickets/TicketPageStore.tsx:127-134"
  - claim: "The TicketSeries mirror is hand-kept and carries no budget today; an attempt carries its cause as {channel, actor, at, source}."
    evidence: "src/dashboard/src/types/tickets.ts:248-262, src/dashboard/src/types/tickets.ts:61-66"
  - claim: "Channel words for an attempt's cause come from one table; a channel missing from it is shown raw."
    evidence: "src/dashboard/src/components/tickets/ticketFormat.ts:30-43"
  - claim: "money() renders a dollar amount with two decimals."
    evidence: "src/dashboard/src/components/tickets/ticketFormat.ts:17-19"
  - claim: "The Specs tab head already counts done of total for the series."
    evidence: "src/dashboard/src/components/tickets/detail/TicketSpecsTab.tsx:58-66"
  - claim: "Config Studio's settings rail is SETTING_KEYS with a label, a subtitle and an icon per key; each key has one typed form case in SettingsForm."
    evidence: "src/dashboard/src/components/config/settings.ts:12-76, src/dashboard/src/components/config/SettingsForm.tsx:41-96"
  - claim: "SettingKey and SettingShapes mirror the C# settings models camelCase on the wire; fetchSetting and saveSetting read and write /api/config/settings/{key}."
    evidence: "src/dashboard/src/lib/configApi.ts:842-854, src/dashboard/src/lib/configApi.ts:980-993, src/dashboard/src/lib/configApi.ts:995-1021"
  - claim: "The settings endpoints expose every taxonomy singleton except persistence and role_mapping, and a save is attributed, versioned and applied live."
