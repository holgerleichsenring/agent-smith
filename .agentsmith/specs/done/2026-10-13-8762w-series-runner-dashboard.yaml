    evidence: "src/dashboard/src/components/config/SettingsForm.tsx:98-107, src/dashboard/src/components/config/formFields.tsx:228-244"
  - claim: "A failed settings save surfaces the server's error text inline under the Save button; the one client-side refusal today is the sandbox's."
