# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762w
goal: "The ticket page shows a series' spend and run time against their caps, its chained attempts and whether the next starts by itself or why it holds; Config Studio edits spec_review and series."

applies_to: "dashboard (ticket page series strip, Config Studio settings forms)"

requires: [2026-10-13-8762g, 2026-10-13-8762q, 2026-10-13-8762u, 2026-10-13-8762v]

