# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-16-3596
goal: "Four working rules join CLAUDE.md and the principles, and two ratchets stop new server-side tracker/git writes and new unratified decisions."

applies_to: "default (CLAUDE.md, principles.md, architecture tests)"

requires: []

facts:
  - claim: "The founding rule is that every task in a run is a pipeline step; filing, amendment, close and follow-up instead run as server services that write to the tracker and git with no run id."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/TicketGraphFiler.cs:14-20, src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedSetTicketFiler.cs:14-18"
  - claim: "24 files in the server project call a tracker or git write member directly today: 19 by member name, 5 by CreateAsync in a file that references ITicketProvider."
    evidence: "observed: 2026-11-16, grep over src/backend/AgentSmith.Server for the members named in step ratchet-writes"
  - claim: "The status transitioner is a tracker write outside ITicketProvider."
    evidence: "src/backend/AgentSmith.Contracts/Services/ITicketStatusTransitioner.cs:13"
  - claim: "43 decision files and 45 spec files carry 'pending operator ratification' or an equivalent marker."
    evidence: "observed: 2026-11-16, grep -rliE 'pending (operator )?ratification|ratification pending' over .agentsmith/decisions and .agentsmith/specs"
  - claim: "Hard-coded runtime intervals already exist, so rule 4 can bind only new limits on the day it lands."
    evidence: "src/backend/AgentSmith.Server/Services/Lifecycle/DialogueResumeSweeper.cs:28"
  - claim: "A ratchet with a baseline file already exists for spec record length: listed debt may only shrink, must leave once fixed, and nothing new may join."
    evidence: "tests/AgentSmith.Tests/Architecture/SpecRecordLengthRatchetTests.cs:20-24, tests/AgentSmith.Tests/Architecture/SpecRecordLengthRatchetTests.cs:104-109"
  - claim: "Architecture tests locate the backend and the .agentsmith folder through ArchitectureSources."
    evidence: "tests/AgentSmith.Tests/Architecture/ArchitectureSources.cs:10-26"
  - claim: "CLAUDE.md lists its key rules in one section."
    evidence: "CLAUDE.md:241-247"

scope:
  in: "Four rules in CLAUDE.md Key Rules and the same words in the default principles.md; ServerWritesRatchetTests and PendingRatificationRatchetTests, each a scanner behind a pure function, a baseline file, and unit tests that feed the scanner one offending text."
  out: "Moving existing server writes into pipelines (blocks 3 and 4 of the consolidation plan); deciding the open decisions (block 7); existing hard-coded limits (block 7); indirect writes through Application services called from the server, which the rule text covers and the ratchet does not see."

steps:
  - id: rules
    action: "Add to CLAUDE.md Key Rules and .agentsmith/contexts/default/principles.md, same wording: (1) Everything is a pipeline: work that writes to a tracker or a repository is a step of a run with a run id; the server accepts requests and starts runs. (2) No second path: a spec that adds an outcome kind, a filer, a storage location, a label meaning or a trigger names the existing one it replaces; a second one needs the operator's approval, recorded in the spec's decisions/{id}.yaml with the operator as decider. (3) No unratified decision ships: an open choice is asked before the commit, never merged as pending ratification. (4) A new limit has a reason the operator would accept, lives in config, and its message names the value, the reason and the config key; the limits that predate this rule are debt listed in block 7."
  - id: ratchet-writes
    action: "ServerWritesScanner(text) answers whether a C# source calls AddLabelAsync, CloseTicketAsync, TransitionToAsync, TransitionAsync, UpdateStatusAsync, FinalizeAsync, PostCommentAsync, PostReviewBatchAsync, DeleteCommentsByMarkerAsync, RewriteRegionAsync, WriteFilesToBranchAsync, CreatePullRequestAsync, CompletePullRequestAsync, MarkPullRequestReadyAsync, RetargetPullRequestAsync, UpdatePullRequestBodyAsync, LinkAsync, CreateAsync in a file that references ITicketProvider, or CloseAsync in a file that references IPullRequestCloser. A comment above the list names the interfaces it was read from (ITicketProvider, ISourceProvider and its partials, IPrCommentProvider, ITicketStatusTransitioner, ITicketRequiresLink, IPullRequestCloser), so a new write member is added there. ServerWritesRatchetTests applies it to src/backend/AgentSmith.Server: no file outside server-writes-baseline.txt may match, and a listed file that no longer matches must leave."
  - id: ratchet-ratification
    action: "PendingRatificationScanner(text) counts the case-insensitive marker 'pending (operator )?ratification|ratification pending' (not 'default pending', which also names column defaults). PendingRatificationRatchetTests applies it to .agentsmith/decisions and .agentsmith/specs, skipping any file whose name starts with 2026-11-16-3596 (this spec and its decisions quote the marker); baseline pending-ratification-baseline.tsv holds the count per file: no new file, no count grows, a file at zero leaves."
  - id: messages
    action: "Each ratchet's failure names the rule and the remedy: move the write into a pipeline step; ask the operator instead of marking the decision pending."

tests:
  - "ServerWritesScannerTests: each listed member matches; CreateAsync matches only with ITicketProvider in the file; a read call does not match"
  - "PendingRatificationScannerTests: each marker form counts; ordinary text counts zero"
  - "ServerWritesRatchetTests and PendingRatificationRatchetTests pass on the tree"

done:
  - "CLAUDE.md and the default principles.md carry the four rules in the same words."
  - "Both ratchets pass, and their scanners are proven against an offending text by unit tests."
