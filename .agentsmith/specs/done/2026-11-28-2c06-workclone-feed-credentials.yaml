# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-28-2c06
goal: "A design turn's work clone stages the project's private-feed credentials with the code run's staging code, so a restore in run_command reaches the project's NuGet and npm feeds."

applies_to: "default (WorkCloneOpener, WorkCloneSet, DesignWorkToolHost, SetupRegistryAuthHandler staging)"

requires: [2026-11-10-4778, 2026-11-25-9992d, 2026-11-26-49d3b, 2026-11-28-d1ffa]

facts:
  - claim: "A work clone is a fresh sandbox: clone, detached checkout, then the model's commands; nothing stages registry credentials in it."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/WorkCloneOpener.cs:52-73; src/backend/AgentSmith.Application/Services/Tools/DesignWorkToolHost.cs:33-50"
  - claim: "Code runs stage credentials through SetupRegistryAuthHandler.StageInSandboxAsync (NuGet and npm fast paths, generic path for other ecosystems), writing only /root/.nuget/NuGet/NuGet.Config and /root/.npmrc; a package command re-stages the fast paths first (49d3b)."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/SetupRegistryAuthHandler.cs:102-160; src/backend/AgentSmith.Application/Services/Handlers/RegistryFeedRestage.cs:14-43"
  - claim: "MidRunRegistryAuth and RegistryFeedRestage read registries from ContextKeys.ProjectConfig and roots from ContextKeys.SandboxRepos; a design turn seeds SpecDialogProject and SandboxRepos as read-scope names, so their pipeline path would find no registries and the wrong roots for a clone at /work."
    evidence: "src/backend/AgentSmith.Contracts/Commands/PipelineContextExtensions.cs:21-26; src/backend/AgentSmith.Application/Services/Handlers/SetupRegistryAuthHandler.cs:96-99; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnSeeds.cs:61-62,102"
  - claim: "A work clone already carries the project's sandbox secrets (secrets.env) and only its own repository's repo_env, like a code run."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/WorkCloneOpener.cs:84-91; tests/AgentSmith.Tests/Sandbox/DesignWorkCloneTests.cs:126-152"
  - claim: "Seen live: a design turn's npm ci failed for lack of registry authentication and the design agent raised it to the operator as an open question."
    evidence: "observed: 2026-11-28, operator brief"

upgrade_impact: "A work clone of a project with registries gets the user-level NuGet and npm credential files a code run's sandbox gets; the repository tree is untouched. A project without registries sees no change."

scope:
  in: |
    MidRunRegistryAuth and RegistryFeedRestage gain pipeline-free overloads (registries handed in, the sandbox's own work
    directory as root) over SetupRegistryAuthHandler.StageInSandboxAsync, fast paths only; the pipeline overloads share the
    tolerant wrapper. WorkCloneOpener takes RegistryFeedRestage and stages project.Registries in the clone after the checkout,
    before any model command; WorkCloneSet.BeforeCommandAsync re-stages before a command RegistryFeedRestage.Restores names
    (49d3b), which DesignWorkToolHost calls before running. A staging failure is logged and the clone or command goes on.
    run_command's description says the feeds are staged in user-level config. Secrets: no change (decision recorded).
  out: "The generic (LLM) staging path in a work clone (it persists a template into the repository's context and calls a model of its own; review cut); putting the staged list into the design prompt (the clone opens lazily, after the prompt); changing what secrets a work clone carries."

steps:
  - id: pin
    action: "Pin today: harness design turn over a repo whose nuget.config and .npmrc name private feeds; restore answers 401 until the user-level configs are written. Red before the fix."
  - id: opener
    action: "Pipeline-free MidRunRegistryAuth.StageAsync and RegistryFeedRestage.StageAsync/BeforeCommandAsync; WorkCloneOpener takes RegistryFeedRestage and stages after checkout."
  - id: restage
    action: "WorkCloneSet.BeforeCommandAsync re-stages through the opener's RegistryFeedRestage for a package command; DesignWorkToolHost calls it before running."
  - id: tests
    action: "Harness test green; unit tests: no registries stages nothing (step count pinned), registries stage after checkout and before the first model command, a package command re-stages."

tests:
  - "DesignTurnFeedCompositionTests.WorkClone_PrivateFeeds_RestoreWithStagedCredentials"
  - "DesignWorkCloneTests.WorkClone_RecordingSandbox_ExactlyOneStepCarriesTheToken_BeforeEveryModelStep (unchanged, no registries)"
  - "DesignWorkCloneTests.WorkClone_Registries_StagedAfterCheckout_RestagedBeforePackageCommand"
  - "DesignWorkCloneTests.FeedStaging_NoRegistries_RunsNoStep"

done:
  - "A design turn's run_command restore against private NuGet and npm feeds succeeds because credentials were staged (harness test red before, green after)."
  - "Code runs, the series check and work clones stage through SetupRegistryAuthHandler.StageInSandboxAsync; no second staging code."
  - "The secrets decision is recorded in decisions/2026-11-28-2c06.yaml."
  - "dotnet build, the full suite and the dashboard tests and build are green; the spec gate passes."
