# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-25-c5a7i
goal: "No secret value the server knows is sent to a model provider: every outbound message is masked with a named placeholder, and a model write carrying that placeholder is refused."

applies_to: "default (ChatClientFactory chain, SecretMasker, master and sub-agent write tools)"

requires: []

facts:
  - claim: "SecretMasker replaces known values longest-first, reads them live, skips values under six characters, and today runs only where traces and spec-format failures are written."
    evidence: "src/backend/AgentSmith.Contracts/Runs/SecretMasker.cs:20-51, src/backend/AgentSmith.Infrastructure.Persistence/Services/RunTraceWriter.cs:40-42, src/backend/AgentSmith.Application/Services/SpecExecution/SpecFormatFailureRecorder.cs:14"
  - claim: "The known values are the configuration's secrets plus every registry token; repo, connection and tracker credentials resolve from the same source."
    evidence: "src/backend/AgentSmith.Contracts/Services/LoadedSecretValues.cs:17-23, src/backend/AgentSmith.Contracts/Services/CredentialResolver.cs:19-24"
  - claim: "Registry tokens are written into the sandbox as staged auth files under /root, so reading them returns the token to the model."
    evidence: "src/backend/AgentSmith.Application/Services/Registry/StagedAuthFileWriter.cs:37-40, src/backend/AgentSmith.Application/Services/Handlers/SetupRegistryAuthHandler.cs:36-37"
  - claim: "Tool surfaces are composed in many places — master and children through ToolResultSanityWrapper, but also scout, docs, bootstrap and discovery surfaces that bypass it."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:102-118, src/backend/AgentSmith.Application/Services/ProjectAnalyzer.cs:47-48, src/backend/AgentSmith.Application/Services/Handlers/PostExecutePassTools.cs:35, src/backend/AgentSmith.Application/Services/Handlers/BootstrapDiscoverHandler.cs:127-129"
  - claim: "Every model request passes one chain built in ChatClientFactory, where a DelegatingChatClient already rewrites the outbound message list (the sensitive-tool history scrub)."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientFactory.cs:158-170, src/backend/AgentSmith.Infrastructure/Services/SensitiveToolHistoryScrubChatClient.cs:5-34"
  - claim: "ChatClientFactory is 251 lines under a 260 baseline."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:25"
  - claim: "get_artifact_credentials hands a token to the model on purpose and is named in SensitiveToolNames."
    evidence: "src/backend/AgentSmith.Contracts/Services/SensitiveToolNames.cs:10-18"
  - claim: "SecretMasker and ISecretValues are registered for server and CLI."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/LoopRuntimeExtensions.cs:40-43"
  - claim: "The write tools are write_file, edit and multi_edit; multi_edit's new text sits inside an edits array; master and children pass a wrapper that can refuse a call."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/Sanity/UnnamedRepositoryWrite.cs:16-18, src/backend/AgentSmith.Application/Services/Loop/Sanity/ToolResultSanityWrapper.cs:15-20, src/backend/AgentSmith.Application/Services/Loop/Sanity/RepositoryScopedWriteTool.cs:15-22"

scope:
  in: >
    Follows the server-known half of 2026-09-28-23a2b (masking tool output), done at the provider boundary where
    the values are known instead of in the agent. SecretValueMaskingChatClient, inserted in ChatClientFactory
    beside the history scrub so it sits in every chain, masks every known value in every outbound message's text
    and FunctionResultContent with [masked-secret], on a copy (the tool loop's own list keeps the raw text). The
    current turn's result of a SensitiveToolNames tool passes unmasked, by the scrub client's own rule.
    SecretMasker gains an Apply overload taking the placeholder; the trace keeps ***. MaskedPlaceholderWrite,
    applied in ToolResultSanityWrapper, refuses write_file, edit and multi_edit when any string argument at any
    depth carries [masked-secret], saying to change the real bytes with run_command.
  out: >
    Values only the cluster knows (Kubernetes-projected sandbox.secrets) and the live step output stream to the
    dashboard: the agent-side half of 23a2b, which stays planned under 23a2b. The write refusal on surfaces
    outside ToolResultSanityWrapper (bootstrap and docs writers): they see masked text too; a placeholder written
    there replaces bytes the model never saw (named residual). Encoded forms of a value: exact-value masking stops
    accidents; exfiltration is the network's (2026-10-25-c5a7d, 2026-10-25-c5a7g). Gates read the raw diff
    server-side and are unaffected.

decisions:
  - key: "AT THE PROVIDER BOUNDARY. Wrapping tool surfaces misses every surface that bypasses the sanity wrapper; the chat chain is the one place every request crosses, and the server holds every value it put into a sandbox."
  - key: "A NAMED PLACEHOLDER. '***' occurs in ordinary text and cannot anchor a refusal; [masked-secret] can."

steps:
  - id: mask
    action: "SecretMasker.Apply(text, placeholder); SecretValueMaskingChatClient; ChatClientFactory takes SecretMasker and inserts it."
  - id: refuse
    action: "MaskedPlaceholderWrite as a DelegatingAIFunction in ToolResultSanityWrapper."

tests:
  - "SecretValueMaskingChatClient_ToolResultCarriesARegistryToken_ProviderSeesPlaceholder"
  - "SecretValueMaskingChatClient_UserText_IsMasked"
  - "SecretValueMaskingChatClient_FreshSensitiveToolResult_PassesUnmasked"
  - "SecretValueMaskingChatClient_CallerMessageList_IsNotMutated"
  - "ChatClientFactory_AnyTask_ChainContainsTheMasker"
  - "MaskedPlaceholderWrite_MultiEditNestedNewString_IsRefused"
  - "MaskedPlaceholderWrite_OrdinaryWrite_Passes"

done:
  - "a scout, a master and a sub-agent reading a staged .npmrc each send [masked-secret] to the provider"
  - "a master edit carrying the placeholder fails and never writes it"
  - "build green, full suite green"
