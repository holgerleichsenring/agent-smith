# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-5669e
goal: "The System, Access and identity pages speak German when German is chosen."

applies_to: "dashboard (components/system, access, identity)"

requires: [2026-11-22-5485a, 2026-11-23-5669a]

facts:
  - claim: "System and Access headings are English literals."
    evidence: "src/dashboard/src/components/system/WebhookLog.tsx:20, src/dashboard/src/components/access/AccessStudio.tsx:48"

scope:
  in: >
    Every literal UI text under components/system/**, components/access/** and components/identity/** moves to keys in lib/i18n/areas/system.ts and lib/i18n/areas/access.ts.
  out: >
    Text the model writes, server-sent messages and refusal reasons; product nouns (Work it out, Spec, Ticket, Run,
    Turn, Review). Follows 2026-11-22-5485b, which cut the rest of the dashboard into this series.

steps:
  - id: translate
    action: "Every literal UI text in the area moves to keys in the area's dictionary module, German beside English; components call useT, pure helpers that word text take the lookup; dates use the chosen language."
  - id: tests
    action: "Existing tests stay green in English; one component of the area renders German when German is chosen."

done:
  - "No literal UI text is left under components/system, access and identity."
  - "Dashboard tests and build green."
