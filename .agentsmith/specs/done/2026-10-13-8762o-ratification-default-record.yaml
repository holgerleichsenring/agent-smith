spec: 2026-10-13-8762o
goal: "A master takes a choice no person must make with decide_by_default and goes on at once; each such default and each proposed feedback memory becomes a pending row a person can ratify later."

applies_to: "backend (decide_by_default tool, event 88, RunDefaultDecisions projection and migrations on both providers, remember's pointer row) + the dashboard's hub-events mirror + the coding-agent-master and design-partner-master skills on the series' skills branch"

requires: [2026-10-13-8762e, 2026-10-13-8762m]

