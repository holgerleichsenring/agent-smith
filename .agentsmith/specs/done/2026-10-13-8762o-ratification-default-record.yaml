assumptions:
  - "2026-10-13-8762e lands EventType 87 as one line and shortens the 042eh comment by one, leaving EventType.cs at 119 lines."
  - "2026-10-13-8762m lands MasterRecordToolHosts returning a MasterRecordTools record this spec can append a member to."
  - "2026-10-13-8762e takes RunRecordIdentityConfiguration from 41 to 42 lines; this spec adds one Unique line, 42 -> 43."
  - "2026-10-13-8762p reads the rows as DecidedDefault (id, runId, specId, question, chosen, verdict, note, by, at) and writes each decided one into decisions/<specId>.yaml as '[default #<id>]'; the columns below are what it reads."

scope:
  in: >
    EVENT: DefaultDecisionTakenEvent (Contracts/Events/DefaultDecisionEvents.cs), EventType.DefaultDecisionTaken = 88,
    fields exactly as series contract 2.1: RunId, Timestamp, SpecId?, Question, Chosen, Alternatives[], Why,
    HoldsSeries, Kind (decision | memory-proposal), PointerPath?, Conversation? (appended last: the design turn's
    ContextKeys.DialogueJobId, null in a coding run). Constants DefaultDecisionKinds and
    DefaultDecisionVerdicts (pending | ratified | overruled) in Contracts/Decisions. EventTypeResolver arm. RECORDER:
    DefaultDecisionRecorder(IEventPublisher publisher, string runId, string? specId, string? conversation), built per
    master start by MasterRecordToolHosts from ContextKeys.RunId, CurrentSpec and DialogueJobId; publishes best-effort
    and returns whether it published. TOOL: decide_by_default(question, chosen, alternatives[], why, holds_series) on
    DefaultDecisionToolHost; each text required, question and chosen at most 500 characters, why at most 1000, one to
    eight alternatives of at most 300; returns at once — "taken by default, recorded for ratification" or, when the
    publish failed, "NOT recorded" with the choice repeated; never waits. Its description states the contract: a choice
    a person might overrule but need not make first; holds_series true holds only the next automatic attempt; a choice
    that needs a person before work continues stays ask_human; a default is not also logged with log_decision or
    written to decisions.md.
    SURFACES: MasterRecordTools gains DefaultDecision, built by MasterRecordToolHosts where a run id exists;
    MasterToolComposition adds it after BaseSurface for the coding master and the design partner, never for a scan
    master or a child. POINTER ROW: MemoryWriteToolHost takes the recorder (optional) and, after writing a feedback
    entry — from any surface that carries remember, a coding master's children included — publishes event 88 with Kind memory-proposal, Chosen = the slug, PointerPath = "{repository}/.agentsmith/memory/{slug}.md",
    a fixed question, empty Why and no alternatives — never the body or the description. TABLE: RunDefaultDecision
    (Id long, RunId, EventSeq long?, SpecId, Question, Chosen, AlternativesJson, Why, HoldsSeries, Kind, PointerPath, TakenAt,
    Verdict default pending, VerdictBy, VerdictAt, VerdictNote, Conversation) in Children of RunChildConfiguration,
    configured by RunDefaultDecisionConfiguration: table RunDefaultDecisions, indexed-string lengths on SpecId, Kind,
    Verdict and Conversation (indexed); the unique (RunId, EventSeq) is Unique<RunDefaultDecision> in
    RunRecordIdentityConfiguration, so SQL Server gets its NULL filter. DESIGN TURN: the row is keyed by the turn's own run id
    like any run's and carries the conversation; 2026-10-13-8762p lists it on the ticket the conversation is bound to,
    resolved when read. RunDeletionRepository deletes the rows; DataArchiveSchemaTests' count 38 -> 39. PROJECTION: RunDefaultDecisionProjection : IRunEventFamily inserts one row per event with a
    trail position, skipping one HoldsAsync finds, and skipping a memory-proposal whose run already holds a PENDING
    memory-proposal row with the same PointerPath (a second remember of one slug); it never updates. MIGRATIONS: AddRunDefaultDecisions in both
    providers with their snapshots. MIRROR: hub-events.ts enum 88, DefaultDecisionTakenEvent, union member; FilterRail
    LABELS and eventFilterQuery TYPE_KEYS rows. ONE PLACE PER CHOICE: SpecExecutionPromptFactory.cs:67
    becomes "Take a choice a person might overrule with decide_by_default; log every other non-obvious choice via
    log_decision as you go." (net zero lines). SKILLS on skills branch spec/2026-10-13-8762 (the build note quotes
    each exact sentence): coding-agent-master lines 291-292 ("… decisions.md … and also via log_decision") gain
    "except a choice taken with decide_by_default, which is recorded only there", 294 "decide and log" becomes
    "decide_by_default for a choice a person might overrule, log_decision for an implementation choice", and 598,
    606 and 617 name decide_by_default the same way; design-partner-master names decide_by_default beside ask_human.
  out: >
    Reading the rows per ticket and writing Verdict, VerdictBy, VerdictAt and VerdictNote —
    2026-10-13-8762p. The Defaults tab — 2026-10-13-8762q. Holding the next automatic attempt on a pending
    holds_series default — 2026-10-13-8762v. Writing a ratified or overruled default into decisions/<specId>.yaml on the ticket branch as
    "[default #<id>]" at the next attempt's record step, so deleting a run loses nothing a person decided —
    2026-10-13-8762p. Marking a memory-proposal row of a finished run that delivered no pull request as not landed (TicketDefaultView.landed false) in the read — 2026-10-13-8762p (the row names its run). Editing a memory file's status after ratification — nobody:
    a branch change made by the next rework (series contract section 5 default 52, decision 16). Listing an UNBOUND design turn's default anywhere but
    that turn's own tool answer — nobody: no ticket exists to list it on (series contract decision 24). The hand_forward host and the
    extraction it rides on — 2026-10-13-8762m. Releasing the skill edits — 2026-10-13-8762x. A SystemEventType —
    nobody: none is minted (series contract 2.1).

decisions:
  - key: "THE MASTER RECORDS A DEFAULT IN ONE PLACE; GIT GETS THE DECIDED ONE. The master never also logs a default with log_decision or into decisions.md — the prompt and skill texts that said 'log every choice' are rewritten so. RunDefaultDecisions holds the pending default and its verdict; once a person ratifies or overrules it, 2026-10-13-8762p writes that decided default into decisions/<specId>.yaml as '[default #<id>]', so a deleted run loses nothing a person decided (main-thread decision 9, default, pending operator ratification). A pending default is never written to git: it would disagree the moment it is overruled."
  - key: "THE UNIQUE INDEX GOES WHERE EVERY OTHER ONE IS. Unique<RunDefaultDecision> in RunRecordIdentityConfiguration with EventSeq long?, as RunSegment, so SQL Server (production) gets '[EventSeq] IS NOT NULL'; an entity configuration cannot see the provider."
  - key: "ONE PENDING POINTER PER FILE PER RUN. remember upserts by slug, so a second feedback write of one slug is the same proposal; the projection skips it while the first row is pending."
  - key: "CHILDREN'S MEMORY PROPOSALS COUNT. A coding child carries remember through BaseSurface; its feedback write is a proposal like the master's and publishes a pointer row. decide_by_default stays off children."
  - key: "NEVER BLOCKS. The tool returns in the same call; holds_series only flags the row for 2026-10-13-8762v. Series contract section 5 default 50 (decision 14), pending operator ratification."
  - key: "POINTER, NOT BODY. A memory proposal's row carries the path and the slug; the body and its index line stay in the memory files, which are what a ratification is about. Series contract section 5 default 52 (decision 16), pending operator ratification."
  - key: "THE PROJECTION ONLY INSERTS. The verdict columns are declared here and written only by 2026-10-13-8762p's endpoint, so a replayed event can never reset a verdict."
  - key: "decide_by_default NOT ON SCAN MASTERS OR CHILDREN. A scan reviews read-only and a child's choice belongs to its master."
  - key: "BOUNDS AS SHOWN (500 / 1000 / 8 x 300). A row is read in a batch list; an unbounded text makes the list unreadable. Default, pending operator ratification."
  - key: "A FAILED PUBLISH IS SAID, NOT HIDDEN. The tool answers NOT recorded, as log_decision does when its log is unavailable, so the master can ask instead of believing a person will see it."
  - key: "EVENTTYPE.CS GOES TO 120 (series contract section 4). 2026-10-13-8762e keeps the file at 119 while adding 87; this spec adds DefaultDecisionTaken = 88 as ONE line, 119 -> 120, and folds no comment."
  - key: "A DESIGN TURN'S DEFAULT IS KEYED BY ITS CONVERSATION (series contract decision 24, default, pending operator ratification). The turn is a run whose row names no ticket, so a row keyed by run id alone reaches no ticket page. Chosen: one nullable Conversation column filled from ContextKeys.DialogueJobId, which the turn already seeds; the binding is resolved when 8762p reads, so a conversation bound after the default still lists it. Refused: a nullable RunId (every event and projection is keyed by a run) and a sibling store (a second table for one datum)."
  - key: "REQUIRES 2026-10-13-8762e, NOT ONLY m (round-2 review note). The line arithmetic (EventType 119 -> 120, RunRecordIdentityConfiguration 42 -> 43), the archive count 38 -> 39 and the migration after AddRunSpecReviewRounds all assume e landed; the edge states what letter order already guarantees."
  - key: "THE DESIGN CHILD'S remember EXCLUSION FILTERS BY TOOL NAME (SpecDialogChildTools.cs:31-33). 2026-10-13-8762d's sanity wrapper wraps every master and child tool, so it must keep each tool's Name, or a design child would publish pointer rows; that is d's to hold (round-2 review note, no cut here)."
  - key: "BACKEND CONTEXT. Recorded in the default context (series contract section 5 default 72, decision 23)."

