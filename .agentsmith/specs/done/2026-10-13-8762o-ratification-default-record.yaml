done:
  - "A master that takes a default keeps working in the same turn, and the run's RunDefaultDecisions table holds a pending row with the question, the choice, the alternatives, why, and whether it holds the series."
  - "A proposed feedback memory appears as a pending row naming its file and slug, and its body appears nowhere but the memory file."
  - "Replaying a run's trail adds no second row and leaves a verdict already written untouched."
  - "A scan master's and a sub-agent's tool lists do not contain decide_by_default."
  - "No prompt or skill text the coding master reads tells it to log a decide_by_default choice again with log_decision or in decisions.md."
  - "The SQL Server migration's unique (RunId, EventSeq) index on RunDefaultDecisions is filtered to EventSeq IS NOT NULL."
  - "Both providers migrate to a schema with RunDefaultDecisions."
