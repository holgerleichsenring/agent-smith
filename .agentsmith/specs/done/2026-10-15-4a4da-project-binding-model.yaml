assumptions:
  - "An added field on the /api/identity answer is not a behaviour change; with auth.enforce off every refusal and every list stays as today, because nothing in this slice reads ProjectPermissions to decide anything."
  - "A binding names its project by the configured project key; a project renamed is a project deleted and another created, so its binding is reported unknown (by 2026-10-15-4a4df) until edited."

scope:
  in: >
    CONTRACTS: PersonRef (Contracts/Models/Configuration, Claim and Value, at most 20 lines); ProjectBinding (same
    folder, Project, Groups List<string>, People List<PersonRef>, Roles List<string>, at most 30 lines);
    RoleMappingConfig.ProjectBindings List<ProjectBinding> = [] (76 -> at most 84). IsEmpty and From stay as they
    are: the bootstrap block has no bindings to seed. CATALOG: Permissions.ProjectScopable = runs.read, runs.watch,
    runs.control, runs.delete, projects.init, dialog.write, an IReadOnlySet<string> under the ordinal comparer that
    every later slice asks as Permissions.ProjectScopable.Contains(name) (77 -> at most 88); every other catalog name is
    global-only. READER: ProjectBindingReader (Server/Security, at most 100 lines), built in ResolvedRoleMapping.From
    from the mapping, the name claim and the RoleCatalog (22 -> at most 26). Per binding it keeps the role bundles'
    project-scopable permissions and drops the rest; a caller matches a binding through a group value (ordinal,
    one leading slash trimmed on both sides) or a person ref whose Claim is the name claim and whose Value equals
    Identity.Name ordinally. Permissions(caller, groups) answers project -> sorted distinct permissions under
    ConfigNames.Comparer, two bindings of one project unioned. The reader reports NOTHING: a role's global-only
    permissions are dropped silently, a binding with a blank project is ignored, a person ref on another claim matches
    no caller. Every binding finding (grants nothing, names no configured project, person ref on a stale claim) is
    composed by 2026-10-15-4a4df on the access view (access.read) and never on the /api/identity answer every caller
    reads, which would otherwise name projects to a caller who may not see them. IDENTITY: CallerIdentity gains
    ProjectPermissions (IReadOnlyDictionary<string, IReadOnlyList<string>>, keyed under ConfigNames.Comparer) after
    Permissions, and the method IReadOnlyList<string> PermissionsIn(string project) answering Permissions unioned with
    ProjectPermissions[project] (29 -> at most 45). The resolver fills it for an
    authenticated caller, an empty map for the anonymous one; its Findings are unchanged (111 -> at most 117).
    RefusalWireNamesTests' identity field list gains projectPermissions. Token permission claims, identity.read and AGENTSMITH_ADMIN_GRANT stay in the global list
    only. The access view is untouched by this slice. KEEPING BINDINGS: PersonRemover's field-by-field copy
    carries ProjectBindings verbatim (deep-copied like GroupRoles), so a removal never erases a binding
    (72 -> at most 78); withdrawing the removed person's refs is 4a4df's. AdminRoute and SignInFacts are unchanged: a binding never reaches admin. SCHEMA: config/agentsmith.schema.json
    declares role_mapping.project_bindings as an array of closed objects (project, groups, people as closed
    {claim, value} objects, roles). DOCS: the role_mapping row at agentsmith-yml.md:310 names project_bindings.
  out: >
    Route enforcement — the handler checking PermissionsIn for a route's project, route project sources, the list
    marker, 404 instead of 403 and the guard column — 2026-10-15-4a4db. Hub method project resolution and
    per-project overview groups — 2026-10-15-4a4dc. Filtering /api/runs, /api/tickets and every other list, and
    GET /api/projects — 2026-10-15-4a4dd. The dashboard reading projectPermissions, useLacksPermission(p, project),
    the identity page's per-project block and the empty states of a caller reaching no project (read from GET /api/projects) — 2026-10-15-4a4de.
    The Projects pane in the Access Studio, the AccessDocument TypeScript type gaining projectBindings, the
    project-scopable list served to the pane, and the access-control.md section on project scoping —
    2026-10-15-4a4df — which also owns the access view's configured-project list and EVERY binding finding
    (ProjectBindingFindings, appended by AccessViewComposer: grants nothing, names no configured project, person ref on
    a stale claim), the blank-project refusal on save, the withdrawal of a removed person's refs from bindings,
    and RoleRemovalGuard counting binding holders. Seeding bindings from the bootstrap auth block — nobody: the operator's ruling keeps
    assignment on the access surface. Project-scoped config.* or secrets.* — nobody: config stays global admin
    business (operator ruling 2).

decisions:
  - key: "BINDINGS BESIDE THE GLOBAL GRANTS, NOT A PROJECTS FIELD ON THEM — GroupRoles, PersonGrants and the role claim keep their exact meaning, so every stored mapping is unchanged and no content migration exists; the alternative, an optional projects list on each grant, would change what an existing grant means the day a list is added to it."
  - key: "ONE READER IN THE RESOLVED MAPPING, NOT IN THE RESOLVER — the resolver is at 111 of 120 lines, and the resolved mapping is rebuilt once per save, so a binding's bundle is cut to project-scopable permissions once rather than per request; mirroring PersonGrantReader keeps one shape for 'what this document grants a caller'."
  - key: "GLOBAL-ONLY PERMISSIONS ARE DROPPED SILENTLY — every built-in bundle carries catalog.read, diagnostics.read or identity.read, so reporting each dropped permission (the brief's rule) would put a finding on every binding that names reader or operator; the operator learns what a binding does from the pane (4a4df), and the one finding that matters, a binding that grants nothing, is 4a4df's."
  - key: "BINDING FINDINGS ON THE ACCESS VIEW, NOT ON /api/identity — the identity answer reaches every authenticated caller and the catalog and grant findings already ride on it; a binding finding names a project, and operator ruling 1 says a caller without rights on a project must not see it. The alternative, filtering findings to the caller's own bindings, is per-request work for a diagnosis only an administrator can act on."
  - key: "THIS SLICE COMPUTES NO FINDING — the unknown-project finding needs the configured names, which the per-request resolver must not load (the server loader assembles the whole configuration per call), so it can only be composed where the access view reads them (4a4df); composing the other binding findings here and that one there would give one sentence family two homes, and a finding computed here before 4a4df surfaces it would be a step that does nothing. The binding is applied either way, so a project recreated under its old name is governed at once."
  - key: "PROJECT NAMES FOLD CASE — the resolved projects map uses ConfigNames.Comparer, so a binding for 'Billing' must govern runs of 'billing'; group values and person values stay ordinal as today."
  - key: "PermissionsIn IS THE ONE UNION — 'global plus project' is stated once on CallerIdentity so the route handler, the hub and the list filters of 4a4db..d ask one method instead of re-deriving it; it is a method, so the wire answer gains only ProjectPermissions."
  - key: "A BINDING NEVER REACHES ADMIN — admin in a binding means every project-scopable permission in that project; AdminRoute and SignInFacts keep counting global routes only, so a mapping whose only admin sits in a binding is refused by the invariant."
  - key: "PERSON REMOVAL CARRIES BINDINGS HERE, WITHDRAWS REFS IN 4a4df — its field-by-field copy would erase every binding on the first removal after this slice lands, which is data loss and so cannot wait; withdrawing the person's refs (and dropping a binding the withdrawal leaves memberless) is a rule 4a4df states with its pane, and stating it twice would give two rules."

steps:
  - id: contracts
    action: "PersonRef (at most 20 lines) and ProjectBinding (at most 30 lines) in Contracts/Models/Configuration; RoleMappingConfig.ProjectBindings (76 -> at most 84)."
  - id: catalog
    action: "Permissions.ProjectScopable with the six names (77 -> at most 88)."
  - id: reader
    action: "ProjectBindingReader (at most 100 lines, every method at most 20 lines) with Permissions(caller, groups) and no findings; ResolvedRoleMapping carries it as Projects (22 -> at most 26)."
  - id: identity
    action: "CallerIdentity.ProjectPermissions after Permissions plus PermissionsIn(project) (29 -> at most 45); CallerIdentityResolver fills it for both constructions, findings unchanged (111 -> at most 117); RefusalWireNamesTests names projectPermissions."
  - id: keep-bindings
    action: "PersonRemover.Without copies ProjectBindings deep (72 -> at most 78)."
  - id: schema
    action: "config/agentsmith.schema.json gains role_mapping.project_bindings, every object closed; ConfigSchemaCoverageTests stays green."
  - id: docs
    action: "agentsmith-yml.md:310 lists project_bindings with its four keys."
  - id: tests
    action: "Red first, then green, for every test below; run the Server.Auth, Server.Access, ConfigStudio and Configuration.ConfigSchemaCoverageTests classes with --filter. New test classes stay at most 120 lines each (FileLengthRatchetTests)."

