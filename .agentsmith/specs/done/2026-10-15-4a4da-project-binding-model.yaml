done:
  - "An administrator stores a role mapping with project bindings (groups, people and roles per project) through PUT /api/access or a config import, and GET /api/access returns them verbatim; an existing mapping without bindings grants, reads and saves as before, and an export carrying bindings validates against the shipped schema."
  - "A caller in a bound group or named in a binding sees projectPermissions on /api/identity holding only run, init and dialog permissions for that project; their global permissions are unchanged and nothing they could or could not do changes until 2026-10-15-4a4db."
  - "A binding whose roles carry no project-scopable permission, a binding with no project and a person ref on another claim grant nothing; no caller's identity page names a project through a finding (the access view reports them from 2026-10-15-4a4df)."
  - "Removing a person on the Access page leaves every project binding in place; a mapping whose only admin is in a binding (and that reads no role claim) is refused as having no route to admin."
  - "Build green, full suite green, dashboard gen/test/build green."
