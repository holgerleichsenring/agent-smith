spec: 2026-10-15-4a4da
goal: "The role mapping gains project bindings giving groups and people roles in one project; the resolver answers per-project permissions beside the global ones, and nothing enforces them yet."

applies_to: "backend (RoleMappingConfig.ProjectBindings with ProjectBinding and PersonRef, the project-scopable mark in the permission catalog, ProjectBindingReader in ResolvedRoleMapping, CallerIdentity.ProjectPermissions and PermissionsIn, no binding finding of its own (2026-10-15-4a4df composes every one on the access view), the person removal that must carry bindings, YAML export/import, the config schema and the field reference)"

requires: []

