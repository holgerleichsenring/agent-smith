# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762j
goal: "A series carries a contract — shared names, numbers, data owners, file areas, per-member line budgets — and a cut or epic whose contract collides is refused with every collision named."

applies_to: "backend (Contracts/Specs series contract, the derivation parser, the epic outcome parser, filing, the series manifest) + the derivation and design-partner skill text"

requires: [2026-10-13-8762g, 2026-10-13-8762i]

facts:
  - claim: "SpecSet is a positional record whose later fields (Goal, SeriesRepos) are init properties, and OfRepository keeps every series-wide field when it narrows the set to one repository."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:25-36, src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:72-87"
  - claim: "The series manifest is SeriesManifestDocument, serialized and parsed by SeriesManifest with one YamlDotNet configuration that ignores unmatched properties; SeriesManifest.cs is 118 lines."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesManifestDocument.cs:13-49, src/backend/AgentSmith.Application/Services/Specs/SeriesManifest.cs:14-45"
  - claim: "The run reads the set back from the newest manifest; SetOf copies the manifest's series-wide fields onto the SpecSet."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:84-92"
  - claim: "work-spec.schema.json describes the p0390 work spec (key, goal, requirements, revisions), not the series manifest; it is embedded but no code reads it."
    evidence: "src/backend/AgentSmith.Application/AgentSmith.Application.csproj:67-70, .agentsmith/schemas/work-spec.schema.json:5-9"
  - claim: "No source file other than the csproj names work-spec.schema.json."
    evidence: "observed: 2026-10-14, grep -rn 'work-spec.schema' over src/ and tests/ in the 8762 worktree finds only the csproj embed and a SourceFileEnumeratorTests path string"
  - claim: "The derivation reply is one JSON object; the parser computes spec ids by position and rejects a reply with more than SpecSet.MaxSpecs specs; SpecDerivationParser.cs is 119 lines."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:82-108"
  - claim: "A rejected parse goes back to the deriver as 'Your cut was rejected' with the reason, inside the shared attempt budget."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:80-84"
  - claim: "Every derived spec requires the one before it, so a derived set is a single chain."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/DerivedSpecBuilder.cs:57-61"
  - claim: "The derivation reply shape the pinned skill teaches carries specs, discarded, discarded_contexts, ignored_instructions and handback — no contract."
    evidence: "observed: 2026-10-14, git show v5.15.0:skills/_masters/spec-derivation-master/SKILL.md lines 21-41 in agent-smith-skills"
  - claim: "EpicOutcomeParser reads parent and children from the outcome map, refuses with OutcomeInvalid, and ends with the requires-edge check."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/EpicOutcomeParser.cs:26-73"
  - claim: "An invalid design-turn outcome is re-prompted once with its error; a second invalid one fails the outcome."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:677-711"
  - claim: "RequiresEdgeChecker accepts only sibling ids, unique ids and no cycle; free-text requires pass through."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/RequiresEdgeChecker.cs:20-51"
  - claim: "EpicOutcome is a positional record of Parent and Children on the OutcomeProposal base, which carries Templates and Findings as init properties."
    evidence: "src/backend/AgentSmith.Contracts/Models/OutcomeProposal.cs:10-44"
  - claim: "A proposal is stored on the session through OutcomeProposalJson's Dto, whose epic arm carries only Parent and Children."
