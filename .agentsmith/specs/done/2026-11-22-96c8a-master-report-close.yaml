assumptions:
  - "The final reply of a loop that ended on its own is an assistant message without a function call (the function-invocation loop stops when the model answers without one); a pass cut by the iteration ceiling ends on a call. Pinned by the 845e-shape and ceiling tests, not taken on trust."

scope:
  in: >-
    The coding master on every spec whose block is PipelinePresets.CodeSpecBlock (the code preset and its aliases
    fix-bug, add-feature, …; its stage-repair and review-fix passes; worker mode; every provider) ends on its report.
    finish_spec is removed: FinishSpecToolHost, FinishSpecFollowUp, MergedTools.FinishSpec,
    MasterRecordTools.FinishSpec and every text that asks for it (MasterClosing.Coding, the verdict nudge,
    MasterFinishLead, the apply and re-engage nudges, the in-pass reminder, ContextPressureFinalizingChatClient,
    the spec contract, the declared-gate block, the stand-in and write-only blocks, remember's description) and the
    docs that describe it. The report is read per pass. One structured read of the report (MasterReportReader,
    summarization role, JSON schema) yields follow-ups, refused instructions with reasons, the build note and
    relied_on. VerifySpec's rule becomes stages + report present. Re-engagement keeps one re-drive for open
    checklist steps; the verdict nudge goes. A spec derivation asks through ask_human and SpecDerivationGate hands
    that question back. Pass words, the coding-agent-master skill text (3.5.0) and, after its release, the pin.
  out: >-
    Scan, pr-review, design-partner, mad-discussion, legal-analysis, admin and series masters: they never had
    finish_spec and stay as they are (only the shared closing/context-pressure texts lose the finish_spec
    sentence). The spec-derive block: its master writes a spec and gets no reader. Renaming the MasterVerification
    type and its pipeline key (doc updated instead). A pre-change baseline test run (none exists; named as dropped
    below). Any rule acting on what the report says about its own outcome. The stored AcceptanceJson/RunPass shapes
    and the MasterPassEndedEvent contract (unchanged, values reworded). A per-done-line judge (retired in 98fa). More
    than one ask for a missing report. Releasing the skills change and the pin
    commit (the coordinator's).

decisions:
  - key: "THE REPORT IS WHAT THE PASSES ENDED ON: a pass's ending text is the text of its final assistant message (text beside a tool call counts only there); within one master step the report is every pass's ending text in order, joined with a blank line, an identical text once — a re-drive's one-liner adds, never replaces. A step whose passes ended on no text at all is asked ONCE (the old verdict nudge's place): 'Your last reply had no text. Write your report for the person as your reply.'"
  - key: "DELIVERY RULE: stages green (existing order) + a report -> Done; red -> StageRepair or Failed with the failing output (unchanged); no report -> Failed (NoReport, replaces NoFinish). What the report says about its own outcome is shown, never acted on — as today."
  - key: "ONE READ, STRUCTURED, NEVER BLOCKING: a JSON-schema ResponseFormat (what GetResponseAsync<T> with useJsonSchemaResponseFormat: true sends) on the summarization role, and the reader's own prompt states the JSON shape, so a provider that ignores ResponseFormat still answers the shape; deserialized and validated on every provider; any failure leaves the report and no extracted fields."
  - key: "FACTS FROM THE PIPELINE, NOT THE MODEL: test results come from the stages, so failing/baseline test ids and the green/no-tests/failed status are dropped rather than re-extracted."
  - key: "A QUESTION IS ask_human: it parks (code) or is handed back (derivation); a report saying the work is not done is shown as written and the stages decide, as today."
  - key: "HandForward STAYS THE ONE WRITER of the build note and memory reliance (class renamed SpecHandForward); the read is admitted through its own checks entry by entry."
  - key: "RE-ENGAGEMENT SPEND SHIFTS, named: a green finish with open actionable steps used to stop (nothing-left) and now re-drives once; a text-only end over a drained ledger used to get the verdict nudge and one re-drive and now gets none."
  - key: "NO-CHANGE SPECS, named: a master that changes nothing and ends on a report ('No changes needed.') is delivered on that report — as one that called finish_spec green with no diff was; only the text-only end NoFinish used to fail changes. No new rule acts on it (operator)."
  - key: "AN APPLY DRIVE'S ENDING TEXT JOINS THE REPORT: in a stage-repair step the builder keeps the first step's write log, so the repair step's own log is empty and the apply drive asks once more; what it ends on is added (identical text once)."
  - key: "NOTHING THE RECORDING DOES FAILS THE STEP: the read, the memory stores, the note — any exception (cancellation excepted) is a read problem, logged; the stages decide."
  - key: "ANTHROPIC CARRIES THE FORMAT: pinned through the Claude builder's IChatClient — output_config.format json_schema under structured-outputs-2025-11-13; the schema is strict-compatible (closed objects, every property required, no nullable arrays), so the format stays set for Claude."
  - key: "THE SPEC'S REPORT ADDS UP OVER ITS STEPS: a stage repair, structure correction or review fix adds its report after the spec's earlier one (MasterReport.After; identical text once), so a repair's one-liner never replaces the full report."
  - key: "See .agentsmith/decisions/2026-11-22-96c8a.yaml."

field_map:
  # what each finish_spec value becomes — the invariant's checklist
  - "Report (markdown) -> MasterReport.Append per pass, MasterReport.Join per step -> MasterVerification.Report -> SpecAccount.Report -> AcceptanceJson.Reports -> ticket 'reported' chip, run badge, check section (unchanged chain). The reader reads that joined report, so pass-0 follow-ups are never lost."
  - "follow_ups -> MasterReportReader.follow_ups [{goal, why}] -> appended to the spec's merged list ContextKeys.SpecFollowUps (one per goal, ignoring case) after every read — first pass, structure correction, each stage repair -> MasterReportAccount reads that list -> AcceptanceJson.FollowUps -> ticket follow-up filing (unchanged). The reader is never told which follow-ups exist."
  - "ignored_instructions -> reader.ignored_instructions [{quote, reason}] read from the report and the master's log_decision lines; kept only when the quote appears in the report or a decision line -> appended to the run-level ContextKeys.RunIgnoredInstructions (one per quote, across specs and passes; a failed read clears nothing) -> TicketInstructionIgnoredEvent + result.md section (WriteRunResult reads the run list); gains the reason finish_spec dropped."
  - "renamed / moved / persisted / deviations -> reader lists -> SpecHandForward.RecordReadAsync: first 20 per list, entries over 300 characters and renamed/moved entries without ' -> ' dropped and logged; a read overwrites only the fields it names (the rest of the note stands) -> HandForward -> SpecBuildNotes -> spec record + next spec's prompt (unchanged readers)."
  - "series-contract conflicts (HandForward's answer text, HandForwardToolHost.cs:78-85) -> LOGGED by the recorder; the model that once read them in the tool result is no longer in the loop when the note is written."
  - "relied_on -> reader.relied_on, given the memory index the master was shown -> each entry resolved alone; unresolved dropped and logged -> united with the spec's earlier reliance (an empty list never replaces one) -> MemoryReliance + MemoryUseRecordedEvent (the projection replaces per run and spec, so the union is the record) -> MemoryOutcomeRecorder at run end (unchanged)."
  - "status blocked + blocker -> a question: ask_human (code: parks via MasterOpenQuestions; derivation: SpecDerivationGate hands it back). A non-question -> DROPPED as a field: the report says it, shown as written. Operator-visible: the open loop no longer stops on a blocked/red claim (it stops on its own rules: budget, open steps after one re-drive, idle, self-refilled, cap)."
  - "status failed -> DROPPED: no rule acts on it today but the loop's red-with-open-steps re-drive; open steps re-drive once on their own and the stages repair red mechanically."
  - "status green / no-tests -> DROPPED: the stages are the build/test truth. Operator-visible: the pass GateLine says 'report written' / 'no report' instead of 'finish_spec: Green'; log lines drop the status."
  - "summary -> DROPPED as a field: the derivation's 'It reported:' sentence quotes the report's first non-empty line; the re-engage working-state block loses its 'Last build/test' line (the master's transcript, carried in PriorMessages, holds its command outputs)."
  - "failing_tests / baseline_failing_tests -> DROPPED: no reader since c8e2c; the failing output reaches the operator from the stage (VerifySpec failure tail, StageRepair item). No baseline exists; a stage already red before the change fails the spec, as it does today."
  - "BuildRan / BuildPassed / TestsRan / TestsPassed -> DROPPED: no reader."
  - "VerdictEmitted / GateLine (MasterPassEndedEvent, RunPass columns) -> 'the pass wrote a report' and 'report written' / 'no report'; contract and columns unchanged, stored rows keep their old text."

steps:
  - id: model
    action: >-
      MasterVerification becomes (Report, FollowUps, IgnoredInstructions, ReadProblem): drop Status, the four
      build/test booleans, Summary, FailingTests, BaselineFailingTests, Blocker and BlockedClaim; delete
      VerificationStatus and MasterBlockedClaim; update the record's and ContextKeys.MasterVerification's docs.
      MasterReport.OfPass(response): the final message's text when it is an assistant message with text (beside a call
      or not), else null; MasterReport.Append adds a pass's ending text unless identical text is already there, and
      MasterReport.Join makes the step's report. MasterReport.Of and Standing are deleted.
  - id: reader
    action: >-
      MasterReportReader (Application/Services/Specs/Reports): one call per master step end on a CodeSpecBlock spec, skipped
      when the cost budget is spent or the report is null. Input: the report, the master's decision lines, the
      memory index section, the follow-ups proposed so far. Output MasterReportExtract {follow_ups[{goal,why}],
      ignored_instructions[{quote,reason}], renamed[], moved[], persisted[], deviations[], relied_on[]} with
      ChatOptions.ResponseFormat = ChatResponseFormat.ForJsonSchema(AIJsonUtilities.CreateJsonSchema(typeof(MasterReportExtract)), strict transform: closed objects, every property required)
      — what GetResponseAsync<T>(useJsonSchemaResponseFormat: true) sends, built from Microsoft.Extensions.AI.Abstractions,
      which the Application layer already references (GetResponseAsync<T> lives in the Microsoft.Extensions.AI package,
      which it does not) — on chatClientFactory.Create(agent, TaskType.Summarization), cost-tracked as role
      'report-reader' like FindingRefuter. The system prompt states the JSON shape itself, and the answer is
      deserialized from its outermost {…}, so a fenced or prefaced answer still parses. Any exception (cancellation excepted), an
      unparseable or null result -> a read problem, warning logged.
  - id: recorder
    action: >-
      MasterReportRecorder (all of it inside one try/catch: any failure is a read problem): builds MasterVerification
      from the joined report and the read — follow-ups with a goal,
      ignored instructions whose quote appears in the report or a decision line — and hands the build-note lists and
      relied_on to SpecHandForward.RecordReadAsync, which admits them through HandForward's own checks (first 20, ≤300
      characters, '<old> -> <new>', each relied_on resolved alone), logs what it dropped and the conflict text, and
      writes only when a build-note field is named.
  - id: tools
    action: >-
      Delete FinishSpecToolHost, FinishSpecFollowUp and MergedTools.FinishSpec; HandForwardToolHost loses its tool
      surface and becomes SpecHandForward; MasterRecordTools loses FinishSpec and SpecTools; MasterToolComposition.Coding
      stops adding it; ReengageSession loses Finish.
  - id: loop
    action: >-
      AgenticMasterHandler: delete the verdict nudge and MasterReengagementPolicy.ShouldNudgeForVerdict; track the
      ending texts over pass 0, the apply drive, the one ask for a report (when none ended on text) and the
      re-engagement; after the loop, on a spec, set
      MasterVerification through MasterReportRecorder (CodeSpecBlock) or with the report alone (spec-derive); a
      repair or review-fix step that wrote no report leaves the spec's standing MasterVerification as it was.
      ReengageReasonPolicy.Decide: off a code pipeline null; budget -> budget; actionable steps -> drive 'unfinished'
      on pass 1, else stop 'steps-open'; else 'nothing-left'. MasterLoopStop/MasterStopKind: Verdictless -> StepsOpen,
      RedDrained and Blocker removed. ReengagePass: no finish counting; a pass's ending text is appended; ReengageProgressPolicy.Decide loses the block parameter, ReengageOutcome loses
      StopBlocked. MasterPassState carries ReportWritten (pass) and HasReport (standing); MasterPassEnd writes
      VerdictEmitted and GateLine from them. MasterPassReasons gains StepsOpen = "steps-open"; red-accepted, verdictless,
      blocked and red-with-open-steps stay as words of stored rows; flowWords gains 'steps-open'. ReengageStopLog and
      MasterReengagementLoop docs follow.
  - id: verify
    action: >-
      MasterReportAccount: NoFinish -> NoReport ("The agent ended without writing a report, so the spec was not
      delivered; anything it changed stays on the branch. Retry unchanged gives it another attempt."), Missing reads
      Report of both keys. VerifySpec's OK message adds "; its report could not be read: <problem>" when the read
      failed.
  - id: derive
    action: >-
      AgenticMasterHandler chooses TicketClarificationToolHost when PipelinePresets.ParksMasterQuestions(name) ||
      name == SpecDeriveName (ParksMasterQuestions keeps meaning 'has MasterOpenQuestions'). SpecDerivationGate.AfterMaster
      reads ContextKeys.MasterOpenQuestions (the first question's text) instead of Blocker, and quotes the report's first
      non-empty line instead of Summary. WriteOnlyContract: "ask it with ask_human; it is posted on the ticket.
      Otherwise report what you wrote and why."
  - id: texts
    action: >-
      MasterClosing.Coding ("Your last reply is your report, shown as you write it — or, when you asked with
      ask_human, the pipeline acts on the question."); BuildApplyNudge and BuildReengageNudge close with "Close with
      your report of what this pass did; it is added to what you reported before."; the ask-for-report text "Your last
      reply had no text. Write your report for the person as your reply."; MasterFinishLead and the red lead deleted;
      the in-pass reminder; ContextPressureFinalizingChatClient.FinalizeInstruction loses its finish_spec sentence; the
      spec contract ("Before you write your report, look at EACH done criterion… Your report also names what you renamed
      and moved (`<old> -> <new>`), persisted and deviated from, the memories you relied on, and the follow-ups you
      propose."); DeclaredGate ("before your report"); StandIn ("a follow-up your report proposes"); remember's
      description. WorkingStateSection loses the verification parameter and its 'Last build/test' line. Docs:
      delivery-account.md, lifecycle.md, methodology.md, fix-and-feature.md, llms.txt.njk; dashboard comments.
  - id: skills
    action: >-
      agent-smith-skills branch fix/coding-master-report-only (uncommitted), coding-agent-master 3.5.0: line 40 ->
      refusal named, quoted, under Ignored instructions in the report; step 7 -> close with the report as the last
      reply, naming renamed/moved/persisted/deviations; line 127 -> name in the report the memories acted on; 'Your
      report' -> the report is the last reply and nothing else closes the spec; a reader takes follow-ups, ignored
      instructions, the build note and memories from it, each under its own heading; "When the work cannot be done,
      the report says what is missing and why; a question only a person can answer goes through ask_human."; the
      framework runs the build and test stages after you. references/memory-discipline.md -> the report names the
      memories. scripts/validate-skills.sh green.
  - id: pin
    action: >-
      After the coordinator releases the skills change: SkillsCatalogVersion and SkillsCatalogSha256 to the new tag
      (csproj 54-55), the tarball swapped, and the skill-text assertions (CodingMasterLeadPromptTests,
      SeriesSkillRulesTests) moved from the 3.4.1 text to the 3.5.0 text. Until then they assert 3.4.1, so the suite
      stays green on v5.41.3.
  - id: compat
    action: >-
      Older catalog (v5.41.3 or a skills override): the model may call finish_spec, once or repeatedly; Microsoft.Extensions.AI
      answers 'not found' without an exception, so the error tolerance does not end the loop; the report is the last
      pass-ending text. Newer catalog on an older server fails NoFinish as about half do today — deploy the server
      before any override.

tests:
  - "845e/4351b shape — every step done, report as text only, stages green -> Done with that report, no prompt names finish_spec, no re-drive, the read gets a JSON-schema format (MasterReportCloseTests.TextOnlyReport_AllStepsDone_StagesGreen_IsDelivered; FixBugTests.FixBug_RealChange_TextOnlyReport_IsDelivered)."
  - "Report says blocked/failed, stages green -> Done, report shown as written (MasterReportCloseTests.ReportSaysBlocked_StagesGreen_IsDelivered_ReportShownAsWritten; FixBugTests.FixBug_RealChangeButFailedVerdict_FailsKeystone, which asserts success)."
  - "Stages red -> StageRepair with the stage output, the repair's last report stands (VerifySpecStageRepairTests; SpecExecutionTests.SpecExecution_MasterLeadsChildren_SendsWorkBack_ResolvesARedBuild_NamesAFollowUp)."
  - "Iteration ceiling on a tool call, ledger drained, stages green -> Failed NoReport (MasterReportCloseTests.IterationCeilingOnAToolCall_LedgerDrained_StagesGreen_FailsNoReport); no text in any pass -> NoReport (AddFeatureTests.AddFeature_MasterEndsWithoutAReport_FailsNoReport, FixNoTestTests.FixNoTest_MasterEndsWithoutAReport_FailsNoReport, MasterReportAccountTests.Missing_DoneLinesAndNoReport_SaysSo_AReportOrNoDoneList_IsNotMissing, MasterReportHandlerTests.AMasterWhosePassesAreCutOnACall_PublishesNoReport_AndTheSpecSaysWhy)."
  - "The read yields follow-ups, ignored instructions with reasons, build note and relied_on (MasterReportRecorderTests.Read_RecordsFollowUpsIgnoredBuildNoteAndReliance; MasterReportHandlerTests.AMasterThatEndsOnItsReport_PublishesTheReport_WithTheReadsFollowUps; BuildNoteHarnessTests.Harness_TwoSpecSeries_SpecTwoMasterPromptCarriesMemoryRememberedInSpecOne; harness follow-up and ignored-instruction presets via EnqueueReport)."
  - "(d) Ignored-instruction quote in neither report nor decisions -> dropped and logged (MasterReportRecorderTests.IgnoredInstruction_QuoteNotInReportOrDecisions_IsDropped)."
  - "(e) Over-count / over-length / unarrowed build-note entries and an unresolved relied_on -> trimmed and logged (MasterReportRecorderTests.BuildNote_OverCountOverLengthUnarrowed_TrimmedAndLogged, MasterReportRecorderTests.ReliedOn_UnresolvedDropped_ResolvedRecorded)."
  - "A stage repair's one-line report follows the original, which stays first (MasterReportHandlerTests.AStageRepairsOneLineReport_KeepsTheOriginalReportFirst; SpecExecutionTests.SpecExecution_MasterLeadsChildren_SendsWorkBack_ResolvesARedBuild_NamesAFollowUp)."
  - "Follow-ups across a structure correction and two stage repairs are all kept, one per goal ignoring case (MasterReportRecorderTests.FollowUps_AcrossAStructureCorrectionAndTwoStageRepairs_AllKept; MasterReportAccountTests.For_AfterAStageRepair_TheRepairsReportStands_AndBothPassesFollowUpsAreKept)."
  - "A read overwrites only the note fields it names; a relied_on-only read leaves the note; reliance is a union and an empty list records nothing (MasterReportRecorderTests.BuildNote_AReadOverwritesOnlyTheFieldsItNames_AReliedOnOnlyReadLeavesTheNote, ReliedOn_UnionAcrossReads_AndAReadNamingNoneRecordsNothing)."
  - "Refused instructions add up for the run; a failed read clears nothing (MasterReportRecorderTests.IgnoredInstructions_AccumulateForTheRun_AFailedReadClearsNothing)."
  - "A recording that throws (a memory store) leaves the report and names the problem (MasterReportRecorderTests.RecordingFails_TheReportStands_AndTheProblemIsNamed)."
  - "Anthropic gets the format as strict structured output (ChatAdapterWireTests.Anthropic_ReportReadFormat_IsSentAsStrictStructuredOutput)."
  - "No ending text at all -> asked once; the answer is the report (MasterReportHandlerTests.AMasterEndingOnNoText_IsAskedOnceForItsReport_AndItsAnswerIsTheReport; ExternalWorkerTicketTests.Harness_WorkerEmptyClosingTurn_IsAskedOnceForItsReport_AndDelivered)."
  - "Read throws / non-JSON / budget spent -> delivered by the stages, the report stands, the problem is named (MasterReportCloseTests.ReaderFails_DeliveredByTheStages_TheReportStands; MasterReportHandlerTests.ReadFails_TheReportStands_AndTheProblemIsNamed; MasterReportRecorderTests.BudgetSpent_SkipsTheRead_AndTheReportStands; MasterReportReaderTests.Read_AnAnswerThatIsNotTheExtract_IsAProblem, Read_AFailingCall_IsAProblem_NotAThrow)."
  - "(c) The reader sends a JSON-schema ResponseFormat on the summarization role and states the shape in its prompt; a client that ignores the format and wraps its answer is still parsed (MasterReportReaderTests.Read_SendsAJsonSchemaFormat_OnTheSummarizationRole_AndStatesTheShapeInItsPrompt, Read_AClientThatIgnoresTheFormat_AndWrapsItsAnswer_IsStillParsed)."
  - "Report = every pass's ending text, joined, an identical text once; a cut pass adds nothing (MasterReportTests; MasterReengagementLoopTests.ReengagedPass_EndingOnText_AppendsToTheReport_AndTheGateLineSaysSo, ReengagedPass_Cut_KeepsTheEarlierReport, NoReportAnywhere_TheGateLineSaysNoReport; MasterReportHandlerTests.AReportOnOneDrive_ThenADriveCutOnACall_KeepsTheReport, ALaterDriveThatEndsOnText_IsAddedToTheReport; MasterReportTests.Append_AddsEachPassesEndingText_InOrder_AnIdenticalTextOnce)."
  - "Blocked as a question: a derivation hands ask_human's question back (SpecDerivationGateTests.AfterMaster_AQuestionAskedWithAskHuman_BecomesTheQuestionTheHandbackStepAsks; the spec-derive harness presets via SpecWritingScript.AsksFirst); a code run parks on ask_human (existing harness question presets)."
  - "Older catalog: finish_spec called twice, answered not found each time, then the report -> delivered with that report (MasterReportCloseTests.OlderCatalog_CallsFinishSpecTwice_EndsOnItsReport)."
  - "Spend shift pinned: open steps -> one re-drive 'unfinished' -> 'steps-open'; drained ledger -> 'nothing-left' (ReengageReasonPolicyTests.Reengage_SpendShift_OpenStepsReDriveOnce_WhereAGreenFinishOnceStopped, Reengage_SpendShift_TextOnlyEndOverADrainedLedger_GetsNoReDrive, Reengage_OpenSteps_DrivesOnce_ThenStopsStepsOpen)."
  - "No master surface holds finish_spec or hand_forward (MasterToolSurfaceTests.CodingMaster_FullestConfiguration_AtMostTwentyUniqueTools; HandForwardSurfaceTests.MasterToolComposition_CodingMasterWithSpec_CarriesNoClosingTool, MasterToolComposition_NoSurface_CarriesNoClosingTool); no master-facing text names it (MasterTextsNameNoFinishSpecTests)."
  - "No change, a report -> delivered on it, the named consequence (FixBugTests.FixBug_MasterReportsNoChangeNeeded_IsDeliveredOnItsReport)."
  - "(f) Skill text: CodingMasterLeadPromptTests.PackagedCodingMaster_ReportsInMarkdown_AsTheTextOfItsClosingReply and SeriesSkillRulesTests.EmbeddedSkills_CodingAgentMaster_EndsEachSpecWithHandForward assert the pinned 3.4.1 text; the pin step moves them to 3.5.0."
  - "Dashboard: flowWords maps 'steps-open' and 'unfinished' ('driven once more', true for old and new rows) (flowWords.test.ts passEndWords_StepsOpen_AndUnfinished_AreNamed)."

done:
  - "The invariant holds under the tests above; every finish_spec field is in field_map with its new source or named as dropped."
  - "No production code or prompt text names finish_spec, FinishSpecToolHost or MasterFinishLead."
  - "coding-agent-master 3.5.0 validated on its branch; after release and pin, no deployment keeps a skills override older than the new release."
  - "Build, full suite and dashboard tests green."
