# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-22-96c8a
goal: "A coding master ends on its written report, with no finish_spec: the verify stages decide delivery, and one structured read of the report carries what the tool carried."

applies_to: "default (Application master loop, spec account and VerifySpec; Infrastructure chat stack; dashboard flow words; skills catalog + pin)"

requires: [2026-11-18-98fa, 2026-11-22-6fd7a, 2026-11-22-6fd7b]

invariant: >-
  A spec's delivery never depends on the master calling a closing tool: the verify stages and the presence of a
  written report decide it. Every value finish_spec carried still reaches its consumer, or is named below as
  dropped together with what the operator sees change. A failed or unreadable read of the report never changes a
  delivery the stages decided, and nothing read off the report is invented: a refused instruction is kept only when
  its quote appears in the report or the master's decision lines, and a memory it names is resolved against the store.

facts:
  # --- the problem, measured ---
  - claim: "Measured over 13 live specs (2026-11-19..22, agent-smith 0.196.0, skills v5.41.3, gpt-5.6-terra): about half end with a text-only markdown report and no finish_spec call, although the skill, the tool description and the nudges all say the reply whose text is the report calls finish_spec; 3 of 13 failed for that alone while every verify stage was green."
    evidence: "observed: 2026-11-22, live runs relayed by the coordinator (845e on ticket 19655 is the reference shape)"
  - claim: "Operator decision: remove the ceremony. The master writes its report and ends; nothing depends on it calling a closing tool, and the result must still work meaningfully for every consumer."
    evidence: "observed: 2026-11-22, operator decision relayed by the coordinator"

  # --- where finish_spec lives ---
  - claim: "finish_spec is built only for a coding master that executes a spec (spec present and codingMaster)."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MasterRecordToolHosts.cs:51"
  - claim: "codingMaster is !isScanMaster && !isSpecDialog; scan and pr-review masters (output_schema observation) and the design partner never get it."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:239"
  - claim: "The coding master's surface adds MergedTools.FinishSpec, which folds hand_forward's build note (renamed, moved, persisted, deviations, relied_on) into finish_spec; hand_forward is offered standalone nowhere in production (MasterRecordTools.SpecTools has no production caller)."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.Coding.cs:34; src/backend/AgentSmith.Application/Services/Tools/MergedTools.Coding.cs:59-92; src/backend/AgentSmith.Application/Services/Tools/MasterRecordToolHosts.cs:94-97"
  - claim: "A build-note call is forwarded to HandForwardToolHost only when one of its fields is named; a call naming none leaves the note an earlier call recorded."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MergedTools.Coding.cs:76-84"
  - claim: "FinishSpecToolHost validates status (green | no-tests | failed | blocked), a non-empty summary, a blocker when blocked and a goal per follow-up, and records a MasterVerification; ignored_instructions arrive as quotes only (Reason is string.Empty)."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FinishSpecToolHost.cs:40-79"
  - claim: "MasterVerification carries Status, BuildRan/BuildPassed/TestsRan/TestsPassed, Summary, FailingTests, BaselineFailingTests, IgnoredInstructions, FollowUps, Blocker, Report, and derives BlockedClaim from Blocker."
    evidence: "src/backend/AgentSmith.Domain/Models/MasterVerification.cs:24-43"

  # --- the report today (refines the brief: MasterReport.Of does NOT read a text-only end) ---
  - claim: "MasterReport.Of returns null unless the thread holds a finish_spec call: it takes the last assistant text up to that call, else the text after it. A text-only end therefore has no report today, and MasterReport.Standing is null without a recorded call."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterReport.cs:15-27"

  # --- how delivery is decided today ---
  - claim: "VerifySpec order: tree sync and spec-sandbox resolution failures fail; the stages run per repository (a red build stops that repo); a red aggregate goes to StageRepair or fails with the failing command and an 800-char output tail; delivered work no command ran over fails as unverified; then MasterReportAccount.Missing fails the spec; else the account is the master's report and the spec is Done."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/VerifySpecHandler.cs:72-176"
  - claim: "MasterReportAccount.Missing fails a spec with done lines when neither MasterVerification nor MasterVerificationBeforeRepair is set, with the NoFinish sentence; it never reads Status, so a finish_spec 'failed' or 'blocked' with green stages is delivered today."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/MasterReportAccount.cs:15-17; src/backend/AgentSmith.Application/Services/Specs/MasterReportAccount.cs:32-38"
  - claim: "The run keystone is mechanical: CommitAndPR asks RunDeliveryGate.Mechanical over the run's accounts and the criteria count; it reads no MasterVerification field."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CommitAndPRHandler.cs:221-223"
  - claim: "VerifySpec records the spec Done or Failed through ISpecProgressRecorder (the per-spec table and the SpecStateChanged stream), the failure's first line as its note."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/VerifySpecHandler.cs:184-202"
  - claim: "A red stage goes back to the master as one outstanding item (StageRepair.ItemPrefix + the stage's output tail) while repairs make progress; the verdict before the first repair is kept as MasterVerificationBeforeRepair."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/StageRepair.cs:27-48"
  - claim: "Both verdict keys are cleared when the next spec begins."
    evidence: "src/backend/AgentSmith.Application/Services/SpecRepairScope.cs:22-23"
  - claim: "No pre-change baseline run exists: VerifySpec selects stages by what the branch changed and runs them once over the result."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/VerifySpecHandler.cs:101-136"

