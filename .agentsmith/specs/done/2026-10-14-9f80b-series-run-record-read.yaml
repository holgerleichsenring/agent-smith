spec: 2026-10-14-9f80b
goal: "A ticket whose attempts recorded no cut still shows its specs and acceptance on the ticket page, built from the spec rows, spec records and acceptance its runs did record."

applies_to: "backend (ticket series read) + dashboard (ticket Specs, Acceptance and Summary tabs)"

requires:
  - 2026-10-13-9a59e
  - 2026-10-13-9a59q
  - 2026-10-13-9a59r

