  - claim: "9a59e chose this on purpose: 'Runs before this spec have no cut row; their series read is empty and says so.'"
    evidence: ".agentsmith/specs/done/2026-10-13-9a59e-series-published-read.yaml:111, .agentsmith/decisions/2026-10-13-9a59e.yaml:86-88"
  - claim: "Every content field of a served spec (goal, repos, steps, yaml, done list) comes from the cut's SpecCutEntry; state and verdicts from RunSpec rows; overrules joined by CriterionKey."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/TicketSeriesSpecComposer.cs:24-53"
