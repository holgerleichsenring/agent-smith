    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/RunSpec.cs:13-50, src/backend/AgentSmith.Application/Services/Specs/SpecProgressRecorder.cs:41-52"
  - claim: "RunSpec.AcceptanceJson only came with 9a59e; every row in the local database written before it is null."
