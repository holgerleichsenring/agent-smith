  - claim: "The ticket surface reads code-pipeline runs only; the four phase:-keyed local records belong to add-feature and phase-execution runs, and 11 of the 14 local RunSpec rows are on non-code runs, so locally the fallback reaches p19413a and 2026-10-07-1891a."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/TicketSeriesReader.cs:24-26, src/backend/AgentSmith.Server/Services/Tickets/TicketAttempts.cs:21-22; observed: 2026-10-14, local test database, Runs.Pipeline of the RunSpecs rows"
