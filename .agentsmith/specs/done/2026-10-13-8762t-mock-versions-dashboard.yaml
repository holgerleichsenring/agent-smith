# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762t
goal: "The design conversation's proposal shows each spec's mock versions as a strip of screenshots with a Ratify button, and both proposal views name the version a person ratified."

applies_to: "dashboard (dialog proposal panel, a new MockVersions strip, the ticket conversation's ProposalBlock, the spec-dialog API client and types) + backend (the conversation view's ratified marks, the ticket proposal draft view)"

requires: [2026-10-13-8762s]

