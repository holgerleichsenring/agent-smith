done:
  - "On /tickets and in the rail the operator sees PR closed, Failed, Ended (cancelled or finished without a pull request), Done and Closed as separate sections with their counts, Closed collapsed last."
  - "From a list row or the ticket page the operator closes a ticket with an optional note and, if chosen, its open pull requests and the tracker ticket; the dialog reports what closed and what was refused, and the row moves to Closed."
  - "A ticket closed by hand shows who closed it, when and why, and Reopen returns it to the section its state says; a ticket a person closed on the tracker says so without Reopen; a ticket that came back by later activity shows as that section with no closed line."
  - "A ticket waiting for a closed ticket shows the required ticket as closed in its chip, on the graph and in its requires list; failed and PR-closed nodes read in words with their own style and legend entry."
  - "Build green, full suite green, dashboard gen/test/build green."
