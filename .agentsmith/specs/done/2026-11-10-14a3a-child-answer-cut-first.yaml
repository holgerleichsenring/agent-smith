spec: 2026-11-10-14a3a
goal: "A child answer that was cut says so at its start, the spawn result names every cut child in one line, and each child is told the cap it writes within."
applies_to: "default (sub-agent answer, spawn result, child situation)"
facts:
  - claim: "Conversation 43's PoC-Analyst answer was cut at 12000 characters with the notice as its last line; the master never read the rest."
    evidence: "observed: 2026-11-10, prod run 2026-11-10T11-22-43-0ee5, prompt position 8"
  - claim: "The cut appends its notice after the kept text."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/SubAgentAnswer.cs:14-20"
  - claim: "The child's situation says about the first 12000 characters arrive directly."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/SubAgentSituation.cs:25-27"
steps:
  - id: lead
    action: "A cut answer starts with the notice: how much is shown, how much is left, read_sub_agent_observations with the child's id."
  - id: summary
    action: "The spawn result carries a top-level line naming each cut child and its id, absent when none was cut."
  - id: cap
    action: "The child's situation states the cap as the length its answer arrives whole within."
tests:
  - "SubAgentAnswer_LongerThanTheCap_LeadsWithTheNotice"
  - "SpawnAgents_ACutChild_IsNamedInTheResultSummary"
done:
  - "A cut answer's first line names the cut and the call that returns the rest."
  - "Backend and dashboard build and tests green."
