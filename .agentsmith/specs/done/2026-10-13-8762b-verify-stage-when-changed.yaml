  - "ChangedPathGlob_SingleStar_StaysInOneSegment"
  - "ChangedPathGlob_LeadingDotSlash_IsIgnored"
  - "ContextYamlVerifyBlock_WhenChanged_IsReadTrimmed_BlankDropped"
  - "ContextYamlVerifyBlock_NoWhenChanged_IsNull"
  - "Schema_TheVerifyBlock_AddsNoClosedVocabulary (four keys)"
  - "Schema_VerifyItem_WhenChangedEmptyList_IsRefused"
  - "StageRelevance_GuardedStage_OtherSandboxChangedAMatchingPath_RunsInAnUnchangedSandbox"
  - "StageRelevance_GuardedStage_NoMatchingPath_IsSkippedWithANote"
  - "StageRelevance_GuardedStage_RepositoryUndetermined_Runs"
  - "StageRelevance_UnguardedStage_SandboxUnchanged_IsSkippedAsToday"
  - "StageRelevance_EveryStageSkipped_SkipsTheSandbox_NeverInfers"
  - "StageRelevance_OtherRepositoryChanged_DoesNotTrigger"
  - "StageRelevance_DeletedFileUnderGlob_Runs"
  - "StageRelevance_DashboardPathBeyondTheStdoutCap_StillRuns"
  - "StageRelevance_PureRenameIntoGlob_Runs"
  - "StageRelevance_BinaryFileUnderGlob_Runs"
  - "StageRelevance_NameOnlyReadFails_RepositoryUndetermined_Runs"
  - "WriteContextYamlTool_WhenChanged_RoundTripsThroughTheSerializer"
  - "VerifySpec_GuardedStageSkipped_DriftStillReadsTheFullDeclaration"
  - "VerifySpec_OnlyGuardedStagesAndNoneMatched_IsGreenWithANoStageAppliesNoteNamingTheGlobs"
  - "StageRelevance_GuardedStageSkipped_NoteNamesTheGlobs"
