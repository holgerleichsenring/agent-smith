done:
  - "A context.yaml stage carrying when_changed runs in its sandbox whenever the branch changed a matching path anywhere in that repository — renames, binary files and a branch diff larger than the stdout cap included — even when that sandbox's own branch changed nothing."
  - "A guarded stage whose globs the delivery does not touch is skipped with a note naming its globs; a repository whose every stage is skipped that way is green with the note 'no stage applies to this change', never UNVERIFIED."
  - "A non-ASCII path under a glob, a changed-path list at the stdout cap, and a run without a repository map all run the guarded stage or judge per sandbox, never a false skip."
  - "Every existing declaration without when_changed verifies exactly as before."
  - "write_context_yaml accepts when_changed, writes it back unchanged and refuses an empty list; the template and the reference page show it."
  - "Build green, full suite green, dashboard gen:hub-events / test / build green."
