# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-02-075db
goal: "A picked folder or file set is shown before it is sent — top-level entries with size, the folder's .gitignore and rebuildable folders pre-unticked — and the operator sends what they tick."

applies_to: "dashboard (dialog composer, a selection module, the upload call)"

requires: ["2026-10-02-075da"]

facts:
  - claim: "A folder pick sends every file of the folder at once, with no filter and no preview."
    evidence: "src/dashboard/src/components/dialog/DialogComposer.tsx:112-119,230-234; src/dashboard/src/hooks/useSpecDialog.ts:538-550; src/dashboard/src/lib/specDialogApi.ts:118-130"
  - claim: "The server reads at most a 26 MB body and refuses a larger one before reading it, so a folder carrying a 47 MB .venv is refused whatever the server would keep."
    evidence: "src/backend/AgentSmith.Server/Services/References/ReferenceUploadBody.cs:24-29; ReferenceUploadLimits.cs:27"
  - claim: "The 'Website' input accepts the twenty website extensions plus .zip only."
    evidence: "src/dashboard/src/components/dialog/DialogComposer.tsx:103-111,223-227"
  - claim: "The composer already shows an upload's note (refusal or left-out files) in place."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:147,538-546; src/dashboard/src/components/dialog/DialogComposer.tsx:210-218"
  - claim: "The npm 'ignore' package (gitignore semantics) is already in the dashboard's lockfile, as a transitive dependency."
    evidence: "src/dashboard/pnpm-lock.yaml:1904-1910"

scope:
  in: >
    A pick of several files or a folder opens a selection card in the composer instead of uploading. referenceSelection.ts
    (pure, tested) works per FILE at every depth and shows per top-level entry (a folder pick's root folder is skipped
    over). A file is left out, with its reason, when a path segment is a rebuildable folder (075da's list, mirrored and
    pinned equal by a test that reads the C# file), when it is over the per-file bound, or when a .gitignore of the pick
    ignores it (the 'ignore' package 7.x, paths made relative to the .gitignore's folder) — EXCEPT credential files
    (075da's patterns), which a .gitignore never leaves out: the operator ruled that a .env is information. An entry
    whose every file is left out is shown unticked with the reason; any entry can be ticked or unticked by hand, so a
    custom cache folder no rule knows is one click. Ticking an entry re-adds the files .gitignore left out under it;
    rebuildable and oversized files stay out. The card lists entries with sent-file count and size, the totals of what
    will actually be sent against 25 MB / 500 files, and disables Send over them saying by how much. Send uploads the
    ticked files; Cancel drops the pick. The composer note after storing joins the client's left-out counts to the
    server's answer. A single .zip goes straight to the server. The 'Website' menu item becomes 'Files' and accepts any
    type; 'Folder' stays.
  out: >
    Unpacking a ZIP in the browser: the server's ZIP path applies 075da's rule but no .gitignore — a ZIP is what its
    author packed. Ticking below the top level: a monorepo sub-selection picks the subfolder instead. The dashboard CI
    workflow is path-filtered, so a backend-only edit of the rebuildable list is caught by the phase gate, not CI.

decisions:
  - key: "THE OPERATOR DECIDES WHAT IS AUTHORED. No rule knows that a folder named offline-npm-cache is rebuildable; a tick does."
  - key: "THE FOLDER'S OWN .gitignore IS ITS AUTHOR'S STATEMENT — except about credentials. It leaves out build output and logs; it never overrides the ruling that a .env is kept."
  - key: "BEFORE SENDING, BECAUSE THE BODY IS BOUNDED. A server-side rule cannot help a body the server refuses unread."
  - key: "ONE LIST, PINNED. The rebuildable folders live in C#; the TS copy is held equal by a test, not by care."

steps:
  - id: select
    action: "referenceSelection.ts: entries(files) -> {name, files, bytes, ticked, reason}; ignore rules from the pick's .gitignore files; totals against the bounds."
  - id: card
    action: "DialogReferenceSelection.tsx in the composer: entries, checkboxes, totals, Send/Cancel; DialogComposer routes multi-file and folder picks to it; 'Files' accepts any type."
  - id: wire
    action: "useSpecDialog.attachSite takes the ticked files and the client's left-out counts; 'ignore' 7.x becomes a direct dependency."
  - id: flip
    action: "Rewrite DialogComposerWebsite.test.tsx (menu labels, accept) and the SpecDialogSurface folder-pick cases (they upload at once today)."

tests:
  - "referenceSelection: a folder with .venv/, node_modules/ and src/ pre-unticks the first two with reason 'rebuildable'"
  - "referenceSelection: a root .gitignore listing dist and .env unticks dist/, leaves out *.log inside src/, and KEEPS .env"
  - "referenceSelection: frontend/node_modules under a ticked entry is left out and counted; a nested 30 MB file too"
  - "referenceSelection: a 52 MB file is unticked 'over 5 MB'; totals over 25 MB disable Send"
  - "referenceSelection: rebuildable list equals ReferenceRebuildableFolders.cs"
  - "DialogComposer: a folder pick shows the card and uploads only ticked files on Send; Cancel uploads nothing; a single .zip uploads at once"

done:
  - "picking a folder with a .venv shows the card with .venv/ unticked, Send uploads the rest and the composer shows the server's note"
  - "dashboard tests, gen:hub-events and build green; backend build and full suite green"
