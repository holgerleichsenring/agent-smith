# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-89f1c
goal: "Every pipeline delivers what it claims: legal-analysis hands over its analysis, a label-triggered scan scans the PR, an undelivered scan fails the run, and options that do nothing are gone."

applies_to: "backend (scan, legal and PR entry points, CLI commands, config resolution)"

requires: ["2026-09-28-89f1b"]

scope:
  in: "Auto-fix and tool_profile deleted, confidence_threshold retired with an advisory, legal delivery and byte-true document intake, PR context for label-triggered scans, the scan exit code from the delivery gate, strict explicit source paths."
  out: "Chat entry points (security-review PR context, the Slack legal modal): 2026-09-28-89f1f owns every chat file. Turning scan findings into tickets: planned p0429b. Giving SkillObservation.Blocking a consumer (pr-review requesting changes): a behaviour change, not a defect; the field stays recorded data and the docs stop claiming it gates anything."

decisions:
  - key: |
      AUTO-FIX NEVER RAN. Since p0060 the step got a default config, wrote fix requests into a sandbox
      that is thrown away and set a context key nothing reads. Wiring the config would make it ask a
      question and then do nothing. It is deleted; scan-to-work belongs to p0429b.
  - key: |
      confidence_threshold LOST ITS READER IN p0312. The downgrade it tuned changed a flag nothing reads.
      The key stays only as a detector, so a file that sets it hears that it is ignored.
  - key: |
      LEGAL NEVER DELIVERED. The advertised `file` format is not registered, the renderer reads a key the
      preset stopped producing, the analysis the master writes is read only by an inbox branch that was
      never wired, and the document is read as text, corrupting a PDF. The master's written report
      becomes the delivered report, in the output directory the operator names; the Slack entry point
      that starts it without a document is removed in 2026-09-28-89f1f.
  - key: |
      A PR-TRIGGERED SCAN SCANNED THE DEFAULT BRANCH. The GitHub label handler passed no PR context; the
      GitLab one returned no trigger at all, matched every update on a labelled MR and, registered before
      the MR-event handler, swallowed every push so pr-review never ran. Both now react to the label being
      added and carry the PR-event handler's context, parsed per platform. --pr, which nothing read and which promised a diff-only scan no scanner
      supports, is removed; planned p0429b should read ContextKeys.PrNumber, the one PR carrier.
  - key: |
      A SCAN THAT DID NOT DELIVER EXITS 1. The gate was computed and only written down; scans have no
      CommitAndPR to enforce it. AccountScanCoverage enforces it, the finalizer still writes the result,
      and the SARIF is already on disk. Findings alone still never change the exit code. No opt-out:
      `|| true` is the CI's own choice to make.
  - key: |
      AN EXPLICIT SOURCE PATH THAT DOES NOT EXIST IS AN ERROR, not passive mode; --source-url without
      --source-type is refused at parse.

steps:
  - id: delete
    action: "The SpawnFix family, AutoFixConfig, FindingsAutoFixed, tool_profile, VerifyNotesFormatter.Format, the inbox trio, --pr."
  - id: retire
    action: "confidence_threshold: its blocking range check goes, a RetiredConfigKeys row reports it, it leaves PipelineDefinition/ResolvedPipelineConfig; schema and example removals are listed for 2026-09-28-89f1d."
  - id: legal
    action: "DeliverOutput renders the master's report; OutputDirectoryResolver shared with DeliverFindings; legal --output-dir and registered formats only; AcquireSource copies bytes (the base64 pattern of TicketDocumentMaterializer)."
  - id: pr-context
    action: "PrRunContextFactory (per-platform parsing, one context builder) used by the PR-event handler and both label handlers; GitLab reacts only to an added label and returns a trigger."
  - id: exit-code
    action: "AccountScanCoverage records the account, then fails on an unsatisfied delivery gate."
  - id: source
    action: "TryCheckoutSource fails on a missing explicit path; SourceOptions rejects a url without a type; plain passive-mode message."
  - id: docs
    action: "security-scan, api-scan, legal-analysis, pr-review, pr-comments, webhooks, cicd and configuration pages per the analysis note."

tests:
  - "the tests listed in .agentsmith/notes/2026-09-28-89f1-defect-analysis.md, slice c"

done:
  - "legal-analysis from the CLI writes its analysis to the output directory"
  - "a labelled PR is scanned at its head"
  - "an undelivered scan exits 1 with the reason and still writes result.md and SARIF"
  - "no CLI option or config key touched here is parsed without a reader"
  - "build and all tests green"
