spec: 2026-10-13-8762c
goal: "A run over this repository is gated close to a human spec commit: build and suite in the .NET image, and the dashboard's install, mirror check, tests and build in a node image when its inputs change."

applies_to: "this repository's declarations (default context verify block, a new dashboard context with principles) + the sandbox coordinator's group order + a NeedsDocker category + backend: a master tool running a declared stage and one repair pass for a red stage"

