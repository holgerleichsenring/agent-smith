assumptions:
  - "2026-10-15-114fb lands TicketClosedRule, TicketClosedKinds.Tracker, TicketStanding.ClosedOf, the rule's tail helper, PrReviewRecordView.LastPersonEntryAt and the check offer that keeps tracker-closed rows; 2026-10-15-114fe lands TicketParkStatuses.Closed in Own."

scope:
  in: >
    HEAD: PrReviewState gains `string? HeadSha = null`; GitHubPrReviewStateReader asks headRefOid in its query,
    GitLabMergeRequestRead parses sha into GitLabMergeRequest and GitLabMrStateReader passes it, AzureReposVoteDecisions
    passes pr.LastMergeSourceCommit?.CommitId (each at most 4 lines more). PrReviewRecord gains HeadSha (max 64,
    nullable), HeadMovedAtTicks and ReopenedAtTicks (long?); PrReviewRecordRefresh's record carries the read sha.
    PrReviewRecordCopy, on a successful read only (the failed-read path never reaches it): HeadMovedAtTicks = the read's
    CheckedAtTicks when the stored and the read sha are both present and differ; ReopenedAtTicks = the read's
    CheckedAtTicks when the stored state is closed or merged and the read state is open; the stored sha becomes
    `read.HeadSha ?? stored.HeadSha`, so a read without a sha (the unsupported path) never erases it; the stamps are
    taken before the columns are overwritten, in a helper so no method passes 20 lines (43 -> at most 54).
    PrReviewRecordView gains init HeadSha, HeadMovedAt and ReopenedAt (PrReviewRecordRepository's View maps them; at
    most 82 after 114fb); TicketPullRequestView gains HeadMovedAt and ReopenedAt through TicketReviewState (at most 48
    after 114fb). TicketClosedRule adds: no pull request with HeadMovedAt later than ClosedAt, and none with ReopenedAt
    later than ClosedAt. SWEEP: PrSweepRecordNudge also nudges a Refresh (late, with the record's URL) for an open
    record the page lists whose listed HeadSha is present and differs from the record's HeadSha — a record with no
    stored sha yet included, once, as its backfill (32 -> at most 40). Webhook projects need no change: their open
    records are re-read every fifteen minutes already. TRACKER: TicketObservation and TicketBetweenAttemptsState gain
    ClosedForWork; TicketTrackerObserver asks TicketClosure.ClosedForWorkAsync on the ticket it already read (59 -> at
    most 66), so a ticket in a status agent-smith sets — 2026-10-15-114fe's closed status included — never reads closed
    for work; TicketBetweenAttemptsCheck gains ClosedForWork (default false), written and compared by TicketCheckStore
    (65 -> at most 70). TicketStanding gains ClosedForWorkOf(Run) = the head's own check's ClosedForWork.
    TicketBucketRule.Of gains `bool trackerClosed = false` and answers Closed with kind tracker after done and before
    stuck, inside 114fb's tail helper (every method at most 20 lines; file at most 72); TicketSummaryComposer passes it.
    MIGRATION: AddClosedTicketFacts in both sets — the three PrReviewRecords columns and the check column only.
  out: >
    A person's tracker close on a ticket whose last attempt did not fail (PR closed, success, waiting on review) — not
    read: the server reads that tracker for no such row today; widening the check to PR-closed rows is contract question
    Q3 for the operator, and until answered nobody owns it. A push delivered by webhook — nobody: no host's pull-request
    webhook handled today carries one (GitHub closed/reopened, GitLab close/merge/reopen/approvals, Azure Repos
    completion/abandon/merge), and webhook projects already re-read open records every fifteen minutes. Re-reading
    closed tickets' records in the re-read service — nobody: the sweep compares heads from a read it already makes, and
    the re-read's shared cap of fifty would grow with every ticket ever closed. Sections and dot — 2026-10-15-114fd.

decisions:
  - key: "A HEAD MOVE IS A SHA CHANGE SEEN BY THE REFRESH, TIMED BY THE READ. Commits carry author dates a person can set; the record's own check time when the sha changed is when agent-smith learned it, and errs late, never early. The first read stores a sha without a move, so no existing record reads as moved."
  - key: "A LATE READ BRINGS IT BACK ONCE. A push made just before the close but read after it stamps a move after ClosedAt and brings the ticket back; closing it again moves ClosedAt past the stamp and it stays closed. Accepted rather than reading commit dates."
  - key: "A BOT PUSH COUNTS. A head move has no author, so an automatic rebase or 'update branch' brings a closed ticket back, unlike a bot's comment (114fb rule 3). Accepted: a pull request that is still being changed is not finished business."
  - key: "POLLING READS THE HEAD FROM THE SWEEP, NOT FROM RE-READS. The PR sweep lists every open pull request with its head already; one comparison per record nudges a refresh only when the head moved, so the cost does not grow with the number of closed tickets and the webhook re-read keeps its cap. Latency: one sweep interval in polling projects, up to about twenty minutes in webhook projects."
  - key: "A REOPEN IS A STORED TIME FROM A SUCCESSFUL READ. A reopened pull request keeps its creation time as its state time on every host, and a check time also advances on a failed read; the copy stamps ReopenedAt only when a read that succeeded sees an ended record open again, so neither a host error nor a refresh in flight across the close can bring a ticket back."
  - key: "A PERSON'S TRACKER CLOSE ONLY WHERE THE TRACKER IS ALREADY READ (contract default 13). The operator's condition is no tracker read per row; the between-attempts check already reads the ticket for failed heads, so asking TicketClosure on that ticket adds at most one status-history read, only for a closed ticket with no done status configured."
  - key: "AGENT-SMITH'S OWN TRACKER CLOSE IS NOT A PERSON'S. With 2026-10-15-114fe's closed status configured, 'also close on the tracker' lands in a status TicketParkStatuses.Own holds, and the arm stays quiet after a Reopen. Without it the close lands in the connection's done status, which TicketClosure reads as a person's whenever a trigger done status differs; such a ticket then shows 'closed on the tracker', which is true of the tracker, until the closed status is configured or the tracker ticket is reopened."
  - key: "THE TRACKER ARM SITS BELOW REVIEW AND DONE (contract default 14). An open pull request is live work a person may still merge; a landing is a delivery. The by-hand mark, the person's explicit act in agent-smith, outranks both — the tracker close is an inference."

steps:
  - id: head-read
    action: "PrReviewState.HeadSha; the three state reads fetch it (GitHub headRefOid, GitLab sha, Azure Repos LastMergeSourceCommit), each at most 4 lines more; run the provider review-read classes."
  - id: record-stamps
    action: "PrReviewRecord HeadSha, HeadMovedAtTicks, ReopenedAtTicks; PrReviewRecordRefresh carries the sha; PrReviewRecordCopy stamps a move and a reopen and keeps a stored sha over a null one (43 -> at most 54); PrReviewRecordView and TicketPullRequestView HeadMovedAt / ReopenedAt; TicketClosedRule reads both."
  - id: sweep-head
    action: "PrReviewRecordView.HeadSha; PrSweepRecordNudge nudges a Refresh for a listed head that differs from the stored one (32 -> at most 40); run the Rework.Sweep classes."
  - id: tracker
    action: "ClosedForWork on TicketObservation, TicketBetweenAttemptsState and TicketBetweenAttemptsCheck; TicketTrackerObserver asks TicketClosure (59 -> at most 66); TicketCheckStore writes and compares it (65 -> at most 70); TicketStanding.ClosedForWorkOf; the tracker arm in TicketBucketRule's tail helper; TicketSummaryComposer passes it."
  - id: migration
    action: "`dotnet ef migrations add AddClosedTicketFacts` in both migrations projects; read both Up/Down and confirm only the four columns."
  - id: tests
    action: "Red first, then green, for every test below; the composition test carries a TestProcess env trait with EnvVarCollection; run the Tickets, Rework, Sweep and Providers classes touched with --filter."

