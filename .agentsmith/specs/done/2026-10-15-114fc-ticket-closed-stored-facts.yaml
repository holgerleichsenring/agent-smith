spec: 2026-10-15-114fc
goal: "A commit pushed to or a reopen of a closed ticket's pull request brings it back, and a failed ticket a person closed on the tracker lists as Closed, from reads the server already makes."

applies_to: "backend (PrReviewState / PrReviewRecord head sha, head-moved and reopened times on GitHub, GitLab and Azure Repos, the polling PR sweep comparing heads, the between-attempts check recording a person's close, the rule reading all three, one migration in both sets)"

requires: [2026-10-15-114fb, 2026-10-15-114fe]

