done:
  - "A commit pushed to, or a reopen of, a pull request of a ticket closed hide-only brings the ticket back to Waiting on review — within one PR-sweep interval in polling projects and about twenty minutes in webhook projects; a failed host read never does."
  - "A failed ticket that a person closed on the tracker lists as Closed (closed on the tracker) once the list has checked it; a ticket agent-smith closed into its configured closed status, or with no done status configured, does not."
  - "`agentsmith database migrate` adds the head, reopen and closed-for-work columns on every provider."
  - "Build green, full suite green, dashboard gen/test/build green."
