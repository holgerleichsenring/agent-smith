# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-18-00eaa
goal: "A stored value whose catalog secret was deleted can be deleted from the Config studio's secret drawer and drafted for removal by the admin assistant's cleanup."

applies_to: "default (config change kinds, ConfigChangeApplier, admin draft tools, admin prompt), dashboard (secret drawer)"

requires: [2026-11-17-f3a8d, 2026-11-17-f3a8c]

facts:
  - claim: "Deleting a catalog secret leaves its stored value; SecretValuesReader lists such rows as orphans and read_secrets names them, but the dashboard shows none of them."
    evidence: "src/backend/AgentSmith.Server/Services/Admin/Secrets/SecretValuesReader.cs, src/backend/AgentSmith.Server/Services/Admin/Read/AdminConfigReadTools.cs, src/dashboard/src/components/config/SecretValueField.tsx"
  - claim: "DELETE /api/config/secret-values/{name} starts a 'secret' run that deletes any stored row by name."
    evidence: "src/backend/AgentSmith.Server/Extensions/SecretValueEndpoints.cs, src/backend/AgentSmith.Application/Services/Admin/SecretWrite.cs"
  - claim: "The admin assistant drafts cleanups as config change items applied by ConfigChangeApplier through IConfigStore, reverting this run's earlier items on a refusal."
    evidence: "src/backend/AgentSmith.Application/Services/Admin/ConfigChangeApplier.cs, src/backend/AgentSmith.Server/Services/Admin/Config/AdminConfigDraftTools.cs"

scope:
  in: "Drawer: a block listing every orphaned stored value (name, set by, set at) with Delete, which calls the existing DELETE route (a secret run); shown in every secret drawer. Assistant: kind 'secret-values' — read shows an orphan's state (never a value), only delete is drafted and only for an orphan; the config run applies catalog items first, then checks EVERY stored-value item (still an orphan, set at the same time as drafted) before deleting any, so nothing irreversible happens before the last check; the state the draft and the model see is name and set-at only (no person, no key id, so a re-wrap does not refuse a valid delete); the prompt and tool description say so. Approving needs the admin assistant's grant, as for every config kind it drafts, catalog secrets included (decision). A value set for the same name between the check and the delete is lost (accepted: narrow, and the set is a separate run that re-creates the catalog name first)."
  out: "Deleting a stored value whose catalog secret still exists through the assistant (the drawer's Delete stored value does it). Deleting the value together with the catalog secret in one item."

steps:
  - id: kind
    action: "StoredSecretValueKind (Application): Read(vault, store, name) -> state JSON or null, IsOrphan; ConfigEntityKinds names it; AdminConfigDraftTools drafts it (async) and refuses upsert and non-orphans."
  - id: apply
    action: "ConfigChangeApplier.ApplyAsync: catalog items in order, then stored-value deletes through ISecretVault; refusal handling as in scope; ApplyConfigChangesHandler awaits it."
  - id: prompt
    action: "admin-assistant-master: an orphaned stored value is cleaned up by drafting a delete of kind secret-values."
  - id: dashboard
    action: "OrphanedSecretValues component in the secrets drawer: list + Delete per row, line after each run."

tests:
  - "ConfigChangeApplier: an orphan's stored value is deleted after the catalog items; a non-orphan or a re-set value is refused before any value is deleted and the catalog items are reverted."
  - "AdminConfigDraftTools: drafting an upsert of secret-values is refused; read shows no value."
  - "Harness: the assistant drafts delete secret-values/<orphan>; approving runs 'config' and the row is gone."
  - "Dashboard: orphans render with Delete, which calls the delete route and reloads."

done:
  - "An admin can delete an orphaned stored value from any secret drawer, or have the admin assistant draft its removal and apply it as a config run."
