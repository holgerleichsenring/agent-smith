# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762e
goal: "A spec's cited evidence is checked, a fresh reviewer that opens the code answers BUILD, BUILD WITH CUTS or REFUSE with file:line evidence, and each answer is stored on the run as event 87."

applies_to: "backend (spec review: evidence check, attack reviewer on a look its caller opens, admission, the round publisher, event 87 and its RunSpecReviewRounds projection, two migrations) + the dashboard's run-event mirror"

requires: []

facts:
  - claim: "The plugin's review loop is: run the evidence script, spawn ONE fresh reviewer with a fixed attack brief, answer BUILD / BUILD WITH CUTS / REFUSE with file:line evidence, apply cuts, grep the old wording in every register, repeat until BUILD."
    evidence: "observed: 2026-10-13, skills/review-spec/SKILL.md lines 12-39 of the spec-first plugin checkout at 965aa65"
  - claim: "The attack brief, verbatim, is the quoted paragraph at line 31."
    evidence: "observed: 2026-10-13, skills/review-spec/SKILL.md line 31 of the spec-first plugin checkout at 965aa65"
  - claim: "Today's cut reviewer judges only deliverability and is told to say nothing about style, ordering or how many specs; it reviews the whole set in one call."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCutReviewPrompt.cs:30-60, src/backend/AgentSmith.Application/Services/Specs/SpecCutReviewer.cs:38-55"
  - claim: "A framework review is a port called with a fresh chat client per call, a cost scope, a call scope and a guard on the run's token so a provider timeout never kills the caller."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/ISpecCutReviewer.cs:21-26, src/backend/AgentSmith.Application/Services/Specs/SpecCutReviewer.cs:57-87"
  - claim: "A look's holder is named by DerivationLookTerms (actor, allowance, evidence letter, numbered reads, stage runs); letters L, R, P, M and C are taken, and the spec review numbers its reads because its findings name a line."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/DerivationLookTerms.cs:26-28, src/backend/AgentSmith.Application/Services/Specs/DerivationLookTerms.cs:37-92"
  - claim: "DerivationLookFactory.OnTerms builds a template-free look over the run's sandboxes on any holder's terms, null when the run has none; ProposalRepositories is the run's sandboxes minus templates and references."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/DerivationLookFactory.cs:58-73, src/backend/AgentSmith.Application/Services/Specs/DerivationLookFactory.cs:103-115"
  - claim: "A design turn publishes ContextKeys.SandboxRepos with every template under its own key, and with more than one repository a bare cited path goes to BareAsync, so a template holding the path would answer for it; ProposalRepositories drops template and reference keys by their prefixes."
