done:
  - "GET /api/tickets lists each (project, ticket id) once, with its bucket, attempt count and cost, using only SQLite-safe operators (no DateTimeOffset in SQL, decimal summed in memory)."
  - "A parked run whose relaunch is under way reads working on the ticket list and queued on the runs list — never needs-you on one and queued on the other."
  - "A pr-review run, and a reservation cancelled before it started, show on the detail as other runs and never as attempts."
  - "The detail numbers attempts by run id, says which ended on infrastructure and which handed back, names the branch, and deleting one renumbers the rest."
  - "A TicketActivityChanged published on one replica reaches the overview group of every replica and never appears on the System page, neither live nor in its subscribe backlog."
  - "GET /api/runs and the run detail carry project and platform."
  - "A reserved launch that failed in its prologue shows as a failed attempt, never as a never-started other run."
  - "A custom role holding runs.read opens the ticket endpoints without an edit."
