assumptions:
  - "Five thousand ticket-carrying code runs cover every ticket an operator works this quarter; the response says when the ceiling cut older tickets off."
  - "Every run that does work starts at least one step; a CANCELLED row with no RunStep never did work."

scope:
  in: >
    TICKET: (Project, raw TicketId) with at least one code-pipeline run. ATTEMPTS: its code-pipeline runs ordered by
    run id and numbered from 1, computed per request and never stored, so a deleted run renumbers the rest. A live
    queued reservation IS an attempt (it keeps its id when promoted) and stays counted by TicketAttempts — the
    latest-attempt check of 2026-10-13-9a59n relies on it. A CANCELLED row with no RunStep never started —
    a reservation the operator cancelled from the queue, or a request QueuedRunSweeper flagged interrupted before
    RunStarted (both finalize as cancelled) — and is NOT an attempt; a FAILED row with no RunStep (a reserved
    launch whose prologue threw) IS a numbered attempt with lastOutcome failed: it is listed among the ticket's other runs as never started, so it is
    never numbered and never endedOnInfrastructure. A ticket whose code rows all never started reads idle with 0
    attempts. Runs of other pipelines (pr-review, security-scan, init) are other runs, never attempts. Title and
    Platform come from the newest run that carries them; ticketKey = TicketKey.For(the newest run's Platform, falling
    back to the project's tracker type lowercased, raw ticket id).Value — exactly the spelling SpecDialogSession.TicketKey holds and Run.Platform carries,
    so 2026-10-13-9a59g's BoundSessionNudge and 2026-10-13-9a59d's attempt-start nudge name the same ticket (null
    only when no run carries a Platform and the project is no longer configured). READERS in Server/Services/Tickets (never ITicketReader),
    split so b, e and h extend seams: TicketAttempts (the attempt predicate), InfrastructureEnd, TicketBucketRule,
    TicketListQuery (the ceiling read), TicketCounts, TicketMonthCost, TicketListReader (compose, sort, page),
    TicketDetailReader. FiledWorkRunsReader gains ForRunsAsync(rows) — the compose half of ForAsync — which ForAsync
    then calls; its callers keep the cap of 10 and every pipeline. BUCKETS: needs_you when the newest attempt is
    waiting_for_input and RunQueuePlace gives it no place, kind question (a pending checkpoint, its
    PendingQuestionInfo carried) or handback (no pending checkpoint); working when running, queued, or waiting with
    a place; idle otherwise, carrying lastOutcome = its status. ARM ORDER for the series (later members insert, never reorder):
    needs_you > working > waiting_on_review (9a59b) > stuck (9a59h) > done (9a59b) > idle. since = the checkpoint's AskedAt, the attempt's
    StartedAt, or its FinishedAt; null for a hand-back. INFRASTRUCTURE END: one class — the attempt was cancelled
    with reason interrupted or stale-lease-reaped. LIST: GET /api/tickets?project=&bucket=&cursor=&limit= reads the
    newest 5000 code runs carrying a ticket (light columns plus a has-step EXISTS, no JSON), groups and buckets in
    memory, sorts by the newest attempt's run id, pages with that id as the cursor (limit default 50, max 200) and
    returns TicketCountsView, honouring ?project= (per bucket, working split running/queued — a parked
    run whose relaunch holds a place or a fresh lease counts as queued, oldestNeedsYouSince, monthCost over all
    runs of the filtered project(s) from the month's run-id prefix with decimal summed in memory, truncated). TicketSummaryView: project,
    ticketId, ticketKey, platform, title, bucket, kind, since, attemptCount, cost, newestRunId, status, lastOutcome,
    queuePlace, pendingQuestion (on a needs_you question row only: the PendingQuestionInfo of the pending checkpoint —
    text, choices, defaultAnswer, answerDeadlineAt — plus runId, so 2026-10-13-9a59p renders PendingQuestionCard
    inline; read from the checkpoints the bucket rule already loads, so no extra query), specsDone, specsTotal (the newest attempt's RunSpec rows), attempts[] = {runId, status,
    endedOnInfrastructure, handedBack = (status waiting_for_input AND no pending checkpoint) OR (a RunSpec of it is
    handed_back)}. DETAIL: GET /api/tickets/{project}/{ticketId}
    (URL-encoded) returns TicketDetailView = the summary + branch (the ticket's default branch, TicketBranchNamer.Compose; a run handed a CheckoutBranch worked elsewhere) + attempts[TicketAttemptView
    = number, runId, status, startedAt, finishedAt, cost, endedOnInfrastructure, handedBack, pullRequests (from
    PullRequestsJson), executedSpecs (RunSpec rows with verdicts), pendingQuestion] + otherRuns; 404 for a pair with
    no code run. Both need runs.read, are mapped beside the PR endpoints, route-permission-baseline.tsv regenerated.
    NUDGE: TicketActivityChangedEvent(Source, Project, TicketKey, Timestamp) with SystemEventType.TicketActivityChanged
    = 56 and an EventTypeResolver.ResolveSystem row; ITicketActivityNudge (Contracts) implemented once over
    ISystemEventPublisher. SystemEventStream hands this type to a new IRunEventFanout.ToTicketActivityAsync and keeps
    it OUT of the ring, the rollup and the System group, in DrainAsync and RehydrateAsync, and SystemBacklogReader
    skips it in the System group's 50-entry seed; JobsHubFanout sends hub
    message TicketActivityChanged(project, ticketKey) to the overview group; BackpressureSafeFanout bounds it like the
    others; both test doubles gain the member. system-events.ts mirrors the record and describeSystemEvent gains its case (returns "" — the type never
    reaches the System page). This spec publishes none.
    SNAPSHOT: RunSnapshot gains Project and Platform, set by RunSnapshotMapper (GET /api/runs and the run detail);
    hub-events.ts RunSnapshot gains both. RunSnapshotFold is not touched: its snapshot never leaves the server with
    its fields.
  out: >
    Waiting on review, Done, open-PR count, Done this month and the list row's PR review — 2026-10-13-9a59b. The
    cause, revision, fingerprint, tracker state and web address of an attempt — 2026-10-13-9a59d. Not-started
    specs, the series strip and per-spec verdicts — 2026-10-13-9a59e. Per-pass cost and steps as worked —
    2026-10-13-9a59f. Stuck, the between-attempts check and the hand-back's since — 2026-10-13-9a59h (from the
    hand-back entry 2026-10-13-9a59g records). The handedBack mark of a hand-back attempt later superseded or
    cancelled — 2026-10-13-9a59h, from 2026-10-13-9a59g's SpecHandedBack (85) entry; until then a reads it as cancelled. Sandbox end reasons — 2026-10-13-9a59i; the sandbox arm of
    InfrastructureEnd — 2026-10-13-9a59n. Publishing TicketActivityChanged — 2026-10-13-9a59b, 2026-10-13-9a59g,
    2026-10-13-9a59h, 2026-10-13-9a59l, and on a new attempt's start 2026-10-13-9a59d. The dashboard listener and list — 2026-10-13-9a59p; the graph —
    2026-10-13-9a59q. Token totals: the mock shows none and the run row holds none.

decisions:
  - key: "SUPERSEDES THE 2026-09-09 TICKET-UI SET. 2026-10-13-9a59a..s replace 2026-09-09-fd21, -577c, -debf, -b51e, -9e54, -5cb7, -53e9, -ce50, -1a80, -3158, -094f and -be83, which never ran; their files stay in specs/done as the superseded record."
  - key: "A PROJECTION, NOT A TABLE. A ticket is computed over its runs per request; nothing new is stored, so nothing can disagree with the runs and nothing outlives a deleted run."
  - key: "KEY = (PROJECT, RAW TICKET ID). Operator decision 1; Run and the previous-attempt reader already key on it. ticketKey rides beside it only to match conversations and nudges, never as the identity."
  - key: "ATTEMPTS: CODE RUNS BY RUN ID, A LIVE RESERVATION INCLUDED, A NEVER-STARTED END EXCLUDED. Operator decision 11; StartedAt moves on promotion. Unlike DbPreviousAttemptReader (which drops every queued row), a live reservation counts: it is the work about to happen and keeps its id. A CANCELLED row without a RunStep did nothing, so it is never numbered — which is also why a reservation the sweeper flags interrupted can never be offered Retry unchanged. A FAILED row without a step is a prologue failure (ExecutePipelineUseCase.cs:360-372) the operator must see, so it stays a numbered attempt (review3-a finding 3)."
  - key: "RUN-SIDE BUCKETS ONLY, THROUGH RUNQUEUEPLACE. A bucket from Run.Status alone would show needs-you while the runs page says queued to resume, the disagreement 7c41c removed. idle carries lastOutcome until b and h add their buckets."
  - key: "ONE INFRASTRUCTURE-END RULE. The attempt read, the composer's Retry offer and the Retry endpoint ask one class (2026-10-13-9a59n extends it), so the page never offers what the endpoint refuses. Of operator decision 8's causes, host unreachable IS interrupted (the driving process stopped beating) and capacity never ends an attempt (a rejection keeps the row queued), so neither needs an arm of its own."
  - key: "PAGING IN MEMORY OVER A STATED CEILING. Buckets are computed in memory, so a page needs every ticket's newest attempt anyway; 5000 runs is the ceiling and the response says when it bit. The sort key is the newest attempt's run id: immutable and SQLite-safe."
  - key: "THE TICKET NUDGE IS A SYSTEM EVENT, KEPT OFF THE SYSTEM PAGE. The run-list nudge reaches only the sender's replica, while every replica drains the system stream with its own cursor. It is a UI refresh signal, not system activity: SystemEventStream routes it to the overview group and never into the ring or the 24 h rollup, and SystemBacklogReader skips it in the 50-entry seed, so it cannot evict poll cycles from the live ring. It DOES share the Redis stream's ~10 000-entry MAXLEN window that RehydrateAsync reads back (RedisSystemEventPublisher.cs:31-34); the publishers (b, g, h, l, d) fire once per change, which is low volume against poll cycles."
  - key: "SERIES STANDARD (binding for 2026-10-13-9a59b..s): TicketActivityChangedEvent(Source, Project, TicketKey, Timestamp) — Timestamp because every system event passes it to the SystemEvent base; ticketKey is TicketKey.For(tracker type lowercased, ticket id).Value, the SpecDialogSession.TicketKey spelling; ITicketActivityNudge has ONE implementation and no extra no-op class."
  - key: "ONE NUDGE IMPLEMENTATION, NO SEPARATE NO-OP. ISystemEventPublisher already defaults to its no-op outside the server, so the one ITicketActivityNudge over it is safe in every composition; a second no-op class would duplicate that default."
  - key: "HANDEDBACK COVERS BOTH PRODUCERS. The derivation hand-back parks with no RunSpec row and the premise hand-back writes RunSpec handed_back and fails the run; reading only RunSpec would mark the wrong one, so the mark is waiting-without-pending-checkpoint OR a handed_back RunSpec (review3-a finding 4)."
  - key: "TICKETKEY FROM THE RUN ROW FIRST. Run.Platform holds the same lowercased tracker type the binder uses, so a removed project's ticket still matches its stored conversation; live config is the fallback only (review3-a finding 6)."
  - key: "NO LIVE-FOLD EDIT. The fold's snapshot reaches clients only as a run id, so Project and Platform on it would be unobservable; the REST snapshot carries them (review3-a finding 5)."
  - key: "PRS FROM PULLREQUESTSJSON. It keeps every repo's PR with openedAt and is what FiledWorkRunsReader already serves, so the ticket page and the filed-work panel cannot disagree."
  - key: "EXTEND FILEDWORKRUNSREADER BY ITS COMPOSE HALF. The detail reads its own rows (one project, every pipeline, no cap) and hands them to ForRunsAsync; a second composer would be a second answer waiting to disagree, and sharing the compose keeps the file near 107 lines."
  - key: "RUNS.READ, NOT A NEW PERMISSION. The page regroups run rows like /api/pull-requests; a new permission would hide it from every custom role until edited."
  - key: "TOKENS CUT. Run.TokensIn/Out read 0 everywhere and the mock shows no tokens."
  - key: "NO CACHE. Computed per request so replicas cannot answer differently. The price is one Redis lease read per waiting newest attempt per list request (RelaunchingAsync), bounded by the needs-you count."
  - key: "PROVIDER SAFETY BY CONSTRUCTION. No DateTimeOffset in SQL, no SQL sum over decimal, only Where/OrderBy on Id and an EXISTS; tests run on SQLite, the CI provider; the SQL Server path runs where AGENTSMITH_TEST_DB_CONNSTR is set."

steps:
  - id: contracts
    action: "Server/Models: TicketBucket (needs_you, working, idle), TicketSummaryView, TicketAttemptMark, TicketCountsView, TicketDetailView, TicketAttemptView, TicketOtherRunView — the contract's field names."
  - id: attempts
    action: "TicketAttempts (code pipeline; every row except a cancelled one with no RunStep) and InfrastructureEnd (interrupted | stale-lease-reaped), each its own class."
  - id: filed-work-read
    action: "FiledWorkRunsReader: extract ForRunsAsync(rows) from ForAsync, which calls it; callers unchanged. Budget: 102 -> about 107 of 120."
  - id: bucket
    action: "TicketBucketRule: newest attempt + positions + relaunching set + pending checkpoints -> bucket, kind, since, lastOutcome; RunQueuePlace.Of and RelaunchingAsync reused."
  - id: list
    action: "TicketListQuery (5000-row ceiling, light columns + has-step), TicketCounts, TicketMonthCost (run-id prefix, in-memory sum), TicketListReader (group, ticketKey, sort, cursor, one RunSpec set query for the page)."
  - id: detail
    action: "TicketDetailReader: one-project rows, attempts numbered through TicketAttempts and composed by ForRunsAsync, endedOnInfrastructure, handedBack, other runs incl. never-started, branch, summary through the bucket rule."
  - id: endpoints
    action: "TicketQueryEndpoints: GET /api/tickets and /api/tickets/{project}/{ticketId} with runs.read, mapped after MapPullRequestQueryEndpoints; regenerate route-permission-baseline.tsv."
  - id: nudge-event
    action: "TicketActivityChangedEvent, SystemEventType 56, EventTypeResolver.ResolveSystem row, ITicketActivityNudge + its system-stream implementation registered in AddEventPublishing; system-events.ts mirror; describeSystemEvent (useSubsystemActivity.ts:119-145) gains the TicketActivityChanged case returning \"\" (strict TS fails the build otherwise; FilterRail.tsx's LABELS is keyed by run EventType and needs no row); pnpm gen:hub-events and pnpm build green."
  - id: nudge-route
    action: "IRunEventFanout.ToTicketActivityAsync; JobsHubFanout (overview group, TicketActivityChanged), BackpressureSafeFanout, the two RunEventRouterTests doubles; SystemEventStream routes the type before the ring in DrainAsync and RehydrateAsync (86 -> about 95); SystemBacklogReader skips the type in ReadAsync (53 -> about 55)."
  - id: snapshot
    action: "RunSnapshot gains Project, Platform and stays at its 130-line baseline by shortening its own comments; RunSnapshotMapper 117 -> 118 (both args on one line); RunSnapshotFold untouched (stays 119); hub-events.ts RunSnapshot mirrors them."
  - id: tests
    action: "Red first for every test below, then green; run the Server, Events and Architecture classes touched."

