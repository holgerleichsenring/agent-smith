# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-9a59a
goal: "The server answers which tickets exist, who must act next on each and what their attempts were, so the ticket page reads one answer instead of regrouping runs in the browser."

applies_to: "backend (Server ticket read endpoints, run snapshot, ticket activity nudge on the system stream) + the dashboard's RunSnapshot and system-events mirrors"

requires: [2026-09-17-042ej, 2026-09-22-7c41c, 2026-10-02-5ab2b, 2026-10-08-7c0e, p0503a]

