# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-02-5f89e
goal: "Every running run renews a heartbeat on its row; a run no process renews ends as cancelled with reason interrupted within five minutes of its last beat, and its sandboxes are reaped."

applies_to: "backend (run heartbeat, liveness reaper, cancel narration, persistence migration)"

requires: []

facts:
  - claim: "PipelineRunWatchdog scans only the in-process cancellation registry, which a restarted process starts empty."
    evidence: "src/backend/AgentSmith.Application/Services/Lifecycle/PipelineRunWatchdog.cs:43-53; src/backend/AgentSmith.Server/Services/Lifecycle/CancelEnforcer.cs:32-34"
  - claim: "The DB backstop flags a running run only after max_run_wall_time_seconds from its start, 1800 by default, selecting candidates and filtering the time client-side because SQLite cannot compare DateTimeOffset."
    evidence: "src/backend/AgentSmith.Server/Services/Lifecycle/CancelEnforcer.cs:64-69,91-109; src/backend/AgentSmith.Infrastructure.Persistence/Repositories/RunRepository.cs:130-141; src/backend/AgentSmith.Contracts/Models/Configuration/OrchestratorGlobalConfig.cs:17"
  - claim: "The only liveness signal is the ActiveRun lease heartbeat; a ticketless run (init) attaches no lease and runs no heartbeat pump."
    evidence: "src/backend/AgentSmith.Application/Services/ExecutePipelineUseCase.cs:88,382-399; src/backend/AgentSmith.Application/Services/Lifecycle/ActiveRunReaper.cs:7-22,44-58; src/backend/AgentSmith.Infrastructure.Persistence/Repositories/InitRunRepository.cs:8-11"
  - claim: "The lease exists before the run row: it is inserted at claim time and its RunId stays null until the run starts."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/ActiveRun.cs:15-18,25-26"
  - claim: "Sandboxes are kept while their run id is in the Redis active-runs set or holds a fresh lease; a dead process leaves its id in the set until a terminal event removes it."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/LiveRunSetReader.cs:14-35; src/backend/AgentSmith.Infrastructure/Services/Events/RedisEventPublisher.cs:60; src/backend/AgentSmith.Server/Services/Sandbox/SandboxOrphanReaper.cs:29-30,55-57"
  - claim: "A wall-time verdict marks the row cancel-requested and publishes RunCancelRequestedEvent; a flagged row with a null or past deadline is enforced on the next 15 s scan, summary and ticket comment from its typed reason."
    evidence: "src/backend/AgentSmith.Server/Services/Lifecycle/CancelEnforcer.cs:46-47,103-108; src/backend/AgentSmith.Infrastructure.Persistence/Repositories/RunRepository.cs:116-127; src/backend/AgentSmith.Server/Services/Lifecycle/CancelReasonNarrator.cs:13-43"
  - claim: "ActiveRunReaper guards a stale verdict with the local registry and a monotonic suspend-gap detector, both private to it; it runs on every replica."
    evidence: "src/backend/AgentSmith.Application/Services/Lifecycle/ActiveRunReaper.cs:23-31,49-55,64-71,101; src/backend/AgentSmith.Server/Services/Hosting/ActiveRunReaperHostedService.cs:9-40"
  - claim: "A new running row is inserted with StartedAt from RunStarted; a promoted queued row gets StartedAt reset to the event's."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunEventApplier.cs:115-118; src/backend/AgentSmith.Infrastructure.Persistence/Services/QueuedRunProjection.cs:21-23"
  - claim: "Waiting rows (queued, waiting_for_input) keep FinishedAt null and have no executor."
    evidence: "src/backend/AgentSmith.Contracts/Runs/RunStatuses.cs:11-12,24; src/backend/AgentSmith.Infrastructure.Persistence/Services/RunFinalizationProjection.cs:59-63"
  - claim: "ExecutePipelineUseCase (655), RunEventApplier (159), RunRepository (143) and CancelEnforcer (182) are ratchet rows; ActiveRunReaper has 111 lines; Run has no heartbeat column."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:7,21,62,108; src/backend/AgentSmith.Infrastructure.Persistence/Entities/Run.cs:10-41"

scope:
  in: >
    Run gains HeartbeatAt (nullable; migrations in both migration assemblies). RunHeartbeatPump, extracted from
    ExecutePipelineUseCase, renews Run.HeartbeatAt every 45 s for every run by a single-column update, and the
    ActiveRun lease too when the run has a ticket. IRunHeartbeat is the port (DB on the server, no-op in the CLI —
    only the server projects runs into the DB). RunLivenessRepository (new; RunRepository untouched) selects running,
    unfinished, unflagged rows and filters client-side: stale when COALESCE(HeartbeatAt, StartedAt) is older than
    3 minutes. RunLivenessReaper runs every minute on every replica; a run alive in this process's registry is
    refreshed instead, and a suspend gap suppresses verdicts for one window (SuspendGapDetector, extracted from
    ActiveRunReaper and shared). A verdict calls MarkCancelRequestedAsync with reason interrupted and deadline now and
    publishes RunCancelRequestedEvent, as the wall-time verdict does; CancelEnforcer ends the row with status
    cancelled, which removes it from the active-runs set, and SandboxOrphanReaper removes its sandboxes on its next
    scan. CancelReasonNarrator: 'Interrupted — no server was driving this run any more (restart or crash).'
  out: >
    A queued row whose Redis job-queue entry was lost to a flush — queued-row reconciliation after a Redis flush is
    its own phase when observed. Resuming an interrupted run instead of ending it. RunEventApplier and
    QueuedRunProjection are not touched: StartedAt is the fallback beat.

decisions:
  - key: "THE WATCHDOG FINDING. Nothing marked the 09:43 init: the watchdog reads an in-memory registry the restart emptied, the init held no lease so ActiveRunReaper never saw it, and the DB wall-time backstop would have fired only at 10:13. Only the operator's 09:52 cancel ended it."
  - key: "INTERRUPTED IS A REASON, NOT A STATUS. The row ends cancelled with CancelReason interrupted, through the enforcer's terminal path, so every reader of statuses stays as it is."
  - key: "ONE PUMP, TWO RECORDS, JUSTIFIED. The lease guards the CLAIM, which exists before any run row and drives ticket release; the row heartbeat guards the RUN, which every run has. Teaching ActiveRunReaper the row would leave unattached claims unguarded; a synthetic ticket for an init would teach the poller and finalizer a lie. One pump writes both on one cadence, so they cannot drift."
  - key: "STARTEDAT IS THE FIRST BEAT. COALESCE(HeartbeatAt, StartedAt) covers a run younger than its first renewal and the rows that predate the column, without touching RunEventApplier, which sits at its ratchet row."
  - key: "THE DB, NOT REDIS. An empty Redis must not read as every run dead."
  - key: "NEVER A LIVE RUN. Only status running is a candidate — waiting_for_input and capacity-queued rows are never reaped; a run replica B drives renews its row, so replica A sees a fresh beat and leaves it."
  - key: "BOUND: last beat + 3 min stale + ≤1 min scan + ≤15 s enforcer = under five minutes to the terminal state; sandboxes ≤30 s later. The enforcer needs the housekeeping leader."
  - key: "OVERLAP WITH ActiveRunReaper IS HARMLESS. MarkCancelRequestedAsync only flags an unflagged row, so the first reason stands."

steps:
  - id: schema
    action: "Run.HeartbeatAt, model config, migrations (default and SQL Server)."
  - id: pump
    action: "IRunHeartbeat (Contracts) with DbRunHeartbeat and NoOpRunHeartbeat; RunHeartbeatPump (Application) takes the loop out of ExecutePipelineUseCase, whose ratchet row drops."
  - id: reaper
    action: "SuspendGapDetector extracted from ActiveRunReaper; RunLivenessRepository; RunLivenessReaper and its hosted service registered beside ActiveRunReaperHostedService."
  - id: narration
    action: "CancelReasonNarrator summary and ticket comment for interrupted."

tests:
  - "RunHeartbeatPump_TicketlessRun_RenewsTheRowHeartbeat"
  - "RunLivenessReaper_StaleRunningRow_FlagsInterruptedAndPublishesCancelRequested"
  - "RunLivenessReaper_NoHeartbeatYet_UsesStartedAt"
  - "RunLivenessReaper_RunAliveInThisProcess_IsRefreshedNotReaped"
  - "RunLivenessReaper_FreshHeartbeatFromAnotherReplica_IsLeftAlone"
  - "RunLivenessReaper_SuspendGap_SuppressesVerdicts"
  - "RunLivenessReaper_WaitingForInputAndQueuedRows_AreNeverCandidates"
  - "Restart_InitRunNoProcessDrives_EndsCancelledReasonInterrupted (RealCompositionHarness)"

done:
  - "an init run whose server restarts ends status cancelled, reason interrupted, within five minutes, its sandboxes gone, without an operator"
  - "build green, full suite green, dashboard tests and build green"
