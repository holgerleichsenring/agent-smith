assumptions:
  - "2026-10-14-dbcej lands the kind: tickets outcome as ticket texts (main-thread decision D1): a list of tickets each with key ([a-z][a-z0-9-]{1,40}), a one-line title of at most 120, a requirement of at most 1,200, done (1 to 8 one-line string items of at most 240), requires (sibling keys or ticket:<id>, one leading '#' after the prefix stripped) and optional repos, no spec inside; a non-string field or item is refused asking to quote it; its checker refuses duplicate keys, a cycle and an unknown requires, and its MaxTickets is the number S5 names."
  - "2026-10-14-dbcek reviews a proposed ticket list as a whole and answers with cuts on ticket texts; 2026-10-14-dbcel refuses a list in a ticket-bound conversation, files each ticket as a work ticket whose body is its text, and carries a ticket-text record's cited material forward when the ticket's specs are settled in its own conversation; 2026-10-14-dbceh holds a ticket until its requires are merged. The master text describes these, it does not enforce them."
  - "2026-10-14-dbcec puts the absence sentence into the attack lens; this spec adds the skill half only."
  - "The operator merges the skills pull request and the release-please release pull request; this spec waits on both."

scope:
  in: >
    SKILLS WORKTREE: git -C agent-smith-skills worktree add ../agent-smith-skills-dbce -b spec/2026-10-14-dbce
    origin/main; every skills edit happens there and the operator's checkout is never switched.
    DESIGN-PARTNER-MASTER: the Outcomes list gains S1; the review-cut sentence (origin/main line 241) becomes S11;
    "When spec and epic both look right" gains S2 before its first paragraph, whose opening "Apply the branch-state test
    first:" becomes "Then apply the branch-state test:"; its "say which you chose" list gains S10; a new section
    "Proposing tickets" after "Proposing an epic" carries the ```outcome kind: tickets block and S3-S7; the drafting rules
    gain S8. The block shows two tickets in merge order with key, title, requirement (a few lines of scope), done (one
    item each), requires and, on the first, repos — the six fields 2026-10-14-dbcej reads: the second requires the first by key and one already-filed ticket as "ticket:1234"; EVERY
    string double-quoted (key, title, requirement on one line, each done item, each requires and repos entry), no spec,
    work, steps or facts key, and only lower-case flow mappings. Exact sentences (each quoted by a test and each on
    ONE source line of SKILL.md, because Should().Contain does not match a wrapped sentence; a review reword changes text
    and test together): S1 "- **tickets** (the work has MERGE boundaries: a piece must be merged before the next can be
    built or reviewed) → propose a list of tickets in merge order as described in \"Proposing tickets\"." S2 "Ask the
    merge test first: must one piece be MERGED before the next can be built or reviewed? Then each such piece is its own
    ticket, and a later ticket requires the one it must wait for. Work that only needs an order stays one ticket, a spec
    or an epic, and you say in one line which you chose and why." S3 "Each ticket is a ticket text, never a spec: a
    `key` of lower-case letters, digits and dashes, starting with a letter, 2 to 41 characters, that no other ticket of
    the proposal uses, a one-line `title` of at most 120 characters, a `requirement` of at most 1,200 characters, a
    `done` list of one to eight one-line items of at most 240 characters each (a scenario written as the one line `WHEN
    … THEN …`), and optionally `repos` naming the configured repositories it changes; quote every string, never put a code fence inside a ticket text, write it in
    English whatever language the conversation is in, and the run that ticket starts derives its specs." S4 "List the
    tickets in merge order: `requires` names only tickets that must be merged first, either one listed above it by its
    key or an already-filed ticket of this project as `ticket:<tracker id>`, the id without `#` (`ticket:41` for #41,
    `ticket:PROJ-41` for a Jira key), so no ticket ever waits on itself." S5 "A
    proposal holds 2 to 20 tickets; for more, propose the first part and let the next proposal name its filed tickets
    with `ticket:<id>`." S6 "Write each ticket's requirement against the code as it will stand once the tickets it
    requires are merged, and keep each ticket small enough for one run to build, review and merge: a piece, never a
    whole feature." S7 "Propose tickets only in a conversation that is not bound to a ticket; a bound conversation
    continues its own ticket." S8 "Write an absence criterion over the source tree, \"no file outside .agentsmith/
    contains X\", never \"no file contains X\": the committed spec under .agentsmith/ quotes X, so the whole-tree form
    can never hold." S10 "- **Tickets** file one ticket per entry, each carrying its text; a ticket whose requires are
    not yet merged waits and starts once they are, and its run drafts its specs when it starts. To settle a ticket's
    specs earlier, open Work it out on that ticket." S11 "A review may answer your spec, epic or tickets with cuts that
    quote your draft: apply exactly those cuts, change nothing else, and re-propose the whole outcome." DESCRIPTION
    (172 characters, cap 200): "Master for the spec-dialog pipeline. A design partner: answers grounded questions and
    emits a typed outcome - answer, fix-bug ticket, spec, epic, or tickets in merge order." CODING-AGENT-MASTER: the
    stop checklist gains S9 "Judge an absence criterion (\"no file contains X\") over the source tree: a match under
    .agentsmith/ does not count against it, because the committed spec there quotes X." TICKET-STEWARD-MASTER: its
    "Start the next attempt" paragraph (origin/main lines 53-60) ends with S12 "When `start_next_attempt` answers that
    the ticket waits for other tickets, tell the person which tickets it waits for and that nothing was started: once
    those are merged or marked done by hand, they ask for the attempt again." (2026-10-14-dbcei's answer: a worked
    ticket is never started by a landing, so the sentence does not promise it starts by itself.) VERSIONS: one bump per
    touched master, one minor above its origin/main version at the rebase (expected 1.16.0 -> 1.17.0, 1.32.0 -> 1.33.0
    and 1.0.0 -> 1.1.0, not fixed targets); scripts/validate-skills.sh green; ONE pull request with a conventional "feat:" title. PIN: after the
    operator's merges, SkillsCatalogVersion and SkillsCatalogSha256 move to the tag release-please cuts (expected
    v5.18.0); the v5.17.0 tarball is deleted and the new one checked in; the example config and the version strings in
    skills-catalog.md, airgap.md and your-own-skills.md follow (your-own-skills.md:71 the version only, its example
    counts kept as 8762x kept them); SkillsConfigValidatorTests names the new tag; SeriesSkillRulesTests' review-cut
    quote becomes S11. TESTS: TicketGraphSkillRulesTests reads S1-S10 and the block from the pinned masters;
    TicketStewardSkillTests reads S12 from the pinned steward.
  out: >
    The outcome parser and checker (unique keys, acyclic, requires known, MaxTickets) — 2026-10-14-dbcej. The review of
    a proposed list — 2026-10-14-dbcek. Filing and the bound-conversation refusal — 2026-10-14-dbcel. Holding a ticket
    until its requires are merged — 2026-10-14-dbceh. The attack lens's absence sentence — 2026-10-14-dbcec. GrepScope's
    exclusions — nobody: the design partner must keep reading specs (contract letter c). spec-derivation-master —
    nobody: a run derives one ticket's specs from that ticket's text, which it already does, and never a list of
    tickets. Moving a deployed config's skills.version to the new tag — nobody in this repo: operator config, not
    committed; the commit and the pull request name the tag to set. The local commit on
    feat/design-partner-asks-at-the-threshold — nobody: it is not on origin/main and does not ride this release unless
    the operator merges it first.

decisions:
  - key: "ONE RELEASE AT THE END. Contract section 5 default 26 (default, pending operator ratification): one release and one pin move for the series, after the outcome, the review and the filing exist, so no live master asks for a kind the server would refuse."
  - key: "THE BLOCK TEACHES TICKET TEXTS, NOT SPECS (main-thread decision D1, default pending operator ratification). A design reply cannot carry 20 tickets of full specs under the design turn's output cap, and each ticket's run derives its specs against the code its requires leave merged, the reason child tickets carried no specs before. The block therefore has no spec, work, steps or facts key, and the earlier cuts that taught a nested spec shape and graph-wide spec-id uniqueness fall away with it."
  - key: "MERGE TEST FIRST, BRANCH-STATE TEST SECOND. Contract decision 1 and section 5 default 25 (default, pending operator ratification): a ticket list only at merge boundaries; work that only needs order stays one ticket's series, which keeps 2026-09-17-0e79d's reasons for one ticket per cut. The existing 'Apply the branch-state test first:' becomes 'Then apply the branch-state test:' so the master does not name two tests first. The master says which it chose and why."
  - key: "REQUIRES POINT UP THE LIST, SO THE PROSE NEVER READS AS A CYCLE. 'Tickets that require each other' reads as mutual, and the checker refuses a cycle. Teaching merge order with requires naming only a ticket listed above it is stricter than the checker (which orders any acyclic list) and makes a cycle impossible to write; the description says 'tickets in merge order' for the same reason."
  - key: "NO NUMBER FOR A TICKET'S SIZE IN THE TEXT. A ticket's run is capped by series.specs_per_attempt, which is configurable; the text says 'small enough for one run to build, review and merge: a piece, never a whole feature', the size the field showed works. The field's word for the failed size is not used: the skills validator fails any unlisted file containing it (round-2 cut), and the noun in this repository is spec."
  - key: "S3 STATES THE CHECKER'S BOUNDS, NOT THE SPEC DONE RULES (round-2 cut). The spec done rules allow a scenario mapping, which 2026-10-14-dbcej refuses in a ticket text; each violation costs the design turn's one re-prompt, and a second invalid list reaches the operator as a notice instead of the list. S3 therefore names the key shape, the one-line title, the 1,200-character requirement, one to eight one-line done items with a scenario as one WHEN … THEN … line, and asks to quote every string and never to put a code fence inside a ticket text; the block quotes every string so an unquoted ': ' never turns an item into a mapping, and an inner fence would end the outcome block early (SpecDialogDraftBlocks.cs:25 matches up to the first closing fence). Ticket texts are English, as bugs and specs already are."
  - key: "ticket:41, NOT ticket:#41 (round-2 cut). The filing and proposal texts show numeric ids as #41; 2026-10-14-dbcej strips one leading '#' so a copied form still names the ticket, and S4 teaches the clean form so the master never relies on that leniency."
  - key: "THE SETTLE-SPECS-FIRST SENTENCE STAYS (round-2 cut REJECTED in favour of the main-thread amendment R3). The review found that an approval in a ticket's own conversation re-cited only that conversation's material (ApprovedSpecSetRecorder.cs:72,82-83; ApprovalCitations.cs:16-21). 2026-10-14-dbcel now carries the previous ticket-text record's cited sets and images forward into the re-recorded approval, so the path S10 names keeps the uploads and the sentence is true."
  - key: "THE REVIEW-CUT RULE NAMES TICKETS. 2026-10-14-dbcek answers a list with cuts; a master told only 'your spec or epic' may re-propose the cut ticket alone, one ticket, which the checker refuses. The rule and SeriesSkillRulesTests' quote change together in this commit."
  - key: "ABSENCE CRITERIA SCOPED IN BOTH MASTERS. Contract section 5 default 3 (default, pending operator ratification): the design partner writes the scoped form, and the coding master judges an unscoped one over the source tree, because filed tickets written before this release still carry it. S9 is tool-neutral: grep_in_tree has no exclude parameter."
  - key: "THE SKILLS WORK HAS ITS OWN WORKTREE. The operator's skills checkout carries an unmerged branch; cutting a branch there would switch it under him, so the work runs in agent-smith-skills-dbce from origin/main, as earlier series did."
  - key: "THE STEWARD SAYS NOTHING STARTED, NOT THAT IT STARTS BY ITSELF (re-grounded after PR #740). The request asked for 'it starts by itself once those are merged or marked done by hand'. That holds for a ticket no attempt worked (2026-10-14-dbceh's wake), but start_next_attempt is offered only on a worked ticket, whose RequirementsMet nudge reworks only on a pending act (ReworkNudgeHandler.cs:39-53), and 2026-10-14-dbcei answers the waiting start without queueing one; a promise of a self-start would be false. S12 therefore says which tickets it waits for, that nothing was started, and that the person asks again once they landed. Reported to the operator."
  - key: "MINIMUM VERSION STAYS v5.13.0. An older pulled pin still runs; its design partner only never proposes tickets."
  - key: "BUMPS ARE RELATIVE, AS 8762x DID. origin/main may move before the rebase, so each master and the tag are 'one minor above origin/main at the rebase', never fixed in advance."
  - key: "TESTS QUOTE THE TEXT AS WRITTEN. The sentences and the description live in this spec so the test and the master cannot be written from two paraphrases; a review that rewords one changes both in this commit."

steps:
  - id: skills-worktree
    action: "git -C /Users/da5id/develop/source/others/agent-smith/agent-smith-skills fetch; worktree add ../agent-smith-skills-dbce -b spec/2026-10-14-dbce origin/main; all skills edits there."
  - id: design-partner
    action: "design-partner-master: S1 in Outcomes, S11 for line 241, S2 and 'Then apply the branch-state test:' in 'When spec and epic both look right', S10 in its 'say which you chose' list, the section 'Proposing tickets' (the block, S3-S7) after 'Proposing an epic', S8 in the drafting rules, the 172-character description; every quoted sentence on one source line."
  - id: coding-agent
    action: "coding-agent-master: S9 in the stop checklist beside the acceptance item; ticket-steward-master: S12 on one source line ending the 'Start the next attempt' paragraph."
  - id: versions
    action: "One frontmatter bump per touched master (three), one minor above origin/main at the rebase; scripts/validate-skills.sh green (description cap, inputs, references, the spec-word check that refuses 'phase'); grep S1-S12 on the branch and grep -ci phase over the three masters' changed text = 0."
  - id: release
    action: "One pull request titled 'feat: the design partner proposes ticket lists in merge order and scopes absence criteria to the source tree, and the steward says what a waiting ticket waits for'; after the operator merges it and the release-please pull request, confirm the release lists agentsmith-skills-<tag>.tar.gz and its .sha256."
  - id: pin
    action: "csproj SkillsCatalogVersion and SkillsCatalogSha256 to the new tag; delete Resources/agentsmith-skills-v5.17.0.tar.gz; the build downloads, verifies and validates the new tarball; check it in."
  - id: version-strings
    action: "config/agentsmith.example.yml:598, skills-catalog.md (20, 37, 58-59, 73, 85), airgap.md (18, 30, 45), your-own-skills.md (15, 71 version only); SkillsConfigValidatorTests' accepted pin names the new tag."
  - id: rule-tests
    action: "TicketGraphSkillRulesTests (tests/AgentSmith.Tests/Skills, at most 120 lines, through PackagedMaster): one test per sentence S1-S10, one for the block and one that the block's outcome passes 2026-10-14-dbcej's parser and checker; SeriesSkillRulesTests' review-cut quote becomes S11; TicketStewardSkillTests gains the S12 test (52 -> at most 62)."
  - id: tests
    action: "Run the Skills, Prompts and Configuration classes (MasterPromptTokenDriftTests and the composed-principles goldens against the new pin; a changed golden is regenerated and named in the commit)."
  - id: verify
    action: "Full suite, dashboard gen:hub-events / test / build."

