spec: 2026-10-14-dbcep
goal: "One skills release teaches the design partner ticket lists in merge order and source-tree absence criteria, has the steward say what a waiting ticket waits for, and the pin moves to it."

applies_to: "the agent-smith-skills release (design-partner-master, coding-agent-master, ticket-steward-master) + backend (embedded skills pin, pinned-master tests, version strings in the example config and the skills docs)"

requires: [2026-10-14-dbcec, 2026-10-14-dbcei, 2026-10-14-dbcej, 2026-10-14-dbcek, 2026-10-14-dbcel]

