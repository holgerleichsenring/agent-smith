  - "EmbeddedSkills_DesignPartnerMaster_ProposesTicketsOnlyUnbound (S7)"
  - "EmbeddedSkills_DesignPartnerMaster_ScopesAbsenceCriteriaToTheSourceTree (S8)"
  - "EmbeddedSkills_CodingAgentMaster_JudgesAbsenceOverTheSourceTree (S9)"
  - "EmbeddedSkills_DesignPartnerMaster_SaysWhatATicketListFiles (S10)"
  - "EmbeddedSkills_DesignPartnerMaster_ShowsATicketTextBlockWithoutSpecs (the kind: tickets block holds key, title, requirement, done, requires and repos, a ticket:<id>, every string double-quoted, and no spec, work, steps or facts key)"
  - "EmbeddedSkills_DesignPartnerMaster_ShowsAnExampleTheCheckerAccepts (the block's outcome, parsed by 2026-10-14-dbcej's TicketGraphOutcomeParser and TicketGraphChecker, is valid)"
  - "EmbeddedSkills_DesignPartnerMaster_AppliesReviewCutsAndReproposes (existing, quote becomes S11)"
  - "TicketStewardSkill_WaitingStart_SaysWhatItWaitsForAndThatNothingStarted (S12)"
  - "TicketStewardSkill_NamesOnlyToolsTheStewardOffers (existing, against the new pin)"
  - "EveryPlaceholderUsedByAMaster_IsDeclaredInMasterPromptTokens (existing, against the new pin)"
  - "SkillsConfigValidator_PinAtOrAbove5_13_OrNotAVersion_Passes (existing, new tag added)"

done:
  - "A server built from this commit runs the new skills release with no skills: block configured, and in Work it out the design partner proposes a list of tickets in merge order, each a title, a requirement and a done list with the tickets it waits for, when a piece must be merged before the next, and says why it chose a list or one ticket's series."
  - "The design partner tells the operator that each ticket is filed, waits until the tickets it requires are merged, and has its specs drafted by its own run, and that Work it out on a ticket settles them earlier."
  - "Specs and ticket done lists the design partner writes state absence as 'no file outside .agentsmith/ contains X', and a coding run judges an older unscoped one over the source tree instead of failing on its own spec."
