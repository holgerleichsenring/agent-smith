# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-18-9ae8
goal: "Every credential the server read straight from an environment variable resolves through ICredentialResolver: the variable when set, else the catalog secret of that name, stored values included."

applies_to: "default (ICredentialResolver, chat client builders, rate budget, webhook secrets, chat adapters)"

requires: [2026-11-17-f3a8d]

facts:
  - claim: "The Claude, OpenAI, Gemini and Copilot chat client builders read agent.ApiKeySecret and their fallback variables straight from the environment."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/ClaudeChatClientBuilder.cs, src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/OpenAiChatClientBuilder.cs, src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/GeminiChatClientBuilder.cs, src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/CopilotChatClientBuilder.cs"
  - claim: "LlmRateBudget picks the Anthropic tier from ANTHROPIC_API_KEY read from the environment, whatever key the agent uses."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/RateLimiting/LlmRateBudget.cs"
  - claim: "WebhookSecretResolver reads GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_TOKEN and AZDO_WEBHOOK_SECRET from the environment only."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Webhooks/WebhookSecretResolver.cs"
  - claim: "SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET and TEAMS_APP_PASSWORD are read from the environment once, at composition."
    evidence: "src/backend/AgentSmith.Server/Services/Adapters/ChatAdaptersExtensions.cs"
  - claim: "ICredentialResolver already resolves repo, connection and tracker tokens through ISecretValues, whose catalog values are the environment first and the stored value second (2026-11-17-f3a8d)."
    evidence: "src/backend/AgentSmith.Contracts/Services/CredentialResolver.cs, src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigSecretResolver.cs"

scope:
  in: "ICredentialResolver.Named(name): the environment variable of that name when non-empty, else ISecretValues.Resolve(name) (the catalog secret of that name: its reference's variable, else its stored value); the rule as one static (EnvironmentFirst) the webhook resolver shares over its config's secrets. Moved: the four builders (api_key_secret and ANTHROPIC_API_KEY, OPENAI_API_KEY, AZURE_OPENAI_API_KEY, GEMINI_API_KEY, GOOGLE_API_KEY, COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN), LlmRateBudget (the agent's resolved Anthropic key), the three webhook secrets, SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, TEAMS_APP_PASSWORD (read per use, so a stored value reaches them without a restart; Teams' bot token cache keeps an old password until the token expires). The catalog lookup is by the catalog secret's NAME, case-insensitive (ConfigNames): an agent key secret named ANTHROPIC_API_KEY finds the catalog secret anthropic_api_key, not a secret of another name that references the variable. LlmRateBudget takes the key the Claude builder resolves (one static), fixed when the limiter for that provider and model is first created. The secret state's 'from environment' reads the variable the catalog secret references (from its stored document), not its name, and the drawer names that variable."
  out: "Deployment bootstrap, read from the environment by design: AGENTSMITH_SECRET_MASTER_KEY(_FILE, _PREVIOUS), AGENTSMITH_PERSISTENCE_CONNECTION, REDIS_URL, SANDBOX_REDIS_URL (the configuration and the stored values live behind them). The external worker CLI, which authenticates itself. LegacyCredentialMigration, which reads the old variables only to fill a catalog entry. TEAMS_APP_ID and TEAMS_TENANT_ID (identifiers, not credentials). Failing closed when a webhook or Slack signing secret's stored row cannot be opened (decision: accepted, the unreadable row is already a finding naming it)."

steps:
  - id: resolver
    action: "EnvironmentFirst.Resolve(name, environment, ISecretValues) in Contracts; ICredentialResolver.Named; CredentialResolver takes the environment reader (default the process environment)."
  - id: builders
    action: "Claude/OpenAI/Gemini/Copilot builders take ICredentialResolver and resolve api_key_secret and fallbacks through AgentApiKey (a class over the resolver: NoStaticStateRule), keeping each builder's refusals; ChatClientFactory passes the key ClaudeChatClientBuilder.ResolveApiKey resolves to LlmRateBudget."
  - id: webhooks-adapters
    action: "WebhookSecretResolver resolves its variable with EnvironmentFirst over the config it is handed; SlackAdapterOptions/TeamsAdapterOptions read their credential through a reader on every access, set from ICredentialResolver.Named; tests keep assigning values."
  - id: state
    action: "SecretValuesReader reads each secret's reference from IConfigDocumentStore (DbConfigStore may only shrink under the file-length ratchet); SecretValueState carries the variable; SecretValueField names it."
  - id: tests-migrate
    action: "Builder and webhook resolver call sites in tests take TestCredentials (the resolver over an empty catalog, i.e. the environment only)."
  - id: docs
    action: "config-studio.md and ai-providers.md: an agent key secret resolves like every catalog secret, environment first."

tests:
  - "CredentialResolver.Named: environment wins; empty environment takes the catalog value; a stored value of the catalog secret is returned; neither is null."
  - "Each builder builds with a key that only the catalog holds; OpenAI's named-but-empty refusal still names the variable."
  - "WebhookSecretResolver: environment wins; a catalog value fills an empty variable."
  - "SlackAdapterOptions reads the resolver on each access; an assigned value wins."
  - "Booted server: a stored value for ANTHROPIC_API_KEY is what the Claude builder resolves when the environment variable is empty."

done:
  - "An agent whose api_key_secret has no environment value runs on the value stored in the admin area; webhook and chat adapter credentials resolve the same way; the bootstrap values that stay environment-only are listed in this spec."
