# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-89f1a
goal: "A pull-request comment starts a pipeline only when its author may write to the repository, on GitHub, GitLab and Azure DevOps alike, checked before any model call."

applies_to: "backend (webhook handlers, a trust port with one implementation per platform)"

requires: []

scope:
  in: "An author trust check for PR/MR comments on all three code hosts, called after the slash-command match and before the model; fail closed; the dead pr: dialogue branch removed."
  out: "Ticket comments (comment_keyword, plan answers): whoever may comment on a ticket may also label it, so a comment grants nothing a label does not."

decisions:
  - key: |
      ONLY GITHUB CHECKED THE AUTHOR. p0059 specified the check for GitHub; p0059b/c carried the
      handler to GitLab and Azure DevOps without it. Anyone able to comment on an MR or PR there spends
      tokens (a slash command goes to a model) and starts a pipeline. The webhook secret proves who sent
      the request, not who wrote the comment. The /approve branch the handlers carry answers a conversation
      keyed pr:{repo}#{pr} that nothing ever writes; it is dead and goes.
  - key: |
      THE BAR IS WRITE ACCESS, AND IT IS FIXED. GitLab Developer (access_level >= 30), Azure DevOps Git
      Contribute on the repository, GitHub OWNER/MEMBER/COLLABORATOR. CONTRIBUTOR leaves GitHub's set: it
      means a merged commit, not write access. A configurable allow-list would be a second membership
      list that drifts from the platform's.
  - key: |
      THE CHECK SITS BETWEEN THE STRUCTURAL MATCH AND THE MODEL, so an ordinary comment costs no platform
      API call and an untrusted slash command costs no token.
  - key: |
      FAIL CLOSED. A lookup that throws, a missing token, or a repository no project declares is
      untrusted. Verdicts are cached per (repository, author) for five minutes.

steps:
  - id: spike
    action: "Find the Azure DevOps API that returns a named identity's EFFECTIVE Git Contribute permission (inherited group grants included) and the PAT scope it needs; record it in the decisions. Without one, membership (group-expanded) in a group holding Contribute is the rule, stated."
  - id: port
    action: "IPrCommentAuthorTrust in Contracts; GitHubAuthorAssociationTrust (existing set minus CONTRIBUTOR), GitLabMemberAccessTrust, AzureDevOpsRepoContributeTrust in Infrastructure; DI."
  - id: handlers
    action: "All three PR-comment handlers call the port after the slash-command match and before the model; the dead pr: dialogue branch is removed."
  - id: docs
    action: "pr-comments.md states the per-platform rule; the webhooks pages name the token scopes (GitLab read_api, Azure DevOps Security Read)."

tests:
  - "the handler tests listed in .agentsmith/notes/2026-09-28-89f1-defect-analysis.md, slice a"

done:
  - "an untrusted slash command on any of the three hosts never reaches the model and starts nothing"
  - "a failing trust lookup refuses"
  - "build and all tests green"
