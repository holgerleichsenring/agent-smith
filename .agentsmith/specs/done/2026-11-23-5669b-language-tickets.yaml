# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-5669b
goal: "The ticket list and ticket page speak German when German is chosen, the approval summary included."

applies_to: "dashboard (components/tickets, lib/tickets)"

requires: [2026-11-22-5485a, 2026-11-23-5669a]

