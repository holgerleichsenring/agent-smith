spec: 2026-10-13-8762v
goal: "When an attempt ends with work left in its series and no person's act waiting, agent-smith starts the next attempt itself, inside a series budget, and says once on the ticket why it held."

applies_to: "backend (Server rework worker tail, ticket series read, spawn funnel cause marker, series config)"

