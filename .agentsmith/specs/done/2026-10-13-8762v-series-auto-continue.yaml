done:
  - "With the run caps raised for one chunk (pipeline_cost_cap.per_pipeline code at or above a chunk's cost; orchestrator.max_run_wall_time_seconds at or above eight blocks of series.seconds_per_spec plus the run's prefix (checkout, derivation, review share) and the one block 2026-10-13-8762u reserves for the commit-and-PR tail), a series of 20 specs (the executed prefix plus the tail, counted together) approved in a ticket's conversation runs as consecutive attempts of 8, 8 and 4 without a person starting the second or third, and each automatic attempt's cause reads series by agent-smith; the poller never claims the ticket between attempts."
  - "Under the default run caps, a chunk that ends on its cost cap holds as incomplete and the ticket page says so; one that ends on the wall clock after a done spec continues (unless continue_after_wall_time is false), and without a done spec holds as no-progress."
  - "A comment or approval on the ticket while an attempt runs is served by the next attempt as the person's act, never overtaken by an automatic one."
  - "A series whose chain has spent its budget or its run time stops, and the ticket carries one comment saying why, what was spent and how to go on (a comment or an approval); a second nudge says nothing more."
  - "A pending default marked holds_series stops the next automatic attempt until a person ratifies or overrules it, however long it waited."
  - "A hand-back, a red verify, a cost cap, an operator cancel or delete, or a queue drop ends the series' automatic run; a wall-time cancel after a done spec continues it, and the poller does not claim the ticket first."
  - "A Config Studio save of a negative series budget or wall clock is refused with the field named; a value the run would refuse is never saved."
  - "GET /api/tickets/{project}/{ticketId}/series answers, for a ticket with more than one chunk, spend, run time, both caps and whether the next attempt starts by itself, holds (and why, including a refused launch or a person's close) or the series is complete."
  - "Build green, full suite green, dashboard gen/test/build green."
