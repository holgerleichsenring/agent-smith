done:
  - "Asked for a page's look, the design partner writes a mock and the operator sees its screenshot in the conversation labelled with the spec and version."
  - "When the operator answers with a change, the partner's next mock is the next version of the same spec, and the earlier versions' screenshots stay in the conversation."
  - "The operator can open any version's whole page from the transcript as a downloaded file."
  - "A mock never appears among the operator's uploads, never counts toward the upload cap, and its HTML is never served inline as a page."
  - "A mock the partner may write reads back whole when it revises it."
  - "Deleting the conversation deletes its mocks."
  - "Build green, full suite green, dashboard gen/test/build green."
