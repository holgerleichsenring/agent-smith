spec: 2026-10-13-8762r
goal: "The design partner writes a spec's HTML mock as numbered versions, each rendered in the conversation's browser; the operator sees each version's screenshot, can open its page, and replies."

applies_to: "backend (design-turn tools write_mock and read_mock beside render_reference, a mock store and its one reader over ReferenceFile, the render stager, the dialog view, a mock screenshot route and a sandboxed mock-HTML download route) + the dashboard dialog transcript and spec-dialog types + the design-partner-master skill"

