# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-25-c1bf
goal: "Applying deploy/k8s/ never takes Redis down: the reference Redis uses a password when the Secret has one and starts without one otherwise, with a startup notice."

applies_to: "default (deploy/k8s, apply-k8s-secret.sh, Redis docs)"

requires: [2026-10-25-c5a7e]

facts:
  - claim: "After c5a7e the reference Redis reads redis-password with optional false and refuses to start on an empty value."
    evidence: "deploy/k8s/6-deployment-redis.yaml:23-45"
  - claim: "The secret script composed redis-url with an empty password when REDIS_PASSWORD was unset."
    evidence: "deploy/apply-k8s-secret.sh:104-107"
  - claim: "A Redis default user without a password is an advisory startup finding, not a block."
    evidence: "src/backend/AgentSmith.Server/Services/Startup/SandboxBusCredentialProbe.cs:28,50-52"

scope:
  in: >
    6-deployment-redis.yaml starts redis-server with --requirepass only when REDIS_PASSWORD is set, reads the key
    with optional true, and its probes authenticate only when a password is set. The secret template keeps
    redis-url redis:6379 and an empty optional redis-password. apply-k8s-secret.sh adds the password to the URL
    only when one is given. Kubernetes docs describe the password as an opt-in step.
  out: >
    The compose example for new installs keeps requiring a password. Code changes.

steps:
  - id: build
    action: "Edit the manifest, template, script and docs; run the deploy manifest tests."

tests:
  - "Deploy manifest tests (unchanged, still green)"

done:
  - "kubectl apply -f deploy/k8s/ with a Secret that has no redis-password starts Redis as before."
  - "Build green, full suite green, dashboard gen/test/build green."
