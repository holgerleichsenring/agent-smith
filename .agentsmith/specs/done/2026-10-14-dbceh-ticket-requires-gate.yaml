    RequirementsMetStart are registered as singletons in AddReworkNudgeWorker (28 -> 29). The handler's summary records
    the reversal of 2026-09-22-766b's removal in one sentence.
  out: >
    Storing the requirement rows and StartsWhenMet at filing, filing held tickets untagged and unmoved, and starting the
    tickets whose requirements are already landed at filing — 2026-10-14-dbcel. The landing of a by-hand mark, which wakes
    dependents through the same recorder — 2026-10-14-dbcei. "Waits for #X" and "needs a start" on the ticket page and
    the blocked bucket — 2026-10-14-dbcen. A ticket comment telling the person why a status move or a poll was refused —
    nobody: the webhook dispatcher discards the claim result (WebhookSpawnDispatcher.cs:59-60) and the ticket page shows
    what it waits for (2026-10-14-dbcen); default, pending operator ratification. Quieter logging of the repeated poll
    refusal and its Rejected TicketTriggered event — nobody: contract decision 11 accepts the churn, which this spec
    cuts to one indexed read by checking before the reservation. A ticket whose filing stays incomplete — nobody: the
    filing report of 2026-10-14-dbcel names it "do not trigger it; close it", and the gate refuses it at every door,
    a start by name included, with "This ticket's filing did not finish; close it and approve the list again."; a
    person closes it on the tracker. Gating a non-code pipeline — nobody: a requirement orders
    merged code, and a scan or a design conversation on the ticket builds nothing on it. A requirement on a ticket of
    another tracker — nobody: contract decision 5. Restoring PredecessorGate or its labels — nobody: contract §0, its job
    is redone here on a stored edge.

decisions:
  - key: "REVERSES 2026-09-22-766b's REMOVAL, DIFFERENTLY. a72a's PredecessorGate held a child in the spawn funnel until its predecessor LEFT trigger_statuses, read from labels anyone can edit; it could only hold, never refuse (SpawnPipelineRunsUseCase.cs:27-32). This gate reads a stored edge (2026-10-14-dbcef), counts a requirement met only when LANDED (2026-10-14-dbceg), and sits in ClaimRefusal, so it REFUSES at every door and the funnel refuses rather than queues — a held ticket never becomes the capacity queue's head."
  - key: "STRICT, NO START-BY-NAME BYPASS (contract decision 7, §5 default 10, §8 answer 2, pending operator ratification). The operator's rule is 'that one must be merged first'; a start by name that slipped past would build on code that is not there. The deliberate override is 'Mark done by hand' (2026-10-14-dbcei), which lands the required ticket and so lifts the gate everywhere at once."
  - key: "CODE PIPELINE ONLY, as BoundaryStopGate. A requirement is about merged code; another pipeline on the ticket is not held."
  - key: "NO ROWS, NO CHANGE. A ticket without requirement rows costs one indexed read and is never refused, so behaviour without a graph is unchanged (contract decision 7)."
  - key: "ONE READ FOR THE GATE AND THE WAKE. UnmetTicketRequirements is the single answer to 'is this ticket held', asked by the gate and again by RequirementsMetStart under the dependent's lock, so the wake never starts what the gate would refuse."
  - key: "THE WAKE RUNS ONLY ON A WON INSERT (contract decision 12), BEFORE ANY REDIS CALL. The unique landing row means one replica decides; DependentsWake enqueues one RequirementsMet nudge per dependent, the nudge upsert merges duplicates, the per-ticket lock serves it on one replica, and the claim lock plus the lease insert guard the claim. Once the row exists every later TryRecordAsync answers false, so a wake skipped by a Redis throw (RedisSystemEventPublisher.cs:21-37) would be lost for good; it therefore precedes the publishes."
  - key: "A LOST WAKE IS RECOVERED, NOT TRUSTED. A crash between the insert and the last enqueue, or one failed enqueue of N, leaves held tickets untagged and unmoved with no poller in webhook mode (PollerFactory.cs:32). The five-minute re-read (2026-10-14-dbceg) therefore re-derives the wake from the two tables: a dependent all of whose requirements landed in the last day, filed completely, StartsWhenMet, never attempted, not queued and not leased gets a RequirementsMet nudge. A duplicate of a wake in flight merges into the ticket's one nudge row or ends AlreadyClaimed; the 24-hour window and the 50 cap bound the retries of a ticket that cannot start (contract section 5 default 28, pending operator ratification)."
  - key: "AN INCOMPLETE FILING IS NEVER WOKEN OR CLAIMED (contract decision 23, section 5 default 31: completion as 2026-10-14-dbcel defines it, the ticket-text approval record, written last). The gate checks completion only for a ticket WITH requirement rows: a root ticket without rows cannot be told from any ordinary ticket, and l never starts one whose record failed. Filing stores a ticket's edges right after creating it, before its material record, so that nothing can start it ungated; a ticket whose filing then failed has edges but not everything its run needs. RequirementsMetStart and the recovery both skip it; see the assumption on 2026-10-14-dbcel for what complete means."
  - key: "THE REQUIRES CHECK RUNS BEFORE THE RESERVATION (reviewer cut; contract decision 11's cost). Checked only inside the claim, a held ticket on a tracker whose created status triggers would cost a footprint, a capacity row, possibly a held-sandbox eviction and a quota probe every poll cycle (SpawnPipelineRunsUseCase.cs:65-77,107-125). The gate is asked once more inside ClaimRefusal, which every other door goes through; the double read for an admitted ticket is one indexed read."
  - key: "NO ROWS AND ALL LANDED ARE DIFFERENT ANSWERS. OfAsync returns whether rows exist beside the unmet edges; with the unmet list alone, a ticket whose every requirement landed reads like a ticket without rows, and the gate would have to either skip the completeness check (an incomplete filing claimed) or ask every ordinary ticket for an approval record it never had (every discovered ticket refused). A tuple, so no type is minted."
  - key: "THE WAKE NEVER STARTS A TICKET A PERSON FINISHED OR CLOSED. A dependent marked done by hand (2026-10-14-dbcei, offered on every waits-for entry by 2026-10-14-dbcen) has its own landing row, and its requirements' later landing must not rebuild what the person declared done; a dependent the tracker counts closed was closed by a person, since agent-smith never closes a held, never-run ticket (TicketClosure.cs:10-16), and StartExistingAsync would move it out of Closed or Done on Azure DevOps and Jira (FiledWorkMove.cs:68-84). Both are skipped by RequirementsMetStart, the landing also by the recovery's query; closing the dependents stays the remedy for a mistaken by-hand mark (contract decision 15)."
  - key: "THE RECOVERY WINDOW IS THE ROW'S WRITE TIME, NEWEST FIRST. LandedAt is the host's merge time, so a landing written late by 2026-10-14-dbceg's recovery or backfill, or one a ticket: requirement found already merged, would fall outside a window on LandedAt exactly when its wake is most likely lost. The cap counts dependents, not landings, in one join. REJECTED: oldest landing first, as the reviewer proposed: dependents that already ran stay in the window for 24 hours and, oldest first, fifty of them would hold every slot and starve a wake lost this cycle; newest first, a lost wake is retried in the first cycle after it is lost unless more than fifty dependents were freed since."
  - key: "OperatorStart ASKS THE GATE FIRST. An approval in a held ticket's own conversation would otherwise tag and move it and say 'its first attempt starts' while the gate refuses the claim, silently in webhook mode (WebhookSpawnDispatcher.cs:59-60). It now says what the ticket waits for and moves nothing; the wake starts it later. It does not check the filing: the approval it answers is recorded first (TicketContinuationAct.cs:39-44), which completes an incomplete filing, so that branch could never run."
  - key: "A RequirementsMet NUDGE MERGED WITH A KEYWORD COMMENT ON A TICKET WITH AN ATTEMPT answers 'not a rework' instead of the comment's fallback start (ReworkNudgeHandler.cs:106-108, the merge keeps the higher origin). Accepted: a dependent has an attempt only when it ran before its edges existed, a filing race."
  - key: "RequirementsMet = 6 RANKS ABOVE EVERY ORIGIN. A merge keeps the higher origin (ReworkNudgeRepository.cs:36,58-68), so a wake merged with a person's act on a never-run ticket is still served as a wake — which starts it, the act's intent. With an attempt the origin is read only at the keyword-comment fallback (ReworkNudgeHandler.cs:106), so a RequirementsMet nudge there takes the existing path."
  - key: "THE APPROVER'S runs.control DECIDES THE AUTOMATIC START (contract §5 default 11, pending operator ratification). StartsWhenMet records it at filing; without it the ticket stays held and a person starts it by name, which the gate then admits."
  - key: "START, THEN CLAIM NOW. StartExistingAsync answers Started without a move when the ticket already sits in a trigger status (FiledWorkMove.cs:62-64,73-74); in webhook mode nothing then delivers an event and no poller runs (PollerFactory.cs:32), so the ticket would wait for ever. RequirementsMetStart therefore follows a Started answer with ReworkFallbackSpawn, the poller's own route; in polling mode a racing poll ends as AlreadyClaimed at the claim lock or the lease. No name is minted for this."
  - key: "FiledWorkMove IS SCOPED, RequirementsMetStart IS A SINGLETON. It resolves FiledWorkMove in a scope per start, as the handler's other collaborators are singletons."

steps:
  - id: contract
    action: "ClaimRejectionReason.TicketRequiresUnmet (23 -> at most 27) and ReworkNudgeOrigin.RequirementsMet = 6 (20 -> at most 24), each with a dated summary."
  - id: unmet
    action: "UnmetTicketRequirements.OfAsync -> (HasRequirements, Unmet) over the two stores and FiledCompletelyAsync over ISpecApprovalStore, documented as asked only with rows (at most 55 lines): the requirement read first, the landing read only when rows exist, the unmet edges in the stored order."
  - id: gate
    action: "RequiresUnmetGate with RefusalAsync (no rows -> null; rows and filing incomplete -> the incomplete sentence; unmet -> Sentence) and the static Sentence(unmet) naming '#n' for a numeric id and the id as written otherwise (at most 45 lines); ClaimRefusal takes UnmetTicketRequirements and asks it third (36 -> at most 40); its summary names the third gate."
  - id: doors
    action: "TicketClaimService (68 -> 69), SpawnLeaseDeferral (44 -> 45) and SpawnPipelineRunsUseCase take and pass UnmetTicketRequirements, and the funnel asks RequiresUnmetGate before the footprint and ReserveAsync (144 -> at most 148 of 150); DispatcherExtensions registers it as a singleton (87 -> 88); the twelve constructing test files, PreviousAttemptBoundaryTests.cs:64 and SpawnLeaseDeferralTests.cs:25 pass one over empty stores."
  - id: wake
    action: "DependentsWake.WakeAsync and RecoverAsync (at most 100 lines); TicketLandingRecorder takes it and calls WakeAsync after a won insert, before the publishes (at most +2 lines); ITicketLandingStore.DependentsOfLandingsSinceAsync and its one-join repository query on the landing's CreatedAt (at most +14 lines); PrRecordReReadHostedService resolves DependentsWake from IServiceProvider and calls RecoverAsync each cycle (at most +3 lines); registered in AddReworkNudgeWorker; PrReviewRefreshHarness.cs:51-53, which builds the refresh and from 2026-10-14-dbceg the recorder with new, passes a DependentsWake over the harness store and nudges."
  - id: start
    action: "RequirementsMetStart.StartAsync (at most 95 lines): requirements, own landing, unmet, filing complete, StartsWhenMet, the ticket's closed state, StartExistingAsync in a scope, ReworkFallbackSpawn on Started, logging on NotStarted; registered in AddReworkNudgeWorker (28 -> 29); OperatorStart's never-worked arm asks UnmetTicketRequirements.OfAsync only (45 -> at most 50) and Continuations.cs:39 passes it."
  - id: handler
    action: "ReworkNudgeHandler takes RequirementsMetStart and routes the no-attempt line by origin (116 -> at most 119); one summary sentence records the reversal of 766b's removal; ReworkHandlers.cs:11-16 gains the optional parameter."
  - id: tests
    action: "Red first, then green, for every test below; the composition test's class carries [Trait(\"TestProcess\", \"env-3\")] with EnvVarCollection; run the Claim, Spawning, Rework, Continuation, Sweep and ChatLaunch classes touched, ServerDiLifetimeTests and NonDiCtorRuleTests with --filter."

