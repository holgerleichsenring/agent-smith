done:
  - "A ticket that requires another ticket is not started by the poller, a webhook, the capacity queue, a start by name in chat or an approval in its own conversation until the required ticket has landed; the chat answer names the tickets it waits for."
  - "A held ticket is never placed in the capacity queue, and a poll that meets it reserves no capacity and probes no sandbox host."
  - "When the last ticket it requires lands, a held ticket whose approver could start runs is tagged or moved and claimed without anyone acting, on GitHub, GitLab, Azure DevOps and Jira, in polling and in webhook mode; with several servers it starts once; if a server fails between the landing and the wake, it still starts within about five minutes; while Redis is down nothing starts (the worker's lock, the claim lock and the re-read's lease are Redis), and it starts once Redis answers. A held ticket a person marked done by hand or closed is never started or moved by the wake."
  - "A held ticket whose approver could not start runs stays held by the wake after its requirements land: nothing moves, tags or claims it on its behalf, and it can be started by name; a ticket whose status or stamp already routes it is claimed by the poller or a webhook once its requirements land, as any filed ticket is today."
  - "A graph ticket whose filing did not finish is never started by the wake, a trigger or a start by name: the refusal says to close it and approve the list again; an approval in its own conversation records a set and so completes it."
  - "A ticket with no requirements starts exactly as before."
  - "Build green, full suite green, dashboard gen/test/build green."
