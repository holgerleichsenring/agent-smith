    reasons (ClaimRejectionReason.cs:3-6), this refusal lifts once the required tickets land (23 -> at most 27); ReworkNudgeOrigin.RequirementsMet
    = 6 with a summary saying it is served only for a ticket without an attempt (20 -> at most 24). ONE READ:
    UnmetTicketRequirements (Application/Services/Claim, public sealed, at most 50 lines) over ITicketRequirementStore and
    ITicketLandingStore: OfAsync(tracker, ticketKey, ct) -> (bool HasRequirements, IReadOnlyList<TicketRequirementEdge>
    Unmet), Unmet being the edges whose RequiredTicketKey has no landing of either kind; with no requirement rows it
    answers (false, []) after the one requirement read and reads no landing, so "no rows" and "every row landed" are
    told apart; and FiledCompletelyAsync(tracker, ticketKey, ct) -> whether the ticket's filing finished: its
    ticket-text approval record is stored (ISpecApprovalStore.GetAsync is not null; 2026-10-14-dbcel writes that record
    last, after the ticket and its edges; contract section 5 default 31), documented as asked only for a ticket with
    rows, so an ordinary ticket without an approval record is never asked. GATE:
    RequiresUnmetGate (public sealed, at most 45 lines): RefusalAsync(request, config, ct) returns null for any
    pipeline but code or a project config does not name (the claim's pre-check refuses that one); otherwise tracker =
    config.Projects[request.ProjectName].Tracker.Name and key =
    TicketKey.For(tracker type lowercased, request.TicketId.Value); without rows it returns null; a ticket WITH
    requirement rows whose filing is not complete (every row landed or not) refuses with
    ClaimResult.Rejected(TicketRequiresUnmet, "This ticket's filing did not finish; close it and approve the list
    again.") — so neither a start by name nor a trigger works an incomplete graph ticket without its material — and a
    non-empty unmet list refuses with ClaimResult.Rejected(TicketRequiresUnmet, Sentence(unmet)), Sentence being "This ticket waits for #A, #B to be merged
    first; merge them, or mark them done by hand." over the required tickets' own ids, each named "#n" when the id
    is numeric and as written otherwise ("DPG-12" on Jira), the rule FiledTicketKey.cs:34-35 applies inside the server
    and dbcek uses, restated here because that class is internal to the server. STRICT: no AdmitsStart, so a start
    by name and a series auto-start are refused too (contract §5 default 10, pending operator ratification). ClaimRefusal
    takes UnmetTicketRequirements and asks the gate third, after BoundaryStopGate (36 -> at most 40); TicketClaimService
    (68 -> 69), SpawnLeaseDeferral (44 -> 45) and SpawnPipelineRunsUseCase (144 -> 145 of its 150 baseline) pass it on;
    UnmetTicketRequirements is registered as a singleton beside the claim service in DispatcherExtensions (87 -> 88); the
    twelve test files that construct the claim service or the funnel, PreviousAttemptBoundaryTests.cs:64 (ClaimRefusal)
    and SpawnLeaseDeferralTests.cs:25 (SpawnLeaseDeferral) pass one over empty stores. BEFORE THE RESERVATION:
    SpawnPipelineRunsUseCase.ExecuteAsync asks RequiresUnmetGate right after ValidateForSpawn, over the probe request
    SpawnRequestBuilder already builds for the deferral, and returns `new SpawnResult([refusal])` before the footprint,
    the queue peek and ReserveAsync (144 -> at most 148 of its 150 baseline), so a held ticket costs one indexed read per
    poll, not a footprint, a capacity row, a sandbox probe or an eviction. The capacity pump, the poller, every webhook
    and a chat start reach the gate through those doors; the chat shows the sentence through ChatTicketRunLauncher.cs:57,
