assumptions:
  - "2026-10-14-dbcef lands ITicketRequirementStore (RequiredOfAsync, DependentsOfAsync) and TicketRequirementEdge (Tracker, TicketKey, TicketId, Project, RequiredTicketKey, RequiredTicketId, StartsWhenMet, FiledAt, FiledInConversation) as a server singleton."
  - "2026-10-14-dbceg lands ITicketLandingStore.LandedAsync(tracker, keys) -> TicketLandingFact list; TicketLandingRecorder whose private RecordAsync, only when TryRecordAsync inserted, logs and then publishes (event, page nudge) each fire-and-warn, leaving the slot between insert and publishes for this spec's wake; and PrRecordReReadHostedService with ReReadOnceAsync reading the live configuration every five minutes; registered in AddReworkNudgeWorker (28 lines)."
  - "2026-10-14-dbcel (as rewritten for the ticket-text graph) files each ticket as create, then edges, then its ticket-text approval record (GraphTicketApproval, saved through ApprovalCitations into the ApprovedSeries row); the record is written LAST and marks the filing COMPLETE. A ticket with edges and no record is an incomplete filing, which l reports 'do not trigger it; close it' and never tags or moves."

scope:
