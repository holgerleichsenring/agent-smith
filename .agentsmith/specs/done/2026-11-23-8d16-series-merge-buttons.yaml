# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-8d16
goal: "The series page's Merge buttons all run the merge, look like buttons, sit beside an Open pull request button, mark the merges others start on, and a draft pull request is taken out of draft."

applies_to: "default (series page, PR record read, merge-green run)"

requires: [2026-11-23-31dce, 2026-11-23-849e, 2026-11-23-31dcg, 2026-11-23-c785]

facts:
  - claim: "The Merge act in Your next step is a Link to ?section=next, so clicking it on the Merge next section changes nothing."
    evidence: "src/dashboard/src/components/series/page/seriesStepLines.ts:35; src/dashboard/src/components/series/page/SeriesYourStep.tsx:26"
  - claim: "Every .btn inside the section pane is restyled as underlined text, the merge rows' buttons included."
    evidence: "src/dashboard/src/styles/ticket-thread.css:223"
  - claim: "A starts_on_merge hold counts the merges up to the last one it needs in the merge order; the series detail's merge steps carry no mark of which merges a waiting ticket needs."
    evidence: "src/backend/AgentSmith.Application/Services/Holds/TicketSeriesMergeHold.cs:33; src/backend/AgentSmith.Application/Services/Series/SeriesRunMergeStep.cs:5"
  - claim: "Your next step says the vague 'merges are needed before … can start' from the merge hold's tail."
    evidence: "src/dashboard/src/components/series/page/seriesStepLines.ts:33; src/dashboard/src/lib/i18n/messages.ts:1028"
  - claim: "No host read records whether a pull request is a draft; the merge-green run approves and completes without taking it out of draft."
    evidence: "src/backend/AgentSmith.Contracts/Reviews/PrReviewState.cs:10; src/backend/AgentSmith.Infrastructure/Services/Providers/Source/AzureReposVoteDecisions.cs:32; src/backend/AgentSmith.Application/Services/Handlers/PullRequestMergeSequence.cs:52"
  - claim: "A green run takes its draft out only through one host call whose failure is logged and forgotten; PR 9935 stayed a draft after a green run."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CommitAndPRHandler.cs:361; observed: operator, 2026-11-23, prod PR 9935"
  - claim: "No server file may join the files that write to a tracker or a repository."
    evidence: "tests/AgentSmith.Tests/Architecture/ServerWritesRatchetTests.cs:16"
  - claim: "The series bar says '1 question for you' while the record's relayed question has no answer, which only the next master beat writes, even after the ticket's question was answered on its page."
    evidence: "src/backend/AgentSmith.Server/Services/Series/SeriesRunQuestion.cs:8; src/backend/AgentSmith.Application/Services/Series/SeriesQuestions.cs:21; src/dashboard/src/components/series/page/SeriesSectionBar.tsx:34"
  - claim: "A merge hold's tag in Your move reads 'needs merges'."
    evidence: "src/dashboard/src/lib/i18n/messages.ts:1118"

scope:
  in: >-
    useSeriesMerge, one merge act per page shared by the Merge next rows and Your next step (same post, outcome, refusal,
    reload; the step's Merge enabled exactly when the row's is, hidden without runs.control). series.css draws the acts as
    buttons (.sr-acts): the merge now in the accent, the rest visibly disabled; ticket-thread.css untouched. An 'Open pull
    request #N' button per open pull request on every row and the next-step merge line. SeriesRunMergeStep.NeededBy from the
    tickets' starts_on_merge holds through TicketSeriesMergeHold.Needed, the rule the hold's merge count reads: rows carry a
    person-coloured marker and 'Needed so #… can start'; Your next step counts the marked merges (a needed merge with no pull
    request open is in no order and only the hold counts it). PrReviewState.IsDraft from the Azure, GitHub and GitLab state
    reads into PrReviewRecord.IsDraft (three migrations), the record view and the series pull request ('Draft' on the row).
    PullRequestDraftStep: a person's merge takes a pull request the host reads as a draft out of draft before approving and
    completing; a host that keeps it a draft refuses. SeriesRunQuestion reads the holds (list and page). hold.tag.merge says
    'merge'.
  out: >-
    Taking a green run's leftover draft out of draft from the PR record refresh: the server may not write to a repository
    (ServerWritesRatchetTests, CLAUDE.md 'everything is a pipeline'), so it waits for the operator's choice of a pipeline step;
    a person's Merge lifts the draft meanwhile. A new background job; the ticket page's pane rule; the merge order itself.

tests:
  - "TicketSeriesMergeHoldNeededTests: Needed marks every step up to the last needed one; StartsOnMerge counts the marked steps plus the needs without a step."
  - "SeriesRunNeededByTests: NeededBy carries the waiting tickets' keys; a relayed question waits only while its ticket's hold is a question case."
  - "CompletePullRequestsHandlerTests: an asked merge takes a draft out of draft before approving; one the host keeps refuses; a non-draft is left alone; the CI merge never marks."
  - "PrRecordDraftTests and PrReviewStateReaderTests: the draft flag is read from each host and recorded, nothing written."
  - "Dashboard SeriesMergeButtons: every button labelled Merge posts the merge, none navigates; one merge disables the other; Your next step's Merge follows the row; Open pull request opens pr.url in a new tab; needed rows marked; Draft shows."

done:
  - "Build, the full suite and the dashboard tests green; the spec gate passed."
