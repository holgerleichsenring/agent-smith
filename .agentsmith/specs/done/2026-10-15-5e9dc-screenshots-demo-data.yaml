# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-15-5e9dc
goal: "Docs screenshots come from a committed demo seeder and a headless screenshot script, so every docs surface has a current picture that can be retaken."

applies_to: "tools (a demo seeder and a screenshot script) and docs (docs/assets/screenshots, the pages that embed them)"

requires: ["2026-10-15-5e9db"]

facts:
  - claim: "Every screenshot predates 2026-09-28; nine show UI that changed, five are referenced by no page, and the ticket list, ticket page, Work it out, Spec review and Series settings, Design sources and the connection test have none."
    evidence: ".agentsmith/notes/2026-10-15-5e9d-doc-delta.md"
  - claim: "The last screenshot rig was throwaway: a seeder and configs in a session scratchpad, now gone; Run children are separate DbSets and run ids must match RunIdGenerator.IsValid."
    evidence: "observed: 2026-07-17 session notes (p0346 screenshot rig)"

assumptions:
  - "Adopted 2026-11-18 by 2026-11-18-5fd3a without the Azure DevOps organisation part: no external access; a localhost tracker stub answers the ticket reads."

scope:
  in: >
    A demo seeder under tools/demo-seed that writes one anonymised story (acme, shop, Sam Sample) into a scratch SQLite
    database through the server's own services: a Work it out conversation with three drafted tickets and their specs,
    a filed ticket with a green run, a CI fix run and a merged pull request, a series run with its status in the
    conversation, an admin assistant conversation with a drafted config change, a stored secret; specs on local git
    branches. A script that starts a tracker stub, the server and the dashboard on free ports and takes the
    screenshots headless at 2x in dark mode.
  out: >
    The operator's running deployment and its data, and any external tracker or organisation. The website.

decisions:
  - key: "THE RIG IS COMMITTED THIS TIME. A scratchpad rig was lost within a session; a committed seeder makes the next sweep a rerun."

steps:
  - id: seeder
    action: "tools/demo-seed: one story as above, idempotent against an empty database."
  - id: shoot
    action: "tools/screenshots: tracker stub, server + dashboard on free ports, headless Chrome at 2x dark, one image per docs surface."
  - id: embed
    action: "Replace stale images, delete unreferenced ones, embed the new ones (pages in 2026-11-18-5fd3a)."

tests:
  - "the seeder runs twice against one database without error and without duplicating rows"

done:
  - "Every docs surface listed in the audit has a current screenshot, and no image in docs/assets/screenshots is unreferenced."
  - "Running the two tools again reproduces the set."
