# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-14-dbcef
goal: "A database table records which filed ticket must wait for which other ticket to be merged, and every newly approved series records the project it was filed into."

applies_to: "backend (the TicketRequirements table, its entity, configuration, port and repository; SpecApprovalRecord.Project and the projected ApprovedSeries.Project column; one migration in each migrations set; the data-archive counts)"

requires: []

