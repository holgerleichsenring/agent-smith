  - "TicketRequirementStore_AddThenRequiredOf_ReturnsThatTicketsEdgesOnly"
  - "TicketRequirementStore_DependentsOf_ReturnsEveryTicketRequiringTheKey"
  - "TicketRequirementStore_ByProject_ReturnsOnlyThatProjectsEdges"
  - "TicketRequirementStore_SameEdgeTwice_StoresOneRowAndReportsNoneAdded"
  - "TicketRequirementStore_TwoRacingWritersWithOverlappingUnequalBatches_StoreEveryEdgeOfBothOnce (RacingUnitOfWork; the race fires once)"
  - "TicketRequirementStore_SecondUniqueViolation_Throws (RacingUnitOfWork; the race fires before both saves)"
  - "TicketRequirementStore_BatchWithMixedStartsWhenMet_IsRefused"
  - "TicketRequirementStore_FiledAt_IsTheRowsInsertTime"
  - "TicketRequirementStore_EdgeRequiringItsOwnTicket_IsRefused"
  - "TicketRequirementStore_BatchNamingTwoDependents_IsRefused"
  - "TicketRequirementStore_SameTicketKeyOnTwoTrackerConnections_AreTwoTickets"
  - "TicketRequirementStore_DeletingEveryRunOfBothTickets_LeavesTheEdge"
  - "TicketRequirementStore_StartsWhenMet_RoundTrips"
  - "ApprovedSeries_NewApproval_ProjectsTheFilingProject"
  - "ApprovedSeries_RowWrittenBeforeThisSpec_ReadsAnEmptyProject"
  - "SpecApprovalJson_RoundTrip_KeepsTheProject"
  - "ApprovedSpecSetRecorder_Record_CarriesTheProjectName"
  - "TicketRequirementStore_ServerComposition_ResolvesTheRelationalSingleton (integration, ServerCompositionBuilder; TestProcess env-1 + EnvVarCollection)"
  - "DataArchive round-trip, schema and refusal tests at fifty tables and 102 seeded rows (existing tests, counts updated)"

done:
  - "A requirement between two tickets can be stored once and read back by the dependent ticket, by the required ticket and by project, and it is still there after every run of both tickets is deleted."
  - "Every series approved after this spec shows the project it was filed into on its ApprovedSeries row; a series approved earlier shows an empty project and still reads as before."
  - "`agentsmith database migrate` creates TicketRequirements and ApprovedSeries.Project on SQLite, PostgreSQL, MySQL and SQL Server, and a data archive export then import carries the new table."
  - "Build green, full suite green, dashboard gen/test/build green."
