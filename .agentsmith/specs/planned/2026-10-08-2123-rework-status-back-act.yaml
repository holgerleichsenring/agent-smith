# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-2123
goal: "A person moving a finished ticket back into a trigger status is a rework act read from the tracker's history and served by the nudge worker, appending phases when feedback came since."

applies_to: "backend (status webhooks, poller and dispatcher hand-off, ticket history, rework act, revision cause)"

requires: [2026-10-08-f114, 2026-10-08-0781]

facts:
  - claim: "Status changes start runs by claim today: Jira handles issue_updated only for the assignee; GitHub only labeled; GitLab update or open, not reopen; Azure DevOps workitem.updated dispatches."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/JiraAssigneeWebhookHandler.cs:24-38, src/backend/AgentSmith.Server/Services/Webhooks/GitHubIssueWebhookHandler.cs:33-36, src/backend/AgentSmith.Server/Services/Webhooks/GitLabIssueWebhookHandler.cs:33-36, src/backend/AgentSmith.Server/Services/Webhooks/AzureDevOpsWorkItemWebhookHandler.cs:21-22,47-55"
  - claim: "The dispatcher and the poller both spawn a match after the status check; TrackerPoller is 208 of 210."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookSpawnDispatcher.cs:43-60, src/backend/AgentSmith.Application/Services/Polling/TrackerPoller.cs:134-169, tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:43"
  - claim: "The cause order is demand, PR rework, edit, comment, then sha and retrigger; IsAppend is the empty-tail executed shape; SpecRevisionCause is 106 lines."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:64-78, src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-57"
  - claim: "Rework carries the approval, gets the append paragraph and a notice line; acts are read in FetchTicketHandler (140 of 189); ReworkAct has Ticket and PullRequest channels."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:69, src/backend/AgentSmith.Application/Services/Prompts/PreviousCutPromptSection.cs:29-31,62, src/backend/AgentSmith.Application/Services/Specs/SpecRecutNotice.cs:26-30, src/backend/AgentSmith.Application/Services/Handlers/FetchTicketHandler.cs:82-86, src/backend/AgentSmith.Contracts/Runs/ReworkChannel.cs:5-9"
  - claim: "JiraEndpoints templates are listed in JiraEndpointsMap.Paths, which rejects unknown keys; /myself is hard-coded in the provider and the draft check."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/JiraEndpoints.cs:15-28, src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/Studio/JiraEndpointsMap.cs:16-18,40-43, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/JiraTicketProvider.cs:62-63, src/backend/AgentSmith.Infrastructure/Services/Providers/DraftChecks/JiraTrackerDraftCheck.cs:25"
  - claim: "Jira's changelog pages by startAt/maxResults/total with author (accountType) and items; Azure DevOps updates page by $top/$skip with revisedBy and field changes."
    evidence: "observed: 2026-10-08, https://dac-static.atlassian.com/cloud/jira/platform/swagger-v3.v3.json (GET /rest/api/3/issue/{issueIdOrKey}/changelog, PageBeanChangelog, UserDetails), https://learn.microsoft.com/en-us/rest/api/azure/devops/wit/updates/list?view=azure-devops-rest-7.1"
  - claim: "GitHub lists issue events (reopened, actor, created_at) with Link rel=last when computable; GitLab state events use 'reopened' and send x-total-pages."
    evidence: "observed: 2026-10-08, https://docs.github.com/en/rest/issues/events?apiVersion=2022-11-28, https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api?apiVersion=2022-11-28, https://gitlab.com/gitlab-org/gitlab/-/blob/master/app/models/resource_state_event.rb, https://docs.gitlab.com/api/rest/#pagination-response-headers"

assumptions:
  - claim: "An Azure DevOps update's time is its System.ChangedDate; connectionData names the token's identity; GitHub events mark app actors."
    check: "Read a test work item's updates, connectionData and a bot-reopened issue's events before building."

scope:
  in: >
    One path: a ticket whose newest code attempt finished is handed to the worker as a nudge (the match's
    pipeline and kind) by the dispatcher and by the poller (its spawn moves to TrackerPollDispatch); the
    worker serves an act or, with none, spawns the match as before. New webhook entries enqueue: Jira
    issue_updated with a status item, GitHub issues.reopened, GitLab reopen. ITicketStatusHistory, last page
    first (Jira total; Cloud values+total or Data Center changelog.histories by shape; GitHub rel=last else
    next; GitLab x-total-pages; Azure DevOps all pages of $top=200): a change into a trigger status after
    the cutoff, not by the token's identity (Myself template, GET /user, connectionData) nor an app or bot.
    GitHub and GitLab: reopen only, when open or opened triggers. Empty trigger_statuses: none.
    ReworkChannel.Status, spoken on the ticket. StatusBackFeedback: a person's comment, a review note or a
    ticket edit after the cutoff. SpecRevisionCause.StatusBack after PR rework, only with feedback and in
    the IsAppend shape; otherwise the existing order. It amends and carries approval as Rework; its
    paragraph names conversation, current text and review section.
  out: "A token owned by an operator hides that operator's own moves; documented."

decisions:
  - key: "THE WORKER IS THE ONLY STARTER for a finished ticket: a claim of it would be a second path."
  - key: "THE MOVE IS READ, NOT INFERRED; our account, apps and bots are not people."
  - key: "APPEND ONLY, WITH FEEDBACK: a move back after a failed attempt or with nothing new keeps today's cause."
  - key: "A LABEL IS NOT A MOVE on GitHub or GitLab."

steps:
  - id: handoff
    action: "Add the finished-ticket hand-off to WebhookSpawnDispatcher and TrackerPollDispatch; the worker's spawn fallback."
  - id: webhooks
    action: "Add JiraStatusWebhookHandler; reopened in the GitHub and GitLab issue handlers; all enqueue."
  - id: history
    action: "Add ITicketStatusHistory and one collaborator per tracker; changelog and myself in JiraEndpoints and JiraEndpointsMap.Paths; the draft check uses Myself."
  - id: cause
    action: "Add ReworkChannel.Status, StatusBackFeedback, SpecRevisionCause.StatusBack in For, SpecAmendmentRule, SpecSourceResolver, PreviousCutPromptSection, SpecRecutNotice; IReworkPendingActs reads it."

tests:
  - "Dispatcher_FinishedTicket_EnqueuesInsteadOfClaim"
  - "Worker_FinishedTicketNoAct_SpawnsMatch"
  - "JiraHistory_CloudAndDataCenterShapes_Read"
  - "JiraDataCenter_OwnMove_Ignored"
  - "GitHubHistory_AppReopen_Ignored"
  - "GitLabHistory_Reopened_IsMove"
  - "History_EmptyTriggerStatuses_None"
  - "Cause_CommentThenMove_IsStatusBack"
  - "Cause_MoveWithoutFeedback_KeepsExistingOrder"
  - "Decide_StatusBackWithUnexecutedTail_ContinuesSet"

done:
  - "In both modes, a person's move back after a fully executed attempt, with a comment, review note or edit since, runs appended phases via the worker; our move, a Retry and a move without feedback keep today's cause; full suite green."
