# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-f5f7f
goal: "A spec write lands in all its repositories or in none; a series still found out of step is handed back as its own case, naming the repositories and the two real ways out."

applies_to: "backend (spec publish, series reader, hand-back, rework park)"

requires: [2026-10-12-f5f7d]

facts:
  - claim: "A failed write is logged and the run continues from the in-memory set; the sandbox commits and pushes with git."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetPublisher.cs:23-53, src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:42-101"
  - claim: "The hand-back cases are Contradiction, NotImplementable, Refused, Question and SpecificationMissingFromBranch; the comment's default arm posts the contradiction text; the repeat guard ends a second unanswered contradiction as a failed step; the park status is resolved per case."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecHandback.cs:50-86, src/backend/AgentSmith.Application/Services/Specs/SpecHandbackComment.cs:57-74, src/backend/AgentSmith.Application/Services/Specs/SpecHandbackRepeat.cs:33-44, src/backend/AgentSmith.Application/Services/Handlers/SpecHandbackHandler.cs:55-79, src/backend/AgentSmith.Application/Services/Specs/SpecParkStatusResolver.cs:22-34"
  - claim: "3a36a lets a PR command rework a ticket parked by a hand-back."
    evidence: "src/backend/AgentSmith.Server/Services/Rework/ReworkParkCheck.cs:20-40"
  - claim: "An Unreadable read on an unfiled ticket falls through to a fresh derivation; a resume skips the input causes; executed work reaches the model as previous.ExecutedHead built from read phases."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:72-84, src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:72-82, src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:77, src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:57-58"
  - claim: "Hand-back progress is recorded only when a TicketSeries row exists; the dashboard lists hand-backs by case."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/SpecHandbackHandler.cs:77, src/backend/AgentSmith.Server/Services/SpecDialog/FiledWorkHandbacks.cs:38-45"

assumptions: []

scope:
  in: "All-or-none publish (revert-push what this write already pushed when another member's push fails; pointer shas follow); a SeriesOutOfStep case with its own comment arm and a verdict-like park; the lagging read and a named member not checked out become that hand-back for every ticket, CLI included; a re-cut demand on it carries every member's done/ phases as the executed head; f5f7d's interim DeriveSpec failure replaced."
  out: "Automatic healing beyond the rollback — a person demands a re-cut or re-approves and re-files."

decisions:
  - key: "ALL OR NONE: a member whose push failed makes the write revert the members it already pushed (git revert + push in their sandboxes); the run continues from memory as today, and no lag is left behind."
  - key: "OUT OF STEP IS RARE AND NAMED: only a failed rollback or a person's edit leaves members on different stamps; it is handed back as SeriesOutOfStep, never joined, never re-cut by itself."
  - key: "THE COMMENT GIVES THE REAL EXITS: write the re-cut demand phrase, or re-approve and re-file — 're-run' is not offered because nothing in a run heals it."
  - key: "VERDICT-LIKE PARK: no repeat guard; a PR command is answered with the exits instead of a rework that would re-park."
  - key: "RANKED HIGH, BELOW A DEMAND AND A RESUME: a demand is a person's choice; a resume continues work the checkpoint already holds."
  - key: "THE DEMAND SEES EVERYTHING EXECUTED: the reader supplies every member's done/ phases, ordered by id, as the executed head; new ids skip them and the stored executed ids."
  - key: "NO TICKETSERIES ROW, NO DASHBOARD ENTRY: the ticket comment is the record, as for other cases today."

steps:
  - id: rollback
    action: "In the series writer, on a failed member push revert-push the members already pushed in this write and restore their pointer shas; report the write as failed."
    modify:
      - "SeriesWriter, SandboxGitOperations, SpecSetPointerRecorder"
  - id: case
    action: "Add SpecHandbackCase.SeriesOutOfStep with its comment arm, park status and repeat exemption; ReworkParkCheck answers a PR act on it with the exits."
    modify:
      - "SpecHandback, SpecHandbackComment, SpecParkStatusResolver, SpecHandbackRepeat, ReworkParkCheck, ReworkNudgeHandler"
  - id: route
    action: "Turn a lagging read or a named member not checked out into the SeriesOutOfStep hand-back, ranked as decided; replace f5f7d's DeriveSpec failure."
    modify:
      - "SpecSourceResolver, SpecRevisionCause, DeriveSpecHandler"
  - id: demand
    action: "On a re-cut demand for an out-of-step series, read every member's done/ phases into the executed head."
    modify:
      - "SeriesReader, SpecSetReadResult"

tests:
  - "SeriesWriter_PushFailsInB_RevertsA_PointerRestored"
  - "SpecSourceResolver_LaggingRead_HandsBackOutOfStep_NoModel"
  - "SpecSourceResolver_NamedMemberNotCheckedOutInCli_HandsBack"
  - "SpecHandbackComment_OutOfStep_NamesReposAndExits"
  - "ReworkParkCheck_OutOfStep_PrCommandAnsweredWithExits"
  - "SpecRecutDemand_OutOfStep_ExecutedHeadFromEveryMembersDone"
  - "SpecRevisionCause_ResumeOnOutOfStep_Resumes"

done:
  - "A push failing in one of two repositories leaves both on the previous revision and the next run proceeds normally (RealCompositionHarness)."
  - "Two members on different stamps hand the ticket back as SeriesOutOfStep naming the lagging repository, with no model call."
