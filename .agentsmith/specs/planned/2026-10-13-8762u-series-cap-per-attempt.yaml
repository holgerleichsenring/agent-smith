    action: "SpecSequenceHandler injects ISeriesSettingsReader and TimeProvider, fails on Problems and on an AttemptSize of 0 or less (naming series.seconds_per_spec, the seconds left, orchestrator.max_run_wall_time_seconds), splices the first min(AttemptSize(seconds left since ContextKeys.RunStartedAt), the specs before g's SpecSequenceStop) of UnexecutedTail, defers the rest through g's Deferring(ids, reason) with the chunk's reason up to g's stop and g's from it, does not apply a Park stop beyond the chunk end, sizes StepBudget.ForSpecs(chunk), logs 'k of M; next attempt starts at {id}' (at most 80 after g, at most 95 after this). ReviewSpecsHandler (g, at most 85; h and k add one call each) takes the reader and walks only the first specs_per_attempt of the tail (+2 at most)."
  - id: caps
    action: "Delete SpecSet.MaxSpecs; migrate EpicOutcomeParser (refuses on Problems), ApprovedContinuation and SeriesContinuationIds (refuse on Problems; SeriesContinuationIds also refuses a NextFree index above 25, 75 -> about 79) + TicketContinuation.Decide (+ TicketApprovalPreview, TicketContinuationAct), SpecAmendmentRule (+ SpecSourceResolver, at most 120 after 2026-10-13-8762h, stays at or under 120), SpecSetComment/SpecRecutNotice (+ SpecSetTicketCommenter), FullSetPrNotice, IFullSetPrNotice doc."
  - id: derivation
