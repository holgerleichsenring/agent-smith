    action: "SeriesConfig (MaxSpecs 24, SpecsPerAttempt 8, SecondsPerSpec 0) on AgentSmithConfig (46 after 2026-10-13-8762g -> 48), RawAgentSmithConfig (59 -> 61), ResolvedConfigComposer (48 -> 49), ConfigDocTypes (37 -> 38), ConfigDocumentTaxonomy (84 -> 85), config/agentsmith.schema.json series object."
