spec: 2026-10-13-8762u
goal: "A ticket's series may hold series.max_specs specs (24) while one attempt runs at most what fits series.specs_per_attempt (8) and the run wall clock; the rest stay not started and the ticket waits."

applies_to: "backend (spec-set caps at every reader, the spec sequence's chunk, the commit-and-PR end of a chunked attempt, the series config section) + two skill wordings"

requires: [2026-10-13-8762g]

