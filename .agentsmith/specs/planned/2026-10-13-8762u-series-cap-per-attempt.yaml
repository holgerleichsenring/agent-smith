done:
  - "A design-conversation epic of up to 24 children is accepted; a 25th child is refused with a message naming the series cap."
  - "With series.seconds_per_spec measured and orchestrator.max_run_wall_time_seconds raised so eight blocks fit plus the run's prefix (checkout, derivation, review share) and the one block reserved for the commit-and-PR tail, a run of a 24-spec series (the executed prefix plus the tail, counted together) builds the first 8 specs, ends completed, keeps its pull request a draft whose banner says which spec the next attempt starts with, and leaves the other 16 not started, never failed; with a measured value the wall clock LEFT at the spec block cannot fit 8 times plus the reserved block, the attempt is that smaller count, and when not even one fits, the run fails naming the three numbers."
  - "At that boundary the ticket gets one comment naming the specs built, the specs left and where the next attempt continues, its lifecycle reads Waiting (never Done), its approval stays outstanding, and the next poll does not re-claim it (2026-10-13-8762g's boundary claim gate); the series' last attempt finalizes the ticket as today."
  - "The next attempt of that ticket builds the next chunk of the tail without re-cutting the executed ones."
  - "A derivation from a bare ticket cuts at most series.specs_per_attempt specs in one reply; a 'Request changes' on the draft at the first boundary of a 24-spec series re-cuts its 16-spec tail."
  - "series.max_specs, series.specs_per_attempt and series.seconds_per_spec are read live from agentsmith.yml and the config store; a value outside its bounds is reported at startup and refused by the first run, epic parse or continuation that would use it, each naming the field."
  - "Build green, full suite green, dashboard gen:hub-events/test/build green."
