    skill token for the series cap and a SkillsConfigValidator minimum bump — nobody: the wording carries no
    number. A per-project seconds_per_spec — nobody: one global value is the first cut; a larger repository's
    value shrinks every project's attempt, which is safe (smaller attempts, more of them) and is said in a decision.
    Re-cutting a derivation from a bare ticket beyond one attempt in one reply — nobody: a larger programme comes
    through the design conversation, as today.

decisions:
  - key: "TWO NUMBERS, NOT ONE RAISED. The constant meant both 'how many specs a ticket may hold' and 'how much one run may be asked to do'. Raising it to 24 would make one run splice 24 blocks (520 steps, clamped at 400) inside one 30-minute wall clock; splitting keeps the per-run size and lets the series grow. Default, pending operator ratification (contract decision 17): 24 and 8."
  - key: "A FRESH CUT STAYS AT ONE ATTEMPT; A RE-CUT IS BOUNDED BY THE SERIES CAP. A fresh cut (no previous set) is bounded by specs_per_attempt; a re-cut repeats the executed head (SpecDerivationParser.cs:90-94) and may re-cut a tail longer than one attempt, so it is bounded by max_specs in all. Alternative rejected (review 8762u r3 cut 1): 'reply count minus the executed head <= AttemptSize' — at the first boundary of a 24-spec epic a Rework re-cuts 16 and was refused, so the 'Request changes' the boundary comment invites was never applied. A bare ticket that stopped at 8 and told the person 'file a new ticket' (FullSetPrNotice) now accepts appends up to 24 — operator-visible, chosen because a long series is the goal; the notice says it at 24."
  - key: "THE DERIVATION BOUND IS specs_per_attempt, NOT THE WALL-DERIVED AttemptSize. A cut squeezed by wall time has fewer, larger specs, each less likely to fit seconds_per_spec, which defeats the measurement; the chunk already handles time."
  - key: "ONE BLOCK IS RESERVED FOR THE COMMIT-AND-PR TAIL. Commit, push, opening or keeping the PR, the boundary comment and the finalizer tail run after the last block and are in no block; the watchdog cancels by StartedAt (CancelEnforcer.cs:91-108), so a chunk sized to fill the time left exactly can be cancelled in CommitAndPR — cancelled, not delivered, and g's gate does not hold it. One whole block over-reserves (the tail is shorter than a spec), which costs at most one spec per attempt. Default, pending operator ratification."
  - key: "A ZERO CHUNK FAILS, NEVER FLOORS. Flooring at 1 would start a block the watchdog cancels; letting 0 through defers every spec as a 'chunk boundary' that built nothing, which either fails at the keystone (re-claimed) or loops automatic attempts (2026-10-13-8762v). The step fails naming the three numbers, consistent with REFUSED WHERE READ."
  - key: "26 IS A LETTER CEILING, NOT ONLY A COUNT. Dropped basis ids stay taken (SeriesContinuationIds.cs:20-23), so a continuation can need a letter past z while holding 24 specs; Member has no ceiling (SeriesIdFactory.cs:30-31). The continuation refuses an index above 25 instead of minting an id the spec-id rule and file names cannot hold."
  - key: "THE REVIEW WALKS ONLY WHAT THIS ATTEMPT CAN BUILD. g's ReviewSpecs runs before SpecSequence; walking the whole 24-spec tail spends the review share on specs this attempt defers, revises yaml that is then reviewed again next attempt, and shrinks the chunk through time. It walks the first specs_per_attempt (not AttemptSize: the time left is measured at SpecSequence, after the review)."
  - key: "A PARK STOP BEYOND THE CHUNK END IS NOT APPLIED. Parking to ask about a spec this attempt would not reach holds the ticket on a question about later work; the spec is deferred with the rest and the next attempt's review reaches it again."
  - key: "THE CAP IS PASSED, NEVER READ FROM A STATIC, AND READ LIVE (main-thread decision 4). Every static rule takes SeriesSettings as a required parameter from a DI caller that holds ISeriesSettingsReader; a Config Studio save applies to the next run without a restart, as the sandbox block does. Tests construct SeriesSettings with new SeriesConfig() and 1800."
  - key: "REFUSED WHERE READ, NOT AT STARTUP (main-thread decision 3). A Blocking startup finding with no project blocks nothing and never stops the process, so the startup finding only reports (2026-10-13-8762v reads the same Problems()); the first run, epic parse or continuation that reads a bad value fails naming the field. Never a clamp, which would run something other than what the operator configured."
  - key: "THE ATTEMPT IS DERIVED FROM THE MEASURED SPEC BLOCK (main-thread decision 3; contract 2.7 amended: the key is series.seconds_per_spec, the whole spec block, not verify alone). Verify alone is a fraction of a block (master, premise, review, fix pass, record), so a verify-only number lets the watchdog cancel the attempt before its boundary. AttemptSize = min(specs_per_attempt, seconds left / seconds_per_spec - 1 reserved tail block). Unmeasured (0) is advisory: the attempt is specs_per_attempt and may end at the watchdog, which 2026-10-13-8762v's continue_after_wall_time carries."
  - key: "ONE GLOBAL seconds_per_spec. The gate it measures is per repository, so the largest project's value shrinks every project's attempt. Accepted: a smaller attempt is safe, it only means more attempts."
  - key: "THE BOUNDARY MARKS THE PROGRESS, NOT INFERRED. A NotStarted spec after a red verify and one held for the next attempt look alike; SpecProgress.NextAttempt is set through Deferring by the writer that decided the boundary, so CommitAndPR and the lifecycle coordinator read a fact. No ContextKeys entry is added (ContextKeys.cs is at 152/152)."
  - key: "THE BOUNDARY NEVER FINALIZES AND NEVER SAYS DONE (main-thread decision 3). FinalizeTicketAsync would report a series of 24 done after 8 or close it, and the lifecycle coordinator would move the ticket to Done — native Done on Jira — the p0454 mistake again. The boundary is Waiting; the approval stays outstanding; one comment says where it continues."
  - key: "THE BOUNDARY IS HELD BY g's CLAIM GATE, NOT BY THE NATIVE STATUS. The boundary skips FinalizeTicketAsync, the only thing that moves the native status (CommitAndPRHandler.cs:394-409), so the ticket stays in its trigger status with its approval outstanding and no lease; the poller gates only on status and lease (TrackerPoller.cs:145-169). The re-claim is refused by 2026-10-13-8762g's BoundaryStopGate in ClaimRefusal (series main-thread decision 1). Alternative rejected: moving the native status at the boundary (needs a transition-only provider call and says done where done_status means Done)."
  - key: "THE CHUNK IS SIZED FROM THE TIME LEFT. The spec block starts after checkout, derivation, the hand-back, the gate and g's review (up to 40% by default), so sizing against the configured total lets the watchdog cancel a chunk that 'fits'."
  - key: "THE PR STAYS A DRAFT ACROSS ATTEMPTS. The repository holds part of a series, the half-migrated state p0393a makes unmergeable by construction; only the banner and the table heading change."
  - key: "SkillsConfigValidator IS NOT TOUCHED (series contract 2.8, amended). The chosen wording carries no number."
  - key: "CONTRACT ADDITION (types internal to u, no cross-member event): SeriesConfig.Problems/AttemptSize, SeriesSettings, ISeriesSettingsReader (+ Loader/Stored), SeriesConfigValidator, SeriesChunkStop, SpecStatusTable, CodePullRequestBanner and SpecSequenceProgress.StoppedAtChunk. SpecProgress.NextAttempt and SpecSequenceProgress.Deferring are 2026-10-13-8762g's, reused here. StoppedAtChunk is read inside the run; 2026-10-13-8762v reads its EFFECT from the database, never the in-memory flag; 2026-10-13-8762w's form meets SeriesConfig.Problems() through 2026-10-13-8762v's settings write check."

