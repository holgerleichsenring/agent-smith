assumptions:
  - "2026-10-13-8762g, built first, lands SpecProgress.NextAttempt (appended last, default false), SpecSequenceProgress.Deferring(ids, reason) — the ONE way a step ends an attempt at a boundary — and ContextKeys.SpecSequenceStop, read by SpecSequenceHandler, which splices only the tail before the stop and defers the rest; this spec mints none of the three."
  - "A person's act on the ticket (keyword comment, pull-request act, an approval in the ticket's conversation, a move back) starts the next attempt today, and 2026-10-13-8762v starts it automatically; this spec only makes the boundary an ordinary end of an attempt."
  - "A ticket stopped at a boundary keeps its native trigger status and its outstanding approval, so without a gate the next poll, a webhook or the pump would re-claim it. 2026-10-13-8762g, built first, owns the ONE boundary claim gate, BoundaryStopGate, beside UnmovedTicketGate in ClaimRefusal (the door poller, webhooks and pump all pass): a ticket whose newest attempt ended at a boundary (SpecProgress.NextAttempt rows) is not claimed unless the start is a person's act, pinned by g's Poll_TicketStoppedAtBoundary_IsNotReclaimed; a chunk boundary ends through g's Deferring, so it is covered by that gate and this spec adds no gate of its own. 2026-10-13-8762v adds its own automatic start as allowed."

scope:
  in: >
    CONFIG: SeriesConfig (Contracts/Models/Configuration) with MaxSpecs = 24 (series.max_specs),
    SpecsPerAttempt = 8 (series.specs_per_attempt) and SecondsPerSpec = 0 (series.seconds_per_spec, the measured
    seconds of ONE WHOLE SPEC BLOCK — master, premise, verify, review, fix pass and record — 0 = not measured), on
    AgentSmithConfig.Series, RawAgentSmithConfig, ResolvedConfigComposer, ConfigDocTypes.Series = "series", one
    ConfigDocumentTaxonomy singleton row and config/agentsmith.schema.json (max_specs and specs_per_attempt
    integers minimum 1, seconds_per_spec integer minimum 0). THE RULE lives on SeriesConfig itself (Contracts, pure, so
    Infrastructure.Core can call it): Problems() = one sentence per field when max_specs is
    outside 1..26 (member letters a..z), specs_per_attempt outside 1..min(max_specs, (StepBudget.AbsoluteCeiling -
    BaseAllowance) / PerSpecAllowance = 18), or seconds_per_spec negative; Problems(runWallSeconds) adds one
    when seconds_per_spec > 0 and two blocks (one spec plus the reserved tail) exceed
    orchestrator.max_run_wall_time_seconds (naming both fields); AttemptSize(secondsLeft) = specs_per_attempt when
    seconds_per_spec is 0, else min(specs_per_attempt, secondsLeft / seconds_per_spec - 1), the minus one being ONE
    BLOCK RESERVED for the commit-and-PR tail (commit, push, open/keep the PR, the boundary comment, the finalizer
    tail), which no block counts and the watchdog's cancel by StartedAt would otherwise cut. SeriesSettings(SeriesConfig Series, int RunWallSeconds) carries both into
    a reader's caller — the attempt is DERIVED
    so it fits the configured run wall clock; SpecSequenceHandler passes AttemptSize the REMAINING wall seconds
    (orchestrator.max_run_wall_time_seconds minus the time since ContextKeys.RunStartedAt, measured through an
    injected TimeProvider so the tests are deterministic), because checkout,
    derivation, hand-back, the gate and g's review have already spent part of it, while Problems(runWallSeconds)
    keeps the configured total for the startup and settings checks. LIVE READ: ISeriesSettingsReader.Current() -> SeriesSettings, with
    LoaderSeriesSettingsReader (Application, the LoaderSandboxSettingsReader pattern: loader per call with a
    config path, else options) registered by appending .AddSingleton<ISeriesSettingsReader, LoaderSeriesSettingsReader>() to the
    sandbox-reader chain's last line, PipelineHandlersExtensions.cs:185 (218, stays at 218; a new line breaks it), and StoredSeriesSettingsReader (Server, modelled on StoredSandboxSettingsReader: IConfigStore.GetSetting of
    series and orchestrator, its wrong-type throw naming which of the two documents it was, as
    StoredSandboxSettingsReader.cs:17-19 names the sandbox block) replacing it beside the sandbox reader (ServerSandboxExtensions 97 after 2026-10-13-8762g -> 99). Every reader below takes the settings from
    this reader in its DI caller, never from the AgentSmithConfig singleton. REFUSED WHERE READ: SpecSequenceHandler
    fails its step with the settings' Problems when any (never clamps); EpicOutcomeParser and the continuation
    (ApprovedContinuation, SeriesContinuationIds) refuse with the same sentence. AT STARTUP: SeriesConfigValidator
    (static) yields each of SeriesConfig.Problems(run wall seconds) as a Blocking finding and, with seconds_per_spec 0, one Advisory finding
    saying the attempt is not sized against the wall clock; it rides AgentSmithConfigValidator's existing AddRange
    line (177, stays at 177, no constructor change): AgentSmithConfigValidator.cs:31 becomes
    errors.AddRange([.. skills.Findings(config.Skills), .. SeriesConfigValidator.Findings(config)]). CAPS: SpecSet.MaxSpecs is DELETED. SERIES CAP (max_specs) — EpicOutcomeParser
    (children), ApprovedContinuation and SeriesContinuationIds (executed + unstarted; SeriesContinuationIds.Continue also
    refuses as RefusedOverCap, naming that the series has used its 26 member letters, when any NextFree index it
    takes exceeds 25 — dropped basis ids stay taken, so 24 specs can need a 27th letter; TicketContinuation.Decide takes
    the settings from its two callers; TicketContinuationAct and SeriesContinuationIds keep room for
    2026-10-13-8762j's TicketContinuationDecision.Ids exposure, which this spec neither adds nor renames), SpecAmendmentRule.NeedsModel/IsAppend (full at Executed >= max_specs;
    SpecSourceResolver passes it), SpecRecutNotice via SpecSetComment.Render and FullSetPrNotice ("all N specs ...
    the most one series can hold"). DERIVATION BOUND (never the wall-derived AttemptSize: squeezing a cut by wall time
    yields fewer, larger specs, each less likely to fit seconds_per_spec, and the chunk already handles time) —
    a FRESH cut (source Derived, no previous set) is refused above specs_per_attempt specs; a RE-CUT of an existing
    set (source BranchArtifact: Rework, RecutDemand, TicketEdit, Comment, StatusBack) is refused only above
    max_specs in all, because its reply repeats the executed head and may re-cut a tail longer than one attempt;
    one bound per source through one SeriesConfig helper, one refusal string each, replacing the branch at
    SpecDerivationParser.cs:86-88. SpecSetDeriver fills {MaxSpecs} the same way (specs_per_attempt with no previous
    set, max_specs with one); PreviousCutPromptSection's append paragraph says at most min(max_specs - executed,
    specs_per_attempt) new spec(s). CHUNK: SpecSequenceHandler splices only the first
    min(AttemptSize, the specs before 2026-10-13-8762g's ContextKeys.SpecSequenceStop when one is set) specs of
    UnexecutedTail and sizes StepBudget.ForSpecs from that count. When AttemptSize is 0 or less (the time left is
    under two blocks) it fails its step with one sentence naming series.seconds_per_spec, the seconds left and
    orchestrator.max_run_wall_time_seconds — never floored to 1 (no clamp); a chunk of 0 because g's stop sits at
    the first tail spec is g's end (a Park parks; otherwise g's deferral), not a chunk boundary. The specs after the
    chunk are deferred through g's SpecSequenceProgress.Deferring(ids, reason), which seeds them NotStarted with g's
    SpecProgress.NextAttempt true (reused, never minted again); the chunk's reason is "beyond this attempt's chunk of
    k spec(s) (series.specs_per_attempt and the wall clock left)". When g's stop lies after the chunk end, the specs
    from the chunk end to the stop carry the chunk's reason and the specs from the stop on carry g's; a Park stop
    beyond the chunk end is NOT applied this attempt — its spec is deferred with the rest (no HandedBack seed, no
    SpecHandback appended) and the next attempt's review reaches it again. SpecSequenceProgress.StoppedAtChunk
    (minted here) is true when at least one spec is NextAttempt and every other spec is Done — a chunk boundary or a
    review-share stop alike. REVIEW WALK: g's ReviewSpecsHandler walks only the first specs_per_attempt specs of the
    tail (one Take through the injected ISeriesSettingsReader), so it never reviews or revises a spec this attempt
    defers. A chunk boundary is an ordinary end:
    CommitAndPR keeps the pull request a draft, its banner (SeriesChunkStop.PullRequestBanner, through the
    CodePullRequestBanner type the banner moves into) names "series in progress: k of M specs built; the next
    attempt continues with {id}" (no attempt number: the run carries PreviousAttempt but no count of attempts)
    instead of "Verification red", the status table (moved out of SpecPrBody into
    SpecStatusTable, its callers migrated) heads "Series in progress — do not merge until it is through" and marks
    NextAttempt specs "next attempt" only when the progress StoppedAtChunk (a shortfall or failed run that also
    carries NextAttempt specs finalizes or fails, so its row shows g's note instead), and SeriesChunkStop.ReportAsync (skipping an inline ticket as finalizing does)
    posts ONE ticket comment naming the specs built, the specs left, the spec the next attempt starts with, and that
    a change to the remaining specs is a comment on the ticket — a "Request changes" review on the draft re-cuts
    the series' tail; it does NOT call FinalizeTicketAsync and returns CommandResult.Ok with the same sentence. The chunk
    arm sits after the delivered-shortfall and failed-run returns (CommitAndPRHandler.cs:171-181) and before the
    keystone's refusal (:188-204), so a failed chunk keeps today's failure path. The
    run ends completed; RunShortfall stays null; the lifecycle coordinator's TerminalStatus returns the existing
    TicketLifecycleStatus.Waiting through its OWN arm when the progress StoppedAtChunk — never through RunPark,
    which would park the run as waiting_for_input with no run-end nudge — so the run ends success with FinishedAt
    set, the ticket wears the Waiting label, and a native Jira done status is not set after attempt 1. SKILLS (one wording edit each, on skills branch spec/2026-10-13-8762 released by
    2026-10-13-8762x; the build note quotes each exact sentence): design-partner-master "between two and eight
    ordered children" -> "two or more ordered children; the epic parser states the series cap when a cut exceeds
    it"; spec-derivation-master keeps {MaxSpecs}, which now means the specs one attempt runs. No frontmatter version
    bump: 2026-10-13-8762x bumps each master once.
