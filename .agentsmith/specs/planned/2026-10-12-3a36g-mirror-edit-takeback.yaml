# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36g
goal: "A person's edit to a mirrored spec is found by content hash per repository: one edited mirror is taken into the database, two that disagree stop the run and name the files."

applies_to: "backend (spec source, revision cause)"

requires: [2026-10-12-3a36f]

facts:
  - claim: "Today an edit is found by comparing the series' last commit sha on the series paths with the one recorded sha."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:63-73, src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:62-82"
  - claim: "A reviewer's edit is used without a model, approved or not; executed specs are append-only to the derivation."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-52, src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:57-69, src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:22-27"
  - claim: "Filing exists so people can edit between approval and the first claim."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:11-13"

assumptions:
  - claim: "3a36f stores per repo the content hash it pushed, computed by SeriesMirrorContent."
    check: "Read 3a36f's delivered SeriesMirrorContent before building; reuse it, never a second hash."

scope:
  in: "Per-repo hash comparison before the source is resolved; take-back of one edited mirror; stop on disagreement or an unreadable named mirror; limits on what a mirror edit may change; the ReviewerEdit cause and kept notice preserved."
  out: "Edits made through the dashboard or dialog, which write the store directly."

decisions:
  - key: "ONE HASH, ONE MEANING: the same SeriesMirrorContent hash 3a36f stores, so a base merge or a squash is never an edit."
  - key: "ONE EDIT IS TAKEN BACK: the mirror's specs become a new revision with cause ReviewerEdit, approval untouched — today's rule, per repo."
  - key: "TWO DISAGREEING EDITS STOP THE RUN: the ticket names both files; the operator decides, not a rule."
  - key: "AN UNREADABLE NAMED MIRROR STOPS THE RUN TOO: unknown is never read as unchanged."
  - key: "WHAT A MIRROR MAY CHANGE: the content of specs not yet executed; edits to executed specs or to the manifest's approval are reported on the ticket and not taken."
  - key: "THE SHA RULE GOES: SpecRevisionCause's RevisionSha comparison is replaced, not kept beside the hash."

steps:
  - id: compare
    action: "Before resolving, hash each named repo's mirror with SeriesMirrorContent and compare with the stored hash; classify unchanged, edited, unreadable."
    new:
      - "MirrorEditDetector: per-repo verdicts"
    modify:
      - "DeriveSpecHandler, SpecSourceResolver"
  - id: takeback
    action: "On exactly one edited mirror, read its specs, keep only changes to unexecuted spec content, store them as a ReviewerEdit revision and re-mirror; report refused parts on the ticket."
    modify:
      - "SpecSourceResolver, SpecRevisionCause, ApprovedSetKeptNotice"
  - id: stop
    action: "On two edited mirrors that differ, or an unreadable named mirror, fail the run before derivation with a ticket comment naming the repositories and files."

tests:
  - "MirrorEditDetector_OneMirrorEdited_TakesItBackAsReviewerEdit"
  - "MirrorEditDetector_TwoMirrorsEditedAlike_TakesItBackOnce"
  - "MirrorEditDetector_TwoMirrorsDiffer_StopsNamingFiles"
  - "MirrorEditDetector_NamedMirrorUnreadable_Stops"
  - "MirrorEditDetector_BaseMergeOnly_Unchanged"
  - "Takeback_EditToExecutedSpec_ReportedNotTaken"
  - "Takeback_ApprovedSet_StaysApproved"

done:
  - "An edit committed by a person to the Server mirror of a two-repo spec is worked by the next run and appears in the Client mirror (RealCompositionHarness)."
  - "SpecRevisionCause no longer reads RevisionSha."
