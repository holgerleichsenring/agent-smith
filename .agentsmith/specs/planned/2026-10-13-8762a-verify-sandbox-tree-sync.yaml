done:
  - "In a run over a repository with two toolchain sandboxes, a change written in one sandbox is in the other sandbox's tree, byte for byte (CRLF and binary files included), when that sandbox's verify stages run."
  - "When two sandboxes of one repository changed the same file differently, the spec fails at verify with a message naming the file and both sandboxes, and no sandbox was changed by the sync; the same change in two sandboxes is not a conflict."
  - "Under --source-path, work the secret scan declined is never committed by the sync."
  - "After a green sync the account and the spec review read each repository's diff once."
  - "After this spec every declared stage of a mixed-stack repository's secondary sandbox runs whenever the repository changed, unless its when_changed (2026-10-13-8762b) says otherwise."
  - "A continuation attempt on a reused branch whose base moved, and a local run with --source-path, verify without a false conflict."
  - "After a green verify the primary has committed every sandbox's work, or the spec is red saying the union could not be committed; the next spec's master finds the earlier spec's work in whichever sandbox it uses."
  - "A mixed-stack fix pass that goes red after a green sync is reverted and the spec stays done."
  - "A repository with one sandbox verifies exactly as before, with no added git step."
  - "Build green, full suite green, dashboard gen:hub-events / test / build green."
