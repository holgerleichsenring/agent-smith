# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-22-66e4b
goal: "agent.rate_limit (requests and tokens per minute) is a field of the agent drawer, seeded from the provider tier, and governs the next limiter without a restart."

applies_to: "default (ConfigStudio AgentEntity, LlmRateLimiterRegistry) + dashboard (AgentProviderTab)"

requires: [2026-11-22-66e4a]

facts:
  - claim: "AgentEntity carries retry, cache, compaction and max_concurrent_runs but no rate_limit, so the pacing budget is only editable in YAML."
    evidence: "src/backend/AgentSmith.Contracts/Models/ConfigStudio/AgentEntity.cs:14-29"
  - claim: "AgentConfig.RateLimit is the operator override LlmRateBudget reads before the provider tier."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/RateLimiting/LlmRateBudget.cs:22"
  - claim: "A limiter is created once per deployment with the options of its first call and kept for the process lifetime."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/RateLimiting/LlmRateLimiterRegistry.cs:26"

scope:
  in: "The rate_limit section on AgentEntity (export, upsert, both numbers required when set, positive); the drawer field seeded from the tier with help naming that it applies per deployment and per process; a changed budget replaces the deployment's limiter options when a client for it is next built; two agents on one deployment with different budgets: the lower wins."
  out: "The 429 wait and the network ladder (66e4a, unchanged); a budget shared across replicas (per process; the provider remaining-headers of 66e4a are the cross-replica signal)."

steps:
  - id: entity
    action: "AgentEntity.RateLimit with mapper, patch and validation."
  - id: form
    action: "Fields in the agent drawer, seeded from the provider tier, through the i18n dictionary."
  - id: live
    action: "The registry adopts changed options for a deployment at its next GetOrCreate (client build), keeping the bucket's level; the lower of two agents' budgets wins."

tests:
  - "AgentEntity rate_limit round-trips export and upsert; one number missing is refused."
  - "A changed budget reaches the deployment's limiter when the next client for it is built."
  - "Dashboard: the drawer edits both numbers and seeds them from the tier."

done:
  - "build green, full suite and dashboard tests green"
