# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-d854b
goal: "Every proposing design turn shows one reduced result: summary, activity line, cost-cap banner, questions with take or answer, and one row per spec, live and after a reload."
requires: [2026-11-10-d854a, 2026-11-10-d854c, 2026-11-10-7da6]

applies_to: "default (Dashboard: dialog transcript and surface, ticket conversation; Server: proposal views)"

facts:
  - claim: "The conversation renders a proposal as DialogProposalCard; the ticket page renders it as ProposalBlock with findings and rounds; the side panel carries graph, rounds and uploads."
    evidence: "src/dashboard/src/components/dialog/DialogTranscript.tsx:10; src/dashboard/src/components/tickets/detail/ProposalBlock.tsx:3-4; src/dashboard/src/components/dialog/DialogProposalPanel.tsx:8-10"
  - claim: "The ticket page reads TicketConversationProposalView, whose drafts carry id, goal, repos, done and a ratified mock, and no yaml, facts, steps, decisions or spend."
    evidence: "src/backend/AgentSmith.Server/Models/TicketConversationProposalView.cs:7-25"
  - claim: "The conversation's draft view carries id, goal, steps, tests, done, requires, yaml and facts, and no repository."
    evidence: "src/backend/AgentSmith.Server/Models/SpecDialogDraftView.cs:13-24"
  - claim: "A finished turn shows no steps today: DialogWorking renders only while the dialog is working."
    evidence: "src/dashboard/src/components/dialog/SpecDialogSurface.tsx:428-433"
  - claim: "The operator approved the layout in a mock."
    evidence: "https://claude.ai/artifact/5sBqNLKzQ3GK96mGRvfnYg (2026-11-10)"

scope:
  in: "A TurnResult component renders on every transcript turn that has its own proposal (d854c), live and after a reload: the reply prose as summary; one collapsed activity line (duration, steps, sub-agents, review rounds, cost) that opens the turn's steps page by page from its run; an amber banner when Spend.capHit; the questions from Decisions with question, proposal and spec ids — 'Take proposal' sends the question and the proposal as the person's reply, 'Answer' puts the question into the composer; the specs in build order, one row each with id, goal, repository and a status pill (reviewed clean, findings, not reviewed), opening to findings, done criteria and links to yaml, facts and rounds; the approve bar on the current proposal only. SpecDialogDraftView gains Repos. ProposalBlock renders TurnResult: TicketConversationProposalView gains Decisions and Spend and its drafts gain Yaml; dispositions and ratified mocks stay ticket-only, passed to TurnResult as optional parts. The side panel keeps graph and uploads; rounds move into the rows."
  out: "The banner's 'continue at the next tier' action is the successor named by 2026-11-10-548f."

decisions:
  - key: "ONE COMPONENT, THE TICKET VIEW GROWS. The conversation and the ticket page show the same proposal, so they share TurnResult; the ticket view gains the three fields it lacks rather than TurnResult learning two shapes, and its own parts (dispositions, ratified mocks) are slots."
  - key: "TAKE SENDS WORDS, NOT A NUMBER. The reply reads 'question — proposal', so the transcript, the master and a reader on Slack understand it without the card."
  - key: "FOLD, NEVER DROP. Steps from the turn's run, findings, rounds and full specs from the turn's own proposal; each is one click away after a reload."
  - key: "PILL FROM EXISTING DATA. Status comes from Findings and NotReviewed."
  - key: "AFTER 7DA6. The one-card rule lands first; TurnResult then replaces the card it settled."

steps:
  - id: views
    action: "SpecDialogDraftView gains Repos; TicketConversationProposalView gains Decisions and Spend, its drafts Yaml; the dashboard types follow."
  - id: component
    action: "TurnResult and its rows; the activity line reads the count and pages the steps through the d854c endpoint."
  - id: wire
    action: "DialogTranscript renders TurnResult per proposing turn; ProposalBlock renders it with its ticket slots; DialogProposalPanel drops its rounds list."
  - id: answers
    action: "Take proposal sends through the existing composer send; Answer prefills the composer."
  - id: tests
    action: "vitest per part, on a fixture."

tests:
  - "TurnResult shows one row per spec in build order with the right pill"
  - "TurnResult's activity line shows duration, steps and cost and pages the steps"
  - "TurnResult shows the cap banner only when Spend.capHit"
  - "Take proposal sends the question and the proposal"
  - "A row opens to its findings, done criteria and links"
  - "Two proposing turns each render their own TurnResult; only the latest has the approve bar"
  - "ProposalBlock renders TurnResult with dispositions and ratified mocks"

done:
  - when: "a fixture conversation with an epic of ten specs, three questions, a capped review and 1,225 steps is rendered"
    then: "the page shows the summary, one activity line, the cap banner, the three questions and ten closed rows, with no findings list open"
  - when: "the same fixture is reloaded after the turn ended"
    then: "the same result renders; the activity line opens all 1,225 steps page by page; each row's findings, rounds and full yaml are one click away"
  - "Build green, dashboard tests green."
