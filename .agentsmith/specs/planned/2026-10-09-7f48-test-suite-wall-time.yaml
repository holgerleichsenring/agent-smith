# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-09-7f48
goal: "A phase commit costs one full test run, not two, and the gate runs it in under 150 s: two lanes, AgentSmith.Tests split over processes, presets side by side, no per-test migration."

applies_to: "gate hook + test suite (AgentSmith.Tests) + CLAUDE.md"

requires: []

facts:
  - claim: "The gate runs every stage in sequence: hook tests, dashboard install/gen/test/build, build, one dotnet test over the solution with --no-build, four dry-runs, then each preset as its own dotnet run."
    evidence: ".claude/hooks/phase-gate.sh:192-205,228-265,267-270,278,282-287,289-302"
  - claim: "CLAUDE.md tells the implementing agent to run ALL tests before moving on, so the full suite runs once by hand and once in the gate; no context declares verify: stages that would add a third."
    evidence: "CLAUDE.md:128, observed: 2026-10-09, grep finds no verify key in the default context"
  - claim: "Gate stages timed as the script runs them, 12-core macOS: warm tree 360 s total (dotnet test 278, dashboard 47, hook tests 10, build 5.5, presets 16, dry-runs 2); cold tree 530 s (dotnet test 437, dashboard 43, build 18, presets 19)."
    evidence: "observed: 2026-10-09, scratchpad time-gate.sh, two runs on /private/tmp/as-2026-10-09-7f48 at 22dd5a2a5"
  - claim: "Of the three test assemblies, AgentSmith.Tests is the wall: 8,436 tests, 5 m 16 s alone with 405 CPU-seconds, about 1.3 cores busy; Sandbox.Agent.Tests 3 s, PipelineHarness 36-48 s; dotnet test already skips the rebuild."
    evidence: "observed: 2026-10-09, /usr/bin/time + trx of AgentSmith.Tests alone; .claude/hooks/phase-gate.sh:278"
  - claim: "Every class mutating or reading process environment shares one collection, serial within the process; 48 classes, mostly booted servers that set CONFIG_PATH, REDIS_URL and the dashboard gate. Alone it takes 131-200 s, and in the full run it is the long pole to about 250 s."
    evidence: "tests/AgentSmith.Tests/TestSupport/EnvVarCollection.cs:9-13, tests/AgentSmith.Tests/Server/Auth/BootedServer.cs:50-53, observed: 2026-10-09, trx timeline and filtered run"
  - claim: "Collections with DisableParallelization run after every parallel one; the external-process set (27 classes) plus the two trace/OpenAI-key collections take 43-67 s at the end of the run."
    evidence: "tests/AgentSmith.Tests/Architecture/ExternalProcessCollection.cs:4-22, tests/AgentSmith.Tests/ConfigStudio/TraceEnvironment.cs:4, tests/AgentSmith.Tests/Factories/OpenAiKeyEnvironment.cs:4, observed: 2026-10-09, trx timeline"
  - claim: "A migrated-template copy exists and is used by 59 files, but 55 test classes (471 tests) still call Database.Migrate() per test instance; one such class, 23 tests, takes 7 s alone, CPU-bound."
    evidence: "tests/AgentSmith.Tests/TestSupport/MigratedStoreTemplate.cs:24-41, tests/AgentSmith.Tests/SpecDialog/DialogConversationListTests.cs:37-43, observed: 2026-10-09, grep + filtered run"
  - claim: "Measured prototype: AgentSmith.Tests as body + three env shards + serial set, beside the other two assemblies, ran 8,436 tests green in 140 s alone; with the dashboard lane beside it and presets in parallel the whole gate took 175 s, preset exit codes unchanged."
    evidence: "observed: 2026-10-09, scratchpad split-run.sh and proto-gate.sh"
  - claim: "Rejected by measurement: skipping pnpm install saves 0.4-2.9 s; xUnit MaxParallelThreads -1 or 48 moved the body 118-137 s against 128 s, within noise."
    evidence: "observed: 2026-10-09, gate stage timings and three body runs"
  - claim: "xUnit is 2.5.3; CI runs a single dotnet test over the solution on two-core runners."
    evidence: "tests/AgentSmith.Tests/AgentSmith.Tests.csproj:22, .github/workflows/docker-publish.yml:62"

assumptions:
  - claim: "No two classes of the env collection, or of the serial set, share a fixed path, port or home-directory file, so separate processes may run them at once."
    check: "grep the 48 + 30 classes for literal paths, ports and HOME use before sharding; a hit keeps that pair in one shard."

scope:
  in: "Gate lanes, trait-selected test processes, parallel presets, template copies for inline migrations, CLAUDE.md workflow and Phase Gate text."
  out: "Moving the server's environment reads into configuration (would end the env collection; its own spec). Slow single tests such as HealthEndpoint's 17 s Redis wait. CI keeps its single invocation."

decisions:
  - key: "PROCESSES, NOT COLLECTIONS: environment is per process, so an env shard in its own process keeps the guarantee the collection gives while the shards run at once."
  - key: "TRAITS SELECT THE PROCESS: VSTest filters see traits, not collections; an architecture test ties each trait to its collection so the two cannot drift."
  - key: "WEAKER ON FEW CORES: the serial set beside the body shares the machine, which ExternalProcessCollection was written to avoid on two cores; the gate splits only at 8 cores or more, else runs today's single invocation."

steps:
  - id: traits
    action: "Add [Trait(\"TestProcess\", \"env-1|env-2|env-3\")] to each env-collection class (balanced by measured time) and \"serial\" to each DisableParallelization-collection class; add TestProcessTraitRuleTests."
  - id: migrations
    action: "Replace per-test Database.Migrate() with MigratedStoreTemplate.OpenCopy() in the 55 classes, except tests whose subject is migrating; add a rule that no other test calls Migrate."
  - id: gate
    action: "Run hook tests then dashboard as lane one beside build, tests, dry-runs, presets as lane two; tests as five processes; dry-runs and presets each in parallel; wait for all, block on any, name every failed step; keep the ledger line."
  - id: docs
    action: "CLAUDE.md step 6: run the tests of what changed while iterating; the gate runs the full suite at the phase commit. Rewrite the Phase Gate bullets for lanes and processes."

tests:
  - "TestProcessTrait_EveryEnvCollectionClass_CarriesExactlyOneEnvShard"
  - "TestProcessTrait_EverySerialCollectionClass_CarriesSerial"
  - "TestProcessTrait_NoClassOutsideThoseCollections_CarriesOne"
  - "TestMigration_NoTestOutsideTheTemplate_CallsMigrate"
  - "test_phase_gate: a failing lane blocks and names the step; both lanes failing name both"

done:
  - "The five test processes together run exactly as many tests as one dotnet test over the solution, all green."
  - "Median of three gate runs on this machine at most 150 s, from 360 s warm and 530 s cold; each stage time written in the decisions file."
  - "On a machine reporting fewer than 8 cores the gate runs one dotnet test, as today."
  - "CLAUDE.md step 6 and the Phase Gate section describe the new flow."
