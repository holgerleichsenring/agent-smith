# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-14-dbcek
goal: "A proposed list of tickets is reviewed as a plan, its cuts applied to the ticket texts, and shown in merge order with what each ticket waits for, in chat and on the dashboard."

applies_to: "backend (the plan review of a ticket list, the ticket:<id> existence read, the proposal text, the pane push, the offered shapes) and dashboard (the proposal panel and card, the approval summary, the conversation delete copy, the mock ticket-graph.html)"

requires: [2026-10-14-dbcej]

