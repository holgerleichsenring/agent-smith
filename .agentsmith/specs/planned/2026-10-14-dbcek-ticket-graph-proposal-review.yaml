done:
  - "A design turn that proposes a list of tickets has the list reviewed as a plan — mergeable on its own, ordered, covering what the operator asked in messages and uploaded files, small enough for one run — and the reviewer's quoted cuts applied to the ticket texts before the operator approves; what is left shows as findings under the ticket it concerns, and a requirement no ticket covers shows as a finding about the whole list."
  - "A ticket:<id> requirement in the list the operator approves — also one the revised list added — naming a ticket the tracker does not have shows as a finding under the requiring ticket on Azure DevOps, Jira, GitLab and GitHub alike, every missing id named and no tracker error text shown."
  - "A list proposed in a ticket's own conversation is not reviewed, says where a list of tickets is filed, and its approval card on the dashboard offers no Approve."
  - "In Slack and Teams the confirmation lists the tickets in the order they must merge, each with its key, title, number of done items and what it waits for, points to the dashboard for the full texts, posts even for twenty tickets, and offers to make it one ticket's series; an epic additionally offers to cut it into several tickets, except in a ticket's own conversation."
  - "On the dashboard the proposal pane and the conversation card show the ticket texts and their requires, and the approval card says how many tickets would be filed and how many have nothing to wait for."
  - "src/dashboard/design/mockups/ticket-graph.html shows the list proposal as the pane renders it."
  - "Build green, full suite green, dashboard gen/test/build green."
