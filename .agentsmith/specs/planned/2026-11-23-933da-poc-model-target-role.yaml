scope:
  in: >
    SWITCH: pocs.enabled (bool, default false). Off: PocsGate (an endpoint filter on the /api/pocs group, so it runs after
    authorization) answers an empty 404 on every PoC route to a caller holding the route's permissions, and every PoC
    hosted service of later slices checks PocsGate.Enabled(config) on each pass and does nothing. CallerIdentity and the
    identity answer stay unchanged: the dashboard learns the switch from GET /api/pocs itself (200 = on and readable, 404 =
    off, 403 = not permitted), which it can call with or without a token, so an installation without sign-in shows the
    item too. The PoCs settings form shows the switch first; the other fields are editable while it is off.
    ENTITIES (Persistence/Entities, EntityBase): Poc — Id long, Name (DNS label), LiveName (= Name while the PoC is not
    deleted, null once deleted; only 2026-11-23-c81ed's settled delete clears it, so a deleted PoC frees its name and
    host), Project (the owner's
    poc- project key), Target, Folder ('<root>/<project>/<name>', copied at creation so a later settings edit never moves
    a folder), Owner (principal per SpecDialogOwnership.PrincipalOf), OwnerName (display), State (PocStates, the full
    set, constants only, later slices write them: importing and refused (933db), blocked (933dc), ready and failed
    (2026-11-23-c81ec), stopped and deleted (2026-11-23-c81ed); PocStates.IsLive = not refused and not deleted, so
    importing, ready, blocked, stopped and failed are live — the one definition the per-person limit and the name check
    read; a blocked PoC that never deployed stays live, holding its name and a per_person_limit slot, until
    2026-11-23-c81ee removes it through c81ed's poc-delete once its upload is purged after pocs.blocked_retention_days
    (7), so no second definition and no second way to free a name exist), DESIRED STATE read by every render
    and changed only by the acts of 2026-11-23-c81ea..e: Replicas (int, default 1), Revision (int?, the revision the
    GitOps manifest names), ImageDigest (string? 'sha256:<64 hex>', 71); ExpiresAtTicks (nullable; written ONLY by the
    extend run of 2026-11-23-c81ee, null meaning CreatedAt + the target's lifetime_days), LastRunId. PocAuditEntry — Id, PocId, AtTicks, Actor, Act (PocActs: imported, overruled,
    deployed, stopped, started, rolled-back, deleted, extended, expired), Reason (nullable, 500), RunId (nullable);
    written ONLY by the run event projection of the slice that adds the act (933dc overruled onwards), kept when runs are
    deleted. Configurations in ServerStateConfigurations; Poc unique (Target, LiveName) (SQL Server filtered IS NOT NULL,
    SQLite and PostgreSQL allow several NULLs), index (Project); PocAuditEntry index
    (PocId, AtTicks) and unique (RunId, Act) (filtered IS NOT NULL on SQL Server), so every later act projection
    (933db imported, 933dc overruled, the c81e series) inserts nothing on a replay. Migration AddPocs on SQLite, SQL Server, PostgreSQL; archive table counts updated.
    ProjectScopeQueries gains a Poc Within overload written like the Run one (Hidden honoured). PocRepository:
    ListAsync(ProjectScope scope, ct) through .Within(scope), FindAsync(id); PocAuditRepository: ListAsync(pocId). No PoC
    write path in this slice (933db's admission writes the first rows).
    SETTINGS: singleton pocs (ConfigDocTypes.Pocs, PocsConfig in Contracts/Models/Configuration): enabled; project_agent
    and project_tracker (the agent and tracker every provisioned poc- project names, because a project without either does
    not resolve); targets List<PocTargetConfig>. PocTargetConfig: name; source_repo (a string: an exact project repo ref, catalog name or
    connection/name, the same means a project names its repos, without the mapping form; a local working copy is
    refused by 933dd because its host runs no pipeline); root (default 'pocs'; a PoC's source folder is <root>/<project>/<poc>/); deploy_root (default
    'deploy'; 2026-11-23-c81eb writes <deploy_root>/<poc>/); template_path (default 'poc-template'; 933dd and
    2026-11-23-c81eb write it); domain_pattern (placeholder '{app}.poc.example.internal' shown only as a placeholder, no
    value default); lifetime_days (90); reminder_days ([14, 7, 1]); per_person_limit (3; 933db refuses a new PoC past
    it, pocs.admin excepted). PocsConfig.Problems(): duplicate or non-DNS target name; empty source_repo, or one containing '*' (a glob would
    bind a poc- project to many repos; the sentence names pocs.targets[].source_repo and the value); root,
    deploy_root or template_path absolute, holding '..', a backslash or an empty segment, or one inside another;
    domain_pattern without exactly one {app} or not a host pattern; lifetime_days < 1; a reminder day < 1 or >=
    lifetime_days; per_person_limit < 1; enabled with no target, no project_agent or no project_tracker — each sentence
    names key, value and reason. Read by PocsConfigValidator (listed in AgentSmithConfigValidator, Field 'pocs') at the
    load and by a PocsConfig arm in SettingsBlockRule (Problems and Validate) at the settings save and the import.
    Cross-entity references (source_repo resolves through the repos catalog or a connection; project_agent and
    project_tracker exist) are load findings naming the key (PocTargetReferences, the one home of every target
    reference finding: 933de adds its arm 'registry.pull_auth names a catalog secret' there, naming
    pocs.targets[].registry.pull_auth; 933de also makes PocsConfig.Problems() report, per target, a missing registry
    block and the problems of its registry block, so Problems() is the one home of per-target value rules) — a singleton carries no reference
    edges, so deleting that agent or tracker is not refused while no poc- project exists; once one exists, the project's
    own agent and tracker edges refuse the delete. Schema entries, agentsmith-yml.md row, configure-it page.
    PERMISSIONS (all global-only; ProjectScopable unchanged): pocs.read (open the PoCs area, list and read the PoCs one
    can see), pocs.write (import a new PoC into one's own poc- project and act on one's own PoCs), pocs.overrule (lift a
    vulnerability block, 933dc), pocs.admin (act on every PoC and past the owner limits: per-person limit, extensions).
    Built-in role poc = [pocs.read, pocs.write, identity.read]; operator bundle gains pocs.read; admin holds all four
    through All; reader none.
    VISIBILITY through projects, not an owner axis: a PoC is seen by whoever holds runs.read in its Project (globally or
    by the binding 933db writes for poc-<person> with the built-in reader role). ProjectFrom.Poc (route value 'pocId',
    ProjectSourceKind.Poc, resolved by ResourceProjectReader.PocAsync to the PoC row's Project, missing row = Missing)
    joins the guard's route-value kinds. Every PoC-keyed route of the series, API and dashboard, is keyed by id —
    /api/pocs/{pocId:long}/... and /pocs/{pocId}/... — never by name, because a deleted PoC's name can be taken again;
    the literal segments uploads, import and targets never match it. The first route using it is 933dc's revision read, and this slice proves it with
    a resolver unit test. PoC-keyed read routes need pocs.read + runs.read InProject(ProjectFrom.Poc), so a foreign PoC
    answers the empty 404 of 4a4d. Acting (933db onwards) goes through PocActAccess.MayAct(user, poc): true when nothing
    is enforced; else pocs.admin globally; else pocs.write held plus runs.read granted by a BINDING of poc.Project, asked
    through a new ProjectAccess member HoldsByBindingIn(user, permissions, project) that applies the configured-project
    check (a binding of a project no longer configured grants nothing) — so a person holding global reader and the poc
    role reads every PoC but acts only on their own. Runs, logs and hub events of a PoC are the poc- project's and need
    nothing new.
    ENDPOINT: GET /api/pocs (pocs.read, no project source, so the global check) -> the PoCs within
    CallerProjectScope.For(user, runs.read) (handles 'nothing enforced', global holders and the hidden installation):
    name, project, target, host from domain_pattern, state, owner name, last run id; plus may_import (!Enforcing || HoldsEverywhere(user, [pocs.write]), so an installation without sign-in imports)
    for the button and targets [{name, source_repo, root}] for the target strip, which every pocs.read holder sees (no
    config.read needed; no secret or connection detail beyond the repo ref). route-permission-baseline.tsv gains
    'GET /api/pocs pocs.read -'.
    DASHBOARD: /pocs page — header, Import ZIP button (disabled with 'arrives with import' until 933db), state pills, empty
    state, the target strip from the answer's targets with 'Target settings' only for config.read holders; cards per the
    mock (name, host, state dot, owner, run). Sidebar: a PoCs item when GET /api/pocs answers 200; the order is Pull
    requests, Deployments (2026-11-23-8df6a), PoCs — whichever of the two specs lands second keeps it; every other item
    hidden when the identity is known and lacks its permission (runs.read anywhere for the work items and Insight,
    dialog.write anywhere for Work it out); a PoC-only caller (pocs.read, no global runs.read, and every project holding
    runs.read is a poc- project) sees only PoCs, not New work and not the Recent group, and lands on /pocs from /. FIXED_PLACES gains '/pocs'. Settings: a PoCs form in the settings rail
    (switch, project agent and tracker selects, targets with the fields above, source_repo picked like a project repo).
    All new strings through useT() with German.
  out: "Import, archive limits, project provisioning and the different-app guard (933db). Scan policy and overrule (933dc). Registry fields (933de). Pipeline build (933dd). Variables and pull secret (933dg). The PoC write path, app template, GitOps commit, Argo CD, rollout, lifecycle acts, detail page, lifetime enforcement and reminders (2026-11-23-c81ea..e, replacing the withdrawn 933df and 933dh). Components 1..n (the table holds one image per PoC; a component table is a later spec). Creating repositories."

steps:
  - id: entity
    action: "Poc (with LiveName and the desired-state fields), PocStates (the full set + IsLive), PocAuditEntry, PocActs, configurations (ServerStateConfigurations lines), ProjectScopeQueries Poc overload, PocRepository, PocAuditRepository; migrations AddPocs x3; archive table counts updated."
  - id: settings
    action: "PocsConfig + PocTargetConfig with Problems(); RawAgentSmithConfig.Pocs; AgentSmithConfig.Pocs and its ResolvedConfigComposer line (PocsConfigValidator and PocTargetReferences read AgentSmithConfig); ConfigDocTypes.Pocs + taxonomy singleton entry; PocsConfigValidator in AgentSmithConfigValidator; PocsConfig arm in SettingsBlockRule.Problems and Validate; PocTargetReferences (load findings); schema; docs."
  - id: permissions
    action: "Permissions.PocsRead/PocsWrite/PocsOverrule/PocsAdmin in All (not ProjectScopable); BuiltInRoles.Poc bundle; OperatorBundle gains PocsRead; capability descriptor serves them."
  - id: access
    action: "ProjectFrom.Poc + ProjectSourceKind.Poc + ResourceProjectReader.PocAsync + the guard's RouteValueKinds; ProjectAccess.HoldsByBindingIn; PocActAccess.MayAct; PocsGate filter; PocListEndpoints GET /api/pocs; route-permission-baseline.tsv row."
  - id: dashboard
    action: "app/pocs/page.tsx, components/pocs (PocList, PocCard, PocTargetStrip, PocEmpty), lib/pocsApi.ts; usePocsFeature (GET /api/pocs status); sidebarItems(identity, pocs) function (keeps AppSidebar from growing) + landing redirect; places.ts '/pocs'; settings rail key pocs + PocsSettingsForm; messages.ts keys."

tests:
  - "PocsConfig.Problems: a source_repo containing '*' is refused naming pocs.targets[].source_repo and the value; each rule refused with a sentence naming key and value; enabled without a target, agent or tracker refused; a sound single target passes"
  - "PocsConfigValidator: a broken pocs block is a Blocking finding with Field 'pocs'; SettingsBlockRule refuses saving and importing it"
  - "PocTargetReferences: an unknown source_repo, project_agent or project_tracker is a finding naming the key"
  - "PocsGate: pocs.enabled false -> GET /api/pocs answers an empty 404 for an admin; true -> 200"
  - "PocRepository.ListAsync: a scope of projects returns only those projects' rows; Everything returns all; a hidden project's rows are left out"
  - "ProjectAccess.HoldsByBindingIn: a binding of a configured project holds; the same binding after the project left the configuration does not; a global hold alone does not"
  - "PocActAccess.MayAct: binding-granted runs.read + pocs.write on the PoC's project acts; global reader + poc role on another person's PoC does not; pocs.admin acts everywhere; nothing enforced acts"
  - "ProjectSourceResolver / ResourceProjectReader.PocAsync: a pocId resolves to the row's Project; an unknown id is Missing"
  - "Server HTTP (enforcing): a poc-role caller bound to poc-ann lists only poc-ann's PoCs (poc-bob's row is missing from the list); an operator lists all; a reader is 403; the answer carries targets and may_import"
  - "Server HTTP (not enforcing, no token): GET /api/pocs answers 200 with may_import true when enabled and an empty 404 when off"
  - "RouteProjectScopeGuardTests stays green with ProjectFrom.Poc among the route-value kinds and GET /api/pocs declaring no project source; RoutePermissionGuardTests matches the baseline row"
