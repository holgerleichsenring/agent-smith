# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-933da
goal: "PoCs become an optional feature: a pocs switch, the Poc and PocAuditEntry model, a source-repo target, four PoC permissions with project-based visibility, and an empty PoCs page."

applies_to: "default (persistence entities + migrations on three providers, pocs settings singleton, permission catalog, PoC project source, PoC list endpoint, feature switch, schema, docs) + dashboard (PoCs page, sidebar and landing gating, pocs settings form)"

requires: [2026-10-15-4a4db, 2026-10-15-4a4dd]

upgrade_impact: "Additive and off by default: pocs.enabled absent reads false, so no sidebar item, every /api/pocs route answers an empty 404 to a caller holding the route's permissions (a caller without them gets the 403 authorization gives first) and no PoC hosted service acts. Two new tables (Pocs, PocAuditEntries; migrations on SQLite, SQL Server, PostgreSQL). Four catalog permissions, held by admin through Permissions.All; the operator bundle gains pocs.read; a new built-in role poc. ProjectScopable is unchanged. The sidebar starts hiding items a known caller cannot read (an identity without runs.read anywhere no longer sees Tickets, Runs, Pull requests, Your move, Overview or Delivery, one without dialog.write anywhere no longer sees Work it out, and a PoC-only caller no longer sees New work or Recent; today they show and answer 403/404). A stored custom role named 'poc' (any case) is ignored by the role catalog once poc is built in, so it stops granting anything and must be renamed; the load finding names it. PermissionCatalogServedTests' built-in role list grows by poc; route-permission-baseline.tsv gains GET /api/pocs."

