# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-22-e812
goal: "A ticket text agent-smith rewrote inside a run never reads as a person's edit between attempts or in the between-attempts check."

applies_to: "default (RunAttempt, RunAttemptProjection, ConversationRunEntries, TicketTrackerObserver)"

requires: [2026-11-22-a720b]

facts:
  - claim: "The attempt row keeps the fingerprint of the ticket its run fetched, set once."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunAttemptProjection.cs:20,29"
  - claim: "The conversation draws an 'edited' entry, role person, wherever two attempts' fetched fingerprints differ."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/Conversation/ConversationRunEntries.cs:66-81"
  - claim: "The between-attempts check compares the tracker's text with the failed attempt's fetched fingerprint."
    evidence: "src/backend/AgentSmith.Server/Services/Tickets/Checks/TicketTrackerObserver.cs:41"
  - claim: "Since 2026-11-22-a720b a run that applies a newly approved revision rewrites the ticket's text after it fetched it."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/ApprovedTicketText.cs:25-45"

scope:
  in: "The attempt records the fingerprint of the text it left behind (the published set's, when its run rewrote the ticket) beside the fetched one; the edited entry compares an attempt's left fingerprint with the next attempt's fetched one, and the between-attempts check compares with the left one."
  out: "The amend run, which rewrites a ticket no attempt worked."

steps:
  - id: record
    action: "SpecSetPublishedEvent carries the set's TicketFingerprint; RunAttempt gains the left fingerprint (migration on every provider); the projection writes it."
  - id: read
    action: "ConversationRunEntries.Edits and TicketTrackerObserver read the left fingerprint, falling back to the fetched one."

tests:
  - "An attempt that rewrote the text followed by one that fetched it shows no edited entry; a person's edit between them still does"

done:
  - "Only a person's edit of the ticket text reads as an edit on the ticket page."
