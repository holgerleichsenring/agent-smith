# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-4778
goal: "A design turn's master runs commands in a fresh work clone per repository and turn (git, builds, tests, the PoC), where no credentialed step follows the model and which ends with the turn."

applies_to: "default (Application: work clones, design tool surface; Server: design-turn runner, sandbox factories; skills: design-partner-master)"

facts:
  - claim: "A design turn's repositories are lazy read-only source scopes the runner opens per conversation and holds between turns."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnRunner.cs:49-51; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandboxFactory.cs:25-36"
  - claim: "A source scope serves the four reads, the programs git, find and curl, and writes under declared prefixes (none by default); a model's shell command is refused."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefusal.cs:33-59; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeProgramAllowance.cs:23-26; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandbox.cs:34-35,48"
  - claim: "A held scope reports the sha it landed on."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandbox.cs:42,57-62"
  - claim: "A scope builds its sandbox spec with no language and no pipeline name: light profile, and an image from the chain without a language. The project's toolchain_image or resources override still wins, else the generic git image."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeOpener.cs:51-53; src/backend/AgentSmith.Application/Services/Sandbox/SandboxImageChain.cs:8-11; src/backend/AgentSmith.Application/Services/Sandbox/SandboxResourceResolver.cs:46-54"
  - claim: "A coding run's sandbox carries the project's sandbox secrets and an unrestricted shell."
    evidence: "src/backend/AgentSmith.Application/Services/Builders/SandboxSpecBuilder.cs:60; src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:20-26"
  - claim: "A coding run takes its toolchain image per repository from the contexts the language resolver discovers, grouped root first."
    evidence: "src/backend/AgentSmith.Application/Services/PipelineSandboxCoordinator.cs:86-105"
  - claim: "The repository credential rides only on the server's own git steps as GIT_TOKEN in the step env. Git still reads the repository's .git/config, hooks and $HOME config when those steps run. A clone step times out at 300 s."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:12-22; src/backend/AgentSmith.Application/Services/Handlers/CheckoutStepFactory.cs:15,32-41"
  - claim: "The design surface filters the BootstrapDiscover set, which holds no run_command and no write tool, to four reads; a child gets the same reads by an allowlist."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/AgenticToolSurface.cs:77-89; src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:570-578; src/backend/AgentSmith.Application/Services/Tools/SpecDialogChildTools.cs:17-21"
  - claim: "The coding run_command says its work lands as a reviewable branch/PR."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:509"
  - claim: "Evidence checks read the sandboxes in ContextKeys.Sandboxes: once per draft before the rounds, again after a revision changed a draft."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/Review/ProposalReviewLoop.cs:35-36; src/backend/AgentSmith.Application/Services/Specs/Review/ProposalRoundRevision.cs:42-46,61; src/backend/AgentSmith.Application/Services/Specs/Review/SpecRoundEvidence.cs:28-29; src/backend/AgentSmith.Application/Services/Specs/Review/SpecReviewRepositories.cs:38"
  - claim: "A reference: citation resolves inside the upload's container, which run_in_reference can write."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/Review/ReviewReferences.cs:20-23; src/backend/AgentSmith.Application/Services/Tools/ReferenceCommandToolHost.cs:24-27"
  - claim: "run_in_reference is offered only where the runtime spawns containers. The in-process backend, the fallback without Kubernetes or a Docker socket, runs a step as a process of the server's own user."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/ReferenceDesignTools.cs:31; src/backend/AgentSmith.Server/Services/Sandbox/ServerSandboxExtensions.cs:102-104; src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:157-160"
  - claim: "Docker sandboxes mount host-wide package-cache volumes that outlive every sandbox; the upload container spawns through the same path."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxFactory.cs:35; src/backend/AgentSmith.Server/Services/Sandbox/DockerPackageCaches.cs:9-13; src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetSandbox.cs:104"
  - claim: "The sandbox bus falls back to one shared credential, either installation-wide or for a single job whose ACL SETUSER fails."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/SandboxBusCredentials.cs:15,36-38"
  - claim: "runs.control and dialog.write are bindable per project; a dialog turn's approval already checks runs.control in the conversation's projects."
    evidence: "src/backend/AgentSmith.Server/Security/Permissions.cs:78-82; src/backend/AgentSmith.Server/Security/DialogMessageScope.cs:10-14"
  - claim: "SpecDialogTurnRunner has 120 lines, exactly the ratchet's MaxLines, and is not in the baseline; MasterToolComposition has 118."
    evidence: "tests/AgentSmith.Tests/Architecture/FileLengthRatchetTests.cs:19; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnRunner.cs; src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs"
  - claim: "The turn's poster already carries whether it holds runs.control."
    evidence: "src/backend/AgentSmith.Server/Models/TurnPoster.cs:9-10; src/backend/AgentSmith.Server/Security/DialogMessageScope.cs:29-33"
  - claim: "A coding run gets one sandbox per toolchain image of a repository."
    evidence: "src/backend/AgentSmith.Application/Services/PipelineSandboxCoordinator.cs:101-115"

scope:
  in: "A WORK CLONE per scoped repository, opened lazily on the master's first run_command for that repository in a turn and disposed when the turn ends. The held scope is materialised first. The clone is the one credentialed step: --depth 50 --single-branch by default, or full history when the master asks with history: full on that first call. It then checks out the held scope's ResolvedSha detached, with no credential. If the sha is missing, the call fails closed and says why. No server git step runs in the clone afterwards. It runs the repository's resolved toolchain image with build sizing and the project's sandbox secrets, like a coding run, mounts no shared package cache, and carries RunId with no ConversationId, so the reapers treat it as the run's. A turn-resources owner (DesignTurnResources) holds the turn's scopes and its WorkCloneSet and disposes both, which makes SpecDialogTurnRunner shorter. The WorkCloneSet reaches the pipeline through PipelineRequest.Context, as the sandboxes do. A spawn whose issued bus credential is the shared one fails closed and says why. DesignWorkToolHost gives the master run_command, with a description of its own. The read tools, evidence checks and reviewers keep reading the held scopes. The upload spawn gets no package caches either. The work tools are offered only when all three hold: the runtime spawns containers; a Contracts-level port (ISandboxBusIsolation) says the bus is not shared; and the turn's poster may start runs (TurnPoster.MayStartRuns, seeded as a ContextKey by SpecDialogTurnSeeds.Build). A DesignWorkToolGate type decides this, outside MasterToolComposition."
  out: "Children get no run_command; only the master runs, so builds run one at a time. There is no write_file and no edit, because the shell edits. LFS objects and submodules are not fetched. One image per repository, root first: a second stack in the same repository installs what it needs, where a coding run would get its own sandbox per image. Capacity is not limited beyond today's: each repository a turn runs in costs one build-sized pod for that turn. Templates, series verification and derivation scopes are unchanged. Named follow-ups, in prose: hardening the server's credentialed git steps for coding runs (GIT_CONFIG_GLOBAL=/dev/null, an empty credential.helper before the server's own, core.hooksPath=/dev/null, no stored token); withholding coding runs' shells while the bus is on its shared credential; and having the review read a reference: citation from the stored upload instead of the writable upload container. Masking (2026-09-28-23a2b) and the network policy (2026-09-28-23a2d) are the mitigations shared with coding runs. Both are planned, not built: today neither a coding run nor a turn has them."

decisions:
  - key: "FRESH PER TURN, BY CONSTRUCTION. A model-touched container keeps .git/config helpers, hooks, insteadOf, ~/.gitconfig, a git on PATH and nohup processes, so any later credentialed step there would run under them. This clone's only credentialed step precedes the model, and the clone is gone at turn end. Resetting a held tree was rejected for that reason."
  - key: "TWO TREES ON ONE COMMIT. Reads, evidence and reviewers stay on the held scope; the work clone checks out the held scope's sha, so both show the same commit. Reviews never read the master's edits, so no review step needs a hook. A missing sha fails closed instead of running on a different commit. The skill says to cite only what the read tools show."
  - key: "SAME RIGHTS AS A CODING RUN, SECRETS INCLUDED. The operator's call. A coding run already reads uploads, holds the project's secrets and has a shell, so the exposure is the same in both. It is to be fixed for both by 23a2b, 23a2d and the git-step hardening follow-up, all still planned, not by limiting turns."
  - key: "THE SAME PERSON'S RIGHT. dialog.write is bindable per project, so a writer could otherwise get a shell holding secrets. The work tools need runs.control on the project from the person whose message drives the turn: the person who could start a coding run, checked the way approval is. On a platform where the sender maps to no identity, the tools are absent."
  - key: "CONTAINERS ONLY. On the in-process backend a shell is the server's own user, so the tools are absent there, as run_in_reference already is."
  - key: "PER-JOB BUS ONLY, CHECKED TWICE. On the shared bus credential a shell could reach other jobs' channels. The gate reads the installation's state through a port, and the spawn checks the credential it was actually issued, because a single job can fall back alone."
  - key: "DEPTH BEFORE THE CLONE. Deepening later would need a credentialed step in a model-touched container, so the master chooses before: 50 commits by default, or full history as a fixed enum on its first call per repository. The clone runs under its own 300 s timeout, not run_command's. The person sees 'cloning <repo>' and then 'ready' in the turn's activity, as for a scope."
  - key: "NO SHARED CACHES, UPLOADS INCLUDED. The Docker cache volumes are host-wide and read-write. Work clones and the upload spawn mount none and pay a cold restore."
  - key: "ONLY THE MASTER RUNS, AND ONLY run_command. Builds run one at a time (the operator's call). write_file and edit were cut, because the shell edits and two writing paths would only duplicate each other."
  - key: "PROMPT ORDER KEPT, ONE CACHE COST ACCEPTED. The tool joins the end of the surface, and the skill's Orientation paragraph changes in place. Because the tool list depends on the poster, a turn by someone without runs.control after one by someone with it misses the cached tool prefix. That is accepted, because it is rare within one conversation."

steps:
  - id: clone
    action: "DesignTurnResources (holds the scopes and the WorkCloneSet, disposes both), WorkCloneSet (passed through PipelineRequest.Context) and WorkCloneSandbox. ISandboxBusIsolation in Contracts, implemented over SandboxBusCredentials; the spawn fails closed on a shared issued credential. ISandboxLanguageResolver is injected and resolves the root-first image (with ContextReadBranches.None) through the chain, project overrides first. Build sizing is an explicit argument to the resource resolver. The spec sets RunId, no ConversationId, and NoPackageCaches, which the Docker factory honours. The clone runs at the chosen depth with GIT_TOKEN in the step env, then a detached checkout of the held ResolvedSha, failing closed. Progress goes through the scope observer."
  - id: surface
    action: "DesignWorkToolHost.run_command(command, repo, history?: full, timeout_seconds?). Its description says this is a throwaway clone of the commit your reads show, gone after this turn, with nothing pushed or kept. DesignWorkToolGate decides the three conditions, reading the MayStartRuns seed. MasterToolComposition only asks the gate. SpecDialogTurnRunner disposes DesignTurnResources in its finally and ends shorter than it began. ReferenceSetSandbox spawns with NoPackageCaches. The run_in_reference text changes."
  - id: skill
    action: "design-partner-master Orientation: cite what the read tools show. Run, build, test and git log in your work clone to check a claim. Ask for history: full on the first run when you need more than the last 50 commits. The clone is fresh each turn, and nothing you change leaves it. Release and bump the pin."
  - id: tests
    action: "Pin the step order, the depth, the sha, the labels, the gates, and the surfaces."

tests:
  - "WorkClone_RecordingSandbox_ExactlyOneStepCarriesTheToken_BeforeEveryModelStep"
  - "WorkClone_DefaultDepth50_HistoryFullClonesWithoutDepth"
  - "WorkClone_ChecksOutTheHeldScopeSha_MissingShaFailsClosed"
  - "WorkClone_Spec_CarriesRunIdNoConversationIdNoPackageCaches"
  - "WorkClone_Spawn_UsesResolvedImageBuildSizingProjectSecrets"
  - "WorkClone_DisposedAtTurnEnd_NextTurnClonesFresh"
  - "ReferenceSet_Spawn_HasNoPackageCaches"
  - "DesignWorkTools_InProcessRuntime_Absent"
  - "DesignWorkTools_SharedBusCredential_Absent"
  - "WorkClone_IssuedSharedBusCredential_FailsClosed"
  - "DesignTurnResources_Dispose_DisposesScopesAndWorkClones"
  - "DesignWorkTools_SenderWithoutRunsControl_Absent"
  - "ProposalEvidence_AfterMasterRun_ReadsTheHeldScope"
  - "SpecDialogSurface_ChildHasNoRunCommand"

done:
  - when: "a design turn's master, allowed to run, runs `git log -p` or the repository's test command"
    then: "it gets the output from a fresh clone of the commit its reads show, on the repository's toolchain image"
  - when: "the master planted a credential helper, a hook or a fake git in its work clone"
    then: "no step that carries the token runs after it, and the next turn starts from a new clone"
  - when: "the runtime is in-process, the bus is shared, or the sender lacks runs.control on the project"
    then: "the turn has no run_command and reads as before"
  - "A child has no run_command; templates and non-design scopes behave as before."
  - "Skill released, pin bumped; build green, full suite green."
