# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-4778
goal: "A design turn runs commands and writes in its scoped repositories as a coding run does (git, builds, tests, the PoC) in a tree reset to the remote before every turn and review, with nothing pushed."

applies_to: "default (Application: source scopes, tool surface, proposal review; Server: design-turn runner; skills: design-partner-master)"

facts:
  - claim: "A design turn's repositories are lazy source scopes the runner opens per conversation and holds between turns."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnRunner.cs:49-51; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandboxFactory.cs:25-36"
  - claim: "A source scope serves the four reads, the programs git, find and curl, and writes under declared prefixes (none by default); a model's shell command is refused."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefusal.cs:33-59; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeProgramAllowance.cs:23-26; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandbox.cs:34-35,48"
  - claim: "A scope spawns the generic git image at the light resource profile, because it builds its spec with no language and no pipeline name."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeOpener.cs:51-53; src/backend/AgentSmith.Application/Services/Sandbox/SandboxResourceResolver.cs:53-54"
  - claim: "A coding run takes its toolchain image per repository from the contexts the language resolver discovers, grouped root first."
    evidence: "src/backend/AgentSmith.Application/Services/PipelineSandboxCoordinator.cs:86-105"
  - claim: "A scope clones one branch at depth 1 and refreshes a held tree with a depth fetch and a hard reset, which leaves untracked files in place."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CheckoutStepFactory.cs:32-33; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefresh.cs:44-58"
  - claim: "The repository credential rides only on the server's own git steps as GIT_TOKEN in the step env, through a helper that writes nothing to disk."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:12-22"
  - claim: "The design surface is read_file, grep_in_tree, find_files and directory_tree; a child gets the same reads by an allowlist."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/AgenticToolSurface.cs:77-89; src/backend/AgentSmith.Application/Services/Tools/SpecDialogChildTools.cs:17-21"
  - claim: "The coding surface's run_command is an unrestricted shell in the sandbox, which already carries the project's sandbox secrets."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:20-26,550-563; src/backend/AgentSmith.Application/Services/Builders/SandboxSpecBuilder.cs:60"
  - claim: "The proposal review (evidence check, then reviewers) reads through the same sandboxes inside the turn."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/SpecDialogProposalReview.cs:27,54,74"
  - claim: "Uploads already run in their own container through run_in_reference, whose text says repositories stay read-only; the skill says the same."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/ReferenceCommandToolHost.cs:24-27; agent-smith-skills skills/_masters/design-partner-master/SKILL.md:82-83 (v5.25.4)"

scope:
  in: "Scope repositories of a design turn only. They open as executable scopes on their toolchain image with build sizing and full single-branch history, serve every step kind, and are reset to the remote before each turn and before each review pass. The master gets the coding filesystem set: run_command, write_file, edit and multi_edit. Children get run_command beside their reads. The design-partner skill and the run_in_reference text say what the turn can run."
  out: "Templates, series verification and derivation scopes stay read-only. No push or gh step exists, and no tool publishes from the tree. Masking (2026-09-28-23a2b) and the sandbox network policy (2026-09-28-23a2d) are shared mitigations for both runs, not prerequisites."

decisions:
  - key: "EXECUTABLE SCOPE, NOT A CODING SANDBOX. The held scope already spans turns (2d11b) and is cloned once per conversation. A run-style PipelineSandboxCoordinator per turn was rejected: it clones every turn and drags CommitAndPR wiring into a run that commits nothing."
  - key: "THE SAME BOUNDARY AS A CODING RUN. b7e2 chose named tools because the sandbox holds registry tokens and has an open network. The coding run's shell already sits in that sandbox, so the design turn gets the same shell under the same mitigations. Keeping it read-only would protect nothing the coding run does not already expose."
  - key: "NOTHING LANDS BY CONSTRUCTION. The repository token reaches only server-built git steps, so a model's push or private fetch has no credential. The tree is reset to the remote before each turn. A 'no push' refusal list was rejected (a list guesses at names; the missing credential does not)."
  - key: "RESET AT EVERY READ BOUNDARY. git reset --hard plus git clean -fd before each turn and before each review pass, so evidence and reviewers read the remote's tree, never the master's edits. Ignored files (venv, node_modules, bin/obj) survive as build caches. -fdx was rejected: it re-installs every turn. A separate scratch copy was rejected: reads and runs would disagree about which tree they see."
  - key: "ONE IMAGE PER REPOSITORY, ROOT FIRST. A design turn spawns one sandbox per repository, on the image of its first toolchain group. A second stack in the same repository installs what it needs through run_command. One sandbox per group, as coding does, was rejected: it multiplies pods for a look. Build sizing is reserved only while the hold lasts; the existing idle rail reaps it as it reaps a light scope today."
  - key: "FULL HISTORY FOR THESE SCOPES ONLY. git log -p is part of looking. b41d's shallow clone stays for every other scope. The held clone is paid for once per conversation, and its refresh fetches without depth so it never turns shallow."
  - key: "CHILDREN RUN, ONLY THE MASTER WRITES. Children read the PoC and the code, and running tests is reading. Two children writing one tree would race, so writes stay with the master. Two children building one repository at once can still collide in its build output, so the skill says one child runs a repository's build."
  - key: "PROMPT ORDER KEPT. The tool list and the skill's Orientation paragraph change in place; no section moves (caching)."

steps:
  - id: scope
    action: "SourceScopeSandboxFactory.Create takes an executable flag; only SpecDialogTurnRunner sets it for scope repos. An executable scope skips SourceScopeRefusal, spawns with the repository's root-first toolchain image and build sizing (an explicit argument to the resource resolver, never a borrowed pipeline name), clones single-branch without depth, and refreshes without depth."
  - id: reset
    action: "PrepareAsync on a held executable tree runs reset --hard and clean -fd after the refresh (on the pin when one is named). SpecDialogProposalReview resets every executable scope before the evidence check and before each round's panel."
  - id: surface
    action: "AgenticToolSurface.SpecDialog adds run_command, write_file, edit and multi_edit. SpecDialogChildTools adds run_command. Fix the run_in_reference description's 'repositories stay read-only'."
  - id: skill
    action: "agent-smith-skills design-partner-master Orientation: the scoped repositories are working clones, reset before each turn. Run, build, test and git log there to check a claim instead of assuming it; nothing you change leaves the clone. Release and bump the pin."
  - id: tests
    action: "Pin the scope mode, the reset, the surfaces and the absent credential."

tests:
  - "ExecutableScope_ShellCommand_IsServed"
  - "ReadOnlyScope_ShellCommand_IsStillRefused"
  - "ExecutableScope_Spawn_UsesRootFirstToolchainImageAndBuildSizing"
  - "ExecutableScope_HeldTree_IsResetAndCleanedBeforeTheTurn"
  - "SpecDialogProposalReview_ResetsExecutableScopesBeforeEvidence"
  - "ExecutableScope_ModelStep_CarriesNoGitToken"
  - "SpecDialogSurface_HasRunCommandAndWrites_ChildHasRunCommandOnly"

done:
  - when: "a design turn runs `git log -p` or the repository's test command in a scoped repository"
    then: "it gets the output, on the repository's toolchain image"
  - when: "a design turn wrote into a scoped repository"
    then: "the review and the next turn read the remote's tree; nothing reached the remote"
  - "Templates and every non-design scope behave exactly as before."
  - "Skill released, pin bumped; build green, full suite green."
