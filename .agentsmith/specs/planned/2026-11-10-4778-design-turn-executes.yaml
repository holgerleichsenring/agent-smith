# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-4778
goal: "A design turn's master runs and edits in a fresh work clone per repository and turn (git, builds, tests, the PoC), where no credentialed step follows the model and which ends with the turn."

applies_to: "default (Application: source scopes, design tool surface; Server: design-turn runner, Docker sandbox factory; skills: design-partner-master)"

facts:
  - claim: "A design turn's repositories are lazy read-only source scopes the runner opens per conversation and holds between turns."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnRunner.cs:49-51; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandboxFactory.cs:25-36"
  - claim: "A source scope serves the four reads, the programs git, find and curl, and writes under declared prefixes (none by default); a model's shell command is refused."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefusal.cs:33-59; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeProgramAllowance.cs:23-26; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandbox.cs:34-35,48"
  - claim: "A scope builds its sandbox spec with no language and no pipeline name, so it gets the light profile and an image from the chain without a language: the project's toolchain_image or resources override still wins, else the generic git image."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeOpener.cs:51-53; src/backend/AgentSmith.Application/Services/Sandbox/SandboxImageChain.cs:8-11; src/backend/AgentSmith.Application/Services/Sandbox/SandboxResourceResolver.cs:46-54"
  - claim: "A coding run's sandbox carries the project's sandbox secrets and an unrestricted shell."
    evidence: "src/backend/AgentSmith.Application/Services/Builders/SandboxSpecBuilder.cs:60; src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:20-26"
  - claim: "A coding run takes its toolchain image per repository from the contexts the language resolver discovers, grouped root first."
    evidence: "src/backend/AgentSmith.Application/Services/PipelineSandboxCoordinator.cs:86-105"
  - claim: "The repository credential rides only on the server's own git steps as GIT_TOKEN in the step env; git still reads the repository's .git/config, hooks and $HOME config when those steps run."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:12-22; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefresh.cs:44-58"
  - claim: "The design surface filters the BootstrapDiscover set, which holds no run_command and no write tool, to four reads; a child gets the same reads by an allowlist."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/AgenticToolSurface.cs:77-89; src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:570-578; src/backend/AgentSmith.Application/Services/Tools/SpecDialogChildTools.cs:17-21"
  - claim: "The coding run_command describes its work as landing as a reviewable branch/PR."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:509"
  - claim: "The design turn's evidence checks and look-based reads go through the sandboxes in ContextKeys.Sandboxes: once per draft before the rounds, again after a revision changed a draft."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/Review/ProposalReviewLoop.cs:35-36; src/backend/AgentSmith.Application/Services/Specs/Review/ProposalRoundRevision.cs:42-46,61; src/backend/AgentSmith.Application/Services/Specs/Review/SpecRoundEvidence.cs:28-29; src/backend/AgentSmith.Application/Services/Specs/Review/SpecReviewRepositories.cs:38; src/backend/AgentSmith.Application/Services/Specs/DerivationLookFactory.cs:75,109"
  - claim: "Docker sandboxes mount host-wide package-cache volumes that outlive every sandbox."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxFactory.cs:35; src/backend/AgentSmith.Server/Services/Sandbox/DockerPackageCaches.cs:9-13"
  - claim: "Uploads already run in their own container through run_in_reference, whose text says repositories stay read-only; the skill says the same."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/ReferenceCommandToolHost.cs:24-27; agent-smith-skills skills/_masters/design-partner-master/SKILL.md:82-83 (v5.25.4)"

scope:
  in: "A WORK CLONE per scoped repository, opened lazily on the master's first run or edit in a turn and disposed when the turn ends. Its first and only credentialed step is a full single-branch clone into a fresh container. The token is passed in the step env and never written to .git/config. No server git step runs in it afterwards. It runs the repository's resolved toolchain image with build sizing and carries the project's sandbox secrets, the same rights as a coding run. It mounts no shared package cache. A new design tool host gives the master run_command, write_file and edit over the work clones, with descriptions of their own. The read tools, the evidence checks and every reviewer keep reading the held read-only scopes in ContextKeys.Sandboxes, which no model step touches. The skill and the run_in_reference text say what the master can run."
  out: "Children get no run_command; only the master runs, so builds run one at a time. Templates, series verification and derivation scopes are unchanged. Masking (2026-09-28-23a2b) and the network policy (2026-09-28-23a2d) are the shared mitigations for coding runs and design turns alike, and neither is a prerequisite. A named follow-up hardens the server's credentialed git steps for coding runs too: GIT_CONFIG_GLOBAL=/dev/null, an empty credential.helper before the server's own, core.hooksPath=/dev/null, and no stored token. Holding a work clone across turns is not built here: that would bring back a model-touched container a later credentialed step could run in."

decisions:
  - key: "FRESH PER TURN, BY CONSTRUCTION. The review showed that a reset cannot clean a model-touched container: .git/config helpers, hooks, insteadOf, ~/.gitconfig, a git on PATH, and processes started with nohup all survive it, and the next credentialed fetch would run under them. A new container whose one credentialed step precedes the model, and which is gone at turn end, needs no reset. Resetting the held scope was rejected for that reason."
  - key: "TWO TREES, NOT ONE. Reads, evidence and reviewers stay on the held read-only scope (the remote's tree); runs and edits go to the work clone. The review then never reads the master's edits, wherever evidence is checked (ProposalReviewLoop and ProposalRoundRevision, both through SpecRoundEvidence and SpecReviewRepositories), and needs no hook there. The master's re-prompt between rounds (ProposalCutsReprompt) may run in its work clone again. TicketPlanReview checks ticket existence with the tracker, not a tree. The master reads its own edits with run_command. Making the work clone the only tree was rejected: evidence would cite planted files."
  - key: "SAME RIGHTS AS A CODING RUN, SECRETS INCLUDED. The operator's call. A coding run already reads uploads (run_in_reference), holds the project's secrets and has a shell, so the exposure is the same in both. It gets fixed for both (23a2b masking, 23a2d network policy, the git-step hardening follow-up), not by limiting turns. A withoutSecrets default and a per-project opt-in were rejected for that reason."
  - key: "THE THREAT IS SHARED. A model shell can plant a credential helper, hook, insteadOf, ~/.gitconfig or fake git that a later credentialed git step obeys. A coding run has the same exposure in its own container. This spec closes it for design turns by construction (no credentialed step after the model, fresh container per turn); coding runs get the git-step hardening follow-up."
  - key: "NO SHARED CACHES. The Docker package-cache volumes are host-wide and read-write, so a design turn could poison what the next coding run restores. Work clones mount none and pay a cold restore."
  - key: "FULL HISTORY, PAID PER TURN THAT RUNS. git log -p is part of looking, and a later deepen would need a credentialed step in a model-touched container. The clone is lazy, so a turn that only reads pays nothing."
  - key: "ONE IMAGE PER REPOSITORY. The root-first group's image, after the project's own overrides. A second stack installs what it needs through run_command. One sandbox per group was rejected: it multiplies pods for a look."
  - key: "ONLY THE MASTER RUNS. This is the operator's call: builds run one at a time. It also removes the race of two children building one tree."
  - key: "PROMPT ORDER KEPT. The tools are added at the end of the surface, and the skill's Orientation paragraph changes in place; no section moves (caching)."

steps:
  - id: clone
    action: "WorkCloneSandbox plus factory. ISandboxLanguageResolver is injected and resolves the root-first image (with ContextReadBranches.None) through the chain, project overrides first. Build sizing is an explicit argument to the resource resolver. Secrets come from the project, as in a coding run. SandboxSpec gets a NoPackageCaches flag, which the Docker factory honours. Clone with GIT_TOKEN in the step env and no depth. Dispose at turn end."
  - id: surface
    action: "DesignWorkToolHost: run_command, write_file and edit routed by repository name to the work clones. Its run_command description says this is a throwaway clone of the remote branch, gone after this turn, with nothing pushed or kept. SpecDialogTurnRunner opens the clones lazily and disposes them in its finally. Children unchanged. Fix the run_in_reference text."
  - id: skill
    action: "design-partner-master Orientation: read the remote's tree with the read tools. Run, build, test and git log in your work clone to check a claim instead of assuming it. The clone is fresh each turn; nothing you change leaves it. Release and bump the pin."
  - id: tests
    action: "Pin the clone, the credential, the spawn spec (secrets, no caches), the routing, and the surfaces."

tests:
  - "WorkClone_AgainstABareRemote_PlantedCredentialHelperAndHook_NeverSeeTheToken"
  - "WorkClone_AfterClone_NoServerGitStepRunsInIt"
  - "WorkClone_GitConfig_HoldsNoToken"
  - "WorkClone_Spawn_UsesResolvedImageBuildSizingProjectSecretsNoCaches"
  - "WorkClone_DisposedAtTurnEnd_NextTurnClonesFresh"
  - "ProposalEvidence_AfterMasterEdit_ReadsTheHeldScope"
  - "SpecDialogSurface_MasterHasWorkTools_ChildHasReadsOnly"

done:
  - when: "a design turn's master runs `git log -p` or the repository's test command"
    then: "it gets the output from a fresh clone on the repository's toolchain image"
  - when: "the master planted a credential helper, a hook or a fake git in its work clone"
    then: "no step that carries the token ever runs there; the next turn starts from a new clone"
  - when: "the master edited a file and the proposal is reviewed"
    then: "evidence and reviewers read the remote's tree"
  - "A child has no run_command; templates and non-design scopes behave as before."
  - "Skill released, pin bumped; build green, full suite green."
