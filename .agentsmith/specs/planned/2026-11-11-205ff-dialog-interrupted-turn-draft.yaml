# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-11-205ff
goal: "Every per-turn proposal a conversation stored stays in its view after later turns, including one from a turn whose replica died before writing a transcript turn."

applies_to: "default (Server: SpecDialogTurnProposals, SpecDialogTurnProposalStore; Dashboard: TurnResult)"

repos_touched: [agent-smith]

invariants:
  - "NO ORPHAN ROW. Every row in the per-turn proposal store of a conversation is rendered in its view: on the transcript turn carrying its run id, or as an interrupted turn of its own at its stored time."
  - "RUNNING IS ONE MORE CASE. The running run's draft is the interrupted-turn case while no turn carries it; RunningRunId being overwritten by the next turn loses nothing."

facts:
  - claim: "RunningRunId is written once per turn and overwritten by the next turn's grounding; nothing records the earlier one."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SessionTurnRunRecorder.cs:19-27"
  - claim: "The view attaches a stored proposal to the turn carrying its run id, and otherwise only to the current RunningRunId."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnProposals.cs:17-27"
  - claim: "A replica that dies mid-turn writes no Notice turn, so no transcript turn carries its run id."
    evidence: "inferred from 2026-11-10-d854c: Notice/Failure turns are written by the live process"

scope:
  in: "SpecDialogTurnProposals renders every stored row no transcript turn carries, ordered by its stored time, marked interrupted (or under review while that run computes). The store's read returns each row's time. TurnResult shows an interrupted turn with its draft and the line 'this turn stopped before it finished'."
  out: "Resuming the interrupted turn itself."

decisions:
  - "Render orphans rather than keep a run-id history column: the store already holds every row; the defect is only that the view filters them."

steps:
  - id: view
    action: "SpecDialogTurnProposals: orphan rows become interrupted entries; RunningProposal is the one whose run is live."
  - id: dashboard
    action: "TurnResult renders an interrupted entry."
  - id: tests
    action: "Pin the crash-then-next-turn case."

tests:
  - "TurnProposals_CrashedTurnThenNextTurn_BothDraftsInTheView"
  - "TurnResult renders an interrupted turn with its draft (vitest)"

done:
  - when: "turn A's replica dies after storing its draft and turn B then runs to completion"
    then: "GET the conversation returns A's draft as an interrupted turn and B's on its turn"
  - "Build green, full suite and dashboard tests green."
