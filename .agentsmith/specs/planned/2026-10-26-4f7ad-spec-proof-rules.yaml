# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-26-4f7ad
goal: "Specs pin current behaviour before changing it, state the upgrade impact on operators, and say what is proven live; review-spec and deliver-spec check them."

applies_to: "the specification-first-agentic-development plugin repository (create-spec, apply-spec, review-spec, deliver-spec, templates)"

requires: [2026-10-26-4f7ab]

facts:
  - claim: "A consolidation series started each change with a test pinning what every old copy did on the same inputs, with a was column, and recorded each changed outcome's reason."
    evidence: ".agentsmith/decisions/2026-10-26-cb25e.yaml:12; .agentsmith/decisions/2026-10-26-cb25a.yaml:10-12"
  - claim: "A PR body stated that deploying needs no infrastructure change and listed the opt-ins."
    evidence: "observed: 2026-10-26, gh pr view 769 --repo holgerleichsenring/agent-smith"
  - claim: "Every recent PR body had a not-proven-live section."
    evidence: "observed: 2026-10-26, gh pr view 768, 769, 772 --repo holgerleichsenring/agent-smith"
  - claim: "The spec schema allows no key it does not declare, and declares no upgrade or live-proof field."
    evidence: "spec-first:templates/spec.schema.json:7-8, 9-175"
  - claim: "create-spec's template and principles, review-spec's brief and deliver-spec's PR body carry none of the three."
    evidence: "spec-first:skills/create-spec/SKILL.md:39-87; spec-first:skills/review-spec/SKILL.md:31; spec-first:skills/deliver-spec/SKILL.md:51-56"

scope:
  in: >
    Two spec keys, upgrade_impact (string: what an operator must change on update; expected "nothing", anything
    else is opt-in or argued) and proven_live (string: what only tests prove and what a live check must show), in
    spec.schema.json, templates/spec.yaml and create-spec's template. Characterise first in create-spec's
    principles and apply-spec step 3: a spec that consolidates or changes existing behaviour first pins every
    current copy on one input matrix with a was column, then changes it, and records each changed outcome's reason
    in decisions/{id}.yaml. review-spec's brief asks whether upgrade_impact holds against the diff the steps imply.
    deliver-spec's PR body gains Upgrade impact and Proven live.
  out: "Making the keys required (older specs carry neither). A script that checks a characterisation matrix."

decisions:
  - key: "OPTIONAL KEYS. Required ones would refuse every spec written before 2.7.0."

steps:
  - id: schema
    action: "Add upgrade_impact and proven_live to spec.schema.json and templates/spec.yaml."
  - id: skills
    action: "create-spec template and principles, apply-spec step 3, review-spec brief, deliver-spec body."

tests:
  - "spec.schema.json still parses and accepts templates/spec.yaml and the two create-spec examples (one-off jsonschema run when available)."

done:
  - "A spec written from create-spec's template carries both keys, and the three skills name them."
