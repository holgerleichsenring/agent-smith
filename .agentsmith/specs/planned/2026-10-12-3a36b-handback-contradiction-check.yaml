# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36b
goal: "A contradiction hand-back parks only after a checker confirms it from the evidence it cites, and a stored one is derived again, still approved, once a scoped branch got foreign commits."

applies_to: "backend (spec derivation, hand-back)"

requires: [2026-10-12-3a36a]

facts:
  - claim: "observed: run 10-10 (rework on PR 9476) derived with two spec-derivation calls and two greps in Server, no spec-cut-reviewer call, and handed back RequirementsContradictRepository: 'SubmitAssetsRequest contains only TruckPlate and TrailerPlate'."
    evidence: "observed: 2026-10-12, RunLlmCalls + RunEvents of run 2026-10-12T10-10-33-3ee4"
  - claim: "observed: at that time the branch's SubmitAssetsRequest still declared ShipmentId and AccessLinkId; the reviewer removed them by hand at 10:20 (dd73f4a8)."
    evidence: "observed: 2026-10-12, AzDO items API at d497be40 and branch history of agent-smith/19470"
  - claim: "A non-question hand-back is case plus prose reason; the parser builds it with no evidence and no phases."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecDerivationEnvelope.cs:39-44, src/backend/AgentSmith.Application/Services/Specs/SpecDerivationEnvelope.cs:59-63, src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:66-73"
  - claim: "Evidence records carry repository, command and kind; a search's Path is its optional scope, usually null; phases cite evidence ids, an uncited phase fact is kept as an assumption, not re-asked."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/DerivationEvidence.cs:40-50, src/backend/AgentSmith.Application/Services/Specs/EvidenceRecord.cs:18-28, src/backend/AgentSmith.Application/Services/Specs/RepositorySearchTool.cs:36-60, src/backend/AgentSmith.Application/Services/Specs/FactResolver.cs:22-37"
  - claim: "The derivation prompt's hand-back shape is {case, reason}, served from the pinned skills catalog."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:43, src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:110-113, src/backend/AgentSmith.Infrastructure.Core/AgentSmith.Infrastructure.Core.csproj:54"
  - claim: "The cut reviewer returns Clean for a set without drafts, so a hand-back is never reviewed."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCutReviewer.cs:43"
  - claim: "The deriver loops parse → review with a re-ask, and grants a pinned set one extra attempt; with nothing kept the handler falls back to one phase."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:62, src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:72-96, src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:102-110"
  - claim: "A read-only look over the run's sandboxes exists (search + read, read capped at 16,000 chars, null without sandbox); PhasePremiseChecker is a checker of the same shape admitting a verdict by its own evidence id."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/DerivationLookFactory.cs:65-73, src/backend/AgentSmith.Application/Services/Specs/DerivationTools.cs:17-36, src/backend/AgentSmith.Application/Services/Specs/RepositoryFileReadTool.cs:20, src/backend/AgentSmith.Application/Services/Specs/PhasePremiseChecker.cs:26-60"
  - claim: "NeedsModel is a pure function of cause and set; an approved set under a Comment stops there, and a re-derive under Comment carries no approval into Finalize."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-52, src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:50-69, src/backend/AgentSmith.Application/Services/Specs/SpecRevisionHeader.cs:42"
  - claim: "Checkout merges the base branch into HEAD without --no-ff; our git identity is skipped where one already resolves; TicketSeries records one revision sha, for the carrying repo only."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/WorkBranchBaseMerger.cs:48, src/backend/AgentSmith.Application/Services/Sandbox/SandboxGitIdentity.cs:30-35, src/backend/AgentSmith.Infrastructure.Persistence/Entities/TicketSeries.cs:21-25"
  - claim: "The repeat guard runs in SpecHandbackHandler, a later command than the derivation, from the pointer's last case; Finalize stamps approval ?? set.Approval."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/SpecHandbackHandler.cs:55-56, src/backend/AgentSmith.Application/Services/Specs/SpecRevisionHeader.cs:42"
  - claim: "The repeat guard counts only replies."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecHandbackRepeat.cs:30-44"

assumptions: []

scope:
  in: "Everything the steps name."
  out: "Other hand-back cases; replies on the PR (3a36a); sandboxes committing under a foreign identity — the probe is skipped there and says so."

decisions:
  - key: "A SECOND READING, NOT A RULE: code semantics are a model's to check."
  - key: "CITES ARE ASKED FOR, NOT FORCED: an uncited contradiction is re-asked; on the last attempt it parks unchecked and is logged — it never falls through to the one-phase fallback."
  - key: "THE CHECKER RE-LOOKS: the cited looks plus its own fresh look — a grep has no file to re-read."
  - key: "REFUTED MEANS ONE MORE ATTEMPT, by a refuted flag of its own in the attempt bound beside pinned; a second contradiction is not checked again. No look, no check — logged."
  - key: "THE REMOTE HEAD AT PARKING IS THE REFERENCE: origin/<branch> per scoped repo, stored with the hand-back; none when the branch is not on the remote; a sha the clone does not know is skipped and logged, like a missing one."
  - key: "PROBE ONLY A HANDED-BACK SET: our provider-API commits (filing) carry the token's identity; stored heads are cleared when a revision that is not a hand-back is recorded."
  - key: "OURS BY EMAIL (SandboxGitIdentity.Email); a sandbox configured with another email skips the probe."
  - key: "EXPIRY NEVER APPROVES A GUESS: an expiry re-derive that yields nothing keeps the stored hand-back; the approval is carried only onto a derived set."
  - key: "THE RESET TRAVELS IN THE CONTEXT, from the probe to IsRepeat."

steps:
  - id: prompt
    action: "Add cites to the requirements_contradict_repository shape in agent-smith-skills spec-derivation-master SKILL.md; release; bump SkillsCatalogVersion and SkillsCatalogSha256."
  - id: cites
    action: "The parser parses cites and resolves them through DerivationEvidence.IndexById; the deriver re-asks when missing or unknown and parks unchecked on the last attempt."
    modify:
      - "SpecDerivationEnvelope.Handback, SpecDerivationParser, SpecSetDeriver"
  - id: checker
    action: "Between parse and review in SpecSetDeriver run a ContradictionChecker on the cited looks plus an OnTerms look; on Refuted set refuted (+1 attempt) and re-ask with the refutation."
    new:
      - "ContradictionChecker + admission by its own evidence id (shape of PhasePremiseChecker), reading cited records from look.Evidence.Looks"
    modify:
      - "SpecSetDeriver, DerivationLookTerms (ContradictionCheck: own prefix, CutReviewAllowance)"
  - id: heads
    action: "Store origin/<branch> per scoped repo as a JSON column HandbackHeads on TicketSeries at parking (migrations in both assemblies, carried on SpecSetPointer); clear on a non-hand-back revision."
    modify:
      - "TicketSeries, TicketSeriesRepository, SpecSetPointer, Db/InMemory pointer stores, SpecSetPointerRecorder, SpecHandbackHandler"
  - id: expiry
    action: "In DeriveSpecHandler before Decide, when the branch set is handed back, probe each scoped repo with git rev-list --no-merges <stored>..HEAD --not <baseRef> (base via SandboxBaseLadder.ResolveAsync), authors other than SandboxGitIdentity.Email; pass the bool to NeedsModel and into ContextKeys; carry the approval only onto a derived set."
    new:
      - "ForeignCommitProbe, ContextKeys.ForeignCommitSinceHandback"
    modify:
      - "DeriveSpecHandler, SpecAmendmentRule, SpecSourceResolver, SpecHandbackHandler, SpecHandbackRepeat"

tests:
  - "SpecSetDeriver_ContradictionWithoutCites_IsReAsked"
  - "SpecSetDeriver_UncitedOnLastAttempt_ParksUncheckedNotFallback"
  - "ContradictionChecker_ReasonContradictedByFile_Refutes"
  - "ForeignCommitProbe_BaseMergeAndOurCommits_AreNotForeign"
  - "ForeignCommitProbe_FastForwardedBase_IsNotForeign"
  - "ForeignCommitProbe_RepoWithoutStoredHeadOrUnknownSha_IsSkipped"
  - "ForeignCommitProbe_FilingAfterHandback_NotProbedWhenSetNotHandedBack"
  - "Expiry_ApprovedSet_ReDerivedSetStaysApproved"
  - "Expiry_DerivationFails_KeepsHandbackNoApprovedFallback"
  - "SpecHandbackRepeat_ForeignCommitSinceHandback_IsNotRepeat"

done:
  - "Replaying run 10-10's inputs (RealCompositionHarness, scripted false contradiction) yields a refutation and a second derivation, not a park."
  - "After a foreign commit in Server, the next run re-derives the approved set and the result is still approved."
  - "The skills release with cites is pinned."
