# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-11-205fg
goal: "A project memory reaches later prompts only as quoted data: its description is one line, its slug and author are bounded, and the concurrent upsert is proven on a real second connection."

applies_to: "default (Contracts: ProjectMemoryLimits; Application: MemoryRecallToolHost, ProjectMemoryWriteToolHost, MemoryWriteToolHost; Persistence: ProjectMemoryRepository)"

repos_touched: [agent-smith]

invariants:
  - "ONE-LINE DESCRIPTION. A stored project-memory description holds no line break; the write refuses one rather than rewriting the person's text."
  - "QUOTED IN EVERY RENDERING. Recall renders a project entry's description quoted like its body; index and recall agree."
  - "BOUNDED KEY. Slug and author are refused above the column bound (191) before the write, with a tool answer, never a database exception."

facts:
  - claim: "Recall prints entry.Description raw between the heading and the quoted body."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MemoryRecallToolHost.cs:84-91"
  - claim: "The design-turn write trims the description but keeps inner newlines."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/ProjectMemoryWriteToolHost.cs:41-44"
  - claim: "The coding-run write passes the description into a project record the same way."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MemoryWriteToolHost.cs:92"
  - claim: "The index quotes every line."
    evidence: "src/backend/AgentSmith.Application/Services/Memory/ProjectMemoryIndex.cs:22-24"
  - claim: "Limits refuse only description and body; slug and author columns are 191."
    evidence: "src/backend/AgentSmith.Contracts/Memory/ProjectMemoryRecord.cs:43-58; src/backend/AgentSmith.Infrastructure.Persistence/Configurations/ProjectMemoryConfiguration.cs:22,29"
  - claim: "The concurrent-upsert test runs four writers on one SQLite connection."
    evidence: "tests/AgentSmith.Tests/Persistence/ProjectMemoryRepositoryTests.cs:58-66"

scope:
  in: "ProjectMemoryLimits refuses a description with a line break and a slug or author over 191. Recall quotes the project entry's description. The concurrent test opens separate connections (file-backed SQLite, one context per writer) so the unique-violation retry runs."
  out: "Repo-file memories (they pass git review)."

decisions:
  - "Refuse, not strip: the 4000/200 caps already refuse rather than cut (fcd7a), and the tool answer tells the model to state it again."

steps:
  - id: limits
    action: "ProjectMemoryLimits: newline, slug and author bounds."
  - id: recall
    action: "MemoryRecallToolHost quotes a kept entry's description."
  - id: tests
    action: "Pin each refusal, the quoted recall, and a multi-connection upsert that exercises the retry."

tests:
  - "ProjectMemoryLimits_DescriptionWithNewline_IsRefused"
  - "ProjectMemoryLimits_SlugOver191_IsRefused"
  - "Recall_ProjectEntry_QuotesTheDescription"
  - "ProjectMemoryRepository_ConcurrentUpsertSeparateConnections_OneRowRetryTaken"

done:
  - "remember with a description containing '\\n## ' answers 'Not recorded' naming the line break."
  - "Recall of a project entry prints no line of its description unquoted."
  - "Build green, full suite green."
