    ReferenceMaterializer registered in AddReferenceSetCarry (25 -> at most 26). MATERIAL KEPT ON A LATER APPROVAL
    (main-thread decision R3): a re-recorded approval keeps the previous record's citations that came from ANOTHER
    conversation, beside what its own conversation holds now. SpecApprovalRecord gains `CitedFrom` (init, set or image id
    -> the conversation it was uploaded in; an id not in it is the approval's own) and `ConversationOf(id)` (88 -> at most
    92 with TicketText). ApprovalCitations.CiteAsync(record, conversation, ct, previous = null) unions the previous
    record's ids whose ConversationOf differs from this conversation AND that their conversation still holds — one
    SetIdsAsync and one ImageSetIdsAsync per distinct foreign conversation — recording each in CitedFrom; SaveAsync's
    re-check drops only ids of this conversation (40 -> at most 62). A carried-forward upload that was removed, or whose
    conversation was deleted, is dropped at the next approval, so approving again is the way out of a run that refuses
    "cannot read". ApprovedSpecSetRecorder passes the `previous` it already loads
    on its existing line 83 (119 kept). ReferenceSetCarrier and ReferenceImageCarrier read each id, and its note, from
    record.ConversationOf(id) (52 -> at most 56, 52 -> at most 55). TicketAmendment (120) is not touched. The same rule
    serves every amendment from a ticket's own conversation, a filed spec's as well as a ticket text's: neither lost
    material before by intent. The code preset, DeriveSpecHandler
    (143, at its baseline) and every run whose record is not a TicketText record are unchanged. SINK (TicketFilingOutcomeSink, 94 -> at most 110): a TicketGraphOutcome
    in a ticket-bound conversation files nothing and answers with a Notice turn "This conversation belongs to <ticket>;
    approving here continues that ticket. File a list of tickets from Work it out without a ticket, or make this one
    ticket's series."; otherwise a graph goes to TicketGraphFiler through the same store-confirmed, report, push, notice
    and Filing-turn path; once the report holds a created ticket, the stored filing, the push, the notice and the turn run
    on CancellationToken.None; the failure notice is ComposeFilingFailure(report, proposal). TEXT (SpecDialogOutcomeComposer,
    at most 117): Summarize graph arm "a list of N tickets, in the order they must merge"; a graph's failure footer, ONLY
    when the report holds a created ticket, says "Approving again files the whole list again: close the created tickets,
    or propose the rest naming them with ticket:<id>." instead of the retry line; with nothing created (the existence
    refusal, a failed first create) the existing retry line stands. STATE: FiledStartState.Held with the label "held" (99 -> at most 104);
    spec-dialog.ts adds "Held" to SpecDialogFiledStart.state; DialogFiledTicket's map says "waits". REGISTRATION:
    TicketGraphFiler, TicketGraphStarts and GraphTicketApproval scoped in 2026-10-14-dbcek's TicketGraphExtensions.
  out: >
    The requirement table and its store — 2026-10-14-dbcef. The landing fact — 2026-10-14-dbceg. The gate that holds a
    filed dependent which a poll, a webhook or a person reaches, the wake that starts it when its requires land, and both
