    nobody: the filing records what the approval did; the run list beside each filed ticket (DialogFiledTicket) and
    2026-10-14-dbcen's ticket page show what happened after. A per-ticket choice of cited material — nobody: contract
    decision 8. A target branch other than the default for a dependent — nobody: contract decision 6; no spec-parent
    stamp is set.

decisions:
  - key: "A TICKET-TEXT APPROVAL RECORD CARRIES THE MATERIAL (D1, decided from the code). The material reaches a run only through the ticket's approval record (ApprovalCitations, ApprovedSpecSetResolver, MaterializeReferenceSets), and the same record is what routes the ticket to the code pipeline, admits it to discovery, scopes the run's repositories and gives the ApprovedSeries row the project 2026-10-14-dbcen lists never-run tickets by. A second citation store would repeat all five. The record therefore keeps its shape with an empty set and an explicit TicketText flag — the flag, not an empty-set inference, is what the run reads."
  - key: "THE MATERIAL REACHES THE DERIVATION (main-thread decision, contract decision 22 and section 5 default 32, pending operator ratification). The code preset carries the cited material only after DeriveSpec (PipelinePresets.Code.cs:56,66), which suits a filed spec whose specs were drafted beside the material; a ticket text's specs are drafted by the run, so its derivation must see what the operator uploaded. The record is already published at ScopeRepos and the sandboxes exist after checkout, so the deriver carries it first for a TicketText record only and names it in the opening message; the preset, DeriveSpecHandler (at its baseline) and every other run stay as they are. A new pipeline step was rejected: it would add a command name, a context builder and a registration to PipelineHandlersExtensions (218 of 218) for one record kind, and the dashboard's run rail would show a second materialize step on every code run."
  - key: "ONE COPY, INTO THE FIRST REPOSITORY (round-2 cut L-r2-3, accepted by the main thread in place of its first rule of a copy per named repository; contract decision 22). The early carry no longer needs a single carrier: it writes one copy into the record's carrying repository, else the first of its repositories with a sandbox — the ticket's first named one, else the conversation's first. One copy serves every repository: the master reads every sandbox by prefix (MaterializeReferenceSetsHandler.cs:76-78) and so does the derivation's look (DerivationLookFactory.cs:24-32). A copy per named repository would add nothing either reads and name each set once per repository in the opening message, and the run cannot tell a named list from the conversation's without a further field (CarryingRepo is read by SeriesScope, so it cannot be the flag)."
  - key: "IMAGES REACH THE DERIVATION AS FILES (round-2 cut L-r2-2, main-thread decision R3). The derivation is a text call; an uploaded image is written into the sandbox and named there, and the master sees it as a picture later. Attaching images to the derivation would change SpecDerivationMessages beyond its budget for a model that may not take vision."
  - key: "A LATER APPROVAL KEEPS THE MATERIAL (round-2 cut L-r2-1, main-thread decision R3, owned here). The promised way to settle a list ticket's specs first — its own conversation — re-recorded the approval citing only that conversation's uploads and dropped the list's. Sets are stored and read by conversation, so the union records where each carried-forward id lives (CitedFrom) and both carriers read it from there. The recorder already loads the previous record and passes it on an existing line; TicketAmendment (120 of 120) stays untouched. An id of the approval's own conversation keeps today's rule (what it holds now), so a removed upload is not resurrected. A carried-forward id is kept only while its own conversation still holds it (round-3 cut L-r3-2): the re-approval moves the row's ApprovedInConversation away, so nothing protects that upload any more; without the check every later approval would cite a vanished id again and the ticket could never run."
  - key: "THE STEP ALWAYS CARRIES (round-3 cut L-r3-1, amends contract decision 22). A first draft answered 'already carried' when the keys were published, but the keys are checkpointed and a resume re-runs the step in a fresh sandbox, so the skip would have left every resumed run with cited material — filed specs included — naming files that are not there, and the existing re-run test (one sandbox) would have stayed green. The carry is idempotent, so the step carries every time; a TicketText record with several repositories and none named uses the early carry's first-repository rule instead of the refusal the skip used to hide."
  - key: "THE DERIVATION IS TOLD NOTHING IS ATTACHED (round-3 cut L-r3-3). The early carry marks the images it would attach as Shown, and the section would tell the derivation they are 'attached to this message'; the derivation call attaches nothing, so it passes attached: false and reads them as files."
  - key: "SETTLING A LIST TICKET IN ITS OWN CONVERSATION. The amendment answers 'The ticket's description was not rewritten' because GraphTicketBody writes no FramedTicketRegion markers; that is true and harmless (the run reads the record and the branch, never the description). Settling before the requirements land cuts the ticket branch at that moment; the run later merges the base into the reused branch, so it still builds on the merged requirement."
  - key: "THE FAILURE FOOTER NEEDS A CREATED TICKET (round-2 cut L-r2-4). With nothing created, approving again files nothing twice, so the existing retry line is the right advice."
  - key: "THE RUN DERIVES FOR A TicketText RECORD. Without a change the hand-off would publish the empty set as approved and the spec gate would park the ticket as a missing set. Both answer for the flag, and the divergence check stays silent, so the run derives from the ticket text against the code merged by then, with the cut review it already runs."
  - key: "THE STAMP IS THE EXISTING FILER'S DECISION (round-1 cut L7). ApprovedSetTicketFiler.Labels(project) is the one place that decides it, for a filed spec and a ticket text alike. With the stamp on and no record yet, a claim in the seconds before the record parks rather than derives without the material — the hazard every filing already has; once the record exists the ticket derives."
  - key: "CREATE, EDGES, RECORD — THEN STARTS (round-1 cuts L1, L2). Edges are stored right after creation, before anything could start the ticket; the record comes last and marks the filing complete. The start pass covers only complete tickets: one whose edges or record failed is reported 'do not trigger it; close it' and never tagged or moved. 2026-10-14-dbceh reads the same mark, so its wake never starts a ticket whose filing did not finish (contract amendment)."
  - key: "ONE EXISTENCE READ, CLASSIFIED (round-1 cut L3). ITicketExistence (2026-10-14-dbcek) reads each ticket:<id> and classifies through TicketReadFailureReason, so an Azure DevOps TF401232 is a missing id, every missing id is named, and no SDK text with host or organisation names reaches the notice. The filer reads again because the tracker can change between proposal and approval."
  - key: "A GRAPH'S FAILURE FOOTER IS ITS OWN (round-1 cut L4). 'Ask again to retry' would file the whole list a second time; the graph footer says to close the created tickets or propose the rest by ticket:<id>."
  - key: "CANCELLATION-SAFE ONCE A TICKET EXISTS (round-1 cut L5). A rolling deploy mid-filing used to leave created tickets with no report, no notice and no starts — a root never started, so its dependents never woke. After the first creation the loop stops on the token, and the start pass, the report and the stored filing run on CancellationToken.None. The sink applies the same rule to every filing that returns a created ticket. CancellationToken.None does not outlive the host's shutdown timeout (round-2 cut L-r2-5): a root the pass did not reach is never started by 2026-10-14-dbceh's recovery, which wakes only dependents of landings, and it shows in 2026-10-14-dbcen's 'Filed, no run on record' bucket, where a person's start by name — which the gate admits for a root — starts it."
  - key: "THE SINK BUDGET IS 110 (round-2 cut L-r2-6). The bound refusal composes, sends and appends a Notice turn as ContinueAsync does (about seven lines), plus the graph arm, a constructor parameter and the post-creation token local: about 105-106 against the old 104; the file is not baselined."
  - key: "TWO CLASSES (round-1 cut L6). TicketGraphFiler (at most 108 lines) creates and stores; TicketGraphStarts (at most 90) decides starts and is where 2026-10-14-dbcem's link pass is called, so neither file is spent twice."
  - key: "WAITS-FOR NAMES TRACKER KEYS (round-1 cut L8). The Held reason and the Requires section use FiledTicketKey: '#12' on GitHub, GitLab and Azure DevOps, 'PROJ-12' on Jira."
  - key: "THE HELD WORD IS HISTORY (round-1 L9, accepted). The filed panel keeps 'waits' after the wake started the ticket; the run list beside each filed ticket is the truth, and the ticket page (2026-10-14-dbcen) shows its live state."
  - key: "DISCOVERY ADMISSION. A list's records are outstanding until a run satisfies them, so a twenty-ticket list holds twenty of the fifty ids discovery names per tracker (ApprovedTicketAdmission) until its tickets run; beyond fifty, the existing warning names the omitted count."
  - key: "ROLLING DEPLOY. An older replica ignores TicketText and would hand the empty set over; no master proposes a list before 2026-10-14-dbcep ships, so a list's runs meet only replicas that read the flag. An older replica also ignores CitedFrom and reads every cited id from the approval conversation, refusing 'cannot read' for a carried-forward one: that hits an amended filed spec from this spec's merge on, not only a ticket text, for the length of the rollout."
  - key: "REJECTED CUT (round 1, L7 as written: onCreated receives the labels) — there is no onCreated: ApprovedSetTicketFiler.FileAsync is not called for a ticket text (it stores a set and writes a branch, ApprovedSetTicketFiler.cs:76-77); the labels are shared by extracting the decision instead."
  - key: "Defaults pending operator ratification: D1 (ticket texts, specs derived by each run; contract section 5 default 13), 31 (filing complete = the record stored last), 32 (material before the derivation), contract section 5 defaults 15 (a missing ticket:<id> refuses the whole filing), 16 (held tickets untagged and unmoved), 17 (a partial filing starts the ready complete tickets of its prefix and names every ticket), 18 (every ticket cites all the conversation's material), 19 (a list is refused in a ticket-bound conversation)."

steps:
  - id: record-flag
    action: "SpecApprovalRecord.TicketText init property with a dated comment (at most 90, wc -l); ApprovedSetHandoff, FiledTicketSpecGate and ApprovedSetDivergence answer for it (at most 56, 78, 46)."
  - id: approval
    action: "GraphTicketApproval.RecordAsync (at most 70 lines); ApprovedSpecSetRecorder's KeyFor and Repositories become internal (119 kept, wc -l)."
  - id: body-labels
    action: "GraphTicketBody.Render (at most 60 lines); ApprovedSetTicketFiler.Labels(project) extracted and used at its own create (107 -> at most 110)."
  - id: state
    action: "FiledStartState.Held with its doc and the label arm (99 -> at most 104); spec-dialog.ts SpecDialogFiledStart.state adds \"Held\"; DialogFiledTicket STARTED_LABEL gains Held: \"waits\"."
  - id: material-first
    action: "ReferenceMaterializer (CarryAsync moved from MaterializeReferenceSetsHandler, CarryForDerivationAsync for a TicketText record, at most 110 lines) registered in AddReferenceSetCarry (at most 26); SpecSetDeriver calls it before the opening (115 -> at most 118); SpecDerivationMessages.Opening appends ReferencePromptSection.Carried with attached: false (34 -> at most 36; ReferencePromptSection 78 -> at most 80); the handler delegates and carries on every run, no skip, with the TicketText first-repository fallback shared with the early carry (98 -> at most 60); the early carry targets the carrying repository, else the record's first repository with a sandbox; wc -l each, DeriveSpecHandler untouched."
  - id: citations-forward
    action: "SpecApprovalRecord.CitedFrom and ConversationOf (at most 92, wc -l); ApprovalCitations.CiteAsync unions the previous record's foreign citations its conversation still holds and SaveAsync re-checks only own ids (40 -> at most 62); ApprovedSpecSetRecorder passes previous on line 83 (119 kept); ReferenceSetCarrier and ReferenceImageCarrier read by ConversationOf (at most 56, 55); wc -l each, TicketAmendment untouched."
  - id: filer
    action: "TicketGraphFiler.FileAsync(state, graph, mayStartRuns, ct) -> FilingReport: project, existence read, order, create-edges-record per ticket, the not-created note, the interruption rule, then TicketGraphStarts (at most 108 lines, wc -l)."
  - id: starts
    action: "TicketGraphStarts.SettleAsync over the created prefix on CancellationToken.None: not complete -> NotStarted 'do not trigger it'; unmet none -> FiledWorkStarter.StampAsync; else Held by FiledTicketKey (at most 90 lines)."
  - id: sink-text
    action: "TicketFilingOutcomeSink: the bound-conversation refusal, the graph arm, the post-creation token rule, ComposeFilingFailure(report, proposal) (94 -> at most 110); SpecDialogOutcomeComposer: Summarize graph arm and the graph failure footer when something was created (at most 117, wc -l)."
  - id: registration
    action: "TicketGraphFiler, TicketGraphStarts and GraphTicketApproval registered scoped in TicketGraphExtensions (SpecDialogExtensions stays at most 120)."
  - id: tests
    action: "Tests below in tests/AgentSmith.Tests/SpecDialog (filer, starts, body, record, sink against fake trackers of all four types that throw what each real client throws, an in-memory requirement store and landing store), Specs (hand-off, gate, divergence, the deriver's early carry, the handler's re-carry on resume), the dashboard label test, and a DI test resolving IOutcomeSink from the real server composition and filing a two-ticket list."

