scope:
  in: >
    TICKET TEXT, NO SPEC (main-thread decision D1, default pending operator ratification). FILER (TicketGraphFiler,
    Server/Services/SpecDialog, at most 108 lines): resolves the project as OutcomeTicketFiler does; BEFORE creating
    anything reads every distinct ticket:<id> through ITicketExistence — any missing or unreadable id refuses the whole
    filing, naming every missing id and each unreadable id with its class, never tracker text; orders the tickets
    (TicketGraphOrderer); then per ticket, in order: (1) creates it with role Work, the labels ApprovedSetTicketFiler.Labels(project)
    decides (the existing filer's approved-set stamp, extracted and shared, 107 -> at most 110) and the body GraphTicketBody
    renders; (2) stores its edges in ONE ITicketRequirementStore.AddAsync — one per requires, RequiredTicketId the
    sibling's created id or the existing id, StartsWhenMet = mayStartRuns, FiledInConversation the session id; (3) stores
    its approval record through GraphTicketApproval. A ticket whose three acts all returned is COMPLETE; its stored
    approval record is the durable mark of it, written last. A failure stops the loop and is the report's error; the
    tickets not created are named in a note by key and title. Cancellation before the first creation escapes as today;
    after it, the loop stops, the error says the filing was interrupted after N of M tickets, and everything after runs
    without the caller's token. STARTS (TicketGraphStarts, Server/Services/SpecDialog, at most 90 lines; 2026-10-14-dbcem's link call takes it to at most 92), ONCE over the
    created prefix — after the last ticket and after a failure alike, on CancellationToken.None, holding the project, the
    report, the labels and each created ticket's stored edges: a ticket that is not complete gets FiledWorkStart(NotStarted,
    "created but not stored — do not trigger it; close it") and is never tagged or moved; a complete ticket that
    UnmetTicketRequirements.OfAsync answers an empty Unmet for goes through FiledWorkStarter.StampAsync with the labels from step
    (1); any other gets FiledWorkStart(Held, "waits for <keys> to be merged or marked done by hand"), keys by FiledTicketKey,
    and is not tagged or moved. BODY (GraphTicketBody, Server/Services/SpecDialog, at most 60 lines): Render(ticket,
    required, conversation, labelNote) -> SpecTicketContent: title TicketTitle.Fit(title); body the requirement, then
    AcceptanceCriteriaSection.Heading with one list item per done item, then "## Requires" under "Merge these first; this
    ticket starts once each is merged or marked done by hand." with each required ticket's key (and a sibling's title),
    omitted for none, then "Filed from design conversation `<id>`; its specs are derived by the run that starts it.", then
    the label note. RECORD (GraphTicketApproval, Server/Services/SpecDialog, at most 70 lines): RecordAsync(state, project,
    ticketId, ticket, ct) stores a SpecApprovalRecord under the ticket's key and tracker connection with an EMPTY set
    carrying the approval (now, conversation, principal) and the ticket's title as its goal, the ticket's repos or else the
    conversation's repositories (ApprovedSpecSetRecorder's rule, made internal, 119 kept), the carrying repository
    SeriesRepos.CarrierOf([], repositories) (the only repository, else none; SeriesScope reads it, so it is not reused as
    a flag), the tracker's own ticket id,
    Project = project.Name and TicketText = true, cited and saved through ApprovalCitations — so routing, discovery, repo
    scope, the ApprovedSeries row and the material work exactly as for a filed spec. CONTRACTS:
    SpecApprovalRecord.TicketText, `public bool TicketText { get; init; }` (89 after 2026-10-14-dbcef -> at most 90): the
    approval filed a ticket text and the run derives its specs. RUN SIDE: ApprovedSetHandoff hands nothing over for a
    TicketText record (55 -> at most 56); FiledTicketSpecGate returns null for a TicketText record whatever the stamp (76
    -> at most 78), so the run derives; ApprovedSetDivergence answers null for one (45 -> at most 46). A stamp with no
    record yet still parks, as for every filing. MATERIAL FIRST (main-thread decision, contract decision 22):
    ReferenceMaterializer (Application/Services/Handlers, at most 110 lines) takes MaterializeReferenceSetsHandler's body
    unchanged as CarryAsync(pipeline, ct) -> CommandResult, and adds CarryForDerivationAsync(pipeline, ct), which acts
    only when the published record (ApprovedSpecSetResolver.Published) is a TicketText record that cites material: it
    carries ONE copy into the record's carrying repository, else the FIRST of the record's repositories (the ticket's
    own, else the conversation's) that has a sandbox — one copy serves every repository, as the existing step says — and
    carries the sets and images exactly as CarryAsync does, publishing ContextKeys.ReferenceSets / ReferenceImages; the
    images reach the derivation as named files in that sandbox (the derivation is a text call) and reach the master as
    pictures through the attachments the same carry sets; a refusal or a throw is logged at Warning and leaves the derivation
    without the material, and the later step then fails the run with it as today. SpecSetDeriver calls it once before
    the opening messages (115 -> at most 118); SpecDerivationMessages.Opening appends ReferencePromptSection.Carried(pipeline, prefixed, attached: false)
    (34 -> at most 36), prefixed true when the derivation's look holds more than one sandbox (the master's
    allAddresses.Count > 1), empty for every run that carried nothing yet; Carried gains `bool attached = true`, and with
    false an image is listed as a file without "— attached to this message", because the derivation call attaches
    nothing (ReferencePromptSection 78 -> at most 80). MaterializeReferenceSetsHandler delegates to CarryAsync and
    CARRIES ON EVERY RUN OF THE STEP, as today — no skip on a published key: the keys are checkpointed and a resume
    re-runs the step in a fresh sandbox, so a published key does not mean the files are there; the carry is idempotent
    (same paths; UploadImageAttachments.Merge replaces upload entries). For a TicketText record whose published set names
    no single-repository spec and whose CarryingRepo is empty, CarryAsync targets the early carry's rule — the first
    record repository with a sandbox — through one private method both use, where today the step refuses; when the
    derived set's earliest spec names another repository, that one gets the run's copy and the keys are rewritten to
