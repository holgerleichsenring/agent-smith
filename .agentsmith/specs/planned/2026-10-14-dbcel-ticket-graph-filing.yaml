# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-14-dbcel
goal: "Approving a list of tickets files each as a work ticket whose body is its text, stores its requires and the conversation's material, and starts only those with nothing left to wait for."

applies_to: "backend (the graph arm of the filing sink, the graph filer and its start pass, the ticket body, the ticket-text approval record and the run's reading of it, the material carried before a ticket text's derivation, the Held start state, the filed and failure texts, the refusal in a ticket-bound conversation) and dashboard (the Held label on a filed ticket)"

requires: [2026-10-14-dbcef, 2026-10-14-dbceg, 2026-10-14-dbceh, 2026-10-14-dbcej, 2026-10-14-dbcek]

