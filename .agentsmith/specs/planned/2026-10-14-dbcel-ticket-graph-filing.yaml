done:
  - "Approving a list of tickets in a Work it out conversation that belongs to no ticket creates every ticket on the project's tracker (Azure DevOps, Jira, GitLab or GitHub) in the order they must merge, each a work ticket whose body is its requirement, its done items as acceptance criteria, a Requires section naming what must merge first, and the conversation it came from."
  - "Each filed ticket's run gets the conversation's uploaded material and repositories as a filed spec's run does, and derives its own specs from the ticket text when it starts, with the uploaded sets in its sandbox and the images named as files there — in a project with several repositories too; a run of any other ticket carries its material exactly as before."
  - "Settling a filed ticket's specs in its own conversation before it runs keeps the material uploaded in the conversation that filed it."
  - "The tickets with nothing left to wait for start at once; every other ticket is reported as waiting, naming the tickets it waits for by their tracker keys, and is not tagged or moved."
  - "A requires naming a ticket the tracker does not have files nothing, and the notice names every missing ticket."
  - "When filing fails or is interrupted part-way, the notice lists every ticket created, which started, which wait and which must not be triggered, names the tickets not created, and says how to go on without filing the list twice; when nothing was created it says to ask again and retry."
  - "Approving a list of tickets in a ticket's own conversation files nothing and says where to file it instead."
  - "Build green, full suite green, dashboard gen/test/build green."
