# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-e226
goal: "What a person tells a design turn, or a coding run learns, that holds beyond it becomes a project memory in the database, recalled by later turns and runs with a repository memory's standing."

applies_to: "default (Application: memory store, sources, recall, citations, remember, hand_forward; Persistence: ProjectMemories on all three providers; Server: project memory endpoints); dashboard (project detail panel)"

facts:
  - claim: "remember writes into a repository's .agentsmith/memory/ and refuses a repository with no code change this run, because only a landing commit carries it."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MemoryWriteToolHost.cs:55-56,64-71"
  - claim: "A design turn gets recall and dispute_memory only when its grounding found a repository memory index, and never remember."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:54-56,72; src/backend/AgentSmith.Application/Services/Handlers/GroundSpecDialogHandler.cs:48-51"
  - claim: "The memory store is file-backed over a sandbox file reader; recall, the index and citations iterate the run's repositories and open one store each."
    evidence: "src/backend/AgentSmith.Application/Services/Memory/MemoryStore.cs:14-41; src/backend/AgentSmith.Application/Services/Tools/MemoryRecallToolHost.cs:52-59; src/backend/AgentSmith.Application/Services/Memory/MemoryCitationResolver.cs:24-30"
  - claim: "Standing comes from the memory ledger, keyed by a repository key string and slug, which the standing reader derives from a repository name."
    evidence: "src/backend/AgentSmith.Contracts/Memory/IMemoryEvidenceStore.cs:8-21; src/backend/AgentSmith.Application/Services/Memory/MemoryStandingReader.cs:16-22; src/backend/AgentSmith.Application/Services/Memory/MemoryRepositoryKey.cs:15-20"
  - claim: "The record step rewrites the carrier repository's MEMORY.md labels from the ledger."
    evidence: "src/backend/AgentSmith.Application/Services/Memory/MemoryIndexLabelWriter.cs:9-21"
  - claim: "hand_forward's relied_on and recall describe their entries as 'slug' or 'repository/slug' from the run's repositories."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/HandForwardToolHost.cs:44; src/backend/AgentSmith.Application/Services/Tools/MemoryRecallToolHost.cs:41-44"
  - claim: "A project is a ConfigEntity row with a long surrogate Id; a design conversation names its project by a string."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/ConfigEntity.cs:11-13; src/backend/AgentSmith.Infrastructure.Persistence/Entities/SpecDialogSession.cs:20"
  - claim: "Migrations live in three sets: SQLite in Persistence, SqlServer and Postgresql."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Migrations/20261109220503_AddPromptRecords.cs; src/backend/AgentSmith.Infrastructure.Persistence.SqlServer/Migrations/20261109220505_AddPromptRecords.cs; src/backend/AgentSmith.Infrastructure.Persistence.Postgresql/Migrations/20261109220507_AddPromptRecords.cs"
  - claim: "The project detail panel shows agent, repos, tracker and resolved settings and carries the init action."
    evidence: "src/dashboard/src/components/system/ProjectDetailPanel.tsx:42-45,66"
  - claim: "The coding skill still calls remember a proposal whose feedback entries are flagged."
    evidence: "agent-smith-skills skills/_masters/coding-agent-master/SKILL.md:147-151 (v5.25.4)"

scope:
  in: "ProjectMemories table: ProjectId (FK to ConfigEntities.Id, cascade on delete), slug (unique per project), type, description, body, created and updated, and provenance (source kind conversation or run, source id, message id). One migration name, AddProjectMemories, in all three sets. IMemoryStore is extracted, with the file store per repository and a project store over the table. MemorySources lists the project source first, under a reserved label that cannot be a repository name, then the run's repositories. Recall, the index, citations, relied_on and dispute resolve through sources. The ledger key comes from MemoryRepositoryKey.OfProject(id), and MemoryStandingReader gets a key-based overload. Design turn: remember writes project memory only; recall and dispute_memory join when any source has entries; remember is always present. Coding run: remember writes project memory too, by the reserved label, with no code-change requirement, and repository memory as before. Project memory reaches every prompt as quoted data with its provenance. Dashboard: a ProjectMemorySection component in ProjectDetailPanel lists entries with standing, record and provenance, with delete."
  out: "Editing text in the dashboard. Moving repository memories into the database. Principles evolving from project memory (holding feedback entries proposed into principles.md Project Specifics at an init refresh) is a successor named in prose and not minted here. So is keying design conversations by project id instead of SpecDialogSession.Project's string, which leaves conversations behind on a rename."

decisions:
  - key: "PROJECT, NOT REPOSITORY. 'Never drop a feature' is about how this person works, not about one repository's code. A repository store was rejected: it needs a landing commit the design turn never makes, and it would pick one repository arbitrarily."
  - key: "FOREIGN KEY TO THE CONFIG ENTITY. The operator's call: ProjectId references ConfigEntities.Id, cascade on delete. A rename keeps the memories, and a deleted project takes them with it. Keying by name was rejected."
  - key: "DATABASE, NOT GIT. The operator's call. A turn writes it at once, with no PR, and the dashboard reads it where projects live."
  - key: "BOTH RUNS WRITE IT. Coding runs learn by implementing and get the same rights as the design turn. The design surface's remember writes project memory only, because its repositories never land."
  - key: "ONE INTERFACE, TWO STORES. IMemoryStore (list, search, upsert, index) with a file and a database implementation. A virtual file reader over the table was rejected: it would fake paths for code that only needs entries."
  - key: "A RESERVED LABEL, NOT THE WORD 'project'. The entry type 'project' already exists, so the source is addressed as '@project' ('@project/slug'). No repository-name rule exists today, so this spec adds one: the config validation refuses a repository name that starts with '@'. It is keyed 'project-memory:<id>' by its own key method. The bare word was rejected because it reads as the entry type."
  - key: "THE MASTER DECIDES WHAT IS LASTING. remember stays a tool, with a description of when a statement holds beyond the turn. An end-of-turn extraction pass was rejected: a second model call guessing at what the first already understood."
  - key: "QUOTED DATA WITH PROVENANCE. A person's words or a run's lesson become text in later prompts, so each entry renders as quoted data naming where it came from, never as instructions. The panel shows the same provenance, so a person can trace an entry to its sentence."
  - key: "SAME STANDING, OWN KEY. Ledger rows under the project key; relied_on and dispute_memory move them as they move a repository memory. MemoryIndexLabelWriter skips the project source, because no file carries its labels and the index is composed from the ledger at read time. No status, no ratification."
  - key: "A DELETED SLUG STARTS OVER. Deleting an entry removes its ledger rows for the project key, so a re-created slug inherits nothing from the memory that was removed as wrong."
  - key: "LIST AND DELETE ONLY IN THE DASHBOARD. The operator's call. Reading needs Permissions.ConfigRead and deleting needs Permissions.ConfigWrite, both scoped to the project by its bindings (2026-10-15-4a4db). Rewording goes through a turn, so the text keeps one author."

steps:
  - id: table
    action: "ProjectMemory entity and configuration (FK ProjectId to ConfigEntities.Id, cascade, unique ProjectId+slug); migration AddProjectMemories in the SQLite, SqlServer and Postgresql sets; repository with list, upsert by slug, delete (with its ledger rows). The CLI composition with no database gets an empty store."
  - id: store
    action: "IMemoryStore extracted from MemoryStore; ProjectMemoryStore; MemorySources (project first under '@project', then repositories); MemoryRepositoryKey.OfProject; key-based MemoryStandingReader overload. MemoryRecallToolHost, MemoryCitationResolver, MemoryIndexReader and DesignMemoryIndex iterate sources and render project entries as quoted data with provenance. MemoryIndexLabelWriter skips the project source. Config validation refuses a repository name starting with '@'."
  - id: tools
    action: "Design turn: remember writes to the project (the provenance is the conversation and its message). GroundSpecDialogHandler and MasterToolComposition gate recall and dispute_memory on any source having entries. Coding run: remember accepts '@project' (the provenance is the run and its spec). The descriptions of remember, recall and hand_forward relied_on name '@project/slug'."
  - id: dashboard
    action: "GET and DELETE /api/projects/{name}/memories under ConfigRead and ConfigWrite with project scoping; ProjectMemorySection component (own file, own tests) mounted in ProjectDetailPanel."
  - id: docs
    action: "CLAUDE.md Experiential Memory: project memory in the database beside repository memory, the reserved label, provenance, and delete resetting standing. Skills: design-partner-master says remember a lasting statement on the project; coding-agent-master drops the stale 'proposal, flagged' wording and names '@project' for a lesson that holds beyond one repository. Release, bump the pin."
  - id: tests
    action: "Pin the table, the sources order, the label and key, the tools per surface, the quoting, standing, deletion and the panel."

tests:
  - "ProjectMemoryStore_UpsertBySlug_ReplacesTheEntryAndKeepsProvenance"
  - "ProjectMemory_ConfigEntityDeleted_Cascades"
  - "MemorySources_ProjectFirst_UnderAReservedLabel"
  - "ConfigValidation_RepositoryNameStartingWithAt_IsRefused"
  - "MemoryCitationResolver_AtProjectSlug_CitesTheProjectKey"
  - "DesignTurn_Remember_WritesToTheProjectWithoutACodeChange"
  - "CodingRun_RememberAtProject_WritesWithoutACodeChange"
  - "DesignTurn_OnlyProjectMemory_RecallAndDisputeJoin"
  - "MemoryIndex_ProjectEntries_RenderAsQuotedDataWithProvenance"
  - "MemoryIndexLabelWriter_SkipsTheProjectSource"
  - "ProjectMemory_DeleteThenRecreate_StandingStartsOver"
  - "ProjectMemoryEndpoints_DeleteNeedsConfigWriteOnTheProject"
  - "ProjectMemorySection_ListsStandingAndProvenance_Deletes"

done:
  - when: "a person tells a design turn 'never drop a feature the material records'"
    then: "a project memory exists with that conversation as provenance, the next turn's index shows it as quoted data, and a coding run of the project recalls it"
  - when: "a coding spec names '@project/<slug>' in relied_on and the spec is done"
    then: "the panel shows the confirmation in its standing"
  - "A person with ConfigWrite on the project deletes a memory, and no later turn sees it."
  - "Build green, full suite green, dashboard tests green."
