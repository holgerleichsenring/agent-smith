# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-14-dbcen
goal: "Filed tickets with no run appear on the ticket list as blocked or filed, a graph view draws tickets and their requires, and every ticket waited on can be marked done by hand."

applies_to: "dashboard (the extended ticket-graph.html mock FIRST, list sections, the Graph view on /tickets, waits-for with a per-entry done-by-hand act, the never-run ticket page, the page-less node panel) + backend (never-run ticket rows, the buckets blocked and filed, one shared summary read for list and graph, the graph and requires reads and their endpoints, the detail of a never-run ticket)"

requires: [2026-10-14-dbcef, 2026-10-14-dbceg, 2026-10-14-dbceh, 2026-10-14-dbcei, 2026-10-14-dbcek, 2026-10-14-dbcel]

