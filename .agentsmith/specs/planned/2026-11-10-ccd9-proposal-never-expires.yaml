# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-ccd9
goal: "A stored proposal awaits a decision until a person approves or rejects exactly that proposal or a newer draft supersedes it; nothing waits and nothing expires."

applies_to: "default (Server: spec dialog outcome flow, stores, admission, router, view, chat adapters; Persistence: session row; Dashboard: approval card and composers)"

facts:
  - claim: "The confirmer asks with a fixed 15-minute ConfirmationTimeout, holds an in-memory pending question and a Redis open-question record with that TTL, and waits on the dialogue transport inside the router's turn loop, which re-runs the turn on an edit note."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeConfirmer.cs:32-64; src/backend/AgentSmith.Server/Services/SpecDialog/RedisOpenDialogQuestions.cs:16-17; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogRouter.cs:85-114; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogEditReload.cs:7-10"
  - claim: "On timeout the flow clears the stored proposal and sends ComposeTimeout through the messenger only; the comment encodes the old rule."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeFlow.cs:76-81; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeComposer.cs:54; src/backend/AgentSmith.Server/Services/SpecDialog/ConfirmationResult.cs; src/backend/AgentSmith.Server/Services/Adapters/DashboardAdapter.cs:40-41"
  - claim: "The flow pushes the proposal and stores it before the confirmation; no id identifies the proposal a decision was made on."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeFlow.cs:38-44; src/backend/AgentSmith.Server/Models/SpecDialogProposalPush.cs:22-29"
  - claim: "Admission stores the message before the turn gate and decides a word only while a question is pending; the card turn is the last assistant turn that carried a draft."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogAnswerAdmission.cs:36-46; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogRouter.cs:57-62; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogAnswerWords.cs:13-24; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogShownTranscript.cs:25-32"
  - claim: "Approve buttons send only the word."
    evidence: "src/dashboard/src/components/tickets/detail/useTicketComposer.ts:70; src/dashboard/src/hooks/useSpecDialog.ts:124-128"
  - claim: "Chat buttons reach a wait through the adapter or SpecDialogButtonAnswer, both depending on the open question; Slack and Teams ask through a call that waits for the click."
    evidence: "src/backend/AgentSmith.Server/Services/Adapters/SlackInteractionHandler.cs:72-73; src/backend/AgentSmith.Server/Services/Adapters/TeamsInteractionHandler.cs:88-89; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogButtonAnswer.cs:14-22; src/backend/AgentSmith.Server/Services/Adapters/SlackTypedQuestionManager.cs:45-49; src/backend/AgentSmith.Server/Services/Adapters/TeamsAdapter.cs:37-45"
  - claim: "The approval card is built from the pending question with its expiry; the resumer refuses while a question is pending; the dashboard hides an expired approval."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogViewReader.cs:58-62; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogResumer.cs:40; src/backend/AgentSmith.Server/Models/SpecDialogChannelQuestion.cs:18-24; src/dashboard/src/components/dialog/DialogQuestionCard.tsx:48,83-102; src/dashboard/src/components/tickets/detail/useTicketComposer.ts:97-100"
  - claim: "The turn's poster decides MayStartRuns for the filing, and a Slack message carries false."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogRouter.cs:107; src/backend/AgentSmith.Server/Services/Adapters/SlackMessageDispatcher.cs:45-46"
  - claim: "Three sites write the stored proposal: the flow, the mid-review observer and the steward's supersede. The store swallows every failed write. The unbound filing leaves LatestProposalJson in place; filing can refuse or continue without acting. Nothing reads ConfirmedOutcomeJson to retry."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeFlow.cs:42,89-94; src/backend/AgentSmith.Server/Services/SpecDialog/DialogProposalObserver.cs:24-25; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogLatestOutcomeStore.cs:15-26,104-118; src/backend/AgentSmith.Server/Services/SpecDialog/TicketFilingOutcomeSink.cs:40-48,49-83,107-112; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeStore.cs:23,31-37"
  - claim: "A stored Notice turn is how a reload learns what happened."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/TicketFilingOutcomeSink.cs:91-97"
  - claim: "The design turn has no ask_human since 0.180.1; the coding run's ask_human still waits five minutes."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:56; src/backend/AgentSmith.Application/Services/Tools/HumanToolHost.cs:45-48"
  - claim: "Files at their line cap: SpecDialogLatestOutcomeStore 120, SpecDialogViewReader 119, SpecDialogSessionRepository 120, DashboardDialogDispatcher 120, TicketFilingOutcomeSink 119, SpecDialogRouter 116, SlackInteractionHandler 115."
    evidence: "wc -l, 2026-11-10"

scope:
  in: "SPLIT FIRST: SpecDialogLatestOutcomeStore and SpecDialogViewReader. ID: the flow mints a proposal id before ProposeAsync; the push, the stored proposal, the view and a chat card's QuestionId carry it; the observer's mid-review pushes carry it too. STATE: the session row gains AwaitingProposalId and ProposalState (awaiting | filing), migration AddSpecDialogProposalState in the SQLite, SqlServer and Postgresql sets. At turn end, after the reply is kept, the flow writes the id and 'awaiting' and returns; nothing waits. Nothing clears 'awaiting' at turn start: a follow-up question, a failed turn or a crash leaves the proposal approvable. SUPERSEDE: a new draft, detected from LatestProposalJson holding a different id, replaces the awaiting id and appends a Notice at each write site (flow, observer, steward). DECIDING (a new SpecDialogDecisionPath class, used by the router, the dashboard dispatcher and the Slack and Teams interaction handlers): a decision with an id decides only when it is the stored awaiting id; admission still stores the message before the gate, and a typed answer word is evaluated only after TryEnter succeeds and only when SpecDialogShownTranscript.CardTurn is the last assistant turn before the word. Anything else is an ordinary message that runs an ordinary turn. CLAIM (a new SpecDialogProposalClaim type in Persistence): approve and reject move the row from awaiting to filing or cleared by compare-and-set on id and state; ClearProposalAsync fails its caller on the reject path. If filing throws, refuses (TicketFilingOutcomeSink.cs:40-48) or continues without acting (:107-109), the row returns to awaiting with the same id. A crash-stranded 'filing' row shows as an approvable card, and its next approve claims it with the same id; nothing retries on its own. RIGHTS: the decider's MayStartRuns. SHAPES AND EDITS: routed as the clicker's message, with the id. FAILING: SetProposalAsync fails its caller; the post-filing writes keep their logged drop. REMOVED: ConfirmationTimeout, OutcomeConfirmationTimedOut, ComposeTimeout, the pending approval question, the open-question TTL for approvals, ExpiresAt on approval cards, and the router's edit re-run loop (OutcomeFlowEditRequested, SpecDialogEditReload in that role), since an edit note is now an ordinary message. The view builds the approval card from the stored proposal; the resumer no longer refuses on an approval; Slack and Teams post the card with a post-only call. The comment at SpecDialogOutcomeFlow.cs:77-78 is rewritten. The runner and SpecDialogSessionManager are not touched."
  out: "The coding run's ask_human five-minute wait is a named successor. Build gating is unchanged (2026-11-10-8e59)."

decisions:
  - key: "A STATE, NOT A TASK. Nothing has to be held while a person is away, so nothing has to time out."
  - key: "BOUND TO THE TEXT SEEN. Clicks carry the id; a typed word binds through the card turn inside the gate; across replicas the claim decides."
  - key: "AWAITING SURVIVES TURNS. Only a newer draft, an approval or a rejection ends it; a question in between, a failure or a crash does not."
  - key: "ONE CLAIM, REVERSIBLE. Approve and reject claim the row; a filing that fails, refuses or does not act gives it back with the same id, so a person can approve again and nothing double-files."
  - key: "THE DECIDER'S RIGHTS. Whoever approves is whoever files."
  - key: "AN ORDINARY MESSAGE IS ORDINARY (operator's coordinator, 2026-11-10). No forced revising and no edit re-run loop; the master sees the awaiting proposal and revises when asked."
  - key: "THE STORE FAILS LOUDLY FOR PROPOSALS. Only the post-filing writes keep their logged drop, for the duplicate-ticket reason the store documents."

steps:
  - id: split
    action: "Split SpecDialogLatestOutcomeStore and SpecDialogViewReader."
  - id: state
    action: "Migration AddSpecDialogProposalState in all three sets; SpecDialogProposalClaim with the compare-and-set; the flow mints the id and writes awaiting; supersede at the three write sites with a Notice; SetProposalAsync throws."
  - id: decide
    action: "SpecDialogDecisionPath: id check, word check inside the gate through CardTurn, claim, filing with the decider's MayStartRuns, return to awaiting on failure, refusal or no act; router, dispatcher and interaction handlers call it."
  - id: surfaces
    action: "Push and view carry the id; dashboard buttons send it; the view builds the card from the store; Slack and Teams post-only."
  - id: remove
    action: "Remove the wait, the timeout result and notice, the expiry fields, the approval TTL and the edit re-run loop."
  - id: tests
    action: "Pin each path."

tests:
  - "OutcomeFlow_Proposal_MintsAnIdStoresAwaitingAndReturns"
  - "Decision_ApproveWithStoredIdADayLater_Files"
  - "Decision_ApproveWithOlderId_DecidesNothing"
  - "TypedApprove_CardTurnNotLast_IsAnOrdinaryMessage"
  - "TypedApprove_EvaluatedOnlyInsideTheGate"
  - "Decision_TwoApprovesOnTwoReplicas_FileOnce"
  - "Decision_FilingThrows_ReturnsToAwaitingWithTheSameId"
  - "Decision_FilingRefuses_ReturnsToAwaiting"
  - "Decision_StrandedFilingRow_IsApprovableAndClaimsAgain"
  - "Reject_ClearFails_FailsTheCaller"
  - "Decision_UsesTheDecidersMayStartRuns"
  - "FollowUpTurnWithoutDraft_LeavesTheProposalAwaiting"
  - "NewDraft_SupersedesWithANotice_AtAllThreeSites"
  - "SlackButton_AfterRestart_DecidesTheStoredProposal"
  - "ShapeClick_RoutesAsTheClickersMessage"
  - "ViewReader_AfterRestart_ShowsTheApprovalCardFromTheStore"

done:
  - when: "a turn proposes and nobody answers for a day, across a restart and a follow-up question"
    then: "the card is shown from the store and approving it files exactly once"
  - when: "filing fails"
    then: "the proposal is approvable again with the same id"
  - when: "a newer draft supersedes, or a person rejects"
    then: "the transcript holds a Notice, and an approve on the old card decides nothing"
  - "No code path clears a stored proposal for lack of an answer."
  - "Build green, full suite and dashboard tests green."
