# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-11-205fd
goal: "The design master's texts say what it can do once and truly: the role matches the work clone, dead and duplicated sentences go, scripted procedure becomes a situation."

applies_to: "default (skills: design-partner-master SKILL.md; Application: ReferencePromptSection, ReferenceCoverageText, AgenticMasterHandler comment, SpecAttackPrompt)"

repos_touched: [agent-smith-skills, agent-smith]

invariants:
  - "TRUE CAPABILITIES. No sentence names a tool the surface lacks or denies one it has; the role line and the Orientation paragraph agree that run_command runs in a throwaway work clone."
  - "TOOLS DESCRIBE THEMSELVES. A fact a tool's description states is not restated in the skill; the skill keeps only what ties tools to the job."
  - "SECTION ORDER KEPT. Passages are rewritten in place; no section moves (prompt caching)."

facts:
  - claim: "The role line says what the master runs, it runs in an upload's own container."
    evidence: "agent-smith-skills v5.27.1 skills/_masters/design-partner-master/SKILL.md:20-22"
  - claim: "Orientation says run_command runs in a fresh work clone and restates four read tools' descriptions."
    evidence: "SKILL.md:78-89"
  - claim: "The remember paragraph restates the remember tool's description almost verbatim."
    evidence: "SKILL.md:94-98; src/backend/AgentSmith.Application/Services/Tools/ProjectMemoryWriteToolHost.cs:25-28"
  - claim: "The upload section names a 'grep' tool (the tool is grep_in_tree), says 'a write comes back refused' though no write tool exists, and repeats the file-mode line run_in_reference states."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/ReferencePromptSection.cs:29-31; src/backend/AgentSmith.Application/Services/Tools/ReferenceCommandToolHost.cs:30"
  - claim: "The coverage line also names 'grep'."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/ReferenceCoverageText.cs:21"
  - claim: "The handler comment says spec-dialog turns run no commands, stale since 4778."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:300-303"
  - claim: "The reviewer brief tells the reviewer to extract archives; no reviewer has a shell — its tools are search, read, an optional dependency audit and an optional declared verify stage."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/Review/SpecAttackPrompt.cs:17-24; src/backend/AgentSmith.Application/Services/Specs/DerivationTools.cs:17-36"
  - claim: "Upload discovery is scripted step by step."
    evidence: "SKILL.md:131-153"

scope:
  in: "Role line: you change no repository and file nothing; what you try, you try in throwaway clones and upload containers. Orientation keeps 'cite what they show' and the history: full fact. The remember paragraph goes (the tool says it). ReferencePromptSection and ReferenceCoverageText name grep_in_tree; the write and file-mode sentences go. SKILL.md:131-153 becomes the situation: a note is what earlier turns learned; without one you know nothing until you look; what you learn is lost unless note_reference keeps it. SpecAttackPrompt appends after the verbatim Brief, for every reviewer: 'You read the files; you cannot run a shell or extract archives.' The stale comment is corrected."
  out: "Where coverage and notes are placed (2026-11-11-205fi). The spawn_agents description (2026-11-11-205fj). design-outcome-spec.md:55-64 stays: the re-check sentence is load-bearing. The bound-ticket section stays."

decisions:
  - "The reviewer line is unconditional: no reviewer surface carries a shell, so a condition would guard a case that does not exist."

steps:
  - id: skill
    action: "Rewrite SKILL.md:20-22, :78-89, :94-98, :131-153 in place."
  - id: server-texts
    action: "Fix ReferencePromptSection, ReferenceCoverageText, the AgenticMasterHandler comment and SpecAttackPrompt."
  - id: tests
    action: "Pin each text change."

tests:
  - "ReferencePromptSection_NamesGrepInTree_NoWriteSentence"
  - "ReferenceCoverageText_NamesGrepInTree"
  - "SpecAttackPrompt_Brief_IsFollowedByTheReadOnlyLine"

done:
  - "No design-partner skill text says what runs, runs only in an upload's container."
  - "No design-turn prompt text names a tool called 'grep' or says a write comes back refused."
  - "Build green, full suite green; skills released and pinned with the series."
