  - "SandboxRelease_DockerContainerExited_PublishesExitedWithCode"
  - "SandboxRelease_DockerContainerGone_PublishesGone"
  - "SandboxRelease_KubernetesPodOomKilled_PublishesOomKilledWithExitCode"
  - "SandboxRelease_KubernetesPodDeleted_PublishesGone"
  - "SandboxRelease_InProcess_PublishesNoEvidence"
  - "SandboxLivenessSupervisor_WrappedDockerSandbox_StartsWatcher"
  - "Vanished_CarriesExitCodeAndOom"
  - "SandboxDispose_AfterVanish_KeepsVanished_FillsExitCode"
  - "SandboxDispose_GoneContainer_EndsGone"
  - "SandboxEndFold_WaitingForInput_MarksReleasedAtPark"
  - "SandboxEndFold_Terminal_MarksReleasedAtEnd"
  - "SandboxEndFold_NoCloseEvent_MarksUnobserved_KeepsDisposedAtNull"
  - "SandboxEndFold_ReplayedParkFinished_LeavesLaterLaunchRowsReleased"
  - "SandboxEndFold_QueuedFinished_MarksReleasedAtRequeue_NotAPark"
  - "SandboxDispose_ReplayedAfterRelaunch_LeavesLaterLaunchRowUntouched"
  - "SandboxDispose_NoPositionedRow_ClosesLatestPositionlessRow"
