  - "RunSideRail renders pods from fixtures without status"

done:
  - "A run that parks once and finishes shows its first sandbox 'released-at-park' and its second 'released-at-end' at /api/runs/{runId}/compute, each spawn with its own times."
  - "A Kubernetes pod killed for memory mid-run shows 'oom-killed' with exit code 137; the same on Docker; a pod deleted under the run shows 'gone'."
  - "A Docker sandbox that vanished keeps 'vanished' after the run's dispose, with its exit code filled."
  - "No row reads 'failed'; replaying a run's trail (positions kept) leaves its sandbox rows and reserved Gi-minutes unchanged, also when the run relaunched onto the same repo."
  - "A run put back in the capacity queue shows its released sandboxes 'released-at-requeue', never 'released-at-park'."
  - "The compute endpoint names the reference, browser and preflight sandboxes as not counted; the runs list payload is unchanged apart from the pod's end fields."
