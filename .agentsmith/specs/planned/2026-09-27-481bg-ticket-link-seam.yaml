# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-27-481bg
goal: "A ticket a conversation is bound to can be opened on its tracker, by a link that works for every configured shape rather than one composed from a guess."

applies_to: "backend (where a ticket's browser address can come from) and dashboard (the picked row and the scope pane)"

requires: ["2026-09-27-481bc"]

scope:
  in: "Deciding the SEAM a ticket's web address travels on, and taking it where a tracker already gives one rather than composing it from configuration."
  out: "What the ticket says, which 2026-09-27-481bc already shows. The filed pane's reference, whose identity is a react key, a test id and a row match, so changing it is its own phase."

decisions:
  - key: |
      2026-09-27-481bc WANTED THIS AND REFUSED IT, BECAUSE EVERY SEAM IS SHUT. The ticket entity
      carries no web address. The four field mappers are stateless BY CONTRACT and constructed with
      no arguments at some twenty-five sites, so neither a Jira base url nor an Azure DevOps
      organization url can reach them. Three of the four provider classes are at their file-length
      baseline exactly and may only shrink. The composer Azure DevOps already has is internal to
      another assembly and takes an integer id. And the configured tracker does not hold what a
      link needs: a GitLab url and a Jira url may both come from SECRETS, so composing from
      configuration alone would send a self-managed GitLab installation to gitlab.com — a wrong
      link that opens, which is worse than none.
  - key: |
      TWO TRACKERS ALREADY HAND US THE ANSWER AND BOTH MAPPERS THROW IT AWAY. A GitHub issue
      carries its browser url in the payload already fetched, and a GitLab issue carries one under
      web_url; neither mapper reads it. That is the cheapest and most correct source there is — it
      needs no base url, no escaping decision and no guess about a self-managed host. What it costs
      is a field on the ticket, which is the seam this phase has to open anyway.
  - key: |
      THE OTHER TWO MUST BE COMPOSED, AND ONLY THERE IS A CONNECTION NEEDED. Jira's is its base url
      and the issue key; Azure DevOps has a composer already, written for the tickets this framework
      creates. Both need something the mapper cannot see, so the composition happens where the
      connection is — which is the provider, and the two providers concerned have no lines to give.
      What leaves them is the decision this phase has to make rather than assume.
  - key: |
      A LINK THAT IS WRONG MUST NOT BE DRAWN. A tracker whose shape is unknown, or a self-managed
      host whose address was never configured, answers nothing — and the page shows the id without
      a link rather than a link to somebody else's board.

steps:
  - id: the-seam-is-decided
    path: "src/backend/AgentSmith.Domain/Entities, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets"
    action:
      - "Carry a web address on the ticket, absent where none can be had."
      - "Read it from the payload on GitHub and GitLab, where both mappers discard it today."
      - "Compose Jira's and Azure DevOps's where the connection is, naming what leaves the two provider classes that are at their baseline."

  - id: the-conversation-carries-it
    path: "src/backend/AgentSmith.Server/Services/SpecDialog"
    action: "Carry the address with the binding and on what a bound conversation answers, so the picked row and the scope pane can both link out."

  - id: it-is-pinned
    path: "tests/AgentSmith.Tests, src/dashboard/src/components/dialog/__tests__"
    action: "Assert each tracker's address, that a self-managed host with no configured url yields none, and that a ticket with no address is shown without a link."

tests:
  - "TicketWebAddress_GitHubAndGitLab_TakeTheUrlTheTrackerAlreadyReturned"
  - "TicketWebAddress_JiraAndAzureDevOps_AreComposedWhereTheConnectionIs"
  - "TicketWebAddress_AHostThatWasNeverConfigured_AnswersNone"
  - "SpecDialogSurface_ATicketWithNoAddress_IsShownWithoutALink"

done:
  - "a bound ticket can be opened on its own tracker from the picked row and from the scope pane"
  - "no link is ever drawn to a host the installation did not configure"
  - "no mapper made stateful and no provider grown past its baseline"
  - "build green, full suite green, dashboard tests green"
