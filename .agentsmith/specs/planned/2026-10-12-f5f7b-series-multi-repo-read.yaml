# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-f5f7b
goal: "A series whose specs lie in several repositories is read as one: manifests found in every run repository, specs read from their own, edits detected per repository — today's series read unchanged."

applies_to: "backend (series reader, pointer, scope, persistence)"

requires: [2026-10-12-f5f7a]

facts:
  - claim: "The reader reads one carrier's first sandbox, finds the manifest by ticket key, reads one spec per listed id from that same sandbox, and returns Unreadable without a sandbox."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:38-94, src/backend/AgentSmith.Application/Services/Specs/SeriesManifestFinder.cs:30-31"
  - claim: "The manifest lists spec ids only; series-wide fields (key, goal, order, revisions, accounting, hand-back, fingerprint, approval) are mapped from it into the SpecSet."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesManifestDocument.cs:13-43, src/backend/AgentSmith.Application/Services/Specs/SeriesManifest.cs:26-110, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:102-110"
  - claim: "A reviewer's edit is found by the last commit over the manifest and the series' spec paths in that one checkout, compared with the pointer's single RevisionSha; no pointer reads as an edit."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:63-73, src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:79-81, src/backend/AgentSmith.Contracts/Specs/SpecSetPointer.cs:22-38"
  - claim: "The pointer is one TicketSeries row per (project, ticket) with one CarryingRepo and one RevisionSha, written by SpecSetPointerRecorder; the publish target is resolved from pointer.CarryingRepo first."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/TicketSeries.cs:10-36, src/backend/AgentSmith.Infrastructure.Persistence/Repositories/TicketSeriesRepository.cs:38-49, src/backend/AgentSmith.Application/Services/Specs/SpecSetPointerRecorder.cs:34-48, src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:63"
  - claim: "Each finder returns Found, NothingAtThePath or Unreadable; a broken manifest naming the ticket is an edit gone wrong; the reader port takes one carrying repo; a repo may have several sandboxes."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesManifestFinder.cs:11-46, src/backend/AgentSmith.Contracts/Specs/SpecSetPorts.cs:50-55, src/backend/AgentSmith.Application/Services/Handlers/SandboxTargets.cs:39-42"
  - claim: "The carrier is the pointer's, else the approval's, else scopedRepos[0]; nothing makes a later run's checkout include it, and scoping can narrow it out; an approved scope comes from the approval and --repo intersects it."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCarryingRepoResolver.cs:23-34, src/backend/AgentSmith.Application/Services/Handlers/ScopeReposHandler.cs:63-95, src/backend/AgentSmith.Application/Services/Scope/ApprovedRepoScope.cs:50-80"

assumptions: []

scope:
  in: "Manifest specs entries {id, repo} or a bare id; the reader joins one sandbox per run repository; per-repo shas with a back-fill from today's single sha; per-repo edit detection with defined edges."
  out: "Scope widening and every write into a second repository (2026-10-12-f5f7d) — until then a series has one manifest and one sha, and reads exactly as today."

decisions:
  - key: "CAPABILITY FIRST: read many before writing many; CarryingRepo is still written in this slice."
  - key: "THE JOIN: any Unreadable → Unreadable; else any Found → Found; else NothingAtThePath. Manifests with different series bases → Unreadable. One sandbox per repository in context.Repos."
  - key: "SERIES-WIDE FIELDS FROM THE HIGHEST REVISION; on a tie, from the repository whose last series commit moved against the pointer; refuse only when both moved differently."
  - key: "A BARE ID MEANS HERE: legacy manifests read their specs from the manifest's repository."
  - key: "BACK-FILL, NO FALSE EDIT: a row without a sha map reads {CarryingRepo: RevisionSha}; the migration writes it."
  - key: "MOVED, AT THE EDGES: a repository read now but absent from the map counts as moved; one in the map but not checked out is not compared and is logged."

steps:
  - id: manifest
    action: "Let manifest specs entries be {id, repo} or a bare id; render {id, repo} for specs that name one."
    modify:
      - "SeriesManifestDocument, SeriesManifest, SeriesFiles"
  - id: reader
    action: "Join manifests from one sandbox per run repository by the rule above, read each spec from its repository, compute LastCommitSha per repository."
    modify:
      - "SeriesReader, SeriesManifestFinder, SeriesSpecFileReader, SpecSetReadResult, SpecSetPorts"
  - id: pointer
    action: "Store RevisionShas per repository (JSON column, migrations in both assemblies, back-filled); SpecRevisionCause reads ReviewerEdit by the edge rules; the recorder writes the map beside CarryingRepo."
    modify:
      - "TicketSeries, TicketSeriesRepository, SpecSetPointer, both pointer stores, SpecSetPointerRecorder, SpecRevisionCause"

tests:
  - "SeriesReader_SpecsInTwoRepos_ReadsOneSeries"
  - "SeriesReader_TwoManifests_HighestRevisionWins"
  - "SeriesReader_TieOneMoved_TakesMovedRepo"
  - "SeriesReader_FoundAndUnreadable_IsUnreadable"
  - "SeriesReader_DifferentBases_IsUnreadable"
  - "SeriesReader_LegacyBareIds_ReadFromManifestRepo"
  - "SpecRevisionCause_LegacyRowUnchangedBranch_IsRetrigger"
  - "SpecRevisionCause_MergedBranchInOneRepo_FollowsEdgeRule"

done:
  - "A series whose two specs lie in Server and Client (hand-placed in the harness) is read as one, in order (RealCompositionHarness)."
  - "Every existing series test is green unchanged; migrations in both assemblies."
