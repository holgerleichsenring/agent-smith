# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-e8b9b
goal: "A keyword comment on a finished ticket makes it claimable and starts one attempt; the run, whoever claims it, reads that comment from the thread as the rework act."

applies_to: "backend (ticket-comment routing, lifecycle, ticket context)"

requires: [2026-10-08-e8b9a, 2026-10-08-7c0e]

facts:
  - claim: "A comment-triggered dispatch is dropped when the status is not a trigger status; an empty trigger list accepts every status."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookSpawnDispatcher.cs:50-56,106-108"
  - claim: "Configuration refuses done_status and failed_status inside trigger_statuses; an empty list is only advisory."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ProjectTriggerRules.cs:44-83"
  - claim: "A success finalize records nothing about the move; a failure finalize and a park record an unmoved-ticket fact when the status did not move, and the claim refuses while it stands."
    evidence: "src/backend/AgentSmith.Application/Services/Lifecycle/TicketLifecycle.cs:46-52, src/backend/AgentSmith.Application/Services/PipelineErrorHandler.cs:164-169, src/backend/AgentSmith.Application/Services/Lifecycle/UnmovedTicketReport.cs:23-38,53-65, src/backend/AgentSmith.Application/Services/Claim/UnmovedTicketGate.cs:17-32"
  - claim: "GitHub applies a non-state status as a label, leaving the issue open."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubTicketFinalizer.cs:32-36"
  - claim: "Retry stops with NoTriggerStatus when the list is empty, moves to the first trigger status, then clears hand-back state, the approval's SatisfiedAt and the unmoved fact."
    evidence: "src/backend/AgentSmith.Server/Services/Lifecycle/NotImplementableRetryService.cs:38-66"
  - claim: "Jira offers no transition to the status a ticket is already in, so such a move returns false."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/JiraTransitioner.cs:33-40"
  - claim: "Any claimer — poller, approved-ticket admission, the workitem.updated hook, the capacity head — wins the lease by the same INSERT; the loser gets AlreadyClaimed."
    evidence: "src/backend/AgentSmith.Application/Services/Polling/TrackerPoller.cs:161-169, src/backend/AgentSmith.Application/Services/Polling/ApprovedTicketAdmission.cs:33-47, src/backend/AgentSmith.Server/Services/Webhooks/AzureDevOpsWorkItemWebhookHandler.cs:21-22,55-56, src/backend/AgentSmith.Application/Services/Claim/SingleClaimRegionExecutor.cs:37-39"
  - claim: "A claim for a pipeline no label routes is refused unless the request is marked requested by name."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/ClaimPreChecker.cs:21-25, src/backend/AgentSmith.Contracts/Models/Triggers/IncomingTicketEnvelope.cs:33-38"
  - claim: "The poller builds an envelope from a fetched ticket; SpawnPipelineRunsUseCase is at its 150-line baseline."
    evidence: "src/backend/AgentSmith.Application/Services/Polling/PolledTicketEnvelope.cs:17-32, tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:96"
  - claim: "The four comment handlers filter on the keyword and pass the status to the dispatcher."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/JiraCommentWebhookHandler.cs:54-66, src/backend/AgentSmith.Server/Services/Webhooks/GitHubIssueCommentWebhookHandler.cs:61-75"
  - claim: "A demand is read in the run as the last foreign comment after our anchor that carries the phrase."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRecutDemand.cs:40-57"
  - claim: "FetchTicketHandler has room (135 of a 189 baseline) and fetches the thread before anything reads it."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/FetchTicketHandler.cs:80-81, tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:55"

assumptions:
  - claim: "The act's own time is in each payload: Jira comment.created, GitHub comment.created_at, GitLab object_attributes.created_at, Azure DevOps resource.fields['System.ChangedDate'] of the commented revision."
    check: "One recorded delivery per platform in the handler tests."

scope:
  in: >
    ReworkEntry(project, ticket, act): a held lease is refused naming its run; no finished previous attempt
    answers NotARework, and the caller keeps today's path; an act no newer than that attempt's start is
    AlreadyServed. Otherwise: move to the first trigger status only when the status is not a trigger status
    (empty list: no move); a refused move is refused and clears nothing; TicketReopener (extracted from Retry,
    which calls it) clears; spawn the previous attempt's pipeline with RequestedByName. AlreadyClaimed is
    success — another claimer serves it. Keyword comments route through ReworkEntry before the status gate; a
    refusal is commented, opening 'Agent Smith —' and never quoting the keyword. In the run, ReworkActReader
    sets ContextKeys.ReworkAct from the newest foreign keyword comment after the previous attempt's start.
  out: "PR acts (2026-10-08-e8b9c). What the act does to an executed set (2026-10-08-f114)."

decisions:
  - key: "THE ACT LIVES IN THE THREAD. Moving and clearing make the ticket claimable for every claimer, so the run reads the act itself; nothing rides an envelope another replica never sees."
  - key: "THE ENTRY'S CHECK USES THE HOST'S TIME, never receipt time, so a redelivery is AlreadyServed."
  - key: "THE POLLER CLEARS NOTHING. A move back by hand is claimed as today; a standing unmoved fact there means the ticket never left."
  - key: "ON THE TICKET, Comment AND RecutDemand STAY THE CAUSES; ReworkAct only marks the attempt for 2026-10-08-f114."

steps:
  - id: entry
    action: "Add TicketReopener and ReworkEntry (Started, NotARework, AlreadyServed, Refused(reason, runId)); Retry calls TicketReopener."
  - id: route
    action: "Add KeywordCommentRouter, called by the four comment handlers with the act, asking ReworkEntry before WebhookSpawnDispatcher; post refusals."
  - id: run
    action: "Add ReworkAct and ContextKeys.ReworkAct; add ReworkActReader; call it in FetchTicketHandler after the extras."

tests:
  - "ReworkEntry_LiveLease_RefusesNamingRun"
  - "ReworkEntry_NoFinishedAttempt_NotARework"
  - "ReworkEntry_ActNotNewerThanAttempt_AlreadyServed"
  - "ReworkEntry_DoneJiraTicket_MovesClearsAndClaims"
  - "ReworkEntry_StatusAlreadyTrigger_DoesNotMove"
  - "ReworkEntry_EmptyTriggerList_ClaimsWithoutMove"
  - "ReworkEntry_RefusedMove_ClearsNothing"
  - "ReworkEntry_OtherClaimerWins_IsStarted"
  - "Router_KeywordOnFailedStatus_StartsRework"
  - "Refusal_Text_IsOursAndOmitsKeyword"
  - "ReworkActReader_KeywordAfterAttempt_SetsAct"
  - "ReworkActReader_OurCommentOrOlder_SetsNothing"

done:
  - "A keyword comment on a ticket in done_status or failed_status, or an open GitHub issue held by an unmoved fact, starts one attempt whose context carries ReworkAct even when the poller claims it."
  - "A redelivered comment, or one during a live run, starts nothing; full suite green."
