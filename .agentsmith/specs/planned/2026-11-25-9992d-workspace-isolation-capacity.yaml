# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-25-9992d
goal: "In a shared workspace a command gets only its own repository's secrets and feed credentials, feeds are set per project, limits per toolchain, and each writing sub-agent works in its own git worktrees."

applies_to: "default (Contracts config, Sandbox.Wire/Agent env, Server pod env, Application registry auth/footprint/sub-agents); dashboard (project form)"

requires: [2026-11-25-9992b]

facts:
  - claim: "Declared secrets are projected into the pod's container env, so every command in the pod inherits them."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs:119-130; src/backend/AgentSmith.Application/Services/Sandbox/SandboxSecretsResolver.cs:9-17"
  - claim: "A command's process drops only REDIS_URL, JOB_ID and the launcher's library path from the agent's env."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/AgentProcessEnvironment.cs:16-25"
  - claim: "Feed tokens are one installation-wide registries list, staged as user-level files (~/.nuget/NuGet/NuGet.Config, ~/.npmrc) in every sandbox."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/AgentSmithConfig.cs:23; src/backend/AgentSmith.Application/Services/Handlers/SetupRegistryAuthHandler.cs:36-37,109-127"
  - claim: "Sub-agents share the master's sandboxes and tree."
    evidence: "src/backend/AgentSmith.Application/Services/Loop/SubAgentContext.cs:10-22"
  - claim: "A container's resources resolve per context and the footprint sums limits."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/RunFootprintCalculator.cs:46-50"

scope:
  in: "Secrets: pod env carries declared secrets under scoped names; a step names its repository and the agent hands a command only the project-wide ones and that repository's (sandbox.secrets.repo_env), and makes itself non-dumpable; wire protocol 3. Feeds: registries move to projects.<name>.registries (top-level refused at load, dashboard field on the project); NuGet and npm credentials travel per command in the step env of the repository whose config names the feed, nothing written to a shared file. Capacity: projects.<name>.sandbox.toolchain_resources per image (dashboard field) sizes the workspace container; the footprint is per pod. Worktrees: a sub-agent granted write tools works in its own git worktree per repository under /work/.agents/<child>/, merged back into the master's tree when it finishes, a conflict reported in its notice."
  out: "Secret files: a mounted file is readable by every command of the container (same uid), so they stay pod-wide and are documented as such. Ecosystems served by the generic registry applier (pip, maven, ...) keep their staged file."

done:
  - "A command for repository A sees A's and the project's secret env and not B's; the agent drops every scoped secret variable it was not asked for (agent tests)."
  - "A top-level registries block is refused at load naming projects.<name>.registries; a project's registries stage NuGet and npm credentials as step env for the repository whose config names the feed only."
  - "toolchain_resources for an image sizes its container and the footprint; the dashboard edits it and the project registries."
  - "Two writing sub-agents edit one repository in separate worktrees; each one's work is merged into the master's tree when it finishes."
  - "dotnet build, affected tests, dashboard tests and the spec gate pass."
