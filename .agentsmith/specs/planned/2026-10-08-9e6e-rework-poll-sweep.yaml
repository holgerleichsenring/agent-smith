# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-9e6e
goal: "In polling mode each poll cycle finds the rework acts webhooks would deliver — a keyword comment, a pending Request changes — on recently finished tickets and starts each once through ReworkEntry."

applies_to: "backend (poller, previous-attempt reader, rework entry) + docs"

requires: [2026-10-08-f147, 2026-10-08-0781]

facts:
  - claim: "The tracker poller lists claimable tickets by trigger status and claims those without a lease; it reads no comments and no pull requests."
    evidence: "src/backend/AgentSmith.Application/Services/Polling/TrackerPoller.cs:38-46,57-70,134-169"
  - claim: "Keyword comments reach ReworkEntry only through the webhook comment router, which comments a refusal on the ticket."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/KeywordCommentRouter.cs:26-42,45-60"
  - claim: "Pollers are built per polling tracker and run in the one replica holding the poller lease."
    evidence: "src/backend/AgentSmith.Server/Services/PollerFactory.cs:32-45, src/backend/AgentSmith.Server/Services/Hosting/PollerLeaderHostedService.cs:11-37, src/backend/AgentSmith.Contracts/Services/IEventPoller.cs:18-23"
  - claim: "ReworkEntry serves an act once: a held lease answers AlreadyServed or WorkedOn, an act no newer than the attempt's start plus one minute is AlreadyServed, and the claim's lease insert admits one winner."
    evidence: "src/backend/AgentSmith.Server/Services/Rework/ReworkEntry.cs:26-45, src/backend/AgentSmith.Application/Services/Claim/SingleClaimRegionExecutor.cs:37-39"
  - claim: "The keyword act is read from a ticket's comments by ReworkActReader.Read; providers list comments with GetCommentsAsync."
    evidence: "src/backend/AgentSmith.Application/Services/Rework/ReworkActReader.cs:17-26, src/backend/AgentSmith.Contracts/Providers/ITicketProvider.cs:115-117"
  - claim: "The previous-attempt reader orders code runs by time-sortable id, because SQLite cannot order a DateTimeOffset, and carries each repo's PR URL."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/DbPreviousAttemptReader.cs:11-36,40-52, src/backend/AgentSmith.Contracts/Runs/PreviousAttempt.cs:9-13"
  - claim: "Prior-run carry-over is capped at 72 hours."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/PriorRunLedgerSeeder.cs:18-21"

assumptions:
  - claim: "A run id's leading part orders with its creation time, so 'started within 72 hours' is an id lower bound."
    check: "Read the run id factory before building the candidate query."

scope:
  in: >
    ReworkSweep, an IEventPoller PollerFactory builds beside each TrackerPoller (same interval). Candidates:
    IPreviousAttemptReader.RecentFinishedAsync(projects of this tracker, 72 h, 50) — per (project, ticket)
    the newest code attempt, finished, newest first, at most 50 per cycle; a ticket with a lease is skipped.
    Per candidate IReworkPendingActs.ServeAsync (2026-10-08-0781): the keyword act and PrPendingActCheck
    on the attempt's PR URLs, through ReworkEntry under its per-ticket lock. Started answers as the webhook
    path does; every other outcome is logged and asked again next cycle. A failing read skips that
    candidate. Cost per cycle: at most 50 × (1 + 3 per
    PR) host calls. Docs: polling and webhooks serve the same acts; webhooks only sooner.
  out: >
    The status-back act's cause (2026-10-08-2123); its claim is the poller's today. PR review on open or
    push, the security-scan label, PR comment commands: webhook-only until 2026-10-08-10b0.

decisions:
  - key: "CANDIDATES FROM OUR DATABASE, NOT THE TRACKER: a finished ticket left the trigger statuses the poller lists, and only our rows know its pull requests."
  - key: "72 HOURS, 50 PER CYCLE: the carry-over window already used; an act on an older attempt waits for a webhook-free path — a ticket edit or status move — or a newer attempt."
  - key: "SILENT REFUSALS: a refusal posted every cycle is spam; the act arrived without a webhook to answer it."
  - key: "THE LEADER SWEEPS; exactly-once rests on 2026-10-08-0781's per-ticket lock, the lease and AlreadyServed, so a sweep and an end-of-run check on one ticket serve once."

steps:
  - id: reader
    action: "Add RecentFinishedAsync to IPreviousAttemptReader (Db and null)."
  - id: sweep
    action: "Add ReworkSweep, calling IReworkPendingActs per candidate, and build it in PollerFactory."
  - id: docs
    action: "One sentence in webhooks.md, pr-comments.md and the polling docs."

tests:
  - "RecentFinished_NewestFinishedPerTicketWithinWindowCapped"
  - "ReworkSweep_KeywordAfterAttempt_EntersOnce"
  - "ReworkSweep_PendingRequestChanges_EntersOnce"
  - "ReworkSweep_LeaseHeld_Skipped"
  - "ReworkSweep_Refused_NotCommentedAskedNextCycle"
  - "ReworkSweep_SameActTwoCycles_SecondAlreadyServed"
  - "ReworkSweep_AndRunEnd_SameTicket_ServedOnce"

done:
  - "GitHub, polling: keyword comment and Request changes by this sweep; status-back by the poller's claim; an act during a live run by 2026-10-08-0781 when it ends."
  - "GitHub, webhooks: keyword comment by the comment router, Request changes by GitHubPrReviewWebhookHandler, status-back by the issue handler's claim; a live-run act by 2026-10-08-0781."
  - "GitLab, polling: as GitHub, Request changes through 2026-10-08-f147's check."
  - "GitLab, webhooks: comment router, GitLabMrReviewWebhookHandler, the issue handler's claim; a live-run act by 2026-10-08-0781."
  - "Azure DevOps, polling: as GitHub."
  - "Azure DevOps, webhooks: comment router, the review-vote handler, the work-item handler's claim; a live-run act by 2026-10-08-0781; full suite green."
