# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-23a2b
goal: "A container sandbox replaces the secret values it was given with a named placeholder in everything it reports, and a gate or write never mistakes a masked result for the real bytes."

applies_to: "backend (Sandbox.Agent step handlers, Sandbox.Wire, the pod spec, the server's diff gates and write tools)"

requires: []

scope:
  in: >
    Kubernetes and Docker sandboxes. The agent learns, by name, which env vars and files are secret
    and which step-env keys a step marks secret, reads their values itself, and masks them where
    output is produced — process lines, file reads, grep rows, directory names — before truncation
    and before JSON serialization. A result that masked anything says which keys. The server's
    staged-diff and history gates treat such a result as a leak; the model's write tools refuse
    content carrying a placeholder. An operator can mark one declared secret as not masked. The
    configured registry tokens are masked too: the server hands them to each sandbox with the first
    step it sends, as values to mask.
  out: >
    The in-process backend: it has no agent; after 2026-09-28-ef94 its steps no longer inherit the
    framework's secrets, so there is nothing of ours left to mask there. A server-side mask at the
    model boundary: after ef94 the values the server holds reach tool output only through the
    container git steps and registry tokens this phase covers; get_artifact_credentials still hands
    a token to the model on purpose (GetArtifactCredentialsToolHost.cs:10-18), which masking output
    does not undo. Encoded forms (base64, URL-encoding, a pipe that
    transforms the value): exact-value masking stops accidents, not a script that encodes on
    purpose — exfiltration is the network layer's (2026-09-28-23a2d, p0304). Command arguments the
    model itself typed, which the trail summarises (SandboxStepFacts.cs:31, 57-61). The trace
    writer's masker reading a startup snapshot of the config (LoopRuntimeExtensions.cs:41), which
    misses secrets added by live reload until restart — a separate defect of that masker.

decisions:
  - key: |
      PREMISE CORRECTED: GIT_TOKEN IS NOT A CONTAINER ENV VAR TODAY. SandboxSpec.GitTokenSecretRef
      (SandboxSpec.cs:25) is read by the pod builder (PodSpecBuilder.cs:89, 126-127) but assigned
      nowhere in src/. The token travels per step in Step.Env from the server's environment
      (GitStepCredentials.cs:17-23, GitBranchPusher.cs:27-30, CheckoutStepFactory.cs:38). What IS a
      container env var is every projected secret (PodSpecBuilder.cs:128-129) and file (:94), plus
      REDIS_URL (:124), until 2026-09-28-2f8c removes it.
  - key: |
      NOTHING MASKS STEP OUTPUT TODAY. SecretMasker (SecretMasker.cs:15-48) runs only when a trace
      entry is written (RunTraceWriter.cs:43). The agent redacts `access_token=` in its own log lines
      only (CompactConsoleFormatter.cs:42-55).
  - key: |
      ONLY THE AGENT KNOWS THE PROJECTED VALUES. Kubernetes resolves them inside the pod
      (SandboxSecretProjection.cs:6-12); the server has no RBAC on secrets (2-rbac.yaml:18-39).
  - key: |
      MASK WHERE CONTENT IS PRODUCED, NOT AT THE BUS. Review found two things between production and
      egress that defeat an egress mask: grep cuts each row at 240 characters
      (GrepStepHandler.cs:116, 264, 309-312), and grep, list and tree results are JSON-serialized with
      the default encoder (GrepStepHandler.cs:86, 172; FileStepHandler.cs:174; WireFormat.cs:10-16),
      which escapes '+', '<', '>', '&', quotes and non-ASCII — so a token containing '+' no longer
      matches. The masker runs on each line and row string before either.
  - key: |
      A MASKED RESULT MUST NOT PASS A SECRET GATE. The commit and checkpoint gates scan the staged
      diff read through the sandbox (CommitAndPRHandler.cs:253, 282, 391; RepoWorkPusher.cs:39-47),
      the history scanner reads `git log -p` the same way (GitHistoryScanner.cs:42), and
      multi-sandbox consolidation writes a secondary's staged diff into the primary as a patch
      (SandboxGitOperations.cs:157-160). A masked diff would pass the scanner while the real bytes
      are pushed, or apply a placeholder as a patch. StepResult gains the list of keys it masked;
      GetStagedDiffAsync and the history scanner treat a non-empty list as a leak naming the keys.
  - key: |
      THE WRITE REFUSAL LIVES IN THE MODEL'S WRITE TOOLS, NOT IN THE AGENT. edit and multi_edit read
      the whole file and write it back (FilesystemToolHost.cs:339-345, 397-413), so a masked read
      would write the placeholder over the secret. But server code also writes through the sandbox and
      throws on refusal (SandboxFileReader.cs:36-42) — the consolidation patch, plan.md and result.md.
      So write_file, edit and multi_edit refuse content carrying a placeholder, naming the key and
      pointing at run_command, which edits the real bytes.
  - key: |
      NAMES TRAVEL AS ENV, VALUES NEVER. The pod builder sets AGENTSMITH_MASK_ENV (comma-separated
      env names) and AGENTSMITH_MASK_FILES (comma-separated mount paths) on the toolchain container —
      a cross-version contract, named here. An unknown argument would stop an older agent
      (Program.cs:24-42) and image skew is normal (WireProtocol.cs:14-20); an unknown env var is
      ignored. Docker projects no secrets (SandboxSpec.cs:38-41), so there only step keys and the
      Redis password apply.
  - key: |
      A STEP MARKS ITS SECRET ENV KEYS. An optional Step list of masked Env keys, set by
      GitStepCredentials and GitBranchPusher for GIT_TOKEN. System.Text.Json ignores an unknown
      property by default and WireFormat sets no unmapped-member handling (WireFormat.cs:10-16), so an
      older agent reading it simply does not mask. No protocol bump.
  - key: |
      LINES, NOT CHUNKS. The agent reads whole lines (ProcessRunner.cs:110-125), so OpenHands'
      hold-back buffer (secret_registry.py:117-160) has nothing to do here, once grep truncation is
      after the mask. A multi-line value is registered line by line — but PEM armour lines and public
      CA bundles would then be masked everywhere and refuse every edit near them. That is decided by
      the operator, not guessed: a declared secret env or file carries mask (default true).
  - key: |
      VALUES ARE NORMALISED AND FLOORED. A secret file usually ends in a newline and CRLF leaves a
      carriage return that ReadLineAsync strips (ProcessRunner.cs:118); values are trimmed of line
      terminators. Values shorter than 6 characters are not masked, the floor SecretMasker already
      uses (SecretMasker.cs:18), stated once in Sandbox.Wire; a skipped key is logged by name.
  - key: |
      THE PLACEHOLDER IS [masked-secret:NAME]. "***" occurs in ordinary text and cannot anchor a
      refusal; brackets, colon, hyphen and the env-name or path alphabet pass the default JSON encoder
      unescaped. NAME tells the model what to use instead ($NAME in a command).
  - key: |
      REGISTRY TOKENS ARE MASKED (operator, 2026-09-28: private feeds are in use). The server writes
      them into the sandbox as staged auth files (StagedAuthFileWriter.cs:37-40), so `cat ~/.npmrc`
      would print them. The agent cannot know them unless told, and they already cross to the sandbox
      in that file's content, so the channel hands them over once as values to mask. Sending them with
      the first step covers pipeline, mid-run, resumed and source-scope sandboxes through one site
      instead of every caller.
  - key: |
      GIT_TOKEN STAYS IN Step.Env. The alternative — a credential helper that fetches the token
      without it ever being an env var of the step — would still hand the git process the value, and
      the value still crosses to the sandbox, over Redis today and over the owner's HTTP connection
      after 2026-09-28-2f8c. Masking its
      value in the step's output is enough for the accident this phase is about. Not scheduled.

  - key: |
      SERIES AND ORDER: a member of 2026-09-28-23a2 (the OpenHands comparison). Suggested order: after
      ef94, c657, the web_fetch guard (2026-09-28-530b) and 23a2c; before the chat-intent and transport
      phases. It works on either transport: the masking sits where output is produced, not in the channel.

steps:
  - id: one-masker
    path: "src/backend/AgentSmith.Sandbox.Wire"
    action: "Exact-value replacement, longest first, named placeholders, the length floor, per-line registration of multi-line values."
    new:
      - "KnownValueMasker: exact-value masking with named placeholders"
      - "MaskedSecretPlaceholder: the placeholder shape and its detection"

  - id: declarations-carry-mask
    path: "src/backend/AgentSmith.Contracts/Sandbox"
    action: "SecretEnvBinding and SecretFileMount gain mask (default true), read from the sandbox secrets configuration."

  - id: the-pod-names-its-secrets
    path: "src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs"
    action: "Set AGENTSMITH_MASK_ENV and AGENTSMITH_MASK_FILES from the declarations whose mask is true."

  - id: a-step-names-its-secret-env
    path: "src/backend/AgentSmith.Sandbox.Wire/Step.cs, src/backend/AgentSmith.Application"
    action:
      - "Optional masked Env keys on Step; GitStepCredentials and GitBranchPusher mark GIT_TOKEN."
      - "An optional MaskValues map on Step; the server-side sandbox channel attaches every configured registry token to the first step it sends a sandbox, so every creation path is covered once."

  - id: the-agent-masks-at-the-source
    path: "src/backend/AgentSmith.Sandbox.Agent/Services"
    action:
      - "At startup read the named env values, the named files (skipping non-text or over a stated size, logged by path) and the password of its own Redis URL."
      - "Mask each process line before the event, the stdout capture and the failure tail; file content; grep row text before truncation; tree and list names before serialization."
      - "Report on StepResult the keys that were masked."
    new:
      - "AgentSecretValues: loads the named values at startup"
    modify:
      - "ProcessRunner, FileStepHandler, GrepStepHandler, DirectoryTreeStepHandler: take the masker"
      - "StepResult: MaskedKeys"

  - id: gates-see-the-mask
    path: "src/backend/AgentSmith.Application/Services, src/backend/AgentSmith.Infrastructure/Services/Security"
    action: "GetStagedDiffAsync and the git history scanner treat a result with masked keys as a leak naming them."

  - id: writes-refuse-the-placeholder
    path: "src/backend/AgentSmith.Application/Services/Tools"
    action: "write_file, edit and multi_edit refuse content carrying a placeholder."
    new:
      - "MaskedContentWriteGuard: refuses a model write carrying a placeholder"

  - id: it-is-pinned
    path: "tests/AgentSmith.Sandbox.Agent.Tests, tests/AgentSmith.Tests"
    action: "Agent handlers with a projected env var and file; the gates and write tools against a scripted sandbox returning masked results."

tests:
  - "KnownValueMasker_Apply_LongestFirstNamedPlaceholder"
  - "KnownValueMasker_Apply_ValueBelowTheFloorIsLeftAlone"
  - "KnownValueMasker_MultiLineValue_EachLineIsMasked"
  - "MaskedSecretPlaceholder_Detect_SurvivesJsonSerialization"
  - "PodSpecBuilder_ProjectedSecrets_NamedInMaskEnvWithoutValues"
  - "PodSpecBuilder_SecretMarkedMaskFalse_IsNotNamed"
  - "AgentSecretValues_Load_TrimsTerminators_SkipsBinaryOversizedAndShort"
  - "ProcessRunner_LinePrintsASecret_EventCaptureAndTailCarryThePlaceholder"
  - "FileStepHandler_ReadOfTheSecretMount_ContentCarriesThePlaceholderAndKey"
  - "GrepStepHandler_SecretBeyond240Chars_IsMaskedBeforeTruncation"
  - "GrepStepHandler_SecretWithPlus_IsMaskedBeforeSerialization"
  - "StepExecutor_StepMarksGitToken_ItsValueIsMaskedForThatStep"
  - "Step_MaskedEnvKeysField_OlderReaderIgnoresIt"
  - "GitStepCredentials_TokenEnv_MarksGitTokenMasked"
  - "SandboxChannel_FirstStep_CarriesTheConfiguredRegistryTokensAsMaskValues"
  - "FileStepHandler_StagedNpmrcRead_RegistryTokenIsMasked"
  - "SandboxGitOperations_StagedDiffWithMaskedKeys_IsALeak"
  - "GitHistoryScanner_LogWithMaskedKeys_IsReportedAsFinding"
  - "MaskedContentWriteGuard_EditCarryingAPlaceholder_IsRefusedNamingTheKey"
  - "MaskedContentWriteGuard_ContentWithoutPlaceholder_Passes"

done:
  - "`env` and `cat` of a projected secret inside a Kubernetes sandbox return the placeholder to the model, the trail and the trace; so does GIT_TOKEN if a git step prints it"
  - "a staged diff or history log that masked a key blocks commit, checkpoint and consolidation instead of passing the scanner"
  - "an edit of a file holding a masked value fails with the key named and never writes the placeholder"
  - "an older agent image and an older server keep working"
  - "build green, full suite green"
