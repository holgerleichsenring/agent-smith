# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-f147
goal: "A trusted reviewer's Request changes on a GitLab agent-smith MR starts one rework, read from the 'requested changes' system note GitLab writes for every submission."

applies_to: "backend (GitLab MR webhook, GitLab review reader, PR review selection) + docs"

requires: [2026-10-08-e8b9c, 2026-10-08-e8b9d]

facts:
  - claim: "Every Request changes submission, repeated or without a reviewer row, writes a system note 'requested changes' (action requested_changes) authored by the reviewer; an approval only removes the merge block."
    evidence: "observed: 2026-10-08, https://gitlab.com/gitlab-org/gitlab/-/blob/master/app/services/merge_requests/update_reviewer_state_service.rb (execute, create_requested_changes), https://gitlab.com/gitlab-org/gitlab/-/blob/master/app/services/system_notes/merge_requests_service.rb (requested_changes)"
  - claim: "GitLab 19.3+ sends a submitted review as an MR update whose changes.reviewers holds previous and current arrays; requested_changes is a reviewer state."
    evidence: "observed: 2026-10-08, https://docs.gitlab.com/user/project/integrations/webhook_events/ (Submit review events; Reviewer state tracking)"
  - claim: "MR notes list newest first by created_at with author.id, created_at and system; only administrators or owners may set created_at; GET /user returns the token's user; the reviewers API returns each reviewer's current state."
    evidence: "observed: 2026-10-08, https://docs.gitlab.com/api/notes/#merge-requests, https://docs.gitlab.com/api/users/#retrieve-the-current-user, https://docs.gitlab.com/api/merge_requests/#retrieve-merge-request-reviewers"
  - claim: "A GitLab MR update without oldrev starts nothing; the label handler takes only an added label."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/GitLabMrEventWebhookHandler.cs:66-73, src/backend/AgentSmith.Server/Services/Webhooks/WebhookEndpointsExtensions.cs:39-41,48,58"
  - claim: "PrReworkAdmission filters branch, fork, author, owner and trust, then enters and answers; the Azure DevOps handler reads its standing act from the host before admitting."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/PrReworkAdmission.cs:31-46,61-81, src/backend/AgentSmith.Server/Services/Webhooks/AzureDevOpsPrReviewVoteWebhookHandler.cs:35-67"
  - claim: "The run takes a provider's act newer than the previous attempt by a trusted reviewer, dropping bot and system notes."
    evidence: "src/backend/AgentSmith.Application/Services/Rework/PrReviewFeedbackFetcher.cs:41-42,54-64,81-87"
  - claim: "Any note opening '<!-- agentsmith:' is kept as ours without checking who wrote it; a note carries no ours flag."
    evidence: "src/backend/AgentSmith.Application/Services/Rework/PrReviewSelection.cs:15,22-34, src/backend/AgentSmith.Application/Services/Rework/PrReviewFeedbackFetcher.cs:75, src/backend/AgentSmith.Contracts/Reviews/PrReviewNote.cs:9-10"
  - claim: "The GitLab reader maps author id and bot from the users API (88 lines); GitHub reads the review in one GraphQL query; Azure DevOps maps threads in one place."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Source/GitLabPrReviewThreadReader.cs:13-14,49-64, src/backend/AgentSmith.Infrastructure/Services/Providers/Source/GitHubPrReviewThreadReader.cs:19-33, src/backend/AgentSmith.Infrastructure/Services/Providers/Source/AzureReposReviewMapping.cs:13-15"
  - claim: "GitLabSourceProvider is 401 of a 421 baseline; the docs say GitLab starts no rework."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Source/GitLabSourceProvider.cs:19,282-312, tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:12, docs/reference/integrations/pr-comments.md:75"

assumptions:
  - claim: "The REST notes API returns the 'requested changes' system note with system true, the reviewer as author and body 'requested changes'."
    check: "Request changes twice on a 19.3 test MR and list its notes."

scope:
  in: >
    GitLabMrActReader (IPrReviewActReader): MR notes newest first, paged by 100 (GitLabNotesPager, shared
    with the thread reader); per author the newest system note whose body is 'requested changes', not by
    the MR author nor the token's user (GET /user, once per read), dropped when the reviewers API shows that
    reviewer approved now; returned as a non-system note at its created_at, bot from the users API.
    GitLabMrReviewWebhookHandler, before GitLabMrLabelWebhookHandler: an MR update whose current reviewers
    include one in requested_changes reads the act and goes through PrReworkAdmission as the Azure DevOps
    vote handler does. Ours: PrReviewNote.IsOurs, set by each reader only for a marked note written by the
    token's identity (GitHub viewer in the same query, GitLab GET /user, Azure DevOps connectionData);
    PrReviewSelection and the fetcher use it. Docs: GitLab 19.3+, Merge request events, an api-scope token.
  out: "Enqueueing instead of admitting inline, for every host (2026-10-08-0781)."

decisions:
  - key: "GITLAB KEEPS THE TIME: the system note is written by GitLab for each submission, authored by the reviewer and not settable through the API, so no record of ours is needed."
  - key: "AN APPROVAL WITHDRAWS IT, as GitHub's latest review and Azure DevOps' standing vote do; a reviewer without a row still counts."
  - key: "OURS IS MARKER AND ACCOUNT: a stranger can paste a marker; only the token's own notes are ours."

steps:
  - id: reader
    action: "Add GitLabNotesPager and GitLabMrActReader; GitLabSourceProvider implements IPrReviewActReader in one line."
  - id: webhook
    action: "Add GitLabMrReviewWebhookHandler and register it before GitLabMrLabelWebhookHandler."
  - id: ours
    action: "Add PrReviewNote.IsOurs, set it in the three readers, use it in PrReviewSelection and PrReviewFeedbackFetcher."
  - id: docs
    action: "Replace pr-comments.md:75 with the GitLab setup; add GitLab to webhooks.md."

tests:
  - "GitLabActReader_RequestedChangesNote_ReturnsActAtCreatedAt"
  - "GitLabActReader_RepeatedRequest_NewestNote"
  - "GitLabActReader_ReviewerApprovedSince_Empty"
  - "GitLabActReader_MrAuthorOrTokenUser_Ignored"
  - "GitLabMrReview_ReviewerInRequestedChanges_StartsRework"
  - "GitLabMrReview_NoRequestedChanges_NotHandled"
  - "Select_MarkedNoteByStranger_IsNotOurs"
  - "GitLabThreads_SystemNote_NotFeedback"

done:
  - "Webhook mode, GitLab: Request changes on an agent-smith MR starts one attempt whose context carries the pull-request act whoever claims it; a repeated Request changes after that attempt starts the next."
  - "A marked note by anyone but the token's identity is a stranger's note on all three hosts; GitLabSourceProvider under its baseline; full suite green."
