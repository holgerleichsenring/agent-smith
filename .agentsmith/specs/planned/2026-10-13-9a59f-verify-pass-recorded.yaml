# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-9a59f
goal: "Every master pass of a spec is recorded with why it opened and ended, its verdicts, the steps it worked and its cost, so spend reads per spec, pass and command, across a park."

applies_to: "backend (master re-engagement loop, event attribution, run-event projections, persistence, run and ticket read endpoints) + the dashboard's hub-events mirror"

requires: [2026-10-13-9a59d, 2026-10-13-9a59e, p0341c, p0365, p0374a, p0388a, p0391, p0466, 2026-08-25-61f1]

