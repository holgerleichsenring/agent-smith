assumptions:
  - "2026-10-13-9a59d splits RunEventApplier into projection families and lets a later member register a family; 9a59d defines EventType 83."
  - "2026-10-13-9a59e provides TicketSeriesReader and its per-spec steps from the cut, which this spec annotates with how each step was worked."

scope:
  in: >
    EXTRACT: ReengageWhileProductiveAsync's for-loop and exits plus ReadChangedPathsAsync move to MasterReengagementLoop,
    one pass's try/catch body to ReengagePass (returns tool calls, blocked claim, threw, reparsed verification) and the
    two log helpers to ReengageStopLog, each under 120 lines; the loop returns its end reason and whether each pass emitted a
    verdict; AgenticMasterHandler's baseline line drops to its new length. REASONS: ReengageReasonPolicy (own class)
    names why the loop re-engages (red-with-open-steps, unbacked-done, gate-unsatisfied) or stops (nothing-left,
    budget, red-accepted, verdictless); MasterReengagementPolicy.ShouldReengage delegates to it in one line. End
    reasons: re-engaged, nothing-left, budget, red-accepted, verdictless, idle, blocked, self-refilled, cap, question,
    failed. A pass that ends re-engaged also carries the reengageReason the next pass opens with, so the return edge is
    labelled from the ended pass alone. Opened because, read in this order: after-answer (the
    last pass ended on a question), review-fix, structure-correction, repair, else first; a re-engagement pass opens
    with its re-engage reason. RECORD: MasterPassRecorder opens a pass frame synchronously (IDisposable) around pass 0
    and each re-engagement pass and publishes MasterPassEndedEvent (EventType 84) at every exit: spec id, run-wide
    pass ordinal, pass in step, opened and ended because, reengageReason (only when ended re-engaged), verdict emitted this pass, criteria met and total (null
    without a verdict or on a refusal), per-criterion verdicts (criterion, status, evidence), the gate's Describe()
    line, actionable pending and unbacked done counts. Only spec steps record (CurrentSpecId non-null); scan and
    spec-dialog masters publish nothing. The ordinal and last-ended-on-question are context keys in a new
    ContextKeys.MasterPass.cs, carried by the checkpoint. STAMP: IRunContextAccessor gains CurrentMasterPass and
    BeginMasterPassScope as default members; RunEvent gains OriginSpecId and OriginMasterPass, stamped by
    StepAttributingEventPublisher. STORE: RunPass and RunLedgerTransition (RunId, EventSeq, SpecId, MasterPass,
    TransitionsJson) rows, unique on (RunId, EventSeq), registered through RunChildConfiguration.Children and
    RunRecordIdentityConfiguration; RunLlmCall gains SpecId and MasterPass; both migration sets; deleted in the run's
    deletion transaction; this spec registers its own passes family on 9a59d's dispatcher, holding both arms; RunLlmCallProjection copies the stamps.
    READ: GET /api/runs/{runId}/passes (runs.read, RunPassEndpoints) per spec: passes in ordinal order, each with its
    run-wide ordinal and passInSpec (1-based rank of the ordinal within its spec, the number q, r and s display), opened
    and ended reasons and reengageReason, counts, per-criterion verdicts, the steps each moved, cost and call count; a pass with stamped calls
    and no end row reads ended unknown; spec cost outside passes; calls with no spec grouped derive (DeriveSpec), pr
    (CommitAndPR, PrCrossLink) or other by the RunStep with the call's step index and the largest EventSeq below the
    call's; calls with no step index are not attributed. STEPS AS WORKED: 9a59e's series read gains, per step, its
    state and the attempt and run-wide pass that last moved it to done, folded from RunLedgerTransition.
  out: >
    Rendering passes per attempt and the graph lanes (2026-10-13-9a59q). The Cost and compute tab
    (2026-10-13-9a59s). Model time and pod time per segment (2026-10-13-9a59j). Sandbox end reasons
    (2026-10-13-9a59i). Per-repository cost inside a pass: a spec names one repository (f5f7a), so per spec is per
    repository, read by 2026-10-13-9a59s from this endpoint.

decisions:
  - key: "STAMP, NOT A TIME WINDOW. RunLlmCall has no event time and the trail is pruned after 90 days; a producer stamp is clock-free and replay-safe."
  - key: "ONE EVENT AT THE END OF A PASS. A pass that dies with the run leaves stamped calls and no end row, read as ended unknown; no open-pass row to close in RunFinished."
  - key: "A RUN-WIDE ORDINAL BESIDE THE LEDGER'S PASS. p0374a's per-invocation pass stays in the transitions JSON; the stamped ordinal is what survives a park and a repair (review F7: beside, not replacing)."
  - key: "A PASS VERDICT IS NOT THE SPEC VERDICT. The pass stores what the master reported in it; 9a59e's RunSpec.AcceptanceJson stores VerifySpec's account when the spec ends. Two moments, two writers."
  - key: "TRANSITIONS GET A TABLE. The trail row is pruned at 90 days and carries no spec or ordinal; RunLedgerTransition is the projection a reader can query, the same relation RunLlmCall has to its trail event."
  - key: "RUNLLMCALL.SPECID IS KEPT. A step index can name two RunStep rows after a park (PipelineExecutor.cs:112,130 with DialogueCheckpointWriter.cs:30-31), so the call states its own spec; the command of a call outside a spec is resolved by the step row with the largest EventSeq below the call's."
  - key: "AFTER-ANSWER IS READ FIRST. Review cut 3 put it fourth; a master resumed after a question inside a repair would then read 'repair' and lose the answer. The last-pass-ended-on-question key is set only by the recorder and cleared on the next open, so it is exact."
  - key: "DEFAULT INTERFACE MEMBERS. The pass frame is added to IRunContextAccessor as default members so the test stubs compile unchanged; the recorder's open is synchronous because an AsyncLocal frame set inside an async method does not outlive it."
  - key: "A FAMILY OF ITS OWN. RunPass and RunLedgerTransition arms sit in a passes family rather than the specs family, which 9a59d and 9a59e already fill toward 120 lines."
  - key: "THE GATE'S OWN WORDS. The recorded label is AcceptanceJudgement.Describe(); nothing checks criteria against the diff, so 'no evidence in the diff' is not produced."
  - key: "WHEN THE MASTER RE-ENGAGES IS UNCHANGED. The reason function returns exactly the branches ShouldReengage has: re-drives red-with-open-steps, unbacked-done, gate-unsatisfied; stops budget, red-accepted (red with a drained ledger, MasterReengagementPolicy.cs:87-88), verdictless (MasterAcceptanceGate.VerdictlessAfterOneRedrive, MasterReengagementPolicy.cs:104-108) and nothing-left (fall-through, :109). The off-code-pipeline stop (:69-70) gets no reason because a spec step only runs in the code preset (PipelinePresets.Code.cs:70); existing policy tests stay green unmodified. The vocabulary grew in round 3 (red-accepted, verdictless): 2026-10-13-9a59q and 2026-10-13-9a59s mirror it."
  - key: "THE ENDED PASS NAMES WHY IT RE-ENGAGED. The mock labels the return edge with the reason; carrying reengageReason on the ended pass (not only the next pass's opened-because) lets 2026-10-13-9a59q label the edge from one row."
  - key: "PASS NUMBER PER SPEC IS SERVED, NOT DERIVED. The ordinal stays run-wide (it survives a park and a repair); the read adds passInSpec so the dashboard members never re-rank (main-thread decision 7, 2026-10-13)."
  - key: "THREE CLASSES OUT OF THE HANDLER. The loop body alone is about 112 lines (AgenticMasterHandler.cs:718-829); with the cap, the changed-paths read and seven recorder calls it cannot fit one class under 120, so the pass body is ReengagePass and the logs ReengageStopLog."

steps:
  - id: extract
    action: "Move the re-engagement loop and exits to MasterReengagementLoop, one pass's try/catch body to ReengagePass and the log helpers to ReengageStopLog (each < 120 lines); lower the AgenticMasterHandler baseline line to its new length; behaviour unchanged."
  - id: reasons
    action: "ReengageReasonPolicy with the reason enum (re-drive: red-with-open-steps, unbacked-done, gate-unsatisfied; stop: budget, red-accepted, verdictless, nothing-left); ShouldReengage delegates in one line (MasterReengagementPolicy shrinks from 118)."
  - id: contracts
    action: "MasterPassEndedEvent with EventType 84 (EventType.cs 114 -> 116 of 120 after d's 83: one comment line + the entry), resolver entry (78 lines), hub-events.ts mirror, FilterRail.tsx LABELS entry for MasterPassEnded (exhaustive record; pnpm build is part of the proof) and the TYPE_KEYS entry in eventFilterQuery.ts; a run event, so no describeSystemEvent case; RunEvent (33 lines) gains OriginSpecId and OriginMasterPass; ContextKeys.MasterPass.cs."
  - id: ambient
    action: "IRunContextAccessor (44 lines) default pass members; AsyncLocalRunContextAccessor (71 lines) implements them; StepAttributingEventPublisher stamps step, spec and pass, each only when unset."
  - id: recorder
    action: "MasterPassRecorder holds the ordinal and last-question flag in context, opens the frame synchronously, reads the opener in the stated order and publishes the end; called at pass 0 in the handler and per pass in the loop."
  - id: schema
    action: "RunPass and RunLedgerTransition in RunChildConfiguration.Children and RunRecordIdentityConfiguration.Unique; RunLlmCall gains SpecId and MasterPass; one migration per set; RunDeletionRepository deletes both (about 92 -> 94 of 120 after b, d, e); DataArchiveRoundTripTests.cs:33,54,81 and DataArchiveSchemaTests.cs:63 table count +2 and DataArchiveRoundTripTests.cs:34 row count +4 on what b, d and e left (running total 41 -> 43 tables, 84 -> 88 rows)."
  - id: project
    action: "Passes family registered on 9a59d's dispatcher: RunPassProjection and RunLedgerTransitionProjection insert once per (RunId, EventSeq); RunLlmCallProjection (51 lines) copies the stamps."
  - id: read
    action: "RunPassesReader and RunPassEndpoints: passes per spec with ordinal, passInSpec and reengageReason, steps moved per pass, verdicts, cost buckets (pass, spec outside passes, derive, pr, other, not attributed); route-permission-baseline.tsv regenerated."
  - id: steps-as-worked
    action: "StepsAsWorkedFold annotates 9a59e's series read steps with state, attempt and run-wide pass from the attempts' RunLedgerTransition rows for that spec."
  - id: tests
    action: "Red first: policy, recorder, projection, reader and fold tests below; a scripted harness run proves cost per pass equals the sum of its scripted calls."

