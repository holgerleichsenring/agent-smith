done:
  - "A spec that re-engaged twice reads three passes numbered 1-3 within the spec, each with why it opened and ended (a re-engaged end names its reason) and its own cost."
  - "A pass that stopped red with nothing left or without a verdict reads red-accepted or verdictless, never nothing-left."
  - "A pass that ended without a verdict shows no criteria counts rather than the previous pass's."
  - "After a park and an answer, the resumed master's pass continues the numbering and says it opened after an answer."
  - "Calls outside any pass are priced as spec-outside-passes, derive, pr or other; calls with no step are reported as not attributed, never guessed into a pass."
  - "The ticket series read names, per step, the attempt and pass that completed it."
  - "Scan and spec-dialog masters record no passes; replaying the trail stores each pass once; deleting the run removes its passes and transitions."
