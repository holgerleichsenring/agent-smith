# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-101b
goal: "A tracker entry is served by polling or by webhooks, never both: a polling entry's projects get nothing from webhook deliveries and the delivery list says why; the poller serves only its own entry."

applies_to: "backend (webhook handlers, request processor, poller, startup findings, config snapshot) + dashboard + docs"

requires: [2026-10-08-9e6e, 2026-10-08-10b0]

facts:
  - claim: "Polling is switched per tracker entry; the project-level block is deprecated and ignored by the pollers."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/TrackerConnection.cs:55-60, src/backend/AgentSmith.Application/Services/Configuration/PollingConfigDeprecationWarner.cs:6-24, src/backend/AgentSmith.Server/Services/PollerFactory.cs:32-45"
  - claim: "The poller resolves a ticket against every project, not only its own entry's; only discovery filters by tracker name."
    evidence: "src/backend/AgentSmith.Application/Services/Polling/TrackerPoller.cs:107-115,134-141, src/backend/AgentSmith.Application/Services/Polling/TrackerDiscoveryQueryBuilder.cs:26-32"
  - claim: "The request processor drops every handler's NotHandled reason; it is at its 126-line baseline."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookRequestProcessor.cs:40-45,97-108, tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:99"
  - claim: "An empty match list makes the dispatcher post the zero-match comment."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookSpawnDispatcher.cs:24,33-37,64-80"
  - claim: "A PR command resolves through the model before routing; plan answers are parsed only by the comment handlers."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/PrCommentCommandAdmission.cs:21-40, src/backend/AgentSmith.Server/Services/Webhooks/KeywordCommentRouter.cs:26-42"
  - claim: "A Blocking finding is read only by project resolution, discovery and filed-work start, so it does not stop PR paths."
    evidence: "src/backend/AgentSmith.Application/Services/Triggers/ProjectResolver.cs:95-108, src/backend/AgentSmith.Application/Services/Polling/TrackerDiscoveryQueryBuilder.cs:76-82, src/backend/AgentSmith.Server/Services/SpecDialog/FiledWorkStarter.cs:70-73"
  - claim: "Startup announces config warnings; webhook secrets resolve per platform."
    evidence: "src/backend/AgentSmith.Server/Services/Startup/StartupAnnouncer.cs:12-24, src/backend/AgentSmith.Contracts/Services/IWebhookSecretResolver.cs:11-18"
  - claim: "The snapshot and the dashboard read the deprecated project-level block; the dashboard type is hand-mirrored."
    evidence: "src/backend/AgentSmith.Server/Services/Config/ConfigSnapshotMapper.cs:94-101, tests/AgentSmith.Tests/Server/ConfigSnapshotMapperTests.cs:175-176, src/dashboard/src/lib/configApi.ts:50-57, src/dashboard/src/components/system/ProjectDetailPanel.tsx:149-153"

assumptions: []

scope:
  in: >
    TriggerMode.Polls(project): its tracker entry has polling enabled. The gate sits in the webhook
    handlers only, after parsing and before any model or host call (the PR command handlers before
    PrCommentCommandAdmission), dropping polling projects from the matches; none left: NotHandled('project P
    polls tracker T; webhooks start nothing for it'), never the zero-match comment. Resolvers and launchers
    stay ungated for 2026-10-08-10b0. WebhookRequestProcessor.DispatchAsync returns the last NotHandled
    reason. TrackerPoller resolves only among projects of its own entry. Startup Advisory finding per
    polling tracker whose platform also has a webhook secret. ConfigSnapshotMapper maps the entry's
    polling; its test, configApi.ts and fixtures follow; the panel shows the mode. Docs: one mode per
    tracker entry; webhooks are only faster.
  out: "Removing the deprecated project-level block."

decisions:
  - key: "PER TRACKER ENTRY: that is where polling is switched; 'per project' means its entry's mode."
  - key: "GATE AT THE DOOR, NOT IN THE ROUTERS: the PR sweep reuses the resolvers and must not be refused by them."
  - key: "ADVISORY, NOT BLOCKING: a blocking finding would not stop PR paths and a secret is per platform, so the finding names the polling entry whose platform still sends."
  - key: "PLAN ANSWERS IN POLLING arrive through 2026-10-08-9e6e's sweep nudge."
  - key: "SHIPS LAST: before 9e6e and 10b0 a polling project would lose acts and PR events with no other path."

steps:
  - id: gate
    action: "Add TriggerMode and apply it in each webhook handler; return the skip reason from DispatchAsync (the 10b0 extraction left room)."
  - id: poller
    action: "Filter TrackerPoller's matches to its own entry's projects."
  - id: surface
    action: "Add the advisory finding to the startup announcement; map the entry's polling into ConfigTrigger; test, dashboard type, fixtures and panel; docs."

tests:
  - "WebhookGate_PollingProject_NotHandledWithReason"
  - "WebhookGate_AllGated_NoZeroMatchComment"
  - "WebhookGate_PrCommand_NoModelCall"
  - "PrSweep_PollingProject_StillServed"
  - "TrackerPoller_OtherEntrysProject_NotServed"
  - "Startup_PollingTrackerWithWebhookSecret_Advisory"
  - "ConfigSnapshot_EntryPolling_IsTheMode"

done:
  - "A delivery for a polling entry's project starts nothing and the webhook list shows the reason; a webhook entry is unaffected; the poller serves only its entry."
  - "The panel shows each project's mode; full suite and dashboard tests green."
