# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-fbbdb
goal: "A context may declare the formatter its repository uses; the spec commit runs it first, so layout rules like line length are the formatter's job, not a criterion or a gate."

applies_to: "backend (context.yaml contract, spec commit) and skills catalog (project-bootstrap)"

requires: [2026-10-06-8565d]

facts:
  - claim: "A context declares verify stages, each a command run at the repository root."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlVerifyStage.cs:19-27, src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlDocument.cs:32"
  - claim: "The spec commit pushes the work through the checkpointer and reports success."
    evidence: "src/backend/AgentSmith.Application/Services/SpecExecution/CommitSpecWorkHandler.cs:30-37"
  - claim: "The bootstrap master adopts the verify gate a repository already has."
    evidence: "observed: 2026-10-12, agent-smith-skills origin/main 6c04986, skills/_masters/project-bootstrap/SKILL.md:161-195"

scope:
  in: >
    context.yaml gains optional 'format' — one command, run through /bin/sh -c at the repository root like a verify
    stage, with an optional when_present path. The spec commit runs each context's format command in its sandbox
    before the push; a non-zero exit is logged and named in the step's note, never failing the commit — layout is
    not a verdict. Schema, ContextYamlDocument, the context-yaml writer tool's validation and the dashboard's
    context view follow. SKILLS: project-bootstrap declares format from what the repository already runs (CI or
    scripts); a .NET repository with none gets 'dotnet format whitespace --folder .'. Release and pin.
  out: "A formatter that changes semantics; formatting a repository the spec did not touch."

decisions:
  - key: "BEFORE THE PUSH, NOT AT VERIFY. A formatter rewrites files; the branch must carry its result, and the structure gate then measures formatted code."
  - key: "NEVER FAILS THE COMMIT. A missing tool or a formatter error says so and leaves the work as written."

steps:
  - id: contract
    action: "ContextYamlFormat record; schema; reader and writer validation."
  - id: commit
    action: "CommitSpecWorkHandler runs the declared format commands per sandbox before PushNowAsync."
  - id: skills
    action: "project-bootstrap declares format; release; pin."

tests:
  - "ContextYaml_FormatDeclared_IsRead"
  - "CommitSpecWork_FormatDeclared_RunsBeforePush"
  - "CommitSpecWork_FormatFails_CommitsAndSaysSo"
  - "CommitSpecWork_NoFormat_RunsNothing"

done:
  - "A harness run over a context declaring format sees the format command run before the checkpoint push (scripted sandbox records the order)."
  - "Full suite green."
