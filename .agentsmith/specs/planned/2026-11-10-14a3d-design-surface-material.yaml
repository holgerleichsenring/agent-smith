# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-14a3d
goal: "A design turn is offered the visual, mock, memory and withdrawal tools only when its conversation has what they work on."
applies_to: "default (design turn tool composition, grounding)"
facts:
  - claim: "render_reference, compare_reference, write_mock and read_mock join every design turn with a project and a conversation."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/RenderReferenceToolFactory.cs:29-37"
  - claim: "recall and dispute_memory join every master, while the design turn reads no memory index."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MasterRecordToolHosts.cs:27-41; src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:209-211"
  - claim: "withdraw_filed_ticket joins every design turn with a dialogue identity."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/AgenticMasterHandler.cs:263-267"
steps:
  - id: visual
    action: "render/compare and the mock tools join when the turn holds an upload with a page or stylesheet, a design source, a design system, or a stored mock."
  - id: memory
    action: "The grounding reads each repository's memory index; recall and dispute_memory join only when one exists, and the index is shown."
  - id: withdraw
    action: "withdraw_filed_ticket joins only when the conversation has filed something."
tests:
  - "DesignSurface_SourceUploadNoDesignNoMemoryNoFiling_HasNoVisualMockMemoryOrWithdrawTools"
  - "DesignSurface_WebsiteUpload_HasRenderAndMockTools"
done:
  - "A design turn on a source upload with no design source, no memory store and no filing carries none of those tools."
  - "Backend and dashboard build and tests green."
