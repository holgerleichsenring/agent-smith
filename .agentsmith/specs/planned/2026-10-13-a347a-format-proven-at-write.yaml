# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-a347a
goal: "A declared formatter is proven when it is written: write_context_yaml runs it once on one of the component's sources and refuses a command that does not exit 0, restoring the file."

applies_to: "backend (write_context_yaml tool)"

requires: [2026-10-13-50c7]

facts:
  - claim: "observed: with the bootstrap skill's corrected example in the pinned catalog, gpt-5.6 still declared 'dotnet csharpier {files}', which CSharpier 1.x refuses, so every spec commit's formatter run exited 1."
    evidence: "observed: 2026-10-13, end-to-end init refresh and two code runs on a sample repository"
  - claim: "The writer resolves the round's sandbox, stamps the derivation, and refuses a document through one defect check before writing."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/WriteContextYamlToolHost.cs:131-155"
  - claim: "The structure engine names the source extensions of a language."
    evidence: "src/backend/AgentSmith.Application/Services/Structure/StructureSourceListing.cs:26-28"

scope:
  in: >
    FormatProof (Application): when the document declares format and its when_present path holds, pick the first
    tracked file in an engine extension under the workdir or a source (git ls-files), keep its content, run the command
    with {files} = './<that file>' through the verify command runner, restore the content, and refuse the write when the
    exit is non-zero, quoting the output tail and asking for the repository's rewriting form or no format. No file in a
    measured language: no proof, the write goes on and says so.
  out: "Proving verify stages."

steps:
  - id: proof
    action: "FormatProof called by WriteContextYamlToolHost before the write; refusal through the existing reject budget."

tests:
  - "FormatProof_CommandExitsNonZero_RefusesWithTheOutput"
  - "FormatProof_CommandExitsZero_WritesAndRestoresTheFile"
  - "FormatProof_NoMeasuredSource_WritesAndSaysSo"

done:
  - "A bootstrap round whose model first declares a failing format command is refused and re-declares (harness with a scripted sandbox); full suite green."
