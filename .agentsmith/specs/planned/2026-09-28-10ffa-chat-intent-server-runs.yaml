# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-09-28-10ffa
goal: "A fix request from chat starts a server run through the claim path webhooks use and an init request through the init launcher, each answering the channel for every outcome."

applies_to: "backend (chat intent handlers, the spawn use case's request carriers, the chat relay)"

requires: []

scope:
  in: >
    - FixTicketIntentHandler builds the envelope with PolledTicketEnvelope, as the poller does. That
      gives the tracker-kind spelling the pre-check accepts and the approval fact the pipeline
      selection reads. The trigger comes from TriggerSelectionHelper.ByTrackerType. A pipeline
      override is honoured only where the claim pre-check allows it. The webhook status filter is
      deliberately NOT applied, because an operator asking in chat chose the ticket.
    - InitProjectIntentHandler calls InitRunLauncher, the ticketless door the dashboard already uses,
      which gains an optional origin and a caller-supplied queued summary. Auto-complete defaults to
      false for chat.
    - The use case returns the run id for Claimed and Queued outcomes (ClaimResult, SpawnResult).
    - A chat origin (platform, channel, user) rides IncomingTicketEnvelope and then the initial
      context as a ContextKeys entry. So it reaches the queued candidate, PipelineRequest and the
      checkpoint with no new column and no signature change.
    - The channel gets an answer for every outcome: queued, refused, already claimed, failed to
      start, started, finished, failed, and released after a crash.
    - Questions reach the thread through the bus path that exists today: the conversation state
      holds the run id as its job id, and MessageBusListener tracks that id.
    - The relay ends a run's conversation by publishing Done or Error onto job:{runId}:out once, so
      BusMessageRouter posts it (with the retry and contact buttons), clears the state and ends the
      subscription. The replica that wins the SETNX for RunStarted re-tracks the subscription after
      a restart.
    - Posts are made once, whatever the number of replicas.
    - The conversation state and its job index are renewed while the run is live or parked waiting
      for an answer. For a ticketless init run, renewal is bounded by the run wall-time limit, because
      such runs hold no lease.
  out: >
    Deleting the job-spawning path: 2026-09-28-10ffb (server side), 10ffc (CLI job mode), 10ffd (configuration, deploy, docs), each requiring this phase.

decisions:
  - key: |
      THE JOB PATH CANNOT COMPLETE A RUN (operator decision 2026-09-28). The spawned job gets no
      configuration: BuildJob mounts nothing and passes no --config (KubernetesJobSpawner.cs:107-153),
      the image carries none (AgentSmith.Cli/Dockerfile:62-66), and ConfigDiscovery falls back to a
      file that is not there (ConfigDiscovery.cs:7-25). Projects live in the server database, which
      the CLI's run path never reads.
  - key: |
      INIT CANNOT GO THROUGH THE CLAIM PATH, SO IT USES THE INIT LAUNCHER. The spawn use case refuses an
      empty ticket id (SpawnPipelineRunsUseCase.cs:96-97), and init is ticketless
      (InitProjectIntentHandler.cs:91). The claim pre-check refuses a pipeline that is not code, the
      trigger's default or label-mapped (ClaimPreChecker.cs:21-22, 38-48), and a claim takes a
      ticket lease and moves tracker status (SingleClaimRegionExecutor.cs:37-44). InitRunLauncher
      (InitRunLauncher.cs:36-72) is the server's ticketless door, with no claim and no tracker call.
      The operator's ruling applies to fix intents as written; init takes the door that fits.
  - key: |
      THE FIX ENVELOPE, READ OFF THE CLAIM PATH:
      - its platform is the tracker kind, which the pre-check and the claim lock key read
        (ClaimPreChecker.cs:51-58; TicketClaimService.cs:42), not "slack";
      - a project with no trigger for its tracker is refused (ClaimPreChecker.cs:29-30), and that
        refusal is answered in the channel.
  - key: |
      THE ORIGIN NEEDS A CARRIER. ClaimResult.Claimed returns no run id (ClaimResult.cs:11). The use
      case has no origin parameter (ISpawnPipelineRunsUseCase.cs:16). A queued run is launched later
      from CapacityQueueCandidate (SpawnRequestBuilder.cs:43-64), which carries none either. And
      Run.Platform already means the tracker platform (Run.cs:15). The origin therefore rides a field
      of its own on the request, the queue candidate and PipelineRequest, and appears in RunStarted.
      The origin therefore rides the envelope and then the initial context (SpawnRequestBuilder.cs:66-90),
      which reaches InitialContextJson, PipelineRequest.Context and the checkpoint with no schema change.
      A new parameter would break every Moq Setup and Verify on ExecuteAsync. A new queue column would
      need migrations on all four providers (QueuedTicket.cs:21).
  - key: |
      QUESTIONS USE THE BUS THAT EXISTS. RedisDialogueTransport is keyed by job id, which for a server
      run is the run id (DialogueJobIdentity.cs:20-23; RedisDialogueTransport.cs:21-24). Slack answers
      are published under ConversationState.JobId (SlackInteractionHandler.cs:118-123). Setting that
      to the run id and tracking it in MessageBusListener relays a server run's questions and answers
      with no new transport.
  - key: |
      ONE POST PER EVENT ACROSS REPLICAS. JobsBroadcaster reads every run stream on every replica
      (JobsBroadcaster.cs:12-19). The relay therefore claims each post with a per-run, per-event
      SETNX before sending.
  - key: |
      A CRASHED RUN IS ANSWERED TOO, HONESTLY. StaleLeaseRelease publishes RunCancelRequestedEvent with
      reason stale-lease-reaped on the run stream (StaleLeaseRelease.cs:63-68); the relay keys on that.
      The reconciler then relaunches the ticket as a fresh run built from scratch
      (EnqueuedReconciler.cs:88-92), which carries no origin. So the chat is told that the run was lost
      with its replica and that the server retries the ticket, with the outcome shown on the dashboard.
      The conversation state's 45-minute TTL and its job index (ConversationStateRepository.cs:16, 56)
      would lapse during a long or parked run, and SlackInteractionHandler would then drop the answer
      (SlackInteractionHandler.cs:104-109). Hence the renewal.
  - key: |
      A COLD START DOES NOT LOSE A TERMINAL EVENT. After a restart of every replica, terminal events go
      to the reconciler rather than the router (JobsBroadcaster.cs:109-113, 145-156). The relay is
      therefore also called from that path, and its SETNX keys expire after 24 hours.
  - key: |
      SERIES: first of 2026-09-28-10ff, which turned up during the 2026-09-28 sandbox work. No
      dependency on the other phases; suggested order before 10ffb-d and the transport slices.

  - key: |
      THE BUS RELAY STAYS, AND ITS DEPENDANTS WITH IT. BusMessageRouter (BusMessageRouter.cs:14-63), the
      conversation state's job index (ConversationStateRepository.cs:52-56) and ErrorContext
      (ErrorContext.cs:24) keep serving, now keyed by run id. The Slack retry and contact buttons exist
      only on a bus Error message (SlackErrorActionHandler); the relay's failure post emits them, so
      that handler stays reachable. IMessageBus and RedisMessageBus stay (SpecDialogQuestionPump.cs:26).
steps:
  - id: carriers
    path: "src/backend/AgentSmith.Contracts, src/backend/AgentSmith.Application/Services"
    action: "A ChatOrigin value on the spawn request, the capacity queue candidate, PipelineRequest and RunStartedEvent (mirrored in the dashboard's hub events); webhook and poller callers pass none."
    new:
      - "ChatOrigin: platform, channel and user of a chat-started run"
  - id: handlers
    path: "src/backend/AgentSmith.Server/Services/Handlers"
    action: "Fix builds the envelope and trigger as above and calls the use case; init calls InitRunLauncher; each maps every outcome to a channel reply and records run id as the conversation's job id."
  - id: relay
    path: "src/backend/AgentSmith.Server/Services"
    action: "A relay on run events for chat-origin runs: started, finished and failed replies, the failure post keeping the retry and contact buttons, lease-released handling, TTL renewal, SETNX once-per-event."
    new:
      - "ChatRunRelay: answers a chat-origin run's lifecycle in its channel, once"

tests:
  - "FixTicketIntentHandler_Handle_ClaimsWithTheTrackerKindAndTrigger"
  - "FixTicketIntentHandler_EachSpawnOutcome_RepliesInTheChannel"
  - "InitProjectIntentHandler_Handle_LaunchesThroughTheInitLauncher"
  - "SpawnPipelineRunsUseCase_ChatOrigin_ReachesTheQueuedAndStartedRun"
  - "ChatRunRelay_TwoReplicas_PostOnce"
  - "ChatRunRelay_RunFailed_PostsWithRetryButtons"
  - "ChatRunRelay_LeaseReleased_PostsAndClearsConversation"
  - "ChatRunRelay_LongRun_RenewsConversationState"
  - "SlackAnswer_ChatOriginRun_ReachesTheRunsDialogue"
  - "SpawnPipelineRunsUseCase_ClaimedOrQueued_ReturnsTheRunId"
  - "InitProjectIntentHandler_EachLaunchOutcome_RepliesInTheChannel"
  - "ChatRunRelay_StaleLeaseReaped_ToldTheServerRetries"
  - "ChatRunRelay_TerminalEventOnColdStart_PostsOnce"
  - "ChatRunRelay_ParkedRun_RenewsStateAndJobIndex"
  - "ChatRunRelay_RunEnds_PublishesDoneOnceAndSubscriptionEnds"
  - "SlackModalSubmissionHandlerTests (migrated to the new handler constructors)"

done:
  - "a fix request in chat produces a server run whose question, outcome or crash is answered in the thread exactly once"
  - "an init request in chat launches like the dashboard's"
  - "build green, full suite green, dashboard tests green"
