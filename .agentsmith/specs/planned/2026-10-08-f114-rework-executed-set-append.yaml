# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-f114
goal: "A rework of a fully executed spec set appends new phases for the feedback instead of ending with nothing to run, and a pull-request act re-derives the set as a demand does."

applies_to: "backend (spec revision cause, amendment rule, previous-cut prompt, derivation notice)"

requires: [2026-10-08-e8b9b]

facts:
  - claim: "The cause order is RecutDemand, TicketEdit, Comment, the sha, then Resume or Retrigger; Comment is any foreign comment after our cut comment."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:59-71,92-98"
  - claim: "An approved set is amended only on a demand; Comment and TicketEdit amend an unapproved set; a Retrigger amends only when nothing executed."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-47"
  - claim: "A demand records a new approval attributed to its author at its time, so it cannot fire twice and the set stays approved."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRecutDemand.cs:27-35,54-57,70-82, src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:64-66"
  - claim: "The previous-cut prompt tells the model to repeat executed phases and amend only those not started."
    evidence: "src/backend/AgentSmith.Application/Services/Prompts/PreviousCutPromptSection.cs:21-42"
  - claim: "The parser re-uses the executed head verbatim, builds the model's later entries after it, and refuses more than SpecSet.MaxPhases (8)."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:21-26,79-91, src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:44-49,70"
  - claim: "A set with no unexecuted phase ends the sequence with 'nothing left to run'."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/PhaseSequenceHandler.cs:38-41"
  - claim: "With nothing at the spec path the resolver hands over an approved record, parks a filed ticket missing its set, or derives afresh."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:68-80"
  - claim: "The derivation comment names the re-cut and the kept phases per cause; the kept-set notice names the demand phrase as the door."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRecutNotice.cs:21-39, src/backend/AgentSmith.Application/Services/Specs/ApprovedSetKept.cs:52-62"

assumptions:
  - claim: "ContextKeys.ReworkAct (2026-10-08-e8b9b) carries channel, author and the host's act time, and 2026-10-08-e8b9c sets it for the pull-request channel."
    check: "Read both specs' final text before building."

scope:
  in: >
    SpecRevisionCause.Rework ('rework requested on the pull request'), returned after RecutDemand and before
    TicketEdit when ContextKeys.ReworkAct's channel is the pull request and the run is not resuming. NeedsModel
    is true for Rework on any set, approved included; the revision records an approval attributed to the
    reviewer at the act's time, as a demand does. When the set has no unexecuted phase and the cause is
    Comment, RecutDemand or Rework, PreviousCutPromptSection adds an append paragraph naming the room left
    (MaxPhases minus executed). With no room, NeedsModel is false and the derivation comment says the set is
    full and the feedback needs a new ticket. SpecRecutNotice renders Rework.
  out: "Raising MaxPhases. A ticket-channel cause: Comment and RecutDemand stay."

decisions:
  - key: "REUSE ON THE TICKET, ADD ONLY FOR THE PULL REQUEST. A ticket comment already is Comment, a demand RecutDemand; a review is neither, and without its own cause it reads as a Retrigger that amends nothing executed."
  - key: "A REQUEST CHANGES IS A DEMAND. It is a deliberate act by someone with write access; the approval it records keeps the set approved and stops a second firing."
  - key: "APPEND, NEVER REWRITE. Executed phases stay verbatim; the parser already guarantees it, the prompt now asks for the phases after them."
  - key: "AT THE CAP, SAY SO. Asking the model for a ninth phase only earns a parse refusal; the run ends and the ticket is told why."
  - key: "NO BRANCH, NO HEAD. After a merge or a deleted branch the resolver takes today's path; a fresh derivation sees the feedback sections of 2026-10-08-7c0e and 2026-10-08-e8b9d, and an approved record is handed over and runs whole again against the new base — stated, not prevented."
  - key: "FOLLOWS THE 2026-10-08-e8b9 REWORK SERIES: cut out of e8b9b at review, minted on its own because a series is minted in one go."

steps:
  - id: cause
    action: "Add SpecRevisionCause.Rework and its place in For; NeedsModel true for it with room; the approval in SpecSourceResolver beside the demand's."
  - id: prompt
    action: "Add the append paragraph to PreviousCutPromptSection and the full-set line to SpecRecutNotice."

tests:
  - "Cause_PullRequestAct_IsRework"
  - "Cause_PullRequestActWhileResuming_IsResume"
  - "Cause_TicketChannelAct_StaysComment"
  - "NeedsModel_ReworkOnApprovedSet_True"
  - "NeedsModel_FullSetAtCap_False"
  - "PreviousCut_FullyExecutedComment_RendersAppendWithRoom"
  - "Decide_Rework_RecordsReviewerApproval"
  - "Derive_FullyExecutedSetWithComment_AppendsPhaseAfterHead"

done:
  - "A comment on an unapproved fully executed set, or a Request changes on any, yields a set with new phases after the executed head that the sequence then runs."
  - "At eight executed phases the run derives nothing and says why; full suite green."
