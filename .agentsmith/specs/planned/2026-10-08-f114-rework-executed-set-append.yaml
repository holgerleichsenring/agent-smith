# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-f114
goal: "A rework of a fully executed spec set appends new phases for the feedback instead of ending with nothing to run, and a pull-request act re-derives even an approved set."

applies_to: "backend (spec revision cause, amendment rule, previous-cut prompt, derivation notice)"

requires: [2026-10-08-e8b9b, 2026-10-08-e8b9d]

facts:
  - claim: "The cause order is RecutDemand, TicketEdit, Comment, the sha, then Resume or Retrigger; Comment is any foreign comment after our cut comment."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:59-71,92-98"
  - claim: "An approved set is amended only on a demand; Comment and TicketEdit amend an unapproved set; a Retrigger amends only when nothing executed."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-47"
  - claim: "A demand records a new approval attributed to its author at its time, so it cannot fire twice and the set stays approved."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRecutDemand.cs:27-35,54-57,70-82, src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:64-66"
  - claim: "The previous-cut prompt tells the model to repeat executed phases and amend only those not started."
    evidence: "src/backend/AgentSmith.Application/Services/Prompts/PreviousCutPromptSection.cs:21-42"
  - claim: "The parser re-uses the executed head verbatim, builds the model's later entries after it, and refuses more than SpecSet.MaxPhases (8)."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:21-26,79-91, src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:44-49,70"
  - claim: "A set with no unexecuted phase ends the sequence with 'nothing left to run'."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/PhaseSequenceHandler.cs:38-41"
  - claim: "With nothing at the spec path the resolver hands over an approved record, parks a filed ticket missing its set, or derives afresh."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:68-80"
  - claim: "The derivation comment names the re-cut and the kept phases per cause; the kept-set notice names the demand phrase as the door."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRecutNotice.cs:21-39, src/backend/AgentSmith.Application/Services/Specs/ApprovedSetKept.cs:52-62"
  - claim: "A merged series stays readable from the base: its manifest and specs sit under shared paths, the reader lists planned, done and active, and an existing work branch is checked out as it is."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SeriesPaths.cs:3-12, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:55-64,91-94, src/backend/AgentSmith.Application/Services/Sandbox/SandboxWorkBranchCheckout.cs:48-52"
  - claim: "A failed derivation falls back to a fresh single-phase set, which carries no executed head."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:40,108, src/backend/AgentSmith.Application/Services/Specs/SpecFallback.cs:21-51, src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:57"
  - claim: "The cut reviewer judges the set against the ticket text only."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetDeriver.cs:86-90"
  - claim: "The kept-set door and the edit rule describe only unstarted phases."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/ApprovedSetKept.cs:57-67"

assumptions:
  - claim: "ContextKeys.ReworkAct (2026-10-08-e8b9b) carries author and the host's act time; 2026-10-08-e8b9c sets it for the pull request."
    check: "Read both specs' final text before building."

scope:
  in: >
    ReworkAct.Channel (ticket | pull request), owned here. SpecRevisionCause.Rework ('rework requested on the
    pull request'), after RecutDemand and before TicketEdit, for a pull-request act when not resuming; it
    amends any set, approved included, and carries set.Approval forward unchanged (an unapproved set records
    none). A set with no unexecuted phase under Comment, TicketEdit, RecutDemand or Rework gets an append
    paragraph naming the room left (MaxPhases minus executed) and, for Rework, the pull-request review
    section; the parser refuses such a reply with fewer entries than the head. No room: NeedsModel is false
    and the full-set line replaces 'the rest was cut again' whenever the model did not run. A failed
    derivation over an executed head keeps the set and reports the refusal. TheDoor and TheEditRule name
    appending.
  out: "Raising MaxPhases. Giving the cut reviewer the review section: it keeps judging the ticket text, stated."

decisions:
  - key: "REUSE ON THE TICKET, ADD FOR THE PULL REQUEST: a review is neither a comment nor a demand, and as a Retrigger it amends nothing executed."
  - key: "A REQUEST CHANGES RE-DERIVES BUT DOES NOT RE-APPROVE: the prior approval, conversation included, rides along."
  - key: "APPEND, NEVER REWRITE: the parser keeps the head verbatim; the prompt asks for phases after it."
  - key: "AT THE CAP, SAY SO, on the ticket here and on the pull request through 2026-10-08-e8b9c's comment texts."
  - key: "A MERGED PR IS NOT A LOST HEAD: the base carries the series, so the rework reads it fully executed and appends; only a PR closed unmerged with its branch deleted takes today's path. A squash merge makes a plain re-trigger read as ReviewerEdit; a rework's own cause outranks it."
  - key: "FOLLOWS THE 2026-10-08-e8b9 REWORK SERIES: cut out of e8b9b at review, minted on its own because a series is minted in one go."

steps:
  - id: cause
    action: "Add ReworkAct.Channel, SpecRevisionCause.Rework in For and NeedsModel, the approval carried in SpecSourceResolver."
  - id: prompt
    action: "Add the append paragraph, the head-count refusal, the full-set notice line, the executed-head keep on failed derivation, and the new TheDoor/TheEditRule wording."

tests:
  - "Cause_PullRequestAct_IsRework"
  - "Cause_PullRequestActWhileResuming_IsResume"
  - "Cause_TicketChannelAct_StaysComment"
  - "NeedsModel_FullSetAtCap_False"
  - "Decide_ReworkOnApprovedSet_KeepsPriorApproval"
  - "Decide_ReworkOnUnapprovedSet_RecordsNone"
  - "PreviousCut_FullyExecutedTicketEdit_RendersAppendWithRoom"
  - "Parse_AppendReplyShorterThanHead_Refused"
  - "Notice_CommentAtCap_SaysFull"
  - "Derive_FailsOverExecutedHead_KeepsSet"
  - "Derive_BranchFromBaseCarryingMergedSeries_ReworkAppends"

done:
  - "A comment on an unapproved fully executed set, or a Request changes on any, yields new phases after the executed head that the sequence runs."
  - "At eight executed phases nothing is derived and the ticket says why; full suite green."
