spec: 2026-11-18-9ae8
goal: "An agent's API key secret resolves a value stored in the admin area when its environment variable is empty, as catalog secrets do."

applies_to: "default (chat client builders, ISecretValues)"

requires: [2026-11-17-f3a8d]

facts:
  - claim: "The Claude, OpenAI and Gemini chat client builders read agent.ApiKeySecret straight from the environment."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/ClaudeChatClientBuilder.cs, src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/OpenAiChatClientBuilder.cs, src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/GeminiChatClientBuilder.cs"
  - claim: "A catalog secret resolves the environment first and the stored value second (2026-11-17-f3a8d)."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigSecretResolver.cs"

scope:
  in: "The builders take the key through ISecretValues with the environment first, so a key stored in the admin area reaches the provider and the masker."
  out: "Application secrets."

done:
  - "An agent whose api_key_secret has no environment value runs on the value stored in the admin area."
