# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36h
goal: "No code picks a series' repository by position: the single carrier is replaced by the repositories the specs name, and a series without repos: keeps the one it was found in."

applies_to: "backend (spec placement, approval, persistence)"

requires: [2026-10-12-3a36g]

facts:
  - claim: "The carrier is the pointer's, else the approval's, else scopedRepos[0] — called a guess; ChooseCarrier takes the first configured repo the approval names; Named falls back to the first repo."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCarryingRepoResolver.cs:6-62"
  - claim: "Callers of the carrier resolver."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:63, src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:111, src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedPhaseSetRecorder.cs:81, src/backend/AgentSmith.Application/Services/PhaseExecution/WritePhaseRecordHandler.cs:45"
  - claim: "Reference sets fall back to the first sandbox when the carrier is not found."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MaterializeReferenceSetsHandler.cs:75-86"
  - claim: "The single carrier is carried in ContextKeys.SpecRepo, SpecApprovalRecord.CarryingRepo, SpecSetPointer.CarryingRepo and the ApprovedSeries/TicketSeries columns."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetPublisher.cs:51, src/backend/AgentSmith.Application/Services/PhaseExecution/WritePhaseRecordHandler.cs:66, src/backend/AgentSmith.Contracts/Specs/SpecApprovalRecord.cs:27-68, src/backend/AgentSmith.Contracts/Specs/SpecSetPointer.cs:22-30, src/backend/AgentSmith.Infrastructure.Persistence/Entities/ApprovedSeries.cs:44-45, src/backend/AgentSmith.Infrastructure.Persistence/Entities/TicketSeries.cs:21-22"
  - claim: "The master can add a repository mid-run; the tool host has no store access."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/EnsureRepoSandboxToolHost.cs:14-34"

assumptions: []

scope:
  in: "Delete Resolve's, ChooseCarrier's, Named's and MaterializeReferenceSetsHandler's positional fallbacks; replace the single carrier by the specs' repos in context, approval record, pointer and both tables; legacy series; ensure_repo_sandbox appends to repos:."
  out: "Nothing else; this is the last slice of the placement program."

decisions:
  - key: "DELETED, NOT DEMOTED: a fallback by position stays a guess at any rank."
  - key: "LEGACY BY WHERE IT WAS FOUND: a series without repos: is read in the repository whose branch holds its manifest (the reader finds it by ticket key); 3a36d's import records that repository as the series' repos:."
  - key: "NOTHING FOUND, NOTHING GUESSED: a filed or derived series whose repositories cannot be named refuses with the reason, as a missing set parks today."
  - key: "REPOS: IS PLACEMENT, NOT CONTENT: ensure_repo_sandbox appends the repository to the running spec's repos: in the store; the approval stands."
  - key: "COLUMNS RETIRE WITH A MIGRATION: CarryingRepo values become the stored series' repos: for series without one, then the columns are dropped, in both assemblies."

steps:
  - id: resolver
    action: "Replace SpecCarryingRepoResolver with a lookup of the stored specs' repos:; refuse when none is named; update its four callers."
    modify:
      - "SpecCarryingRepoResolver, DeriveSpecHandler, FiledSpecBranch, ApprovedPhaseSetRecorder, WritePhaseRecordHandler"
  - id: references
    action: "Resolve the reference-set sandbox from the specs' repos:; no first-sandbox fallback."
    modify:
      - "MaterializeReferenceSetsHandler"
  - id: carriers
    action: "Replace ContextKeys.SpecRepo and the three CarryingRepo fields by the series' repositories; migrate the values, then drop the columns."
    modify:
      - "SpecSetPublisher, SpecApprovalRecord, SpecSetPointer, ApprovedSeries, TicketSeries, both pointer stores"
  - id: ensure-repo
    action: "Have ensure_repo_sandbox append the repository to the running spec's repos: in the store."
    modify:
      - "EnsureRepoSandboxToolHost"

tests:
  - "SeriesRepos_NoRepoNamed_Refuses"
  - "SeriesRepos_LegacySeries_UsesRepoItWasFoundIn"
  - "MaterializeReferenceSets_CarrierMissing_DoesNotFallBackToFirst"
  - "EnsureRepoSandbox_AddedRepo_JoinsSpecReposApprovalStands"
  - "Migration_CarryingRepo_BecomesRepos"

done:
  - "A grep for scopedRepos[0], sandboxes.First() and repos[0] in the spec placement code finds nothing."
  - "Migrations in both assemblies; SQLite and SQL Server suites green."
