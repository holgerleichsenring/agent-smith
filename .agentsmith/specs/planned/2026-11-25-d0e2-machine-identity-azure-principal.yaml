# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-25-d0e2
goal: "A project's Azure DevOps machine identity can be a service principal: agent-smith mints Entra tokens and sends them as Bearer on every Azure Repos call and git push."

applies_to: "default (machine identity, Azure Repos clients, git credential helper)"

requires: [2026-11-25-9992h]

facts:
  - claim: "A service principal cannot create PATs; it requests an Entra access token for the Azure DevOps resource and sends it as a Bearer token (Microsoft Learn, service-principal-managed-identity)."
    evidence: "observed: 2026-11-25, https://learn.microsoft.com/en-us/azure/devops/integrate/get-started/authentication/service-principal-managed-identity"
  - claim: "The Azure Repos clients authenticate with Basic over a PAT (VssBasicCredential and Basic headers)."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Source/DefaultAzDoClientFactory.cs:83; src/backend/AgentSmith.Infrastructure/Services/Factories/PrDiffProviderFactory.cs:63; src/backend/AgentSmith.Infrastructure/Services/Webhooks/AzureDevOpsPermissionReader.cs:50; src/backend/AgentSmith.Infrastructure/Services/Providers/Discovery/AzureDevOpsRepoDiscoveryProvider.cs:38"

scope:
  in: "machine.azure_devops with tenant_id and client_id over a client-secret auth; a cached Entra token; Bearer on the Azure Repos clients and an extra-header git credential for the principal."
  out: "Managed identities; Azure Boards trackers."

done:
  - "An Azure DevOps machine identity with tenant_id and client_id pushes, opens, comments on and merges pull requests with an Entra token, pinned on faked token responses."
