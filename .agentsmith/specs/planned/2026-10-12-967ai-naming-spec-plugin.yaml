    update-project and deliver-spec keep naming the old layout and phase/{id} only where they describe migrating it.
    Release 2.6.0 through the plugin's own PR.
  out: "skills/update-project/scripts/migrate-specs-layout.py and its tests (they must name the old layout). The plugin's own specs/ and decisions/ (history)."

tests:
  - "skills/update-project/scripts/test_migrate_specs_layout.py and skills/review-spec/scripts/test_check_evidence.py green"

