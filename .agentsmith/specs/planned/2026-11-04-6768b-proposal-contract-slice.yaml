# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-04-6768b
goal: "An epic whose children in other repositories read names a sibling defines gets a finding unless the contract declares those readers and an own contract slice, first in order, owns the names."

applies_to: "default (Contracts series contract, Application contract reader/yaml/prompt section, spec-dialog proposal review, repositories section and DialogDraftRepos split text)"

facts:
  - claim: "Only an epic proposal carries a contract; a ticket-list ticket has key, title, requirement, done, requires and repos and nothing else."
    evidence: "src/backend/AgentSmith.Contracts/Models/OutcomeProposal.cs:51,54; src/backend/AgentSmith.Contracts/Models/GraphTicket.cs:9-15; src/backend/AgentSmith.Application/Services/SpecDialog/TicketGraphOutcomeParser.cs:83"
  - claim: "A contract name records its owner and its writers; no field records a member that only reads it, and no field marks a child as the contract."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SeriesContractName.cs:12-13; src/backend/AgentSmith.Contracts/Specs/SeriesContract.cs:8-12; src/backend/AgentSmith.Application/Services/Specs/SeriesContractElements.cs:18-27,53-55"
  - claim: "Each epic child names the repositories it changes, and with two or more repositories in scope the dialog requires exactly one per child and tells the model to split such work into one child per repository."
    evidence: "src/backend/AgentSmith.Contracts/Models/SpecDraft.cs:66; src/backend/AgentSmith.Application/Services/Specs/SpecReposRule.cs:22-23,72-75; src/backend/AgentSmith.Application/Services/SpecDialog/DialogScopeRepositoriesSection.cs:19-26; src/backend/AgentSmith.Application/Services/SpecDialog/DialogDraftRepos.cs:17-18"
  - claim: "The epic parser checks repos, done, requires edges and then the contract; a colliding contract refuses the epic with every collision named."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/EpicOutcomeParser.cs:57,74-79; src/backend/AgentSmith.Application/Services/Specs/SeriesContractCheck.cs:15-28"
  - claim: "The children are put in order from their sibling requires edges, and ties keep the proposed order."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/EpicChildOrderer.cs:17-22"
  - claim: "Mechanical proposal findings already exist: the evidence check emits ProposalFinding with a constant problem and no model call, in the single-review path. The rounds path puts its findings on the proposal in one expression."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/ProposalEvidenceReview.cs:24,50; src/backend/AgentSmith.Application/Services/SpecDialog/SpecDialogProposalReview.cs:54,82"
  - claim: "SpecDialogProposalReview is 118 lines against a 120-line limit."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/SpecDialogProposalReview.cs:118; tests/AgentSmith.Tests/Architecture/FileLengthRatchetTests.cs:19"
  - claim: "The page renders every finding as '{specId} — {problem}: {why}', so a new problem string needs no dashboard change."
    evidence: "src/dashboard/src/components/dialog/DialogProposalFindings.tsx:22-37"
  - claim: "An epic is filed as one work ticket, and its children run in order as one series."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/OutcomeTicketFiler.cs:98-114"
  - claim: "The deployed design-partner master (pin v5.22.0) describes the epic contract as names, data, areas and budgets, with one owner and the rest writers. It names no readers and no contract slice. It also says one long change across several repositories is still one spec, which the server's one-repository rule overrides."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/AgentSmith.Infrastructure.Core.csproj:54; observed: 2026-11-04, agent-smith-skills tag v5.22.0 skills/_masters/design-partner-master/SKILL.md lines 237-242 and 525"
  - claim: "The dashboard renders a proposal's findings but no contract, readers or slices; the person sees a contract only in the reply text."
    evidence: "src/dashboard/src/components/dialog/DialogProposalFindings.tsx:22-37"
  - claim: "An unreviewed spec blocks approval, and the series round adds NotReviewed when the review budget is spent."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOutcomeConfirmer.cs:109; src/backend/AgentSmith.Application/Services/Specs/Review/ProposalSeriesRound.cs:23-36"
  - claim: "The repositories section is server-side prompt text said first so a binary ahead of the skills release asks too, and it renders only when two or more repositories are in scope."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/DialogScopeRepositoriesSection.cs:7-11,19; src/backend/AgentSmith.Application/Services/SpecDialogPromptFactory.cs:46"
  - claim: "In production a three-repository migration was proposed as three children, each one repository's whole layer. The two consumer children required the server child, which alone was to define the API and event contract they used."
    evidence: "observed: 2026-11-04, a production Work-it-out proposal"
  - claim: "A re-proposal in a review round must keep the child ids and count, and the contract is always taken from the last valid proposal, so no round can add a slice or edit readers or slices."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/Review/ProposalReProposalGuard.cs:10-11,23-25,46-50"
  - claim: "Rekeyed, Within and the manifest read each build a new SeriesContract, and the filed series goes through Rekeyed and Within."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SeriesContract.cs:22,41; src/backend/AgentSmith.Application/Services/Specs/SeriesContractYaml.cs:24-28; src/backend/AgentSmith.Server/Services/SpecDialog/FiledSeriesFactory.cs:33; src/backend/AgentSmith.Server/Services/SpecDialog/Continuation/ContinuedContract.cs:21"
  - claim: "The stored proposal serialises its contract to JSON, and filing reads that stored row."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/OutcomeProposalJson.cs:35,50,81"
  - claim: "A contract line's members decide which entries the diff reviewer sorts first for a spec."
    evidence: "src/backend/AgentSmith.Application/Services/Prompts/SeriesContractPromptSection.cs:33; src/backend/AgentSmith.Application/Services/Specs/SpecReviewContractSection.cs:17-18"
  - claim: "An epic with no contract block carries a null contract."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesContractReader.cs:35; src/backend/AgentSmith.Contracts/Models/OutcomeProposal.cs:51"

assumptions:
  - "The production proposal was an epic, the shape the dialog steers multi-repository work into; the brief does not record its kind. If it was a ticket list, the successor 'ticket-list contract slices' is the fix for it."

scope:
  in: "A 'readers' list on a contract name (members that use it without extending it), and a top-level 'slices' list on the contract (the children that are the contract). Both are read, checked for membership, written to the manifest, rekeyed and rendered. A mechanical epic rule over children's repos, sibling requires edges and the contract yields ProposalFindings in both review paths. One server prompt paragraph in the repositories section."
  out: "Ticket-list outcomes: they carry no contract field. Giving them the same readers and slices is a successor spec named in prose here, ticket-list contract slices. Also out: the rule in derivation replies (one run, no merge boundary between specs), though they share the reader and so read and keep readers and slices; refusing the epic (this is a finding the person may overrule); any scope-text or step-text matching; the skill's one-spec-across-repositories wording, which is a separate skills change. No skills release and no pin bump."

steps:
  - id: contract-fields
    action: "SeriesContractName gains Readers (IReadOnlyList<string>?, appended last). SeriesContract gains Slices (IReadOnlyList<string>, init, default empty). Rekeyed and Within map and narrow both. IsEmpty also requires Slices to be empty."
  - id: read-write
    action: "SeriesContractElements' member-list helper takes the field name, so 'readers' is read like 'writers', and a top-level 'slices' as a member list. SeriesContractCheck.NonMembers covers readers and slices, and a reader that is also the name's owner or a writer is a problem. SeriesContractNameEntry and SeriesContractDocument carry readers and slices; SeriesContractYaml writes and reads them; SeriesContractPromptSection.Lines renders 'readers …' with the readers among that line's members, and one 'contract slices: …' line whose members are the slices. Rekeyed, Within and the manifest read copy Slices explicitly, since each builds a new record."
  - id: rule
    action: "EpicContractSliceRule.Findings(OutcomeProposal) is static and returns nothing for anything but an epic. A null contract counts as declaring nothing. A dependent of a name is a reader or a writer. A cross-repo dependent is one whose single repo differs from the owner's. A cross-repo edge is a sibling requires edge from X to S where X and S name different repos. Three findings, each a ProposalFinding on the named child with Quote null. (1) 'interface not declared': a cross-repo edge from X to S, but no name owned by a child in S's repository has X as a dependent. (2) 'contract not its own slice': a name with a cross-repo dependent whose owner is not in contract.slices. (3) 'contract slice not first': a child in contract.slices that requires a sibling, or a cross-repo dependent of a name it owns that does not require it directly. Members are resolved as the parser already did. The rule takes no scope: an edge is cross-repo only between children naming different single repos, so a child naming no repo, or an epic whose children all name one repository, yields nothing."
  - id: review
    action: "SpecDialogProposalReview appends the rule's findings for an EpicOutcome in both paths: one line in SingleAsync before its empty check, and spliced into the rounds path's Findings expression on outcome.Proposal, after rounds.RunAsync and never into a round's cuts, since ProposalReProposalGuard would revert every attempt to apply them. The file stays at most 120 lines."
  - id: prompt
    action: "Reword the split text in DialogScopeRepositoriesSection (lines 25-26) and DialogDraftRepos.EpicSplit (lines 17-18) from 'one child per repository, the child that depends on the other second' to 'an epic whose children each name one repository, with a definition used across repositories cut into its own contract slice first'. The old wording rules out a contract slice and an implementation child in the same repository. Update the tests that pin it (DialogScopeRepositoriesSectionTests, DialogDraftReposTests). DialogScopeRepositoriesSection then adds one paragraph. When a child uses an endpoint, event or type that a child in another repository defines, declare it under the epic's contract.names with the using child under readers. Cut the definition into a child of its own, listed under contract.slices, that requires no sibling and that every reader requires."
  - id: tests
    action: "Unit tests for reading, writing and rekeying the two fields, and for each rule finding and its absences. A proposal-review test where an epic of three per-repo layers, two requiring the third, carries findings (1) or (2). The same work cut with a contract slice first carries none."

tests:
  - "SeriesContractElements_ReadersAndSlices_AreReadAsMembers"
  - "SeriesContractCheck_ReaderOrSliceThatIsNoMember_IsAProblem"
  - "SeriesContractYaml_ReadersAndSlices_RoundTrip"
  - "SeriesContract_Rekeyed_MapsReadersAndSlices"
  - "SeriesContract_Within_NarrowsSlicesAndReaders"
  - "SeriesContractCheck_ReaderThatOwnsOrWritesTheName_IsAProblem"
  - "OutcomeProposalJson_EpicContract_RoundTripsReadersAndSlices"
  - "FiledSeries_ContractSliceEpic_OrdersTheSliceBeforeEveryCrossRepoReaderAndKeepsReadersAndSlices"
  - "EpicContractSliceRule_NoContractAndACrossRepoRequire_FindsInterfaceNotDeclared"
  - "EpicContractSliceRule_CrossRepoRequireWithNoDeclaredName_FindsInterfaceNotDeclared"
  - "EpicContractSliceRule_CrossRepoReaderOfANameOwnedByALayerChild_FindsContractNotItsOwnSlice"
  - "EpicContractSliceRule_SliceThatRequiresASibling_FindsSliceNotFirst"
  - "EpicContractSliceRule_CrossRepoReaderThatDoesNotRequireTheSlice_FindsSliceNotFirst"
  - "EpicContractSliceRule_ContractSliceFirstAndEveryReaderRequiringIt_FindsNothing"
  - "EpicContractSliceRule_OneRepositoryEpic_FindsNothing"
  - "SpecDialogProposalReview_ThreeLayerEpicWithoutAContractSlice_CarriesTheFinding"
  - "DialogScopeRepositoriesSection_TwoRepositories_AsksForReadersAndAContractSlice"
  - "DialogDraftRepos_MultiRepoSpec_RefusalNamesTheContractSliceSplit"

done:
  - when: "an epic's children in two repositories require a sibling in a third repository whose names they use, and the contract lists no readers or no contract slice owning those names"
    then: "the proposal carries a finding on the page naming the child and the missing declaration or slice, and the epic can still be filed"
  - when: "the same work is proposed with a contract slice that requires nothing, owns the names, and is required by every reader in another repository"
    then: "no finding from this rule, and the filed series runs the contract slice before every reader in another repository"
  - "No decision of the rule reads goal, step, scope or done text."
  - "Build green, full suite green, dashboard gen/test/build green."
