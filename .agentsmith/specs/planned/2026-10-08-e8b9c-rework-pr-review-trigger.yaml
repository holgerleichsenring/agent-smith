# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-e8b9c
goal: "Request changes on a pull request from an agent-smith ticket branch starts one rework attempt on GitHub, GitLab and Azure DevOps, and the run reads that act from the pull request itself."

applies_to: "backend (PR webhook handlers, PR review readers, PR body) + docs"

requires: [2026-10-08-e8b9a, 2026-10-08-e8b9b, 2026-10-08-e8b9d, 2026-10-08-f114]

facts:
  - claim: "No handler accepts GitHub's pull_request_review event."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookEndpointsExtensions.cs:30-47, src/backend/AgentSmith.Server/Services/Webhooks/GitHubPrEventWebhookHandler.cs:27-28, src/backend/AgentSmith.Server/Services/Webhooks/GitHubPrCommentWebhookHandler.cs:19-26"
  - claim: "A GitLab MR update without oldrev starts nothing; the label handler needs an added label."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/GitLabMrEventWebhookHandler.cs:66-73, src/backend/AgentSmith.Server/Services/Webhooks/GitLabMrLabelWebhookHandler.cs:43-50"
  - claim: "GitLab 19.3+ sends a submitted review as an MR update whose changes.reviewers holds previous and current arrays; only a state change emits."
    evidence: "observed: 2026-10-08, gitlab-org/gitlab doc/user/project/integrations/webhook_events.md, reviewer state on submitted reviews"
  - claim: "The Azure DevOps PR handler starts pr-review on every active git.pullrequest.updated."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/AzureDevOpsPrEventWebhookHandler.cs:9-16,23-30,41-65"
  - claim: "git.pullrequest.updated's change kind is a subscription filter, not a payload field; the payload lists every reviewer's vote; the Web Hooks consumer can add headers."
    evidence: "observed: 2026-10-08, MicrosoftDocs azure-devops-docs docs/service-hooks/events.md git.pullrequest.updated, docs/service-hooks/consumers.md Web Hooks httpHeaders"
  - claim: "Ticket branches are agent-smith/{ticketId}; agent-smith/init is the init branch; the hierarchical overload has no caller; a rung is published as agent-smith/{parent}."
    evidence: "src/backend/AgentSmith.Application/Services/TicketBranchNamer.cs:18-47, src/backend/AgentSmith.Application/Services/Sandbox/SandboxRungPublisher.cs:62"
  - claim: "The repo finder matches by substring and returns the first project, so app matches app-api; issue numbers are per repository."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Webhooks/ConfiguredRepoFinder.cs:12-34, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubTicketProvider.cs:111, src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitLabFieldMapper.cs:58"
  - claim: "Write access is judged by keyed IPrCommentAuthorTrust; Azure DevOps verifies the Basic Authorization header."
    evidence: "src/backend/AgentSmith.Infrastructure/Extensions/PrCommentAuthorTrustExtensions.cs:24-26, src/backend/AgentSmith.Server/Services/Webhooks/WebhookSignatureVerifier.cs:83-84"
  - claim: "Comments are posted through IPrCommentProvider, reached by casting the repo's source provider; our comments open with an agentsmith marker."
    evidence: "src/backend/AgentSmith.Contracts/Providers/IPrCommentProvider.cs:14-16, src/backend/AgentSmith.Application/Services/Handlers/PostPrCommentsHandler.cs:21-26"
  - claim: "Azure DevOps threads are read today only privately, inside DeleteCommentsByMarkerAsync."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Source/AzureReposSourceProvider.cs:231-245"
  - claim: "The PR body is composed at the spec commit and at the PR step."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecPullRequestOpener.cs:59-61, src/backend/AgentSmith.Application/Services/Handlers/CommitAndPRHandler.cs:320-324"

assumptions:
  - claim: "GitHub's review payload carries review.state 'changes_requested', review.user, review.author_association, review.submitted_at, pull_request.user and pull_request.head.repo."
    check: "A recorded delivery in the handler test; compare state case-insensitively."
  - claim: "A GitLab requested_changes leaves a system note in the MR discussions; an Azure DevOps vote leaves a thread with CodeReviewThreadType VoteUpdate and CodeReviewVoteResult by the voter."
    check: "Act on a test MR and PR, read discussions and threads. A host that fails gets a pending-rework row (project, ticket, act) the admission writes and ReworkActReader consumes."

scope:
  in: >
    PrReworkAdmission: head ref agent-smith/ plus one segment, not init; head repo equals base repo (GitHub
    head.repo.full_name, null for a deleted fork; GitLab source_project_id = target_project_id; Azure DevOps
    no forkSource); every project with a repo whose host+path EQUALS the PR's, kept only with a Run on
    (project, ticket) — none or several: logged, not handled (a rung's parent with no run included); a
    trusted reviewer who is not the PR author; the act to ReworkEntry; one marked comment. GitHub:
    pull_request_review submitted, changes_requested, at submitted_at. GitLab: a reviewer turning
    requested_changes, at object_attributes.updated_at. Azure DevOps: a delivery with X-AgentSmith-Change:
    review-vote never starts pr-review; the act is the newest -5 vote thread, at its publishedDate.
    IPrReviewActReader.LatestChangesRequestedAsync(prUrl) on 2026-10-08-e8b9d's readers serves the vote time
    and ReworkActReader's pull-request channel. PR body sentence. Docs.
  out: "Foreign PRs keep today's routes. The executed-set effect (2026-10-08-f114)."

decisions:
  - key: "THE ACT LIVES ON THE PULL REQUEST, read in the run like the ticket's, so a claimer that never saw the webhook still serves it; no table unless a host cannot answer."
  - key: "EXACT REPOSITORY, THEN A RUN. Substring matching and per-repo issue numbers make the first match a guess."
  - key: "FOLLOWABLE REFUSAL. While run X works: 'when run X ends, submit Request changes again' — on GitLab and Azure DevOps 'reset your review or vote first', since only a change is sent."
  - key: "AZURE DEVOPS BY HEADER: the payload cannot tell a vote; the header subscription never reviews."

steps:
  - id: admission
    action: "Add PrReworkAdmission, an exact host+path project matcher, and the marked comment texts."
  - id: hosts
    action: "Add GitHubPrReviewWebhookHandler and GitLabMrReviewWebhookHandler (before the GitLab MR handlers); route header-marked Azure DevOps deliveries."
  - id: act
    action: "Add IPrReviewActReader to the three readers; add the pull-request channel to ReworkActReader."
  - id: body-docs
    action: "Add the rule sentence to both PR bodies; document GitLab 19.3+, the Azure DevOps push subscription on 'Source branch updated' and a second on 'Reviewer vote changed' with the header and the same Basic credentials."

tests:
  - "GitHubPrReview_ChangesRequestedOnOurBranch_StartsReworkAndComments"
  - "GitHubPrReview_ByPrAuthor_NotHandled"
  - "GitHubPrReview_ForkHead_NotHandled"
  - "GitHubPrReview_InitBranch_NotHandled"
  - "PrRework_PrefixSiblingRepo_DoesNotMatch"
  - "PrRework_NoRunForTicket_NotHandled"
  - "GitLabMrReview_ReviewerBecomesRequestedChanges_StartsRework"
  - "AzureDevOpsPr_VoteHeaderNewestVoteAfterAttempt_StartsRework"
  - "AzureDevOpsPr_VoteHeaderVoteOlderThanAttempt_AlreadyServed"
  - "AzureDevOpsPr_NoHeader_KeepsPrReview"
  - "PrRework_LiveRun_CommentsHostSpecificRetry"
  - "ReworkActReader_ChangesRequestedAfterAttempt_SetsPullRequestAct"

done:
  - "On each host a Request changes on an agent-smith/{id} PR starts one attempt whose context carries the pull-request act whoever claims it; the PR names the run."
  - "A header-marked vote delivery never starts pr-review; full suite green."
