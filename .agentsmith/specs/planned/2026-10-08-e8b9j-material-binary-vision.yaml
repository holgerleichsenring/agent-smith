# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-08-e8b9j
goal: "Uploaded files reach a sandbox byte for byte without python3, an image inside an upload is shown to a vision model on request, and the operator is told when the model sees no images."

applies_to: "backend (sandbox wire and agent, in-process sandbox, reference materialiser, a design-turn tool, dialog view), dashboard (uploads panel)"

requires: ["2026-10-08-e8b9g", "2026-10-08-e8b9h"]

facts:
  - claim: "A file that is not strict UTF-8 is written as base64 and decoded by one python3 step; its failure throws and the set reads as 'could not be opened'. The run carry writes through the same method."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetMaterialiser.cs:31-38,62-105; src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetSandbox.cs:63-66; src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetCarrier.cs:42"
  - claim: "python3 exists in containers only as the agent's injected payload; the in-process backend runs steps in the server, whose image installs curl and no python, and it is the server's final fallback."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Dockerfile:37-42,84; src/backend/AgentSmith.Sandbox.Agent/Services/ProcessRunner.cs:81-91; src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:33-43; src/backend/AgentSmith.Server/Dockerfile:35,42-45; src/backend/AgentSmith.Server/Services/Sandbox/ServerSandboxExtensions.cs:81-89"
  - claim: "WriteFile refuses over 10 MB of UTF-8, so a binary over about 7.5 MB (as base64) or a text over 10 MB cannot be written, although an upload keeps files up to 25 MB."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/SizeLimits.cs:6; src/backend/AgentSmith.Sandbox.Agent/Services/FileStepHandler.cs:115-121; src/backend/AgentSmith.Infrastructure/Services/Sandbox/InProcessSandbox.cs:237; src/backend/AgentSmith.Contracts/Sandbox/ReferenceSetLimits.cs:12-15"
  - claim: "A step kind an agent does not know is read as Unknown and answered with a result naming its protocol, not dropped."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/WireFormat.cs:17-23; src/backend/AgentSmith.Sandbox.Wire/Step.cs:61-67"
  - claim: "Kind switches a new write kind meets: the agent's executor, the in-process sandbox, step facts that summarise a write by its path and hash its content, the mutation classifier; the source-scope guard refuses unlisted kinds."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/StepExecutor.cs:20-28; src/backend/AgentSmith.Application/Services/Events/SandboxStepFacts.cs:30-33,44-55; src/backend/AgentSmith.Application/Services/Events/MutatingCommandClassifier.cs:15-20; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeRefusal.cs:37-47"
  - claim: "Only images uploaded through the Image entry reach the model as pictures — the four most recent, vision only; an image inside a set is reachable only through read_file, which refuses non-UTF-8."
    evidence: "src/backend/AgentSmith.Application/Services/Prompts/DialogImageParts.cs:28,37-52; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnImages.cs:20-30; src/backend/AgentSmith.Sandbox.Agent/Services/FileStepHandler.cs:76-79"
  - claim: "A tool can hand the loop an image through IToolImageDeposit, which refuses over 5 MB or a long edge over 1568 px and tells the model when its provider cannot show one."
    evidence: "src/backend/AgentSmith.Contracts/Providers/IToolImageDeposit.cs:12-16; src/backend/AgentSmith.Infrastructure/Services/ToolImages/ToolImageRule.cs:12-28; src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientFactory.cs:198"
  - claim: "Upload tools join a design turn through ReferenceDesignTools; run_in_reference only where sandboxes are containers. Its pip-in-a-venv and conditional-apt text holds for the default image, which sets no user."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/ReferenceDesignTools.cs:15-35; src/backend/AgentSmith.Application/Services/Tools/ReferenceCommandToolHost.cs:24-32; src/backend/AgentSmith.Application/Services/Sandbox/SandboxImageChain.cs:43; src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs:20-33,78-90"
  - claim: "A reference sandbox knows its set and conversation; the reader returns a set's files whole."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetSandbox.cs:25-44; src/backend/AgentSmith.Contracts/Sandbox/IReferenceSetReader.cs:7-17"
  - claim: "Vision is a per-agent flag; the session view carries no word of it, so the operator is never told."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/AgentConfig.cs:44-50; src/backend/AgentSmith.Server/Models/SpecDialogSessionView.cs:37-42; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogSubjectMinter.cs:98-103"

assumptions:
  - claim: "The operator's OCR attempt ran on an image uploaded through Files or Folder, so the model met it as a sandbox file and reached for python."
    check: "ask the operator which entry was used, or read the turn's trace for read_file / run_in_reference on a .png"

scope:
  in: >
    WIRE: StepKind.WriteBytes = 7 (Path, Content base64), decoded at most SizeLimits.WriteBytesMaxBytes = 25 MB; the
    agent's FileStepHandler and InProcessSandbox decode in C# and write atomically; StepExecutor routes it;
    SandboxStepFacts summarises its path and records neither content nor hash; MutatingCommandClassifier counts it.
    MATERIALISER: every file goes through one WriteBytes step (SandboxByteWriter); DecodeScript, EncodedSuffix and the
    UTF-8 split are deleted; the marker stays. VISION: view_reference_image(reference, path) on every design turn with
    an upload, any backend: reads the file through IReferenceSetReader.FileAsync and deposits it; its answer is the
    deposit's caption, or the refusal plus "attach it through the Image entry to have it shown whole" for size or edge.
    run_in_reference's text adds that images are seen with view_reference_image and no OCR engine is installed.
    OPERATOR: SpecDialogSessionView.SeesImages from the project's agent.supports_vision; when false the uploads panel
    says "This project's model does not see images; N stored image(s) are not shown to it".
  out: >
    An OCR engine: vision reads text in an image, every uploaded image is now reachable by it, and a non-vision model is
    named to the operator — an engine for text-only deployments is not asked for. Downscaling in C# (no image library).
    The four-image turn ceiling (3af8). Runs: 2026-10-08-e8b9k.

decisions:
  - key: "A NEW KIND, NOT A FIELD ON WriteFile. An older agent drops an unknown field and would write the base64 as text; an unknown kind is answered as one."
  - key: "BYTES FOR EVERY FILE. Exact bytes need no text rule; the step count is what it was."
  - key: "FROM THE STORE, NOT THE SANDBOX. The tool works where no container runs and opens none."
  - key: "TOO LARGE IS NAMED, NOT SHRUNK. The Image entry sends a picture whole as a message part."

steps:
  - id: wire
    action: "Add StepKind.WriteBytes and SizeLimits.WriteBytesMaxBytes; handle it in FileStepHandler, StepExecutor and InProcessSandbox; extend SandboxStepFacts and MutatingCommandClassifier."
  - id: materialise
    action: "Add SandboxByteWriter; make ReferenceSetMaterialiser write every file through it and delete the python decode."
  - id: tool
    action: "Add IReferenceSetReader.FileAsync and ReferenceImageToolHost (view_reference_image); compose it in ReferenceDesignTools; extend run_in_reference's text."
  - id: operator
    action: "Add SeesImages to the session view and the not-seen line to DialogUploadsPanel."

tests:
  - "WriteBytes_Agent_WritesExactBytes; OverLimit_Refused"
  - "WriteBytes_InProcess_WritesWithoutPython"
  - "WriteBytesMaxBytes_EqualsReferenceSetFileBound"
  - "ReferenceSetMaterialiser_PngAndPdf_ArriveByteIdenticalInProcess"
  - "ReferenceSetMaterialiser_20MBBinary_IsWritten"
  - "SandboxStepFacts_WriteBytes_RecordsNoContent"
  - "SourceScope_WriteBytes_IsRefused"
  - "ViewReferenceImage_SmallPng_DepositsIt"
  - "ViewReferenceImage_LongEdgeOver1568_SaysUseTheImageEntry"
  - "ViewReferenceImage_NotAnImage_SaysSo"
  - "DesignTurn_InProcessWithUpload_HasViewReferenceImage"
  - "DialogUploadsPanel_SeesImagesFalse_SaysNotShown (vitest)"

done:
  - "a set holding a PNG and a 20 MB PDF opens on the in-process backend and in a container, files byte-identical"
  - "a design turn on a vision model describes a screenshot uploaded inside a folder"
  - "build green, full suite green, dashboard tests green"
