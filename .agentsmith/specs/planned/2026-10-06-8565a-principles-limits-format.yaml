# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-06-8565a
goal: "Each delta declares its size limits as one Limits fence with closed keys, and DELTA-FORMAT says an artefact is green on the day it is installed instead of forbidding enforcement."

applies_to: "skills catalog (principles/DELTA-FORMAT.md, principles/deltas/*.md, scripts/validate-skills.sh)"

requires: [2026-10-03-24d4]

facts:
  - claim: "DELTA-FORMAT states 'An artefact MUST NOT change what the target compiles to' twice, in the Artefacts template and in Writing artefacts."
    evidence: "agent-smith-skills:principles/DELTA-FORMAT.md:46-52,70-84"
  - claim: "The core says size limits are set by the delta and enforced; no delta carries machine-readable data."
    evidence: "agent-smith-skills:principles/core.md:26-28; agent-smith-skills:principles/deltas/csharp.md:7-11; agent-smith-skills:principles/deltas/rust.md:14-20; agent-smith-skills:principles/deltas/typescript.md:15-19; agent-smith-skills:principles/deltas/scala.md:18-27"
  - claim: "validate-skills requires Additions, Overrides and Artefacts per delta and checks nothing inside them."
    evidence: "agent-smith-skills:scripts/validate-skills.sh:199-212"
  - claim: "The composer renders a delta verbatim minus its Artefacts section, so a Limits fence reaches principles.md as written."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Skills/CatalogPrinciplesTemplateSource.cs:49-54,81-118"
  - claim: "A golden test forbids DELTA-FORMAT to name editor configuration, build property file, ruleset, 'arrives red' and 'where the stack's build already looks'."
    evidence: "tests/AgentSmith.Tests/Skills/ComposedPrinciplesGoldenTests.cs:113-131"
  - claim: "a238 matches written config artefacts to verify stages; no such artefact exists since the C# delta dropped them."
    evidence: ".agentsmith/specs/planned/2026-09-15-a238-verify-stage-declares-coverage.yaml:4-24; agent-smith-skills:principles/deltas/csharp.md:103-107"

assumptions:
  - claim: "24d4's ratified numbers are physical lines of a unit's span."
    check: "decisions/2026-10-03-24d4.yaml states the counting rule per number."

scope:
  in: >
    DELTA-FORMAT gains '## Limits': one yaml fence, keys function_lines, type_lines, types_per_file, file_lines,
    positive integers, counted as physical lines of the unit's span; an absent key sets no limit; 'No limits —
    ...' when none applies. Both artefact sentences become: "An artefact is green on the day it is installed.
    What a delta's Limits declare is measured at init and recorded as the baseline; from then on only what
    gets worse fails. A file that changes how the target builds becomes an artefact for a rule only once the
    code holds that rule." Each delta's size prose cites its Limits; numbers are 24d4's. validate-skills
    checks the heading, one fence, closed keys, positive integers. Release the catalog. a238 moves to done/
    unimplemented, SUPERSEDED by this series.
  out: >
    Reading the fence — 8565b. The pin bump and goldens — 8565c.

decisions:
  - key: "ONE FENCE, CLOSED KEYS. The engine and the master read the same block; a key outside the set is a validator failure, not a silent no-op."
  - key: "A NEUTRAL VOCABULARY. function, type, file — each language's grammar data maps its own nodes onto them."

steps:
  - id: format
    action: "DELTA-FORMAT: Limits section, the new artefact wording in both places."
  - id: deltas
    action: "Limits fence in csharp, rust, typescript, scala with 24d4's numbers; size prose points at it."
  - id: validate
    action: "validate-skills checks the Limits section; a negative control proves each check fails."
  - id: supersede
    action: "a238 to done/ with a SUPERSEDED line in context.yaml."

tests:
  - "validate-skills green; each of: missing heading, two fences, unknown key, zero value fails it"
  - "ComposedPrinciplesGoldenTests DeltaFormat_LicensesNoneOfTheRemovedArtefactKinds green against the new text"

done:
  - "a skills release carries the Limits format and four deltas with ratified numbers"
