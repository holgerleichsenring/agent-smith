# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36f
goal: "Each spec's files and index line are written from the database into every repository its repos: names, with a manifest of that repository's specs, and each spec PR counts as opened."

applies_to: "backend (filing, spec publish, spec record, run scope, PR set)"

requires: [2026-10-12-3a36d, 2026-10-12-3a36e]

facts:
  - claim: "observed: series 2026-10-12-eff5 lay in BackgroundWorker while eff5a changed only Server; Server's PR 9476 carried no spec; the cross-link was skipped on every run."
    evidence: "observed: 2026-10-12, AzDO items/commits on agent-smith/19470, RunSteps PrCrossLinkCommand"
  - claim: "Publish writes one carrying repo and opens one draft spec PR; filing writes one branch through the provider; the record commit pushes inside one sandbox."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetPublisher.cs:30-53, src/backend/AgentSmith.Application/Services/Specs/SpecPullRequestOpener.cs:41-42, src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:68-78, src/backend/AgentSmith.Application/Services/PhaseExecution/SeriesRecordCommit.cs:29-32, src/backend/AgentSmith.Application/Services/PhaseExecution/SpecDoneRecorder.cs:1"
  - claim: "The reader lists every spec id from the manifest and refuses a listed spec with no file; it needs a sandbox for the repo."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:42-61, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:81-86, src/backend/AgentSmith.Application/Services/Specs/SeriesSpecFileReader.cs:33"
  - claim: "The index line goes into the shared context.yaml state.done."
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/PhaseIndexWriter.cs:44-56"
  - claim: "OpenedPullRequests is written only by CommitAndPR and InitCommit; the cross-link links every run with two or more opened PRs, so a spec-only draft PR is never linked."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CommitAndPRHandler.cs:152, src/backend/AgentSmith.Application/Services/Handlers/InitCommitHandler.cs:67, src/backend/AgentSmith.Application/Services/Handlers/PrCrossLinkHandler.cs:33-36"
  - claim: "Single-sandbox runs resolve the record's repos from the project; one phase may add a repository mid-run."
    evidence: "src/backend/AgentSmith.Application/Services/Builders/WritePhaseRecordContextBuilder.cs:20-21, src/backend/AgentSmith.Application/Services/Tools/EnsureRepoSandboxToolHost.cs:14-24"

assumptions:
  - claim: "Scope narrowing can be told to keep repositories the stored specs name."
    check: "Open ScopeReposHandler and ApprovedRepoScope (scope skipped when the approval named the repositories)."

scope:
  in: "A SeriesMirror used by filing (API), publish and record; per repo: the specs naming it, a manifest listing only them, the index line; the content hash and pushed sha stored per repo after a confirmed push; named repos join the run scope; spec PRs in OpenedPullRequests."
  out: "Comparing hashes to detect edits (3a36g); deleting the carrier (3a36h); legacy series without repos: keep their one repository."

decisions:
  - key: "MIRROR, NEVER SOURCE: written from the store each time; a failed push or one-sided merge heals on the next write."
  - key: "ONE MANIFEST PER REPO, ITS OWN SPECS ONLY: the reader never meets a listed spec without a file; the store holds the series."
  - key: "THE HASH IS OF CONTENT: the rendered manifest plus that repo's spec files, path-normalised across planned/ and done/, context.yaml excluded — a base merge or squash changes no hash."
  - key: "STORED AFTER THE PUSH: a hash written before a failed push would read as a person's edit."
  - key: "NOTHING CHANGED, NOTHING WRITTEN: an unchanged mirror makes no commit."
  - key: "A SPEC PR IS AN OPENED PR, so the existing cross-link runs."

steps:
  - id: mirror
    action: "Add SeriesMirror: per repo in the union of repos:, render that repo's specs and manifest, skip when the content hash equals the stored one, commit and push (sandbox) or write (provider at filing), then store hash and sha."
    new:
      - "SeriesMirror, SeriesMirrorContent (rendering + hash)"
    modify:
      - "SpecSetPublisher, FiledSpecBranch, SeriesRecordCommit, SpecDoneRecorder, PhaseIndexWriter, TicketSeries (per-repo mirror state)"
  - id: scope
    action: "Keep every repository the stored specs name in the run scope; resolve single-sandbox records against them."
    modify:
      - "ScopeReposHandler, ApprovedRepoScope, WritePhaseRecordContextBuilder"
  - id: pr-set
    action: "Add each spec draft PR to OpenedPullRequests."
    modify:
      - "SpecPullRequestOpener"

tests:
  - "SeriesMirror_SpecForServerAndClient_WritesBothWithOwnManifests"
  - "SeriesMirror_UnchangedContent_MakesNoCommit"
  - "SeriesMirror_PushFailed_StoresNoHashAndHealsNextRun"
  - "SeriesMirrorContent_BaseMergeChangesContextYaml_SameHash"
  - "ScopeRepos_StoredSpecNamesServer_KeepsServer"
  - "PrCrossLink_SpecPrPlusCodePr_Links"

done:
  - "19470's shape (scope BackgroundWorker+Server, spec repos [Server]) leaves spec, manifest and index line in Server only (RealCompositionHarness)."
  - "A spec over Server and Client is present in both, each with a manifest that reads back."
