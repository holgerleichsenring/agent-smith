# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-3435d
goal: "Every key of a project's merge block, the CI loop's included, is shown and edited in the config studio's project form; a save keeps what the form does not say."

applies_to: "dashboard (config studio project form), default (studio project entity, raw project patch)"

requires: [2026-11-17-3435c]

facts:
  - claim: "The studio project entity is mapped from and patched onto the raw entry; a block the entity does not carry survives a save, and a nullable entity field is written only when present."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/Studio/RawProjectPatch.cs:13-49"
  - claim: "The project form is six tabs; the sandbox tab is its own component."
    evidence: "src/dashboard/src/components/config/ProjectForm.tsx:33, src/dashboard/src/components/config/ProjectForm.tsx:181"
  - claim: "The merge block carries when, respect_branch_protection, refresh_open_pull_requests and the CI loop's keys (3435a-c)."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/MergePolicyConfig.cs:8-26"
  - claim: "Operator 2026-11-17 23:20: every new setting must be available in the dashboard's config studio project form, options from the schema enum, plain style; a parallel small-fix adds when/respect/refresh fields."
    evidence: "observed: 2026-11-17, operator requirement relayed by the coordinator"

upgrade_impact: "None required: a studio save of a project without the block writes none; one that opens the merge tab writes the block it shows."

scope:
  in: "ProjectEntity.Merge (nullable, absent leaves the stored block alone) mapped both ways; RawProjectPatch writes it whole when present; dashboard StudioProject.merge and a 'merge' tab (ProjectMergeSection) with when (manual, on_gate_green, on_ci_green), respect_branch_protection, refresh_open_pull_requests, ci_poll_seconds, ci_settle_seconds, ci_fix_attempts, ci_excerpt_chars, ci_failed_checks_read and approval_auth (a secret from the catalog), the CI keys shown only for on_ci_green but kept in the form's state, so switching away never nulls them; reuse whatever merge fields main already carries."
  out: "Any other project setting."

steps:
  - id: entity
    action: "ProjectMergeSettings record (Contracts.ConfigStudio) with the keys as wire values (when as the YAML word); ProjectEntity.Merge as an optional trailing parameter; ProjectMergeMapping (own file: ToMerge and Apply, every key written as given within a sent block, the sandbox block's rule); RawProjectPatch calls it."
  - id: form
    action: "configApi StudioProject.merge; ProjectMergeSection using formFields' SelectField/TextField and RefSelect over the secrets catalog; ProjectForm's TABS gains 'merge'."

tests:
  - "RawProjectPatch: a present merge block is written; an absent one keeps the stored block; ProjectEntityMapping round-trips every key."
  - "ProjectMergeSection: changing when to on_ci_green reveals the CI fields; editing ci_fix_attempts and approval_auth reaches onChange."

done:
  - "An operator sets on_ci_green, the poll and settle seconds, the fix budget, the excerpt bounds and the approval identity of a project in the studio and the saved config carries them."
