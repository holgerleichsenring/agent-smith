spec: 2026-10-13-9a59h
goal: "One read per ticket returns its conversation in time order, grouped by attempt, and a failed ticket nobody touched since its last attempt is shown as Stuck."

applies_to: "backend (ticket read model, between-attempts check, persistence, spec-dialog read rule)"

requires: [2026-10-13-9a59a, 2026-10-13-9a59b, 2026-10-13-9a59d, 2026-10-13-9a59e, 2026-10-13-9a59g]

