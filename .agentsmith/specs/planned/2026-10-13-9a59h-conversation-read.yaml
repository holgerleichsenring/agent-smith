done:
  - "For a ticket with a hand-back, an answered question, a refused and an accepted cut, a criteria edit and a PR review, the read returns each once, in time order, under the right attempt."
  - "A ticket whose last attempt failed, unchanged and untouched since, is Stuck after the list or its detail was read (the list never waits for the check); a person's comment or PR review takes it out."
  - "An answer given on the ticket while an attempt was parked is shown under that attempt; a conversation tab refetched every 2 s reads the tracker at most once a minute per replica."
  - "Opening the detail of a ticket with a live attempt makes no tracker call."
  - "A caller with runs.read but without dialog.write gets everything except the Work it out turns, with transcriptHidden true."
  - "A list row of a handed-back ticket carries the hand-back's words and time; an Azure DevOps vote comment shows as system, not as a person."
