# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-f5f7d
goal: "Each repository a ticket's specs name gets its own sub-series — its specs, done records and index lines — and nothing picks a repository by position."

applies_to: "backend (spec publish, filing, spec record, scope)"

requires: [2026-10-12-f5f7b]

facts:
  - claim: "observed: series 2026-10-12-eff5 lay in BackgroundWorker while its spec changed only Server; Server already held its own done specs from local work."
    evidence: "observed: 2026-10-12, AzDO items/commits on agent-smith/19470"
  - claim: "The writer renders one manifest plus every unexecuted spec into one carrier sandbox, cleans stale planned files there, commits and pushes once; its port returns one sha."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesWriter.cs:27-87, src/backend/AgentSmith.Application/Services/Specs/SeriesFiles.cs:22-35, src/backend/AgentSmith.Application/Services/Specs/SeriesStaleFiles.cs:24-38, src/backend/AgentSmith.Contracts/Specs/SpecSetPorts.cs:60-68, src/backend/AgentSmith.Contracts/Specs/SpecSetPointer.cs:45"
  - claim: "Publish sets one SpecRepo, records one pointer, opens one draft spec PR on one repository."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetPublisher.cs:23-53, src/backend/AgentSmith.Application/Services/Specs/SpecPullRequestOpener.cs:24-77"
  - claim: "Hand-back sets have no specs."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecDerivationParser.cs:66-73, src/backend/AgentSmith.Application/Services/Specs/ScopedContextQuestion.cs:30"
  - claim: "Filing writes one repository through the provider, which cannot delete files, always at revision 1; amendments re-record through the approval recorder; approved specs carry their repositories."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:44-111, src/backend/AgentSmith.Contracts/Providers/ISourceProvider.BranchWrite.cs:24-38, src/backend/AgentSmith.Server/Services/SpecDialog/TicketAmendment.cs:91-97, src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedPhaseSetRecorder.cs:75-81"
  - claim: "The record writes into the carrier sandbox, else ContextKeys.Sandbox, and rewrites the manifest; executed state is the done/ directory."
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/SpecDoneRecorder.cs:13-77, src/backend/AgentSmith.Application/Services/PhaseExecution/SeriesRecordCommit.cs:20-38, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:76-88"
  - claim: "Positional pickers: Resolve, ChooseCarrier, Named; scope narrowing for derived tickets happens in Narrow and knows no pointer."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCarryingRepoResolver.cs:23-62, src/backend/AgentSmith.Application/Services/Scope/ApprovedRepoScope.cs:31-89, src/backend/AgentSmith.Application/Services/Handlers/ScopeReposHandler.cs:94-98"

assumptions: []

scope:
  in: "SeriesRepos = the repositories the specs name ∪ the member repositories read this run ∪ the pointer map's; each written repository gets its sub-series (its specs, manifest with series_repos and series-wide fields), stale cleanup where checked out; a sha per push; a set without specs; filing per spec repository at a fresh revision; record in the spec's repository only; scope keeps pointer repositories; positional pickers deleted except the reference-set carrier."
  out: "Spec PR per repository, SpecPullRequestUrl map, cross-link and reference sets (2026-10-12-f5f7e); a sandbox choice within one repository stays matches[0]."

decisions:
  - key: "A PARTIAL PUSH IS HARMLESS: each sub-series is consistent alone; a sha recorded per push keeps our half-write from reading as a person's edit; the next write rewrites every member."
  - key: "A SET WITHOUT SPECS is written as a sub-series without specs into the previous members, else every scoped repository."
  - key: "NOT CHECKED OUT, NOT WRITTEN: a member repository outside this run keeps its sub-series; the newest manifest's series_repos tells the reader whether it still belongs."
  - key: "FILING STAMPS ITS OWN REVISION TIME, so the newest-manifest rule sees it; stale files it cannot delete are ignored by membership and cleaned by the next run."
  - key: "AMENDMENTS FILE BY SPEC, never at the legacy CarryingRepo."
  - key: "SCOPE KEEPS POINTER REPOSITORIES in OpenAsync and Narrow (pointer store injected; server only); under --repo a missing member refuses the run with its name."
  - key: "CARRYINGREPO IS STILL WRITTEN until 2026-10-12-f5f7e moves the reference sets; until then SpecRepo and the one draft PR use the earliest spec's repository in series order, and a set without specs opens no new PR."

steps:
  - id: repos
    action: "Add SeriesRepos; replace Resolve, ChooseCarrier and Named at every caller except MaterializeReferenceSetsHandler; drop SpecDoneRecorder's ContextKeys.Sandbox fallback when context.Repos > 1; refuse a spec whose repository is not checked out."
    new:
      - "SeriesRepos"
    modify:
      - "SpecCarryingRepoResolver, DeriveSpecHandler, ApprovedPhaseSetRecorder, FiledSpecBranch, WritePhaseRecordHandler, SpecDoneRecorder"
  - id: write
    action: "Write each repository's sub-series, commit, push and record its sha; return one result per repository."
    modify:
      - "ISpecSetWriter, SpecSetWriteResult, SeriesWriter, SeriesFiles, SeriesStaleFiles, SpecSetPublisher, SpecPullRequestOpener, SpecSetPointerRecorder"
  - id: filing
    action: "File each spec repository through the provider at a fresh revision time; amendments by spec."
    modify:
      - "FiledSpecBranch, TicketAmendment"
  - id: record
    action: "Move the spec to done/ with mocks and index line in its own repository only; no manifest rewrite; record that repository's sha."
    modify:
      - "SpecDoneRecorder, SpecDoneFiles, PhaseIndexWriter, SeriesRecordCommit"
  - id: scope
    action: "Keep pointer repositories in OpenAsync and Narrow; refuse under --repo when a member is excluded."
    modify:
      - "ApprovedRepoScope, ScopeReposHandler"

tests:
  - "SeriesWriter_SpecForServer_SubSeriesInServerOnly"
  - "SeriesWriter_SpecsInTwoRepos_EachGetsOwnSubSeries"
  - "SeriesWriter_PushFailsInB_NextReadJoinsWithoutReviewerEdit"
  - "SeriesWriter_RepoDroppedOnRecut_CleanedWhereCheckedOut"
  - "SeriesWriter_HandbackSetWithoutSpecs_GoesToPreviousElseScope"
  - "FiledSpecBranch_AmendmentAfterRun_IsNewestManifest"
  - "SpecDoneRecorder_SpecForServer_DoneAndIndexInServerOnly"
  - "ApprovedRepoScope_RepoFlagExcludesMember_Refuses"

done:
  - "19470's shape (scope BackgroundWorker+Server, spec for Server) leaves the sub-series, done record and index line in Server only (RealCompositionHarness)."
  - "After a push failing in one of two repositories, the next run reads one set and records no reviewer edit."
