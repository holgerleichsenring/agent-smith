# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-933dc
goal: "A validated PoC upload passes a scan gate where only critical findings block, before it is committed to its source-repo folder; a blocked page shows why and pocs.overrule lifts vulnerability blocks."

applies_to: "default (PoC scan verdict and block rules, in-process secret pattern scan, pinned OSV-Scanner dependency scan, masked LLM explanation, path-scoped source-repo commit, revision read and overrule routes, pocs.scan settings) + dashboard (blocked page, scan settings fields)"

requires: [2026-11-23-933db]

upgrade_impact: "Behind pocs.enabled; only poc-deploy runs change. poc-deploy now ends after the commit (933db ended after validation). The source repo's token needs push to its default branch: a protected default branch refuses the direct commit, said with the host's reason (documented). pocs.scan absent reads as the defaults below; with pocs.enabled true an empty or tag-only pocs.scan.osv_image is refused, so an installation that enabled PoCs under 933db must set it. The shipped egress-proxy allowlist gains the OSV database host. PocRevision gains VerdictJson, Explanation, OverruledIdsJson (keyed by stage) and CommitSha (migrations on three providers). The security-scan pipeline and its handlers are unchanged; PatternFileMatcher's per-line match moves into a shared PatternLineMatcher with unchanged output. The embedded skills catalog pin moves to a release whose aws-secret-key also matches a quoted value."

facts:
  - claim: "All three security-scan handlers emit their findings as observations with Blocking: false; the pipeline reports, it never gates."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/StaticPatternScanHandler.cs:33-50, src/backend/AgentSmith.Application/Services/Handlers/DependencyAuditHandler.cs:42-47, src/backend/AgentSmith.Application/Services/Handlers/GitHistoryScanHandler.cs:37-42"
  - claim: "The Python dependency audit runs pip-audit --requirement=requirements.txt and, when pip-audit is absent, pip-installs it unpinned in the sandbox — resolving the uploader's requirements (index options honoured) is running uploader-controlled input."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/DependencyAuditor.cs:90-117"
  - claim: "No OSV-Scanner integration exists in the backend today."
    evidence: "observed: 2026-11-23, grep -ril 'osv-scanner|OsvScanner' over src/backend matched nothing"
  - claim: "The git history scanner reads the last 500 commits of the whole checkout, so on a shared source repo it would read every PoC's history; an upload not yet committed has none."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/GitHistoryScanner.cs:24, src/backend/AgentSmith.Infrastructure/Services/Security/GitHistoryScanner.cs:42"
  - claim: "The run's secret masker replaces only values the framework itself staged; an uploader's own key is unknown to it."
    evidence: "src/backend/AgentSmith.Contracts/Runs/SecretMasker.cs:5-22"
  - claim: "A checkout-free branch write takes text content only (RepoFile(Path, string Content)), so it cannot carry a PoC's binary files."
    evidence: "src/backend/AgentSmith.Contracts/Providers/BranchWrite.cs:10, src/backend/AgentSmith.Contracts/Providers/ISourceProvider.BranchWrite.cs:36-38"
  - claim: "No sparse checkout exists in the backend today."
    evidence: "observed: 2026-11-23, grep -rln 'sparse-checkout|SparseCheckout' src/backend returned nothing"
  - claim: "StaticPatternScanner, built to sort findings in a repository, skips files: the upload's own .gitignore decides, .md/.lock/.svg files and bin/, obj/, node_modules/, __pycache__/ are left out, the listing stops at depth 12."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/SourceFileEnumerator.cs:18-21, src/backend/AgentSmith.Infrastructure/Services/Security/SourceFileEnumerator.cs:33-39, src/backend/AgentSmith.Infrastructure/Services/Security/SourceFileEnumerator.cs:46-55"
  - claim: "Sandbox reads stop at 1 MB and listings at 1000 entries, the truncation only an event; an unreadable file yields no finding; a regex timeout is swallowed; no loaded pattern is a clean pass."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/SizeLimits.cs:5, src/backend/AgentSmith.Sandbox.Wire/SizeLimits.cs:13, src/backend/AgentSmith.Sandbox.Agent/Services/FileStepHandler.cs:160-165, src/backend/AgentSmith.Infrastructure/Services/Security/PatternFileMatcher.cs:22-23, src/backend/AgentSmith.Infrastructure/Services/Security/PatternFileMatcher.cs:65-67, src/backend/AgentSmith.Infrastructure/Services/Security/StaticPatternScanner.cs:28-34"
  - claim: "Patterns load from the skills catalog's patterns directory, each file's name is its category ('secrets' for the secret catalog), and compile with a 500 ms match timeout; a matched text longer than 200 characters is cut, so replacing it would not mask a longer value."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/PatternsDirectoryResolver.cs:13-34, src/backend/AgentSmith.Infrastructure/Services/Security/PatternDefinitionLoader.cs:19-54, src/backend/AgentSmith.Infrastructure/Services/Security/PatternCompiler.cs:24-27, src/backend/AgentSmith.Infrastructure/Services/Security/PatternFileMatcher.cs:46-48, src/backend/AgentSmith.Infrastructure/Services/Security/PatternFileMatcher.cs:74"
  - claim: "The pinned skills catalog's secrets.yaml holds 27 patterns: 15 critical (cloud, git-host, payment, chat and private keys), 7 high, 4 medium (generic-secret-assignment and three placeholders such as placeholder-change-me) and 1 low (stripe-publishable-key); 'ENV API_KEY=' in a Dockerfile matches only config.yaml's high dockerfile-secret-in-env."
    evidence: "observed: 2026-11-23, agent-smith-skills patterns/secrets.yaml and patterns/config.yaml at ee350e3"
  - claim: "PatternFileMatcher runs every pattern on every line and takes only each pattern's FIRST match (Regex.Match), so one line can yield several findings and a second match of one pattern on that line yields none; PatternCompiler drops an invalid regex with only a warning."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Security/PatternFileMatcher.cs:39-62, src/backend/AgentSmith.Infrastructure/Services/Security/PatternCompiler.cs:31-34"
  - claim: "In the pinned catalog aws-secret-key is '(?i)aws_secret_access_key\\s*[=:]\\s*[A-Za-z0-9/+=]{40}': it matches only an unquoted value, so AWS_SECRET_ACCESS_KEY = \"...\" (Python, JSON) is not found, and generic-secret-assignment needs secret|password|passwd|pwd|token directly before the '='; aws-access-key 'AKIA[0-9A-Z]{16}' matches in any quoting."
    evidence: "observed: 2026-11-23, agent-smith-skills patterns/secrets.yaml:3-17 and :171-172 at ee350e3, regex run against the quoted and unquoted forms"
  - claim: "The embedded skills catalog is pinned by SkillsCatalogVersion with its sha256; a catalog change reaches the server only through a release and a pin bump."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/AgentSmith.Infrastructure.Core.csproj:46-58"
  - claim: "CommitAndPushStagedAsync throws 'nothing to commit' on a clean tree, so a caller checks for staged changes first."
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:234-239"
  - claim: "The run's default push uses --force-with-lease and on 'stale info' fetches and pushes with the lease again, which then overwrites a concurrent commit; the plain push forces nothing and a moved remote refuses it."
