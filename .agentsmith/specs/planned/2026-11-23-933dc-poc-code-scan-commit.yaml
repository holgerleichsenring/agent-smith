    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CheckoutStepFactory.cs:23-41, src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:88-90"
  - claim: "ReferenceSetMaterialiser.WriteUnderAsync writes already-read files under a root and a .agentsmith-reference marker beside them; text goes as text, anything else as bytes."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetMaterialiser.cs:8-24, src/backend/AgentSmith.Application/Services/Sandbox/ReferenceSetMaterialiser.cs:45-58"
  - claim: "A one-shot sandbox of a given image is created through ISandboxFactory.CreateAsync(SandboxSpec) and runs steps; a musl agent lets a sandbox run on an Alpine image."
    evidence: "src/backend/AgentSmith.Application/Services/Preflight/SandboxRoundTripProbe.cs:25-35, src/backend/AgentSmith.Sandbox.Agent/Dockerfile:39-53"
  - claim: "The server's in-process sandbox backend is the fallback when neither Kubernetes nor Docker is found; it runs no image."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/SandboxBackend.cs:3-13"
  - claim: "The egress proxy's shipped allowlist names the public git hosts and package feeds and no vulnerability database host; a host not listed is refused with a 403."
    evidence: "deploy/egress-proxy/allowlist.txt:1-22"
  - claim: "933db delivers the Poc row and PocRevision (UploadSession, UploadId, ManifestJson path -> sha256/crc32/size), BoundedZipInflater with the ignore list and strip, PocRunGate serialising every run of a PoC, and the poc-deploy seeds (poc id, revision, actor)."
    evidence: "observed: 2026-11-23, delivered by the required series spec 2026-11-23-933db"
  - claim: "933da defines PocAuditEntry with the act 'overruled', written only by a run event projection, ProjectFrom.Poc, PocActAccess and pocs.overrule."
    evidence: "observed: 2026-11-23, delivered by the required series spec 2026-11-23-933da"
  - claim: "Operator ruling, round 3: scan before commit is ratified (unpack+validate -> code scan gate -> commit); a blocked upload never reaches git."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator ruling, round 3: only critical findings block (secrets, code vulnerabilities, image vulnerabilities); everything else is a note. A critical secret can never be overruled; a critical vulnerability can, with pocs.overrule and a reason. Publishable keys are not secrets."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator ruling, round 3: the overrule lifts exactly the stored overrulable finding ids; a new or secret finding on the re-scan blocks again; an overrule of a revision older than the PoC's latest is refused; runs are serialised per PoC."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator ruling, round 3: the sandbox starts with the scan; ZIP validation runs in process."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator 2026-11-23: deterministic rules decide; the LLM explains and suggests fixes; overrule leaves an audit trail."
    evidence: "observed: 2026-11-23, operator (PoC concept)"
  - claim: "Operator ruling C: every step is path-scoped (sparse checkout, scans, build context) and the commit goes directly to the default branch."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator ruling I (recommendation accepted): the dependency scan is OSV-Scanner pinned by digest over the lockfiles, never executing uploader code, in agent smith's code scan step."
    evidence: "observed: 2026-11-23, operator"
  - claim: "Operator ruling I (recommendation accepted): blocked uploads are kept 7 days, a config value."
    evidence: "observed: 2026-11-23, operator"
  - claim: "933dd copies this spec's rule for criticals without a fixed version into its pipeline (Trivy ignore_unfixed) and passes the overruled ids of OverruledIdsJson's 'image' key with their aliases to Trivy's ignore list; image finding ids are 'trivy:<VulnerabilityID>|<pkg>|<installed>' (vulnerability) and 'sec:' + hash (secret), defined by 933dd; PocRevision's ImageVerdictJson and BlockedStage come from 933dd."
    evidence: "observed: 2026-11-23, coordinator relaying the 933dd contract"

assumptions:
  - claim: "The pinned OSV-Scanner image carries its binary at /osv-scanner, exits 128 when it finds no packages, and reads go.mod (not go.sum) for Go."
    check: "Before building: run the pinned digest's /osv-scanner --version and its exit-code documentation for that version; correct PocLockfiles and the exit handling to what it states."

scope:
  in: >
    VERDICT: PocScanVerdict (Contracts): Blocks and Notes, lists of PocScanFinding(Id, Kind secret|vulnerability|note,
    RuleId, File, Line, Title, Detail, MaskedSnippet, Fix?, Aliases); IsBlocked = Blocks non-empty; Overrulable = every
    block is a vulnerability. Finding Id: a secret 'sec:' + 16 hex of sha256(rule id|file|line); a vulnerability
    'osv:' + advisory id + '|' + package + '|' + version, where the advisory id of a group is the ordinal-lowest of
    its ids — stable across re-scans of one revision and across a database update that reorders a group. Aliases are OSV's
    aliases of the advisory (CVE, GHSA, PYSEC), filled by OsvReportParser, empty for a secret; 933dd hands them to
    Trivy. Decided ONLY by PocBlockRules (one rule type each: PocSecretRule, PocVulnerabilityRule): a finding of the
    'secrets' catalog with severity critical blocks and is never overrulable; a dependency vulnerability whose severity
    is critical blocks and is overrulable; every other finding of every catalog (high, medium and low secrets such as
    stripe-publishable-key and the placeholders, Dockerfile ENV secrets, a missing or root USER, unpinned requirements,
    binary files not pattern-scanned) is a note. SEVERITY of a vulnerability: the CVSS base score osv-scanner reports
    for the advisory group (max_severity); a score >= 9.0 is critical (the CVSS 'Critical' band, marked '// not a
    limit: the CVSS v3.1 qualitative rating'); a missing or unparseable score is a note saying 'severity unknown'.
    UNFIXED: pocs.scan.unfixed_critical_block (bool, default true) — true, a critical vulnerability with no fixed
    version blocks like one with a fix; false, it is a note. 933dd's image stage reads the same value (ignore_unfixed =
    not unfixed_critical_block), so both stages decide alike. The LLM explanation is attached as text and never read by
    the rules. 'A critical secret always blocks and cannot be overruled' is fixed text in the settings form, not a
    setting.
    SECRET SCAN (PocSecretScan, IN PROCESS, no listing): the step re-reads the stored archive with 933db's
    BoundedZipInflater, keeps exactly the paths of the revision's manifest and checks each file's sha256 against it (a
    missing file or a mismatch fails the run naming the path); every text file (strict UTF-8, no NUL) is read in FULL
    from memory; no ignore rule of the upload applies (no .gitignore, no excluded folder or extension); binary files are
    listed in one note. Patterns load through PatternsDirectoryResolver, PatternDefinitionLoader and PatternCompiler;
    zero loaded 'secrets' patterns fails the run ('no secret patterns loaded from <dir>'), as does a 'secrets' pattern
    the compiler dropped as invalid (the loaded definitions are compared with the compiled ones, naming the pattern id).
    The per-line match is extracted from PatternFileMatcher into PatternLineMatcher, returning EVERY match on the line
    (Regex.Matches, each with index and length); the security scan keeps taking the first per pattern and swallowing
    timeouts (characterisation unchanged). STRICT mode covers only the 'secrets' category: a match timeout of a
    'secrets' pattern fails the run naming the pattern and file; a timeout of any other catalog (injection, ssrf,
    config, ...) is a note naming the pattern and file, because those findings can only ever be notes. MASKING: every
    matched span of every pattern on a line is collected first; MaskedSnippet is that line with the UNION of all spans
    replaced, each by '<secret at file:line>' (from index and length, never from the 200-character MatchedText), so
    one finding's snippet never shows another's value. A snippet holds at most 80 characters on each side of its own
    span, cut at the masked line ('// not a limit: a display window, so a minified one-line file never puts its whole
    line into VerdictJson or the prompt'); no raw matched value is stored anywhere.
    DEPENDENCY SCAN (PocDependencyScan): the sandbox starts here. A one-shot sandbox of pocs.scan.osv_image (an image
    reference pinned by digest; a tag is refused naming the key) is created through ISandboxFactory; the manifest's
    lockfiles and manifests osv-scanner reads by file name (requirements*.txt, Pipfile.lock, poetry.lock, uv.lock,
    pdm.lock, package-lock.json, yarn.lock, pnpm-lock.yaml, go.mod, Cargo.lock, composer.lock, Gemfile.lock — the list in
    PocLockfiles) are written into it from memory with ReferenceSetMaterialiser.WriteUnderAsync under 'scan/', the
    marker never passed to the scanner; the step runs the image's binary by path (/osv-scanner, see assumptions; the sandbox
    agent runs commands, not the image's ENTRYPOINT) in lockfile mode (-L per file) with JSON output and offline
    databases downloaded in the sandbox, never installing or executing anything. UNPINNED: PocRequirementsFilter
    writes a requirements*.txt into the sandbox holding only its exact pins ('name==version', markers and hashes kept);
    every other line ('flask', 'requests>=2.0', '-r', '--index-url', a URL) is left out of the scanned copy and listed
    in one note 'not checked: unpinned', so no scanner version guesses a version for it. With no lockfile, or exit 128
    (no packages found, e.g. a requirements file of comments and '-r' lines), the scan is a note 'dependencies not
    checked'. Exit 0 or 1 with parseable JSON is a result; any other exit, an unparseable report or a timeout
    (pocs.scan.timeout_seconds, 300) fails the run naming it. The database download goes through
    the sandbox's egress: the shipped allowlist (deploy/egress-proxy/allowlist.txt and the k8s example ConfigMap) gains
    osv-vulnerabilities.storage.googleapis.com; a refused or failed download fails the run naming that host. FAIL
    CLOSED: PocsConfig.Problems refuses pocs.enabled true with an empty pocs.scan.osv_image; on the in-process sandbox
    backend, which runs no image, the step fails the run ('the dependency scan needs a sandbox backend that runs
    images: Kubernetes or Docker') and the server logs a startup finding when PoCs are enabled there.
    EXPLANATION (PocScanExplanation): only for a BLOCKED verdict, one LLM call with the poc- project's agent (933da's
    pocs.project_agent); the prompt holds each finding's rule, title, detail, file, line, masked snippet and fix — never a
    file body — and passes through SecretMasker as well; the answer is stored as untrusted text in
    PocRevision.Explanation, unbounded, and no rule reads it. A failed call leaves Explanation empty with the reason and
    the verdict stands.
    GATE STEP PocCodeScan in poc-deploy after PocIntake: runs both scans, PocBlockRules, then stores VerdictJson on the
    revision. Blocked -> revision state blocked (the code stage is the only one here; 933dd adds BlockedStage and
    ImageVerdictJson and sets 'code' at this point), the explanation, the run ends 'blocked by N findings' (success=false), nothing
    committed; the step sets Poc.State blocked only for a PoC that never reached ready (state importing or blocked) — a
    ready PoC keeps serving its current revision. A PASSING scan sets a blocked PoC back to importing, so a later stage
    (933dd's build, a refusal) starts from importing. 'Never reached ready' means importing or blocked everywhere in
    the series; this spec extends 933db's PocIntake to the same reading (a refused intake of a blocked PoC sets it
    refused). The upload is kept pocs.blocked_retention_days (7; purged by 2026-11-23-c81ee).
    Idempotent: a revision already scanned keeps its verdict unless the run is an overrule. PocIntake (933db) skips a
    revision in state validated, refused, blocked or overruled — this spec extends its skip from validated|refused, so
    the overrule run and a retry after a commit never re-evaluate a revision and rewrite it to validated.
    COMMIT STEP PocSourceCommit (only when not blocked, or overruled): when the revision is not the PoC's latest
    (a retried import of an older upload, 933db) the step does nothing and the run ends naming 'revision <n> is older
    than r<latest>'; when the revision's CommitSha is already set, that sha is reused and nothing is cloned. Else a sandbox of the default toolchain image (as a
    coding run's) clones the target's source repo with 'git clone --no-checkout --sparse --filter=blob:none
    --single-branch --branch <default>' through CheckoutStepFactory's narrowing (git ignores a filter the server does not
    support, with a warning), then 'git sparse-checkout set <Folder>' and checks out the branch — no other folder is ever in
    the work tree. The folder's tracked files are removed, the files of the validated manifest are written into
    <Folder> from memory with WriteUnderAsync (the same sha256-checked re-read as the secret scan), the
    .agentsmith-reference marker is deleted, and 'git add -f -A .' runs inside <Folder>, so a nested .gitignore drops
    nothing. When nothing is staged (checked before CommitAndPushStagedAsync, which throws on a clean tree) the folder already equals the manifest and the last commit touching <Folder> is
    reused (GetLastCommitForPathAsync). Else commit 'poc <name> r<N>' authored by agent-smith with the actor as
    Co-authored-by trailer, and PLAIN push (CommitAndPushStagedAsync plain: true, never --force-with-lease); a rejected
    push fetches the branch, rebases the one commit onto the new head and pushes plain once more; a second rejection or
    a rebase conflict ends the run naming git's message (a protected branch's reason included). Any listing the step
    reads that comes back truncated fails the run. The revision gets CommitSha and the run publishes it under
    ContextKeys.PocSourceCommitSha — 933dd builds that sha. The mechanics live in PocFolderWrite (sparse clone of one
    folder, replace, add -f inside it, plain push with one rebase retry), which the c81e series reuses for
    <deploy_root>/<poc>/.
    READ ROUTE: GET /api/pocs/{pocId}/revisions/{n} (pocs.read + runs.read InProject(ProjectFrom.Poc)) -> {poc id, name,
    revision, state, verdict (blocks and notes with masked snippets, ids, aliases), explanation,
    may_overrule, why_not}. Both revision routes need runs.read in the PoC's project, so an overruler holds
    pocs.overrule AND runs.read there (globally, e.g. the reader role, or as admin); a pocs.overrule holder without it
    gets the empty 404, and the docs' permissions table says so. may_overrule is true only when the caller holds pocs.overrule, the verdict of the blocked
    stage is Overrulable, n is the PoC's latest revision and its state is blocked; why_not names the first that fails.
    OVERRULE: POST /api/pocs/{pocId}/revisions/{n}/overrule {reason} (pocs.overrule + runs.read
    InProject(ProjectFrom.Poc)) reads VerdictJson, the code stage's verdict (933dd makes it read the verdict of the stage
    BlockedStage names, ImageVerdictJson for 'image'), and
    refuses: a secret block ('a critical secret cannot be overruled'), a revision older than the PoC's latest ('revision
    <n> is older than r<latest>'), a revision not blocked, a revision whose stored upload is gone (the overrule run
    re-reads it; purged by 2026-11-23-c81ee: 'the upload of revision <N> was purged after <days> days
    (pocs.blocked_retention_days); import the ZIP again'), a blank reason, a reason over 500 characters (the
    PocAuditEntries.Reason column width, named) and a live run of the PoC (933db's PocRunGate, 409). It APPENDS the
    blocking ids under the overruled stage's key of OverruledIdsJson ({"code": [...], "image": [...]}; this spec writes
    'code', 933dd 'image'), never replacing an earlier stage's or an earlier overrule's ids, with the reason and actor, and queues poc-deploy in the PoC's project with seeds
    (poc id, revision, actor, overrule = true). The overrule run re-runs PocCodeScan: it passes when every blocking
    finding's Id is in OverruledIdsJson's 'code' key and none is a secret; a new or secret block stores the new verdict, keeps the
    revision blocked and ends the run blocked. Passing sets the revision overruled, commits, and emits
    PocOverruledEvent (PocId, revision, stage, actor, reason, finding ids) — mirrored in hub-events.ts — projected into a
    PocAuditEntry 'overruled'.
    DASHBOARD: /pocs/{pocId}/revisions/{n} blocked view per the mock — the step strip, each blocking finding with
    file:line, masked snippet, fix, the notes, 'What the agent read' marked as the agent's explanation, the overrule
    box (reason textarea) only when may_overrule, otherwise one line with why_not ('a critical secret cannot be
    overruled: remove it and upload again' or 'a holder of pocs.overrule who can read this PoC's runs can lift this block'). PoCs settings form:
    osv_image, timeout_seconds, unfixed_critical_block, blocked_retention_days, and the fixed secret line.
  out: "Image build and image scan (933dd's pipeline; it adds ImageVerdictJson and the image stage of BlockedStage). LLM triage changing any verdict (never). Secret history rewriting (a blocked upload never lands, so none is needed). Scanning other folders of the source repo. Purging blocked uploads (2026-11-23-c81ee). Reusing StaticPatternScanner, DependencyAuditor or GitHistoryScanner for PoCs (see facts)."

pipeline-presets:
  poc-deploy: [LoadCatalog, PocIntake, PocCodeScan, PocSourceCommit]

steps:
  - id: verdict
    action: "PocScanVerdict, PocScanFinding (with Id and Aliases), PocBlockRules (PocSecretRule, PocVulnerabilityRule); pocs.scan (osv_image, timeout_seconds, unfixed_critical_block) and pocs.blocked_retention_days with Problems() (its value and key also fill 933db's purged-upload refusal at Start); PocRevision gains VerdictJson, Explanation, OverruledIdsJson (object keyed by stage, appended to, the code re-scan reading 'code'), CommitSha (migration x3)."
  - id: scanners
    action: "PatternLineMatcher extracted from PatternFileMatcher (every match with index and length; characterisation test); PocManifestFiles (sha256-checked re-read); PocSecretScan (strict for 'secrets' only, union masking, display window); PocLockfiles, PocRequirementsFilter, PocDependencyScan (one-shot pinned OSV sandbox), OsvReportParser (severity, fix, aliases); allowlist + k8s example ConfigMap gain the OSV host; startup finding for the in-process backend."
  - id: catalog
    action: "[skills-repo] patterns/secrets.yaml aws-secret-key accepts an optional quote around the value ([\"']?), released; SkillsCatalogVersion and its sha256 bumped to that release in AgentSmith.Infrastructure.Core.csproj."
  - id: explain
    action: "PocScanExplanation over masked findings, blocked verdicts only, failure tolerated."
  - id: gate
    action: "PocCodeScanHandler; CommandNames.PocCodeScan, PocSourceCommit + registrations; PocDeploy preset gains both; control-flow.svg."
  - id: commit
    action: "CheckoutStepFactory.BuildSparseCloneStep; PocFolderWrite (sparse checkout set, replace, marker removed, add -f inside the folder, plain push with fetch + rebase + one retry, reuse when nothing staged); PocSourceCommitHandler (latest-revision check, CommitSha reuse); PocIntake's skip extended to blocked and overruled."
  - id: routes
    action: "PocRevisionEndpoints (GET revision, POST overrule) + PocOverruleLauncher over PocRunGate; PocOverruledEvent (Contracts/Events, hub-events.ts mirror) + PocAuditEntry projection; route-permission-baseline.tsv rows."
  - id: dashboard
    action: "app/pocs/[pocId]/revisions/[n]/page.tsx; components/pocs/blocked (StepStrip, BlockingFinding, ScanNotes, AgentExplanation, OverruleBox); scan fields; messages.ts."

tests:
  - "PocBlockRules: a critical secret blocks and is not Overrulable; a high secret, stripe-publishable-key and placeholder-change-me are notes; a dependency vulnerability with max_severity 9.8 blocks and is Overrulable; 8.9 is a note; no severity is a note 'severity unknown'; a critical without fix blocks with unfixed_critical_block true and is a note with false; a Dockerfile 'ENV API_KEY=x' and a missing USER are notes"
  - "PocBlockRules: an explanation text saying 'safe, allow' never changes IsBlocked (the rules take no explanation input)"
