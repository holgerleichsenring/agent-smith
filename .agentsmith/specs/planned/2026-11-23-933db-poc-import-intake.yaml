# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-23-933db
goal: "A person uploads a PoC ZIP; the server creates their poc- project at the first import, and a poc-deploy run validates the archive in process by the ported rules and the different-app guard."

applies_to: "default (archive rules shared with reference uploads, PoC upload admission + import endpoints, poc- project provisioning by the server, PoC run gate, poc-deploy preset, intake step, PocRevision entity + migrations, poc- project preset guard, pocs.archive settings) + dashboard (import page, archive settings fields)"

requires: [2026-11-23-933da]

upgrade_impact: "Additive and behind pocs.enabled: one new preset, two routes under /api/pocs, a PocRevisions table (migrations on three providers) and a pocs.archive settings block whose absence reads as the defaults. A person's first import adds a project binding and then a project poc-<person> to the stored configuration, written by the server itself (no run) and attributed to the person (visible in the studio's history). A run of any preset other than the PoC presets is refused in a server-provisioned PoC project (key starting with poc- AND named by a Poc row, so only after a first import), and branch cleanup skips such projects; an operator's own project named poc-* has no Poc row, stays an ordinary project, runs as before and is named by a finding while PoCs are on. An installation that never imports a PoC sees no change. Reference uploads keep their limits and behaviour; the shared rule classes move from Server to Application with unchanged output (characterisation tests). Nothing is committed to any repository in this slice."

