# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-02-f35f
goal: "A command in a sandbox that reads the agent's Redis credential can reach nothing but its own job's keys — or cannot read it at all."

applies_to: "server (sandbox spawn, Redis credentials), sandbox agent (process start)"

requires: ["2026-10-02-35b2"]

facts:
  - claim: "After 35b2 the agent's REDIS_URL is out of a step's env and out of its command line, but /proc/<agent pid>/environ is readable by any process of the same uid."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/ProcessRunner.cs; src/backend/AgentSmith.Server/Services/Sandbox/DockerContainerSpecBuilder.cs:78-82"
  - claim: "Every sandbox shares one Redis URL, the step bus for all of them."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxRegistrations.cs:111; src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs:118-125"

scope:
  in: >
    Decide between (a) a Redis ACL user per sandbox job, created at spawn with access to that job's step and result
    keys only and deleted at teardown, the URL then carrying that user; and (b) running model commands under a
    different uid than the agent, so the agent's /proc entries are unreadable to them. Measure first which keys a job
    touches; read the Redis deployment's ACL support (managed Redis variants differ). Coordinate with
    2026-09-28-23a2d (sandbox egress), which narrows the network side.
  out: >
    Egress policy itself (23a2d).

decisions:
  - key: "OPEN: ACL per job vs separate uid — decided from the measured key set and the deployments' Redis."

steps:
  - id: measure
    action: "List the Redis keys and channels one sandbox job reads and writes."
  - id: decide
    action: "Pick (a) or (b) with the operator; write the implementation steps then."

tests:
  - "decided with the approach"

done:
  - "a command in a sandbox that reads the agent's Redis credential cannot read or write another job's keys"
