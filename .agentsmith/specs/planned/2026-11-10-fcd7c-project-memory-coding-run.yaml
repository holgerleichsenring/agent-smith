# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-fcd7c
goal: "A coding run writes what it learns beyond one repository to project memory through '@project', and its relied_on and disputes move a project memory's standing."
requires: [2026-11-10-fcd7b]

applies_to: "default (Application: remember, hand_forward, dispute; skills: memory-discipline reference; CLAUDE.md)"

facts:
  - claim: "remember writes into a repository's .agentsmith/memory/ and refuses a repository with no code change this run."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/MemoryWriteToolHost.cs:55-56,64-71"
  - claim: "hand_forward's relied_on names memories as 'slug' or 'repository/slug' and resolves them through the citation resolver."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/HandForwardToolHost.cs:44,53-54"
  - claim: "The coding skill pulls in the shared memory-discipline reference and tells a coding run to remember operator corrections and confirmed approaches, and to name relied_on and disputes."
    evidence: "agent-smith-skills skills/_masters/coding-agent-master/SKILL.md:298-306; agent-smith-skills references/memory-discipline.md (origin/main, v5.25.4)"

scope:
  in: "A coding run's remember accepts repository '@project': written to the project store with the run id, the spec id and the master as provenance, with no code-change requirement. Repository memory works as before. relied_on and dispute_memory accept '@project/<slug>' (resolved by fcd7b), and the ledger rows go under the project key. On a composition with no project store (CLI), the remember description does not offer '@project', and a call naming it anyway answers 'Not recorded: this installation keeps no project memory'. The remember and hand_forward descriptions name '@project' where a store exists. references/memory-discipline.md says a lesson that holds beyond this repository goes to '@project', kept in the database and not reviewed in a pull request. CLAUDE.md Experiential Memory names project memory, the reserved label, provenance, and that deleting resets standing."
  out: "The panel (fcd7d)."

decisions:
  - key: "SAME RIGHTS AS THE DESIGN TURN. The operator's call: coding runs learn by implementing. A coding run is already started by someone holding runs.control, so the right fcd7b gates the design remember on is already given here."
  - key: "NO LANDING REQUIRED FOR '@project'. The landing rule exists because a repository memory travels in a commit; a project memory travels in the database."
  - key: "OFFER ONLY WHAT EXISTS. The description is built from the composition, so the CLI never advertises a target it refuses."

steps:
  - id: tools
    action: "MemoryWriteToolHost '@project' branch and the store-aware description; hand_forward's description."
  - id: docs
    action: "references/memory-discipline.md in agent-smith-skills, CLAUDE.md Experiential Memory. Release, bump the pin."

tests:
  - "CodingRun_RememberAtProject_WritesWithoutACodeChange_WithRunProvenance"
  - "CodingRun_NoProjectStore_DescriptionOmitsAtProject_CallIsRefused"
  - "HandForward_ReliedOnAtProjectSlug_RecordsUnderTheProjectKey"
  - "DisputeMemory_AtProjectSlug_ContradictsTheProjectEntry"

done:
  - when: "a coding spec names '@project/<slug>' in relied_on and the spec is done"
    then: "the project entry's standing counts the confirmation"
  - "Skill released, pin bumped; build green, full suite green."
