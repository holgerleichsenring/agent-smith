# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-10-7da6
goal: "The conversation shows one card for the current proposal: live while a turn re-drafts it, and after a reload in the middle of a turn."

applies_to: "dashboard (spec-dialog conversation hook)"

facts:
  - claim: "Each pushed proposal runs withCard, which appends a new card entry unless the last entry is an agent entry without a card, so several drafts in one live turn (review revisions) give several cards."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:469-475,766-776"
  - claim: "A read attaches session.proposal only to the transcript entry at session.proposalTurn."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:730-741"
  - claim: "The server's proposalTurn is the last assistant turn whose text carries a draft, or null. In the middle of a turn the reply is not in the transcript yet, so it is null in a fresh conversation (no card at all), or it points at an earlier turn."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogViewReader.cs:73,89; src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogShownTranscript.cs:25-32"
  - claim: "A live card already gives way to a stored one of the same draft through withoutCard."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:271-276"

scope:
  in: "withCard replaces the card of the previous proposal when no user entry came after it, instead of appending a second one. turns() appends a card-only agent entry at the end when the session holds a proposal and no transcript entry exists at proposalTurn, or when the turn is computing and the last user entry comes after proposalTurn. That entry gives way to a live card through the same withCard and withoutCard rules."
  out: "The server's proposalTurn and the proposal pane are unchanged."

decisions:
  - key: "ONE CARD PER PROPOSAL SINCE THE LAST USER ENTRY. A card a person already answered stays where it was answered; a re-draft before anyone answered replaces it. Dropping every earlier card was rejected: the conversation would lose what a person replied to."
  - key: "FIX IN THE CLIENT. The server says where a stored draft's turn is, which is correct. The gap is the client's mid-turn view. Making the server synthesise a transcript index for a reply it does not hold yet was rejected."

steps:
  - id: hook
    action: "withCard: when an entry after the last user entry carries a card, replace that card with the new proposal. turns(): the card-only trailing entry described in scope."
  - id: tests
    action: "vitest in src/dashboard/src/hooks/__tests__."

tests:
  - "useSpecDialog_SeveralDraftsInOneLiveTurn_ShowOneCard"
  - "useSpecDialog_ReloadMidTurnWithProposal_ShowsOneCard"
  - "useSpecDialog_ReloadMidTurnThenLivePush_StillOneCard"
  - "useSpecDialog_AnsweredCardStays_NewTurnAddsItsOwn"

done:
  - when: "a turn's review re-drafts the proposal three times"
    then: "the conversation shows one card, holding the newest draft"
  - when: "the page reloads while a turn with a proposal is running"
    then: "the conversation shows one card, and the next live push replaces it"
  - "pnpm test and pnpm build green."
