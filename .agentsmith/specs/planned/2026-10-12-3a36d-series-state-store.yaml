# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36d
goal: "The TicketSeries row holds the whole series and runs read it from there; a reviewer's edit on the branch is taken back into it, and a branch-only series is imported once."

applies_to: "backend (spec source, filing, persistence)"

requires: []

facts:
  - claim: "Today the branch is the only set a run reads; the resolver refuses to put a copy in front of an edit it could not read."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:14-17, src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:72-81, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:43-50"
  - claim: "The manifest carries goal, ticket_pinned_whole, fingerprint, approval, accounting, revisions and hand-back; the reader builds the set from it; executed specs come from done/ by id."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SeriesManifest.cs:29-42, src/backend/AgentSmith.Application/Services/Specs/SeriesManifest.cs:101-110, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:25-26, src/backend/AgentSmith.Application/Services/Specs/SeriesReader.cs:102-110"
  - claim: "TicketSeries is one row per (Project, TicketKey) with carrier, revision sha and number, last hand-back case, repeat count and ExecutedThrough; it has no concurrency token (EntityBase has timestamps only)."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/TicketSeries.cs:10-36, src/backend/AgentSmith.Infrastructure.Persistence/Configurations/TicketSeriesConfiguration.cs:18-24, src/backend/AgentSmith.Infrastructure.Persistence/Entities/EntityBase.cs:8-12"
  - claim: "ApprovedSeries keeps the approved series as one content column keyed by (Tracker, TicketKey); the dialog pane reads only it."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/ApprovedSeries.cs:23-49, src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedSetForConversation.cs:26-37"
  - claim: "A reviewer's edit is detected by the series' last commit differing from the recorded sha and used without a model."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:62-82, src/backend/AgentSmith.Application/Services/Specs/SpecAmendmentRule.cs:36-52"
  - claim: "Filing writes the branch through the provider and records the pointer."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:11-13, src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:64-78"
  - claim: "Readers and writers of the pointer and hand-back counters."
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSetPointer.cs:22-30, src/backend/AgentSmith.Infrastructure.Persistence/Services/DbSpecSetPointerStore.cs:1, src/backend/AgentSmith.Application/Services/Persistence/InMemorySpecSetPointerStore.cs:1, src/backend/AgentSmith.Infrastructure.Persistence/Repositories/TicketSeriesRepository.cs:41-49, src/backend/AgentSmith.Application/Services/Handlers/SpecHandbackHandler.cs:55-79, src/backend/AgentSmith.Application/Services/Specs/SpecHandbackProgress.cs:18-20, src/backend/AgentSmith.Server/Services/Lifecycle/TicketReopener.cs:24-30, src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:59-77"
  - claim: "Archive import refuses on the migration head; table order is model-driven."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/Archive/ArchiveSchemaCheck.cs:24-30"
  - claim: "observed: a false hand-back stored in the BackgroundWorker manifest was replayed by three runs without a model call."
    evidence: "observed: 2026-10-12, RunLlmCalls + series manifest of ticket 19470"

assumptions: []

scope:
  in: "TicketSeries gains SetJson (the SpecSet), RevisionsJson, HandbackJson (case, reason, readings, taken, parked-at) and a concurrency token; filing, publish and record write it first; the resolver reads it; branch edits and branch-only series are taken in."
  out: "Where files go (3a36f), per-repo edit detection (3a36g), the carrier (3a36h). ApprovedSeries stays the approval record the dialog shows."

decisions:
  - key: "EXTEND, DON'T ADD: TicketSeries already is the per-(project, ticket) series row; its columns stay, so no data moves. Fan-out projects keep separate rows, as today."
  - key: "TODAY'S EDIT RULE, STORE AS TRUTH: when the branch's last series commit differs from RevisionSha, the branch set is read, stored as a new revision with cause ReviewerEdit, and used — no edit is lost, approval immunity unchanged."
  - key: "IMPORT DROPS THE HAND-BACK: a branch-only series is stored once without its hand-back, which has no time; a real contradiction is found again."
  - key: "LAST WRITER LOSES: the concurrency token makes a second replica's save fail and re-read instead of overwriting."

steps:
  - id: columns
    action: "Add SetJson, RevisionsJson, HandbackJson and a row version to TicketSeries; migrations in both persistence assemblies; extend SpecSetPointer, both pointer stores and TicketSeriesRepository."
  - id: write
    action: "Write the store before the branch in FiledSpecBranch, SpecSetPublisher and SeriesRecordCommit; SpecHandbackHandler, SpecHandbackProgress and TicketReopener use HandbackJson."
  - id: read
    action: "In DeriveSpecHandler/SpecSourceResolver read the store; compare the branch's last series commit with RevisionSha and take a reviewer edit back; import a branch-only series once; feed SpecRevisionCause from the store's revision."
    modify:
      - "SpecSourceResolver, SeriesReader, SpecRevisionCause, DeriveSpecHandler, UnansweredQuestionPin"

tests:
  - "SpecSourceResolver_StoredSeries_ReadsStore"
  - "SpecSourceResolver_BranchEditedSinceRevision_TakesEditBackAsReviewerEdit"
  - "SpecSourceResolver_BranchOnlySeries_ImportsOnceWithoutHandback"
  - "FiledSpecBranch_Filing_WritesStoreBeforeBranch"
  - "TicketSeries_ConcurrentSaves_SecondFails"
  - "TicketSeries_Handback_RoundTripsWithTime"

done:
  - "A run whose branch manifest was deleted reads its series, approval and hand-back from the database (RealCompositionHarness)."
  - "An edit committed by a person on the ticket branch is still worked by the next run."
  - "Migrations in both assemblies; SQLite and SQL Server suites green."
