done:
  - "Approving a proposal in the conversation of a ticket whose specs a and b ran records it under that ticket and files no new ticket, on GitHub, GitLab, Azure DevOps and Jira; the approved proposal is not offered again."
  - "The ticket's next run works a series that still holds a and b as they ran, with the proposal's re-cut and new specs after them, revision cause 'approved in design conversation'."
  - "Before approving, the preview names each spec as kept, re-cut, appended or dropped, and the approval records exactly that; anything that changed on the branch since is named in the run's notice."
  - "Approving on a ticket a person closed files one follow-up ticket and both tickets name each other; a ticket agent-smith itself moved to done is continued, not followed up."
  - "Approving on a ticket no code attempt has worked records the approved series on GitHub, GitLab, Azure DevOps and Jira; the description is rewritten only where the tracker supports it, and a refusal is said, never blocking."
  - "No 'Amend this ticket' button is offered in any conversation."
  - "Approving on a handed-back ticket that a run worked is gated and built by the ticket's next run; a ticket worked by another project on the same tracker is continued, never re-filed."
