spec: 2026-10-13-9a59l
goal: "Approving in a ticket's own conversation continues its series by spec id (ran: kept; unstarted: re-cut or dropped; new: appended); a ticket a person closed gets a linked follow-up."

applies_to: "backend (spec dialog outcome sink and shapes, ticket continuation decision and preview, approval record, never-worked amendment, run-side spec source) + docs"

