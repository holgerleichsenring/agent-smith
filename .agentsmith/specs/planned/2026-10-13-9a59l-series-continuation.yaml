assumptions:
  - "2026-10-13-9a59a's TicketAttempts answers a ticket's code attempts (live reservation included, never-started rows excluded) for a (project, ticket id)."
  - "2026-10-13-9a59k's TicketClosure.ClosedForWorkAsync(project, provider, ticket) (Application, async) answers closed-for-work: in the tracker's closed category and not done_status, failed_status, needs_clarification_status or not_implementable_status, nor a run's own close when no done_status is set (read through ITicketStatusHistory.NewestMoveIntoAsync)."
  - "A cleared SatisfiedAt makes discovery name the ticket again, but discovery still claims only from a trigger status; recording a continuation moves no status, so nothing starts in this spec."

scope:
  in: >
    DECISION: TicketContinuation.Decide(state, proposal) is a pure function over TicketContinuationState —
    the ticket fetched now (closed = 2026-10-13-9a59k's TicketClosure closed-for-work), WORKED = at least one
    code attempt by 2026-10-13-9a59a's TicketAttempts in ANY project of FiledWorkTrackerProjects.SharingTrackerWith
    (the reach FiledWorkClaims has; a ticket touched only by pr-review or scan runs is never-worked), the BASIS (2026-10-13-9a59e's latest cut with specs plus the pointer's ExecutedIds, else the
    approval record's set), the record. It answers one effect: bug-ticket (a bug proposal files as today),
    follow-up-closed, amend-never-worked, refused-over-cap (executed plus resulting unstarted specs over
    SpecSet.MaxSpecs, naming both counts), or continue. MATCH BY ID: a draft whose id is executed is kept (a
    changed text is reported as a discarded edit, never applied); an unstarted basis id the proposal repeats is
    recut (kept only when its yaml is byte-identical); an unstarted basis id a lone SPEC proposal does not repeat
    is kept; one an EPIC proposal omits is dropped; an unknown id is appended and takes SeriesIdFactory.NextFree
    past every basis, executed and record id, requires edges rewritten by SpecDraftIdRewriter.
    ACT: TicketFilingOutcomeSink.AcceptAsync routes a bound spec or epic approval to TicketContinuationAct.
    Continue stores the record through ApprovedSpecSetRecorder with the new SpecApprovalRecord.Continuation
    (dispositions in proposal order, BasisRunId); its Repositories are the basis series' (the pointer's ShaByRepo
    keys, else the previous record's) united with the proposal's, its carrier the basis carrier (pointer
    CarryingRepo, else the previous record's). It publishes TicketActivityChanged (2026-10-13-9a59a), says in
    the thread that the ticket's next attempt works it (a Filing turn), and clears the open proposal
    (ClearProposalAsync) — as do amend-never-worked and follow-up-closed once they acted; refused-over-cap keeps it.
    A failed ticket or state read (Azure DevOps state category included) refuses the approval: the reason is said
    as a Filing turn, nothing is recorded, the proposal is kept; the preview answers 502 with the reason.
    HAND-OFF: ApprovedSetHandoff never hands over a record whose Continuation carries a BasisRunId — its Set is
    the proposal, not the series; with nothing at the path the run fails naming that the approval continues a
    series the branch no longer holds.
    RUN MERGE: ApprovedContinuation beside SpecSourceResolver — when the branch answered and the resolved record
    carries a Continuation WITH a BasisRunId whose approval is newer than the branch set's, it applies the
    dispositions to the branch as read NOW: recut replaces an unstarted spec keeping its id and branch label,
    dropped removes an unstarted one, appended takes NextFree past the branch's ids; a spec that ran since the
    basis is kept and its recut/drop reported as discarded; branch specs the basis never saw stay after the
    appended ones and are named; over the cap nothing is merged and the notice says why. A Continuation without a
    BasisRunId (the never-worked hand-off) is never merged. NeedsModel false, cause SpecRevisionCause.Approval,
    approval the record's, Handback null — the approval answers a hand-back, so the merged set is gated and built; the discarded note reaches ApprovedSetKeptNotice in place of DeriveSpecHandler's null.
    NEVER-WORKED: amend-never-worked records the approved series on EVERY tracker through TicketAmendment —
    ApplyAsync gains an optional SeriesContinuation passed to RecordAsync (null here; 2026-10-13-9a59m passes its
    start flag); the description is rewritten first where the tracker supports it, a refused or failed rewrite is
    said and never blocks; the record and the branch (read-back ticket) are written anyway. The LEASE half of
    FiledWorkClaims stays (FiledWorkClaims.LeaseOnAsync, which OnAsync calls first for the withdrawal): a claimed
    ticket is refused and nothing is recorded; the refusal and the catch message (TicketAmendment.cs:63-65,75-76),
    which name the retired amendment and claim a rewrite, are reworded in place to say the approval was not
    recorded; the Run-row half is replaced by Decide's code-attempt rule. FOLLOW-UP from an APPROVAL: ClosedTicketFollowUp files the proposal's drafts minus the
    closed ticket's executed ids through OutcomeTicketFiler (nothing left: said, nothing filed), then
    FollowUpLink posts one 'Agent Smith —' comment on each ticket naming the other.
    PREVIEW: GET /api/tickets/{project}/{ticketId}/approval-preview (dialog.write, own endpoint class) runs
    Decide over the ticket's conversation's open proposal and answers effect, reason, counts, basis run id and
    per-spec {specId, goal, disposition kept|recut|appended|dropped, note}; 404 when no conversation or proposal.
    RETIRE AMEND (here, so no window leaves the shape without its guard): OutcomeShapes.AmendTheTicket, the
    confirmer's IsAmend arm, OutcomeAmendRequested, the flow arm, IOutcomeSink.AmendAsync and
    TicketFilingOutcomeSink.AmendAsync go; the label typed in a bound thread is an edit note; the prompt's
    filed-work clause says approval in a bound conversation continues the ticket (line-neutral).
    WORDING: the recorder's summary states the id rule; ApprovedSetKept.WhereToChangeIt names the ticket's
    conversation; ticket_runs' description says repeating an id re-cuts it and a lone spec leaves the rest kept.
    DOCS: work-it-out.md, spec-dialogue.md: approve continues the ticket by id, what the preview shows,
    never-worked records on every tracker, a person-closed ticket gets a follow-up from an approval.
  out: >
    Starting an attempt from the approval — the first of a never-worked ticket and the next of a worked one (start
    now, wait for the live run, refuse while a question pends, recorded without runs.control, answering a
    hand-back), the operator cause, pending-act and nudge arms, and resuming a ticket-bound conversation by any
    dialog.write holder — 2026-10-13-9a59m. A keyword comment or pull-request act on a ticket a person closed filing
    the follow-up instead of reopening it — 2026-10-13-9a59t. Retry after an infrastructure end —
    2026-10-13-9a59n. Verdicts, criteria and PR review on ticket_runs — 2026-10-13-9a59o. Rendering the preview in
    the composer, the Work it out page's approval card wording for a bound conversation, and refetching the
    conversation and the preview after the composer's approval (nothing is pushed to an open pane) — 2026-10-13-9a59r.
    Recording the cut the basis reads — 2026-10-13-9a59e. Rewriting a worked ticket's description: the series is
    the document (operator decision 9). A native tracker relation between the two tickets: no provider has one;
    the comments are the link. Rebinding the conversation to the follow-up: the conversation stays the closed
    ticket's, and each later approval there files another follow-up.

decisions:
  - key: "CLOSED MEANS CLOSED FOR WORK (main-thread decision 1, 2026-10-13; pending operator ratification, recorded in 2026-10-13-9a59k): in the tracker's closed category AND not done_status, failed_status, needs_clarification_status or not_implementable_status, nor a run's own close when no done_status is set (TicketClosure.ClosedForWorkAsync reads it through ITicketStatusHistory.NewestMoveIntoAsync). A person closed it. So a Request changes or /agent-smith on a run's own pull request still reworks (TicketLifecycle.cs:9-13, ReworkParkCheck.cs:33-36), and only a person-closed ticket gets a follow-up."
  - key: "SPLIT, NOT CUT (review3-l L8 and L1; main-thread decision 4). The act door (keyword comment and pull-request act on a ticket closed for work, the act's text, the rework ledger order) is 2026-10-13-9a59t, built last. L1's cut of the pull-request channel is not applied there: decision 1 removes the regression it named, because the run's own done or close is not closed for work."
  - key: "AMEND IS RETIRED HERE, NOT IN 9a59m (review3-l L2). This spec removes TicketAmendment's Run-row refusal; leaving the shape live until m's commit would let 'Amend this ticket' rewrite a worked ticket's description with no guard. Approve is the amendment in a bound conversation; the retired label falls through to an edit note."
  - key: "THE LEASE STAYS (review3-l L3). Between taking the lease and the Run row appearing, a never-worked ticket is claimed and invisible to TicketAttempts; writing the record and the checkout-free branch then races the claiming run. The lease half of FiledWorkClaims refuses that window with today's sentence; only the any-pipeline Run-row half gives way to the code-attempt rule. The preview, computed before the act, may say never-worked during that window; the act's answer is what is true."
  - key: "AN ACTED-ON PROPOSAL IS CLEARED (review3-l L4). Continue, never-worked and follow-up clear LatestProposalJson as the Amend arm did, so the preview, 2026-10-13-9a59h's open proposal and 2026-10-13-9a59r's composer never offer it again."
  - key: "ONLY A WORKED BASIS IS MERGED (review3-l L5, review3-m M2). A Continuation without a BasisRunId is the never-worked hand-off: merging its empty dispositions over a stale branch set (TicketAmendment.cs:102-108 failure branch) would stamp the new approval onto the old set (SpecRevisionHeader.cs:42) and 9a59d would record it as worked."
  - key: "KEPT MEANS NOT REPEATED (review3-l L7). The bound agent sees spec ids, not yaml (BoundTicketRuns.cs:27-30), so a repeated unstarted id is practically always a re-cut; byte-identical yaml stays 'kept' but is not relied on. A lone spec proposal keeps what it does not name; an epic drops it."
  - key: "MATCH BY ID, NOT BY POSITION (review2-g G1). Position cannot tell a kept spec from a re-cut or appended one; the id can, and an executed id is the record of work. The recorder's positional summary described a merge nobody built and is replaced."
  - key: "DISPOSITIONS ARE RECORDED, THE RUN APPLIES THEM. The server has no clone and the checkout-free write mints revision 1 (FiledSpecBranch.cs:99-105); a live run may hold the branch. So the approval stores what each spec should become and the run applies it as the next revision with cause Approval; what changed on the branch since is reported in the run's notice, never silently applied."
  - key: "AN EXECUTED SPEC IS KEPT WHETHER OR NOT THE PROPOSAL LISTS IT. It can never leave the series, so omission cannot mean anything else; a changed text of one is reported as discarded, never refused."
  - key: "APPROVED IS FINAL FOR TICKET TEXT. A continuation's revision carries the approval (SpecRevisionHeader.cs:42), so from then on a ticket comment or edit no longer re-cuts the set (SpecAmendmentRule.cs:52); a change goes through the conversation (operator decision 9). The docs say so."
  - key: "WORKED MEANS A CODE ATTEMPT. FiledWorkClaims' Run-row half counts a run of any pipeline, so a ticket a pr-review or scan run touched could never be continued; a's attempt rule is the one definition the ticket page also shows."
  - key: "THE CONVERSATION STAYS BOUND. Rebinding would move the session's unique (tracker, ticket key) to a ticket it never discussed; the thread names the follow-up instead."
  - key: "NEVER-WORKED RECORDS ON EVERY TRACKER (operator default, 2026-10-13). Today the rewrite gates the record, so on Jira an approval changed nothing. The run reads the branch and the record, never the description (TicketAmendment.cs:19-22), so the rewrite is a courtesy: attempted where supported, said when refused, never blocking; it still goes first so the branch set's fingerprint is the stored text."
  - key: "DEVIATION FROM THE SERIES CONTRACT: Decide(state, proposal) has no readOnly flag. It is pure — the preview calls it, the act calls it and then applies the effect. 2026-10-13-9a59m adds its start arm as a field of the continue and amend-never-worked effects and inputs on TicketContinuationState. Effects add bug-ticket beside the contract's four."
  - key: "ONE WRITER OF ACTIVITY: the stored continuation publishes TicketActivityChanged; a filed follow-up is a new ticket whose first run publishes its own. No table and no event type is added, so DataArchiveRoundTripTests (37 tables / 76 seed rows), DataArchiveSchemaTests and FilterRail.tsx are unchanged by this spec (main-thread decision 6)."
  - key: "THE APPROVAL ANSWERS A HAND-BACK (review4-l L4-1; main-thread decision 1). Finalize keeps a set's Handback (SpecRevisionHeader.cs:38-43) and a handed-back set gates nothing (SpecGateHandler.cs:33-36); the merge bypasses the Rework re-derive that clears it today (SpecAmendmentRule.cs:48-49), so it clears Handback itself — else 2026-10-13-9a59m's answers-handback attempt parks again at once."
  - key: "A CONTINUATION RECORD SCOPES THE WHOLE SERIES, NOT THE PROPOSAL (review4-l L4-2; main-thread decision 2). The run narrows to record.Repositories (ApprovedRepoScope.cs:58-79): the proposal's alone would leave the executed specs' repositories out (SpecSourceResolver.cs:70-71), so they are united with the basis series'; the carrier stays the basis carrier the pointer names. Its Set is only the proposal, so the hand-off refuses it rather than make it the series."
  - key: "WORKED REACHES EVERY PROJECT ON THE TRACKER (review4-l L4-3; main-thread decision 3). One record serves every project a ticket routes to (ApprovedSpecSetRecorder.cs:16-19); a sibling project's run read as never-worked would write a revision-1 branch over the one that run published (FiledSpecBranch.cs:99-105)."
  - key: "A FAILED READ REFUSES, IT DOES NOT GUESS (review4-l L4-5; main-thread decision 5). Deciding closed or worked from an unreadable ticket could follow up an open ticket or continue a closed one; the person approves again once the tracker answers, and the proposal is still there."
  - key: "REGISTRATIONS WITHOUT LINES. ApprovedContinuation chains onto SpecDerivationRegistrations line 69 (113 stays); TicketContinuationStateReader, TicketContinuationAct, ClosedTicketFollowUp and FollowUpLink chain onto SpecDialogExtensions line 60 (119 stays); the preview endpoint class adds one map line to ServerEndpointExtensions (71 -> 72 before other members)."

steps:
  - id: contracts
    action: "SpecApprovalRecord.Continuation (SeriesContinuation{Dispositions[SpecDisposition{SpecId, Kind}], BasisRunId nullable}, appended last)."
  - id: basis
