spec: 2026-10-13-8762s
goal: "A person ratifies one mock version per spec in the design conversation; filing names it in ratified_mock and writes it beside the spec, and the diff review compares a built static page with it."

applies_to: "backend (spec-dialog ratify endpoint and transcript turn, the filing stamp and branch write, SpecDraft/spec schema, the spec diff review's tools and prompt)"

