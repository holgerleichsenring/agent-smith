assumptions:
  - "2026-10-13-8762r stores each mock version as ReferenceFile rows of Kind mock in the conversation named {specId}.html and {specId}.jpg (one set per version, at most 100 versions per conversation), with the spec id the conversation's proposal carries; the version number and the {specId}-mock-v{n} names are DERIVED at read from the rows' Id rank, never stored; it exposes ONE reader over them, IConversationMockReader (ListAsync per conversation; HtmlAsync by session, spec id and version), and the file SpecDialogMockEndpoints; this spec adds no second reader."
  - "A ratified mock is static HTML plus files it links inside its own directory, which render_reference already serves from a repository path."

scope:
  in: >
    RATIFY: POST /api/spec-dialog/conversations/{sessionId}/mocks/{specId}/ratify body {version}, dialog.write
    (the approve answer's permission), added to 2026-10-13-8762r's SpecDialogMockEndpoints.
    MockRatification checks MayReachSessionAsync (404 otherwise), that IConversationMockReader.ListAsync holds that
    version for that spec id in that conversation (404 naming the version otherwise), and refuses with 409 ONLY
    while the session's turn is COMPUTING (SpecDialogTurnGate.Liveness(sessionId).Computing), which only the
    replica running the turn knows; on any other replica it is accepted and, by the TRANSCRIPT RELOAD below,
    kept. It never calls TryEnter/Exit, so a ratification during the approval wait — the only time the
    proposal is on screen waiting — is accepted on every replica. It appends ONE transcript turn: role User, text "Ratified mock v{n}
    of {specId}.", Kind = SpecDialogTurnKind.MockRatified (7), TranscriptTurn.Mock = MockRatificationTurn(SpecId,
    Version, By) (appended LAST, null on every other turn), reading the row through the repository and saving
    through BoundSessionNudge.SaveAsync, so a bound ticket's page refreshes; SpecDialogSessionManager (120) is
    untouched. A later ratification of the same spec supersedes an earlier one; RatifiedMocks.Of(transcript)
    answers spec id -> version, newest turn wins. The design partner reads the turn like any other user turn.
    STAMP: SpecDraft.RatifiedMock (int?, init), read by SpecDraftReader from a top-level ratified_mock integer;
    .agentsmith/spec.schema.json gains ratified_mock (integer, minimum 1, "the version of the design mock a
    person ratified; the file {spec}-mock-v{n}.html lies beside the spec"). Before SpecDialogOutcomeFlow hands an
    approved proposal to the sink, RatifiedMockStamp reads the session's transcript through a FRESH scope
    (IServiceScopeFactory, as TicketTranscriptReader does) — the turn's scope holds a tracked copy that predates a
    ratification made while the approval waited — and, per draft, sets ratified_mock to the ratified version or
    REMOVES the key when no person ratified one; a value the model wrote never survives. TRANSCRIPT RELOAD
    (fixes today's lost approval-answer turn too): the turn's scope tracks the session, so its later appends — the
    assistant turn and the Filing turn — write back a stale transcript column over any turn another scope added
    meanwhile (the approval answer today, a ratification here). SpecDialogSessionRepository.GetOpenByThreadAsync
    becomes a block that runs the same query and, when a row is found, re-reads its current values with
    unitOfWork.Update(open).ReloadAsync(ct) (IUnitOfWork has no Entry): the expression-bodied 6 lines become 7
    (one-line signature, the query on two lines, the reload, the return, braces), so the repository goes 119 -> 120;
    the manager (120) is untouched. It applies to every caller: each one reads only, or reads, changes and saves in
    sequence, so none loses a staged change; a reader pays one extra round trip. Limit: a write landing between the
    reload and the same method's save still races, as any unversioned row does. FILES: FiledSeries.Sources
    (minted id -> the proposal's spec id), an INIT property beside 2026-10-13-8762j's Contract and
    2026-10-13-8762l's ReviewRounds (null read as empty, so the two product constructions and the one test keep
    compiling), filled by FiledSeriesFactory.Mint/Under(ordered, OutcomeProposal? source) from j's
    SeriesDraftIds.Map. FiledSpecBranch.WriteAsync takes
    the sources (one new optional parameter); FiledSpecBranch's constructor takes IConversationMockReader? mocks =
    null (last, the IReferenceNotes? notes = null precedent), because the CLI composes it through
    AddSpecDerivation with ValidateOnBuild and only the Server registers the reader; no registration line changes.
    Through RatifiedMockFiles (a static helper in Application/Services/Specs, handed the reader), it reads each
    stamped draft's version via IConversationMockReader.HtmlAsync(record.Approval.Conversation, sourceId, n) — (spec id, version) is resolved
    only through that reader — and adds RepoFile({SeriesPaths.Planned}/{mintedId}-mock-v{n}.html, html), the
    derived name written as a file name for the first time to the member's files; FiledSeriesWrite adds to
    each repository member's commit the mocks of the specs in that member's sub-series. With no reader the branch write
    adds the note "the ratified mock was not written: this process holds no conversation store". A version gone
    from the conversation is a sentence in BranchWriteResult.Notes (appended LAST, default null), not an error:
    FiledSpecBranchWrite adds the notes to the filing notes, TicketAmendment puts them into its existing recorded
    sentence, interpolated inline on that line (TicketAmendment.cs:88-89; one argument on the WriteAsync line, no
    helper method, stays at 120). When the branch
    write FAILS, FiledSpecBranchWrite's existing note also says the ratified mock was not written, because the run's
    later publish from the stored record carries no bytes. RUN: SpecPromptSection marks the ratified mock
    "ratified by a person — build against this one". REVIEW: a new RatifiedMockReview resolves, for the current
    spec, the ratified mock (the set's DerivedSpec by spec id, RatifiedMock n, {id}-mock-v{n}.html in its MockPaths)
    and the CANDIDATES — every .html file in this spec's diff outside .agentsmith/ (a mock or a spec companion
    there is never a candidate); all are listed in the prompt and the reviewer compares the one that renders the
    ratified page. With both and the browser on, the diff reviewer gets the list RenderReferenceToolFactory.Tools(
    pipeline, false) builds (render_reference, compare_reference and the run's view_reference_image, which that
    factory adds outside the browser gate), its iteration cap grows by THREE (render, compare, and the read a
    finding must cite), and its look opens on DerivationLookTerms.SpecReview with { Allowance =
    SpecReviewAllowance + 1 }, so the read a compare finding cites is never refused for want of a look — the terms
    come from RatifiedMockReview on the existing OnTerms line (ReviewSpecDiffHandler.cs:61), no line added. The
    prompt section says: compare the built page with the ratified mock; a difference the done-list does not excuse is a finding that cites YOUR READ
    of the built file's line that renders it, or it is not admitted. After the review RatifiedMockReview counts the
    run's recorded comparisons (VisualComparisonRecorder.Recorded) before and after; none recorded means the step's
    result says "ratified mock vN offered, not compared". Without a candidate the result says "ratified mock vN not
    compared: the spec built no static page" and no tools are added; without the browser or the file beside the
    spec it says so likewise.
  out: >
    The version strip, its screenshots, the Ratify button and the proposal block naming the ratified
    version — 2026-10-13-8762t. Writing mock versions, numbering them and rendering them in the turn —
    2026-10-13-8762r. A ratified mock's bytes in a WORKED ticket's continuation approval: the record is applied by
    the run, which holds no reference-file bytes, so the yaml names ratified_mock and the diff review reports the
    file as not beside the spec — nobody: closing it needs a server-side branch write on the continuation path,
    which no member of this series builds. The ratified mock after a FAILED branch write — nobody: the record holds
    no bytes by decision, and the filing note says so. Re-stamping after filing: a ratification made after the
    approval was filed reaches the spec only through an amendment of that ticket — nobody: filing is the moment the
    yaml becomes the record. Comparing a page that only a running app renders (a React/Vite page has no built
    .html) — nobody: rendering a running app needs the app served inside the browser sandbox, which no member
    builds; the step result says the compare did not happen. A compare as a verify stage — nobody: contract
    decision 21 makes it a finding. Releasing any skill text — nobody: nothing here needs a skill (the partner
    reads the ratification turn as text).

decisions:
  - key: "THE RATIFICATION IS A TRANSCRIPT TURN UNTIL FILING, THE SPEC YAML AFTER IT. The approval files an in-memory proposal held on one replica, so a ratification cannot edit that object, and the proposal pane's stored copy is display state. The transcript is per-session, durable and read by every replica and by the model. Series contract section 2.2, amended: 'which mock version is ratified' is the ratification turn in the conversation transcript before filing and the spec yaml after it."
  - key: "ONLY A PERSON STAMPS IT. The stamp sets ratified_mock from the turn and removes any value the model wrote, so the field means a person ratified that version, never that a model claimed so."
  - key: "RATIFIED_MOCK IS A VERSION NUMBER, NOT A FILE NAME. The id is re-minted at filing and rewritten in the yaml; a number survives the rewrite untouched and the file name follows from the frozen id plus the number, so one datum names the file."
  - key: "THE BYTES ARE READ AT THE BRANCH WRITE, NEVER STORED ON THE RECORD. The approval record is the stored set; copying the html into it would be a second copy of the reference file. FiledSeries.Sources is the only bridge, in memory for the length of one filing."
  - key: "THE COMPARE IS A FINDING. Default, pending operator ratification (contract decision 21): a pixel or style difference is judgement, so it rides the existing diff review and its one fix pass; it never fails a spec."
  - key: "NO EVENT. The compare lands in SpecReviewed (81) findings and the recorded visual comparison; the ratification is a transcript turn the conversation view already serves."
  - key: "RATIFY IS REFUSED ONLY WHILE THE TURN COMPUTES (series main-thread decision 10). The gate stays entered across the approval wait, which is exactly when the proposal and its strip are on screen; taking the gate would answer 409 on the replica running the turn and 200 on any other. Liveness(...).Computing is the span of real work, and a ratification during it would race the model's own proposal. Alternative rejected: TryEnter (unreachable done criterion, replica-dependent)."
  - key: "THE 409 IS PER REPLICA, AND THE RELOAD IS WHAT KEEPS A RATIFICATION ELSEWHERE. Liveness is in-process (SpecDialogTurnGate.cs:18-27), so the refusal holds on the replica running the turn; a ratification accepted on another replica during the computation is kept because the turn's later appends re-read the row first. Multi-replica is a requirement, so the guarantee is the kept turn, not the refusal."
  - key: "THE RELOAD IS UNCONDITIONAL AND LIVES IN THE REPOSITORY READ. Today the turn's scope already overwrites the approval answer appended by the answer's own scope (SpecDialogAnswerAdmission.cs:36-37, TicketFilingOutcomeSink.cs:69-71); this is not a ratification-only race. Alternatives rejected: reloading only in the manager's two transcript writers (the manager is 120/120 and the writers need one more line each); a new repository method (8 lines, repository at 127); AsNoTracking reads (every writer would save nothing)."
  - key: "A COMPARE BUYS ITS OWN LOOK. The citing read is a look, capped by the look's allowance, not by MaxIterations; a reviewer that spent its eight looks on the diff would get 'No look left' and its compare finding would be discarded. One more look and three more iterations when the compare is offered; otherwise the terms are unchanged."
  - key: "THE MOCK READER IS OPTIONAL. FiledSpecBranch is composed by the CLI too, which has no conversation store; a required reader would fail ValidateOnBuild. Without one, the branch write says the mock was not written."
  - key: "REJECTED CUT: 'the run's derivation drops RatifiedMock and the ratified_mock key from model output in DerivedSpecBuilder' — the run's derivation never copies a model key into the yaml: DerivedSpecBuilder renders the yaml through DerivedSpecYamlRenderer from named fields only (DerivedSpecBuilder.cs:44-50, 53-63; DerivedSpecYamlRenderer.cs:18-24) and SpecFallback does the same (SpecFallback.cs:47-49), so a Rework re-cut or a bare-ticket derivation cannot carry ratified_mock. The pin test DerivedSpecBuilder_ModelElementNamesRatifiedMock_DraftCarriesNone guards it instead of code. A ratified_mock a reviewer writes into the branch file beside a mock is the existing hand-placed path, a person's act."
  - key: "REVIEWED BEFORE THE RECORD STEP. Rendering a repository page copies its whole directory (RepoRenderSource.cs:20-35, at most 500 files, ReferenceSetLimits.cs:10); specs/planned holds 142 files here, specs/done 1165. ReviewSpecDiff precedes WriteSpecRecord (PipelinePresets.Parking.cs:58-59), which moves the mock to done/; reordering them would make every compare refused."
  - key: "THE STAMP READS THROUGH A FRESH SCOPE. The turn's scope tracks the session row since it appended the assistant turn, and EF hands back that tracked copy on every later query, so a ratification written in another request's scope would be invisible. Alternative rejected: AsNoTracking on every repository read (changes the save semantics of every caller)."
  - key: "A COMPARE MUST BE CHECKABLE OR IT IS SAID NOT TO HAVE HAPPENED. The admission keeps only findings on a read line, so the prompt asks for that read and the cap pays for it; a reviewer that had the tools and recorded no comparison is reported, never silently counted as a compare. Only a static .html in the diff is a candidate today."
  - key: "SAVED THROUGH BoundSessionNudge (series main-thread decision 10). A ratification is a turn of the ticket's conversation; a plain repository save would leave the bound ticket's page stale until some unrelated write."

steps:
  - id: contracts
    action: "SpecDialogTurnKind.MockRatified = 7; MockRatificationTurn record; TranscriptTurn.Mock (last); SpecDraft.RatifiedMock; SpecDraftReader reads ratified_mock (87 -> about 89); spec.schema.json property; FiledSeries.Sources (init property, beside j's Contract and l's ReviewRounds); BranchWriteResult.Notes (last, default null)."
  - id: ratified-read
    action: "RatifiedMocks.Of(transcript) — newest MockRatified turn per spec id."
  - id: ratify
    action: "MockRatification (reach, version exists via IConversationMockReader, 409 only while Liveness(...).Computing, append and save through BoundSessionNudge) and its route in 2026-10-13-8762r's SpecDialogMockEndpoints; ServerEndpointExtensions untouched; regenerate route-permission-baseline.tsv."
  - id: stamp
    action: "RatifiedMockStamp (fresh scope read; set or remove the top-level key in each draft's yaml, refresh RatifiedMock); SpecDialogOutcomeFlow calls it before AcceptAsync (83 -> about 86)."
  - id: transcript-reload
    action: "SpecDialogSessionRepository.GetOpenByThreadAsync becomes a 7-line block: one-line signature, the same query, unitOfWork.Update(open).ReloadAsync(ct) when found, return (119 -> 120); the 14 product callers (facts) need no change; integration tests through the real ServiceProvider for the ratification, the assistant append and the approval answer."
  - id: files
    action: "FiledSeriesFactory.Mint/Under fills Sources from SeriesDraftIds.Map; RatifiedMockFiles; FiledSpecBranch takes IConversationMockReader? mocks = null and WriteAsync takes the sources and reads the mocks through the static RatifiedMockFiles, noting a missing reader (106 -> at most 115); FiledSeriesWrite (37) commits them per member; FiledSpecBranchWrite (61) passes the sources, surfaces Notes and names the mock in its failure note; ApprovedSetTicketFiler (107) passes series.Sources; TicketAmendment (120, stays at 120) passes amended.Set.Sources and carries Notes in its sentence."
  - id: run-prompt
    action: "SpecPromptSection names the ratified mock (76 -> about 79)."
  - id: review
    action: "RatifiedMockReview (new: target, candidate, tools, prompt section, after-review sentence); ReviewSpecDiffHandler (about 111 after 2026-10-13-8762a and 2026-10-13-8762k) gains one ctor parameter and about 4 lines, stays at or under 120; the OnTerms line takes the review's terms (allowance + 1 when offered); candidates exclude .agentsmith/; SpecDiffReviewer (about 91 after k) takes extra tools and a cap of MaxIterations + 3 for them; SpecReviewPrompt (about 86 after k) gains the compare section."
  - id: tests
    action: "Red first, then green, for every test below; run the SpecDialog, Specs, Server, Persistence and Architecture classes touched."

