done:
  - "In a design conversation, ratifying mock v2 of a spec leaves a turn the conversation shows and the partner reads; ratifying v3 afterwards replaces it; a ratification while the partner is computing is refused with 409 on the replica running the turn; elsewhere it is accepted and, by the reload, kept."
  - "Approving that proposal files a spec whose yaml says ratified_mock: 2 and whose ticket branch carries .agentsmith/specs/planned/{spec id}-mock-v2.html under the minted spec id, also when the ratification happened in another request while the approval question was open, and the transcript still holds the ratification turn and the approval answer turn after filing."
  - "A spec the model marked ratified_mock without a person's ratification is filed without the key."
  - "The run's master is told which mock is the ratified target; when the spec built a static page, its diff review compares that page with the mock and admitted differences earn the one fix pass; otherwise the step result says why the mock was not compared (no static page, no browser, not beside the spec, or offered and not compared)."
  - "Build green, full suite green, dashboard gen:hub-events/test/build green."
