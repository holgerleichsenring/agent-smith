done:
  - "A spec or an epic's children proposed in a design turn reach the approval card only after their review rounds ran, with each round's cuts applied by the design partner and checked against the cuts; the epic parent gets one evidence check and the whole-set check."
  - "On Slack and Teams the reply a person reads, and the next turn replays, carries exactly the drafts that will be filed, and a draft not reviewed yet is listed among the findings."
  - "The approval card and the ticket page's proposal block show, per draft, every round's verdicts, cuts, findings and anything a cut left standing, and below them what still stands."
  - "When review has used its share of the turn's cost cap or wall clock, the card shows the specs not reviewed yet and they cannot be approved until a later turn reviews them."
  - "A draft the design partner changes wrongly keeps its last valid text while the other drafts keep their applied cuts; a draft a reviewer refused can be rewritten by the partner under the same id and requires."
  - "An epic too large for one turn's share is reviewed across turns: each turn reviews at least one more draft and keeps what earlier turns cleared, until it can be approved."
  - "With spec_review.rounds 0 a design turn reviews exactly as it does today, and a config-store edit applies to the next turn without a restart."
  - "A proposal stored before this spec opens unchanged on the card and on the ticket page."
  - "Build green, full suite green, dashboard gen/test/build green."
