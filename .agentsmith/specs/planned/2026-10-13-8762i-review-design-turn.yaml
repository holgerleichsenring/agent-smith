spec: 2026-10-13-8762i
goal: "A design turn's spec or epic proposal goes through the same review rounds, cuts applied by the design partner, before a person can approve it; the proposal shows every round."

applies_to: "backend (the design turn's proposal review: rounds loop within the review share, the cuts re-prompt and its guard, the proposal's stored rounds and not-reviewed list, the approval refusal for an unreviewed proposal, the ticket conversation's proposal view) + dashboard (the approval card and the ticket page's proposal block) + skills (design-partner-master)"

