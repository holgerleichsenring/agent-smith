# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-8762p
goal: "A person ratifies or overrules many of a ticket's defaults at once; an overrule re-derives the next attempt with its note, and every verdict reaches the ticket branch."

applies_to: "backend (Server ticket endpoints and the verdict writer, the rework act readers and the revision cause in Application, the previous-attempt read in Persistence, the ticket prompt section, the spec record step's decision-file copy, the closed-ticket follow-up)"

requires: [2026-10-13-8762o]

