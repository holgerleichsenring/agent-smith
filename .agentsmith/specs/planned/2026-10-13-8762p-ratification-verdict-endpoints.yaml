done:
  - "GET /api/tickets/{project}/{ticketId}/defaults lists a ticket's defaults, pending holding-series ones first, each with its attempt and verdict."
  - "Ratifying or overruling several defaults in one POST decides each once; a second POST of the same ids reports them already decided and changes nothing."
  - "An overrule starts one rework attempt on a finished ticket; that attempt re-derives the set with the overruled question, chosen answer and note in view, and its Attempts entry names the overrule and who made it."
  - "A default from the design conversation can be ratified on the ticket page; overruling it is refused with 'answer it in the design conversation'."
  - "After the next attempt records a spec, every ratified or overruled default of the ticket appears once in .agentsmith/decisions/ on the ticket branch, so deleting the run that took it loses no verdict."
  - "An overrule on a ticket a person closed files a follow-up carrying the note instead of reopening it."
  - "An overrule whose attempt cannot add a spec (a full executed set) says so on the ticket instead of passing in silence."
  - "After a verdict the open ticket page re-reads without a reload."
  - "Build green, full suite green, dashboard gen/test/build green."
