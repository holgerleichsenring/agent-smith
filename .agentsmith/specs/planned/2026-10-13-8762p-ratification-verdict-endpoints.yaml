assumptions:
  - "2026-10-13-8762o's RunDefaultDecision row carries Id (long), RunId, EventSeq, SpecId, Question, Chosen, AlternativesJson, Why, HoldsSeries, Kind, PointerPath, TakenAt, and the verdict columns Verdict (DefaultDecisionVerdicts: pending | ratified | overruled, default pending), VerdictBy, VerdictAt, VerdictNote; its projection only inserts, so a replay never resets a verdict."
  - "2026-10-13-8762o's row carries Conversation (the design turn's session id, null in a coding run); a design turn's run row names no ticket, so its defaults reach a ticket only through the conversation bound to it."
  - "2026-10-13-8762o's out-items defer marking a memory-proposal row whose run delivered no pull request as 'not landed' in the read to this spec; this spec takes it as the landed flag."
  - "A ticket holds at most a few hundred defaults across its attempts; one read of them, filtered in memory, is cheap."

scope:
  in: >
    READ: GET /api/tickets/{project}/{ticketId}/defaults (runs.read) -> TicketDefaultsReader: the ticket's runs
    (TicketRunsQuery) and its bound conversation (TicketTranscriptReader.SessionAsync), their RunDefaultDecision rows
    in one query (RunId IN the runs OR Conversation = the bound session's id; series contract decision 24), composed as
    TicketDefaultsView {pending, pendingHoldingSeries, entries[]}; each TicketDefaultView = id, runId, attempt
    (TicketAttempts number, null for a run that is not an attempt and for a design turn's row), conversation (the row's
    Conversation, null in a coding run), specId, question, chosen, alternatives, why, holdsSeries, kind, pointerPath,
    takenAt, verdict, verdictBy, verdictAt, verdictNote, landed (bool?: on a memory-proposal row of a finished run,
    whether that run's PullRequestsJson names a pull request PullRequestStatuses.HasPullRequest accepts; null on every
    other row and while the run is live). A conversation row's question, chosen, alternatives and why are
    filled only when TicketConversationReadEndpoints.MayReadTranscript holds; otherwise they are null. Order: pending
    holding the series, other pending, then decided; newest first within each. 404 for a pair with no run. WRITE: POST
    .../defaults/verdicts (runs.control), body [{id, verdict: ratified|overruled, note?}] -> DefaultVerdictWriter. All
    items are validated first: 1..100 items, a known verdict, a note of at most 2000 characters, every id a default THIS
    ticket lists, no overruled on a row with Conversation set, and no overruled on a row whose run is not an attempt
    (attempt null, worded "only an attempt's default can be overruled": DecidedDefaults reads code runs only); any failure is 400 with a plain text body
    (Results.BadRequest(text)) naming the items, the conversation case worded "answer it in the design conversation",
    and nothing is written. Each item is then one conditional update (Id = id AND Verdict = pending) setting Verdict,
    VerdictBy (PrincipalOf), VerdictAt (TimeProvider), VerdictNote; an item that matched nothing is reported
    alreadyDecided with the standing verdict, never overwritten. 200 {applied[], alreadyDecided[]}. After the updates,
    if any overrule or any verdict on a holdsSeries row applied: ONE ReworkNudgeRequest(project, ticket, Operator,
    Channel: Overrule when an overrule applied, else none); if anything applied: ONE TicketActivityChanged (56) through
    ITicketActivityNudge. THE OVERRULE IS THE ACT: DecidedDefaults (Persistence, one query, used by both readers below)
    reads the decided RunDefaultDecision rows of the ticket's code runs, plus, when a conversation is given, of that
    conversation, as DecidedDefault (id, runId, specId, question, chosen, verdict, note, by, at); PreviousAttempt gains
    Overrules (the overruled ones of the code runs; VerdictAt filtered in memory). OverruleAct.Of(attempt) returns the
    newest overrule the attempt Precedes as ReworkAct(by, at, ReworkChannel.Overrule) {Source = (default, id)};
    OverruleAct.TextOf(attempt) names every such overrule; ReworkPendingActs.NewestAsync wraps them as
    PendingReworkAct(act, Text: TextOf) newest-wins with the others; AttemptCauseReader ranks it below the ReworkAct
    slot and a status move, above Retry, as channel overrule. THE OVERRULE RE-DERIVES: SpecRevisionCause.Overrule =
    "default overruled on the ticket", returned by For when not resuming and OverruleAct.Of(PreviousAttempt) is
    non-null, ranked after Rework and before StatusBack; SpecAmendmentRule.NeedsModel treats it as Rework (re-derive,
    approved or not; counted in IsAppend); SpecSourceResolver's Rework/StatusBack approval arm takes it too (in place,
    0 lines); SpecRecutNotice.Render gains an Overrule arm ("A default was overruled on the ticket after", "with the
    overrule in view"), so its existing cap branch tells the person a full set added nothing; PreviousCutPromptSection
    gets an Overrule paragraph and Source gains Overrule => "the overruled defaults section", both pointing at
    OverruledDefaultsPromptSection, which
    renders every overrule the previous attempt Precedes after the pull-request review in
    TicketConversationPromptSection. CLOSED TICKET: ClosedTicketActFollowUp files the follow-up for an Overrule act as
    for Ticket and PullRequest, its body the act's Text; class doc updated. VERDICTS IN GIT (main-thread decision 9):
    the record step copies every decided row into the ticket branch. SpecDoneRecorder calls DefaultVerdictRecord, which
    reads DecidedDefaults for the run's project, ticket and SpecSet.Approval?.Conversation and writes each row through
    a new port IDefaultVerdictFile (Contracts/Decisions; RepositoryVerdictFile in Infrastructure.Core over
    RepositoryDecisionFile, never IDecisionLogger) as one DecisionCategory.TradeOff entry "[default #<id>] <verdict> by <by> at <at>: <question>
    -> <chosen>; note: <note>" in .agentsmith/decisions/<specId>.yaml when SpecId names a spec of the set placed in the
    recorded spec's repository, else in .agentsmith/decisions/<row runId>.yaml when the recorded spec's repository is
    the set's first spec's; an entry whose "[default #<id>]" marker the file already holds is skipped in the same
    read-append-write (RepositoryDecisionFile.AppendAsync gains an optional unlessPresent marker). RepositoryVerdictFile
    holds its own RepositoryDecisionFile, whose lock is not the logger's (RepositoryDecisionFile.cs:37); nothing
    contends, because the record step runs after the spec's master and one ticket holds one lease. The written paths join the
    record's staged list, so the copy rides the existing series commit. Route baseline regenerated.
  out: >
    The Defaults tab, its counter and the channel word for overrule — 2026-10-13-8762q. The decide_by_default tool, event
    88, the RunDefaultDecisions table, its migration and projection — 2026-10-13-8762o. What a ticket with no act does
    when the nudge for a holdsSeries verdict arrives (continuing the series) — 2026-10-13-8762v; until then the worker
    finishes it. Editing a memory file's status after a ratified memory proposal — nobody: decision 16 leaves it a
    branch change the next rework makes. Undoing a verdict — nobody: a decided row is final; a person who changes their
    mind writes a keyword comment. An overrule answering a hand-back park — nobody: it waits like a keyword comment does.
    Overruling a design-turn default — nobody: the conversation is where it is answered, and the set it shaped is
    approved; before the first attempt the worker finishes the nudge (ReworkNudgeHandler.cs:36), so the act would be
    lost. A verdict given after the ticket's last attempt reaches the branch only with a later attempt's record; until
    then the row is its only home — nobody: no attempt runs to carry it and a server-side branch write has no owner
    (contract decision 21 names the same gap for mocks); flagged for the operator. Telling the master to stop logging a
    default with log_decision — 2026-10-13-8762o (its skill step). A live ticket-page refresh per default taken in a
    design turn — 2026-10-13-8762q's out-items.

decisions:
  - key: "THE STORED VERDICT IS THE ACT. Like Retry and the conversation approval, no act is written for an overrule: the row's VerdictBy/VerdictAt/VerdictNote are the act (the decision-file copy below is a record, never read as an act), read off PreviousAttempt by the worker and by the run. A tracker comment cannot be the act (ours are dropped) and a second act table would persist the overrule twice."
  - key: "A NEW CHANNEL, NOT A NEW ORIGIN. The nudge rides ReworkNudgeOrigin.Operator (a person's act; contract decision 20 forbids a new origin). ReworkChannel.Overrule and AttemptChannels.Overrule = \"overrule\" are appended so the Attempts tab does not call an overrule an approval in the conversation; AttemptSourceKinds.Default = \"default\" with the row id (series contract 2.6, amended)."
  - key: "CONDITIONAL UPDATE PER ITEM. Two replicas or two people ratifying one row: the Verdict = pending predicate lets exactly one win, so one overrule never files two acts; the loser's item reads alreadyDecided."
  - key: "VALIDATE ALL, THEN WRITE. A batch that names a foreign id or an unknown verdict writes nothing; a batch interrupted mid-write is safe to resend because a decided row is skipped."
  - key: "A DECIDED ROW IS FINAL. Re-deciding would file a second rework act for a choice already reworked; a change of mind goes through the ticket like any other request. Default, pending operator ratification."
  - key: "NOTE OPTIONAL, AT MOST 2000 CHARACTERS. The contract body has note?; an overrule without one still names the question, the chosen answer and the alternatives, which is enough for the rework to derive the change. Default, pending operator ratification."
  - key: "AN OVERRULE FILES A REWORK ACT CARRYING ITS NOTE, AND REVERTS NOTHING (contract decision 15). Default, pending operator ratification."
  - key: "MEMORY PROPOSALS ARE ROWS LIKE ANY DEFAULT (contract decision 16): ratifying marks the row only; overruling one is an act like any overrule. Default, pending operator ratification."
  - key: "A VERDICT ON A HOLDS-SERIES ROW NUDGES THE TICKET. A held series must be checked again once its default is decided; the nudge is the existing Operator one and costs nothing when there is no act (the worker finishes it). What the check then starts is 2026-10-13-8762v's."
  - key: "RUNS.READ TO READ, RUNS.CONTROL TO DECIDE. The read is ticket state like the series; deciding starts work, like Retry."
  - key: "AN OVERRULE IS ITS OWN REVISION CAUSE. Read off PreviousAttempt it is neither the ReworkAct slot nor a thread comment, so SpecRevisionCause.For fell through to Retrigger and SpecAmendmentRule kept every executed or approved set unchanged: an attempt that reworked nothing (SpecRevisionCause.cs:74-81, SpecAmendmentRule.cs:52-56). It re-derives like Rework, which needed its own cause for the same reason (SpecRevisionCause.cs:49-51)."
  - key: "DESIGN-TURN DEFAULTS ARE RATIFY-ONLY HERE. An overrule needs an attempt to serve it and a set it may re-cut; before the first attempt there is none (ReworkNudgeHandler.cs:36), after approval the set is not re-cut by such a cause, and the previous-attempt read cannot reach a bound conversation (IPreviousAttemptReader.cs:12-13). A ResolvedProject-aware overrule port across the readers is a redesign, not a cut. Default, pending operator ratification."
  - key: "VERDICTS SURVIVE IN GIT (main-thread decision 9). The row stays the live home the endpoints read and update; the record step of the next attempt copies each decided row into the spec's decisions file on the ticket branch, so deleting a run loses no verdict an attempt has since recorded. The copy is written once (its marker is checked in the same read-append-write) and goes through RepositoryDecisionFile, not IDecisionLogger, whose event mirror would add a third record on the recording run. Default, pending operator ratification."
  - key: "CONVERSATION CONTENT FOLLOWS THE TRANSCRIPT'S PERMISSION. A design-turn row's question and reasons are design-conversation content, which the ticket page shows only to dialog.write (TicketConversationReadEndpoints.cs:29-34); runs.read sees that a default exists and its verdict."
  - key: "ROOM: ReworkPendingActs 66 -> ~70, AttemptCauseReader 87 -> ~91, DbPreviousAttemptReader 74 after 2026-10-13-8762g -> ~79 (the decided-rows query lives in DecidedDefaults), PreviousAttempt 41 after 2026-10-13-8762g -> ~45, TicketConversationPromptSection 106 -> ~108, DashboardApiExtensions 89 -> 90, TicketConversationReadEndpoints 35 -> 35 (its return chains the new map after 2026-10-13-8762l's reviews map), SpecRevisionCause at most 113 after 2026-10-13-8762n -> ~116, SpecRecutNotice 50 -> ~52, ResumeRegistrations 36 -> 37, Infrastructure.Core ServiceCollectionExtensions 115 -> 116, SpecAmendmentRule 67 -> ~69, SpecSourceResolver net zero after 2026-10-13-8762h (the approval arm, :99 today, is extended in place), PreviousCutPromptSection about 84 after 2026-10-13-8762j -> ~89, ClosedTicketActFollowUp 101 -> ~101 (:41 extended in place, doc :21-22 reworded), SpecDoneRecorder 84 -> ~86, RepositoryDecisionFile 115 -> <=119. ApprovedSetKept (120) is not touched. None of these is baselined; each stays under 120. RelationalPersistenceExtensions IS baselined at 223/223 (file-length-baseline.tsv:36): DecidedDefaults joins the chained line :137, net zero lines. Contract section 4 lists both."
  - key: "A NULL DEFAULT FOR COMPOSITIONS WITHOUT A DATABASE. SpecDoneRecorder runs in every composition (SpecExecutionExtensions.cs:24), DecidedDefaults only in the Server, so NullDecidedDefaults (no rows) is TryAdd-registered beside NullPreviousAttemptReader (ResumeRegistrations.cs:31) and the Server's registration replaces it; the CLI and the composition harness record no verdicts."
  - key: "THE OVERRULE ANSWERS ON THE TICKET. Every re-deriving cause has a SpecRecutNotice arm; without one an overrule on a full executed set (the main case: a finished ticket) starts an attempt that adds nothing and tells nobody (SpecRecutNotice.cs:34-40, SpecAmendmentRule.cs:47). The arm reuses the cap branch's 'nothing was added' words, as a pull-request act gets FullSetPrNotice."
  - key: "ONLY AN ATTEMPT'S DEFAULT CAN BE OVERRULED. A non-code pipeline can run the coding master (PipelinePresets.Masters.cs:30-31) and take a default, but the act reads code runs only (DbPreviousAttemptReader.cs:25-26); accepting its overrule would file nothing and finish the nudge. Refused with 400 instead; ratifying it stays allowed. Default, pending operator ratification."
  - key: "NOT LANDED IS A FLAG ON THE READ (2026-10-13-8762o's out-item). The reader already holds each run's Run entity (TicketRunRow.cs:9), so landed is computed from its FinishedAt and PullRequestsJson with PullRequestStatuses.HasPullRequest, no new query and no stored column; 2026-10-13-8762q shows it."
  - key: "THE VERDICT COPY CLAIMS NO SHARED LOCK. RepositoryVerdictFile's RepositoryDecisionFile is its own instance, so its lock is not the logger's (RepositoryDecisionFile.cs:37, RepositoryDecisionLogger.cs:42). Making it one shared singleton would put an internal type on the public RepositoryDecisionLogger constructor and change three tests that build that logger; the record step runs after the master under the ticket's one lease, so no write contends and the claim is dropped instead."

steps:
  - id: contracts
    action: "Contracts: DecidedDefault record; IDecidedDefaults (Contracts/Services); IDefaultVerdictFile (Contracts/Decisions); PreviousAttempt.Overrules (init, empty default); ReworkChannel.Overrule (appended); AttemptChannels.Overrule; AttemptSourceKinds.Default."
  - id: previous-attempt
    action: "DecidedDefaults (Persistence, implements IDecidedDefaults, chained onto RelationalPersistenceExtensions.cs:137, net zero lines); NullDecidedDefaults (Application) TryAdd-registered beside NullPreviousAttemptReader in ResumeRegistrations: the decided rows of the ticket's code runs and an optional conversation, VerdictAt filtered in memory (no DateTimeOffset in SQL); DbPreviousAttemptReader fills Overrules from it."
  - id: act
    action: "OverruleAct.Of and TextOf (Application/Services/Rework); ReworkPendingActs.NewestAsync wraps it as PendingReworkAct with Text; AttemptCauseReader gains its arm."
  - id: cause
    action: "SpecRevisionCause.Overrule and its arm in For; SpecAmendmentRule NeedsModel and IsAppend; SpecSourceResolver's approval arm (in place); SpecRecutNotice's Overrule arm; PreviousCutPromptSection's Overrule paragraph and Source arm."
  - id: prompt
    action: "OverruledDefaultsPromptSection (delimited like the review section); TicketConversationPromptSection appends it after the review."
  - id: reader
    action: "Server/Models TicketDefaultsView, TicketDefaultView (with conversation); Server/Services/Tickets/Defaults/TicketDefaultsReader (order, attempt numbers, counts, conversation text only when MayReadTranscript, landed on finished memory-proposal rows)."
  - id: writer
    action: "DefaultVerdictWriter: validation (conversation rows and rows of runs that are not attempts ratify-only), conditional ExecuteUpdateAsync per item, then one rework nudge and one ticket nudge; DefaultVerdictRequest/Result models."
  - id: closed
    action: "ClosedTicketActFollowUp: an Overrule act is followed up like Ticket and PullRequest (:41 in place); class doc :21-22 reworded."
  - id: git-copy
    action: "RepositoryDecisionFile.AppendAsync's unlessPresent marker; RepositoryVerdictFile (Infrastructure.Core) registered as IDefaultVerdictFile; DefaultVerdictRecord (Application/Services/SpecExecution) called from SpecDoneRecorder, its paths joined to the staged list."
  - id: endpoints
    action: "TicketDefaultsEndpoints (GET runs.read, POST runs.control, Decoded segments, 400/404 as scoped), chained from MapTicketConversationReadEndpoints; AddTicketDefaults() in its own extension, one line in DashboardApiExtensions; route-permission-baseline.tsv regenerated."
  - id: tests
    action: "Red first for each test below, then green; run the Server, Rework, Specs, SpecExecution, Prompts, Infrastructure.Core and Persistence classes touched, SQLite provider."

