done:
  - "A design turn whose reply carries a kind: tickets block with 2 to 20 ticket texts keeps that proposal as a list of tickets with their keys, titles, requirements, done items, requires and repositories, and the stored proposal reads back unchanged after a reload."
  - "A list with one ticket or more than twenty, a repeated or malformed key, a ticket without a requirement or without a done item, a field over its bound, a requires naming no sibling, a repository outside the conversation's scope, or a cycle is refused, and the design partner is re-prompted with the ticket and the rule named."
  - "A list whose done item, title or requirement carries an unquoted colon is re-prompted asking to quote it, never fails the turn; a requires or done written as one value instead of a list is re-prompted asking for a list, never read as empty; a requires written as ticket:#41 names ticket 41."
  - "A reply whose list was cut off at the output limit is re-prompted with that cause named and the advice to propose fewer tickets, instead of being kept as an answer."
  - "The conversation records a list-of-tickets proposal as its own turn kind, and a bound ticket's page shows it under the kind tickets."
  - "Build green, full suite green, dashboard gen/test/build green."
