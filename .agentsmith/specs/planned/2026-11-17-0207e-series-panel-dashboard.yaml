# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-17-0207e
goal: "The Work it out page shows a running series' head line and a right-column panel with progress, cost, ETA, what runs now, the critical path and the policy."

applies_to: "dashboard (Work it out page, series API)"

requires: [2026-11-17-0207d]

facts:
  - claim: "The Work it out page is SpecDialogSurface with DialogPane tabs on the right; useSpecDialog refetches on every SpecDialogMessage push."
    evidence: "src/dashboard/src/components/dialog/SpecDialogSurface.tsx:489, src/dashboard/src/hooks/useSpecDialog.ts:478-539"

scope:
  in: "GET /api/spec-dialog/{dialogId}/series returning SeriesRunView (state, landed of total, elapsed, cost, ETA from the critical path and the mean landed duration once two tickets landed, now rows, critical path, policy line, open question); a 'series' pane tab, default while a series runs; the head line 'series running', '· 1 question for you', 'series done'; plain style."
  out: "An agent graph view."

steps:
  - id: api
    action: "SeriesRunViewReader (critical path = longest unlanded requires chain) and the endpoint behind the conversation's watch permission."
  - id: ui
    action: "specDialogApi fetch, useSeriesRun hook refetching on SpecDialogMessage, DialogSeriesPanel, head line in SpecDialogSurface."

tests:
  - "SeriesRunViewReader: landed count, critical path through requires, ETA absent before two landings."
  - "DialogSeriesPanel renders progress, now rows, critical path, policy; head line shows the question count."

done:
  - "An operator on the conversation sees the series' state at a glance, as in the mock."
