# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-12-3a36e
goal: "Every spec names the repositories it changes; its files and the manifest are mirrored from the database into each of them, and an edited mirror is taken back or, if two disagree, stops the run."

applies_to: "backend (spec placement, filing, PR links) + skills (derivation and dialog prompts)"

requires: [2026-10-12-3a36d]

facts:
  - claim: "observed: series 2026-10-12-eff5 (ticket 19470) lies in BackgroundWorker while eff5a changed only Server; Server's PR 9476 carries no spec; the cross-link was skipped on every run."
    evidence: "observed: 2026-10-12, AzDO items/commits on agent-smith/19470, RunSteps PrCrossLinkCommand"
  - claim: "The carrier is the pointer's, else the approval's, else scopedRepos[0] — called a guess in the class; the approval picks the first configured repo it names; Named falls back to the first too."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecCarryingRepoResolver.cs:6-62, src/backend/AgentSmith.Server/Services/SpecDialog/ApprovedPhaseSetRecorder.cs:81, src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:63"
  - claim: "Other positional pickers and single-carrier writers: reference sets fall back to the first sandbox; publish writes one repo and opens one draft PR; filing writes one branch; the cross-link skips single-PR runs."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MaterializeReferenceSetsHandler.cs:75-87, src/backend/AgentSmith.Application/Services/Specs/SpecSetPublisher.cs:30-43, src/backend/AgentSmith.Application/Services/Specs/FiledSpecBranch.cs:68, src/backend/AgentSmith.Application/Services/Handlers/PrCrossLinkHandler.cs:36"
  - claim: "One phase works across repos: steps carry repo-qualified targets and the master may add a repo mid-run."
    evidence: "src/backend/AgentSmith.Contracts/Models/PhaseDraft.cs:62-67, src/backend/AgentSmith.Application/Services/Tools/EnsureRepoSandboxToolHost.cs:14-24"
  - claim: "A phase has no repository field; the fallback and coverage paths build specs of their own."
    evidence: "src/backend/AgentSmith.Contracts/Models/PhaseDraft.cs:9-21, src/backend/AgentSmith.Application/Services/Specs/SpecFallback.cs:21-41, src/backend/AgentSmith.Application/Services/Handlers/DeriveSpecHandler.cs:102-125"
  - claim: "spec.schema.json is embedded as the product's validator and declared by this repository's own specs."
    evidence: "src/backend/AgentSmith.Application/AgentSmith.Application.csproj:61-63"
  - claim: "A reviewer's edit is detected today by sha comparison against one recorded revision."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecRevisionCause.cs:62-82"

assumptions:
  - claim: "The derivation and dialog prompts live in agent-smith-skills (skills/_masters/spec-derivation-master, design-partner-master)."
    check: "Open both SKILL.md files; the change ships as a skills release plus the embedded pin bump."

scope:
  in: "repos: per spec (required from new derivations, optional in the schema); mirrors of spec files, manifest and index line into every named repo; a per-repo hash in the store; edit take-back and conflict stop; positional pickers deleted; cross-link on every multi-PR run; prompts."
  out: "Series that predate repos: keep their one repo; the store (3a36d)."

decisions:
  - key: "MIRROR, NEVER SOURCE: files are written from the store each run, so a failed push or a one-sided merge heals on the next one."
  - key: "A SPEC MAY SPAN REPOS: an atomic contract change stays one phase over several sandboxes; it is mirrored into each."
  - key: "AN EDIT IS DETECTED BY HASH: per repo the store keeps the hash it wrote; one changed mirror is taken back into the store and re-mirrored; two that changed differently stop the run and name the files — the operator decides."
  - key: "THE FALLBACKS NAME THEIR REPOS: the one-phase whole-ticket spec names the run's scope; nothing picks by position."
  - key: "A REPO THE MASTER ADDS JOINS THE SPEC: ensure_repo_sandbox appends it to repos: and the record mirrors there."

steps:
  - id: repos-field
    action: "Add repos: to PhaseDraft and spec.schema.json (optional); require it in derivation and dialog parsers for new output; fallbacks set it; update both master prompts and bump the pin."
    modify:
      - "PhaseDraft, spec.schema.json, SpecDerivationParser, dialog parser, SpecFallback, EnsureRepoSandboxToolHost"
  - id: mirror
    action: "Write each spec's files and index line into its repos and the manifest into every repo of the series, from the store; record per-repo hashes; open a draft PR per repo."
    new:
      - "SeriesMirror"
    modify:
      - "SpecSetPublisher, SpecDoneRecorder, PhaseIndexWriter, FiledSpecBranch"
  - id: edits
    action: "Before resolving, compare each repo's mirror with its stored hash: take back one edit, stop on two differing; this replaces the ReviewerEdit sha check."
    modify:
      - "SpecSourceResolver, SpecRevisionCause"
  - id: no-position
    action: "Delete positional fallbacks in SpecCarryingRepoResolver (Resolve, ChooseCarrier, Named) and MaterializeReferenceSetsHandler; cross-link every run with more than one PR."
    modify:
      - "SpecCarryingRepoResolver, ApprovedPhaseSetRecorder, MaterializeReferenceSetsHandler, PrCrossLinkHandler"

tests:
  - "SpecDerivationParser_NewSpecWithoutRepos_IsReAsked"
  - "SeriesMirror_SpecForServerAndClient_WritesBothAndManifestInBoth"
  - "SeriesMirror_PushFailedInOne_HealsNextRun"
  - "Resolve_OneMirrorEdited_TakesItBack"
  - "Resolve_TwoMirrorsEditedDifferently_StopsNamingFiles"
  - "EnsureRepoSandbox_AddedRepo_JoinsSpecRepos"

done:
  - "19470's shape (scope BackgroundWorker+Server, spec names Server) leaves spec, manifest and index line in Server only (RealCompositionHarness)."
  - "No code path picks a repository by position."
