assumptions:
  - "Each tracker payload the comment mappers already read carries a stable comment id (GitHub IssueComment.Id, Azure DevOps Comment.Id, Jira comment id, GitLab note id); a comment with none records the act's url and time instead."

scope:
  in: >
    TRACKER READS: TicketComment gains an optional Id (init), filled by all four comment mappers (GitHub, GitLab,
    Jira, Azure DevOps) with the tracker's own comment id — the value a ticket-comment cause stores as source.id, so
    2026-10-13-9a59h's entry ids join on it. Ticket gains an
    optional WebUrl, a constructor parameter like Kind; ONE copy method Ticket.With(string? description = null,
    string? webUrl = null) replaces WithDescription (its caller TicketLabelNoteStripper and TicketKindTests move to
    it), so one place carries every field and later fields (2026-10-13-9a59k's IsClosed) are added there once.
    GitHubFieldMapper and GitLabFieldMapper pass it from the payload; JiraTicketProvider and
    AzureDevOpsTicketProvider fill it in GetTicketAsync as _mapper.Map(...).With(webUrl: <creator helper>)
    (JiraTicketCreator.BrowseUrl(key), extracted from its line 51; AzureDevOpsTicketCreator.WebUrlFor(id) over
    WorkItemWebUrl) — replacing the mapped line, not adding one. ACT SOURCE: ReworkAct gains Source (init):
    AttemptSource(Kind, Url, Id, Detail), Kind comment | review | command | status; ReworkActReader sets the
    comment's id; PrStandingAct.Act takes the PR url and kind and sets the note's HostId (2026-10-13-9a59b), and
    both its callers pass them (PrReviewFeedbackFetcher and ReworkPendingActs, which has the url at hand);
    StatusBackActReader sets the status moved into as Detail. CAUSE: AttemptCauseReader (own class) picks what
    this run served from the slots as they stand: the one ReworkAct slot (already the newer of the ticket keyword
    act and the pull-request act, ReworkActReader.ApplyPullRequest), except that a status-back act outranks a
    ticket keyword act in it; else the status-back slot; else requested (ContextKeys.RequestedByName, no actor); else retrigger when a previous
    attempt exists; else pickup, with the person who moved the ticket into its trigger status when the tracker
    has history (one read, self excluded, fail-soft). Channel vocabulary: ticket_comment, pull_request,
    status_move, requested, retrigger, pickup. source.id is TicketComment.Id for a keyword comment and the note's
    HostId for a review or command. Recorded at FetchTicket on TicketFetchedEvent (Cause,
    TicketFingerprint, WebUrl); the tracker State the event already carries is persisted too. APPLIER:
    RunEventApplier becomes a dispatcher handing each event, with its trail position, to projection families
    (run row, steps and calls, sandboxes, specs, attempt), each a class within 120 lines naming the events it
    applies, registered in AddRunProjections; the inline run-row arms move into the run-row family. ATTEMPT START
    NUDGE: the run-row family's RunStarted arm publishes 2026-10-13-9a59a's TicketActivityChanged(Project,
    TicketKey.For(Platform, TicketId)) through ITicketActivityNudge, fail-soft, when it inserts a new code-pipeline run
    carrying a ticket or promotes a reservation whose status == queued — never for a relaunch of a
    waiting_for_input row (RunStatuses.IsWaiting covers both, so the arm tests == Queued) or a replay. Later
    members add an arm to a family or register a family; none grows the dispatcher. REVISION: SpecSetAnnouncer
    (own class) builds and publishes SpecSetPublishedEvent (EventType.SpecSetPublished = 83) once per publish
    after placement, written or not (an event 83 that 2026-10-13-9a59e publishes from
    SpecHandbackHandler for a hand-back that never reached the publisher carries no revision): revision number and cause as written, series id, executed spec ids carried
    in, the set's approval (instant, conversation, principal) when it carries one, and whether the write
    committed; SpecSetPublisher calls it in both branches. STORE: RunAttempt (long Id key like every run child), one row per run (unique RunId),
    registered in RunChildConfiguration.Children with RunAttemptConfiguration (unique RunId) applied from
    RunChildConfiguration.Apply — AgentSmithDbContext untouched; written by RunAttemptProjection in the attempt
    family: fetch fields (cause channel, actor, at, source kind/url/id/detail, fingerprint, tracker state, web
    url) set once (a resume keeps the first), revision fields (number, cause, series id, carried ids, worked
    approval instant, conversation, principal) last-wins within the run, left untouched by an event 83 that carries
    no revision; an attempt that handed back before DeriveSpec published (scope refusal, missing spec) has no
    revision fields, and readers treat it as having worked no approval; an insert race between replicas
    resolves through the unique index; deleted in DeleteChildrenAsync; migrations in both sets. Run.Trigger is
    left as it is. PRIOR LEDGER: IPriorRunLedgerReader.ReadLatestForTicketAsync takes excludingRunId;
    PriorRunSeedSource passes the run id; the null reader follows. READ MODEL: 9a59a's TicketAttemptView gains
    cause{channel, actor, at, source{kind,url,id,detail}} and revision{number, cause, seriesId, carriedIds,
    approvalAt}; TicketSummaryView gains cause, trackerState and webUrl from the newest attempt that has a
    RunAttempt row (a queued reservation has none yet) — one set query per page. MIRROR: hub-events.ts for the extended TicketFetchedEvent and SpecSetPublishedEvent 83
    (pnpm gen:hub-events) and a FilterRail label for SpecSetPublished.
  out: >
    The operator channel (approving a proposal in the ticket conversation) and its use of the worked approval
    recorded here — 2026-10-13-9a59m. Retry unchanged and the retry channel with the principal as actor (a Retry
    move is ours, so this spec reads it as retrigger without a person) — 2026-10-13-9a59n. The cut's specs (goal,
    repos, steps, done criteria, hand-back case) on SpecSetPublishedEvent — 2026-10-13-9a59e. The pull request's
    review record and the PrReviewNote/PrReviewThread HostId — 2026-10-13-9a59b. Stuck, which compares these
    fingerprints between attempts, and the conversation order — 2026-10-13-9a59h. Whether an attempt answers a
    parked hand-back: on the compute read from this cause — 2026-10-13-9a59j; hand-back recognition from the
    conversation entry — 2026-10-13-9a59h (a RunSpec handed_back mark covers premise hand-backs only). The editor of a ticket edit and "changed the
    criteria": no tracker gives them (operator decision 3); the read shows the revision cause TicketEdit.
    Who requested a chat run by name: the envelope carries a flag only; none of the series records it.

decisions:
  - key: "RECORDED WHERE THE RUN READS ITS ACT. Since e8b9b any claimer may win the lease; a cause set at the door would say poller for a PR review. FetchTicket is the one place that knows."
  - key: "CAUSE ORDER = THE SLOTS AS THEY STAND (review3 F3). The one ReworkAct slot already holds the newer of the ticket keyword act and the pull-request act (ReworkActReader.cs:41-45), a choice by time made before this reader runs; then the status-back slot ranks above a ticket act, by kind. SpecRevisionCause reads the same slot (SpecRevisionCause.cs:74-75), so cause and revision agree on which act. They can still differ in KIND: a status move on a set with an unexecuted tail serves the move while the revision says re-trigger (StatusBackCause.cs:23), and a re-cut demand comment records ticket_comment or pull_request while the revision says RecutDemand (SpecRevisionCause.cs:73); both are recorded and the read shows both."
  - key: "NO PreviousAttemptRunId (review cut C4). Lineage is 9a59a's run-id order, computed per read; a stored pointer would copy that ordering and dangle once the earlier run is deleted (operator decision 2)."
  - key: "WEB ADDRESS FROM WHERE THE TRACKER STATES IT (review cut C1). GitHub and GitLab give it in the payload, so their mappers read it; Jira and Azure DevOps compose it from the connection, so their providers fill it through the helper their creators already use — one formula per tracker, not a second guess."
  - key: "RUN.TRIGGER STAYS, UNCHANGED. It answers ticket-or-manual at launch, before anything is read, and the queued row writes it; overloading it with the cause would make one column mean two moments."
  - key: "A ROW PER RUN, NOT COLUMNS ON RUN. A dozen fields would push Run.cs past its limit; a RunAttempt child keyed by run id dies with its run (operator decision 2). It goes through RunChildConfiguration (review cut C6): AgentSmithDbContext is at 120 lines and is never edited."
  - key: "SET-ONCE CAUSE, LAST-WINS REVISION. A resume keeps the run id and must not rewrite why the attempt began; the revision is written once per publish and a replay writes the same values."
  - key: "THE WORKED APPROVAL IS RECORDED. Only the run knows whether an approval landing mid-attempt was picked up, so it records the approval instant it published; 9a59m starts a further attempt only for an approval newer than that, and 9a59h's 'now' group starts there."
  - key: "THE APPLIER IS SPLIT HERE, ONCE. It is at its ratchet and e, f, g, i and j add routes; the first member to touch it makes room, so the others add an arm in the family that owns their table."
  - key: "AN ANNOUNCER, NOT A FATTER PUBLISHER (review cut C7). SpecSetPublisher is 101 lines; building the event and publishing it is SpecSetAnnouncer's, into which 2026-10-13-9a59e adds one call to its SpecCutContent builder (the cut, and the one writer of the hand-back case) and a hand-back-only publish that SpecHandbackHandler calls for a hand-back that never reached the publisher (scope refusal, missing spec); the publisher grows by one call per branch."
  - key: "ONE PUBLISH EVENT FOR THE SERIES. The revision this attempt worked from and the cut's content are one moment; 9a59e extends event 83 rather than adding a second writer, and stores only what RunAttempt does not."
  - key: "NO answersHandback (review3 F1). A RunSpec handed_back row is written only by the premise check, which fails the run (CheckSpecPremisesHandler.cs:107-117); every parked hand-back goes through SpecHandbackHandler without one, so a flag read from it would be false for every park. Whether an attempt answers a hand-back is 2026-10-13-9a59j's compute read of this cause, and hand-back recognition is 2026-10-13-9a59h's from 9a59g's entry."
  - key: "ONE COPY METHOD ON TICKET (review3 F2). Ticket is a sealed class, so neither `with` nor an init setter outside `new` reaches a mapped ticket; a second hand copy beside WithDescription would be a second place to forget a field (Ticket.cs:68-69). Ticket.With(description, webUrl) replaces it."
  - key: "WHAT IS NOT RECORDED IS NOT SHOWN (review cut C5, operator decisions 3 and 4). 'ticket edited' from the revision cause TicketEdit; the editor and what changed are not rendered. 'requested' carries no actor."
  - key: "SOURCE AS DATA, NOT A LINK. The source keeps kind, url, id and detail so the conversation and attempts views can link or quote; where a host gives no id the url and the host time (already the act's identity since e8b9b) stand in."
  - key: "PICKUP READS HISTORY ONCE MORE, FAIL-SOFT (review finding 8). StatusBackActReader reads only with a previous attempt; a first attempt reads the mover once, and a label- or webhook-triggered pickup without trigger statuses records no actor."
  - key: "A NEW ATTEMPT ANNOUNCES ITSELF (series coordination, 2026-10-13). The ticket page refreshes on TicketActivityChanged plus its own runs' events; a new attempt has a run id the page has not seen, so its start is the one moment the ticket must be named. The single-writer projector publishes it from the RunStarted arm with Run.Platform, the spelling of a's ticketKey; a relaunch is not a new attempt and a replay inserts nothing. A capacity reservation is announced when it is promoted, not when it is written."
  - key: "THE SELF-READ IS FIXED, NOT RECORDED. A resumed run restores its ledger from the checkpoint, so leaving the current run out of the prior-run read loses nothing."

steps:
  - id: tracker-reads
    action: "TicketComment.Id filled by all four comment mappers (the value cause.source.id stores); Ticket.WebUrl as a constructor parameter, Ticket.With(description, webUrl) replacing WithDescription (TicketLabelNoteStripper.cs:47, TicketKindTests.cs:71 move); GitHub/GitLab mappers pass it, Jira/Azure DevOps providers append .With(webUrl: helper) to the mapped line (Jira room 9, Azure DevOps 4: zero net lines)."
  - id: act-source
