  - claim: "ReworkAct carries author, time and channel (Ticket, PullRequest, Status) only — no source reference — and lives in the pipeline context, never persisted."
    evidence: "src/backend/AgentSmith.Contracts/Runs/ReworkAct.cs:10, src/backend/AgentSmith.Contracts/Runs/ReworkChannel.cs:5-11"
