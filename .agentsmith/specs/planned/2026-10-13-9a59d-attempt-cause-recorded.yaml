# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-10-13-9a59d
goal: "Every attempt records in the run the act it served with its source, the ticket text it saw and the series revision and approval it worked from; the ticket read model shows it."

applies_to: "backend (FetchTicket, tracker mappers and providers, act readers, spec publish, run-event applier, persistence, ticket read model) + the dashboard's hub-events mirror"

requires: [2026-10-13-9a59a, 2026-10-13-9a59b, 2026-10-08-e8b9b, 2026-10-08-e8b9c, 2026-10-08-2123, 2026-10-08-7c0e, 2026-10-08-f114, 2026-09-08-5cd2, 2026-09-09-b26f]

facts:
