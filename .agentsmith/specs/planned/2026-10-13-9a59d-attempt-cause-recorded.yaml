done:
  - "An attempt started by a Request changes shows on its ticket as a pull-request review, naming the reviewer, the PR and the review, whichever replica claimed it."
  - "An attempt started by a keyword comment names that comment; a status move names who moved it and where."
  - "A ticket-edit revision says the ticket was edited, naming no editor."
  - "Each attempt names the revision and approval it worked from with its cause, and the executed specs it carried in."
  - "A ticket's detail links to the ticket in its tracker on GitHub, GitLab, Jira and Azure DevOps."
  - "A resumed attempt keeps the cause it began with."
  - "A new attempt's start sends TicketActivityChanged for its ticket on every replica; a relaunch after a park sends none."
  - "A run's attempt record is gone when the run is deleted, on all four providers."
  - "RunEventApplier is under the 120-line limit and leaves the file-length baseline; AgentSmithDbContext is unchanged."
  - "A step-less spec never seeds its ledger from its own run."
