# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-25-0873
goal: "Tracker writes, PoC repo commits, preflight repo probes and PR sweeps act under the project's machine identity, as repository acts do since 2026-11-25-9992h."

applies_to: "default (TrackerConnection, CredentialResolver, TrackerIdentity, GitHubStatusHistory, ProjectRepoMachine, PoC handlers, preflight checks, sweeps, ProjectMachineFindings)"

requires: [2026-11-25-9992h, 2026-11-25-d0e2]

facts:
  - claim: "Every tracker client takes its token from credentials.For(tracker), the tracker's own auth secret; a tracker is a shared catalog entry the project resolves by name."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/TrackerConnections.cs:21-49; src/backend/AgentSmith.Contracts/Services/CredentialResolver.cs:49; src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ResolvedProjectBuilder.cs:29"
  - claim: "Claims, comments and status moves use the project's tracker; only the zero-match comment uses a catalog tracker, because no project matched."
    evidence: "src/backend/AgentSmith.Application/Services/Claim/TicketClaimService.cs:53; src/backend/AgentSmith.Application/Services/Lifecycle/TicketAwarePipelineLifecycleCoordinator.cs:31; src/backend/AgentSmith.Server/Services/Webhooks/WebhookSpawnDispatcher.cs:72-75"
  - claim: "GitHub tracker self is GET /user, which an App installation token cannot call; TrackerIdentity caches self per tracker name."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubStatusHistory.cs:14-18; src/backend/AgentSmith.Application/Services/Rework/TrackerIdentity.cs:15-27; observed: 2026-11-25, https://docs.github.com/en/rest/authentication/endpoints-available-for-github-app-installation-access-tokens"
  - claim: "A PoC target's source repo is read from the repos catalog or a connection, and the GitOps commit and build take the poc- project's first repo; neither carries a machine unless the poc- project names one."
    evidence: "src/backend/AgentSmith.Application/Services/Pocs/Pipeline/PocSourceRepos.cs:10-21; src/backend/AgentSmith.Application/Services/Handlers/GitOpsCommitHandler.cs:36; src/backend/AgentSmith.Application/Services/Handlers/PocPipelineBuildHandler.cs:44"
  - claim: "RepoAccessCheck lists catalog repos before project repos and dedups by url and auth, so it probes the unstamped copy; VerificationOnboardingCheck reads catalog repos; the PR sweep and the change sweep take the first project repo per url."
    evidence: "src/backend/AgentSmith.Application/Services/Preflight/Checks/RepoAccessCheck.cs:61-69; src/backend/AgentSmith.Application/Services/Preflight/Checks/VerificationOnboardingCheck.cs:48; src/backend/AgentSmith.Server/Services/Sweep/PrSweep.cs:63; src/backend/AgentSmith.Server/Services/Sweep/ChangeSweepSources.cs:43"

scope:
  in: |
    TrackerConnection.Machine, stamped as the project resolves from its block's entry for the tracker's hoster (GitHub,
    GitLab, Azure Boards); CredentialResolver.For(tracker) answers the machine's token (App installation token against the
    tracker's host, Entra token through d0e2) and MachineLogin(tracker) the App's {slug}[bot], which GitHubStatusHistory
    answers as self instead of GET /user. TrackerIdentity keys its cache by tracker and machine. A project whose tracker
    hoster has no machine entry gets the advisory finding naming the tracker. ProjectRepoMachine: a repo outside a project
    takes the machine of the first configured project that lists the same url with one — used by PocSourceRepos, the GitOps
    commit and build, RepoAccessCheck (project repos probed, a catalog repo only when no project lists its url),
    VerificationOnboardingCheck, the PR sweep and the change sweep (a stamped repo wins a url group). Docs.
  out: "Jira trackers (their identity is the tracker's own account). The zero-match comment (no project; keeps the tracker's auth, said in the docs). Discovery reads under a connection."

done:
  - "A project with a machine block stamps its tracker for the tracker's hoster; a tracker comment and a status move use the machine's token, an App's minted against the tracker host; pinned with fakes."
  - "A GitHub App tracker's self is {slug}[bot] without GET /user; TrackerIdentity keeps one self per tracker and machine."
  - "A PoC install commit, GitOps commit and build use the machine of a project listing the source repo's url; pinned."
  - "RepoAccessCheck and VerificationOnboardingCheck probe the stamped repo; the PR and change sweeps read a url group through its stamped repo."
  - "A tracker on a hoster the project's block does not name carries the advisory finding naming the tracker."
