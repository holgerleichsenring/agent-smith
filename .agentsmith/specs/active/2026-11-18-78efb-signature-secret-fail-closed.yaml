# yaml-language-server: $schema=../../spec.schema.json
spec: 2026-11-18-78efb
goal: "A webhook or Slack signing secret whose stored value exists but cannot be opened refuses every delivery, naming the secret and why; one with no value at all still leaves verification off."

applies_to: "default (IStoredSecretValues, ConfigSecretResolver, ISecretValues, EnvironmentFirst, ICredentialResolver, WebhookSecretResolver, WebhookSignatureVerifier, SlackAdapterOptions, SlackSignatureVerifier)"

requires: [2026-11-18-9ae8]

facts:
  - claim: "StoredSecretValues.Load leaves a row it cannot open out of the result and records a finding naming the secret, its key id and the reason; ConfigSecretResolver then resolves the secret empty, the same as no value."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/Secrets/StoredSecretValues.cs, src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/ConfigSecretResolver.cs"
  - claim: "WebhookSignatureVerifier accepts every delivery of a platform with no secret configured (p0506 fail-open), and SlackSignatureVerifier skips verification when the signing secret is empty."
    evidence: "src/backend/AgentSmith.Server/Services/Webhooks/WebhookSignatureVerifier.cs, src/backend/AgentSmith.Server/Services/Adapters/SlackSignatureVerifier.cs"
  - claim: "GitHub, GitLab and Azure DevOps webhook secrets and SLACK_SIGNING_SECRET resolve by EnvironmentFirst over the catalog (2026-11-18-9ae8), which accepted the fail-open on an unreadable row."
    evidence: "src/backend/AgentSmith.Contracts/Services/EnvironmentFirst.cs, src/backend/AgentSmith.Infrastructure.Core/Services/Webhooks/WebhookSecretResolver.cs, src/backend/AgentSmith.Server/Models/SlackAdapterOptions.cs, .agentsmith/decisions/2026-11-18-9ae8.yaml"
  - claim: "Teams verifies inbound activities with the Bot Framework JWT against TEAMS_APP_ID; TEAMS_APP_PASSWORD is only sent out for a bot token."
    evidence: "src/backend/AgentSmith.Server/Services/Adapters/TeamsJwtValidator.cs, src/backend/AgentSmith.Server/Services/Adapters/BotFrameworkTokenProvider.cs"
  - claim: "Operator decision 2026-11-18: a stored value that exists but cannot be opened fails closed for webhook and Slack verification; no value configured at all keeps verification off."
    evidence: "observed: 2026-11-18, operator ratified the recommendation in the session that followed PR #865"

scope:
  in: "IStoredSecretValues.Load returns StoredSecretLoad (values, and the unreadable names with a value-free reason). ConfigSecretResolver records a secret whose environment is empty and whose stored row is unreadable in AgentSmithConfig.UnreadableSecrets (name -> reason). ISecretValues.Unreadable(name) answers it (LoadedSecretValues, CurrentSecretValues). CredentialLookup (Value / None / Unreadable with the secret's name and reason, ToString never prints a value); EnvironmentFirst.Lookup and ICredentialResolver.Lookup return it, Resolve and Named stay its value. WebhookSecretSource carries Unreadable; WebhookSignatureVerifier refuses every delivery of that platform and logs an error naming the platform's variable, the secret and the reason. SlackAdapterOptions.SigningSecretLookup; SlackSignatureVerifier refuses on Unreadable with the same kind of log; None still skips. The connections panel says the secret is unreadable. The unreadable-row finding says webhook and Slack verification refuse deliveries while it stands."
  out: "Teams: its inbound check is the Bot Framework JWT and reads no secret, so nothing falls open there. Jira: its secrets are per tracker, not the three platform variables the decision names; an unreadable one still drops out as before. Agent API keys and outbound tokens: an unreadable value is already a missing credential where they are used."

steps:
  - id: load
    action: "StoredSecretLoad record; StoredSecretValues returns it; ConfigSecretResolver fills RawAgentSmithConfig.UnreadableSecrets; ResolvedConfigComposer copies it to AgentSmithConfig."
  - id: lookup
    action: "CredentialLookup + CredentialLookupState; ISecretValues.Unreadable; EnvironmentFirst.Lookup; ICredentialResolver.Lookup; test fakes implement Unreadable."
  - id: webhooks
    action: "WebhookSecretSource.Unreadable; WebhookSecretResolver sets it; WebhookSignatureVerifier refuses and logs; ConnectionDiagnosticsService shows it."
  - id: slack
    action: "SlackAdapterOptions takes the lookup; SigningSecretLookup; SlackSignatureVerifier(CredentialLookup, ILogger) at the four endpoints."

tests:
  - "EnvironmentFirst.Lookup: environment value; catalog value; unreadable names the secret and reason; neither is None."
  - "ConfigSecretResolver: an unreadable stored row with no environment value lands in UnreadableSecrets; one with an environment value does not."
  - "WebhookSecretResolver + WebhookSignatureVerifier: unreadable refuses a correctly signed delivery; none accepts an unsigned one; the log names the secret and never the value."
  - "SlackSignatureVerifier: unreadable refuses; none passes."
  - "Booted server: a stored GITHUB_WEBHOOK_SECRET sealed under a key the server no longer has refuses a GitHub delivery with 401; with no row an unsigned delivery is accepted."

done:
  - "With a webhook or Slack signing secret whose stored value cannot be opened, every delivery is refused and the log names the secret and the reason; with no value configured, deliveries pass as before."
