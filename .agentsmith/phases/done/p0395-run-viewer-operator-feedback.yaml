# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0395
goal: "Four operator findings from watching the first p0393a live run: done-criteria render without their raw 'done:' prefix, the pipeline drawer is resizable (size + splitter), phase documents render real content with an honest source, and spliced step labels show the step — not the phase id."

applies_to: "dashboard (+ server read path if the document source turns out server-side)"

requires:
  - p0393a  # spec set / phase documents surface
  - p0394   # spec-commit identity fix — the likely producer-side cause of empty documents

decisions:
  - key: |
      OPERATOR FEEDBACK (2026-08-03, live run screenshots): (1) every done-criterion in
      'The work spec' renders as 'done: <text>' — the raw YAML key leaked into the UI as
      a per-line prefix; (2) the full-pipeline drawer has a fixed size and fixed split —
      long command lines force unreadable measure, the drawer and the list/detail
      splitter must be user-resizable; (3) the phase documents render empty — first
      diagnose the SOURCE (viewer reads the set back from the ticket branch, where the
      identity-broken commit never landed; p0394 fixes the producer — the viewer must
      still render the server-held copy and say where the content came from instead of
      showing silent emptiness); (4) spliced steps repeat 'p<ticket><letter>: ' in every
      label, truncating the actual step name in the sidebar ('p19106a:… $0.2967') — the
      phase id helps nobody there; group by phase once, label steps by their own name.
  - key: |
      Boundary vs p0394: this phase does not touch SpecSetWriter/SandboxGitOperations.
      If diagnosis confirms the documents exist server-side (spec set in the run record /
      DB) the viewer renders that copy with the branch as fallback; a truly absent
      document gets an explicit empty-state naming what was looked up where — never a
      silently blank pane.

steps:
  - id: done-criteria-render
    action: "Render phase done-criteria as a titled list (e.g. 'Definition of done') without the raw 'done:' key prefix per line."
  - id: drawer-resizable
    action: "Full-pipeline drawer: user-resizable overall width and a draggable list/detail splitter, both persisted (localStorage); cap text measure in the detail pane so long command lines wrap instead of forcing the layout wide."
  - id: phase-documents-content
    action: "Diagnose the empty phase documents' data source; render the server-held spec-set copy (branch read as fallback), and show an explicit empty-state naming the looked-up source when a document is genuinely absent."
  - id: step-labels
    action: "Spliced phase steps: strip the 'p<id>: ' prefix from sidebar and detail-pane titles; convey the phase via grouping (one phase header / badge), keeping full step names readable."

tests:
  - "DoneCriteria_RenderWithoutRawKeyPrefix"
  - "PipelineDrawer_SplitterAndWidth_PersistAcrossReopen"
  - "PhaseDocument_ServerCopyRendered_WhenBranchCopyMissing"
  - "PhaseDocument_Absent_ExplicitEmptyStateNamesSource"
  - "SplicedStepLabel_ShowsStepName_NotPhaseIdPrefix"

done:
  - "No 'done:' prefixes in the work-spec rendering; criteria appear as a titled list."
  - "Drawer width and splitter position are draggable and survive close/reopen."
  - "A run whose spec commit failed still shows the phase documents' content (server copy) or an explicit sourced empty-state — never a blank pane."
  - "Sidebar step rows show readable step names; the phase id appears once as grouping, not per row."
