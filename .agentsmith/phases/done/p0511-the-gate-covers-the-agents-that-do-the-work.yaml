# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0511
goal: "Establish whether a commit made by a subagent passes through the phase gate, and make the answer visible either way."

applies_to: "repo tooling (.claude/hooks, .claude/settings.json) + docs (how the gate is relied upon)"

requires:
  - p0508

scope:
  in: "Determining whether PreToolUse hooks run for a subagent's Bash calls and for commits inside a git worktree; making a gated commit leave evidence that it was gated; and stating in one place what the gate does and does not cover."
  out: "Changing the four checks themselves. Making subagents run the checks a different way — that follows from the answer, and is only specifiable once the answer exists."

decisions:
  - key: |
      TWO INDEPENDENT OBSERVATIONS, NEITHER CONCLUSIVE, WHICH IS THE PROBLEM. Four phases were
      implemented by subagents in their own worktrees on 2026-08-23. Two of them reported that
      their phase commit returned in seconds, where the four checks take minutes; the operator's
      own commit of p0487 did the same. Against that: the gate demonstrably fires for this
      session's own Bash calls — a throwaway repository with a deliberately failing
      validate-skills.sh had its phase commit blocked, and the `--amend --no-edit` bypass was
      reproduced in the same repository. So the hook works, and something about a subagent or a
      worktree changes the outcome. Nobody has measured which.
  - key: |
      THE GATE IS THE THING THE OTHER PHASES LEAN ON, WHICH IS WHY THE UNCERTAINTY IS NOT
      TOLERABLE. Every phase spec in this repository ends with "build green, full suite green",
      and the gate is what makes that a measurement rather than an assertion. If it does not run
      for the agents doing the work, then the only evidence is that each agent chose to run the
      suite and report honestly — which held this time, and is not a mechanism.
  - key: |
      MEASURE BEFORE CHANGING ANYTHING. The candidate explanations are different repairs: hooks
      may not be delivered to subagent tool calls at all; CLAUDE_PROJECT_DIR may resolve
      elsewhere for a worktree so the script path does not exist; the resolver may fail closed to
      pass-through; or the gate may have run and its silence on success made it look absent. The
      first step distinguishes them and the rest of the phase depends on which one it is
      [[feedback_challenge_premises]].
  - key: |
      A SUCCESSFUL GATE MUST STOP BEING SILENT. Whatever the cause, the reason this took a day to
      notice is that a gate which ran and passed and a gate which never ran are byte-identical
      from outside: both exit 0, both print nothing. A commit that was gated should say so where
      someone will see it afterwards, not only on a stderr stream that is discarded on success.
      That change is worth making even if the answer to the first question is "it ran all along".

steps:
  - id: find-out-whether-the-hook-runs-at-all
    action: "Instrument the hook to append one line per invocation to a file outside the repository, then commit from a subagent in a worktree and from this session, and compare."
  - id: name-the-mechanism
    action: "From the evidence, identify which of the candidate explanations holds, and record it with the observation that settles it."
  - id: a-gated-commit-leaves-a-trace
    action: "Record that the checks ran and what they found where it survives the commit, so a gated and an ungated commit are distinguishable afterwards."
  - id: write-down-what-the-gate-covers
    action: "State in one place which invocations are gated and which are not, so no phase's definition of done rests on a coverage that does not exist."

tests:
  - "Gate_InvocationFromThisSession_LeavesATrace"
  - "Gate_InvocationFromAWorktree_LeavesATraceOrIsRecordedAsNotRunning"
  - "Gate_PassingRun_IsDistinguishableFromNoRun"

done:
  - "whether a subagent's commit is gated is answered by observation, not by inference"
  - "the mechanism is named, with the measurement that settles it"
  - "a commit that passed the gate is distinguishable afterwards from one that never met it"
  - "the coverage the gate actually provides is written down where a phase author will read it"
