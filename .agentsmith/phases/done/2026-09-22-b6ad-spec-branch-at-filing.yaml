assumptions:
  - claim: "The credential each provider already holds is scoped for a CONTENTS WRITE, not only for reads and pull requests."
    check: "Establish which grant each platform requires to create a ref and a commit, and compare it against what the configured provider credential is documented to need today. The sandbox push uses a different credential entirely, so nothing about it settles this."
  - claim: "Each platform can make ONE commit carrying every file, rather than one commit per file."
    check: "Name the API call per provider and confirm it takes a set of file changes and a ref update together."
  - claim: "Reading the ticket back immediately after creating it returns the text the tracker stored."
    check: "Read what each provider's create returns and whether a separate read is needed to see the stored form."
  - claim: "Each of the three platform clients the providers already hold can create a ref and commit file contents without a clone."
    check: "Open the client surface each provider is already built on — the Octokit git-database and contents clients, the GitLab commits endpoint, the DevOps git client's push call — and write one commit to a scratch repository from a provider integration test before the contract method is declared. What the code proves today is only that each provider holds an authenticated client and reads through it."
  - claim: "The local provider can satisfy the same method by writing into its base path."
    check: "Read the whole of LocalSourceProvider: nothing above its listing member invokes git, so whether a local write is a bare file write on the bind-mounted tree or needs a git invocation of its own is decided when that file is opened, not here."
  - claim: "At first filing the ticket branch cannot already exist, because the ticket id the branch name is composed from is minted by the tracker in the create call."
    check: "Both paths are implemented either way — the write creates the branch when it is absent and commits on its head when it is present — so this only decides which path the common case takes."
  - claim: "Writing the index and the phase yamls is enough for the run's reader, with no accounting file present."
    check: "Run the reader over a directory holding only the index and the phase yamls; the reader opens the index, then one yaml per listed stem, and treats a missing markdown as empty. A stale-file sweep at the run's first publish must not then remove what filing wrote — confirm against SpecSetStaleFiles before relying on it."
  - claim: "A repository the sibling phase has not yet given filing is safely defaulted to the first the approval named."
    check: "Compare against the run's own resolver, which takes the first scoped repository when the pointer names none — after this phase the pointer names one, so the two must agree by construction rather than by coincidence."
