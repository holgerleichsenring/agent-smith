# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0515

goal: "One configured name is one entity however it is capitalised — at every lookup, in the editor and in the store — and a launch that cannot resolve a name fails visibly instead of leaving a run row nobody finishes."

applies_to: "backend (config catalog resolution, the raw materializer, the studio's referential validator, and the launch paths that turn a name into a database key)"

scope:
  in: "One shared definition of what makes two configured names the same, applied to the five catalogs the runtime resolves; the raw reads that happen BEFORE resolution; a pair of names differing only in case named as a blocking finding rather than dropped in silence; and canonicalisation at the boundary where an operator's spelling becomes a persisted key."
  out: "A tracker's lifecycle_status_names and extra_fields, which are provider-owned names and stay ordinal. Any schema change — the store-side refusal is p0515b. Repairing run rows already written under a different spelling, which needs no repair only because canonicalisation lands with this phase."

decisions:
  - key: |
      THE COMPARER IS NAMED, AND IT IS ORDINAL. CurrentCultureIgnoreCase makes "ID" and "id"
      different under a Turkish culture, which a container's LANG can set — a project that
      resolves on the laptop and not in the cluster. InvariantCultureIgnoreCase is Turkish-safe
      but linguistic: an ignorable code point makes two visibly different names equal, which is
      wrong for an identity. StringComparer.OrdinalIgnoreCase is culture-invariant and
      non-linguistic, is the codebase's only idiom already, and is what the half-fix in
      RepoGlobExpander reached for on its own.
  - key: |
      ONE DEFINITION, NOT TWO, BECAUSE THE SUCCESSOR ENFORCES IT IN A DIFFERENT PLACE.
      OrdinalIgnoreCase is defined by invariant UPPERcasing; normalising with lowercase is a
      DIFFERENT equivalence, and the two disagree on real code points. If this phase compares one
      way and p0515b stores the other, the store admits a pair the loader blocks. So this phase
      ships one small public thing — a name comparer and a matching normaliser, together — and
      p0515b uses the normaliser rather than choosing its own.
  - key: |
      A RAW READ BEFORE RESOLUTION IS THE HOLE, AND IT IS THE DANGEROUS ONE. The materializer
      looks a project's tracker up in the RAW dictionary, keyed, before the catalogs are built,
      and a miss returns silently. Making resolution case-insensitive without fixing that turns a
      loud refusal into a project that materialises with NO tracker workflow: with the shorthand
      it never triggers at all and carries no finding, and with an explicit trigger block it holds
      an empty status list — which the poller reads as "every status matches", so the project
      claims every ticket the tracker returns, in any state, with nothing to terminalise them.
      A phase that removes a loud failure must not leave a silent one behind it.
  - key: |
      A NAME BECOMES A DATABASE KEY, AND THE DATABASE DOES NOT IGNORE CASE. Today ordinal
      resolution forces the operator's spelling and the configured one to be identical, so run
      rows, leases and queue entries are consistent by accident. The moment they may differ, the
      double-start guard, the lease attach and the lease release compare spellings in SQL — case
      sensitive on SQLite and Postgres, insensitive elsewhere. Two capitalisations of one project
      would admit two concurrent runs with two capacity reservations, and a release that misses
      leaves the ticket leased. Canonicalising to the configured name at the moment resolution
      succeeds is what keeps every persisted name consistent, and it must ship in this phase.
  - key: |
      A COLLISION DROPS BOTH HALVES AND SAYS SO, TWICE IF THERE ARE TWO. Two spellings of one name
      cannot be resolved to either, so both leave the catalog and a blocking finding names them.
      That finding's identity must carry the catalog AND the colliding name: identity today is
      subsystem, project, trigger and field, so two collisions in one catalog would collapse into
      one finding, the operator would fix one and boot would still refuse with nothing new to
      read. The agents catalog needs the same rule built key by key — a dictionary copy under a
      case-insensitive comparer THROWS on a collision, and an unhandled boot crash is exactly the
      outcome the drop-one-project-keep-the-rest design exists to prevent.
  - key: |
      THE EDITOR MUST LEARN THE SAME RULE, OR THE SPLIT THIS PHASE CLOSES REOPENS. Give the
      referential validator the comparer alone and it accepts a reference matching either half of
      a colliding pair while the loader drops both: green in the studio, refused at boot. The
      validator therefore gets the collision rule too, not just the comparison.
  - key: |
      NOTHING HANGS, AND THE WORD MATTERS. Resolution throws before the run-started event; the
      consumer catches it, logs and releases. No thread, task or lease is stuck. What persists is
      the ROW: a queued row was already written, no terminal event follows, so the reconciler
      never repairs it, the project stays 409-blocked and its reservation stays held. Calling that
      a hang sends an implementer hunting a deadlock that does not exist.

steps:
  - id: one-definition-of-when-two-names-are-the-same
    action: "Publish a single shared name comparer and its matching normaliser, so this phase's comparison and the store-side refusal that follows it cannot define equality differently."
  - id: every-catalog-resolves-by-that-definition
    action: "Resolve the five runtime catalogs by the shared comparer and remove the contradicting lowercasing, keeping provider-owned names ordinal."
  - id: the-reads-that-happen-before-resolution-obey-it-too
    action: "Make the pre-resolution raw reads resolve a reference the same way the catalogs will, so a case-mismatched tracker reference merges its workflow instead of silently leaving a project with none."
  - id: a-pair-of-keys-is-named-and-neither-half-runs
    action: "Drop both halves of a colliding pair and record a blocking finding that names the catalog and the name, so two collisions in one catalog are two findings, and build the agents catalog key by key so a collision cannot crash the boot."
  - id: the-editor-refuses-what-the-loader-would-refuse
    action: "Give the referential validator the same comparison and the same collision rule, so a configuration that saves is a configuration that boots."
  - id: a-resolved-name-is-the-configured-name
    action: "Canonicalise to the configured spelling the moment resolution succeeds, before the name reaches a run row, a lease or a queue entry, so two capitalisations cannot become two runs."
  - id: an-unresolvable-launch-leaves-nothing-behind
    action: "Fail an unresolvable launch visibly and leave no unfinished row holding a reservation."

tests:
  - "LoadConfig_AProjectRequestedInADifferentCaseThanConfigured_ResolvesTheProject"
  - "LoadConfig_UnderATurkishCulture_ACapitalIStillResolves"
  - "LoadConfig_ATrackerRefDifferingOnlyInCase_StillMergesTheTrackerWorkflow"
  - "LoadConfig_ATrackerRefThatResolvesToNothing_RecordsABlockingFinding"
  - "LoadConfig_ACollisionInOneCatalog_DropsBothHalvesAndNamesThem"
  - "LoadConfig_TwoCollisionsInOneCatalog_ProducesTwoFindings"
  - "LoadConfig_ACollisionInTwoCatalogs_ProducesTwoFindings"
  - "LoadConfig_AnAgentCollision_IsAFindingAndNotAnUnhandledThrow"
  - "Validator_AReferenceMatchingOneHalfOfACollidingPair_IsRefused"
  - "Comparer_AndTheNormaliser_AgreeOnEveryPairTheyJudge"
  - "InitLauncher_TwoLaunchesDifferingOnlyInCase_TheSecondIsRefused"
  - "Lease_AttachedAndReleasedUnderDifferentSpellings_IsStillReleased"
  - "RunRow_WrittenAfterACaseInsensitiveResolve_CarriesTheConfiguredSpelling"
  - "Launch_AnUnresolvableProject_LeavesNoUnfinishedRunRow"

done:
  - "a configured name resolves however it is capitalised, in the runtime and in the editor, under any culture"
  - "a reference read before the catalogs are built resolves the same way the catalogs will"
  - "two spellings of one name are refused as a named finding, one per collision, and never crash the boot"
  - "a persisted name is the configured spelling, so one project cannot launch twice under two capitalisations"
  - "an unresolvable launch fails visibly and holds no reservation"
  - "the comparison this phase makes and the normalisation its successor stores agree by construction"
  - "build green, full suite green"
