# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-27-481ba
goal: "The ticket a conversation reads is ordered before it is cut, cut between comments rather than inside one, and what did not fit can be read on request."

applies_to: "backend (the composed ticket text a design turn is seeded with, and one tool that reads the ticket)"

scope:
  in: "Giving the seeded thread an order of its own, cutting it at a comment boundary, and a read the design turn can call for the ticket as it stands."
  out: "The size of the cap, which 2026-09-25-8e51c chose against a 147,462-character live thread on the one surface with no cost fence. Telling the model whether a missing discussion was refused or absent, which needs a column this phase declines. The seeded images, transcript and approved set, which no phase has shown to be cut wrongly."

decisions:
  - key: |
      THE SEEDED THREAD HAS NO ORDER, AND THAT IS THE DEFECT — NOT "THE NEWEST IS LOST". The
      composer iterates the comments AS GIVEN, and nothing upstream sorts them: not one of the four
      providers and not one of the four comment mappers, and Azure DevOps is asked without a sort
      order at all, so the order is whatever its service returns. Which end of the discussion the
      cap takes is therefore a per-tracker accident, and a claim that the newest goes first would be
      a claim about four external APIs this repository makes nowhere else. The run path already
      distrusts that order and sorts for itself before fitting.
  - key: |
      THE FIT EXISTS AND IS EXTRACTED, BUT ONLY THE FIT. TicketConversationPromptSection already
      sorts by CreatedAt, takes whole comments newest-first into the same 20,000 and reports how
      many it dropped, and the two paths already share that file's neighbour for deciding which
      comments are OURS. Three things around it differ and stay with their callers: the run path
      stamps each comment with its timestamp and the design path does not; the run path KEEPS some
      of our own comments — the answered and the outstanding — while the design path drops all of
      them; and the run path spends the whole budget on comments while the design path has already
      spent part of it on the head. So the shared collaborator takes an ORDERED-BY-NOBODY list of
      already-filtered, already-rendered comments and a REMAINING budget, and answers which of them
      fit. Filtering and rendering never move.
  - key: |
      THE OVERSIZE NEWEST COMMENT IS WHERE THE TWO PATHS MUST DIFFER, AND THE FIT TAKES THAT AS A
      POLICY. The existing fit keeps the newest unconditionally, blowing its own cap — and a run
      path test tolerates exactly that overshoot, by name. It can: that cap is advisory, bounding a
      prompt. The design path's cannot: its text is stored in a column bounded at the same number,
      so an unbounded comment is a write that fails. Making them one rule would either shrink the
      run path's prompt in precisely the 147,000-character case this phase family exists for, or
      break the design path's write. So the caller says whether overshooting is allowed, the run
      path keeps today's answer exactly, and only the design path cuts — and says it cut.
  - key: |
      A COMMENT IS DROPPED WHOLE, AND ONLY THE HEAD MAY EVER BE CUT MID-CHARACTER. Title,
      description and acceptance criteria are what the ticket IS; a conversation that lost them
      would be about nothing, so they are kept first and a ticket whose head alone exceeds the cap
      is the one remaining place a character cut happens. Everything after it is comments, and a
      half-rendered comment reads like a whole one.
  - key: |
      NO NEW COLUMN, SO NO MIGRATION. The row carries one truncation bool, and a COUNT of held-back
      comments would be a new column in two migration assemblies and two model snapshots. The count
      is not worth that once the model can simply look: one sentence saying the ticket is longer
      than the conversation carries and can be read in full is as actionable as a number, and it is
      the same sentence whether the head was cut or comments were dropped.
  - key: |
      THE READ RE-READS THE TRACKER, BECAUSE "THE REST" IS STORED NOWHERE. The ticket is read ONCE,
      when the conversation comes into existence, and what is stored is the already-capped string in
      a column bounded at the same 20,000 — so at the moment a tool could be called, the part that
      did not fit exists in no store. The honest consequence is stated rather than hidden: the tool
      answers the ticket AS IT STANDS NOW, which is not the same thing as what the cap dropped. It
      is the more useful of the two, and the difference matters because the seed's fingerprint
      covers title, description and acceptance criteria only — a comment posted after the read never
      marks the ticket as moved, and would surface here although it was never dropped.
  - key: |
      THE READ IS BOUNDED AND TAKES A CURSOR, OR THE CAP IS A FICTION. A tool returning 147,462
      characters would put them in the transcript, which is re-sent every turn — the cost the cap
      exists to avoid, paid worse. So it answers a slice from a position and says what remains. The
      tool pattern is not new: 2026-09-22-9519 seeds a port on the turn, the master builds the tool
      only when a dialogue identity and that port are both present, and a run with no conversation
      behind it never constructs it.
  - key: |
      THIS REVISES 8e51C'S "NO TRACKER TOOL AND NO NEW DECLARED MASTER INPUT", AND SAYS SO. That
      scope line was right for a phase that had to prove a bounded read was safe at all. What it
      left behind is a prompt that instructs the model to REPORT a limitation — "say so if the
      answer depends on the rest" — with no way to overcome it, which is a dead end exactly when the
      answer does depend on the rest.
  - key: |
      A FAN-OUT CHILD MAY READ THE TICKET TOO. The child surface drops only the tools that address a
      person or a memory, so a new tool joins it by default; that is the right answer rather than an
      oversight, because a child investigating one corner of a ticket needs the same text its parent
      was grounded on.
  - key: |
      THE TWO READS ARE SPLIT, BECAUSE TODAY A FAILED COMMENT FETCH UNGROUNDS THE WHOLE
      CONVERSATION. The ticket read and the comment read sit in one try block, so a tracker that
      serves the ticket and refuses its comments leaves the conversation with no ticket at all.
      Splitting them is what lets the head survive. What this phase does NOT do is tell the model
      WHICH of the two it got: the row carries no field for it and adding one would be the column
      this phase declined, so a refused comment read and a ticket with no discussion still read
      alike. That is a smaller lie than an ungrounded conversation, and it is said here rather than
      discovered.

steps:
  - id: the-fit-is-shared
    path: "src/backend/AgentSmith.Application/Services/Prompts, src/backend/AgentSmith.Application/Services/SpecDialog"
    action:
      - "Extract the FIT the run path already performs — take from the end until the budget is spent — into a collaborator both paths call, with overshooting as the caller's choice."
      - "Sort in the design path's composer, where nothing filters by adjacency and the order is the defect being fixed."
      - "Compose the design path's text as head first, then whole comments newest-first into what remains."

  - id: the-ticket-read-survives-its-comments
    path: "src/backend/AgentSmith.Server/Services/SpecDialog"
    action:
      - "Read the ticket and its comments separately, so a refused comment read leaves the conversation grounded in the ticket."
      - "Move the moved-check out of TicketTextForConversation first — it is self-contained and the file has four lines under the limit."

  - id: the-note-points-at-the-read
    path: "src/backend/AgentSmith.Application/Services/SpecDialog"
    action: "Replace the note that calls the text 'the beginning of it' — it is no longer contiguous — with one that says the ticket is longer than the conversation carries and can be read in full."

  - id: the-ticket-can-be-read
    path: "src/backend/AgentSmith.Contracts/Dialogue, src/backend/AgentSmith.Contracts/Commands, src/backend/AgentSmith.Application/Services/Tools, src/backend/AgentSmith.Application/Services/Handlers, src/backend/AgentSmith.Server/Services/SpecDialog"
    action:
      - "Add a port that reads the bound ticket, keyed beside the withdrawal in the spec-dialog partial of the context keys, and built into a tool where the withdrawal's is — the handler holding it has forty-one lines under its baseline, which is the only slack this phase has."
      - "Seed it with the project and the ticket id it needs: the stored row carries neither, and the turn that seeds it is the only place both are already resolved."
      - "Answer a slice from a caller-given position and say what remains after it."
      - "Move the per-turn reads out of SpecDialogTurnRunner first — it is at the limit exactly, it is not in the baseline, and the port must join both its constructor and the seed call."
      - "Take the registration line by chaining onto an existing one: the spec-dialog registrations sit in a file that is also at the limit."

  - id: the-cut-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Assert the order the seed imposes regardless of what the provider returned, that no comment is half-rendered, that a head longer than the cap still says so, that a refused comment read keeps the ticket, and that the read answers slices and refuses without a binding."

tests:
  - "TicketText_CommentsReturnedOutOfOrder_AreSeededNewestFirstRegardless"
  - "TicketText_ACommentThatDoesNotFit_IsDroppedEntireNotSliced"
  - "TicketText_ANewestCommentTooBigForWhatRemains_IsCutAndSaysSo"
  - "TicketConversation_ANewestCommentTooBigForItsCap_IsStillTakenWhole"
  - "TicketText_AHeadLongerThanTheCap_IsCutAndSaysTheTicketCanBeRead"
  - "TicketText_CommentsThatCouldNotBeRead_LeaveTheTicketItselfGrounded"
  - "TicketText_TheSharedFit_IsTheOneTheRunPathUses"
  - "ReadTicketTool_AskedFromAPosition_AnswersASliceAndWhatRemains"
  - "ReadTicketTool_AConversationBoundToNoTicket_CarriesNoTool"

done:
  - "the seeded thread is ordered by this framework and not by whichever tracker answered"
  - "a comment is dropped whole or, when it is the newest and too big for what remains, cut and reported as cut"
  - "a ticket's head survives a thread of any length"
  - "a tracker that refuses comments no longer ungrounds the whole conversation"
  - "a design turn bound to a ticket can read the ticket in slices, and the note says so"
  - "a conversation bound to no ticket renders and carries exactly what it did before"
  - "no new column and no migration"
  - "build green, full suite green"
