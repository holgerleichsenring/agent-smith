  - claim: "The filing watch reads through a hardcoded dashboard platform and passes the dialog id as a thread id, so it is not the path a session-id tool may reuse."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/FiledWorkFiling.cs:15"
  - claim: "The port's close member returns a bare task."
    evidence: "src/backend/AgentSmith.Contracts/Providers/ITicketProvider.cs:60-73"
