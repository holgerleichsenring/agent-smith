  - claim: "The panel renders the start state from the filing push, and the refetch is triggered by that nudge, by a change in the pushed filing, or by a reconnect."
    evidence: "src/dashboard/src/hooks/useFiledWork.ts:47-89"
  - claim: "The start state's label falls through to the record wording for anything it does not name."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/FiledWorkStart.cs:44-49"
