  - claim: "Another returns quietly when the ticket id will not parse."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubTicketProvider.cs:143-148"
  - claim: "The finalize member with no target status answers that the ticket moved unconditionally on that provider, so routing the close through it would relocate the swallow rather than remove it."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitHubTicketFinalizer.cs:26-30"
  - claim: "The same is true of the fourth provider."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets/GitLabTicketFinalizer.cs:26-30"
