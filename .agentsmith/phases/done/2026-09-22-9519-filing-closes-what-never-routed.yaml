  - claim: "Filing moves a work ticket into a trigger status, and the four reasons it may not are a missing route, a withheld permission, an absent target status and an unreadable one."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/FiledWorkStarter.cs:65-104"
  - claim: "The default poll interval is sixty seconds."
