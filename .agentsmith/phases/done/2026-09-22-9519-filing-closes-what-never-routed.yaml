assumptions:
  - claim: "A store write keyed by the session row must be added; no such path exists today."
    check: "Read every write path of the latest-outcome store and confirm each is keyed by platform and thread."
  - claim: "Widening the close member breaks no caller that ignores its answer."
    check: "Find every caller of the close member and establish what each does with a returned value."
  - claim: "A nudge reachable by ticket id can find the same listeners the snapshot-keyed one finds."
    check: "Read how the nudge resolves listeners and whether the ticket is the only key it uses."
  - claim: "A project renamed or removed from the catalog since filing resolves to no provider, and the tool refuses rather than throwing."
    check: "Read how the filing's stored project name is turned into a tracker connection."
