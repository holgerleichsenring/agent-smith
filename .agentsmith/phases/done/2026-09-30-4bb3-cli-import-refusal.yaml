# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-30-4bb3
goal: "A config the import planner refuses ends `agentsmith config import` with its message and exit code 1, not a stack trace."

applies_to: "backend (the CLI config import)"

requires: ["2026-09-30-62bab"]

facts:
  - claim: "The CLI catches ConfigurationException only around the store write; the planner runs before the try, so its refusal escapes unhandled."
    evidence: "src/backend/AgentSmith.Cli/Commands/ConfigCommand.cs:93-110"
  - claim: "Since 62bab the planner refuses a role whose use names no catalog entry."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration/Studio/CatalogUseRule.cs:19-23"
  - claim: "ConfigCommand.cs is on the file-length ratchet at 133 lines and may not grow."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:122"

scope:
  in: "The import moves into its own CLI service that plans and writes inside one refusal boundary; the store context factory moves beside it; ConfigCommand shrinks under the limit and leaves the ratchet."
  out: "The server import endpoint — it already answers 400."

decisions:
  - key: "ONE BOUNDARY FOR PLAN AND WRITE. Both refuse with ConfigurationException, and the operator reads either the same way."

steps:
  - id: runner
    action: "ConfigImportRunner (Cli/Services) plans and imports, catching ConfigurationException around both; ConfigStoreContextFactory builds the DbContext for export and import."
  - id: command
    action: "ConfigCommand delegates; its baseline row goes."

tests:
  - "ConfigNameCollisionTests-style CLI test: a YAML whose role uses an undeclared entry exits 1 and leaves the store as it was"

done:
  - "build and all tests green"
