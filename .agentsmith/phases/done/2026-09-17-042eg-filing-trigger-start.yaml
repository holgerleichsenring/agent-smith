# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-17-042eg

goal: "Approving a phase or an epic moves the filed work ticket into a trigger status when the approver may start runs, and reports it started only when routing would claim it."

applies_to: "backend (spec-dialog filing, the permission carried from ingest to the filer, the Jira transitioner) + dashboard (the filed tab)"

requires:
  - 2026-09-17-042ea
  - 2026-09-17-042el
  - 2026-09-17-0e79a
  - 2026-09-17-0e79d

scope:
  in: >
    The dashboard ingest decides whether the caller holds runs.control and passes that bool down the
    in-process chain to the filer; chat passes false. An approval files ONE work ticket
    (2026-09-17-0e79d) and stores its approved set (2026-09-17-0e79a) BEFORE anything moves it. The
    filer then reads the work ticket back and resolves the poller's envelope FIRST. Each filed ticket
    ends in one state with its reason: STARTED (the ticket resolves to the filing project on the
    poller's own envelope and is in a trigger status, or the project declares no trigger_statuses), NOT
    STARTED (nothing would resolve it; no permission; not a native state; the status still held after a
    move), or RECORD (a slice record, which is not work). Only a ticket that resolves and sits outside
    the trigger statuses is moved to the first one, then read back. A BUG outcome is answered on its own
    terms: it carries no framework label at all, so it resolves only where the project's resolution is
    one an unlabelled ticket satisfies, and its pipeline comes from the project's own rules. FiledTicket carries the ticket id, the project and a nullable start state
    with its reason. Jira's transition lookup takes an exact target-status match only when no transition
    name matches.
  out: >
    A "FILE WITHOUT STARTING" CHOICE. See decisions.
    CHANGING GITHUB'S OR GITLAB'S TransitionToAsync. FinalizeAsync depends on it.
    MAKING AN UNRESOLVABLE TICKET RESOLVABLE. A successor, named by what it does: filing stamps the
    project's resolution tag on the tickets it files. Until it lands, approval starts a run only on a
    project whose resolution the filed ticket already satisfies; see decisions.
    PERSISTING THE PERMISSION ON A DIALOG ANSWER. See decisions.
    ORDERING SEVERAL WORK TICKETS AGAINST EACH OTHER. One approval files one work ticket, and its
    phases are ordered inside the run; the predecessor gate is left exactly as it is, for tickets whose
    stamps someone else set.
    THE FILED TICKET'S DISPLAY KEY. 2026-09-17-042em.
    THE TRANSCRIPT'S CLOSING LINE AND WHAT THE FILED WORK BECAME. 2026-09-17-042ej.

decisions:
  - key: |
      FILING STARTS NOTHING TODAY UNLESS THE TRACKER'S DEFAULT HAPPENS TO TRIGGER. CreateAsync takes no
      status (ITicketProvider.cs:59-61) and the filers call nothing after it (EpicTicketFiler.cs:42-46,
      OutcomeTicketFiler.cs:80-82). A created GitHub or GitLab issue is already open/opened
      (GitHubFieldMapper.cs:23, GitLabFieldMapper.cs:21); a work item created in "New" on a project
      triggering on "To Do" sits there.
  - key: |
      THE SET IS STORED BEFORE THE TICKET MOVES. The run resolves an approved set by the work ticket's
      spec key (2026-09-17-0e79a); a ticket moved into a trigger status before the record exists can be
      claimed by the poller and would derive its own spec — the one outcome this whole set of phases
      exists to prevent. Storing is part of filing, and the move is the last thing the approval does.
  - key: |
      WHAT THE POLLER'S ENVELOPE CAN SATISFY, SAID PLAINLY. The envelope the poller builds carries
      labels, ticket id and platform and nothing else (TrackerPoller.cs:188-193), and a project matches
      on its RESOLUTION strategy — tag, area path, repo or to-address (ProjectResolver.cs:113-126). So
      a filed ticket can resolve only on a project whose resolution is a tag the ticket already carries;
      on an area-path, repo or to-address project nothing this filer creates resolves, and the framework
      stamps no resolution tag (the named successor above). A bug carries no labels at all
      (OutcomeTicketFiler.cs:71), so it resolves nowhere today. This phase therefore reports NOT STARTED
      with that reason rather than moving a ticket nothing would claim: moving it would leave it sitting
      in a trigger status, and claiming "started" would be false. The webhook path can resolve more than
      the poller can, so the reason says the tracker's own webhook may still claim the ticket.
  - key: |
      RESOLVE FIRST, MOVE ONLY WHAT RESOLVES. Application/Services/Triggers/ProjectResolver.cs needs a
      resolution match per trigger (:113-126) and skips a trigger a blocking startup finding disabled
      (:94-103). The poller resolves an envelope of labels, ticket id and platform only
      (TrackerPoller.cs:104-110, 188-193), so AreaPath, Repo and ToAddress strategies
      (ProjectResolver.cs:120-123) never match it and the filers stamp no tag. Moving a ticket the
      resolver would not route starts nothing and leaves it in a trigger status for a webhook to find
      later. For a work ticket, started means a match naming the filing project with phase-execution
      (ProjectResolver.cs:65-67, ProjectMatch.cs:8), which the phase label supplies once the project
      resolves at all.
  - key: |
      A BUG IS ROUTED BY THE PROJECT'S OWN RULES, SO ITS ANSWER IS ITS OWN. FileBugAsync creates the
      ticket with NO labels (OutcomeTicketFiler.cs:64-73), so the framework's phase label never applies
      and pipeline_from_label decides which pipeline claims it (ProjectResolver.cs:65-71). Demanding
      phase-execution there would report "not started" for a bug that is in fact routed. A bug is
      started when a match names the filing project with ANY pipeline; today, with no labels on it and
      no resolution tag stamped, that match does not happen and the report says so by name rather than
      by silence.
  - key: |
      NO trigger_statuses MEANS EVERY STATUS TRIGGERS. TrackerPoller.cs:195-197 allows any status then;
      the ticket counts as in a trigger status and nothing is moved.
  - key: |
      MOVING A TICKET INTO A TRIGGER STATUS STARTS A RUN, SO IT NEEDS runs.control. The retry that makes
      this move is guarded by it (RunControlEndpoints.cs:41); posting to a dialog needs dialog.write
      only (SpecDialogEndpoints.cs:18-19). IngestAsync computes
      "holds = !auth.Enforce || identities.Resolve(ctx.User).Permissions.Contains(RunsControl)" — the
      non-enforcing rule HubPermissionFilter.cs:35 applies, over CallerIdentityResolver.Resolve
      (CallerIdentityResolver.cs:34-49). Without it the work ticket is filed and reported "waiting for
      someone who may start runs"; where the created status already triggers, it starts as today — the
      permission governs the MOVE, which is the only thing this phase adds.
  - key: |
      THE BOOL TRAVELS IN PROCESS, THROUGH THE TURN THAT FILES. Approval is asked and filed inside the
      turn that produced the proposal (SpecDialogRouter.cs:85-111, SpecDialogOutcomeFlow.cs:24-46); the
      approving message only answers the pending question (SpecDialogRouter.cs:58-65,
      2026-09-17-042el's admission). MayPostAsync lets only the session's owner post into the dialog
      (SpecDialogOwnership.cs:50-58), so the principal that started the turn is the approver, and its
      bool is the one that counts. No DialogAnswer field and no migration: the answer is persisted by
      DurableDialogueTransport.cs:29-35 and stays as it is. Signatures gaining "bool mayStartRuns":
      SpecDialogEndpoints.Dispatch (:51) and its call (:41); DashboardDialogDispatcher.DispatchAsync
      (:23-24); SpecDialogRouter.TryRouteAsync (:32-34), TryContinueThreadAsync (:50-52) and
      RunTurnAsync (:85-87); SpecDialogOutcomeFlow.HandleAsync (:24-25); IOutcomeSink.AcceptAsync
      (IOutcomeSink.cs:16) with TicketFilingOutcomeSink (:25) and the harness's RecordingOutcomeSink
      (SpecDialogOutcomeTests.cs:527); OutcomeTicketFiler.FileAsync (:26-27) and
      EpicTicketFiler.FileAsync (:22-23, called at OutcomeTicketFiler.cs:37). Slack and Teams both
      reach the router through the one call at SlackMessageDispatcher.cs:38 (Teams via
      TeamsEndpoints.cs:108-111) and pass false. The bool is sampled when the turn starts; an approval
      up to the confirmer's timeout later still moves the ticket if the role was removed in between.
  - key: |
      ONE PATH: APPROVAL FILES AND, WITH THE PERMISSION, STARTS. "File only" cannot be offered where the
      created status already triggers. Stated risk: a first trigger status that is a human triage gate
      is skipped by approving.
  - key: |
      NO MOVE WHERE THE MOVE CANNOT WORK. GitHub adds a LABEL for any name but open/closed
      (GitHubTicketProvider.cs:156-165); GitLab sends any other name as state_event
      (GitLabTicketProvider.cs:165-167, 185-190), which throws through SendAsync
      (TicketProviderHttpClient.cs:100-105). On those two the move is attempted only for
      open/opened/closed.
  - key: |
      JIRA: EXACT TARGET MATCH AFTER THE NAME MATCH, NOT INSTEAD. FindTransitionId matches a transition
      NAME by substring (JiraTransitioner.cs:47-62) and serves close, finalize, lifecycle and retry
      (JiraTicketProvider.cs:185-205, JiraNativeLifecycleTransitioner.cs:17-20,
      ParkedTicketDialogue.cs:68-69, NotImplementableRetryService.cs:38-39). Every transition a name
      match found is taken as before; only when none matches is the transition whose "to".name equals
      the status, case-insensitively, taken. That newly found case also reaches the native lifecycle
      transitioner (:19-20), which then records natively instead of by label; it is tested.
  - key: |
      A SLICE RECORD IS A RECORD, IN 0e79d's SHAPE. 2026-09-17-0e79d files each slice with the
      framework's record label and no stamps, and the record label is refused before every other rule
      (ProjectResolver.cs:36-41). A record is never resolved, never moved, and reads "record, not work";
      the state is decided by the label the filer used, not by asking the resolver.
  - key: |
      THE ID AND PROJECT ARE OWNED HERE. FiledTicket is Reference and Title (FilingReport.cs:4) and
      Reference is a url when there is one (CreatedTicket.cs:9-12); a run is found by project and ticket
      id (Run.cs:11-13). 2026-09-17-042em formats the display key from this id, 2026-09-17-042ej reads
      the runs by it, and 2026-09-17-0e79a keys the approved set by it. The start state is nullable: an
      older filing deserializes with web defaults (SpecDialogLatestOutcomeStore.cs:31, 64-67) and reads
      as unknown; the dashboard type gains optional fields (spec-dialog.ts:154-157).
  - key: |
      042ek EDITS THE SAME DISPATCHER, ON OTHER LINES. 2026-09-17-042ek rewrites
      DashboardDialogDispatcher's no-open-dialog message (its decisions name :19-21); this phase adds a
      parameter to DispatchAsync (:23-24). Disjoint lines in one small file, so no ordering edge — the
      second to land rebases on the first.
  - key: |
      ROOM. The start-and-confirm logic is a collaborator; EpicTicketFiler (64) and OutcomeTicketFiler
      (84) call it and stay under 120. SpecDialogRouter stands at its 132-line baseline
      (file-length-baseline.tsv:138): the parameter is added on the existing signature and call lines,
      so it does not grow; SpecDialogOutcomeFlow (65) and DashboardDialogDispatcher (57) have room.

steps:
  - id: the-report-names-the-ticket
    action: "FiledTicket gains the ticket id, the project and a nullable start state (started, not started, record) with its reason; the dashboard type follows with optional fields."
  - id: the-permission-reaches-the-filer
    action: "IngestAsync computes the runs.control bool and every signature named in decisions passes it; SlackMessageDispatcher and the harness sink pass false."
  - id: start-and-confirm
    action: "A collaborator reads the created ticket, resolves the poller's envelope, moves a routed work ticket outside the trigger statuses when permitted and possible, reads back, and returns the state and reason."
  - id: the-store-comes-first
    action: "The filers store the approved set and finish filing the records before the work ticket is moved."
  - id: filers-report-every-ticket
    action: "Every filer calls it: a work ticket and a bug are started or not started with a reason, and every slice record reads as a record."
  - id: jira-matches-the-target
    action: "JiraTransitioner takes the exact target-status match only when no transition name matches."
  - id: the-operator-is-told
    action: "The filed tab and the filing notice say per ticket started, not started or record, and why."

tests:
  - "WorkTicket_ProjectResolvingByATagTheTicketCarries_ReportsStarted"
  - "WorkTicket_ProjectResolvingByAreaPath_ReportsNotStartedNamingTheMissingTag"
  - "WorkTicket_InTriggerStatusButUnresolvable_ReportsNotStarted"
  - "WorkTicket_OutsideTheTriggerStatusesAndUnresolvable_IsNotMoved"
  - "WorkTicket_TriggerDisabledByAStartupFinding_ReportsNotStarted"
  - "WorkTicket_ProjectWithoutTriggerStatuses_ReportsStartedAndMovesNothing"
  - "WorkTicket_OutsideTheTriggerStatusesWithRunsControl_IsMovedToTheFirstOne"
  - "WorkTicket_OutsideTheTriggerStatusesWithoutRunsControl_IsNotMovedAndWaits"
  - "WorkTicket_MoveReadsBackUnchanged_ReportsNotStartedWithTheHeldStatus"
  - "WorkTicket_MoveThrows_ReportsNotStartedAndTheFilingContinues"
  - "WorkTicket_GitHubTriggerStatusNotNative_IsNotMovedAndGetsNoLabel"
  - "BugOutcome_CarriesNoLabels_ReportsNotStartedNamingTheMissingTag"
  - "BugOutcome_Unresolvable_IsNeverMoved"
  - "SliceRecords_AreNeverResolvedNeverMovedAndReadAsRecords"
  - "Filing_ApprovedSetIsStoredBeforeTheTicketIsMoved"
  - "Filing_StoreFails_TheTicketIsNotMovedAndTheOperatorIsTold"
  - "Ingest_AuthorityNotEnforcing_CarriesMayStartRuns"
  - "Ingest_EnforcingWithoutRunsControl_CarriesFalse"
  - "ChatDispatch_NeverMovesATicket"
  - "JiraTransition_NameMatch_StillWinsOverTarget"
  - "JiraTransition_NoNameMatchButTargetMatches_IsFound"
  - "JiraFinalize_DoneStatusByTransitionName_StillTransitions"
  - "JiraLifecycle_StatusReachableOnlyByTarget_IsRecordedNatively"
  - "FilingRecord_WrittenBeforeTheStartState_ReadsAsUnknown"
  - "dashboard: the filed tab marks each ticket started, not started or record with its reason"
  - "dashboard: a filing without start states renders as before"

done:
  - "an approval by someone who may start runs moves the filed work ticket into a trigger status, after its set is stored"
  - "started is claimed only for a ticket the poller's own envelope would resolve, and every other ticket says which tag is missing"
  - "no ticket is moved into a trigger status that nothing would claim"
  - "an approval without runs.control, from chat, or for a ticket that does not route or cannot be moved files and says why nothing moved"
  - "no slice record is ever moved"
  - "every Jira transition a name match found is taken as before"
  - "build green, full suite green, dashboard tests green, file-length ratchet green"
