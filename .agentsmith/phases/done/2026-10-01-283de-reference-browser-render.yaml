# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-01-283de
goal: "render_reference renders an uploaded website or a public URL in a browser sandbox of its own, returns exact computed styles, and deposits bounded screenshots."

applies_to: "backend (a browser image, its spawn and resource profile, an egress guard, a tool host), ci (one publish leg)"

requires: ["2026-10-01-283dc", "2026-10-01-283dd"]

facts:
  - claim: "A sandbox runs the server's agent binary, injected by a carrier image, inside whatever toolchain image the spec names; that image needs only glibc."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Dockerfile:1-6; src/backend/AgentSmith.Application/Services/Sandbox/SandboxImageChain.cs:32-43; src/backend/AgentSmith.Contracts/Sandbox/SandboxSpec.cs:21-27"
  - claim: "The carrier image's reference is registry/agent-smith-sandbox-agent:<version>, the version derived from the running server; CI publishes it from a matrix leg built for amd64 and arm64."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/AgentImageResolver.cs:21-29; src/backend/AgentSmith.Contracts/Constants/AgentImageDefaults.cs:13,16; .github/workflows/docker-publish.yml:78-89"
  - claim: "The dashboard leg is amd64-only because its build does not complete under QEMU-emulated arm64."
    evidence: ".github/workflows/docker-publish.yml:90-106"
  - claim: "Every toolchain image used today is a public image; none is built by this repository."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/ToolchainImageCatalog.cs:35-64"
  - claim: "A Kubernetes sandbox must be ready within SandboxSpec.TimeoutSeconds, 120 by default; a cold pull counts against it."
    evidence: "src/backend/AgentSmith.Contracts/Sandbox/SandboxSpec.cs:27; src/backend/AgentSmith.Server/Services/Sandbox/KubernetesSandboxFactory.cs:46-47"
  - claim: "The light profile is 500m CPU and 1Gi memory at most."
    evidence: "src/backend/AgentSmith.Contracts/Sandbox/ResourceLimits.cs:60"
  - claim: "A Docker sandbox joins the server's own network, where Redis is; the shipped Kubernetes manifests carry no NetworkPolicy."
    evidence: "src/backend/AgentSmith.Server/Services/Sandbox/DockerSandboxFactory.cs:31,49-78; deploy/k8s/ (1-namespace.yaml … 12-pvc-persistence.yaml, none a NetworkPolicy)"
  - claim: "One ReadFile returns at most 1 MB."
    evidence: "src/backend/AgentSmith.Sandbox.Wire/SizeLimits.cs:5"
  - claim: "Conversation sandboxes are held under string keys between turns."
    evidence: "src/backend/AgentSmith.Contracts/Sandbox/IHeldSandboxRegister.cs:30"
  - claim: "The design surface is built per turn in MasterToolComposition, 100 lines."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterToolComposition.cs:40-63"

scope:
  in: >
    IMAGE: src/sandbox-images/browser/Dockerfile FROM the Playwright Ubuntu image at a pinned version, the
    matching playwright npm package, and /opt/agentsmith/render.mjs baked in; published as
    agent-smith-sandbox-browser beside the carrier, same tag. CI builds each arch on a native runner
    (ubuntu-latest and ubuntu-24.04-arm) and runs the render fixture on each; no QEMU leg. BrowserImageResolver
    mirrors AgentImageResolver. SPAWN: BrowserSandboxOpener uses the project's spec with ToolchainImage = the
    browser image, TimeoutSeconds 600, and the BROWSER profile — sandbox.browser.resources, default
    requests 500m / 1Gi, limits 2 CPU / 2Gi; held per conversation under key 'browser'; a backend that
    spawns no container answers that no browser runtime exists. SETS: a set is copied from the store into
    /work/sets/<setId>/ ONCE per sandbox life (a .complete marker), text as-is, binaries via one python3
    decode step. ORIGIN: render.mjs serves /work/sets/<setId>/ over HTTP on 127.0.0.1 at a random port and
    navigates there, so modules, fetch and root-relative paths work as on a web server. EGRESS GUARD:
    (1) the server resolves a requested URL's host and refuses it when ANY address is loopback, private
    (10/8, 172.16/12, 192.168/16), link-local (169.254/16, fe80::/10), unique-local (fc00::/7), CGNAT
    (100.64/10), unspecified (0.0.0.0/8, ::), multicast or broadcast — IPv4-mapped IPv6 unwrapped first;
    (2) Chromium runs with --proxy-server pointing at an egress proxy inside render.mjs and
    --proxy-bypass-list=<-loopback>, so EVERY request — page, subresource, websocket CONNECT, service
    worker fetch — goes through the proxy, which resolves the host and connects only to the checked
    address (no second lookup to rebind); the one allowed loopback target is the set server's own
    host:port; (3) the context blocks service workers and page.route aborts any non-http(s) scheme.
    SCREENSHOTS: desktop 1440x900 and mobile 390x844; full page captured to at most 2700 px (desktop) /
    2532 px (mobile) of height, then downscaled so the long edge is at most 1568 px; JPEG through a quality
    ladder to under 700 KB so one ReadFile returns it; deposited through 283dd. TOOL: render_reference
    (design surface) — source = a reference: address or an absolute http(s) URL; selectors (model-given,
    max 20; defaults body, h1, h2, h3, a, button, input, nav, header, footer); returns per selector the
    first match's computed color, background-color, font-family, font-size, font-weight, line-height,
    letter-spacing, padding, margin, border-radius, border, box-shadow, width, height as the browser
    computed them, plus console errors, failed requests and every request the guard refused.
  out: >
    The coding surface and the run's capacity — 2026-10-01-283df. Comparing two renders — 2026-10-01-283di.

decisions:
  - key: "THE BROWSER IS A TOOL RUNTIME. Not in the server image and not in any repo image; a sandbox of its own, spawned like any other, with no repository."
  - key: "THE PROXY IS THE GUARD. Route interception sees a host name, and Chromium resolves it again afterwards; a proxy that resolves once and connects to what it checked leaves no rebinding gap and sees websockets and service workers too."
  - key: "A LOCAL ORIGIN, NOT file://. ES modules, fetch and root-relative paths all fail on file://, and a site that renders differently there is not the site uploaded."
  - key: "COMPUTED STYLES ARE THE EXACT HALF. A screenshot makes a model estimate a color; getComputedStyle states it."
  - key: "THE SCRIPT IS BAKED, THE OPERANDS ARE FILES. node gets one server-shaped path; URL and selectors travel inside the JSON it reads."

steps:
  - id: image
    action: "Dockerfile + render.mjs (static server, egress proxy, renderer; --no-sandbox when running as root, --disable-dev-shm-usage); native per-arch CI legs with the fixture; BrowserImageDefaults + BrowserImageResolver."
  - id: spawn
    action: "BrowserSandboxConfig (resources) on the sandbox global config; BrowserSandboxOpener; held key; in-process refusal."
  - id: guard
    action: "PublicAddressRule (C#, shared by the server pre-check) and the same ranges in render.mjs's proxy."
  - id: tool
    action: "RenderReferenceToolHost + RenderReferenceToolFactory; BrowserSetCopy (once per sandbox); MasterToolComposition appends it on the design surface."

tests:
  - "PublicAddressRule_LoopbackPrivateLinkLocalUlaCgnatUnspecified_AreRefused (IPv4, IPv6, IPv4-mapped)"
  - "RenderReference_HostResolvingToTen_IsRefusedBeforeSpawning"
  - "RenderReference_ReferenceAddress_CopiesTheSetOncePerSandbox"
  - "RenderReference_FtpUrl_IsRefused"
  - "BrowserImageResolver_DefaultRegistry_NamesSandboxBrowserAtTheAgentVersion"
  - "RenderReference_InProcessBackend_SaysNoBrowserRuntimeExists"
  - "render.mjs fixture (each arch): a module script and a root-relative stylesheet render; a subresource to 127.0.0.1:6379 and to a name resolving to 10.0.0.1 are refused; a 6000 px page yields a JPEG under 700 KB with a 1568 px long edge"

done:
  - "on Docker, a design turn renders an uploaded site and quotes its button's computed background-color"
  - "a URL whose page pulls a subresource from the server's Redis host is rendered with that request refused and listed"
  - "build green, full suite green"
