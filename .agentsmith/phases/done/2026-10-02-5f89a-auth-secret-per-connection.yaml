scope:
  in: >
    MIGRATION at the entry point: LegacyCredentialMigration runs in RawConfigMaterializer after secret resolution and
    before catalog resolution, on every load. Local repos (type local, auth empty or none) are exempt from every fill
    and check below. An empty auth on a connection, tracker or remote repo is filled with its type's legacy key
    (github_token, gitlab_token, azure_devops_token, jira_token; compared case-insensitively); when the catalog lacks
    that key it is ADDED as ${GITHUB_TOKEN} etc. An empty Jira email is filled from the jira_email secret, else
    JIRA_EMAIL. An empty GitLab tracker url, Jira url, GitLab tracker project or Jira project is filled from
    GITLAB_URL, JIRA_URL, GITLAB_PROJECT or JIRA_PROJECT when set; a Jira project still empty keeps the 'default' key.
    GITLAB_URL, when set, fills the host of GitLab repos declared under repos: (never a connection's — connections
    never read it). Transparency: a non-empty auth naming a secret other than its type's legacy key while the legacy
    env variable is set records 'X now authenticates with secret Y instead of GITHUB_TOKEN'; a named secret that
    resolves empty records that too. Every one of these is ADVISORY and only RECORDED, like the model-role findings,
    never in LastResolutionFindings, so the CLI does not refuse on it. After migration, an auth naming no secret in
    the catalog, or a Jira tracker with no email, is a BLOCKING resolver finding; the entry stays. ICredentialResolver
    (interface) and CredentialResolver (over ISecretValues) live in Contracts, reachable from Infrastructure and from
    Application for 2026-10-02-5f89g; it answers a token at call time and throws MissingCredentialException (a
    ConfigurationException) naming entity and secret, never a value. All server-side consumers above use it;
    TicketStatusTransitionerFactory and TicketProviderFactory share one TrackerConnections. Both Azure DevOps caches
    key by org URL plus a SHA-256 of the token. RepoConnection and RawRepoEntry gain Host (copied from the connection
    for connection repos), which replaces GITLAB_URL in the factories. GitLabMemberAccessReader.ReadAccessLevelAsync
    takes the RepoConnection; both trust caches key by host or org plus repository and author. TrackerConnection,
    RawTrackerEntry and TrackerEntity gain Email, declared on Jira in the descriptor; RawConfigPatch's tracker mapping
    takes it without growing past its ratchet row. SecretsProvider is deleted. Docs (every page under docs/ outside
    run-logs naming these variables), .env.example, 3-configmap.yaml, apply-k8s-secret.sh and DOCKERHUB_DESCRIPTION.md
    describe auth per connection.
  out: >
    Clone, fetch and push credentials — they move in 2026-10-02-5f89g, built right after this slice and shipped in the
    same pull request. An on-premises Azure DevOps Server (the tracker stays on dev.azure.com). Webhook signing
    secrets. LLM keys and the Copilot GITHUB_TOKEN fallback. AgentSecretBinding. The draft check — 2026-10-02-5f89b.
    Discovery status — 2026-10-02-5f89c.

decisions:
  - key: "MIGRATE, NEVER FALL BACK SILENTLY (operator ruling). The legacy name — and its catalog entry if missing — is written into the loaded config and reported, so a config with empty auths and no secrets: block keeps working, every consumer reads one field, and nothing downstream knows a fixed name."
  - key: "ADVISORIES ARE RECORDED, NOT RESOLUTION FINDINGS. The CLI loader refuses any resolution finding; a migration note must never stop a config that works today."
  - key: "SAY WHEN THE TOKEN CHANGES. An auth that named a different secret was ignored until now; the day it starts being read the operator is told which secret replaced which variable, and an empty one is named instead of failing silently at the first call."
  - key: "BLOCKING FOR A HOLE, ENTRY KEPT. A secret that resolves nowhere would fail at the first call; dropping the tracker would cascade into unknown-reference findings on every project using it."
  - key: "RESOLVED AT CALL TIME, NEVER CACHED IN A RECORD. Records carry the secret NAME; keying the Azure DevOps caches and the trust verdicts by instance is what lets two instances and a re-pointed secret coexist."
  - key: "JIRA EMAIL IS A FIELD (operator ruling), migrated from jira_email/JIRA_EMAIL."
  - key: "SAME PULL REQUEST AS 5f89g. Between the two, API calls would use the connection's secret while git still used the type's variable; they ship together."

steps:
  - id: resolver
    action: "ICredentialResolver, CredentialResolver and MissingCredentialException in Contracts; registrations in server and CLI; SecretsProvider, its registration, SecretsProviderTests and the StartupThrowInventoryTests row removed."
  - id: migration
    action: "LegacyCredentialMigration (Infrastructure.Core) called from RawConfigMaterializer, recording advisories through IStartupFindings; RawRepoEntry.Host, RawTrackerEntry.Email; agentsmith.schema.json."
  - id: consumers
    action: "SourceProviderFactory, PrDiffProviderFactory, TrackerConnections (one instance), TicketProviderFactory, TicketStatusTransitionerFactory, the three discovery providers and both author-trust readers resolve through it; Host and Email replace the env reads."
  - id: caches
    action: "DefaultAzDoClientFactory and AzureDevOpsConnectionCache key by org URL + token hash; GitLabMemberAccessTrust and AzureDevOpsRepoContributeTrust verdict keys gain host/org."
  - id: findings
    action: "Repo, connection and tracker builders take the secret names (ConfigCatalogResolver passes raw.Secrets.Keys, line count unchanged) and report MissingSecret like DesignSourceCatalogBuilder, skipping local repos."
  - id: descriptor
    action: "TrackerEntity.Email, RawConfigPatch (line-neutral), Jira descriptor field email (required); Jira project stays optional."
  - id: docs
    action: "docs pages, example config, .env.example, deploy/k8s/3-configmap.yaml, deploy/apply-k8s-secret.sh, DOCKERHUB_DESCRIPTION.md."
  - id: tests
    action: "valid-config.yml names github_token in both auths; AgentSmithConfigCompositionTests and the eight env-variable classes configure secrets instead of process env."

