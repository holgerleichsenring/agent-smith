# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-85b2

goal: "Every delivered finding can be put to a fresh instance to refute, and no finding is ever deleted for a citation the checker could not resolve."

applies_to: "backend (which delivered findings are checked, how their evidence is resolved, and what a verdict is allowed to do)"

requires:
  - 2026-08-28-cc40

scope:
  in: >
    A master's own findings are asked about on the same terms as a promoted scanner fact; a finding
    that fails to resolve is delivered unchanged rather than dropped; the evidence resolver reads
    across every sandbox and normalises paths the way the merge already does; a cited line the file
    does not have is never sent as evidence; verdicts are routed by finding identity rather than by a
    location string; the refutation call states its own output budget and its answer survives
    truncation.
  out: >
    IMPROVING DETECTION. This phase cannot and does not: refutation only ever leaves a finding alone
    or makes it quieter, and the problem that opened this batch is findings that were never made. It
    ships because a verification step that by construction never sees what a run delivers is not one,
    and because its current selection hides that. DROPPING A MASTER FINDING FOR AN INVENTED CITATION —
    a real fate to consider, and not in the same phase as the change that first lets the checker see
    those findings at all.

decisions:
  - key: |
      THE CHECKER HAS NEVER RUN ON A REPO SCAN. Only findings the master's SILENCE promoted are
      offered to it, and on a repo scan the master curates everything — so five of six observed runs
      logged that it checked nothing. The exemption's reasoning was that the master read the code and
      its curation is authorship; twelve runs that produced none of five defects a direct probe found
      do not support that much authority.
  - key: |
      WIDENING THE SELECTION WITHOUT CHANGING THE FATES SHIPS A DELETION. A candidate that resolves
      to nothing is removed from delivery today. A master finding cites a file with a line, which is
      exactly what makes the source resolver claim it — so the moment master findings enter the
      checked set, every one whose path the resolver cannot read is silently deleted. That is the
      opposite of the phase's purpose and the single most dangerous thing in this batch.
  - key: |
      THE RESOLVER READS ONE SANDBOX AND THE MASTER READS ALL OF THEM. The evidence factory takes the
      single default sandbox while the master addresses every repository in the run, and the merge
      needs suffix-normalised path comparison for exactly the prefix mismatch the plain reader does
      not do. On a multi-repo scan that is not an edge case, it is every finding in the second
      repository.
  - key: |
      A WINDOW AROUND A LINE THAT DOES NOT EXIST IS NOT EVIDENCE. The window builder answers an
      out-of-range line with a sentence saying the line does not exist — a non-null candidate. The
      refuter is then shown that sentence, refutes on it, and satisfies the quote check by quoting it.
      A true finding is downgraded with a clean audit trail. Such a candidate is never sent.
  - key: |
      TWO FINDINGS AT ONE LOCATION ARE TWO FINDINGS. Verdicts are matched by the displayed location,
      so an authorization gap and an injection on the same line share one string and one verdict
      silences both. On the api path the location is just the endpoint, where collisions are the norm.
  - key: |
      THE CALL ALREADY SENDS EVERY CANDIDATE AT ONCE, AND HAS NO OUTPUT BUDGET. What breaks at thirty
      findings is not the number of calls — there is one — but that the answer truncates, the strict
      reader throws, and the whole step no-ops invisibly. It fails open, which is safe, and silent,
      which is not. The budget and a truncation-tolerant read are the real fix; batching was the wrong
      diagnosis.

steps:
  - id: a-delivered-finding-is-checkable-whoever-made-it
    action: "The checked set is every delivered finding, and a finding that fails to resolve is delivered unchanged rather than dropped."
  - id: the-evidence-is-found-where-the-master-read-it
    action: "The evidence resolver reads across every sandbox in the run and normalises paths the way the merge already does."
  - id: a-line-that-does-not-exist-is-not-evidence
    action: "A citation outside the file it names is never sent to the refuter as evidence."
  - id: a-verdict-answers-one-finding
    action: "Verdicts are routed by finding identity, so two findings sharing a location are answered separately."
  - id: the-answer-has-room-and-survives-a-cut
    action: "The refutation call states its own output budget and its answer is read tolerantly instead of throwing the step away."

tests:
  - "Refuter_IsAskedAboutAMastersOwnFinding"
  - "Refuter_MasterFindingWhoseFileCannotBeRead_IsStillDelivered"
  - "Refuter_MasterFindingInASecondRepository_IsResolved"
  - "Refuter_IsNotAskedAboutALineTheFileDoesNotHave"
  - "Refuter_TwoFindingsAtOneLocation_AreAnsweredSeparately"
  - "Refuter_ManyFindings_AnswerIsReadEvenWhenTruncated"
  - "Refuter_Silence_LeavesEveryFindingStanding"

done:
  - "a run with findings never again reports that nothing was checked"
  - "no run delivers fewer findings than today unless a refutation was accepted with a quote"
  - "a refuted finding is downgraded and says why"
  - "build green, full suite green"
