  - claim: "Filing one phase creates a ticket with the phase label and the approved-set stamp, records the set under it, and starts it."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/OutcomeTicketFiler.cs:101-113"
  - claim: "The epic filer creates the work ticket, stores the ordered children under it, files one record per slice, comments the record references onto the work ticket, and starts the work ticket last."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/EpicTicketFiler.cs:77-89"
  - claim: "A store that fails is the filing's error and names the ticket that must not be triggered; only the epic path has that message."
