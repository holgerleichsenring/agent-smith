# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-22-b3d7

goal: "An approved cut files ONE ticket, so the slice records nothing routed and no machine read stop being written and no filing carries the phase-epic label again."

applies_to: "backend (the spec-dialog filing path) + dashboard (the approval card's count)"

scope:
  in: >
    Approving a cut files FOUR tickets where the operator asked for one: the work ticket that
    carries the whole approved set, and one record ticket per slice beside it. The records are
    provably redundant — the work ticket's own body already prints one bullet per slice, carrying
    its id, its goal and its requires: edges, under a "## Slices" heading, and the record filer's
    own doc says of them that nothing routes them and no machine reads them. They exist so a person can read a
    slice on its own, which is the one thing the body they duplicate already does.
    They also cost what a redundant ticket costs: a create and a parent-link call per slice, a
    second comment on the work ticket listing them, one more note channel to explain a link that
    did not land — and the framework label `phase-epic` on every one of them.
    This phase deletes the record filer. Filing an approved cut creates the work ticket, stores the
    ordered set under it and starts it, exactly as it does today, and stops there. The CUT does not
    move into the code: the model still decides the slices, the parser still checks them and the
    orderer still puts them in dependency order — only the filing stops being a second set of
    tickets. The `epic` outcome kind survives as the model-facing shape, for the reason in the
    decisions.
    The two filing paths become one. A phase and a cut both file one ticket, store a set under its
    spec key and start it; the only differences left are the body, the filing role and the size of
    the set. They are folded into one path, which also gives a lone phase the store-failure message
    the cut already has — the same hazard, named for both.
  out: >
    THE PARENT-LINK PORT AND ITS CONFIG KEY. `ITicketProvider.LinkToParentAsync` has exactly one
    caller — the record filer — and the tracker's `parent_link_type` key exists to serve it. They
    stay, dead, because removing them reaches four provider implementations, the config schema, the
    config-studio capability descriptor and the dashboard's tracker form: a port-and-config removal
    wearing a filing change's clothes. Named in prose as the phase that removes a parent link with
    no caller.
    THE DESIGN-PARTNER MASTER. The PINNED release this product embeds promises nothing about how
    many tickets a cut becomes — its epic section describes the outcome block's shape and no ticket
    count — so an unchanged skill still produces a working filing and this phase needs no pin bump.
    The sentence about one record per slice exists only in the skills repository's UNRELEASED head.
    That inverts the urgency: the risk is not a lagging pin, it is that the unreleased commit
    INTRODUCES a promise the product will no longer keep, so the skills change must land before
    that commit releases or the next routine pin bump ships a master that is wrong. A separate pull
    request there, named here so it is not discovered afterwards.
    A SIBLING THAT EDITS THE SAME RENDERER. The phase that makes a filed ticket say it records
    rather than steers rewrites the specification section of this same file. Whichever lands first,
    the other rebases; they do not overlap in what they change, but they touch one file.
    THE TRACKER LEVEL. Nothing in the code ever chose Epic: which native work-item type a filed
    role becomes is the tracker's `work_item_kinds` map, and an installation that wants a Feature
    or a Story sets `work:` to it. That is configuration, not this phase.
    RENAMING THE `epic` KIND. The word reaches the outcome block, the stored proposal JSON, the
    turn kind and the dashboard union, and a stored row carrying `"epic"` is read back by kind —
    an unknown one throws. A rename buys a word and costs a migration.
    THE READ-BACK OF FILINGS ALREADY STORED. Untouched, deliberately: see the decisions.

decisions:
  - key: |
      THE BODY ALREADY IS THE SLICE LIST, SO THE RECORDS WERE A SECOND COPY OF IT. The work
      ticket prints every slice with its goal and its requires: edges, under its own heading, and
      carries the specification pointer that says where the approved set lives. A record ticket
      adds a per-slice title, a goal and a done list for a reader — and a fourth row on a board, a
      label, a link and a note when the link fails. One ticket that lists three slices and three
      tickets that each state one is the same information at four times the bookkeeping.
  - key: |
      THE `epic` KIND SURVIVES; ONLY THE FILING SHAPE CHANGES. Collapsing the kind into the phase
      outcome is not a simplification, it is a deletion of checks. A phase outcome carries ONE
      draft and arrives as a bare ```yaml block that validates exactly one spec, so a set of two
      or more has no representation on that path at all. Everything that makes a cut a cut lives
      in the epic parser: at least two children, the phase cap, a done list on every child, and
      the requires: edges checked for siblings and cycles — none of which a single draft can say.
      The parent draft is the work ticket's requirement text and has nowhere else to live. The
      kind is how the MODEL says "this needs several slices"; the filing is how many tickets that
      costs, and only the second one was wrong.
  - key: |
      THE LABEL'S WRITER GOES AND ITS READER STAYS — THIS IS THE MIGRATION ANSWER. `phase-epic` is
      refused by ProjectResolver BEFORE every other resolution rule, because every other rule ends
      in something and one of them would claim the ticket. The records already on the operator's
      board carry it and are not going to be deleted by this phase. If the reader went with the
      writer, every one of those tickets would become an ordinary ticket the moment it is polled
      or edited — routable by tag, by area path, by repository, and then run. The renderer's own
      doc says this in as many words about renaming the value. So: nothing the framework files
      carries the label again, and the incoming path keeps refusing it, with its doc rewritten to
      say WHOSE tickets it is refusing — the ones filed before this phase, and none filed after.
  - key: |
      HISTORY IS READ BACK, SO `FiledStartState.Record` STAYS. A filing is serialized onto the
      session row and read back by the pane and by the filed-work reader, and that enum is
      serialized BY NAME. Delete the member and every stored epic filing fails to deserialize —
      and the reader's catch shows an unreadable row as absent, so the operator would not get an
      error, they would get a filing that silently no longer exists. The reader also uses that
      state to skip the run lookup for a record, which is still the right answer for the rows that
      carry it. Nothing writes it after this phase; the same goes for the report's notes, whose
      only writer was the record filer.
  - key: |
      ONE FILING PATH, NOT TWO. With the records gone, filing a phase and filing a cut are the
      same three acts — create one ticket from a rendered body, store the approved set under its
      spec key, start it — differing only in the body, the filing role and the length of the set.
      Two classes for that is two places for the next change to land in one of. Folding them also
      settles an inconsistency: a store that fails after the ticket exists is a broken hand-off
      either way, and today only the cut's path tells the operator which ticket must not be
      triggered. The ROLE stays per call site, because an installation may map `work` and `phase`
      to different native types.
  - key: |
      THE `record` FILING ROLE GOES WITH THE RECORDS. It is an operator-facing wire key, so the
      schema sentence that lists the roles — and explains itself by talking about slice records —
      changes with it. A stale `record:` entry in a live config still validates and is warned
      about as an unknown role, which is exactly what it now is: a key that files nothing.

steps:
  - id: the-requirement-tests-are-repointed-not-deleted
    action: "The tests that exercised the child-requirement renderer for behaviour the surviving renderers still have — the absent fenced block, the scope halves, the omitted steps, a block-scalar criterion, a free-text precondition — are repointed at those renderers rather than removed with it; only the sibling-filter tests go with the filter."
  - id: the-harness-preset-asserts-the-new-shape
    action: "The harness preset that pins today's three-ticket shape, its record-only labels and its two links is rewritten to the one-ticket shape, because the gate runs the harness presets and this phase cannot commit without it."
  - id: record-filer-deleted
    action: "EpicSliceRecordFiler and its registration are deleted, with the per-slice create, the parent link and the 'Slices filed' comment on the work ticket."
  - id: filing-path-unified
    action: "Filing a phase and filing a cut become one path that renders a body, creates one ticket with the phase label and the approved-set stamp, stores the set under its spec key and starts it; a store that fails names the ticket that must not be triggered, for both."
  - id: record-label-reader-kept
    action: "Nothing written by the framework carries phase-epic any more. ProjectResolver's refusal and FiledTicketLabels' reader stay, and their docs say the tickets they refuse are BOTH generations that carry the label: the epic parent summaries filed before the label's meaning widened, and the slice records filed up to this phase."
  - id: record-body-and-role-removed
    action: "PhaseTicketRenderer.RenderChildRequirement goes with its only caller, the now-always-empty sibling filter goes out of the requirement body, and TicketFilingRole.Record goes with the schema sentence that lists the roles."
  - id: surfaces-count-one-ticket
    action: "The filing summary and the dashboard approval card stop counting slice records; FiledStartState.Record and the filing notes stay readable for filings already stored."

tests:
  - "Filing_AnApprovedCutOfThreeSlices_CreatesExactlyOneTicket"
  - "Filing_AnApprovedCut_StoresTheWholeOrderedSetUnderThatTicket"
  - "Filing_AnApprovedCut_WritesNoTicketCarryingTheRecordLabel"
  - "Filing_AnApprovedCut_ListsEverySliceAndItsRequiresEdgesInTheTicketBody"
  - "Filing_ACutWhoseEdgesCannotBeOrdered_IsStillRefusedBeforeAnyTicketExists"
  - "Filing_AStoreThatFails_NamesTheTicketThatMustNotBeTriggered_ForAPhaseAsWellAsACut"
  - "ProjectResolver_AnEnvelopeCarryingTheRecordLabel_StillResolvesToNoProject"
  - "FiledWork_AStoredFilingCarryingARecordState_StillReadsBack"
  - "EpicOutcomeParser_ACutOfTwoOrMoreSlices_StillResolvesToAnEpicOutcome"
  - "FilingNotice_AnApprovedCut_CountsOneTicketAndNoRecords"
  - "ApprovalCard_ACutProposal_SaysOneTicketAndCountsNoRecords"

done:
  - "approving a cut files exactly one ticket, whatever the slice count"
  - "that ticket carries the phase label, the approved-set stamp, the ordered slice list and the specification pointer it carries today"
  - "no ticket the framework files carries phase-epic"
  - "the incoming path still refuses a ticket that carries it, so the records already on a board stay unroutable"
  - "a filing stored before this phase still reads back on the filed tab and in the pane"
  - "the approval card and the filing notice both count one ticket"
  - "a store that fails after the ticket exists names that ticket, whether one phase or a cut was filed"
  - "build green, full suite green"

