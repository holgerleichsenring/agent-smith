assumptions:
  - claim: "No slice record already on a tracker is expected to become routable later — they are read, closed or deleted by hand."
    check: "Ask the operator what should happen to the records filed before this phase; the answer decides nothing in the code, because the refusal stays either way, but it decides whether a follow-up closes them."
  - claim: "No installation maps the `record` role in a tracker's work_item_kinds, so removing the role costs nobody a working configuration."
    check: "Grep the deployed server configuration for work_item_kinds and read its keys; a record: entry there is warned about after this phase and should be removed with it."
  - claim: "The embedded skills pin in this tree still carries the master text that describes the record shape, so the product and the master disagree from this phase until the skills release lands and the pin is bumped."
    check: "Read the pinned version, then read that RELEASE TAG's copy of the master in the skills repository — never the working tree, which carries unreleased commits."
  - claim: "Nothing outside the spec-dialog filing path creates a ticket carrying the record label."
    check: "grep the backend for PhaseTicketRenderer.EpicLabel after the change: the only remaining references should be the constant, the incoming-path reader and their tests."
