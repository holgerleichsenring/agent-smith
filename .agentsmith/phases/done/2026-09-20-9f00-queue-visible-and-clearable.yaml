# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-20-9f00

goal: "A run that enqueues announces itself, and deleting one disarms its ticket, so a queue an operator can see is also a queue an operator can clear."

applies_to: "backend (the spawn deferral and the run deleter); the surface changes nothing and is only nudged"

scope:
  in: >
    Two defects an operator hit at once: they found a pile of queued phase runs the surface had
    never shown them, deleted it by hand one row at a time, and the pile came back.
    A run that DEFERS is written straight through the repository, and the use case that writes it
    holds no event publisher at all — the repository's own note says so in three words: no lease,
    no events. The surface refetches only when it is nudged, on reconnect, or on mount; there is no
    poll. So the counter reads zero while the rows exist, and it is worst exactly when capacity is
    exhausted, because then nothing else is running to nudge it either.
    DELETING a run removes the queue entry, the capacity reservation and the run, and deliberately
    leaves the tracker ticket alone. For a run WITH A RESULT that is right. For every run without
    one it is not — queued, RUNNING and PARKED alike, with no exception: the deleter already branches
    on having no result, and inside that branch it kills the job, releases the lease under this
    run's id and drops the queue entry while never touching the ticket. The native status only
    moves at run-end, so the ticket is still armed, and re-pickup is gated on the lease rather than
    on any label. The next poll re-claims it as a fresh run — at the BACK of the queue, because the
    entry's id is the queue order. Cancel already answers this, for the running branch as much as
    the queued one. Delete does not, so an operator's cleanup undoes itself.
  out: >
    THE QUEUE'S OWN BEHAVIOUR — no cap, no expiry, one global first-in-first-out across every
    project, and a head with no initial context that the pump returns on before any drop path, which
    stalls the whole estate behind it. That is a different premise: this phase makes a queued run
    visible and clearable, it does not change who gets to run. It belongs beside
    2026-09-18-3ba9-sandbox-cap-is-honoured, which names the strict-order stall in its own words and
    whose remedy does not reach it. Named in prose as the phase that gives the queue an expiry and a
    way past a head that cannot advance. Deferring it is correct rather than merely convenient:
    after this phase the stalled head has a visible row and delete works on any state, so an
    operator can clear a stall by hand. The queue still refills for the head-of-line reason, but it
    stops being invisible AND unclearable at once.
    TERMINALIZING THE TICKET OF A RUN WITH A RESULT. The deliberate hands-off there is correct and
    stays. What changes is every run that has no result yet, with no exception — an earlier cut
    carved out a parked run and was wrong: two mechanisms park a run and only one of them moves the
    ticket, so the carve-out would have excluded exactly the case this phase exists for.
    THE ROUTING TAG. An early reading of this pile blamed a filed ticket not carrying the tag its
    project resolves by. That defect is real and specced elsewhere, and it is NOT this: the filer
    resolves before it moves and refuses to move what will not route, so an unroutable ticket
    produces no run row at all. It causes silence, not a pile.
    THE TICKET-SCOPED QUEUE REMOVAL BESIDE THE BRANCH THIS PHASE EDITS. Dropping a queue entry on
    force-clear is keyed by project and ticket rather than by run, so deleting an old row can drop a
    newer sibling's entry. Pre-existing, untouched here, and named because this phase edits that
    exact branch and the next reader should not have to rediscover it.
    THE RESUME ENQUEUE. A third caller enqueues without writing a run row at all — it reuses the
    parked row — so it forms no invisible pile and is out of scope. It does shift queue positions
    without a nudge, which is the same class of defect one size smaller.
    BULK CLEARING. Clearing is terminal-only by design and excludes a queued row, which is why this
    was a manual chore. Whether an operator may clear a queue in one action is a surface question
    and is named in prose as the phase that gives the queue a clear.

decisions:
  - key: |
      A QUEUED RUN IS A RUN THE SURFACE NEVER HEARS ABOUT. Two places publish the change that makes
      the surface refetch: the persisted run-event fanout and the delete endpoint. The deferral path
      is neither — it writes the visible row through a repository documented as taking no lease and
      publishing no events, from a use case with no publisher in its constructor. The bucketing is
      correct and the row really is returned as active, so nothing is wrong with the counter's
      arithmetic; it is simply never told to ask again. An operator watching a zero while rows pile
      up is being shown a stale number, not a wrong one, and no amount of reading the counter's code
      finds it.
      ONE OTHER PATH WRITES A QUEUED ROW SILENTLY AND DOES NOT MATTER. A manual init launcher
      writes a queued row before the real start and publishes nothing either; it is short-lived,
      because the genuine started event follows from the worker. So the deferral path is the
      gap that accumulates, not the only silent write — an earlier cut said the only, and that was
      too strong.
  - key: |
      DELETE IS RIGHT FOR A RUN WITH A RESULT AND WRONG FOR EVERY RUN WITHOUT ONE — AND THE
      BOUNDARY IS NOT "QUEUED". Leaving the ticket untouched is a deliberate, documented choice,
      and it holds for a run that finished. An earlier cut drew the other side at the queued state
      and was wrong by a whole class: the deleter already branches on whether the run has a result,
      and inside that branch it kills the pod, releases the lease under this run's id and drops the
      queue entry — for a RUNNING run as much as a queued one. A running run whose lease the
      deleter has just released is in exactly the position a queued one is in: the ticket is still
      in the trigger statuses, because the native status only moves at run-end, and re-pickup is
      gated on the lease rather than on any label. The next poll re-files it.
      SO THE PREDICATE IS THE ONE THE CODE ALREADY HAS: no result yet. That is the branch that
      force-clears, and it already holds the project, the ticket and the run id the finalizer needs.
      AND THE SYMMETRY WITH CANCEL IS WIDER THAN AN EARLIER CUT CLAIMED. Cancel does not terminalize
      only a queued run — it terminalizes the running branch too, and its own note says why in the
      same words this decision arrives at independently: the cooperative cancel finished the run
      and released the lease without touching the ticket, so the ticket stayed in trigger statuses
      and the next poll re-claimed it. Appealing to cancel for the queued case alone borrowed an
      authority narrower than the one that exists.
      A PARKED RUN IS NOT EXCLUDED, AND THE EXCLUSION AN EARLIER CUT ADDED RESTED ON A FALSE
      UNIVERSAL. That cut said a run reaches the waiting state only through a park that finalizes
      its ticket into a clarification status, so its ticket is out of discovery's reach. TWO things
      park a run, and the contract that models parking says so in its own words. One is the master
      asking a mid-run question, which does move the ticket. The other is the dialogue ask gate:
      it publishes the question to the dashboard, checkpoints, sets the waiting flag and touches
      the tracker NOWHERE — not one call. Its park exits through the same finally that releases the
      lease, so the ticket is still armed, discovery excludes nothing because no status was set,
      and the next poll re-claims it. That is exactly the defect this phase exists to close, and
      the exclusion carved it out. Nothing on the run row distinguishes the two producers.
      SO THE PREDICATE IS THE BRANCH THE CODE ALREADY HAS, WITH NO EXCEPTION: no result yet. That
      also matches cancel, which terminalizes a parked run's ticket today — the queued path declines
      it and it falls through to the terminalize. An exclusion would have made delete diverge from
      cancel in the one state where cancel does the thing.
      THE NEW CALL CANNOT REPEAT ON THE TICKET WHAT AN EARLIER PHASE STOPPED ON THE LEASE. Releasing
      a lease is scoped to this run's id because an older row can coexist with a newer run on the
      same ticket, and a live test pins it. The ticket call takes no run id in its arguments, so the
      question is fair — and the finalizer carries its own ownership guard: it reads the ticket's
      lease and skips when that lease names a different run. So a delete of an old row leaves a
      newer run's ticket alone, which also means disarming is CONDITIONAL and the done criterion
      says so rather than promising it unconditionally.
      THE COST OF INCLUDING IT IS ACCEPTED AND STATED. Terminalizing a parked run's ticket moves it
      onto the failed-status chain and strands the link from a posted question to its answer, and
      the delete drops the pending resume entry regardless. That is the price of a delete meaning
      the same thing in every state, and the finalizer is fail-soft, so a tracker that will not
      answer cannot fail the delete.
      THE FINALIZER IS NOW MISNAMED AND THAT IS LEFT ALONE. Its name and its summary say it ends a
      CANCELLED run's ticket; after this phase a delete uses it too. Renaming a type is a change of
      its own; what this phase owes the next reader is the sentence that both callers exist.
      AND THE COMMENT THE FINALIZE CARRIES SAYS WHAT HAPPENED. Cancel passes "cancelled by operator
      while queued". A delete did not cancel anything, so it passes its own wording rather than
      asserting an act that did not occur.
  - key: |
      THE DOCUMENTED CHOICE THIS REVERSES WAS NEVER PROVEN. One test pins the hands-off behaviour,
      over a QUEUED run, and it is vacuous: the deleter takes no ticket collaborator at all, so the
      mock it asserts was never called is unreachable from the code under test. It passes by
      construction and always would. This phase rewrites it rather than deleting it, and the
      replacement must FAIL if the terminalize call is moved outside its guard — otherwise the new
      hands-off test inherits the same emptiness.
  - key: |
      IT COMES BACK AT THE BACK, WHICH IS WHY THE OPERATOR NOTICED. The queue entry's identity is
      its order, so a re-filed ticket does not resume its place — it goes behind everything filed
      since. A cleanup that silently reshuffles is worse than one that does nothing, because the
      operator cannot tell the difference without reading the database.
  - key: |
      PUBLISHING IS NOT DELIVERY HERE, AND AN EARLIER CUT ASSUMED IT WAS. The obvious fix is to
      publish a run event on enqueue and let the existing fanout carry it. It would reach nobody: a
      stream is drained only for a run the broadcaster tracks, a cursor is created only for run ids
      in the active set, and that set is populated by the STARTED event alone. A deferred run never
      published one, so its event lands in the stream and dies there. This tree already knows it —
      two mechanisms exist solely because a run outside the active set gets no delivery, and one
      says in its own words that both entry points needed what publishing alone could not give
      them. An earlier cut of this decision chose the event shape by what its PROJECTOR would do to
      the row and never asked who routes it.
      AND THE OBVIOUS SHAPE WOULD HAVE MADE THINGS WORSE. The finished-event shape also pushes the
      run id onto the recent-runs list, capped at fifty. Every deferral would evict a genuinely
      recent run from that list — so a pile of queued runs, which is the case this phase exists
      for, would empty the surface of the runs an operator actually wants to see. Worse than the
      stale count it replaces.
      THE NUDGE REACHES ONE REPLICA, WHICH IS THE DOOR'S OWN PROPERTY. There is no backplane behind
      the hub, so a nudge reaches the clients connected to the replica that raised it. The delete
      endpoint is single-replica in the same way, though not identically: its nudge fires on
      whichever replica served the request, while a deferral always fires on the leader. Narrower
      than a fanout would have been, and strictly better than the nothing that exists today.
      SO THE SURFACE IS NUDGED DIRECTLY. The delete endpoint already does exactly that, and the
      nudge is what the surface listens for. What it must not do is make the deferral depend on it:
      a deferral that fails because a hub is down would lose the queue entry, which is strictly
      worse than a stale count. The row is written first and the nudge is best-effort.
  - key: |
      THE DIALOG COMPETES FOR THE SAME BOUND, AND THAT IS WORTH KNOWING BUT NOT FIXING HERE. A
      design turn opens source-scope sandboxes and the probe counts distinct jobs against a bound
      whose built-in default is two. So a live design conversation can consume the slot that defers
      the first phase run, and everything filed after it queues behind that. Stated because an
      operator seeing a pile form while they are talking to the dialog should find the reason
      written down; changing the bound or exempting the dialog is the queue phase's question.

steps:
  - id: a-deferral-announces-itself
    action: "The path that writes a queued run NUDGES the surface directly, the way the delete endpoint already does, after the row is written and without the write depending on it. It does NOT publish a run event: a deferred run was never in the active set, so no cursor is ever created for its stream and nothing drains it — the tree already carries two mechanisms built for exactly that gap. The nudge crosses assemblies through a small port. The no-op is registered in the shared server composition and the hub-backed implementation inside the dashboard-API registration, which is what adds the hub and which runs AFTER that composition — so a server started with the UI API disabled resolves the no-op instead of failing to resolve a hub that was never added. Registered the natural way, beside the use case, such a server cannot resolve the spawn use case at all and fails late at the first poll rather than at startup. 'Elsewhere' is that configuration, not the CLI, which never constructs this use case."
  - id: deleting-a-queued-run-disarms-its-ticket
    action: "Deleting a run that has no result yet terminalizes its tracker ticket the way cancelling one already does — on the branch that already force-clears it, which is where the project, the ticket and the run id are in hand. A run with a result keeps the deliberate hands-off, and the vacuous test that pinned that behaviour is rewritten so it can fail."

tests:
  - "Spawn_ARunThatDefers_NudgesTheSurface"
  - "Spawn_ANudgeThatThrows_StillLeavesTheQueueEntryWritten"
  - "RunDeleter_AParkedRun_TerminalizesItsTicketLikeAnyRunWithNoResult"
  - "RunDeleter_AQueuedRun_TerminalizesItsTicket"
  - "RunDeleter_ARunningRun_TerminalizesItsTicket"
  - "RunDeleter_ARunWithAResult_LeavesItsTicketUntouched"
  - "RunDeleter_ATicketFinalizerThatFails_StillDeletesTheRun"

done:
  - "a queued run appears in the count as it enqueues, not on the next unrelated event"
  - "the deferral reaches the surface by the same door the delete endpoint uses; that it publishes no run event is the constructor signature, not a test"
  - "a deleted PARKED run is disarmed too, including the park that never touched the ticket — unless a newer run has already reclaimed the ticket, where the finalizer's own ownership guard skips and the newer run keeps it"
  - "a deleted queued run is not re-filed by the next poll — inferred from the terminalize, as cancel already infers it, and not separately proven"
  - "a deleted RUNNING run is not re-filed by the next poll either — the case an earlier cut left out"
  - "a deleted run WITH A RESULT still leaves its ticket alone, proven by a test that can fail"
  - "a deferral survives a nudge that throws"
  - "build green, full suite green, dashboard tests green"

