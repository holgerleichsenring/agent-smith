# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-24-c71a
goal: "Every place that teaches what meta.workdir means says COMPONENT ROOT, and every place that claims it places a command or a guard stops claiming it."

applies_to: "backend"

decisions:
  - key: |
      A LIVE CONTEXT.YAML IS THE EVIDENCE, AND IT IS WRONG IN THE WAY THE PROMPT ASKS FOR. An
      Angular component whose manifests sit at `<Component>/package.json`, `angular.json`,
      `tsconfig*.json` and `jest.config.js`, and whose sources sit under `<Component>/src`, was
      recorded as `meta.workdir: <Component>/src`. The verify block of the same document is right —
      `cd <Component> && npm run build` — because since 2026-09-03-7bac a command runs at the
      repository root and whoever looked at the tree writes the directory into the command. The two
      disagree because they are produced by different means: the command by looking, the workdir by
      answering a question whose wording invites the deeper path.
  - key: |
      THE WORDING IS THE DEFECT, NOT THE MODEL. BootstrapDiscoverPromptFactory asks for "the
      repo-relative sub-tree this component's SOURCE occupies, read off the tree — e.g. server,
      src/api". For a component whose sources live under `src/`, that IS `<Component>/src`, and the
      example `src/api` teaches pointing INTO a source directory rather than at a component root.
      The model answered the question it was asked.
  - key: |
      THE NEW SENTENCE NAMES A FILE, AND HAS AN ANSWER FOR COMPONENTS THAT HAVE NONE. "The component
      ROOT — the directory holding the manifest that governs THIS component (package.json, *.csproj,
      pyproject.toml, go.mod, ...); where a component has no manifest, the directory its evidence
      path sits in; `.` only where that directory is the repository root." Three things are
      deliberate. A manifest is a thing on disk the answerer can point at, where "where the source
      lives" is a judgement — and a judgement produced the path one level too deep. `*.sln` is NOT
      in the list: a solution spans components and sits at the root of repositories whose components
      are sub-trees, so anchoring on one would answer `.` for every component in this very
      repository. And the evidence fallback exists because markdown and terraform components are
      first-class in the discovery vocabulary and carry no manifest at all — without it the sentence
      would have no answer for them and its `.`-clause would pull them to the root.
  - key: |
      THIRTEEN SITES, AND THREE OF THEM WERE MISSED ON THE FIRST READING. Four decide the value: the
      discovery prompt's JSON shape and the rule under it, the write tool's description, and the
      serializer's refusal. Three more are model-facing and were missed — ContextWorkdirCommandsRule,
      whose refusal is handed back to the writing round (and whose parenthetical "not copied from the
      cd" becomes actively wrong once the cd enters a manifest directory); `.agentsmith/context.schema.json`,
      an embedded resource judged against every written document; and `.agentsmith/schemas/discovery.schema.json`,
      which the discovery prompt cites by name as its output schema. The remaining five are XML docs.
      A prompt written from a stale doc is how one sentence reached thirteen places.
  - key: |
      THE IMPACT CLAIM IS NARROWED TO WHAT THE CODE DOES: a wrong workdir MISLEADS, it does not
      scope. AnalyzeProjectHandler hands SubTreePath to the analyzer, but ProjectAnalyzer turns it
      into one prompt line and constructs FilesystemToolHost with NULL guards — nothing roots the
      tools, and 7bac's own live evidence records the analyzer being handed a component sub-tree and
      listing '.', finding the root solution file and a sibling test project. The measurable costs
      are a prompt that points at a directory holding no manifests, and a ProjectMap cache key that
      finds none there and degrades to HEAD-only — benign, because HEAD still invalidates. Every
      other reader logs, prompts or tabulates the value.
  - key: |
      THE SAME PASS REMOVES THREE FALSE CLAIMS ABOUT WHAT WORKDIR DOES. WriteContextYamlToolDescription
      still tells the model that verify stages "run at this context's workdir", that
      verify_derived_from.files are "relative to meta.workdir", and that the probe runs there;
      ContextYamlSummary claims workdir "scopes analysis and this context's read/write guards"; and
      context.schema.json claims "the sandbox coordinator clones at this path, so /work is this
      sub-tree". All are false against the code — stages and probe resolve to Repository.SandboxWorkPath,
      the derivation digest resolves from the repository root, every guard is constructed on /work,
      and /work IS the repository root. Correcting only the meaning of the field while leaving these
      would leave the model three reasons to believe the meaning we just removed.
  - key: |
      CommandWorkingDirectory IS DELETED, BECAUSE IT STILL TEACHES THE BELIEF 7bac ABOLISHED. Its
      summary reads "Operator override: a context.yaml meta.workdir other than '.' wins" and derives
      a cwd for prerequisites and test commands — the exact anticipation that reported a correct
      delivery red in the run 7bac was cut from. Its last caller was removed by p0224; today only its
      own unit test references it. A dead class that contradicts the live contract is worse than no
      class: the next reader finds two answers and no way to tell which one runs.
  - key: |
      THE WORDING IS PINNED WHERE IT IS ALREADY PINNED, NOT IN A NEW CLASS. 2026-09-23-7868a shipped
      three assertions on the exact strings this phase replaces — in BootstrapDiscoverHandlerTests,
      WriteContextYamlToolHostTests and ContextYamlSerializerTests. They are the reason the suite
      would go red on the first edit, and they are the right home for the new assertions: a fourth
      test class re-asserting the same strings would be a second place to disagree. Each is rewritten
      to demand the new sentence and to refuse the old one, so a later edit that restores "where the
      SOURCE lives" fails in the suite rather than in somebody's repository.
  - key: |
      THE SKILLS HALF IS NOT DONE EITHER, AND IS NAMED RATHER THAN ASSUMED. agentsmith-skills#199
      (pinned as v5.7.1) corrected project-discovery, whose step 4 now says "the repo-relative path
      of the component root". But the round that PERSISTS the value reads project-bootstrap, which
      still says "that field says where the component's SOURCE lives" and instructs the writer to
      copy the path from the prompt. That correction belongs in the skills repository and ships
      beside this phase; without it the chain still carries one copy of the old sentence. The
      corollary is that "the write tool's description governs what is persisted" is NOT true — the
      skill tells the round to carry the discovery answer through, so the discovery prompt is where
      the value is decided.

steps:
  - id: the-four-deciding-sites-name-the-manifest
    action:
      - "Rewrite the workdir wording in the discovery prompt's JSON shape and its closing rule, in the write tool's description and in the serializer's refusal, so all four ask for the component root, name a manifest and give the evidence fallback."
      - "Replace the `src/api` example, which teaches pointing into a source directory, with a component-root example and a src-layout counter-example."
    modify:
      - "src/backend/AgentSmith.Application/Services/BootstrapDiscoverPromptFactory.cs"
      - "src/backend/AgentSmith.Application/Services/Tools/WriteContextYamlToolDescription.cs"
      - "src/backend/AgentSmith.Infrastructure/Services/ContextYamlSerializer.cs"

  - id: the-three-missed-model-facing-sites-follow
    action:
      - "Correct the refusal the writing round is handed, including the parenthetical that forbids reading the directory off a command's cd."
      - "Correct the two embedded schemas the model is judged against and whose description the discovery prompt cites."
    modify:
      - "src/backend/AgentSmith.Application/Services/Tools/ContextWorkdirCommandsRule.cs"
      - ".agentsmith/context.schema.json"
      - ".agentsmith/schemas/discovery.schema.json"

  - id: the-claims-that-are-false-are-withdrawn
    action:
      - "Stop telling the model that verify stages, derivation files and the probe are workdir-relative — all three resolve from the repository root."
      - "Stop claiming workdir scopes analysis or the read/write guards, and that /work is the sub-tree."
    modify:
      - "src/backend/AgentSmith.Application/Services/Tools/WriteContextYamlToolDescription.cs"
      - "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlSummary.cs"
      - "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlVerifyDerivation.cs"
      - "src/backend/AgentSmith.Contracts/Sandbox/RemoteContextDiscovery.cs"
      - ".agentsmith/context.schema.json"

  - id: the-five-descriptions-agree
    action: "Align the XML docs that describe the field, so a prompt written from them says the same thing."
    modify:
      - "src/backend/AgentSmith.Contracts/Models/DiscoveredComponent.cs"
      - "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlMeta.cs"
      - "src/backend/AgentSmith.Contracts/Models/Configuration/ContextYamlSummary.cs"
      - "src/backend/AgentSmith.Contracts/Sandbox/MetaDiscovery.cs"
      - "src/backend/AgentSmith.Domain/Models/PipelineCommand.cs"

  - id: the-abolished-belief-leaves-the-tree
    action: "Delete the dead cwd derivation and its test, and the stale csproj-at-the-workdir note left beside it."
    delete:
      - "src/backend/AgentSmith.Domain/Models/CommandWorkingDirectory.cs"
      - "tests/AgentSmith.Tests/Domain/CommandWorkingDirectoryTests.cs"
    modify:
      - "src/backend/AgentSmith.Application/Services/Handlers/VerifyPhaseHandler.cs"

  - id: the-existing-assertions-demand-the-new-sentence
    path: "tests/AgentSmith.Tests"
    action: "Rewrite the three assertions 2026-09-23-7868a placed on the old strings so they demand the component-root wording and refuse the old one."
    modify:
      - "tests/AgentSmith.Tests/Handlers/BootstrapDiscoverHandlerTests.cs"
      - "tests/AgentSmith.Tests/Application/Services/Tools/WriteContextYamlToolHostTests.cs"
      - "tests/AgentSmith.Tests/Services/ContextYamlSerializerTests.cs"

tests:
  - "BootstrapDiscoverHandlerTests: the prompt asks for the component root, names a manifest, and no longer asks where the SOURCE occupies"
  - "BootstrapDiscoverHandlerTests: the example no longer points into a source directory"
  - "WriteContextYamlToolHostTests: the description asks for the component root and no longer calls any stage workdir-relative"
  - "ContextYamlSerializerTests: the missing-workdir refusal asks for the component root"
  - "ContextWorkdirCommandsRuleTests: the refusal no longer forbids reading the directory off a command's cd"

done:
  - "the four deciding sites ask for the component root, name a manifest, and give the fallback for a component that has none"
  - "no model-facing site still asks for the sub-tree a component's SOURCE occupies — prompt, tool description, refusal, rule and both embedded schemas"
  - "no site still tells the model that a verify stage, a derivation file or the probe is workdir-relative, and none claims workdir scopes analysis or the guards"
  - "the five XML descriptions say the same thing as the sites that decide the value"
  - "CommandWorkingDirectory and its test are gone and the suite is green without them"
  - "the three assertions that pinned the old wording now pin the new one, and fail if it is reverted"
  - "the skills-side correction to project-bootstrap is opened beside this phase, so no copy of the old sentence is left in the chain"
