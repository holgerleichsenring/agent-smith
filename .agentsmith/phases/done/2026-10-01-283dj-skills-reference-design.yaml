# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-01-283dj
goal: "The design-partner and coding masters learn reference addresses, render_reference, compare_reference and DESIGN.md; source precedence says a reference's look is WHAT, its code is not."

applies_to: "skills (design-partner-master, coding-agent-master, references/source-precedence.md)"

requires: ["2026-10-01-283di", "2026-10-01-283dg"]

facts:
  - claim: "The design partner's subject already includes 'a page it must look like', and its tools are the two grounding tiers — code map, then source reads of the scoped repositories."
    evidence: "agent-smith-skills skills/_masters/design-partner-master/SKILL.md:24-30,38-53"
  - claim: "Source precedence makes a prototype or design the WHAT and denies its structure, naming, layering and code style any authority; every master reads it."
    evidence: "agent-smith-skills references/source-precedence.md:3-6,22-26; skills/_masters/design-partner-master/SKILL.md:70-76"
  - claim: "The coding master treats ticket images and converted documents as requirement data."
    evidence: "agent-smith-skills skills/_masters/coding-agent-master/SKILL.md:76-84"
  - claim: "The embedded skills pin moves in its own planned phase."
    evidence: ".agentsmith/phases/planned/2026-10-01-aeb6d-skills-pin-document-binding.yaml:1-8"

scope:
  in: >
    source-precedence.md, rule 4: a VISUAL reference — an uploaded site, a mock, a URL, DESIGN.md — makes its
    rendered appearance part of the WHAT (colors, type, spacing, radii, as computed values); its markup and
    stylesheet structure stay form without authority. Design partner: a reference: address is the
    operator's website, read its CSS for exact values; render_reference shows layout and states computed
    values; a phase built against a reference names the set in its goal or scope; DESIGN.md tokens are the
    project's own. Coding master: reference sets and a phase's mock are requirement data like ticket
    images; build, then compare_reference with paired selectors, and fix or name each remaining style
    difference in the verdict. Versions: next minor of each master.
  out: "The pin — it moves with 2026-10-01-aeb6d, which takes the release carrying this change. Any server behaviour."

decisions:
  - key: "DESCRIBE WHAT THE MODEL CAN DO. The text names the addresses and tools and what each returns; the computed value is offered first rather than estimation forbidden."
  - key: "LOOK IS WHAT, MARKUP IS FORM. Without the amendment rule 4 tells the coding master to ignore exactly the stylesheet it was asked to match."
  - key: "NO PIN PHASE OF ITS OWN. One pin move carries every merged skills change; 2026-10-01-aeb6d is that move."

steps:
  - id: precedence
    action: "references/source-precedence.md rule 4 amended."
  - id: design-partner
    action: "design-partner-master: references and DESIGN.md in grounding, render_reference, naming the set in a drafted phase."
  - id: coding
    action: "coding-agent-master: references and mocks as requirement data, compare_reference before the verdict, differences fixed or named."

tests:
  - "skills repo: the masters' placeholder and reference checks pass"
  - "after 2026-10-01-aeb6d: EmbeddedSkills_SourcePrecedence_MakesAVisualReferencesLookTheWhat"

done:
  - "the skills pull request is open; the pin moves in 2026-10-01-aeb6d"
