# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-01-283dd
goal: "Any tool can hand the loop an image: it enters the history once, as a user message right after the tool result, on providers that keep it; elsewhere the model is told it exists."

applies_to: "backend (a deposit point, a FunctionInvokingChatClient subclass, a provider capability, trace recording)"

requires: []

facts:
  - claim: "No tool result carries an image today; DataContent is built only for the first user message, from ticket attachments and dialog uploads, capped at ten and four."
    evidence: "src/backend/AgentSmith.Application/Services/Prompts/TicketImagePromptParts.cs:15-23; src/backend/AgentSmith.Application/Services/Prompts/DialogImageParts.cs:28,37-52"
  - claim: "The image path accepts png, jpeg, gif and webp."
    evidence: "src/backend/AgentSmith.Contracts/Models/TicketImageAttachment.cs:22-25"
  - claim: "The loop is built by ChatClientBuilder.UseFunctionInvocation over the decorator chain, for tool-bearing tasks."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientFactory.cs:166-167,194-196"
  - claim: "The governor's injected message is appended to a COPY of the list on every call, so it never enters the history and would be re-sent per iteration if used for images."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Agent/MasterLoopGovernorChatClient.cs:64-69"
  - claim: "VERIFIED IN THE DECOMPILED PACKAGES (by the 7f7a author): FunctionInvokingChatClient 10.3.0's CreateResponseMessages is virtual and what it returns is added to the history once; the Microsoft.Extensions.AI.OpenAI 10.3.0 adapter silently drops an image inside a tool message; Anthropic.SDK 5.10.0 sends a tool result as text and turns an image in the same tool message into a separate user message."
    evidence: "Microsoft.Extensions.AI 10.3.0, Microsoft.Extensions.AI.OpenAI 10.3.0, Anthropic.SDK 5.10.0 (src/backend/AgentSmith.Infrastructure/AgentSmith.Infrastructure.csproj:16-19)"
  - claim: "A Copilot continuation must consist of tool messages only."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/Copilot/CopilotPendingCalls.cs:32-36"
  - claim: "Worker mode maps an image part to an 'unsupported' note."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Workers/WorkerMessageMapper.cs:26-28"
  - claim: "Vision is a per-agent flag defaulting to true, so it cannot say that a provider drops images."
    evidence: "src/backend/AgentSmith.Contracts/Models/Configuration/AgentConfig.cs:50"
  - claim: "Builders build the bare client per agent type; wrapping is the factory's."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/IChatClientBuilder.cs:10-22"
  - claim: "The trace renders only TextContent of each message, so an image leaves no trace."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Agent/RecordingChatClient.cs:45-53"
  - claim: "A master's conversation is an in-memory list, not persisted."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/MasterConversation.cs:30-40"
  - claim: "ChatClientFactory is on the ratchet at 260 (244 today)."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:26"

scope:
  in: >
    IToolImageDeposit: a tool host deposits up to two images per call (media type in the set above, at most
    5 MB, long edge at most 1568 px — the producer's job, checked here) with a one-line caption naming the
    tool and the call id. The deposit is ambient per loop (AsyncLocal, like
    AsyncLocalSourceScopeObserverAccessor), opened by the loop runner, so a sub-agent's loop has its own.
    ToolImageFunctionInvokingChatClient replaces UseFunctionInvocation in ChatClientFactory and overrides
    CreateResponseMessages: after the tool messages it returns ONE user message carrying the captions and
    the images as DataContent, which the base class adds to the history once — never re-rendered per
    iteration and never appended to a copy. At most four images per loop; past that the message carries
    only a text line naming what was not shown. IChatClientBuilder gains AcceptsImageAfterToolResult
    (false for Copilot and the external worker, true for the rest); when it is false or the agent lacks
    vision, no image is sent and the user message says an image exists and was not shown. RecordingChatClient
    records each DataContent as one line: media type, byte size, sha256. After a resume the in-memory
    conversation is gone and no image is replayed; a model that needs the picture again renders again.
  out: >
    Producers: render_reference (2026-10-01-283de) and design_read (2026-10-01-7f7ac) deposit; neither owns
    placement. Persisting images across a resume.

decisions:
  - key: "ONE RELAY. Keyed on what a tool deposits, not on a tool name; the browser render and the Figma export are two producers of one kind of result."
  - key: "A USER MESSAGE AFTER THE TOOL MESSAGE. OpenAI drops an image inside a tool message and Anthropic splits it out anyway; a user message is the one shape every image-capable adapter keeps."
  - key: "ONCE, VIA CreateResponseMessages. The history the base class keeps is the only place an addition is paid once and cached thereafter."
  - key: "A PROVIDER CAPABILITY, NOT THE VISION FLAG. Vision says the model can see; whether the transport delivers is the builder's fact."

steps:
  - id: deposit
    action: "IToolImageDeposit + AsyncLocalToolImageDeposit + ToolImage (media type, bytes, caption); scope opened in AgenticLoopRunner."
  - id: invoker
    action: "ToolImageFunctionInvokingChatClient; ChatClientFactory builds it in place of UseFunctionInvocation without growing past its row."
  - id: capability
    action: "IChatClientBuilder.AcceptsImageAfterToolResult; the factory passes it and SupportsVision to the invoker."
  - id: trace
    action: "RecordingChatClient renders DataContent as media type, size, sha256."

tests:
  - "ToolImage_DepositedOnIterationOne_AppearsOnceInEveryLaterRequestDirectlyAfterTheToolMessage (scripted three-iteration loop)"
  - "ToolImage_SixInOneLoop_SendsFourAndNamesTwo"
  - "ToolImage_CopilotBuilder_SendsNoImageAndTheNote"
  - "ToolImage_AgentWithoutVision_SendsNoImageAndTheNote"
  - "ToolImage_SubAgentDeposit_DoesNotReachTheParentLoop"
  - "RecordingChatClient_Image_IsRecordedAsSizeAndSha256"

done:
  - "a scripted loop whose tool deposits a PNG sees it in the next request once, after the tool result, and the trace shows its hash"
  - "build green, full suite green"
