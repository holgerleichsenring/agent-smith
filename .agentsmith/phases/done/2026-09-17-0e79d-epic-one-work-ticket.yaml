  - "no record ticket is ever picked up by a poller or a webhook, and each is linked to the ticket that carries the work"
  - "one run works every phase of the epic and leaves one pull request per repository"
  - "no filing path files N phase tickets any more; an epic child filed by the old shape still derives, and the ticket-first path is unchanged"
  - "build green, full suite green, file-length ratchet green"
