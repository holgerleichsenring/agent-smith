    evidence: "src/backend/AgentSmith.Contracts/Services/GitTokenResolver.cs:19-27"
  - claim: "GitStepCredentials is a static class whose TokenEnv stamps that token into a step's env as GIT_TOKEN; the static CheckoutStepFactory and SourceScopeRefreshSteps call it."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/GitStepCredentials.cs:11-23; CheckoutStepFactory.cs:13,22-89 (Env at 38,53,68,89); SourceScopeRefreshSteps.cs:44"
  - claim: "Six callers build those static steps: SandboxRepoCloner, SourceScopeMaterialiser, SourceScopeRefresh, SandboxWorkBranchCheckout, SandboxRungPublisher and CreateOnlyBranchPush."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/SandboxRepoCloner.cs; src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeMaterialiser.cs; SourceScopeRefresh.cs; SandboxWorkBranchCheckout.cs; SandboxRungPublisher.cs; CreateOnlyBranchPush.cs"
  - claim: "Pushes carry only the repo type down to GitBranchPusher: CommitAndPushStagedAsync and PushHeadAsync take RepoType, and their callers pass repo.Type."
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:33-38,212,273-279; GitBranchPusher.cs:23-30; RepoWorkPusher.cs:50; src/backend/AgentSmith.Application/Services/Specs/SpecSetWriter.cs:64; src/backend/AgentSmith.Application/Services/Handlers/InitCommitHandler.cs:106; PersistWorkBranchHandler.cs:81; CommitAndPRHandler.cs:278,288"
  - claim: "The host-side clone reads the same type-keyed token."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Providers/Source/HostSourceCloner.cs:63-67"
  - claim: "SandboxSpec.GitTokenSecretRef is never set; PodSpecBuilder only reads it."
    evidence: "src/backend/AgentSmith.Contracts/Sandbox/SandboxSpec.cs:25; src/backend/AgentSmith.Server/Services/Sandbox/PodSpecBuilder.cs:89,126-127"
  - claim: "A Local repo pushes nothing when it has no origin remote, and harness local repos carry stub URLs; neither has a credential to look up."
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:229-236"
  - claim: "SandboxGitOperations has 293 lines against its ratchet row of 319."
    evidence: "tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:23"
  - claim: "InitCommitHandler sits exactly at its ratchet row (190 of 190)."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/InitCommitHandler.cs; tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:54"
  - claim: "PersistWorkBranchHandler sits exactly at its ratchet row (164 of 164)."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/PersistWorkBranchHandler.cs; tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:78"
  - claim: "CommitAndPRHandler has 433 lines against its ratchet row of 436."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/CommitAndPRHandler.cs; tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:10"
  - claim: "Existing tests pass RepoType to the push methods and build steps without a credential."
    evidence: "tests/AgentSmith.Tests/Handlers/CheckoutStepFactoryTests.cs; tests/AgentSmith.Tests/Services/SandboxGitOperationsTests.cs"

scope:
  in: >
    GitTokenResolver becomes an injected service over ICredentialResolver (Contracts, 5f89a) answering a GitCredential
    for a RepoConnection; a Local repo gets GitCredential.None — never a lookup, never MissingCredentialException. Because the step factories are static, the credential travels as a parameter: each of the six
    callers resolves it once from the repo it already holds and passes it to CheckoutStepFactory and
    SourceScopeRefreshSteps, whose TokenEnv takes the credential instead of the config. CommitAndPushStagedAsync,
    CommitAndPushAsync and PushHeadAsync take the RepoConnection; GitBranchPusher takes the credential; the five
    callers pass the repo — each edit replaces `repo.Type` with `repo` on the same line, so InitCommitHandler and
    PersistWorkBranchHandler (at their ratchet rows) and CommitAndPRHandler stay line-neutral. HostSourceCloner resolves through the service. GitTokenSecretRef and the PodSpecBuilder
    branch reading it are removed. A repo whose secret is missing fails its step with the MissingCredentialException
    sentence, not an anonymous git prompt.
  out: >
    Server-side API tokens — 2026-10-02-5f89a, built right before this slice and shipped in the same pull request. How GIT_TOKEN reaches the sandbox (step env) is unchanged.

decisions:
  - key: "PARAMETERS, NOT A STATIC LOCATOR. The step factories stay static pure builders; a static reaching for an injected resolver would hide the dependency the six callers already have."
  - key: "REMOVE GitTokenSecretRef. It has had no writer since credentials moved into the step env; a dead per-pod token slot is the place a second, type-keyed credential would creep back in."
  - key: "A MISSING SECRET FAILS LOUDLY. Today a null token quietly omits GIT_TOKEN and git fails later with an auth prompt nobody answers; the named refusal says which secret."

steps:
  - id: service
    action: "GitCredential record; GitTokenResolver as an injected service; registrations in server and CLI."
  - id: steps
    action: "CheckoutStepFactory, SourceScopeRefreshSteps and GitStepCredentials take the credential; the six callers resolve and pass it."
  - id: push
    action: "SandboxGitOperations push methods and GitBranchPusher take the repo/credential; RepoWorkPusher, SpecSetWriter, InitCommitHandler, PersistWorkBranchHandler and CommitAndPRHandler pass the repo; HostSourceCloner resolves through the service."
  - id: spec
    action: "SandboxSpec.GitTokenSecretRef and PodSpecBuilder's GIT_TOKEN secretKeyRef branch removed."

tests:
  - "GitTokenResolver_RepoOfTheSecondGitLabConnection_GetsItsOwnToken (replaces GitTokenResolverTests' env cases)"
  - "CheckoutStepFactory_CloneStep_CarriesTheGivenCredentialAsGitToken"
  - "SandboxGitOperations_CommitAndPush_UsesTheReposCredential"
  - "SandboxRepoCloner_RepoWithMissingSecret_FailsNamingTheSecret"
  - "PodSpecBuilder_Env_HasNoGitTokenSecretRef"
  - "GitTokenResolver_LocalRepoWithStubUrl_GetsNoCredentialAndNoError"
  - "CheckoutStepFactoryTests and SandboxGitOperationsTests updated from RepoType to repo/credential arguments"

done:
  - "a run over two GitLab repos from two connections clones and pushes each with its own token (harness)"
  - "no GITHUB_TOKEN, GITLAB_TOKEN or AZURE_DEVOPS_TOKEN read remains in GitTokenResolver"
  - "build green, full suite green, dashboard tests and build green"
