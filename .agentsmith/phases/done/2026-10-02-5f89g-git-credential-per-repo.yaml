# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-02-5f89g
goal: "Every clone, fetch and push authenticates with its repo's own auth secret instead of a token picked by repo type, so repos of two instances of one host type can sit in one run."

applies_to: "backend (git credentials for sandbox steps, host-side clone and push; sandbox spec)"

requires: ["2026-10-02-5f89a"]

