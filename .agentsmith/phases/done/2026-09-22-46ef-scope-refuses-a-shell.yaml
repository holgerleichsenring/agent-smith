assumptions:
  - claim: "Refusing by the step's program name cannot be evaded by naming a different shell or an interpreter."
    check: "Decide whether the rule is a refusal of known shells or an allowance of known programs, and write the set down."
  - claim: "The generic image carries the search program the file search names."
    check: "Establish what the file search does when its program is absent, and make that answer a refusal that says so rather than an empty result."
  - claim: "An operator whose repository URL embeds a credential does not put it into the checkout's configuration."
    check: "Read what the clone writes into the checkout's configuration when the URL carries userinfo."
  - claim: "Sending an argument list rather than a shell string changes no behaviour for the tools on an ordinary sandbox."
    check: "Read how the agent executes a process step with a program and arguments versus a shell and a string."
