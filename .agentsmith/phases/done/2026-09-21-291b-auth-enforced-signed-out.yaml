  - "Banner_OneHalfUnconfigured_KeepsItsHeading"
  - "JobsHub_RunFetchRefused_ReturnsTheRefusal"
  - "JobsHub_RunFetchFailedWithoutARefusal_ReturnsNone"
  - "JobsHub_ALaterFetchSucceeds_ClearsTheRefusal"
  - "MissionControl_RefusedForSignIn_ShowsTheRefusalSurfaceWithItsButton"
