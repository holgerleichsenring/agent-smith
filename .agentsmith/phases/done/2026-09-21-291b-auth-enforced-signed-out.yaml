done:
  - "A server on a tenant's bare authority beside a dashboard on that tenant's /v2.0 endpoint renders no banner while signed out; any other difference still does, and a refusal on issuer or audience still does."
  - "A dashboard whose server enforces and whose tab holds no token reaches the authority by itself, at most once per tab, and says what happened when it comes back empty."
  - "Signing out of an enforcing installation leaves the person signed out, and an expiring session does not throw them at the authority mid-work."
  - "Mission control offers the refusal and its button instead of a skeleton that cannot resolve, and neither it nor the system view calls a refusing server offline."
  - "Dashboard build and tests, backend build and the full suite are green."
