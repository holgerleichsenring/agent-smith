  - "AuthBoot_CallbackLoad_SettlesAfterTheCodeExchange"
  - "AuthBoot_NoAuthorityConfigured_SettlesAtOnce"
  - "SignInGate_EnforcedAndNoTokenOnceTheBootHasFinished_RedirectsOnce"
  - "SignInGate_EnforcedAndTheRedirectReturnedEmpty_RendersTheSignInPageAndDoesNotRedirect"
  - "SignInGate_EnforcedAndATokenLands_ForgetsThatItRedirected"
  - "SignInGate_EnforcedAndTheSessionExpired_RendersTheSignInPageAndDoesNotRedirect"
  - "SignInGate_EnforcedAndTheUserSignedOut_DoesNotSignThemBackIn"
  - "SignInGate_EnforcedAndTheBootHasNotFinished_RendersTheApplication"
