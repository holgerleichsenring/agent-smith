# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-ba47

goal: "The chat path carries a ticket identifier as the tracker wrote it, so a Jira-tracked project can be worked from Slack and its ticket list is not silently empty."

applies_to: "backend (the chat intent, the conversation state, the intent parsers and the cached ticket search)"

requires:
  - 2026-09-01-a17c

scope:
  in: "The ticket identifier typed as the tracker's own string through the chat intent, the conversation state, the error context, both intent parsers, the Slack handlers and the cached ticket search."
  out: >
    THE WEBHOOK PATH, which already carries what the tracker sent. NORMALISING
    identifiers across trackers: a provider parses where its own tracker is numeric,
    which is correct and stays.

decisions:
  - key: |
      THE COMMAND LINE WAS ONLY HALF OF IT. The sibling phase typed the command-line option as
      the tracker's own identifier; the chat path declares the same field as an integer in the
      intent, the conversation state and the error context, parses it with int.Parse in one
      parser and drops the intent entirely in the other when the parse fails. A Jira key
      therefore produces no intent at all — the assistant answers nothing rather than refusing.
  - key: |
      ONE CONSEQUENCE IS WORSE THAN A REFUSAL, WHICH IS WHY THIS IS ITS OWN PHASE. The cached
      ticket search coerces a non-numeric identifier to zero and then filters on greater than
      zero, so a Jira project's ticket list comes back EMPTY. Nothing errors; the operator sees
      no tickets and concludes there are none.
  - key: |
      THE PROVIDERS KEEP THEIR PARSING. Two trackers use numeric ids and parse them where they
      speak to their own API, handling failure. That is a tracker knowing its own shape, not an
      assumption about identifiers in general.

steps:
  - id: the-intent-carries-a-string
    action: "The chat intent, the conversation state and the error context carry the tracker's identifier as given."
  - id: both-parsers-stop-requiring-a-number
    action: "The chat intent parser and the model intent parser accept any identifier the tracker uses, and the Slack handlers follow."
  - id: the-search-stops-coercing
    action: "The cached ticket search filters on what the tracker returned instead of coercing to a number and dropping everything that is not one."

tests:
  - "ChatIntent_AJiraKey_ProducesAnIntent"
  - "TicketSearch_AJiraProject_ReturnsItsTickets"
  - "ChatIntent_ANumericId_IsUnchanged"

done:
  - "a Jira-tracked project can be worked from chat by its key"
  - "a Jira project's ticket list is not empty"
  - "numeric trackers behave exactly as before"
  - "build green, full suite green"
