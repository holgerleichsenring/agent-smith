# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-89f1e
goal: "What the server exposes is what it does: /health reports its subsystems, retired pipeline names are refused with a reason, and dead handlers, verbs and panels are gone."

applies_to: "backend (health, pipeline names, knowledge and expectation leftovers) and dashboard (runs board)"

requires: ["2026-09-28-89f1c"]

scope:
  in: "Subsystem states on /health, one retired-name list with an explanation at every refusal, the autonomous verb and its leftovers, clear-finished on the runs board, the NegotiateExpectation chain, the knowledge query and config."
  out: "The Criteria-met metric, which 2026-09-28-89f1i re-sources. compile-wiki, which planned 2026-09-08-c56e retires by name. A /health/ready endpoint: readiness would pull the only pod that can report the fault out of the service."

decisions:
  - key: |
      HealthResponseBuilder WAS ORPHANED IN p0107 and the subsystem states were computed and never shown.
      /health stays 200 and gains them, capacity_queue included, which was never registered as one.
  - key: |
      TWO LISTS OF RETIRED NAMES AND NO REFUSAL THAT EXPLAINS. Removed presets join RetiredPipelineNames
      with their reason; every refusal site names the replacement or the reason. The autonomous verb,
      its config and its docker test go: a verb that can only fail misleads in --help.
  - key: |
      THE RUNS BOARD LOST ITS CLEAR-FINISHED BUTTON IN p0343 while the API and the docs kept it. It is
      mounted in the Finished section. Clearing deletes each run's criterion verdicts with it (they were
      left orphaned), and the confirmation says the verdict history goes too. The capacity panel stays
      gone: p0348 chose live pods over the reservation, and the dropped-contexts fact it carried is empty
      in the footprint and already in the run's decisions.
  - key: |
      THE NEGOTIATE-EXPECTATION CHAIN SURVIVED p0393, which said deleted, not disabled. It goes whole,
      with the expectation eval harness and its goldens; the ExpectationRatified event contract and its
      projection stay so archived trails decode.

steps:
  - id: health
    action: "SubsystemHealthSection on /health, capacity_queue registered; delete HealthResponseBuilder and its tests; fix stale comments."
  - id: names
    action: "RetiredPipelineNames.Explain at every refusal; delete RetiredPresets, AutonomousCommand, AutonomousConfig, AutonomousFinding, AutonomousDockerTests and the harness leftovers."
  - id: dashboard
    action: "Section extracted with an action slot, Clear finished mounted, mergeNewestFirst moved, RunsList/OverviewCardGrid/CapacityFootprintPanel deleted; run deletion removes the run's criterion verdicts."
  - id: leftovers
    action: "Delete KnowledgeBaseConfig, the QueryKnowledge chain, the NegotiateExpectation chain (full list in the analysis note) and its dead reads."
  - id: docs
    action: "server-resilience, docker-compose, kubernetes, layers, trigger-it/cli, pipelines index, dashboard, the DESIGN.md token."

tests:
  - "the tests listed in .agentsmith/notes/2026-09-28-89f1-defect-analysis.md, slice e and its review corrections"

done:
  - "/health lists queue_consumer, housekeeping, poller, redis and capacity_queue with state and reason"
  - "no retired pipeline name is refused without its reason"
  - "Clear finished works from the board and leaves no orphaned verdict"
  - "no handler, context key or verb touched here is registered without a caller"
  - "build, dashboard and all tests green"
