    evidence: "src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:76-83"
  - claim: "The broadcaster already holds the envelope reader and the terminal reconciler, the latter documented as the cold-start terminal repair."
    evidence: "src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:24-28"
  - claim: "The anchoring gives a position to runs the store calls unfinished but the active set does not list, and anchors a live stream with no recorded position at its tail because skipping history is the stated stance."
    evidence: "src/backend/AgentSmith.Server/Services/Events/RunStreamCursors.cs:61-81"
  - claim: "The anchoring already fetches that tail entry."
    evidence: "src/backend/AgentSmith.Server/Services/Events/RunStreamCursors.cs:78-79"
  - claim: "The cursor bookkeeping takes only a database handle, so it cannot deserialize an entry."
    evidence: "src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:35"
  - claim: "The reconciler declines a waiting status, returns when the row is absent, finalizes only a row with no finish time, and appends a terminal trail row only when none exists."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunTerminalReconciler.cs:24-33, :43-52"
  - claim: "The projection a drained terminal event reaches has no waiting guard: it writes status, summary and cost and only leaves the finish time null for a waiting status."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunFinalizationProjection.cs:26-66"
  - claim: "That projection re-creates a capacity-queue entry for a terminal event whose status is queued."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunFinalizationProjection.cs:60-66"
  - claim: "The drain reads strictly after the stored position."
    evidence: "src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:208-214"
  - claim: "The recent-runs list is walked at cold start and is a bounded ring that every terminal publish pushes onto."
    evidence: "src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:113-122, src/backend/AgentSmith.Infrastructure/Services/Events/RedisEventPublisher.cs:54-62"
  - claim: "The store's unfinished source returns every run with no finish time, with no cap, window or status filter."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/UnfinishedRunSource.cs:15-23"
  - claim: "A stream lives twenty-four hours, so a position is meaningless without its stream."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Events/EventStreamKeys.cs:17-32"
  - claim: "The capacity-queue drop writes its terminal state directly AND still publishes it."
    evidence: "src/backend/AgentSmith.Server/Services/CapacityQueueDrop.cs"
  - claim: "A waiting status is decided by one shared helper."
    evidence: "src/backend/AgentSmith.Contracts/Runs/RunStatuses.cs:24"
