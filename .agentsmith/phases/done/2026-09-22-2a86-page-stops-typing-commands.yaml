  - claim: "The router hands a parsed command to the handler and otherwise treats the message as a continuation."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogRouter.cs:36-48"
  - claim: "A continuation is declined when no session is open on that platform and thread."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogAnswerAdmission.cs:32-33"
  - claim: "A declined chat message falls to the intent engine, whose recognised intents open no design conversation."
    evidence: "src/backend/AgentSmith.Server/Services/Dispatchers/SlackMessageDispatcher.cs:36-97"
  - claim: "The intent engine's second stage is a model call whose prompt maps adding, showing and asking for help onto ticket intents."
    evidence: "src/backend/AgentSmith.Application/Services/Intents/LlmIntentParser.cs:28-56"
  - claim: "One chat platform passes the conversation id as both channel and thread, so a whole chat shares one thread id."
    evidence: "src/backend/AgentSmith.Server/Extensions/TeamsEndpoints.cs:102-112"
  - claim: "The dashboard dispatcher opens a conversation from the page's project before routing, constructing the opening command internally."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogConversationResolver.cs:42-55"
  - claim: "The new-conversation control posts the opening spelling as message text."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:474-478"
  - claim: "Opening a conversation from the list posts the resume spelling as message text."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:489-499"
  - claim: "A typed message already carries the page's picked project, and is refused only when there is neither a session nor a project."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:422-430"
  - claim: "The list's own header records that the controls replaced the grammar and that the strings still travel."
    evidence: "src/dashboard/src/components/dialog/DialogConversations.tsx:7-9"
  - claim: "The resumer's guards are about the source session: a foreign owner is not found, and a live question or turn refuses."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogResumer.cs:32-42"
  - claim: "The move closes whatever is open on the target thread before rebinding."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogResumer.cs:63"
  - claim: "The ownership check parses a posted resume spelling and then asks whether the caller may watch the target dialog."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogOwnership.cs:78-86"
  - claim: "The deletion route checks ownership explicitly before acting, which is the precedent an id-addressed route follows."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogDeletionEndpoints.cs:49-58"
  - claim: "The resumer has exactly one caller, the command handler."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogCommandHandler.cs:44"
  - claim: "The conversation routes are reads only."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogViewEndpoints.cs:21-27"
  - claim: "The documentation already tells a reader to start a thread and discuss what they want to build, and never mentions the grammar."
    evidence: "docs/how-it-works/spec-dialogue.md:7"

assumptions:
  - claim: "The page has a caller identity on the resume route the same way the deletion route does."
    check: "Read how the deletion route establishes its caller and whether the same is available where the page would call resume."
  - claim: "Removing the three command types breaks no construction site outside the parser."
    check: "Find every construction of each of the three types."
  - claim: "The dashboard tests that post the spellings can be rewritten to the routes without losing what they cover."
    check: "Read each test that posts a spelling and establish what it asserts."
