# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-03-cf20c
goal: "Init composes a component's principles from core, language delta and each catalog overlay whose manifest signal matches at the component root, and the init PR names the overlays to ratify."

applies_to: "principles composition (IPrinciplesTemplateSource, catalog source, BootstrapPrinciplesTransfer), init PR body, tests"

requires: [2026-10-03-cf20a, 2026-10-03-cf20b]

facts:
  - claim: "Compose takes a language slug and renders core plus one delta; the header and intro name core and delta only."
    evidence: "src/backend/AgentSmith.Contracts/Services/IPrinciplesTemplateSource.cs:14-18; src/backend/AgentSmith.Infrastructure.Core/Services/Skills/CatalogPrinciplesTemplateSource.cs:22,42-55,70-104"
  - claim: "The only production caller is the bootstrap round, which hands the transfer the sandbox it owns for the context; the round context already carries the component's Workdir."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/BootstrapRoundHandler.cs:42,67-69; src/backend/AgentSmith.Application/Services/Handlers/BootstrapRoundMatch.cs:62"
  - claim: "The transfer composes, applies artefacts, preserves an existing principles.md and writes a new one."
    evidence: "src/backend/AgentSmith.Application/Services/BootstrapPrinciplesTransfer.cs:37-45,61-70,72-85"
  - claim: "Relative sandbox paths resolve under /work; a listing returns absolute paths of direct children, directories included; a failed listing reads as empty and a malformed reply throws."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/FileStepHandler.cs:19-26,180-198; src/backend/AgentSmith.Application/Services/Sandbox/SandboxFileReader.cs:49-55"
  - claim: "The init PR body states a fixed 'core and language delta' line; the round outcome carries mode and artefacts only."
    evidence: "src/backend/AgentSmith.Application/Services/Handlers/InitPullRequestBody.cs:66-67; src/backend/AgentSmith.Application/Models/BootstrapRoundOutcome.cs:14; src/backend/AgentSmith.Application/Services/Handlers/BootstrapPrinciplesOutcome.cs:26"
  - claim: "Compose is stubbed and mocked in tests; goldens compose against the embedded catalog tarball."
    evidence: "tests/AgentSmith.Tests/TestHelpers/PrinciplesTransferStubs.cs:46-50; tests/AgentSmith.Tests/Handlers/BootstrapPrinciplesTransferTests.cs:190-198; tests/AgentSmith.Tests/Skills/ComposedPrinciplesGoldenTests.cs:43-49,134-146"
  - claim: "'Overlay' already names skill overlays in the catalog code."
    evidence: "src/backend/AgentSmith.Infrastructure.Core/Services/Skills/SkillsRegistrations.cs"

assumptions:
  - claim: "Overlay files follow 2026-10-03-cf20b's format: Detection with one yaml fence of {file, contains}, Rules with '### All languages' and per-slug sections, Artefacts none."
    check: "Read principles/OVERLAY-FORMAT.md in the skills release before building."

scope:
  in: >
    IPrinciplesTemplateSource gains FrameworkOverlays() (slug, signals) and Compose(language, overlaySlugs), the slug
    list required. FrameworkOverlayDetector (Application) takes the component workdir from the round — a rooted path
    or '..' detects nothing — reads each literal signal file with TryReadAsync and lists only for a glob, direct
    children only, comparing Path.GetFileName; contains is a substring of the file; any failure, exception or malformed overlay file applies nothing and is logged. The
    catalog renders, after the delta, each applied overlay's All-languages section and the section named by the composer's
    NormalizeSlug output (the overlay's H1 is not rendered), ordinal by slug; the header reads composed=core+<slug>+<overlay…> and the intro gains one sentence
    naming the overlays — both only when one applied, so composition without overlays is byte-identical.
    ComposedPrinciples, PrinciplesTransferResult and BootstrapRoundOutcome carry the applied slugs only when the
    file was written (Transferred); the init PR body lists them for ratification. 2026-10-01-aeb6d requires this
    phase once both are on main, since its overlay goldens call Compose(language, overlays). An existing principles.md is never overwritten.
  out: >
    Re-composing ratified principles. Detection above the component root — 2026-10-03-0fca. Goldens against a
    released catalog — 2026-10-01-aeb6d.

decisions:
  - key: "THE CATALOG DECLARES, THE FRAMEWORK READS. Signals are data in the overlay; a new framework is a catalog change, never a code change."
  - key: "THE WORKDIR IS THE MODEL'S, THE MATCH IS NOT. Discovery chose the directory; whether a file there declares Spark is read, not judged."
  - key: "A FAILED READ APPLIES NOTHING. A missing overlay costs rules; a wrongly applied one is a wrong mandate."
  - key: "RATIFIED IN THE OPEN. An overlay in an HTML comment is invisible on the rendered PR; the operator approves what the body names."

steps:
  - id: contracts
    action: "FrameworkOverlay, FrameworkOverlaySignal; FrameworkOverlays(); Compose(language, overlays); outcome types carry the slugs."
  - id: catalog
    action: "FrameworkOverlaySection (parse, render) beside the composer; both files under 120 lines."
  - id: detect
    action: "FrameworkOverlayDetector; BootstrapPrinciplesTransfer takes the round's workdir and passes detected slugs."
  - id: surface
    action: "InitPullRequestBody and BootstrapPrinciplesOutcome name applied overlays."
  - id: tests
    action: "Tests below; PrinciplesTransferStubs, the Moq setup and every Compose call site updated."

tests:
  - "CatalogPrinciples_OverlayApplied_RendersAllLanguagesAndTheLanguageSection (temp catalog with scala.md and spark.md)"
  - "CatalogPrinciples_NoOverlay_MatchesTheEmbeddedGoldens (Compose with an empty list)"
  - "FrameworkOverlayDetector_DependencyInManifest_AppliesTheOverlay"
  - "FrameworkOverlayDetector_ManifestWithoutTheDependency_AppliesNothing"
  - "FrameworkOverlayDetector_GlobSignal_MatchesRequirementsFiles"
  - "FrameworkOverlayDetector_ReadThrows_AppliesNothingAndLogs"
  - "FrameworkOverlayDetector_EscapingWorkdir_AppliesNothing"
  - "BootstrapPrinciplesTransfer_SparkComponent_WritesCoreDeltaAndOverlay"
  - "InitPullRequestBody_OverlayApplied_NamesIt"
  - "InitPullRequestBody_PreservedExisting_NamesNoOverlay"

done:
  - "with a catalog carrying scala.md and spark.md, an init over a Scala component whose build.sbt names org.apache.spark writes principles composed core+scala+spark and its PR body names spark"
  - "build green, full suite green"
