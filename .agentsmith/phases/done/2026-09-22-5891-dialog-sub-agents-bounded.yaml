    check: "Read the fixture's stub runner and establish what it keeps of the context it is handed."
  - claim: "A dialog-specific count and ceiling can be read from configuration where the surface is composed."
    check: "Read what configuration the surface builder already has in scope."
  - claim: "Dropping the human tool from the child list leaves the parent's own human tool intact."
