# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0394
goal: "The plan call answers in JSON again on multi-repo runs, and the spec-set commit carries a git identity — the two backend defects the first live run after p0384/p0393a surfaced."

applies_to: "backend"

requires:
  - p0384   # multi-repo plan rules (whose append caused the JSON regression)
  - p0393a  # derive-the-spec (whose commit path lacks the identity)

decisions:
  - key: |
      PLAN-JSON ROOT CAUSE (live run, 2026-08-03): agent-plan-system.md ends with
      "Respond ONLY with the JSON, no additional text." p0384 appended the
      '## Multi-repository plan rules' section AFTER Render — i.e. after that line —
      because it assumed the template was a pinned skills resource with a fixed token
      set. It is not: agent-plan-system stays EMBEDDED in the backend until p0179c
      (SkillCatalogPromptCatalog). With prose rules in terminal position the model
      answered in prose; SalvageProse honestly produced a 0-step plan and the master
      started with an empty ledger seed. Fix at the template: a {MultiRepoRulesSection}
      token rendered BEFORE the '## Respond in JSON format:' section; the post-Render
      append is deleted. The JSON-only instruction keeps the terminal position.
  - key: |
      SPEC-COMMIT IDENTITY ROOT CAUSE (same run): DeriveSpec's SpecSetWriter commits in
      the checkout sandbox BEFORE any path that configures git identity has run — the
      user.name/user.email config lives later in the commit-and-PR flow. 'git commit'
      exit 128 'Author identity unknown', the set survived only in-memory, and the run
      viewer (which reads the documents back from the ticket branch) rendered empty
      phase documents. Fix at the primitive: SandboxGitOperations' staged-commit path
      ensures the identity (idempotent config) before committing, so EVERY caller —
      spec writer, checkpointer, commit-and-PR — is covered and no call-site ordering
      can reintroduce the class.

steps:
  - id: plan-template-token
    action: "agent-plan-system.md: add {MultiRepoRulesSection} between the codebase/expectation sections and '## Respond in JSON format:'; BuildPlanSystemPrompt renders the rules into the token (empty string on single-repo) and the post-Render append is deleted."
    modify:
      - "Prompts/Resources/agent-plan-system.md: new token before the JSON-format section."
      - "AgentPromptBuilder.BuildPlanSystemPrompt: token instead of append."
  - id: commit-ensures-identity
    action: "SandboxGitOperations.CommitAndPushStagedAsync (and any sibling commit primitive): ensure user.email/user.name are configured in the sandbox repo before committing — idempotent, same values the existing identity setup uses."
    modify:
      - "SandboxGitOperations: identity ensured at the commit primitive."

tests:
  - "BuildPlanSystemPrompt_MultiRepo_RulesRenderBeforeJsonFormatSection"
  - "BuildPlanSystemPrompt_MultiRepo_JsonOnlyInstructionStaysTerminal"
  - "BuildPlanSystemPrompt_SingleRepo_TokenRendersEmpty"
  - "CommitAndPushStaged_ConfiguresIdentityBeforeCommit"
  - "CommitAndPushStaged_IdentityAlreadySet_IdempotentNoFailure"

done:
  - "A multi-repo plan prompt ends with the JSON-format section and JSON-only instruction; the multi-repo rules appear before it — pinned by test."
  - "A spec-set commit in a fresh sandbox succeeds without any prior identity-configuring step — pinned by test at the git-operations level."
  - "No consumer of BuildPlanSystemPrompt concatenates content after Render (grep-verifiable)."
