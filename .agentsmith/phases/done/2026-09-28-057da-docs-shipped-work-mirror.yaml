# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-057da
goal: "The docs describe what shipped since the last mirror (p0334 onward): every user-visible phase maps to a page that describes it, and the new surfaces have pages of their own."

applies_to: "docs"

requires: []

scope:
  in: "An audit of every done phase from p0334 and every date-minted phase into a delta table, new pages for the capabilities with none, corrections where a page describes older behaviour, and the mkdocs nav."
  out: "Removing phase-history prose and re-checking the pages untouched since May, which is 2026-09-28-057db. The website, which is 2026-09-28-057dc. Behaviour still planned."

decisions:
  - key: |
      THE LAST MIRROR WAS p0335, AND IT STOPPED AT p0333c. The 2026-08-19 pass (p0462, p0463) moved
      configuration into the studio and rewrote the voice; it audited nothing. So 152 counter phases
      (p0334-p0477) and 336 later ones (p0478 onward plus every date-minted id) were never mirrored,
      and the docs were touched only where a phase happened to pass through a page. Single pages stay
      fresh that way and whole surfaces stay unwritten: the dashboard's Work it out conversations,
      ticket conversations, approved spec sets, the delivery account, the ASVS requirements the
      security scan asks against, dashboard sign-in.
  - key: |
      THE DELTA IS CHECKED AGAINST THE PAGE, NOT DERIVED. p0335 derived its table from specs alone. Here
      every user-visible row names the page and says whether that page describes today's behaviour,
      because a page that mentions a word is not a page that explains it.
  - key: |
      A LATER PHASE IS THE TRUTH. Many surfaces were reshaped several times (the design surface became
      Work it out, an approved cut files one ticket). A row superseded by a later phase points at it
      and the behaviour is documented once, in its final form.

steps:
  - id: audit
    action: "Write the delta table to .agentsmith/notes/2026-09-28-057da-doc-delta.md: one row per phase from p0334, user-visible or internal with a reason, target page, status covered/partial/missing."
  - id: new-pages
    action: "Write a page for each theme the table marks missing, placed in the existing nav sections; facts read off the code and the specs, names as the UI and config spell them."
  - id: corrections
    action: "Correct every page the table marks partial."
  - id: nav
    action: "mkdocs.yml lists every new page."

tests:
  - "no automated test: this phase changes documentation. mkdocs build --strict is the gate."

done:
  - "every phase from p0334 and every date-minted done phase has one row in the delta table"
  - "no user-visible row is left without a page that now describes it"
  - "mkdocs build --strict is green"
