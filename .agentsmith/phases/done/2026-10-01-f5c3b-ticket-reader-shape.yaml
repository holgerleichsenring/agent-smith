  - "WHEN a filed body is read back from markdown, Azure DevOps HTML or Jira THEN its acceptance criteria equal PhaseDraft.Done"
  - "WHEN a bug carries acceptance criteria as a list or as unlisted lines THEN the section reader returns one criterion per item or line"
  - "the docs page is in the mkdocs nav, linked from phase-workflow.md, and its template's criteria are read as items"
  - "the skills change is on PR #205; the pin moves in 2026-10-01-aeb6d"
  - "build green, full suite green"
