scope:
  in: >
    PhaseTicketBody renders, for a phase and an epic parent alike: the goal as the lead paragraph, ## Why (decisions),
    ## What changes (scope.in), ## Acceptance criteria (draft.Done, each in f5c3a's plain line form), ## Out of scope
    (scope.out), ## Preconditions, then the extra sections and the label note, inside the framed region as now.
    Reading decisions and scope from the yaml moves to PhaseSpecProse so both files stay under 120 lines;
    PhaseTicketRenderer does not grow. BugOutcomeParser accepts acceptance_criteria as a string or a list; the bug
    renderer lists them. A docs page gives product owners the same shape as a copyable ticket template. The
    design-partner master writes a scenario where a criterion has a trigger and an observable result, and bug criteria
    as a list.
  out: >
    A steps or tasks section — a procedure in a ticket became an acceptance criterion and sank a correct run.
    The Why/What-changes shape for bugs — a bug's description is what is wrong and what correct looks like; a
    "what changes" section would be a fix procedure. Parsing the template: agent-smith reads a PO ticket as free text
    and only the Acceptance criteria list as items, as today. The epic's ## Slices section, which keeps its place after
    the reader sections. The embedded pin — it moves once, in 2026-10-01-aeb6d.

decisions:
  - key: "THE HEADING STAYS 'Acceptance criteria'. Two readers find criteria by it on every tracker without a field."
  - key: "THE GOAL LEADS UNHEADED AND VERBATIM. Divergence finds it word for word; under Why it would read as the reason rather than the outcome."
  - key: "THE PLAIN LINE FORM, NO BOLD. HTML strips it, Jira shows it literally, markdown keeps it — three read-backs and none equal to PhaseDraft.Done. One item per criterion, no nested WHEN/THEN items, which the HTML item match would split."
  - key: "AN UNLISTED BUG LINE IS ITS OWN CRITERION. Each non-empty line without a list marker becomes one item; an indented line joins the item above, the section reader's own rule, so what is written is what is read."
  - key: "BUGS GET LISTED CRITERIA, NOT THE SHAPE. Their criteria become readable items; the rest of a bug ticket is already the reader's shape for a bug."

steps:
  - id: prose
    action: "PhaseSpecProse (Application/Services/SpecDialog): Decisions, ScopeIn, ScopeOut read from the yaml map."
  - id: body
    action: "PhaseTicketBody composes the reader shape above; the Shared/middle/tail indirection goes."
  - id: bug
    action: "BugOutcomeParser reads acceptance_criteria as a string or a list of strings; BugTicketRenderer renders each unlisted line as '- ' plus the collapsed text and keeps listed lines and their indented continuations."
  - id: tests
    action: "RequirementTicketTests, TicketRegionRewriteTests:144, SpecDialogOutcomeTests:358, DialogProposalPaneTests:190-193 assert the new headings and the listed bug criterion."
  - id: docs
    action: "docs/trigger-it/writing-a-ticket.md: the template (goal line, Why, What changes, Acceptance criteria with a GIVEN/WHEN/THEN line, Out of scope), why there is no steps section, which part is read as items; nav under Trigger it; phase-workflow.md and spec-dialogue.md 'What approval files' link it."
  - id: skill
    action: "agent-smith-skills, on the open PR #205 branch: the draft template shows a scenario done item beside a line item, the rules say when a scenario fits, the bug template lists acceptance_criteria."

tests:
  - "RequirementBody_LeadsWithTheGoalThenWhyWhatChangesCriteriaOutOfScope"
  - "RenderEpicParent_LeadsWithTheGoal_ThenTheReaderSections_ThenSlices"
  - "RequirementBody_OmitsSteps (kept)"
  - "RequirementBody_ScenarioCriterion_ReadsBackAsPhaseDraftDone_Markdown"
  - "RequirementBody_ScenarioCriterion_ReadsBackAsPhaseDraftDone_AzureDevOpsHtml"
  - "RequirementBody_ScenarioCriterion_ReadsBackAsPhaseDraftDone_JiraParagraphs"
  - "Parse_BugAcceptanceCriteriaAsAList_KeepsEveryItem"
  - "RenderBody_UnlistedAcceptanceCriteriaLines_BecomeOneItemEach"
  - "TicketTemplateDoc_AcceptanceCriteria_ReadAsCriteria (reads the page's template block through AcceptanceCriteriaSection)"

done:
