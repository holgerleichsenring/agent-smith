# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-23-4722b
goal: "A spawned sandbox receives the secret env vars the configured agents actually name, so a second seat or a non-canonical key reaches the run instead of vanishing."

applies_to: "backend"

decisions:
  - key: |
      THE GAP IS OLDER THAN COPILOT AND DOES NOT DEPEND ON IT. AgentConfig.ApiKeySecret lets an agent
      name ANY environment variable, and every chat-client builder honours it — but
      DockerJobSpawner's forwarded list is a hardcoded set of canonical AgentEnvKeys, and
      KubernetesJobSpawner projects the fixed pair list in AgentSecretBinding.All. An agent naming
      ANTHROPIC_API_KEY_TEAM_B therefore works in-process and silently fails to authenticate inside a
      spawned sandbox. This phase carries NO `requires:` on the copilot work: it stands alone, it
      fixes today's providers, and serialising it behind an unrelated phase would only delay a defect
      fix. Copilot merely makes it urgent, because a seat is per person and two seats is the normal
      case rather than the exotic one.
  - key: |
      THE HARDCODED LIST IS ALREADY WRONG FOR CANONICAL KEYS, NOT ONLY CUSTOM ONES.
      DockerJobSpawner's forwarded list omits AZURE_OPENAI_API_KEY and GROQ_API_KEY outright — both
      are canonical AgentEnvKeys and neither reaches a Docker-spawned sandbox today. That is the
      evidence that a literal list drifts: it has already drifted twice without anyone noticing.
  - key: |
      THE CONFIGURED NAMES ARE THE SOURCE OF TRUTH, NOT A LONGER LIST. Both spawners are given the
      set of env-var names the loaded configuration actually references — the canonical keys plus
      every ApiKeySecret any agent names — and forward the ones that are set. AgentSmithConfig is
      already a DI singleton in the server composition, so both spawners can take it. The caveat is
      stated rather than discovered later: that singleton is built once at composition, so an agent
      added by a live config reload does not reach the spawners until restart — the same limitation
      the template-context lookup already documents, and out of scope here.
  - key: |
      THE K8S SECRET KEY IS DERIVED, AND A NAME THAT CANNOT BE A KEY FAILS LOUDLY. AgentSecretBinding
      pairs an env var with a kebab-case key in the operator-managed secret, and all eleven existing
      pairs agree with a plain upper-snake-to-kebab derivation — so a configured name gets the same
      derivation and an operator adding ANTHROPIC_API_KEY_TEAM_B knows the key is
      anthropic-api-key-team-b without reading code. The existing explicit pairs stay exactly as they
      are: they are the documented contract of a deployed secret and re-deriving them would rename
      live keys. A configured name is validated against the Kubernetes secret-key charset
      ([-._a-zA-Z0-9]+) before derivation, so an illegal name is refused with its own message instead
      of producing an invalid pod spec at spawn time.
  - key: |
      A NAME IS FORWARDED, A VALUE IS NEVER LOGGED, AND AN ABSENT ONE IS NOT AN ERROR HERE. The
      existing bindings are all Optional so a missing key does not block pod creation, and that
      stays: a run whose agent cannot authenticate fails at the preflight checks that exist for it
      (LlmReachableCheck, InjectedSecretCheck), with the name in the message. This phase moves names,
      not diagnosis.

steps:
  - id: the-configured-names-are-collected
    path: "src/backend/AgentSmith.Contracts/Constants"
    action:
      - "Expose the env-var names a loaded configuration references: the canonical keys plus every ApiKeySecret an agent names, de-duplicated."
      - "Validate a configured name against the Kubernetes secret-key charset and refuse an illegal one by name."
    new:
      - "AgentSecretNames: the resolver over AgentSmithConfig + AgentEnvKeys"

  - id: both-spawners-forward-what-was-named
    action:
      - "Forward the resolved set from the Docker spawner instead of the hardcoded list, which also restores the two canonical keys it omits today."
      - "Project the resolved set into the pod's env, deriving the kebab-case secret key for names that have no explicit binding."
    modify:
      - "src/backend/AgentSmith.Server/Services/DockerJobSpawner.cs: the forwarded env list"
      - "src/backend/AgentSmith.Server/Services/KubernetesJobSpawner.cs: the binding projection"
      - "deploy/apply-k8s-secret.sh: the note that a custom key follows the same derivation"

  - id: the-forwarding-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Assert a non-canonical ApiKeySecret reaches both spawners' env, that the canonical bindings keep their deployed keys, and that an illegal name is refused."

tests:
  - "AgentSecretNames_AgentNamesANonCanonicalSecret_IncludesItBesideTheCanonicalKeys"
  - "AgentSecretNames_TwoAgentsNameTwoSecrets_IncludesBoth"
  - "AgentSecretNames_NameOutsideTheSecretKeyCharset_IsRefusedByName"
  - "DockerJobSpawner_AgentNamesANonCanonicalSecret_ForwardsIt"
  - "DockerJobSpawner_CanonicalKeysOmittedToday_AreForwardedAgain"
  - "KubernetesJobSpawner_AgentNamesANonCanonicalSecret_ProjectsItWithTheDerivedKey"
  - "KubernetesJobSpawner_CanonicalBindings_KeepTheirDocumentedKeys"

done:
  - "two agents naming two different seat secrets both authenticate inside a spawned sandbox"
  - "an agent naming a non-canonical key for any provider reaches the sandbox with that key set"
  - "AZURE_OPENAI_API_KEY and GROQ_API_KEY reach a Docker-spawned sandbox again"
  - "the canonical secret keys an operator has already deployed are unchanged"
  - "a name that cannot be a Kubernetes secret key is refused with its own message"
  - "a name that is not set in the environment is still not an error at spawn time"
