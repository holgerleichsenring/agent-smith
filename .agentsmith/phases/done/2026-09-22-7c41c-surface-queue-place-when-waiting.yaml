# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-22-7c41c

goal: "A parked run whose relaunch is waiting for a slot shows its place in the queue instead of demanding an answer nobody owes, using the position the surface already renders."

applies_to: "backend and dashboard (the queue position a waiting run may carry, and the four places that call a run 'needs you')"

scope:
  in: >
    A parked run carries the status that says it is waiting for an operator, and the surface calls
    it NEEDS YOU from that status alone — in the overview's attention bucket, on the run's side
    rail, in its detail header, in the full-width banner across its page, and in its story spine.
    When the answer arrives the relaunch is enqueued and the checkpoint marked resumed, but the
    status is untouched, so a run whose answer is in and whose relaunch is merely waiting for a
    slot keeps asking to be answered.
    It is worse than a stale label. The pending-question projection returns nothing once the
    checkpoint is marked resumed, so what the operator gets is a card demanding attention with no
    question on it and no control to act with.
    The status cannot be repainted to say so: it is the relaunch launcher's launch condition, and
    a run repainted as queued is never launched and is skipped silently on every pump tick. Nor
    can the ABSENCE of an outstanding question say so: a park can leave no checkpoint, a
    checkpoint can be marked resumed for a relaunch that will never happen, and an unreadable
    question reads as no question — in each of those the operator is still owed something, and an
    absence-derived flag would remove the only surface that reports it.
    What is positively true in exactly the window that matters is that the run's relaunch IS
    UNDER WAY — it has a place in the capacity queue, or the launcher has already claimed its
    lease. The queue holds one entry per waiting relaunch keyed by the reserved run id,
    which for a relaunch is the parked run's own id. Both read paths already fetch the positions
    and already map them onto the snapshot; the position is simply discarded for any run whose
    status is not already queued, and the client already renders it.
    This phase stops discarding it for a waiting run and reads it where the surface speaks of
    attention. A waiting run with no place in the queue is unchanged, which is the safe direction
    and the reason for the polarity.
    A parked run publishes nothing, so nothing would tell the surface to re-read; the relaunch
    gains the same nudge the capacity deferral already makes, for the reason stated there.
  out: >
    A NEW FIELD ON THE SNAPSHOT. An earlier draft added one and was corrected: the position
    already exists on both sides, is already rendered, and is already safe in both skew
    directions. Reusing it removes the contract widening, the seven call sites of a widened queue
    lookup, and a mirror the generated-mirror check is blind to.
    CHANGING Run.Status ON THE RELAUNCH PATH. It is the launcher's gate.
    NOTHING. The window between the entry's removal and the run starting is closed HERE rather
    than deferred. An earlier draft deferred it and a review measured what that would produce:
    with free capacity the queue entry is gone within one fifteen-second pump tick while the
    launch, the pod start and the start projection take longer, so the operator would have seen
    needs-you, then queued, then needs-you again — a flip they would read as a SECOND question,
    which is worse than the single wrong stretch they see today. The launcher claims the lease
    before it hands the job over and before it removes the entry, so the two carriers overlap with
    no gap, and the assertion is simply their union.
    THE STATUS-KEYED GLYPH, TONE AND FILTER. A filter on the waiting status is about the status
    and is correct; the icon and the amber tone say waiting, not needs-you.
    THE CAPACITY QUEUE'S ORDER AND ADMISSION. Untouched.
    A CHECKPOINT MARKED RESUMED FOR A RELAUNCH THAT NEVER HAPPENS. Two reachable routes produce
    it: a checkpoint carrying no project or ticket, and a duplicate trigger whose queue entry
    already occupies the ticket so the relaunch's payload is discarded on upsert. Both strand a
    parked run forever, and this phase's polarity is chosen so that they stay visible rather than
    being hidden. Named as the phase that stops a checkpoint being consumed by a relaunch that
    cannot happen.

decisions:
  - key: |
      ASSERT THE POSITIVE FACT, NEVER THE ABSENCE. "This run has a place in the queue" is a row
      that exists. "No question is outstanding" is four different states wearing one face, three
      of which still owe the operator something. Deriving from the absence silences three real
      problems to fix one cosmetic one.
  - key: |
      THE POSITION IS ALREADY THE ANSWER AND IS ALREADY DRAWN. Both read paths fetch it, the
      mapper takes it, the client renders it as a place in line. Only one gate keeps it from a
      waiting run, and that gate is the whole change on the server side. A new boolean would have
      cost a contract widening and a mirror nothing checks, to say less than the number says.
  - key: |
      AN ENTRY KEYED TO A PARKED RUN'S ID IS A RELAUNCH, and no reachable path produces otherwise:
      the queue writes its reserved id and its kind exactly once on insert and a later upsert
      refreshes only the reason. A duplicate trigger for the same ticket either mints its own run
      id, or — when it takes the parked run's id from the queue head — starts a run on it and
      deletes the entry, which makes the assertion false and the run loud again. So the kind flag
      is not needed to tell them apart.
  - key: |
      THE RUN MOVES TO THE QUEUED BUCKET, NOT OUT OF ALL OF THEM. The overview's bucketing is a
      switch whose default arm is RUNNING, so removing a waiting run from the attention arm
      without naming its destination paints it as running — which is precisely what an earlier
      draft was refused for. It belongs where every other run waiting for a slot sits.
  - key: |
      ONE PAGE MUST NOT DISAGREE WITH ITSELF. The run's own page says needs-you in four places,
      each from the status alone, and the loudest of them is a full-width banner that already
      renders with no question attached. Fixing the rail and leaving the banner would put two
      contradictory claims about one run on one screen.
  - key: |
      WITHOUT THE NUDGE THIS PHASE DELIVERS NOTHING. A parked run is outside the set the
      broadcaster drains, so no event reaches the surface and nothing triggers a re-read; the card
      would correct itself only when the run relaunches, which is when the status already clears
      it. The capacity deferral makes exactly this nudge for exactly this reason.

steps:
  - id: a-waiting-run-may-carry-its-place
    action: "The one shared gate that discards a queue position for any run not already queued admits a waiting run, so a parked run whose relaunch is enqueued carries its real place in line on both read paths that use it."
  - id: a-relaunch-under-way-is-visible-without-a-place
    action: "A waiting run whose relaunch already holds its lease is reported as relaunching even though its queue entry is gone, so the two carriers overlap and the run never flips back to asking for an answer."
  - id: the-overview-moves-it-to-queued
    action: "A waiting run whose relaunch is under way is bucketed as queued rather than as needing attention, and the queued row recognises it in all four places it reads a derived status: the layout gate, the state dot's class, the activity-line gate and the wait-reason column."
  - id: the-run-page-agrees-with-the-overview
    action: "All five places the run's own page says it needs an answer — the side rail label, the header's status spill, the phrase beside it, the full-width banner and the story spine — require the waiting status AND no relaunch under way."
  - id: the-story-spine-gains-a-third-state
    action: "The spine distinguishes needs-you from relaunching from running, rather than negating its paused flag, so a run whose relaunch is under way is never described as in progress."
  - id: the-relaunch-nudges-the-surface
    action: "The sweeper nudges the run list after a relaunch is enqueued, the way a capacity deferral already does and best-effort, so the change reaches an open surface; it is placed at that sole caller rather than inside the resumer, because the resumer is composed by a build that has no nudge registered and validates its whole graph at startup."

tests:
  - "RunSnapshot_AWaitingRunWithAQueueEntry_CarriesItsPosition"
  - "RunSnapshot_AWaitingRunWithNoQueueEntry_CarriesNoPosition"
  - "RunSnapshot_AParkWithNoCheckpointAtAll_CarriesNoPosition"
