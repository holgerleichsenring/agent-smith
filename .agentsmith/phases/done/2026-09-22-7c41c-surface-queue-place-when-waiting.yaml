assumptions:
  - claim: "Admitting a waiting run to the position gate breaks nothing that pins the current gate."
    check: "Find every test that asserts a position is null for a non-queued run and decide what each should now say."
  - claim: "The relaunch's nudge can be injected where the resumer is composed, in every composition that builds it."
    check: "Read where the resumer is registered and where the nudge's default is bound; a composition with no dispatcher must still resolve."
