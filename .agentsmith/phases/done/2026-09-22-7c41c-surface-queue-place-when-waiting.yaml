  - "RunSnapshot_AWaitingRunWithNeitherPlaceNorLease_ReportsNeither"
  - "CliComposition_ResumeServices_ResolveWithoutTheDashboardApi"
  - "RunPage_AWaitingRunWithAQueuePlace_SaysNeedsYouInNoneOfTheFivePlaces"
  - "RunPage_AWaitingRunWithNoQueuePlace_StillSaysNeedsYou"
  - "Resume_AnEnqueuedRelaunch_NudgesTheRunList"
  - "Resume_ANudgeThatThrows_DoesNotFailTheRelaunch"
  - "ResumeLauncher_ARunWhoseRelaunchIsQueued_StillLaunchesFromWaitingForInput"

done:
  - "a parked run whose relaunch is queued is shown as queued, with its place, on the overview and on its own page"
  - "a parked run with no place in the queue is unchanged, including every park the queue cannot see"
  - "no page says a run needs an answer while another part of the same page says it is queued"
  - "the run status is not written on the relaunch path and the launcher still launches"
  - "an open surface learns without waiting for the relaunch"
  - "build green, dashboard tests green, full suite green"

