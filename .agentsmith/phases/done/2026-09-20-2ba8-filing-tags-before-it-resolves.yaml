  - claim: "Three existing tests pin behaviour that depends on a filed ticket being unresolvable, and a fourth carries a comment saying nothing the filer creates can carry an operator label."
    evidence: "tests/AgentSmith.Tests/SpecDialog/FiledWorkStartTests.cs:63-69, :72-79, :132-145, :151-172"
