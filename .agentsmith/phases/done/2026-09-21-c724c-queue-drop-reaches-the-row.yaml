    evidence: "src/backend/AgentSmith.Server/Services/CapacityQueuePump.cs:125-136"
  - claim: "The pump drops a head whose claim was rejected, calling the rejection permanent."
    evidence: "src/backend/AgentSmith.Server/Services/CapacityQueuePump.cs:105-107"
  - claim: "The pump already releases the reservation itself for a head it could not claim."
    evidence: "src/backend/AgentSmith.Server/Services/CapacityQueuePump.cs:104"
  - claim: "A deferred run was never in the active set, so no cursor is created for its stream and nothing drains it."
    evidence: "src/backend/AgentSmith.Contracts/Services/IRunListNudge.cs:3-13"
  - claim: "A writer exists solely to end a run whose terminal event nobody will deliver, and both cancel entry points call it; it goes through the finalization projection, which owns releasing capacity and computing the cost total, and whose set-once guard makes a drained event a harmless no-op."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/CancelTerminalWriter.cs:7-28"
  - claim: "That writer is registered as a singleton and resolved by the queued-run cancel, the run-control endpoint and the cancel enforcer."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Extensions/RunProjectionsExtensions.cs:32, src/backend/AgentSmith.Server/Extensions/QueuedRunCancel.cs:21, src/backend/AgentSmith.Server/Extensions/RunControlEndpoints.cs:106, src/backend/AgentSmith.Server/Services/Lifecycle/CancelEnforcer.cs:29"
  - claim: "The terminal event routes to the finalization projection alone."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunEventApplier.cs:51"
  - claim: "The projection returns when the row is absent, refuses to finish a row twice, writes status, finish time and summary, takes the cost from the event or sums the run's model calls, re-creates a queue entry only for a queued status, and releases the run's capacity."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Services/RunFinalizationProjection.cs:26-77"
  - claim: "The capacity release deletes the row for that run id, so a second release removes nothing, and the bound is a sum over the rows that remain."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/RunCapacityRepository.cs:49-50, :60-67"
  - claim: "The terminal event carries its summary in a named position the pump already fills with the drop's reason."
    evidence: "src/backend/AgentSmith.Contracts/Events/L1RunEvents.cs:44-51"
  - claim: "The surface refetches on a nudge, on reconnect or on mount, and never polls."
    evidence: "src/dashboard/src/hooks/useJobsHub.ts:91-106"
  - claim: "The deferral path nudges the run list after its write and best-effort, so a nudge that throws cannot lose the queue entry."
    evidence: "src/backend/AgentSmith.Application/Services/Spawning/SpawnPipelineRunsUseCase.cs:139-142"
  - claim: "The finished event removes the run from the active set and pushes it onto a recent list, and a boot-time rehydration walks that list and can reconcile a terminal state."
    evidence: "src/backend/AgentSmith.Infrastructure/Services/Events/RedisEventPublisher.cs:54-62, src/backend/AgentSmith.Server/Services/Events/JobsBroadcaster.cs:113-130"
  - claim: "An unfinished row's cursor is anchored at the stream tail, so a terminal event already sitting in that stream is skipped."
    evidence: "src/backend/AgentSmith.Server/Services/Events/RunStreamCursors.cs:67-81"
  - claim: "The existing pump test asserts the cancelled row only after hand-applying the published event."
    evidence: "tests/AgentSmith.Tests/Server/CapacityQueuePumpTests.cs:84-89"
  - claim: "The pump's test harness builds its own provider and does not register the finalization projection; the cancel path's tests show the shape that does."
    evidence: "tests/AgentSmith.Tests/Server/CapacityQueuePumpTests.cs:203-213, tests/AgentSmith.Tests/Server/QueuedRunCancelTests.cs:217"
  - claim: "The pump is hand-constructed positionally by its hosted service, so a new dependency lands there."
    evidence: "src/backend/AgentSmith.Server/Services/Hosting/CapacityQueuePumpHostedService.cs:41-51"
  - claim: "The existing cancel endpoint accepts exactly a queued run with no finish time and clears it through the same writer."
    evidence: "src/backend/AgentSmith.Server/Extensions/QueuedRunCancel.cs:24-38, src/backend/AgentSmith.Server/Extensions/RunControlEndpoints.cs:111-114"
