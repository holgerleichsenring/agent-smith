# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-02-3f06b
goal: "Every fact of a planned phase cites evidence that resolves — each path a file, each line inside it — or says it is a dated observation; the reader and check are shared with the product."

applies_to: "spec evidence reader and check (Application, reused by 2026-10-02-3f06c), architecture tests, two planned phases it reds"

requires: [2026-10-02-3f06a]

facts:
  - claim: "No architecture test reads facts or evidence; the schema test validates every phase file's shape only."
    evidence: "tests/AgentSmith.Tests/Architecture/PhaseSpecFileSchemaTests.cs:30-40"
  - claim: "In done/ evidence, 1410 segments split on ';': path tokens end in ',' 293 times and ';' 200 times; line forms are ':N-N' (1031), ', :N' continuations (147) and in-token lists ':N,N' (81); one URL, one host-qualified image name; CLAUDE.md and DESIGN.md cited without '/'."
    evidence: "observed: two independent scans of .agentsmith/phases/done, 2026-10-02"
  - claim: "Evidence in done/ rots by design: about 30 line ranges run past their file and dozens of cited paths no longer exist."
    evidence: "observed: the same scans resolved against 7402607dc, 2026-10-02"
  - claim: "planned/ and active/ hold 70 date-minted phases, 60 of them without facts, and 66 counter-id phases; only 443a and aeb6d cite evidence that fails."
    evidence: "observed: scans of planned/ and active/ after this series was written, 2026-10-02"
  - claim: "PhaseSpecFile.All() enumerates every phase file under all three state directories; PhaseNameBaseline is keyed by (rule, phase) from a tsv and judges the date-minted namespace only."
    evidence: "tests/AgentSmith.Tests/Architecture/PhaseSpecFile.cs:52-53,64-72; tests/AgentSmith.Tests/Architecture/PhaseNameBaseline.cs:30-35"
  - claim: "Derived facts cite a minted line starting with its look id, e.g. '[L3] api: …'."
    evidence: "src/backend/AgentSmith.Contracts/Models/PhaseFact.cs:3-9"
  - claim: "CitedFileIndex tokenizes citations but keeps only the path before ':'."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/CitedFileIndex.cs:37-60"

assumptions: []

scope:
  in: >
    EvidenceReferences (pure). Segments split on ';'; a segment starting 'observed:' is an OBSERVATION, one starting
    '[L\d+]' is MINTED, else tokens split on whitespace and ', ', stripped of leading '(' '`' '"' and trailing ','
    ';' '.' ')' '`' '"'. In order: a token containing '://' is not a reference; an optional 'name:' qualifier
    ('^[a-z][a-z0-9-]*:' then a '/'); a lone ':lines' token continues the previous path; a token with '/' is a path,
    and whatever follows its first ':' must be lines ('\d+(-\d+)?(,\d+(-\d+)?)*', TryParse) or it is an unparseable
    line; a token without '/' is a path only as 'name.ext:lines'. A path whose first segment is host-shaped
    ('^[a-z0-9-]+(\.[a-z0-9-]+)+$') and that the probe reports missing is not a reference. IEvidenceProbe takes
    (qualifier, raw path) and returns EvidenceProbeResult: File(lineCount, a trailing newline not counted) | NotAFile | NotChecked. EvidenceCheck
    (async) returns problems with reasons under EvidencePolicy {AllowMinted, NoReferenceIsProblem,
    UnknownQualifierIsProblem, UncheckedQualifiers, RefusedPathPrefixes, ObservedNeedsDate}. Repository policy: no
    minted; no reference, unknown qualifier, a dateless or invalid observed date (DateOnly) are problems; unchecked
    agent-smith-skills and spec-first; refused .agentsmith/phases/planned/ and active/. PhaseEvidenceRuleTests judges
    planned/ only. Facts-required: a date-minted planned phase states at least one fact (null and [] are absent);
    60 'facts' rows in phase-name-baseline.tsv, stale once the phase states facts or is no longer in planned/ or
    active/.
  out: >
    done/. active/ — a phase's facts describe the tree before its own work. Resolving declared unchecked roots.
    Product probing and policy — 2026-10-02-3f06c. The plugin's script — 2026-10-02-3f06e.

decisions:
  - key: "TOLERANT TOKENS, STRICT RESOLUTION. A strict grammar would red a fifth of the record's style; missing files, lines past the end and directory-only evidence are caught either way. A token that looks like a path is never skipped silently."
  - key: "PLANNED ONLY. An active phase changes the files its facts describe; judging it would red its own run."
  - key: "SOMEONE ELSE'S CHANGE MAY RED A PLAN. A PR that moves a file a planned fact cites re-grounds that fact in the same PR; the failure names the phase and says so."
  - key: "A PLAN IS NOT EVIDENCE. A planned or active phase file moves when done and states what does not exist yet; what a sibling builds belongs in requires, and a fact about a plan cites it as a dated observation."
  - key: "OBSERVED MUST BE DATED. A log or a scan is real evidence a check cannot open; the date makes it a record of when, not a free pass. One dated observation satisfies facts-required — accepted."
  - key: "THE POLICY IS A PARAMETER. The product accepts minted lines and reports uncertain qualifiers as not checked; the repository refuses both. One reader, two policies."
  - key: "CITEDFILEINDEX STAYS. It answers 'was this file examined', not 'does this line exist'; sharing a tokenizer would couple two rules that change for different reasons."
  - key: "COUNTER IDS ARE NOT JUDGED BY FACTS-REQUIRED. The rule is scoped by namespace, as every phase rule here."

steps:
  - id: reader
    action: "EvidenceReferences, IEvidenceProbe, EvidenceProbeResult, EvidencePolicy, EvidenceCheck under Application/Services/Specs; tests in tests/AgentSmith.Tests/Specs/Evidence*Tests.cs."
  - id: rule
    action: "PhaseEvidenceRuleTests with a filesystem probe; a 'facts' rule in PhaseNameBaseline and 60 rows."
  - id: record
    action: "443a and aeb6d: branch, tarball, Resources/ and directory evidence become dated observed: or a qualified path; no claim changes. Planned specs may be edited in place."

tests:
  - "EvidenceReferences_SemicolonAndCommaSpace_SeparatePaths"
  - "EvidenceReferences_ContinuationAfterComma_BindsToThePreviousPath"
  - "EvidenceReferences_InTokenLineList_ReadsEveryLine"
  - "EvidenceReferences_TrailingPunctuationAndParens_AreStripped"
  - "EvidenceReferences_RootFileWithLines_IsAPath"
  - "EvidenceReferences_Url_IsNotAPath"
  - "EvidenceReferences_ObservedSegmentAfterAPath_IsNotResolved"
  - "EvidenceCheck_PathWithMalformedLines_IsAProblem"
  - "EvidenceCheck_HostShapedMissingPath_IsNotAReference"
  - "EvidenceCheck_NotAFile_IsAProblem"
  - "EvidenceCheck_LinePastTheEnd_LineZero_DescendingRange_AreProblems"
  - "EvidenceCheck_OverflowingLineNumber_IsAProblemNotAThrow"
  - "EvidenceCheck_ObservedWithoutOrWithInvalidDate_IsAProblem"
  - "EvidenceCheck_MintedUnderRepositoryPolicy_IsAProblem"
  - "EvidenceCheck_DeclaredQualifier_IsAcceptedUnchecked"
  - "EvidenceCheck_PlannedPhasePath_IsRefused"
  - "PhaseEvidence_EveryPlannedFact_Resolves"
  - "PhaseFacts_NewDateMintedPhase_StatesFacts"
  - "PhaseFacts_EmptyList_IsNotStating"
  - "PhaseFacts_CounterIdPhase_IsNotJudged"
  - "PhaseFacts_StaleBaselineRow_Fails"

done:
  - "a fact in planned/ citing a missing file, a line past the end, or only a directory fails the suite naming phase, claim and path"
  - "build green, full suite green"
