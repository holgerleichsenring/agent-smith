done:
  - "a conversation within the most recent two hundred can be found and opened without scrolling the panel"
  - "an address opens a conversation, resuming a closed one exactly as the panel's row does"
  - "a conversation the panel does not draw can still be deleted"
  - "the page says how many of how many, from a counted total and never from the row count"
  - "a caller without the dialog permission reads a refusal, not an empty page"
  - "a conversation opened from the page costs at most one extra list read, not one per reply, and a conversation nothing has listed yet still gets its read"
  - "the header names the page and the rail still marks the surface it belongs to"
  - "pnpm build green with the Suspense boundary in place, dashboard tests green, full suite green"

facts:
  - claim: "One route serves the caller's conversations, takes no id, answers for the signed-in principal and needs the dialog-write permission."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogViewEndpoints.cs:21-22, :62-67"
  - claim: "It answers a bare array, so nothing on the wire says how many there are."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogViewEndpoints.cs:67"
  - claim: "The list caps at fifty, filters by owner in the query, parses each transcript and reads two further JSON documents per row."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogConversationList.cs:28, :31-34, :36-44"
  - claim: "The repository takes the cap by id and sorts by last activity in memory, because SQLite throws on an ORDER BY over a DateTimeOffset — so a conversation resumed today can fall outside the cap."
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Repositories/SpecDialogSessionRepository.cs:32-38, :46-59"
  - claim: "The tree's convention for a caller-named limit is an optional int clamped between one and a ceiling, against a default of 50 and a maximum of 200 held as constants on the composer."
    evidence: "src/backend/AgentSmith.Server/Extensions/RunQueryEndpoints.cs:74, src/backend/AgentSmith.Server/Services/Events/RunListComposer.cs:24, :27, src/backend/AgentSmith.Server/Extensions/RunStepQueryEndpoints.cs:81"
  - claim: "The dashboard reads the list through one helper that takes only an abort signal."
    evidence: "src/dashboard/src/lib/specDialogApi.ts:38-43"
  - claim: "Backend tests call the list service and the route handler positionally and read the Cap constant, so both signatures are pinned by the test project."
    evidence: "tests/AgentSmith.Tests/SpecDialog/DialogConversationListTests.cs:74, :81, :96, :273"
  - claim: "Opening a conversation is a hook callback, not an address, and the two branches are told apart by whether the CALLER supplied the dialog id: with one it switches to that dialog, without one it queues a '/spec resume' on a freshly minted id."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:489-499"
  - claim: "Nothing maps a session id to the dialog id it is open on except the conversation list itself; the per-dialog route is keyed by dialog id."
    evidence: "src/backend/AgentSmith.Server/Extensions/SpecDialogViewEndpoints.cs:23, src/backend/AgentSmith.Server/Models/SpecDialogSessionSummary.cs:9-12"
  - claim: "The surface's conversation mock passes no arguments through and its thirty-five mock sites answer a bare array, so a response-shape change fails at runtime rather than at typecheck."
    evidence: "src/dashboard/src/components/dialog/__tests__/SpecDialogSurface.test.tsx:76, :85"
  - claim: "The ref the predicate reads is null both for an absent row and for a page whose session id has not landed yet, and the list read swallows its own failures."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:317-321, :292-296"
  - claim: "Deleting the conversation the surface currently holds is coupled in the hook to minting a fresh dialog id, which a page calling the API helper alone would not do."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:511-527"
  - claim: "Components under components/dialog are scanned by stylesheet-vocabulary tests that ban raw utilities and require the surface's own link class."
    evidence: "src/dashboard/src/components/dialog/__tests__/dialog-surfaces.test.ts:27-37"
  - claim: "That queued command is deliberately withheld until the page has joined the new id's hub group, so a link cannot perform it."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:453-454, :470"
  - claim: "The surface takes its dialog id from browser storage and from nowhere else, so no URL carries one today."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:175, src/dashboard/src/lib/specDialogSession.ts:16-18"
  - claim: "This repository has recorded that a search-param hook fails the build for every statically rendered route."
    evidence: "src/dashboard/src/lib/places.ts:9-12"
  - claim: "The dashboard builds standalone rather than as a static export, and the spec-dialog route is a server component delegating to a client surface."
    evidence: "src/dashboard/next.config.ts:15, src/dashboard/src/app/spec-dialog/page.tsx:5-7"
  - claim: "The delete control exists on the panel row alone; no other component in the dashboard renders one."
    evidence: "src/dashboard/src/components/dialog/DialogConversations.tsx:144-153"
  - claim: "Its confirmation is a shared warning the surface asks before removing."
    evidence: "src/dashboard/src/components/dialog/conversationDelete.ts:24-31, src/dashboard/src/components/dialog/SpecDialogSurface.tsx:82-85"
  - claim: "The predicate answers 'behind' whenever no row is found for the conversation open here, and a true answer issues the expensive read on every reply."
    evidence: "src/dashboard/src/hooks/useSpecDialog.ts:317-321, :327-330, :351-355"
  - claim: "A path the PLACES table does not name leaves the header with nothing to render."
    evidence: "src/dashboard/src/lib/places.ts:64-71, src/dashboard/src/components/shell/AppHeader.tsx:18-24"
  - claim: "The layout-shell test checks a hand-maintained list of six component files for the mock shell, so a new surface has to be added to it by hand."
    evidence: "src/dashboard/src/__tests__/layout-shell.test.ts:17-26, :34-38"
  - claim: "The rail marks an entry active by exact path equality, so a subtree route leaves its surface unmarked."
    evidence: "src/dashboard/src/components/shell/AppRail.tsx:101-102"
  - claim: "The rail offers Work it out to every caller with no capability gate."
    evidence: "src/dashboard/src/components/shell/AppRail.tsx:205-210"
  - claim: "A page refuses by rendering RefusalSurface off refusalIn, as the pull-requests page does; the dialog surface does the same through FailedSurface."
    evidence: "src/dashboard/src/app/pull-requests/page.tsx:77, :107, src/dashboard/src/components/dialog/SpecDialogSurface.tsx:105"
  - claim: "An open conversation carries the dialog id it lives on and a closed one carries none, which is what tells the two apart."
    evidence: "src/backend/AgentSmith.Server/Models/SpecDialogSessionSummary.cs:9-12"
