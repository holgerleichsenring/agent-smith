assumptions:
  - "That the premise check's six-look allowance is the right budget once one look can cost a full stage. The half-hour figure is the CEILING the tool asks for; the sandbox clamps it to the operator's own step cap, 900 seconds by default, so the real worst case is half that. Argued from the cost either way, not measured on a live run."
  - "That 2026-09-20-443a lands a verify block at all: its own measurement step may refuse one, and then this phase is correct and unobservable here. And that it lands with a test command that stands alone. The requires edge is load-bearing, not a convenience: a declared test stage carrying --no-build would exit non-zero on the fresh tree a premise check sees, and this phase would mint that as admissible evidence of a failing gate — a false RED, the mirror of the false green the first cut risked. 443a's own review reached the same conclusion from the other side and drops it; if that changes, this phase must refuse a stage rather than run it."
