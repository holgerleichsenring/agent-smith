# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-27-5c1ea
goal: "A tracker can be asked for open tickets whose title or body matches typed words — bounded, ordered, and saying plainly when it could not search rather than answering empty."

applies_to: "backend (a search capability port beside the ticket provider, and one implementation per tracker)"

scope:
  in: "A capability port of its own with one implementation per tracker; title and body on every one of them and nothing else; a cap with an ordering, reported when it bites; a refusal that cannot be mistaken for an empty board; and escaping for operator-typed text, which is the first untrusted string these query languages have ever been handed."
  out: "Who calls it and what an operator sees — 2026-09-27-5c1eb. Closed tickets: a picker that returns a board's history is not a picker, and a closed ticket stays reachable by its exact id."

decisions:
  - key: |
      A CAPABILITY PORT OF ITS OWN, BECAUSE THIS REPOSITORY ALREADY REFUSED THE OTHER SHAPE IN
      WRITING. ITicketRewriter's own header records it: the spec asked for a member on the ticket
      port and the code refused, because every provider class is at its file-length baseline and
      may only get shorter. Measured again for this phase: ITicketProvider.cs, GitHubTicketProvider,
      GitLabTicketProvider, AzureDevOpsTicketProvider and AzureDevOpsWorkItemLister all sit at
      exactly their baseline — zero headroom — and JiraIssueSearcher and GitHubIssueLister are at
      114 against the 120 cap. So: a second port, four sibling classes, and a factory member, which
      is the quartet the rewriter already is.
  - key: |
      THE SEARCH PATH OWNS ITS OWN RESULT AND ITS OWN FAILURES, BECAUSE THE EXISTING HELPERS
      DESTROY EXACTLY THE TWO SIGNALS THIS PHASE IS FOR. All four listers LOG truncation and never
      return it, and all four swallow an exception into an empty list. Routing a picker through
      them would turn "your board has no such ticket" and "this tracker could not run the query"
      into one answer, and "here is a screenful of many" into "here is all of it". The first cut of
      this spec claimed three adapters already held the machinery; they hold the query building,
      and the parts that matter here are the parts they throw away.
  - key: |
      TITLE AND BODY ON EVERY TRACKER, AND NOTHING ELSE, SO THE MATCH IS ALWAYS VISIBLE. Jira's
      text ~ super-field also covers comments, environment and custom fields, while the searcher
      only ever returns summary and description — so it would show a ticket whose visible text
      contains none of the typed words. GitHub's issue search defaults to title, body and comments;
      GitLab's to title and description. Pinned per tracker: summary and description on Jira,
      title and body on GitHub, title and description on GitLab, and on Azure DevOps System.Title
      plus System.Description plus Microsoft.VSTS.TCM.ReproSteps — because a Bug's body lives in
      the last of those, which the lister already records and a Description-only clause would miss
      on every Bug on the board.
  - key: |
      TWO OPERATORS ON AZURE DEVOPS, NOT ONE, AND THE FIRST CUT NAMED THE WRONG ONE. CONTAINS WORDS
      is the full-text, whole-word operator and needs the field indexed; it does not match a
      fragment, so a typed "auth" finds nothing called "authentication" — which is most of what a
      person types into a picker. System.Title is a String field where plain CONTAINS is a
      substring match, and the long-text fields take CONTAINS WORDS. The clause is built in a class
      of its own, because the discovery WIQL builder's only public method takes a DiscoveryQuery
      that carries no text, and because the lister that would otherwise host it is at its baseline.
  - key: |
      THE SEAM ON AZURE DEVOPS IS THE LISTER'S extraWhere, AND IT ALREADY BRINGS PROJECT AND OPEN
      STATE. It AND-s the team project and the configured open states onto whatever clause it is
      handed, so scope and openness come free there. On the other three the scope is the connection
      itself — a Jira project key when one is configured, a GitLab project path, a GitHub
      repository.
  - key: |
      OPEN MEANS FOUR DIFFERENT THINGS AND ONE OF THEM IS THE OPERATOR'S GUESS. Jira asks
      statusCategory != Done, GitHub an open state filter, GitLab state=opened, and Azure DevOps a
      LIST THE OPERATOR CONFIGURES, defaulting to New, Active and Committed — which mixes two
      process templates and names no Resolved, Proposed or Approved. So on an unconfigured Agile or
      CMMI project some genuinely open work is unreachable by this search. That is a limit of the
      configuration rather than of the search, it is said here rather than discovered, and the
      search reports nothing false: it never returns a closed ticket.
  - key: |
      OPERATOR-TYPED TEXT IS THE FIRST UNTRUSTED STRING THESE QUERY BUILDERS HAVE EVER BEEN GIVEN.
      Every input they take today is configuration — labels, statuses, tag values, project keys —
      and their escaping is one character wide. A typed backslash, quote, tilde or asterisk lands
      inside a JQL or WIQL operand and comes back as a bad request, which the existing helpers
      would turn into an empty list, which reads as "your board has no such ticket". Each
      implementation escapes for its own language, and a hostile string is driven through all four.
  - key: |
      A CAP WITHOUT AN ORDERING IS A LOTTERY. The four APIs order differently by default — one by
      last change, one by relevance, two by nothing in particular — so the same cap would discard a
      different screenful per tracker. Every implementation asks for most-recently-updated first,
      and the cap is then a contract: the newest matches, and a word saying more existed. The
      reporting follows the seeded ticket text, which already carries its own truncation rather
      than logging it.

steps:
  - id: a-search-capability-of-its-own
    path: "src/backend/AgentSmith.Contracts/Providers"
    action:
      - "Add a search port and its result — the matches, whether more were held back, and a refusal carrying its reason — following the rewriter capability port and the finalize result's shape."
      - "Add the factory member that creates one for a tracker connection."

  - id: each-tracker-answers-in-its-own-language
    path: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets"
    action:
      - "Implement one search per tracker in a class of its own: a Jira JQL clause over summary and description, a GitLab search parameter over title and description, a GitHub search request scoped to the repository over title and body, and an Azure DevOps clause over title, description and reproduction steps."
      - "Order every one by most recently updated, cap the result, and report the cap rather than logging it."
      - "Escape the typed text for each query language, and answer a failed query as a refusal rather than as an empty board."

  - id: the-github-search-can-be-watched
    path: "src/backend/AgentSmith.Infrastructure/Services/Providers/Tickets"
    action:
      - "Take the GitHub client as the injected interface rather than constructing one, so what the search asks for is assertable — the ticket side has no such seam today and the source side's factory is the precedent."

  - id: the-search-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Assert the query each tracker builds, the ordering, the cap reporting what it held back, a refusal that is distinguishable from no matches, and a hostile typed string surviving every escape."

tests:
  - "TicketSearch_Jira_AsksOverSummaryAndDescriptionOrderedByUpdated"
  - "TicketSearch_JiraWithNoProjectKey_SearchesTheSiteAsTheFetchAlreadyDoes"
  - "TicketSearch_AzureDevOps_MatchesATitleFragmentAndTheReproStepsOfABug"
  - "TicketSearch_GitLab_AsksWithItsSearchParameterScopedToTheProject"
  - "TicketSearch_GitHub_AsksItsSearchEndpointScopedToTheRepositoryOverTitleAndBody"
  - "TicketSearch_MoreMatchesThanTheCap_SaysSomethingWasHeldBack"
  - "TicketSearch_ATrackerThatCannotRunTheQuery_IsDistinguishableFromNoMatches"
  - "TicketSearch_TextCarryingQuotesBackslashesAndWildcards_IsEscapedNotRefused"
  - "TicketSearch_EveryTracker_AsksForOpenTicketsOnly"

done:
  - "every configured tracker can be asked for open tickets whose title or body matches typed words"
  - "a capped result says it was capped, and the cap is the most recently updated matches"
  - "a tracker that could not run the query says so, and it never reads as an empty board"
  - "a hostile typed string is escaped by every implementation rather than returning nothing"
  - "no search reaches a closed ticket, and the Azure DevOps open-state limit is stated rather than discovered"
  - "build green, full suite green"
