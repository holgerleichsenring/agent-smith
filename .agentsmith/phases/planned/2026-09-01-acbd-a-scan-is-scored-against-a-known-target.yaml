# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-acbd

goal: "Both scans run against a target this repository owns, whose defects are declared, and each run is scored as found, missed and extra."

applies_to: "harness (a fixture target with declared defects, the two scans run against it, and the score they are given)"

requires:
  - 2026-09-01-3653

scope:
  in: >
    A small fixture holding a handful of deliberate, declared defects — source for the repo scan and
    a served surface with its own API document for the api scan; both scans run against it on an
    opt-in tier; each run is scored against the declaration as found, missed and extra; the tier
    states loudly when it cannot run instead of passing quietly.
  out: >
    A BROAD BENCHMARK — five or six defects of distinct kinds is enough to tell a change that helps
    from one that does not, and a large corpus would be a second project. THE OPERATOR'S TARGET —
    it stays the real-world check; this exists so that no measurement depends on a machine being up.
    CHANGING EITHER SCAN — the scoreboard is built here and read by the phases that change them.

decisions:
  - key: |
      NOTHING IN THIS BATCH CAN BE SHOWN TO WORK. Twelve pipeline runs produced none of the five
      defects a direct probe found in the same code, and the only reason we know that is that a
      human read both outputs. Every phase here changes a scan whose detection is measured by
      nobody, which is how a week of work produced honest reporting and unchanged findings.
  - key: |
      THE API HALF HAS BEEN UNMEASURED FOR AS LONG AS ONE MACHINE HAS BEEN OFF. Since the cut-off
      and difference changes landed, the api scan has not run once, because the target it was
      measured against is down. A pipeline whose verification depends on someone else's machine is
      unverified by default, and that is the actual defect this phase repairs.
  - key: |
      DECLARED DEFECTS, NOT A SCORE OUT OF NOWHERE. The fixture states what is wrong with it and
      where. That declaration is the whole instrument: without it a run produces a number of
      findings, and a number of findings is what we have been comparing all along.
  - key: |
      EXTRA IS REPORTED, NOT PUNISHED. A finding outside the declaration may be a false positive or
      may be a real defect the fixture's author did not notice. Counting it against the scan would
      teach the scan to find less, which is the opposite of the problem.
  - key: |
      ONE FIXTURE, BOTH SCANS. The repo scan reads its source and the api scan probes it while it is
      served, and both are scored against one declaration — so the two halves are finally comparable
      to each other, which they have never been.
  - key: |
      IT MUST BE ABLE TO SAY IT DID NOT RUN. A tier that needs a real agent binary and quietly
      passes when it is missing is worse than no tier, and the phase gate already carries that rule
      for the dashboard: a skip that cannot be told from a pass is a lie in the record.

steps:
  - id: a-fixture-declares-its-own-defects
    action: "A small fixture target carries a handful of deliberate defects of distinct kinds and a declaration naming each one and where it lives."
  - id: the-fixture-can-be-served
    action: "The fixture is servable locally with its own API document, so the api scan has a target that needs no external machine."
  - id: both-scans-run-against-it
    action: "An opt-in harness tier runs the repo scan over the fixture's source and the api scan against the served fixture."
  - id: each-run-is-scored
    action: "Each run is scored against the declaration as found, missed and extra, and the score is printed with the run's census."
  - id: a-tier-that-cannot-run-says-so
    action: "Absent prerequisites make the tier report that it did not run, never a pass."

tests:
  - "Fixture_DeclarationNamesEveryPlantedDefect"
  - "Score_CountsADeclaredDefectAsFoundWhenTheRunNamesIt"
  - "Score_CountsADeclaredDefectAsMissedWhenNoFindingNamesIt"
  - "Score_ReportsAnUndeclaredFindingAsExtra"
  - "Score_MatchesOnLocationNotOnWording"
  - "DetectionTier_WithoutItsPrerequisites_ReportsNotRun"

done:
  - "a scan change can be shown to have moved detection up or down"
  - "the api scan can be measured with no external machine involved"
  - "a missing prerequisite is visible as not-run"
  - "build green, full suite green"
