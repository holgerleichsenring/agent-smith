# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-02-3f06c
goal: "A design proposal shows, without a model call, each fact whose cited file or line does not exist in the turn's repositories, and the panel shows what the proposal rests on: its facts and assumptions."

applies_to: "spec dialog (proposal review, phase view shared with approved sets, panel), the evidence reader of 2026-10-02-3f06b, harness"

requires: [2026-10-02-3f06b]

facts:
  - claim: "The pinned design partner cites a repository-relative path and line range per fact (its example is bare), states an assumption where it did not look, and has epic children run in order, each describing what its predecessors leave."
    evidence: "observed: design-partner-master SKILL.md in agentsmith-skills-v5.7.3.tar.gz, lines 178, 192-199, 274, 285-289, 305-310, 2026-10-02"
  - claim: "The filesystem tools address repositories by a name prefix that may contain '/', longest match wins, and strip it when it matches the only repository."
    evidence: "src/backend/AgentSmith.Application/Services/Tools/FilesystemToolHost.cs:118-131; src/backend/AgentSmith.Application/Services/Tools/RepoPathRouter.cs:3-27"
  - claim: "The turn's sandboxes are keyed by repository name with templates beside them; the review look drops template and reference scopes, which are addressed 'template:…' and 'reference:…'."
    evidence: "src/backend/AgentSmith.Server/Services/SpecDialog/SpecDialogTurnSeeds.cs:28-36; src/backend/AgentSmith.Application/Services/Specs/DerivationLookFactory.cs:97-110"
  - claim: "The review's model call, its early return on no findings and the single write share one try, caught on the run's token."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/SpecDialogProposalReview.cs:36-37,47-62"
  - claim: "A finding is {PhaseId, Problem, Why, Quote, Evidence}."
    evidence: "src/backend/AgentSmith.Contracts/Models/ProposalFinding.cs:3-26"
  - claim: "A source scope reads one file by step result, telling 'file not found' from a read that could not run, inside ContainedPath."
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SourceScopeLook.cs:85-103"
  - claim: "A file read answers 'file not found' for a directory as well, on the agent and in-process; a file over 1 MB answers an error."
    evidence: "src/backend/AgentSmith.Sandbox.Agent/Services/FileStepHandler.cs:52-60; src/backend/AgentSmith.Sandbox.Wire/SizeLimits.cs:5"
  - claim: "Application's one phase-id regex is private to RequiresEdgeChecker."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/RequiresEdgeChecker.cs:14-17"
  - claim: "A source scope clones on its first step and reports whether it has."
    evidence: "src/backend/AgentSmith.Application/Services/Sandbox/SourceScopeSandbox.cs:37-61"
  - claim: "Epic children are ordered by requires edges that name a sibling; other requires text passes through."
    evidence: "src/backend/AgentSmith.Application/Services/SpecDialog/EpicChildOrderer.cs:30-40"
  - claim: "The phase view the panel and approved sets render carries no facts or assumptions; the panel says the template emits neither."
    evidence: "src/backend/AgentSmith.Server/Models/SpecDialogPhaseView.cs:11-18; src/dashboard/src/types/spec-dialog.ts:250-260; src/dashboard/src/components/dialog/DialogProposalPanel.tsx:21-23"
  - claim: "The shared stub sandbox answers every read with exit 0; the review is constructed by hand in a fixture."
    evidence: "tests/AgentSmith.Tests/TestHelpers/StubSandbox.cs:53-66; tests/AgentSmith.Tests/Handlers/MasterHandlerFixture.cs:53-57"

assumptions: []

scope:
  in: >
    SandboxEvidenceProbe over the review look's filtered repository map (templates and references never count): the
    repository is the longest-key prefix (RepoPathRouter gains an ISandbox overload); an unmaterialised source scope is
    never stepped — NotChecked; a sandbox that is not a source scope counts as materialised. With one repository a path
    is tried stripped and unstripped: File wins, NotAFile only if both are. A bare path in several repositories: one
    File resolves, otherwise NotChecked. One whole-file ReadFile per (repository, path), cached: exit 0 is
    File(lines, a trailing newline not counted — the rule 3f06b's filesystem probe shares), 'file not found' is
    NotAFile, anything else — over 1 MB, a wrapped failure, a path leaving the root — NotChecked. Each read reported as
    TurnActivity Tool. Product policy (3f06b): minted accepted;
    no reference and every qualifier NotChecked. Checked drafts: a single phase whose requires names no phase id
    (RequiresEdgeChecker's regex made public, not copied), an epic parent, the first child in EpicChildOrderer order —
    the parent only when the order errs. Order in SpecDialogProposalReview: probe in its own guard,
    model review in its own guard, one write of both lists when non-empty. Problem 'cited evidence does not resolve', Quote the claim, Why
    reason and path, Evidence null (it names minted look lines only); both guards keep the run-token filter.
    SpecDialogPhaseView (built only by SpecDialogProposalComposer.View, so approved sets follow) and the TS type gain
    optional facts and assumptions; the panel renders them.
  out: >
    The run-time premise check. Refusing or re-prompting the turn. Telling a directory from a missing file.

decisions:
  - key: "ROUTE AS THE TOOLS DO. Paths arrive with or without the repository prefix; a rule that ignored either would report correct citations — the fabricated finding this check exists to stop."
  - key: "NOT A FILE IS ONE ANSWER. Missing and directory lead to the same correction; telling them apart needs a wire change at two ratchet ceilings for no different action."
  - key: "UNCERTAIN IS NOT CHECKED. A failed read, an unopened scope, an ambiguous bare path: no finding. On an edit turn nothing is materialised until the partner reads, so little is checked there — accepted."
  - key: "LATER WORK IS NOT CHECKED. A later child or a phase requiring another describes a state not built yet."
  - key: "THE WHOLE FILE, COUNTED. It fits 3f06b's File(lineCount) and one cache entry serves every fact citing the file; the 1 MB read cap turns a giant file into NotChecked."
  - key: "SKIPPING IS CONSERVATIVE. A phase requiring a done phase goes unchecked too; a missed check costs less than a false finding."

steps:
  - id: router
    action: "RepoPathRouter overload over ISandbox."
  - id: probe
    action: "SandboxEvidenceProbe with routing, whole-file read, cache and activity."
  - id: review
    action: "ProposalEvidenceReview (draft selection, findings); SpecDialogProposalReview reordered; DI and MasterHandlerFixture."
  - id: view
    action: "SpecDialogPhaseView + composer View() + spec-dialog.ts + test builder; DialogProposalPanel facts and assumptions, stale comment gone."
  - id: harness
    action: "StubSandbox gains a set of missing paths (empty by default) answered with StepErrors.FileNotFound; the positive harness case writes the cited file first."

tests:
  - "SandboxEvidenceProbe_PrefixedPath_ResolvesInThatRepository"
  - "SandboxEvidenceProbe_SingleRepoFolderNamedLikeTheRepo_IsNotMissing"
  - "SandboxEvidenceProbe_LinePastTheEnd_IsAProblem"
  - "SandboxEvidenceProbe_UnmaterialisedScope_IsNotCheckedAndNotStepped"
  - "SandboxEvidenceProbe_TrailingNewline_IsNotALine"
  - "SandboxEvidenceProbe_BarePathInTwoRepositories_IsNotChecked"
  - "ProposalEvidenceReview_FactCitingAMissingFile_AddsAFinding"
  - "ProposalEvidenceReview_TemplateQualifiedPath_IsNotChecked"
  - "ProposalEvidenceReview_LaterEpicChild_IsNotChecked"
  - "SpecDialogProposalReview_ModelFindsToo_BothKindsKept"
  - "SpecDialogProposalReview_ModelReviewFails_KeepsTheEvidenceFindings"
  - "SpecDialogOutcome_ProposalCitingAMissingFile_CarriesTheFinding (harness, ProposalReview partial)"
  - "DialogProposalPanel renders facts with evidence and assumptions"

done:
  - "a design turn proposing a phase whose fact cites a missing file shows that finding; one citing an existing prefixed path shows none"
  - "build green, full suite green, dashboard tests and build green"
