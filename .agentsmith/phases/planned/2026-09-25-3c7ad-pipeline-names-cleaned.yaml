# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-25-3c7ad
goal: "The configuration offers the pipelines agent-smith actually has, and the retired alias names leave the code, the stored configuration and the form."

applies_to: "backend (the preset registry, the resolver's fallback and the config studio's capabilities) and dashboard (the tracker routing form)"

scope:
  in: "Moving the three alias names the framework itself uses onto their targets; offering the real preset names as a choice in the tracker form; rewriting stored configuration that names an alias; deleting the alias map; and a named startup finding for a file-based configuration that still carries one."
  out: "RetiredPresets — skill-manager and autonomous validate with a reason and have NO replacement, which is a different mechanism from an alias. Also out: any change to what a preset DOES."

decisions:
  - key: |
      THE RIGHT-HAND BOX IS FREE TEXT AND ITS VALUE IS UNGUESSABLE. The tracker routing form takes a
      label on the left — the operator's own vocabulary, rightly free — and a PIPELINE on the right,
      which is ours and closed. Nothing tells the person typing it what the legal values are, and the
      operator's live configuration names three that no longer exist as presets.
  - key: |
      THREE OF THE FOUR ALIASES ARE OUR OWN CONSTANTS, NOT OPERATOR CONFIGURATION, AND THAT IS THE
      TRAP IN A PLAIN DELETION. ProjectResolver RETURNS PipelinePresets.PhaseExecutionName as the
      chosen pipeline for a ticket that hard-binds, and that name is an alias; UndeclaredFallbackPipeline
      IS the string "fix-bug", is what PipelineResolver answers when nothing declares a fallback, and
      is rendered to the operator by the dashboard's own routing explanation. Deleting the map first
      would leave our own routing naming a preset that does not exist.
  - key: |
      SO THE ORDER IS FIXED: MOVE, REWRITE, THEN DELETE. Move the three constants onto `code`; rewrite
      the stored configuration — it lives in the entity-document store since p0349, so this is a
      migration and not a request to hand-edit YAML; then delete the alias map. Nothing in between
      leaves a deployment naming a preset nobody resolves.
  - key: |
      THE CLI KEEPS ITS FILES, SO THE REFUSAL HAS TO SPEAK. A migration cannot reach a file-based CLI
      configuration. A configuration naming a deleted alias therefore produces a startup finding that
      NAMES THE REPLACEMENT — "fix-bug is now code" — rather than resolving silently, which is what
      hides the staleness today, or failing with a lookup error, which tells the operator nothing.
  - key: |
      A CHOICE FIELD KIND, BECAUSE THE DESCRIPTOR HAS ONLY text/list/bool/map. TrackerCapabilityFields
      is the single source for both the rendered form and the upsert validation, explicitly so the two
      cannot drift. A dropdown built in the client from a hard-coded list would be exactly that drift,
      so the allowed values travel with the descriptor.
  - key: |
      WHAT IS OFFERED IS NOT WHAT IS ACCEPTED. PipelinePresets already distinguishes the names it
      OFFERS from the names a configuration may legitimately carry. The offer is the preset names minus
      spec-dialog, which is a conversation and not something a ticket routes to; acceptance keeps
      admitting everything it admits today except the aliases this phase removes.

steps:
  - id: the-framework-stops-naming-an-alias
    path: "src/backend/AgentSmith.Application/Services"
    action:
      - "Bind a phase-execution ticket to the code preset by its own name, and make the undeclared fallback name the code preset."
    modify:
      - "src/backend/AgentSmith.Application/Services/Triggers/ProjectResolver.cs"
      - "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.cs"
      - "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.PhaseExecution.cs"

  - id: stored-configuration-is-rewritten
    path: "src/backend/AgentSmith.Infrastructure.Persistence"
    action:
      - "Rewrite pipeline names in the stored configuration documents from each retired alias to its target, once, reporting what was changed."

  - id: the-aliases-are-deleted-and-the-finding-speaks
    path: "src/backend/AgentSmith.Contracts/Commands"
    action:
      - "Delete the alias map, and produce a startup finding naming the replacement for a configuration that still carries a retired name."
    modify:
      - "src/backend/AgentSmith.Contracts/Commands/PipelinePresets.cs"

  - id: the-form-offers-what-exists
    path: "src/backend/AgentSmith.Contracts"
    action:
      - "Add a choice field kind carrying its allowed values, and declare the routing map's value side as a choice over the offered preset names."
    modify:
      - "src/backend/AgentSmith.Contracts/Models/ConfigStudio/ConfigCapabilities.cs"
      - "src/backend/AgentSmith.Contracts/Services/TrackerCapabilityFields.cs"

  - id: the-studio-renders-the-choice
    path: "src/dashboard/src/components/config"
    action:
      - "Render a choice field as a select over its declared values, and name the undeclared fallback by the preset it now is."
    modify:
      - "src/dashboard/src/components/config/TrackerRouting.tsx"

  - id: the-cleanup-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Assert a bound ticket resolves to code, a configuration naming a retired alias is reported with its replacement, and the offered values exclude the conversational preset."

tests:
  - "Routing_ABoundTicket_ResolvesToTheCodePreset"
  - "Presets_TheUndeclaredFallback_IsTheCodePreset"
  - "Presets_AConfigurationNamingARetiredAlias_ProducesAFindingNamingTheReplacement"
  - "Presets_RetiredPresets_StillValidateWithTheirReason"
  - "Capabilities_TheRoutingValue_IsAChoiceOverTheOfferedPresets"
  - "Capabilities_TheOfferedPresets_ExcludeTheConversationalPreset"
  - "TrackerRouting_AChoiceField_RendersAsASelect"

done:
  - "no preset alias remains in the code, the stored configuration or the form"
  - "a ticket that binds to phase execution still runs the code preset"
  - "a configuration naming a retired alias is reported at startup with the name to use instead"
  - "the routing form offers the real preset names instead of a free-text box"
  - "skill-manager and autonomous still validate with their reason"
  - "build green, dashboard tests green, full suite green"
