# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-3bff
goal: "The sandbox agent connects to Redis using only the commands its job loop needs, so a release exists whose agent a job-scoped Redis user can serve and the next release can require."

applies_to: "backend (Sandbox.Agent Redis connection)"

requires: []

scope:
  in: >
    The agent's ConfigurationOptions: an explicit server version, no client-library announcement, no
    configuration channel or tie-breaker, CONFIG, INFO and CLUSTER mapped out, and a reconnect policy
    whose retry interval stays below the heartbeat TTL. Proven against real Redis both as the default
    user (today's deployments) and as a user restricted to the job loop's commands.
  out: >
    Creating job users, the version floor and every server-side change: 2026-09-28-23a2a, which
    requires this phase to have shipped in a published release.

decisions:
  - key: |
      SPLIT OUT OF 23a2a SO ITS FLOOR HAS A NUMBER. The operator ruled that agent images below the
      per-job release are refused by name. The release number is chosen by release-please after merge,
      and an unpinned trunk build derives the last released tag (AgentVersionResolver.cs:18-22, 34-36),
      so a floor naming the release that also ships the narrowing would refuse every trunk build.
      Shipping the narrowed agent first gives 23a2a a published version to name.
  - key: |
      HARMLESS ALONE. Every change removes a call the agent does not need — its job loop issues only
      RPOP, LPUSH, XADD, SETEX, DEL and SISMEMBER (RedisJobBus.cs:48, 64, 70; RedisEventChannel.cs:91;
      HeartbeatLoop.cs:59, 76) — so today's unauthenticated deployments are unaffected.
  - key: |
      NO CLIENT SETINFO. CLIENT SETINFO arrived in Redis 7.2; naming it in an ACL rule fails ACL
      SETUSER on 7.0 and 7.1. Not announcing the client library removes the call, so the job user's
      rules work from Redis 7.0 up, the first version with the %R~ selector 23a2a uses.
  - key: |
      THE RECONNECT INTERVAL IS BOUNDED. The heartbeat key lives 10 seconds (HeartbeatLoop.cs:19);
      after a Redis restart the agent must be retrying often enough to rewrite it once its user is
      re-created. The client's default backoff is not pinned here, so the agent pins its own.
  - key: |
      SERIES: turned up in the review of 2026-09-28-23a2a; own number per the minting rule. It
      precedes 23a2a.

steps:
  - id: the-connection-is-narrowed
    path: "src/backend/AgentSmith.Sandbox.Agent/Services/RedisJobBus.cs"
    action: "Build the agent's ConfigurationOptions as above, in a type of its own that both the bus and its tests use."
    new:
      - "AgentRedisConnectionOptions: the agent's narrowed connection settings"
  - id: it-is-pinned
    path: "tests/AgentSmith.Sandbox.Agent.Tests"
    action: "Against real Redis 7 (RedisJobBusFixture.cs:7-9): the full job loop as the default user, and as a user granted only the job-loop commands on the job's keys plus PING and CLIENT SETNAME."

tests:
  - "AgentRedisConnectionOptions_Build_MapsOutConfigInfoClusterAndStatesTheVersion"
  - "AgentRedisConnectionOptions_Build_ReconnectIntervalBelowHeartbeatTtl"
  - "RedisJobBus_DefaultUser_JobLoopRuns"
  - "RedisJobBus_RestrictedUser_JobLoopRunsWithNoOtherCommand"

done:
  - "the agent runs its job loop as a Redis user restricted to its commands, on Redis 7.0 and later"
  - "today's deployments are unaffected"
  - "the release containing it is published before 23a2a is started"
  - "build green, full suite green"
