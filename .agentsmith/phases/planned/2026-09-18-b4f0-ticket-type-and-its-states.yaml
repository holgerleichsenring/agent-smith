# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-b4f0

goal: "An operator chooses which kind of work item a filing creates, on the two trackers that send one, defaulting to what each creates today so no installation changes behaviour."

applies_to: "backend (the Azure DevOps and Jira providers' create, the tracker configuration, the config studio descriptor) + dashboard (the tracker form)"

scope:
  in: >
    The kind of work item a filing creates becomes a field of the tracker's configuration for the two
    providers that actually send one, defaulting per provider to the literal each sends today, so an
    installation that sets nothing behaves exactly as it does now. The create for both moves into a
    collaborator that owns the kind and the payload, for two different reasons: the Azure DevOps kind is
    an argument to a call on a client the provider builds itself, so no test can see it today, while
    the Jira kind is already in its payload and already asserted — there the reason is the ratchet. The config studio descriptor and the tracker form carry
    the field for those two provider types only.
  out: >
    GITHUB AND GITLAB. Neither has a kind whose state list this choice would change — one carries
    lifecycle as labels, the other as three state events. They declare no field rather than one that
    answers "cannot".
    WHETHER THE CONFIGURED LIFECYCLE STATUSES EXIST FOR THE CHOSEN KIND. Named in prose as the phase
    that checks a configured lifecycle status against the kinds a tracker can claim. It does not, on
    its own, prevent the incident below: a status a Task lacks is usually carried by some other kind in
    the same project, so a check that only reports a status no kind accepts would stay silent on it.
    What prevents the incident is choosing the right kind, which is this phase.
    CHOOSING THE KIND FROM THE WORK. Letting the model propose it needs the status check underneath;
    named in prose as the phase that proposes a work-item kind from the outcome and holds the proposal
    to that check.
    HIERARCHY RULES. Whether a kind may parent another is the tracker's own process rule; a filing
    that violates it already fails at the link and is reported as a filing note.
    TICKETS ALREADY FILED. A kind is chosen for what is created next.

decisions:
  - key: |
      THE KIND IS A CONSTANT IN TWO PROVIDERS, NOT ONE. The Azure DevOps create passes the literal
      "Task"; the Jira create sends the same literal as its issue type. The first draft of this phase
      measured only the first and budgeted room only for it. Both files sit at their ratchet baselines
      and may not grow, which is why the create moves out of both rather than gaining a parameter.
  - key: |
      A TASK WAS THE WRONG LEVEL, NOT ONLY THE WRONG STATE. Observed 2026-09-18: a filing created a
      Task, the configured failed status was one a Task does not have, and every run on that ticket
      ended with a rejected status write. But a Task is also the wrong shape for a work ticket that
      carries slice records beneath it — hierarchy in the default processes runs through the levels
      above it. Making the kind a choice is the half this phase does.
  - key: |
      THE OTHER TWO CARRY LIFECYCLE AS LABELS OR OPEN-AND-CLOSED, WHICH IS THE DURABLE REASON. GitHub
      applies any status that is not open or closed as a label, and GitLab accepts three state events;
      neither has a kind whose state list this choice would change. Saying instead that their clients
      expose no type would rest on a pinned library version rather than on a design. The descriptor
      gains the field for the two provider types whose kind decides a state list.
  - key: |
      THE DESCRIPTOR ALREADY CARRIES TWO PROVIDER-SPECIFIC FIELDS, SO THE RULE MUST SAY WHICH WINS. Its
      workflow fields include a parent link type and lifecycle status names, both Jira-only, rendered on
      every tracker form today. This phase declares its field per provider type, which the coverage test
      permits because it unions across types; moving the existing two is named in prose as the phase
      that makes every provider-specific tracker field declare the types it applies to.
  - key: |
      TWO PROVIDERS, TWO REASONS TO EXTRACT. Azure DevOps passes the kind as an argument to a call on a
      client its provider constructs internally, so nothing today can assert what kind it creates —
      there the extraction is what makes the test writable. Jira builds its issue type into the payload
      and a test already asserts it; there the extraction buys only the line the ratchet refuses to
      give. Saying both is what stops a reader believing the second is the first.
  - key: |
      ROOM, INCLUDING THE DESCRIPTOR. The two provider files have one line each against their
      baselines, and the config studio capability descriptor has one against 259 while this phase adds
      a field declaration and two arms — so its field list moves out with it. The configuration thread
      is nine files, and the tracker entity's constructor takes the new parameter APPENDED, never
      inserted, because its mapping is positional and a shift is silent.
  - key: |
      TODAY'S LITERAL IS THE DEFAULT, PER PROVIDER. Every existing installation has a configuration
      written against what its provider creates now. The default is that literal, so this phase alone
      changes nothing anywhere until an operator chooses otherwise.

steps:
  - id: the-create-moves-out
    action: "The Azure DevOps and Jira creates move into a collaborator each, owning the kind and the payload; both providers shrink."
  - id: the-kind-is-configured
    action: "The tracker configuration carries the work-item kind, defaulting per provider to the literal it sends today."
  - id: the-form-carries-it
    action: "The config studio descriptor and the tracker form carry the field for the two provider types that send a kind, and for no others."

tests:
  - "Create_ConfiguredKind_IsWhatTheAzureDevOpsCreateSends"
  - "Create_ConfiguredKind_IsWhatTheJiraCreateSends"
  - "Create_NoConfiguredKind_IsTheLiteralEachProviderSendsToday"
  - "Create_GitHubAndGitLab_SendNoKindAndDeclareNoField"
  - "Descriptor_TheKindField_IsDeclaredOnlyForTheProvidersThatSendOne"
  - "Capabilities_TheRealDescriptorPayload_DeclaresTheKindForTwoTypesAndNotTheOthers"

done:
  - "an operator chooses the kind of work item a filing creates, per tracker, on the two trackers that have one"
  - "an installation that configures nothing creates exactly what it creates today"
  - "a test can assert the kind Azure DevOps creates, which it cannot today"
  - "build green, full suite green, dashboard tests green, file-length ratchet green"
