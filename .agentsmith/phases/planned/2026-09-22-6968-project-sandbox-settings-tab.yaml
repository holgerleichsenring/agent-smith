  - "ProjectProjection_AProjectWithScalarSandboxOverrides_ProjectsThemAll"
  - "ProjectProjection_AProjectWithNoSandboxBlock_ProjectsAbsenceNotDefaults"
  - "InheritedProjection_AProjectThatOverridesAValue_StillReportsWhatItWouldInherit"
  - "InheritedProjection_AProjectThatOverridesNothing_ReportsTheSameValueAsTheEffectiveOne"
  - "InheritedProjection_AToolchainImageWithNoOverride_IsReportedAsRunResolvedNotAsEmpty"
  - "ProjectPatch_AnEntityWithNoSandboxBlock_LeavesTheStoredBlockUntouched"
  - "ProjectPatch_ASentBlockWithANullField_ClearsThatFieldToInherit"
  - "ProjectPatch_ASentBlock_LeavesTheStructuredOverridesItDoesNotCarryUntouched"
  - "ProjectForm_TheSandboxTab_RendersTheFiveScalarControlsWithTheirInheritedPlaceholders"
  - "ProjectForm_ADraftProjectWithNoResolvedRow_ShowsTheProcessWideValues"
  - "ProjectForm_ARunResolvedToolchainImage_SaysItIsDetectedAtRunTimeRatherThanShowingABlank"
  - "ProjectForm_ClearingAControl_SendsNullRatherThanZeroOrTheEmptyString"

done:
