# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-14-620e

goal: "A template is picked from what exists, not typed from memory, so the studio can declare one and a typo is impossible rather than merely refused later."

applies_to: "backend (a context-listing endpoint) + dashboard (the project form)"

requires:
  - 2026-09-13-5fa0

scope:
  in: >
    An endpoint that lists the contexts of a repo ref — read through ISourceProvider.
    ListDirectoryAsync over `.agentsmith/contexts`, the same call SandboxLanguageResolver already
    makes, which needs no sandbox and no run; the capabilities descriptor offers the templates
    field so the studio draws it; the project form binds a template per context, with the target
    project and its repo ref chosen from the catalog the studio already holds and BOTH context
    names chosen from what the endpoint returns; a repo the endpoint cannot read says so and the
    field falls back to text rather than blocking the form.
  out: >
    A BRANCH PICKER FOR THE REVISION. No source provider lists refs — CheckoutAsync takes a branch
    name and nothing enumerates them — so the revision stays free text, verified where it is
    fetched (2026-09-13-9802). Listing refs is a provider capability with its own phase.
    VALIDATING A CONTEXT NAME AT WRITE TIME. The endpoint makes a typo unlikely; it does not make
    the stored name checkable, because the target repository moves independently of this
    configuration. The refusal stays where the template is fetched.
    A PICKER ANYWHERE ELSE. This is the project form. What else might want contexts is a question
    this endpoint answers when something asks.

decisions:
  - key: |
      FOUR FREE TEXT FIELDS WOULD NOT HAVE BEEN HONEST, THEY WOULD HAVE BEEN A SHIFTED ERROR. The
      first cut of the template work scoped the studio out on the grounds that "contexts are
      discovered inside a run and no endpoint serves them, so a typed picker has no data". The
      first half is true and the conclusion does not follow: three of the five fields are already
      in the catalog the studio holds, and the other two are readable without a run.
  - key: |
      CONTEXT DISCOVERY NEEDS NO SANDBOX, WHICH IS THE FACT THE FIRST CUT MISSED.
      SandboxLanguageResolver.ListContextsAsync reads `.agentsmith/contexts` through
      ISourceProvider.ListDirectoryAsync on the default branch — a provider call, not a checkout.
      What is unavailable at config time is a context's CONTENT, not its NAME, and a picker needs
      only the name.
  - key: |
      THE REVISION STAYS TYPED, AND THAT IS SAID OUT LOUD RATHER THAN QUIETLY SHIPPED. Nothing in
      the product enumerates refs. Leaving one field free while the other four are picked is
      honest about where the remaining risk is; pretending the whole form is safe would not be.
  - key: |
      AN UNREADABLE REPOSITORY DEGRADES THE FIELD, NEVER THE FORM. A token that cannot reach the
      target, a repository that has not been initialised, a host that is down — none of those is a
      reason an operator cannot finish editing a project. The field says why it could not offer a
      list and accepts a name.

steps:
  - id: an-endpoint-lists-a-repo-ref-s-contexts
    action: "A config endpoint returns the context names under .agentsmith/contexts for a given repo ref, through the source provider."
  - id: the-capabilities-descriptor-offers-the-field
    action: "The templates field is described so the studio draws it; a backend field the descriptor does not offer is a capabilities gap, not a UI omission."
  - id: the-project-form-picks-instead-of-typing
    action: "Target project and repo ref come from the catalog; both context names come from the endpoint; the revision is typed."
  - id: an-unreadable-repository-says-so
    action: "A repo whose contexts cannot be listed reports why and the field accepts a typed name."

tests:
  - "ListContexts_RepoWithTwoContexts_ReturnsBothNames"
  - "ListContexts_RepoWithoutTheDirectory_ReturnsEmptyAndSaysSo"
  - "ListContexts_UnreachableRepo_ReportsTheReasonNotAnEmptyList"
  - "Capabilities_DescribesTheTemplatesField"
  - "ProjectForm_PicksTargetProjectRepoAndBothContexts"
  - "ProjectForm_RevisionStaysFreeText"
  - "ProjectForm_SaveOmittingTemplates_StillPreservesThem"

done:
  - "an operator declares a template in the studio without typing a project, a repo or a context name"
  - "a repository whose contexts cannot be listed leaves the form usable and says why"
  - "the revision is the only typed field, and the form says it is verified where it is fetched"
  - "a save from a client that does not know the field still preserves a stored declaration"
  - "dashboard tests and build green, backend build green, full suite green"
