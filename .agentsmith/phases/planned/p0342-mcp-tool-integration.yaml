# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0342
goal: "A coding run can call the tools of EXTERNAL MCP servers (Jira, GitHub, a DB, a filesystem MCP, …) that are explicitly allow-listed for its project — the master gets those tools in its agentic surface alongside the built-in ones AND is told in its prompt which servers it has, so a run reaches capabilities agent-smith does not hand-build. Remote transports first; the allow-list is the trust gate. Pulled through end to end: config + client + tool host + master prompt + skills release + embedded pin, so a master can actually reach an MCP tool the day this ships."

applies_to: "backend (AgenticMasterHandler.ComposeMasterTools, config loader, a new Infrastructure MCP client) + dashboard (config studio) + skills catalog (coding master placeholder)"

requires: []  # touches ComposeMasterTools (also edited by p0341) but no hard dependency

packages:
  - "ModelContextProtocol.Core 1.1.0 (client-only half of the official .NET MCP SDK)"

decisions:
  - key: "Use the official .NET MCP SDK. Its McpClientTool DERIVES from Microsoft.Extensions.AI AIFunction — which the agentic loop already speaks (AITool/AIFunction) — so ListToolsAsync() output drops straight into the tool surface with NO adapter/parsing layer. This is the single biggest reason MCP fits cleanly here."
  - key: "Take ModelContextProtocol.CORE at EXACTLY 1.1.0 — the version choice is forced, not preferred. M.E.AI is pinned exact to [10.3.0] (p0185, Anthropic.SDK 5.10.0). MCP.Core 1.1.0 depends on M.E.AI.Abstractions 10.3.0; 1.2.0 wants 10.4.1 and 1.3.0+ want 10.5.2-10.8.3, all of which break the pin. `.Core` is the client-only package — the full ModelContextProtocol package drags in the ASP.NET server host we do not build here. Bump this together with the M.E.AI pin when tghamm/Anthropic.SDK#197 lands, never alone."
  - key: "REMOTE transports (SSE / streamable HTTP) first; stdio deferred to a named p0342b. In the spawned-orchestrator model the master runs in an ephemeral pod, so an stdio MCP server would need its binary baked into the runtime image (friction + image bloat); a remote server is just a URL the pod calls out to. Remote covers the common enterprise case (hosted Jira/GitHub/DB MCP) first."
  - key: "Trust lives in the ALLOW-LIST, in the type system — not a warning. An MCP tool is an arbitrary capability (run_command-class danger). A run sees ONLY the servers explicitly referenced by its project/agent; an unlisted server ref is REJECTED at resolve time, never implicitly mounted. No global/implicit MCP surface."
  - key: "Coding master ONLY (ReadWriteWithHuman surface). Scan / spec-dialog keep their read-only contract and get no MCP tools. Sub-agents do NOT inherit MCP by default — keep the blast radius on the top-level master; widening is a later decision, not a default."
  - key: "FAIL-OPEN on an unreachable/erroring MCP server — mirror the web surface. A down MCP server LOGS a loud warning and the run proceeds with the tools it did get; an external dependency being offline must not kill an otherwise-good run. (A run that genuinely REQUIRES a tool fails later at the work itself, honestly, not at tool-mount.)"
  - key: "MCP tool names are NAMESPACED (server/tool) so an external tool can never shadow a built-in (write_file, run_command, update_progress, …). Collision with a framework tool is a correctness hazard, not a nicety. McpClientTool.WithName() renames without wrapping."
  - key: "DISCOVERY IS TWO LAYERS AND BOTH ARE BUILT. The tool array alone lets the model CALL an MCP tool (each McpClientTool is an AIFunction with name/description/schema in every turn) but never tells it that a Jira MCP exists FOR THIS PROJECT — so a plan is made without it. The master therefore also gets a rendered capability block naming the mounted servers and their tools, exactly like p0356's `## Sandbox toolchain` statement. Its contract is the probe's: only servers that ACTUALLY mounted appear — fail-open means an unreachable server is ABSENT, never a fabricated inventory."
  - key: "The capability block enters via a {McpToolsSection} PLACEHOLDER in the coding master, not by appending to masterBody. Appending would have made the phase self-contained in this repo, but the skill could not then decide where the block sits or how it frames external tools. Placeholder = the skill owns the prose; the cost is a skills release + an embedded-pin bump, which this phase carries rather than defers. Bind it in AgenticMasterHandler and register it in MasterPromptTokens (an unbound known token must be detected, not shipped verbatim)."
  - key: "TRANSPORT IS A CLOSED ENUM SERVED FROM CODE TRUTH, not a string. The studio's transport field was free text with a hardcoded 'http' default, and the value was never consumed, so nothing caught that 'http' is a URL scheme rather than an MCP transport. Model McpTransport (auto | sse | streamable_http) with EnumMember wire names, publish it on ConfigCapabilities like ResolutionStrategies, enforce it on write like ValidateProjectResolution, and render it as a select. Verified: no mcp_servers block exists in any config in the repo, so there is no legacy value to migrate."

steps:
  - id: mcp-config
    action: "Add the mcp_servers transport vocabulary + per-project allow-list refs; bind + validate at load"
    new:
      - "McpTransport enum (Contracts, EnumMember wire names auto|sse|streamable_http) + McpServerConfig { Name, Transport, Url, AuthSecret, Tools? } materialized like agent/tracker/repo refs"
    modify:
      - "RawProjectEntry + ProjectEntity + ResolvedProject: an `mcp:` list of catalog refs (the allow-list)"
      - "ConfigReferentialValidator.ValidateProject: an unknown mcp ref is rejected, matched under ConfigNames.Comparer like every other ref"
      - "ConfigStudioCapabilities: publish McpTransports from the enum + ValidateMcpServer (unknown transport / empty url rejected on write)"
      - "ConfigCatalogMapper / RawConfigPatch: carry the allow-list + the typed transport through the studio round-trip"
      - "config/agentsmith.schema.json + agentsmith.example.yml: declare mcp_servers and the project ref"
  - id: mcp-client
    action: "Infrastructure MCP client behind an abstraction — connect (SSE/streamable HTTP), list tools, own the connection lifecycle"
    new:
      - "IMcpToolProvider (Contracts) + McpToolProvider (Infrastructure): connects the allow-listed servers via HttpClientTransport (HttpTransportMode from McpTransport, auth header from the secret NAME resolved through the existing secrets mechanism), McpClient.CreateAsync + ListToolsAsync -> IReadOnlyList<AIFunction>; fail-open (log + skip) on an unreachable server; applies the per-server tool allow-list; disposes its clients with the run"
    modify:
      - "AgentSmith.Infrastructure.csproj: add ModelContextProtocol.Core 1.1.0 with the pin rationale next to the M.E.AI comment"
  - id: mcp-tool-host
    action: "Expose the resolved MCP tools in the master surface as an IToolHost, coding masters only"
    new:
      - "McpToolHost (IToolHost): wraps IMcpToolProvider's AIFunctions (namespaced server/tool names); GetTools returns them for the ReadWrite surface"
    modify:
      - "AgenticMasterHandler.ComposeMasterTools: mount McpToolHost for the coding master only (not scan/spec-dialog, not sub-agents by default), resolving the project's allow-listed servers"
  - id: mcp-prompt
    action: "Tell the master what it got — the rendered capability block, from the tools that actually mounted"
    new:
      - "McpCapabilitySection: renders `## External tools (MCP)` from the MOUNTED tools (server -> namespaced tool names + first description line); empty string when nothing mounted, so a run with no MCP says nothing rather than claiming an empty catalog"
    modify:
      - "AgenticMasterHandler: bind [\"McpToolsSection\"] for the coding master (empty for scan/spec-dialog)"
      - "MasterPromptTokens.All: register McpToolsSection so an unbound token is caught"
  - id: mcp-ui
    action: "Config studio: transport becomes a select over the served list, and the allow-list becomes editable"
    modify:
      - "EntityForm: transport TextField -> Select fed from capabilities.mcpTransports (no client-side vocabulary)"
      - "entities.ts: drop the hardcoded `transport: \"http\"` default — a new server starts on the first served transport"
      - "EntityForm project card: multi-RefSelect over the mcp-servers catalog for the project's allow-list"
      - "configApi.ts: StudioMcpServer.tools?, StudioProject.mcp, ConfigCapabilities.mcpTransports"
  - id: mcp-skill
    action: "Ship the master half — the placeholder and the prose that frames external tools"
    modify:
      - "agent-smith-skills coding master: {McpToolsSection} placeholder + a short capability framing (what these tools are, that they are the project's own systems, that absence of the block means none are mounted); release the catalog"
      - "AgentSmith.Infrastructure.Core.csproj: bump SkillsCatalogVersion + SkillsCatalogSha256 to that release"
      - "docs/configure-it: document the mcp_servers catalog, the transports, and the per-project allow-list"

tests:
  - "McpConfig_ParsesServersAndPerProjectAllowList"
  - "McpConfig_UnknownServerRef_FailsValidation"
  - "McpConfig_UnknownTransport_FailsValidation"
  - "McpCapabilities_PublishesEveryTransportWireName"
  - "McpToolProvider_ListsAllowListedTools_AsAIFunctions"
  - "McpToolProvider_UnreachableServer_FailsOpenWithWarning"
  - "McpToolProvider_PerServerToolAllowList_FiltersTools"
  - "McpToolHost_ExternalToolName_NamespacedToAvoidBuiltinCollision"
  - "ComposeMasterTools_ScanMaster_HasNoMcpTools"
  - "ComposeMasterTools_CodingMaster_MountsProjectAllowListedMcpTools"
  - "McpCapabilitySection_ListsOnlyMountedServers"
  - "McpCapabilitySection_NothingMounted_RendersEmpty"
  - "MasterPromptTokens_McpToolsSection_IsBound"
  - "dashboard: transport renders as a select over the served transports, not a text field"
  - "dashboard: a project's mcp allow-list picks from the catalog, never free text"

done:
  - "A coding run mounts the tools of the MCP servers allow-listed for its project (SSE / streamable HTTP) and the master can call them in its loop"
  - "The coding master's prompt names the servers that actually mounted; nothing mounted renders nothing"
  - "An unlisted server is never mounted; an unreachable one fails open (loud warning, run proceeds) — proven by tests"
  - "Scan / spec-dialog surfaces get no MCP tools; sub-agents get none by default; external tool names are namespaced so they cannot shadow a built-in"
  - "Config parses + validates; transport is a closed enum served by /api/config/capabilities and rendered as a select — no magic string survives in the dashboard"
  - "MCP server auth flows through the existing secrets mechanism (env-NAME only, never a value)"
  - "The skills catalog carries the placeholder, is released, and the embedded pin points at that release — the section is live, not pending an operator step"
  - "Full backend suite + dashboard tests green; stdio transport is named as p0342b, not silently dropped"
