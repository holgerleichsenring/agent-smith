# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-03-b83e

goal: "A credential that may administer a host is separate from the one runs use, and is never forwarded into a sandbox or a spawned container."

applies_to: "backend (credential resolution, sandbox step construction, container spawning)"

scope:
  in: >
    A distinct administrative credential per host connection, resolved only by server-side callers
    that need it; the existing per-host run tokens keep their current scope and their current path
    into sandboxes; a test asserts the administrative credential appears in no sandbox environment,
    no checkout step and no spawned container environment; a caller that needs it and finds it
    absent fails naming it.
  out: >
    USING IT. No host is administered in this phase — this is the precondition, and it is worth
    landing before anything wants the scopes.

decisions:
  - key: |
      TODAY THERE IS ONE TOKEN PER HOST AND IT GOES EVERYWHERE. It is process-wide, injected into
      sandbox checkout steps behind a credential helper, and forwarded into spawned orchestrator
      containers. Granting it the scopes needed to create repositories and set permissions would put
      an organisation-administrative credential inside a container an agent drives with shell
      access.
  - key: |
      SEPARATION HAS TO EXIST BEFORE THE SCOPES DO. Once a provisioning phase needs administrative
      access, the cheapest way to get it is to widen the token that already works. That is why this
      lands first and alone.
  - key: |
      THE GUARANTEE NEEDS A TEST, NOT A CONVENTION. The forwarding lists are hand-maintained in
      several places; the only durable form of "never forwarded" is an assertion over what a
      sandbox and a spawned container actually receive.
  - key: |
      ABSENT IS AN ERROR, NOT A FALLBACK. A caller that silently falls back to the run token would
      undo the separation at the first deployment that forgot the new variable.

steps:
  - id: an-administrative-credential-per-connection
    action: "A distinct administrative credential is resolvable per host connection, separate from the run token."
  - id: it-is-never-forwarded
    action: "The credential is excluded from sandbox step environments, checkout credential helpers and spawned container environments."
  - id: a-test-asserts-the-exclusion
    action: "A test asserts the administrative credential is absent from every environment a sandbox or spawned container receives."
  - id: a-missing-credential-fails-loudly
    action: "A caller that requires it and does not find it fails naming the credential, without falling back to the run token."

done:
  - "an administrative credential is configurable per host connection"
  - "no sandbox environment, checkout step or spawned container carries it, asserted by test"
  - "a caller requiring it and finding it absent fails with the credential named"
  - "existing runs are unaffected"
  - "build green, full suite green"
