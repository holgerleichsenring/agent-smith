# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-b0d7

goal: "A model call answered by the external agent CLI reports the tokens it used and the cost the CLI itself names, so a worker-driven run is accounted like every other run."

applies_to: "backend (how the external-worker bridge invokes the CLI and what it hands back to the cost ledger)"

scope:
  in: >
    The CLI is invoked so that it reports its own result envelope; token counts and the CLI's cost
    figure are carried onto the response the loop already tracks; the figure is labelled as the
    CLI's own rather than priced from a table; an envelope that is absent or unreadable leaves the
    call working exactly as it does today, with the accounting stated as unavailable.
  out: >
    PRICING THE WORKER FROM THE MODEL TABLE — a subscription-answered call has no per-token price,
    and inventing one produces a ledger that reads as money. Carrying what the CLI reports and
    saying whose number it is stays inside what is known. THE PROVIDER PATHS are untouched.

decisions:
  - key: |
      EVERY WORKER RUN IS ACCOUNTED AS FREE, AND FREE IS NOT A MEASUREMENT. The bridge builds its
      ChatResponse from text and tool calls and never sets Usage; the cost tracker duly records
      zero. Every comparison of a worker-driven scan against a provider-driven one has therefore
      compared a real number with an absence, and the runs that mattered most this week were all on
      the worker path.
  - key: |
      THE CLI ALREADY KNOWS. It reports tokens and its own cost figure in its result envelope; the
      bridge asks for plain text and throws that away. This is a flag and a reader, not a
      measurement to invent.
  - key: |
      THE ENVELOPE MUST NOT BECOME A NEW WAY TO FAIL. The reply parser is deliberately tolerant
      because a strict one once failed a correct answer. The envelope is unwrapped before that
      parser sees anything, and an output that is not one is passed through untouched — an older
      binary, a different CLI, or a plain-text answer keeps working.
  - key: |
      WHOSE NUMBER IT IS, IS PART OF THE NUMBER. A subscription-answered call costs no money at the
      moment it happens; what the CLI reports is what the same work would have cost through an API.
      Recorded without that label it becomes a spend figure in a ledger that also holds real ones.

steps:
  - id: the-cli-is-asked-for-its-envelope
    action: "The worker invocation requests the CLI's structured result output."
  - id: the-envelope-is-unwrapped-before-the-parser
    action: "The result text is taken out of the envelope and the existing reply parsing runs on it unchanged; a non-envelope output passes through."
  - id: the-usage-reaches-the-ledger
    action: "Token counts from the envelope are set on the response the loop tracks, and the CLI's cost figure is carried as the CLI's own."
  - id: an-absent-envelope-says-so
    action: "A call with no readable envelope is recorded as accounting-unavailable rather than as zero."

tests:
  - "WorkerCall_WithAnEnvelope_ReportsItsTokenUsage"
  - "WorkerCall_WithAnEnvelope_CarriesTheCliCostFigureAsTheClis"
  - "WorkerCall_PlainTextOutput_StillAnswersTheCall"
  - "WorkerCall_ToolCallEnvelope_IsUnaffected"
  - "WorkerCall_WithoutUsage_IsRecordedAsUnavailableNotZero"

done:
  - "a worker-driven run shows token counts in the ledger"
  - "the cost it shows is labelled as the CLI's own figure"
  - "a CLI that reports nothing structured still runs the pipeline"
  - "build green, full suite green"
