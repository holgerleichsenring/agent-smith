# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-2ac3
goal: "No startup finding or probe result ever echoes REDIS_URL or a Redis error that could carry its password, and the deploy notes say how to require a Redis password today."

applies_to: "backend (Redis URL findings and the Redis probe) and deploy (secret template, documentation)"

requires: []

scope:
  in: >
    - The unusable-URL finding names only the endpoint host and port it could parse, or
      "(value hidden)", never the configured string. The Redis probe's finding does the same with the
      client's exception text.
    - The secret template's default becomes redis:6379.
    - deploy/ documents the interim step, which needs no code change: Redis requirepass plus
      REDIS_URL=host:port,password=….
      - The password comes from its own secret key.
      - The Redis container refuses to start on an empty password.
      - Every redis-cli probe authenticates through REDISCLI_AUTH.
      - The note says what this protects before the sandbox transport changes, and what it does not.
  out: >
    - Taking the Redis credential away from sandboxes, which is the HTTP transport
      (2026-09-28-2f8c). Until then every sandbox receives REDIS_URL, password included, as argument
      and environment (PodSpecBuilder.cs:86-88, 121-125; DockerContainerSpecBuilder.cs:57-59, 78-82).
    - Spawned job pods carry it in plain Job arguments (KubernetesJobSpawner.cs:162;
      DockerJobSpawner.cs:136); 2026-09-28-10ffb deletes them.
    - Rotating the password.

decisions:
  - key: |
      REDACT BY NEVER ECHOING. Keying a redaction on a password element misses the URI form the secret
      template itself ships (4-secret-template.yaml:74), where redis://:secret@host puts the password
      in the host part. The finding (RedisExtensions.cs:98-104, reached from :84-93) therefore prints
      what parsed — endpoints — or nothing.
  - key: |
      A SECOND PATH, SAME RULE. RedisProbe puts the probe's error into a finding (RedisProbe.cs:25),
      and that error is the client's raw exception message (InfraConnectivityProbe.cs:43), which names
      the endpoint as configured. Findings are served at /api/config/findings (StartupProbeRunner.cs:74).
      No log line carries the URL today (RedisExtensions.cs:82-96; StartupFindings.cs:19-26).
  - key: |
      A PASSWORD WORKS TODAY WITHOUT CODE. The server parses REDIS_URL with ConfigurationOptions.Parse
      (RedisExtensions.cs:87), and the sandbox agent uses the same library (RedisJobBus.cs:31), so
      host:port,password=… is honoured end to end. The form is host:port, not a URI
      (docker-k8s-troubleshooting.md:15).
  - key: |
      TWO WAYS TO FAIL OPEN, AND WHAT CATCHES EACH:
      - A missing key with optional true leaves the variable unset. A composed "$(REDIS_PASSWORD)"
        then stays literal text: a password anyone can read in the manifest. The key is therefore
        optional false. REDIS_URL is already required (8-deployment-server.yaml:80-84); most other
        keys are optional.
      - An empty value turns requirepass off, and optional false does not catch it — the template
        ships "" for every key (4-secret-template.yaml:68-71). The Redis container starts through
        `sh -c 'test -n "$REDIS_PASSWORD" && exec redis-server --requirepass "$REDIS_PASSWORD" …'`.
  - key: |
      THE PROBES THAT BREAK ARE NAMED: the Redis liveness and readiness probes
      (6-deployment-redis.yaml:43, 49), the compose healthcheck (docker-compose.example.yml:104) and
      compose's literal REDIS_URL (:158).
  - key: |
      THE NOTE SAYS WHAT IT DOES NOT DO. Until 2f8c ships, every sandbox is handed the URL, so the
      password keeps other cluster workloads out of Redis but not repository scripts.
  - key: |
      SERIES: carried over from the withdrawn per-job Redis ACL work of 2026-09-28; own number.
      Suggested order: early, independent.

steps:
  - id: findings
    path: "src/backend/AgentSmith.Server/Services"
    action: "The unusable-URL finding and the Redis probe finding print endpoints or '(value hidden)', never the configured string or the raw client error."
    new:
      - "RedisEndpointText: the safe text for a Redis configuration or error"
  - id: template-and-notes
    path: "deploy/k8s, deploy/docker-compose.example.yml, docs/reference/host-it"
    action: "Template default redis:6379; the interim note with both fail-open cases, the guarded Redis command, REDISCLI_AUTH for the named probes, and what it does not protect."

tests:
  - "RedisEndpointText_UriFormWithPassword_ShowsOnlyHostAndPort"
  - "RedisEndpointText_KeyValueFormWithPassword_ShowsOnlyEndpoints"
  - "RedisExtensions_UnparseableUrl_FindingDoesNotContainTheValue"
  - "RedisProbe_ConnectionFailure_FindingDoesNotContainThePassword"

done:
  - "no startup finding or API response shows a Redis URL or password, in either URL form"
  - "the deploy notes let an operator require a Redis password today, fail closed on a missing or empty one, and say what it does not yet protect"
  - "build green, full suite green"
