# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-17-f74e

goal: "The design surface becomes Work it out and is rebuilt to the mock beside this spec, which is the target rather than a direction."

applies_to: "dashboard (the spec-dialog surface, its place and its rail entry)"

requires:
  - 2026-09-17-cdf2

scope:
  in: >
    THE MOCK IS THE SPECIFICATION. It sits beside this file as
    2026-09-17-f74e-dialog-surface-follows-the-mock.html and is READ, not interpreted: layout,
    hierarchy, spacing, the register of every label. The place is renamed Work it out in the place
    table, the rail and the page head. Three columns: the caller's conversations, the exchange,
    the artefact. A long draft appears in the exchange as a CARD naming its kind and its slices
    with a way into the pane, and the structure lives in the pane. Working names what it is
    reading, one line per repository, each resolving as it completes. The decision gets a surface
    of its own with what will happen if it is taken. The pane gains tabs so a filed conversation
    can still show its proposal. Every colour and every type size comes from the existing tokens.
  out: >
    THE CONVERSATION LIST'S CONTENT. 2026-09-17-cdf2 gives it a title and an outcome; this phase
    renders them.
    THE THREE COLUMNS AT PHONE WIDTH. They stack — conversations first, then the exchange, then
    the artefact — and the mock's own breakpoints say where.
    THE CHAT-INTENT FAMILY. Still out, as in 2026-09-15-9033: fix, list, create, init and the
    rest belong to a different surface with a different audience.
    A MODEL-AUTHORED TITLE, RENAMING, SEARCH. Named in 2026-09-17-cdf2.

decisions:
  - key: |
      THE MOCK IS A FILE BESIDE THE SPEC, BECAUSE SENTENCES ABOUT LAYOUT DO NOT SURVIVE CONTACT
      WITH AN IMPLEMENTER. This surface has been described three times in prose — "two columns",
      "the conversation on the left", "the proposal beside it" — and produced three different
      pages, each defensible against the words that asked for it. A file removes the sentence.
      Where the mock and this text disagree, the mock is right.
  - key: |
      THE NAME NAMES THE ACT, NOT THE FORMAT. "Design dialog" describes a shape. Nobody arrives
      to hold a dialog; they arrive to work out what to do, and the spec is the transition to it.
      The rename touches the place table, the rail entry and the page head, which a parity test
      already holds together.
  - key: |
      THE RAW PALETTE IS WHAT MADE IT LOOK FOREIGN, AND IT WAS MEASURED. The first build of this
      surface used dsh-label fifteen times and raw stone, amber and emerald about forty — the
      dashboard's own components use the tokens three to four times as often and the raw palette
      not at all. typography-drift already refuses an undefined type token; the palette has no such
      test and is therefore the reviewer's job, stated here so it is looked at.
  - key: |
      A LONG DRAFT IS A CARD IN THE STREAM AND STRUCTURE IN THE PANE, NEVER BOTH AT FULL WEIGHT.
      Watched live: a forty-line YAML block landed mid-conversation and pushed the exchange off the
      screen. The content was right and the place was wrong. The card names the kind and the slices;
      the pane carries the detail; the raw form is a disclosure inside the pane for the reader who
      wants to see exactly what will be filed.
  - key: |
      THE READING LINES ARE THE PROGRESS, NOT THE SPINNER. A turning ring says something is
      happening. The repository names say WHAT is happening, and they are the part an operator can
      judge — a run reading the wrong repository is visible in the first two seconds.
  - key: |
      THE MOCK IS TRIMMED WHERE IT WAS OVERLOADED, AND THE TRIMS ARE PART OF THE TARGET: the raw
      form is behind a disclosure rather than always open, and a tab appears only once it has
      something to show. The note at the top and the row of intent at the bottom are the mock
      explaining itself and are not part of the page.

steps:
  - id: the-place-is-renamed
    action: "Work it out in the place table, the rail entry and the page head; the parity test moves with it."
  - id: the-three-columns
    action: "Conversations, the exchange, the artefact — to the mock's proportions and breakpoints; stacking order named above."
  - id: the-conversation-list
    action: "Grouped by day, titled from cdf2's title, with the project and the outcome; the current one marked."
  - id: a-long-draft-is-a-card
    action: "The stream renders a proposal as its kind, its title and its slices with a way into the pane."
  - id: working-says-what-it-reads
    action: "One line per repository in scope, each resolving as it completes."
  - id: the-decision-has-its-own-surface
    action: "What will happen if approved, the two actions, and that anything written is a note."
  - id: the-pane-keeps-its-tabs
    action: "Proposal, scope and filed, each offered only when it has content; the raw form is a disclosure."
  - id: the-tokens-are-the-repositorys-own
    action: "No raw palette classes remain in the surface's components."

tests:
  - "Places_WorkItOut_IsATopLevelDestinationAndTheRailAgrees"
  - "dashboard: the conversation list groups by day and marks the current conversation"
  - "dashboard: a conversation with an outcome shows it, one without does not invent one"
  - "dashboard: a proposal renders in the stream as a card naming its kind and its slices"
  - "dashboard: the card's action moves the pane to the proposal"
  - "dashboard: a working turn names each repository it is reading"
  - "dashboard: the decision surface states what approving will do"
  - "dashboard: a tab with nothing to show is not offered"
  - "dashboard: the surface's components reference no raw palette class"

done:
  - "the surface matches the mock beside this spec — a reviewer comparing them finds layout, hierarchy and register the same"
  - "the rail, the header and the place table all say Work it out"
  - "no forty-line draft lands in the middle of the exchange again"
  - "an operator can tell what the agent is reading while it reads"
  - "dashboard build and tests green, backend build green, full suite green"
