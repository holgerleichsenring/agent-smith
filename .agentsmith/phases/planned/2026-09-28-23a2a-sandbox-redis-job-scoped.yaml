# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-23a2a
goal: "A container sandbox reaches Redis with a user limited to its own job's keys, so a repository script can no longer touch other jobs, the job queue, the config epoch or run liveness."

applies_to: "backend (sandbox provisioning, startup findings, job spawners) and deploy (Redis authentication in the k8s manifests and the compose example)"

requires: ["2026-09-28-3bff"]

scope:
  in: >
    A per-job Redis ACL user for every Kubernetes and Docker sandbox — the only mode, with no setting
    and no opt-out. Its name carries owner, job and creation time; its password is derived, so any
    replica re-creates it identically. The agent is handed that user, composed from the sandbox-facing
    URL, instead of the server's credential. The user is deleted on every path a sandbox ends,
    including a failed creation. After Redis loses users, every replica re-creates those of its
    owner's live sandboxes. Redis older than 7.0, missing ACL rights, or an open default user is a
    blocking finding that refuses container sandbox creation. An agent version below 3bff's release,
    or one that is not a version, is refused by name. Manifests and compose authenticate Redis from
    one required password key.
  out: >
    What a script can still do with its own job user: forge its own job's results or heartbeat — the
    job was already the script's to lie about. The in-process backend and the spawned CLI job pods:
    their environment is 2026-09-28-ef94's, their network 2026-09-28-acd0's. Sandbox network
    reachability (2026-09-28-23a2d). Container hardening (p0377). Rotating the server's Redis password.

decisions:
  - key: |
      TODAY THE SANDBOX HOLDS THE SERVER'S OWN REDIS CREDENTIAL. Both backends pass the server's
      REDIS_URL verbatim as argument and environment variable (PodSpecBuilder.cs:86-88, 121-125;
      DockerContainerSpecBuilder.cs:57-59, 78-82), read from the server's environment
      (KubernetesSandboxRegistrations.cs:19-23, DockerSandboxRegistrations.cs:108-110).
  - key: |
      WHAT A SCRIPT CAN DO WITH IT: DRIVE THE SERVER. run_command is an unrestricted shell by design
      (FilesystemToolHost.cs:23-26). With the server's credential a script can LPUSH a forged step into
      another sandbox (RedisKeys.cs:7), RPUSH a PipelineRequest the server runs with its own tokens
      (RedisJobQueue.cs:19-30), remove runs from the active set the reapers judge by
      (EventStreamKeys.cs:11) and bump the config epoch (RedisConfigReloadSignal.cs:17).
  - key: |
      THE RIGHTS. RPOP, LPUSH, XADD, SETEX, SET and DEL on ~sandbox:{job}:*; SISMEMBER read-only on
      agentsmith:runs:active via %R~ (Redis 7.0+); PING and CLIENT SETNAME. 3bff removes every other
      call the agent makes. SELECT is added when the sandbox URL names a database other than 0.
  - key: |
      ENFORCED, NO IFS (operator ruling 2026-09-28). No redis_scoping setting, no shared mode. The
      blocking finding is given teeth: a StartupFinding alone disables only the projects it names
      (StartupFindingsQueries.cs:21-26), so container sandbox creation itself checks the Redis-scope
      finding and refuses while it stands, naming it. Local compose and the Docker harness therefore
      need an authenticated Redis 7 too, and this phase gives them one.
  - key: |
      THE VERSION FLOOR IS A FIELD, NOT A PARSED TAG. The factory sees only spec.AgentImage today; the
      resolved version is AgentVersionChoice (AgentVersionResolver.cs:25) and can be a pin
      (SandboxGlobalConfig.cs:18-26), a project pin (SandboxConfig.cs:46), deployment.version
      (DeploymentDefaultsApplier.cs:35) or the build version. SandboxSpec carries the resolved version;
      below 3bff's published release, or not a semantic version (latest, a digest), is refused by
      name. The in-process version marker is exempt as PinnedAgentProbe.cs:36 already exempts it.
      The comments that promise "never refused" (SandboxGlobalConfig.cs:23-24) and "advisory, never
      blocking" (PinnedAgentProbe.cs:13) change with the ruling. The preflight round-trip probe builds
      its spec with the default latest image (SandboxRoundTripProbe.cs:30, SandboxSpec.cs:24); it
      resolves a version like any run.
  - key: |
      THE PASSWORD IS DERIVED, SO RE-CREATION IS IDEMPOTENT. ACL users are not persisted without an
      aclfile. HMAC(server Redis password, owner + job id), hex-encoded, lets every replica re-create
      the same user from its owner's pod or container list on ConnectionRestored (the event
      RedisConnectionHealth.cs:26 already hooks) — no leader needed, and Docker, whose orphan reaper
      takes no lease, is covered the same way. The creation time is stamped as a pod and container
      label so the name can be rebuilt without reading creationTimestamp.
  - key: |
      THE OWNER MATCH IS EXACT. An override owner may contain '-' (SandboxOwnerIdentityResolver.cs:60),
      so a prefix sweep for owner foo would also match foo-bar. The sweep parses a user name as
      sbx-{owner}-{32 hex job}-{digits} and compares the owner exactly.
  - key: |
      THE SANDBOX URL KEEPS WHAT THE SANDBOX NEEDS. It is composed from options.RedisUrl — the address
      the sandbox can reach, which differs from the server's own in the harness
      (DockerPresetRunner.cs:130-131) — keeping ssl, sslHost and the database and replacing the
      credential. Composed by hand, never via ConfigurationOptions.ToString, which writes the password.
  - key: |
      A USER CAN LEAK BEFORE A SANDBOX EXISTS. The quota 403 is re-queued as capacity
      (KubernetesSandboxFactory.cs:32-41), a pod may never become ready (:46-47), a Docker loader or
      toolchain start can fail (DockerSandboxFactory.cs:96-106, 136-139). Each deletes its user.
  - key: |
      ONE REQUIRED SECRET KEY, URLS COMPOSED BY $(VAR). Redis, its probes and every client need the
      same password; a URL key plus a password key would drift. REDIS_PASSWORD comes from
      secretKeyRef with optional false everywhere — an unresolved $(VAR) stays literal text and an
      empty one disables requirepass, so optional would fail open (the manifests default to optional,
      8-deployment-server.yaml:95-98). The startup probe also refuses a password containing "$(".
      REDIS_URL is composed as "{host:port},password=$(REDIS_PASSWORD)" after it; Redis runs
      --requirepass $(REDIS_PASSWORD); probes authenticate via REDISCLI_AUTH. This fits deployments
      that seal only the password, set REDIS_URL as a literal env value today, and run redis:7 without
      probes. The template's redis://redis:6379 (4-secret-template.yaml:74), a form the server cannot
      parse (RedisExtensions.cs:98-104), goes.
  - key: |
      THE JOB SPAWNER STOPS WRITING THE SERVER CREDENTIAL INTO JOB SPECS. It passes the literal URL as
      --redis-url (KubernetesJobSpawner.cs:27-28, 155-162) and also projects secret key redis-url as
      REDIS_URL (AgentSecretBinding.cs:26; KubernetesJobSpawner.cs:176-177). The binding becomes
      redis-password; the job composes REDIS_URL after it and passes --redis-url $(REDIS_URL).
      AgentSecretNames.For emits the canonical bindings first, so the order the composition needs
      holds. DockerJobSpawner forwards the same list (DockerJobSpawner.cs:28, 136) and composes the
      same way. ef94 keeps REDIS_URL and REDIS_PASSWORD on its strip list by name.
  - key: |
      COMPOSE READS ITS OWN .env. The compose file feeds ../.env to containers (env_file,
      docker-compose.example.yml:126, 155-156), but ${VAR} interpolation reads the project directory's
      .env or --env-file. The compose example uses ${REDIS_PASSWORD:?} so a missing password stops
      compose, and the documentation names --env-file.
  - key: |
      THE PASSWORD MUST NOT REACH A FINDING. The unusable-URL finding interpolates the whole REDIS_URL
      (RedisExtensions.cs:101) and findings are served to the API and dashboard; it redacts the
      password. Derived job passwords are hex; the server password's alphabet excludes ',' and '=',
      which the client's configuration string cannot escape.
  - key: |
      FILE-LENGTH RATCHET. DockerSandboxFactory is 144 of 144 and KubernetesJobSpawner 217 of 217
      (file-length-baseline.tsv:41, 68): both changes are paid for by extraction. The factories are
      constructed by hand at KubernetesSandboxRegistrations.cs:32-39, DockerHarnessRegistrations.cs:71
      and SandboxHeartbeatTests.cs:221.

steps:
  - id: a-job-user-is-provisioned
    path: "src/backend/AgentSmith.Server/Services/Sandbox"
    action:
      - "Create sbx-{owner}-{job}-{created} with the derived password and the rights above; stamp created as a label; compose the sandbox URL from options.RedisUrl."
      - "Delete the user on every creation failure path."
      - "Refuse creation while the Redis-scope finding stands, or when the resolved agent version is below the floor or not a version."
    new:
      - "SandboxRedisCredentials: provisions, deletes, sweeps and re-creates per-job ACL users"
      - "SandboxRedisPassword: derives a job password from the server credential"
      - "SandboxRedisUrl: composes the sandbox URL without the server credential"
      - "SandboxRedisScopeProbe: the startup check (Redis version, ACL rights, open default user, literal $( in the password)"
      - "SandboxAgentVersionFloor: the version check"
    modify:
      - "SandboxSpec: the resolved agent version; SandboxPodLabels and DockerContainerSpecBuilder: the created label"
      - "KubernetesSandboxFactory, DockerSandboxFactory (extraction), their registrations, DockerHarnessRegistrations, SandboxHeartbeatTests"
      - "SandboxGlobalConfig, PinnedAgentProbe: the comments the ruling contradicts"
  - id: the-user-dies-with-the-sandbox
    action:
      - "Delete on disposal (KubernetesSandbox, DockerSandbox) and in the corpse and orphan reapers."
      - "Sweep this owner's users with no owned pod or container once their stamped creation is older than the longest sandbox start timeout."
      - "On ConnectionRestored every replica re-creates its owner's live sandbox users."
  - id: redis-is-authenticated
    path: "deploy/k8s, deploy/docker-compose.example.yml, deploy/apply-k8s-secret.sh, .env.example, docs, src/backend/AgentSmith.Contracts/Constants/AgentSecretBinding.cs, src/backend/AgentSmith.Server/Services"
    action:
      - "A required redis-password key; REDIS_URL composed by $(REDIS_PASSWORD); Redis --requirepass $(REDIS_PASSWORD); probes via REDISCLI_AUTH."
      - "The redis-url binding becomes redis-password; both job spawners compose REDIS_URL and pass it by reference (KubernetesJobSpawner through an extracted pod-template builder)."
      - "Compose: ${REDIS_PASSWORD:?}, the healthcheck authenticated, --env-file documented."
      - "The unusable-URL finding redacts the password."
      - "Deploy notes beside the manifests: why one key, and the migration for a deployment that sets REDIS_URL literally — add and seal the password key, compose the URL, apply before this release's server."
  - id: harness-redis
    path: "tests/AgentSmith.PipelineHarness, tests/AgentSmith.Tests"
    action: "The Docker harness and a new Testcontainers.Redis fixture in AgentSmith.Tests run Redis 7 with a password; the fast tier needs no Redis and is unchanged."
  - id: it-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Server-side ACL, lifecycle, version and probe tests against real Redis."

tests:
  - "SandboxRedisCredentials_Provision_AgentLoopRunsOnItsOwnKeys"
  - "SandboxRedisCredentials_Provision_AnotherJobsKeysAreRefused"
  - "SandboxRedisCredentials_Provision_JobQueueAndConfigEpochAreRefused"
  - "SandboxRedisCredentials_Provision_ActiveRunSetIsReadOnly"
  - "SandboxRedisCredentials_Delete_UserNoLongerAuthenticates"
  - "SandboxRedisCredentials_Sweep_ExactOwnerOnlyAndPastTheStartTimeout"
  - "SandboxRedisCredentials_RedisRestarted_EveryReplicaRecreatesIdentically"
  - "SandboxRedisPassword_Derive_SameInputsSamePasswordHex"
  - "SandboxRedisUrl_Compose_KeepsSslAndDatabaseDropsServerPassword"
  - "KubernetesSandboxFactory_QuotaRefusedOrNeverReady_UserIsDeleted"
  - "DockerSandboxFactory_ToolchainStartFails_UserIsDeleted"
  - "SandboxAgentVersionFloor_BelowFloorOrNotAVersion_RefusedByName"
  - "SandboxAgentVersionFloor_InProcessMarker_IsExempt"
  - "SandboxRedisScopeProbe_OpenDefaultUserOrNoAclRights_BlocksContainerSandboxes"
  - "SandboxRedisScopeProbe_PasswordIsLiteralVarReference_Blocks"
  - "KubernetesJobSpawner_Job_CarriesRedisUrlByReferenceNotValue"
  - "RedisExtensions_UnusableUrl_FindingRedactsThePassword"

done:
  - "no Kubernetes or Docker sandbox receives the server's Redis credential; each receives a user scoped to its job; there is no other mode"
  - "against real Redis a job user cannot touch another job's keys, the job queue or the config epoch, or write the active-run set"
  - "no ACL user outlives its sandbox or a failed creation, no server sweeps another's, and a Redis restart does not kill a live sandbox"
  - "with Redis below 7.0, without ACL rights, with an open default user, or with an agent version below the floor, container sandboxes are refused with the cause named"
  - "no Job, Deployment or compose file carries the Redis password as a value, and a missing password stops the deployment instead of opening Redis"
  - "rollout: an existing deployment adds the required redis-password key and composes REDIS_URL before running this release; the deploy notes say so"
  - "build green, full suite green"
