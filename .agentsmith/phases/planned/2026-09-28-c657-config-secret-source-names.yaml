# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-c657
goal: "The resolved configuration remembers which environment variable each ${NAME} secret came from, so an operator-declared secret is stripped from in-process steps like the framework's own."

applies_to: "backend (configuration materialization for the file and database loaders; the in-process strip list)"

requires: ["2026-09-28-ef94"]

scope:
  in: >
    Materialization returns, beside the configuration, the set of environment variables a ${NAME}
    reference actually resolved from — secrets map, registry tokens, jira_trigger secrets — on the
    file and database paths alike. The set rides on AgentSmithConfig, never on the raw YAML shape.
    ef94's helper adds it to the strip list at all three construction sites. The in-process factory
    reads the configuration when it creates a sandbox, so a secret added in the Studio is stripped
    on the next run.
  out: >
    A literal secret value: it comes from no environment variable, so there is nothing to strip. The
    trace masker covers literals in the secrets map and registries (SecretMasker.cs:41-48) but not a
    literal jira_trigger secret — that is a gap of the trace masker, not of this phase, and it is
    not scheduled. Spawned job pods: they receive only AgentSecretNames variables
    (KubernetesJobSpawner.cs:176-177), so an operator variable is absent there already. 23a2b's mask
    list: registry tokens do reach container sandboxes, staged into auth files by the server
    (StagedAuthFileWriter.cs:37-40) and handed to the model on purpose (AgenticMasterHandler.cs:286)
    — masking a value the model is given deliberately protects nothing, so they are excluded there by
    decision, not by accident.

decisions:
  - key: |
      THE NAME IS DROPPED IN ONE PLACE. ConfigSecretResolver replaces each ${NAME} in the secrets map
      with the environment value (ConfigSecretResolver.cs:20-26) and resolves registry tokens and
      jira_trigger secrets against the map and then the environment (:30-40), through one reference
      reader (ConfigSecretReferences.cs:12-26). After that the configuration holds values only
      (AgentSmithConfig.cs:20; ResolvedConfigComposer.cs:25).
  - key: |
      THE DATABASE PATH RUNS THE SAME PIPELINE. Both loaders hand a RawAgentSmithConfig to
      RawConfigMaterializer (YamlConfigurationLoader.cs:44, DbConfigurationLoader.cs:64), whose secret
      pass is RawConfigMaterializer.cs:42. The database stores a secret as a reference, `${id}` by
      default (DbConfigStore.cs:82-86), and the save guard refuses a secret value that is not one
      (SecretValueGuard, called at ConfigDocumentRepository.cs:28 and ConfigImportRepository.cs:23).
  - key: |
      NO SHARED STATE. ConfigSecretReferences is one registered instance used by concurrent loads
      (ServiceCollectionExtensions.cs:45; for example ExecutePipelineUseCase.cs:265). Recording names
      on it would mix loads. The reader returns the value together with the source name; the resolver
      collects them in a local set; Materialize passes the set to the composer.
  - key: |
      NOT ON THE RAW TYPE. RawAgentSmithConfig is the YAML binding shape and the exporter serializes
      it (ConfigYamlExporter.cs:24); a property there would let a file forge or clear the list.
  - key: |
      AN UNSET VARIABLE IS NOT RECORDED. The reader answers "" for an unset reference
      (ConfigSecretReferences.cs:13, 21); a variable that is not in the environment has nothing to
      strip. Pinned by a test.
  - key: |
      A BUILD THAT READ AN OPERATOR VARIABLE BREAKS, AND THAT IS THE POINT. A committed .npmrc with
      ${NPM_TOKEN}, which npm expands from the environment, works in-process today because the step
      inherits the variable. After this phase it does not. The replacement is the staged registry
      auth the pipeline already writes into the sandbox (SetupRegistryAuth); the decision is recorded
      so the break is not a surprise.
  - key: |
      LIVE CONFIGURATION, NOT A STARTUP SNAPSHOT. InProcessSandboxFactory is registered once
      (ServerSandboxExtensions.cs:85) over a configuration built at startup
      (ServerCompositionBuilder.cs:79-80), while every run reloads it (ExecutePipelineUseCase.cs:265).
      The factory asks IConfigurationLoader when it creates a sandbox, as those callers do.
  - key: |
      SERIES: turned up while specifying 2026-09-28-ef94, which named it out of scope; it follows ef94
      and gets its own number per the minting rule.

steps:
  - id: the-reader-reports-its-source
    path: "src/backend/AgentSmith.Infrastructure.Core/Services/Configuration"
    action: "ConfigSecretReferences returns value and source name; ConfigSecretResolver.Apply returns the set of names that resolved from the environment; RawConfigMaterializer passes it to ResolvedConfigComposer."
    modify:
      - "ConfigSecretReferences, ConfigSecretResolver, RawConfigMaterializer, ResolvedConfigComposer"
  - id: the-config-carries-it
    path: "src/backend/AgentSmith.Contracts/Models/Configuration/AgentSmithConfig.cs"
    action: "AgentSmithConfig.SecretEnvironmentNames (init-only)."
  - id: ef94-strips-it
    path: "src/backend/AgentSmith.Infrastructure/Services/Sandbox, src/backend/AgentSmith.Cli/Commands"
    action:
      - "ef94's strip-list helper adds SecretEnvironmentNames; the factory, SecurityTrendCommand and CompileWikiCommand all use the helper."
      - "InProcessSandboxFactory reads the configuration through IConfigurationLoader at creation."
  - id: it-is-pinned
    path: "tests/AgentSmith.Tests"
    action: "Materialize one raw configuration through both loaders and compare the names; run `env` in-process with an operator-declared variable set; prove a Studio-added secret is stripped without restart."

tests:
  - "ConfigSecretReferences_ResolveFromEnvironment_ReturnsTheSourceName"
  - "ConfigSecretReferences_ResolvedFromTheSecretsMap_ReturnsNoNewName"
  - "ConfigSecretReferences_UnsetVariable_IsNotRecorded"
  - "ConfigSecretResolver_Apply_TwoLoadsWithDifferentEnvironments_RecordDisjointSets"
  - "RawConfigMaterializer_RegistryTokenAndJiraTriggerReferences_AreRecorded"
  - "DbConfigurationLoader_SecretStoredAsReference_NameIsRecordedLikeTheFileLoader"
  - "ConfigYamlExporter_Export_DoesNotWriteSecretEnvironmentNames"
  - "InProcessSandbox_OperatorDeclaredSecretVariable_IsNotInheritedByAStep"
  - "InProcessSandboxFactory_SecretAddedAfterStartup_IsStrippedOnTheNextSandbox"
  - "KubernetesJobSpawner_ForwardedList_ExcludesRecordedOperatorNames"

done:
  - "an operator's ${NAME} secret is absent from an in-process step's environment, from a file or a database configuration, without a restart"
  - "the recorded set cannot be authored in YAML"
  - "build green, full suite green"
