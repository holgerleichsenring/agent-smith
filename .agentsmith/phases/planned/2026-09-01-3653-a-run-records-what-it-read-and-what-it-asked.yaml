# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-3653

goal: "A scan run records how much it was asked, what it read and how many turns it used, so two runs of the same scan can be compared instead of guessed about."

applies_to: "backend (what the master pass writes into the run record, and how a scan run is compared to another)"

scope:
  in: >
    Every master pass records the size of what it was given (system prompt, review prompt and their
    named parts), the turns it used against its ceiling, the distinct files it read and the findings
    it delivered by severity; the numbers land in the run record beside the result; a small tool
    reads N run records and prints the spread.
  out: >
    REDUCING THE PROMPT — this phase measures it and changes nothing about it. A cut made before the
    measurement exists is a cut nobody can defend, and the number most often quoted for this prompt
    turned out to be wrong by a factor of seven. FIXING THE VARIANCE — an instrument is not a
    remedy; what the spread is caused by is the next question, and it cannot be asked yet.

decisions:
  - key: |
      EVERY NUMBER IN THIS DISCUSSION HAS BEEN A GUESS. The scan prompt was called fifty-two thousand
      characters; the master body is a skill file of seven and a half thousand with no placeholders in
      it, and the rest is whatever the scanners and the API document happened to add that run. Nobody
      can say which, because nothing writes it down. An argument about prompt mass without a
      measurement is an argument about a memory.
  - key: |
      THREE IDENTICAL RUNS DELIVERED 26, 31 AND 23. Until a run states what it read and how far it
      got, no change to this pipeline can be shown to have helped: the spread is wider than any
      improvement worth making. The instrument comes before the tuning, and it is the cheapest thing
      in this batch.
  - key: |
      THE PARTS, NOT JUST THE TOTAL. A total tells you the prompt is large; the parts tell you which
      section to look at. The review prompt is assembled from named pieces — scanner findings, the
      API document, the conversation, the surface difference — and each is measured where it is
      composed, because measuring the joined string can only ever produce one number.
  - key: |
      TURNS AGAINST THE CEILING IS THE ONE NUMBER THAT DECIDES A TRUNCATION. Reading it back from a
      log line is archaeology. It belongs in the record, next to the reads, so that the question
      "did this run stop because it was finished?" is answered by the record instead of by a
      guess. 2026-09-01-7df4 makes the ceiling choosable; this makes it observable.
  - key: |
      A COMPARISON TOOL, NOT A DASHBOARD. Three runs and a spread is what this question needs, and a
      script over the run records answers it. Anything larger builds a surface for a measurement we
      have not yet learned to trust.

steps:
  - id: the-pass-writes-down-what-it-was-given
    action: "The master pass records the size of the system prompt and of the review prompt's named parts."
  - id: the-pass-writes-down-what-it-did
    action: "Turns used against the ceiling, distinct files read, and findings delivered by severity are recorded on the same pass."
  - id: the-record-carries-it
    action: "The census lands in the run record beside the result, readable without a database."
  - id: three-runs-can-be-diffed
    action: "A small tool reads N run records and prints per-field spread across them."

tests:
  - "MasterPass_RecordsThePromptSizesItWasGiven"
  - "MasterPass_RecordsTurnsUsedAgainstItsCeiling"
  - "MasterPass_RecordsDistinctReadsAndDeliveredSeverities"
  - "RunRecord_CarriesTheCensus"
  - "Census_OfARunWithNoMaster_IsAbsentNotZeroed"

done:
  - "one run answers, from its own record, how large its prompt was and how far it got"
  - "three runs of the same scan can be compared field by field"
  - "no prompt content changes in this phase"
  - "build green, full suite green"
