# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0514

goal: "A customer who writes their own skills can check their catalog against the same rules ours passes, and the binary says which catalogs it accepts."

applies_to: "backend (CLI validate verb, catalog contract check, startup finding) + skills catalog (the declared contract version)"

scope:
  in: "The catalog checks shipped as a CLI verb anyone can run, a contract version declared by a catalog and an accepted range declared by the binary, and a loud finding when they disagree."
  out: "Overlaying a customer catalog on the official one instead of replacing it — the successor *a catalog can extend another without forking it*, which is the shape most customers actually want and is larger than this."

decisions:
  - key: |
      A CUSTOMER CATALOG MEETS NO GATE TODAY, AND THE FAILURE IS SILENT. `skills.source` accepts
      Path and Url, so a customer catalog is a mounted directory or a tarball. The checks that
      guard the known breakage classes — the master description cap, required frontmatter, name
      matching its directory, principles templates — live in scripts/validate-skills.sh in OUR
      catalog repository and ship to nobody. The CLI has validate-concepts, which checks
      activation expressions against the vocabulary and nothing else.
  - key: |
      THE PRECEDENT IS A LIVE OUTAGE, NOT A HYPOTHETICAL. A master description over the loader's
      cap is dropped SILENTLY and the run dies later with "Prompt resource not found" — that is
      how a skills release broke once, which is why the cap check exists at all. A customer
      catalog walks into the same class with no warning.
  - key: |
      "0.134.1 RUNS ON 4.6.0" SAYS NOTHING TO SOMEONE WITH THEIR OWN CATALOG. Pinning a version
      pair states which OFFICIAL release a binary was tested against. A catalog that is not ours
      has no such version. What generalises is a CONTRACT: the catalog declares which contract
      it satisfies, the binary declares the range it accepts, and a mismatch is a startup
      finding naming both — so the same sentence covers our catalog and theirs.
  - key: |
      THE VALIDATOR MOVES INTO THE BINARY, IT IS NOT COPIED. Two implementations of the same
      rules drift, and a drifted validator is worse than none because it says green. The bash
      script becomes a caller of the shipped verb, or is deleted in favour of it — one set of
      rules, one place, both repositories reading it.
  - key: |
      THE FINDING IS ADVISORY AND CARRIES NO PROJECT. A blocking finding turns on the degraded
      banner for every installation, and one carrying a project name disables that project's
      triggers through the resolver — the trap that reversed a draft of p0506 and that p0503b
      must dodge as well. A catalog the binary does not accept is a loud problem, not a reason
      to stop dispatching work.
  - key: |
      CONTRACT ONE IS WHATEVER TODAY'S CATALOG SATISFIES. The number is read off the current
      state rather than designed: whatever the pinned catalog is, that is contract 1, and the
      binary accepts it. The version earns its keep the first time the contract changes, not
      before — declaring a contract nobody has broken yet is the cheapest possible insurance.

steps:
  - id: the-checks-ship-where-a-customer-can-run-them
    action: "Add a CLI verb that runs the catalog checks against a given path and reports each failure with the file and the rule it broke."
    new:
      - "catalog validation service + its CLI verb"
  - id: one-set-of-rules-not-two
    action: "Make the catalog repository's shell validator call the shipped verb, or retire it in favour of the verb, so the rules exist once."
  - id: a-catalog-declares-its-contract
    action: "Add a contract version to the catalog and the accepted range to the binary, defaulting to whatever today's pinned catalog satisfies."
  - id: a-mismatch-is-said-out-loud
    action: "Record an advisory startup finding, carrying no project, when a resolved catalog declares a contract the binary does not accept, naming both numbers and the catalog's source."
  - id: the-answer-is-written-down
    action: "Document how a customer builds their own catalog: the source modes, the verb, the contract, and what the binary does when they disagree."

tests:
  - "Validate_ACatalogWithAnOverlongMasterDescription_Fails"
  - "Validate_ACatalogMissingRequiredFrontmatter_Fails"
  - "Validate_AMasterWhoseNameDoesNotMatchItsDirectory_Fails"
  - "Validate_TheShippedCatalog_Passes"
  - "Validate_APathThatIsNotACatalog_SaysSoRatherThanPassing"
  - "Contract_CatalogDeclaresAnAcceptedVersion_NoFinding"
  - "Contract_CatalogDeclaresAnUnacceptedVersion_RecordsAnAdvisoryFindingNamingBoth"
  - "Contract_CatalogDeclaresNothing_IsTreatedAsContractOne"
  - "Contract_TheFinding_CarriesNoProjectAndDisablesNoTrigger"
  - "Rules_TheShellValidatorAndTheVerb_AgreeOnEveryFixture"

done:
  - "a customer can run the catalog checks against their own directory and read what failed"
  - "the rules exist in one place, and a fixture proves both entry points agree"
  - "a catalog declares its contract and the binary declares what it accepts"
  - "a mismatch is an advisory finding naming both numbers, and no trigger stops"
  - "the documentation answers how a customer builds and checks their own catalog"
  - "build green, full suite green"
