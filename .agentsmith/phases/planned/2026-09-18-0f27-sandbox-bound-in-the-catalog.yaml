# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-0f27

goal: "The concurrent-sandbox bound is set where the other sandbox settings are set, under the name the documentation uses, and a change to it applies to the next admission decision."

applies_to: "backend (the global sandbox configuration and the Docker capacity probe) + dashboard (the sandbox settings form) + docs"

scope:
  in: >
    The bound becomes a NULLABLE field of the process-wide sandbox configuration, read by the probe
    through the configuration loader at the moment it decides. Null means nobody configured it, which
    is what lets the environment variable remain the fallback for an installation whose store is
    empty; zero keeps meaning unbounded, which it already means to the probe. The settings form
    carries the field and says which sandbox settings apply to the next decision and which need a
    restart, because after this phase they differ and a form that does not say so is a new way to be
    misled. The resolved value and where it came from are logged once whenever the
    resolution changes, so a value that did not take effect is answerable from the log. The documentation names the key that is read and all four spellings it has.
  out: >
    MAKING THE WHOLE SANDBOX BLOCK APPLY WITHOUT A RESTART. Six consumers read the frozen options
    instance; moving them is a phase of its own, named in prose as the phase that makes every sandbox
    setting apply to the next run rather than the next restart.
    WHAT THE BOUND MEANS WHEN IT IS EXCEEDED. 2026-09-18-3ba9, which this phase must land before.
    A SWEEP OF EVERY OTHER ENVIRONMENT VARIABLE. Named in prose as the phase that decides which
    settings may live outside the catalog at all.
    THE DASHBOARD'S OWN BUILD-TIME PROXY TARGET. Same class, different subsystem; named in prose as
    the phase that makes the dashboard's backend target a runtime setting or says it is not one.

decisions:
  - key: |
      NULLABLE, OR THE FALLBACK IS UNREACHABLE AND ZERO CHANGES MEANING. The typed model is assembled
      whether or not a sandbox document was ever stored, so a plain integer defaulting to two reads
      the same for "never configured" and "deliberately two" — the environment variable could never be
      reached and its test could not pass. Using zero as the absent marker is worse: zero already
      means unbounded to the probe and is pinned by a test, so an operator disabling the bound would
      silently get two. Null is the shape the per-project block already uses for every one of its
      fields, and the global block already uses for the one setting with the same unset-is-not-default
      problem.
  - key: |
      THE FIRST SAVE MUST NOT EAT THE VARIABLE. A settings save persists the whole normalised
      document, so an operator changing an unrelated timeout would otherwise write the bound into the
      catalog at a value nobody chose and kill the environment variable on that installation with no
      message. The field is optional on the form and an empty field writes null back, so a save that
      did not touch it leaves the fallback standing.
  - key: |
      THE LOADER IS LIVE BY CONSTRUCTION; THE EPOCH IS NOT PART OF THIS. The configuration loader
      re-reads the document store on every call, so a probe holding the loader sees a new value on its
      next decision with no watcher and no invalidation. What is frozen is the options instance built
      eagerly at composition — that, and not the loader, is why the value cannot be changed today.
      Building an epoch subscription here would be work nothing needs.
  - key: |
      IT IS GLOBAL, AND THE PROBE COUNTS A HOST. The probe counts every sandbox running on the
      daemon and the footprint it compares carries no project identity, so a per-project bound has no
      answer when two projects disagree. It belongs with the process-wide defaults, beside the one
      already marked global and never per-project.
  - key: |
      ONE FIELD LIVE AND THE REST NOT IS A SPLIT, SO THE FORM SAYS SO. Every other sandbox setting is
      read from an instance built once at composition. Making one field live without saying which is
      which replaces "nothing applies until a restart" — uniform, learnable — with a rule that differs
      per row of one form. The form states it per field. Making them all live is the named successor.
  - key: |
      THE REFUSAL TEXT IS NOT A SURFACE THIS PHASE CAN REACH, SO IT DOES NOT CLAIM IT. The probe's
      reason is logged and dropped on the spawn path; what a waiting operator reads is a sentence
      composed separately at the enqueue, and the pump writes none at all and has no room to. Putting
      the bound there means changing the reservation's return type and the queued reason — named in
      prose as the phase that makes a waiting run say what is actually holding it. Here the resolution
      and its source are logged once on change, which answers "I set it and nothing happened" without
      promising a surface that does not exist.
  - key: |
      FOUR SPELLINGS, ALL NAMED. The YAML key is underscored by the loader's convention, the property
      is Pascal-cased, the stored document is Pascal-cased too because its serializer sets no policy,
      and only the wire and the dashboard are camel-cased. The documentation
      names the YAML key today and nothing reads it; the phase makes that key real and says what the
      other three are, so a reader of any one of them can find the others.
  - key: |
      INERT ON KUBERNETES, AND THE FIELD SAYS WHICH BACKEND IT BOUNDS. A Kubernetes installation
      bounds sandboxes through its quota. A number in a global form that does nothing for half the
      installations is a new way to be misled unless it says so; naming the backend is the floor, and
      telling this installation which backend it runs needs plumbing this phase does not scope.
  - key: |
      ROOM. The registrations file is three lines under the hard limit and the global configuration
      has twenty-one, and a doc comment in that file's register runs long. So the read leaves the
      registrations entirely: the probe resolves the bound itself, which is also what makes it live.
      Five existing probe tests construct the options directly and change with it.

steps:
  - id: the-bound-joins-the-global-config
    action: "The process-wide sandbox configuration gains the nullable bound under the documented name; the probe resolves it through the loader at decision time, then the environment variable, then the built-in default."
  - id: the-form-shows-it-and-says-when-it-applies
    action: "The sandbox settings form carries the field as optional, writes null when empty, says which backend it bounds, and marks per field which sandbox settings apply to the next decision and which need a restart."
  - id: the-value-is-answerable
    action: "The resolved value and its source are logged once whenever the resolution changes from the one last used."
  - id: the-docs-name-what-is-read
    action: "The capacity, compose and Kubernetes pages and the field reference name the key that is read, its four spellings, and the environment variable as the empty-store fallback."

tests:
  - "Bound_SetInTheCatalog_IsWhatTheProbeUses"
  - "Bound_ChangedInTheCatalog_AppliesToTheNextDecisionWithoutARestart"
  - "Bound_NullInTheCatalog_FallsBackToTheEnvironmentVariable"
  - "Bound_NullAndNoEnvironmentVariable_IsTheBuiltInDefault"
  - "Bound_ZeroInTheCatalog_StillMeansUnbounded"
  - "Bound_ASaveThatDidNotTouchIt_LeavesTheFallbackStanding"
  - "Bound_ResolutionChanged_IsReportedOnceWithItsSource"
  - "Bound_ResolutionUnchanged_IsNotReportedAgain"
  - "dashboard: the sandbox form carries the bound, writes null when cleared, and names the backend it bounds"
  - "dashboard: the sandbox form says which of its settings need a restart"

done:
  - "the bound is set where the other sandbox settings are set, under the documented name"
  - "changing it applies to the next admission decision with no restart, and clearing it restores the fallback"
  - "a bound that did not take effect is answerable from one log line naming its source"
  - "nobody is misled about which sandbox settings apply immediately"
  - "build green, full suite green, dashboard tests green, file-length ratchet green"
