# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0413a
goal: "Every run is estimated — size and shape — regardless of how many repositories it touches."

applies_to: "backend"

requires: [p0413]

decisions:
  - key: |
      FOUND while implementing p0413. ScopeReposHandler returns before classifying when
      the run has one repo ("Repo scoping skipped: single-repo run"). Repo SCOPING is
      indeed pointless there — but the same reply carries the complexity tier (p0341c,
      sizes the cost cap) and now the work shape (p0413, sizes the cut). A single-repo
      run therefore gets neither: it runs on the static default cap and the derivation
      cuts it blind.
  - key: |
      The fix is not to classify repos anyway — it is to separate the two questions.
      Scoping asks WHICH repositories; estimating asks HOW MUCH and WHAT KIND. Only the
      first is meaningless for one repo. Deciding where the estimate is made, and what
      it costs when there is nothing to scope, is the work of this phase.

steps:
  - id: estimate-independent-of-scope
    action: "The size + shape estimate is produced for every ticketed run, not only for runs with something to scope."
  - id: one-call-not-two
    action: "A run that scopes and a run that only estimates spend the same single classification call."

tests:
  - "Estimate_SingleRepoRun_StillCarriesShapeAndTier"
  - "Estimate_MultiRepoRun_StillSpendsOneCall"

done:
  - "A single-repo mechanical ticket reaches the derivation with its shape stated."
  - "No run makes more classification calls than it made before."
