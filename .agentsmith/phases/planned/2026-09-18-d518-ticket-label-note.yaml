# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-d518

goal: "A filed work ticket says what each framework label binds, and what removing it costs, in words that hold on every project rather than on one routing shape."

applies_to: "backend (the ticket body composer, the three filers, the pull-request body)"

requires:
  - 2026-09-17-0e79d

scope:
  in: >
    A filed work ticket carries a closing section naming each label the FILER applied, with one
    sentence per label that states the MECHANISM rather than an outcome — because the outcome depends
    on a routing shape the composer cannot see and which differs per project. It opens
    with a level-two heading, because the section above it is scanned forward to the next heading and
    a bullet list without one is read back as acceptance criteria. And because a ticket's description
    is pasted verbatim into the pull request the run opens, and into the prompts the coding master and
    the scope classifier read, the pull-request body stops carrying it: the section is bookkeeping for
    the ticket, not the first paragraph of every pull request this framework opens.
  out: >
    THE SLICE RECORD'S LABEL. Naming it would publish the one edit that turns a record nothing routes
    into a full run derived from a description anyone can edit — the hole this phase's own reasoning
    refuses to make configurable. A record says instead that nothing runs it and which ticket carries
    the work.
    MAKING THE LABEL NAMES CONFIGURABLE. The approved-set stamp fails OPEN, so a spelling nobody
    recognises turns "refuse loudly" into "derive from an editable description".
    LABELS ON TICKETS ALREADY FILED. The section is written when a ticket is created.
    THE TRACKER'S OWN LABELS.

decisions:
  - key: |
      THE SENTENCE STATES THE MECHANISM, BECAUSE EVERY OUTCOME IS PROJECT-SHAPED. The first draft said
      editing a label reroutes rather than stops; the second said it stops. Both are false somewhere.
      On a project that resolves its pipeline from labels, removing the phase label makes the ticket
      unfetchable and then dropped. On a project that does not, the resolver falls through to the
      undeclared fallback and the work ticket is routed onto the bug-fixing preset — it reroutes after
      all. The composer is handed only labels and cannot tell the two apart, so the sentence says what
      the label BINDS: this label binds the ticket to phase execution, and without it the ticket is
      routed by this project's own rules or dropped. That holds everywhere.
  - key: |
      THE STAMP'S SENTENCE SAYS WHAT REMOVAL COSTS, NOT THAT IT IS FREE. With the approved record still
      in the store, deleting the stamp changes nothing — the approved source is consulted first and a
      branch artifact wins over it. That is true, and printing it as "deleting this cancels nothing"
      reads as permission, on the one guard that fails OPEN: without the stamp a lost hand-off is
      re-derived from a description anyone can edit instead of refused loudly. This spec refuses to
      make label names configurable for exactly that reason, so it must not print the invitation. The
      sentence says what the stamp is for and what its removal removes.
  - key: |
      THREE READERS, NOT FOUR, AND ALL THREE DROP IT. The description reaches the coding master's
      prompt, the repository-scope classifier's prompt and the pull-request body; the expectation
      composer is no longer in any preset and reads nothing. All three take the description as
      UNTRUSTED data inside a delimiter fence — so framework-authored, instruction-shaped prose about
      label hygiene would become the most imperative sentence the master sees inside that fence, and
      would be weighed by the classifier when it sizes a thin ticket. This repository has the failure
      recorded: procedure in a ticket becomes an acceptance criterion and sinks a correct run. The
      section is marked and stripped for all three; the master learns the ticket came from an approved
      set because the set reaches the run, not because a paragraph says so.
  - key: |
      ONE MARKER, ONE STRIPPER, THREE CALL SITES. The section carries a marker the stripper finds, and
      the three readers call it. The stripper must work on two encodings: the description is markdown
      on three trackers and is stored and read back as HTML on the fourth, because that provider runs
      the body through a markdown converter on write and the mapper reads the field raw.
  - key: |
      A LEVEL-TWO HEADING, AND THE REASON IS A TEST THAT EXISTS. The acceptance-criteria section is
      read back by scanning forward from its heading to the next one of any level. On a record the
      criteria section is frequently last, so an italic footer with bullets would have its bullets read
      back as acceptance criteria and turn an existing test red.
  - key: |
      TWO FILERS GO THROUGH THE COMPOSER, AND THE RECORD DOES NOT. The two that file work apply the
      phase label and the stamp, and their sections come from one table of meanings. The slice record
      applies only the label that keeps it unrouted — naming it would publish the edit that turns a
      record into a derived run — so the record never enters the label path and gets its own line
      instead. The bug filing applies no framework label and gets no section at all.
  - key: |
      ROOM, AND THE TWO FILES THE FIRST DRAFTS MISSED. The renderer has five lines and three public
      entry points whose signatures would all change, so the threading point is the body composer at
      ninety-five of a hundred and twenty, which already has a section seam. The pull-request handler
      is four hundred and thirty-two against a baseline of four hundred and thirty-six, so the stripper
      is its own type that it calls on one line.

steps:
  - id: the-section
    action: "A composer for the framework's label note, taking the set actually applied, looking each up in one table of meanings, and naming without a claim a label it does not know."
  - id: the-filers-pass-what-they-applied
    action: "Each filer hands the label set it applies to the body composer; no list is restated."
  - id: the-record-says-what-it-is
    action: "A slice record says that nothing runs it and which ticket carries the work, without naming the label that makes it so."
  - id: the-pull-request-drops-it
    action: "The pull-request body omits the section; the prompts that read the description keep it."

tests:
  - "Body_PhaseLabel_SaysWhatItBindsAndHoldsOnEitherRoutingShape"
  - "Body_ApprovedSetStamp_SaysWhatItsRemovalRemoves"
  - "Body_EachLabel_HasItsOwnSentence"
  - "Body_TheSection_OpensWithALevelTwoHeading"
  - "Body_AcceptanceCriteria_AreStillReadBackUnchanged_InMarkdownAndInHtml"
  - "Body_SliceRecord_SaysNothingRunsItAndNamesTheWorkTicket"
  - "Body_BugFiling_CarriesNoSection"
  - "PullRequest_Body_DoesNotCarryTheLabelSection"
  - "Prompts_TheMasterAndTheClassifier_DoNotSeeTheSection"

done:
  - "an operator reading a filed ticket learns what each label binds and what removing it costs, on any project"
  - "no pull request and no prompt carries the section"
  - "the acceptance criteria of a record are read back exactly as before"
  - "a record says why nothing runs it without publishing how to change that"
  - "build green, full suite green, file-length ratchet green"
