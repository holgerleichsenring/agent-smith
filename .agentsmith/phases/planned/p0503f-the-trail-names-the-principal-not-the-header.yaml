# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0503f
goal: "A configuration change is attributed to the principal who made it, so the only attribution the config version history has stops being a header anyone who can write config can forge."

applies_to: "backend (config change attribution)"

requires:
  - p0503b

scope:
  in: "Ignoring the X-Actor header whenever an authenticated principal is present, and attributing the change to that principal's subject."
  out: >
    The audit trail and SIEM export, which is p0302 and needs this as its precondition. Any
    other attributed surface: measured, there is exactly one.

decisions:
  - key: |
      THE ONLY ATTRIBUTION THE HISTORY HAS IS A HEADER NOBODY SENDS. `grep -rn "X-Actor" src/
      tests/` returns exactly one line — ConfigStudioEndpoints.cs:196 — which reads the header
      and defaults to the literal string "dashboard" when it is absent. The dashboard never
      sends it. So every attributed row in the config change feed says "dashboard", and the one
      field that could say otherwise is set by whoever made the request.
  - key: |
      THE HEADER IS IGNORED IN A PRINCIPAL'S PRESENCE, NOT DELETED. With no authority
      configured and enforcement off there is no principal, and the header plus its default is
      still the only thing there is. Removing it would leave those deployments with no
      attribution at all, which is a regression dressed as hardening. Principal first, header
      second, "dashboard" last.
  - key: |
      THE DRAFT'S THIRD TEST IS DROPPED FOR PASSING TODAY.
      Attribution_NoPrincipal_KeepsTodaysBehaviour asserts the behaviour that is already there
      and cannot go red against the current code. The two that can are the ones a principal
      changes [[feedback_verify_via_harness]].

steps:
  - id: the-principal-outranks-the-header
    action: "Attribute a config change to the authenticated principal's subject whenever one is present, ignoring the X-Actor header in that case and keeping it as today's fallback otherwise."

tests:
  - "Attribution_PrincipalPresent_TheChangeNamesTheSubject"
  - "Attribution_PrincipalPresentAndXActorHeaderSent_TheHeaderIsIgnored"

done:
  - "a config change made by an authenticated caller is attributed to that caller"
  - "a forged X-Actor header cannot rename an authenticated change"
  - "a deployment with no authority keeps the attribution it has today"
  - "build green, full suite green"
