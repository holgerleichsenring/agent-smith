# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-25-2fa7
goal: "The code map is generated by the role named for it, which the operator can already configure, instead of by the cheapest slot in the registry."

applies_to: "backend"

decisions:
  - key: |
      THE ROLE ALREADY EXISTS AND NOTHING ASKS FOR IT. TaskType.CodeMapGeneration is declared,
      carries a default in ModelRegistryConfig, is mapped by ConfigBasedModelRegistry, is offered
      by the Config Studio and is checked by the context-window preflight. There is no call site
      anywhere that passes it. ProjectAnalyzer — the code-map generator — asks for TaskType.Scout.
      An operator who sets codeMapGeneration in their config changes nothing, and is told nothing.
  - key: |
      THE STEP IS NOT A SCOUT ERRAND, AND THAT IS NOT A PREFERENCE. Scout is the cheap narrow
      slot. ProjectAnalyzer runs an agentic loop with an exploration budget and compaction, and
      its output is read as FACT by everything after it — workdir, languages, entry points, the
      repositories a ticket is scoped to. A weak model there does not fail visibly; it produces a
      worse map, and the error surfaces much later as somebody else's problem. That is the defect
      class this repository spent two days removing.
  - key: |
      THE OBSERVED COST ARGUES THE SAME WAY, WHICH IS THE PART THAT SURPRISES. A cheap model on a
      judgement task is not reliably cheaper: it takes more turns to reach a worse answer, and the
      operator watched one analysis dominate a run's wall-clock at the lowest per-token price.
      Nothing here forces a frontier model, though — the point is that the CHOICE reaches the
      operator, which today it does not.
  - key: |
      NOT A NEW SURFACE, A WIRE. No role is added, no config key is invented, no default changes
      for anyone who has not set one: the registry's own default for this role already resolves
      to primary where nothing is configured. The one change is that the generator asks for the
      role that bears its name.
  - key: |
      THE UNUSED-ROLE HOLE IS WORTH A RULE, NOT JUST A FIX. A TaskType that config accepts, the
      studio renders and preflight measures, while no code path requests it, is a setting that
      silently does nothing — the same shape as a comment claiming a currency nothing checks. A
      test that every declared TaskType has at least one caller keeps the next one from shipping.

steps:
  - id: the-generator-asks-for-its-own-role
    path: "src/backend/AgentSmith.Application/Services"
    action: "Have the project analyzer request the code-map role for both its client and its output bound."
    modify:
      - "src/backend/AgentSmith.Application/Services/ProjectAnalyzer.cs"

  - id: a-declared-role-nobody-asks-for-is-a-defect
    path: "tests/AgentSmith.Tests/Architecture"
    action: "Assert every TaskType the configuration exposes is requested by at least one production call site."

tests:
  - "Analyze_TheProjectMap_IsGeneratedByTheCodeMapRole"
  - "Analyze_AnAgentThatConfiguresNoCodeMapRole_IsUnchanged"
  - "TaskTypes_EveryDeclaredRole_HasAProductionCaller"

done:
  - "setting codeMapGeneration in an agent's models changes which model reads the repositories"
  - "an agent that configures nothing keeps the model it resolves to today"
  - "a role the configuration offers and no code requests fails the suite"
