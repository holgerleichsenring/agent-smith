# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-7a05

goal: "An operator deletes a conversation they own, told first what a deletion does not undo, and no principal deletes or learns about another's."

applies_to: "backend (a delete keyed on the session id, its own owner check) + dashboard (the conversation list)"

requires:
  - 2026-09-17-c7aeb
  - 2026-09-17-042em
  - 2026-09-18-2f8b

scope:
  in: >
    A delete of one conversation, addressed by its session id, scoped to the dashboard platform as
    every other read on this surface is, behind an owner check written for a SESSION id, scoped to the
    platform, and for which an absent row is not a pass. The owner check runs FIRST, so the distinct
    answer a running conversation gives is reachable only by its owner. Success and all three
    refusals answer alike, so a second delete is not an error and the route cannot be used to learn
    which ids exist. The conversation list offers it per row, removes
    the row without a reload, and a list read still in flight cannot bring it back. Deleting the
    conversation open here clears the surface. The operator's own answers, stored durably against this
    session id, go with it. A conversation whose latest filing created work is
    confirmed first, in the words of what survives: the tickets stay, and what stops resolving is the
    map from this conversation to them — plus, for a filed phase or an epic parent, the sentence in
    the ticket body naming this conversation as where the specification was approved.
  out: >
    DELETING WHILE A TURN IS RUNNING. See decisions — it is refused, and the reason is its own case.
    DELETING THE TICKETS. They are the tracker's; a filing is not undone by forgetting the conversation.
    THE APPROVED SPEC SET. It stays. See decisions.
    A BIN OR AN UNDO. A deleted conversation is gone; a third lifetime beside open and closed is a
    reader's burden with no reader.
    BULK DELETE. One row at a time.
    REWRITING A FILED TICKET'S BODY. Editing work items an operator owns, from a delete they asked for
    on something else.

decisions:
  - key: |
      THE OWNER CHECK THIS SURFACE HAS IS AN AUTHORISATION BYPASS FOR THIS ROUTE. Its watch check is
      keyed on the THREAD id and returns true when no open session is found — safe for a watch, because
      nothing is delivered into an id nobody holds. A delete is keyed on the SESSION id, and the two
      namespaces are disjoint by construction: a session id can never match a thread id, so the lookup
      always misses and the check always passes. Reusing it would let any holder of the dialog
      permission delete every conversation in the installation. The delete gets its own check, keyed on
      the session id, in which an absent row is a refusal.
  - key: |
      ONE ANSWER FOR THREE CASES, WHICH IS WHY A SECOND DELETE IS NOT AN ERROR. Not-yours, not-there
      and already-deleted must be indistinguishable or the route is an oracle for which ids exist. That
      forces the answer to be the same terminal one for all three — so the page asserts that the row
      survives a refused delete, never that a status code differed.
  - key: |
      THE SPAN IS THE GATE'S HOLD, NOT ITS COMPUTING FLAG — AND THE DIFFERENCE IS THE WHOLE HAZARD.
      The turn gate carries two spans. The computing flag opens and closes inside the turn runner, and
      the router calls the outcome flow AFTER that returns — which is where the approval wait and the
      filing live. A refusal keyed on computing would therefore permit the delete during exactly the
      window this decision names. It is keyed on the gate's hold, the span the router opens and closes
      around the whole exchange; the gate exposes no read of it today and gains one.
  - key: |
      WHAT THE INTERLEAVING ACTUALLY COSTS. Mid-turn the transcript append and the latest-filing store
      become silent no-ops; the confirmed-outcome store THROWS, which prevents the filing rather than
      accompanying it, and its message reaches the group of a dialog id the page has already left. The
      window that hurts is narrower: a delete landing inside the filing itself, where tickets are
      created and then nothing records what was filed.
  - key: |
      TWO REPLICAS: THE GUARD FAILS OPEN, AND THAT IS STATED. The gate is in-memory and per process, so
      a delete served by the replica that is not running the turn is not refused. This phase does not
      solve that — a design conversation that spans replicas needs a shared channel — but it must not
      be read as a guarantee.
  - key: |
      THE ANSWERS THE OPERATOR TYPED GO WITH THE ROW. Every answer to a question, and the approve or
      reject itself, is written durably against this session id in the dialogue answer table. Nothing
      reaches those rows once the session is gone, and no route resolves that id — so leaving them is
      an undeletable copy of operator prose keyed to nothing. They are swept in the same transaction,
      which is the shape the run deletion already uses for its satellites.
  - key: |
      THE APPROVED SET STAYS, AND THAT IS NOT AN OVERSIGHT. The approved specification set carries the
      session id and is what a RUN reads to execute the approved work. Sweeping it with the session —
      the shape the run deletion uses for its satellites — would make the next run of an already filed
      ticket derive its own specification instead, silently, visible only in the wrong work.
  - key: |
      THE CONFIRMATION SAYS WHAT IS TRUE OF THIS FILING'S KIND. A filed phase and an epic parent carry
      the sentence naming the conversation; a bug ticket's body has none, so the promise would be false
      for one of the three kinds. The kind is on the row the list reads, but it is nullable and falls
      back to the latest proposal — so a conversation whose proposal was discarded has no kind, and that
      branch says only what is true of every filing.
  - key: |
      WHAT THE OPERATOR ACTUALLY LOSES IS THE LIST. The filed work is read off the session's latest
      filing, and only while the conversation is open. After the delete nothing maps those tickets back
      to anything. That is the sentence worth saying, more than the dangling reference.
  - key: |
      A CONVERSATION WITH TURNS BUT NO FILING IS CONFIRMED TOO. Only a conversation with no turns is
      deleted without ceremony. The filing marker is a column added a day earlier, so a conversation
      that filed real tickets before it existed reads as having filed nothing — and confirming anything
      with turns is the cheap side of that error.
  - key: |
      THE LIST READ MUST NOT RESURRECT THE ROW. The list is re-read on hub messages and whenever the
      open session changes — which deleting the open conversation is. Its sequence guard only drops a
      read superseded by a newer read, not one issued before the delete and landing after it.
  - key: |
      THE ROW IS A BUTTON TODAY, SO THE ROW STOPS BEING ONE. A control nested in a button is invalid
      and warns. The run list's delete is cited as a file-level precedent only: it sits INSIDE its row's
      link and survives by stopping propagation, which is the shape to avoid here, not to copy.
  - key: |
      THE CONFIRMATION IS THE BROWSER'S OWN, BECAUSE PROSE NEEDS SOMEWHERE TO GO. There is no modal
      primitive. The run delete's arm-on-first-click carries nothing but a button label, so the
      sentences this phase exists to show would have nowhere to appear and two of its own tests could
      not be written. The two prose confirmations already in the tree use the browser's confirm, and a
      test asserts the string passed to it.
  - key: |
      THE PERMISSION IS THE SURFACE'S OWN WRITE PERMISSION, AND THE PRECEDENT SAYS SO. Most destructive
      routes here reuse their surface's write permission — people, config entities, secrets — and only
      the run delete names one of its own. Reusing the dialog write permission is the dominant shape,
      and it is stated rather than assumed by a test.

steps:
  - id: the-owner-check
    action: "An owner check keyed on the session id and scoped to the dashboard platform, in which an absent row is a refusal."
  - id: the-route
    action: "A delete on one conversation, answering identically for not-yours, not-there and already-deleted, refusing while a turn is computing, with its row in the route-permission baseline."
  - id: the-list-offers-it
    action: "The list offers the control beside the row, removes the row without a reload, guards against a list read in flight, and clears the surface when the open conversation goes."
  - id: what-it-does-not-undo
    action: "A conversation with turns is confirmed, in the words of what survives and what stops resolving, worded by the latest filing's kind; one with no turns is deleted without a confirmation."

tests:
  - "Delete_OwnConversation_RemovesItAndItsTranscript"
  - "Delete_AnotherPrincipalsConversation_LeavesItInPlace"
  - "Delete_SessionThatDoesNotExist_AnswersAsForOneThatIsNotYours"
  - "Delete_TwiceInARow_AnswersTheSameBothTimes"
  - "Delete_AConversationOnAnotherPlatform_IsNotReached"
  - "Delete_WhileATurnIsComputing_IsRefusedWithThatReason"
  - "Delete_WithoutTheDialogPermission_IsForbidden"
  - "Delete_ConversationThatFiled_LeavesTheTicketsAndTheApprovedSetStored"
  - "dashboard: a conversation with no turns is deleted without a confirmation"
  - "dashboard: a conversation that filed a phase is confirmed with the ticket sentence that stops resolving"
  - "dashboard: a conversation that filed a bug is confirmed without claiming a sentence it never had"
  - "dashboard: a list read in flight when the delete lands does not bring the row back"
  - "dashboard: deleting the open conversation clears the surface"
  - "dashboard: the delete control does not open the conversation"

done:
  - "an operator clears conversations they started by mistake"
  - "no principal deletes another's, and none learns which ids exist"
  - "a conversation mid-turn is not deleted out from under its own filing"
  - "what the operator loses is said before they lose it"
  - "build green, full suite green, dashboard tests green, file-length ratchet green"
