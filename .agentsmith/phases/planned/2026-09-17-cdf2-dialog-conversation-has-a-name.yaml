# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-17-cdf2

goal: "A past conversation is listed by what it was about and what became of it, rather than by a session id nobody chose."

applies_to: "backend (spec dialog: what a session summary carries, and where its outcome is kept)"

scope:
  in: >
    A session records a TITLE and an OUTCOME, and the summary the dashboard lists carries both.
    The title is the first thing the operator said, trimmed to one line — never rewritten. The
    outcome is what the conversation became: an answer, a bug, a phase, an epic, or nothing yet;
    it is written when the filing sink succeeds and when a turn ends in an answer. Both are
    columns on the session, with a migration in BOTH migration assemblies. The listing already
    narrows to the caller (2026-09-15-9033) and that is untouched.
  out: >
    A MODEL-GENERATED TITLE. See decisions.
    RENAMING A CONVERSATION BY HAND. Worth having and not this phase; a successor, named by what
    it does: the operator may retitle a conversation, and the stored first line stops being the
    only name it can have.
    SEARCH ACROSS CONVERSATIONS. The list is short because it is one person's.
    THE DASHBOARD'S RENDERING OF ANY OF IT. 2026-09-17-f74e.

decisions:
  - key: |
      THE FIRST THING THE OPERATOR SAID IS THE TITLE. Asking a model to name a conversation costs
      a call per row and gives a title that changes under the reader between two visits. The first
      user turn is what the person chose to say, it is stable for the life of the conversation, and
      it is already stored. Truncated for display, never rewritten.
  - key: |
      THE OUTCOME MUST BE PERSISTED, BECAUSE THE PLACE IT LIVES IS CLEARED ON SUCCESS.
      SpecDialogOutcomeStore clears the confirmed outcome exactly when filing succeeds — by design,
      so a crash cannot re-file it. "What became of this conversation" therefore cannot be read back
      from there at all, and a column is the honest home rather than a second inference.
  - key: |
      BOTH MIGRATION ASSEMBLIES OR NEITHER. This repository ships a SQLite set and a SQL Server
      set. A column added to one leaves the other refusing to start on the next deploy, and the
      one that breaks is whichever the operator actually runs.
  - key: |
      A CONVERSATION WITH NO USER TURN HAS NO TITLE, AND SAYS SO. A session opened and abandoned
      is listed by its project and its time. Inventing a name for it would make the one row that
      is empty the one row that lies.
  - key: |
      AN OUTCOME IS WRITTEN WHERE THE FILING IS KNOWN TO HAVE WORKED. TicketFilingOutcomeSink
      already distinguishes a complete filing from a partial one and keeps both halves. A partial
      filing is recorded as what it is, because a conversation that created two of three children
      is not an epic filed and is not nothing.

steps:
  - id: the-session-remembers-its-name-and-its-end
    action: "SpecDialogSession gains a title and an outcome; a migration in both assemblies."
  - id: the-title-is-the-first-thing-said
    action: "The first user turn sets the title once, trimmed to one line; later turns do not change it."
  - id: the-outcome-is-written-where-filing-succeeded
    action: "The filing sink records epic, phase or bug on success and the partial case as partial; a turn ending in an answer records that."
  - id: the-summary-carries-both
    action: "SpecDialogSessionSummary and the list route return the title and the outcome."

tests:
  - "Session_FirstUserTurn_BecomesTheTitle"
  - "Session_LaterTurns_DoNotChangeTheTitle"
  - "Session_WithNoUserTurn_HasNoTitle"
  - "Session_AfterAnEpicIsFiled_RecordsThatOutcome"
  - "Session_AfterAPartialFiling_RecordsThePartialOutcome"
  - "Session_EndingInAnAnswer_RecordsThatNothingWasFiled"
  - "Summary_CarriesTheTitleAndTheOutcome"
  - "Migrations_BothAssemblies_CarryTheNewColumns"

done:
  - "the caller's own conversations list by what they were about and what came of them"
  - "a conversation nobody said anything in is listed without inventing a name for it"
  - "an outcome survives a restart, though the confirmed proposal it came from is cleared"
  - "build green, full suite green, both migration sets apply"
