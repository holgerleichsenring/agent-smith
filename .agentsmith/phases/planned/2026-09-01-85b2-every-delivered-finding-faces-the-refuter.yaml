# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-01-85b2

goal: "Every finding a scan delivers is put to a fresh instance to refute, not only the ones a master's silence promoted."

applies_to: "backend (which delivered findings are treated as unchecked, and how they are asked about)"

scope:
  in: >
    A delivered finding is refutable whoever produced it; the master's own findings are asked about
    on the same terms as a promoted scanner fact; the questions go out in batches with a bound;
    silence stays a non-verdict in both directions; the account states how many were asked and how
    many were refuted.
  out: >
    DROPPING A MASTER FINDING FOR CITING NOTHING — an invented citation from a scanner is dropped
    today, and extending that fate to a master's own claim in the same phase would confound a
    verification change with a deletion change. A master claim the resolvers cannot answer passes
    through untouched, exactly as an unanswerable scanner claim does.

decisions:
  - key: |
      THE VERIFIER HAS NEVER RUN. Five of six observed runs logged that it checked nothing, and the
      reason is structural rather than accidental: only findings the master's SILENCE promoted are
      offered to it, and on a repo scan the master curates everything. A verification step that by
      construction never sees the findings a run actually delivers is not a verification step.
  - key: |
      CURATION WAS TREATED AS AUTHORSHIP, AND THE MEASUREMENT DOES NOT SUPPORT IT. The exemption
      rests on the master having read the code. Twelve pipeline runs produced none of the five
      defects a direct probe of the same code found three times out of four — so the reading is not
      the guarantee it was taken for, and the findings it does produce have had exactly one opinion
      behind them.
  - key: |
      THE SHAPE THE CODING SURFACE ALREADY USES. Give the model the room to find, then check what it
      brought back. Widening the refuter's input is the smallest possible version of that here: the
      machinery, the prompt, the cost role and the verdict reader all exist and are exercised; only
      the selection is wrong.
  - key: |
      BATCHED, WITH A BOUND. One call per finding turns a thirty-finding scan into thirty calls. The
      refuter already takes a list; the change is to send the delivered set in bounded batches, so
      the cost grows with findings rather than with findings times round trips.
  - key: |
      SILENCE IS STILL NOT A VERDICT. A refuter that cannot be asked, or that answers unreadably,
      leaves every finding standing — the existing rule, and it matters more once the master's own
      findings are in scope, because the failure mode to avoid is a scan that quietly delivers less.

steps:
  - id: a-delivered-finding-is-checkable-whoever-made-it
    action: "The unchecked set is every delivered finding, not only the promoted ones."
  - id: the-questions-go-out-in-batches
    action: "The refuter is asked in bounded batches rather than once per finding."
  - id: the-account-states-what-was-asked
    action: "The coverage account reports how many findings were put to the refuter and how many it refuted."

tests:
  - "Refuter_IsAskedAboutAMastersOwnFinding"
  - "Refuter_IsAskedAboutEveryDeliveredFinding"
  - "Refuter_Silence_LeavesEveryFindingStanding"
  - "Refuter_RefutedMasterFinding_IsDowngradedWithItsReason"
  - "Refuter_ManyFindings_AreAskedInBoundedBatches"
  - "Account_StatesHowManyWereAskedAndRefuted"

done:
  - "a run with findings never again reports that nothing was checked"
  - "a refuted master finding is downgraded and says why"
  - "a failed refutation delivers the same findings as before"
  - "build green, full suite green"
