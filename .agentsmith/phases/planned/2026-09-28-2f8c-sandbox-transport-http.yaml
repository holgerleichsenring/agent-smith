# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-2f8c
goal: "The server that owns a sandbox drives its agent over HTTP with a per-job key, Redis leaves the sandbox entirely, and the contract suite and reference runs show no regression."

applies_to: "backend (Sandbox.Agent, Sandbox.Wire, server sandbox backends) and deploy/docs; ships in a release of its own"

requires: ["2026-09-28-7667", "2026-09-28-3ca9"]

scope:
  in: >
    The agent's HTTP host:
    - It listens on one fixed, unusual high port declared once in Sandbox.Wire, and fails loudly if a
      build or test in the same container has taken it.
    - It reads its per-job key from the environment and removes it from what child steps inherit.
    - It accepts only requests carrying that key.
    - PUT /steps/{stepId} is idempotent: a duplicate re-attaches to the running step.
    - It queues steps first-in-first-out, as Redis does today.
    - It keeps a per-job event buffer bounded at 10,000 events, as the stream is today, and keeps a
      finished result until it is read and the next step is accepted.
    - A reattach resumes from an event sequence number; a range already trimmed is answered with an
      explicit gap marker.
    - /health answers with the agent's protocol version.
    - It exits once the idle limit has passed with no request.
    The server side:
    - The server waits on /health as a factory step, after the pod-readiness wait and within the same
      start timeout. It refuses an agent whose reported protocol is too old. An agent that never
      answers is reported with its image, exit code and log tail. That is the path every agent
      existing today will take, since none of them has /health.
    - A Kubernetes sandbox is dialled at its pod IP. A Docker sandbox is dialled at its container
      address when the server is attached to the sandbox's network. Otherwise the agent port is
      published to an ephemeral host port bound to 127.0.0.1 (or on the remote DOCKER_HOST's
      address), and that port is read back after start.
    - The step client has no timeout of its own and uses TCP keepalive; SandboxStepCap owns the
      deadline. /health calls carry their own short timeout, below the watcher's miss window.
    - Events feed the same IProgress as today.
    - IsAliveAsync (2026-09-28-3ca9) calls /health. The watcher's calls, running for every container
      sandbox of a live run (source scopes included), are the contact that keeps an idle agent alive.
      A watcher stops when its run leaves the active set (LiveRunSetReader.cs:26) as well as on
      disposal, so a leaked coordinator cannot keep an orphan alive forever.
    - The sandbox owner identity derives from the server's own REDIS_URL.
    Removals: REDIS_URL, the Redis client and every Redis-bound type and test leave the agent and the
    sandbox path, with no fallback flag.
  out: >
    - Continuing a run on another replica after its owner dies. Pipeline state lives in the owning
      process: today a dead replica's lease ages out and the ticket is re-taken (ActiveRunReaper.cs:7-22;
      StaleLeaseRelease.cs:55-72), and held sandboxes are per process (HeldSandboxRegister.cs:16, 24-32).
      That behaviour is kept, not extended.
    - TLS between server and agent: parity with today's plaintext Redis inside the cluster network,
      which 2026-09-28-23a2d then limits to server pods.
    - The in-process backend, which has no transport.

decisions:
  - key: |
      OPERATOR DECISION 2026-09-28: Redis stays between servers and leaves the sandbox. Today the sandbox
      holds the server's own Redis credential (PodSpecBuilder.cs:86-88, 121-125;
      DockerContainerSpecBuilder.cs:57-59, 78-82), enough to forge steps, jobs and liveness. Afterwards
      it holds a key to itself only.
  - key: |
      SERVER PUSHES, AGENT ANSWERS. The owning process holds the pipeline, the ISandbox and the
      IProgress (SandboxRedisChannel.cs:24-66). A poll through a Service would land on a random
      replica holding none of them. Nothing else reads a sandbox's event stream: only the channel and
      its drain do, and the run stream is fed by the owner (SandboxRedisChannel.cs:52-59).
  - key: |
      THE KUBERNETES IDLE REGRESSION IS CLOSED BY 3ca9, NOT HOPED AWAY. Today an idle Kubernetes
      sandbox stays alive by asking Redis whether its run is active (JobLoop.cs:55-62), and nothing
      else contacts it, because only Docker is watched (DockerSandboxRegistrations.cs:74-80). Over HTTP
      the agent counts contact, so this phase requires 3ca9, which watches every container sandbox of
      a live run. The idle clock pauses while a step runs (JobLoop.cs:44-47, 70). A contract test and
      the operator's Kubernetes acceptance both hold a sandbox idle past the limit during a live run.
  - key: |
      IDEMPOTENT, ORDERED, DECOUPLED:
      - A dropped submit is retried with the same StepId, so no step runs twice.
      - Concurrent submits queue first-in-first-out. This goes beyond parity: on Redis today two waiters
        on one sandbox can take and discard each other's results (SandboxRedisChannel.cs:96-100). 7667
        adds the per-sandbox step gate that makes it true on Redis first.
      - Execution is decoupled from the response. HttpListener gives no client-abort token, so a
        cancelled request leaves the step running, as today.
      - A Shutdown is queued behind the running step; after a 10-second grace the pod is deleted, as
        today (KubernetesSandbox.cs:50-57).
      - The buffer is per job and trims at 10,000, as the stream sandbox:{job}:events does today
        (StreamLimits.cs:10; RedisKeys.cs:8).
      - AGENTSMITH_SANDBOX_MAX_IDLE_CYCLES keeps its meaning: minutes without contact.
  - key: |
      A REFUSAL READS AN OBSERVED VERSION, NEVER A TAG. The wire-protocol watcher only advises
      (WireProtocolWatcher.cs:13-17, 31-41). An old agent given no REDIS_URL exits with code 2
      (Program.cs:53-57), and Kubernetes then reports only a generic Failed phase
      (KubernetesPodWatcher.cs:59-61). So /health returns the protocol, and the factory refuses an old
      one by name. An agent that never answers is reported with what the backend saw: the image, the
      exit code and the log tail. The advisory texts change to match (WireProtocolWatcher.cs:47;
      PinnedAgentProbe.cs:59-61). PinnedAgentProbe does not parse tags (:13-17), so it does not claim
      to know which pins predate HTTP.
  - key: |
      THE DIAL ADDRESS COMES FROM A FACT. The factory's current self-inspect runs only when no network
      is configured and swallows errors into "bridge" (DockerSandboxFactory.cs:57-61, 73-78), so it is a
      network guess. SandboxDialAddress inspects the server's own container unconditionally and asks
      one question: is the server attached to the network the sandbox joins? If yes, it dials the
      container. If no — including a harness server on the host with a configured network, and a
      server not in Docker at all — it publishes the agent port to an ephemeral loopback port, or on
      the remote DOCKER_HOST, and dials that.
  - key: |
      THE OWNER IDENTITY KEEPS ITS VALUE IN PRODUCTION. It is fingerprinted from options.RedisUrl
      (SandboxOwnerIdentityResolver.cs:23-29; DockerSandboxRegistrations.cs:26;
      KubernetesSandboxRegistrations.cs:28), which in production is the server's own REDIS_URL
      (KubernetesSandboxRegistrations.cs:19-23). Its input becomes that URL by name, so existing labels
      stay valid. In the harness the two URLs differ (DockerHarnessRegistrations.cs:57); harness
      containers are ephemeral.
  - key: |
      THE KEY IS NOT SECRET FROM THE SANDBOX ITSELF, AND NEED NOT BE. It arrives in the container
      environment, visible in the pod spec like the job id. The agent removes it from what child steps
      inherit, so `env` does not print it into the trail. But a step runs as the same user
      (PodSpecBuilder.cs:27 sets only fsGroup), so /proc/1/environ still shows it. That is accepted:
      the key authorises talking to this one agent, and the step is already running inside it. 23a2b
      masks it if it is printed.
  - key: |
      THE CONTRACT FIXTURE MAPS "LIVE" HONESTLY. On Redis, 7667's mark-live adds the run to the active
      set; on HTTP it starts the owner's watcher, and mark-not-live stops it. The idle cases therefore
      test the same outcome through each transport's own mechanism.
  - key: |
      HttpListener, measured. The injected agent is self-contained and untrimmed (Sandbox.Agent
      Dockerfile:20-27), and the loader is limited to 256Mi (PodSpecBuilder.cs:63-75). HttpListener adds
      no framework, binds http://+:port above 1024 without root, and supports chunked responses. The
      bundle size is recorded before and after.
  - key: |
      SAFETY BAR (operator 2026-09-28): works as well afterwards as now.
      - The 7667 suite passes unchanged against the HTTP fixture in the Linux CI job, which builds the
        agent from the tree.
      - Manual acceptance by the operator:
        - two replicas; the owner pod is deleted mid-run; the lease is released, the ticket is
          re-taken and the orphan is reaped, as today;
        - one run whose sandbox stays idle past the idle limit, on Kubernetes.
      - The 7667 baseline is repeated within its tolerance.
      - Its own release. Rollback is one image tag, provided per-project agent pins
        (AgentVersionResolver.cs:30-32) are rolled back with the server; the release notes say so.
  - key: |
      WITHDRAWN, RECORDED HERE: the per-job Redis ACL phase (formerly 2026-09-28-23a2a, never merged)
      and its agent-handshake prerequisite. With Redis gone from the sandbox they protect nothing. Two
      findings from their reviews carry over: a password secret key must never fail open, and REDIS_URL
      must be redacted in findings (2026-09-28-2ac3).
  - key: |
      FILE-LENGTH. JobLoop (134 under 158) and PodSpecBuilder (139 under 166) have room;
      DockerSandboxFactory (144 of 144) pays by extraction; SandboxLivenessWatcher is 3ca9's.
  - key: |
      SERIES: a transport slice; follows 7667 and 3ca9, precedes 23a2d. Own number.

steps:
  - id: the-protocol
    path: "src/backend/AgentSmith.Sandbox.Wire"
    action: "Routes, key header, agent port and event sequence stated once; WireProtocol.Current and MinimumSupported become 2."
  - id: the-agent-serves
    path: "src/backend/AgentSmith.Sandbox.Agent"
    action: "The HttpListener host with the semantics in scope; the job loop fed by it; the key read and removed; Redis removed."
    new:
      - "AgentHttpHost: listener, routes and key check"
      - "StepQueue: first-in-first-out steps with idempotent submit"
      - "StepEventBuffer: bounded per-step replay with sequence numbers"
    delete:
      - "RedisJobBus, RedisEventChannel, the Redis half of HeartbeatLoop and ToleratedStepReader, the --redis-url option (Program.cs:13-15, 53-55), the StackExchange.Redis reference"
  - id: the-server-drives
    path: "src/backend/AgentSmith.Server/Services/Sandbox"
    action: "SandboxHttpChannel replaces SandboxRedisChannel; the health wait and refusal in both factories; pod-IP and Docker dial resolution; IsAliveAsync over /health; the owner identity from the server URL."
    new:
      - "SandboxHttpChannel: the server side of one agent"
      - "SandboxDialAddress: resolves where to reach an agent"
    delete:
      - "SandboxRedisChannel, SandboxEventDrain, RedisKeys (including ActiveRunsSet's mirror, :26)"
  - id: tests-out
    path: "tests"
    action: "Delete SandboxRedisChannelDisposeTests, RedisKeysTests, RedisJobBusTests, ActiveRunsSetKeyConsistencyTests and the Redis parts of the harness SandboxHeartbeatTests; remove HARNESS_SANDBOX_REDIS_URL and DockerPresetRunner.cs:131-138."
  - id: deploy
    path: "deploy, docs"
    action: "No REDIS_URL for sandboxes; the agent port documented; release notes on pins and on the refusal."
  - id: it-is-pinned
    path: "tests/AgentSmith.PipelineHarness/Contract, tests/AgentSmith.Sandbox.Agent.Tests, tests/AgentSmith.Tests"
    action: "HttpSandboxTransportFixture behind the 7667 seam; host, queue and buffer tests."
    new:
      - "HttpSandboxTransportFixture: the HTTP transport behind the contract seam"

tests:
  - "SandboxTransportContract_* (all of 2026-09-28-7667) against HttpSandboxTransportFixture"
  - "AgentHttpHost_RequestWithoutTheKey_IsRejected"
  - "AgentHttpHost_DuplicateSubmit_AttachesInsteadOfRunningTwice"
  - "AgentHttpHost_Reattach_ResumesFromTheSequence"
  - "AgentHttpHost_PortTaken_FailsLoudly"
  - "AgentHttpHost_StepEnvironment_DoesNotContainTheKey"
  - "SandboxHttpChannel_SilentStepLongerThan100Seconds_Completes"
  - "SandboxFactory_OldProtocolReported_RefusedByName"
  - "SandboxFactory_AgentNeverAnswers_ReportsImageExitCodeAndLogTail"
  - "SandboxDialAddress_ServerOnHostWithConfiguredNetwork_PublishesALoopbackEphemeralPort"
  - "SandboxDialAddress_ServerOnTheSandboxNetwork_DialsTheContainer"
  - "SandboxHttpChannel_HealthAgainstAHungAgent_TimesOut"
  - "AgentHttpHost_ReattachIntoATrimmedRange_ReturnsAGapMarker"
  - "SandboxLivenessWatcher_RunLeftTheActiveSet_StopsWatching"
  - "SandboxOwnerIdentity_FromServerUrl_EqualsTodaysLabelInProduction"

done:
  - "the 7667 suite is green against HTTP in the Linux CI job, including idle-while-live"
  - "no sandbox environment or argument carries REDIS_URL, and the agent binary contains no Redis client"
  - "the operator accepts it manually: owner-pod loss behaves as today, and a Kubernetes sandbox idle past the limit survives its live run"
  - "the 7667 baseline repeats within tolerance"
  - "released on its own, with the pin rule in the release notes"
  - "build green, full suite green"
