      THE SOURCE OF TRUTH IS RawAgentSmithConfig AND THE BOUND MODELS, NOT THE OLD PROSE. Every block on
      the page is checked against the type the loader binds, so a field that no longer exists is deleted
      rather than annotated.
  - key: |
      p0462 ANSWERED WHERE CONFIGURATION LIVES, NOT WHAT THE FIELDS MEAN. This phase is the second half:
      the surface question is settled, the field semantics are not.

