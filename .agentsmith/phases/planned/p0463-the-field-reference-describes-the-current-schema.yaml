decisions:
  - key: |
      THE PAGE HAS CARRIED ITS OWN DRIFT NOTICE SINCE 2026-05-22. reference/configuration/agentsmith-yml.md
      documents the pre-p0139 inline-per-project shape (one source/tickets/agent block per project) and
