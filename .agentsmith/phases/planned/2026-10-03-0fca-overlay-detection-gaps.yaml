# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-03-0fca
goal: "A framework overlay also applies where a subproject's dependency is declared outside its root — sbt and Gradle multi-project builds — and to notebook-only repositories, scoped per subproject."

applies_to: "principles overlay detection (agent-smith), project discovery (skills)"

requires: []

facts:
  - claim: "A discovered component's Workdir is the directory of its governing manifest, or where there is none the directory its evidence sits in."
    evidence: "src/backend/AgentSmith.Contracts/Models/DiscoveredComponent.cs:17"

assumptions:
  - claim: "In sbt multi-project builds dependencies sit in the root build.sbt or project/Dependencies.scala; Gradle version catalogs keep coordinates in gradle/libs.versions.toml; Databricks notebooks are .py files headed '# Databricks notebook source', often without a manifest."
    check: "Open the sbt, Gradle and Databricks Asset Bundle documentation and one real repository of each before building."
  - claim: "A subproject's dependencies can be read from the build file block that scopes it — the sbt project's settings, the subproject's own build.gradle referencing a catalog alias — without evaluating the build."
    check: "Prove it on an sbt multi-project and a Gradle catalog repository; if it needs build evaluation, say so and stop."

scope:
  in: >
    Detection reads the declaration that scopes THIS subproject: its block in the root build.sbt, or its own
    build.gradle's catalog aliases resolved through gradle/libs.versions.toml. A root-level declaration other
    subprojects share never applies the overlay to a sibling that does not reference it. Notebook-only repositories: discovery surfaces a
    notebook directory as a component and the overlay names the notebook header as a signal.
  out: >
    Notebook cells as a size unit.

decisions:
  - key: "SCOPED, NOT INHERITED. A root build lists what any subproject may use; only the subproject's own reference proves it uses Spark."

steps:
  - id: walk
    action: "Detection walks up to the repository root."
  - id: notebooks
    action: "Discovery and the Spark overlay recognise notebook-only repositories."

tests:
  - "FrameworkOverlayDetector_SbtSubprojectBlock_AppliesTheOverlay"
  - "FrameworkOverlayDetector_SiblingSubprojectDependency_DoesNotApply"
  - "a discovery eval: a notebook-only repository yields a component"

done:
  - "an sbt subproject and a notebook-only repository both get the Spark overlay"
