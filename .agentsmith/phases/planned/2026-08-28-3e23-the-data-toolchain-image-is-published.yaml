# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-3e23

goal: "The image the data profile names exists in a registry the sandbox trusts, built from the pinned tools the measurement recorded, and re-measured once published."

applies_to: "backend (the toolchain image definition, its publisher, the measured table)"

requires:
  - p0505
  - 2026-08-28-c5e7

scope:
  in: "A Dockerfile carrying exactly the measured toolchain, a workflow publishing it to ghcr under the tag the profile declares, a re-run of the measurement against the published image, and the measured table updated to name it."
  out: >
    ANY TOOL THE MEASUREMENT DID NOT RECORD. A tool in the image that no measured row
    cites is a tool nobody can say anything about; adding one belongs to a phase that
    measures it. Publishing under any other name or tag: the string is a contract with
    the profile. Changing what the profile declares — that file is authored in
    agent-smith-skills.

decisions:
  - key: |
      THE TAG IS A CONTRACT WITH A FILE IN ANOTHER REPOSITORY, SO IT IS COPIED, NOT CHOSEN.
      profiles/dbt-databricks/profile.yaml declares
      ghcr.io/holgerleichsenring/agent-smith-data-toolchain:1.0.0-bookworm. A publisher that
      pushes anything else produces an image nothing resolves to, and the failure surfaces as an
      image pull error inside a run rather than as a mismatch anyone can see.
  - key: |
      GHCR, BECAUSE DOCKER HUB CANNOT CARRY THIS IMAGE AT ALL. ImageRegistryTrust accepts a
      Docker Hub image only when the repository part has no namespace segment — the official
      library shape — and this repository's existing publisher pushes under a namespace. ghcr.io
      is trusted by default and needs no policy change on the operator's side.
  - key: |
      THE BASE IS THE ONE THE MEASUREMENT RAN ON, AND IT MUST CARRY GIT. python:3.12-bookworm is
      what the p0505 image was built FROM, and the sandbox clones the repository INSIDE the
      toolchain image, so a -slim or -alpine base breaks checkout before anything is verified.
      The Dockerfile asserts git at build time rather than trusting the base's reputation.
  - key: |
      THE PUBLISHED IMAGE IS RE-MEASURED, BECAUSE THE TABLE IS EVIDENCE ABOUT AN IMAGE AND THE
      IMAGE CHANGED. Every row names agentsmith-data-toolchain:p0505, a tag that exists on one
      laptop. Re-running tools/measure-data-toolchain.sh against the published reference makes
      the rows reproducible by anyone; keeping them would leave the profile's gate justified by
      evidence from an artefact nobody else can pull.
  - key: |
      THE PUBLIC dbt IMAGES WERE CONSIDERED AND REJECTED ON FACTS. fishtownanalytics/dbt is
      deprecated — last push 1.0.0, and its own description points elsewhere — and carries a
      Docker Hub namespace, so it fails the trust rule twice over. The official ghcr.io/dbt-labs
      images clear the registry rule but carry neither the measured dbt-databricks adapter
      version, nor sqlfluff, nor the Databricks Go CLI, which has no pip distribution at all.
  - key: |
      TWO ARCHITECTURES, BECAUSE THE MEASUREMENT MACHINE AND THE CLUSTER DISAGREE. Development
      here is arm64 and the sandbox nodes are amd64; a single-arch image makes the local
      re-measurement impossible or the cluster pull fail, and which of the two breaks is decided
      by whoever pushes first.

steps:
  - id: the-image-is-defined
    action: "A Dockerfile over python:3.12-bookworm installing the measured pip set at the measured versions and the Databricks CLI at the measured version, asserting git and every tool's version at build time."
  - id: the-image-is-published
    action: "A workflow building both architectures and pushing the exact tag the profile declares, on demand and on a tag, with the digest reported."
  - id: the-measurement-is-repeated
    action: "Re-run the measurement script against the published image over the unchanged fixtures, and update the table's image column and header to name it."
  - id: the-pins-cannot-drift
    action: "A test asserting the versions the Dockerfile installs are the versions the measured table's rows cite."

tests:
  - "Dockerfile_ToolVersions_MatchTheMeasuredTable"
  - "MeasuredTable_EveryRow_NamesThePublishedImage"
  - "MeasuredTable_FixtureHashes_AreUnchanged"

done:
  - "the tag the profile declares is pullable from ghcr on both architectures"
  - "the re-measured table reproduces every declarable verdict the profile relies on"
  - "a sandbox started from the image clones a repository and runs dbt, sqlfluff and the CLI"
  - "build green, full suite green"
