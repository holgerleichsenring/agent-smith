# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-3ba9

goal: "A run dequeued from the capacity queue is held to the Docker sandbox count the ledger cannot express, so the bound that guards a single host is not lost on the path that actually starts runs."

applies_to: "backend (the capacity queue pump and its use of the Docker capacity probe)"

requires:
  - 2026-09-18-0f27

scope:
  in: >
    The pump that claims the head of the capacity queue consults the Docker capacity probe before it
    claims, using the footprint the ledger already persisted for that reservation, and only on the
    Docker backend. A denial leaves the entry where it is, which is what a queue is for: the bound is
    a count of sandboxes running right now, so an entry that does not fit this tick fits the next one
    a run finishes. Where no footprint was persisted the pump says so and admits, because refusing on
    a number nobody recorded would stop work for a missing field rather than for a full host.
  out: >
    A FOOTPRINT LARGER THAN THE BOUND. It is refused at admission today and left refused; turning
    that into a permanent answer is named in prose as the phase that decides what to do with a run
    that cannot fit the host it was given — and it must not be attempted before the run is narrowed,
    because the counted footprint is one sandbox per repository and toolchain over EVERY configured
    repository, taken before the run is scoped to the repositories the ticket touches.
    KUBERNETES. Its quota is expressed in the same resource terms the ledger carries, so the
    substitution the decision below describes did not lose anything there.
    THE LEDGER BUDGET. It is a second, independent bound and stays exactly as it is.
    WHERE THE BOUND IS CONFIGURED. 2026-09-18-0f27.

decisions:
  - key: |
      THE PUMP'S SILENCE IS A RECORDED DECISION, NOT AN OVERSIGHT, AND THE NARROW CLAIM IS THE TRUE
      ONE. p0336 states it: the pump reads the persisted footprint with no per-tick remote reads, and
      "the advisory ISandboxCapacityProbe is replaced by the ledger gate at both admission sites". The
      probe's own contract still calls itself advisory. That substitution is sound wherever the ledger
      can express the bound — and the Docker bound is a COUNT of sandbox containers, which cpu and
      memory reservations cannot express at all. So on the Docker backend the substitution replaced
      the only guard with one that cannot see it, and the ledger is fail-open when no cpu or memory
      limits are configured, which is the default on a single host.
  - key: |
      THE FOOTPRINT COMES FROM THE LEDGER, AND ITS ABSENCE IS ANSWERED EXPLICITLY. The queue entry
      carries project, ticket, pipeline, platform and a reserved run id — no footprint. The ledger's
      snapshot for that run id carries one, and returns null when nothing was recorded, which is also
      what the no-op budget returns on every composition without a database. Refusing on a null would
      stop every run on those compositions; admitting on it is the same fail-open the ledger already
      is, and it is stated here rather than discovered.
  - key: |
      A DENIAL KEEPS ITS PLACE, BECAUSE THIS BOUND IS TRANSIENT BY CONSTRUCTION. The count is of
      sandboxes running now; a finishing run frees slots. That is what a queue is, and the pump
      already leaves a head it could not claim. The hazard a permanent refusal would create — a head
      nothing can ever admit, with strict FIFO behind it — is why the unmeetable case is not in this
      phase.
  - key: |
      AFTER THE REAP, BEFORE THE RESERVATION. The pump reaps corpse sandboxes first so headroom
      reflects reality on the dequeue path; a probe consulted before that reads stale occupancy and
      denies a head the reap would have admitted.
  - key: |
      ROOM. The pump is at its ratchet baseline exactly and may only shrink, so the consultation is a
      collaborator it calls on one line — the same shape as the reap and the reservation it sits
      between. The Kubernetes probe is also at its baseline and is not touched by this phase at all.

steps:
  - id: the-pump-asks
    action: "A collaborator answers whether the head's persisted footprint fits the Docker sandbox bound, consulted after the corpse reap and before the reservation, admitting when no footprint was recorded and saying so."
  - id: the-pump-calls-it
    action: "The pump calls it on one line and leaves a denied head queued, as it already does."

tests:
  - "Pump_HeadWhoseFootprintExceedsTheBound_IsNotClaimed"
  - "Pump_HeadWhoseFootprintFits_IsClaimed"
  - "Pump_DeniedHead_StaysAtTheHeadOfTheQueue"
  - "Pump_HeadWithNoPersistedFootprint_IsClaimedAndSaysWhy"
  - "Pump_AfterARunFinishes_ThePreviouslyDeniedHeadIsClaimed"
  - "Pump_ConsultsTheProbeAfterTheReap_NotBefore"
  - "Pump_OnANonDockerBackend_ConsultsNothingNew"

done:
  - "a run dequeued from the capacity queue cannot start over the Docker sandbox bound"
  - "a head denied for the bound is claimed on a later tick once a run finishes"
  - "a composition with no persisted footprint behaves exactly as it does today"
  - "build green, full suite green, file-length ratchet green"
