# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0439a
goal: "A run whose software works is DONE — with its open questions named — and only a criterion about the software itself can fail it."

applies_to: "backend + dashboard"

requires:
  - p0439
  - p0484

decisions:
  - key: |
      SUPERSEDES p0439, WHICH WAS NEVER IMPLEMENTED, ON ONE OPERATOR RULING. p0439 answered
      "a failed run, the accounting is right, what do I get out of it?" with a third terminal
      state called SHORTFALL, expressly "not success". The operator has now ruled the other
      way: "Done + double check oder Done + no questions sind beides done und nicht failed."
      Everything else p0439 decided stands — the pull request opens, the criteria are named
      in the reader's first screen, mechanical failure is still failure, and it is no licence
      to ship less. Only the WEIGHT of the state changes, and p0439 is superseded rather than
      edited because a shipped spec is never rewritten [[feedback_phase_versioning]].
  - key: |
      THE VERDICT WAS WRONG AND THE OPERATOR CAUGHT IT BY HAND. Run d8d1 migrated two
      repositories off MediatR and MassTransit, built both, passed Server 226 and worker 2,009
      tests, and opened its pull requests. The operator then started both hosts: the API comes
      up and serves, the worker comes up, and the one remaining error is a pre-existing queue.
      The gate recorded FAILED and tagged the ticket agent-smith:failed. One refusal was a
      defect fixed in p0484; the other was that a generated inventory document claims 35
      handlers and lists fewer.
  - key: |
      FAILED HAS TO KEEP MEANING "THIS DID NOT DELIVER". An operator who has seen a working
      branch tagged failed stops reading the tag, and then the tag protects nothing. That is
      the whole cost of the current weighting, and it is already paid: the branch above works
      and is marked failed.
  - key: |
      AN INCOMPLETE RECORD IS NOT BROKEN SOFTWARE. A criterion states either a property of the
      SOFTWARE or a property of a RECORD about it. Only the first kind can fail a run. The
      second is real, is judged the same way, and is reported the same way — it just names an
      open question instead of sinking a delivery.
  - key: |
      THE KIND IS FIXED BEFORE THE WORK, NEVER JUDGED AFTER IT. Asking the account how serious
      its own refusal is invites the leniency the gate exists to refuse, and grading it
      afterwards grades the outcome rather than the contract. Which kind a criterion is, is
      knowable when it is written — while nobody yet knows whether it will pass.
  - key: |
      A SECOND LIST, NOT A PARSED PREFIX. The phase spec gains `done_records:` beside `done:`.
      Every criterion already written stays a software criterion, so nothing silently weakens,
      and no rule reads meaning out of a criterion's TEXT — the kind is a field, which is what
      [[feedback_no_heuristic_for_missing_data]] asks for.
  - key: |
      TWO DONES, TOLD APART. "Done" and "done, look at this" are different asks of a human, so
      they are different tags and different pull-request wording. A delivered run with open
      questions that reads exactly like a clean one hides the thing this phase exists to
      surface, and one that reads like a failure is what this phase exists to end.
  - key: |
      NARROWS ONE DOOR, NOT THE WALL. A red build, a red test run, an unaccounted phase, a
      master that never reported, a crash, an exhausted budget, and any unsatisfied SOFTWARE
      criterion all still fail exactly as they do today.

steps:
  - id: a-spec-can-state-a-record-criterion
    action: "Add done_records to the phase-spec schema and the parsed draft, defaulting to empty so every existing spec is unchanged."
  - id: the-contract-carries-the-kind
    action: "Carry each ratified criterion's kind from the draft through the account to the renderers."
  - id: only-a-software-criterion-can-fail-a-run
    action: "Let the acceptance gate and the keystone fail on unsatisfied software criteria only, and treat unsatisfied record criteria as open questions."
  - id: delivered-with-questions-is-a-done
    action: "Give that outcome its own lifecycle label and ticket status, both done-flavoured, and open the pull request as a clean run does."
  - id: the-pull-request-names-what-to-look-at
    action: "Name every open record question in the pull-request body, in the contract's own words."
  - id: the-run-list-shows-which-done-it-is
    action: "Render the two dones distinctly in the dashboard, neither as a failure nor as identical."
  - id: the-deriver-writes-record-criteria-as-such
    action: "Tell the spec deriver that a criterion about a document, report or inventory belongs in done_records."

tests:
  - "PhaseDraft_DoneRecords_IsEmptyWhenTheSpecStatesNone"
  - "PhaseDraft_DoneRecords_IsParsedFromTheSpec"
  - "AcceptanceCriteria_ACriterionFromDone_IsASoftwareCriterion"
  - "AcceptanceCriteria_ACriterionFromDoneRecords_IsARecordCriterion"
  - "MasterAcceptanceGate_AnUnsatisfiedSoftwareCriterion_IsNotSatisfied"
  - "MasterAcceptanceGate_AnUnsatisfiedRecordCriterion_StillDelivers"
  - "MasterAcceptanceGate_ARedBuild_StillFails"
  - "RunOutcome_DeliveredWithAnOpenRecordQuestion_IsADone"
  - "RunOutcome_DeliveredWithAnOpenRecordQuestion_IsNotTheCleanDone"
  - "RunOutcome_DeliveredAndClean_IsUnchanged"
  - "RunOutcome_AnUnsatisfiedSoftwareCriterion_IsStillFailed"
  - "RunOutcome_AnUnaccountedPhase_IsStillFailed"
  - "TicketLabel_DeliveredWithQuestions_RoundTripsThroughTheClosedSet"
  - "PullRequest_DeliveredWithQuestions_NamesEveryOpenQuestion"
  - "SpecDeriver_ADocumentCriterion_LandsInDoneRecords"

done:
  - "a run whose software criteria all pass is DONE whether or not a record criterion is open"
  - "the two dones are told apart on the ticket, in the pull request and in the run list"
  - "an unsatisfied software criterion, a red build and an unaccounted phase all still fail"
  - "a spec stating no done_records behaves exactly as it does today"
  - "the pull request names every open record question in the contract's own words"
  - "build green, full suite green"
