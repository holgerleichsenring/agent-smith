# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0453
goal: "A comment that waits for a person names that person, so their tracker tells them."

applies_to: "backend"

requires:
  - p0448

decisions:
  - key: |
      A WAIT NOBODY SEES IS A STOP. Run 9a30 parked at 13:30 and eec5 at 14:54; both were
      noticed only because the operator opened the dashboard. The tracker already has a
      notification machine — email, its own inbox — and it fires on a mention. We post the
      question into that machine and then do not pull the lever.
  - key: |
      THE SAME LINE p0448 DREW, IN THE OTHER DIRECTION. p0448 decided which of our comments
      are still the operator's turn: an open question and an expectation to ratify, not a
      cancelled run, a failed run or an announced cut. That is exactly the set that should
      mention somebody. What reports gets no ping.
  - key: |
      THE MENTION IS PROVIDER SYNTAX, AND THE SEAM ALREADY EXISTS. Four templates already
      render the open-questions comment per provider. Azure DevOps needs an anchor carrying
      the identity guid, Jira needs [~accountid:...] — the pre-GDPR [~username] form no
      longer resolves — GitHub and GitLab take a plain handle. Every one of those ids is
      already in the payload the ticket fetch reads, so nothing new is looked up.
  - key: |
      SILENCE MUST BE VISIBLE. With no assignee we fall back to the reporter, and with
      neither we mention nobody AND SAY SO IN THE COMMENT. An unnoticed non-ping is the same
      defect one level up, and it is the one nobody would ever find.

steps:
  - id: the-ticket-carries-its-people
    action: "Carry the assignee and reporter identity on the ticket, as each provider states it."
  - id: a-waiting-comment-names-them
    action: "Render the provider's own mention at the head of a comment that waits for an answer, and state it plainly when there is nobody to name."

tests:
  - "AQuestionOnAnAssignedTicket_NamesTheAssignee"
  - "AnUnassignedTicket_FallsBackToTheReporter"
  - "ATicketWithNobody_SaysSoInsteadOfPingingNobodySilently"
  - "ARunNotice_MentionsNobody"

done:
  - "A parked run's question notifies the person it waits for, through the tracker's own channel."
  - "A comment that only reports never pings anyone."
