# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0515b

goal: "The config store refuses to write a name that collides with one it already holds, instead of overwriting the entity that was there."

applies_to: "backend (config document store write path, and the import that bypasses it)"

requires:
  - p0515

scope:
  in: "The write-time refusal: a save or an import whose name matches a stored one under the shared name definition, but is not the same spelling, is refused with both spellings named — and nothing is overwritten."
  out: "A unique index, a normalised column, a migration and a backfill. Those are a successor phase because they cannot ship without repairing the rows they would reject, and because the data loss this phase stops is entirely in code. Case-insensitive RESOLUTION, which is p0515."

decisions:
  - key: |
      THE DATA LOSS IS CODE, NOT SCHEMA, SO THE FIX NEEDS NO MIGRATION. The lookup finds the
      case-twin, the upsert takes its UPDATE branch, and the save passes no expected version for
      an id its version map never held — so the stale check that would have caught it never runs.
      A guard that compares the stored spelling to the incoming one ordinally, and refuses when
      they differ, ends the overwrite completely. No column, no index, no backfill, no deploy risk.
  - key: |
      A UNIQUE INDEX CANNOT SHIP IN THIS PHASE, BECAUSE OF WHERE MIGRATIONS RUN. The server never
      migrates itself: an init container runs the migration, and a non-zero exit means the pod
      never reaches its server container. A refusal raised there is not "the upgrade stops
      loudly" — it is the installation down, with the only tool that can delete one of the two
      spellings locked inside the server that will not start. The index also cannot be ordered
      correctly: migrations apply in one call, so a backfill runs either before the column exists
      or after the index is built. Both fail.
  - key: |
      THE FOUR-PROVIDER FRAMING IS WRONG AND MUST NOT BE REPEATED. The store's migration is
      scaffolded for SQLite; only SQL Server opts into its own assembly, so Postgres and MySQL
      inherit that set — and MySQL cannot apply it at all, because a TEXT column needs a prefix
      length to be part of a key. A working store exists on SQLite and SQL Server, and only SQL
      Server, under a case-insensitive collation chosen at install time, loses data today.
  - key: |
      THE REFUSAL BELONGS WHERE BOTH ENTRY POINTS PASS. The import wipes the current rows before
      writing, so checking the incoming file alone is sufficient — and the one place both the
      server endpoint and the CLI reach it maps the refusal correctly already: the endpoint
      returns 400 through its write guard, the CLI exits non-zero on the same exception type.
      Putting the check at the two call sites instead would leave whichever one is added next
      unguarded.
  - key: |
      IT USES THE PREDECESSOR'S NORMALISER RATHER THAN CHOOSING ITS OWN. Comparing one way here
      and another way in the loader would let the store accept a pair the loader refuses. p0515
      ships the definition; this phase consumes it.
  - key: |
      THE OPERATOR MUST BE ABLE TO GET OUT. p0515 drops both halves of a colliding pair from the
      catalog, so neither is listed in the studio and there is no row to click. The refusal
      message therefore has to name both spellings exactly, because they are the only handle the
      operator has — export, edit, force-import is the recovery, and it works because the import
      clears the rows before it writes.

steps:
  - id: a-save-that-would-overwrite-a-twin-is-refused
    action: "Refuse a write whose stored match is a different spelling of the incoming name, naming both spellings, so the entity that was there is never replaced."
  - id: an-import-is-refused-before-it-writes
    action: "Apply the same refusal to an imported set, at the one place both the server and the CLI reach it, so a file carrying two spellings of one name cannot clear the store and land."
  - id: the-refusal-says-how-to-get-out
    action: "Make the message name both spellings and the catalog, since a colliding pair is invisible in the editor and those names are the operator's only handle on it."

tests:
  - "Save_ANameDifferingOnlyInCaseFromAStoredOne_IsRefused"
  - "Save_ANameDifferingOnlyInCase_LeavesTheStoredEntityUnchanged"
  - "Save_TheSameSpelling_StillUpdatesInPlace"
  - "Import_ASetCarryingTwoSpellingsOfOneName_IsRefusedBeforeAnythingIsCleared"
  - "Import_ThroughTheCli_FailsWithTheSameRefusal"
  - "Import_ThroughTheEndpoint_AnswersFourHundred"
  - "Refusal_NamesBothSpellingsAndTheCatalog"
  - "Refusal_UsesTheSameNameDefinitionAsTheLoader"

done:
  - "a write that would replace a differently-spelled twin is refused, and the stored entity is untouched"
  - "an import carrying a colliding pair is refused before it clears anything, from both the server and the CLI"
  - "the refusal names both spellings, so an operator can fix a pair the editor cannot show"
  - "the store and the loader judge two names the same way"
  - "no migration ships in this phase"
  - "build green, full suite green"
