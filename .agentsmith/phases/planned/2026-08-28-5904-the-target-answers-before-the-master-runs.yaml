# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-5904

goal: "A run asks the target environment whether it answers before the master spends a token, and reports a refusal as infrastructure carrying no captured output."

applies_to: "backend (a probe stage before the master, its failure shape, what the record says) + skills catalog (the probe a profile declares)"

requires:
  - 2026-08-28-b630
  - 2026-08-28-ef5e

scope:
  in: "A probe command a domain profile declares, conditioned the way its other commands are, run through a shell after the prerequisites and before the master, with an operator override for a target no domain covers, a failure naming the target and the exit code and no captured output, and three distinguishable outcomes in the record."
  out: >
    RUNNING A REPOSITORY'S TESTS AGAINST A LIVE TARGET, and deploying anything. Measuring
    bundle validate as a credentialed gate — a distinct measurement that becomes possible
    once this ships. The egress boundary around a sandbox that now holds a token.

decisions:
  - key: |
      THE PROBE IS CATALOG-AUTHORED OR OPERATOR-AUTHORED, NEVER MODEL-AUTHORED. context.yaml is
      written by the model, and p0272 settled that credentials are the operator's authority and
      not the LLM's; a command that runs WITH a live credential in the environment, before the
      master and with no operator review, is the last place to widen model authorship. The
      profile already carries commands with conditions, and the operator's own config already
      carries the credentials — the two places the probe can live.
  - key: |
      THE FAILURE CARRIES NO CAPTURED OUTPUT, BECAUSE THE MASKER CANNOT HELP HERE. A failing
      prerequisite's output already travels into the failure reason, the per-repo result document
      and a comment on the external ticket. The masker only knows values the framework holds, and
      by p0272's design it never holds these — so a value it does not know is one it cannot
      replace. The probe therefore reports the target, the command and the exit code; the output
      tail goes to the operator-facing log alone.
  - key: |
      THE PROBE RUNS THROUGH A SHELL. The verify runner already executes its commands that way,
      while the prerequisite path tokenises without one — which is why the credential idiom needs
      nested quoting today. An auth command with quotes must not break on the executor.
  - key: |
      THREE OUTCOMES NEED THREE SENTENCES, AND ONE OF THEM MUST NOT BE A NO-OP PHRASE. The trail
      entry is a boolean and a message, so the distinction lives in the wording: the answered
      sentence is registered as a gate no-op and hides, while the refused and the not-declared
      sentences are not, so a repository with no probe speaks in the record instead of looking
      like one that passed.
  - key: |
      A BACKEND THAT INJECTS NO CREDENTIAL SKIPS THE PROBE. Otherwise every docker-tier run of a
      repository with a probe goes red, and the reference repository's own criterion is a green
      run.

steps:
  - id: a-profile-may-declare-a-probe
    action: "A profile carries an optional probe command with the same presence condition its other commands have; an operator may declare one per project for a target no domain covers."
  - id: the-probe-runs-before-the-master
    action: "The probe runs through a shell after the prerequisites and before the master, failing the run with the target, the command and the exit code."
  - id: the-record-tells-the-three-apart
    action: "Answered, refused and not-declared are three distinct sentences, and only the answered one is a gate no-op."

tests:
  - "Probe_ARefusingTarget_FailsBeforeTheMasterRuns"
  - "Probe_ARefusingTarget_ReportsNoCapturedOutput"
  - "Probe_NoProbeDeclared_IsRecordedAsNotDeclaredNotAsPassed"
  - "Probe_ABackendThatInjectsNothing_SkipsAndSaysSo"

done:
  - "a wrong or absent credential fails the run before any master token, naming the target"
  - "the failure message, the result document and the ticket comment carry no step output"
  - "a repository with no probe runs, and the record says the probe was not declared"
  - "build green, full suite green"
