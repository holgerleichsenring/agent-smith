# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-89f1d
goal: "The config schema declares exactly what the loader reads and a test keeps it so, a partial models block never borrows another provider's model, and OpenAI-compatible endpoints work."

applies_to: "backend (config model, schema, loader, chat client builders) and dashboard (settings)"

requires: ["2026-09-28-89f1b", "2026-09-28-89f1c"]

scope:
  in: "Schema coverage both directions with a mechanical test, the example config valid and truthful, trace in the stored settings, the models fallback chain, the OpenAI endpoint, Jira endpoints bound, dead compaction keys reported, small message and comment defects."
  out: "Moving tool_runner into the database: it stays read from the file, like auth:, and both say so."

decisions:
  - key: |
      THE SCHEMA IS THE ONLY TYPO GUARD AND NOTHING TESTED IT. The loader ignores unknown keys on
      purpose, the shipped example fails its own schema, and an export emits keys the schema rejects. A
      reflection test from RawAgentSmithConfig keeps both directions in step; afterwards every def
      closes its properties.
  - key: |
      A PARTIAL models: BLOCK GAVE AN OPENAI AGENT claude-haiku. Roles default to Claude ids and YAML only
      overwrites what is present. Roles carry no built-in model: primary falls back to agent.model, the
      others to primary, code_map_generation to scout then primary. A Claude install that relied on the
      implicit haiku scout pays its primary price for scout; one startup finding names every role that
      inherited, so the change is visible rather than silent. Inheriting roles also inherit primary's
      max_tokens. Stored configs already carry the Claude ids materialised on import and save, and a stored
      default cannot be told from a choice, so a startup finding names every non-Claude agent whose stored
      roles hold Claude ids; nothing is rewritten behind the operator.
  - key: |
      THE OPENAI ENDPOINT WAS DROPPED UNANNOUNCED IN p0119a. type: openai with endpoint sends there; with
      an endpoint set the key never falls back to OPENAI_API_KEY, so an OpenAI key is never sent to a
      third-party host. agent.endpoint already means the Ollama, Azure and external-worker URL, so the
      effective endpoint is the role's own, else the agent's when the role runs on the agent's provider.
      The default rate budget stays; the docs name rate_limit and context_window_tokens.
  - key: |
      trace JOINS THE STORED SETTINGS; AGENTSMITH_TRACE still wins. A server could not turn tracing on
      from the store at all. Import reports every key it drops instead of dropping it silently.
  - key: |
      JIRA endpoints: WAS DOCUMENTED AND NEVER BOUND (04ebc70a tested the connection, not the YAML). It is
      bound, not retired.

steps:
  - id: schema
    action: "Owns schema and example for the whole series: add every key in the analysis note, apply the removals b, c and h list, remove agent.parallelism, bind tracker endpoints, ConfigSchemaFile and coverage tests, additionalProperties:false on every def."
  - id: example
    action: "Every stale statement in agentsmith.example.yml fixed; the active skills v4.7.0 block commented out; the example validates."
  - id: models
    action: "Nullable role assignments with the fallback chain; ConfiguredAgentCheck and the probe agree with the registry; inherited-role finding."
  - id: openai
    action: "Endpoint honoured with the key rules; ModelAssignment.Endpoint kept and resolved first."
  - id: trace
    action: "Trace descriptor in the taxonomy and the settings form; import reports dropped keys."
  - id: small
    action: "Skill role message, dead docs paths in source (with a test), AllHostsActivePolicy comment, compaction summary_model/deployment_name warned and out of the studio."
  - id: docs
    action: "ai-providers (OpenAI-compatible section, roles), agentsmith-yml, settings, tracker-jira."

tests:
  - "the tests listed in .agentsmith/notes/2026-09-28-89f1-defect-analysis.md, slice d"

done:
  - "ExampleConfig_ValidatesAgainstSchema and the coverage tests pass"
  - "no role of a non-Claude agent resolves to a Claude id unless configured, and a stored one is reported"
  - "an openai agent with an endpoint calls that host"
  - "build and all tests green"
