# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-13-fcc1

goal: "A language delta declares the artefact that enforces it, so what a stack's rules require is shipped as a file the catalog validates rather than as prose nobody runs."

applies_to: "skills catalog (the delta format, the validator, the three deltas)"

scope:
  in: >
    The delta format gains an ARTEFACTS section — one entry per artefact, a
    repository-root-relative path plus its content in a fenced block, with an empty section
    stated explicitly the way Overrides already is; the catalog validator enforces the
    heading over every delta beside the two it already checks; the delta of the ecosystem
    this estate runs ships declarative artefacts that name no type of any target, and the
    other two ship the section stated empty.
  out: >
    WRITING THE ARTEFACT INTO A REPOSITORY. The transfer that would write it is a backend
    change behind a pin, and nothing in the backend can even read this section until a
    release is cut. Named successor: 2026-09-15-d66f (artefact-transfer-per-path).
    NAMING AN UNENFORCED ARTEFACT WHERE A HUMAN READS. Named successor: 2026-09-15-c6e9
    (init-body-from-the-round), which composes the init pull request body from the round.
    DECIDING WHETHER A VERIFY STAGE REACHES AN ARTEFACT. Named successor: 2026-09-15-a238
    (verify-stage-declares-coverage). See the decision below.
    THE CORRESPONDENCE TEST. It must name a test assembly, a namespace, a framework and a
    pairing convention — four properties of a repository, not of a language — so it can be
    byte-identical across two repos of one stack or it can reference their types, never
    both. Still deferred, and still without a named successor, because the shape that pays
    needs that answer first.

decisions:
  - key: |
      A RULE THAT NOTHING RUNS IS A DESCRIPTION, AND DESCRIPTIONS ARE IGNORED. Measured in one
      real estate: an entity and its response model drift apart with no compile error and five
      fields have already fallen out of the pair; a column enumeration and the switch that orders
      by it drift apart and two members order nothing; a column name and the helper that maps it
      drift apart and one typo sorts the wrong column. Eight silent defects in pairs a test can
      compare.
  - key: |
      DECLARATIVE FIRST, BECAUSE DECLARATIVE IS GENUINELY BYTE-IDENTICAL. An analyzer ruleset, an
      editorconfig, a build property file name no type of the target and are true of the language,
      so composing them for two repositories of one stack yields the same bytes — which is the
      delta rule the format already states. Anything that must reflect over the target's types
      breaks that rule, and this phase does not pretend otherwise.
  - key: |
      THE FRAMEWORK DECLARES IT, FOR THE REASON THE PRINCIPLES PATH WAS TAKEN AWAY FROM THE MODEL.
      An enforcement artefact authored per repository by a model is a rule that differs between two
      repositories of one stack, which is the opposite of a delta.
  - key: |
      THE PHASE WAS CUT AT THE PIN, BECAUSE THE PIN IS WHERE THE TWO REPOSITORIES MEET. The
      original phase spanned the catalog and the backend in five steps. Nothing in the backend can
      assert on an artefacts section until a release carries one, so a single phase would have had
      to land half its steps behind a guard and the other half unprovable in its own gate. The
      catalog half ships alone and is provable alone: its validator is its gate.
  - key: |
      THE ECOSYSTEM DELTA HAS NO ENFORCEMENT CONTENT TO HANG AN ARTEFACT OFF, SO IT IS AUTHORED
      HERE. The delta names no editorconfig, no build property file, no analyzer and no formatter,
      even though the universal core makes "formatting and lint enforcement" a required delta hook
      and nothing validates that hook per delta. This repository ships neither artefact either, so
      there is no in-house reference to copy — the content is written from the language's own
      documented mechanisms.
  - key: |
      THE SECTION IS STATED EMPTY, NEVER OMITTED, WHICH IS THE SHAPE OVERRIDES ALREADY USES. An
      omitted section reads the same as an unfinished one. The format states the sentence a delta
      with no artefacts must carry, and the validator checks the heading, so "this stack declares
      none" is an answer a reader can tell from an author who stopped writing.

steps:
  - id: the-delta-format-names-its-artefacts
    action: "DELTA-FORMAT.md gains the Artefacts section — repository-root-relative path plus fenced content, empty stated explicitly — in its required structure."
  - id: the-validator-enforces-it-over-every-delta
    action: "validate-skills.sh requires the Artefacts heading over every delta, beside the Additions and Overrides checks it already makes."
  - id: one-delta-carries-declarative-artefacts
    action: "The delta of the ecosystem this estate runs ships artefacts that name no type of any target; the other two state the section empty."

tests:
  - "validate-skills.sh refuses a delta whose Artefacts section is missing"
  - "validate-skills.sh accepts a delta whose Artefacts section is present and stated empty"
  - "scripts/package.sh runs the validator and packages principles/ whole"

done:
  - "the delta format states what an artefacts entry is and what an empty section must say"
  - "a delta without the section fails the catalog's own validator"
  - "the ecosystem delta declares at least one artefact whose content names no target type"
  - "the other two deltas state the section empty"
  - "validate-skills.sh green, package.sh green"
