# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-25-d0b8
requires: ["2026-09-25-8e51b"]
goal: "Reading the epic a ticket is stamped into is one service the run pipeline and a design conversation both call, instead of a step only a pipeline can reach."

applies_to: "backend (the epic ground read and its pipeline step, and the dialog view)"

scope:
  in: "Extracting the parent read — the stamp, the fetch, the degradation note — from the pipeline step that owns it, so the server can call it too; and showing the parent in a bound conversation."
  out: "Tracker-side relations other than the stamped parent: linked items, child issues and commits are four adapters' worth of relation models and are their own phase."

decisions:
  - key: |
      THE FETCHER IS A PIPELINE STEP, NOT A SERVICE, AND THAT IS WHY IT CANNOT BE CALLED. It writes
      its result into a pipeline context and returns a note shaped for a run's step output; its only
      caller is the fetch handler. Calling it from the server would mean fabricating a pipeline
      context and reading a key back out — a shim this repository forbids. So the READ is extracted
      and both callers use it, which is the same move 8e51a makes for the routing predicate.
  - key: |
      THE PARENT IS ADDRESSED OFF THE TICKET'S LABELS, WHICH A CONVERSATION MUST THEREFORE KEEP.
      The stamp is a label, and the stored ticket text 8e51c keeps is title, body and comments. So
      the labels are stored with it, or this read has nothing to address.
  - key: |
      A MISSING PARENT DEGRADES, IN BOTH CALLERS, FOR THE REASON THE RUN ALREADY GIVES. It may be
      deleted, moved or invisible to this token, and the child's own ticket is still a complete
      requirement. One rule, one place, so a conversation cannot invent a second answer to the same
      question.

steps:
  - id: the-parent-read-becomes-a-service
    path: "src/backend/AgentSmith.Application/Services/SpecDialog"
    action:
      - "Extract the stamp lookup, the fetch and the degradation note into a service, and have the pipeline step call it and publish what it returns."
    modify:
      - "src/backend/AgentSmith.Application/Services/Handlers/EpicGroundFetcher.cs"

  - id: the-conversation-reads-it-too
    path: "src/backend/AgentSmith.Server/Services/SpecDialog"
    action:
      - "Read the parent for a bound conversation whose ticket carries the stamp, and show it beside what the conversation is grounded on."

  - id: the-read-is-pinned
    path: "tests"
    action: "Assert both callers get the same answer and the same degradation, and that a ticket with no stamp reads nothing."

tests:
  - "EpicParent_ATicketWithAStamp_IsReadTheSameWayByARunAndAConversation"
  - "EpicParent_AParentThatCannotBeOpened_DegradesToANoteInBoth"
  - "EpicParent_ATicketWithNoStamp_ReadsNothing"
  - "EpicParent_ThePipelineStep_PublishesExactlyWhatItPublishedBefore"

done:
  - "the parent read is one service with two callers"
  - "the pipeline step publishes exactly what it published before"
  - "a bound conversation shows the epic its ticket is stamped into, and a missing one is a note"
  - "build green, full suite green"
