# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0401
goal: "Retire the durable-dialogue spine: the ticket park is the mechanism that shipped for a run that needs a human, and keeping a second one that nothing can reach costs an operator-visible setting for a behaviour that cannot occur"

applies_to: "server + dashboard"

requires: [p0391, p0393, p0393a, p0393b]

decisions:
  - key: |
      Measured on main, 2026-08-12, not inferred. The three callers of IDialogueAskGate are
      AskCommandHandler, ApprovalHandler and NegotiateExpectationHandler; NONE of their
      commands appears in any preset. p0393 deleted Approval, p0393a removed
      NegotiateExpectation, and Ask was never in a preset at all. The asking half of the loop
      has no carrier and has not had one since p0393a merged.
  - key: |
      The answering half is live: RunControlEndpoints exposes an answer endpoint, and the
      Studio offers a setting — "in-memory wait before an eligible run checkpoints and parks".
      So an operator can read, tune and save a knob for a behaviour that cannot occur. That is
      the same defect shape as the update_progress tool description promising the model "a
      step already marked done STAYS done" while p0374 had removed the call site: a documented
      promise the code does not keep. It was found twice in one week; a knob is the version an
      operator meets.
  - key: |
      Deleting rather than reconnecting, because the ticket park is not a worse version of
      this — it is the version that shipped, and for a ticket-triggered run it is better. The
      state lives on the ticket, so it survives a restart by construction rather than by a
      checkpoint store; the operator answers where they already work; and no run holds a
      sandbox for the days a human question takes. p0391 traded away the one thing durable
      dialogue had — the SAME run resuming instead of a new one being triggered — and that
      trade is what made parking survivable.
  - key: |
      Reconnecting is the real alternative and it is rejected on grounds, not on effort: give
      Ask a carrier and two mechanisms answer the same situation, one parking the ticket and
      one holding a run. Then every future question about a halted run starts with "which
      kind". A capability that has been unreachable through four phases without anyone
      noticing is not a capability anyone is waiting for.
  - key: |
      The checkpoint TABLE stays. Two migrations created it; a drop migration destroys rows
      an operator may still want to read, and an empty table costs nothing. What must not
      stay is the schema pretending to document a live feature — the entity keeps a comment
      naming the phase that retired it, so the next reader does not reconstruct the feature
      from the table.
  - key: |
      Removing the Studio setting is a partial-write hazard, which is exactly p0392a's
      subject: a section write that no longer carries a field must not send its default for
      the others. Sequence this after p0392a, or prove the settings write is
      absent-means-unchanged before touching the form.
  - key: |
      spec-dialog is NOT affected and must not be touched. p0393b established that it cannot
      use this spine at all — DialogueAskGate requires a TicketId, the checkpoint writer
      refuses without one, and a spec-dialog turn runs in-process on a live thread with a
      reply slot the serializer excludes. Its interactivity is its own mechanism and stays.

steps:
  - id: confirm-unreachable
    action: "Re-confirm at head that no preset reaches Ask, Approval or NegotiateExpectation, and that no other caller of IDialogueAskGate has appeared"
    modify:
      - "This phase's decision file: the measurement at the commit the work starts from"
  - id: remove-the-spine
    action: "Delete the ask gate, checkpoint writer, resumer, resume sweeper and the resume launcher, with their DI registrations and hosted-service wiring"
    delete:
      - "The Resume services and their contracts, the DialogueResumeSweeper, and the three handlers whose only purpose was to reach them"
  - id: remove-the-surface
    action: "The answer endpoint and the Studio setting go with it; the setting's removal is a settings-write change, not a form edit"
    delete:
      - "The checkpoint answer endpoint"
    modify:
      - "The settings contract and the Studio form: the checkpoint-wait knob"
  - id: keep-the-table-honest
    action: "The checkpoint table is left in place and its entity says which phase retired the feature that wrote it"
    modify:
      - "The checkpoint entity: a comment naming this phase"
  - id: name-what-is-lost
    action: "The retirement is stated where a reader looks for it — a halted run resumes by ticket re-trigger, not by resuming the same run"
    modify:
      - "The run-lifecycle documentation"

tests:
  - "Composition_NoServiceResolvesTheRetiredDialogueSpine"
  - "Presets_None_ReferenceAskApprovalOrNegotiateExpectation"
  - "SettingsWrite_WithoutTheRemovedField_LeavesEveryOtherSettingUnchanged"
  - "RunControl_TheAnswerEndpoint_IsGone"
  - "SpecDialog_InteractiveTurn_IsUnaffected"

done:
  - "Nothing in the composition resolves the durable-dialogue spine, and no preset can reach its handlers"
  - "No operator-visible setting or endpoint describes a behaviour that cannot occur"
  - "Saving settings after the field's removal leaves every other value untouched — asserted, because that is how the field could take others with it"
  - "spec-dialog's interactive turn is unchanged, with a test that says so"
  - "The checkpoint table survives with its rows, and its entity names the phase that retired the writer"
  - "The lifecycle documentation says a halted run comes back by ticket re-trigger"
  - "Full suite green"
