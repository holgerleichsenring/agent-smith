# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-d518

goal: "A filed work ticket says, per label the framework put on it, what that label decides and what happens if it is removed, in words that are true of that label."

applies_to: "backend (the ticket body composer, the three filers, the pull-request body)"

requires:
  - 2026-09-17-0e79d

scope:
  in: >
    A filed work ticket carries a closing section naming each label the FILER actually applied, with
    one sentence per label that is true of that label — not one generalisation covering both. It opens
    with a level-two heading, because the section above it is scanned forward to the next heading and
    a bullet list without one is read back as acceptance criteria. And because a ticket's description
    is pasted verbatim into the pull request the run opens, and into the prompts the coding master and
    the scope classifier read, the pull-request body stops carrying it: the section is bookkeeping for
    the ticket, not the first paragraph of every pull request this framework opens.
  out: >
    THE SLICE RECORD'S LABEL. Naming it would publish the one edit that turns a record nothing routes
    into a full run derived from a description anyone can edit — the hole this phase's own reasoning
    refuses to make configurable. A record says instead that nothing runs it and which ticket carries
    the work.
    MAKING THE LABEL NAMES CONFIGURABLE. The approved-set stamp fails OPEN, so a spelling nobody
    recognises turns "refuse loudly" into "derive from an editable description".
    LABELS ON TICKETS ALREADY FILED. The section is written when a ticket is created.
    THE TRACKER'S OWN LABELS.

decisions:
  - key: |
      ONE SENTENCE PER LABEL, BECAUSE THE GENERALISATION IS FALSE BOTH WAYS. "Editing a label changes
      routing rather than stopping it" is wrong for both labels it was written for. Removing the phase
      label on a project whose pipeline is resolved from labels makes the ticket unfetchable by
      discovery and then dropped by the resolver — it STOPS, it does not reroute. Removing the
      approved-set stamp reroutes nothing at all: the resolver never reads it; it decides whether the
      description is consulted for the specification.
  - key: |
      AND THE STAMP'S CONSEQUENCE IS NARROWER THAN IT LOOKS. With the approved record still in the
      store — the ordinary case — deleting the stamp changes nothing, because the approved source is
      consulted before the gate and a branch artifact before that. The stamp matters when the record
      is ALSO unreachable: it is the guard that makes a lost hand-off loud instead of silently derived.
      The true sentence is "deleting this does not cancel anything"; the reason given in the first
      draft was not.
  - key: |
      THE DERIVER IS NOT THE HAZARD; FOUR OTHER READERS ARE. On a stamped ticket the description is
      never read as a specification — three sources return before it. But the description is
      interpolated verbatim into the coding master's prompt, the repository-scope classifier's prompt,
      the expectation composer's prompt, and the pull-request body. None of them parses headings. So
      "last and marked as bookkeeping" protects against the one reader that cannot see it and none of
      the four that can.
  - key: |
      THE PULL REQUEST IS WHERE IT ACTUALLY SHOWS, SO THAT IS WHERE IT IS REMOVED. The pull-request
      body is the ticket's description with a banner in front. Every pull request this framework opens
      would otherwise lead with a paragraph about which labels not to delete. The body composer marks
      the section so the pull-request body can drop it, which is a smaller change than teaching four
      prompt builders to skip it — and the prompts keep it deliberately, because a model reading the
      requirement is better off knowing the ticket was filed from an approved set.
  - key: |
      A LEVEL-TWO HEADING, AND THE REASON IS A TEST THAT EXISTS. The acceptance-criteria section is
      read back by scanning forward from its heading to the next one of any level. On a record the
      criteria section is frequently last, so an italic footer with bullets would have its bullets read
      back as acceptance criteria and turn an existing test red.
  - key: |
      THE SET COMES FROM THE FILER, AND THE MEANINGS COME FROM ONE TABLE. Three filers decide which
      labels are applied. The composer is told which were applied and looks each up in one table of
      meanings; a label with no entry is named without a claim rather than described wrongly, because
      the stamps a hand-stamped ticket can carry are still writable and must not produce a sentence
      nobody wrote.
  - key: |
      ROOM. The outcome filer has one line under the limit and the renderer five, so the section is
      composed by a type of its own that the composer calls with the applied set, and the filers pass
      what they already declare rather than gaining logic.

steps:
  - id: the-section
    action: "A composer for the framework's label note, taking the set actually applied, looking each up in one table of meanings, and naming without a claim a label it does not know."
  - id: the-filers-pass-what-they-applied
    action: "Each filer hands the label set it applies to the body composer; no list is restated."
  - id: the-record-says-what-it-is
    action: "A slice record says that nothing runs it and which ticket carries the work, without naming the label that makes it so."
  - id: the-pull-request-drops-it
    action: "The pull-request body omits the section; the prompts that read the description keep it."

tests:
  - "Body_PhaseLabel_SaysRemovingItStopsTheTicketBeingPickedUp"
  - "Body_ApprovedSetStamp_SaysRemovingItCancelsNothing"
  - "Body_NoSingleSentence_CoversBothLabels"
  - "Body_ALabelWithNoKnownMeaning_IsNamedWithoutAClaim"
  - "Body_TheSection_OpensWithALevelTwoHeading"
  - "Body_AcceptanceCriteria_AreStillReadBackUnchanged"
  - "Body_SliceRecord_SaysNothingRunsItAndNamesTheWorkTicket"
  - "Body_SliceRecord_DoesNotNameTheLabelThatKeepsItUnrouted"
  - "PullRequest_Body_DoesNotCarryTheLabelSection"
  - "Prompts_TheDescriptionTheyRead_StillCarriesIt"

done:
  - "an operator reading a filed ticket learns what each framework label decides, in words true of that label"
  - "no pull request this framework opens leads with a paragraph about labels"
  - "the acceptance criteria of a record are read back exactly as before"
  - "a record says why nothing runs it without publishing how to change that"
  - "build green, full suite green, file-length ratchet green"
