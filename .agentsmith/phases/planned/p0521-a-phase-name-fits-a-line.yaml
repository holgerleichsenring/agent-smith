# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0521
goal: "A phase is named in a few words and stated in one sentence, enforced where phases are written."

applies_to: "repo tooling (schema, architecture tests) + methodology skill"

requires:
  - p0430

scope:
  in: "A bound on the goal and on the file slug, enforced by a ratchet over the repo's own phases; the same bound stated in CLAUDE.md and in create-phase."
  out: "The 400-character context-record cap, which already holds (p0512)."

decisions:
  - key: |
      MEASURED DRIFT, NOT AN IMPRESSION. Mean slug length by era: 31 characters at p00xx, 36 at
      p03xx, 46 at p04xx, 54 at p05xx. The names became sentences. Goals: median 251, p90 823,
      longest 3631.
  - key: |
      THE SCHEMA IS ENFORCED ON DRAFTS, NEVER ON THE REPO. SpecDraftValidator and PhaseSpecExtraction
      validate LLM-authored specs at runtime; nothing validates .agentsmith/phases/**. Two committed
      phases exceed the schema's own 2000-character goal cap and no test noticed.
  - key: |
      THE FILE NAME IS IN NO SCHEMA AT ALL. `phase:` has a pattern; the slug that becomes the file
      name has nothing. It is the first thing a reader sees and the only unbounded one.
  - key: |
      RATCHET, NOT A SWEEP. 175 of 727 slugs exceed 32 characters and 425 of 726 goals exceed 200.
      Rewriting them would edit specs that are finished [[feedback_phase_versioning]]. The existing
      list may only shrink; a new phase meets the bound.
  - key: |
      THE BOUND BELONGS WHERE PHASES ARE WRITTEN. The rule already exists as
      [[feedback_phase_specs_terse]] and was followed less every quarter. Three places state it and
      one enforces it: schema, CLAUDE.md, create-phase, ratchet.

steps:
  - id: the-schema-bounds-the-goal
    action: "goal maxLength 2000 -> 200 in phase-spec.schema.json."
  - id: the-ratchet-holds-the-line
    action: "An architecture test validates .agentsmith/phases/** against the schema and caps slug at 32 characters, with a baseline of today's overruns that may only shrink."
  - id: the-rule-is-where-it-is-read
    action: "CLAUDE.md states both bounds in one line."
  - id: the-skill-says-it-too
    action: "create-phase names the bounds in the format block, so a spec written elsewhere meets them."

tests:
  - "PhaseSpec_EveryFile_ValidatesAgainstTheSchema"
  - "PhaseSpec_ANewSlug_FitsTheCap"
  - "PhaseSpec_ANewGoal_FitsTheCap"
  - "PhaseSpec_ABaselineEntry_MayOnlyShrink"

done:
  - "a new phase cannot be committed with a sentence for a name or a paragraph for a goal"
  - "the repo's own phases are validated against the schema they carry"
  - "the bound is stated where a phase is written, not only where it is reviewed"
