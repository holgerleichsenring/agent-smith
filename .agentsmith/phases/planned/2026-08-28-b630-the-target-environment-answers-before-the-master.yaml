# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-b630

goal: "A run proves the declared target environment answered before the master spends a token, so a missing or expired credential reads as infrastructure rather than as a model that could not finish."

applies_to: "backend (a preflight check over declared secrets, a probe step before the master)"

requires:
  - p0272
  - 2026-08-28-ef5e

scope:
  in: "A preflight check that every secret and key a project references exists, a probe command a repository declares and that runs after the prerequisites and before the master, and a failure shape that names the target, the missing input and the command that asked."
  out: >
    DEPLOYING ANYTHING TO A TARGET, and running a repository's tests against a live
    warehouse — that is the ring above this one and it needs a target nobody has named
    yet. Storing or rotating credentials, which stay in operator-created secrets. The
    egress boundary around a sandbox that now holds a token — p0304, which this phase
    makes more urgent and does not address.

decisions:
  - key: |
      TWO DIFFERENT QUESTIONS NEED TWO MECHANISMS AND ONLY ONE OF THEM CAN BE ANSWERED WITHOUT A
      SANDBOX. Whether the referenced secret and key EXIST is answerable from the cluster before
      a run — it is the typo case, and it is most of them. Whether the target ACCEPTS the
      credential is only answerable by asking the target from inside the sandbox. Collapsing them
      into one check either burns a sandbox to find a typo or reports a wrong password as a
      missing secret.
  - key: |
      THE PROBE IS DECLARED, NOT DERIVED. A command that proves a target answers is
      target-specific — a warehouse, a CRM and a package feed have nothing in common but the
      exit code — and deriving it would be the per-ecosystem guessing this codebase has removed
      twice. The repository declares it beside its prerequisites; what is generic is WHEN it runs
      and how its failure is reported.
  - key: |
      A SKIPPED PROBE IS REPORTED, NEVER SILENTLY GREEN. A repository with no probe and a
      repository whose probe passed must not look the same in the run record, or the mechanism
      degrades into decoration the first time someone forgets to declare one.
  - key: |
      THE FAILURE IS SHAPED AS INFRASTRUCTURE BECAUSE THAT IS WHAT IT IS. Today an unauthenticated
      target surfaces as a prerequisite exit code inside a wall of install output, and the run
      reads as the master failing. The probe's failure names the target, the command and the
      inputs it had, and it stops the run before a single master token is spent.
  - key: |
      THIS IS WHAT MAKES bundle validate MEASURABLE, AND THAT MEASUREMENT IS NOT THIS PHASE. The
      one command p0505 recorded as broken-on-clean is broken precisely because it resolves auth
      first. Once a run can hold a credential, the command becomes a candidate gate again — and a
      candidate is measured before it is declared, in the phase that measures it.

steps:
  - id: the-declared-secret-is-there
    action: "A preflight check resolving every secret and key a project's sandbox block references, failing with the names it could not find and passing with the names it did."
  - id: the-target-is-asked
    action: "A probe command declared beside the repository's prerequisites, run after them and before the master, its non-zero exit failing the run with the target, the command and the output."
  - id: the-record-distinguishes-the-three
    action: "The run records probed-and-answered, probed-and-refused, and no-probe-declared as three different outcomes."

tests:
  - "Preflight_AMissingSecretKey_IsNamedBeforeAnyRun"
  - "Preflight_EveryReferencedSecretPresent_Passes"
  - "Probe_ARefusingTarget_FailsBeforeTheMasterRuns"
  - "Probe_NoProbeDeclared_IsRecordedAsSkippedNotPassed"

done:
  - "a run with a wrong or absent credential fails naming the target, before any master token"
  - "a project referencing a secret that does not exist is refused by preflight, with the key named"
  - "a repository declaring no probe still runs, and the record says the probe was skipped"
  - "no secret value appears in a step, a log line, a record or a model-visible surface"
  - "build green, full suite green"
