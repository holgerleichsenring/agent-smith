# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-06-03c7e
goal: "An executed spec leaves specs/planned/ for specs/done/ with an outcome block — one file, one stem — and its directory, not a list, says it ran."

applies_to: "server (phase execution, record, index line, progress)"

requires:
  - 2026-10-06-03c7d

facts:
  - claim: "The record is a second file under a goal slug capped at 60, written into every repo of the run"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/WritePhaseRecordHandler.cs:50-53,74-88,102-106"
  - claim: "The single-sandbox path returns before the executed mark, and the marker finds no carrier without ContextKeys.Repos"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/WritePhaseRecordHandler.cs:62-70,89; src/backend/AgentSmith.Application/Services/PhaseExecution/ExecutedPhaseMarker.cs:70-73"
  - claim: "The published record body is the draft YAML with the account and review as comment lines"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/PhaseRecordBody.cs:28-32"
  - claim: "The marker rewrites the whole set and moves the DB pointer; the renderer rewrites every phase on every write"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/ExecutedPhaseMarker.cs:43,55,63; src/backend/AgentSmith.Application/Services/Specs/SpecSetFiles.cs:31-36"
  - claim: "The index writer adds a state.done line in every repo that got the record"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/PhaseIndexWriter.cs:39,48-55"
  - claim: "Progress seeds every spec NotStarted, the executed head included"
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSequenceProgress.cs:15-16"
  - claim: "The record step's command name is persisted and keyed across labels, beats and presets"
    evidence: "src/backend/AgentSmith.Contracts/Commands/CommandNames.PhaseBlock.cs:14"

assumptions:
  - claim: "Writing the done file then git rm of the planned one is detected by git as a rename"
    check: "check git diff -M on a sandbox commit"

scope:
  in: "The record step writes specs/done/{stem}.yaml (spec plus outcome:) and its companions, git-rms the planned files, commits with the manifest in one series commit and re-records the ref at that sha — one path for single and multi sandbox; the writer renders planned specs only; reader and stale removal resolve a spec across planned and done; executed = in done/, the manifest's executed list removed; the index line only in the carrying repo; progress seeds done specs Done; the published body is the done file."
  out: "Run tables and UI words (03c7g). The product never writes active/."

decisions:
  - one_file: "specs/done/{stem}.yaml is the spec plus outcome: {run, delivered, review}. WritePhaseRecordHandler.Slug goes; 2026-09-07-e9a2's second slug is closed by this."
  - no_git_mv: "git mv fails on a missing target directory and an untracked source; write then git rm."
  - carrier: "The carrying repo is the manifest's, resolved from ContextKeys.SpecRepo against the project's repos when Repos is absent. Other repos get neither file nor index line; their PR links the carrying one."
  - writer_scope: "Only the record step writes done/; a re-cut renders planned specs and never touches done/."
  - command_name: "WritePhaseRecordCommand keeps its name — it is persisted in run history; only the handler's body changes."
  - filing_knows_head: "TicketSeries gains ExecutedThrough, set by the record step; FiledSpecBranch renders only positions after it, so an amendment never writes an executed spec back into planned/."
  - active_unused: "The product writes no spec to active/; readers count active/ as not executed."

steps:
  - id: record
    action: "Rewrite WritePhaseRecordHandler: write done file and companions, git rm planned, commit with manifest, re-record ref; one path"
  - id: writer-reader
    action: "Writer renders planned only; reader and stale removal resolve by state; manifest drops executed"
  - id: index-progress-body
    action: "Index line in the carrier only; progress seeds done specs Done; PhaseRecordBody renders outcome:"

tests:
  - "RecordOutcome_ExecutedSpec_MovesToDoneWithOutcome"
  - "RecordOutcome_SingleSandbox_MarksExecuted"
  - "RecordOutcome_NextRun_DoesNotReadReviewerEdit"
  - "Recut_AfterExecutedSpec_LeavesDoneUntouched"
  - "Amendment_AfterExecutedSpec_WritesNoPlannedFileForIt"
  - "SeriesReader_PartlyExecuted_ReadsDoneAndPlanned"
  - "SequenceProgress_ExecutedHead_SeededDone"

done:
  - "After a two-spec run in which b fails verification the carrier has specs/done/{base}a-*.yaml with outcome:, specs/planned/{base}b-*.yaml, and one index line"
  - "Re-triggered after that, the run continues with b and does not re-run a"
  - "Full suite and harness green"
