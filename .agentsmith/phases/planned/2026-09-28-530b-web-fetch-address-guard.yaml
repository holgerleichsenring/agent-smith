# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-530b
goal: "web_fetch connects only to public addresses unless an operator allows a range, checks every connection including redirects, and hands the model fetched content marked as untrusted."

applies_to: "backend (the in-process web_fetch tool and its HTTP client registration)"

requires: []

scope:
  in: >
    The HTTP client web_fetch uses validates the address each TCP connection is actually opened to,
    after turning an IPv4-mapped IPv6 address back into IPv4. Refused, unless an operator CIDR
    allowance names them:
    - IPv4: 0.0.0.0/8, 10/8, 100.64/10, 127/8, 169.254/16 (including the metadata endpoint), 172.16/12,
      192.168/16, 168.63.129.16, multicast;
    - IPv6: ::1, fc00::/7, fe80::/10, fec0::/10, 64:ff9b::/96 (NAT64), and 2002::/16 wrapping a
      refused IPv4 address.
    The handler does not use a proxy (UseProxy false), so the address checked is the one dialled. Because the check
    runs where the connection opens, DNS rebinding and redirect hops are covered by the same rule. A
    refusal tells the model which host was refused and why. Only the page slice is wrapped in
    untrusted-data markers of its own; Paginate's header and resume hint stay outside, and a marker
    string inside the page is neutralised. The allowance is WebFetchConfig.AllowedCidrs, bound like
    the other server settings and read per request, so a live reload applies.
  out: >
    - http_request: it is curl run as a sandbox step (FilesystemToolHost.cs:427-446;
      HttpRequestStep.cs:22), so a container sandbox's reach is the network policy's
      (2026-09-28-23a2d). On the in-process backend it runs on the server host, but so does
      run_command, which can call curl directly, so guarding one tool there would protect nothing.
      That backend is documented as having no isolation (InProcessSandbox.cs:10-13).
    - An estate that can only reach the internet through a proxy: web_fetch goes direct. Proxy
      support with the same guarantee needs the proxy to enforce it, and is left to the operator.
    - The ticket attachment loaders, which fetch URLs from ticket text in the server process: the
      attachment-loader host guard (separate hotfix).

decisions:
  - key: |
      web_fetch RUNS IN THE SERVER PROCESS WITH ONLY A SCHEME CHECK. It is in-process by design
      (WebToolHost.cs:16-18) and accepts any absolute http or https URL (:55-57) before GetAsync
      (:68). The HttpClient comes from AddHttpClient<WebToolHost>() (LoopRuntimeExtensions.cs:28),
      whose default handler follows redirects and honours HTTP(S)_PROXY. So a prompt-injected URL
      can reach the server's own network position: cluster HTTP services and the node's metadata
      endpoint.
  - key: |
      CHECK THE CONNECTION, NOT THE URL. Checking the host name before the request misses a DNS
      answer that changes between check and connect, and misses every redirect hop. A connect callback
      on the primary handler sees the address actually dialled for every connection, redirects
      included, so one rule covers all three.
  - key: |
      AN ALLOWANCE, NOT A SILENT HOLE. An on-premises estate may keep its documentation or advisories
      on an internal host. The operator names CIDRs in configuration, and the refusal message names
      the setting.
  - key: |
      UNTRUSTED MARKERS OF ITS OWN. TicketPromptDelimiters wraps ticket data with markers and a rule
      that say TICKET (TicketPromptDelimiters.cs:17-23), and the skill-side contract references those
      strings, so they are not renamed. Web content gets a parallel pair in the same shape.
  - key: |
      FILE-LENGTH. WebToolHost is 125 of its 125 baseline (file-length-baseline.tsv:141). The address
      rule and the wrapper live in types of their own, and the host only calls them.
  - key: |
      SERIES: turned up during the 2026-09-28 sandbox security work (OpenHands comparison follow-ups);
      own number. Suggested order: after 2026-09-28-ef94 and 2026-09-28-c657.

  - key: |
      NO SKILLS CHANGE. The ticket markers are a cross-repository contract the skills reference
      (TicketPromptDelimiters.cs:10-13, 31). The web markers are new, and nothing in the skills reads
      them; the rule text travels with the content itself.
  - key: |
      WebToolHost IS AT ITS 125-LINE BASELINE (file-length-baseline.tsv:141), so the wrap call replaces
      the existing return at line 76 in place.
steps:
  - id: the-address-rule
    path: "src/backend/AgentSmith.Application/Services/Tools"
    action: "An address classifier over IPv4 and IPv6 with the refused ranges and the operator allowance."
    new:
      - "PublicAddressRule: decides whether an address may be dialled"
  - id: the-connection-is-checked
    path: "src/backend/AgentSmith.Application/Services/Loop/LoopRuntimeExtensions.cs"
    action: "web_fetch's HttpClient gets a primary handler whose connect callback resolves, applies the rule to each candidate address and dials only a permitted one; a refusal becomes a tool error naming host and range."
    new:
      - "GuardedConnectCallback: the connect hook applying the rule"
  - id: the-content-is-marked
    path: "src/backend/AgentSmith.Application/Services/Prompts"
    action: "Wrap every web_fetch result body in untrusted web-content markers."
    new:
      - "WebContentDelimiters: the markers and rule for fetched content"
  - id: the-allowance
    path: "src/backend/AgentSmith.Contracts/Models/Configuration"
    action: "An operator CIDR allowance for web_fetch, empty by default."

tests:
  - "PublicAddressRule_LoopbackPrivateLinkLocalSharedWireServer_AreRefused"
  - "PublicAddressRule_Ipv6LoopbackUniqueLocalLinkLocal_AreRefused"
  - "PublicAddressRule_PublicAddress_IsAllowed"
  - "PublicAddressRule_OperatorAllowance_AdmitsTheNamedRange"
  - "WebFetch_RedirectToPrivateAddress_IsRefusedAtTheHop"
  - "WebFetch_HostResolvingToPrivateAddress_IsRefused"
  - "PublicAddressRule_Ipv4MappedMetadataAddress_IsRefused"
  - "PublicAddressRule_Nat64And6to4WrappingPrivate_AreRefused"
  - "WebFetch_ProxyEnvironmentSet_StillDialsAndChecksTheTarget"
  - "WebFetch_Result_SliceIsWrappedHeaderAndTailAreNot"
  - "WebContentDelimiters_Wrap_NeutralisesAnEndMarkerInThePage"
  - "WebFetchConfig_AllowedCidrs_BindsThroughTheRealServiceProvider"

done:
  - "web_fetch to 169.254.169.254, a cluster service, localhost or a redirect into them returns a refusal naming the range"
  - "an allowed internal range is reachable; public documentation still fetches"
  - "fetched content reaches the model inside untrusted markers"
  - "build green, full suite green"
