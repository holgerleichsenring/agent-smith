# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-18-6c8d

goal: "An on-demand check reports a configured lifecycle status that the work-item kinds this tracker can claim do not have, so the mismatch is read before a run ends rather than after."

applies_to: "backend (a tracker check on the existing diagnostics surface, its finding) + dashboard (where that check is already read)"

requires:
  - 2026-09-18-b4f0

scope:
  in: >
    A check the operator can run against a configured tracker asks it which work-item kinds it offers
    and which statuses each kind allows, then reports every configured lifecycle status — the trigger
    statuses, the in-progress, done, failed, needs-clarification and not-implementable ones, wherever
    they are set, on the tracker or overridden on a project — that no kind the tracker's own discovery
    can claim will accept. It reports, it does not refuse: the answer is a finding beside the checks
    an operator already runs, naming the status, the setting it came from and the kinds that would
    reject it. A provider that cannot enumerate kinds or statuses says so, and the check records that
    it could not be made rather than that everything is fine.
  out: >
    REFUSING A CONFIGURATION SAVE. The save path is synchronous, its store throws when a credential is
    absent, and one of its implementations is read-only — a save that depends on a tracker being
    reachable would make a tracker unconfigurable on exactly the installation that has not wired its
    credential yet. See decisions.
    A CHECK BEFORE EVERY FILING. An epic files several tickets; a remote round trip per create, inside
    a turn the operator is watching, buys nothing the on-demand check does not.
    CHOOSING A VALID STATUS. The configured value is the operator's; this says which kinds reject it.
    THE LOOP A REJECTED STATUS CAUSES. 2026-09-18-c1a7 stops that whatever the cause.
    THE WORK-ITEM KIND ITSELF. 2026-09-18-b4f0.

decisions:
  - key: |
      THE AXIS IS WHAT THE TRACKER CAN CLAIM, NOT WHAT THE FILER CREATES. The first draft checked the
      configured statuses against the kind a filing creates. That is the wrong axis in both directions:
      discovery is not kind-filtered, so most claimed tickets are the ones people opened by hand, and
      a configuration correct for those would have been refused because the filer creates something
      else — while a status valid for the filer's kind and rejected by every human-opened ticket would
      have passed. The set that matters is the kinds this tracker's own discovery can return.
  - key: |
      IT REPORTS, IT DOES NOT REFUSE, AND THE SURFACE ALREADY EXISTS. The configuration save is a void
      call wired generically, its provider factory throws when a required secret is absent — which a
      write guard turns into a refusal — and its file-backed implementation refuses every write. So a
      remote check on that path makes a tracker unsaveable on an installation whose credential is not
      wired yet, which is the ordinary order of setting one up. The repository already separates these:
      deterministic offline rules are findings produced at load, and credential-exercising reads live
      behind an explicit, permission-gated probe. This is the second kind.
  - key: |
      AN UNANSWERABLE CHECK IS NOT A PASS. Providers differ in what they can enumerate. One that cannot
      answer records that it could not be checked, and that state is visible as its own thing — the
      same distinction a sibling phase had to build for reviews, and collapsing it is the same defect.
  - key: |
      A STATUS HAS TWO HOMES AND THE CHECK READS BOTH. The lifecycle statuses live on the tracker and
      can be overridden per project. A check that read only the tracker would pass a configuration
      whose effective value, the one a run uses, is the project's.
  - key: |
      THE TRIGGER STATUSES COUNT TOO. A filing's first status write moves the ticket into a trigger
      status; if the created kind has no such state the filing's start fails immediately — earlier and
      more visibly than the terminal-status problem that prompted this, and it belongs in the same
      check.

steps:
  - id: the-tracker-is-asked
    action: "A collaborator reads the kinds a tracker offers and the statuses each kind allows, per provider, reporting plainly where it cannot."
  - id: the-check
    action: "A check on the existing diagnostics surface compares every configured lifecycle status, from the tracker and from each project that overrides it, against the kinds discovery can claim."
  - id: the-finding
    action: "The result is a finding naming the status, the setting it came from and the kinds that would reject it; an unanswerable check records that it could not be made."

tests:
  - "Check_StatusNoClaimableKindHas_IsReported"
  - "Check_StatusEveryClaimableKindHas_IsNotReported"
  - "Check_StatusOverriddenOnAProject_IsCheckedAgainstTheOverride"
  - "Check_TriggerStatusNoClaimableKindHas_IsReported"
  - "Check_ProviderThatCannotEnumerate_RecordsNotCheckedRatherThanFine"
  - "Check_TrackerUnreachable_RecordsNotCheckedAndDoesNotFail"
  - "Check_FindingNamesTheStatusTheSettingAndTheKinds"
  - "Config_SavingATracker_MakesNoRemoteCall"

done:
  - "an operator can ask, before a run, whether their configured statuses exist on the kinds this tracker claims"
  - "a status that is fine for one kind and impossible for another is named with both"
  - "saving a tracker still works on an installation whose credential is not wired yet"
  - "a check that could not be made is never read as a pass"
  - "build green, full suite green, file-length ratchet green"
