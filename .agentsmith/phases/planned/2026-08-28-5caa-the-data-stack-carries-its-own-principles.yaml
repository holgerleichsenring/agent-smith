# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-5caa

goal: "A repository declaring the data domain is bootstrapped with written python and dbt rules, so its conventions are decided before the first run."

applies_to: "skills catalog (a python delta, a domain principles document, the profile field that points at it) + backend (composing it at init)"

requires:
  - p0379
  - p0504

scope:
  in: "A python delta beside the existing three, a principles document for the dbt and Databricks conventions a domain implies, a profile field naming it, and composition of core plus the domain's document for a repository that declares a domain."
  out: >
    THE JAVA AND ANGULAR DELTAS — the two phases that make those stacks run. Enforcing
    any of these rules mechanically: they are read by the master and by reviewers, and a
    linter that checks a subset is a separate decision. Rewriting core.md, which is
    language-agnostic and stays that way.

decisions:
  - key: |
      A DOMAIN IS NOT A LANGUAGE AND THE DELTA MECHANISM IS KEYED BY LANGUAGE, WHICH IS THE
      DEFECT THIS PHASE HAS TO SOLVE FIRST. Deltas compose as core plus deltas/<slug> where the
      slug is what project discovery emits, and a dbt repository emits python. Writing dbt
      conventions into the python delta would hand them to every python repository that has never
      seen a warehouse. So the domain profile — which already answers "what is this repository" —
      names its own principles document, and a repository declaring a domain composes core, its
      language delta and the domain's document.
  - key: |
      THE NOTEBOOK QUESTION IS ANSWERED IN THE DOCUMENT, NOT LEFT OPEN. A .ipynb carries outputs
      in the diff, cannot be reviewed line by line and cannot be unit tested; a .py file with the
      Databricks notebook source header runs as a notebook in the workspace and is text in git.
      The rule is that notebooks are source-format entry points and that logic lives in modules
      the tests can import.
  - key: |
      A PACKAGE IS NOT HARDER THAN A NOTEBOOK IN A SANDBOX, AND THE DOCUMENT SAYS SO. An editable
      install plus a test run is exactly what the master already does for every other stack; what
      is genuinely harder about a wheel is DELIVERY into a workspace, and that happens in the
      pipeline that deploys, not in the sandbox that verifies.
  - key: |
      THE FORMAT DOCUMENT POINTS AT A PATH THAT NO LONGER EXISTS, AND WRITING A NEW DELTA IS WHEN
      THAT BITES. DELTA-FORMAT names skills/coding/principles/deltas/<slug>.md; the deltas have
      lived at principles/deltas/ since the catalog became masters-only. The path is corrected
      with the file that would otherwise be written to the wrong place.
  - key: |
      THE RULES ARE DOCUMENTED CONVENTION, NOT PREFERENCE, BECAUSE THAT IS THE DELTA CONTRACT.
      Layered model naming, ref() over hard-coded relations, tests declared beside the model,
      explicit column lists — each is the published convention of the tool, which is what makes
      two repositories of the same stack compose to identical principles.

steps:
  - id: the-python-delta-exists
    action: "A python delta covering every hook the core names — naming, layout and size, abstractions, error mechanics, test placement, formatter and linter — following the delta format."
  - id: the-domain-principles-exist
    action: "A principles document for the data domain covering model layering and naming, ref and source over hard-coded relations, tests declared with the model, notebook source format, and package layout."
  - id: the-profile-names-it
    action: "A profile may name its principles document, and a repository declaring a domain composes core, its language delta and that document at init."
  - id: the-format-document-is-true
    action: "Correct the delta format's stated path to where deltas actually live."

tests:
  - "PythonDelta_HasBothMandatorySections"
  - "DomainPrinciples_AreComposedForARepositoryDeclaringTheDomain"
  - "DomainPrinciples_AreNotComposedForARepositoryDeclaringNoDomain"

done:
  - "a bootstrapped data repository receives core plus python plus the domain document"
  - "a bootstrapped python repository with no domain receives core plus python only"
  - "every existing stack's composition is unchanged"
  - "build green, full suite green"
