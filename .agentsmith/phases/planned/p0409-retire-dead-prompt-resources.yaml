# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0409
goal: "Delete the embedded prompt resources no run can reach, and the orphaned services that were their only callers, so the prompt catalog describes the system that exists. p0408's audit found 13 of 14 dead: triage-system, triage-structured-system, triage-structured-user, plan-consolidator-system, plan-consolidator-user, evaluate-skills-system (no loader at all), observation-schema, structured-output-contributor, structured-output-gate-list, structured-output-gate-verdict (loaders never wired), expectation-drafting-system (NegotiateExpectation retired p0393), convergence-system (ConvergenceCheck has no handler), agent-plan-system (GeneratePlan retired p0394a). Only spec-derivation-master stays, as the fallback for a pinned catalog that lacks that master."
applies_to: "backend"
requires:
  - p0408   # the audit that found them
scope:
  in: "The 13 resources, their orphaned loaders (SkillPromptBuilder, StructuredOutputInstructionBuilder, ConvergenceEvaluator, ExpectationDrafter, AgentPromptBuilder.BuildPlanSystemPrompt) and the DI registrations and tests that only exist for them."
  out: "Command names and beats/step-classes kept for rendering historical run records — those describe runs that happened and stay."
steps:
  - id: confirm-dead
    action: "Re-confirm per resource that no live preset step reaches it, then delete resource + loader + registration + tests in one move per resource."
  - id: guard
    action: "Test that every embedded prompt resource has a call site, so the next dead prompt fails the build instead of accumulating."
tests:
  - "EveryEmbeddedPrompt_HasALiveCallSite"
done:
  - "Prompts/Resources holds only prompts a run can reach."
  - "No service remains whose only purpose was a deleted prompt."
