# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-b630

goal: "A credential a project declares is proven well-formed before the run and present inside the sandbox, so a typo is caught without a run and an absent injection is not mistaken for a repository failure."

applies_to: "backend (a run-preflight check over the declared secret references, and a presence assertion inside the sandbox)"

requires:
  - p0272

scope:
  in: "A preflight check that every declared secret reference is well-formed, non-empty, unambiguous and distinct in its mounts, reported by name; and an in-sandbox assertion that each declared environment variable and file is present and non-empty, naming what is missing."
  out: >
    READING SECRETS FROM THE CLUSTER. The deployment's role grants jobs, pods and quotas
    and no secrets, and granting them would hand the orchestrator every value in the
    namespace — the inversion of the property this mechanism exists for. WHETHER THE
    TARGET ACCEPTS THE CREDENTIAL — the successor *the target answers before the master
    runs*. Non-k8s backends inject nothing at all, which is stated below rather than
    worked around.

decisions:
  - key: |
      THE CLUSTER READ IS REFUSED ON THREE INDEPENDENT GROUNDS, EACH FATAL. The role in this
      repository's manifests grants jobs, pods, pods/log, pods/status and resourcequotas and no
      secrets, so the call would 403. The Kubernetes API has no existence-without-content read,
      so granting it means granting the ability to read every value including the model key and
      the git token. And a preflight check that throws is downgraded to a warning, so the check
      would report everything fine exactly in the deployments where it cannot look.
  - key: |
      WHAT IS KNOWABLE WITHOUT THE CLUSTER IS THE DECLARATION, AND THAT IS MOST OF THE DEFECTS.
      A reference is a secret name and a key joined by one separator; a blank side, a missing
      separator, a duplicate environment name and two files claiming one mount are all decidable
      from the resolved project alone, which a preflight check already reads.
  - key: |
      PRESENCE IS PROVEN WHERE THE VALUE ARRIVES, AND KUBERNETES ALREADY PROVED HALF OF IT. A pod
      whose secret reference cannot be resolved does not start, so a sandbox that came up carries
      the proof for its environment variables; what remains is asserting the variable is set and
      non-empty and the file exists, which reads a NAME and never a value.
  - key: |
      THE NON-KUBERNETES BACKENDS INJECT NOTHING, AND A FIXTURE MUST NOT GO RED FOR IT. Only the
      pod builder consumes the resolved secrets; the docker and in-process sandboxes carry no
      secret handling at all. A declared credential there is reported as not injected, not as a
      failing repository — otherwise every docker-tier run of a repository that declares one goes
      red for a reason that has nothing to do with the repository.

steps:
  - id: the-declaration-is-checked-without-a-run
    action: "A run-preflight check reporting every declared secret reference by name, failing on a malformed or ambiguous one, needing no cluster call."
  - id: the-injection-is-proven-in-the-sandbox
    action: "An assertion inside the sandbox that each declared variable is set and non-empty and each declared file exists, naming what is missing and never printing a value."
  - id: a-backend-that-injects-nothing-says-so
    action: "On a backend that does not inject secrets, the result is reported as not injected rather than as a failure."

tests:
  - "Preflight_AMalformedSecretReference_IsNamedBeforeAnyRun"
  - "Preflight_TwoFilesClaimingOneMount_IsRefused"
  - "Preflight_EveryReferenceWellFormed_Passes"
  - "Sandbox_AnUnsetInjectedVariable_FailsNamingTheVariableNotItsValue"
  - "Sandbox_ABackendThatInjectsNothing_ReportsNotInjected"

done:
  - "a malformed or duplicated secret reference is named before any sandbox is created"
  - "a sandbox missing a declared variable or file fails naming it, with no value in the message"
  - "a docker-tier run of a repository declaring credentials still runs"
  - "build green, full suite green"
