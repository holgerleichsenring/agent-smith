# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-28-ef94
goal: "A command run by the in-process sandbox does not inherit the framework's own secrets, so REDIS_URL, tracker, git and model keys stop reaching repository scripts in CLI and fallback runs."

applies_to: "backend (InProcessSandbox step environment and its three construction sites)"

requires: []

scope:
  in: >
    Every in-process Run step starts from the host environment minus the framework's secret
    variables, before the step's own Env is applied, so a git step still receives its GIT_TOKEN. The
    list is the agent secrets (AgentSecretNames.For: canonical bindings plus every api_key_secret)
    plus a declared list of the other variables the server reads a secret from directly —
    REDIS_URL, REDIS_PASSWORD, the webhook secrets, the chat adapter tokens, the persistence
    connection override, AZDO_TOKEN, GH_TOKEN and GOOGLE_API_KEY. One helper builds it; the strip
    list is a required constructor argument, so no construction site can forget it.
  out: >
    Values from the configuration's secrets block whose source variable is not a declared name:
    ConfigSecretResolver replaces each ${NAME} with its value and keeps no record of NAME
    (ConfigSecretResolver.cs:19-25); carrying the source name is 2026-09-28-c657, which extends this
    phase's list. An allowlisted (empty-by-default) environment, which would break toolchains that
    read proxy, JAVA_HOME or DOTNET_* settings from the host. Masking output (2026-09-28-23a2b covers
    the container agent path; after this phase the in-process path no longer holds those values).

decisions:
  - key: |
      THIS IS THE LARGEST LEAK THE SERIES FOUND, AND THE CHEAPEST TO CLOSE. InProcessSandbox builds a
      ProcessStartInfo that inherits the whole host environment and only adds to it
      (InProcessSandbox.cs:155-187). It is the server's fallback backend (ServerSandboxExtensions.cs:85-99)
      and the CLI's registration (SandboxServiceCollectionExtensions.cs:24). A server that falls back
      to it holds REDIS_URL, the database override and every model, tracker and chat secret in its own
      environment (AgentSecretBinding.cs:13-27 and the list below), and the spawned job pods, until
      2026-09-28-10ffb deletes them, run in-process the same way (KubernetesJobSpawner.cs:87-88). So
      `run_command env` in those runs
      prints the server's Redis credential and the model and tracker keys.
  - key: |
      A DECLARED LIST, NOT A PATTERN. AgentSecretNames.For (AgentSecretNames.cs:29-46) already names
      the variables the framework treats as secrets, including REDIS_URL (AgentSecretBinding.cs:26).
      Stripping by that list is reading a field; stripping anything that looks like *TOKEN* would be
      a heuristic.
  - key: |
      THE AGENT LIST IS NOT ENOUGH, AND IS NOT EXTENDED. The server also reads secrets from
      variables no binding names: GITHUB_WEBHOOK_SECRET, GITLAB_WEBHOOK_TOKEN, AZDO_WEBHOOK_SECRET
      (WebhookSecretResolver.cs:17-19), SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, TEAMS_APP_PASSWORD
      (ChatAdaptersExtensions.cs:37, 58-59), AGENTSMITH_PERSISTENCE_CONNECTION
      (PersistenceEnvironmentOverlay.cs:30), AZDO_TOKEN (AzureDevOpsPrCommentReplyService.cs:21),
      GH_TOKEN (CopilotChatClientBuilder.cs:58), GOOGLE_API_KEY (GeminiChatClientBuilder.cs:31). They
      go on a declared list beside AgentSecretNames.For, never into it: For() stays the canonical
      agent-secret list (AgentSecretNames.cs:29-46). REDIS_URL is also on the declared list by name,
      so the strip does not depend on it staying a binding.
  - key: |
      STEP ENV IS APPLIED AFTER THE STRIP. Git steps carry GIT_TOKEN in Step.Env
      (GitStepCredentials.cs:17-23) and the credential helper reads $GIT_TOKEN
      (GitStepCredentials.cs:13-14), not GITHUB_TOKEN, so stripping the host token breaks no clone or
      push.
  - key: |
      REQUIRED, NOT OPTIONAL. InProcessSandbox is constructed at three production sites
      (InProcessSandboxFactory.cs:24, SecurityTrendCommand.cs:52, CompileWikiCommand.cs:73) and many
      tests. An optional parameter defaulting to "strip nothing" would let a new site leak silently;
      tests pass an empty list explicitly. InProcessSandbox is at 403 of its 417 baseline, so the strip
      lives in a type of its own.
  - key: |
      THIS STOPS ACCIDENTS, NOT A DELIBERATE SCRIPT. An in-process step runs as the same user as the
      server or CLI process that spawned it, and the parent's own environment and arguments stay
      readable through /proc/$PPID. A script that looks there still finds the values. The boundary for
      repository code is a container sandbox (2026-09-28-2f8c, 23a2b); this phase removes the values from what a
      build, a test or `env` prints by default.
  - key: |
      SERIES: turned up in review of the 2026-09-28 sandbox work (the OpenHands comparison); own
      number per the minting rule. Suggested order: first, together with 2026-09-28-c657.

steps:
  - id: the-strip-list
    path: "src/backend/AgentSmith.Infrastructure/Services/Sandbox"
    action: "A step-environment builder that removes the declared secret names from an inherited environment and then applies the step's Env."
    new:
      - "InProcessStepEnvironment: removes declared secret variables, then applies step env"
  - id: every-site-passes-it
    action: "InProcessSandbox takes the strip list as a required constructor argument; the factory and both CLI commands pass AgentSecretNames.For(config)."
    modify:
      - "InProcessSandbox, InProcessSandboxFactory, SecurityTrendCommand, CompileWikiCommand"
  - id: it-is-pinned
    path: "tests/AgentSmith.Tests/Sandbox"
    action: "Run `env` through a real InProcessSandbox with REDIS_URL and a named agent key set in the test process environment."

tests:
  - "InProcessStepEnvironment_DeclaredSecret_IsRemoved"
  - "InProcessStepEnvironment_StepEnvGitToken_IsStillApplied"
  - "InProcessStepEnvironment_UndeclaredVariable_IsKept"
  - "InProcessSecretNames_Build_IncludesTheFrameworkReadVariables"
  - "AgentSecretNames_For_DoesNotIncludeTheFrameworkReadVariables"
  - "InProcessSandbox_RunEnv_DoesNotPrintRedisUrlOrAgentKeys"
  - "InProcessSandboxFactory_Create_PassesTheConfiguredNames"

done:
  - "an in-process `env` step prints no declared secret variable, on the server fallback and the CLI"
  - "clone and push in-process still authenticate"
  - "build green, full suite green"
