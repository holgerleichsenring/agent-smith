# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-09-25-6b2e
goal: "A Copilot tool call can be answered: the adapter stops reading the runtime's confirmation of its OWN answer as somebody else's."

applies_to: "backend"

decisions:
  - key: |
      MEASURED ON A REAL SEAT, NOT REASONED ABOUT. 2026-09-23-4722a left one claim unprovable
      without a seat and said so. With a seat the liveness test fails, and it fails the same way
      after a 2-second wait as after 90: "The Copilot session resolved external tool request
      <guid> elsewhere, so its result will never arrive." Not a deadline. Every tool-bearing
      Copilot call dies on the first answer, which means that path has never worked and could
      not have.
  - key: |
      THE FAULT IS OURS AND THE CODE SHOWS IT. CopilotTurnDriver subscribes a FRESH
      CopilotTurnCollector, then calls provoke — which on the continuation path IS our answer to
      the pending call. The runtime confirms that answer with ExternalToolCompleted. The new
      collector has no memory of what we just answered, so its "somebody else resolved this"
      branch fires on the echo of our own answer and throws. The design 4722a rests on is not
      refuted; the adapter simply cannot recognise its own voice.
  - key: |
      TWO ID SPACES, AND CONFLATING THEM IS WHY THIS LOOKED FOREIGN. The model's call id
      (toolu_...) and the runtime's external-tool RequestId (a GUID) are different names for one
      call — the live run answered toolu_01L9hv... while the failure named f9edb1ba-.... The
      collector must judge a completion against the RequestIds this turn ANSWERED, not against
      the ids the model used.
  - key: |
      THE FOREIGN-RESOLUTION GUARD STAYS, NARROWED. A call resolved by somebody else really must
      fail loudly rather than hang — that was right. What was wrong is that every resolution
      looked foreign. After this phase a completion for a request this turn answered is the
      expected confirmation; a completion for any other request is still the loud failure.
  - key: |
      THE TEST DOUBLE OMITTED THE ONE EVENT THAT MATTERS, WHICH IS WHY THE SUITE WAS GREEN.
      FakeCopilotRuntime never emits ExternalToolCompleted when a pending call is answered, so
      the normal path was never run against a runtime that confirms. Worse, the single test that
      does use the event scripts it directly and asserts the loud failure —
      ExternalToolCompletedElsewhere_FailsTheCallLoudly pins the behaviour that breaks the real
      thing. The fake gains the echo, so this class of defect is caught offline next time.
  - key: |
      THE ACQUISITION STEP LOOKS FOR A FILE THE ARCHIVE DOES NOT CONTAIN. The server Dockerfile
      runs `find /opt/copilot -name copilot -type f` and aborts the build when it finds nothing.
      The 1.0.85 release tarball is the npm package @github/copilot, whose bin entry is a
      loader script; there is no file named `copilot` in it. What the SDK spawns over stdio is
      prebuilds/<platform>/copilot-runtime, verified here by running the darwin build. So
      --build-arg COPILOT_CLI_VERSION has never produced a working image, and the failure would
      land on the operator mid-rebuild.
  - key: |
      A PROOF THAT CANNOT RUN MUST NOT REPORT SUCCESS. The liveness test returns early without a
      seat, and its own summary claims it "SKIPS loudly rather than passing quietly" — but
      xunit 2.5.3 has no Assert.Skip, and returning from a [Fact] IS a green tick. It is already
      excluded from ordinary runs by [Trait("Category","LiveLLM")], so the honest shape is to
      FAIL when invoked without a seat, naming what is missing.
  - key: |
      NOT IN SCOPE, WITH ITS REASON: what the pending call's real tolerance is. Whether it
      survives a ten-minute build cannot be asked until answering works at all. The delay
      becomes settable so the answer can be measured the moment it can be.

steps:
  - id: a-completion-we-caused-is-not-foreign
    path: "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/Copilot"
    action:
      - "Tell the turn which external-tool request ids it is answering, before it subscribes."
      - "Treat a completion for one of those as the expected confirmation, and any other completion as the loud failure it already is."
    modify:
      - "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/Copilot/CopilotTurnCollector.cs"
      - "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/Copilot/CopilotTurnDriver.cs"
      - "src/backend/AgentSmith.Infrastructure/Services/Factories/ChatClientBuilders/Copilot/CopilotPendingCalls.cs"

  - id: the-fake-confirms-like-the-runtime-does
    path: "tests/AgentSmith.Tests/Factories"
    action:
      - "Have the double emit the completion for a pending call it is handed an answer for."
      - "Rewrite the test that pins a completion as always-foreign so it distinguishes our own from somebody else's."
    modify:
      - "tests/AgentSmith.Tests/Factories/FakeCopilotRuntime.cs"
      - "tests/AgentSmith.Tests/Factories/CopilotToolLoopTests.cs"

  - id: the-image-takes-the-binary-the-archive-carries
    path: "src/backend/AgentSmith.Server"
    action:
      - "Resolve the Copilot runtime from prebuilds/<platform> and keep the deterministic COPILOT_CLI_PATH."
      - "Keep the abort when the archive carries no runtime, naming what was looked for."
    modify:
      - "src/backend/AgentSmith.Server/Dockerfile"

  - id: the-proof-says-when-it-did-not-run
    path: "tests/AgentSmith.PipelineHarness/Evals"
    action:
      - "Fail, naming the missing seat or runtime, instead of returning green."
      - "Let the wait before answering be set, so the surviving tolerance can be measured once answering works."
    modify:
      - "tests/AgentSmith.PipelineHarness/Evals/CopilotPendingCallLivenessTests.cs"

  - id: the-example-states-todays-capability
    path: "config"
    action: "Drop the note that a tool-bearing role is refused — 2026-09-23-4722a removed that, and no such refusal exists in the code."
    modify:
      - "config/agentsmith.example.yml"

tests:
  - "Answer_ACompletionForTheRequestWeAnswered_FinishesTheTurn"
  - "Answer_ACompletionForARequestWeDidNotAnswer_StillFailsLoudly"
  - "Answer_ATurnAnsweringNothing_TreatsAnyCompletionAsForeign"
  - "Dockerfile_TheCopilotStep_ResolvesTheRuntimeFromPrebuilds"
  - "Liveness_NoSeatOrRuntime_FailsInsteadOfPassing"

done:
  - "a tool-bearing Copilot call completes: the answer is accepted and the turn resumes"
  - "a call resolved by somebody else still fails loudly"
  - "the unit suite would have caught this — the double confirms answers the way the runtime does"
  - "an image built with the Copilot build-arg contains a runtime the SDK can spawn"
  - "the liveness proof cannot report success without having run"
