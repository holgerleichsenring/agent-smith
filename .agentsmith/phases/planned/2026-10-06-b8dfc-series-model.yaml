# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-10-06-b8dfc
goal: "A ticket's work is a series: code-minted spec ids, spec files in specs/planned/, one manifest at series/{base}.yaml in place of set.yaml and accounting.md."

applies_to: "server (spec sets → series, persistence)"

requires:
  - 2026-10-06-b8dfb

facts:
  - claim: "A spec set lives under .agentsmith/specs/<provider>-<ticket>/: set.yaml, stem yaml, stem md, accounting.md"
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSetKey.cs:13-32; src/backend/AgentSmith.Application/Services/Specs/SpecSetFiles.cs:23-40"
  - claim: "Derived ids are p{ticket digits}{letter}; dialog ids are minted by the model; equal ticket numbers from two trackers collide"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/PhaseIdFactory.cs:28-29; src/backend/AgentSmith.Application/Services/Specs/DerivedPhaseBuilder.cs:39-41; src/backend/AgentSmith.Application/Services/Specs/SpecFallback.cs:21-26"
  - claim: "set.yaml lists stems under phases but ids under executed_phases and carried; its source field is written and never read"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetIndex.cs:34-37; src/backend/AgentSmith.Application/Services/Specs/SpecSetReader.cs:75"
  - claim: "SpecSet holds executed phases twice, and the marker updates only one"
    evidence: "src/backend/AgentSmith.Contracts/Specs/SpecSet.cs:22,40; src/backend/AgentSmith.Application/Services/PhaseExecution/ExecutedPhaseMarker.cs:43"
  - claim: "The writer sweeps the set's directory for stale files and force-stages it; the reader takes the last commit on that directory"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecSetWriter.cs:54-65,86-96; src/backend/AgentSmith.Application/Services/Specs/SpecSetReader.cs:46-69"
  - claim: "A fenced YAML block in the ticket description is a spec source"
    evidence: "src/backend/AgentSmith.Application/Services/PhaseExecution/PhaseSpecFromTicket.cs:32-49; src/backend/AgentSmith.Application/Services/Specs/SpecSourceResolver.cs:62-95"
  - claim: "The pointer table is keyed by (Project, SpecKey) and carries a dead column"
    evidence: "src/backend/AgentSmith.Infrastructure.Persistence/Entities/TicketSpecSet.cs:9-35; src/backend/AgentSmith.Infrastructure.Persistence/Configurations/TicketSpecSetConfiguration.cs:25"
  - claim: "Mocks are matched to a spec by id prefix; security scans skip .agentsmith/specs/"
    evidence: "src/backend/AgentSmith.Application/Services/Specs/SpecPhaseMocks.cs:16-24; src/backend/AgentSmith.Infrastructure/Services/Security/SourceFileEnumerator.cs:29-32"
  - claim: "ForceStage fails on an unmatched pathspec; removal goes through git rm"
    evidence: "src/backend/AgentSmith.Application/Services/SandboxGitOperations.cs:52-66,286-287"

assumptions:
  - claim: "git log -1 accepts several pathspecs including a glob"
    check: "extend GetLastCommitForPathAsync to a path list and test it in a sandbox"

scope:
  in: "Series (was SpecSet) and its manifest; SeriesIdFactory minting {date}-{hex4} once per ticket, stored in the manifest and the DB ref; spec files in specs/planned/{id}-{label}.*; reader and writer driven by the manifest's spec list; stale removal by the previous manifest; revision sha over series/{base}.yaml and specs/*/{base}*; TicketSpecSets reshaped to TicketSeries (TicketKey, SeriesId, …; old rows dropped); the ticket-description source removed; scan exclusion of series/."
  out: "Moving an executed spec to done/ (b8dfd); the dialog's ids and approval (b8dfe); run tables and UI words (b8dff)."

decisions:
  - manifest: ".agentsmith/series/{base}.yaml: ticket ref, goal, ordered spec ids, revisions, accounting (segments → spec id), approval, handback. Ids only — never stems; the label is read off the file."
  - minting: "The first derivation for a ticket mints the series; every later one reads it from the DB ref and reuses it. Spec letters follow the manifest order."
  - stale: "Stale = ids in the previous manifest missing from the new one; their files go through git rm. No directory sweep — specs/planned/ is shared."
  - sha: "The revision sha is git log -1 over the manifest and the series' spec paths."
  - drop_in_flight: "Old spec sets and old pointer rows are ignored and dropped; the migration truncates TicketSpecSets."

steps:
  - id: model
    action: "Rename SpecSet to Series with one executed truth (the state directory), drop Source.TicketDescription and the set's source field"
  - id: ids
    action: "Add SeriesIdFactory; PhaseIdFactory.For takes a series base and index; SpecFallback reuses the stored series"
  - id: files
    action: "SeriesManifest replaces SpecSetIndex and accounting.md; SpecSetKey becomes SeriesPaths; reader, writer, mocks and messages follow"
  - id: git
    action: "Multi-path last-commit; stale removal by previous manifest; force-stage only paths that exist"
  - id: db
    action: "TicketSeries entity, configuration and migration for every provider; pointer store and recorder follow"

tests:
  - "SeriesIdFactory_FirstDerivation_MintsDateHex"
  - "DeriveSpec_Rederivation_ReusesSeries"
  - "Series_TwoTrackersSameTicketNumber_DifferentIds"
  - "SeriesWriter_DroppedSpec_RemovesOnlyItsFiles"
  - "SeriesReader_ReviewerEditsSpecFile_ShaChanges"
  - "SeriesManifest_RoundTrip_IdsOnly"

done:
  - "A derived run on a fresh repository leaves specs/planned/{base}a-*.yaml and series/{base}.yaml, and nothing under specs/<provider>-<ticket>/"
  - "No code path reads a ticket description as a spec"
  - "Full suite and harness green"
