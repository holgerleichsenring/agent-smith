# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-384a

goal: "A Java repository builds and tests inside the sandbox through a profile, with timeouts and a dependency cache sized for a cold build, and a java delta beside the core principles."

applies_to: "backend (a reference fixture, a measurement, the cache catalog) + skills catalog (the java profile and delta)"

requires:
  - 2026-08-28-1d12
  - 2026-08-28-2989

scope:
  in: "A reference Maven repository with a defect per gate, a measurement of build and test with a cold dependency cache including wall time, a java profile declaring what survived, a java delta, and the timeout and cache facts the reference needs to finish."
  out: >
    GRADLE — a second build tool and a second measurement, named for a customer estate that
    needs it. A row in the language table. Anything the repository deploys to.

decisions:
  - key: |
      THE PROFILE ROUTE IS CHOSEN OVER THE ANALYZER ROUTE, AND THE REASON IS DETERMINISM. The
      only other source of verify stages is a build and test command the analyzer emits per run,
      which is model output and can differ between runs; a profile is authored once and is the
      same on every run. A smoke over model output proves nothing about the next run.
  - key: |
      THE TIMEOUTS ARE THE REAL RISK AND THEY ARE SMALLER THAN THEY LOOK. A verify command asks
      for its own limit but is clamped to the operator's per-step cap, and the master's own
      command default is far lower still — and the master runs the build long before the verify
      stage does. A cold Maven build routinely exceeds the lower of the two.
  - key: |
      THERE IS NO MAVEN CACHE ANYWHERE, AND ON THE DEPLOYED BACKEND THERE IS NO CACHE AT ALL. The
      cache catalog deliberately omits Maven, and only the docker sandbox mounts caches — the
      kubernetes one mounts none. So every step pays a cold restore on the target this actually
      ships to, which is why the measurement records wall time and why the cache row is part of
      this phase rather than a later nicety.
  - key: |
      WALL TIME IS RECORDED, NOT ASSERTED. A timing measured on one machine with one network is
      evidence, not a rule; asserting it would import a guarantee the measurement cannot carry,
      the same way an exit code cannot be recomputed offline.
  - key: |
      THE DELTA REACHES A RUN ONLY THROUGH A RELEASE AND A PIN, LIKE EVERY OTHER CATALOG CHANGE.

steps:
  - id: the-reference-exists
    action: "A minimal Maven reference repository with one defect variant per gate."
  - id: the-commands-are-measured
    action: "Measure build and test on clean and on each defect with a cold dependency cache, recording exit codes, versions and wall time."
  - id: the-cold-build-fits
    action: "A Maven row in the dependency cache catalog, and the per-project timeouts the reference needs, named where an operator sets them."
  - id: the-profile-and-delta-exist
    action: "A java profile declaring the image and the measured commands, and a java delta following the format, released and pinned."

tests:
  - "JavaProfile_DeclaresAnImageTheTrustPolicyAccepts"
  - "JavaRun_ResolvesAndRunsEveryDeclaredStage"
  - "Compose_AJavaRepository_CarriesCoreAndTheJavaDelta"

done:
  - "a Java run executes build and test as named stages, not as an unverified pass"
  - "the recorded cold-cache wall time is beside the caps it must fit"
  - "a bootstrapped Java repository receives core plus the java delta"
  - "build green, full suite green"
