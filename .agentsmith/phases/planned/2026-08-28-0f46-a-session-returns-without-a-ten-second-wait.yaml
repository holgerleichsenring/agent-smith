# yaml-language-server: $schema=../../phase-spec.schema.json
phase: 2026-08-28-0f46

goal: "The dashboard restores a session it can restore, asks the authority for nothing when it cannot, and stops making every load wait ten seconds on a silent return that never arrives."

applies_to: "dashboard (the sign-in session: how it returns, what it waits for, where it is held, and what it says when it ends)"

requires:
  - 2026-08-25-2de1
  - 2026-08-25-4530

scope:
  in: "The silent return that cannot complete and the ten-second wait every load pays for it; holding the session where a reload finds it; the hub's first connection failure, which is latched for the life of the tab; and the reason an ended session gives on screen."
  out: "Moving token custody to the server behind a cookie the page cannot read — the sound answer to this whole class, named here so this phase does not pretend to be it. Requesting an offline-access scope, which is an operator setting and not code (see preconditions)."

decisions:
  - key: |
      THE SILENT RETURN CANNOT COMPLETE, AND THAT IS THE DEFECT — NOT COOKIE POLICY. A first
      draft blamed third-party cookies. The code says the flow was never able to work on any
      browser: no silent redirect URI is configured, so the library points its hidden frame at
      the ordinary reply URL, which is the whole application. That page starts a session and
      takes the callback branch, completing a REDIRECT sign-in. The parent frame is waiting for
      the message only a SILENT completion sends, so it waits out its ten-second timeout and
      throws — every time, everywhere. Cookie policy is a later obstacle on a path that does not
      reach it yet.
  - key: |
      THE FRAME ALSO SPENDS WHAT THE PARENT NEEDS. Frame and parent share the tab's session
      storage, which is where the anti-forgery state and the code verifier live. The frame's
      redirect completion consumes the silent request's state and spends the single-use
      authorization code, so a parent that somehow was notified would fail on the next step.
      Fixing the notification without fixing this would move the failure rather than end it.
  - key: |
      EVERY LOAD PAYS THAT TIMEOUT BEFORE ANY REQUEST IS MADE. Session start awaits the restore,
      and both outgoing paths — the REST helper and the hub's token factory — await session
      start. So a load with nothing to restore stalls ten seconds before the first call or the
      first negotiate. That, not a backoff schedule, is the "slow to reconnect" the operator
      reported. The restore must consult what it holds and, holding nothing, stay signed out
      without asking the authority at all.
  - key: |
      A FAILED FIRST CONNECTION IS LATCHED FOR THE TAB'S WHOLE LIFE. The hub keeps its start
      promise to deduplicate concurrent starts and clears it only on stop, so a rejected first
      start is returned to every later attempt. Automatic reconnect does not cover the first
      connection — it fires only after one that succeeded drops. One refused negotiate therefore
      kills the live channel until the page is reloaded, which reads exactly like a reconnect
      that never finishes. It is a second cause of the same symptom and is fixed here rather
      than left for the operator to meet again.
  - key: |
      SESSION STORAGE, AND THE ASSET IS THE REFRESH TOKEN, NOT THE ACCESS TOKEN. Persisting the
      session persists whatever the library holds, and with an offline-access scope that
      includes a refresh token — a larger credential than the access token the in-memory choice
      was protecting, since it mints new ones for about a day. Session storage over local
      storage still wins on blast radius, but the honest claim is narrower than "never shared":
      a duplicated tab copies it. What retires the exposure is the server-side custody named in
      scope.out.
  - key: |
      THIS REVERSES THE IN-MEMORY DECISION ON THE OPERATOR'S CALL, AND ONE OF ITS REASONS WAS
      ALREADY FALSE. That decision held that in-memory renewal keeps working for a tab open
      longer than a token lives. It does not, and never did, for the reason above. Signing in
      again after every reload is a toll paid every working day, and paid by leaving tabs open,
      which is its own hazard.
  - key: |
      A SESSION THAT ENDS MUST SAY SO WHERE THE PERSON IS LOOKING. A failed renewal and a failed
      restore each write a console line, and the surface reads a bare "Sign in" — which is
      indistinguishable from never having signed in, and sent the operator hunting through the
      configuration for a fault that was in the browser.

steps:
  - id: the-silent-return-completes-or-is-not-begun
    action: "Give the silent return a destination that completes it as a silent one and notifies the frame that is waiting, so it can no longer complete as a redirect and can no longer spend the parent's state."
  - id: a-restore-with-nothing-to-restore-asks-nothing
    action: "Restore from what is held, and when nothing is held stay signed out without reaching the authority — so no load waits on a timeout before its first request."
  - id: the-session-outlives-a-reload
    action: "Hold the session in session storage so a reload finds it, keeping the single-use authority answer out of the address bar as it is today."
  - id: a-restored-session-is-proven-not-assumed
    action: "Check a restored session against its expiry before it is used, so a tab reopened after the token died signs in rather than making calls that will be refused."
  - id: a-refused-first-connection-can-be-retried
    action: "Clear the hub's start promise when it rejects, so a later subscribe opens a new connection instead of being handed the first failure again."
  - id: the-surface-says-why-a-session-ended
    action: "Carry the reason a renewal or a restore failed to the identity surface, so an expired session reads differently from never having signed in."

tests:
  - "Restore_WithNothingHeld_DoesNotReachTheAuthority"
  - "Restore_WithNothingHeld_ReturnsWithoutWaitingOnATimeout"
  - "Restore_WithAHeldSession_FindsItWithoutTheAuthorizationEndpoint"
  - "Restore_AHeldSessionPastItsExpiry_IsNotUsed"
  - "SilentReturn_CompletesAsSilent_AndLeavesTheParentsStateUnspent"
  - "Renewal_WithARefreshToken_NeverPreparesTheFrame"
  - "Renewal_Refused_ClearsTheSessionAndKeepsNoDeadToken"
  - "Hub_AFirstConnectionThatFailed_IsRetriedByTheNextSubscribe"
  - "Hub_AConcurrentStart_StillShareOneAttempt"
  - "Surface_AnExpiredSession_SaysWhyItEnded"
  - "Surface_NeverSignedIn_ReadsDifferentlyFromExpired"
  - "Settings_NoAuthorityConfigured_StillRendersNothing"

done:
  - "no load waits on a silent return that cannot arrive"
  - "a reload keeps the operator signed in, and a held session past its expiry does not pretend otherwise"
  - "a refused first hub connection is retried instead of latched for the tab's life"
  - "an ended session says on screen why it ended"
  - "an installation with no authority configured behaves exactly as before"
  - "dashboard build and tests green, full suite green"
