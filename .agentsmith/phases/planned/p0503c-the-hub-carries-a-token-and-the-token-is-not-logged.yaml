# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0503c
goal: "The live hub reads the token the handshake carries, every hub method names the permission it needs without SignalR enforcing it early, and the token stops surviving in the one log sink this repository can reach."

applies_to: "backend (JobsHub method-permission table, hub authorization filter, the handshake token read, console formatters in server and sandbox agent)"

requires:
  - p0503a

scope:
  in: >
    Reading the access token out of the handshake query string and dropping it from the
    request afterwards, a permission named for each of the eleven public hub methods,
    an IHubFilter that enforces those permissions only when the enforce switch is on, and
    redaction of an access token in both copies of the compact console formatter.
  out: >
    Authorizing a hub method's ARGUMENT — a permission on SubscribeRun says nothing about
    which run, and that is *the caller has a scope*. The dashboard attaching a token to the
    connection, and the flip of the enforce default — *the dashboard signs in*; until that
    phase lands, a switch turned on refuses every hub method because no browser sends a token.
    Fixing the sandbox-expansion refcount, and changing any access log outside this repository.

decisions:
  - key: |
      THE PREVIOUS DRAFT WOULD HAVE TAKEN THE DASHBOARD DARK ON THE COMMIT THAT LANDED IT, AND
      THAT IS WHY THE ANNOTATION IS NOT AN AuthorizeAttribute. Per-method authorization on a hub
      is NOT governed by the middleware and has no relation to any enforce switch: SignalR's hub
      dispatcher collects a method's AuthorizeAttributes into the method descriptor at discovery
      and evaluates them itself through IAuthorizationService on every invocation — no
      UseAuthentication, no UseAuthorization, no fallback policy in that path. Only a CLASS-level
      attribute reaches endpoint metadata, which is what p0503a's hub-level declaration relies on.
      Annotating the eleven methods with [Authorize] would therefore refuse (unauthenticated
      principal) or throw (no IAuthorizationService, unknown policy name) the moment the commit
      landed, taking the run viewer, the system drawer and the sandbox drawer down with no switch
      to bring them back.
  - key: |
      THE PERMISSION IS A TABLE IN ITS OWN FILE, NOT AN ATTRIBUTE ON THE METHOD, AND THE FILE
      LENGTH SAYS SO SECOND. The first reason is the one above — nothing on a hub method may be
      IAuthorizeData. The second is arithmetic: JobsHub.cs is 164 lines and sits at 164 in
      tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:92, which
      FileLengthRatchetTests.NoBaselineFile_GrewSinceTheRatchetWasInstalled makes shrink-only.
      Eleven attributes plus a using is +12 on a file with zero headroom, and an attribute has
      exactly one place it can live, so there is no call site to move it to. A static
      method-name-to-permission table adds nothing to JobsHub.cs, is what the filter reads
      anyway, and carries the same guarantee p0503a's route guard carries: a test enumerates the
      hub's public methods and fails on one the table does not name.
  - key: |
      p0503a FACES THE SAME 164 LINES AND HAS AN ESCAPE THIS PHASE DOES NOT. Its hub-level
      declaration is one class attribute, and a class attribute on a hub is equivalent to
      metadata at the MapHub call site — src/backend/AgentSmith.Server/Extensions/ServerEndpointExtensions.cs:27.
      Whichever of the two it chooses, JobsHub.cs must not grow, and this phase does not grow it.
  - key: |
      ELEVEN PUBLIC METHODS, NINE OF THEM TAKING A RUN ID — COUNTED, NOT ESTIMATED. JobsHub.cs
      lines 32, 61, 88, 100, 106, 117, 126, 135, 144, 153, 162. SubscribeOverview and
      SubscribeSystem take no argument; the other nine take a run id and nothing in this phase
      looks at its value. An earlier draft said eight, which would have left one method silently
      out of the table.
  - key: |
      THE SANDBOX EXPANSION PAIR IS A CROSS-VIEWER MUTATION, NOT MERELY "A WRITE".
      SandboxExpansionRegistry is a process-global singleton (DashboardApiExtensions.cs:28) over
      a ConcurrentDictionary<string,int> refcount (SandboxExpansionRegistry.cs:13); Collapse
      (:18-21) decrements a counter ANOTHER connection incremented, and RunEventRouter.cs:48
      gates SandboxOutput fan-out on the result. One caller can therefore silence a different
      operator's live drawer. That is the reason ExpandSandbox and CollapseSandbox are not reads.
  - key: |
      THE REFCOUNT LEAK IS NAMED HERE AND FIXED NOWHERE — IT IS AN OPEN QUESTION BELOW, NOT A
      SILENT DEFER. JobsHub has no OnDisconnectedAsync, so a closed tab never decrements and
      fan-out stays pinned on for the life of the process; and JobsHubClient.ts:312 replays the
      ExpandSandbox rejoin thunk after every automatic reconnect, incrementing again with no
      Collapse for the connection that was lost. A characterization test pins the behaviour so
      the successor has a red starting point. Authorization does not repair a counter.
  - key: |
      THE HANDSHAKE READ AND THE QUERY REWRITE ARE ONE CHANGE, BECAUSE A BROWSER CANNOT SET A
      HANDSHAKE HEADER. The token riding in the query string is the standard shape and is not the
      defect; the defect is what the query string outlives. OnMessageReceived reads access_token
      for the hub path and then REWRITES HttpContext.Request.QueryString without it, so every
      consumer after authentication — scopes, exception messages that embed the request, the
      EventSource copy of a post-auth line — sees a clean query. One assignment instead of a
      pattern applied in eleven futures.
  - key: |
      THE REWRITE DOES NOT REACH THE ONE LINE THAT ACTUALLY CARRIES THE QUERY TODAY, WHICH IS WHY
      THE FORMATTER SCRUB STAYS. Microsoft.AspNetCore.Hosting.Diagnostics writes "Request
      starting … {Path}{QueryString}" BEFORE the authentication middleware runs, so no rewrite
      can precede it. It is silent today only because appsettings.json:11 pins that category to
      Warning — a level any operator may raise while debugging, which is exactly when they paste
      the output somewhere. The scrub is applied to the COMPOSED line in CompactConsoleFormatter,
      not to the message alone, because AppendExceptionChain (:92 in both copies) writes
      exception messages verbatim and an identity-model exception can embed the artifact.
  - key: |
      THE SANDBOX AGENT'S COPY IS EDITED FOR LOCKSTEP AND CHANGES NOTHING THERE. Its header
      (src/backend/AgentSmith.Sandbox.Agent/Services/CompactConsoleFormatter.cs:13-16) demands
      both copies move together, and they are line-for-line identical at 102 lines each. But that
      project is Microsoft.NET.Sdk with three packages and one project reference — no Web SDK, no
      Kestrel, no HttpContext — so it can never format a request path. Nobody should read this
      phase and conclude the sandbox agent leaks tokens today. Both files have 18 lines of
      headroom against the 120-line limit, so neither joins the baseline.
  - key: |
      THE SINKS THIS PHASE CANNOT REACH ARE NAMED, BECAUSE PRETENDING OTHERWISE IS THE WHOLE
      FAILURE MODE. deploy/k8s/9-ingress.yaml:28 routes /hub straight to the server and
      ingress-nginx logs $request including the query string — the most widely shipped log in a
      cluster, and log-format is a controller-wide ConfigMap no annotation in this repository can
      change. In compose the hop is the dashboard's own Next.js server instead
      (src/dashboard/next.config.ts:20). The EventSource provider registered by
      WebApplication.CreateBuilder still carries the raw message to dotnet-trace, and
      ServerCompositionBuilder.cs:73-79 adds the compact console without ClearProviders, so no
      formatter change touches it. And the browser keeps the URL.
  - key: |
      SAY THE SIZE OF WHAT SHIPS. With the enforce switch off — its state on the day this lands —
      the permission table and the filter change no behaviour at all, and only the redaction
      delivers anything: the server's console, one of at least three sinks the token reaches, in
      one of the processes it traverses. That is worth doing and it is not a solved problem.
  - key: |
      THE TEST LIST IS WHAT THE TREE CAN ACTUALLY COMPILE, AND THE MISSING RIG IS NAMED RATHER
      THAN ASSUMED. There is no end-to-end handshake test here because
      tests/AgentSmith.Tests/AgentSmith.Tests.csproj carries no Microsoft.AspNetCore.SignalR.Client
      package and no test in the tree references JobsHub at all — the only hit for the type is
      tests/AgentSmith.Tests/Architecture/file-length-baseline.tsv:92. There is no subscribe test
      through the booted host because StartupResilienceTests.cs:32 binds REDIS_URL to the dead
      address 127.0.0.1:1, so SubscribeRun would go red for Redis and prove nothing about
      authorization. And "both formatters redact identically" cannot be one test: AgentSmith.Tests
      has no project reference to AgentSmith.Sandbox.Agent, whose formatter is internal with
      InternalsVisibleTo AgentSmith.Sandbox.Agent.Tests. It is two tests in two projects, and the
      lockstep is a convention the header states, not something a compiler checks. Everything that
      remains is a plain unit test: reflection over the hub type, the filter through its own
      contract, MessageReceivedContext over a DefaultHttpContext, and a formatter writing to a
      StringWriter.
  - key: |
      OPEN QUESTION, NOT A DECISION — WHICH PERMISSION THE SANDBOX PAIR TAKES. No permission in
      p0503a's catalog fits a write on the hub. If ExpandSandbox takes runs.control, a reader
      loses the live sandbox drawer, which is most of what a reader watches a run for. If a new
      permission is minted, p0503a's catalog and its per-permission counts change and that phase
      must be edited before this one starts. This is a product decision about what "reader" means
      and the operator answers it; the implementer does not pick one quietly.
  - key: |
      OPEN QUESTION, NOT A DECISION — WHETHER THE REFCOUNT GETS ITS OWN PHASE NOW. A drawer that
      closes with its connection needs OnDisconnectedAsync and per-connection ownership rather
      than a global counter, and a reconnect must not double-count. That is a phase; it is not
      this one. The operator says whether it is written before or after the auth series.
  - key: |
      OPEN QUESTION, NOT A DECISION — WHETHER THE QUERY SHOULD CARRY A BEARER TOKEN AT ALL. Since
      no change in this repository can redact an ingress access log, the alternative is to put a
      short-lived single-use handshake ticket in the query string and exchange it for the
      connection's identity, so what leaks into nginx expires in seconds. That is a larger design
      than this phase and it would change what *the dashboard signs in* has to build.

steps:
  - id: a-hub-method-names-its-permission
    action: "Add the method-name-to-permission table for the eleven public JobsHub methods, drawn from p0503a's catalog, with the sandbox expansion pair marked as writes."
    new:
      - "HubMethodPermissions: the eleven method names and the permission each needs, in its own file so JobsHub.cs does not grow"
  - id: the-filter-enforces-and-the-switch-decides
    action: "Add an IHubFilter that resolves the invoked method's permission from the table and refuses the invocation when the caller lacks it, doing nothing at all while the enforce switch is off."
    new:
      - "HubPermissionFilter: reads the table by method name, checks the connection's principal, gated on the same enforce switch the fallback policy uses"
  - id: the-handshake-reads-the-token-and-then-forgets-it
    action: "Read access_token from the query string for the hub path in OnMessageReceived, then rewrite Request.QueryString without it, leaving every other parameter untouched."
  - id: a-formatted-token-does-not-reach-the-console
    action: "Redact an access token value in the composed output line of both copies of CompactConsoleFormatter, covering the message, the scopes and the exception chain."
  - id: the-drawer-defect-is-pinned-not-fixed
    action: "Add a characterization test for the process-global expansion refcount so the cross-viewer collapse and the missing disconnect decrement are red facts a successor phase can act on."

tests:
  - "HubPermissions_EveryPublicHubMethod_IsNamedInTheTable"
  - "HubPermissions_TheTableNamesOnlyCataloguedPermissions"
  - "HubPermissions_TheSandboxPair_IsNotAReadPermission"
  - "HubMethods_CarryNoAuthorizeData_SoTheDispatcherEnforcesNothing"
  - "Enforce_SwitchOff_HubMethodsBehaveAsBefore"
  - "Enforce_SwitchOn_CallerLacksThePermission_TheInvocationIsRefused"
  - "Enforce_SwitchOn_CallerHoldsThePermission_TheInvocationProceeds"
  - "Enforce_SwitchOn_MethodMissingFromTheTable_IsRefusedRatherThanAllowed"
  - "Handshake_TokenInTheQueryStringOnTheHubPath_IsRead"
  - "Handshake_TokenOnANonHubPath_IsNotRead"
  - "Handshake_AfterTheRead_TheQueryStringNoLongerCarriesTheToken"
  - "Handshake_OtherQueryParameters_SurviveTheRewrite"
  - "Formatter_MessageCarriesAnAccessToken_TheValueIsNotWritten"
  - "Formatter_ExceptionMessageCarriesAnAccessToken_TheValueIsNotWritten"
  - "Formatter_QueryWithoutAToken_IsWrittenUnchanged"
  - "ExpansionRegistry_CollapseFromASecondCaller_SilencesTheFirstCallersDrawer"
  - "ExpansionRegistry_ConnectionGoesAwayWithoutCollapsing_StaysExpandedForever"
  - "AgentFormatter_MessageCarriesAnAccessToken_TheValueIsNotWritten"

done:
  - "no hub method carries an IAuthorizeData attribute, proven by a test, so SignalR's dispatcher enforces nothing"
  - "with the enforce switch off every hub method behaves exactly as it does today"
  - "all eleven public hub methods are named in the permission table and a twelfth would fail the build"
  - "the handshake reads the token and the request no longer carries it afterwards"
  - "an access token does not survive either copy of the console formatter, message or exception chain"
  - "the ingress access log, the Next.js proxy hop, the EventSource provider and the browser URL are named in writing as sinks this phase does not reach"
  - "the expansion refcount defect is pinned by a test and fixed by nobody"
  - "no hub method argument is claimed to be authorized"
  - "build green, full suite green"
