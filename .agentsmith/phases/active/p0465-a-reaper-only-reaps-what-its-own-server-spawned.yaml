# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0465
goal: "A sandbox is reaped only by the server that spawned it, so a second instance on the same Docker daemon cannot destroy the first one's runs."

applies_to: "backend"

decisions:
  - key: |
      THE REAPER IDENTIFIES SANDBOXES BY LABEL ALONE AND HAS NO CONCEPT OF OWNERSHIP.
      SandboxOrphanReaper.ListLabelledAsync filters containers on JobIdLabel across the WHOLE
      daemon, then decides liveness against ITS OWN Redis active-set and ITS OWN DB lease. A second
      server on the same socket therefore sees every sandbox of the first as an orphan the moment it
      passes the 60-second age rail, and force-removes it. The victim's own reaper is behaving
      perfectly and logging SKIP for the same containers.
  - key: |
      OBSERVED, NOT THEORISED. 2026-08-19: a documentation-screenshot server was started with
      SANDBOX_TYPE=docker against the operator's shared OrbStack daemon. Two live runs on ticket
      19213 died with "sandbox vanished", state=Gone (DockerContainerNotFoundException, so removed
      rather than exited) at container ages of roughly 77 and 81 seconds, which is the first foreign
      scan window after the age rail opens. AutoRemove is false for sandboxes, and the owning
      server's own reaper had logged SKIP age-rail and SKIP active-run for both.
  - key: |
      OWNERSHIP IS A LABEL, NOT A HEURISTIC. The spawner stamps an instance id on every container it
      creates and the reaper filters on it in the SAME ListContainers call, so a foreign container is
      never a candidate and no rail has to save it. Deriving ownership from the active-run set is
      what already failed; the fix belongs in the query, not in the decision.
      See [[feedback_no_heuristic_for_missing_data]] — the missing field IS the fix.
  - key: |
      THIS IS THE FOREIGN-INSTANCE SIBLING OF p0238. p0238 covers the empty-Redis variant, where a
      volatile store makes a server reap its OWN live sandboxes. Same reaper, same missing concept,
      and both are the reaper trusting a liveness store to answer a question about identity.
  - key: |
      THE OPT-OUT IS PART OF THE FIX. A second instance that only needs the API, for screenshots or a
      local read-only UI, cannot switch the reaper off today: RegisterDocker adds it as a hosted
      service unconditionally. An explicit disable is the difference between a safe parallel instance
      and a destructive one.

steps:
  - id: a-spawned-container-says-who-spawned-it
    action: "Stamp an instance id label in DockerContainerSpecBuilder, sourced from a stable per-server identity."
  - id: the-reaper-asks-only-for-its-own
    action: "Add the instance-id label to the reaper's ListContainers filter so foreign containers are never listed."
  - id: the-reaper-can-be-switched-off
    action: "Gate the hosted-service registration on an explicit setting for API-only instances."
  - id: a-foreign-container-is-proven-safe
    action: "Test that a container carrying a different instance id survives a scan that would otherwise reap it on both rails."

tests:
  - "a container labelled with a foreign instance id is not returned by the reaper's query and is not removed, with both rails otherwise satisfied"
  - "a container carrying this instance's id and no live run is still reaped, so the fix does not disable the feature"
  - "the reaper is absent from the hosted services when the disable setting is on"

done:
  - "two servers on one Docker daemon cannot remove each other's sandboxes"
  - "an API-only instance can run with the reaper switched off"
  - "the p0238 empty-Redis variant is referenced from this spec so the pair is legible"
