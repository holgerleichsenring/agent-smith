# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0391
goal: "Give the master a working way OUT: the ask_human door it is told twice to use is dead on every ticket-triggered coding run, the blocked verdict the backend already honours is invisible in its prompt, and nothing bounds a ledger the model refills — so a finished run keeps going until money, wall-clock or the operator stops it"

applies_to: "pipeline + skills"

requires: [p0318, p0341c, p0359, p0365, p0374]

decisions:
  - key: |
      Trigger: an independent assessment of p0390 (2026-07-30) concluded it would not have
      changed the 124-minute run it was written for, and found the real defects while
      checking. Both were verified again by hand against the code before this phase was
      written. p0390 stays in planned/ and is reconsidered only after this ships — if a
      problem is still left.
  - key: |
      ask_human is DEAD on fix-bug / add-feature. ContextKeys.DialogueJobId is set in
      exactly one place in the codebase — SpecDialogTurnRunner.cs:98 — so a ticket-triggered
      coding run never has one, and HumanToolHost.cs:41 returns "Error: Dialogue transport
      not configured." Meanwhile the deployed coding-agent-master skill instructs the master
      TWICE to call ask_human and STOP rather than guess, promising that "a parked question
      re-triggers the run with your answer". The prompt promises a door that is bricked up;
      what the model has left is to keep working. This is the single largest gap between
      what the agent is told and what it can do.
  - key: |
      The give-up verdict exists in code and is invisible to the model. p0365's
      MasterBlockedClaim is parsed (MasterVerificationParser.BlockedClaim.cs:33-35) and
      honoured terminally as StopBlocked (ReengageProgressPolicy.cs:41,47-48), but the
      verdict schema in the deployed skill has no "blocked"/"blocker" field and never
      mentions it. A capability nobody is told about does not exist.
  - key: |
      Nothing bounds ledger turnover. p0374 made the ledger fully model-owned — it may
      reword, drop, reorder and uncheck freely (ProgressLedgerToolHost.cs:90-100) — the only
      limit is a 40-item snapshot cap, and the loop keeps no per-pass ledger state to
      compare against. ShouldReengage re-drives whenever ledger.HasActionablePending
      (AgenticMasterHandler.cs:860), so a model that appends "verify X once more" re-drives
      itself indefinitely. The bound must be MECHANICAL: the observed run happened despite a
      long, careful prompt, so more prompt text is not the fix for this one.
  - key: |
      The drained-ledger reminder is fixable, not the cause. It leads with "If the work is
      truly complete, verify and emit your verdict" and only then offers "add those steps"
      (AgenticMasterHandler.cs:966-972). The invitation is the second half; it should not
      stand unqualified next to a mechanism that turns any added item into another pass.
  - key: |
      The skill still needs ONE sentence, and it is the surviving line of the superseded
      p0389: a stopping condition opposite the continuing condition. Today the skill says
      "if items 1-5 are not all true, you are not done — go back, don't summarise" and says
      nothing about when to stop, so it can only escalate. Prompt text is the right tool
      HERE (it is a judgement the model must make), and the mechanical bound above is the
      backstop for when it does not.
  - key: |
      Parking degrades silently today: with needs_clarification_status unset,
      PlanOpenQuestionsHandler.cs:49-52 logs "(not parked)" and the run ends Ok, leaving the
      ticket claimable — an unbounded re-trigger loop. Safety belongs in the type system,
      not the log: an unset status on a preset that can park is a startup configuration
      error.
  - key: |
      Explicitly NOT in this phase: any new artifact, any change to the ledger's ownership
      (p0374 stands), any change to the pinned ticket (p0357 stands), and the work spec
      (p0390). This phase only connects capabilities that already exist and bounds a loop
      that already runs.

steps:
  - id: open-the-door
    action: "Give every ticket-triggered code preset a working ask_human: the master's clarification tool captures the question, parks the ticket in needs_clarification_status and ends the run, the same way the phase-execution path already does — rather than returning an error string"
    modify:
      - "AgenticMasterHandler: the clarification tool host is selected for all code presets, not only phase-execution"
      - "The park path: a master-raised question parks the ticket and posts it, reusing p0318's transition"
  - id: name-the-exit
    action: "Add blocked/blocker to the verdict schema in the deployed skill so the model knows the terminal give-up the backend already parses and honours"
    modify:
      - "coding-agent-master SKILL.md: verdict block gains blocked/blocker with when-to-use; version bump + embedded pin"
  - id: stopping-condition
    action: "Add the stopping condition to the skill, opposite the existing definition of done: a new ledger item that only re-reads or re-confirms already-recorded evidence means the work is finished — write the verdict"
    modify:
      - "coding-agent-master SKILL.md: 'Knowing you are done' section; the drained-ledger reminder no longer invites new steps unqualified"
  - id: bound-the-turnover
    action: "Carry the previous pass's ledger item ids across re-engagement; a pass that ends with only items that did not exist at its start AND produced no new commit is not progress — stop and emit the verdict"
    modify:
      - "ReengageWhileProductiveAsync: per-pass ledger id snapshot"
      - "ReengageProgressPolicy: the new stop reason, surfaced in the run trail like StopIdle/StopBlocked"
  - id: fail-loud-on-unset-status
    action: "An unset needs_clarification_status on a preset that can park becomes a startup configuration error instead of a log line"
    modify:
      - "Configuration validation: presets that can park require the status"
      - "PlanOpenQuestionsHandler: the silent-degrade branch is removed"

tests:
  - "AskHuman_FixBugRun_ParksTheTicketInsteadOfReturningTransportError"
  - "AskHuman_AddFeatureRun_QuestionIsPostedAndTheRunEnds"
  - "Verdict_BlockedClaim_StopsTheLoopTerminally"
  - "Reengage_PassAddsOnlyNewItemsAndCommitsNothing_Stops"
  - "Reengage_PassAddsItemsAndCommits_Continues"
  - "Reengage_StopReason_IsVisibleInTheRunTrail"
  - "Configuration_PresetCanParkWithoutStatus_FailsAtStartup"
  - "Skill_VerdictSchema_DeclaresBlockedAndBlocker"

done:
  - "On a fix-bug and an add-feature run, ask_human parks the ticket with the question instead of returning 'Dialogue transport not configured' — verified on a live run, not only in tests"
  - "The deployed skill's verdict schema declares blocked/blocker, and a blocked verdict ends the run terminally"
  - "The skill states when to stop, not only when to continue, and the drained-ledger reminder no longer invites new steps without qualification"
  - "A pass whose only ledger change is items it invented itself, with no commit, ends the run with a visible stop reason"
  - "A preset that can park refuses to start without needs_clarification_status; no run can silently skip a park"
  - "Replayed against the 2026-07-29 migration run's shape, the loop terminates on its own instead of on the operator"
  - "Full suite green"
