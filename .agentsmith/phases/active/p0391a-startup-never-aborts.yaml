# yaml-language-server: $schema=../../phase-spec.schema.json
phase: p0391a
goal: "The server always starts. Every startup dependency — database, Redis, config load, config validation, spawner — becomes a probe that records a finding instead of throwing, the narrowest broken unit is disabled rather than the process, and the diagnostics surface comes up unconditionally so an operator is never locked out of the tool that tells them what is wrong"

applies_to: "server + pipeline + dashboard"

requires: [p0318, p0345c, p0349, p0390, p0391]

decisions:
  - key: |
      OPERATOR RULING, and it is general, not config-specific: "ein Abbrechen des
      Startvorgangs ist NIE zu rechtfertigen. Selbst wenn der DB-Connect nicht da ist und der
      Service handlungsunfähig ist, ist man SELBST handlungsunfähig, wenn einem der Server
      das nicht sagen kann." A dead process reports nothing; a degraded process reports
      exactly what is broken. The second is always more useful than the first, and there is
      no configuration or dependency failure where the reverse holds.
  - key: |
      Checkable form of the ruling: IF THE DIAGNOSTIC SURFACE CAN COME UP, IT MUST. The one
      honest boundary is a failure of that surface itself — the listener cannot bind its
      port — because then there is no channel to report through and nothing is being
      preserved by trying. Everything else (database unreachable, Redis unreachable, config
      invalid, migrations pending, secret missing, spawner unavailable) is a state the server
      can describe, and therefore must.
  - key: |
      Trigger: on 2026-07-31 p0391's ClarificationParkStatusRule threw at boot because ONE
      trigger of ONE project lacked needs_clarification_status, and the whole server refused
      to start. Since p0349 that configuration lives in the DB and is edited through the
      running server, so the failure was self-sealing: the tool needed for the fix was the
      thing that would not start. Recovery took a rollback, a CLI export, a hand edit, an
      import and a roll-forward. The rule's diagnosis was right; killing the process was not.
  - key: |
      Failing loudly and failing fatally are different things, and this codebase has been
      conflating them. The distinction to keep: a rule may REFUSE THE WORK it governs — a
      trigger that cannot park is not started, a run that would park without a park status
      fails with that reason — but it may not refuse the process. Blast radius is scoped to
      the unit that is actually broken.
  - key: |
      One producer, three readers. A finding carries the unit (subsystem, project, trigger),
      the field, a severity and an operator-language reason. Boot uses it to decide what to
      disable, the API answers "what is wrong with my installation", and the dashboard renders
      it. Today each of those is a separate half-solution: a throw, a log line, and nothing.
  - key: |
      The teeth are a composition test, not a convention. Prose in a coding-principles file
      would not have stopped p0391 — a spec sentence written by the same author who then wrote
      the throw. So: a test boots the server with the database down, with Redis down, and with
      a config that produces blocking findings, and asserts each time that it answers. A future
      throw in a startup path fails that test.
  - key: |
      Not in this phase: exposing the fields the findings point at in the Config Studio. That
      is p0392. Until it ships, a finding is readable over the API and fixable through
      `agentsmith config export/import`. This slice is complete without it — it ends the
      lockout, which is the urgent part.

steps:
  - id: finding-contract
    action: "A startup finding: unit (subsystem / project / trigger), field, severity (blocking | advisory) and an operator-language reason, plus the collection populated during composition and startup"
    new:
      - "StartupFinding record + StartupFindings collection in Contracts/Models/Configuration"
  - id: diagnostics-first
    action: "The web host and the diagnostics surface come up before and independently of every optional dependency; nothing after that point may throw out of Program.Main"
    modify:
      - "Program: dependency wiring moves behind probes; the host and diagnostics endpoints are unconditional"
  - id: dependencies-become-probes
    action: "Database, Redis, config load, config validation, migration state and the spawner each become a probe that records a finding when unavailable, and the subsystems depending on them stay down while the rest runs"
    modify:
      - "DB / Redis / spawner composition: probe + finding instead of an exception escaping startup"
      - "DbConfigurationLoader: a config that cannot be loaded is a finding, not a throw"
  - id: config-rules-return-findings
    action: "ClarificationParkStatusRule and the FailIfTerminalIsTrigger family record findings instead of throwing; the normalizer collects them and completes materialization"
    modify:
      - "ClarificationParkStatusRule: blocking finding for a parking preset without a park status"
      - "ProjectConfigNormalizer / RawConfigMaterializer: collect, never throw"
  - id: disable-the-unit
    action: "A blocking finding disables the narrowest unit that carries it — that trigger, not that project; that subsystem, not the process — logged at warning and present in the findings"
    modify:
      - "Discovery + webhook dispatch skip triggers carrying a blocking finding"
  - id: findings-surface
    action: "GET /api/config/findings plus a degraded banner in the dashboard naming what is down and why, so the state is visible without reading container logs"
    modify:
      - "ConfigStudioEndpoints: findings route"
      - "Dashboard: degraded banner driven by the findings"
  - id: runtime-enforcement
    action: "A run that would park on a trigger without a park status fails with that reason instead of parking into a status that re-claims it"
    modify:
      - "The park path: explicit failure carrying the finding's reason"
  - id: boot-under-failure-tests
    action: "Composition tests that boot with the database down, with Redis down, and with a blocking config finding, asserting the server answers and names the cause each time"
    new:
      - "StartupResilienceTests in the harness or the server test project"

tests:
  - "Startup_DatabaseUnreachable_ServerStartsAndReportsIt"
  - "Startup_RedisUnreachable_ServerStartsAndReportsIt"
  - "Startup_ConfigCannotBeLoaded_ServerStartsAndReportsIt"
  - "Startup_ParkingPresetWithoutStatus_ServerStartsAndDisablesOnlyThatTrigger"
  - "Startup_OtherProjects_KeepRunningWhenOneTriggerIsBlocked"
  - "Normalizer_ParkingPresetWithoutStatus_ReturnsBlockingFindingAndDoesNotThrow"
  - "Normalizer_TerminalStatusInsideTriggerStatuses_StillReturnsAFinding"
  - "FindingsEndpoint_ReturnsUnitFieldSeverityAndReason"
  - "Run_WouldParkWithoutStatus_FailsWithTheFindingReason"
  - "Config_FullyValid_ProducesNoFindings"

done:
  - "The configuration that refused to boot on 2026-07-31 starts: the offending trigger is disabled, every other trigger and project runs, and the reason names project, trigger and field"
  - "The server starts with the database unreachable and with Redis unreachable, and says so — the subsystems that need them stay down, the diagnostics surface does not"
  - "No startup path throws out of Program.Main for a dependency or configuration failure; the boot-under-failure tests fail if one is reintroduced"
  - "An operator can see what is wrong from the dashboard and the findings endpoint, without container logs"
  - "The defect p0391 was written against stays impossible: a run that would park without a park status fails loudly instead of parking into a re-claiming status"
  - "Full suite green"
